<script>
window.CHAPTER = {"code": "kech101", "chapterNumber": 1, "book_name": "Chemistry Part I", "title": "Some Basic Concepts of Chemistry", "subtitle": "Matter, measurement, laws of chemical combination, Dalton's atomic theory, atomic and molecular masses, the mole concept, empirical formulas, and stoichiometry.", "edition": "Reprint 2026-27", "source": "https://ncert.nic.in/textbook/pdf/kech101.pdf", "page_start": 1, "page_end": 28, "extraction": "PyMuPDF dict spans + 2x PNG zooms in extracted/zooms/. pdftotext not used.", "lessons": [{"id": "matter-classification", "nav": "Matter & its classification", "title": "From Rasayan Shastra to Modern Chemistry: States, Mixtures & Pure Substances", "deck": "Matter occupies space and has mass. Chemistry traces the transformations of matter from ancient Indian alchemical furnaces to atomic-scale classification.", "minutes": 8, "section": "1.1, 1.2", "pages": [1, 4], "print": "1–4", "sim": "matterstate", "simTitle": "States of Matter & Particulate Kinetic Simulator", "quick": ["<strong>Matter</strong> is anything that possesses mass and occupies space. In ancient India, chemistry flourished as <em>Rasayan Shastra</em>, <em>Rastantra</em>, and <em>Rasvidya</em>, with sophisticated metallurgical traditions seen in Mohenjodaro bronze casting and Acharya Kanāda's <em>Vaisheshika</em> philosophy postulating indestructible particles (<em>Parmanu</em>).", "At the macroscopic level, matter exists in three physical states: <strong>solid</strong> (definite shape and volume, rigid lattice), <strong>liquid</strong> (definite volume, indefinite shape, flowing molecules), and <strong>gas</strong> (neither definite shape nor volume, particles moving in random high-speed trajectories). These states are interconvertible by altering temperature and pressure.", "Chemically, matter divides into <strong>mixtures</strong> and <strong>pure substances</strong>. Mixtures contain two or more substances in variable proportions: <em>homogeneous</em> (uniform composition throughout, e.g. air, brass, sugar solution) or <em>heterogeneous</em> (non-uniform composition with phase boundaries, e.g. sand in water). Pure substances have fixed composition: <strong>elements</strong> (single type of atom) and <strong>compounds</strong> (two or more elements chemically combined in fixed ratios by mass, whose properties differ fundamentally from constituent elements)."], "formulas": [{"label": "State Interconversion", "html": "Solid ⇄ Liquid ⇄ Gas", "cond": "Driven by thermal energy (temperature) and intermolecular forces (pressure)"}, {"label": "Law of Chemical Identity", "html": "Compound: Fixed element mass ratio · Constituents lose original identity", "cond": "E.g. combustible H₂ + supporter of combustion O₂ forms fire-extinguisher H₂O"}], "deeper": "A fundamental concept often misunderstood by beginners is the distinction between a mixture and a compound. In a mixture of iron filings and sulphur powder, iron retains its magnetic properties and sulphur dissolves in carbon disulphide. Upon heating to initiate chemical combination into iron(II) sulphide (FeS), a compound is born: iron can no longer be extracted by a magnet, and the substance exhibits entirely new chemical characteristics.", "worked": "NCERT Classification Exercise: Classify the following as homogeneous mixture, heterogeneous mixture, element, or compound: (a) Copper wire (Element), (b) Table salt NaCl (Compound), (c) Filtered tea (Homogeneous mixture), (d) Churning curd/buttermilk (Heterogeneous mixture), (e) 22-carat gold alloyed with copper (Homogeneous solid solution).", "prediction": {"prompt": "If 100 mL of pure liquid water is mixed thoroughly with 100 mL of pure liquid ethanol at room temperature, what is the nature of the resulting liquid and its total final volume?", "options": ["A homogeneous mixture (solution); final volume is slightly less than 200 mL due to intermolecular hydrogen-bonding contraction.", "A chemical compound; final volume is exactly 200 mL.", "A heterogeneous mixture; final volume is strictly greater than 200 mL.", "A pure substance; volume cannot be measured."], "answer": 0, "explanation": "Ethanol and water mix uniformly in all proportions forming a homogeneous liquid solution. Because ethanol molecules nestle into the open hydrogen-bonded clusters of water molecules, the real volume contracts to ~193 mL."}, "connect": [["The Delhi Iron Pillar: Metallurgy of Ancient India", "The 7-metre tall rust-resistant iron pillar at Mehrauli, Delhi, erected during the Gupta period (c. 400 CE), demonstrates ancient Indian mastery of wrought iron forging with high phosphorus content that forms a protective passive layer (misawite)."], ["Wow — The 4th and 5th States of Matter", "Beyond solids, liquids, and gases, extreme thermal excitation produces Plasma (ionized gas making up 99% of visible matter in stars), while cooling bosons near absolute zero creates the Bose-Einstein Condensate (predicted by Satyendra Nath Bose and Albert Einstein)."]], "recall": "State the fundamental difference between a homogeneous mixture and a chemical compound in one concise sentence.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Which of the following is a pure substance rather than a mixture?", "options": ["Distilled water (pure H₂O)", "Atmospheric air", "Brass alloy", "Filtered tap water"], "answer": 0, "hint": "Look for a substance with fixed chemical composition that cannot be separated by physical methods.", "solution": "Distilled water consists entirely of H₂O molecules with fixed 2:1 hydrogen-to-oxygen atomic ratio.", "wrong": ["Air is a mixture of nitrogen, oxygen, argon, and CO₂.", "Brass is a solid mixture (alloy) of copper and zinc.", "Tap water contains dissolved mineral salts."]}, {"level": "Medium", "type": "mcq", "prompt": "When hydrogen gas (combustible) combines with oxygen gas (supports combustion) to form water, the product extinguishes flames. This illustrates that:", "options": ["A compound possesses properties completely different from its constituent elements", "Hydrogen loses mass during the reaction", "Water is a heterogeneous mixture of gaseous atoms", "Mass is not conserved in gas-phase reactions"], "answer": 0, "hint": "Consider the definition of a chemical compound.", "solution": "Constituent elements lose their original physical and chemical identities when chemically bonded into a new compound.", "wrong": ["Mass is strictly conserved.", "Water is a pure chemical compound, not a heterogeneous mixture.", "Mass conservation holds universally."]}, {"level": "Hard", "type": "mcq", "prompt": "Which ancient Indian philosophical school first systematically expounded that all material objects are composed of four types of indivisible atoms (Parmanu)?", "options": ["Vaisheshika school founded by Acharya Kanāda", "Samkhya school", "Yoga school of Patanjali", "Advaita Vedanta"], "answer": 0, "hint": "Refer to Section 1.1 Development of Chemistry in NCERT.", "solution": "Acharya Kanāda (c. 600 BCE) in Vaisheshika Sutras proposed that matter is composed of indestructible Parmanu associated with earth, water, fire, and air.", "wrong": ["Samkhya deals with cosmic duality (Purusha and Prakriti).", "Yoga deals with mental discipline.", "Vedanta is non-dual metaphysics."]}]}, {"id": "measurement-uncertainty-sigfigs", "nav": "Measurement, SI units & sig figs", "title": "The Language of Precision: SI Base Units, Scientific Notation & Significant Figures", "deck": "Every chemical law rests on quantitative measurement. Decoding prefixes, significant figures, and dimensional analysis prevents fatal arithmetic errors.", "minutes": 8, "section": "1.3, 1.4", "pages": [4, 9], "print": "4–9", "sim": "sigfiglab", "simTitle": "Analytical Balance, Precision Dartboard & Sig-Fig Engine", "quick": ["The <strong>International System of Units (SI)</strong> defines 7 base physical quantities: length (metre, m), mass (kilogram, kg), time (second, s), electric current (ampere, A), thermodynamic temperature (kelvin, K), amount of substance (mole, mol), and luminous intensity (candela, cd).", "<strong>Precision</strong> refers to the closeness of various measurements for the same quantity. <strong>Accuracy</strong> is the agreement of a particular value to the true value of the result. Measurements can be precise without being accurate if a systematic calibration bias exists.", "<strong>Significant figures</strong> are meaningful digits known with certainty plus one estimated or uncertain digit. Key rules: (1) All non-zero digits are significant; (2) Zeros preceding the first non-zero digit are NOT significant (e.g. 0.0025 has 2 sig figs); (3) Zeros between non-zero digits are significant (208 has 3); (4) Trailing zeros after a decimal point are significant (500.0 has 4); (5) In multiplication/division, the result cannot have more sig figs than the least precise measurement."], "formulas": [{"label": "Temperature Conversion", "html": "K = °C + 273.15 · °F = <span class=\"frac\"><span class=\"num\">9</span><span class=\"den\">5</span></span>(°C) + 32", "cond": "0 K (−273.15 °C) is absolute zero where molecular translational motion ceases"}, {"label": "Density Formula", "html": "Density = <span class=\"frac\"><span class=\"num\">Mass (kg)</span><span class=\"den\">Volume (m³)</span></span>", "cond": "SI unit: kg m⁻³; practical laboratory unit: g cm⁻³ or g mL⁻¹ (1 g cm⁻³ = 1000 kg m⁻³)"}], "deeper": "In the 2019 redefinition of SI units, the kilogram is no longer defined by the platinum-iridium cylinder stored at Sèvres, France. It is now defined by fixing the numerical value of the Planck constant h to exactly 6.62607015 × 10⁻³⁴ J s. Similarly, temperature is anchored to the Boltzmann constant k = 1.380649 × 10⁻²³ J K⁻¹.", "worked": "NCERT Table 1.4 & Student Weighing Analysis: True mass = 2.000 g. Student A measures 1.95 g and 1.93 g (Avg = 1.94 g) → Precise (spread = 0.02 g) but not accurate (error = 0.06 g). Student B measures 1.94 g and 2.05 g (Avg = 1.995 g) → Neither precise nor accurate (huge spread of 0.11 g). Student C measures 2.01 g and 1.99 g (Avg = 2.00 g) → Both precise and accurate!", "prediction": {"prompt": "Evaluate the arithmetic operation: 2.5 × 1.25. What is the mathematically correct value reported according to the rules of significant figures?", "options": ["3.1 (2 significant figures, limited by 2.5)", "3.125 (4 significant figures)", "3.13 (3 significant figures)", "3 (1 significant figure)"], "answer": 0, "explanation": "In multiplication, the result must be reported with no more significant figures than the measurement with the fewest significant figures. 2.5 has 2 sig figs, while 1.25 has 3. The raw product 3.125 rounds to 3.1 (2 sig figs)."}, "connect": [["The Mars Climate Orbiter Disaster (1999)", "NASA lost a $327 million spacecraft entering the Martian atmosphere because one software team used imperial units (pound-force seconds) while the ground navigation team expected metric SI units (Newton seconds). Dimensional analysis is a mission-critical skill!"], ["Wow — Femtosecond Laser Chemistry", "Using prefix femto (10⁻¹⁵ s), Ahmed Zewail was awarded the 1999 Nobel Prize for femtochemistry, capturing the transition states of chemical bonds breaking and forming in real-time snapshot bursts."]], "recall": "State the number of significant figures in: 0.0048, 208, and 500.0.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "How many significant figures are present in the measurement 0.0025 kg?", "options": ["2 significant figures", "4 significant figures", "5 significant figures", "3 significant figures"], "answer": 0, "hint": "Leading zeros before the first non-zero digit merely indicate the decimal point position.", "solution": "The leading zeros are not significant; only digits 2 and 5 count, giving 2 significant figures.", "wrong": ["Zeros before non-zero digits are never significant.", "There are only 2 significant digits.", "The zeros only locate the decimal point."]}, {"level": "Medium", "type": "number", "unit": "g cm-3", "tolerance": 0.01, "prompt": "Convert a liquid density of 13.6 g cm⁻³ into SI units (kg m⁻³):", "answer": 13600, "hint": "1 kg = 1000 g and 1 m³ = 10⁶ cm³. Multiply g/cm³ by 1000.", "solution": "13.6 g/cm³ × (1 kg / 1000 g) × (10⁶ cm³ / 1 m³) = 13,600 kg m⁻³."}, {"level": "Hard", "type": "mcq", "prompt": "When rounding off 0.04597 to three significant figures, the correct value is:", "options": ["0.0460", "0.0459", "0.046", "0.04597"], "answer": 0, "hint": "The fourth sig fig is 7 (greater than 5), which increments the 9 to 10, carrying over to the 5.", "solution": "Digits are 4, 5, 9, 7. 7 > 5, so 459 becomes 460. Hence 0.0460 (has 3 significant figures: 4, 6, 0).", "wrong": ["0.0459 truncates without rounding.", "0.046 has only 2 significant figures.", "0.04597 has 4 significant figures."]}]}, {"id": "chemical-combination-laws", "nav": "Laws of chemical combination", "title": "The Five Foundation Laws: Mass Conservation, Definite & Multiple Proportions, Gay-Lussac & Avogadro", "deck": "Chemistry transformed from alchemy into exact science through five quantitative laws governing how atoms combine in whole-number proportions.", "minutes": 9, "section": "1.5", "pages": [9, 13], "print": "9–13", "sim": "reactionlaws", "simTitle": "Proust-Dalton Chemical Combining Laws Simulator", "quick": ["<strong>1. Law of Conservation of Mass (Lavoisier, 1789)</strong>: In all physical and chemical changes, the total mass of the products equals the total mass of the reactants. Matter can neither be created nor destroyed.", "<strong>2. Law of Definite Proportions (Proust, 1799)</strong>: A given compound always contains exactly the same proportion of elements by weight, irrespective of its source or method of preparation. Natural copper carbonate and synthetic copper carbonate both contain 51.35% Cu, 9.74% C, and 38.91% O.", "<strong>3. Law of Multiple Proportions (Dalton, 1803)</strong>: If two elements combine to form more than one compound, the masses of one element that combine with a fixed mass of the other are in the ratio of small whole numbers (e.g. H₂O vs H₂O₂, where 2 g H combines with 16 g and 32 g O in a 1:2 ratio).", "<strong>4. Gay-Lussac’s Law of Gaseous Volumes (1808)</strong>: When gases react together, they do so in volumes which bear a simple whole-number ratio to one another and to the volume of the products (if gaseous), provided all gases are at the same temperature and pressure.", "<strong>5. Avogadro’s Law (1811)</strong>: Equal volumes of all gases under the same conditions of temperature and pressure contain equal numbers of molecules. Avogadro made the crucial distinction between elementary atoms and polyatomic molecules (e.g. diatomic H₂ and O₂)."], "formulas": [{"label": "Definite Proportions", "html": "<span class=\"frac\"><span class=\"num\">Mass of Element A</span><span class=\"den\">Mass of Element B</span></span> = Constant", "cond": "Valid for all stoichiometric chemical compounds regardless of synthetic route"}, {"label": "Multiple Proportions", "html": "<span class=\"frac\"><span class=\"num\">m₂(Element B)</span><span class=\"den\">m₁(Element B)</span></span> = <span class=\"frac\"><span class=\"num\">p</span><span class=\"den\">q</span></span>", "cond": "For fixed mass of element A; p and q are small integers (e.g. 1:2, 2:3, 1:4)"}, {"label": "Avogadro Principle", "html": "V ∝ n &nbsp; (at constant T and P)", "cond": "Equal volume of any ideal gas contains equal number of molecules"}], "deeper": "Gay-Lussac's law could not be explained by Dalton because Dalton believed atoms of the same element could not combine with each other (he rejected diatomic molecules like H₂ or O₂). Avogadro resolved this deadlock in 1811 by showing that two volumes of hydrogen gas (2 molecules of H₂) combine with one volume of oxygen gas (1 molecule of O₂) to yield two volumes of water vapour (2 molecules of H₂O), requiring half-molecules of oxygen in the reaction without splitting fundamental atoms.", "worked": "NCERT Exercise 1.21 Verification: Nitrogen and Oxygen combine to form four oxides with fixed 14 g Nitrogen reacting with: (i) 16 g O (NO), (ii) 32 g O (NO₂), (iii) 16 g O (from 28g N + 32g O in N₂O, so for 14g N it is 16g O), (iv) 40 g O (from 28g N + 80g O in N₂O₅, so for 14g N it is 40g O). The masses of oxygen combining with 14 g N are 16 g, 32 g, 16 g, 40 g → Ratio = 2 : 4 : 2 : 5. These are small whole numbers, proving the Law of Multiple Proportions!", "prediction": {"prompt": "According to Gay-Lussac's Law, if 10 volumes of dihydrogen gas react completely with 5 volumes of dioxygen gas at constant temperature and pressure, how many volumes of water vapour are produced?", "options": ["10 volumes of water vapour", "15 volumes of water vapour", "5 volumes of water vapour", "20 volumes of water vapour"], "answer": 0, "explanation": "From 2H₂(g) + O₂(g) → 2H₂O(g), the volume ratio is 2 : 1 : 2. Therefore, 10 volumes of H₂ react with 5 volumes of O₂ to produce exactly 10 volumes of H₂O vapour."}, "connect": [["Berzelius and the Atomic Symbol Revolution", "Swedish chemist Jöns Jacob Berzelius tested the laws of definite proportions on over 2,000 compounds, inventing our modern chemical symbols (H, O, Fe, Cu) to replace cumbersome alchemical icons."], ["Wow — Non-Stoichiometric Berthollide Compounds", "While Proust's law holds for typical molecular compounds, transition metal oxides (like Fe₀.₉₅O, wüstite) have crystal lattice vacancies with variable non-stoichiometric composition, named 'Berthollides' after Claude Berthollet who debated Proust!"]], "recall": "State the Law of Multiple Proportions in one sentence, giving the classic H₂O vs H₂O₂ example.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Which law states that equal volumes of all gases at identical temperature and pressure contain identical numbers of molecules?", "options": ["Avogadro’s Law", "Gay-Lussac’s Law", "Boyle’s Law", "Law of Definite Proportions"], "answer": 0, "hint": "Proposed in 1811 to reconcile Gay-Lussac's volume ratios with Dalton's atomic theory.", "solution": "Avogadro's hypothesis (1811) equates equal gas volumes to equal numbers of molecules.", "wrong": ["Gay-Lussac deals with whole-number volume ratios of reacting gases.", "Boyle relates pressure and volume for a fixed mass of gas.", "Definite proportions relates masses in a compound."]}, {"level": "Medium", "type": "mcq", "prompt": "Carbon forms two oxides: Carbon monoxide (42.9% C, 57.1% O) and Carbon dioxide (27.3% C, 72.7% O). For 1 g of Carbon, the masses of Oxygen are 1.33 g and 2.66 g. The ratio 1.33 : 2.66 = 1 : 2 illustrates:", "options": ["Law of Multiple Proportions", "Law of Conservation of Mass", "Law of Reciprocal Proportions", "Gay-Lussac's Law"], "answer": 0, "hint": "Two different compounds formed by the same two elements with a small whole-number oxygen ratio.", "solution": "The ratio of oxygen masses combining with a fixed mass of carbon is 1 : 2, an exact demonstration of Dalton's Law of Multiple Proportions.", "wrong": ["Conservation of mass tracks total mass before and after a reaction.", "Reciprocal proportions involves three elements.", "Gay-Lussac deals with gas volumes."]}, {"level": "Hard", "type": "mcq", "prompt": "Why was Dalton unable to deduce the correct formula of water (he wrote it as HO rather than H₂O)?", "options": ["Dalton assumed the rule of greatest simplicity (1:1 combination) and rejected diatomic elemental molecules like H₂ and O₂", "Dalton did not believe in atoms", "Dalton's balance was too inaccurate to weigh gases", "Dalton believed water was an element"], "answer": 0, "hint": "Dalton held that like atoms repel, so atoms of the same element could not bind together.", "solution": "Dalton dogmatically assumed that when only one compound of two elements was known, it must be binary (A + B → AB), rejecting diatomic molecules.", "wrong": ["Dalton founded atomic theory.", "Dalton used quantitative data from Cavendish and Lavoisier.", "Dalton knew water was a compound."]}]}, {"id": "atomic-molecular-masses", "nav": "Atomic, molecular & formula mass", "title": "Weighing the Invisible: Unified Atomic Mass Unit, Isotopes & Formula Mass", "deck": "Because single atoms weigh less than 10⁻²² grams, chemists anchored atomic masses to Carbon-12 and weighted isotopic averages.", "minutes": 8, "section": "1.6, 1.7", "pages": [13, 16], "print": "13–16", "sim": "atomicmass", "simTitle": "Isotopic Mass Spectrometer & Atomic Mass Weigher", "quick": ["<strong>Dalton's Atomic Theory (1808)</strong> postulated: (1) Matter consists of indivisible atoms; (2) All atoms of a given element have identical mass and properties; (3) Compounds form when atoms of different elements combine in fixed ratios; (4) Chemical reactions involve reorganization of atoms, not creation or destruction.", "By international agreement (1961), the <strong>unified atomic mass unit (u)</strong> is defined as exactly <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">12</span></span>th of the mass of one Carbon-12 (¹²C) atom. 1 u = 1.66056 × 10⁻²⁴ g (or 1.66056 × 10⁻²⁷ kg).", "Most elements exist as mixtures of isotopes. The <strong>average atomic mass</strong> is the sum of the products of each isotope's mass and its fractional abundance: $\\bar{A} = \\sum (f_i \\times m_i)$. For Chlorine, 75.77% ³⁵Cl (34.9689 u) and 24.23% ³⁷Cl (36.9659 u) give 35.453 u.", "<strong>Molecular mass</strong> is the sum of atomic masses of the elements present in a molecule (e.g. Glucose C₆H₁₂O₆ = 6(12.011) + 12(1.008) + 6(16.00) = 180.16 u). For ionic compounds like NaCl where discrete molecules do not exist in the 3D crystal lattice, we calculate <strong>formula mass</strong>: 23.0 + 35.5 = 58.5 u."], "formulas": [{"label": "Unified Atomic Mass Unit", "html": "1 u = <span class=\"frac\"><span class=\"num\">Mass of one ¹²C atom</span><span class=\"den\">12</span></span> = 1.66056 × 10⁻²⁴ g", "cond": "Exact definition standard since 1961; 1 u ≈ mass of 1 proton or 1 neutron"}, {"label": "Average Isotopic Atomic Mass", "html": "A<sub>avg</sub> = <span class=\"frac\"><span class=\"num\">∑ (% Abundance<sub>i</sub> × Molar Mass<sub>i</sub>)</span><span class=\"den\">100</span></span>", "cond": "Weighted arithmetic mean based on natural terrestrial isotopic abundance"}], "deeper": "Why do we use formula mass instead of molecular mass for sodium chloride? In solid NaCl, each Na⁺ cation is surrounded octahedrally by 6 Cl⁻ anions, and each Cl⁻ is surrounded by 6 Na⁺ cations in an infinite face-centred cubic lattice. There is no isolated 'NaCl' molecule floating in the crystal. Therefore, the formula mass represents the ratio of the formula unit.", "worked": "NCERT Exercise 1.9 Chlorine Isotopic Mass: ³⁵Cl has abundance 75.77% and mass 34.9689 u; ³⁷Cl has abundance 24.23% and mass 36.9659 u. Average atomic mass = (0.7577 × 34.9689) + (0.2423 × 36.9659) = 26.4959 + 8.9568 = 35.4527 u ≈ 35.453 u.", "prediction": {"prompt": "Naturally occurring carbon consists of 98.892% ¹²C (exactly 12 u), 1.108% ¹³C (13.00335 u), and traces of ¹⁴C. Will the average atomic mass of terrestrial carbon be strictly 12.000 u or slightly greater?", "options": ["Slightly greater than 12.000 u (≈ 12.011 u) due to the presence of heavier ¹³C and ¹⁴C isotopes.", "Strictly 12.000 u by definition.", "Slightly less than 12.000 u due to nuclear binding energy loss.", "Cannot be determined without a mass spectrometer."], "answer": 0, "explanation": "While ¹²C is exactly 12 u by definition, natural carbon includes 1.108% of ¹³C, pulling the weighted average upward to 12.011 u."}, "connect": [["Radiocarbon Dating and Archaeological Chronology", "Cosmic rays strike atmospheric nitrogen producing radioactive Carbon-14 (t₁/₂ = 5,730 years). Living organisms maintain equilibrium with atmospheric ¹⁴C/¹²C ratio, but upon death, decay begins, allowing archaeologists to date Indus Valley organic artifacts!"], ["Wow — Mass Spectrometry in Doping Control", "Modern isotope-ratio mass spectrometers (IRMS) can detect variations of 0.001 u, determining whether synthetic testosterone injected by an athlete has a different ¹³C/¹²C ratio than naturally synthesized human testosterone!"]], "recall": "Define 1 unified atomic mass unit (u) and write its value in grams.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "One unified atomic mass unit (1 u) is defined as exactly:", "options": ["1/12th the mass of one Carbon-12 atom", "The mass of one Hydrogen-1 atom", "1/16th the mass of one Oxygen-16 atom", "The mass of one free neutron"], "answer": 0, "hint": "Carbon-12 was adopted as the universal reference standard in 1961.", "solution": "1 u is defined as 1/12th of the mass of a single unbound ground-state ¹²C atom (1.66056 × 10⁻²⁴ g).", "wrong": ["Hydrogen-1 was the 19th-century standard.", "Oxygen-16 was the standard until 1961.", "Neutron mass is ~1.00866 u."]}, {"level": "Medium", "type": "number", "unit": "g mol-1", "tolerance": 0.05, "prompt": "Calculate the average atomic mass of Argon from its natural isotopic abundances: ³⁶Ar (35.968 u, 0.337%), ³⁸Ar (37.963 u, 0.063%), ⁴⁰Ar (39.962 u, 99.600%):", "answer": 39.95, "hint": "Multiply each mass by its percentage abundance, sum them, and divide by 100.", "solution": "(35.968 × 0.337 + 37.963 × 0.063 + 39.962 × 99.600) / 100 = 39.948 u ≈ 39.95 u."}, {"level": "Hard", "type": "mcq", "prompt": "Why is the term 'formula mass' preferred over 'molecular mass' for crystalline sodium chloride (NaCl)?", "options": ["NaCl forms a 3D continuous ionic network with no discrete, isolated NaCl molecules in the solid state", "Sodium chloride has variable stoichiometry", "Ionic bonds are weaker than covalent bonds", "Chlorine has fractional atomic mass"], "answer": 0, "hint": "Examine the microscopic arrangement in a crystal lattice.", "solution": "In NaCl crystals, every Na⁺ is surrounded by 6 Cl⁻ in a continuous lattice. The formula NaCl represents the simplest formula unit, not an isolated molecule.", "wrong": ["NaCl has strict 1:1 stoichiometry.", "Ionic lattices have high lattice enthalpy.", "Fractional mass applies to all isotopic elements."]}]}, {"id": "the-mole-concept", "nav": "The mole concept & molar mass", "title": "The Chemist's Dozen: Avogadro's Number, Molar Mass & Gas Molar Volume", "deck": "The mole bridges the microscopic world of single atoms with the macroscopic world of laboratory grams and litres.", "minutes": 9, "section": "1.8", "pages": [16, 18], "print": "16–18", "sim": "moleconverter", "simTitle": "Interactive 4-Way Mole Bridge: Mass, Moles, Particles & Gas Volume", "quick": ["One <strong>mole</strong> is the amount of substance that contains exactly <strong>6.02214076 × 10²³</strong> elementary entities (atoms, molecules, ions, or electrons). This fixed numerical value is the <strong>Avogadro constant (N_A)</strong>.", "The mass of one mole of a substance in grams is called its <strong>molar mass</strong> (SI unit: kg mol⁻¹, laboratory unit: g mol⁻¹). Molar mass in g mol⁻¹ is numerically identical to the atomic, molecular, or formula mass in unified atomic mass units (u). E.g., one H₂O molecule has mass 18.02 u; one mole of H₂O has mass 18.02 g.", "<strong>Molar volume of an ideal gas</strong>: At Standard Temperature and Pressure (STP: 0 °C = 273.15 K and 1 bar = 10⁵ Pa), one mole of any ideal gas occupies <strong>22.71 L</strong> (or 22.4 L at 1 atm = 101.325 kPa).", "The <strong>Universal Mole Bridge</strong> links four domains: (1) Mass = Moles × Molar Mass; (2) Entities = Moles × N_A; (3) STP Gas Volume = Moles × 22.7 L."], "formulas": [{"label": "Mole–Mass Relation", "html": "n = <span class=\"frac\"><span class=\"num\">m (grams)</span><span class=\"den\">M (g mol⁻¹)</span></span>", "cond": "Core laboratory conversion: weighing on a balance gives the number of reacting moles"}, {"label": "Mole–Particle Relation", "html": "N = n × N<sub>A</sub> = n × 6.022 × 10²³", "cond": "Gives exact count of atoms, molecules, or ions in the sample"}, {"label": "Molar Gas Volume", "html": "V<sub>STP</sub> = n × 22.71 L mol⁻¹", "cond": "Applies strictly to gaseous substances at STP (273.15 K and 1 bar)"}], "deeper": "How huge is Avogadro's number? If you had 6.022 × 10²³ standard marble beads, they would cover the entire surface of the Earth to a depth of several kilometres! Yet, because water molecules are so extraordinarily minute, 6.022 × 10²³ water molecules fit comfortably in a single sip of water (~18 mL).", "worked": "NCERT Exercise 1.10 Calculation in 3 moles of Ethane (C₂H₆): (i) Moles of carbon atoms = 3 × 2 = 6 moles of C. (ii) Moles of hydrogen atoms = 3 × 6 = 18 moles of H. (iii) Number of molecules of ethane = 3 × 6.022 × 10²³ = 1.807 × 10²⁴ molecules.", "prediction": {"prompt": "Which of the following 1-gram metal samples contains the largest number of atoms: 1 g of Lithium (Li, 6.94 g/mol) or 1 g of Gold (Au, 197 g/mol)?", "options": ["1 g of Lithium, because its lighter atomic mass means more atoms are needed to make up 1 gram (0.144 mol vs 0.005 mol).", "1 g of Gold, because gold has a much higher density and atomic number.", "Both contain identical numbers of atoms because both weigh exactly 1 gram.", "1 g of Gold, because heavier elements have larger Avogadro numbers."], "answer": 0, "explanation": "Number of atoms N = (m / M) × N_A. For 1 g Li: N = (1 / 6.94) × N_A = 0.144 N_A atoms. For 1 g Au: N = (1 / 197) × N_A = 0.005 N_A atoms. Lithium contains ~28 times more atoms!"}, "connect": [["Avogadro and Cannizzaro at the Karlsruhe Congress (1860)", "Amedeo Avogadro published his hypothesis in 1811, but it was largely ignored until Stanislao Cannizzaro distributed a pamphlet at the historic 1860 Karlsruhe Congress, sparking modern atomic chemistry and enabling Mendeleev to construct the Periodic Table."], ["Wow — Silicon-28 Spheres and the Redefined Kilogram", "To redefine the kilogram in 2019 without physical artifacts, international scientists counted the exact number of atoms in a nearly perfect single-crystal sphere of Silicon-28 using X-ray interferometry!"]], "recall": "Write down the three fundamental equations of the mole bridge connecting mass, particle count, and STP gas volume.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "What is the mass of exactly 1 mole of water (H₂O) molecules?", "options": ["18.02 g", "1.008 g", "32.00 g", "6.022 × 10²³ g"], "answer": 0, "hint": "Sum the atomic molar masses: 2 × H (1.008) + 1 × O (16.00).", "solution": "Molar mass of H₂O = 2(1.008) + 16.00 = 18.016 g mol⁻¹ ≈ 18.02 g.", "wrong": ["1.008 g is only one mole of hydrogen atoms.", "32.00 g is one mole of oxygen gas O₂.", "6.022 × 10²³ is the particle count, not the mass in grams."]}, {"level": "Medium", "type": "number", "unit": "g", "tolerance": 0.05, "prompt": "What is the mass in grams of one single Carbon-12 atom (¹²C)? Enter in scientific notation mantissa for 10⁻²³ g (e.g. for 1.99 × 10⁻²³, enter 1.99):", "answer": 1.99, "hint": "Divide the molar mass of Carbon-12 (12.00 g) by the Avogadro constant (6.022 × 10²³).", "solution": "12.00 g / 6.02214 × 10²³ = 1.9926 × 10⁻²³ g."}, {"level": "Hard", "type": "mcq", "prompt": "NCERT Ex 1.33: Compare the number of atoms in (I) 52 moles of Ar, (II) 52 u of He, and (III) 52 g of He. Which list of particle counts is correct?", "options": ["(I) 3.13 × 10²⁵ atoms; (II) 13 atoms; (III) 7.83 × 10²⁴ atoms", "(I) 52 atoms; (II) 52 atoms; (III) 52 atoms", "(I) 13 atoms; (II) 3.13 × 10²⁵ atoms; (III) 13 atoms", "(I) 3.13 × 10²⁵ atoms; (II) 52 atoms; (III) 1.30 × 10²⁴ atoms"], "answer": 0, "hint": "52 mol Ar has 52 × N_A atoms. 52 u He has 52/4 = 13 atoms. 52 g He has (52/4) × N_A = 13 × N_A atoms.", "solution": "(I) 52 × 6.022 × 10²³ = 3.131 × 10²⁵ atoms. (II) 1 He atom = 4 u, so 52 u / 4 u = 13 atoms. (III) Moles He = 52/4 = 13 mol → 13 × 6.022 × 10²³ = 7.829 × 10²⁴ atoms.", "wrong": ["52 moles contains billions of trillions of atoms, not 52.", "The units moles, u, and grams have radically different scales.", "Option IV calculates incorrect helium atom counts."]}]}, {"id": "empirical-molecular-formula", "nav": "Percentage composition & formulas", "title": "Cracking Chemical Formulas: Elemental Mass %, Empirical Ratios & Molecular Structure", "deck": "By measuring the percentage mass of each element in a newly synthesized drug or mineral, chemists systematically deduce its true molecular formula.", "minutes": 8, "section": "1.9", "pages": [18, 20], "print": "18–20", "sim": "formulalab", "simTitle": "Elemental Percentage & Combustion Analysis Workbench", "quick": ["The <strong>mass per cent</strong> of an element in a compound is: $\\text{Mass } \\% = \\frac{\\text{Mass of element in 1 mol of compound}}{\\text{Molar mass of compound}} \\times 100\\%$. E.g. in water (H₂O, 18.02 g/mol): H = $\\frac{2.016}{18.02} \\times 100 = 11.18\\%$; O = $\\frac{16.00}{18.02} \\times 100 = 88.79\\%$.", "The <strong>empirical formula</strong> represents the simplest whole-number ratio of various atoms present in a compound. The <strong>molecular formula</strong> shows the exact number of different types of atoms present in a molecule.", "<strong>Five-Step Deduction Method</strong>:<br>1. Assume 100 g sample (mass of each element = mass % in grams).<br>2. Convert grams to moles: $n_i = \\frac{\\text{mass}_i}{\\text{atomic mass}_i}$.<br>3. Divide each mole value by the smallest mole value to obtain simplest atomic ratio.<br>4. If fractional (e.g. 1 : 1.5), multiply by an integer (2) to get whole numbers (2 : 3).<br>5. Calculate $n = \\frac{\\text{Molar Mass}}{\\text{Empirical Formula Mass}}$. Then: $\\text{Molecular Formula} = (\\text{Empirical Formula})_n$."], "formulas": [{"label": "Mass Percentage", "html": "Mass % = <span class=\"frac\"><span class=\"num\">Mass of that element in 1 mol</span><span class=\"den\">Molar mass of compound</span></span> × 100", "cond": "Sum of mass percentages of all elements in a compound must equal 100.0%"}, {"label": "Molecular Multiplier", "html": "n = <span class=\"frac\"><span class=\"num\">Experimental Molar Mass</span><span class=\"den\">Empirical Formula Mass</span></span>", "cond": "Molecular Formula = (Empirical Formula)ₙ where n is an integer (1, 2, 3, ...)"}], "deeper": "Compounds with identical empirical formulas can have radically different physical, chemical, and biological properties. Acetylene (C₂H₂, a combustible gas used in welding) and Benzene (C₆H₆, a carcinogenic liquid solvent) both share the identical empirical formula CH (92.3% C, 7.7% H). Their molecular multipliers n = 2 and n = 6 dictate completely different chemical reactivity.", "worked": "NCERT Example 1.2 & Exercise 1.3: An iron oxide has 69.9% iron and 30.1% oxygen by mass. Step 1: In 100 g, Fe = 69.9 g, O = 30.1 g. Step 2: Moles Fe = 69.9 / 55.85 = 1.25 mol; Moles O = 30.1 / 16.00 = 1.88 mol. Step 3: Divide by smallest (1.25): Fe = 1.00; O = 1.88 / 1.25 = 1.50. Step 4: Multiply by 2: Fe = 2, O = 3. Empirical formula is Fe₂O₃. Given molar mass = 159.69 g/mol, empirical mass = 2(55.85) + 3(16.00) = 159.7 g/mol. n = 159.69 / 159.7 = 1. Molecular formula is Fe₂O₃ (rust / hematite).", "prediction": {"prompt": "A hydrocarbon contains 85.7% Carbon and 14.3% Hydrogen by mass. Its experimental molar mass is 56 g/mol. What are its empirical formula and molecular formula?", "options": ["Empirical: CH₂; Molecular: C₄H₈ (butene)", "Empirical: CH; Molecular: C₆H₆ (benzene)", "Empirical: CH₃; Molecular: C₂H₆ (ethane)", "Empirical: C₂H₅; Molecular: C₄H₁₀ (butane)"], "answer": 0, "explanation": "Moles C = 85.7 / 12 = 7.14; Moles H = 14.3 / 1 = 14.3. Ratio = 1 : 2 → Empirical formula is CH₂ (formula mass = 14 g/mol). Multiplier n = 56 / 14 = 4. Molecular formula is C₄H₈."}, "connect": [["Forensic Toxicology & Mass Spectrometry", "When analyzing an unknown poison or trace narcotic, forensic chemists use combustion analysis coupled with high-resolution mass spectrometry to determine elemental percentage and exact isotopic parent molecular mass within minutes."], ["Wow — DNA's Empirical Formula", "Deoxyribonucleic acid nucleotides follow strict elemental percentage composition. Watson and Crick used the empirical base ratios discovered by Erwin Chargaff (%A = %T and %G = %C) to crack the double-helix structure!"]], "recall": "State the five steps to determine a molecular formula from experimental elemental mass percentages.", "quizzes": [{"level": "Easy", "type": "number", "unit": "%", "tolerance": 0.2, "prompt": "NCERT Ex 1.2: Calculate the mass per cent of Sodium (Na) in Sodium Sulphate (Na₂SO₄). (Molar mass Na₂SO₄ = 142.04 g mol⁻¹, Na = 22.99 g mol⁻¹):", "answer": 32.37, "hint": "Mass % = [2 × 22.99 / 142.04] × 100.", "solution": "Mass % Na = (45.98 / 142.04) × 100 = 32.37%."}, {"level": "Medium", "type": "mcq", "prompt": "A compound has the empirical formula CH₂O and a molar mass of 180.16 g mol⁻¹. Its molecular formula is:", "options": ["C₆H₁₂O₆ (Glucose)", "C₃H₆O₃ (Lactic acid)", "C₂H₄O₂ (Acetic acid)", "CH₂O (Formaldehyde)"], "answer": 0, "hint": "Empirical formula mass of CH₂O = 12.01 + 2(1.008) + 16.00 = 30.03 g/mol. Divide 180.16 by 30.03.", "solution": "n = 180.16 / 30.03 = 6. Molecular formula = (CH₂O)₆ = C₆H₁₂O₆.", "wrong": ["C₃H₆O₃ has molar mass 90 g/mol.", "C₂H₄O₂ has molar mass 60 g/mol.", "Formaldehyde has molar mass 30 g/mol."]}, {"level": "Hard", "type": "mcq", "prompt": "NCERT Ex 1.34: A welding fuel gas containing only C and H gives 3.38 g CO₂ and 0.690 g H₂O on combustion. A 10.0 L sample at STP weighs 11.6 g. The empirical formula, molar mass, and molecular formula are:", "options": ["Empirical: CH; Molar mass: 26.0 g mol⁻¹; Molecular: C₂H₂ (Acetylene)", "Empirical: CH₂; Molar mass: 28.0 g mol⁻¹; Molecular: C₂H₄ (Ethylene)", "Empirical: CH; Molar mass: 78.0 g mol⁻¹; Molecular: C₆H₆ (Benzene)", "Empirical: CH₄; Molar mass: 16.0 g mol⁻¹; Molecular: CH₄ (Methane)"], "answer": 0, "hint": "Moles C = 3.38/44 = 0.0768. Moles H = 2 × (0.690/18) = 0.0767. Ratio 1:1 → CH. Molar mass = (11.6 g / 10.0 L) × 22.4 L/mol = 26.0 g/mol. n = 26/13 = 2 → C₂H₂.", "solution": "Carbon mass = 3.38 × 12/44 = 0.9218 g. Hydrogen mass = 0.690 × 2/18 = 0.0767 g. Moles C = 0.0768; Moles H = 0.0767 → 1:1 ratio → Empirical CH (13 g/mol). At STP, 10 L = 11.6 g ⇒ 22.4 L = 26.0 g mol⁻¹. n = 26/13 = 2 ⇒ C₂H₂.", "wrong": ["Ethylene would give higher H₂O mass.", "Benzene is a liquid at STP, not a welding gas occupying 10 L per 11.6 g.", "Methane has 1:4 ratio."]}]}, {"id": "stoichiometry-solutions", "nav": "Stoichiometry & solution concentrations", "title": "The Law of the Recipe: Balancing Equations, Limiting Reagents & Solution Concentrations", "deck": "Chemical reactions obey strict quantitative stoichiometry. Master the limiting reagent principle and solution concentration metrics: Molarity, Molality, and Mole Fraction.", "minutes": 9, "section": "1.10", "pages": [20, 25], "print": "20–25", "sim": "stoichiometrylab", "simTitle": "Stoichiometric Reaction Chamber & Solution Concentration Lab", "quick": ["<strong>Stoichiometry</strong> (from Greek <em>stoicheion</em> element and <em>metron</em> measure) deals with calculations of masses (and volumes) of reactants and products in balanced chemical equations. In $N_2(g) + 3H_2(g) \\rightarrow 2NH_3(g)$, 1 mole of N₂ reacts with 3 moles of H₂ to produce 2 moles of NH₃.", "The <strong>Limiting Reagent</strong> is the reactant that is entirely consumed first in a reaction. It limits the amount of product formed because the reaction stops the moment it runs out. Any other reactant present in excess remains unreacted.", "<strong>Expressing Solution Concentrations</strong>:<br>1. <strong>Mass Per Cent (w/w)</strong> = $\\frac{\\text{Mass of solute}}{\\text{Mass of solution}} \\times 100$.<br>2. <strong>Mole Fraction ($x_A$)</strong> = $\\frac{n_A}{n_A + n_B}$. (Dimensionless; $\\sum x_i = 1$).<br>3. <strong>Molarity ($M$)</strong> = $\\frac{\\text{Moles of solute}}{\\text{Volume of solution in litres}}$ (mol L⁻¹). <em>Note: Molarity depends on temperature</em> because liquids expand or contract with thermal change.<br>4. <strong>Molality ($m$)</strong> = $\\frac{\\text{Moles of solute}}{\\text{Mass of solvent in kilograms}}$ (mol kg⁻¹). <em>Temperature independent</em> because mass does not change with temperature."], "formulas": [{"label": "Molarity (M)", "html": "M = <span class=\"frac\"><span class=\"num\">n<sub>solute</sub></span><span class=\"den\">V<sub>solution</sub> (L)</span></span> = <span class=\"frac\"><span class=\"num\">w<sub>B</sub> × 1000</span><span class=\"den\">M<sub>B</sub> × V<sub>mL</sub></span></span>", "cond": "Unit: mol L⁻¹ or M; decreases slightly as temperature rises due to thermal expansion"}, {"label": "Molality (m)", "html": "m = <span class=\"frac\"><span class=\"num\">n<sub>solute</sub></span><span class=\"den\">w<sub>solvent</sub> (kg)</span></span> = <span class=\"frac\"><span class=\"num\">w<sub>B</sub> × 1000</span><span class=\"den\">M<sub>B</sub> × w<sub>A</sub> (g)</span></span>", "cond": "Unit: mol kg⁻¹ or m; strictly temperature-invariant"}, {"label": "Dilution Law", "html": "M₁V₁ = M₂V₂", "cond": "Moles of solute remain identical before and after adding pure solvent"}], "deeper": "Why do analytical chemists prefer molality (m) over molarity (M) in precision physical chemistry? In studies of colligative properties (such as boiling point elevation or freezing point depression), experiments span wide temperature ranges. A 1.000 M solution prepared at 20 °C will have its volume expand at 80 °C, dropping its molarity to ~0.97 M without losing a single molecule of solute. Molality measures mass of solvent, remaining perfectly invariant.", "worked": "NCERT Exercise 1.24 Limiting Reagent in Haber Process: 2.00 × 10³ g (2.00 kg) N₂ reacts with 1.00 × 10³ g (1.00 kg) H₂. Step 1: Moles N₂ = 2000 / 28.02 = 71.38 mol; Moles H₂ = 1000 / 2.016 = 496.0 mol. Step 2: From N₂ + 3H₂ → 2NH₃, 71.38 mol N₂ requires 3 × 71.38 = 214.1 mol H₂. Because 496.0 mol H₂ is available, N₂ is the limiting reagent and H₂ is in excess! Step 3: Moles NH₃ formed = 2 × 71.38 = 142.76 mol. Mass NH₃ = 142.76 × 17.03 = 2431 g (2.43 kg). Unreacted H₂ = (496.0 − 214.1) × 2.016 = 568 g (0.568 kg).", "prediction": {"prompt": "How are 0.50 mol Na₂CO₃ and 0.50 M Na₂CO₃ fundamentally different?", "options": ["0.50 mol is an absolute mass of pure salt (53.0 g), whereas 0.50 M is a concentration (0.50 moles dissolved per litre of solution).", "0.50 mol is a concentration, whereas 0.50 M is a mass in grams.", "They are identical quantities written in different notations.", "0.50 M refers to solid powder while 0.50 mol refers to gas phase."], "answer": 0, "explanation": "Mole (mol) is an amount of substance (0.50 mol × 106 g/mol = 53 g Na₂CO₃). Molar (M) is molarity: 0.50 moles of Na₂CO₃ dissolved in enough solvent to form exactly 1.0 L of solution."}, "connect": [["Industrial Haber-Bosch Ammonia Synthesis", "The Haber-Bosch process synthesizes over 150 million tonnes of ammonia annually for fertilizers that feed nearly half the global human population. Calculating exact stoichiometric gas ratios and limiting reagents prevents catastrophic catalyst poisoning and energy wastage."], ["Wow — Intravenous Saline and Osmotic Balance", "Medical IV bags are calibrated to 0.9% (w/v) NaCl (approx 0.154 M), matching the exact osmolarity of human blood plasma (approx 300 mOsm/L). Infusing pure water would cause red blood cells to swell and burst (lysis), while hypertonic saline would dehydrate and shrivel them (crenation)!"]], "recall": "State the difference between molarity and molality, and explain why molality is preferred for temperature-dependent studies.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Which of the following concentration units changes when the temperature of the solution changes?", "options": ["Molarity (mol L⁻¹)", "Molality (mol kg⁻¹)", "Mole fraction", "Mass per cent (w/w)"], "answer": 0, "hint": "Look for the concentration term that involves volume of solution.", "solution": "Molarity depends on the volume of the solution, which expands or contracts with temperature changes. Mass-based units (molality, mole fraction, mass %) are independent of temperature.", "wrong": ["Molality is based on solvent mass, invariant with temperature.", "Mole fraction is a ratio of mole counts.", "Mass percent depends only on masses."]}, {"level": "Medium", "type": "number", "unit": "g", "tolerance": 0.1, "prompt": "NCERT Ex 1.5: Calculate the mass of sodium acetate (CH₃COONa, molar mass = 82.025 g mol⁻¹) required to prepare 500 mL of a 0.375 M aqueous solution:", "answer": 15.38, "hint": "Mass = Molarity × Volume (in L) × Molar Mass = 0.375 × 0.500 × 82.025.", "solution": "Mass = 0.375 mol/L × 0.500 L × 82.0245 g/mol = 15.3796 g ≈ 15.38 g."}, {"level": "Hard", "type": "number", "unit": "M", "tolerance": 0.1, "prompt": "NCERT Ex 1.6: Concentrated aqueous nitric acid is 69% HNO₃ by mass with a density of 1.41 g mL⁻¹. Calculate the molarity of this nitric acid sample (molar mass HNO₃ = 63.01 g mol⁻¹):", "answer": 15.44, "hint": "M = (Mass % × Density × 10) / Molar Mass = (69 × 1.41 × 10) / 63.01.", "solution": "1 L of solution has mass 1410 g. Mass of HNO₃ = 0.69 × 1410 = 972.9 g. Moles HNO₃ = 972.9 / 63.01 = 15.44 M."}]}], "exercises": [{"number": "1.1", "conceptIdx": 3, "page": 25, "printPage": 25, "question": "Calculate the molar mass of the following: (i) H₂O, (ii) CO₂, (iii) CH₄.", "steps": ["(i) H₂O = 2(Atomic mass of H) + 1(Atomic mass of O) = 2(1.008 u) + 16.00 u = 18.016 g mol⁻¹.", "(ii) CO₂ = 1(Atomic mass of C) + 2(Atomic mass of O) = 12.011 u + 2(16.00 u) = 44.011 g mol⁻¹.", "(iii) CH₄ = 1(Atomic mass of C) + 4(Atomic mass of H) = 12.011 u + 4(1.008 u) = 16.043 g mol⁻¹."], "answer": "(i) 18.02 g mol⁻¹; (ii) 44.01 g mol⁻¹; (iii) 16.04 g mol⁻¹."}, {"number": "1.2", "conceptIdx": 5, "page": 25, "printPage": 25, "question": "Calculate the mass per cent of different elements present in sodium sulphate (Na₂SO₄).", "steps": ["Molar mass of Na₂SO₄ = 2(22.99) + 32.06 + 4(16.00) = 45.98 + 32.06 + 64.00 = 142.04 g mol⁻¹.", "Mass % of Na = (45.98 / 142.04) × 100 = 32.37%.", "Mass % of S = (32.06 / 142.04) × 100 = 22.57%.", "Mass % of O = (64.00 / 142.04) × 100 = 45.06%."], "answer": "Na = 32.37%, S = 22.57%, O = 45.06%."}, {"number": "1.3", "conceptIdx": 5, "page": 25, "printPage": 25, "question": "Determine the empirical formula of an oxide of iron, which has 69.9% iron and 30.1% dioxygen by mass.", "steps": ["In 100 g: Mass of Fe = 69.9 g, Mass of O = 30.1 g.", "Moles of Fe = 69.9 / 55.85 = 1.251 mol.", "Moles of O = 30.1 / 16.00 = 1.881 mol.", "Mole ratio Fe : O = (1.251 / 1.251) : (1.881 / 1.251) = 1 : 1.50.", "Multiply by 2 to obtain whole numbers: 2 : 3.", "Empirical formula = Fe₂O₃."], "answer": "Fe₂O₃ (Iron(III) oxide)."}, {"number": "1.4", "conceptIdx": 6, "page": 25, "printPage": 25, "question": "Calculate the amount of carbon dioxide that could be produced when: (i) 1 mole of carbon is burnt in air; (ii) 1 mole of carbon is burnt in 16 g of dioxygen; (iii) 2 moles of carbon are burnt in 16 g of dioxygen.", "steps": ["Balanced equation: C(s) + O₂(g) → CO₂(g). 1 mol C (12 g) reacts with 1 mol O₂ (32 g) to form 1 mol CO₂ (44 g).", "(i) 1 mol C in excess air forms exactly 1 mol CO₂ = 44 g.", "(ii) 16 g O₂ = 16 / 32 = 0.5 mol O₂. O₂ is the limiting reagent! 0.5 mol O₂ reacts with 0.5 mol C to form 0.5 mol CO₂ = 0.5 × 44 = 22 g.", "(iii) 2 mol C with 16 g O₂ (0.5 mol O₂). Again O₂ is the limiting reagent (need 2 mol O₂). 0.5 mol O₂ produces 0.5 mol CO₂ = 22 g (1.5 mol C remains unreacted)."], "answer": "(i) 44 g CO₂; (ii) 22 g CO₂; (iii) 22 g CO₂."}, {"number": "1.5", "conceptIdx": 6, "page": 25, "printPage": 25, "question": "Calculate the mass of sodium acetate (CH₃COONa) required to make 500 mL of 0.375 molar aqueous solution. Molar mass of sodium acetate is 82.0245 g mol⁻¹.", "steps": ["Volume V = 500 mL = 0.500 L.", "Moles of CH₃COONa required = Molarity × Volume = 0.375 mol L⁻¹ × 0.500 L = 0.1875 mol.", "Mass required = Moles × Molar Mass = 0.1875 mol × 82.0245 g mol⁻¹ = 15.3796 g."], "answer": "15.38 g."}, {"number": "1.6", "conceptIdx": 6, "page": 26, "printPage": 26, "question": "Calculate the concentration of nitric acid in moles per litre in a sample which has a density, 1.41 g mL⁻¹ and the mass per cent of nitric acid in it being 69%.", "steps": ["Mass of 1000 mL (1 L) of solution = Volume × Density = 1000 mL × 1.41 g mL⁻¹ = 1410 g.", "Mass of HNO₃ in 1 L = 69% of 1410 g = 0.69 × 1410 = 972.9 g.", "Molar mass of HNO₃ = 1.008 + 14.01 + 3(16.00) = 63.018 g mol⁻¹.", "Molarity M = Moles / 1 L = 972.9 g / 63.018 g mol⁻¹ = 15.438 M."], "answer": "15.44 M (mol L⁻¹)."}, {"number": "1.7", "conceptIdx": 4, "page": 26, "printPage": 26, "question": "How much copper can be obtained from 100 g of copper sulphate (CuSO₄)?", "steps": ["Molar mass of CuSO₄ = 63.546 + 32.06 + 4(16.00) = 159.61 g mol⁻¹.", "1 mole (159.61 g) of CuSO₄ contains 1 mole (63.55 g) of Cu.", "Copper obtainable from 100 g CuSO₄ = (63.55 / 159.61) × 100 g = 39.81 g."], "answer": "39.81 g of copper."}, {"number": "1.8", "conceptIdx": 5, "page": 26, "printPage": 26, "question": "Determine the molecular formula of an oxide of iron, in which the mass per cent of iron and oxygen are 69.9 and 30.1, respectively. Molar mass of the oxide is 159.69 g mol⁻¹.", "steps": ["From Exercise 1.3, the empirical formula is Fe₂O₃.", "Empirical formula mass = 2(55.85) + 3(16.00) = 111.70 + 48.00 = 159.70 g mol⁻¹.", "Multiplier n = Molar mass / Empirical mass = 159.69 / 159.70 ≈ 1.", "Molecular formula = (Fe₂O₃)₁ = Fe₂O₃."], "answer": "Fe₂O₃."}, {"number": "1.9", "conceptIdx": 3, "page": 26, "printPage": 26, "question": "Calculate the atomic mass (average) of chlorine using the following data: ³⁵Cl (75.77% abundance, molar mass 34.9689 u) and ³⁷Cl (24.23% abundance, molar mass 36.9659 u).", "steps": ["Average atomic mass = (Fractional abundance × Mass of ³⁵Cl) + (Fractional abundance × Mass of ³⁷Cl).", "= (0.7577 × 34.9689 u) + (0.2423 × 36.9659 u).", "= 26.4959 u + 8.9568 u = 35.4527 u."], "answer": "35.453 u."}, {"number": "1.10", "conceptIdx": 4, "page": 26, "printPage": 26, "question": "In three moles of ethane (C₂H₆), calculate the following: (i) Number of moles of carbon atoms; (ii) Number of moles of hydrogen atoms; (iii) Number of molecules of ethane.", "steps": ["1 mole of C₂H₆ contains 2 moles of C atoms and 6 moles of H atoms.", "(i) Moles of carbon atoms = 3 × 2 = 6 moles.", "(ii) Moles of hydrogen atoms = 3 × 6 = 18 moles.", "(iii) Number of molecules = Moles × N_A = 3 × 6.022 × 10²³ = 1.807 × 10²⁴ molecules."], "answer": "(i) 6 moles; (ii) 18 moles; (iii) 1.807 × 10²⁴ molecules."}, {"number": "1.11", "conceptIdx": 6, "page": 26, "printPage": 26, "question": "What is the concentration of sugar (C₁₂H₂₂O₁₁) in mol L⁻¹ if its 20 g are dissolved in enough water to make a final volume up to 2 L?", "steps": ["Molar mass of sucrose C₁₂H₂₂O₁₁ = 12(12.011) + 22(1.008) + 11(16.00) = 144.13 + 22.18 + 176.00 = 342.31 g mol⁻¹.", "Moles of sugar = 20 g / 342.31 g mol⁻¹ = 0.05842 mol.", "Molarity M = Moles / Volume = 0.05842 mol / 2.0 L = 0.02921 mol L⁻¹."], "answer": "0.0292 M (or 0.0292 mol L⁻¹)."}, {"number": "1.12", "conceptIdx": 6, "page": 26, "printPage": 26, "question": "If the density of methanol is 0.793 kg L⁻¹, what is its volume needed for making 2.5 L of its 0.25 M solution?", "steps": ["Molar mass of methanol (CH₃OH) = 12.01 + 4(1.008) + 16.00 = 32.042 g mol⁻¹ = 0.032042 kg mol⁻¹.", "Moles of methanol required = Molarity × Volume = 0.25 mol L⁻¹ × 2.5 L = 0.625 mol.", "Mass of methanol needed = 0.625 mol × 32.042 g mol⁻¹ = 20.026 g = 0.020026 kg.", "Volume of pure methanol needed = Mass / Density = 0.020026 kg / 0.793 kg L⁻¹ = 0.02525 L = 25.25 mL."], "answer": "25.25 mL (or 0.0253 L)."}, {"number": "1.13", "conceptIdx": 1, "page": 26, "printPage": 26, "question": "Pressure is determined as force per unit area of the surface. If mass of air at sea level is 1034 g cm⁻², calculate the pressure in pascal.", "steps": ["Force = mass × acceleration due to gravity (g = 9.8 m s⁻²).", "Mass per unit area = 1034 g cm⁻² = 1.034 kg / (10⁻⁴ m²) = 10340 kg m⁻².", "Force per unit area (Pressure) = 10340 kg m⁻² × 9.8 m s⁻² = 101,332 N m⁻² = 101,332 Pa = 1.01332 × 10⁵ Pa."], "answer": "1.013 × 10⁵ Pa (101.3 kPa)."}, {"number": "1.14", "conceptIdx": 1, "page": 26, "printPage": 26, "question": "What is the SI unit of mass? How is it defined?", "steps": ["The SI base unit of mass is the kilogram (kg).", "Since the 2019 redefinition, the kilogram is defined by taking the fixed numerical value of the Planck constant h to be 6.62607015 × 10⁻³⁴ when expressed in the unit J s, which is equal to kg m² s⁻¹, where the metre and the second are defined in terms of c and Δν_Cs."], "answer": "Kilogram (kg); defined by fixing the Planck constant h = 6.62607015 × 10⁻³⁴ J s."}, {"number": "1.15", "conceptIdx": 1, "page": 26, "printPage": 26, "question": "Match the following prefixes with their multiples: (i) micro, (ii) deca, (iii) mega, (iv) giga, (v) femto with 10⁶, 10⁹, 10⁻⁶, 10⁻¹⁵, 10.", "steps": ["(i) micro = 10⁻⁶.", "(ii) deca = 10 (or 10¹).", "(iii) mega = 10⁶.", "(iv) giga = 10⁹.", "(v) femto = 10⁻¹⁵."], "answer": "(i) micro → 10⁻⁶; (ii) deca → 10; (iii) mega → 10⁶; (iv) giga → 10⁹; (v) femto → 10⁻¹⁵."}, {"number": "1.16", "conceptIdx": 1, "page": 26, "printPage": 26, "question": "What do you mean by significant figures?", "steps": ["Significant figures are meaningful digits which are known with certainty plus one digit that is estimated or uncertain.", "They convey the precision of an experimental measurement. For example, reporting 11.2 mL implies the uncertainty lies in the tenths place (±0.1 mL)."], "answer": "Meaningful digits known with certainty plus one final uncertain/estimated digit."}, {"number": "1.17", "conceptIdx": 6, "page": 26, "printPage": 26, "question": "A sample of drinking water was found to be severely contaminated with chloroform (CHCl₃), supposed to be carcinogenic. The level of contamination was 15 ppm (by mass). (i) Express this in per cent by mass. (ii) Determine the molality of chloroform in the water sample.", "steps": ["15 ppm = 15 parts in 10⁶ parts = 15 g CHCl₃ in 10⁶ g solution.", "(i) Mass % = (15 g / 10⁶ g) × 100 = 15 × 10⁻⁴ % = 1.5 × 10⁻³ %.", "(ii) In 10⁶ g solution, mass of solvent (water) ≈ 10⁶ g = 1000 kg.", "Molar mass of CHCl₃ = 12.01 + 1.008 + 3(35.45) = 119.37 g mol⁻¹.", "Moles of CHCl₃ = 15 g / 119.37 g mol⁻¹ = 0.12566 mol.", "Molality m = Moles solute / Mass solvent (kg) = 0.12566 mol / 1000 kg = 1.257 × 10⁻⁴ mol kg⁻¹."], "answer": "(i) 1.5 × 10⁻³ % (0.0015%); (ii) 1.26 × 10⁻⁴ m."}, {"number": "1.18", "conceptIdx": 1, "page": 26, "printPage": 26, "question": "Express the following in scientific notation: (i) 0.0048, (ii) 234,000, (iii) 8008, (iv) 500.0, (v) 6.0012.", "steps": ["Scientific notation has form N × 10ⁿ where 1.0 ≤ N < 10.", "(i) 0.0048 = 4.8 × 10⁻³.", "(ii) 234,000 = 2.34 × 10⁵.", "(iii) 8008 = 8.008 × 10³.", "(iv) 500.0 = 5.000 × 10².", "(v) 6.0012 = 6.0012 × 10⁰."], "answer": "(i) 4.8 × 10⁻³; (ii) 2.34 × 10⁵; (iii) 8.008 × 10³; (iv) 5.000 × 10²; (v) 6.0012 × 10⁰."}, {"number": "1.19", "conceptIdx": 1, "page": 26, "printPage": 26, "question": "How many significant figures are present in the following? (i) 0.0025, (ii) 208, (iii) 5005, (iv) 126,000, (v) 500.0, (vi) 2.0034.", "steps": ["(i) 0.0025: 2 sig figs (leading zeros not significant).", "(ii) 208: 3 sig figs (zero between non-zeros is significant).", "(iii) 5005: 4 sig figs.", "(iv) 126,000: 3 sig figs (trailing zeros without decimal point are not significant).", "(v) 500.0: 4 sig figs (trailing zero after decimal is significant).", "(vi) 2.0034: 5 sig figs."], "answer": "(i) 2; (ii) 3; (iii) 4; (iv) 3; (v) 4; (vi) 5."}, {"number": "1.20", "conceptIdx": 1, "page": 27, "printPage": 27, "question": "Round up the following upto three significant figures: (i) 34.216, (ii) 10.4107, (iii) 0.04597, (iv) 2808.", "steps": ["(i) 34.216: 4th digit is 1 (<5), so rounds to 34.2.", "(ii) 10.4107: 4th digit is 1 (<5), so rounds to 10.4.", "(iii) 0.04597: 4th sig fig is 7 (>5), rounds 9 up to 10, giving 0.0460.", "(iv) 2808: 4th digit is 8 (>5), rounds up to 2810 (or 2.81 × 10³)."], "answer": "(i) 34.2; (ii) 10.4; (iii) 0.0460; (iv) 2810 (2.81 × 10³)."}, {"number": "1.21", "conceptIdx": 2, "page": 27, "printPage": 27, "question": "The following data are obtained when dinitrogen and dioxygen react together: (i) 14 g N + 16 g O; (ii) 14 g N + 32 g O; (iii) 28 g N + 32 g O; (iv) 28 g N + 80 g O. (a) Which law of chemical combination is obeyed? (b) Fill in conversions: 1 km = _ mm = _ pm; 1 mg = _ kg = _ ng; 1 mL = _ L = _ dm³.", "steps": ["(a) Fix the mass of dinitrogen to 14 g: In (i) O = 16 g; in (ii) O = 32 g; in (iii) 28 g N with 32 g O means 14 g N combines with 16 g O; in (iv) 28 g N with 80 g O means 14 g N combines with 40 g O. The masses of oxygen combining with fixed 14 g N are 16 g, 32 g, 16 g, 40 g. Ratios: 16 : 32 : 16 : 40 = 2 : 4 : 2 : 5. This whole-number ratio demonstrates the Law of Multiple Proportions.", "(b) (i) 1 km = 10⁶ mm = 10¹⁵ pm.", "(ii) 1 mg = 10⁻⁶ kg = 10⁶ ng.", "(iii) 1 mL = 10⁻³ L = 10⁻³ dm³."], "answer": "(a) Law of Multiple Proportions; (b) (i) 10⁶ mm, 10¹⁵ pm; (ii) 10⁻⁶ kg, 10⁶ ng; (iii) 10⁻³ L, 10⁻³ dm³."}, {"number": "1.22", "conceptIdx": 1, "page": 27, "printPage": 27, "question": "If the speed of light is 3.0 × 10⁸ m s⁻¹, calculate the distance covered by light in 2.00 ns.", "steps": ["Speed of light c = 3.0 × 10⁸ m s⁻¹.", "Time t = 2.00 ns = 2.00 × 10⁻⁹ s.", "Distance = Speed × Time = (3.0 × 10⁸ m s⁻¹) × (2.00 × 10⁻⁹ s) = 6.0 × 10⁻¹ m = 0.60 m = 60.0 cm."], "answer": "0.60 m (6.0 × 10⁻¹ m)."}, {"number": "1.23", "conceptIdx": 6, "page": 27, "printPage": 27, "question": "In a reaction A + B₂ → AB₂, identify the limiting reagent, if any, in: (i) 300 atoms of A + 200 molecules of B; (ii) 2 mol A + 3 mol B; (iii) 100 atoms of A + 100 molecules of B; (iv) 5 mol A + 2.5 mol B; (v) 2.5 mol A + 5 mol B.", "steps": ["Stoichiometric ratio is 1 atom of A : 1 molecule of B₂.", "(i) 200 molecules of B₂ require 200 atoms of A. Since 300 atoms of A are present, B is limiting.", "(ii) 2 mol A requires 2 mol B. 3 mol B is available, so A is limiting.", "(iii) 100 atoms A react with 100 molecules B: exact stoichiometric proportions, no limiting reagent.", "(iv) 2.5 mol B requires 2.5 mol A. 5 mol A is present, so B is limiting.", "(v) 2.5 mol A requires 2.5 mol B. 5 mol B is present, so A is limiting."], "answer": "(i) B is limiting; (ii) A is limiting; (iii) No limiting reagent; (iv) B is limiting; (v) A is limiting."}, {"number": "1.24", "conceptIdx": 6, "page": 27, "printPage": 27, "question": "Dinitrogen and dihydrogen react: N₂(g) + 3H₂(g) → 2NH₃(g). (i) Calculate mass of NH₃ produced if 2.00 × 10³ g N₂ reacts with 1.00 × 10³ g H₂. (ii) Will any reactant remain unreacted? (iii) If yes, which one and its mass?", "steps": ["Moles of N₂ = 2000 g / 28.02 g mol⁻¹ = 71.38 mol.", "Moles of H₂ = 1000 g / 2.016 g mol⁻¹ = 496.03 mol.", "1 mol N₂ requires 3 mol H₂. Therefore, 71.38 mol N₂ requires 3 × 71.38 = 214.14 mol H₂.", "Since 496.03 mol H₂ is available, N₂ is the limiting reagent and H₂ is in excess.", "(i) Moles of NH₃ produced = 2 × 71.38 = 142.76 mol. Mass = 142.76 mol × 17.03 g mol⁻¹ = 2431 g = 2.43 kg.", "(ii) Yes, H₂ remains unreacted.", "(iii) Unreacted H₂ moles = 496.03 − 214.14 = 281.89 mol. Mass = 281.89 mol × 2.016 g mol⁻¹ = 568.3 g (0.568 kg)."], "answer": "(i) 2.43 kg NH₃ (2431 g); (ii) H₂ remains unreacted; (iii) Dihydrogen (H₂), 568 g."}, {"number": "1.25", "conceptIdx": 6, "page": 27, "printPage": 27, "question": "How are 0.50 mol Na₂CO₃ and 0.50 M Na₂CO₃ different?", "steps": ["0.50 mol Na₂CO₃ specifies an amount of substance: Moles × Molar mass = 0.50 mol × 105.99 g mol⁻¹ = 53.0 g of solid pure salt.", "0.50 M Na₂CO₃ specifies a concentration (molarity): 0.50 moles (53.0 g) of Na₂CO₃ dissolved in water to make a total solution volume of exactly 1.00 litre."], "answer": "0.50 mol is an amount/mass (53.0 g), whereas 0.50 M is a concentration (0.50 mol dissolved per litre of solution)."}, {"number": "1.26", "conceptIdx": 2, "page": 27, "printPage": 27, "question": "If 10 volumes of dihydrogen gas reacts with five volumes of dioxygen gas, how many volumes of water vapour would be produced?", "steps": ["Reaction equation: 2H₂(g) + O₂(g) → 2H₂O(g).", "According to Gay-Lussac's Law, volume ratios are 2 : 1 : 2.", "10 volumes H₂ react with 5 volumes O₂ to yield exactly 10 volumes of H₂O vapour."], "answer": "10 volumes of water vapour."}, {"number": "1.27", "conceptIdx": 1, "page": 27, "printPage": 27, "question": "Convert the following into basic units: (i) 28.7 pm, (ii) 15.15 pm, (iii) 25365 mg.", "steps": ["(i) 1 pm = 10⁻¹² m. 28.7 pm = 28.7 × 10⁻¹² m = 2.87 × 10⁻¹¹ m.", "(ii) 15.15 pm = 15.15 × 10⁻¹² m = 1.515 × 10⁻¹¹ m.", "(iii) 1 mg = 10⁻⁶ kg. 25365 mg = 25365 × 10⁻⁶ kg = 2.5365 × 10⁻² kg."], "answer": "(i) 2.87 × 10⁻¹¹ m; (ii) 1.515 × 10⁻¹¹ m; (iii) 2.5365 × 10⁻² kg."}, {"number": "1.28", "conceptIdx": 4, "page": 28, "printPage": 28, "question": "Which one of the following will have the largest number of atoms? (i) 1 g Au(s), (ii) 1 g Na(s), (iii) 1 g Li(s), (iv) 1 g of Cl₂(g).", "steps": ["Number of atoms = (Mass / Molar mass) × N_A × (atoms per entity).", "(i) 1 g Au = (1 / 197) × N_A = 0.00508 N_A atoms.", "(ii) 1 g Na = (1 / 23) × N_A = 0.04348 N_A atoms.", "(iii) 1 g Li = (1 / 6.94) × N_A = 0.14409 N_A atoms.", "(iv) 1 g Cl₂ = (1 / 70.9) × 2 × N_A = 0.02821 N_A atoms.", "0.144 N_A is the highest value."], "answer": "1 g Li(s) contains the largest number of atoms (0.144 N_A ≈ 8.68 × 10²² atoms)."}, {"number": "1.29", "conceptIdx": 6, "page": 28, "printPage": 28, "question": "Calculate the molarity of a solution of ethanol in water, in which the mole fraction of ethanol is 0.040 (assume the density of water to be 1.0 g mL⁻¹).", "steps": ["Consider 1000 mL (1.0 L) of water = 1000 g = 1000 / 18.02 = 55.49 mol H₂O.", "Mole fraction of ethanol x_EtOH = n_EtOH / (n_EtOH + 55.49) = 0.040.", "n_EtOH = 0.040 × (n_EtOH + 55.49) ⇒ n_EtOH(1 − 0.040) = 2.2196 ⇒ 0.96 n_EtOH = 2.2196 ⇒ n_EtOH = 2.312 mol.", "Assuming volume of solution remains approximately 1.0 L, Molarity M ≈ 2.31 mol L⁻¹ (or 2.14 M with volume expansion; standard NCERT convention is 2.31 M)."], "answer": "2.31 M (or 2.31 mol L⁻¹)."}, {"number": "1.30", "conceptIdx": 3, "page": 28, "printPage": 28, "question": "What will be the mass of one ¹²C atom in g?", "steps": ["1 mole (6.02214 × 10²³ atoms) of ¹²C has a mass of exactly 12.0000 g.", "Mass of 1 atom = 12.0000 g / 6.02214 × 10²³ = 1.992648 × 10⁻²³ g."], "answer": "1.993 × 10⁻²³ g."}, {"number": "1.31", "conceptIdx": 1, "page": 28, "printPage": 28, "question": "How many significant figures should be present in the answer of the following calculations? (i) (0.02856 × 298.15 × 0.112) / 0.5785; (ii) 5 × 5.364; (iii) 0.0125 + 0.7864 + 0.0215.", "steps": ["(i) Multiplication/division: 0.112 has 3 sig figs (least precise). Answer must have 3 significant figures.", "(ii) 5 is an exact counting number (infinite sig figs); 5.364 has 4 sig figs. Answer must have 4 significant figures.", "(iii) Addition: each term has 4 decimal places (0.0125, 0.7864, 0.0215). The sum (0.8204) has 4 decimal places and 4 significant figures."], "answer": "(i) 3; (ii) 4; (iii) 4."}, {"number": "1.32", "conceptIdx": 3, "page": 28, "printPage": 28, "question": "Use the data given in Table to calculate the molar mass of naturally occurring argon isotopes: ³⁶Ar (35.96755 g mol⁻¹, 0.337%), ³⁸Ar (37.96272 g mol⁻¹, 0.063%), ⁴⁰Ar (39.9624 g mol⁻¹, 99.600%).", "steps": ["Average molar mass = (35.96755 × 0.337 + 37.96272 × 0.063 + 39.9624 × 99.600) / 100.", "= (12.1211 + 2.3917 + 3980.2550) / 100.", "= 3994.7678 / 100 = 39.9477 g mol⁻¹."], "answer": "39.95 g mol⁻¹."}, {"number": "1.33", "conceptIdx": 4, "page": 28, "printPage": 28, "question": "Calculate the number of atoms in each of the following: (i) 52 moles of Ar, (ii) 52 u of He, (iii) 52 g of He.", "steps": ["(i) 52 moles of Ar = 52 × 6.022 × 10²³ = 3.131 × 10²⁵ atoms.", "(ii) 1 He atom = 4 u. 52 u of He = 52 u / 4 u = 13 atoms.", "(iii) 1 mole of He = 4 g = 6.022 × 10²³ atoms. 52 g of He = (52 / 4) mol = 13 mol = 13 × 6.022 × 10²³ = 7.829 × 10²⁴ atoms."], "answer": "(i) 3.13 × 10²⁵ atoms; (ii) 13 atoms; (iii) 7.83 × 10²⁴ atoms."}, {"number": "1.34", "conceptIdx": 5, "page": 28, "printPage": 28, "question": "A welding fuel gas contains C and H only. Burning a sample gives 3.38 g CO₂, 0.690 g H₂O. 10.0 L (STP) weighs 11.6 g. Calculate: (i) empirical formula, (ii) molar mass, (iii) molecular formula.", "steps": ["Moles of C in 3.38 g CO₂ = 3.38 / 44.01 = 0.07680 mol → Mass C = 0.07680 × 12.011 = 0.9224 g.", "Moles of H in 0.690 g H₂O = 2 × (0.690 / 18.016) = 0.07660 mol → Mass H = 0.07660 × 1.008 = 0.0772 g.", "Mole ratio C : H = 0.0768 : 0.0766 ≈ 1 : 1. Empirical formula = CH (empirical mass = 13.019 g mol⁻¹).", "At STP (1 atm), 22.4 L = 1 mole. Molar mass = (11.6 g / 10.0 L) × 22.4 L mol⁻¹ = 25.98 g mol⁻¹ ≈ 26.0 g mol⁻¹.", "Multiplier n = 25.98 / 13.019 = 2. Molecular formula = (CH)₂ = C₂H₂ (acetylene / ethyne)."], "answer": "(i) Empirical formula: CH; (ii) Molar mass: 26.0 g mol⁻¹; (iii) Molecular formula: C₂H₂."}, {"number": "1.35", "conceptIdx": 6, "page": 28, "printPage": 28, "question": "CaCO₃(s) + 2HCl(aq) → CaCl₂(aq) + CO₂(g) + H₂O(l). What mass of CaCO₃ is required to react completely with 25 mL of 0.75 M HCl?", "steps": ["Volume of HCl = 25 mL = 0.025 L.", "Moles of HCl = Molarity × Volume = 0.75 mol L⁻¹ × 0.025 L = 0.01875 mol.", "From stoichiometry, 2 moles HCl require 1 mole CaCO₃.", "Moles of CaCO₃ required = 0.01875 / 2 = 0.009375 mol.", "Molar mass of CaCO₃ = 40.08 + 12.01 + 3(16.00) = 100.09 g mol⁻¹.", "Mass of CaCO₃ required = 0.009375 mol × 100.09 g mol⁻¹ = 0.9383 g."], "answer": "0.938 g CaCO₃ (approx 0.94 g)."}, {"number": "1.36", "conceptIdx": 6, "page": 28, "printPage": 28, "question": "Chlorine is prepared by treating MnO₂ with aqueous HCl: 4HCl(aq) + MnO₂(s) → 2H₂O(l) + MnCl₂(aq) + Cl₂(g). How many grams of HCl react with 5.0 g of manganese dioxide?", "steps": ["Molar mass of MnO₂ = 54.94 + 2(16.00) = 86.94 g mol⁻¹.", "Moles of MnO₂ = 5.0 g / 86.94 g mol⁻¹ = 0.05751 mol.", "From stoichiometry, 1 mole MnO₂ reacts with 4 moles HCl.", "Moles of HCl needed = 4 × 0.05751 = 0.23004 mol.", "Molar mass of HCl = 1.008 + 35.45 = 36.458 g mol⁻¹.", "Mass of HCl = 0.23004 mol × 36.458 g mol⁻¹ = 8.387 g."], "answer": "8.40 g HCl (8.39 g)."}]};
