s: electron-deficient species that accept electron pairs (e.g., NO2⁺, AlCl3, H⁺). Nucleophiles: electron-rich species with lone pairs that donate electron pairs (e.g., OH⁻, NH3, CN⁻)."}, {"q": "8.13", "number": "8.13", "title": "Classification of reagents in bold as nucleophiles or electrophiles", "conceptIdx": 3, "page": 37, "printPage": 292, "question": "Identify the reagents shown in bold in the following equations as nucleophiles or electrophiles: (a) CH3COOH + HO⁻ -> CH3COO⁻ + H2O; (b) CH3COCH3 + :CN⁻ -> (CH3)2C(CN)(OH); (c) C6H6 + CH3CO⁺ -> C6H5COCH3.", "steps": ["(a) In CH3COOH + HO⁻ -> CH3COO⁻ + H2O: Hydroxide ion (HO⁻) possesses three lone pairs and a negative charge, acting as an electron-pair donor to abstract an acidic proton ⟹ Nucleophile (Lewis base).", "(b) In CH3COCH3 + :CN⁻ -> (CH3)2C(CN)(OH): Cyanide ion (:CN⁻) donates its unshared electron pair to the electrophilic carbonyl carbon atom ⟹ Nucleophile.", "(c) In C6H6 + CH3CO⁺ -> C6H5COCH3: The acetylium ion (CH3CO⁺) carries a formal positive charge and an electron deficiency, attacking the electron-rich π cloud of the benzene ring ⟹ Electrophile."], "answer": "(a) HO⁻: Nucleophile; (b) :CN⁻: Nucleophile; (c) CH3CO⁺: Electrophile."}, {"q": "8.14", "number": "8.14", "title": "Classification of four organic reactions by reaction type", "conceptIdx": 3, "page": 38, "printPage": 293, "question": "Classify the following reactions in one of the reaction types studied in this unit: (a) CH3CH2Br + HS⁻ -> CH3CH2SH + Br⁻; (b) (CH3)2C=CH2 + HCl -> (CH3)2CCl-CH3; (c) CH3CH2Br + HO⁻ -> CH2=CH2 + H2O + Br⁻; (d) (CH3)3C-CH2OH + HBr -> (CH3)2CBr-CH2CH2CH3 + H2O.", "steps": ["(a) CH3CH2Br + HS⁻ -> CH3CH2SH + Br⁻: The bromide atom is replaced by the hydrosulfide (-SH) nucleophile. Type: Nucleophilic Substitution (SN2).", "(b) (CH3)2C=CH2 + HCl -> (CH3)2CCl-CH3: The double bond is broken, and H and Cl add across the π bond. Type: Electrophilic Addition.", "(c) CH3CH2Br + HO⁻ -> CH2=CH2 + H2O + Br⁻: Elements of H and Br are removed from adjacent carbon atoms to generate a double bond. Type: Beta-Elimination.", "(d) (CH3)3C-CH2OH + HBr -> (CH3)2CBr-CH2CH2CH3 + H2O: The neopentyl-type alcohol protonates and loses water to form a primary carbocation, which undergoes a 1,2-methyl shift to a more stable tertiary carbocation before bromide attack. Type: Substitution with Rearrangement."], "answer": "(a) Nucleophilic Substitution; (b) Electrophilic Addition; (c) Beta-Elimination; (d) Substitution with Rearrangement."}, {"q": "8.15", "number": "8.15", "title": "Relationship between isomeric and resonance pairs", "conceptIdx": 2, "page": 38, "printPage": 293, "question": "What is the relationship between the members of following pairs of structures? Are they structural or geometrical isomers or resonance contributors? (a) Pentan-3-one and Pentan-2-one; (b) trans-1,2-dideuterioethene and cis-1,2-dideuterioethene; (c) H-C(=O⁺H)-OH and H-C(OH)=O⁺H.", "steps": ["(a) Pentan-3-one (CH3CH2COCH2CH3) and Pentan-2-one (CH3COCH2CH2CH3): Identical molecular formula C5H10O and identical straight chain skeleton, but different positions of the carbonyl functional group. Relationship: Position isomers (structural isomers / metamers).", "(b) trans-1,2-dideuterioethene (D on opposite sides) and cis-1,2-dideuterioethene (D on same side): Identical connectivity, but different spatial arrangement of deuterium atoms across the rigid double bond. Relationship: Geometrical stereoisomers.", "(c) H-C(=O⁺H)-OH <-> H-C(OH)=O⁺H (protonated formic acid): Only electron pairs shift; nuclei do not move. Relationship: Resonance contributors (canonical forms)."], "answer": "(a) Structural isomers (Position isomers / Metamers); (b) Geometrical isomers (Stereoisomers); (c) Resonance contributors (Canonical structures)."}, {"q": "8.16", "number": "8.16", "title": "Bond cleavages, curved arrows, and reactive intermediates", "conceptIdx": 3, "page": 38, "printPage": 293, "question": "For the following bond cleavages, use curved-arrows to show electron flow and classify each as homolysis or heterolysis. Identify reactive intermediate produced: (a) CH3O-OCH3 -> 2 CH3O•; (b) >C=O + ⁻OH -> >C⁻-C=O + H2O; (c) (CH3)3C-Br -> (CH3)3C⁺ + Br⁻; (d) Benzene + E⁺ -> arenium cation.", "steps": ["(a) Dimethyl peroxide (CH3O-OCH3): The weak O-O bond cleaves symmetrically with fish-hook arrows, each oxygen retaining one electron. Type: Homolysis. Intermediate: Methoxy free radical (CH3O•).", "(b) Ketone alpha-deprotonation by hydroxide: Hydroxide abstracts an alpha-proton heterolytically; the C-H bonding electron pair is retained by carbon. Type: Heterolysis. Intermediate: Enolate carbanion.", "(c) tert-Butyl bromide ionization: The polar C-Br bond breaks heterolytically; both bonding electrons depart with the more electronegative bromide ion. Type: Heterolysis. Intermediate: tert-Butyl carbocation ((CH3)3C⁺).", "(d) Electrophilic attack on benzene: Benzene π-electrons attack the electrophile E⁺ heterolytically, forming a C-E bond and leaving a positive charge delocalized in the ring. Type: Heterolysis. Intermediate: Arenium ion (carbocation)."], "answer": "(a) Homolysis ⟹ Free radical; (b) Heterolysis ⟹ Carbanion; (c) Heterolysis ⟹ Carbocation; (d) Heterolysis ⟹ Carbocation (Arenium ion)."}, {"q": "8.17", "number": "8.17", "title": "Inductive and electromeric effects and carboxylic acid acidity orders", "conceptIdx": 4, "page": 38, "printPage": 293, "question": "Explain the terms Inductive and Electromeric effects. Which electron displacement effect explains the following correct orders of acidity of the carboxylic acids? (a) Cl3CCOOH > Cl2CHCOOH > ClCH2COOH; (b) CH3CH2COOH > (CH3)2CHCOOH > (CH3)3C.COOH.", "steps": ["Definitions:", "• Inductive Effect: The permanent displacement of σ-electrons along a carbon chain due to difference in electronegativities between bonded atoms. Electron-withdrawing groups exhibit -I; electron-donating groups exhibit +I.", "• Electromeric Effect: The temporary complete transfer of a shared π-electron pair to one of the doubly bonded atoms under the influence of an attacking reagent. It operates only during the moment of reaction.", "(a) Cl3CCOOH > Cl2CHCOOH > ClCH2COOH: Explained by the -I (electron-withdrawing) inductive effect. Chlorine atoms pull electron density away from the carboxylate group, dispersing the negative charge in the conjugate base (RCOO⁻) and stabilizing it. More chlorine atoms = stronger -I effect = higher acid strength.", "(b) CH3CH2COOH > (CH3)2CHCOOH > (CH3)3C.COOH: Explained by the +I (electron-donating) inductive effect. Alkyl groups push electron density toward the carboxylate group, intensifying negative charge and destabilizing the conjugate base. More alkyl substituents on the alpha carbon ((CH3)3C- > (CH3)2CH- > CH3CH2-) = stronger +I destabilization = lower acid strength."], "answer": "Both acidity orders are governed by the Inductive Effect: (a) -I effect of chlorine disperses negative charge, increasing acidity; (b) +I effect of alkyl groups intensifies negative charge, decreasing acidity."}, {"q": "8.18", "number": "8.18", "title": "Principles of crystallisation, distillation, and chromatography", "conceptIdx": 5, "page": 38, "printPage": 293, "question": "Give a brief description of the principles of the following techniques taking an example in each case: (a) Crystallisation, (b) Distillation, (c) Chromatography.", "steps": ["(a) Crystallisation: Principle: Exploits the difference in solubilities of the compound and impurities in a suitable solvent. The compound should be sparingly soluble in cold solvent but highly soluble at its boiling point. Impurities remain in solution upon cooling. Example: Purification of impure benzoic acid using hot water.", "(b) Distillation: Principle: Separates volatile liquids from non-volatile impurities, or liquids with significantly different boiling points (ΔT > 25 K). The liquid of lower boiling point vaporizes first, and its vapors are condensed and collected. Example: Separation of ether (b.p. 35 °C) and toluene (b.p. 110 °C).", "(c) Chromatography: Principle: Separates components of a mixture based on their differential distribution (partitioning or adsorption) between a stationary phase and a mobile phase. Example: Separation of plant leaf pigments (chlorophyll a, chlorophyll b, xanthophylls) by column chromatography over alumina."], "answer": "(a) Crystallisation: Differential temperature-dependent solubility (e.g., benzoic acid in water); (b) Distillation: Differences in boiling points (e.g., ether and toluene); (c) Chromatography: Differential adsorption/partitioning between stationary and mobile phases (e.g., plant pigments on alumina)."}, {"q": "8.19", "number": "8.19", "title": "Separation of two compounds with different solubilities in solvent S", "conceptIdx": 5, "page": 38, "printPage": 293, "question": "Describe the method which can be used to separate two compounds with different solubilities in a solvent S.", "steps": ["The method used is Fractional Crystallisation.", "Principle: When two solid substances have differing solubilities in the same solvent, the less soluble compound reaches saturation and crystallizes out first upon concentrating and cooling the hot solution.", "Procedure:", "1. Dissolve the mixture in a minimum volume of hot solvent S to prepare a saturated solution.", "2. Filter hot to remove any insoluble impurities.", "3. Allow the clear hot solution to cool slowly. The less soluble compound crystallizes out first, while the more soluble compound remains dissolved in the mother liquor.", "4. Filter the crystals of the less soluble component, wash with cold solvent, and dry.", "5. Concentrate the remaining mother liquor further and cool to obtain crystals of the second compound."], "answer": "Fractional Crystallisation: the mixture is dissolved in hot solvent S; on controlled cooling, the less soluble compound crystallizes out first, leaving the more soluble compound in the mother liquor."}, {"q": "8.20", "number": "8.20", "title": "Distinction between simple, vacuum, and steam distillation", "conceptIdx": 5, "page": 38, "printPage": 293, "question": "What is the difference between distillation, distillation under reduced pressure and steam distillation?", "steps": ["(1) Simple Distillation: Used for thermally stable liquids that boil without decomposition at atmospheric pressure and contain non-volatile impurities or liquids differing in boiling point by at least 25 K. Example: Chloroform (b.p. 61 °C) and aniline (b.p. 184 °C).", "(2) Distillation under Reduced Pressure (Vacuum Distillation): Used for high-boiling liquids that decompose at or below their normal atmospheric boiling point. Lowering external pressure with a vacuum pump lowers the liquid's boiling point, allowing distillation at safe temperatures. Example: Glycerol (decomposes at 290 °C, distills undecomposed at 180 °C under 12 mm Hg).", "(3) Steam Distillation: Used for substances that are steam-volatile, completely immiscible with water, and contain non-volatile impurities. Steam bubbled through the mixture causes it to boil when P_total = p_organic + p_water = 1 atm, boiling below 100 °C. Example: Aniline (b.p. 184 °C distills at 98.5 °C with steam)."], "answer": "Simple distillation: for thermally stable liquids with ΔT > 25 K; Vacuum distillation: for heat-sensitive liquids by lowering pressure to prevent decomposition; Steam distillation: for steam-volatile, water-immiscible liquids boiling below 100 °C."}, {"q": "8.21", "number": "8.21", "title": "Chemistry of Lassaigne's test for nitrogen, sulfur, and halogens", "conceptIdx": 6, "page": 39, "printPage": 294, "question": "Discuss the chemistry of Lassaigne's test.", "steps": ["Principle: Covalently bonded elements (N, S, X) are converted into water-soluble ionic sodium salts by fusion with metallic sodium:", "Na + C + N ⟶ NaCN (sodium cyanide)", "2 Na + S ⟶ Na2S (sodium sulfide)", "Na + X ⟶ NaX (sodium halide)", "(1) Test for Nitrogen: Sodium extract is boiled with FeSO4 and acidified with conc. H2SO4: 6 NaCN + FeSO4 ⟶ Na4[Fe(CN)6] + Na2SO4. Acid oxidizes Fe²⁺ to Fe³⁺, forming ferric ferrocyanide: 3 Na4[Fe(CN)6] + 4 FeCl3 ⟶ Fe4[Fe(CN)6]3 (Prussian blue precipitate).", "(2) Test for Sulfur: (a) Sodium nitroprusside test: Na2S + Na2[Fe(CN)5NO] ⟶ Na4[Fe(CN)5NOS] (deep purple/violet color); (b) Lead acetate test: Na2S + (CH3COO)2Pb ⟶ PbS (black ppt) + 2 CH3COONa.", "(3) Test for Halogens: Extract is boiled with conc. HNO3 (to expel HCN and H2S), then treated with AgNO3: NaX + AgNO3 ⟶ AgX + NaNO3. White ppt soluble in NH4OH = Cl; pale yellow sparingly soluble = Br; yellow insoluble = I."], "answer": "Lassaigne's fusion converts covalent N, S, X into ionic NaCN, Na2S, NaX. N gives Prussian blue Fe4[Fe(CN)6]3; S gives violet nitroprusside Na4[Fe(CN)5NOS] or black PbS; halogens give AgCl (white), AgBr (pale yellow), or AgI (yellow)."}, {"q": "8.22", "number": "8.22", "title": "Comparison of Dumas and Kjeldahl methods for estimation of nitrogen", "conceptIdx": 6, "page": 39, "printPage": 294, "question": "Differentiate between the principle of estimation of nitrogen in an organic compound by (i) Dumas method and (ii) Kjeldahl's method.", "steps": ["(i) Dumas Method: Principle: The organic compound is heated with excess cupric oxide (CuO) in an atmosphere of CO2. Carbon and hydrogen are oxidized to CO2 and H2O, while nitrogen is converted to dinitrogen gas (N2) along with traces of nitrogen oxides (reduced back to N2 by passing over hot copper gauze). The gaseous mixture is collected over concentrated aqueous KOH in a Schiff's nitrometer. KOH absorbs CO2; pure N2 gas is measured at room temperature and atmospheric pressure.", "Applicability: Universal; applicable to all organic compounds including nitro, azo, and heterocyclic nitrogen.", "(ii) Kjeldahl's Method: Principle: The organic compound is digested with concentrated H2SO4 in the presence of K2SO4 (boiling point elevator) and CuSO4 (catalyst). Nitrogen is quantitatively converted into ammonium sulfate (NH4)2SO4. The solution is treated with excess NaOH, and liberated NH3 gas is absorbed in a known excess volume of standard acid. Unreacted acid is determined by back-titration with standard alkali.", "Applicability: Fails for compounds containing nitro (-NO2), azo (-N=N-), and ring nitrogen (pyridine, quinoline)."], "answer": "Dumas method oxidizes all nitrogen to elemental N2 gas collected over KOH (universal); Kjeldahl method digests nitrogen into (NH4)2SO4 and titrates liberated NH3 (fails for nitro, azo, and heterocyclic compounds)."}, {"q": "8.23", "number": "8.23", "title": "Principles of Carius estimation of halogens, sulfur, and phosphorus", "conceptIdx": 6, "page": 39, "printPage": 294, "question": "Discuss the principle of estimation of halogens, sulphur and phosphorus present in an organic compound.", "steps": ["(1) Halogens (Carius Method): A known mass of organic compound is heated with fuming HNO3 and AgNO3 in a sealed hard-glass Carius tube at 450 K. Carbon and hydrogen oxidize to CO2 and H2O. Halogen reacts with silver nitrate to form precipitate of silver halide (AgX). The precipitate is filtered, washed, dried, and weighed: %X = (Atomic mass of X / Molar mass of AgX) * (m_AgX / m_compound) * 100.", "(2) Sulfur (Carius Method): The compound is heated with fuming HNO3 in a Carius tube, oxidizing sulfur into sulfuric acid (H2SO4). Excess BaCl2 solution is added, precipitating sulfur quantitatively as white barium sulfate (BaSO4). Precipitate is filtered, ignited, and weighed: %S = (32 / 233.3) * (m_BaSO4 / m_compound) * 100.", "(3) Phosphorus: The compound is oxidized with fuming HNO3 to phosphoric acid (H3PO4). Phosphorus is precipitated as ammonium phosphomolybdate ((NH4)3PO4·12MoO3) by adding ammonia and ammonium molybdate, or as magnesium ammonium phosphate (MgNH4PO4) which is ignited to magnesium pyrophosphate (Mg2P2O7): %P = (62 / 222) * (m_Mg2P2O7 / m_compound) * 100."], "answer": "Halogens are precipitated as AgX; Sulfur is oxidized to H2SO4 and precipitated as BaSO4; Phosphorus is oxidized to H3PO4 and precipitated as ammonium phosphomolybdate or Mg2P2O7."}, {"q": "8.24", "number": "8.24", "title": "Principle of paper chromatography", "conceptIdx": 5, "page": 39, "printPage": 294, "question": "Explain the principle of paper chromatography.", "steps": ["Paper chromatography is a type of partition chromatography.", "Principle: The stationary phase consists of water molecules chemically bound or trapped within the cellulose fibers of the specialized chromatography paper.", "The mobile phase is an organic solvent or solvent mixture that flows over the paper strip by capillary action.", "As the mobile phase ascends past the spotted mixture, solute components partition continuously between the stationary aqueous phase and the moving organic phase.", "Components that are more soluble in the mobile phase travel faster and farther up the paper strip, while components with higher affinity for the stationary water phase travel more slowly.", "The position of each separated spot is identified by its characteristic Retention Factor (Rf): Rf = (Distance moved by component) / (Distance moved by solvent front)."], "answer": "Paper chromatography is partition chromatography: water trapped in cellulose fibers is the stationary phase; mobile solvent ascends by capillary action, separating components based on differential partition coefficients."}, {"q": "8.25", "number": "8.25", "title": "Necessity of boiling sodium extract with nitric acid before halogen test", "conceptIdx": 6, "page": 39, "printPage": 294, "question": "Why is nitric acid added to sodium extract before adding silver nitrate for testing halogens?", "steps": ["If nitrogen or sulfur is present in the organic compound, the Lassaigne sodium extract contains sodium cyanide (NaCN) or sodium sulfide (Na2S).", "If AgNO3 were added directly to this extract without prior acidification with HNO3, silver ions would react with cyanide and sulfide ions:", "NaCN + AgNO3 ⟶ AgCN↓ (white precipitate) + NaNO3", "Na2S + 2 AgNO3 ⟶ Ag2S↓ (black precipitate) + 2 NaNO3", "White AgCN and black Ag2S precipitates would mask or interfere with the detection of silver halide precipitates (AgCl, AgBr, AgI).", "Boiling the sodium extract with concentrated HNO3 decomposes cyanide and sulfide ions, expelling them as volatile gases:", "NaCN + HNO3 ⟶ NaNO3 + HCN↑ (gas expelled)", "Na2S + 2 HNO3 ⟶ 2 NaNO3 + H2S↑ (gas expelled)", "This eliminates all potential interference, ensuring that any precipitate formed upon adding AgNO3 is purely silver halide."], "answer": "Boiling with conc. HNO3 decomposes NaCN and Na2S into volatile HCN and H2S gases, preventing interference from white AgCN or black Ag2S precipitates during the silver nitrate test."}, {"q": "8.26", "number": "8.26", "title": "Reason for metallic sodium fusion in Lassaigne's test", "conceptIdx": 6, "page": 39, "printPage": 294, "question": "Explain the reason for the fusion of an organic compound with metallic sodium for testing nitrogen, sulphur and halogens.", "steps": ["In organic compounds, nitrogen, sulfur, and halogens are covalently bonded to carbon atoms (e.g., C-N, C-S, C-X).", "In this covalent state, these elements do not ionize in aqueous solution and therefore cannot participate in characteristic ionic precipitation or complexation reactions.", "Metallic sodium is a strong electropositive reducing agent with a very low ionization enthalpy.", "Fusing the organic substance with molten metallic sodium at red heat breaks the covalent bonds and converts the elements into simple, water-soluble ionic sodium salts:", "Na + C + N ⟶ Na⁺CN⁻ (ionic cyanide)", "2 Na + S ⟶ (Na⁺)2 S²⁻ (ionic sulfide)", "Na + X ⟶ Na⁺X⁻ (ionic halide)", "These ionic salts dissolve readily in water, allowing simple inorganic qualitative reagent tests to be performed."], "answer": "Sodium fusion converts covalently bonded, non-ionizable N, S, and X into water-soluble, ionic sodium salts (NaCN, Na2S, NaX) that readily undergo characteristic ionic analytical tests."}, {"q": "8.27", "number": "8.27", "title": "Separation of calcium sulphate and camphor", "conceptIdx": 5, "page": 39, "printPage": 294, "question": "Name a suitable technique of separation of the components from a mixture of calcium sulphate and camphor.", "steps": ["Examine physical properties of both components:", "• Camphor is a volatile organic solid that sublimes readily upon gentle heating, transitioning directly from solid to vapor without melting.", "• Calcium sulphate (CaSO4) is a non-volatile ionic salt with an extremely high melting point that does not sublime.", "Suitable Technique: Sublimation.", "Procedure: Place the mixture in a porcelain evaporating dish covered with an inverted perforated funnel plugged with cotton at the stem. Heat gently. Camphor sublimes and deposits as pure crystals on the cooler inner walls of the funnel, leaving non-volatile calcium sulphate behind in the dish."], "answer": "Sublimation: Camphor sublimes upon gentle heating and condenses on a cold surface, leaving non-volatile calcium sulphate behind."}, {"q": "8.28", "number": "8.28", "title": "Reason an organic liquid vaporises below boiling point in steam distillation", "conceptIdx": 5, "page": 39, "printPage": 294, "question": "Explain, why an organic liquid vaporises at a temperature below its boiling point in its steam distillation?", "steps": ["Steam distillation applies to liquids that are completely immiscible with water.", "According to Dalton's Law of Partial Pressures, each immiscible liquid exerts its own vapor pressure independently, as if the other were absent.", "The total vapor pressure (P_total) above the heterogeneous boiling mixture is the direct sum of the individual vapor pressures of the organic liquid (p1) and water (p2): P_total = p1 + p2.", "Boiling occurs when the total vapor pressure reaches atmospheric pressure: p1 + p2 = 760 mm Hg (1 atm).", "Since water exerts a significant vapor pressure (p2 > 0), the vapor pressure of the organic compound (p1 = 760 - p2) needs to be only a fraction of 1 atm.", "Consequently, the mixture boils at a temperature below 100 °C (the boiling point of pure water) and vastly below the higher normal boiling point of the organic liquid."], "answer": "Because the liquids are immiscible, P_total = p_organic + p_water = 1 atm. Since p_water > 0, the organic liquid reaches the required boiling pressure at a temperature below both 100 °C and its normal b.p."}, {"q": "8.29", "number": "8.29", "title": "Absence of AgCl precipitate upon heating carbon tetrachloride with AgNO3", "conceptIdx": 6, "page": 39, "printPage": 294, "question": "Will CCl4 give white precipitate of AgCl on heating it with silver nitrate? Give reason for your answer.", "steps": ["Answer: No, CCl4 will NOT give a white precipitate of AgCl with silver nitrate.", "Reason:", "1. Precipitation of AgCl requires the presence of free chloride ions (Cl⁻) in aqueous solution to react with Ag⁺ ions: Ag⁺(aq) + Cl⁻(aq) ⟶ AgCl(s)↓.", "2. Carbon tetrachloride (CCl4) is a non-polar organic compound possessing purely covalent carbon-chlorine bonds.", "3. Because CCl4 does not ionize in polar aqueous solution to liberate free Cl⁻ ions, no reaction takes place with AgNO3.", "Note: To detect chlorine in CCl4, it must first be fused with metallic sodium (Lassaigne's test) to convert covalent chlorine into ionic NaCl."], "answer": "No. CCl4 is purely covalent and does not ionize to release free Cl⁻ ions in solution; hence silver chloride cannot precipitate."}, {"q": "8.30", "number": "8.30", "title": "Role of KOH solution in absorbing carbon dioxide during Liebig's analysis", "conceptIdx": 6, "page": 39, "printPage": 294, "question": "Why is a solution of potassium hydroxide used to absorb carbon dioxide evolved during the estimation of carbon present in an organic compound?", "steps": ["During Liebig's combustion method, all carbon in the organic compound is quantitatively oxidized to carbon dioxide gas (CO2).", "Carbon dioxide is an acidic oxide, while potassium hydroxide (KOH) is a strong base.", "Concentrated KOH solution reacts rapidly, quantitatively, and irreversibly with CO2 to form soluble potassium carbonate: 2 KOH(aq) + CO2(g) ⟶ K2CO3(aq) + H2O(l).", "Potassium hydroxide is specifically preferred over calcium hydroxide (lime water) or sodium hydroxide because potassium carbonate (K2CO3) is exceptionally soluble in water, preventing precipitation and clogging of the potash bulbs.", "The gain in mass of the U-tube containing KOH directly equals the mass of CO2 absorbed."], "answer": "KOH is a strong alkali that reacts quantitatively with acidic CO2 to form highly soluble K2CO3 (2 KOH + CO2 ⟶ K2CO3 + H2O), without clogging the absorption tubes."}, {"q": "8.31", "number": "8.31", "title": "Use of acetic acid instead of sulfuric acid in lead acetate sulfur test", "conceptIdx": 6, "page": 39, "printPage": 294, "question": "Why is it necessary to use acetic acid and not sulphuric acid for acidification of sodium extract for testing sulphur by lead acetate test?", "steps": ["In the lead acetate test for sulfur, the sodium extract containing Na2S is acidified and treated with lead acetate solution ((CH3COO)2Pb).", "Lead ions react with sulfide ions to form a characteristic black precipitate of lead sulfide: Na2S + (CH3COO)2Pb ⟶ PbS(s)↓ (black) + 2 CH3COONa.", "If sulfuric acid (H2SO4) were used instead of acetic acid (CH3COOH) for acidification, the sulfate ions (SO4²⁻) introduced by H2SO4 would immediately react with lead ions:", "(CH3COO)2Pb + H2SO4 ⟶ PbSO4(s)↓ (dense white precipitate) + 2 CH3COOH.", "The formation of an insoluble white precipitate of lead sulfate (PbSO4) consumes lead ions and masks the black color of PbS, giving an erroneous, misleading test.", "Acetic acid introduces acetate ions which are already part of lead acetate and forms completely soluble lead salts, preventing interference."], "answer": "H2SO4 would react with lead acetate to form an insoluble white precipitate of PbSO4 ((CH3COO)2Pb + H2SO4 ⟶ PbSO4↓ + 2 CH3COOH), masking the black PbS precipitate."}, {"q": "8.32", "number": "8.32", "title": "Masses of CO2 and H2O produced from complete combustion of organic compound", "conceptIdx": 6, "page": 39, "printPage": 294, "question": "An organic compound contains 69% carbon and 4.8% hydrogen, the remainder being oxygen. Calculate the masses of carbon dioxide and water produced when 0.20 g of this substance is subjected to complete combustion.", "steps": ["Given: Mass of organic compound m = 0.20 g; %C = 69%; %H = 4.8%.", "1. Calculate mass of carbon in sample: m_C = (69 / 100) * 0.20 g = 0.138 g.", "2. Calculate mass of CO2 produced: Since 12 g of carbon produces 44 g of CO2:", "m_CO2 = m_C * (44 / 12) = 0.138 g * (44 / 12) = 0.506 g.", "3. Calculate mass of hydrogen in sample: m_H = (4.8 / 100) * 0.20 g = 0.0096 g.", "4. Calculate mass of H2O produced: Since 2 g of hydrogen produces 18 g of H2O:", "m_H2O = m_H * (18 / 2) = 0.0096 g * 9 = 0.0864 g."], "answer": "Mass of CO2 produced = 0.506 g (or 0.51 g); Mass of H2O produced = 0.0864 g (or 0.086 g)."}, {"q": "8.33", "number": "8.33", "title": "Percentage of nitrogen in compound by Kjeldahl's method", "conceptIdx": 6, "page": 39, "printPage": 294, "question": "A sample of 0.50 g of an organic compound was treated according to Kjeldahl's method. The ammonia evolved was absorbed in 50 mL of 0.5 M H2SO4. The residual acid required 60 mL of 0.5 M solution of NaOH for neutralisation. Find the percentage composition of nitrogen in the compound.", "steps": ["Given: Sample mass m = 0.50 g; Acid taken = 50 mL of 0.5 M H2SO4; Base used = 60 mL of 0.5 M NaOH.", "1. Express all volumes in terms of 1 M standard monobasic equivalents (normality):", "Initial H2SO4: 50 mL of 0.5 M H2SO4 = 50 * 2 * 0.5 = 50 mL of 1 N H2SO4 = 50 mL of 1 M acid equivalents.", "Residual acid neutralized by NaOH: 60 mL of 0.5 M NaOH = 60 * 0.5 = 30 mL of 1 N acid equivalents.", "2. Volume of 1 M acid neutralized by evolved ammonia = 50 - 30 = 20 mL of 1 N (or 1 M monobasic acid).", "3. Apply Kjeldahl's direct percentage formula: %N = (1.4 * N_acid * V_acid_consumed) / m_sample.", "%N = (1.4 * 1 * 20) / 0.50 = 28.0 / 0.50 = 56.0%."], "answer": "Percentage of nitrogen in the compound is 56.0%."}, {"q": "8.34", "number": "8.34", "title": "Percentage of chlorine in organic chloro compound by Carius method", "conceptIdx": 6, "page": 39, "printPage": 294, "question": "0.3780 g of an organic chloro compound gave 0.5740 g of silver chloride in Carius estimation. Calculate the percentage of chlorine present in the compound.", "steps": ["Given: Mass of organic compound m = 0.3780 g; Mass of AgCl precipitate m_AgCl = 0.5740 g.", "Molar mass of AgCl = 107.87 (Ag) + 35.45 (Cl) = 143.32 g/mol.", "1. Calculate mass of chlorine in AgCl precipitate:", "m_Cl = (35.45 / 143.32) * m_AgCl = (35.45 / 143.32) * 0.5740 g = 0.1420 g.", "2. Calculate percentage of chlorine in organic compound:", "%Cl = (m_Cl / m_compound) * 100 = (0.1420 g / 0.3780 g) * 100 = 37.566% ≈ 37.57% (or 37.6%)."], "answer": "Percentage of chlorine is 37.57% (or 37.6%)."}, {"q": "8.35", "number": "8.35", "title": "Percentage of sulfur in organic compound by Carius method", "conceptIdx": 6, "page": 39, "printPage": 294, "question": "In the estimation of sulphur by Carius method, 0.468 g of an organic sulphur compound afforded 0.668 g of barium sulphate. Find out the percentage of sulphur in the given compound.", "steps": ["Given: Mass of organic compound m = 0.468 g; Mass of BaSO4 precipitate m_BaSO4 = 0.668 g.", "Molar mass of BaSO4 = 137.33 (Ba) + 32.06 (S) + 4 * 16 (O) = 233.39 g/mol.", "1. Calculate mass of sulfur in BaSO4 precipitate:", "m_S = (32.06 / 233.39) * m_BaSO4 = (32.06 / 233.39) * 0.668 g = 0.09176 g.", "2. Calculate percentage of sulfur in organic compound:", "%S = (m_S / m_compound) * 100 = (0.09176 g / 0.468 g) * 100 = 19.607% ≈ 19.61% (or 19.6%)."], "answer": "Percentage of sulphur is 19.61% (or 19.6%)."}, {"q": "8.36", "number": "8.36", "title": "Hybridised orbital pair in C2-C3 bond of hex-1-en-5-yne", "conceptIdx": 0, "page": 39, "printPage": 294, "question": "In the organic compound CH2 = CH - CH2 - CH2 - C ≡ CH, the pair of hybridised orbitals involved in the formation of C2 - C3 bond is: (a) sp - sp², (b) sp - sp³, (c) sp² - sp³, (d) sp³ - sp³.", "steps": ["Number the carbon chain starting from the double bond end (lowest locant set (1,5) with tie-breaker giving 1 to alkene):", "C1(H2) = C2(H) - C3(H2) - C4(H2) - C5 ≡ C6(H).", "Identify hybridization of each carbon atom:", "• C1 is doubly bonded (=CH2) ⟹ sp².", "• C2 is doubly bonded (=CH-) with 3 σ bonds ⟹ sp².", "• C3 is singly bonded (-CH2-) with 4 σ bonds ⟹ sp³.", "• C4 is singly bonded (-CH2-) with 4 σ bonds ⟹ sp³.", "• C5 is triply bonded (-C≡) with 2 σ bonds ⟹ sp.", "• C6 is triply bonded (≡CH) with 2 σ bonds ⟹ sp.", "The bond between C2 and C3 is formed by the axial overlap of an sp² orbital from C2 and an sp³ orbital from C3.", "Therefore, the pair of hybridised orbitals is sp² - sp³."], "answer": "(c) sp² - sp³"}, {"q": "8.37", "number": "8.37", "title": "Chemical formula of Prussian blue in Lassaigne's test for nitrogen", "conceptIdx": 6, "page": 39, "printPage": 294, "question": "In the Lassaigne's test for nitrogen in an organic compound, the Prussian blue colour is obtained due to the formation of: (a) Na4[Fe(CN)6], (b) Fe4[Fe(CN)6]3, (c) Fe2[Fe(CN)6], (d) Fe3[Fe(CN)6]4.", "steps": ["In Lassaigne's test, sodium cyanide reacts with ferrous sulfate to form sodium ferrocyanide:", "6 NaCN + FeSO4 ⟶ Na4[Fe(CN)6] + Na2SO4.", "On boiling and acidifying with concentrated sulfuric acid, some Fe²⁺ is oxidized to Fe³⁺ (ferric ions).", "Ferric ions react with ferrocyanide to form the intense Prussian blue precipitate of ferric ferrocyanide (iron(III) hexacyanoferrate(II)):", "4 Fe³⁺ + 3 [Fe(CN)6]⁴⁻ ⟶ Fe4[Fe(CN)6]3·xH2O.", "Therefore, the correct formula is Fe4[Fe(CN)6]3."], "answer": "(b) Fe4[Fe(CN)6]3"}, {"q": "8.38", "number": "8.38", "title": "Identifying the most stable carbocation", "conceptIdx": 3, "page": 39, "printPage": 294, "question": "Which of the following carbocation is most stable? (a) (CH3)3C-CH2⁺, (b) (CH3)3C⁺, (c) CH3CH2CH2⁺, (d) CH3-CH⁺-CH2CH3.", "steps": ["Evaluate the class and stability factors of each carbocation:", "(a) (CH3)3C-CH2⁺: Primary (1°) carbocation with 0 α-hydrogens on C⁺.", "(b) (CH3)3C⁺ (tert-butyl cation): Tertiary (3°) carbocation with three methyl groups directly attached to C⁺. Possesses 9 α-hydrogens, enabling 9 hyperconjugative structures and strong +I electron donation.", "(c) CH3CH2CH2⁺ (propyl cation): Primary (1°) carbocation with 2 α-hydrogens.", "(d) CH3-CH⁺-CH2CH3 (sec-butyl cation): Secondary (2°) carbocation with 5 α-hydrogens.", "Carbocation stability follows: 3° > 2° > 1°. The tertiary carbocation (CH3)3C⁺ is by far the most stable."], "answer": "(b) (CH3)3C⁺"}, {"q": "8.39", "number": "8.39", "title": "Best and latest technique for separation and purification of organic compounds", "conceptIdx": 5, "page": 39, "printPage": 294, "question": "The best and latest technique for isolation, purification and separation of organic compounds is: (a) Crystallisation, (b) Distillation, (c) Sublimation, (d) Chromatography.", "steps": ["Chromatography is the modern, highly sensitive, and universally versatile separation technique invented by Mikhail Tswett.", "Unlike traditional distillation or crystallization (which require large sample masses and significant boiling/solubility differences), chromatographic methods (TLC, HPLC, GC) can isolate and purify microgram quantities of complex, thermally fragile, and multi-component organic mixtures with extremely high resolution.", "Therefore, chromatography represents the best and most advanced technique."], "answer": "(d) Chromatography"}, {"q": "8.40", "number": "8.40", "title": "Classification of reaction: ethyl iodide with aqueous potassium hydroxide", "conceptIdx": 3, "page": 39, "printPage": 294, "question": "The reaction: CH3CH2I + KOH(aq) -> CH3CH2OH + KI is classified as: (a) electrophilic substitution, (b) nucleophilic substitution, (c) elimination, (d) addition.", "steps": ["In this reaction, aqueous KOH dissociates to furnish hydroxide ions (OH⁻).", "Hydroxide ion acts as an electron-rich nucleophile that attacks the partially positive carbon atom attached to iodine in ethyl iodide (CH3CH2-I).", "The iodide ion (I⁻), being a good leaving group, departs with its bonding pair of electrons.", "Because an incoming nucleophile (OH⁻) replaces a leaving group (I⁻), the transformation is classified as Nucleophilic Substitution (specifically, bimolecular nucleophilic substitution, SN2).", "(Note: If alcoholic KOH were used instead of aqueous KOH, beta-elimination to ethene would predominate)."], "answer": "(b) nucleophilic substitution"}], "revision_summary": {"key_laws": [{"name": "Tetravalency & Hybridization", "formula": "sp³ (109.5°, 25% s), sp² (120°, 33.3% s), sp (180°, 50% s)", "context": "Higher s-character increases electronegativity (sp-C > sp²-C > sp³-C) and bond strength while decreasing bond length."}, {"name": "IUPAC Nomenclature Hierarchy", "formula": "Secondary Prefix + Primary Prefix + Word Root + Primary Suffix + Secondary Suffix", "context": "Principal functional group takes lowest locant precedence: -COOH > -SO₃H > -COOR > -COCl > -CONH₂ > -CN > -CHO > >C=O > -OH > -NH₂ > C=C > C≡C."}, {"name": "Carbocation Stability Order", "formula": "3° > 2° > 1° > CH₃⁺ (Governed by Hyperconjugation & +I effect)", "context": "Number of hyperconjugative α-hydrogens directly correlates with thermodynamic stability ((CH₃)₃C⁺ has 9 α-H)."}, {"name": "Inductive & Electromeric Effects", "formula": "Inductive: permanent σ-electron shift (distance-dependent, dies by C4); Electromeric: temporary complete π-electron transfer on demand", "context": "+I stabilizes carbocations; -I stabilizes carbanions and increases carboxylic acid acidity."}, {"name": "Steam Distillation Law", "formula": "P_total = p_org + p_water = 1 atm; m_org / m_water = (p_org · M_org) / (p_water · M_water)", "context": "Organic liquid vaporizes well below its normal boiling point in presence of steam without thermal decomposition."}, {"name": "Liebig Combustion Analysis", "formula": "%C = (12/44) · (m_CO₂ / m) · 100; %H = (2/18) · (m_H₂O / m) · 100", "context": "Sample burned completely in dry O₂ over CuO; CO₂ absorbed in KOH bulbs, H₂O absorbed in anhydrous CaCl₂ guard tube."}, {"name": "Kjeldahl Nitrogen Formula", "formula": "%N = (1.4 · N · V) / m_sample", "context": "Organic nitrogen converted to (NH₄)₂SO₄ by conc. H₂SO₄, distilled with NaOH into standard acid; invalid for azo, nitro, and ring pyridine nitrogen."}, {"name": "Carius Halogen & Sulfur Analysis", "formula": "%X = (Atomic Wt X / AgX) · (m_AgX / m) · 100; %S = (32 / 233) · (m_BaSO₄ / m) · 100", "context": "Digestion with fuming HNO₃ and AgNO₃ (for halogen) or BaCl₂ (for sulfur precipitate)."}], "common_pitfalls": ["Violating the lowest sum / lowest locant rule in IUPAC naming by prioritizing alphabetization before verifying the lowest numerical set of locants.", "Applying Kjeldahl's method to nitro compounds, azo dyes, or pyridine rings where nitrogen is not converted quantitatively to ammonium sulfate.", "Confusing inductive effect (permanent polarization along σ-bonds, rapidly decaying with distance) with electromeric effect (temporary polarizability requiring attacking reagent).", "Assuming hyperconjugation involves lone pairs; hyperconjugation is no-bond resonance involving overlap of adjacent filled C-H σ-bonding orbitals with empty p-orbitals or π*-orbitals.", "Using sulfuric acid instead of dilute nitric acid when boiling Lassaigne's filtrate prior to adding AgNO₃; H₂SO₄ does not decompose NaCN and Na₂S, causing false AgCN or Ag₂S precipitates."]}};

<script>
(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp) disp.innerHTML = "t = <b>" + state.t.toFixed(1) + " s</b>";
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Concept View ---
  function renderConcept(idx){
    pause();
    state.conceptIndex = idx;
    state.t = 0;
    state.level = 0;

    var lessons = C.lessons || C.concepts || [];
    var l = lessons[idx];
    if(!l) return;

    var navTitle = l.nav || l.navTitle || l.title || ("Concept " + (idx + 1));

    // Update sidebar navigation active state
    var navBtns = document.querySelectorAll(".concept-nav");
    navBtns.forEach(function(b, i){
      if(b.id === "nav-revision") b.classList.remove("active");
      else b.classList.toggle("active", i === idx);
    });

    // Update top crumb
    var rawNum = C.chapterNumber || (C.chapter_meta && C.chapter_meta.number) || (C.code ? C.code.replace(/\D/g, '') : "01");
    var chNum = (!isNaN(parseInt(rawNum))) ? String(rawNum).padStart(2, '0') : rawNum;
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · " + navTitle.toUpperCase();

    // Show concept view, hide revision
    var cView = document.getElementById("concept-view");
    var rView = document.getElementById("revision-view");
    if(cView) cView.style.display = "block";
    if(rView) rView.style.display = "none";

    var html = "";

    // Concept Header
    var minutes = l.minutes || 10;
    var printPage = l.print || (l.pages ? l.pages.join("–") : (C.page_start ? "pp. " + C.page_start + "–" + C.page_end : ""));
    html += '<div class="concept-header">' +
      '<div class="concept-badge"><span>Concept ' + ("0" + (idx + 1)).slice(-2) + ' / ' + ("0" + lessons.length).slice(-2) + '</span>' +
      (printPage ? '<span class="time-pill">≈ ' + minutes + ' min · ' + printPage + '</span>' : '<span class="time-pill">≈ ' + minutes + ' min</span>') +
      '</div>' +
      '<h1 class="concept-title">' + (l.title || navTitle) + '</h1>' +
      '<p class="concept-deck">' + (l.deck || l.summary || "") + '</p>' +
      '</div>';

    // 01 LEARN BLOCK
    html += '<section class="learn-section" data-block="learn" aria-label="Learn Concept">' +
      '<span class="block-tag">01 · LEARN · CORE ESSENTIALS</span>';

    var quickItems = [];
    if(Array.isArray(l.quick)) {
      quickItems = l.quick;
    } else if(typeof l.quick === 'string' && l.quick) {
      quickItems = [l.quick];
    } else if(Array.isArray(l.summary)) {
      quickItems = l.summary;
    } else if(l.reading_content) {
      quickItems = [l.reading_content];
    } else if(l.summary || l.deck) {
      quickItems = [l.summary || l.deck];
    }

    html += '<div class="quick-summary">' + quickItems.map(function(p){
      if(typeof p !== 'string') return '';
      if(p.includes('<p>') || p.includes('<div>') || p.includes('<h3>')) return p;
      var formatted = p.replace(/###\s+(.*?)\n/g, '<h3 style="margin-top:16px;color:var(--ink);">$1</h3>')
                       .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                       .replace(/\*(.*?)\*/g, '<em>$1</em>')
                       .replace(/\n\n/g, '</p><p>');
      return '<p>' + formatted + '</p>';
    }).join("") + '</div>';

    // Semantic Equations Card
    var formulas = l.formulas || [];
    if(formulas.length){
      html += '<div class="key-equations-card">' +
        '<div class="equations-heading">Key Relations for this Concept</div>' +
        '<div class="eq-grid">' +
        formulas.map(function(eq){
          var label = eq.label || eq.name || "Relation";
          var cond = eq.cond || "";
          var math = eq.html || eq.formula || "";
          return '<div class="eq-row">' +
            '<div class="eq-meta"><span class="eq-label">' + label + '</span>' + (cond ? '<span class="eq-cond">' + cond + '</span>' : '') + '</div>' +
            '<div class="eq-math">' + math + '</div>' +
            '</div>';
        }).join("") +
        '</div></div>';
    }

    // Deeper dive / core takeaways
    if(l.deeper){
      html += '<details class="deep-dive"><summary>Go deeper into the conceptual foundation</summary><p>' + l.deeper + '</p></details>';
    } else if(l.takeaways && l.takeaways.length){
      html += '<details class="deep-dive"><summary>Key Conceptual Takeaways</summary><ul>' +
        l.takeaways.map(function(t){ return '<li>' + t + '</li>'; }).join("") +
        '</ul></details>';
    }

    // Worked Example
    var worked = l.worked || l.worked_example;
    if(worked){
      var workedHtml = typeof worked === 'object' && worked !== null
        ? '<strong>' + (worked.title || 'Worked Example') + '</strong><br>' + (worked.problem || '') +
          (worked.given ? '<br><br><strong>Given:</strong> ' + worked.given : '') +
          (worked.steps ? '<br><strong>Steps:</strong><br>' + worked.steps.map(function(s){ return '&bull; ' + s; }).join('<br>') : '') +
          (worked.solution ? '<br><br><strong>Solution:</strong> ' + worked.solution : '') +
          (worked.answer ? '<br><br><strong>Answer:</strong> ' + worked.answer : '')
        : String(worked);
      html += '<details class="deep-dive"><summary>Worked textbook example step by step</summary><p>' + workedHtml + '</p></details>';
    }

    html += '</section>';

    // 02 PREDICT FIRST BLOCK
    var pred = l.prediction || l.predict || l.predict_first;
    if(pred && typeof pred === 'object' && (pred.prompt || pred.scenario) && pred.options && pred.options.length){
      var promptText = pred.prompt || pred.scenario || "";
      html += '<section class="predict-card" data-block="predict" aria-label="Predict First">' +
        '<div class="predict-badge">02 · PREDICT FIRST · TEST YOUR INTUITION</div>' +
        '<div class="predict-prompt">' + promptText.replace(/\n/g, '<br>') + '</div>' +
        '<div class="predict-options" id="predict-options">' +
        pred.options.map(function(opt, oi){
          return '<label class="predict-option"><input type="radio" name="predict_ans" value="' + oi + '"><span>' + opt + '</span></label>';
        }).join("") +
        '</div>' +
        '<div class="predict-actions">' +
        '<button class="btn-primary" id="btn-check-prediction">Check Prediction</button>' +
        '<button class="btn-secondary" id="btn-skip-prediction">Skip to Lab</button>' +
        '</div>' +
        '<div id="predict-feedback-box" class="predict-feedback" style="display:none;"></div>' +
        '</section>';
    }

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();
    var whatWatch = (pred && pred.prompt) ? pred.prompt : (typeof l.predict === 'string' ? l.predict : "Explore the interactive simulation controls, parameters, and readouts below.");
    html += '<section class="lab-card" data-block="play" aria-label="Interactive Laboratory">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +
      '<div id="sim-mount-point" class="sim-mount-container" style="width:100%;min-height:220px;margin-top:12px;">' +
        '<div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 720 300" role="img" aria-label="' + simTitle + '"></svg></div>' +
        '<div class="lab-legend" id="lab-legend"></div>' +
        '<div class="lab-toolbar" id="legacy-lab-toolbar">' +
          '<button class="toolbar-btn primary" id="btn-play-pause" aria-label="Play animation">▶ Play</button>' +
          '<button class="toolbar-btn" id="btn-step-fwd" aria-label="Step forward">⏭ Step (+0.5s)</button>' +
          '<button class="toolbar-btn" id="btn-reset-time" aria-label="Reset timeline">↺ Reset</button>' +
          '<span class="time-display" id="time-display">t = <b>0.0 s</b></span>' +
          '<div class="scrubber-wrap">' +
            '<input type="range" id="time-scrubber" class="timeline-scrubber" min="0" max="6" step="0.1" value="0" aria-label="Timeline time scrubber">' +
          '</div>' +
        '</div>' +
        '<div class="preset-bar" id="preset-bar"></div>' +
        '<div class="lab-controls-grid" id="lab-controls"></div>' +
        '<div class="lab-readout" id="lab-readout" role="status" aria-live="polite"></div>' +
        '<div class="lab-verdict" id="lab-verdict" role="status" aria-live="polite"></div>' +
      '</div>' +
      '</section>';

    // 04 CONNECT BLOCK
    var rawConnect = l.connect || [];
    var connectItems = [];
    if (typeof rawConnect === 'string' && rawConnect.trim()) {
      connectItems = [{ title: "Real-World Application", text: rawConnect }];
    } else if (Array.isArray(rawConnect)) {
      connectItems = rawConnect;
    } else if (rawConnect && typeof rawConnect === 'object') {
      connectItems = [rawConnect];
    }

    if(connectItems.length){
      html += '<section class="connect-section" data-block="connect" aria-label="Real World Connections">' +
        '<span class="block-tag">04 · CONNECT · REAL WORLD APPLICATIONS</span>' +
        '<div class="connect-grid">' +
        connectItems.map(function(item){
          var title = typeof item === 'string' ? "Real World Application" : (Array.isArray(item) ? item[0] : (item.title || "Real World Context"));
          var desc = typeof item === 'string' ? item : (Array.isArray(item) ? item[1] : (item.text || item.desc || ""));
          var links = (typeof item === 'object' && item !== null) ? (Array.isArray(item) ? (item[2] || []) : (item.links || (item.link ? [{t: "Read Deeply", u: item.link}] : []))) : [];
          var v = (typeof item === 'object' && item !== null) ? (Array.isArray(item) ? (item[3] || null) : (item.video || null)) : null;
          var wow = /^Wow/i.test(title);

          var cHtml = '<div class="connect-card' + (wow ? ' wow' : '') + '"' + (wow ? (links[0] && links[0].u ? ' data-wow data-source="' + links[0].u + '"' : ' data-wow') : '') + '>';
          if(wow) cHtml += '<span class="wow-badge">WOW · REAL WORLD</span>';
          cHtml += '<h3>' + title + '</h3><p>' + desc + '</p>';
          if(v && v.id){
            cHtml += '<button class="video-facade" data-yt="' + v.id + '" aria-label="Play video: ' + v.title + '">' +
              '<span class="thumb" aria-hidden="true"></span>' +
              '<span class="play-btn">▶</span>' +
              '<span class="video-title">' + v.title + ' · ' + v.channel + '</span>' +
              '</button>';
          }
          if(links && links.length){
            cHtml += '<p style="margin-top:10px;font-size:12px;color:var(--muted)">References: ' +
              links.map(function(a){ return '<a href="' + (a.u || a.link || "#") + '" target="_blank" rel="noopener">' + (a.t || a.label || "Read Deeply") + ' ↗</a>'; }).join(", ") +
              '</p>';
          }
          cHtml += '</div>';
          return cHtml;
        }).join("") +
        '</div></section>';
    }

    // 05 PRACTICE BLOCK
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(quizzes.length){
      html += '<section class="practice-section" data-block="practice" aria-label="Practice and Mastery">' +
        '<span class="block-tag">05 · PRACTICE · MULTI-TIER CHALLENGE</span>' +
        '<div class="practice-nav">';
      for(var qi = 0; qi < quizzes.length; qi++){
        var tierName = qi === 0 ? "Tier 1: Easy" : (qi === 1 ? "Tier 2: Medium" : (qi === 2 ? "Tier 3: Hard" : "Question " + (qi + 1)));
        html += '<button class="level-tab' + (qi === 0 ? ' active' : '') + '" data-lvl="' + qi + '">' + tierName + '</button>';
      }
      html += '</div>' +
        '<div id="quiz-container"></div>' +
        '</section>';
    }

    // 06 REVISE CALLOUT
    var recall = l.recall || (l.takeaways && l.takeaways.length ? l.takeaways[0] : (l.core_takeaways && l.core_takeaways.length ? l.core_takeaways[0] : "Reflect on how this concept connects to physical reality."));
    html += '<div class="revise-callout"><strong>06 · REVISE · SAY IT IN YOUR OWN WORDS:</strong> ' + recall + '</div>';

    // Footer Navigation
    var nextNav = idx < lessons.length - 1 ? (lessons[idx + 1].nav || lessons[idx + 1].navTitle || lessons[idx + 1].title || ("Concept " + (idx + 2))) : "";
    html += '<div class="concept-footer-nav">' +
      (idx > 0 ? '<button class="btn-secondary" id="btn-prev-concept">← Concept ' + ("0" + idx).slice(-2) + '</button>' : '<span></span>') +
      (idx < lessons.length - 1 ? '<button class="btn-primary" id="btn-next-concept">Concept ' + ("0" + (idx + 2)).slice(-2) + ': ' + nextNav + ' →</button>' : '<button class="btn-primary" id="btn-goto-revision">Chapter Revision & Exercises →</button>') +
      '</div>';

    cView.innerHTML = html;

    // Attach Prediction Listeners
    var btnCheckPred = document.getElementById("btn-check-prediction");
    var btnSkipPred = document.getElementById("btn-skip-prediction");
    if(btnCheckPred && pred){
      btnCheckPred.addEventListener("click", function(){
        var sel = document.querySelector('input[name="predict_ans"]:checked');
        var fb = document.getElementById("predict-feedback-box");
        if(!sel){
          fb.style.display = "block";
          fb.className = "predict-feedback revealed";
          fb.textContent = "Please select one of the predictions first.";
          return;
        }
        var chosen = Number(sel.value);
        var expectedAns = pred.answer !== undefined ? pred.answer : (pred.correct !== undefined ? pred.correct : 0);
        var isRight = chosen === expectedAns;
        fb.style.display = "block";
        fb.className = "predict-feedback " + (isRight ? "correct" : "revealed");
        fb.innerHTML = (isRight ? "<b>Spot on!</b> " : "<b>Good thought! Here is the physical principle:</b> ") + (pred.explanation || "");
      });
    }
    if(btnSkipPred && pred){
      btnSkipPred.addEventListener("click", function(){
        var fb = document.getElementById("predict-feedback-box");
        fb.style.display = "block";
        fb.className = "predict-feedback revealed";
        fb.innerHTML = "<b>Key Principle:</b> " + (pred.explanation || "");
      });
    }

    // Attach Timeline Controls for legacy SIMS
    var btnPP = document.getElementById("btn-play-pause");
    if(btnPP) btnPP.addEventListener("click", function(){ if(state.playing) pause(); else play(); });
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep) btnStep.addEventListener("click", function(){ step(0.5); });
    var btnResTime = document.getElementById("btn-reset-time");
    if(btnResTime) btnResTime.addEventListener("click", function(){ resetTimeline(); });
    var scrub = document.getElementById("time-scrubber");
    if(scrub) scrub.addEventListener("input", function(e){ seekTimeline(e.target.value); });

    // Footer Next/Prev listeners
    var btnPrev = document.getElementById("btn-prev-concept");
    var btnNext = document.getElementById("btn-next-concept");
    var btnRev = document.getElementById("btn-goto-revision");
    if(btnPrev) btnPrev.addEventListener("click", function(){ renderConcept(idx - 1); window.scrollTo(0,0); });
    if(btnNext) btnNext.addEventListener("click", function(){ renderConcept(idx + 1); window.scrollTo(0,0); });
    if(btnRev) btnRev.addEventListener("click", function(){ renderRevision(); window.scrollTo(0,0); });

    // Mount Active Simulation Engine
    var simMount = document.getElementById("sim-mount-point");
    if(simMount){
      var cKey = "c" + (idx + 1);
      var conceptId = l.id || ("concept-" + (idx + 1));
      var simId = l.sim || conceptId;

      // 1. window.mountSimulation (iemh101, iemh102)
      if(typeof window.mountSimulation === 'function'){
        simMount.innerHTML = "";
        window.mountSimulation(cKey, simMount);
      }
      // 2. window.SIM_ENGINES (iemh101-iemh105)
      else if(window.SIM_ENGINES && window.SIM_ENGINES[cKey] && typeof window.SIM_ENGINES[cKey].init === 'function'){
        simMount.innerHTML = "";
        window.SIM_ENGINES[cKey].init(simMount);
      }
      // 3. window.SimEngine (iemh106-iemh108)
      else if(window.SimEngine && typeof window.SimEngine.init === 'function'){
        var targetKey = null;
        var candidateKeys = [conceptId, "sim-" + conceptId, "sim-concept-" + (idx + 1), "concept-" + (idx + 1), simId, cKey];
        for(var k = 0; k < candidateKeys.length; k++){
          if(candidateKeys[k] && window.SimEngine.getEngine(candidateKeys[k])){
            targetKey = candidateKeys[k];
            break;
          }
        }
        if(targetKey){
          simMount.innerHTML = "";
          window.SimEngine.init(targetKey, simMount);
        }
      }
      // 4. window.SIMS (iesc101-iesc113)
      else if(window.SIMS && (window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey])){
        var simObj = window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey];
        if(typeof simObj.mount === 'function'){
          if(simObj.mount.length >= 1 && !simObj.draw){
            simMount.innerHTML = "";
            simObj.mount(simMount);
          } else {
            simObj.mount(l);
          }
        }
      }
    }

    // Render Quiz for current level
    renderQuiz();

    // Attach Practice Level Tabs
    var lvlTabs = document.querySelectorAll(".level-tab");
    lvlTabs.forEach(function(tab){
      tab.addEventListener("click", function(){
        lvlTabs.forEach(function(t){ t.classList.remove("active"); });
        tab.classList.add("active");
        state.level = Number(tab.getAttribute("data-lvl"));
        renderQuiz();
      });
    });

    // Update URL hash
    window.location.hash = "#concept-" + (idx + 1);
  }

  // --- Render Quiz ---
  function renderQuiz(){
    var lessons = C.lessons || C.concepts || [];
    var l = lessons[state.conceptIndex];
    if(!l) return;
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(!quizzes.length) return;
    var q = quizzes[state.level] || quizzes[0];
    if(!q) return;

    var qk = qKey(state.conceptIndex, state.level);
    var old = state.answers[qk] || {};

    var box = document.getElementById("quiz-container");
    if(!box) return;

    var promptText = q.prompt || q.question || "";
    var isMcq = q.type === "mcq" || (q.options && q.options.length > 0);
    var correctAns = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : 0);
    var solutionText = q.solution || q.explanation || "";
    var hintText = q.hint || "Review the key relationships in the concept overview above.";

    var html = '<div class="question-prompt">' + promptText + '</div>';
    if(isMcq && q.options){
      html += '<div class="quiz-options">' +
        q.options.map(function(opt, oi){
          var checked = old.value === String(oi) ? " checked" : "";
          return '<label class="quiz-option"><input type="radio" name="quiz_ans" value="' + oi + '"' + checked + '><span>' + opt + '</span></label>';
        }).join("") +
        '</div>';
    } else {
      html += '<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">' +
        '<input type="number" step="any" id="quiz_num_ans" placeholder="Your answer" value="' + (old.value || "") + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;width:160px;">' +
        '<span style="font-weight:600;color:var(--muted);">' + (q.unit || "") + '</span>' +
        '</div>';
    }

    html += '<div class="quiz-actions">' +
      '<button class="btn-primary" id="btn-submit-quiz">Submit Answer</button>' +
      '<button class="btn-secondary" id="btn-toggle-hint">Show Hint</button>' +
      '</div>' +
      '<div id="quiz-hint-box" class="quiz-hint" style="display:none;">' + hintText + '</div>' +
      '<div id="quiz-feedback-box" class="quiz-feedback" style="display:none;"></div>';

    box.innerHTML = html;

    // Hint toggle
    var hintBtn = document.getElementById("btn-toggle-hint");
    if(hintBtn){
      hintBtn.addEventListener("click", function(){
        var hb = document.getElementById("quiz-hint-box");
        if(hb) hb.style.display = hb.style.display === "none" ? "block" : "none";
      });
    }

    // Submit listener
    var submitBtn = document.getElementById("btn-submit-quiz");
    if(submitBtn){
      submitBtn.addEventListener("click", function(){
        var fb = document.getElementById("quiz-feedback-box");
        if(!fb) return;
        var isRight = false;
        var userVal = "";

        if(isMcq){
          var sel = document.querySelector('input[name="quiz_ans"]:checked');
          if(!sel){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please select an answer choice first.";
            return;
          }
          userVal = sel.value;
          isRight = Number(userVal) === Number(correctAns);
        } else {
          var inp = document.getElementById("quiz_num_ans");
          if(!inp || inp.value.trim() === ""){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please enter a numerical answer.";
            return;
          }
          userVal = inp.value.trim();
          var num = parseFloat(userVal);
          isRight = Math.abs(num - parseFloat(correctAns)) <= (q.tolerance || 0.05);
        }

        state.answers[qk] = { value: userVal, checked: true };
        if(isRight){
          state.correct[qk] = true;
          fb.style.display = "block";
          fb.className = "quiz-feedback success";
          fb.innerHTML = "<b>That’s right!</b> " + solutionText;
        } else {
          fb.style.display = "block";
          fb.className = "quiz-feedback retry";
          var wrongMsg = (isMcq && q.wrong && q.wrong[Number(userVal)]) ? q.wrong[Number(userVal)] : hintText;
          fb.innerHTML = "<b>Not quite.</b> " + wrongMsg + "<br><small style=\"margin-top:6px;display:block;\"><b>Full explanation:</b> " + solutionText + "</small>";
        }
        updateProgress();
      });
    }

    if(old.checked && submitBtn){
      submitBtn.click();
    }
  }

  // --- Render Revision View ---
  var currentExFilter = -1;

  function renderRevision(){
    pause();
    document.querySelectorAll(".concept-nav").forEach(function(b){ b.classList.remove("active"); });
    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.classList.add("active");

    var rawNum = C.chapterNumber || (C.chapter_meta && C.chapter_meta.number) || (C.code ? C.code.replace(/\D/g, '') : "01");
    var chNum = (!isNaN(parseInt(rawNum))) ? String(rawNum).padStart(2, '0') : rawNum;
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · NCERT EXERCISES & REVISION";

    var cView = document.getElementById("concept-view");
    var revView = document.getElementById("revision-view");
    if(cView) cView.style.display = "none";
    if(revView) revView.style.display = "block";

    var exList = C.exercises || [];
    if(!exList.length && C.exerciseMap){
      exList = C.exerciseMap.map(function(m){
        return {
          q: m[0],
          number: String(m[0]),
          title: m[1],
          conceptIdx: m[2],
          page: m[3],
          printPage: 47 + m[3],
          question: m[4] || m[1],
          steps: [m[5] || "Refer to concept explanation."],
          answer: m[5] || ""
        };
      });
    }

    var totalEx = exList.length;
    var html = '<div class="concept-header">' +
      '<span class="concept-badge">NCERT EXERCISE COMPENDIUM</span>' +
      '<h1 class="concept-title">Revise, Reflect, Refine</h1>' +
      '<p class="concept-deck">All ' + totalEx + ' exercises from NCERT Class 11 Physics with comprehensive step-by-step pedagogical solutions.</p>' +
      '</div>';

    // Filter Bar & Expand/Collapse All
    var lessons = C.lessons || C.concepts || [];
    html += '<div class="exercise-compendium-header">' +
      '<div class="exercise-filter-bar">' +
      '<button class="filter-chip ' + (currentExFilter === -1 ? 'active' : '') + '" data-cfilter="-1">All Exercises (' + totalEx + ')</button>' +
      lessons.map(function(l, li){
        var nav = l.nav || l.navTitle || l.title || ("C0" + (li+1));
        return '<button class="filter-chip ' + (currentExFilter === li ? 'active' : '') + '" data-cfilter="' + li + '">C0' + (li+1) + ': ' + nav + '</button>';
      }).join("") +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn-secondary" id="btn-expand-all" style="padding:6px 12px;font-size:13px;">Expand All Guidance</button>' +
      '<button class="btn-secondary" id="btn-collapse-all" style="padding:6px 12px;font-size:13px;">Collapse All</button>' +
      '</div>' +
      '</div>';

    // Exercise Cards List
    html += '<div id="exercise-cards-container">';
    var filtered = currentExFilter === -1 ? exList : exList.filter(function(e){
      return e.conceptIdx === currentExFilter || (e.section && e.section.includes(String(currentExFilter + 1)));
    });

    html += filtered.map(function(ex, eIdx){
      var qNum = ex.number || ex.q || (eIdx + 1);
      var sectionLabel = ex.section ? ('<span class="q-badge" style="background:#e0f2fe;color:#0369a1;margin-right:6px;">' + ex.section + '</span>') : '';
      var l = (ex.conceptIdx !== undefined && lessons[ex.conceptIdx]) ? lessons[ex.conceptIdx] : null;
      var conceptLink = l ? ('<a href="#concept-' + (ex.conceptIdx + 1) + '" class="q-concept-link" data-idx="' + ex.conceptIdx + '">Explore in Concept ' + ("0" + (ex.conceptIdx + 1)).slice(-2) + ' (' + (l.nav || l.navTitle || l.title) + ') ↗</a>') : '';

      var guidanceHtml = "";
      if(ex.guidance){
        if(typeof ex.guidance === 'string'){
          guidanceHtml = ex.guidance;
        } else if(Array.isArray(ex.guidance)){
          guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
            (ex.answer ? '<p><strong>Answer:</strong> ' + ex.answer + '</p>' : '') +
            '<ol>' + ex.guidance.map(function(g){ return '<li>' + g + '</li>'; }).join('') + '</ol></div>';
        }
      } else if(ex.steps && ex.steps.length){
        guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
          (ex.given ? '<div class="given-data"><b>Given:</b> ' + ex.given + '</div>' : '') +
          '<ol class="solution-steps">' + ex.steps.map(function(st){ return '<li>' + st + '</li>'; }).join('') + '</ol>' +
          (ex.answer ? '<div class="answer-box"><b>Final Answer:</b> ' + ex.answer + '</div>' : '') +
          '</div>';
      }

      return '<article class="exercise-card" id="exercise-q' + qNum + '">' +
        '<div class="exercise-card-meta">' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
        sectionLabel +
        '<span class="q-badge">QUESTION ' + qNum + '</span>' +
        '</div>' +
        conceptLink +
        '</div>' +
        
        '<div class="exercise-question-text" style="font-size:15px;line-height:1.6;margin:12px 0;white-space:pre-wrap;">' + (ex.question || ex.title || "") + '</div>' +
        
        '<details class="exercise-drawer">' +
        '<summary class="exercise-drawer-btn">📖 View Step-by-Step Guidance & Full Solution</summary>' +
        '<div class="exercise-solution-body" style="padding:14px;background:#f8fafc;border-radius:8px;margin-top:8px;">' +
        guidanceHtml +
        '</div>' +
        '</details>' +
        '</article>';
    }).join("");

    html += '</div>';

    revView.innerHTML = html;

    // Attach Filter Listeners
    revView.querySelectorAll(".filter-chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        currentExFilter = Number(chip.getAttribute("data-cfilter"));
        renderRevision();
      });
    });

    // Attach Expand/Collapse All Listeners
    var btnExp = document.getElementById("btn-expand-all");
    var btnCol = document.getElementById("btn-collapse-all");
    if(btnExp){
      btnExp.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = true; });
      });
    }
    if(btnCol){
      btnCol.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = false; });
      });
    }

    // Concept Navigation Links
    revView.querySelectorAll(".q-concept-link").forEach(function(a){
      a.addEventListener("click", function(e){
        e.preventDefault();
        var cIdx = Number(a.getAttribute("data-idx"));
        renderConcept(cIdx);
        window.scrollTo(0, 0);
      });
    });

    window.location.hash = "#revision";
  }

  // --- Build Sidebar Nav ---
  function buildSidebar(){
    var navContainer = document.getElementById("sidebar-nav");
    if(!navContainer) return;
    var lessons = C.lessons || C.concepts || [];
    navContainer.innerHTML = lessons.map(function(l, i){
      var nav = l.nav || l.navTitle || l.title || ("Concept " + (i + 1));
      return '<button class="concept-nav" data-cidx="' + i + '">' +
        '<span class="num">' + ("0" + (i + 1)).slice(-2) + '</span>' +
        '<span>' + nav + '</span>' +
        '</button>';
    }).join("");

    navContainer.querySelectorAll(".concept-nav").forEach(function(b){
      b.addEventListener("click", function(){
        var idx = Number(b.getAttribute("data-cidx"));
        renderConcept(idx);
      });
    });

    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.addEventListener("click", renderRevision);
  }

  // --- Reset Progress Button ---
  var resetProgBtn = document.getElementById("btn-reset-progress");
  if(resetProgBtn){
    resetProgBtn.addEventListener("click", function(){
      if(confirm("Reset all quiz answers and mastery progress for this chapter?")){
        state.answers = {};
        state.correct = {};
        saveStorage();
        updateProgress();
        renderQuiz();
      }
    });
  }

  // --- Handle Video Facades (No preloaded iframes) ---
  document.addEventListener("click", function(e){
    var btn = e.target.closest(".video-facade");
    if(btn){
      var vid = btn.getAttribute("data-yt");
      var parent = btn.parentElement;
      if(parent && vid){
        parent.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&rel=0" title="Video Lesson" style="width:100%;aspect-ratio:16/9;border:none;border-radius:8px;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
      }
    }
  });

  // --- URL Routing ---
  function routeFromHash(){
    var hash = window.location.hash;
    var lessons = C.lessons || C.concepts || [];
    if(hash === "#revision"){
      renderRevision();
    } else if(/^#concept-\d+$/.test(hash)){
      var cNum = parseInt(hash.replace("#concept-", ""), 10);
      if(cNum >= 1 && cNum <= lessons.length){
        renderConcept(cNum - 1);
        return;
      }
      renderConcept(0);
    } else {
      renderConcept(0);
    }
  }
  window.addEventListener("hashchange", routeFromHash);

  window.App = {
    state: state,
    play: play,
    pause: pause,
    step: step,
    resetTimeline: resetTimeline,
    seekTimeline: seekTimeline,
    renderConcept: renderConcept,
    renderRevision: renderRevision,
    routeFromHash: routeFromHash
  };
  if (typeof globalThis !== "undefined") {
    globalThis.App = window.App;
  }

  // Initialize
  initStorage();
  buildSidebar();
  updateProgress();
  routeFromHash();
})();

        var y = 100 + (i % 2 === 0 ? 30 : -30);
        pts.push({x: x, y: y});
      }

      var pathD = 'M ' + pts[0].x + ' ' + pts[0].y;
      for(var j = 1; j < pts.length; j++){
        pathD += ' L ' + pts[j].x + ' ' + pts[j].y;
      }

      var nodes = '';
      for(var k = 0; k < pts.length; k++){
        nodes += '<circle cx="' + pts[k].x + '" cy="' + pts[k].y + '" r="8" fill="#38bdf8"/>' +
                 '<text x="' + pts[k].x + '" y="' + (pts[k].y + (k % 2 === 0 ? 25 : -15)) + '" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="monospace">C' + (k + 1) + '</text>';
      }

      // Draw Functional Group at C1 or C2
      var fgDeco = '';
      if(fg === 'oic'){
        fgDeco = '<line x1="' + pts[0].x + '" y1="' + pts[0].y + '" x2="' + (pts[0].x - 40) + '" y2="' + (pts[0].y - 30) + '" stroke="#ef4444" stroke-width="3"/>' +
                 '<text x="' + (pts[0].x - 45) + '" y="' + (pts[0].y - 35) + '" fill="#ef4444" font-size="13" font-weight="bold">=O</text>' +
                 '<line x1="' + pts[0].x + '" y1="' + pts[0].y + '" x2="' + (pts[0].x - 40) + '" y2="' + (pts[0].y + 30) + '" stroke="#10b981" stroke-width="3"/>' +
                 '<text x="' + (pts[0].x - 45) + '" y="' + (pts[0].y + 35) + '" fill="#10b981" font-size="13" font-weight="bold">-OH</text>';
      } else if(fg === 'al'){
        fgDeco = '<line x1="' + pts[0].x + '" y1="' + pts[0].y + '" x2="' + (pts[0].x - 40) + '" y2="' + (pts[0].y - 30) + '" stroke="#ef4444" stroke-width="3"/>' +
                 '<text x="' + (pts[0].x - 45) + '" y="' + (pts[0].y - 35) + '" fill="#ef4444" font-size="13" font-weight="bold">=O</text>';
      } else if(fg === 'ketone'){
        fgDeco = '<line x1="' + pts[1].x + '" y1="' + pts[1].y + '" x2="' + pts[1].x + '" y2="' + (pts[1].y - 45) + '" stroke="#ef4444" stroke-width="4"/>' +
                 '<text x="' + pts[1].x + '" y="' + (pts[1].y - 50) + '" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="bold">=O</text>';
      } else if(fg === 'ol'){
        fgDeco = '<line x1="' + pts[1].x + '" y1="' + pts[1].y + '" x2="' + pts[1].x + '" y2="' + (pts[1].y - 40) + '" stroke="#10b981" stroke-width="3"/>' +
                 '<text x="' + pts[1].x + '" y="' + (pts[1].y - 45) + '" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">-OH</text>';
      } else if(fg === 'ene'){
        fgDeco = '<line x1="' + pts[0].x + '" y1="' + (pts[0].y - 8) + '" x2="' + pts[1].x + '" y2="' + (pts[1].y - 8) + '" stroke="#38bdf8" stroke-width="3"/>';
      } else if(fg === 'yne'){
        fgDeco = '<line x1="' + pts[0].x + '" y1="' + (pts[0].y - 8) + '" x2="' + pts[1].x + '" y2="' + (pts[1].y - 8) + '" stroke="#38bdf8" stroke-width="3"/>' +
                 '<line x1="' + pts[0].x + '" y1="' + (pts[0].y + 8) + '" x2="' + pts[1].x + '" y2="' + (pts[1].y + 8) + '" stroke="#38bdf8" stroke-width="3"/>';
      }

      // Draw substituent
      var subDeco = '';
      if(subGroup !== 'none'){
        var sIdx = Math.min(subPos - 1, chainLen - 2);
        if(sIdx < 0) sIdx = 1;
        var sNode = pts[sIdx];
        var sY = sNode.y > 100 ? sNode.y + 45 : sNode.y - 45;
        subDeco = '<line x1="' + sNode.x + '" y1="' + sNode.y + '" x2="' + sNode.x + '" y2="' + sY + '" stroke="#f59e0b" stroke-width="3"/>' +
                  '<text x="' + sNode.x + '" y="' + (sY > sNode.y ? sY + 15 : sY - 5) + '" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="bold">' +
                  (subGroup === 'methyl' ? 'CH₃' : (subGroup === 'chloro' ? 'Cl' : 'Br')) + '</text>';
      }

      svg.innerHTML = 
        '<path d="' + pathD + '" stroke="#94a3b8" stroke-width="4" fill="none"/>' +
        nodes + fgDeco + subDeco;

      rd.innerHTML = 
        '<div style="font-size:18px;margin-bottom:8px;"><b>Systematic IUPAC Name:</b> ' + formattedName + '</div>' +
        '<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:13px;background:var(--paper-soft);padding:10px;border-radius:6px;">' +
        '  <div><span style="color:#f59e0b;">■ Prefix (Substituent):</span> ' + (subGroup !== 'none' ? subPos + '-' + subGroup : 'None') + '</div>' +
        '  <div><span style="color:#ec4899;">■ Word Root (Longest Chain):</span> ' + rootWord + ' (' + chainLen + ' Carbons)</div>' +
        '  <div><span style="color:#38bdf8;">■ Primary Suffix:</span> ' + primSuffix + ' (Saturation)</div>' +
        '  <div><span style="color:#10b981;">■ Secondary Suffix:</span> ' + (secSuffix ? secSuffix.replace(/<[^>]*>/g, '') : 'None') + ' (Principal Functional Group)</div>' +
        '</div>' +
        '<div style="margin-top:8px;font-size:12px;color:var(--muted);">' +
        '  Lowest locant rule applied: numbering starts from the end giving the principal functional group the lowest numerical locant.' +
        '</div>';
    }

    container.querySelector('#sel-fg').onchange = function(e){ fg = e.target.value; render(); };
    container.querySelector('#sel-chain').onchange = function(e){ chainLen = parseInt(e.target.value); render(); };
    container.querySelector('#sel-sub').onchange = function(e){ subGroup = e.target.value; render(); };
    container.querySelector('#sel-pos').onchange = function(e){ subPos = parseInt(e.target.value); render(); };
    render();
  }
};

        '  <text x="-80" y="6" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">C(α)</text>' +

        (alphaH > 0 ? 
          '<line x1="-80" y1="0" x2="-20" y2="-60" stroke="#10b981" stroke-width="5"/>' +
          '<circle cx="-20" cy="-60" r="14" fill="#f8fafc"/><text x="-20" y="-55" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">H⁺</text>' +

          '<text x="25" y="-70" text-anchor="middle" fill="#10b981" font-size="12" font-weight="bold">σ(C–H) ⟶ 2p delocalization</text>' +
          '<text x="350" y="80" text-anchor="middle" fill="#94a3b8" font-size="12">No-Bond Resonance Canonical Form Active</text>'
          : '<text x="0" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">No α C–H bonds available for hyperconjugation</text>'
        ) +
        '</g>';

      rd.innerHTML = 
        '<div style="font-size:16px;font-weight:700;color:var(--primary);margin-bottom:6px;">' + ionName + ' (' + formula + ')</div>' +
