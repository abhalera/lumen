<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 8: Chapter 8 — Interactive Textbook</title>
<style>
:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: var(--radius-sm);
  position: relative;
  overflow: hidden;
  border: none;
  padding: 0;
  cursor: pointer;
  display: block;
}
.video-facade img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
}
.play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 48px;
  height: 48px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.video-title {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 8px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  color: #fff;
  font-size: 12px;
  text-align: left;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);

<script>
window.CHAPTER = {"chapter_meta": {"id": "kech202", "number": 8, "title": "Organic Chemistry: Some Basic Principles and Techniques", "book": "Chemistry Part II", "class": 11, "reprint": "2026-27", "tagline": "Tetravalency of carbon, hybridization, IUPAC nomenclature, isomerism, reaction mechanisms, electron displacement effects, purification, and quantitative elemental analysis.", "total_concepts": 7, "total_practice_questions": 21, "total_exercises": 40}, "concepts": [{"id": "c1", "title": "Tetravalency of Carbon, Hybridization and Molecular Representations", "navTitle": "Tetravalency & Hybridization", "minutes": 16, "pages": ["1", "6"], "deck": "Unpack sp3, sp2, and sp carbon orbital hybridizations, sigma and pi bond counts, and complete, condensed, and bond-line structural representations.", "quick": "Carbon possesses an electronic configuration of 1s² 2s² 2p². Promotion of a 2s electron to the empty 2pz orbital creates four unpaired electrons in an excited state, enabling tetravalency. The mixing of pure s and p orbitals yields equivalent hybrid orbitals: sp³ (tetrahedral, 109.5°, e.g., methane), sp² (trigonal planar, 120°, e.g., ethene), and sp (linear, 180°, e.g., ethyne). Single bonds are always sigma (σ) bonds; multiple bonds comprise one σ bond accompanied by one or two lateral pi (π) bonds.", "formulas": [{"label": "Hybrid Orbital Geometry", "cond": "sp³: 109°28′ tetrahedral | sp²: 120° planar | sp: 180° linear", "html": "\\text{Steric Number } = \\sigma\\text{-bonds} + \\text{lone pairs}"}, {"label": "s-Character and Electronegativity", "cond": "sp (50% s) > sp² (33.3% s) > sp³ (25% s)", "html": "\\text{Electronegativity} \\propto \\% s\\text{-character}"}, {"label": "Bond Length and Bond Enthalpy", "cond": "C-C > C=C > C≡C (length); C≡C > C=C > C-C (strength)", "html": "d_{\\text{C-C}} (154\\text{ pm}) > d_{\\text{C=C}} (134\\text{ pm}) > d_{\\text{C}\\equiv\\text{C}} (120\\text{ pm})"}, {"label": "Bond-Line Convention", "cond": "Vertices and termini represent carbon atoms with implicit hydrogens", "html": "\\text{Vertices} = -\\text{CH}_2-, \\quad \\text{Termini} = -\\text{CH}_3"}], "deeper": "The nature of hybridization directly controls the physical and chemical behavior of carbon. Because s-orbitals are closer to the nucleus than p-orbitals, hybrid orbitals with greater s-character hold their bonding electrons more tightly. In ethyne (sp hybridised, 50% s-character), the carbon atom is significantly more electronegative than in ethene (sp², 33% s) or ethane (sp³, 25% s). Consequently, terminal alkynyl C-H bonds are appreciably polarized, conferring weakly acidic character to ethyne (pKa ≈ 25) such that it reacts with sodamide (NaNH2) or ammoniacal AgNO3 to form metal acetylides.", "worked": {"title": "Determining Hybridization and Bond Counts", "problem": "Determine the hybridization of each carbon and count the total number of σ and π bonds in but-1-en-3-yne: HC≡C-CH=CH2.", "given": "Formula: H-C(1)≡C(2)-C(3)H=C(4)H2.", "steps": ["Examine C(1): formed of one C-H σ bond and one C-C σ bond with two π bonds. Hybridization = sp.", "Examine C(2): formed of one C-C σ bond to C(1) and one C-C σ bond to C(3) with zero H. Hybridization = sp.", "Examine C(3): bonded to C(2) (σ), C(4) (σ), and H (σ) with one π bond. Hybridization = sp².", "Examine C(4): bonded to C(3) (σ) and two H (2 σ) with one π bond. Hybridization = sp².", "Count σ bonds: 1 (C1-H) + 1 (C1-C2) + 1 (C2-C3) + 1 (C3-H) + 1 (C3-C4) + 2 (C4-H) = 7 σ bonds.", "Count π bonds: 2 (in C≡C) + 1 (in C=C) = 3 π bonds."], "solution": "C1(sp), C2(sp), C3(sp²), C4(sp²); 7 σ bonds and 3 π bonds.", "answer": "Hybridization: C1=sp, C2=sp, C3=sp², C4=sp²; Total bonds: 7 σ and 3 π."}, "prediction": {"prompt": "In the molecule allene (propadiene, CH2=C=CH2), what is the hybridization of the central carbon atom, and are the two terminal CH2 groups coplanar?", "options": ["sp², and all atoms lie strictly in a single plane.", "sp, and the two terminal CH2 groups lie in mutually perpendicular (orthogonal) planes.", "sp³, and the molecule adopts a puckered tetrahedral chair shape.", "sp, and all atoms lie in a single plane."], "answer": 1, "explanation": "The central carbon in allene is bonded to two adjacent carbons by double bonds (two σ bonds and two π bonds), so it is sp hybridized. The two unhybridized 2p orbitals on the central carbon (2py and 2pz) are mutually perpendicular; hence the two π bonds form in perpendicular planes, forcing the terminal CH2 groups into perpendicular planes."}, "simTitle": "Carbon Hybridization & Bond-Line Orbitals Lab", "connect": "Graphene, a single two-dimensional hexagonal sheet of sp² hybridized carbon atoms, conducts electricity with near-zero ballistic resistance and possesses a tensile strength 200 times greater than structural steel due to the unbroken hexagonal network of in-plane σ bonds and delocalized π clouds.", "quizzes": [{"tier": "easy", "question": "What is the hybridization state of the carbon atom in the carbonyl group of acetone ((CH3)2C=O)?", "options": ["sp³", "sp²", "sp", "dsp²"], "answer": 1, "hint": "Count the number of sigma bonds attached to the carbonyl carbon atom.", "explanation": "The carbonyl carbon is bonded to two methyl carbons via 2 σ bonds and to one oxygen via 1 σ bond (total 3 σ bonds, 0 lone pairs). Steric number = 3; hence its hybridization is sp² (trigonal planar)."}, {"tier": "medium", "question": "How many σ (sigma) and π (pi) bonds are present in a molecule of benzene (C6H6)?", "options": ["6 σ and 3 π", "9 σ and 3 π", "12 σ and 3 π", "12 σ and 6 π"], "answer": 2, "hint": "Include all 6 ring C-C bonds and all 6 peripheral C-H bonds.", "explanation": "Benzene has 6 C-C σ bonds within the ring, 6 C-H σ bonds, and 3 delocalized π bonds. Total = 12 σ bonds and 3 π bonds."}, {"tier": "hard", "question": "Arrange the following bonds in order of increasing bond length: C(sp³)-H, C(sp²)-H, C(sp)-H.", "options": ["C(sp)-H < C(sp²)-H < C(sp³)-H", "C(sp³)-H < C(sp²)-H < C(sp)-H", "C(sp²)-H < C(sp)-H < C(sp³)-H", "All three have identical bond lengths (108 pm)"], "answer": 0, "hint": "Higher s-character draws bonding electrons closer to the carbon nucleus, shortening the bond.", "explanation": "sp hybrid orbital has 50% s-character, sp² has 33.3%, and sp³ has 25%. Greater s-character brings the electron density closer to the carbon nucleus, resulting in the shortest bond length for C(sp)-H (106 pm) < C(sp²)-H (108 pm) < C(sp³)-H (110 pm)."}]}, {"id": "c2", "title": "IUPAC Nomenclature of Organic Compounds", "navTitle": "IUPAC Nomenclature Rules", "minutes": 18, "pages": ["6", "14"], "deck": "Apply rigorous IUPAC rules: principal functional group priorities, longest carbon chain selection, lowest locant numbering, and naming polyfunctional compounds.", "quick": "The IUPAC name of an organic compound consists of: Secondary Prefix (substituents/branches) + Primary Prefix (cyclo/bicyclo) + Root Word (longest continuous carbon chain) + Primary Suffix (degree of saturation: -ane, -ene, -yne) + Secondary Suffix (principal functional group). Priority of functional groups decreases in the order: -COOH > -SO3H > -COOR > -COCl > -CONH2 > -CN > -CHO > >C=O > -OH > -NH2 > C=C > C≡C. Numbering follows the lowest locant rule for principal groups, multiple bonds, and substituents.", "formulas": [{"label": "IUPAC Structural Formula", "cond": "Systematic name syntax", "html": "\\text{Prefix(es)} + \\text{Root Word} + \\text{Primary Suffix} + \\text{Secondary Suffix}"}, {"label": "Principal Functional Group Priority", "cond": "Descending seniority", "html": "-\\text{COOH} > -\\text{SO}_3\\text{H} > -\\text{COOR} > -\\text{COCl} > -\\text{CONH}_2 > -\\text{CN} > -\\text{CHO} > >\\text{C}=\\text{O} > -\\text{OH} > -\\text{NH}_2"}, {"label": "Lowest Locant Set Rule", "cond": "Compare locant sets term by term", "html": "\\text{Choose numbering giving lowest number at first point of difference}"}, {"label": "Tie-Break Rule for Double vs Triple Bond", "cond": "When = and ≡ are equidistant from chain ends", "html": "\\text{Alkene (}-en-\\text{) gets lower locant than alkyne (}-yn-\\text{)}"}], "deeper": "When a carbon chain contains both a double bond and a triple bond at symmetrical positions from opposite ends (such as in pent-1-en-4-yne: CH2=CH-CH2-C≡CH), the double bond is granted numerical priority over the triple bond because 'ene' precedes 'yne' alphabetically ('e' before 'y'). However, when unsymmetrical, the lowest locant rule takes precedence irrespective of whether it is a double or triple bond (e.g., pent-3-en-1-yne: HC≡C-CH=CH-CH3). In the final suffix, the terminal 'e' of 'ene' is dropped before a vowel or 'y', yielding '-en-yne'.", "worked": {"title": "Naming a Polyfunctional Compound", "problem": "Write the correct systematic IUPAC name for: CH3-CH(OH)-CH2-CO-CH2-COOH.", "given": "Compound containing carboxylic acid (-COOH), ketone (>C=O), and alcohol (-OH) groups.", "steps": ["Identify principal functional group: -COOH has highest priority over >C=O and -OH. The suffix is '-oic acid'.", "Find longest continuous chain containing -COOH: 6 carbon atoms (hexan-).", "Number chain starting from carboxylic carbon as C1: C1(-COOH) - C2(H2) - C3(=O) - C4(H2) - C5(OH) - C6(H3).", "Identify substituents: at C3 there is an oxo group (from ketone), and at C5 there is a hydroxy group (from alcohol).", "Alphabetize prefixes: 'hydroxy' precedes 'oxo' alphabetically.", "Combine: 5-hydroxy-3-oxohexanoic acid."], "solution": "The principal group -COOH takes C1, ketone becomes 3-oxo, alcohol becomes 5-hydroxy.", "answer": "5-Hydroxy-3-oxohexanoic acid"}, "prediction": {"prompt": "What is the correct IUPAC name for CH≡C-CH2-CH=CH2?", "options": ["Pent-4-en-1-yne", "Pent-1-en-4-yne", "Pent-1-yn-4-ene", "Pent-4-yn-1-ene"], "answer": 1, "explanation": "Both the double bond and triple bond are at terminal positions (locants 1 and 4 from either end). In a tie, the double bond gets the lower locant 1 (alphabetical preference: 'ene' over 'yne'). Thus: Pent-1-en-4-yne."}, "simTitle": "Interactive IUPAC Nomenclature Engine", "connect": "The pharmaceutical industry relies entirely on strict IUPAC nomenclature to register unique chemical CAS registry numbers for active pharmaceutical ingredients (APIs), preventing catastrophic dosage errors that historically arose from ambiguous common names.", "quizzes": [{"tier": "easy", "question": "What is the correct IUPAC name for the branched alkane (CH3)2CH-CH2-CH(CH3)2?", "options": ["2,4-Dimethylpentane", "2,2-Dimethylpentane", "Diisopropylmethane", "1,1,3,3-Tetramethylpropane"], "answer": 0, "hint": "Find the longest 5-carbon chain and number from either end to give locants 2 and 4.", "explanation": "The longest continuous carbon chain has 5 carbon atoms (pentane). Methyl substituents are located at carbons 2 and 4 from either direction, giving 2,4-dimethylpentane."}, {"tier": "medium", "question": "Which of the following represents the correct IUPAC name for Cl-CH2-CH2-CH(OH)-CH3?", "options": ["1-Chlorobutan-3-ol", "4-Chlorobutan-2-ol", "4-Chlorobutan-3-ol", "1-Chloro-3-hydroxybutane"], "answer": 1, "hint": "The principal functional group (-OH) must receive the lowest possible locant, lower than the halogen prefix.", "explanation": "-OH is the principal functional group and takes priority for numbering over the chloro substituent. Numbering from the right gives -OH at C2 and Cl at C4: 4-chlorobutan-2-ol."}, {"tier": "hard", "question": "What is the systematic IUPAC name for CH3-CH=CH-C≡C-CH3?", "options": ["Hex-4-en-2-yne", "Hex-2-en-4-yne", "Hex-2-yn-4-ene", "Hex-4-yn-2-ene"], "answer": 1, "hint": "Numbering from left gives double bond at 2 and triple bond at 4. Numbering from right gives triple at 2 and double at 4. Lowest locant set is (2,4) either way; tie-breaker gives lower number to double bond.", "explanation": "From left: set is (2-ene, 4-yne). From right: set is (2-yne, 4-ene). Locants are identical (2,4). The tie-breaker assigns the lower number to the double bond ('ene' before 'yne'): Hex-2-en-4-yne."}]}, {"id": "c3", "title": "Isomerism in Organic Compounds: Structural and Stereoisomerism", "navTitle": "Isomerism: Structural & Stereo", "minutes": 16, "pages": ["14", "18"], "deck": "Distinguish chain, position, functional, metamerism, and tautomerism, and contrast with geometrical (cis/trans) stereoisomerism.", "quick": "Isomers are compounds possessing the identical molecular formula but different chemical or physical properties. Structural isomerism encompasses: (1) Chain isomerism (different carbon skeletons, e.g. butane vs 2-methylpropane); (2) Position isomerism (different substituent position on identical skeleton, e.g. propan-1-ol vs propan-2-ol); (3) Functional group isomerism (different functional groups, e.g. ethanol and dimethyl ether, C2H6O); (4) Metamerism (unequal distribution of alkyl groups on either side of a polyvalent heteroatom, e.g. ethoxyethane vs 1-methoxypropane); (5) Tautomerism (dynamic equilibrium between keto and enol forms). Stereoisomers have identical connectivity but different spatial orientations (geometrical cis/trans and optical).", "formulas": [{"label": "Functional Isomers of C2H6O", "cond": "Alcohol vs Ether", "html": "\\text{CH}_3\\text{CH}_2\\text{OH} \\quad \\text{vs} \\quad \\text{CH}_3\\text{OCH}_3"}, {"label": "Keto-Enol Tautomerism", "cond": "Proton migration and π-shift", "html": "-\\text{C}(=\\text{O})-\\text{CH}_2- \\;\\rightleftharpoons\\; -\\text{C}(\\text{OH})=\\text{CH}-"}, {"label": "Geometrical Isomerism Condition", "cond": "Restricted rotation about C=C with distinct substituents on each carbon", "html": "\\text{abC}=\\text{Ccd} \\quad (a \\ne b \\text{ and } c \\ne d)"}, {"label": "Metamerism in Ethers (C4H10O)", "cond": "Different alkyl groups on bridging -O-", "html": "\\text{CH}_3\\text{CH}_2-\\text{O}-\\text{CH}_2\\text{CH}_3 \\quad \\text{vs} \\quad \\text{CH}_3-\\text{O}-\\text{CH}_2\\text{CH}_2\\text{CH}_3"}], "deeper": "Geometrical isomerism arises from restricted rotation about a carbon-carbon double bond (or ring). For a molecule to exhibit cis-trans isomerism, each of the two doubly bonded carbon atoms must be bonded to two different atoms or groups (abC=Cba or abC=Ccd). If either carbon bears two identical groups (such as in propene: CH3-CH=CH2, where the terminal carbon bears two hydrogens), geometrical isomerism is impossible because swapping the two identical hydrogens produces an indistinguishable configuration.", "worked": {"title": "Identifying Types of Isomerism", "problem": "Classify the relationship between: (a) Pentan-2-one and Pentan-3-one; (b) But-2-ene and But-1-ene; (c) cis-But-2-ene and trans-But-2-ene.", "given": "Three pairs of isomeric organic molecules.", "steps": ["(a) Pentan-2-one (CH3COCH2CH2CH3) and Pentan-3-one (CH3CH2COCH2CH3): Both have molecular formula C5H10O and the identical 5-carbon straight chain. The carbonyl group is at C2 in one and C3 in the other. This is position isomerism (or metamerism across the carbonyl group).", "(b) But-1-ene (CH2=CH-CH2-CH3) and But-2-ene (CH3-CH=CH-CH3): Same molecular formula C4H8, same carbon chain, but double bond position changes (C1 vs C2). This is position isomerism.", "(c) cis-But-2-ene and trans-But-2-ene: Identical constitution and connectivity, but in cis the two -CH3 groups lie on the same side of the C=C double bond, whereas in trans they lie on opposite sides. This is geometrical (stereoisomerism)."], "solution": "(a) Position isomers / metamers; (b) Position isomers; (c) Geometrical stereoisomers.", "answer": "(a) Position/Metamerism; (b) Position isomerism; (c) Geometrical isomerism."}, "prediction": {"prompt": "Can 1,1-dichloroethene (Cl2C=CH2) exhibit geometrical (cis-trans) isomerism?", "options": ["Yes, because it contains a rigid C=C double bond.", "No, because one of the doubly bonded carbons is attached to two identical chlorine atoms.", "Yes, with cis and trans chlorines across the double bond.", "No, because chlorine atoms are too large to permit isomerism."], "answer": 1, "explanation": "Geometrical isomerism requires that EACH doubly bonded carbon atom carry two distinct substituents. In 1,1-dichloroethene, C1 is bonded to two identical Cl atoms, so rotating or swapping them produces an identical molecule. It cannot exhibit cis-trans isomerism."}, "simTitle": "Structural & Geometrical Isomerism Chamber", "connect": "Vision in the human eye relies on photo-induced cis-trans isomerism: 11-cis-retinal bound to rhodopsin absorbs a single photon of light and isomerizes in 200 femtoseconds to all-trans-retinal, triggering a conformational shift in opsin that fires optical nerve impulses to the brain.", "quizzes": [{"tier": "easy", "question": "Which type of isomerism is exhibited by ethanol (CH3CH2OH) and dimethyl ether (CH3OCH3)?", "options": ["Chain isomerism", "Position isomerism", "Functional group isomerism", "Geometrical isomerism"], "answer": 2, "hint": "Both share the formula C2H6O, but one is an alcohol and the other is an ether.", "explanation": "Ethanol possesses an -OH (alcohol) functional group, while dimethyl ether possesses a -C-O-C- (ether) linkage. Having identical molecular formula (C2H6O) but distinct functional groups makes them functional group isomers."}, {"tier": "medium", "question": "Which of the following compounds can exhibit geometrical (cis-trans) isomerism?", "options": ["Propene", "But-1-ene", "But-2-ene", "2-Methylpropene"], "answer": 2, "hint": "Look for a C=C bond where neither carbon has two identical groups attached to it.", "explanation": "In but-2-ene (CH3-CH=CH-CH3), each doubly bonded carbon is attached to one -H and one -CH3. Swapping groups on one carbon produces distinct cis and trans diastereomers."}, {"tier": "hard", "question": "Diethyl ether (CH3CH2-O-CH2CH3) and methyl propyl ether (CH3-O-CH2CH2CH3) are related as:", "options": ["Functional isomers", "Metamers", "Tautomers", "Chain isomers"], "answer": 1, "hint": "They have the same functional group (ether) but different alkyl chain lengths on either side of the divalent oxygen atom.", "explanation": "Metamerism is exhibited by compounds containing the same polyvalent functional group (-O-, -S-, -NH-, -CO-) with different alkyl group distributions attached to the heteroatom."}]}, {"id": "c4", "title": "Fundamental Concepts in Organic Reaction Mechanisms: Cleavage & Intermediates", "navTitle": "Reaction Mechanisms & Intermediates", "minutes": 20, "pages": ["18", "24"], "deck": "Master curved-arrow notation, homolytic vs heterolytic fission, carbocations, carbanions, free radicals, electrophiles, and nucleophiles.", "quick": "Organic reactions proceed via breaking and forming covalent bonds. Homolytic fission breaks a bond symmetrically, each fragment retaining one electron to produce neutral free radicals (possessing an unpaired electron, highly reactive, sp² planar or rapidly inverting). Heterolytic fission breaks a bond unsymmetrically, the more electronegative atom taking both bonding electrons to yield an anion, leaving the other fragment as a cation. Heterolysis of a carbon bond yields either a carbocation (C⁺, sp² hybridized, planar, 6 valence electrons, stability: 3° > 2° > 1° > CH3⁺) or a carbanion (C:⁻, sp³ hybridized, pyramidal, 8 valence electrons, stability: CH3⁻ > 1° > 2° > 3°). Electrophiles seek electrons; nucleophiles donate electron pairs.", "formulas": [{"label": "Homolytic Bond Fission", "cond": "Fish-hook curved arrows (single-electron transfer)", "html": "\\text{A}-\\text{B} \\;\\xrightarrow{h\\nu}\\; \\text{A}^\\bullet + \\text{B}^\\bullet"}, {"label": "Heterolytic Bond Fission", "cond": "Full curved arrow (electron pair transfer)", "html": "\\text{R}-\\text{X} \\;\\to\\; \\text{R}^+ + \\text{X}^-"}, {"label": "Carbocation Stability Hierarchy", "cond": "Stabilized by +I inductive and hyperconjugation", "html": "(\\text{CH}_3)_3\\text{C}^+ (3^\\circ) > (\\text{CH}_3)_2\\text{CH}^+ (2^\\circ) > \\text{CH}_3\\text{CH}_2^+ (1^\\circ) > \\text{CH}_3^+"}, {"label": "Carbanion Stability Hierarchy", "cond": "Destabilized by +I alkyl electron donation", "html": "\\text{CH}_3^- > \\text{CH}_3\\text{CH}_2^- (1^\\circ) > (\\text{CH}_3)_2\\text{CH}^- (2^\\circ) > (\\text{CH}_3)_3\\text{C}^- (3^\\circ)"}], "deeper": "The remarkable stability of the tertiary carbocation (CH3)3C⁺ compared to the methyl carbocation CH3⁺ is explained by two synergistic electronic effects: (1) Inductive effect (+I): three electron-releasing methyl groups push electron density toward the positively charged central carbon, dispersing its formal positive charge; (2) Hyperconjugation (no-bond resonance): the vacant 2p orbital of the carbocation overlaps with adjacent σ C-H orbitals. In (CH3)3C⁺, there are 9 α-hydrogens, yielding 9 hyperconjugative structures that strongly delocalize positive charge over the entire molecular framework.", "worked": {"title": "Classifying Reagents as Electrophiles or Nucleophiles", "problem": "Classify each of the following species as an electrophile or a nucleophile: (a) AlCl3; (b) NH3; (c) NO2⁺; (d) H2O; (e) BF3; (f) CN⁻.", "given": "Six chemical reagents.", "steps": ["(a) AlCl3: Aluminum has an incomplete octet (6 valence electrons) and accepts an electron pair into an empty 3p orbital ⟹ Electrophile (Lewis acid).", "(b) NH3: Nitrogen possesses a lone pair of electrons ready to donate ⟹ Nucleophile (Lewis base).", "(c) NO2⁺ (nitronium ion): Positively charged nitrogen species with a vacant orbital, aggressively seeks electrons ⟹ Electrophile.", "(d) H2O: Oxygen possesses two non-bonding lone pairs available for coordinate donation ⟹ Nucleophile.", "(e) BF3: Boron has only 6 valence electrons (sextet), accepts electron pairs ⟹ Electrophile.", "(f) CN⁻ (cyanide ion): Negatively charged ion bearing accessible unshared electron pairs on C and N ⟹ Nucleophile."], "solution": "Electrophiles: AlCl3, NO2⁺, BF3. Nucleophiles: NH3, H2O, CN⁻.", "answer": "Electrophiles: AlCl3, NO2⁺, BF3; Nucleophiles: NH3, H2O, CN⁻."}, "prediction": {"prompt": "Which carbocation is the most thermodynamically stable?", "options": ["CH3-CH2⁺ (Ethyl cation)", "(CH3)2CH⁺ (Isopropyl cation)", "(CH3)3C⁺ (tert-Butyl cation)", "CH3⁺ (Methyl cation)"], "answer": 2, "explanation": "The tert-butyl cation (CH3)3C⁺ is a tertiary (3°) carbocation with 9 α-hydrogens. Hyperconjugative overlap of nine C-H σ bonds with the empty p-orbital combined with the +I inductive effect of three methyl groups makes it the most stable."}, "simTitle": "Curved-Arrow Reaction Mechanism & Intermediate Analyzer", "connect": "Carbocation intermediates are central to petroleum refining: acid-catalyzed alkylation and catalytic cracking convert low-octane linear alkanes into highly branched iso-alkanes (like 2,2,4-trimethylpentane / isooctane) via spontaneous Wagner-Meerwein 1,2-hydride and 1,2-methyl shifts to form more stable tertiary carbocations.", "quizzes": [{"tier": "easy", "question": "Homolytic fission of a covalent C-C bond produces:", "options": ["A carbocation and a carbanion", "Two neutral free radicals", "Two carbocations", "A carbocation and an electrophile"], "answer": 1, "hint": "In homolysis, the bonding electron pair is divided equally between the two fragments.", "explanation": "Homolytic cleavage divides the bonding electron pair symmetrically so that each departing atom retains one unpaired electron, generating two free radicals."}, {"tier": "medium", "question": "What is the geometry and hybridization of the central positively charged carbon in a carbocation?", "options": ["sp³ hybridized and tetrahedral", "sp² hybridized and trigonal planar", "sp hybridized and linear", "sp³ hybridized and trigonal pyramidal"], "answer": 1, "hint": "The carbon has 3 sigma bonds and an empty unhybridized p-orbital.", "explanation": "The carbocation carbon is surrounded by three bonding pairs (6 valence electrons) forming 3 σ bonds at 120° angles in an sp² trigonal planar geometry, with an empty unhybridized 2p orbital perpendicular to the plane."}, {"tier": "hard", "question": "Which of the following carbanions is the most stable?", "options": ["CH3-CH2⁻", "(CH3)2CH⁻", "(CH3)3C⁻", "CH3⁻"], "answer": 3, "hint": "Alkyl groups are electron-donating (+I). Electron donation increases charge density on an already negative carbanion, destabilizing it.", "explanation": "Alkyl groups donate electron density via the +I effect, intensifying negative charge on carbon. Therefore, methyl carbanion (CH3⁻), with zero destabilizing +I methyl groups, is the most stable."}]}, {"id": "c5", "title": "Electronic Displacement Effects: Inductive, Electromeric, Resonance and Hyperconjugation", "navTitle": "Electronic Displacement Effects", "minutes": 20, "pages": ["24", "28"], "deck": "Examine permanent vs temporary electron displacement: +I/-I inductive forces, electromeric π-shifts, resonance stabilization, and no-bond hyperconjugation.", "quick": "Four fundamental electronic displacement effects govern organic reactivity: (1) Inductive Effect (I): permanent polarization along σ bonds due to electronegativity differences, diminishing rapidly with distance (-I: -NO2 > -CN > -COOH > -F > -Cl > -Br > -I; +I: -(CH3)3C > -CH(CH3)2 > -CH2CH3 > -CH3); (2) Electromeric Effect (E): temporary complete transfer of a π-electron pair in a multiple bond under the influence of an attacking reagent (+E toward reagent, -E away); (3) Resonance / Mesomeric Effect (R/M): permanent delocalization of π or non-bonding electrons through conjugated systems; (4) Hyperconjugation: permanent delocalization of σ C-H electrons into an adjacent vacant p or π orbital (no-bond resonance).", "formulas": [{"label": "Inductive Acid Strengthening (-I)", "cond": "Stabilizes conjugate base carboxylate by charge dispersal", "html": "\\text{CCl}_3\\text{COOH} > \\text{CHCl}_2\\text{COOH} > \\text{CH}_2\\text{ClCOOH} > \\text{CH}_3\\text{COOH}"}, {"label": "Hyperconjugative Structures Count", "cond": "Number of canonical no-bond resonance contributors", "html": "N_{\\text{structures}} = N_{\\alpha\\text{-hydrogens}} + 1"}, {"label": "Resonance Energy Criterion", "cond": "Actual molecule is more stable than any single canonical structure", "html": "E_{\\text{resonance}} = E_{\\text{most stable canonical}} - E_{\\text{actual resonance hybrid}}"}, {"label": "Resonance Effect on Phenol Acidity", "cond": "+R of -OH delocalizes into ring; phenoxide ion resonance-stabilized", "html": "\\text{pKa}(\\text{Phenol}) \\approx 10 \\ll \\text{pKa}(\\text{Ethanol}) \\approx 16"}], "deeper": "Hyperconjugation is often termed 'Baker-Nathan effect' or 'no-bond resonance'. When an alkyl group containing at least one α C-H bond is attached to an unsaturated system (such as in propene: CH3-CH=CH2) or a carbocation, the σ-electrons of the C-H bond undergo overlap with the adjacent empty p-orbital or π* orbital. Because the proton (H⁺) is not physically detached from the molecule but remains in close electrostatic proximity to the electron cloud, it is represented without a formal covalent bond in canonical structures. The greater the number of α C-H bonds, the more hyperconjugative structures exist, and the greater the thermodynamic stability of the alkene or carbocation.", "worked": {"title": "Explaining Relative Acidic Strengths via Inductive Effects", "problem": "Explain why trichloroacetic acid (CCl3COOH) is a vastly stronger acid (pKa = 0.65) than acetic acid (CH3COOH, pKa = 4.76).", "given": "Formulas: CCl3COOH and CH3COOH.", "steps": ["Write ionization equilibria: R-COOH ⇌ R-COO⁻ + H⁺.", "Acid strength depends directly on the thermodynamic stability of the conjugate base carboxylate anion (R-COO⁻).", "In acetate (CH3COO⁻), the methyl group is electron-donating (+I), pushing electron density onto the carboxylate group, concentrating negative charge and destabilizing the anion.", "In trichloroacetate (CCl3COO⁻), three strongly electronegative chlorine atoms exert a powerful cumulative electron-withdrawing inductive effect (-I).", "This -I pull disperses the negative charge over the entire molecular framework, stabilizing CCl3COO⁻ enormously.", "Consequently, equilibrium shifts strongly toward ionization, making CCl3COOH over 10,000 times more acidic."], "solution": "Three chlorine atoms exert strong -I effect, dispersing negative charge on carboxylate and stabilizing the conjugate base.", "answer": "CCl3COOH is stabilized by three -I chlorine atoms, making it far more acidic than CH3COOH."}, "prediction": {"prompt": "Which of the following alkenes is thermodynamically the most stable?", "options": ["Ethene (CH2=CH2)", "Propene (CH3-CH=CH2)", "trans-But-2-ene (CH3-CH=CH-CH3)", "2,3-Dimethylbut-2-ene ((CH3)2C=C(CH3)2)"], "answer": 3, "explanation": "2,3-Dimethylbut-2-ene has four methyl groups attached to the double bond, providing 12 α-hydrogens. It possesses 12 hyperconjugative structures (the maximum possible for a tetrasubstituted alkene), giving it the highest thermodynamic stability."}, "simTitle": "Electronic Displacement & Hyperconjugation Lab", "connect": "The bright red color of lycopene in ripe tomatoes and the vibrant orange of β-carotene in carrots stem from extended conjugated π systems (11–12 conjugated double bonds): resonance delocalization narrows the HOMO-LUMO energy gap into the visible spectrum, allowing selective absorption of blue-green light.", "quizzes": [{"tier": "easy", "question": "Which of the following substituent groups exerts a strong electron-withdrawing (-I) inductive effect?", "options": ["-CH3", "-C(CH3)3", "-NO2", "-CH2CH3"], "answer": 2, "hint": "Look for a group containing highly electronegative atoms (N and O) carrying formal positive character.", "explanation": "The nitro group (-NO2) contains highly electronegative oxygen and nitrogen atoms and exerts a very powerful -I (electron-withdrawing) inductive effect. Alkyl groups are electron-donating (+I)."}, {"tier": "medium", "question": "How many hyperconjugative canonical structures can be drawn for the ethyl carbocation (CH3-CH2⁺)?", "options": ["1", "2", "3", "4"], "answer": 2, "hint": "Count the number of α-hydrogens on the carbon adjacent to the positive charge.", "explanation": "The ethyl carbocation has one methyl group adjacent to C⁺, containing 3 α-hydrogens. Each α C-H bond can participate in no-bond resonance with the empty p orbital, yielding 3 hyperconjugative structures."}, {"tier": "hard", "question": "The electromeric effect differs fundamentally from the inductive effect because:", "options": ["The electromeric effect is a permanent effect operating along σ bonds.", "The electromeric effect is a temporary effect involving complete transfer of a π electron pair only in the presence of an attacking reagent.", "The electromeric effect only operates in saturated alkanes.", "The electromeric effect does not affect reaction rates."], "answer": 1, "hint": "Consider whether the effect persists in the absence of an attacking reagent.", "explanation": "The inductive effect is permanent and operates through σ bonds. The electromeric effect is purely temporary: it occurs only in multiple bonds (π electrons) and vanishes as soon as the attacking reagent is removed."}]}, {"id": "c6", "title": "Methods of Purification of Organic Compounds", "navTitle": "Purification Techniques", "minutes": 18, "pages": ["28", "33"], "deck": "Explore crystallization, simple and fractional distillation, vacuum and steam distillation, and chromatographic separation.", "quick": "Purification isolates pure organic compounds from synthesis mixtures and natural extracts: (1) Sublimation: purifies volatile substances that transition directly from solid to vapor without melting (e.g., camphor, naphthalene, benzoic acid) from non-sublimable impurities; (2) Crystallisation: exploits differential solubility across temperatures in a suitable solvent; (3) Distillation: separates liquids by boiling point differences; (4) Fractional Distillation: uses a fractionating column for liquids with close boiling points (ΔT < 25 K); (5) Vacuum Distillation: distills heat-sensitive liquids below their normal boiling point under reduced pressure (e.g., glycerol decomp at 290 °C, distills at 180 °C / 12 mm Hg); (6) Steam Distillation: purifies steam-volatile, water-immiscible substances (P_total = P_org + P_water = 1 atm, boiling below 100 °C, e.g., aniline); (7) Chromatography: separates components by differential partitioning between a stationary phase and a mobile phase.", "formulas": [{"label": "Steam Distillation Total Vapor Pressure", "cond": "Two immiscible liquids boil when combined pressure equals atmospheric", "html": "P_{\\text{total}} = p_{\\text{organic}} + p_{\\text{water}} = 1\\text{ atm} \\implies T_{\\text{boil}} < 100\\,^\\circ\\text{C}"}, {"label": "Mass Ratio of Distillate in Steam Distillation", "cond": "Relative masses in distillate vapor", "html": "\\frac{w_1}{w_2} = \\frac{p_1 M_1}{p_2 M_2}"}, {"label": "Retention Factor (Rf) in TLC", "cond": "Thin-layer and paper chromatography readout", "html": "R_f = \\frac{\\text{Distance moved by the substance from baseline}}{\\text{Distance moved by the solvent front from baseline}}"}, {"label": "Clausius-Clapeyron Boiling Point Reduction", "cond": "Vacuum distillation pressure drop", "html": "\\ln\\left(\\frac{P_2}{P_1}\\right) = -\\frac{\\Delta H_{\\text{vap}}}{R}\\left(\\frac{1}{T_2} - \\frac{1}{T_1}\\right)"}], "deeper": "In steam distillation, an organic liquid that is completely immiscible with water exerts its own independent vapor pressure (p1), regardless of the amount of water present. Water simultaneously exerts its own vapor pressure (p2). According to Dalton's Law of Partial Pressures, the mixture boils when p1 + p2 = Patm (760 mm Hg). Because p1 is non-zero, p2 must be less than 760 mm Hg; therefore, the boiling temperature is strictly LOWER than the normal boiling point of pure water (100 °C) and far below the high decomposition boiling point of the organic compound. For example, aniline (normal b.p. 184 °C) distills smoothly at 98.5 °C in a current of steam, preventing thermal charring.", "worked": {"title": "Calculating Mass Ratio in Steam Distillation", "problem": "An organic liquid (M = 120 g/mol) is steam distilled at 95 °C. At this temperature, the vapor pressure of water is 640 mm Hg and atmospheric pressure is 760 mm Hg. Calculate the mass percentage of the organic compound in the distillate.", "given": "P_total = 760 mm Hg; p_water = 640 mm Hg; M_water = 18 g/mol; M_org = 120 g/mol.", "steps": ["Calculate partial pressure of organic compound: p_org = P_total - p_water = 760 - 640 = 120 mm Hg.", "Use mass ratio formula: w_org / w_water = (p_org * M_org) / (p_water * M_water).", "w_org / w_water = (120 * 120) / (640 * 18) = 14400 / 11520 = 1.25.", "Mass of organic compound per 1.00 g of water = 1.25 g.", "Total mass of distillate = 1.25 g + 1.00 g = 2.25 g.", "Mass percentage of organic compound = (1.25 / 2.25) * 100 = 55.56%."], "solution": "The organic compound constitutes 55.56% by mass of the collected distillate.", "answer": "Mass percentage of organic compound is 55.6%."}, "prediction": {"prompt": "Glycerol decomposes violently near its normal atmospheric boiling point of 290 °C. What is the appropriate laboratory method to purify glycerol without decomposition?", "options": ["Steam distillation with superheated steam", "Distillation under reduced pressure (vacuum distillation)", "Sublimation at atmospheric pressure", "Simple distillation using an open bunsen flame"], "answer": 1, "explanation": "Distillation under reduced pressure (vacuum distillation) lowers the boiling point of glycerol from 290 °C to about 180 °C at 12 mm Hg pressure, allowing it to distill cleanly without decomposing."}, "simTitle": "Fractional & Steam Distillation / Chromatography Simulator", "connect": "Forensic crime scene laboratories use High-Performance Liquid Chromatography (HPLC) and Gas Chromatography-Mass Spectrometry (GC-MS) to separate, identify, and quantify nanogram traces of poisons, explosives, and illicit drugs from complex biological blood and urine matrices.", "quizzes": [{"tier": "easy", "question": "A mixture of camphor and benzoic acid is to be separated from sand. Which property allows camphor to be purified easily?", "options": ["High boiling point", "Sublimation (direct conversion from solid to vapor)", "Insolubility in ethanol", "Paramagnetism"], "answer": 1, "hint": "Camphor readily sublimes upon gentle heating without melting into a liquid.", "explanation": "Camphor undergoes sublimation: upon heating, it vaporizes directly from solid to vapor, condensing as pure crystals on a cold surface, leaving non-volatile sand behind."}, {"tier": "medium", "question": "In Thin-Layer Chromatography (TLC), if a pigment spot travels 4.0 cm from the baseline while the solvent front travels 8.0 cm, what is its Rf value?", "options": ["2.0", "0.50", "0.32", "0.75"], "answer": 1, "hint": "Rf = distance moved by substance / distance moved by solvent front.", "explanation": "Rf = 4.0 cm / 8.0 cm = 0.50. The Rf value is always a dimensionless ratio between 0 and 1."}, {"tier": "hard", "question": "Why does an organic liquid vaporize at a temperature below its normal boiling point during steam distillation?", "options": ["Steam acts as a chemical catalyst to break C-C bonds.", "The organic liquid dissolves completely in boiling water.", "Boiling occurs when the sum of the vapor pressures of the organic liquid and water equals atmospheric pressure.", "Water vapor increases the surface tension of the organic layer."], "answer": 2, "hint": "Remember Dalton's Law for immiscible liquids: P_total = p_organic + p_water = 1 atm.", "explanation": "Because the organic compound and water are immiscible, each exerts its independent vapor pressure. The system boils when p_organic + p_water = 1 atm. Since p_water > 0, p_organic reaches the required total pressure at a temperature below both 100 °C and the compound's normal b.p."}]}, {"id": "c7", "title": "Qualitative and Quantitative Elemental Analysis of Organic Compounds", "navTitle": "Qualitative & Quantitative Analysis", "minutes": 22, "pages": ["33", "39"], "deck": "Master Lassaigne's test for N, S, and halogens, and quantitative algorithms for Dumas, Kjeldahl (%N), Liebig (%C, %H), and Carius (%X, %S) methods.", "quick": "Qualitative analysis detects elements: (1) Carbon and Hydrogen: oxidized with CuO to CO2 (turns lime water milky) and H2O (turns anhydrous CuSO4 blue); (2) Lassaigne's Test: fuses organic compound with metallic sodium to convert covalent elements into ionic water-soluble sodium salts: N ⟶ NaCN, S ⟶ Na2S, X ⟶ NaX. Prussian blue Fe4[Fe(CN)6]3 confirms N; violet nitroprusside Na4[Fe(CN)5NOS] or black PbS confirms S; white AgCl (soluble in NH4OH) or pale yellow AgBr or yellow AgI confirms halogens. Quantitative analysis calculates percentages: Liebig (%C, %H), Dumas and Kjeldahl (%N), and Carius method (%Halogens as AgX, %S as BaSO4, %P as Mg2P2O7).", "formulas": [{"label": "Liebig Carbon and Hydrogen Percentage", "cond": "Combustion of m grams organic compound", "html": "\\%\\text{C} = \\frac{12}{44} \\times \\frac{m_{\\text{CO}_2}}{m} \\times 100, \\quad \\%\\text{H} = \\frac{2}{18} \\times \\frac{m_{\\text{H}_2\\text{O}}}{m} \\times 100"}, {"label": "Kjeldahl Nitrogen Percentage", "cond": "Titration of unreacted H2SO4 with NaOH", "html": "\\%\\text{N} = \\frac{1.4 \\times M_{\\text{acid}} \\times 2 \\times (V_{\\text{acid}} - \\frac{V_{\\text{base}}}{2})}{m}"}, {"label": "Carius Halogen Percentage", "cond": "Precipitated as AgX (Cl: 143.5, Br: 188, I: 235)", "html": "\\%\\text{X} = \\frac{\\text{Atomic Mass of X}}{\\text{Molar Mass of AgX}} \\times \\frac{m_{\\text{AgX}}}{m} \\times 100"}, {"label": "Carius Sulfur Percentage", "cond": "Precipitated as BaSO4 (M = 233.3 g/mol)", "html": "\\%\\text{S} = \\frac{32}{233.3} \\times \\frac{m_{\\text{BaSO}_4}}{m} \\times 100"}], "deeper": "In the Lassaigne's test for halogens, sodium extract must ALWAYS be boiled with concentrated nitric acid (HNO3) before adding silver nitrate (AgNO3). If nitrogen or sulfur is present in the organic compound, the sodium extract contains NaCN or Na2S. If AgNO3 were added directly without HNO3, cyanide and sulfide ions would react immediately to form white AgCN or black Ag2S precipitates, completely masking and interfering with the detection of silver halide precipitates. Boiling with HNO3 decomposes NaCN to volatile HCN gas (NaCN + HNO3 ⟶ NaNO3 + HCN↑) and Na2S to H2S gas (Na2S + 2 HNO3 ⟶ 2 NaNO3 + H2S↑), eliminating all interference.", "worked": {"title": "Kjeldahl Method Nitrogen Determination", "problem": "0.50 g of an organic compound was analyzed by Kjeldahl's method. The ammonia evolved was absorbed in 50 mL of 0.5 M H2SO4. The unreacted residual acid required 60 mL of 0.5 M NaOH for complete neutralization. Calculate the percentage of nitrogen in the compound.", "given": "m = 0.50 g; V_acid = 50 mL, M_acid = 0.5 M H2SO4; V_base = 60 mL, M_base = 0.5 M NaOH.", "steps": ["Millimoles of H2SO4 initially taken = M * V = 0.5 mmol/mL * 50 mL = 25.0 mmol.", "Millimoles of NaOH used for back-titration = 0.5 mmol/mL * 60 mL = 30.0 mmol.", "Since 1 mmol of H2SO4 reacts with 2 mmol of NaOH (H2SO4 + 2 NaOH ⟶ Na2SO4 + 2 H2O):", "Millimoles of unreacted H2SO4 = 30.0 / 2 = 15.0 mmol.", "Millimoles of H2SO4 consumed by NH3 = 25.0 - 15.0 = 10.0 mmol.", "Since 2 NH3 + H2SO4 ⟶ (NH4)2SO4, 1 mmol of H2SO4 neutralizes 2 mmol of NH3:", "Millimoles of NH3 evolved = 2 * 10.0 = 20.0 mmol = 0.020 mol.", "Mass of nitrogen = moles * 14.0 g/mol = 0.020 mol * 14.0 g/mol = 0.280 g.", "Percentage of nitrogen = (0.280 g / 0.50 g) * 100 = 56.0%."], "solution": "The ammonia produced corresponds to 0.280 g of nitrogen in the 0.50 g sample.", "answer": "Percentage of nitrogen is 56.0%."}, "prediction": {"prompt": "Why can Kjeldahl's method NOT be applied to determine nitrogen in nitrobenzene (C6H5NO2) or pyridine?", "options": ["Nitro and pyridine nitrogen cannot be reduced to ammonium sulfate by digestion with concentrated H2SO4.", "Nitrobenzene boils away before reacting with acid.", "Pyridine dissolves metallic sodium during extraction.", "Concentrated sulfuric acid oxidizes nitrogen to N2O5 gas."], "answer": 0, "explanation": "Kjeldahl's method fails for compounds containing nitrogen in nitro (-NO2) or azo (-N=N-) groups and nitrogen in aromatic rings (pyridine, quinoline), because under digestion with H2SO4 this nitrogen is not quantitatively converted into ammonium sulfate (NH4)2SO4."}, "simTitle": "Kjeldahl & Carius Quantitative Analysis Calculator", "connect": "The infamous 2008 infant milk scandal occurred when unscrupulous dairy manufacturers added synthetic melamine (66% nitrogen by mass) to diluted milk: standard food industry testing relied blindly on the Kjeldahl nitrogen assay, falsely inflating apparent protein content.", "quizzes": [{"tier": "easy", "question": "What is the chemical composition of the intense Prussian blue precipitate formed in Lassaigne's test for nitrogen?", "options": ["Na4[Fe(CN)6]", "Fe4[Fe(CN)6]3", "Fe(OH)3", "Fe(CNS)3"], "answer": 1, "hint": "Iron(III) hexacyanoferrate(II) is formed when ferric chloride is added to acidified sodium ferrocyanide.", "explanation": "Sodium cyanide reacts with ferrous sulfate to form sodium ferrocyanide Na4[Fe(CN)6], which reacts with ferric ions (Fe³⁺) upon acidification to yield ferric ferrocyanide Fe4[Fe(CN)6]3 (Prussian blue)."}, {"tier": "medium", "question": "In the Carius method for estimation of chlorine, 0.3780 g of an organic chloro compound gave 0.5740 g of AgCl (M = 143.32 g/mol). What is the percentage of chlorine?", "options": ["28.5%", "37.6%", "42.2%", "15.2%"], "answer": 1, "hint": "Use: %Cl = (35.45 / 143.32) * (m_AgCl / m_sample) * 100.", "explanation": "Mass of Cl = (35.45 / 143.32) * 0.5740 g = 0.1420 g. Percentage of Cl = (0.1420 / 0.3780) * 100 ≈ 37.57% ≈ 37.6%."}, {"tier": "hard", "question": "In the estimation of sulfur by the Carius method, 0.468 g of an organic compound yielded 0.668 g of BaSO4 (M = 233.3 g/mol). What is the percentage of sulfur in the compound?", "options": ["19.6%", "14.3%", "28.2%", "9.8%"], "answer": 0, "hint": "Use: %S = (32.06 / 233.3) * (m_BaSO4 / m_sample) * 100.", "explanation": "Mass of S = (32.06 / 233.3) * 0.668 g = 0.0918 g. %S = (0.0918 / 0.468) * 100 = 19.62% ≈ 19.6%."}]}], "exercises": [{"q": "8.1", "number": "8.1", "title": "Hybridisation states of carbon atoms in five organic molecules", "conceptIdx": 0, "page": 37, "printPage": 292, "question": "What are hybridisation states of each carbon atom in the following compounds? (a) CH2=C=O, (b) CH3CH=CH2, (c) (CH3)2CO, (d) CH2=CHCN, (e) C6H6.", "steps": ["(a) CH2=C=O (Ketene): C1 in CH2 has two C-H σ bonds and one C-C σ bond (3 σ bonds) ⟹ sp². Central C2 has two σ bonds (one to C1, one to O) and two π bonds ⟹ sp.", "(b) CH3-CH=CH2 (Propene): C1 in CH3 has 4 σ bonds ⟹ sp³. C2 in =CH- has 3 σ bonds ⟹ sp². C3 in =CH2 has 3 σ bonds ⟹ sp².", "(c) (CH3)2CO (Acetone): The two methyl carbons (-CH3) each have 4 σ bonds ⟹ sp³. The carbonyl carbon (>C=O) has 3 σ bonds (two to C, one to O) and 1 π bond ⟹ sp².", "(d) CH2=CH-C≡N (Acrylonitrile): C1 in CH2= has 3 σ bonds ⟹ sp². C2 in =CH- has 3 σ bonds ⟹ sp². C3 in -C≡N has 2 σ bonds (one to C, one to N) and 2 π bonds ⟹ sp.", "(e) C6H6 (Benzene): Planar hexagonal ring where each of the six carbon atoms is bonded to two adjacent carbons (2 σ) and one hydrogen (1 σ), with one delocalized π orbital (3 σ bonds) ⟹ all 6 carbon atoms are sp² hybridised."], "answer": "(a) C1: sp², C2: sp; (b) C1: sp³, C2: sp², C3: sp²; (c) Methyl C: sp³, Carbonyl C: sp²; (d) C1: sp², C2: sp², C3: sp; (e) All carbon atoms in benzene are sp²."}, {"q": "8.2", "number": "8.2", "title": "Count of sigma and pi bonds in six organic compounds", "conceptIdx": 0, "page": 37, "printPage": 292, "question": "Indicate the σ and π bonds in the following molecules: C6H6, C6H12, CH2Cl2, CH2=C=CH2, CH3NO2, HCONHCH3.", "steps": ["(1) C6H6 (Benzene): 6 C-C σ bonds + 6 C-H σ bonds = 12 σ bonds. Three conjugated double bonds = 3 π bonds.", "(2) C6H12 (Cyclohexane): Saturated 6-membered ring. 6 C-C σ bonds + 12 C-H σ bonds = 18 σ bonds; 0 π bonds.", "(3) CH2Cl2 (Dichloromethane): 2 C-H σ bonds + 2 C-Cl σ bonds = 4 σ bonds; 0 π bonds.", "(4) CH2=C=CH2 (Allene / Propadiene): 4 C-H σ bonds + 2 C-C σ bonds = 6 σ bonds. Two cumulative double bonds = 2 π bonds.", "(5) CH3NO2 (Nitromethane): In CH3: 3 C-H σ bonds. C-N: 1 σ bond. In -NO2: 1 N-O σ bond + 1 N=O double bond (1 σ + 1 π) + coordinate/resonance N-O bond = 6 σ bonds and 1 π bond.", "(6) HCONHCH3 (N-methylformamide): 1 C-H σ + 1 C=O (1 σ + 1 π) + 1 C-N σ + 1 N-H σ + 1 N-C σ + 3 C-H σ = 8 σ bonds and 1 π bond."], "answer": "C6H6: 12 σ, 3 π; C6H12: 18 σ, 0 π; CH2Cl2: 4 σ, 0 π; CH2=C=CH2: 6 σ, 2 π; CH3NO2: 6 σ, 1 π; HCONHCH3: 8 σ, 1 π."}, {"q": "8.3", "number": "8.3", "title": "Bond line structural formulas of three common organic compounds", "conceptIdx": 0, "page": 37, "printPage": 292, "question": "Write bond line formulas for: Isopropyl alcohol, 2,3-Dimethylbutanal, Heptan-4-one.", "steps": ["(1) Isopropyl alcohol ((CH3)2CHOH / Propan-2-ol): Three-carbon vertex chain (V-shape) with an -OH group branching from the central apex vertex (C2).", "(2) 2,3-Dimethylbutanal (CH3-CH(CH3)-CH(CH3)-CHO): Four-carbon horizontal zigzag chain (C1 to C4). C1 terminates with a double-bonded oxygen (=O) and hydrogen. Carbons 2 and 3 each have a single vertical branch representing a methyl group.", "(3) Heptan-4-one (CH3CH2CH2-CO-CH2CH2CH3): Seven-carbon symmetrical zigzag chain (6 segments). The central vertex (C4) bears a double bond to oxygen (=O)."], "answer": "Isopropyl alcohol: 3-carbon V-chain with -OH at vertex 2; 2,3-Dimethylbutanal: 4-carbon chain with =O at C1, methyl branches at C2 and C3; Heptan-4-one: 7-carbon zigzag with =O at central vertex C4."}, {"q": "8.4", "number": "8.4", "title": "Systematic IUPAC names of six organic compounds", "conceptIdx": 1, "page": 37, "printPage": 292, "question": "Give the IUPAC names of the following compounds: (a) Propylbenzene derivative (C6H5-CH2-CH2-CH3), (b) CH3-CH(CH3)-CH2-CH2-CN, (c) 2,5-Dimethylheptane, (d) 3-Bromo-3-chlorohexane, (e) Cl-CH2-CH2-CHO, (f) Cl2CHCH2OH.", "steps": ["(a) A benzene ring attached to a three-carbon straight alkyl chain: 1-Phenylpropane (or propylbenzene).", "(b) CH3-CH(CH3)-CH2-CH2-CN: Principal group is nitrile (-CN, carbon 1). Longest continuous chain has 5 carbon atoms (pentanenitrile). Methyl substituent is at C4: 4-Methylpentanenitrile.", "(c) 7-carbon continuous chain (heptane). Methyl substituents at carbons 2 and 5 (lowest locant set 2,5): 2,5-Dimethylheptane.", "(d) 6-carbon continuous chain (hexane). At C3, both a bromine and a chlorine atom are attached: 3-Bromo-3-chlorohexane (bromo precedes chloro alphabetically).", "(e) Cl-CH2-CH2-CHO: Principal functional group is aldehyde (-CHO, C1). Chlorine substituent is at C3 of a 3-carbon chain: 3-Chloropropanal.", "(f) Cl2CH-CH2OH: Principal functional group is alcohol (-OH, C1). Two chlorine substituents are at C2: 2,2-Dichloroethanol."], "answer": "(a) 1-Phenylpropane (Propylbenzene); (b) 4-Methylpentanenitrile; (c) 2,5-Dimethylheptane; (d) 3-Bromo-3-chlorohexane; (e) 3-Chloropropanal; (f) 2,2-Dichloroethanol."}, {"q": "8.5", "number": "8.5", "title": "Identification and justification of correct IUPAC names", "conceptIdx": 1, "page": 37, "printPage": 292, "question": "Which of the following represents the correct IUPAC name for the compounds concerned? (a) 2,2-Dimethylpentane or 2-Dimethylpentane, (b) 2,4,7-Trimethyloctane or 2,5,7-Trimethyloctane, (c) 2-Chloro-4-methylpentane or 4-Chloro-2-methylpentane, (d) But-3-yn-1-ol or But-4-ol-1-yne.", "steps": ["(a) 2,2-Dimethylpentane is correct. When two identical substituents are attached to the same carbon atom, the numerical locant must be written twice separated by a comma (2,2-). '2-Dimethylpentane' is grammatically incorrect.", "(b) 2,4,7-Trimethyloctane is correct. Comparing the locant sets term by term: (2, 4, 7) vs (2, 5, 7). At the first point of difference, 4 is lower than 5. Hence 2,4,7-trimethyloctane is correct by the lowest locant rule.", "(c) 2-Chloro-4-methylpentane is correct. Both numbering directions produce the identical locant set (2, 4). When locant sets are identical, the substituent that comes first alphabetically ('chloro' before 'methyl') is assigned the lower numerical locant 2.", "(d) But-3-yn-1-ol is correct. The alcohol group (-ol) is the principal functional group and possesses higher priority than the triple bond (-yne), requiring the lowest possible locant (C1 for -OH). In 'But-4-ol-1-yne', the principal group was erroneously given high locant 4."], "answer": "(a) 2,2-Dimethylpentane; (b) 2,4,7-Trimethyloctane; (c) 2-Chloro-4-methylpentane; (d) But-3-yn-1-ol."}, {"q": "8.6", "number": "8.6", "title": "First five members of three homologous series", "conceptIdx": 1, "page": 37, "printPage": 292, "question": "Draw formulas for the first five members of each homologous series beginning with the following compounds: (a) H-COOH, (b) CH3COCH3, (c) H-CH=CH2.", "steps": ["(a) Carboxylic acids (homologous series general formula CnH2nO2):", "1. HCOOH (Methanoic acid / Formic acid)", "2. CH3COOH (Ethanoic acid / Acetic acid)", "3. CH3CH2COOH (Propanoic acid)", "4. CH3(CH2)2COOH (Butanoic acid)", "5. CH3(CH2)3COOH (Pentanoic acid)", "(b) Aliphatic ketones (general formula CnH2nO, minimum 3 carbons):", "1. CH3COCH3 (Propan-2-one / Acetone)", "2. CH3COCH2CH3 (Butan-2-one)", "3. CH3COCH2CH2CH3 (Pentan-2-one)", "4. CH3CO(CH2)3CH3 (Hexan-2-one)", "5. CH3CO(CH2)4CH3 (Heptan-2-one)", "(c) Alkenes (homologous series general formula CnH2n):", "1. CH2=CH2 (Ethene)", "2. CH3-CH=CH2 (Propene)", "3. CH3-CH2-CH=CH2 (But-1-ene)", "4. CH3-(CH2)2-CH=CH2 (Pent-1-ene)", "5. CH3-(CH2)3-CH=CH2 (Hex-1-ene)"], "answer": "(a) HCOOH, CH3COOH, C2H5COOH, C3H7COOH, C4H9COOH; (b) Propan-2-one, Butan-2-one, Pentan-2-one, Hexan-2-one, Heptan-2-one; (c) Ethene, Propene, But-1-ene, Pent-1-ene, Hex-1-ene."}, {"q": "8.7", "number": "8.7", "title": "Condensed and bond line formulas and functional groups", "conceptIdx": 0, "page": 37, "printPage": 292, "question": "Give condensed and bond line structural formulas and identify the functional group(s) present, if any, for: (a) 2,2,4-Trimethylpentane, (b) 2-Hydroxy-1,2,3-propanetricarboxylic acid, (c) Hexanedial.", "steps": ["(a) 2,2,4-Trimethylpentane: Condensed: (CH3)3C-CH2-CH(CH3)2. Bond line: 5-carbon zigzag with two vertical dashes at C2 and one at C4. Functional group: None (saturated alkane / hydrocarbon).", "(b) 2-Hydroxy-1,2,3-propanetricarboxylic acid (Citric acid): Condensed: HOOC-CH2-C(OH)(COOH)-CH2-COOH. Bond line: 3-carbon chain with -COOH groups at C1, C2, and C3, and an -OH group at C2. Functional groups: Carboxylic acid (-COOH) and tertiary alcohol (-OH).", "(c) Hexanedial: Condensed: OHC-(CH2)4-CHO. Bond line: 6-carbon zigzag terminating with =O at C1 and C6. Functional group: Aldehyde (-CHO)."], "answer": "(a) (CH3)3C-CH2-CH(CH3)2 (No functional group; alkane); (b) HOOC-CH2-C(OH)(COOH)-CH2-COOH (Carboxylic acid -COOH and alcohol -OH); (c) OHC-(CH2)4-CHO (Aldehyde -CHO)."}, {"q": "8.8", "number": "8.8", "title": "Identification of functional groups in three complex molecules", "conceptIdx": 1, "page": 37, "printPage": 292, "question": "Identify the functional groups in the following compounds: (a) Vanillin derivative (4-hydroxy-3-methoxybenzaldehyde), (b) Procaine analog (4-aminobenzoate ester with diethylamino side chain), (c) 2-(2-nitrovinyl)benzene.", "steps": ["(a) Compound (a) contains a benzene ring substituted with: (1) an aldehyde group (-CHO), (2) a methoxy / ether group (-OCH3), and (3) a phenolic hydroxyl group (-OH). Functional groups: Aldehyde, Ether, and Phenol.", "(b) Compound (b) contains: (1) a primary aromatic amino group (-NH2) on the benzene ring, (2) an ester linkage (-COO-CH2-), and (3) a tertiary aliphatic amino group (-N(C2H5)2). Functional groups: Primary amine, Ester, and Tertiary amine.", "(c) Compound (c) contains: (1) a nitro group (-NO2), (2) a carbon-carbon double bond / alkene (C=C), and (3) an aromatic benzene ring. Functional groups: Nitro group, Alkene, and Aromatic ring."], "answer": "(a) Aldehyde (-CHO), Ether (-OMe), Phenol (-OH); (b) Primary aromatic amine (-NH2), Ester (-COO-), Tertiary aliphatic amine (-N(C2H5)2); (c) Nitro group (-NO2), Alkene (C=C), Aromatic ring."}, {"q": "8.9", "number": "8.9", "title": "Relative stability of 2-nitroethoxide vs ethoxide anion", "conceptIdx": 4, "page": 37, "printPage": 292, "question": "Which of the two: O2NCH2CH2O⁻ or CH3CH2O⁻ is expected to be more stable and why?", "steps": ["Both species are alkoxide anions bearing a localized negative charge on the oxygen atom.", "In the ethoxide anion (CH3CH2O⁻), the ethyl group (-CH2CH3) is an electron-releasing group due to the +I inductive effect. It pushes electron density toward oxygen, intensifying the negative charge and destabilizing the anion.", "In 2-nitroethoxide (O2N-CH2-CH2-O⁻), the nitro group (-NO2) is a very powerful electron-withdrawing group due to its strong -I inductive effect.", "The -I effect of -NO2 pulls electron density away from the alkoxide oxygen, dispersing the negative charge over the carbon chain.", "Because charge dispersal lowers potential energy and confers thermodynamic stability, O2NCH2CH2O⁻ is substantially more stable than CH3CH2O⁻."], "answer": "O2NCH2CH2O⁻ is more stable because the strongly electron-withdrawing -NO2 group (-I effect) disperses the negative charge on oxygen, whereas the +I ethyl group in ethoxide concentrates charge."}, {"q": "8.10", "number": "8.10", "title": "Electron donor behavior of alkyl groups attached to pi systems (hyperconjugation)", "conceptIdx": 4, "page": 37, "printPage": 292, "question": "Explain why alkyl groups act as electron donors when attached to a π system.", "steps": ["When an alkyl group (such as -CH3) is attached to an unsaturated system (C=C or aromatic ring), it donates electrons via hyperconjugation (no-bond resonance).", "The σ-electrons of the C-H bond in the alkyl group are in spatial alignment with the adjacent unhybridized 2p orbital of the sp² carbon of the π system.", "This orbital overlap allows the σ(C-H) electron pair to delocalize into the π electron cloud: H-CH2-CH=CH2 <-> H⁺ CH2=CH-C⁻H2.", "Additionally, alkyl carbons are sp³ hybridized (25% s-character) while alkenic/aromatic carbons are sp² hybridized (33% s-character). Since sp² carbon is more electronegative, electrons are drawn from the alkyl group by inductive effect (+I).", "Hence, hyperconjugation combined with the +I inductive effect makes alkyl groups powerful electron donors to conjugated π systems."], "answer": "Alkyl groups donate electron density to π systems through hyperconjugation (delocalization of σ C-H electrons into adjacent vacant or π orbitals) and positive inductive (+I) effect."}, {"q": "8.11", "number": "8.11", "title": "Resonance structures using curved-arrow notation for six organic species", "conceptIdx": 4, "page": 37, "printPage": 292, "question": "Draw the resonance structures for the following compounds using curved-arrow notation: (a) C6H5OH, (b) C6H5NO2, (c) CH3CH=CHCHO, (d) C6H5-CHO, (e) C6H5-CH2⁺, (f) CH3CH=CH-CH2⁺.", "steps": ["(a) Phenol (C6H5OH): Oxygen lone pair delocalizes into the ring (+R effect). Five canonical structures: neutral phenol, and three dipolar forms with a C=O⁺ double bond and negative charges localized at the ortho and para positions.", "(b) Nitrobenzene (C6H5NO2): The -NO2 group withdraws electron density from the ring (-R effect). Five canonical structures: ring π-electrons move toward nitrogen, creating positive charges at the ortho and para positions, while oxygen takes a full negative charge.", "(c) But-2-enal (CH3CH=CH-CHO): Carbonyl oxygen is more electronegative, pulling π-electrons: CH3-CH=CH-CH=O <-> CH3-CH⁺-CH=CH-O⁻.", "(d) Benzaldehyde (C6H5CHO): -CHO group exerts -R effect on the benzene ring: ring π electrons shift toward the exocyclic C=O, placing positive charges at the ortho and para positions of the ring.", "(e) Benzyl carbocation (C6H5-CH2⁺): Ring π-electrons delocalize into the empty exocyclic 2p orbital of C⁺, generating 4 canonical structures where the positive charge is dispersed to the ortho and para ring carbons.", "(f) Allylic carbocation (CH3-CH=CH-CH2⁺): Two equivalent canonical structures: CH3-CH=CH-CH2⁺ <-> CH3-CH⁺-CH=CH2."], "answer": "All species exhibit resonance delocalization: (a) Phenol (+R, negative ortho/para); (b) Nitrobenzene (-R, positive ortho/para); (c) But-2-enal (dipolar conjugated); (d) Benzaldehyde (-R); (e) Benzyl cation (delocalized over ortho/para); (f) Allylic cation (charge shared between C1 and C3)."}, {"q": "8.12", "number": "8.12", "title": "Definitions and examples of electrophiles and nucleophiles", "conceptIdx": 3, "page": 37, "printPage": 292, "question": "What are electrophiles and nucleophiles? Explain with examples.", "steps": ["(1) Electrophiles (Electron-seeking reagents): Electron-deficient chemical species that attack regions of high electron density. They accept an electron pair to form a covalent bond (Lewis acids).", "Types of Electrophiles:", "• Positively charged ions: H⁺, H3O⁺, Cl⁺, Br⁺, NO2⁺ (nitronium ion), CH3⁺ (carbocation).", "• Neutral molecules with incomplete octets (electron sextets): BF3, AlCl3, FeCl3, SO3.", "(2) Nucleophiles (Nucleus-seeking reagents): Electron-rich chemical species possessing at least one unshared lone pair of electrons. They donate an electron pair to an electron-deficient center (Lewis bases).", "Types of Nucleophiles:", "• Negatively charged ions: OH⁻, RO⁻ (alkoxide), CN⁻, X⁻ (halide), NH2⁻, carbanions (R⁻).", "• Neutral molecules with unshared lone pairs: H2O, NH3, R-OH, R-NH2, R-SH."], "answer": "Electrophile
