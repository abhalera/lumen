nion is larger than parent atom:</strong></p><p>When an atom gains electrons to form an anion, the nuclear charge remains constant while extra electrons increase mutual electron-electron repulsion, causing the valence electron cloud to expand outward ($r(F) = 72$ pm vs $r(F^-) = 136$ pm).</p>", "verified": "Cation: higher Z_eff and valence shell loss shrinks radius; Anion: inter-electronic repulsion expands radius"}, {"num": "3.14", "title": "Significance of 'isolated gaseous atom' and 'ground state'", "question": "What is the significance of the terms — ‘isolated gaseous atom’ and ‘ground state’ when defining the ionization enthalpy?", "approach": "Explain elimination of intermolecular forces and baseline minimum thermodynamic energy.", "solution": "<p><strong>1. Isolated gaseous atom:</strong> In solid or liquid states, atoms experience strong interatomic, metallic, or Van der Waals forces, and interact with neighboring electron clouds. Ionization enthalpy must be an intrinsic atomic property; by specifying isolated gaseous atoms at low pressure, all intermolecular interactions are eliminated.</p><p><strong>2. Ground state:</strong> An atom can have electrons excited into higher energy levels. If an electron were already excited, less energy would be needed to remove it. Specifying ground state establishes a universal, reproducible thermodynamic baseline (lowest possible energy state).</p>", "verified": "Eliminates intermolecular bonds/lattice forces and ensures reproducible minimum baseline energy"}, {"num": "3.15", "title": "Ionization enthalpy of atomic hydrogen from ground state energy", "question": "Energy of an electron in the ground state of the hydrogen atom is −2.18 × 10⁻¹⁸ J. Calculate the ionization enthalpy of atomic hydrogen in terms of J mol⁻¹ and kJ mol⁻¹.", "approach": "Energy required to remove one electron to infinity is 2.18 × 10⁻¹⁸ J. Multiply by Avogadro's number.", "solution": "<p>Energy to ionize a single hydrogen atom from $n=1$ to $n=\\infty$:</p><p>$\\Delta E = E_\\infty - E_1 = 0 - (-2.18 \times 10^{-18}\text{ J}) = 2.18 \times 10^{-18}\text{ J atom}^{-1}$.</p><p>For one mole of hydrogen atoms ($N_A = 6.02214 \times 10^{23}\text{ mol}^{-1}$):</p><p>$\\Delta_i H = (2.18 \times 10^{-18}\text{ J atom}^{-1}) \times (6.02214 \times 10^{23}\text{ atoms mol}^{-1}) = <strong>1,312,827 J mol⁻¹ = 1.313 × 10⁶ J mol⁻¹</strong>.</p><p>In kilojoules: $\\Delta_i H = <strong>1312.8 kJ mol⁻¹</strong>.</p>", "verified": "1.313 × 10⁶ J mol⁻¹ (1312.8 kJ mol⁻¹)"}, {"num": "3.16", "title": "Anomalous first ionization enthalpies of Be vs B and N vs O", "question": "Among the second period elements the actual ionization enthalpies are in the order: Li < B < Be < C < O < N < F < Ne. Explain why (a) Be has higher Δ_i H than B, and (b) O has lower Δ_i H than N.", "approach": "Analyze subshell penetration of 2s vs 2p in Be/B, and exchange stability of half-filled 2p³ vs 2p⁴ pair repulsion in N/O.", "solution": "<p><strong>(a) Be (899 kJ/mol) > B (801 kJ/mol):</strong></p><p>Beryllium has configuration $1s^2 2s^2$ with a completely filled, compact $2s$ subshell that penetrates deeply toward the nucleus. Boron has configuration $1s^2 2s^2 2p^1$; the electron to be removed is in a $2p$ orbital, which is higher in energy and shielded by the inner $2s^2$ electrons. Removing a $2p$ electron from Boron requires less energy than removing a penetrating $2s$ electron from Beryllium.</p><p><strong>(b) N (1402 kJ/mol) > O (1314 kJ/mol):</strong></p><p>Nitrogen has configuration $1s^2 2s^2 2p_x^1 2p_y^1 2p_z^1$ — a symmetrical half-filled $2p^3$ subshell possessing extra thermodynamic stability due to maximum exchange energy. Oxygen has configuration $1s^2 2s^2 2p_x^2 2p_y^1 2p_z^1$; two electrons share the same $2p_x$ orbital, experiencing significant inter-electronic Coulomb repulsion that makes it easier to eject one electron.</p>", "verified": "(a) Be has penetrating full 2s² vs shielded 2p¹ in B; (b) N has stable half-filled 2p³ vs paired 2p⁴ repulsion in O"}, {"num": "3.17", "title": "First and second ionization enthalpies of Na vs Mg", "question": "How would you explain the fact that the first ionization enthalpy of sodium is lower than that of magnesium but its second ionization enthalpy is higher than that of magnesium?", "approach": "Compare configurations: Na (3s¹) vs Mg (3s²), and Na⁺ (2p⁶) vs Mg⁺ (3s¹).", "solution": "<p><strong>1. First Ionization Enthalpy (Δ_i H₁: Na = 496 kJ/mol &lt; Mg = 738 kJ/mol):</strong></p><p>Sodium ($[Ne] 3s^1$) readily loses its single valence electron to achieve a noble gas octet. Magnesium ($[Ne] 3s^2$) has higher nuclear charge ($Z = 12$ vs $11$) and a stable, fully filled $3s^2$ subshell, requiring significantly more energy to remove the first electron.</p><p><strong>2. Second Ionization Enthalpy (Δ_i H₂: Na⁺ = 4562 kJ/mol &gt;&gt; Mg⁺ = 1451 kJ/mol):</strong></p><p>For Sodium, the second electron must be extracted from the stable, closed noble-gas core of $Na^+$ ($[Ne] = 2s^2 2p^6$), requiring an immense surge of energy ($4562$ kJ/mol). For Magnesium, $Mg^+$ ($[Ne] 3s^1$) still possesses an outer valence electron; removing it achieves the stable noble gas octet ($Mg^{2+}$), requiring only $1451$ kJ/mol.</p>", "verified": "Δ_i H₁: Na 3s¹ < Mg 3s²; Δ_i H₂: Na⁺ breaks stable [Ne] 2p⁶ octet, while Mg⁺ loses 3s¹ to reach [Ne]"}, {"num": "3.18", "title": "Factors governing ionization enthalpy of an atom", "question": "What are the various factors due to which the ionization enthalpy of the main group elements tends to decrease down a group?", "approach": "List nuclear charge, atomic size, screening effect, and orbital penetration.", "solution": "<p>Down any main group, the primary factors governing ionization enthalpy are:</p><ol><li><strong>Increase in Atomic Radius:</strong> Successive principal energy shells ($n = 1, 2, 3...$) are added, placing valence electrons substantially farther from the nucleus.</li><li><strong>Increase in Screening / Shielding Effect:</strong> The number of inner core electrons increases dramatically, effectively shielding the valence electron from nuclear attraction.</li><li><strong>Net Effective Nuclear Charge:</strong> Although actual nuclear charge ($Z$) increases, the expansion in size and inner shielding dominate, so the valence electron is held less tightly and ionized with less energy.</li></ol>", "verified": "Increasing atomic radius and inner core electron shielding strongly dominate over increasing Z"}, {"num": "3.19", "title": "First ionization enthalpy anomaly in Group 13 elements", "question": "The first ionization enthalpy values (in kJ mol⁻¹) of group 13 elements are: B (801), Al (577), Ga (579), In (558), Tl (589). How would you explain this deviation from the general trend?", "approach": "Explain d-block contraction in Gallium and lanthanoid (4f) contraction in Thallium.", "solution": "<p>In Group 13, ionization enthalpy does not decrease smoothly down the group due to poor shielding by $d$ and $f$ subshells:</p><p>1. <strong>B (801) to Al (577):</strong> Normal expected decrease due to addition of shell $n=3$ and expansion of atomic radius.</p><p>2. <strong>Al (577) to Ga (579):</strong> Ga ($Z=31$) has ten inner $3d$ electrons ($[Ar] 3d^{10} 4s^2 4p^1$). Because $d$-orbitals have diffuse shapes, their shielding power is poor ($s > p > d > f$). The valence electrons feel a higher effective nuclear charge (<strong>d-block contraction</strong>), causing Ga's radius to contract ($135$ pm vs $143$ pm for Al) and increasing $\\Delta_i H_1$.</p><p>3. <strong>In (558) to Tl (589):</strong> Thallium ($Z=81$) contains fourteen inner $4f$ electrons ($[Xe] 4f^{14} 5d^{10} 6s^2 6p^1$). The $4f$ subshell has exceptionally poor shielding, resulting in a large surge in $Z_{eff}$ (<strong>Lanthanoid contraction</strong>) and holding the valence electrons exceptionally tightly.</p>", "verified": "Ga > Al due to poor 3d shielding (d-contraction); Tl > In due to poor 4f shielding (lanthanoid contraction)"}, {"num": "3.20", "title": "More negative electron gain enthalpy: O vs F and F vs Cl", "question": "Which of the following pairs of elements would have a more negative electron gain enthalpy: (i) O or F, (ii) F or Cl?", "approach": "Fluorine is higher than Oxygen; Chlorine is higher than Fluorine due to compact 2p repulsions.", "solution": "<p><strong>(i) O or F:</strong></p><p><strong>Fluorine (F)</strong> has a significantly more negative electron gain enthalpy ($-328$ kJ/mol) than Oxygen ($-141$ kJ/mol). Fluorine has higher nuclear charge ($Z = 9$ vs $8$) and smaller atomic radius, attracting an added electron more strongly to complete its stable noble gas octet.</p><p><strong>(ii) F or Cl:</strong></p><p><strong>Chlorine (Cl)</strong> has a more negative electron gain enthalpy ($-349$ kJ/mol) than Fluorine ($-328$ kJ/mol). In Fluorine, the incoming electron enters a very compact $2p$ subshell with extremely high electron density, experiencing strong inter-electronic Coulomb repulsion. In Chlorine, the electron enters a larger $3p$ subshell where inter-electronic repulsion is much lower.</p>", "verified": "(i) F is more negative than O (−328 vs −141 kJ/mol); (ii) Cl is more negative than F (−349 vs −328 kJ/mol)"}, {"num": "3.21", "title": "Second electron gain enthalpy of Oxygen", "question": "Would you expect the second electron gain enthalpy of O as positive, more negative or less negative than the first? Justify your answer.", "approach": "The first is exothermic (adding to neutral atom); the second is endothermic (adding to negative anion O-).", "solution": "<p>The second electron gain enthalpy of oxygen ($\\Delta_{eg} H_2$) is <strong>strongly positive (endothermic, +780 kJ mol⁻¹)</strong>.</p><p><em>Justification:</em> The first electron is added to a neutral Oxygen atom ($O + e^- \to O^-$, $\\Delta_{eg} H_1 = -141$ kJ/mol, exothermic). However, when a second electron is added to form the oxide ion ($O^- + e^- \to O^{2-}$), it experiences immense electrostatic repulsion from the negatively charged $O^-$ ion. Overcoming this strong repulsion requires external energy input, making the process endothermic.</p>", "verified": "Strongly positive (+780 kJ mol⁻¹, endothermic) due to electrostatic Coulomb repulsion from O⁻ anion"}, {"num": "3.22", "title": "Difference between electron gain enthalpy and electronegativity", "question": "What is the basic difference between the terms electron gain enthalpy and electronegativity?", "approach": "Contrast thermodynamic property of isolated gas atom vs bonded molecular tendency.", "solution": "<p><strong>1. Electron Gain Enthalpy:</strong></p><ul><li>Measures the energy change when an electron is added to an <strong>isolated gaseous atom</strong> in ground state: $X(g) + e^- \to X^-(g)$.</li><li>It is an absolute, measurable thermodynamic quantity expressed in units of <strong>kJ mol⁻¹ or eV</strong>.</li></ul><p><strong>2. Electronegativity:</strong></p><ul><li>Measures the qualitative tendency of an atom in a <strong>chemical compound</strong> to attract shared electron pairs toward itself.</li><li>It is not a thermodynamic property, cannot be directly measured experimentally, has <strong>no physical units</strong>, and varies with oxidation state and hybridization.</li></ul>", "verified": "Δ_eg H is measurable thermodynamic energy for isolated atom (kJ/mol); EN is dimensionless bonded molecular affinity"}, {"num": "3.23", "title": "Is Electronegativity of Nitrogen always 3.0?", "question": "How would you react to the statement that the electronegativity of N on Pauling scale is 3.0 in all nitrogen compounds?", "approach": "Electronegativity is not constant; it depends on hybridization state and oxidation number.", "solution": "<p>The statement is <strong>incorrect and overly simplified</strong>.</p><p>Electronegativity is not an invariant atomic constant; it depends strongly on:</p><ol><li><strong>Hybridization state:</strong> As s-character increases ($sp^3 < sp^2 < sp$), electronegativity increases because s-orbitals are closer to the nucleus. An $sp$-hybridized Nitrogen is noticeably more electronegative than an $sp^3$-hybridized Nitrogen.</li><li><strong>Oxidation state:</strong> An atom in a higher positive oxidation state has higher effective nuclear charge and attracts electrons more strongly (e.g. N in $NO_2$ is more electronegative than in $NH_3$).</li></ol>", "verified": "Incorrect; electronegativity varies with oxidation state, hybridization (sp > sp² > sp³), and bonded environment"}, {"num": "3.24", "title": "Theory of atomic radius change upon gaining or losing electrons", "question": "Describe the theory associated with the radius of an atom as it (a) gains an electron, (b) loses an electron.", "approach": "Explain electron-to-proton ratio and changes in electron cloud repulsion.", "solution": "<p><strong>(a) Gaining an electron (forming an anion):</strong></p><p>When an atom gains one or more electrons, the nuclear charge ($Z$) remains constant, but the number of electrons increases. This increases electron-electron repulsion, causing the valence electron cloud to expand. Additionally, the effective nuclear charge per electron ($Z_{eff}$) decreases, so the radius of an anion is always <strong>larger</strong> than its parent atom (e.g. $Cl$ = 99 pm vs $Cl^-$ = 181 pm).</p><p><strong>(b) Losing an electron (forming a cation):</strong></p><p>When an atom loses electrons, the nuclear charge exceeds the remaining electrons. The higher $Z_{eff}$ pulls remaining electrons closer to the nucleus, and shedding the outermost shell drastically shrinks the radius (e.g. $Na$ = 186 pm vs $Na^+$ = 102 pm).</p>", "verified": "(a) Gaining e⁻ increases repulsion and decreases Z_eff, expanding radius; (b) Losing e⁻ increases Z_eff, contracting radius"}, {"num": "3.25", "title": "First ionization enthalpies for isotopes of an element", "question": "Would you expect the first ionization enthalpies for two isotopes of the same element to be the same or different? Justify your answer.", "approach": "Ionization enthalpy is governed by electronic structure and nuclear charge Z, which are identical in isotopes.", "solution": "<p>The first ionization enthalpies for two isotopes of the same element (e.g. $^1H$ vs $^2H$, or $^{35}Cl$ vs $^{37}Cl$) are <strong>essentially identical</strong>.</p><p><em>Justification:</em> Ionization enthalpy is determined by: (1) Nuclear charge ($Z$), (2) Number of electrons, (3) Electronic configuration, and (4) Atomic radius. Isotopes have the exact same number of protons ($Z$) and electrons; only the number of neutrons differs. Because neutrons carry zero electric charge, their presence in the nucleus does not alter the electrostatic attraction between the nucleus and orbital electrons (aside from a negligible Rydberg reduced-mass correction &lt;0.05%).</p>", "verified": "Essentially identical; same nuclear charge Z and electron configuration dictate electrostatic ionization"}, {"num": "3.26", "title": "Major differences between metals and non-metals", "question": "What are the major differences between metals and non-metals?", "approach": "Contrast ionization enthalpy, electronegativity, oxide nature, and electrical conductivity.", "solution": "<table style='width:100%;border-collapse:collapse;'><tr><th>Property</th><th>Metals</th><th>Non-metals</th></tr><tr><td>Electronic Nature</td><td>Electropositive (readily lose electrons to form cations)</td><td>Electronegative (gain or share electrons to form anions)</td></tr><tr><td>Ionization Enthalpy</td><td>Low ionization enthalpy</td><td>High ionization enthalpy</td></tr><tr><td>Oxides</td><td>Form basic or amphoteric oxides (e.g. Na₂O, MgO)</td><td>Form acidic or neutral oxides (e.g. SO₂, CO₂)</td></tr><tr><td>Physical Properties</td><td>Malleable, ductile, lustrous, high electrical & thermal conductivity</td><td>Brittle solids or gases, non-conductors (except graphite)</td></tr></table>", "verified": "Metals: electropositive, low Δ_i H, basic oxides; Non-metals: electronegative, high Δ_i H, acidic oxides"}, {"num": "3.27", "title": "Periodic table identification: valence electrons, losing/gaining e-", "question": "Use the periodic table to answer the following questions: (a) Identify an element with 5 electrons in the outer subshell, (b) Identify an element that would tend to lose 2 electrons, (c) Identify an element that would tend to gain 2 electrons, (d) Identify the group having metal, non-metal, liquid as well as gas at room temperature.", "approach": "Match configurations to groups 17, 2, 16, and halogens (Group 17).", "solution": "<p><strong>(a) 5 electrons in outer subshell ($np^5$):</strong> Group 17 halogens — <strong>Fluorine (F) or Chlorine (Cl)</strong>.</p><p><strong>(b) Tends to lose 2 electrons ($ns^2$):</strong> Group 2 alkaline earth metals — <strong>Magnesium (Mg) or Calcium (Ca)</strong>.</p><p><strong>(c) Tends to gain 2 electrons ($ns^2 np^4$):</strong> Group 16 chalcogens — <strong>Oxygen (O) or Sulfur (S)</strong>.</p><p><strong>(d) Group having metal, non-metal, liquid as well as gas:</strong> <strong>Group 17 (Halogens)</strong>: Fluorine and Chlorine are gases; Bromine is a liquid; Iodine is a solid non-metal; Astatine/Tennessine exhibit metallic character.</p>", "verified": "(a) F, Cl (Group 17); (b) Mg, Ca (Group 2); (c) O, S (Group 16); (d) Group 17 (Halogens)"}, {"num": "3.28", "title": "Reactivity order in Group 1 vs Group 17", "question": "The increasing order of reactivity among group 1 elements is Li < Na < K < Rb < Cs whereas that among group 17 elements is F > Cl > Br > I. Explain.", "approach": "Group 1 reacts by losing electrons (oxidation); Group 17 reacts by gaining electrons (reduction).", "solution": "<p><strong>1. Group 1 Alkali Metals:</strong> React by <strong>losing their valence electron</strong> ($M \to M^+ + e^-$). Down the group, atomic size increases and ionization enthalpy decreases, making it progressively easier to lose the electron. Hence reactivity <strong>increases down Group 1</strong>: $Li < Na < K < Rb < Cs$.</p><p><strong>2. Group 17 Halogens:</strong> React by <strong>gaining an electron</strong> ($X + e^- \to X^-$). Up the group, atomic radius contracts and electronegativity increases, maximizing the nucleus's ability to attract an incoming electron. Hence oxidizing reactivity <strong>decreases down Group 17</strong>: $F > Cl > Br > I$.</p>", "verified": "Group 1 loses e⁻ (easier down group with low Δ_i H); Group 17 gains e⁻ (easier up group with high EN)"}, {"num": "3.29", "title": "General outer electronic configurations of s, p, d, f blocks", "question": "Write the general outer electronic configuration of s-, p-, d- and f-block elements.", "approach": "State standard IUPAC valence shell representations.", "solution": "<ul><li><strong>s-Block:</strong> <strong>ns¹⁻²</strong> (where n = 2 to 7)</li><li><strong>p-Block:</strong> <strong>ns² np¹⁻⁶</strong> (where n = 2 to 6)</li><li><strong>d-Block:</strong> <strong>(n − 1)d¹⁻¹⁰ ns⁰⁻²</strong> (where n = 4 to 7)</li><li><strong>f-Block:</strong> <strong>(n − 2)f¹⁻¹⁴ (n − 1)d⁰⁻¹ ns²</strong> (where n = 6 for lanthanoids and n = 7 for actinoids)</li></ul>", "verified": "s: ns¹⁻²; p: ns² np¹⁻⁶; d: (n−1)d¹⁻¹⁰ ns⁰⁻²; f: (n−2)f¹⁻¹⁴ (n−1)d⁰⁻¹ ns²"}, {"num": "3.30", "title": "Assigning positions from outer configurations", "question": "Assign the position of the element having outer electronic configuration: (i) ns² np⁴ for n = 3, (ii) (n − 1)d² ns² for n = 4, (iii) (n − 2)f⁷ (n − 1)d¹ ns² for n = 6.", "approach": "Principal quantum number gives period; subshell and valence electrons give group.", "solution": "<p><strong>(i) ns² np⁴ for n = 3 (3s² 3p⁴):</strong></p><p>Period = <strong>3</strong>; Block = <strong>p-block</strong>; Group = $12 + 4 = <strong>16</strong> (Sulfur, S, Z = 16).</p><p><strong>(ii) (n − 1)d² ns² for n = 4 (3d² 4s²):</strong></p><p>Period = <strong>4</strong>; Block = <strong>d-block</strong>; Group = $2 + 2 = <strong>4</strong> (Titanium, Ti, Z = 22).</p><p><strong>(iii) (n − 2)f⁷ (n − 1)d¹ ns² for n = 6 (4f⁷ 5d¹ 6s²):</strong></p><p>Period = <strong>6</strong>; Block = <strong>f-block (Lanthanoids)</strong>; Group = <strong>3</strong> (Gadolinium, Gd, Z = 64).</p>", "verified": "(i) Period 3, Group 16; (ii) Period 4, Group 4; (iii) Period 6, Group 3 (f-block, Lanthanoid)"}, {"num": "3.31", "title": "Identifying elements from ionization and electron gain enthalpies", "question": "The first (Δ_i H₁) and second (Δ_i H₂) ionization enthalpies and electron gain enthalpy (Δ_eg H) in kJ mol⁻¹ of a few elements are given below:\nI: 520, 7300, −60\nII: 419, 3051, −48\nIII: 1681, 3374, −328\nIV: 1008, 1846, −295\nV: 2372, 5251, +48\nVI: 738, 1451, −40\nWhich element is: (a) least reactive, (b) most reactive metal, (c) most reactive non-metal, (d) least reactive non-metal, (e) metal forming stable binary halide MX₂?", "approach": "Analyze enthalpy profiles: Noble gas (high Δ_i H, positive Δ_eg H), Alkali metal (low Δ_i H, huge Δ_i H₂ jump), Halogen (high negative Δ_eg H), Alkaline earth (Δ_i H₁ + Δ_i H₂ moderate).", "solution": "<ul><li><strong>(a) Least reactive element:</strong> <strong>V</strong> (Highest Δ_i H₁ = 2372 kJ/mol, positive Δ_eg H = +48 kJ/mol => Helium, noble gas).</li><li><strong>(b) Most reactive metal:</strong> <strong>II</strong> (Lowest Δ_i H₁ = 419 kJ/mol, very high Δ_i H₂ = 3051 kJ/mol => Potassium, alkali metal).</li><li><strong>(c) Most reactive non-metal:</strong> <strong>III</strong> (High Δ_i H₁ = 1681 kJ/mol and very high negative Δ_eg H = −328 kJ/mol => Fluorine/halogen).</li><li><strong>(d) Least reactive non-metal:</strong> <strong>IV</strong> (Moderately high Δ_i H₁ = 1008 kJ/mol, negative Δ_eg H = −295 kJ/mol => Iodine).</li><li><strong>(e) Metal forming stable binary halide MX₂:</strong> <strong>VI</strong> (Δ_i H₁ = 738 kJ/mol and Δ_i H₂ = 1451 kJ/mol can be compensated by lattice energy => Magnesium, Group 2 alkaline earth metal).</li></ul>", "verified": "(a) V (noble gas He); (b) II (alkali metal K); (c) III (halogen F); (d) IV; (e) VI (alkaline earth Mg)"}, {"num": "3.32", "title": "Predict formulas of stable binary compounds", "question": "Predict the formulas of the stable binary compounds that would be formed by the combination of the following pairs of elements:\n(a) Silicon and bromine, (b) Aluminium and iodine, (c) Magnesium and nitrogen, (d) Phosphorus and fluorine, (e) Element 120 and halogen.", "approach": "Determine valencies from group positions: Si (4), Br (1); Al (3), I (1); Mg (2), N (3); P (3 or 5), F (1); E120 (2), Halogen (1).", "solution": "<ul><li>(a) <strong>Silicon (valency 4) and Bromine (valency 1):</strong> Formula = <strong>SiBr₄</strong> (Silicon tetrabromide).</li><li>(b) <strong>Aluminium (valency 3) and Iodine (valency 1):</strong> Formula = <strong>AlI₃</strong> (Aluminium triiodide).</li><li>(c) <strong>Magnesium (valency 2) and Nitrogen (valency 3):</strong> Formula = <strong>Mg₃N₂</strong> (Magnesium nitride).</li><li>(d) <strong>Phosphorus (valency 3 or 5) and Fluorine (valency 1):</strong> Formula = <strong>PF₃ or PF₅</strong>.</li><li>(e) <strong>Element 120 (alkaline earth metal, valency 2) and Halogen X (valency 1):</strong> Formula = <strong>(E120)X₂</strong>.</li></ul>", "verified": "(a) SiBr₄; (b) AlI₃; (c) Mg₃N₂; (d) PF₃ / PF₅; (e) EX₂"}, {"num": "3.33", "title": "Period indicates the value of principal quantum number", "question": "In the modern periodic table, the period indicates the value of: (a) atomic number, (b) atomic mass, (c) principal quantum number, (d) azimuthal quantum number.", "approach": "The horizontal periods represent highest principal quantum level n.", "solution": "<p>The period number directly corresponds to the <strong>principal quantum number (n)</strong> of the outermost valence electron shell being filled.</p><p>Correct option: <strong>(c) principal quantum number</strong>.</p>", "verified": "(c) principal quantum number (n)"}, {"num": "3.34", "title": "Identification of incorrect statement in modern periodic table", "question": "Which of the following statements related to the modern periodic table is incorrect?\n(a) The p-block has 6 columns, because a maximum of 6 electrons can occupy all the orbitals in a p-subshell.\n(b) The d-block has 8 columns, because a maximum of 8 electrons can occupy all the orbitals in a d-subshell.\n(c) Each block contains a number of columns equal to the number of electrons that can occupy that subshell.\n(d) The block indicates value of azimuthal quantum number (l) for the last subshell that received electrons in building up the electronic configuration.", "approach": "d-subshell has 5 orbitals and holds 10 electrons; therefore d-block has 10 columns, not 8.", "solution": "<p>Statement <strong>(b) is incorrect</strong>.</p><p>The azimuthal quantum number for a $d$-subshell is $l = 2$, which possesses $2l + 1 = 5$ degenerate orbitals ($d_{xy}, d_{yz}, d_{zx}, d_{x^2-y^2}, d_{z^2}$). Since each orbital holds 2 electrons by the Pauli exclusion principle, the $d$-subshell can accommodate a maximum of <strong>10 electrons</strong>. Hence the $d$-block has <strong>10 columns</strong> (Groups 3 to 12), not 8.</p>", "verified": "(b) is incorrect (d-block has 10 columns because d-subshell holds 10 electrons)"}, {"num": "3.35", "title": "Factors affecting chemical properties through valence electrons", "question": "Anything that influences the valence electrons will affect the chemistry of the element. Which one of the following factors does not affect the valence shell?\n(a) Valence principal quantum number (n)\n(b) Nuclear charge (Z)\n(c) Nuclear mass\n(d) Number of core electrons", "approach": "Nuclear mass (neutrons) has zero charge and does not affect valence electrostatic attraction.", "solution": "<p>Chemical reactivity is governed by electrostatic Coulomb interactions between the positive nuclear charge ($Z$) and negative orbital electrons, moderated by the principal quantum shell ($n$) and screening by core electrons.</p><p><strong>Nuclear mass</strong> (determined by neutral neutrons) carries zero electric charge and has no appreciable influence on the electrostatic potential or orbital distribution of valence electrons.</p><p>Correct option: <strong>(c) Nuclear mass</strong>.</p>", "verified": "(c) Nuclear mass (neutrons do not alter electrostatic valence potential)"}, {"num": "3.36", "title": "Size of isoelectronic species F-, Ne, Na+", "question": "The size of isoelectronic species — F⁻, Ne and Na⁺ is affected by:\n(a) nuclear charge (Z)\n(b) valence principal quantum number (n)\n(c) electron-electron interaction in the outer orbitals\n(d) none of the factors because their size is the same.", "approach": "For identical electron configurations, nuclear charge Z dictates ionic size.", "solution": "<p>All three species possess identical 10-electron configurations ($1s^2 2s^2 2p^6$) in the same valence shell ($n = 2$). The difference in their size is dictated entirely by their <strong>nuclear charge (Z)</strong>: F⁻ ($Z = 9$), Ne ($Z = 10$), Na⁺ ($Z = 11$). The higher the nuclear charge, the more strongly the 10 electrons are pulled toward the nucleus ($r(Na^+) < r(Ne) < r(F^-)$).</p><p>Correct option: <strong>(a) nuclear charge (Z)</strong>.</p>", "verified": "(a) nuclear charge (Z)"}, {"num": "3.37", "title": "Incorrect statement regarding ionization enthalpy", "question": "Which one of the following statements is incorrect in relation to ionization enthalpy?\n(a) Ionization enthalpy increases for each successive electron.\n(b) The greatest increase in ionization enthalpy is experienced on removal of an electron from core noble gas configuration.\n(c) End of valence electrons is marked by a big jump in ionization enthalpy.\n(d) Removal of electron from orbitals bearing lower n value is easier than from orbital having higher n value.", "approach": "Electrons in lower n orbitals are closer to nucleus and held much more tightly.", "solution": "<p>Statement <strong>(d) is incorrect</strong>.</p><p>Orbitals with a lower principal quantum number $n$ are closer to the nucleus and experience far greater electrostatic attraction with less shielding. Consequently, removing an electron from an orbital with a lower $n$ value (e.g. $2s$) is <strong>much more difficult</strong> (requires much more energy) than removing an electron from an orbital with a higher $n$ value (e.g. $3s$).</p>", "verified": "(d) is incorrect (removal from lower n is much harder, not easier)"}, {"num": "3.38", "title": "Order of metallic character for B, Al, Mg, and K", "question": "Considering the elements B, Al, Mg, and K, the correct order of their metallic character is:\n(a) B > Al > Mg > K\n(b) Al > Mg > B > K\n(c) Mg > Al > K > B\n(d) K > Mg > Al > B", "approach": "Metallic character increases down a group and decreases across a period.", "solution": "<p>Metallic character corresponds to electropositive nature (ease of losing electrons):</p><ul><li><strong>K</strong> is an alkali metal in Period 4 (Group 1) with the lowest ionization enthalpy — <strong>most metallic</strong>.</li><li><strong>Mg</strong> is an alkaline earth metal in Period 3 (Group 2) — more metallic than Al.</li><li><strong>Al</strong> is in Period 3 (Group 13) — amphoteric metal.</li><li><strong>B</strong> is in Period 2 (Group 13) — non-metal / metalloid with highest ionization enthalpy.</li></ul><p>Decreasing metallic character: <strong>K &gt; Mg &gt; Al &gt; B</strong> (Option d).</p>", "verified": "(d) K > Mg > Al > B"}, {"num": "3.39", "title": "Order of non-metallic character for B, C, N, F, and Si", "question": "Considering the elements B, C, N, F, and Si, the correct order of their non-metallic character is:\n(a) B > C > Si > N > F\n(b) Si > C > B > N > F\n(c) F > N > C > B > Si\n(d) F > N > C > Si > B", "approach": "Non-metallic character increases across a period and decreases down a group. Compare B vs Si.", "solution": "<p>Non-metallic character corresponds to electronegativity and ease of gaining electrons:</p><ul><li>Across Period 2: non-metallic character increases strictly from left to right: <strong>F &gt; N &gt; C &gt; B</strong>.</li><li>Comparing Carbon and Silicon (Group 14): C is smaller and more electronegative than Si ($C > Si$).</li><li>Comparing Boron and Silicon: Carbon is non-metal, Silicon is metalloid/semi-metal. Boron is at the non-metal boundary, but Carbon is distinctly more non-metallic than both. Comparing B (electronegativity 2.04) and Si (electronegativity 1.90), B is slightly more non-metallic than Si.</li></ul><p>Correct order: <strong>F &gt; N &gt; C &gt; B &gt; Si</strong> (Option c).</p>", "verified": "(c) F > N > C > B > Si"}, {"num": "3.40", "title": "Order of chemical oxidizing reactivity for F, Cl, O, and N", "question": "Considering the elements F, Cl, O and N, the correct order of their chemical reactivity in terms of oxidizing property is:\n(a) F > Cl > O > N\n(b) F > O > Cl > N\n(c) Cl > F > O > N\n(d) O > F > N > Cl", "approach": "Standard reduction potentials and electronegativities: F (E° = +2.87 V), O (E° = +1.23 V), Cl (E° = +1.36 V). In gas/solution phase: F > O > Cl > N.", "solution": "<p>Oxidizing property measures the power to accept electrons and reduce another chemical species:</p><ul><li><strong>Fluorine (F₂)</strong> is the most powerful oxidizing agent in the entire periodic table ($E^\\circ = +2.87$ V) due to its high electronegativity (4.0), low F–F bond dissociation enthalpy, and extremely high hydration enthalpy of $F^-$.</li><li><strong>Oxygen (O₂)</strong> is the second most electronegative element (3.5) and oxidizes virtually all elements except fluorine.</li><li><strong>Chlorine (Cl₂)</strong> has $E^\\circ = +1.36$ V, followed by <strong>Nitrogen</strong>, which is chemically inert due to its very strong $N \\equiv N$ triple bond ($945$ kJ/mol).</li></ul><p>Correct order of oxidizing reactivity: <strong>F &gt; O &gt; Cl &gt; N</strong> (Option b) [or F > Cl > O > N depending on thermodynamic criterion]. In NCERT: <strong>F &gt; O &gt; Cl &gt; N</strong>.</p>", "verified": "(b) F > O > Cl > N (Fluorine is strongest oxidizer, followed by Oxygen, Chlorine, Nitrogen)"}], "revision_summary": {"key_laws": [{"name": "Döbereiner's Law of Triads", "formula": "Mass(B) ≈ [Mass(A) + Mass(C)] / 2", "context": "Early triad arithmetic mean (Li-Na-K, Ca-Sr-Ba, Cl-Br-I)."}, {"name": "Mendeleev's Periodic Law", "formula": "Properties = f(Atomic Weight)", "context": "Prioritized hydride/oxide formulas and predicted Gallium and Germanium."}, {"name": "Moseley's Law", "formula": "√ν = a · (Z − b)", "context": "X-ray frequencies established atomic number Z as fundamental identity."}, {"name": "Modern Periodic Law", "formula": "Properties = f(Atomic Number Z)", "context": "7 periods (n = 1..7) and 18 groups across s, p, d, f blocks."}, {"name": "Atomic & Ionic Radii Trend", "formula": "Period: Decreases (increasing Z_eff); Group: Increases (new n shells)", "context": "Cation < parent atom < anion; Isoelectronic radius ∝ 1/Z."}, {"name": "Ionization Enthalpy", "formula": "Period: Increases; Group: Decreases", "context": "Anomalies: Be > B (full 2s²) and N > O (half-filled 2p³ exchange stability)."}, {"name": "Electron Gain Enthalpy", "formula": "Most exothermic in halogens; Cl > F (−349 vs −328 kJ/mol)", "context": "Compact 2p shell in F produces intense inter-electronic repulsion."}, {"name": "Pauling Electronegativity", "formula": "F = 4.0, O = 3.5, N = 3.0, Cl = 3.0, C = 2.5, H = 2.1", "context": "Bonded electron attracting power increases up and right."}, {"name": "Anomalous Second Period", "formula": "Max Covalency = 4 (no d-orbitals)", "context": "Small size, high charge density, and diagonal relationships (Li-Mg, Be-Al)."}], "common_pitfalls": ["Assuming Fluorine has a more negative electron gain enthalpy than Chlorine — Chlorine is higher (−349 kJ/mol vs −328 kJ/mol) due to compact 2p repulsion in F.", "Expecting Oxygen to have a higher first ionization enthalpy than Nitrogen — Nitrogen is higher (1402 kJ/mol vs 1314 kJ/mol) due to half-filled 2p³ stability.", "Believing noble gases have covalent radii in standard periodic tables — noble gas values are Van der Waals radii, which are inherently 40–50% larger.", "Confusing electron gain enthalpy (thermodynamic isolated atom energy, kJ/mol) with electronegativity (dimensionless bonded tendency).", "Assuming Nitrogen can form NCl₅ like Phosphorus forms PCl₅ — Nitrogen lacks vacant d-orbitals in n=2, setting an absolute covalency ceiling of 4."]}};
</script>
<script>
(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp) disp.innerHTML = "t = <b>" + state.t.toFixed(1) + " s</b>";
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Concept View ---
  function renderConcept(idx){
    pause();
    state.conceptIndex = idx;
    state.t = 0;
    state.level = 0;

    var lessons = C.lessons || C.concepts || [];
    var l = lessons[idx];
    if(!l) return;

    var navTitle = l.nav || l.navTitle || l.title || ("Concept " + (idx + 1));

    // Update sidebar navigation active state
    var navBtns = document.querySelectorAll(".concept-nav");
    navBtns.forEach(function(b, i){
      if(b.id === "nav-revision") b.classList.remove("active");
      else b.classList.toggle("active", i === idx);
    });

    // Update top crumb
    var chNum = C.chapterNumber || (C.code ? C.code.replace(/\D/g, '') : "01");
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · " + navTitle.toUpperCase();

    // Show concept view, hide revision
    var cView = document.getElementById("concept-view");
    var rView = document.getElementById("revision-view");
    if(cView) cView.style.display = "block";
    if(rView) rView.style.display = "none";

    var html = "";

    // Concept Header
    var minutes = l.minutes || 10;
    var printPage = l.print || (l.pages ? l.pages.join("–") : (C.page_start ? "pp. " + C.page_start + "–" + C.page_end : ""));
    html += '<div class="concept-header">' +
      '<div class="concept-badge"><span>Concept ' + ("0" + (idx + 1)).slice(-2) + ' / ' + ("0" + lessons.length).slice(-2) + '</span>' +
      (printPage ? '<span class="time-pill">≈ ' + minutes + ' min · ' + printPage + '</span>' : '<span class="time-pill">≈ ' + minutes + ' min</span>') +
      '</div>' +
      '<h1 class="concept-title">' + (l.title || navTitle) + '</h1>' +
      '<p class="concept-deck">' + (l.deck || l.summary || "") + '</p>' +
      '</div>';

    // 01 LEARN BLOCK
    html += '<section class="learn-section" data-block="learn" aria-label="Learn Concept">' +
      '<span class="block-tag">01 · LEARN · CORE ESSENTIALS</span>';

    var quickItems = [];
    if(Array.isArray(l.quick)) {
      quickItems = l.quick;
    } else if(Array.isArray(l.summary)) {
      quickItems = l.summary;
    } else if(l.reading_content) {
      quickItems = [l.reading_content];
    } else if(l.summary || l.deck) {
      quickItems = [l.summary || l.deck];
    }

    html += '<div class="quick-summary">' + quickItems.map(function(p){
      if(p.includes('<p>') || p.includes('<div>') || p.includes('<h3>')) return p;
      var formatted = p.replace(/###\s+(.*?)\n/g, '<h3 style="margin-top:16px;color:var(--ink);">$1</h3>')
                       .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                       .replace(/\*(.*?)\*/g, '<em>$1</em>')
                       .replace(/\n\n/g, '</p><p>');
      return '<p>' + formatted + '</p>';
    }).join("") + '</div>';

    // Semantic Equations Card
    var formulas = l.formulas || [];
    if(formulas.length){
      html += '<div class="key-equations-card">' +
        '<div class="equations-heading">Key Relations for this Concept</div>' +
        '<div class="eq-grid">' +
        formulas.map(function(eq){
          var label = eq.label || eq.name || "Relation";
          var cond = eq.cond || "";
          var math = eq.html || eq.formula || "";
          return '<div class="eq-row">' +
            '<div class="eq-meta"><span class="eq-label">' + label + '</span>' + (cond ? '<span class="eq-cond">' + cond + '</span>' : '') + '</div>' +
            '<div class="eq-math">' + math + '</div>' +
            '</div>';
        }).join("") +
        '</div></div>';
    }

    // Deeper dive / core takeaways
    if(l.deeper){
      html += '<details class="deep-dive"><summary>Go deeper into the conceptual foundation</summary><p>' + l.deeper + '</p></details>';
    } else if(l.takeaways && l.takeaways.length){
      html += '<details class="deep-dive"><summary>Key Conceptual Takeaways</summary><ul>' +
        l.takeaways.map(function(t){ return '<li>' + t + '</li>'; }).join("") +
        '</ul></details>';
    }

    // Worked Example
    var worked = l.worked || l.worked_example;
    if(worked){
      var workedHtml = typeof worked === 'object' && worked !== null
        ? '<strong>' + (worked.title || 'Worked Example') + '</strong><br>' + (worked.problem || '') +
          (worked.given ? '<br><br><strong>Given:</strong> ' + worked.given : '') +
          (worked.steps ? '<br><strong>Steps:</strong><br>' + worked.steps.map(function(s){ return '&bull; ' + s; }).join('<br>') : '') +
          (worked.solution ? '<br><br><strong>Solution:</strong> ' + worked.solution : '') +
          (worked.answer ? '<br><br><strong>Answer:</strong> ' + worked.answer : '')
        : String(worked);
      html += '<details class="deep-dive"><summary>Worked textbook example step by step</summary><p>' + workedHtml + '</p></details>';
    }

    html += '</section>';

    // 02 PREDICT FIRST BLOCK
    var pred = l.prediction || l.predict || l.predict_first;
    if(pred && typeof pred === 'object' && (pred.prompt || pred.scenario) && pred.options && pred.options.length){
      var promptText = pred.prompt || pred.scenario || "";
      html += '<section class="predict-card" data-block="predict" aria-label="Predict First">' +
        '<div class="predict-badge">02 · PREDICT FIRST · TEST YOUR INTUITION</div>' +
        '<div class="predict-prompt">' + promptText.replace(/\n/g, '<br>') + '</div>' +
        '<div class="predict-options" id="predict-options">' +
        pred.options.map(function(opt, oi){
          return '<label class="predict-option"><input type="radio" name="predict_ans" value="' + oi + '"><span>' + opt + '</span></label>';
        }).join("") +
        '</div>' +
        '<div class="predict-actions">' +
        '<button class="btn-primary" id="btn-check-prediction">Check Prediction</button>' +
        '<button class="btn-secondary" id="btn-skip-prediction">Skip to Lab</button>' +
        '</div>' +
        '<div id="predict-feedback-box" class="predict-feedback" style="display:none;"></div>' +
        '</section>';
    }

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();
    var whatWatch = (pred && pred.prompt) ? pred.prompt : (typeof l.predict === 'string' ? l.predict : "Explore the interactive simulation controls, parameters, and readouts below.");
    html += '<section class="lab-card" data-block="play" aria-label="Interactive Laboratory">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +
      '<div id="sim-mount-point" class="sim-mount-container" style="width:100%;min-height:220px;margin-top:12px;">' +
        '<div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 720 300" role="img" aria-label="' + simTitle + '"></svg></div>' +
        '<div class="lab-legend" id="lab-legend"></div>' +
        '<div class="lab-toolbar" id="legacy-lab-toolbar">' +
          '<button class="toolbar-btn primary" id="btn-play-pause" aria-label="Play animation">▶ Play</button>' +
          '<button class="toolbar-btn" id="btn-step-fwd" aria-label="Step forward">⏭ Step (+0.5s)</button>' +
          '<button class="toolbar-btn" id="btn-reset-time" aria-label="Reset timeline">↺ Reset</button>' +
          '<span class="time-display" id="time-display">t = <b>0.0 s</b></span>' +
          '<div class="scrubber-wrap">' +
            '<input type="range" id="time-scrubber" class="timeline-scrubber" min="0" max="6" step="0.1" value="0" aria-label="Timeline time scrubber">' +
          '</div>' +
        '</div>' +
        '<div class="preset-bar" id="preset-bar"></div>' +
        '<div class="lab-controls-grid" id="lab-controls"></div>' +
        '<div class="lab-readout" id="lab-readout" role="status" aria-live="polite"></div>' +
        '<div class="lab-verdict" id="lab-verdict" role="status" aria-live="polite"></div>' +
      '</div>' +
      '</section>';

    // 04 CONNECT BLOCK
    var connectItems = l.connect || [];
    if(connectItems.length){
      html += '<section class="connect-section" data-block="connect" aria-label="Real World Connections">' +
        '<span class="block-tag">04 · CONNECT · REAL WORLD APPLICATIONS</span>' +
        '<div class="connect-grid">' +
        connectItems.map(function(item){
          var title = Array.isArray(item) ? item[0] : (item.title || "Real World Context");
          var desc = Array.isArray(item) ? item[1] : (item.text || item.desc || "");
          var links = Array.isArray(item) ? (item[2] || []) : (item.links || (item.link ? [{t: "Read Deeply", u: item.link}] : []));
          var v = Array.isArray(item) ? (item[3] || null) : (item.video || null);
          var wow = /^Wow/i.test(title);

          var cHtml = '<div class="connect-card' + (wow ? ' wow' : '') + '"' + (wow ? (links[0] && links[0].u ? ' data-wow data-source="' + links[0].u + '"' : ' data-wow') : '') + '>';
          if(wow) cHtml += '<span class="wow-badge">WOW · REAL WORLD</span>';
          cHtml += '<h3>' + title + '</h3><p>' + desc + '</p>';
          if(v && v.id){
            cHtml += '<button class="video-facade" data-yt="' + v.id + '" aria-label="Play video: ' + v.title + '">' +
              '<span class="thumb" aria-hidden="true"></span>' +
              '<span class="play-btn">▶</span>' +
              '<span class="video-title">' + v.title + ' · ' + v.channel + '</span>' +
              '</button>';
          }
          if(links && links.length){
            cHtml += '<p style="margin-top:10px;font-size:12px;color:var(--muted)">References: ' +
              links.map(function(a){ return '<a href="' + (a.u || a.link || "#") + '" target="_blank" rel="noopener">' + (a.t || a.label || "Read Deeply") + ' ↗</a>'; }).join(", ") +
              '</p>';
          }
          cHtml += '</div>';
          return cHtml;
        }).join("") +
        '</div></section>';
    }

    // 05 PRACTICE BLOCK
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(quizzes.length){
      html += '<section class="practice-section" data-block="practice" aria-label="Practice and Mastery">' +
        '<span class="block-tag">05 · PRACTICE · MULTI-TIER CHALLENGE</span>' +
        '<div class="practice-nav">';
      for(var qi = 0; qi < quizzes.length; qi++){
        var tierName = qi === 0 ? "Tier 1: Easy" : (qi === 1 ? "Tier 2: Medium" : (qi === 2 ? "Tier 3: Hard" : "Question " + (qi + 1)));
        html += '<button class="level-tab' + (qi === 0 ? ' active' : '') + '" data-lvl="' + qi + '">' + tierName + '</button>';
      }
      html += '</div>' +
        '<div id="quiz-container"></div>' +
        '</section>';
    }

    // 06 REVISE CALLOUT
    var recall = l.recall || (l.takeaways && l.takeaways.length ? l.takeaways[0] : (l.core_takeaways && l.core_takeaways.length ? l.core_takeaways[0] : "Reflect on how this concept connects to physical reality."));
    html += '<div class="revise-callout"><strong>06 · REVISE · SAY IT IN YOUR OWN WORDS:</strong> ' + recall + '</div>';

    // Footer Navigation
    var nextNav = idx < lessons.length - 1 ? (lessons[idx + 1].nav || lessons[idx + 1].navTitle || lessons[idx + 1].title || ("Concept " + (idx + 2))) : "";
    html += '<div class="concept-footer-nav">' +
      (idx > 0 ? '<button class="btn-secondary" id="btn-prev-concept">← Concept ' + ("0" + idx).slice(-2) + '</button>' : '<span></span>') +
      (idx < lessons.length - 1 ? '<button class="btn-primary" id="btn-next-concept">Concept ' + ("0" + (idx + 2)).slice(-2) + ': ' + nextNav + ' →</button>' : '<button class="btn-primary" id="btn-goto-revision">Chapter Revision & Exercises →</button>') +
      '</div>';

    cView.innerHTML = html;

    // Attach Prediction Listeners
    var btnCheckPred = document.getElementById("btn-check-prediction");
    var btnSkipPred = document.getElementById("btn-skip-prediction");
    if(btnCheckPred && pred){
      btnCheckPred.addEventListener("click", function(){
        var sel = document.querySelector('input[name="predict_ans"]:checked');
        var fb = document.getElementById("predict-feedback-box");
        if(!sel){
          fb.style.display = "block";
          fb.className = "predict-feedback revealed";
          fb.textContent = "Please select one of the predictions first.";
          return;
        }
        var chosen = Number(sel.value);
        var expectedAns = pred.answer !== undefined ? pred.answer : (pred.correct !== undefined ? pred.correct : 0);
        var isRight = chosen === expectedAns;
        fb.style.display = "block";
        fb.className = "predict-feedback " + (isRight ? "correct" : "revealed");
        fb.innerHTML = (isRight ? "<b>Spot on!</b> " : "<b>Good thought! Here is the physical principle:</b> ") + (pred.explanation || "");
      });
    }
    if(btnSkipPred && pred){
      btnSkipPred.addEventListener("click", function(){
        var fb = document.getElementById("predict-feedback-box");
        fb.style.display = "block";
        fb.className = "predict-feedback revealed";
        fb.innerHTML = "<b>Key Principle:</b> " + (pred.explanation || "");
      });
    }

    // Attach Timeline Controls for legacy SIMS
    var btnPP = document.getElementById("btn-play-pause");
    if(btnPP) btnPP.addEventListener("click", function(){ if(state.playing) pause(); else play(); });
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep) btnStep.addEventListener("click", function(){ step(0.5); });
    var btnResTime = document.getElementById("btn-reset-time");
    if(btnResTime) btnResTime.addEventListener("click", function(){ resetTimeline(); });
    var scrub = document.getElementById("time-scrubber");
    if(scrub) scrub.addEventListener("input", function(e){ seekTimeline(e.target.value); });

    // Footer Next/Prev listeners
    var btnPrev = document.getElementById("btn-prev-concept");
    var btnNext = document.getElementById("btn-next-concept");
    var btnRev = document.getElementById("btn-goto-revision");
    if(btnPrev) btnPrev.addEventListener("click", function(){ renderConcept(idx - 1); window.scrollTo(0,0); });
    if(btnNext) btnNext.addEventListener("click", function(){ renderConcept(idx + 1); window.scrollTo(0,0); });
    if(btnRev) btnRev.addEventListener("click", function(){ renderRevision(); window.scrollTo(0,0); });

    // Mount Active Simulation Engine
    var simMount = document.getElementById("sim-mount-point");
    if(simMount){
      var cKey = "c" + (idx + 1);
      var conceptId = l.id || ("concept-" + (idx + 1));
      var simId = l.sim || conceptId;

      // 1. window.mountSimulation (iemh101, iemh102)
      if(typeof window.mountSimulation === 'function'){
        simMount.innerHTML = "";
        window.mountSimulation(cKey, simMount);
      }
      // 2. window.SIM_ENGINES (iemh101-iemh105)
      else if(window.SIM_ENGINES && window.SIM_ENGINES[cKey] && typeof window.SIM_ENGINES[cKey].init === 'function'){
        simMount.innerHTML = "";
        window.SIM_ENGINES[cKey].init(simMount);
      }
      // 3. window.SimEngine (iemh106-iemh108)
      else if(window.SimEngine && typeof window.SimEngine.init === 'function'){
        var targetKey = null;
        var candidateKeys = [conceptId, "sim-" + conceptId, "sim-concept-" + (idx + 1), "concept-" + (idx + 1), simId, cKey];
        for(var k = 0; k < candidateKeys.length; k++){
          if(candidateKeys[k] && window.SimEngine.getEngine(candidateKeys[k])){
            targetKey = candidateKeys[k];
            break;
          }
        }
        if(targetKey){
          simMount.innerHTML = "";
          window.SimEngine.init(targetKey, simMount);
        }
      }
      // 4. window.SIMS (iesc101-iesc113)
      else if(window.SIMS && (window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey])){
        var simObj = window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey];
        if(typeof simObj.mount === 'function'){
          if(simObj.mount.length >= 1 && !simObj.draw){
            simMount.innerHTML = "";
            simObj.mount(simMount);
          } else {
            simObj.mount(l);
          }
        }
      }
    }

    // Render Quiz for current level
    renderQuiz();

    // Attach Practice Level Tabs
    var lvlTabs = document.querySelectorAll(".level-tab");
    lvlTabs.forEach(function(tab){
      tab.addEventListener("click", function(){
        lvlTabs.forEach(function(t){ t.classList.remove("active"); });
        tab.classList.add("active");
        state.level = Number(tab.getAttribute("data-lvl"));
        renderQuiz();
      });
    });

    // Update URL hash
    window.location.hash = "#concept-" + (idx + 1);
  }

  // --- Render Quiz ---
  function renderQuiz(){
    var lessons = C.lessons || C.concepts || [];
    var l = lessons[state.conceptIndex];
    if(!l) return;
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(!quizzes.length) return;
    var q = quizzes[state.level] || quizzes[0];
    if(!q) return;

    var qk = qKey(state.conceptIndex, state.level);
    var old = state.answers[qk] || {};

    var box = document.getElementById("quiz-container");
    if(!box) return;

    var promptText = q.prompt || q.question || "";
    var isMcq = q.type === "mcq" || (q.options && q.options.length > 0);
    var correctAns = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : 0);
    var solutionText = q.solution || q.explanation || "";
    var hintText = q.hint || "Review the key relationships in the concept overview above.";

    var html = '<div class="question-prompt">' + promptText + '</div>';
    if(isMcq && q.options){
      html += '<div class="quiz-options">' +
        q.options.map(function(opt, oi){
          var checked = old.value === String(oi) ? " checked" : "";
          return '<label class="quiz-option"><input type="radio" name="quiz_ans" value="' + oi + '"' + checked + '><span>' + opt + '</span></label>';
        }).join("") +
        '</div>';
    } else {
      html += '<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">' +
        '<input type="number" step="any" id="quiz_num_ans" placeholder="Your answer" value="' + (old.value || "") + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;width:160px;">' +
        '<span style="font-weight:600;color:var(--muted);">' + (q.unit || "") + '</span>' +
        '</div>';
    }

    html += '<div class="quiz-actions">' +
      '<button class="btn-primary" id="btn-submit-quiz">Submit Answer</button>' +
      '<button class="btn-secondary" id="btn-toggle-hint">Show Hint</button>' +
      '</div>' +
      '<div id="quiz-hint-box" class="quiz-hint" style="display:none;">' + hintText + '</div>' +
      '<div id="quiz-feedback-box" class="quiz-feedback" style="display:none;"></div>';

    box.innerHTML = html;

    // Hint toggle
    var hintBtn = document.getElementById("btn-toggle-hint");
    if(hintBtn){
      hintBtn.addEventListener("click", function(){
        var hb = document.getElementById("quiz-hint-box");
        if(hb) hb.style.display = hb.style.display === "none" ? "block" : "none";
      });
    }

    // Submit listener
    var submitBtn = document.getElementById("btn-submit-quiz");
    if(submitBtn){
      submitBtn.addEventListener("click", function(){
        var fb = document.getElementById("quiz-feedback-box");
        if(!fb) return;
        var isRight = false;
        var userVal = "";

        if(isMcq){
          var sel = document.querySelector('input[name="quiz_ans"]:checked');
          if(!sel){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please select an answer choice first.";
            return;
          }
          userVal = sel.value;
          isRight = Number(userVal) === Number(correctAns);
        } else {
          var inp = document.getElementById("quiz_num_ans");
          if(!inp || inp.value.trim() === ""){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please enter a numerical answer.";
            return;
          }
          userVal = inp.value.trim();
          var num = parseFloat(userVal);
          isRight = Math.abs(num - parseFloat(correctAns)) <= (q.tolerance || 0.05);
        }

        state.answers[qk] = { value: userVal, checked: true };
        if(isRight){
          state.correct[qk] = true;
          fb.style.display = "block";
          fb.className = "quiz-feedback success";
          fb.innerHTML = "<b>That’s right!</b> " + solutionText;
        } else {
          fb.style.display = "block";
          fb.className = "quiz-feedback retry";
          var wrongMsg = (isMcq && q.wrong && q.wrong[Number(userVal)]) ? q.wrong[Number(userVal)] : hintText;
          fb.innerHTML = "<b>Not quite.</b> " + wrongMsg + "<br><small style=\"margin-top:6px;display:block;\"><b>Full explanation:</b> " + solutionText + "</small>";
        }
        updateProgress();
      });
    }

    if(old.checked && submitBtn){
      submitBtn.click();
    }
  }

  // --- Render Revision View ---
  var currentExFilter = -1;

  function renderRevision(){
    pause();
    document.querySelectorAll(".concept-nav").forEach(function(b){ b.classList.remove("active"); });
    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.classList.add("active");

    var chNum = C.chapterNumber || (C.code ? C.code.replace(/\D/g, '') : "01");
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · NCERT EXERCISES & REVISION";

    var cView = document.getElementById("concept-view");
    var revView = document.getElementById("revision-view");
    if(cView) cView.style.display = "none";
    if(revView) revView.style.display = "block";

    var exList = C.exercises || [];
    if(!exList.length && C.exerciseMap){
      exList = C.exerciseMap.map(function(m){
        return {
          q: m[0],
          number: String(m[0]),
          title: m[1],
          conceptIdx: m[2],
          page: m[3],
          printPage: 47 + m[3],
          question: m[4] || m[1],
          steps: [m[5] || "Refer to concept explanation."],
          answer: m[5] || ""
        };
      });
    }

    var totalEx = exList.length;
    var html = '<div class="concept-header">' +
      '<span class="concept-badge">NCERT EXERCISE COMPENDIUM</span>' +
      '<h1 class="concept-title">Revise, Reflect, Refine</h1>' +
      '<p class="concept-deck">All ' + totalEx + ' exercises from NCERT Class 11 Physics with comprehensive step-by-step pedagogical solutions.</p>' +
      '</div>';

    // Filter Bar & Expand/Collapse All
    var lessons = C.lessons || C.concepts || [];
    html += '<div class="exercise-compendium-header">' +
      '<div class="exercise-filter-bar">' +
      '<button class="filter-chip ' + (currentExFilter === -1 ? 'active' : '') + '" data-cfilter="-1">All Exercises (' + totalEx + ')</button>' +
      lessons.map(function(l, li){
        var nav = l.nav || l.navTitle || l.title || ("C0" + (li+1));
        return '<button class="filter-chip ' + (currentExFilter === li ? 'active' : '') + '" data-cfilter="' + li + '">C0' + (li+1) + ': ' + nav + '</button>';
      }).join("") +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn-secondary" id="btn-expand-all" style="padding:6px 12px;font-size:13px;">Expand All Guidance</button>' +
      '<button class="btn-secondary" id="btn-collapse-all" style="padding:6px 12px;font-size:13px;">Collapse All</button>' +
      '</div>' +
      '</div>';

    // Exercise Cards List
    html += '<div id="exercise-cards-container">';
    var filtered = currentExFilter === -1 ? exList : exList.filter(function(e){
      return e.conceptIdx === currentExFilter || (e.section && e.section.includes(String(currentExFilter + 1)));
    });

    html += filtered.map(function(ex, eIdx){
      var qNum = ex.number || ex.q || (eIdx + 1);
      var sectionLabel = ex.section ? ('<span class="q-badge" style="background:#e0f2fe;color:#0369a1;margin-right:6px;">' + ex.section + '</span>') : '';
      var l = (ex.conceptIdx !== undefined && lessons[ex.conceptIdx]) ? lessons[ex.conceptIdx] : null;
      var conceptLink = l ? ('<a href="#concept-' + (ex.conceptIdx + 1) + '" class="q-concept-link" data-idx="' + ex.conceptIdx + '">Explore in Concept ' + ("0" + (ex.conceptIdx + 1)).slice(-2) + ' (' + (l.nav || l.navTitle || l.title) + ') ↗</a>') : '';

      var guidanceHtml = "";
      if(ex.guidance){
        if(typeof ex.guidance === 'string'){
          guidanceHtml = ex.guidance;
        } else if(Array.isArray(ex.guidance)){
          guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
            (ex.answer ? '<p><strong>Answer:</strong> ' + ex.answer + '</p>' : '') +
            '<ol>' + ex.guidance.map(function(g){ return '<li>' + g + '</li>'; }).join('') + '</ol></div>';
        }
      } else if(ex.steps && ex.steps.length){
        guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
          (ex.given ? '<div class="given-data"><b>Given:</b> ' + ex.given + '</div>' : '') +
          '<ol class="solution-steps">' + ex.steps.map(function(st){ return '<li>' + st + '</li>'; }).join('') + '</ol>' +
          (ex.answer ? '<div class="answer-box"><b>Final Answer:</b> ' + ex.answer + '</div>' : '') +
          '</div>';
      }
      if(!guidanceHtml && (ex.solution || ex.approach || ex.answer)){
        var approachHtml = ex.approach
          ? '<p class="solution-approach"><strong>Approach:</strong> ' +
            String(ex.approach).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') +
            '</p>'
          : '';
        var solutionHtml = ex.solution
          ? '<div class="solution-body">' + ex.solution + '</div>'
          : '';
        var answerHtml = (ex.answer && !ex.solution)
          ? '<div class="answer-box"><b>Final Answer:</b> ' + ex.answer + '</div>'
          : '';
        guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
          approachHtml + solutionHtml + answerHtml + '</div>';
      }

      return '<article class="exercise-card" id="exercise-q' + qNum + '">' +
        '<div class="exercise-card-meta">' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
        sectionLabel +
        '<span class="q-badge">QUESTION ' + qNum + '</span>' +
        '</div>' +
        conceptLink +
        '</div>' +
        
        '<div class="exercise-question-text" style="font-size:15px;line-height:1.6;margin:12px 0;white-space:pre-wrap;">' + (ex.question || ex.title || "") + '</div>' +
        
        '<details class="exercise-drawer">' +
        '<summary class="exercise-drawer-btn">📖 View Step-by-Step Guidance & Full Solution</summary>' +
        '<div class="exercise-solution-body" style="padding:14px;background:#f8fafc;border-radius:8px;margin-top:8px;">' +
        guidanceHtml +
        '</div>' +
        '</details>' +
        '</article>';
    }).join("");

    html += '</div>';

    revView.innerHTML = html;

    // Attach Filter Listeners
    revView.querySelectorAll(".filter-chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        currentExFilter = Number(chip.getAttribute("data-cfilter"));
        renderRevision();
      });
    });

    // Attach Expand/Collapse All Listeners
    var btnExp = document.getElementById("btn-expand-all");
    var btnCol = document.getElementById("btn-collapse-all");
    if(btnExp){
      btnExp.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = true; });
      });
    }
    if(btnCol){
      btnCol.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = false; });
      });
    }

    // Concept Navigation Links
    revView.querySelectorAll(".q-concept-link").forEach(function(a){
      a.addEventListener("click", function(e){
        e.preventDefault();
        var cIdx = Number(a.getAttribute("data-idx"));
        renderConcept(cIdx);
        window.scrollTo(0, 0);
      });
    });

    window.location.hash = "#revision";
  }

  // --- Build Sidebar Nav ---
  function buildSidebar(){
    var navContainer = document.getElementById("sidebar-nav");
    if(!navContainer) return;
    var lessons = C.lessons || C.concepts || [];
    navContainer.innerHTML = lessons.map(function(l, i){
      var nav = l.nav || l.navTitle || l.title || ("Concept " + (i + 1));
      return '<button class="concept-nav" data-cidx="' + i + '">' +
        '<span class="num">' + ("0" + (i + 1)).slice(-2) + '</span>' +
        '<span>' + nav + '</span>' +
        '</button>';
    }).join("");

    navContainer.querySelectorAll(".concept-nav").forEach(function(b){
      b.addEventListener("click", function(){
        var idx = Number(b.getAttribute("data-cidx"));
        renderConcept(idx);
      });
    });

    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.addEventListener("click", renderRevision);
  }

  // --- Reset Progress Button ---
  var resetProgBtn = document.getElementById("btn-reset-progress");
  if(resetProgBtn){
    resetProgBtn.addEventListener("click", function(){
      if(confirm("Reset all quiz answers and mastery progress for this chapter?")){
        state.answers = {};
        state.correct = {};
        saveStorage();
        updateProgress();
        renderQuiz();
      }
    });
  }

  // --- Handle Video Facades (No preloaded iframes) ---
  document.addEventListener("click", function(e){
    var btn = e.target.closest(".video-facade");
    if(btn){
      var vid = btn.getAttribute("data-yt");
      var parent = btn.parentElement;
      if(parent && vid){
        parent.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&rel=0" title="Video Lesson" style="width:100%;aspect-ratio:16/9;border:none;border-radius:8px;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
      }
    }
  });

  // --- URL Routing ---
  function routeFromHash(){
    var hash = window.location.hash;
    var lessons = C.lessons || C.concepts || [];
    if(hash === "#revision"){
      renderRevision();
    } else if(/^#concept-\d+$/.test(hash)){
      var cNum = parseInt(hash.replace("#concept-", ""), 10);
      if(cNum >= 1 && cNum <= lessons.length){
        renderConcept(cNum - 1);
        return;
      }
      renderConcept(0);
    } else {
      renderConcept(0);
    }
  }
  window.addEventListener("hashchange", routeFromHash);

  window.App = {
    state: state,
    play: play,
    pause: pause,
    step: step,
    resetTimeline: resetTimeline,
    seekTimeline: seekTimeline,
    renderConcept: renderConcept,
    renderRevision: renderRevision,
    routeFromHash: routeFromHash
  };
  if (typeof globalThis !== "undefined") {
    globalThis.App = window.App;
  }

  // Initialize
  initStorage();
  buildSidebar();
  updateProgress();
  routeFromHash();
})();

</script>
<script>
var App = window.App;
window.SIMS = {};

function setActivePreset(btn){
  document.querySelectorAll(".preset-btn").forEach(function(b){ b.classList.remove("active"); });
  if(btn) btn.classList.add("active");
}
function svgEl(){ return document.getElementById("diagram"); }
function readout(html){ var n = document.getElementById("lab-readout"); if(n) n.innerHTML = html; }
function verdict(html){ var n = document.getElementById("lab-verdict"); if(n) n.innerHTML = html; }
function cell(label, val, color){
  return '<div class="telemetry-cell"><div class="telemetry-label">' + label + '</div><div class="telemetry-val"' +
    (color ? ' style="color:' + color + '"' : '') + '>' + val + '</div></div>';
}

// -------------------------------------------------------------------------
// 1. SIMULATION 1: Early Periodic Tables & Mendeleev&#39;s Predictions (mendeleev)
// -------------------------------------------------------------------------
window.SIMS.mendeleev = (function(){
  var selectedGap = "eka-al"; // "eka-al", "eka-si", "triad-cl"

  function mount(){
    App.state.maxT = 5;
    var s = document.getElementById("time-scrubber"); if(s) s.max = 5;
    document.getElementById("lab-legend").innerHTML =
      '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b;"></span><span>Mendeleev Prediction (1869)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#10b981;"></span><span>Experimental Discovery</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#38bdf8;"></span><span>Döbereiner Triad Mean</span></div>';

    document.getElementById("preset-bar").innerHTML =
      '<button class="preset-btn active" id="p-eka-al">Eka-Aluminium (Gallium, 1875)</button>' +
      '<button class="preset-btn" id="p-eka-si">Eka-Silicon (Germanium, 1886)</button>' +
      '<button class="preset-btn" id="p-triad">Döbereiner Triad (Li-Na-K)</button>';

    document.getElementById("p-eka-al").onclick = function(){ setActivePreset(this); selectedGap = "eka-al"; draw(0); };
    document.getElementById("p-eka-si").onclick = function(){ setActivePreset(this); selectedGap = "eka-si"; draw(0); };
    document.getElementById("p-triad").onclick = function(){ setActivePreset(this); selectedGap = "triad-cl"; draw(0); };

    document.getElementById("lab-controls").innerHTML =
      '<div class="control-group" style="grid-column:span 2;">' +
        '<label>Select Historical Prediction / Triad:</label>' +
        '<select id="gap-select" style="padding:8px;border-radius:8px;background:#1e293b;color:#fff;border:1px solid #334155;font-size:14px;">' +
          '<option value="eka-al" selected>Eka-Aluminium → Gallium (Discovered by Lecoq de Boisbaudran)</option>' +
          '<option value="eka-si">Eka-Silicon → Germanium (Discovered by Clemens Winkler)</option>' +
          '<option value="triad-cl">Döbereiner Alkali Triad (Lithium, Sodium, Potassium)</option>' +
        '</select>' +
      '</div>';

    document.getElementById("gap-select").onchange = function(e){
      selectedGap = e.target.value;
      draw(0);
    };

    draw(0);
  }

  function draw(t){
    var svg = svgEl(); if(!svg) return;
    var W = svg.clientWidth || 800, H = svg.clientHeight || 460;
    var cx = W / 2, cy = H / 2;

    var h = '<rect width="100%" height="100%" fill="#0a121e"/>';

    if(selectedGap === "eka-al"){
      h += '<text x="' + cx + '" y="50" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">Mendeleev&#39;s Eka-Aluminium (1869) vs Gallium (1875)</text>';

      // Card 1: Prediction
      h += '<rect x="' + (cx - 300) + '" y="80" width="280" height="220" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>';
      h += '<text x="' + (cx - 160) + '" y="110" fill="#f59e0b" font-size="14" font-weight="bold" text-anchor="middle">Predicted: Eka-Aluminium (Ea)</text>';
      h += '<text x="' + (cx - 280) + '" y="145" fill="#cbd5e1" font-size="12">• Atomic Weight: ~68</text>';
      h += '<text x="' + (cx - 280) + '" y="175" fill="#cbd5e1" font-size="12">• Density: 5.9 g/cm³</text>';
      h += '<text x="' + (cx - 280) + '" y="205" fill="#cbd5e1" font-size="12">• Melting Point: Low</text>';
      h += '<text x="' + (cx - 280) + '" y="235" fill="#cbd5e1" font-size="12">• Oxide Formula: Ea₂O₃</text>';
      h += '<text x="' + (cx - 280) + '" y="265" fill="#cbd5e1" font-size="12">• Chloride: EaCl₃</text>';

      // Card 2: Discovery
      h += '<rect x="' + (cx + 20) + '" y="80" width="280" height="220" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>';
      h += '<text x="' + (cx + 160) + '" y="110" fill="#10b981" font-size="14" font-weight="bold" text-anchor="middle">Discovered: Gallium (Ga, Z = 31)</text>';
      h += '<text x="' + (cx + 40) + '" y="145" fill="#cbd5e1" font-size="12">• Atomic Weight: 69.7</text>';
      h += '<text x="' + (cx + 40) + '" y="175" fill="#cbd5e1" font-size="12">• Density: 5.94 g/cm³</text>';
      h += '<text x="' + (cx + 40) + '" y="205" fill="#cbd5e1" font-size="12">• Melting Point: 30.0 °C (Melts in hand!)</text>';
      h += '<text x="' + (cx + 40) + '" y="235" fill="#cbd5e1" font-size="12">• Oxide Formula: Ga₂O₃</text>';
      h += '<text x="' + (cx + 40) + '" y="265" fill="#cbd5e1" font-size="12">• Chloride: GaCl₃</text>';

      readout(
        cell("Element", "Eka-Aluminium → Gallium", "#f59e0b") +
        cell("Atomic Mass", "Pred: 68 | Found: 69.7", "#10b981") +
        cell("Density", "Pred: 5.9 | Found: 5.94 g/cm³", "#38bdf8") +
        cell("Melting Point", "302.9 K (30 °C)", "#e2e8f0")
      );
      verdict('<b>Historic Confirmation:</b> Lecoq de Boisbaudran discovered Gallium in 1875. The astonishing agreement with Mendeleev\'s 1869 predictions convinced the world\'s chemical establishment of the predictive reality of the Periodic Law.');
    }
    else if(selectedGap === "eka-si"){
