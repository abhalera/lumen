<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 3: Chapter 3 — Interactive Textbook</title>
<style>
:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: var(--radius-sm);
  position: relative;
  overflow: hidden;
  border: none;
  padding: 0;
  cursor: pointer;
  display: block;
}
.video-facade img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
}
.play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 48px;
  height: 48px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.video-title {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 8px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  color: #fff;
  font-size: 12px;
  text-align: left;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);

<script>
window.CHAPTER = {"chapter_meta": {"id": "kech103", "number": 3, "title": "Classification of Elements and Periodicity in Properties", "book": "Chemistry Part I", "class": 11, "reprint": "2026-27", "tagline": "From Dobereiner's triads and Mendeleev's prophetic table to modern Moseley law, s/p/d/f blocks, and periodic property trends.", "total_concepts": 7, "total_practice_questions": 21, "total_exercises": 40}, "concepts": [{"id": "genesis-periodic-table", "nav": "Genesis of Periodic Law", "title": "Genesis of Periodic Classification: Triads, Octaves & Mendeleev's Table", "deck": "Early chemists organized elements by atomic mass, culminating in Mendeleev's prophetic table with bold gaps for undiscovered elements.", "minutes": 8, "section": "3.1, 3.2", "pages": [1, 4], "print": "1–4", "sim": "mendeleev", "simTitle": "Early Periodic Classification & Mendeleev's Predictive Table Lab", "quick": ["In 1829, German chemist <strong>Johann Wolfgang Döbereiner</strong> identified <strong>Triads</strong> of chemically similar elements (e.g. Li-Na-K, Ca-Sr-Ba, Cl-Br-I) where the atomic weight of the middle element was approximately the arithmetic mean of the outer two. In 1865, English chemist <strong>John Newlands</strong> proposed the <strong>Law of Octaves</strong>: arranging elements by increasing atomic weight revealed properties repeating every eighth element, like musical notes (valid only up to Calcium).", "Simultaneously in 1869, <strong>Dmitri Mendeleev</strong> (Russia) and <strong>Lothar Meyer</strong> (Germany) independently realized periodicity. Meyer plotted atomic volume against atomic weight, finding recurring peaks for alkali metals. Mendeleev formulated the historic <strong>Periodic Law</strong>: <em>'The physical and chemical properties of elements are periodic functions of their atomic weights.'</em>", "Mendeleev organized 63 known elements into 8 vertical Groups and 7 horizontal Series (Periods). His monumental genius lay in prioritizing chemical similarity (hydride and oxide formulas) over strict atomic weight, boldly reversing pairs (e.g. Tellurium 127.6 before Iodine 126.9) and leaving blank spaces predicting undiscovered elements: <strong>Eka-Aluminium</strong> (Gallium, discovered 1875) and <strong>Eka-Silicon</strong> (Germanium, discovered 1886) with astonishing precision."], "formulas": [{"label": "Döbereiner Triad Mean", "html": "Atomic Mass(B) ≈ [Atomic Mass(A) + Atomic Mass(C)] / 2", "cond": "E.g. Li (7) + K (39) / 2 = 23 (Na)"}, {"label": "Mendeleev Periodic Law", "html": "Properties = f(Atomic Weight)", "cond": "Historic 1869 law; grouped by oxide (R₂O to R₂O₇) & hydride (RH to RH₄) stoichiometry"}, {"label": "Lothar Meyer Periodic Curve", "html": "Atomic Volume V_m = M / d = Periodic function of Atomic Weight", "cond": "Alkali metals occupy sharp peaks; halogens on ascending slopes"}], "deeper": "Mendeleev's periodic table had fundamental anomalies that classical atomic weight could not resolve: (1) Position of hydrogen (resembles alkali metals and halogens); (2) Anomalous pairs where heavier elements preceded lighter ones (Ar=39.9 before K=39.1, Co=58.9 before Ni=58.7, Te=127.6 before I=126.9); (3) Isotopes of an element (having different atomic masses) had no separate places; (4) Lanthanoids and actinoids had to be relegated outside the main body.", "worked": "NCERT Problem 3.2: Which important property did Mendeleev use to classify elements, and did he strictly adhere to it? Solution: Mendeleev classified elements on the basis of increasing atomic weights and chemical formulas of their hydrides and oxides. However, he did not stick rigidly to atomic weight when chemical logic dictated otherwise: he placed Tellurium (atomic mass 127.6) before Iodine (atomic mass 126.9) so that Iodine grouped with halogens (F, Cl, Br) and Tellurium with Group VI chalcogens (O, S, Se).", "prediction": {"prompt": "Mendeleev predicted properties for an unknown element called Eka-Aluminium (atomic weight ~68, oxide E₂O₃, low melting point). When Paul-Émile Lecoq de Boisbaudran discovered Gallium in 1875, what did its properties reveal?", "options": ["Gallium had atomic weight 69.7, formula Ga₂O₃, and melted at 30 °C in the palm of a hand, exactly verifying Mendeleev.", "Gallium was a noble gas with zero chemical reactivity, disproving the periodic table.", "Gallium was a non-metal with acidic oxide GaO₂, forcing a complete redesign.", "Gallium had mass 140 and formed no oxides."], "answer": 0, "explanation": "Gallium matched Mendeleev's predictions with extraordinary precision: atomic weight 69.7, density 5.9 g/cm³ (predicted 5.9), formula Ga₂O₃, and low melting point of 302.9 K (29.8 °C)."}, "connect": [["Element 101: Mendelevium (Md)", "In 1955, Glenn Seaborg synthesized element 101 via alpha bombardment of Einsteinium-253 and named it Mendelevium in honor of Dmitri Mendeleev's foundational insight."], ["Semiconductors in Modern Chips", "Mendeleev's Eka-Silicon (Germanium) alongside Silicon became the foundation of solid-state semiconductor electronics and transistor microchips that power modern computing."]], "recall": "State Mendeleev's Periodic Law and explain why he left gaps in his periodic table.", "quizzes": [{"prompt": "Which anomaly in Mendeleev's periodic table could NOT be resolved as long as atomic weight was used as the organizing principle?", "options": ["Anomalous pair positioning such as Argon (39.9) preceding Potassium (39.1) and Tellurium (127.6) preceding Iodine (126.9)", "The distinction between metals and non-metals", "The gaseous nature of oxygen and nitrogen", "The color of elemental sulfur and phosphorus"], "answer": 0, "hint": "Think about pairs where a heavier element must precede a lighter element to preserve chemical grouping.", "explain": "Pair inversions (Ar before K, Co before Ni, Te before I) directly contradicted atomic weight ordering, and could only be justified once atomic number Z was adopted."}, {"prompt": "Newlands' Law of Octaves was valid for elements only up to:", "options": ["Calcium (Z = 20)", "Potassium (Z = 19)", "Iron (Z = 26)", "Zinc (Z = 30)"], "answer": 0, "hint": "Beyond this alkaline earth metal, transition metals disrupt the 8-element repetition.", "explain": "Newlands' Law of Octaves worked only up to Calcium (atomic weight 40). Beyond calcium, the onset of transition metals meant properties repeated every 18 elements, not 8."}, {"prompt": "In Lothar Meyer's periodic curve of atomic volume versus atomic mass, which family of elements occupied the sharp peaks?", "options": ["Alkali metals (Li, Na, K, Rb, Cs)", "Halogens (F, Cl, Br, I)", "Alkaline earth metals (Be, Mg, Ca, Sr)", "Transition metals (Fe, Co, Ni)"], "answer": 0, "hint": "Alkali metals have largest atomic volumes in their respective periods.", "explain": "Alkali metals have the largest atomic radii and lowest densities in each period, occupying the highest peaks of Lothar Meyer's volume curve."}]}, {"id": "modern-periodic-law", "nav": "Moseley & Modern Law", "title": "Moseley's Law, Modern Periodic Table & IUPAC Nomenclature", "deck": "High-voltage X-ray spectra established atomic number as the true fundamental identity of elements, establishing the 7 periods and 18 groups.", "minutes": 8, "section": "3.3, 3.4", "pages": [4, 8], "print": "4–8", "sim": "moseleylab", "simTitle": "Moseley's X-Ray Frequency Law & Periodic Matrix Lab", "quick": ["In 1913, young English physicist <strong>Henry Moseley</strong> bombarded 38 different metallic elements with high-energy cathode rays in an X-ray tube and measured characteristic $K_\\alpha$ X-ray emission frequencies. He discovered a remarkably straight line relationship: <strong>$\\sqrt{\\nu} = a(Z - b)$</strong>, where $\\nu$ is X-ray frequency, $Z$ is the nuclear charge (<strong>atomic number</strong>), and $a, b$ are constants.", "Moseley proved that <strong>atomic number ($Z$)</strong>, not atomic mass ($A$), is the true fundamental property of an element. This gave birth to the <strong>Modern Periodic Law</strong>: <em>'The physical and chemical properties of the elements are periodic functions of their atomic numbers.'</em> Reordering by atomic number immediately resolved all Mendeleev inversions (Ar $Z=18$ before K $Z=19$; Co $Z=27$ before Ni $Z=28$; Te $Z=52$ before I $Z=53$).", "The <strong>Modern Long Form Periodic Table</strong> contains <strong>7 horizontal Periods</strong> (corresponding to principal quantum number $n = 1$ to $7$) and <strong>18 vertical Groups</strong> (numbered 1 to 18 by IUPAC). For elements with $Z > 100$, IUPAC established systematic Latin/Greek root nomenclature: nil (0), un (1), bi (2), tri (3), quad (4), pent (5), hex (6), sept (7), oct (8), enn (9) + ending '-ium' (e.g. $Z=104$ is Unnilquadium, Unq; $Z=118$ is Ununoctium, Uuo / Oganesson)."], "formulas": [{"label": "Moseley's X-Ray Law", "html": "√ν = a · (Z − b)", "cond": "ν = characteristic K_α X-ray frequency; Z = atomic number; a, b = screening constants"}, {"label": "Modern Periodic Law", "html": "Properties = Periodic function of Atomic Number (Z)", "cond": "Chemical behavior is governed by valence electronic configuration"}, {"label": "Period Capacity Rule", "html": "Max elements in Period n = 2, 8, 8, 18, 18, 32, 32", "cond": "Dictated by permitted orbital filling order: s, p, d, f"}], "deeper": "Moseley's discovery transformed chemistry from an empirical art into an exact quantitative science. Moseley could inspect the integers from $Z=1$ to $92$ and definitively state where undiscovered elements lay: he predicted the exact atomic numbers of missing elements $Z=43$ (Technetium), $Z=61$ (Promethium), and $Z=72$ (Hafnium), eliminating confusion over whether more rare-earth elements remained undiscovered.", "worked": "NCERT Problem 3.4 & 3.5: (A) Justify on the basis of quantum numbers that the 6th period contains 32 elements. Solution: In period $n=6$, orbitals fill in increasing $(n+l)$ energy: $6s$ (1 orbital, 2 e⁻), $4f$ (7 orbitals, 14 e⁻), $5d$ (5 orbitals, 10 e⁻), and $6p$ (3 orbitals, 6 e⁻). Total orbitals = $1 + 7 + 5 + 3 = 16$. By Pauli exclusion, each holds 2 electrons: $16 \\times 2 = 32$ elements. (B) What would be the IUPAC name and symbol for element $Z=120$? Un (1) + bi (2) + nil (0) + ium = <strong>Unbinilium (Ubn)</strong>.", "prediction": {"prompt": "If a hypothetical eighth period of the periodic table were synthesized, what new type of orbital would begin filling, and what would be the total capacity of Period 8?", "options": ["5g subshell (l = 4, 9 orbitals); total 50 elements in Period 8.", "6f subshell (l = 3, 7 orbitals); total 32 elements in Period 8.", "5f subshell; total 18 elements in Period 8.", "7d subshell; total 40 elements in Period 8."], "answer": 0, "explanation": "In Period 8 (n = 8), Aufbau order would be 8s (1), 5g (9), 6f (7), 7d (5), 8p (3). Total orbitals = 1 + 9 + 7 + 5 + 3 = 25 orbitals. Each holds 2 electrons, yielding 25 × 2 = 50 elements."}, "connect": [["Henry Moseley's Tragic Legacy", "Moseley enlisted in the British Army during World War I and was killed by a sniper at Gallipoli in 1915 at age 27. His death led the British government to ban prominent scientists from frontline combat service."], ["Superheavy Island of Stability", "Nuclear physicists at Dubna (JINR) and Berkeley synthesize superheavy elements like Flerovium ($Z=114$) and Oganesson ($Z=118$) searching for the theoretical 'Island of Stability' where magic nucleon numbers may yield longer half-lives."]], "recall": "State Moseley's Law mathematically and explain why atomic number is more fundamental than atomic mass.", "quizzes": [{"prompt": "What is the systematic IUPAC name and symbol for the trans-actinide element with atomic number Z = 117?", "options": ["Tennessine / Ununseptium (Uus)", "Oganesson / Ununoctium (Uuo)", "Moscovium / Ununpentium (Uup)", "Livermorium / Ununhexium (Uuh)"], "answer": 0, "hint": "1 = un, 1 = un, 7 = sept + ium.", "explain": "117: un (1) + un (1) + sept (7) + ium = Ununseptium (symbol Uus), officially named Tennessine (Ts)."}, {"prompt": "In Moseley's plot of √ν against atomic number Z for characteristic X-rays, the graph obtained is a:", "options": ["Straight line with positive slope", "Parabola passing through the origin", "Hyperbola asymptotic to the Z-axis", "Exponential growth curve"], "answer": 0, "hint": "√ν = a(Z − b) is a linear equation y = mx + c.", "explain": "Moseley's equation √ν = a(Z − b) is strictly linear, producing a straight line of slope a and intercept b."}, {"prompt": "How many elements are present in the third period of the modern periodic table?", "options": ["8 elements (Na to Ar)", "18 elements", "2 elements", "32 elements"], "answer": 0, "hint": "Period 3 fills 3s (2 e⁻) and 3p (6 e⁻). 3d does not fill until Period 4.", "explain": "In Period 3, only 3s (1 orbital) and 3p (3 orbitals) are filled, accommodating 4 × 2 = 8 elements from Sodium (Z=11) to Argon (Z=18)."}]}, {"id": "periodic-blocks", "nav": "s, p, d, f Blocks", "title": "Electronic Configurations & Division into s, p, d, f Blocks", "deck": "The periodic table maps orbital subshells: s-block alkali metals, p-block representative elements, d-block transition metals, and f-block inner transition series.", "minutes": 10, "section": "3.5, 3.6", "pages": [8, 14], "print": "8–14", "sim": "blockexplorer", "simTitle": "Interactive s, p, d, f Block Architecture Explorer", "quick": ["The position of any element in the periodic table directly reflects the subshell that receives its differentiating valence electron, partitioning the periodic table into four distinct blocks: <strong>s-block</strong>, <strong>p-block</strong>, <strong>d-block</strong>, and <strong>f-block</strong>.", "<strong>s-Block (Groups 1 & 2):</strong> Valence configuration <em>ns¹</em> (Group 1 alkali metals) and <em>ns²</em> (Group 2 alkaline earth metals). Reactive, electropositive metals with low ionization enthalpies and +1 or +2 oxidation states; they impart characteristic flame colors and form ionic basic oxides.<br><strong>p-Block (Groups 13 to 18):</strong> Valence configuration <em>ns² np¹⁻⁶</em>. Encompasses metals, metalloids, and non-metals. Together, s- and p-block elements are known as <strong>Representative or Main Group Elements</strong>. Noble gases (Group 18, <em>ns² np⁶</em>) possess closed octets.", "<strong>d-Block (Groups 3 to 12):</strong> Valence configuration <em>(n−1)d¹⁻¹⁰ ns⁰⁻²</em>. Known as <strong>Transition Metals</strong> because they bridge electropositive s-block and electronegative p-block. Characterized by variable oxidation states, coloured paramagnetic complexes, and catalytic activity.<br><strong>f-Block (Lanthanoids & Actinoids):</strong> Valence configuration <em>(n−2)f¹⁻¹⁴ (n−1)d⁰⁻¹ ns²</em>. Known as <strong>Inner Transition Elements</strong>. Actinoids are radioactive, with elements beyond Uranium ($Z > 92$) being synthetic <strong>transuranium elements</strong>."], "formulas": [{"label": "s-Block Valence Configuration", "html": "ns¹⁻²", "cond": "n = 2 to 7 (reactive electropositive metals)"}, {"label": "p-Block Valence Configuration", "html": "ns² np¹⁻⁶", "cond": "n = 2 to 6 (includes non-metals, metalloids, halogens, noble gases)"}, {"label": "d-Block Valence Configuration", "html": "(n − 1)d¹⁻¹⁰ ns⁰⁻²", "cond": "n = 4 to 7 (transition metals with variable valencies)"}, {"label": "f-Block Valence Configuration", "html": "(n − 2)f¹⁻¹⁴ (n − 1)d⁰⁻¹ ns²", "cond": "Lanthanoids (4f, n=6) and Actinoids (5f, n=7)"}], "deeper": "A crucial conceptual distinction is why Zinc, Cadmium, and Mercury ($d^{10} s^2$) are often excluded from classic transition metal definitions. IUPAC defines a transition element as an element whose atom has a partially filled d subshell, or which can give rise to cations with an incomplete d subshell. Because Zn, Cd, and Hg have full $d^{10}$ configurations in both elemental and common oxidation states ($Zn^{2+}: 3d^{10}$), their chemistry resembles typical main group metals more than transition elements.", "worked": "NCERT Problem 3.30: Assign the position of the element having outer electronic configuration (i) ns² np⁴ for n = 3, (ii) (n−1)d² ns² for n = 4. Solution: (i) n = 3 means <strong>Period 3</strong>. np⁴ means Group number = 10 + valence electrons = 10 + 2 + 4 = <strong>Group 16</strong> (Sulfur, S). (ii) n = 4 means <strong>Period 4</strong>. (n−1)d² ns² = 3d² 4s²: Group number = sum of (n−1)d and ns electrons = 2 + 2 = <strong>Group 4</strong> (Titanium, Ti).", "prediction": {"prompt": "An element has ground state electronic configuration [Rn] 5f¹⁴ 6d⁴ 7s². To which block, period, and group does this element belong?", "options": ["d-block, Period 7, Group 6 (Seaborgium, Sg, Z = 106)", "f-block, Period 7, Group 4", "p-block, Period 6, Group 16", "s-block, Period 7, Group 2"], "answer": 0, "explanation": "Principal quantum number n = 7 => Period 7. Differentiating electron enters 6d subshell => d-block. Group number = 2 (7s) + 4 (6d) = Group 6. Atomic number = 86 + 14 + 4 + 2 = 106 (Seaborgium, Sg)."}, "connect": [["Lanthanoid Contraction & Industrial Alloys", "The poor shielding of 4f electrons causes the 'Lanthanoid Contraction', making 4d and 5d transition metals (e.g. Zirconium and Hafnium) almost identical in atomic radius (160 pm vs 159 pm), posing immense metallurgical separation challenges."], ["Rare Earth Magnets (Neodymium NdFeB)", "The unique 4f orbital architecture of neodymium creates strong localized magnetic moments with high magnetic anisotropy, making Nd₂Fe₁₄B permanent magnets indispensable for wind turbines and electric motors."]], "recall": "State the general valence electronic configuration of the four blocks of elements: s, p, d, and f.", "quizzes": [{"prompt": "Why are elements of Group 17 designated as 'Halogens' and elements of Group 16 as 'Chalcogens'?", "options": ["Halogen means 'sea-salt former' (Greek halo-gen); Chalcogen means 'ore former' (chalko-gen).", "Halogen refers to volatile gases; Chalcogen refers to dense solids.", "Halogen indicates trivalent state; Chalcogen indicates divalent state.", "They were named after the alchemical elements sulfur and salt."], "answer": 0, "hint": "Halo = sea salt (as in NaCl); Chalko = copper/brass ore.", "explain": "Group 17 elements form sea salts (halos + gen = salt former); Group 16 elements are found abundantly in copper and metallic mineral ores (chalkos + gen = ore former)."}, {"prompt": "Which of the following electronic configurations represents a d-block element?", "options": ["[Ar] 3d³ 4s²", "[Ar] 3d¹⁰ 4s² 4p³", "[Ne] 3s² 3p⁶", "[Xe] 4f¹⁴ 5d¹ 6s²"], "answer": 0, "hint": "The last differentiating electron enters the (n−1)d subshell.", "explain": "[Ar] 3d³ 4s² represents Vanadium (Z = 23), a classic transition metal belonging to the d-block."}, {"prompt": "What is the group and period of an element with atomic number Z = 35?", "options": ["Period 4, Group 17 (Bromine)", "Period 3, Group 15", "Period 4, Group 7", "Period 5, Group 17"], "answer": 0, "hint": "Configuration is [Ar] 3d¹⁰ 4s² 4p⁵.", "explain": "Z = 35 has configuration [Ar] 3d¹⁰ 4s² 4p⁵. Highest n = 4 (Period 4). Group number for p-block = 12 + p electrons = 12 + 5 = Group 17 (Bromine)."}]}, {"id": "atomic-ionic-radii", "nav": "Atomic & Ionic Radii", "title": "Atomic & Ionic Radii: Covalent, Van der Waals & Isoelectronic Trends", "deck": "Atomic size contracts across a period due to increasing effective nuclear charge and expands down a group as new quantum shells are added.", "minutes": 10, "section": "3.7", "pages": [14, 20], "print": "14–20", "sim": "radiitrends", "simTitle": "Periodic Atomic, Ionic & Isoelectronic Radii Lab", "quick": ["Because electron probability clouds have no sharp physical boundary, <strong>atomic radius</strong> is measured in bonded states: (1) <strong>Covalent radius</strong>: half the distance between nuclei of two covalently bonded identical atoms (e.g. Cl–Cl bond length 198 pm => $r_{cov}$ = 99 pm); (2) <strong>Metallic radius</strong>: half the internuclear distance between adjacent metal ions in a metallic crystal lattice (e.g. Cu–Cu distance 256 pm => $r_{met}$ = 128 pm); (3) <strong>Van der Waals radius</strong>: half the distance between non-bonded touching atoms in neighboring molecules in solid state ($r_{vdw} > r_{met} > r_{cov}$).", "<strong>Periodic Trends:</strong> Across a period from left to right, atomic radius <strong>decreases</strong> steadily because electrons enter the same principal shell while nuclear charge increases ($Z_{eff}$ rises, pulling electron clouds closer). Down a group from top to bottom, atomic radius <strong>increases</strong> because successive energy shells ($n = 1, 2, 3...$) are added, which overpower the increased nuclear charge.", "<strong>Ionic Radii:</strong> A <strong>cation is always smaller</strong> than its parent atom because removing electrons reduces electron-electron repulsion and increases effective nuclear charge per electron ($Na$: 186 pm vs $Na^+$: 102 pm). An <strong>anion is always larger</strong> than its parent atom because adding electrons increases repulsion and expands the cloud ($F$: 72 pm vs $F^-$: 136 pm). For <strong>isoelectronic species</strong> (same electrons), radius decreases strictly with increasing nuclear charge ($Z$): <strong>$N^{3-} > O^{2-} > F^- > Na^+ > Mg^{2+} > Al^{3+}$</strong>."], "formulas": [{"label": "Covalent Radius", "html": "r_cov = d(A − A) / 2", "cond": "Half of internuclear distance between homonuclear single bond"}, {"label": "Radius Hierarchy", "html": "r_vdw > r_metallic > r_covalent", "cond": "Van der Waals forces are weakest; covalent overlap pulls nuclei closest"}, {"label": "Isoelectronic Radius Scaling", "html": "Radius ∝ 1 / Z", "cond": "For identical electron count (e.g. 10 e⁻): N³⁻ (171 pm) > O²⁻ (140) > F⁻ (136) > Na⁺ (102) > Mg²⁺ (72) > Al³⁺ (53 pm)"}], "deeper": "Why do noble gases appear to have anomalously large atomic radii in textbook tables? In noble gases (He, Ne, Ar, Kr, Xe), atoms do not form covalent bonds in standard states; consequently, their reported radii are non-bonded Van der Waals radii, which are intrinsically 40–50% larger than covalent radii. When comparing purely covalent radii across Period 2, Neon would be the smallest if covalently bonded.", "worked": "NCERT Problem 3.12 & 3.36: Arrange the isoelectronic species N³⁻, O²⁻, F⁻, Na⁺, Mg²⁺, Al³⁺ in order of increasing radii. Solution: All six species have 10 electrons (isoelectronic with Neon). Their atomic numbers Z are: N (7), O (8), F (9), Na (11), Mg (12), Al (13). As nuclear charge Z increases, the nucleus pulls the 10 electrons with increasing Coulombic force, contracting the ion. Increasing radius order: <strong>Al³⁺ (53 pm) &lt; Mg²⁺ (72 pm) &lt; Na⁺ (102 pm) &lt; F⁻ (136 pm) &lt; O²⁻ (140 pm) &lt; N³⁻ (171 pm)</strong>.", "prediction": {"prompt": "How does the radius of the Fe²⁺ ion compare to the Fe³⁺ ion and neutral Fe atom?", "options": ["Fe atom > Fe²⁺ > Fe³⁺ (higher positive charge increases effective nuclear charge and shrinks radius)", "Fe³⁺ > Fe²⁺ > Fe atom", "Fe²⁺ > Fe³⁺ > Fe atom", "All three have identical radii because the nuclear charge Z = 26 is unchanged."], "answer": 0, "explanation": "Neutral Fe has 26 protons and 26 electrons. Fe²⁺ has 26 protons and 24 electrons, so each electron experiences higher Z_eff. Fe³⁺ has 26 protons and only 23 electrons, yielding even higher Z_eff and contracting the ion further: Fe (126 pm) > Fe²⁺ (78 pm) > Fe³⁺ (64.5 pm)."}, "connect": [["Ion Channels in Human Neurons", "The precise difference in ionic radius between Na⁺ (102 pm) and K⁺ (138 pm) is exploited by cell membrane ion channels: potassium channels have carbonyl oxygen selectivity filters spaced to dehydrate and conduct K⁺ while rejecting smaller Na⁺ ions."], ["Lattice Energy in Battery Cathodes", "Lithium-ion batteries rely on the tiny ionic radius of Li⁺ (76 pm), which enables it to rapidly intercalate into and de-intercalate from graphite anodes and LiCoO₂ cathode layers without shattering the crystal lattice."]], "recall": "Why is a cation always smaller and an anion always larger than their respective parent neutral atoms?", "quizzes": [{"prompt": "Which of the following isoelectronic ions has the SMALLEST ionic radius?", "options": ["Al³⁺ (Z = 13)", "Mg²⁺ (Z = 12)", "Na⁺ (Z = 11)", "O²⁻ (Z = 8)"], "answer": 0, "hint": "In an isoelectronic series, the ion with the highest nuclear charge Z is the smallest.", "explain": "Al³⁺ has 13 protons pulling on 10 electrons (ratio 1.30), exerting the strongest electrostatic attraction and compressing the electron cloud to just 53 pm."}, {"prompt": "Across the second period from Lithium to Fluorine, atomic radius decreases because:", "options": ["Effective nuclear charge (Z_eff) increases while electrons are added to the same principal shell", "The number of principal energy shells decreases", "Screening by core 1s electrons increases significantly", "Electrons experience gravitational collapse toward the nucleus"], "answer": 0, "hint": "Atomic number Z increases by 1 each step, but electrons remain in n = 2.", "explain": "Electrons enter the same shell (n = 2) where mutual shielding is imperfect, while nuclear charge increases from +3 to +9, pulling the valence electrons closer."}, {"prompt": "Which type of atomic radius has the largest numerical value for a given non-metallic element?", "options": ["Van der Waals radius", "Covalent radius", "Ionic cation radius", "Metallic radius"], "answer": 0, "hint": "Van der Waals forces involve non-bonded touching atoms without orbital overlap.", "explain": "Van der Waals forces are weak and do not involve orbital overlap; hence the internuclear distance between non-bonded atoms is largest (r_vdw > r_met > r_cov)."}]}, {"id": "ionization-enthalpy", "nav": "Ionization Enthalpy", "title": "Ionization Enthalpy: Successive Enthalpies & Structural Anomalies", "deck": "The energy required to remove an electron increases across a period and drops down a group, punctuated by subshell stability anomalies in Beryllium and Nitrogen.", "minutes": 10, "section": "3.7", "pages": [20, 24], "print": "20–24", "sim": "ionizationlab", "simTitle": "Ionization Enthalpy Periodic Spectrum & Subshell Stability Lab", "quick": ["<strong>Ionization Enthalpy ($\\Delta_i H$)</strong> is the minimum energy required to remove the most loosely bound electron from an isolated gaseous atom in its ground state: $X(g) \\to X^+(g) + e^-$. Successive ionization enthalpies always increase strictly: <strong>$\\Delta_i H_1 < \\Delta_i H_2 < \\Delta_i H_3$</strong> because each subsequent electron is removed from an increasingly positive ion held by higher effective nuclear charge.", "<strong>General Periodic Trends:</strong> Ionization enthalpy <strong>increases across a period</strong> (due to increasing $Z_{eff}$ and contracting atomic radius) and <strong>decreases down a group</strong> (due to increasing principal shell $n$, greater atomic radius, and shielding by inner core electrons).", "<strong>Critical Structural Anomalies in Period 2:</strong><br>(1) <strong>Be vs B:</strong> $\\Delta_i H_1(Be) = 899$ kJ/mol is higher than $\\Delta_i H_1(B) = 801$ kJ/mol. Beryllium ($1s^2 2s^2$) has a fully filled, stable 2s subshell with high orbital penetration. Boron ($1s^2 2s^2 2p^1$) has its valence electron in a higher-energy, less-penetrating 2p orbital shielded by the 2s core, making it easier to ionize.<br>(2) <strong>N vs O:</strong> $\\Delta_i H_1(N) = 1402$ kJ/mol is higher than $\\Delta_i H_1(O) = 1314$ kJ/mol. Nitrogen ($2s^2 2p_x^1 2p_y^1 2p_z^1$) possesses a symmetrical half-filled 2p³ subshell with high exchange stability. Oxygen ($2s^2 2p_x^2 2p_y^1 2p_z^1$) contains a paired electron in $2p_x$, experiencing inter-electronic Coulomb repulsion that makes ionization easier."], "formulas": [{"label": "Ionization Enthalpy Process", "html": "X(g) + Δ_i H₁ → X⁺(g) + e⁻", "cond": "Must be isolated gaseous atom in ground state (units: kJ mol⁻¹ or eV)"}, {"label": "Successive Enthalpy Inequality", "html": "Δ_i H₁ < Δ_i H₂ < Δ_i H₃ < ...", "cond": "Removal from increasingly positive cation: e.g. Mg (738 < 1451 < 7733 kJ/mol)"}, {"label": "Core Ionization Jump", "html": "Δ_i H_n >> Δ_i H_(n−1)", "cond": "A massive jump (>5-fold) signifies breaking into a stable noble-gas inner core"}], "deeper": "A sudden jump in successive ionization enthalpies identifies the group number of an unknown element. For example, for Magnesium: $\\Delta_i H_1 = 738$ kJ/mol, $\\Delta_i H_2 = 1451$ kJ/mol, and $\\Delta_i H_3 = 7733$ kJ/mol. The 5-fold surge between $\\Delta_i H_2$ and $\\Delta_i H_3$ occurs because the third electron must be extracted from the closed noble gas neon shell ($2p^6$), proving Magnesium has exactly two valence electrons (Group 2).", "worked": "NCERT Problem 3.16 & 3.17: Among second period elements, the actual first ionization enthalpies follow: Li < B < Be < C < O < N < F < Ne. Explain why (a) Be has higher Δ_i H than B, and (b) O has lower Δ_i H than N. Solution: (a) In Be (1s² 2s²), the electron is removed from a completely filled, deeply penetrating 2s subshell. In B (1s² 2s² 2p¹), the electron is removed from a 2p subshell that is higher in energy and shielded by inner 2s² electrons. (b) In N (2p³), all three 2p orbitals are singly occupied with parallel spins, providing high exchange energy stability. In O (2p⁴), two electrons are forced into the same 2p_x orbital, where mutual electrostatic repulsion destabilizes the electron and lowers the energy required for removal.", "prediction": {"prompt": "An unknown element X has successive ionization enthalpies: Δ_i H₁ = 578 kJ/mol, Δ_i H₂ = 1817 kJ/mol, Δ_i H₃ = 2745 kJ/mol, and Δ_i H₄ = 11578 kJ/mol. In which group of the periodic table does element X belong?", "options": ["Group 13 (Aluminium family, with 3 valence electrons)", "Group 1 (Alkali metals)", "Group 2 (Alkaline earth metals)", "Group 14 (Carbon family)"], "answer": 0, "explanation": "Notice the massive jump between Δ_i H₃ (2745 kJ/mol) and Δ_i H₄ (11578 kJ/mol) — a >4-fold increase! This proves that element X loses 3 valence electrons relatively easily, and the 4th electron requires shattering a closed core. Element X has 3 valence electrons, belonging to Group 13 (e.g. Aluminium)."}, "connect": [["Alkali Metal Photocells", "Caesium has the lowest ionization enthalpy among stable elements (376 kJ/mol = 3.89 eV), making its valence electron so loosely bound that visible photons readily eject photoelectrons in solar photocells and atomic clocks."], ["Noble Gas Non-Reactivity", "Helium has the highest first ionization enthalpy of any element (2372 kJ/mol) due to its minimal atomic radius and unshielded +2 nuclear charge, explaining its complete chemical inertness."]], "recall": "Explain why the first ionization enthalpy of Nitrogen is higher than that of Oxygen, even though Oxygen has a higher atomic number.", "quizzes": [{"prompt": "Why is the second ionization enthalpy (Δ_i H₂) of an element always strictly greater than its first ionization enthalpy (Δ_i H₁)?", "options": ["The second electron is removed from a positively charged cation where the effective nuclear charge per electron is higher", "The electron spin changes from +½ to −½", "The principal quantum number n always increases", "The atom transforms into an isotope"], "answer": 0, "hint": "Compare the electron-to-proton ratio in X versus X⁺.", "explain": "Removing an electron leaves a positive cation where fewer remaining electrons experience greater unshielded nuclear attraction, requiring more energy to remove the next electron."}, {"prompt": "Which of the following elements has the LOWEST first ionization enthalpy?", "options": ["Caesium (Cs, Z = 55)", "Lithium (Li, Z = 3)", "Sodium (Na, Z = 11)", "Potassium (K, Z = 19)"], "answer": 0, "hint": "Ionization enthalpy decreases down Group 1 as atomic radius expands.", "explain": "Caesium is at the bottom of Group 1 (n = 6); its valence electron is furthest from the nucleus and heavily shielded by core shells, yielding the lowest ionization enthalpy (376 kJ/mol)."}, {"prompt": "Between Magnesium (Z = 12) and Aluminium (Z = 13), which element has the higher first ionization enthalpy and why?", "options": ["Magnesium, because its electron is removed from a stable, completely filled 3s² subshell", "Aluminium, because of its higher atomic number Z = 13", "Both have identical ionization enthalpies because they are in Period 3", "Aluminium, because 3p electrons penetrate deeper than 3s"], "answer": 0, "hint": "Compare Mg [Ne] 3s² with Al [Ne] 3s² 3p¹.", "explain": "In Mg ([Ne] 3s²), the electron is in a full, penetrating 3s subshell (Δ_i H = 738 kJ/mol). In Al ([Ne] 3s² 3p¹), the single 3p electron is higher in energy and shielded by the 3s² pair (Δ_i H = 578 kJ/mol)."}]}, {"id": "electron-affinity", "nav": "Electron Affinity & EN", "title": "Electron Gain Enthalpy & Electronegativity (Pauling Scale)", "deck": "Atoms release energy when capturing electrons, but compact fluorine exhibits surprising inter-electronic repulsions that make chlorine the true electron-gain champion.", "minutes": 10, "section": "3.7", "pages": [24, 28], "print": "24–28", "sim": "electronaffinity", "simTitle": "Electron Gain Enthalpy & Pauling Electronegativity Comparator", "quick": ["<strong>Electron Gain Enthalpy ($\\Delta_{eg} H$)</strong> is the enthalpy change when an electron is added to an isolated gaseous atom to form an anion: $X(g) + e^- \\to X^-(g)$. For most non-metals, the process is exothermic ($\\Delta_{eg} H$ is negative). Halogens have the most negative electron gain enthalpies because capturing one electron achieves stable noble gas configurations ($ns^2 np^6$). Noble gases have large positive $\\Delta_{eg} H$ values because the incoming electron must enter the next higher principal shell ($n+1$).", "<strong>Anomalous Halogen & Chalcogen Trend:</strong> Chlorine has a <strong>more negative</strong> electron gain enthalpy than Fluorine ($-349$ kJ/mol for Cl vs $-328$ kJ/mol for F), and Sulfur is more negative than Oxygen ($-200$ for S vs $-141$ for O). In Fluorine ($2p$), the compact $n=2$ valence shell has very high electron density; incoming electrons experience intense inter-electronic repulsions that partially offset nuclear attraction. In Chlorine ($3p$), the larger volume accommodates the electron with minimal repulsion.", "<strong>Electronegativity (EN):</strong> The qualitative ability of an atom in a chemical compound to attract shared electron pairs toward itself. Linus Pauling established the <strong>Pauling Scale</strong> based on bond dissociation energies: Fluorine is assigned the maximum value of <strong>4.0</strong>. Electronegativity increases across a period (F > O > N > C) and decreases down a group (F > Cl > Br > I)."], "formulas": [{"label": "Electron Gain Enthalpy", "html": "X(g) + e⁻ → X⁻(g);  Δ_eg H < 0 (exothermic)", "cond": "Halogens have highest negative Δ_eg H; Noble gases have positive Δ_eg H"}, {"label": "Halogen Anomaly", "html": "|Δ_eg H(Cl)| > |Δ_eg H(F)|  (−349 vs −328 kJ mol⁻¹)", "cond": "Compact 2p subshell in F creates intense inter-electronic repulsion"}, {"label": "Pauling Electronegativity Equation", "html": "|χ_A − χ_B| = 0.208 · √(Δ) = 0.208 · √[E_(A−B) − √(E_(A−A) · E_(B−B))]", "cond": "Δ = resonance ionic stabilization energy in kcal mol⁻¹"}], "deeper": "Students frequently conflate electron gain enthalpy with electronegativity. Electron gain enthalpy is an absolute thermodynamic property measured for an isolated gaseous atom in Joules/mol. Electronegativity is not a thermodynamic quantity, has no units, and cannot be measured directly: it describes an atom in a bonded molecular state and varies slightly with hybridization state and oxidation number.", "worked": "NCERT Problem 3.20 & 3.21: (A) Which element has more negative electron gain enthalpy: O or F; F or Cl? Solution: Between O and F, Fluorine is more negative (−328 vs −141 kJ/mol) because F is smaller with higher Z_eff. Between F and Cl, Chlorine is more negative (−349 vs −328 kJ/mol) because F has an extremely compact 2p subshell with high electron repulsion. (B) Would you expect the second electron gain enthalpy of Oxygen (O⁻ + e⁻ → O²⁻) to be positive, negative, or zero? Solution: Strongly positive (+780 kJ/mol, endothermic). Adding a negative electron to an already negative O⁻ ion encounters enormous electrostatic Coulombic repulsion, which requires significant energy input to overcome.", "prediction": {"prompt": "Why is the second electron gain enthalpy of Oxygen (Δ_eg H₂ for O⁻(g) + e⁻ → O²⁻(g)) highly positive (+780 kJ/mol), even though O²⁻ achieves a stable neon octet?", "options": ["Electrostatic repulsion between the negatively charged O⁻ ion and the incoming electron overpowers octet stabilization.", "O²⁻ has too many protons in its nucleus.", "The electron must enter the 3s orbital instead of 2p.", "Oxygen is a non-metal that cannot form divalent anions."], "answer": 0, "explanation": "Even though O²⁻ attains a stable [Ne] octet, adding an electron to an existing anion (O⁻) is strongly opposed by electrostatic Coulomb repulsion. Work must be done to force the electron into the ion, making Δ_eg H₂ endothermic (+780 kJ/mol)."}, "connect": [["Teflon Non-Stick Pans & C–F Bonds", "Fluorine's extreme electronegativity (4.0) makes the Carbon–Fluorine single bond (485 kJ/mol) one of the strongest bonds in organic chemistry, rendering Teflon (PTFE) virtually impervious to heat, acids, and chemical attack."], ["Electronegativity in Water's Dipole", "The large electronegativity difference between Oxygen (3.5) and Hydrogen (2.1) creates water's strong permanent dipole moment (1.85 D), giving rise to hydrogen bonding that keeps water liquid at room temperature and sustains all terrestrial life."]], "recall": "Why is the electron gain enthalpy of Chlorine more negative than that of Fluorine?", "quizzes": [{"prompt": "Which element in the entire periodic table possesses the MOST negative (highest exothermic) electron gain enthalpy?", "options": ["Chlorine (Cl, −349 kJ mol⁻¹)", "Fluorine (F, −328 kJ mol⁻¹)", "Bromine (Br, −325 kJ mol⁻¹)", "Oxygen (O, −141 kJ mol⁻¹)"], "answer": 0, "hint": "Recall the compact 2p repulsion anomaly in Fluorine.", "explain": "Chlorine has the highest electron affinity in the periodic table (−349 kJ/mol). Fluorine is slightly lower (−328 kJ/mol) due to intense inter-electronic repulsion in its compact 2p cloud."}, {"prompt": "On the Pauling scale, what is the assigned electronegativity value of Fluorine?", "options": ["4.0", "3.0", "3.5", "2.1"], "answer": 0, "hint": "Fluorine is the benchmark maximum of the Pauling scale.", "explain": "Linus Pauling arbitrarily designated Fluorine as 4.0 as the reference anchor for calculating relative electronegativities of all other elements."}, {"prompt": "Why do noble gases (Group 18) have positive electron gain enthalpies (endothermic)?", "options": ["The incoming electron must enter the next higher principal quantum shell (n + 1), which is energetically unfavorable", "Noble gases have zero nuclear charge", "Noble gases are too heavy to attract electrons", "Noble gases repel electrons through nuclear forces"], "answer": 0, "hint": "Noble gases already possess completely filled stable valence octets (ns² np⁶).", "explain": "Because noble gases have completely filled ns² np⁶ valence shells, an added electron must occupy the next higher, unshielded (n+1)s orbital, requiring external energy."}]}, {"id": "periodic-valency", "nav": "Valency & Diagonal Rel", "title": "Periodic Valency, Diagonal Relationships & the Anomalous Second Period", "deck": "Second-period elements differ profoundly from heavier congeners due to tiny atomic radii, high electronegativity, and the absolute absence of d-orbitals.", "minutes": 10, "section": "3.7", "pages": [28, 33], "print": "28–33", "sim": "diagonalrel", "simTitle": "Diagonal Relationships (Li-Mg, Be-Al) & Covalency Ceiling Lab", "quick": ["<strong>Valence / Oxidation State Trends:</strong> The valence of representative elements equals either the number of valence electrons (Groups 1–4) or 8 minus the number of valence electrons (Groups 15–17). In modern chemistry, the concept is generalized as <strong>oxidation state</strong>: Oxygen shows −2 in $H_2O$, but +2 in $OF_2$ because Fluorine is more electronegative.", "<strong>Anomalous Behavior of Second Period Elements:</strong> The first element of each group (Li, Be, B, C, N, O, F) differs fundamentally from heavier group members due to: (1) <strong>Extremely small atomic and ionic size</strong>; (2) <strong>High electronegativity and ionization enthalpy</strong>; (3) <strong>Strict absence of vacant d-orbitals</strong> in the $n=2$ valence shell, which limits their maximum covalency to <strong>4</strong> ($2s$ + three $2p$ orbitals). In contrast, third period elements (Al, Si, P, S) possess vacant 3d orbitals and expand their octet to form hypervalent species ($AlF_6^{3-}, PF_5, SF_6$).", "<strong>Diagonal Relationships:</strong> Certain second-period elements show striking chemical similarities with elements diagonally placed in the third period: <strong>Li resembles Mg</strong>, <strong>Be resembles Al</strong>, and <strong>B resembles Si</strong>. This arises because moving across increases charge and electronegativity while decreasing size, whereas moving down decreases charge density and increases size; along the diagonal, these opposing vectors cancel, producing nearly identical <strong>polarizing power</strong> (Ionic charge / Radius²)."], "formulas": [{"label": "Polarizing Power / Ionic Potential", "html": "φ = Ionic Charge (z) / Ionic Radius (r)", "cond": "Diagonal pairs (Li⁺/Mg²⁺, Be²⁺/Al³⁺) have nearly identical polarizing power"}, {"label": "Maximum Covalency Ceiling", "html": "Period 2 Covalency ≤ 4  vs  Period 3 Covalency ≤ 6", "cond": "Period 2 lacks d-orbitals (BF₄⁻ only, but AlF₆³⁻ exists)"}, {"label": "pπ–pπ Multiple Bonding", "html": "C=C, C≡C, N≡N, C=O", "cond": "Small second-period atoms form stable pπ–pπ bonds; heavier 3p atoms overlap poorly"}], "deeper": "Observe the diagonal resemblance between Beryllium and Aluminium: (1) Both metals are passive to nitric acid due to protective oxide films; (2) Both oxides and hydroxides ($BeO, Be(OH)_2$ and $Al_2O_3, Al(OH)_3$) are amphoteric, dissolving in both acids and alkalis; (3) Both form polymeric covalent chlorides ($[BeCl_2]_n$ and $Al_2Cl_6$) that act as strong Lewis acids and dissolve in organic solvents.", "worked": "NCERT Problem 3.24 & 3.28: Why does Boron form only BF₄⁻ while Aluminium forms AlF₆³⁻? Solution: Boron is a second-period element with valence configuration 2s² 2p¹. In shell n = 2, only four atomic orbitals (one 2s and three 2p) are available for bonding, setting an unyielding covalency ceiling of 4. Aluminium is a third-period element (3s² 3p¹) with vacant, energetically accessible 3d orbitals that can expand its coordination shell to form 6 sp³d² hybrid bonds in AlF₆³⁻.", "prediction": {"prompt": "Which of the following compounds is chemically IMPOSSIBLE to synthesize due to the absence of vacant d-orbitals in the central atom?", "options": ["NCl₅ (Nitrogen pentachloride)", "PCl₅ (Phosphorus pentachloride)", "SF₆ (Sulfur hexafluoride)", "SiF₆²⁻ (Hexafluorosilicate ion)"], "answer": 0, "explanation": "Nitrogen is in Period 2 (valence shell n = 2), having only one 2s and three 2p orbitals. It has zero d-orbitals, making it structurally impossible to expand its octet to accommodate 5 bonding pairs. In contrast, Phosphorus in Period 3 uses vacant 3d orbitals to form stable PCl₅."}, "connect": [["Beryllium-Copper Alloys in Aerospace", "Beryllium's small size and covalent character make Be-Cu spring alloys non-magnetic, non-sparking, and fatigue-resistant, critical for spacecraft guidance gyroscopes and aircraft landing gear."], ["Silicon-Carbon Nanomaterials", "The diagonal relationship between Boron and Silicon underpins synthetic boron-doped semiconductor lattices, while the unique ability of Carbon to form pπ-pπ bonds enables graphene, carbon nanotubes, and the vast architecture of organic life."]], "recall": "State two key reasons why second-period elements exhibit anomalous properties compared to heavier congeners in their respective groups.", "quizzes": [{"prompt": "What primary physical parameter is nearly identical between diagonal pairs such as Li⁺ and Mg²⁺?", "options": ["Polarizing power (Charge-to-radius ratio, e/r)", "Total number of protons", "Boiling point of liquid element", "Magnetic susceptibility"], "answer": 0, "hint": "Polarizing power φ = z / r governs covalent character and chemical similarity.", "explain": "Diagonal elements have similar charge-to-radius ratios (polarizing power); Li⁺ (radius 76 pm, charge +1) and Mg²⁺ (radius 72 pm, charge +2) polarize anions similarly."}, {"prompt": "Why can Nitrogen form only NF₃, while Phosphorus forms both PF₃ and PF₅?", "options": ["Nitrogen lacks vacant d-orbitals in its n = 2 shell, limiting its covalency to 4", "Phosphorus is more electronegative than Nitrogen", "Fluorine cannot react with Nitrogen in a 1:5 ratio due to color changes", "Phosphorus has smaller atomic radius than Nitrogen"], "answer": 0, "hint": "Count the available valence orbitals in n = 2 versus n = 3.", "explain": "In Period 2, only 2s and 2p orbitals exist (max 4 bonds). Phosphorus in Period 3 has vacant 3d orbitals available to form 5 hybrid bonds."}, {"prompt": "Which oxide among the following is AMPHOTERIC (reacts with both acids and alkalis)?", "options": ["Al₂O₃ (Aluminium oxide)", "Na₂O (Sodium oxide)", "SO₃ (Sulfur trioxide)", "CaO (Calcium oxide)"], "answer": 0, "hint": "Metals form basic oxides, non-metals form acidic oxides, and diagonal/metalloid elements form amphoteric oxides.", "explain": "Al₂O₃ and BeO are amphoteric, neutralizing acids to form salts (e.g. AlCl₃) and reacting with strong bases to form aluminates (e.g. [Al(OH)₄]⁻)."}]}], "exercises": [{"num": "3.1", "title": "Basic theme of organization in the periodic table", "question": "What is the basic theme of organisation in the periodic table?", "approach": "Relate periodic arrangement to periodic recurrence of physical and chemical properties resulting from underlying electronic configurations.", "solution": "<p>The basic theme of organization in the periodic table is to <strong>classify elements according to their recurring physical and chemical properties</strong>, which are direct consequences of their underlying <strong>valence electronic configurations</strong>.</p><p>By grouping elements with similar outer electron distributions into vertical <strong>groups</strong> and ordering them by increasing <strong>atomic number (Z)</strong> across horizontal <strong>periods</strong>, the periodic table transforms the study of over a hundred individual elements into a systematic, predictable discipline.</p>", "verified": "Systematic grouping by electronic configuration and recurring periodic properties"}, {"num": "3.2", "title": "Mendeleev's organizing property and adherence", "question": "Which important property did Mendeleev use to classify the elements in his periodic table and did he stick to that?", "approach": "Mendeleev used atomic weights and oxide/hydride formulas, but inverted pairs where chemical logic dictated.", "solution": "<p>Dmitri Mendeleev used <strong>atomic weight</strong> as the fundamental organizing property, alongside the empirical formulas and chemical behavior of their <strong>hydrides (RH to RH₄) and oxides (R₂O to R₂O₇)</strong>.</p><p>However, he <strong>did not stick strictly</strong> to increasing atomic weight when chemical similarity was at stake. Whenever atomic weight contradicted chemical behavior, he prioritized chemical similarity: for instance, he placed <strong>Tellurium (atomic weight 127.6) before Iodine (atomic weight 126.9)</strong> so that Iodine aligned with fellow halogens (F, Cl, Br) and Tellurium with chalcogens (O, S, Se). He also placed Cobalt (58.9) before Nickel (58.7).</p>", "verified": "Used atomic weight + chemical formulas; inverted pairs (Te before I, Co before Ni) to preserve chemical grouping"}, {"num": "3.3", "title": "Difference between Mendeleev and Modern Periodic Law", "question": "What is the basic difference in approach between the Mendeleev’s Periodic Law and the Modern Periodic Law?", "approach": "Compare the governing independent variable: atomic weight (Mendeleev) vs atomic number (Modern).", "solution": "<p><strong>1. Mendeleev's Periodic Law (1869):</strong> States that <em>'The physical and chemical properties of elements are periodic functions of their atomic weights.'</em> It treated atomic mass as the fundamental property of matter.</p><p><strong>2. Modern Periodic Law (Moseley, 1913):</strong> States that <em>'The physical and chemical properties of elements are periodic functions of their atomic numbers (Z).'</em></p><p><strong>Fundamental Distinction:</strong> Atomic number ($Z$) represents the nuclear charge and equals the number of electrons in a neutral atom. Since chemical properties are governed exclusively by valence electronic arrangements, atomic number is the true periodic coordinate, naturally explaining isotope placement and anomalous pair inversions.</p>", "verified": "Mendeleev: properties = f(Atomic Weight); Modern: properties = f(Atomic Number Z)"}, {"num": "3.4", "title": "Quantum mechanical justification for 32 elements in Period 6", "question": "On the basis of quantum numbers, justify that the sixth period of the periodic table should have 32 elements.", "approach": "Trace the permitted subshell filling sequence for principal quantum number n = 6 governed by the (n + l) rule.", "solution": "<p>For the sixth period, the principal quantum number is <strong>n = 6</strong>.</p><p>According to the Aufbau $(n + l)$ rule, electrons enter orbitals in order of increasing energy until the next $s$-orbital is reached:</p><ul><li><strong>6s subshell:</strong> 1 orbital (holds $1 \times 2 = 2$ electrons)</li><li><strong>4f subshell:</strong> 7 orbitals (holds $7 \times 2 = 14$ electrons) — Lanthanoid series</li><li><strong>5d subshell:</strong> 5 orbitals (holds $5 \times 2 = 10$ electrons) — 5d transition series</li><li><strong>6p subshell:</strong> 3 orbitals (holds $3 \times 2 = 6$ electrons)</li></ul><p>Total number of orbitals filled in Period 6 = $1 + 7 + 5 + 3 = 16$ orbitals.</p><p>By the Pauli Exclusion Principle, each orbital accommodates 2 electrons. Therefore, maximum capacity = $16 \times 2 = <strong>32 elements</strong> (from Caesium $Z=55$ to Radon $Z=86$).</p>", "verified": "16 orbitals (6s + 4f + 5d + 6p) × 2 electrons/orbital = 32 elements"}, {"num": "3.5", "title": "Locating element with Z = 114 in period and group", "question": "In terms of period and group where would you locate the element with Z = 114?", "approach": "Write the noble gas core configuration using Radon (Z = 86) to deduce period n and group.", "solution": "<p>Atomic number Z = 114. Nearest preceding noble gas is Radon ($[Rn]$, $Z = 86$).</p><p>Electronic configuration: <strong>[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p²</strong>.</p><p>1. <strong>Period:</strong> The highest principal quantum number is $n = 7$, so the element belongs to <strong>Period 7</strong>.</p><p>2. <strong>Block:</strong> The last differentiating electron enters the $7p$ subshell, so it is a <strong>p-block element</strong>.</p><p>3. <strong>Group:</strong> For p-block elements, Group Number = $12 + np\text{ electrons} = 12 + 2 = <strong>Group 14</strong> (Carbon family, Flerovium, Fl).</p>", "verified": "Period 7, Group 14 (p-block, Flerovium, Fl)"}, {"num": "3.6", "title": "Atomic number of element in Period 3, Group 17", "question": "Write the atomic number of the element present in the third period and seventeenth group of the periodic table.", "approach": "Period 3 has n = 3. Group 17 has valence configuration 3s² 3p⁵. Sum core electrons.", "solution": "<p>Period 3 indicates valence shell $n = 3$.</p><p>Group 17 (Halogens) has valence electronic configuration <strong>ns² np⁵</strong>, which for $n = 3$ is <strong>3s² 3p⁵</strong>.</p><p>Adding inner core electrons (Neon core $1s^2 2s^2 2p^6 = 10$ electrons):</p><p>Full configuration: $1s^2 2s^2 2p^6 3s^2 3p^5 = 10 + 2 + 5 = <strong>17</strong>.</p><p>Atomic number <strong>Z = 17</strong> corresponds to <strong>Chlorine (Cl)</strong>.</p>", "verified": "Z = 17 (Chlorine, Cl)"}, {"num": "3.7", "title": "Elements named after Berkeley Lab and Seaborg's group", "question": "Which element do you think would have been named by (i) Lawrence Berkeley Laboratory, (ii) Seaborg’s group?", "approach": "Match scientific institutions and pioneers to transuranic element names.", "solution": "<p><strong>(i) Lawrence Berkeley Laboratory:</strong></p><p>Element $Z = 103$ was synthesized at Berkeley and named <strong>Lawrencium (Lr)</strong> in honor of Ernest O. Lawrence (inventor of the cyclotron). Also, element $Z = 97$ was named <strong>Berkelium (Bk)</strong> after the city and laboratory.</p><p><strong>(ii) Seaborg's Group:</strong></p><p>Element $Z = 106$ was synthesized by Glenn T. Seaborg's collaborative team and officially named <strong>Seaborgium (Sg)</strong> in honor of Glenn Seaborg while he was still alive.</p>", "verified": "(i) Lawrencium (Lr, Z=103) & Berkelium (Bk, Z=97); (ii) Seaborgium (Sg, Z=106)"}, {"num": "3.8", "title": "Why elements in the same group have similar properties", "question": "Why do elements in the same group have similar physical and chemical properties?", "approach": "Chemical reactions involve valence electrons; identical valence configurations produce identical valence chemical behaviors.", "solution": "<p>Elements in the same vertical group possess the <strong>exact same number and spatial arrangement of valence electrons</strong> in their outermost energy shells.</p><p>Because chemical bonding and reactions depend primarily on gaining, losing, or sharing valence electrons, elements with identical valence configurations (e.g. Group 1 alkali metals with $ns^1$, Group 17 halogens with $ns^2 np^5$) form compounds with similar stoichiometries, oxidation states, and reaction mechanisms.</p>", "verified": "Identical valence shell electronic configurations (ns¹, ns² np⁵, etc.) dictate similar bonding and valency"}, {"num": "3.9", "title": "Meaning of atomic radius and ionic radius", "question": "What does atomic radius and ionic radius really mean to you?", "approach": "Discuss electron probability cloud boundaries and operational definitions via internuclear bonded distances.", "solution": "<p>Because an isolated atom has no rigid outer boundary (its electron cloud probability density asymptotically approaches zero at infinity), atomic size cannot be measured directly like a solid sphere.</p><p><strong>1. Atomic Radius</strong> is operationally defined as half the distance between the nuclei of two identical bonded atoms: <em>covalent radius</em> for non-metals (e.g. Cl₂), <em>metallic radius</em> for metal crystals (e.g. Cu lattice), or <em>Van der Waals radius</em> between non-bonded molecules in solids.</p><p><strong>2. Ionic Radius</strong> is the effective distance from the nucleus of an ion to the outer boundary of its electron cloud within an ionic crystal lattice, measured by X-ray crystallography.</p>", "verified": "Operational half-distance between nuclei in bonded/lattice states, as isolated electron clouds lack sharp edges"}, {"num": "3.10", "title": "Variation of atomic radius across period and group", "question": "How do atomic radius vary in a period and in a group? How do you explain the variation?", "approach": "Analyze effective nuclear charge across a period versus addition of principal quantum shells down a group.", "solution": "<p><strong>1. Across a Period (Left to Right):</strong> Atomic radius <strong>decreases</strong>.</p><p><em>Explanation:</em> Electrons are added to the same principal quantum shell ($n$), where they screen each other imperfectly. Meanwhile, the nuclear charge ($Z$) increases by $+1$ at each successive element, increasing the effective nuclear charge ($Z_{eff}$) and drawing the valence electron cloud closer to the nucleus.</p><p><strong>2. Down a Group (Top to Bottom):</strong> Atomic radius <strong>increases</strong>.</p><p><em>Explanation:</em> At each successive step, a completely new principal energy shell ($n = 1, 2, 3...$) is added. The increased physical distance of the outer shell, combined with powerful screening by core electron shells, strongly outweighs the increased nuclear charge, causing the atom to expand.</p>", "verified": "Decreases across a period (increasing Z_eff); increases down a group (addition of new principal shells)"}, {"num": "3.11", "title": "Isoelectronic species and examples for F-", "question": "What do you understand by isoelectronic species? Name a species that will be isoelectronic with each of the following atoms or ions: (i) F⁻, (ii) Ar, (iii) Mg²⁺, (iv) Rb⁺.", "approach": "Isoelectronic species possess the exact same number of electrons. Match electron counts.", "solution": "<p><strong>Isoelectronic species</strong> are atoms, molecules, or ions that possess the <strong>exact same total number of electrons</strong> and identical electronic configurations.</p><ul><li><strong>(i) F⁻ (10 electrons):</strong> Isoelectronic with <strong>Na⁺, Mg²⁺, Al³⁺, O²⁻, N³⁻, Ne</strong>.</li><li><strong>(ii) Ar (18 electrons):</strong> Isoelectronic with <strong>K⁺, Ca²⁺, Cl⁻, S²⁻, P³⁻</strong>.</li><li><strong>(iii) Mg²⁺ (10 electrons):</strong> Isoelectronic with <strong>Na⁺, F⁻, O²⁻, Ne</strong>.</li><li><strong>(iv) Rb⁺ (36 electrons):</strong> Isoelectronic with <strong>Kr, Sr²⁺, Br⁻, Se²⁻</strong>.</li></ul>", "verified": "Species with identical electron counts; (i) Na⁺, Ne; (ii) K⁺, Cl⁻; (iii) F⁻, Na⁺; (iv) Kr, Sr²⁺"}, {"num": "3.12", "title": "Isoelectronic series N3-, O2-, F-, Na+, Mg2+, Al3+", "question": "Consider the following species: N³⁻, O²⁻, F⁻, Na⁺, Mg²⁺ and Al³⁺.\n(a) What is common in them?\n(b) Arrange them in the order of increasing ionic radii.", "approach": "All have 10 electrons. Ionic radius scales inversely with nuclear charge Z.", "solution": "<p><strong>(a) Common feature:</strong> All six species are <strong>isoelectronic</strong>, each containing exactly <strong>10 electrons</strong> with the closed neon configuration $1s^2 2s^2 2p^6$.</p><p><strong>(b) Order of increasing ionic radii:</strong></p><p>For isoelectronic species, as the positive nuclear charge ($Z$) increases, the electrostatic attraction pulls the 10 electrons tighter toward the center, shrinking the radius:</p><ul><li>Al³⁺ ($Z = 13$): radius = 53 pm</li><li>Mg²⁺ ($Z = 12$): radius = 72 pm</li><li>Na⁺ ($Z = 11$): radius = 102 pm</li><li>F⁻ ($Z = 9$): radius = 136 pm</li><li>O²⁻ ($Z = 8$): radius = 140 pm</li><li>N³⁻ ($Z = 7$): radius = 171 pm</li></ul><p>Increasing radius: <strong>Al³⁺ &lt; Mg²⁺ &lt; Na⁺ &lt; F⁻ &lt; O²⁻ &lt; N³⁻</strong>.</p>", "verified": "(a) All have 10 electrons (isoelectronic); (b) Al³⁺ < Mg²⁺ < Na⁺ < F⁻ < O²⁻ < N³⁻"}, {"num": "3.13", "title": "Why cations are smaller and anions larger than parent atoms", "question": "Explain why cations are smaller and anions larger in radii than their parent atoms.", "approach": "Examine electron-to-proton ratio, inter-electronic repulsion, and effective nuclear charge.", "solution": "<p><strong>1. Cation is smaller than parent atom:</strong></p><p>When an atom loses electrons to form a cation, the positive nuclear charge remains constant while the number of electrons decreases. Consequently, the effective nuclear charge per electron ($Z_{eff}$) increases, pulling remaining electrons inward. In many cases (e.g. Na $\to$ Na⁺), the entire outermost valence shell is stripped away, causing a drastic shrinkage ($r(Na) = 186$ pm vs $r(Na^+) = 102$ pm).</p><p><strong>2. A
