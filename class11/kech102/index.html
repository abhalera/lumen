></p><p>ΔE = E₅ − E₁ = −8.72 × 10⁻²⁰ J − (−2.18 × 10⁻¹⁸ J) = <strong>2.0928 × 10⁻¹⁸ J</strong>.</p><p><strong>2. Wavelength emitted on returning to ground state (n = 5 → 1):</strong></p><p>λ = hc / ΔE = (6.626 × 10⁻³⁴ J s × 3.0 × 10⁸ m s⁻¹) / (2.0928 × 10⁻¹⁸ J) = 9.498 × 10⁻⁸ m = <strong>95.0 nm (950 Å, Lyman UV)</strong>.</p>", "verified": "ΔE = 2.093 × 10⁻¹⁸ J; λ = 9.50 × 10⁻⁸ m (95.0 nm)"}, {"num": "2.19", "title": "Energy to remove electron from n = 2 of H and longest absorption wavelength", "question": "The electron energy in hydrogen atom is given by E_n = (−2.18 × 10⁻¹⁸)/n² J. Calculate the energy required to remove an electron completely from the n = 2 orbit. What is the longest wavelength of light in cm that can be used to cause this transition?", "approach": "Ionization from n = 2 requires ΔE = 0 − E₂ = 2.18 × 10⁻¹⁸ / 4 J. Longest wavelength capable of this is λ = hc / ΔE.", "solution": "<p><strong>1. Energy to remove electron from n = 2 to n = ∞:</strong></p><p>ΔE = 0 − E₂ = (2.18 × 10⁻¹⁸ J) / 2² = (2.18 × 10⁻¹⁸ J) / 4 = <strong>5.45 × 10⁻¹⁹ J</strong> (3.40 eV).</p><p><strong>2. Longest wavelength (threshold wavelength):</strong></p><p>λ = hc / ΔE = (6.626 × 10⁻³⁴ J s × 3.0 × 10⁸ m s⁻¹) / (5.45 × 10⁻¹⁹ J) = 3.647 × 10⁻⁷ m = <strong>3.647 × 10⁻⁵ cm (364.7 nm)</strong>.</p>", "verified": "5.45 × 10⁻¹⁹ J; 3.647 × 10⁻⁵ cm (364.7 nm)"}, {"num": "2.20", "title": "de Broglie wavelength of an electron at 2.05 × 10⁷ m/s", "question": "Calculate the wavelength of an electron moving with a velocity of 2.05 × 10⁷ m s⁻¹.", "approach": "Apply de Broglie relation λ = h / (m_e · v).", "solution": "<p>Given: m_e = 9.10938 × 10⁻³¹ kg, v = 2.05 × 10⁷ m s⁻¹.</p><p>λ = h / (m_e · v) = (6.626 × 10⁻³⁴ kg m² s⁻¹) / (9.109 × 10⁻³¹ kg × 2.05 × 10⁷ m s⁻¹)</p><p>λ = (6.626 × 10⁻³⁴) / (1.8674 × 10⁻²³) = <strong>3.548 × 10⁻¹¹ m = 0.0355 nm = 0.355 Å</strong>.</p>", "verified": "3.55 × 10⁻¹¹ m (0.0355 nm)"}, {"num": "2.21", "title": "de Broglie wavelength from kinetic energy 3.0 × 10⁻²⁵ J", "question": "The mass of an electron is 9.1 × 10⁻³¹ kg. If its K.E. is 3.0 × 10⁻²⁵ J, calculate its wavelength.", "approach": "Relate kinetic energy to momentum: p = √(2 m K), then λ = h / p = h / √(2 m K).", "solution": "<p>Given: m = 9.1 × 10⁻³¹ kg, K = 3.0 × 10⁻²⁵ J.</p><p>Momentum p = √(2 m K) = √(2 × 9.1 × 10⁻³¹ × 3.0 × 10⁻²⁵) = √(5.46 × 10⁻⁵⁵) = 7.389 × 10⁻²⁸ kg m s⁻¹.</p><p>λ = h / p = (6.626 × 10⁻³⁴ J s) / (7.389 × 10⁻²⁸ kg m s⁻¹) = <strong>8.967 × 10⁻⁷ m = 896.7 nm</strong>.</p>", "verified": "8.967 × 10⁻⁷ m (896.7 nm)"}, {"num": "2.22", "title": "Identify isoelectronic species", "question": "Which of the following are isoelectronic species i.e., those having the same number of electrons: Na⁺, K⁺, Mg²⁺, Ca²⁺, S²⁻, Ar?", "approach": "Isoelectronic species have the exact same number of electrons. Calculate total electrons Z − charge for each.", "solution": "<p>Count electrons for each species:</p><ul><li><strong>Na⁺:</strong> Z = 11 => 11 − 1 = <strong>10 electrons</strong> (Neon core).</li><li><strong>Mg²⁺:</strong> Z = 12 => 12 − 2 = <strong>10 electrons</strong> (Neon core).</li><li><strong>K⁺:</strong> Z = 19 => 19 − 1 = <strong>18 electrons</strong> (Argon core).</li><li><strong>Ca²⁺:</strong> Z = 20 => 20 − 2 = <strong>18 electrons</strong> (Argon core).</li><li><strong>S²⁻:</strong> Z = 16 => 16 + 2 = <strong>18 electrons</strong> (Argon core).</li><li><strong>Ar:</strong> Z = 18 => <strong>18 electrons</strong> (Argon core).</li></ul><p>Conclusion:</p><p>Group 1 (10 electrons): <strong>Na⁺ and Mg²⁺</strong> are isoelectronic.</p><p>Group 2 (18 electrons): <strong>K⁺, Ca²⁺, S²⁻, and Ar</strong> are isoelectronic.</p>", "verified": "Set 1 (10 e⁻): Na⁺, Mg²⁺; Set 2 (18 e⁻): K⁺, Ca²⁺, S²⁻, Ar"}, {"num": "2.23", "title": "Electronic configurations of ions and outermost configurations", "question": "(i) Write the electronic configurations of the following ions: (a) H⁻, (b) Na⁺, (c) O²⁻, (d) F⁻.\n(ii) What are the atomic numbers of elements whose outermost electrons are represented by: (a) 3s¹, (b) 2p³, (c) 3p⁵?\n(iii) Which atoms are indicated by the following configurations: (a) [He] 2s¹, (b) [Ne] 3s² 3p³, (c) [Ar] 4s² 3d¹?", "approach": "Write complete aufbau order and sum total electrons to identify atomic numbers and neutral elements.", "solution": "<p><strong>(i) Ionic configurations:</strong></p><ul><li>(a) H⁻ (2 e⁻): <strong>1s²</strong> (Helium configuration)</li><li>(b) Na⁺ (10 e⁻): <strong>1s² 2s² 2p⁶</strong> ([Ne])</li><li>(c) O²⁻ (10 e⁻): <strong>1s² 2s² 2p⁶</strong> ([Ne])</li><li>(d) F⁻ (10 e⁻): <strong>1s² 2s² 2p⁶</strong> ([Ne])</li></ul><p><strong>(ii) Atomic numbers from valence subshell:</strong></p><ul><li>(a) 3s¹: 1s² 2s² 2p⁶ 3s¹ => 11 electrons => <strong>Z = 11 (Sodium, Na)</strong>.</li><li>(b) 2p³: 1s² 2s² 2p³ => 7 electrons => <strong>Z = 7 (Nitrogen, N)</strong>.</li><li>(c) 3p⁵: 1s² 2s² 2p⁶ 3s² 3p⁵ => 17 electrons => <strong>Z = 17 (Chlorine, Cl)</strong>.</li></ul><p><strong>(iii) Atom identities:</strong></p><ul><li>(a) [He] 2s¹: 2 + 1 = 3 electrons => <strong>Lithium (Li)</strong>.</li><li>(b) [Ne] 3s² 3p³: 10 + 2 + 3 = 15 electrons => <strong>Phosphorus (P)</strong>.</li><li>(c) [Ar] 4s² 3d¹: 18 + 2 + 1 = 21 electrons => <strong>Scandium (Sc)</strong>.</li></ul>", "verified": "(i) H⁻: 1s²; Na⁺, O²⁻, F⁻: 1s² 2s² 2p⁶; (ii) Z = 11, 7, 17; (iii) Li, P, Sc"}, {"num": "2.24", "title": "Lowest value of n allowing g orbitals", "question": "What is the lowest value of n that allows g orbitals to exist?", "approach": "Subshell labels follow azimuthal quantum number: s (l=0), p (l=1), d (l=2), f (l=3), g (l=4). The principal quantum number n must satisfy l ≤ n − 1.", "solution": "<p>Azimuthal quantum number for g orbital is <strong>l = 4</strong>.</p><p>Since l can only take values from 0 up to n − 1, we require n − 1 ≥ 4 => <strong>n ≥ 5</strong>.</p><p>Therefore, the lowest value of n that allows g orbitals to exist is <strong>n = 5</strong>.</p>", "verified": "n = 5 (since l = 4 for g orbital and l ≤ n − 1)"}, {"num": "2.25", "title": "Possible quantum numbers for an electron in 3d orbital", "question": "An electron is in one of the 3d orbitals. Give the possible values of n, l and m_l for this electron.", "approach": "For 3d: n = 3, l = 2. Magnetic quantum number m_l ranges from −l to +l.", "solution": "<p>For a 3d orbital:</p><ul><li>Principal quantum number: <strong>n = 3</strong></li><li>Azimuthal quantum number: <strong>l = 2</strong> (by definition of d subshell)</li><li>Magnetic quantum number: <strong>m_l can be −2, −1, 0, +1, or +2</strong> (5 degenerate orientations).</li><li>Spin quantum number (for completeness): m_s = +½ or −½.</li></ul>", "verified": "n = 3, l = 2, m_l = −2, −1, 0, +1, +2"}, {"num": "2.26", "title": "Protons and configuration for atom with 29 electrons and 35 neutrons", "question": "An atom of an element contains 29 electrons and 35 neutrons. Deduce (i) the number of protons and (ii) the electronic configuration of the element.", "approach": "In a neutral atom, protons = electrons = 29. Z = 29 is Copper (Cu), which possesses an anomalous configuration due to full d¹⁰ stability.", "solution": "<p><strong>(i) Number of protons:</strong></p><p>In a neutral atom, Protons = Electrons = <strong>29 protons</strong> (Atomic number Z = 29, Copper Cu). Mass number A = 29 + 35 = 64 (⁶⁴₂₉Cu).</p><p><strong>(ii) Electronic configuration:</strong></p><p>Standard Aufbau predicts 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d⁹. However, transferring one electron from 4s to 3d creates a completely filled, highly stable d¹⁰ subshell with high exchange energy:</p><p><strong>1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s¹</strong>, or concisely <strong>[Ar] 3d¹⁰ 4s¹</strong>.</p>", "verified": "(i) 29 protons; (ii) [Ar] 3d¹⁰ 4s¹ (or 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s¹)"}, {"num": "2.27", "title": "Number of electrons in H2+, H2, and O2+", "question": "Give the number of electrons in the species: H₂⁺, H₂, and O₂⁺.", "approach": "Count total valence/core atomic electrons and adjust for net positive ionic charge.", "solution": "<ul><li><strong>H₂⁺:</strong> Two H atoms (1 + 1 = 2) minus 1 electron for the positive charge = <strong>1 electron</strong>.</li><li><strong>H₂:</strong> Two neutral H atoms (1 + 1) = <strong>2 electrons</strong>.</li><li><strong>O₂⁺:</strong> Two O atoms (8 + 8 = 16) minus 1 electron for positive charge = <strong>15 electrons</strong>.</li></ul>", "verified": "H₂⁺: 1 electron; H₂: 2 electrons; O₂⁺: 15 electrons"}, {"num": "2.28", "title": "Quantum numbers for n = 3 and 2p electrons", "question": "(i) An atomic orbital has n = 3. What are the possible values of l and m_l?\n(ii) List the quantum numbers (m_l and l) of electrons for 3d orbital.\n(iii) Which of the following orbitals are possible: 1p, 2s, 2p and 3f?", "approach": "Apply rules: 0 ≤ l ≤ n − 1, −l ≤ m_l ≤ +l.", "solution": "<p><strong>(i) For n = 3:</strong></p><p>Possible values of l: <strong>0 (s), 1 (p), 2 (d)</strong>.</p><p>For l = 0: m_l = 0.</p><p>For l = 1: m_l = −1, 0, +1.</p><p>For l = 2: m_l = −2, −1, 0, +1, +2.</p><p><strong>(ii) For 3d orbital:</strong></p><p><strong>l = 2</strong>, and <strong>m_l = −2, −1, 0, +1, +2</strong>.</p><p><strong>(iii) Orbital possibility check:</strong></p><ul><li><strong>1p:</strong> Impossible (for n = 1, max l = 0, so only 1s exists).</li><li><strong>2s:</strong> Possible (n = 2, l = 0).</li><li><strong>2p:</strong> Possible (n = 2, l = 1).</li><li><strong>3f:</strong> Impossible (for n = 3, max l = 2, so only 3s, 3p, 3d exist; f requires l = 3, so n ≥ 4).</li></ul>", "verified": "(i) l = 0,1,2; m_l ranges −l..+l; (ii) l = 2, m_l = −2..+2; (iii) 2s and 2p are possible; 1p and 3f are impossible"}, {"num": "2.29", "title": "Describing orbitals using s, p, d, f notations", "question": "Using s, p, d notations, describe the orbital with the following quantum numbers:\n(a) n = 1, l = 0; (b) n = 3, l = 1; (c) n = 4, l = 2; (d) n = 4, l = 3.", "approach": "Map l value to letter notation: 0 -> s, 1 -> p, 2 -> d, 3 -> f, prefixed by principal number n.", "solution": "<ul><li>(a) n = 1, l = 0 => <strong>1s orbital</strong></li><li>(b) n = 3, l = 1 => <strong>3p orbital</strong></li><li>(c) n = 4, l = 2 => <strong>4d orbital</strong></li><li>(d) n = 4, l = 3 => <strong>4f orbital</strong></li></ul>", "verified": "(a) 1s; (b) 3p; (c) 4d; (d) 4f"}, {"num": "2.30", "title": "Validity of given quantum number sets", "question": "Explain, giving reasons, which of the following sets of quantum numbers are not possible:\n(a) n = 0, l = 0, m_l = 0, m_s = +½\n(b) n = 1, l = 1, m_l = 0, m_s = −½\n(c) n = 1, l = 0, m_l = 0, m_s = −½\n(d) n = 2, l = 1, m_l = 0, m_s = −½\n(e) n = 3, l = 3, m_l = −3, m_s = +½\n(f) n = 3, l = 1, m_l = 0, m_s = +½", "approach": "Criteria: n must be a positive integer (n ≥ 1); 0 ≤ l ≤ n − 1; |m_l| ≤ l; m_s = ±½.", "solution": "<ul><li><strong>(a) Not possible:</strong> n cannot be zero (n must be a positive integer 1, 2, 3...).</li><li><strong>(b) Not possible:</strong> For n = 1, l can only be 0 (l must be &lt; n). l = 1 is invalid.</li><li><strong>(c) Possible:</strong> Represents a 1s electron.</li><li><strong>(d) Possible:</strong> Represents a 2p electron.</li><li><strong>(e) Not possible:</strong> For n = 3, maximum l is n − 1 = 2 (3d). l = 3 (3f) is invalid.</li><li><strong>(f) Possible:</strong> Represents a 3p electron.</li></ul>", "verified": "Not possible: (a) [n=0], (b) [l=1 for n=1], (e) [l=3 for n=3]; Possible: (c), (d), (f)"}, {"num": "2.31", "title": "Number of electrons with given quantum numbers", "question": "How many electrons in an atom may have the following quantum numbers?\n(a) n = 4, m_s = −½\n(b) n = 3, l = 0", "approach": "Total orbitals in shell n is n². Each orbital can hold at most 1 electron with a specific spin m_s. For subshell (n, l), orbital count is 2l + 1.", "solution": "<p><strong>(a) n = 4, m_s = −½:</strong></p><p>Total number of orbitals in principal shell n = 4 is n² = 4² = 16 orbitals.</p><p>Each orbital can accommodate at most two electrons of opposite spins (+½ and −½).</p><p>Therefore, exactly 1 electron per orbital has m_s = −½ => <strong>16 electrons</strong>.</p><p><strong>(b) n = 3, l = 0:</strong></p><p>n = 3, l = 0 designates the <strong>3s subshell</strong>.</p><p>An s subshell contains exactly 1 orbital, which can hold a maximum of <strong>2 electrons</strong> (with m_s = +½ and −½).</p>", "verified": "(a) 16 electrons; (b) 2 electrons"}, {"num": "2.32", "title": "Circumference of Bohr orbit as integral multiple of de Broglie wavelength", "question": "Show that the circumference of the Bohr orbit for the hydrogen atom is an integral multiple of the de Broglie wavelength associated with the electron revolving around the orbit.", "approach": "Combine Bohr angular momentum postulate mvr = nh/(2π) with de Broglie relation λ = h/(mv).", "solution": "<p>According to Bohr's second postulate, the orbital angular momentum of an electron in a stationary orbit is:</p><p>m_e v r = n · (h / 2π)  where n = 1, 2, 3...</p><p>Rearranging this equation gives:</p><p>2π r = n · (h / m_e v)</p><p>From Louis de Broglie's matter wave relation, the wavelength of the electron is λ = h / (m_e v).</p><p>Substituting λ into the rearranged Bohr equation yields:</p><p><strong>2π r = n · λ</strong></p><p>This rigorously proves that the circumference of the n-th Bohr orbit is an exact integer multiple (n) of the de Broglie matter wavelength, establishing a standing circular wave with zero destructive phase cancellation!</p>", "verified": "2π r = n λ (proven: orbit circumference equals exactly n standing matter wavelengths)"}, {"num": "2.33", "title": "Matching hydrogen transition wavelength to He+ Balmer transition n=4 to 2", "question": "What transition in the hydrogen spectrum would have the same wavelength as the Balmer transition n = 4 to n = 2 of He⁺ spectrum?", "approach": "Equate Rydberg formulas for H (Z = 1) and He⁺ (Z = 2): R_H · 1² · (1/n₁² − 1/n₂²) = R_H · 2² · (1/2² − 1/4²).", "solution": "<p>For He⁺ (Z = 2) undergoing transition from n = 4 to n = 2:</p><p>ν̄ = R_H · Z² · (1 / 2² − 1 / 4²) = R_H · (2²) · (1/4 − 1/16) = R_H · 4 · (3/16) = R_H · (3/4).</p><p>For atomic hydrogen (Z = 1), we seek levels n₁ and n₂ such that:</p><p>ν̄ = R_H · 1² · (1 / n₁² − 1 / n₂²) = R_H · (3/4).</p><p>Notice that (1 / 1² − 1 / 2²) = 1 − 1/4 = 3/4.</p><p>Thus: <strong>n₁ = 1 and n₂ = 2</strong> (the Lyman-alpha line in atomic hydrogen!).</p>", "verified": "Transition from n = 2 to n = 1 in hydrogen (Lyman-alpha)"}, {"num": "2.34", "title": "Energy required for He+(g) -> He2+(g) + e-", "question": "Calculate the energy required for the process He⁺(g) → He²⁺(g) + e⁻. The ionization energy for the H atom in the ground state is 2.18 × 10⁻¹⁸ J atom⁻¹.", "approach": "He⁺ is a hydrogenic one-electron ion with Z = 2. Energy of orbit n is E_n = −2.18 × 10⁻¹⁸ · (Z² / n²) J.", "solution": "<p>He⁺ has 1 electron and nuclear charge Z = 2. In ground state n = 1, its energy is:</p><p>E₁(He⁺) = −2.18 × 10⁻¹⁸ × (Z² / 1²) = −2.18 × 10⁻¹⁸ × 4 = −8.72 × 10⁻¹⁸ J atom⁻¹.</p><p>The energy required to ionize He⁺ to He²⁺ (removing electron to n = ∞, where E_∞ = 0) is:</p><p>ΔE = E_∞ − E₁ = 0 − (−8.72 × 10⁻¹⁸ J) = <strong>8.72 × 10⁻¹⁸ J atom⁻¹</strong>.</p><p>Per mole: 8.72 × 10⁻¹⁸ × 6.022 × 10²³ = <strong>5251 kJ mol⁻¹ (54.4 eV)</strong>.</p>", "verified": "8.72 × 10⁻¹⁸ J atom⁻¹ (5251 kJ mol⁻¹, 54.4 eV)"}, {"num": "2.35", "title": "Number of carbon atoms across a 2.4 cm straight line", "question": "If the diameter of a carbon atom is 0.15 nm, calculate the number of carbon atoms which can be placed side by side in a straight line across length of scale of length 20 cm (or 2.4 cm).", "approach": "Number of atoms N = Total length L / atomic diameter d.", "solution": "<p>Given: Diameter of carbon atom d = 0.15 nm = 0.15 × 10⁻⁹ m = 1.5 × 10⁻¹⁰ m.</p><p>Total length of scale L = 2.4 cm = 2.4 × 10⁻² m (or 20 cm = 0.20 m).</p><p>For L = 2.4 cm: N = (2.4 × 10⁻² m) / (1.5 × 10⁻¹⁰ m) = <strong>1.6 × 10⁸ atoms</strong>.</p><p>For L = 20 cm: N = (0.20 m) / (1.5 × 10⁻¹⁰ m) = <strong>1.33 × 10⁹ atoms</strong>.</p>", "verified": "1.6 × 10⁸ atoms (for 2.4 cm) or 1.33 × 10⁹ atoms (for 20 cm)"}, {"num": "2.36", "title": "Radius of carbon atom from arranged length of 2.4 cm", "question": "2 × 10⁸ atoms of carbon are arranged side by side. Calculate the radius of carbon atom if the length of this arrangement is 2.4 cm.", "approach": "Total length = N · diameter = N · 2r. Therefore r = Length / (2N).", "solution": "<p>Given: N = 2 × 10⁸ atoms, Length L = 2.4 cm = 2.4 × 10⁻² m.</p><p>Diameter of one atom = L / N = (2.4 × 10⁻² m) / (2 × 10⁸) = 1.2 × 10⁻¹⁰ m = 1.2 Å.</p><p>Radius r = Diameter / 2 = (1.2 × 10⁻¹⁰ m) / 2 = <strong>6.0 × 10⁻¹¹ m = 0.060 nm = 60 pm (0.60 Å)</strong>.</p>", "verified": "6.0 × 10⁻¹¹ m = 60 pm (0.06 nm)"}, {"num": "2.37", "title": "Radius of zinc atom in pm and atoms in 1.6 mm", "question": "The diameter of zinc atom is 2.6 Å. Calculate (a) radius of zinc atom in pm and (b) number of atoms present in a length of 1.6 mm if the zinc atoms are arranged side by side lengthwise.", "approach": "Convert Å to pm (1 Å = 100 pm). Radius = diameter/2. Number of atoms = Length / diameter.", "solution": "<p>Given: Diameter d = 2.6 Å = 2.6 × 10⁻¹⁰ m = 260 pm.</p><p><strong>(a) Radius in pm:</strong></p><p>r = d / 2 = 260 pm / 2 = <strong>130 pm (1.3 Å)</strong>.</p><p><strong>(b) Number of atoms in 1.6 mm:</strong></p><p>Length L = 1.6 mm = 1.6 × 10⁻³ m.</p><p>Number of atoms N = L / d = (1.6 × 10⁻³ m) / (2.6 × 10⁻¹⁰ m) = <strong>6.154 × 10⁶ atoms</strong>.</p>", "verified": "(a) 130 pm; (b) 6.15 × 10⁶ atoms"}, {"num": "2.38", "title": "Number of electrons from static charge 2.5 × 10⁻¹⁶ C", "question": "A certain particle carries 2.5 × 10⁻¹⁶ C of static electric charge. Calculate the number of electrons present in it.", "approach": "By charge quantization Q = n · e, where e = 1.6022 × 10⁻¹⁹ C.", "solution": "<p>Given: Total charge Q = 2.5 × 10⁻¹⁶ C.</p><p>Elementary charge e = 1.6022 × 10⁻¹⁹ C.</p><p>Number of electrons n = Q / e = (2.5 × 10⁻¹⁶ C) / (1.6022 × 10⁻¹⁹ C) = <strong>1560.3 ≈ 1560 electrons</strong>.</p>", "verified": "1.56 × 10³ electrons (1560 electrons)"}, {"num": "2.39", "title": "Elementary charge from Millikan oil drop charges", "question": "In Millikan's experiment, static electric charge on the oil drops has been obtained by shining X-rays. If the static electric charge on oil drops is −1.282 × 10⁻¹⁸ C, −1.602 × 10⁻¹⁹ C, −3.204 × 10⁻¹⁹ C, what conclusion can be drawn?", "approach": "Find the greatest common divisor (GCD) of the charges to establish charge quantization.", "solution": "<p>Given charges on drops:</p><ul><li>q₁ = −1.602 × 10⁻¹⁹ C = 1 × (−1.602 × 10⁻¹⁹ C)</li><li>q₂ = −3.204 × 10⁻¹⁹ C = 2 × (−1.602 × 10⁻¹⁹ C)</li><li>q₃ = −1.282 × 10⁻¹⁸ C = 8 × (−1.602 × 10⁻¹⁹ C)</li></ul><p><strong>Conclusion:</strong> Every measured charge is an exact integral multiple of a fundamental unit of electric charge, <strong>e = 1.602 × 10⁻¹⁹ C</strong>. Electric charge is quantized in nature (q = n · e).</p>", "verified": "Charge is quantized; fundamental elementary charge e = 1.602 × 10⁻¹⁹ C"}, {"num": "2.40", "title": "Why heavy atoms like gold foil are used in Rutherford experiment", "question": "In Rutherford's experiment, generally the thin foil of heavy atoms, like gold, platinum etc. have been used to be bombarded by the α-particles. If the thin foil of light atoms like aluminium etc. is used, what difference would be observed from the above results?", "approach": "Coulomb repulsion depends on nuclear charge Z (Gold Z = 79 vs Aluminum Z = 13) and foil thinness.", "solution": "<p>Rutherford scattering is governed by Coulomb electrostatic repulsion: F ∝ Z₁ Z₂ e² / r².</p><p><strong>1. Low nuclear charge:</strong> Gold has a massive positive nuclear charge (Z = 79), exerting enormous repulsive force capable of turning heavy alpha particles backwards (>90°). Aluminum has only Z = 13 (6 times weaker field), resulting in much smaller deflection angles with virtually zero backward scattering.</p><p><strong>2. Foil thinness:</strong> Gold is exceptionally malleable and can be beaten into sheets ~100 nm thin (~1000 atoms thick), guaranteeing single scattering events. Light metals cannot be made as thin without tearing, causing multiple scattering that muddles the nuclear signature.</p>", "verified": "Light nuclei (Al, Z=13) produce much weaker deflections and negligible back-scattering compared to gold (Z=79)"}, {"num": "2.41", "title": "Acceptable isotope notation: 79_35Br vs 35_79Br", "question": "Symbols ⁷⁹₃₅Br and ⁷⁹Br can be written, whereas symbols ³⁵₇₉Br and ³⁵Br are not acceptable. Answer briefly.", "approach": "By IUPAC convention, mass number A is superscript and atomic number Z is subscript. Since Z defines element identity, it is redundant, but mass number distinguishes isotopes.", "solution": "<p>By IUPAC convention for nuclide representation ᴬ_Z X:</p><p>1. <strong>Superscript</strong> denotes Mass Number A (total nucleons = protons + neutrons). <strong>Subscript</strong> denotes Atomic Number Z (protons).</p><p>2. The chemical symbol 'Br' uniquely and permanently defines atomic number Z = 35 (no other element has 35 protons). Therefore, writing ⁷⁹Br without subscript is unambiguous.</p><p>3. However, ³⁵Br would imply an atom of mass number 35, which is physically false for bromine (bromine has mass numbers 79 and 81). Writing atomic number as superscript (³⁵₇₉Br) violates IUPAC convention.</p>", "verified": "Mass number A must be superscript; Z is subscript and uniquely implied by element symbol"}, {"num": "2.42", "title": "Element with mass number 81 and 31.7% more neutrons than protons", "question": "An element with mass number 81 contains 31.7% more neutrons as compared to protons. Assign the atomic symbol.", "approach": "Let number of protons = p. Neutrons n = p + 0.317p = 1.317p. Solve p + n = 81.", "solution": "<p>Let number of protons = p.</p><p>Number of neutrons n = p + 0.317 p = 1.317 p.</p><p>Mass number A = p + n = 81 => p + 1.317 p = 81</p><p>2.317 p = 81 => p = 81 / 2.317 = 34.959 ≈ <strong>35</strong>.</p><p>Atomic number Z = 35 corresponds to <strong>Bromine (Br)</strong>.</p><p>Number of neutrons n = 81 − 35 = 46. (Check: 46 / 35 = 1.314 ≈ 31.7% excess).</p><p>The complete symbol is <strong>⁸¹₃₅Br</strong>.</p>", "verified": "⁸¹₃₅Br (Z = 35, Bromine)"}, {"num": "2.43", "title": "Ion with mass number 37, charge −1, 11.1% more neutrons than electrons", "question": "An ion with mass number 37 possesses one unit of negative charge. If the ion contains 11.1% more neutrons than the electrons, find the symbol of the ion.", "approach": "For ion X⁻: electrons e = p + 1. Neutrons n = e + 0.111e = 1.111(p + 1). Solve p + n = 37.", "solution": "<p>Let number of protons in ion = p.</p><p>Because the ion carries a single negative charge (−1), number of electrons e = p + 1.</p><p>Number of neutrons n = e + 0.111 e = 1.111 e = 1.111 (p + 1).</p><p>Mass number A = p + n = 37 => p + 1.111 (p + 1) = 37</p><p>p + 1.111 p + 1.111 = 37 => 2.111 p = 35.889 => p = 35.889 / 2.111 = <strong>17</strong>.</p><p>Atomic number Z = 17 corresponds to <strong>Chlorine (Cl)</strong>.</p><p>Electrons e = 17 + 1 = 18. Neutrons n = 37 − 17 = 20. (Check: 20 / 18 = 1.111, exactly 11.1% more).</p><p>The symbol of the ion is <strong>³⁷₁₇Cl⁻</strong>.</p>", "verified": "³⁷₁₇Cl⁻ (Chloride ion)"}, {"num": "2.44", "title": "Ion with mass number 56, charge +3, 30.4% more neutrons than electrons", "question": "An ion with mass number 56 contains 3 units of positive charge and 30.4% more neutrons than electrons. Assign the symbol to this ion.", "approach": "For M³⁺: electrons e = p − 3. Neutrons n = 1.304 e = 1.304(p − 3). Solve p + n = 56.", "solution": "<p>Let number of protons = p.</p><p>Because the ion carries +3 charge, electrons e = p − 3.</p><p>Number of neutrons n = e + 0.304 e = 1.304 e = 1.304 (p − 3).</p><p>Mass number A = p + n = 56 => p + 1.304 (p − 3) = 56</p><p>p + 1.304 p − 3.912 = 56 => 2.304 p = 59.912 => p = 59.912 / 2.304 = <strong>26</strong>.</p><p>Atomic number Z = 26 corresponds to <strong>Iron (Fe)</strong>.</p><p>Electrons e = 26 − 3 = 23. Neutrons n = 56 − 26 = 30. (Check: 30 / 23 = 1.304, exactly 30.4% more).</p><p>The symbol of the ion is <strong>⁵⁶₂₆Fe³⁺</strong>.</p>", "verified": "⁵⁶₂₆Fe³⁺ (Ferric ion)"}, {"num": "2.45", "title": "Arrange electromagnetic radiations in increasing order of frequency", "question": "Arrange the following type of radiations in increasing order of frequency: (a) radiation from microwave oven, (b) amber light from traffic signal, (c) radiation from FM radio, (d) cosmic rays, (e) X-rays.", "approach": "Order follows the electromagnetic spectrum: Radio < Microwave < Infrared < Visible < Ultraviolet < X-rays < Gamma/Cosmic rays.", "solution": "<p>Typical frequency ranges across the electromagnetic spectrum:</p><ul><li>(c) <strong>FM radio:</strong> ~10⁸ Hz (100 MHz, VHF radio)</li><li>(a) <strong>Microwave oven:</strong> ~2.45 × 10⁹ Hz (2.45 GHz)</li><li>(b) <strong>Amber light:</strong> ~5.0 × 10¹⁴ Hz (λ ~ 600 nm, visible spectrum)</li><li>(e) <strong>X-rays:</strong> ~10¹⁶ to 10¹⁹ Hz</li><li>(d) <strong>Cosmic rays:</strong> &gt;10²¹ Hz (highest frequency, shortest wavelength)</li></ul><p>Increasing frequency order:</p><p><strong>(c) FM radio &lt; (a) Microwave &lt; (b) Amber light &lt; (e) X-rays &lt; (d) Cosmic rays</strong>.</p>", "verified": "FM radio < Microwave < Amber light < X-rays < Cosmic rays"}, {"num": "2.46", "title": "Energy emitted by nitrogen laser at 337.1 nm with 5.6 × 10²⁴ photons", "question": "Nitrogen laser produces a radiation at a wavelength of 337.1 nm. If the number of photons emitted is 5.6 × 10²⁴, calculate the power/energy of this laser.", "approach": "Total energy E_total = N · (hc / λ).", "solution": "<p>Given: λ = 337.1 nm = 3.371 × 10⁻⁷ m, N = 5.6 × 10²⁴ photons.</p><p>Energy of one photon:</p><p>E_photon = hc / λ = (6.626 × 10⁻³⁴ J s × 3.0 × 10⁸ m s⁻¹) / (3.371 × 10⁻⁷ m) = 5.897 × 10⁻¹⁹ J.</p><p>Total energy emitted by 5.6 × 10²⁴ photons:</p><p>E_total = N × E_photon = (5.6 × 10²⁴) × (5.897 × 10⁻¹⁹ J) = <strong>3.302 × 10⁶ J = 3.30 MJ</strong>.</p>", "verified": "3.30 × 10⁶ J (3.30 MJ)"}, {"num": "2.47", "title": "Neon signboard emission at 616 nm calculations", "question": "Neon gas is generally used in the sign boards. If it emits strongly at 616 nm, calculate (a) the frequency of emission, (b) distance traveled by this radiation in 30 s, (c) energy of quantum and (d) number of quanta present if it produces 2 J of energy.", "approach": "Use ν = c/λ, d = c·t, E = hν, and N = E_total / E_quantum.", "solution": "<p>Given: λ = 616 nm = 6.16 × 10⁻⁷ m.</p><p><strong>(a) Frequency of emission (ν):</strong></p><p>ν = c / λ = (3.0 × 10⁸ m s⁻¹) / (6.16 × 10⁻⁷ m) = <strong>4.870 × 10¹⁴ s⁻¹ (Hz)</strong>.</p><p><strong>(b) Distance traveled in 30 s:</strong></p><p>d = c × t = (3.0 × 10⁸ m s⁻¹) × (30 s) = <strong>9.0 × 10⁹ m = 9.0 × 10⁶ km</strong>.</p><p><strong>(c) Energy of one quantum:</strong></p><p>E = h ν = (6.626 × 10⁻³⁴ J s) × (4.870 × 10¹⁴ s⁻¹) = <strong>3.227 × 10⁻¹⁹ J</strong> (2.01 eV).</p><p><strong>(d) Number of quanta in 2 J:</strong></p><p>N = (2.0 J) / (3.227 × 10⁻¹⁹ J) = <strong>6.198 × 10¹⁸ quanta</strong>.</p>", "verified": "(a) 4.87 × 10¹⁴ Hz; (b) 9.0 × 10⁹ m; (c) 3.23 × 10⁻¹⁹ J; (d) 6.20 × 10¹⁸ quanta"}, {"num": "2.48", "title": "Number of photons received by astronomical detector from 600 nm light", "question": "In astronomical observations, signals observed from the distant stars are generally weak. If the photon detector receives a total of 3.15 × 10⁻¹⁸ J from the radiations of 600 nm, calculate the number of photons received by the detector.", "approach": "Energy of one 600 nm photon E = hc/λ. Number of photons = E_total / E_photon.", "solution": "<p>Given: Total received energy E_total = 3.15 × 10⁻¹⁸ J, λ = 600 nm = 6.0 × 10⁻⁷ m.</p><p>Energy of a single photon:</p><p>E_photon = hc / λ = (6.626 × 10⁻³⁴ × 3.0 × 10⁸) / (6.0 × 10⁻⁷) = 3.313 × 10⁻¹⁹ J.</p><p>Number of photons received:</p><p>N = E_total / E_photon = (3.15 × 10⁻¹⁸ J) / (3.313 × 10⁻¹⁹ J) = 9.508 ≈ <strong>10 photons</strong>.</p>", "verified": "10 photons (9.51 photons)"}, {"num": "2.49", "title": "Photons emitted by pulsed source during 2.5 ns", "question": "Lifetimes of the molecules in the excited states are often measured by using pulsed radiation source of duration nearly in the nano second range. If the radiation source has the duration of 2.0 ns and the number of photons emitted during the pulse source is 2.5 × 10¹⁵, calculate the energy of the source.", "approach": "If wavelength λ is taken as typical visible (or rate is measured), calculate energy per pulse: E_total = N · hν.", "solution": "<p>Given: Pulse duration Δt = 2.0 ns = 2.0 × 10⁻⁹ s; Number of photons N = 2.5 × 10¹⁵.</p><p>Frequency or energy of source: If frequency ν is specified or if light is visible (say average 500 nm, E_photon ≈ 4.0 × 10⁻¹⁹ J), total pulse energy is:</p><p>Rate of photon emission = N / Δt = (2.5 × 10¹⁵) / (2.0 × 10⁻⁹ s) = 1.25 × 10²⁴ photons s⁻¹.</p>", "verified": "1.25 × 10²⁴ photons s⁻¹; pulse energy scales with hν"}, {"num": "2.50", "title": "Frequencies of the sodium doublet at 589 nm and 589.6 nm", "question": "The longest wavelength doublet absorption transition is observed at 589.0 and 589.6 nm. Calculate the frequency of each transition and energy difference between two excited states.", "approach": "Calculate ν₁ = c/λ₁, ν₂ = c/λ₂, and energy difference ΔE = h(ν₁ − ν₂).", "solution": "<p>Given: λ₁ = 589.0 nm = 5.890 × 10⁻⁷ m; λ₂ = 589.6 nm = 5.896 × 10⁻⁷ m.</p><p><strong>1. Frequencies:</strong></p><p>ν₁ = c / λ₁ = (3.0 × 10⁸) / (5.890 × 10⁻⁷) = <strong>5.0934 × 10¹⁴ s⁻¹ (Hz)</strong>.</p><p>ν₂ = c / λ₂ = (3.0 × 10⁸) / (5.896 × 10⁻⁷) = <strong>5.0882 × 10¹⁴ s⁻¹ (Hz)</strong>.</p><p><strong>2. Frequency difference:</strong></p><p>Δν = ν₁ − ν₂ = (5.0934 − 5.0882) × 10¹⁴ = <strong>5.2 × 10¹¹ s⁻¹</strong>.</p><p><strong>3. Energy difference (spin-orbit doublet splitting):</strong></p><p>ΔE = h Δν = (6.626 × 10⁻³⁴ J s) × (5.2 × 10¹¹ s⁻¹) = <strong>3.445 × 10⁻²² J = 2.15 × 10⁻³ eV</strong>.</p>", "verified": "ν₁ = 5.093 × 10¹⁴ Hz, ν₂ = 5.088 × 10¹⁴ Hz; ΔE = 3.45 × 10⁻²² J (2.15 meV)"}, {"num": "2.51", "title": "Caesium threshold wavelength, frequency and photoelectron velocity", "question": "The work function for caesium atom is 1.9 eV. Calculate (a) the threshold wavelength and (b) the threshold frequency of the radiation. If the caesium element is irradiated with a wavelength 500 nm, calculate the kinetic energy and the velocity of the ejected photoelectron.", "approach": "Convert W₀ to Joules. λ₀ = hc/W₀, ν₀ = W₀/h. For 500 nm: E = hc/λ, K_max = E − W₀, v = √(2K/m_e).", "solution": "<p>Given: Work function W₀ = 1.9 eV = 1.9 × 1.602 × 10⁻¹⁹ J = 3.044 × 10⁻¹⁹ J.</p><p><strong>(a) Threshold wavelength (λ₀):</strong></p><p>λ₀ = hc / W₀ = (6.626 × 10⁻³⁴ × 3.0 × 10⁸) / (3.044 × 10⁻¹⁹) = <strong>6.53 × 10⁻⁷ m = 653 nm (6530 Å)</strong>.</p><p><strong>(b) Threshold frequency (ν₀):</strong></p><p>ν₀ = c / λ₀ = (3.0 × 10⁸) / (6.53 × 10⁻⁷) = <strong>4.594 × 10¹⁴ s⁻¹ (Hz)</strong>.</p><p><strong>(c) Kinetic energy when irradiated with 500 nm:</strong></p><p>E = hc / λ = (6.626 × 10⁻³⁴ × 3.0 × 10⁸) / (5.0 × 10⁻⁷) = 3.9756 × 10⁻¹⁹ J = 2.482 eV.</p><p>K_max = E − W₀ = 3.9756 × 10⁻¹⁹ − 3.044 × 10⁻¹⁹ = <strong>9.316 × 10⁻²⁰ J = 0.582 eV</strong>.</p><p><strong>(d) Velocity of ejected photoelectron:</strong></p><p>v = √(2 K_max / m_e) = √[(2 × 9.316 × 10⁻²⁰) / (9.109 × 10⁻³¹)] = <strong>4.523 × 10⁵ m s⁻¹</strong>.</p>", "verified": "λ₀ = 653 nm, ν₀ = 4.59 × 10¹⁴ Hz, K_max = 9.32 × 10⁻²⁰ J (0.58 eV), v = 4.52 × 10⁵ m s⁻¹"}, {"num": "2.52", "title": "Threshold wavelength and Planck constant from sodium photoelectric data", "question": "Following results are observed when sodium metal is irradiated with different wavelengths: λ (nm) = 500, 450, 400; v × 10⁻⁵ (m/s) = 2.55, 4.35, 5.35. Calculate (a) threshold wavelength, and (b) Planck's constant.", "approach": "Use Einstein relation hc/λ = W₀ + 1/2 m v². Subtract pairs of equations to isolate h, then solve for λ₀.", "solution": "<p>The Einstein photoelectric equation gives: hc / λ = W₀ + 1/2 m_e v².</p><p>For two wavelengths λ₁ and λ₂:</p><p>hc (1/λ₁ − 1/λ₂) = 1/2 m_e (v₁² − v₂²)</p><p>Using λ₁ = 400 nm (v₁ = 5.35 × 10⁵ m/s) and λ₂ = 500 nm (v₂ = 2.55 × 10⁵ m/s):</p><p>1/2 m_e (v₁² − v₂²) = 0.5 × 9.109 × 10⁻³¹ × [(5.35)² − (2.55)²] × 10¹⁰ = 0.5 × 9.109 × 10⁻²¹ × (28.6225 − 6.5025) = 1.007 × 10⁻¹⁹ J.</p><p>c (1/λ₁ − 1/λ₂) = 3.0 × 10⁸ × (2.5 × 10⁶ − 2.0 × 10⁶) = 3.0 × 10⁸ × 5.0 × 10⁵ = 1.5 × 10¹⁴ s⁻¹.</p><p><strong>(b) Planck's constant:</strong> h = (1.007 × 10⁻¹⁹ J) / (1.5 × 10¹⁴ s⁻¹) = <strong>6.71 × 10⁻³⁴ J s</strong> (within 1.3% of accepted 6.626 × 10⁻³⁴).</p><p><strong>(a) Threshold wavelength λ₀:</strong></p><p>W₀ = hc/λ₁ − 1/2 m v₁² = 5.03 × 10⁻¹⁹ − 1.30 × 10⁻¹⁹ = 3.73 × 10⁻¹⁹ J.</p><p>λ₀ = hc / W₀ = (6.63 × 10⁻³⁴ × 3.0 × 10⁸) / (3.73 × 10⁻¹⁹) = <strong>5.33 × 10⁻⁷ m = 533 nm (5330 Å)</strong>.</p>", "verified": "λ₀ ≈ 533 nm; h ≈ 6.7 × 10⁻³⁴ J s"}, {"num": "2.53", "title": "Work function of silver from stopping potential 0.35 V at 256 nm", "question": "The ejection of the photoelectron from the silver metal in the photoelectric effect experiment can be stopped by applying the voltage of 0.35 V when the radiation 256 nm is used. Calculate the work function for silver metal.", "approach": "Stopping potential gives maximum kinetic energy: K_max = eV₀ = 0.35 eV. Work function W₀ = E − K_max = hc/λ − eV₀.", "solution": "<p>Given: λ = 256 nm = 2.56 × 10⁻⁷ m, V₀ = 0.35 V => K_max = 0.35 eV = 0.35 × 1.602 × 10⁻¹⁹ J = 5.607 × 10⁻²⁰ J.</p><p>Energy of incident photon:</p><p>E = hc / λ = (6.626 × 10⁻³⁴ J s × 3.0 × 10⁸ m s⁻¹) / (2.56 × 10⁻⁷ m) = 7.765 × 10⁻¹⁹ J.</p><p>In eV: E = (7.765 × 10⁻¹⁹ J) / (1.602 × 10⁻¹⁹ J eV⁻¹) = 4.847 eV.</p><p>Work function W₀ = E − eV₀ = 4.847 eV − 0.350 eV = <strong>4.497 eV ≈ 4.50 eV</strong>.</p><p>In Joules: W₀ = 4.497 × 1.602 × 10⁻¹⁹ J = <strong>7.204 × 10⁻¹⁹ J</strong>.</p>", "verified": "W₀ = 4.50 eV (7.20 × 10⁻¹⁹ J)"}, {"num": "2.54", "title": "Binding energy of inner electron ejected by 150 pm photon at 1.5 × 10⁷ m/s", "question": "If the photon of the wavelength 150 pm strikes an atom and one of its inner bound electrons is ejected out with a velocity of 1.5 × 10⁷ m s⁻¹, calculate the energy with which it is bound to the nucleus.", "approach": "Energy conservation: E_photon = Binding Energy (B.E.) + Kinetic Energy (K). Thus B.E. = hc/λ − 1/2 m_e v².", "solution": "<p>Given: λ = 150 pm = 1.50 × 10⁻¹⁰ m; v = 1.5 × 10⁷ m s⁻¹.</p><p><strong>1. Energy of incident X-ray photon:</strong></p><p>E_photon = hc / λ = (6.626 × 10⁻³⁴ × 3.0 × 10⁸) / (1.50 × 10⁻¹⁰) = <strong>1.3252 × 10⁻¹⁵ J</strong> (8.27 keV).</p><p><strong>2. Kinetic energy of ejected electron:</strong></p><p>K = 1/2 m_e v² = 0.5 × (9.109 × 10⁻³¹ kg) × (1.5 × 10⁷ m s⁻¹)² = 0.5 × 9.109 × 10⁻³¹ × 2.25 × 10¹⁴ = <strong>1.0248 × 10⁻¹⁶ J</strong> (0.64 keV).</p><p><strong>3. Binding energy:</strong></p><p>B.E. = E_photon − K = 1.3252 × 10⁻¹⁵ J − 0.1025 × 10⁻¹⁵ J = <strong>1.2227 × 10⁻¹⁵ J = 7.63 keV</strong>.</p>", "verified": "1.22 × 10⁻¹⁵ J (7.63 keV)"}, {"num": "2.55", "title": "Paschen series emission lines and spectral region", "question": "Emission transitions in the Paschen series end at orbit n = 3 and start from orbit n and can be represented as ν = 3.29 × 10¹⁵ (1/3² − 1/n²) Hz. Calculate the value of n if the transition is observed at 1285 nm. Find the region of the spectrum.", "approach": "Convert λ = 1285 nm to frequency ν = c/λ, substitute into the Paschen formula and solve for integer n.", "solution": "<p>Given: λ = 1285 nm = 1.285 × 10⁻⁶ m.</p><p>Frequency ν = c / λ = (3.0 × 10⁸ m s⁻¹) / (1.285 × 10⁻⁶ m) = 2.3346 × 10¹⁴ s⁻¹ (Hz).</p><p>Equate to Paschen equation:</p><p>2.3346 × 10¹⁴ = 3.29 × 10¹⁵ × (1/9 − 1/n²)</p><p>1/9 − 1/n² = (2.3346 × 10¹⁴) / (3.29 × 10¹⁵) = 0.07096</p><p>1/n² = 0.11111 − 0.07096 = 0.04015 => n² = 1 / 0.04015 = 24.90 ≈ <strong>25</strong>.</p><p>Therefore, <strong>n = 5</strong>.</p><p>Since 1285 nm is longer than visible red (~750 nm), this radiation lies in the <strong>Infrared (IR) region</strong>.</p>", "verified": "n = 5 (transition 5 → 3); Infrared (IR) region"}, {"num": "2.56", "title": "Wavelength of transition starting from radius 1.3225 nm and ending at 211.6 pm", "question": "Calculate the wavelength for the emission transition if it starts from the orbit having radius 1.3225 nm and ends at 211.6 pm. Name the series to which this transition belongs and the region of the spectrum.", "approach": "For hydrogen, r_n = 52.9 n² pm. Find initial and final orbit numbers n_i and n_f, then calculate λ.", "solution": "<p>Radius formula for hydrogen orbit: r_n = a₀ · n² = 52.9 n² pm = 0.0529 n² nm.</p><p><strong>1. Initial state (n_i):</strong> r_i = 1.3225 nm => n_i² = 1.3225 / 0.0529 = 25 => <strong>n_i = 5</strong>.</p><p><strong>2. Final state (n_f):</strong> r_f = 211.6 pm = 0.2116 nm => n_f² = 0.2116 / 0.0529 = 4 => <strong>n_f = 2</strong>.</p><p><strong>3. Transition n = 5 → 2:</strong> Ends at n = 2, so it belongs to the <strong>Balmer series</strong>.</p><p>Wavenumber ν̄ = R_H (1/2² − 1/5²) = 1.09677 × 10⁷ × (1/4 − 1/25) = 1.09677 × 10⁷ × (21/100) = 2.3032 × 10⁶ m⁻¹.</p><p>Wavelength λ = 1 / ν̄ = 1 / (2.3032 × 10⁶ m⁻¹) = 4.341 × 10⁻⁷ m = <strong>434.1 nm (visible blue-violet H_γ line)</strong>.</p>", "verified": "λ = 434.1 nm; Balmer series; Visible region"}, {"num": "2.57", "title": "de Broglie wavelength of electron accelerated to 1.6 × 10⁶ m/s in TEM", "question": "Dual behaviour of matter proposed by de Broglie led to the discovery of electron microscope often used for the highly magnified images of biological molecules and other type of material. If the velocity of the electron in this microscope is 1.6 × 10⁶ m s⁻¹, calculate de Broglie wavelength associated with this electron.", "approach": "Apply de Broglie relation λ = h / (m_e · v).", "solution": "<p>Given: v = 1.6 × 10⁶ m s⁻¹, m_e = 9.10938 × 10⁻³¹ kg.</p><p>λ = h / (m_e · v) = (6.626 × 10⁻³⁴ kg m² s⁻¹) / (9.109 × 10⁻³¹ kg × 1.6 × 10⁶ m s⁻¹)</p><p>λ = (6.626 × 10⁻³⁴) / (1.457 × 10⁻²⁴) = <strong>4.546 × 10⁻¹⁰ m = 0.455 nm = 4.55 Å</strong>.</p>", "verified": "4.55 × 10⁻¹⁰ m (0.455 nm = 4.55 Å)"}, {"num": "2.58", "title": "de Broglie wavelength of neutron at 1.4 × 10³ m/s", "question": "Similar to electron diffraction, neutron diffraction microscope is also used for the determination of the structure of molecules. If the wavelength associated with a neutron is to be calculated when its velocity is 1.4 × 10³ m s⁻¹, calculate its de Broglie wavelength (m_n = 1.675 × 10⁻²⁷ kg).", "approach": "Apply de Broglie relation with neutron mass: λ = h / (m_n · v).", "solution": "<p>Given: m_n = 1.675 × 10⁻²⁷ kg, v = 1.4 × 10³ m s⁻¹.</p><p>λ = h / (m_n · v) = (6.626 × 10⁻³⁴ kg m² s⁻¹) / (1.675 × 10⁻²⁷ kg × 1.4 × 10³ m s⁻¹)</p><p>λ = (6.626 × 10⁻³⁴) / (2.345 × 10⁻²⁴) = <strong>2.825 × 10⁻¹⁰ m = 0.283 nm = 2.83 Å</strong>.</p><p>Because 2.8 Å matches interatomic spacings in crystals, thermal neutrons exhibit brilliant lattice diffraction.</p>", "verified": "2.83 × 10⁻¹⁰ m (0.283 nm = 2.83 Å)"}, {"num": "2.59", "title": "de Broglie wavelength of electron in Bohr first orbit (v = 2.19 × 10⁶ m/s)", "question": "If the velocity of the electron in Bohr's first orbit is 2.19 × 10⁶ m s⁻¹, calculate the de Broglie wavelength associated with it.", "approach": "Apply λ = h / (m_e · v) and compare with the circumference of the first Bohr orbit (2π a₀).", "solution": "<p>Given: v = 2.19 × 10⁶ m s⁻¹, m_e = 9.109 × 10⁻³¹ kg.</p><p>λ = h / (m_e · v) = (6.626 × 10⁻³⁴) / (9.109 × 10⁻³¹ × 2.19 × 10⁶) = <strong>3.321 × 10⁻¹⁰ m = 0.332 nm = 3.32 Å</strong>.</p><p><strong>Fascinating insight:</strong> The circumference of the first Bohr orbit is 2π r₁ = 2 × 3.1416 × 0.529 Å = <strong>3.324 Å</strong>.</p><p>The de Broglie wavelength exactly equals the circumference: 2π r₁ = 1 · λ, proving the orbit is a resonant standing matter wave!</p>", "verified": "3.32 × 10⁻¹⁰ m (0.332 nm = 3.32 Å, exactly 1 circumference)"}, {"num": "2.60", "title": "de Broglie wavelength of proton at 4.37 × 10⁵ m/s vs 0.1 kg ball", "question": "The velocity associated with a proton moving in a potential difference of 1000 V is 4.37 × 10⁵ m s⁻¹. If a hockey ball of mass 0.1 kg is moving with this velocity, calculate the wavelength associated with it.", "approach": "Apply de Broglie relation λ = h / (m · v) for both proton (m = 1.673 × 10⁻²⁷ kg) and ball (m = 0.1 kg).", "solution": "<p><strong>1. For the proton (m_p = 1.673 × 10⁻²⁷ kg):</strong></p><p>λ_p = h / (m_p · v) = (6.626 × 10⁻³⁴) / (1.673 × 10⁻²⁷ × 4.37 × 10⁵) = <strong>9.065 × 10⁻¹³ m = 0.907 pm</strong> (picometre scale).</p><p><strong>2. For the 0.1 kg hockey ball:</strong></p><p>λ_ball = h / (m · v) = (6.626 × 10⁻³⁴) / (0.1 kg × 4.37 × 10⁵ m s⁻¹) = <strong>1.516 × 10⁻³⁸ m</strong>.</p><p>This wavelength (10⁻³⁸ m) is many orders of magnitude smaller than atomic nuclei, making wave properties completely unmeasurable for macroscopic bodies.</p>", "verified": "Proton: 9.07 × 10⁻¹³ m; Hockey ball: 1.52 × 10⁻³⁸ m"}, {"num": "2.61", "title": "Heisenberg uncertainty for electron position measured to 0.002 nm", "question": "If the position of the electron is measured within an accuracy of ±0.002 nm, calculate the uncertainty in the momentum of the electron. Suppose the momentum of the electron is h / (4πm × 0.05 nm), is there any problem in defining this value?", "approach": "Apply Heisenberg Uncertainty Principle Δx · Δp ≥ h / (4π), where Δx = 0.002 nm = 2 × 10⁻¹² m.", "solution": "<p>Given: Position uncertainty Δx = 0.002 nm = 2.0 × 10⁻¹² m.</p><p><strong>1. Minimum momentum uncertainty:</strong></p><p>Δp ≥ h / (4π Δx) = (6.626 × 10⁻³⁴ J s) / (4 × 3.14159 × 2.0 × 10⁻¹² m) = <strong>2.636 × 10⁻²³ kg m s⁻¹</strong>.</p><p><strong>2. Uncertainty in velocity:</strong></p><p>Δv = Δp / m_e = (2.636 × 10⁻²³) / (9.109 × 10⁻³¹ kg) = <strong>2.894 × 10⁷ m s⁻¹</strong> (~10% of light speed!).</p><p><strong>3. Physical implication:</strong></p><p>The actual momentum p = h / (4π · 0.05 nm) = (6.626 × 10⁻³⁴) / (4π × 5 × 10⁻¹¹) = 1.055 × 10⁻²⁴ kg m s⁻¹.</p><p>Here the uncertainty Δp (2.64 × 10⁻²³) is ~25 times LARGER than the momentum itself! Defining a precise classical trajectory or momentum is completely physically meaningless when the uncertainty dominates the value.</p>", "verified": "Δp ≥ 2.64 × 10⁻²³ kg m s⁻¹; Δv ≈ 2.89 × 10⁷ m s⁻¹ (uncertainty exceeds momentum itself)"}, {"num": "2.62", "title": "Arrange six electron quantum states in increasing energy", "question": "The quantum numbers of six electrons are given below. Arrange them in order of increasing energies. If any of these combination(s) has/have the same energy lists:\n1. n = 4, l = 2, m_l = −2, m_s = −½\n2. n = 3, l = 2, m_l = 1, m_s = +½\n3. n = 4, l = 1, m_l = 0, m_s = +½\n4. n = 3, l = 2, m_l = −2, m_s = −½\n5. n = 3, l = 1, m_l = −1, m_s = +½\n6. n = 4, l = 1, m_l = 0, m_s = +½", "approach": "Use the (n + l) rule: Lower (n + l) has lower energy; for equal (n + l), lower n has lower energy.", "solution": "<p>Calculate (n + l) and orbital designation for each electron:</p><ol><li>n = 4, l = 2 (<strong>4d</strong>): n + l = 4 + 2 = <strong>6</strong></li><li>n = 3, l = 2 (<strong>3d</strong>): n + l = 3 + 2 = <strong>5</strong></li><li>n = 4, l = 1 (<strong>4p</strong>): n + l = 4 + 1 = <strong>5</strong></li><li>n = 3, l = 2 (<strong>3d</strong>): n + l = 3 + 2 = <strong>5</strong></li><li>n = 3, l = 1 (<strong>3p</strong>): n + l = 3 + 1 = <strong>4</strong></li><li>n = 4, l = 1 (<strong>4p</strong>): n + l = 4 + 1 = <strong>5</strong></li></ol><p>Ranking energies:</p><ul><li>Lowest (n+l = 4): <strong>Electron 5 (3p)</strong>.</li><li>Next (n+l = 5, n = 3): <strong>Electrons 2 and 4 (3d)</strong> have identical degenerate energy.</li><li>Next (n+l = 5, n = 4): <strong>Electrons 3 and 6 (4p)</strong> have identical degenerate energy.</li><li>Highest (n+l = 6, n = 4): <strong>Electron 1 (4d)</strong>.</li></ul><p>Energy order: <strong>5 (3p) &lt; 2 = 4 (3d) &lt; 3 = 6 (4p) &lt; 1 (4d)</strong>.</p>", "verified": "5 < (2 = 4) < (3 = 6) < 1; (i.e. 3p < 3d < 4p < 4d)"}, {"num": "2.63", "title": "Lowest effective nuclear charge among 2p, 3p, 4p in Bromine", "question": "The bromine atom possesses 35 electrons. It contains 6 electrons in 2p orbital, 6 electrons in 3p orbital and 5 electrons in 4p orbital. Which of these electrons experiences the lowest effective nuclear charge?", "approach": "Effective nuclear charge Z_eff = Z − σ. Outermost electrons experience shielding from all inner core shells.", "solution": "<p>Bromine (Z = 35) has electronic configuration: 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s² 4p⁵.</p><p>1. <strong>2p electrons</strong> are shielded only by the inner 1s² core electrons (σ is small, Z_eff is high).</p><p>2. <strong>3p electrons</strong> are shielded by 1s, 2s, 2p shells.</p><p>3. <strong>4p electrons</strong> are in the outermost valence shell (n = 4) and are extensively shielded from the +35 nuclear charge by all 28 core electrons (1s², 2s², 2p⁶, 3s², 3p⁶, 3d¹⁰).</p><p>Therefore, the <strong>4p electrons</strong> experience the <strong>lowest effective nuclear charge (Z_eff)</strong>.</p>", "verified": "4p electrons (shielded by all inner core electrons in shells 1, 2, and 3)"}, {"num": "2.64", "title": "Orbital pairs experiencing larger effective nuclear charge", "question": "Among the following pairs of orbitals, which orbital will experience the larger effective nuclear charge?\n(i) 2s and 3s, (ii) 4d and 4f, (iii) 3d and 3p.", "approach": "Lower principal quantum number n penetrates closer to nucleus; within the same shell, penetration order is s > p > d > f.", "solution": "<ul><li><strong>(i) 2s and 3s:</strong> 2s is closer to the nucleus (n = 2 vs n = 3) and shielded only by 1s, so <strong>2s</strong> experiences larger Z_eff.</li><li><strong>(ii) 4d and 4f:</strong> Within the n = 4 shell, d orbitals penetrate closer to the nucleus than f orbitals (shielding f > d), so <strong>4d</strong> experiences larger Z_eff.</li><li><strong>(iii) 3d and 3p:</strong> Within the n = 3 shell, p orbitals penetrate closer to the nucleus than d orbitals (shielding order s > p > d), so <strong>3p</strong> experiences larger Z_eff.</li></ul>", "verified": "(i) 2s; (ii) 4d; (iii) 3p (due to greater radial penetration and lower shielding)"}, {"num": "2.65", "title": "Effective nuclear charge on 3p electron in Al vs Si", "question": "The unpaired electrons in Al and Si are present in 3p orbital. Which electrons will experience more effective nuclear charge from the nucleus?", "approach": "Aluminum (Z = 13) and Silicon (Z = 14) have the same inner core [Ne] 3s². Increased nuclear charge increases Z_eff.", "solution": "<p>Electronic configurations:</p><ul><li>Aluminum (Z = 13): 1s² 2s² 2p⁶ 3s² 3p¹ ([Ne] 3s² 3p¹)</li><li>Silicon (Z = 14): 1s² 2s² 2p⁶ 3s² 3p² ([Ne] 3s² 3p²)</li></ul><p>Both elements have the same core electron screening [Ne] 3s². However, Silicon has <strong>14 positive protons</strong> in its nucleus compared to only 13 protons in Aluminum.</p><p>Electrons in the same subshell (3p) shield each other very poorly (Slater screening factor ~0.35). Consequently, the additional nuclear charge (+1) in Silicon is not completely shielded, causing the <strong>3p electrons in Silicon (Si)</strong> to experience a <strong>higher effective nuclear charge</strong>.</p>", "verified": "Silicon (Si) 3p electrons (higher nuclear charge Z = 14 with similar screening)"}, {"num": "2.66", "title": "Number of unpaired electrons in P, Si, Cr, Fe, and Kr", "question": "Indicate the number of unpaired electrons in: (a) P, (b) Si, (c) Cr, (d) Fe, and (e) Kr.", "approach": "Write ground-state configurations and apply Hund's rule to count unpaired spins.", "solution": "<ul><li><strong>(a) Phosphorus (P, Z = 15):</strong> [Ne] 3s² 3p³ => By Hund's rule, three electrons singly occupy 3p_x, 3p_y, 3p_z: <strong>3 unpaired electrons</strong>.</li><li><strong>(b) Silicon (Si, Z = 14):</strong> [Ne] 3s² 3p² => Two electrons singly occupy 3p_x, 3p_y: <strong>2 unpaired electrons</strong>.</li><li><strong>(c) Chromium (Cr, Z = 24):</strong> [Ar] 3d⁵ 4s¹ => Half-filled 3d (5 unpaired) + half-filled 4s (1 unpaired): <strong>6 unpaired electrons</strong>.</li><li><strong>(d) Iron (Fe, Z = 26):</strong> [Ar] 3d⁶ 4s² => In 3d, one pair and four single electrons: <strong>4 unpaired electrons</strong>.</li><li><strong>(e) Krypton (Kr, Z = 36):</strong> [Ar] 3d¹⁰ 4s² 4p⁶ => Completely filled shells (noble gas): <strong>0 unpaired electrons</strong>.</li></ul>", "verified": "(a) P: 3; (b) Si: 2; (c) Cr: 6; (d) Fe: 4; (e) Kr: 0"}, {"num": "2.67", "title": "Subshells in n = 4 and electrons with ms = −1/2", "question": "(a) How many subshells are associated with n = 4?\n(b) How many electrons will be present in the subshells having m_s value of −½ for n = 4?", "approach": "For shell n: number of subshells equals n (l = 0 to n−1). Total orbitals equals n², each holding one electron with m_s = −½.", "solution": "<p><strong>(a) Subshells associated with n = 4:</strong></p><p>The azimuthal quantum number l takes values from 0 up to n − 1: l = 0 (4s), 1 (4p), 2 (4d), 3 (4f).</p><p>Thus, there are exactly <strong>4 subshells</strong>.</p><p><strong>(b) Electrons with m_s = −½ for n = 4:</strong></p><p>Total number of orbitals in shell n = 4 is n² = 4² = <strong>16 orbitals</strong> (1 in 4s, 3 in 4p, 5 in 4d, 7 in 4f; 1 + 3 + 5 + 7 = 16).</p><p>By the Pauli Exclusion Principle, each orbital accommodates at most 2 electrons with opposite spins (+½ and −½).</p><p>Therefore, exactly one electron per orbital has m_s = −½, yielding <strong>16 electrons</strong>.</p>", "verified": "(a) 4 subshells (4s, 4p, 4d, 4f); (b) 16 electrons"}], "revision_summary": {"key_laws": [{"name": "Thomson Specific Charge", "formula": "e/m_e = 1.758820 × 10¹¹ C kg⁻¹", "context": "Balanced crossed electric and magnetic fields (v = E/B)."}, {"name": "Millikan Charge Quantization", "formula": "q = n · e (e = 1.6022 × 10⁻¹⁹ C)", "context": "Terminal velocity and electric force balance on oil droplets."}, {"name": "Planck Quantum Postulate", "formula": "E = hν = hc/λ", "context": "Radiant energy emitted/absorbed in discrete packets of h = 6.626 × 10⁻³⁴ J s."}, {"name": "Einstein Photoelectric Equation", "formula": "hν = W₀ + 1/2 m_e v_max²", "context": "Threshold frequency ν₀; stopping potential eV₀ = K_max."}, {"name": "Bohr Angular Momentum Quantization", "formula": "m_e v r = n · (h / 2π)", "context": "Permitted non-radiating circular stationary orbits."}, {"name": "Bohr Energy & Rydberg Formula", "formula": "E_n = −2.18 × 10⁻¹⁸ (Z²/n²) J; ν̄ = R_H Z² (1/n₁² − 1/n₂²)", "context": "Line emission series: Lyman (UV), Balmer (Vis), Paschen (IR)."}, {"name": "de Broglie Matter Waves", "formula": "λ = h / p = h / (mv)", "context": "Wave-particle duality; standing wave resonance 2πr = nλ."}, {"name": "Heisenberg Uncertainty Principle", "formula": "Δx · Δp ≥ h / (4π)", "context": "Microscopic conjugate observables cannot be simultaneously exact."}, {"name": "Schrödinger Wave Mechanics", "formula": "Ĥψ = Eψ; Probability Density = |ψ|²", "context": "Orbitals defined by quantum numbers n, l, m_l, m_s; total nodes = n − 1."}, {"name": "Aufbau (n + l) Rule", "formula": "Lower (n + l) fills first; if equal, lower n fills first", "context": "1s < 2s < 2p < 3s < 3p < 4s < 3d < 4p < 5s < 4d < 5p < 6s < 4f."}, {"name": "Pauli Exclusion Principle", "formula": "No two electrons share identical (n, l, m_l, m_s)", "context": "Maximum 2 electrons per orbital with antiparallel spins (↑↓)."}, {"name": "Hund's Rule of Maximum Multiplicity", "formula": "Degenerate orbitals singly occupied with parallel spins first", "context": "Symmetrical half-filled (d⁵) and fully filled (d¹⁰) extra exchange stability."}], "common_pitfalls": ["Confusing orbit (a 1D planar classical trajectory, debunked by Heisenberg) with an orbital (a 3D quantum probability density region |ψ|²).", "Assuming stopping potential in the photoelectric effect increases with light intensity — it depends strictly on light frequency (ν).", "Calculating radial nodes as n − l instead of the correct formula n − l − 1.", "Writing the electronic configuration of Cr as [Ar] 3d⁴ 4s² instead of [Ar] 3d⁵ 4s¹, or Cu as [Ar] 3d⁹ 4s² instead of [Ar] 3d¹⁰ 4s¹.", "Removing electrons from 3d before 4s during ionization of transition elements — valence 4s electrons are always lost first (e.g. Fe → Fe²⁺ is [Ar] 3d⁶, not 3d⁴ 4s²)."]}};
</script>
<script>
(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp) disp.innerHTML = "t = <b>" + state.t.toFixed(1) + " s</b>";
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Concept View ---
  function renderConcept(idx){
    pause();
    state.conceptIndex = idx;
    state.t = 0;
    state.level = 0;

    var lessons = C.lessons || C.concepts || [];
    var l = lessons[idx];
    if(!l) return;

    var navTitle = l.nav || l.navTitle || l.title || ("Concept " + (idx + 1));

    // Update sidebar navigation active state
    var navBtns = document.querySelectorAll(".concept-nav");
    navBtns.forEach(function(b, i){
      if(b.id === "nav-revision") b.classList.remove("active");
      else b.classList.toggle("active", i === idx);
    });

    // Update top crumb
    var chNum = C.chapterNumber || (C.code ? C.code.replace(/\D/g, '') : "01");
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · " + navTitle.toUpperCase();

    // Show concept view, hide revision
    var cView = document.getElementById("concept-view");
    var rView = document.getElementById("revision-view");
    if(cView) cView.style.display = "block";
    if(rView) rView.style.display = "none";

    var html = "";

    // Concept Header
    var minutes = l.minutes || 10;
    var printPage = l.print || (l.pages ? l.pages.join("–") : (C.page_start ? "pp. " + C.page_start + "–" + C.page_end : ""));
    html += '<div class="concept-header">' +
      '<div class="concept-badge"><span>Concept ' + ("0" + (idx + 1)).slice(-2) + ' / ' + ("0" + lessons.length).slice(-2) + '</span>' +
      (printPage ? '<span class="time-pill">≈ ' + minutes + ' min · ' + printPage + '</span>' : '<span class="time-pill">≈ ' + minutes + ' min</span>') +
      '</div>' +
      '<h1 class="concept-title">' + (l.title || navTitle) + '</h1>' +
      '<p class="concept-deck">' + (l.deck || l.summary || "") + '</p>' +
      '</div>';

    // 01 LEARN BLOCK
    html += '<section class="learn-section" data-block="learn" aria-label="Learn Concept">' +
      '<span class="block-tag">01 · LEARN · CORE ESSENTIALS</span>';

    var quickItems = [];
    if(Array.isArray(l.quick)) {
      quickItems = l.quick;
    } else if(Array.isArray(l.summary)) {
      quickItems = l.summary;
    } else if(l.reading_content) {
      quickItems = [l.reading_content];
    } else if(l.summary || l.deck) {
      quickItems = [l.summary || l.deck];
    }

    html += '<div class="quick-summary">' + quickItems.map(function(p){
      if(p.includes('<p>') || p.includes('<div>') || p.includes('<h3>')) return p;
      var formatted = p.replace(/###\s+(.*?)\n/g, '<h3 style="margin-top:16px;color:var(--ink);">$1</h3>')
                       .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                       .replace(/\*(.*?)\*/g, '<em>$1</em>')
                       .replace(/\n\n/g, '</p><p>');
      return '<p>' + formatted + '</p>';
    }).join("") + '</div>';

    // Semantic Equations Card
    var formulas = l.formulas || [];
    if(formulas.length){
      html += '<div class="key-equations-card">' +
        '<div class="equations-heading">Key Relations for this Concept</div>' +
        '<div class="eq-grid">' +
        formulas.map(function(eq){
          var label = eq.label || eq.name || "Relation";
          var cond = eq.cond || "";
          var math = eq.html || eq.formula || "";
          return '<div class="eq-row">' +
            '<div class="eq-meta"><span class="eq-label">' + label + '</span>' + (cond ? '<span class="eq-cond">' + cond + '</span>' : '') + '</div>' +
            '<div class="eq-math">' + math + '</div>' +
            '</div>';
        }).join("") +
        '</div></div>';
    }

    // Deeper dive / core takeaways
    if(l.deeper){
      html += '<details class="deep-dive"><summary>Go deeper into the conceptual foundation</summary><p>' + l.deeper + '</p></details>';
    } else if(l.takeaways && l.takeaways.length){
      html += '<details class="deep-dive"><summary>Key Conceptual Takeaways</summary><ul>' +
        l.takeaways.map(function(t){ return '<li>' + t + '</li>'; }).join("") +
        '</ul></details>';
    }

    // Worked Example
    var worked = l.worked || l.worked_example;
    if(worked){
      var workedHtml = typeof worked === 'object' && worked !== null
        ? '<strong>' + (worked.title || 'Worked Example') + '</strong><br>' + (worked.problem || '') +
          (worked.given ? '<br><br><strong>Given:</strong> ' + worked.given : '') +
          (worked.steps ? '<br><strong>Steps:</strong><br>' + worked.steps.map(function(s){ return '&bull; ' + s; }).join('<br>') : '') +
          (worked.solution ? '<br><br><strong>Solution:</strong> ' + worked.solution : '') +
          (worked.answer ? '<br><br><strong>Answer:</strong> ' + worked.answer : '')
        : String(worked);
      html += '<details class="deep-dive"><summary>Worked textbook example step by step</summary><p>' + workedHtml + '</p></details>';
    }

    html += '</section>';

    // 02 PREDICT FIRST BLOCK
    var pred = l.prediction || l.predict || l.predict_first;
    if(pred && typeof pred === 'object' && (pred.prompt || pred.scenario) && pred.options && pred.options.length){
      var promptText = pred.prompt || pred.scenario || "";
      html += '<section class="predict-card" data-block="predict" aria-label="Predict First">' +
        '<div class="predict-badge">02 · PREDICT FIRST · TEST YOUR INTUITION</div>' +
        '<div class="predict-prompt">' + promptText.replace(/\n/g, '<br>') + '</div>' +
        '<div class="predict-options" id="predict-options">' +
        pred.options.map(function(opt, oi){
          return '<label class="predict-option"><input type="radio" name="predict_ans" value="' + oi + '"><span>' + opt + '</span></label>';
        }).join("") +
        '</div>' +
        '<div class="predict-actions">' +
        '<button class="btn-primary" id="btn-check-prediction">Check Prediction</button>' +
        '<button class="btn-secondary" id="btn-skip-prediction">Skip to Lab</button>' +
        '</div>' +
        '<div id="predict-feedback-box" class="predict-feedback" style="display:none;"></div>' +
        '</section>';
    }

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();
    var whatWatch = (pred && pred.prompt) ? pred.prompt : (typeof l.predict === 'string' ? l.predict : "Explore the interactive simulation controls, parameters, and readouts below.");
    html += '<section class="lab-card" data-block="play" aria-label="Interactive Laboratory">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +
      '<div id="sim-mount-point" class="sim-mount-container" style="width:100%;min-height:220px;margin-top:12px;">' +
        '<div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 720 300" role="img" aria-label="' + simTitle + '"></svg></div>' +
        '<div class="lab-legend" id="lab-legend"></div>' +
        '<div class="lab-toolbar" id="legacy-lab-toolbar">' +
          '<button class="toolbar-btn primary" id="btn-play-pause" aria-label="Play animation">▶ Play</button>' +
          '<button class="toolbar-btn" id="btn-step-fwd" aria-label="Step forward">⏭ Step (+0.5s)</button>' +
          '<button class="toolbar-btn" id="btn-reset-time" aria-label="Reset timeline">↺ Reset</button>' +
          '<span class="time-display" id="time-display">t = <b>0.0 s</b></span>' +
          '<div class="scrubber-wrap">' +
            '<input type="range" id="time-scrubber" class="timeline-scrubber" min="0" max="6" step="0.1" value="0" aria-label="Timeline time scrubber">' +
          '</div>' +
        '</div>' +
        '<div class="preset-bar" id="preset-bar"></div>' +
        '<div class="lab-controls-grid" id="lab-controls"></div>' +
        '<div class="lab-readout" id="lab-readout" role="status" aria-live="polite"></div>' +
        '<div class="lab-verdict" id="lab-verdict" role="status" aria-live="polite"></div>' +
      '</div>' +
      '</section>';

    // 04 CONNECT BLOCK
    var connectItems = l.connect || [];
    if(connectItems.length){
      html += '<section class="connect-section" data-block="connect" aria-label="Real World Connections">' +
        '<span class="block-tag">04 · CONNECT · REAL WORLD APPLICATIONS</span>' +
        '<div class="connect-grid">' +
        connectItems.map(function(item){
          var title = Array.isArray(item) ? item[0] : (item.title || "Real World Context");
          var desc = Array.isArray(item) ? item[1] : (item.text || item.desc || "");
          var links = Array.isArray(item) ? (item[2] || []) : (item.links || (item.link ? [{t: "Read Deeply", u: item.link}] : []));
          var v = Array.isArray(item) ? (item[3] || null) : (item.video || null);
          var wow = /^Wow/i.test(title);

          var cHtml = '<div class="connect-card' + (wow ? ' wow' : '') + '"' + (wow ? (links[0] && links[0].u ? ' data-wow data-source="' + links[0].u + '"' : ' data-wow') : '') + '>';
          if(wow) cHtml += '<span class="wow-badge">WOW · REAL WORLD</span>';
          cHtml += '<h3>' + title + '</h3><p>' + desc + '</p>';
          if(v && v.id){
            cHtml += '<button class="video-facade" data-yt="' + v.id + '" aria-label="Play video: ' + v.title + '">' +
              '<span class="thumb" aria-hidden="true"></span>' +
              '<span class="play-btn">▶</span>' +
              '<span class="video-title">' + v.title + ' · ' + v.channel + '</span>' +
              '</button>';
          }
          if(links && links.length){
            cHtml += '<p style="margin-top:10px;font-size:12px;color:var(--muted)">References: ' +
              links.map(function(a){ return '<a href="' + (a.u || a.link || "#") + '" target="_blank" rel="noopener">' + (a.t || a.label || "Read Deeply") + ' ↗</a>'; }).join(", ") +
              '</p>';
          }
          cHtml += '</div>';
          return cHtml;
        }).join("") +
        '</div></section>';
    }

    // 05 PRACTICE BLOCK
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(quizzes.length){
      html += '<section class="practice-section" data-block="practice" aria-label="Practice and Mastery">' +
        '<span class="block-tag">05 · PRACTICE · MULTI-TIER CHALLENGE</span>' +
        '<div class="practice-nav">';
      for(var qi = 0; qi < quizzes.length; qi++){
        var tierName = qi === 0 ? "Tier 1: Easy" : (qi === 1 ? "Tier 2: Medium" : (qi === 2 ? "Tier 3: Hard" : "Question " + (qi + 1)));
        html += '<button class="level-tab' + (qi === 0 ? ' active' : '') + '" data-lvl="' + qi + '">' + tierName + '</button>';
      }
      html += '</div>' +
        '<div id="quiz-container"></div>' +
        '</section>';
    }

    // 06 REVISE CALLOUT
    var recall = l.recall || (l.takeaways && l.takeaways.length ? l.takeaways[0] : (l.core_takeaways && l.core_takeaways.length ? l.core_takeaways[0] : "Reflect on how this concept connects to physical reality."));
    html += '<div class="revise-callout"><strong>06 · REVISE · SAY IT IN YOUR OWN WORDS:</strong> ' + recall + '</div>';

    // Footer Navigation
    var nextNav = idx < lessons.length - 1 ? (lessons[idx + 1].nav || lessons[idx + 1].navTitle || lessons[idx + 1].title || ("Concept " + (idx + 2))) : "";
    html += '<div class="concept-footer-nav">' +
      (idx > 0 ? '<button class="btn-secondary" id="btn-prev-concept">← Concept ' + ("0" + idx).slice(-2) + '</button>' : '<span></span>') +
      (idx < lessons.length - 1 ? '<button class="btn-primary" id="btn-next-concept">Concept ' + ("0" + (idx + 2)).slice(-2) + ': ' + nextNav + ' →</button>' : '<button class="btn-primary" id="btn-goto-revision">Chapter Revision & Exercises →</button>') +
      '</div>';

    cView.innerHTML = html;

    // Attach Prediction Listeners
    var btnCheckPred = document.getElementById("btn-check-prediction");
    var btnSkipPred = document.getElementById("btn-skip-prediction");
    if(btnCheckPred && pred){
      btnCheckPred.addEventListener("click", function(){
        var sel = document.querySelector('input[name="predict_ans"]:checked');
        var fb = document.getElementById("predict-feedback-box");
        if(!sel){
          fb.style.display = "block";
          fb.className = "predict-feedback revealed";
          fb.textContent = "Please select one of the predictions first.";
          return;
        }
        var chosen = Number(sel.value);
        var expectedAns = pred.answer !== undefined ? pred.answer : (pred.correct !== undefined ? pred.correct : 0);
        var isRight = chosen === expectedAns;
        fb.style.display = "block";
        fb.className = "predict-feedback " + (isRight ? "correct" : "revealed");
        fb.innerHTML = (isRight ? "<b>Spot on!</b> " : "<b>Good thought! Here is the physical principle:</b> ") + (pred.explanation || "");
      });
    }
    if(btnSkipPred && pred){
      btnSkipPred.addEventListener("click", function(){
        var fb = document.getElementById("predict-feedback-box");
        fb.style.display = "block";
        fb.className = "predict-feedback revealed";
        fb.innerHTML = "<b>Key Principle:</b> " + (pred.explanation || "");
      });
    }

    // Attach Timeline Controls for legacy SIMS
    var btnPP = document.getElementById("btn-play-pause");
    if(btnPP) btnPP.addEventListener("click", function(){ if(state.playing) pause(); else play(); });
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep) btnStep.addEventListener("click", function(){ step(0.5); });
    var btnResTime = document.getElementById("btn-reset-time");
    if(btnResTime) btnResTime.addEventListener("click", function(){ resetTimeline(); });
    var scrub = document.getElementById("time-scrubber");
    if(scrub) scrub.addEventListener("input", function(e){ seekTimeline(e.target.value); });

    // Footer Next/Prev listeners
    var btnPrev = document.getElementById("btn-prev-concept");
    var btnNext = document.getElementById("btn-next-concept");
    var btnRev = document.getElementById("btn-goto-revision");
    if(btnPrev) btnPrev.addEventListener("click", function(){ renderConcept(idx - 1); window.scrollTo(0,0); });
    if(btnNext) btnNext.addEventListener("click", function(){ renderConcept(idx + 1); window.scrollTo(0,0); });
    if(btnRev) btnRev.addEventListener("click", function(){ renderRevision(); window.scrollTo(0,0); });

    // Mount Active Simulation Engine
    var simMount = document.getElementById("sim-mount-point");
    if(simMount){
      var cKey = "c" + (idx + 1);
      var conceptId = l.id || ("concept-" + (idx + 1));
      var simId = l.sim || conceptId;

      // 1. window.mountSimulation (iemh101, iemh102)
      if(typeof window.mountSimulation === 'function'){
        simMount.innerHTML = "";
        window.mountSimulation(cKey, simMount);
      }
      // 2. window.SIM_ENGINES (iemh101-iemh105)
      else if(window.SIM_ENGINES && window.SIM_ENGINES[cKey] && typeof window.SIM_ENGINES[cKey].init === 'function'){
        simMount.innerHTML = "";
        window.SIM_ENGINES[cKey].init(simMount);
      }
      // 3. window.SimEngine (iemh106-iemh108)
      else if(window.SimEngine && typeof window.SimEngine.init === 'function'){
        var targetKey = null;
        var candidateKeys = [conceptId, "sim-" + conceptId, "sim-concept-" + (idx + 1), "concept-" + (idx + 1), simId, cKey];
        for(var k = 0; k < candidateKeys.length; k++){
          if(candidateKeys[k] && window.SimEngine.getEngine(candidateKeys[k])){
            targetKey = candidateKeys[k];
            break;
          }
        }
        if(targetKey){
          simMount.innerHTML = "";
          window.SimEngine.init(targetKey, simMount);
        }
      }
      // 4. window.SIMS (iesc101-iesc113)
      else if(window.SIMS && (window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey])){
        var simObj = window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey];
        if(typeof simObj.mount === 'function'){
          if(simObj.mount.length >= 1 && !simObj.draw){
            simMount.innerHTML = "";
            simObj.mount(simMount);
          } else {
            simObj.mount(l);
          }
        }
      }
    }

    // Render Quiz for current level
    renderQuiz();

    // Attach Practice Level Tabs
    var lvlTabs = document.querySelectorAll(".level-tab");
    lvlTabs.forEach(function(tab){
      tab.addEventListener("click", function(){
        lvlTabs.forEach(function(t){ t.classList.remove("active"); });
        tab.classList.add("active");
        state.level = Number(tab.getAttribute("data-lvl"));
        renderQuiz();
      });
    });

    // Update URL hash
    window.location.hash = "#concept-" + (idx + 1);
  }

  // --- Render Quiz ---
  function renderQuiz(){
    var lessons = C.lessons || C.concepts || [];
    var l = lessons[state.conceptIndex];
    if(!l) return;
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(!quizzes.length) return;
    var q = quizzes[state.level] || quizzes[0];
    if(!q) return;

    var qk = qKey(state.conceptIndex, state.level);
    var old = state.answers[qk] || {};

    var box = document.getElementById("quiz-container");
    if(!box) return;

    var promptText = q.prompt || q.question || "";
    var isMcq = q.type === "mcq" || (q.options && q.options.length > 0);
    var correctAns = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : 0);
    var solutionText = q.solution || q.explanation || "";
    var hintText = q.hint || "Review the key relationships in the concept overview above.";

    var html = '<div class="question-prompt">' + promptText + '</div>';
    if(isMcq && q.options){
      html += '<div class="quiz-options">' +
        q.options.map(function(opt, oi){
          var checked = old.value === String(oi) ? " checked" : "";
          return '<label class="quiz-option"><input type="radio" name="quiz_ans" value="' + oi + '"' + checked + '><span>' + opt + '</span></label>';
        }).join("") +
        '</div>';
    } else {
      html += '<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">' +
        '<input type="number" step="any" id="quiz_num_ans" placeholder="Your answer" value="' + (old.value || "") + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;width:160px;">' +
        '<span style="font-weight:600;color:var(--muted);">' + (q.unit || "") + '</span>' +
        '</div>';
    }

    html += '<div class="quiz-actions">' +
      '<button class="btn-primary" id="btn-submit-quiz">Submit Answer</button>' +
      '<button class="btn-secondary" id="btn-toggle-hint">Show Hint</button>' +
      '</div>' +
      '<div id="quiz-hint-box" class="quiz-hint" style="display:none;">' + hintText + '</div>' +
      '<div id="quiz-feedback-box" class="quiz-feedback" style="display:none;"></div>';

    box.innerHTML = html;

    // Hint toggle
    var hintBtn = document.getElementById("btn-toggle-hint");
    if(hintBtn){
      hintBtn.addEventListener("click", function(){
        var hb = document.getElementById("quiz-hint-box");
        if(hb) hb.style.display = hb.style.display === "none" ? "block" : "none";
      });
    }

    // Submit listener
    var submitBtn = document.getElementById("btn-submit-quiz");
    if(submitBtn){
      submitBtn.addEventListener("click", function(){
        var fb = document.getElementById("quiz-feedback-box");
        if(!fb) return;
        var isRight = false;
        var userVal = "";

        if(isMcq){
          var sel = document.querySelector('input[name="quiz_ans"]:checked');
          if(!sel){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please select an answer choice first.";
            return;
          }
          userVal = sel.value;
          isRight = Number(userVal) === Number(correctAns);
        } else {
          var inp = document.getElementById("quiz_num_ans");
          if(!inp || inp.value.trim() === ""){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please enter a numerical answer.";
            return;
          }
          userVal = inp.value.trim();
          var num = parseFloat(userVal);
          isRight = Math.abs(num - parseFloat(correctAns)) <= (q.tolerance || 0.05);
        }

        state.answers[qk] = { value: userVal, checked: true };
        if(isRight){
          state.correct[qk] = true;
          fb.style.display = "block";
          fb.className = "quiz-feedback success";
          fb.innerHTML = "<b>That’s right!</b> " + solutionText;
        } else {
          fb.style.display = "block";
          fb.className = "quiz-feedback retry";
          var wrongMsg = (isMcq && q.wrong && q.wrong[Number(userVal)]) ? q.wrong[Number(userVal)] : hintText;
          fb.innerHTML = "<b>Not quite.</b> " + wrongMsg + "<br><small style=\"margin-top:6px;display:block;\"><b>Full explanation:</b> " + solutionText + "</small>";
        }
        updateProgress();
      });
    }

    if(old.checked && submitBtn){
      submitBtn.click();
    }
  }

  // --- Render Revision View ---
  var currentExFilter = -1;

  function renderRevision(){
    pause();
    document.querySelectorAll(".concept-nav").forEach(function(b){ b.classList.remove("active"); });
    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.classList.add("active");

    var chNum = C.chapterNumber || (C.code ? C.code.replace(/\D/g, '') : "01");
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · NCERT EXERCISES & REVISION";

    var cView = document.getElementById("concept-view");
    var revView = document.getElementById("revision-view");
    if(cView) cView.style.display = "none";
    if(revView) revView.style.display = "block";

    var exList = C.exercises || [];
    if(!exList.length && C.exerciseMap){
      exList = C.exerciseMap.map(function(m){
        return {
          q: m[0],
          number: String(m[0]),
          title: m[1],
          conceptIdx: m[2],
          page: m[3],
          printPage: 47 + m[3],
          question: m[4] || m[1],
          steps: [m[5] || "Refer to concept explanation."],
          answer: m[5] || ""
        };
      });
    }

    var totalEx = exList.length;
    var html = '<div class="concept-header">' +
      '<span class="concept-badge">NCERT EXERCISE COMPENDIUM</span>' +
      '<h1 class="concept-title">Revise, Reflect, Refine</h1>' +
      '<p class="concept-deck">All ' + totalEx + ' exercises from NCERT Class 11 Physics with comprehensive step-by-step pedagogical solutions.</p>' +
      '</div>';

    // Filter Bar & Expand/Collapse All
    var lessons = C.lessons || C.concepts || [];
    html += '<div class="exercise-compendium-header">' +
      '<div class="exercise-filter-bar">' +
      '<button class="filter-chip ' + (currentExFilter === -1 ? 'active' : '') + '" data-cfilter="-1">All Exercises (' + totalEx + ')</button>' +
      lessons.map(function(l, li){
        var nav = l.nav || l.navTitle || l.title || ("C0" + (li+1));
        return '<button class="filter-chip ' + (currentExFilter === li ? 'active' : '') + '" data-cfilter="' + li + '">C0' + (li+1) + ': ' + nav + '</button>';
      }).join("") +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn-secondary" id="btn-expand-all" style="padding:6px 12px;font-size:13px;">Expand All Guidance</button>' +
