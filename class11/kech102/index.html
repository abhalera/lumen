<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 2: Chapter 2 — Interactive Textbook</title>
<style>
:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: var(--radius-sm);
  position: relative;
  overflow: hidden;
  border: none;
  padding: 0;
  cursor: pointer;
  display: block;
}
.video-facade img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
}
.play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 48px;
  height: 48px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.video-title {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 8px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  color: #fff;
  font-size: 12px;
  text-align: left;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);

<script>
window.CHAPTER = {"chapter_meta": {"id": "kech102", "number": 2, "title": "Structure of Atom", "book": "Chemistry Part I", "class": 11, "reprint": "2026-27", "tagline": "From Thomson's e/m and Rutherford's nucleus to Bohr orbits, de Broglie matter waves, and Schrödinger orbitals.", "total_concepts": 7, "total_practice_questions": 21, "total_exercises": 67}, "concepts": [{"id": "subatomic-particles", "nav": "Subatomic particles & e/m", "title": "Discovery of the Electron, e/m Ratio, Protons & Neutrons", "deck": "Cathode rays and radioactivity revealed that atoms are divisible composite systems consisting of electrons, protons, and neutrons.", "minutes": 8, "section": "2.1", "pages": [1, 4], "print": "1–4", "sim": "cathoderay", "simTitle": "Cathode Ray Tube & Thomson e/m Cross-Field Spectrometer", "quick": ["<strong>Cathode rays</strong> discovered by William Crookes and investigated by J.J. Thomson (1897) in evacuated discharge tubes at high voltage (&gt;10 kV) travel in straight lines from cathode to anode, cast sharp shadows, rotate light paddle wheels (proving particle momentum), and deflect toward positive plates in electric and magnetic fields.", "J.J. Thomson measured the specific charge ratio <em>e/m<sub>e</sub></em> = <strong>1.758820 × 10¹¹ C kg⁻¹</strong> by balancing orthogonal electrostatic and magnetic deflections ($qE = qvB$). Robert Millikan (1909) determined the fundamental elementary charge on oil droplets as <em>e</em> = <strong>−1.6022 × 10⁻¹⁹ C</strong>, yielding electron rest mass <em>m<sub>e</sub></em> = <em>e / (e/m<sub>e</sub>)</em> = <strong>9.10938 × 10⁻³¹ kg</strong> (~1/1837 of hydrogen atom).", "<strong>Canal rays</strong> (Goldstein 1886) moving toward perforated cathodes proved the existence of positive ions whose mass depended on the residual gas; hydrogen gas yielded the lightest positive particle, the <strong>proton</strong> (<em>m<sub>p</sub></em> = 1.6726 × 10⁻²⁷ kg). James Chadwick (1932) discovered the neutral <strong>neutron</strong> (<em>m<sub>n</sub></em> = 1.6749 × 10⁻²⁷ kg) by bombarding beryllium foils with alpha particles (⁹₄Be + ⁴₂α → ¹²₆C + ¹₀n)."], "formulas": [{"label": "Thomson Specific Charge", "html": "e / m_e = 1.758820 × 10¹¹ C kg⁻¹", "cond": "Crossed fields balance: v = E / B, e/m = E / (B² r)"}, {"label": "Electron Rest Mass", "html": "m_e = e / (e/m_e) = 9.10938 × 10⁻³¹ kg", "cond": "Millikan oil drop charge e = 1.6022 × 10⁻¹⁹ C"}, {"label": "Nuclear Composition", "html": "A = Z + N", "cond": "A = mass number (nucleons), Z = atomic number (protons), N = neutrons"}], "deeper": "In Thomson's cross-field technique, cathode rays pass undeflected when electric force F_e = eE exactly cancels magnetic Lorentz force F_b = evB. This uniquely establishes beam velocity v = E/B without knowing particle mass. Once magnetic field is turned off, the pure electrostatic deflection y = (e E L²) / (2 m_e v²) yields e/m directly from plate geometry.", "worked": "NCERT Problem 2.1: Calculate (i) number of electrons that weigh 1 g, and (ii) mass and charge of 1 mole of electrons. Solution: (i) Mass of 1 electron = 9.109 × 10⁻²⁸ g. Number = 1 / (9.109 × 10⁻²⁸) = 1.098 × 10²⁷ electrons. (ii) Mass of 1 mole = 6.022 × 10²³ × 9.109 × 10⁻³¹ kg = 5.486 × 10⁻⁷ kg = 0.5486 mg. Charge of 1 mole = 6.022 × 10²³ × 1.6022 × 10⁻¹⁹ C = 96,485 C (1 Faraday).", "prediction": {"prompt": "When the residual gas in a cathode ray discharge tube is replaced from hydrogen (H₂) to argon (Ar), what happens to the e/m ratio of cathode rays versus anode (canal) rays?", "options": ["Cathode ray e/m remains completely unchanged, whereas canal ray e/m decreases by a factor of ~40.", "Both cathode ray and canal ray e/m ratios decrease substantially.", "Cathode ray e/m increases, while canal ray e/m remains constant.", "Both e/m ratios remain identical because fundamental charges are constant."], "answer": 0, "explanation": "Cathode rays are universal electrons emitted from cathode electrodes/gas, so their e/m is independent of the gas. Canal rays are positive gas cations (H⁺ vs Ar⁺); since Ar⁺ is ~40 times heavier than H⁺ with the same charge, its e/m drops 40-fold."}, "connect": [["CRT TVs to Particle Accelerators", "The cathode ray tube laid the technical foundation for television oscilloscopes, medical X-ray generators (Roentgen 1895), and the Large Hadron Collider at CERN where protons are steered by crossed superconducting electromagnetic fields."], ["Smoke Detectors & Alpha Decay", "Household ionization smoke detectors utilize Americium-241 emitting alpha particles that ionize air molecules in a small chamber; smoke particles interrupt this current, triggering the alarm."]], "recall": "Why is the e/m ratio of cathode rays constant for all gases, whereas the e/m ratio of canal rays depends strongly on the gas filled in the tube?", "quizzes": [{"prompt": "Which combination of fields allows cathode ray particles to travel in a perfectly straight line without deflection?", "options": ["Crossed electric and magnetic fields where E = vB perpendicular to velocity", "Parallel electric and magnetic fields of equal numerical magnitude", "Zero electric field with maximum magnetic field along the trajectory", "Electric field pointing antiparallel to the cathode rays"], "answer": 0, "hint": "Electric force qE must equal magnetic Lorentz force qvB.", "explain": "When electric force qE balances magnetic Lorentz force qvB in orthogonal geometry, net force is zero and velocity is v = E/B."}, {"prompt": "In Millikan's oil drop experiment, what two opposing forces are balanced when an oil droplet remains suspended stationary in air?", "options": ["Downwards gravitational force (mg) and upwards electrostatic force (qE)", "Viscous Stokes drag force and surface tension of the droplet", "Nuclear force and buoyant Archimedes force", "Centrifugal force and atmospheric air pressure"], "answer": 0, "hint": "The droplet has mass m in gravity and charge q in vertical electric field E.", "explain": "When the droplet is stationary, net acceleration is zero: electrostatic force qE directed upwards balances the gravitational force mg downwards."}, {"prompt": "A nucleus has mass number A = 81 and contains 31.7% more neutrons than protons. What is its standard atomic symbol?", "options": ["⁸¹₃₅Br", "⁸¹₃₆Kr", "⁸¹₃₄Se", "⁸¹₃₇Rb"], "answer": 0, "hint": "Let p = x, n = 1.317x. Then x + 1.317x = 81.", "explain": "2.317 x = 81 => x = 34.96 ≈ 35. Atomic number Z = 35 is Bromine (Br). The symbol is ⁸¹₃₅Br."}]}, {"id": "atomic-models", "nav": "Rutherford model & nucleus", "title": "Rutherford's Alpha Scattering Experiment & the Nuclear Atom", "deck": "The unexpected backward bounce of alpha particles shattered the plum pudding model and proved that atoms concentrate almost all mass and positive charge in a sub-femtometre nucleus.", "minutes": 8, "section": "2.2", "pages": [4, 8], "print": "4–8", "sim": "alphascatter", "simTitle": "Rutherford Alpha Particle Gold Foil Scattering Lab", "quick": ["J.J. Thomson's <strong>plum pudding model</strong> envisioned the atom as a uniform sphere of positive electrification of radius ~10⁻¹⁰ m with electrons embedded like seeds in a watermelon. This model predicted that energetic alpha particles would experience only negligible deflections (<1°).", "In 1911, <strong>Ernest Rutherford, Hans Geiger, and Ernest Marsden</strong> directed a collimated beam of 5.5 MeV alpha particles (⁴₂He²⁺) at an ultra-thin gold foil (~100 nm, ~1000 atoms thick) surrounded by a circular fluorescent zinc sulphide (ZnS) screen. While 99.9% passed through undeflected, ~1 in 20,000 scattered through angles &gt;90°, some bouncing almost straight back (180°).", "Rutherford deduced that: (1) Most of the atom is empty space; (2) All positive charge and virtually all atomic mass are concentrated in an extraordinarily dense core called the <strong>nucleus</strong> (radius ~10⁻¹⁵ m vs atomic radius ~10⁻¹⁰ m; volume fraction 10⁻¹⁵); (3) Electrons orbit the nucleus in planetary orbits held by Coulomb electrostatic attraction. However, classical Maxwellian electrodynamics dictated that accelerating orbiting electrons must continuously radiate energy and spiral into the nucleus within 10⁻⁸ s!"], "formulas": [{"label": "Nuclear Radius Scaling", "html": "R = R₀ · A^(1/3)", "cond": "R₀ ≈ 1.2 × 10⁻¹⁵ m (1.2 fm); A = nucleon mass number"}, {"label": "Distance of Closest Approach", "html": "r₀ = (1 / 4πε₀) · (2 Z e² / K)", "cond": "Head-on collision (b = 0): Initial Kinetic Energy K = Coulomb Potential Energy"}, {"label": "Rutherford Scattering Law", "html": "N(θ) ∝ 1 / sin⁴(θ / 2)", "cond": "Number of scattered particles detected at scattering angle θ"}], "deeper": "Rutherford famously remarked: 'It was quite the most incredible event that has ever happened to me in my life. It was almost as incredible as if you fired a 15-inch shell at a piece of tissue paper and it came back and hit you.' In Thomson's diffuse model, electric field is everywhere weak; only a point-like concentration of 79 positive proton charges could generate the immense electrostatic repulsive field (~10²¹ V/m) needed to arrest and reverse an alpha particle.", "worked": "NCERT Problem 2.40: Why was a thin foil of heavy gold chosen rather than light metals like aluminum or foil of thickness 1 mm? Solution: Gold can be hammered into an ultra-thin foil (~100 nm, ~1000 atoms thick) ensuring single scattering events rather than multiple collisions. Furthermore, gold has a high nuclear charge (Z = 79), producing massive Coulomb repulsion; light nuclei like aluminum (Z = 13) produce weak deflections with negligible backward scattering.", "prediction": {"prompt": "If Rutherford had used a foil of solid neutrons (zero net electric charge) with the same atomic density, what scattering pattern would be observed?", "options": ["Zero Coulomb deflection: alpha particles would pass straight through with only rare nuclear collisions.", "Identical 1/sin⁴(θ/2) scattering pattern because neutrons still possess gravitational mass.", "All alpha particles would bounce straight back at 180°.", "Alpha particles would be captured and convert into beta radiation."], "answer": 0, "explanation": "Rutherford scattering is driven purely by electrostatic Coulomb repulsion between the positive alpha particle (+2e) and the positive nuclear charge (+Ze). If Z = 0, electrostatic force is zero and alpha particles travel straight through unhindered except for direct geometric contact."}, "connect": [["Neutron Stars: Pure Nuclear Density", "Because the atom is 99.9999999999999% empty space, if all empty space in the human body were collapsed into nuclear matter (density ~2.3 × 10¹⁷ kg/m³), the entire human population would fit inside the volume of a single sugar cube!"], ["Deep Inelastic Scattering & Quarks", "In 1968 at SLAC, physicists fired ultra-relativistic electrons into protons; the scattering pattern revealed point-like sub-constituents inside the proton — proving the existence of quarks, exactly echoing Rutherford's discovery of the nucleus."]], "recall": "What is the ratio of the volume of an atom (radius ~10⁻¹⁰ m) to the volume of its nucleus (radius ~10⁻¹⁵ m)?", "quizzes": [{"prompt": "Why did classical physics predict that Rutherford's planetary model of the atom was inherently unstable?", "options": ["Accelerating electrons must continuously radiate electromagnetic waves, losing energy and spiraling into the nucleus in ~10⁻⁸ s.", "Gravitational attraction between electrons and protons exceeds electrostatic repulsion.", "Centrifugal forces would immediately expel electrons into free space.", "Electrons would collide with each other and destroy their charge."], "answer": 0, "hint": "Recall Maxwell's electrodynamics for accelerating charges in circular orbits.", "explain": "According to classical Maxwellian electromagnetic theory, a charged particle in circular motion experiences continuous centripetal acceleration and must radiate electromagnetic energy, collapsing the atom."}, {"prompt": "In head-on alpha particle scattering (impact parameter b = 0), what converts completely into Coulomb potential energy at the distance of closest approach r₀?", "options": ["The entire initial kinetic energy of the alpha particle", "The rest mass energy of the target gold nucleus", "The magnetic dipole interaction energy", "The orbital angular momentum of atomic electrons"], "answer": 0, "hint": "At turning point r₀, velocity instantaneously drops to zero.", "explain": "At the distance of closest approach r₀, the alpha particle momentarily stops; its initial kinetic energy K is completely transformed into electrostatic potential energy U = (1/4πε₀) (2Ze² / r₀)."}, {"prompt": "An ion with mass number 56 contains 3 units of positive charge and 30.4% more neutrons than electrons. What is the ion's identity?", "options": ["⁵⁶₂₆Fe³⁺", "⁵⁶₂₈Ni³⁺", "⁵⁶₂₅Mn³⁺", "⁵⁶₂₇Co³⁺"], "answer": 0, "hint": "e = p - 3; n = 1.304(p - 3); p + n = 56.", "explain": "p + 1.304(p - 3) = 56 => 2.304 p - 3.912 = 56 => 2.304 p = 59.912 => p = 26. Element 26 is Iron (Fe). Ion is ⁵⁶₂₆Fe³⁺."}]}, {"id": "dual-nature-light", "nav": "Planck quantum & photoelectric", "title": "Planck's Quantum Theory & the Photoelectric Effect", "deck": "Classical wave theory failed to explain black body radiation and photoelectron ejection, inaugurating quantum physics where light travels in discrete energy packets called photons.", "minutes": 10, "section": "2.3", "pages": [8, 14], "print": "8–14", "sim": "photoelectric", "simTitle": "Photoelectric Effect & Planck Quantum Phototube Lab", "quick": ["Classical electromagnetism treated light as continuous waves with speed <em>c = νλ</em> and wave number <em>ν̄ = 1/λ</em>. However, wave theory led to the catastrophic prediction that ideal black bodies would emit infinite energy at high frequencies (ultraviolet catastrophe). In 1900, <strong>Max Planck</strong> resolved this by postulating that radiant energy is absorbed or emitted only in discrete packets called <strong>quanta</strong>, each with energy <em>E = hν</em> (Planck's constant <em>h</em> = 6.626 × 10⁻³⁴ J s).", "In the <strong>photoelectric effect</strong> (Heinrich Hertz 1887; Wilhelm Hallwachs & Philipp Lenard 1902), light striking a clean metal surface in vacuum instantaneously ejects electrons. Key experimental facts defied wave theory: (1) Electrons are emitted only if light frequency exceeds a characteristic <strong>threshold frequency</strong> <em>ν₀</em>; (2) Kinetic energy of photoelectrons depends linearly on light frequency, not on intensity; (3) Light intensity governs only the rate (current) of emitted photoelectrons, not their energy; (4) Ejection occurs with zero measurable time delay (&lt;10⁻⁹ s).", "Albert Einstein (1905) explained this by modeling light as a stream of localized particle-like energy packets called <strong>photons</strong>. When a photon collides with an electron, its entire energy <em>hν</em> is transferred to a single electron. Part of this energy overcomes the metal's binding energy (<strong>work function</strong> <em>W₀ = hν₀</em>), and the remainder appears as maximum kinetic energy: <em>K<sub>max</sub> = hν − hν₀ = eV₀</em>, where <em>V₀</em> is the stopping potential."], "formulas": [{"label": "Planck Quantum Energy", "html": "E = h ν = h c / λ = h c ν̄", "cond": "h = 6.62607 × 10⁻³⁴ J s; c = 2.99792 × 10⁸ m s⁻¹"}, {"label": "Einstein Photoelectric Equation", "html": "K_max = h ν − W₀ = h(ν − ν₀)", "cond": "K_max = 1/2 m_e v_max² = e V₀ (V₀ = stopping potential)"}, {"label": "Metal Work Function", "html": "W₀ = h ν₀ = h c / λ₀", "cond": "ν₀ = threshold frequency; λ₀ = threshold wavelength"}], "deeper": "Wave theory predicted that dim light would require hours or days to accumulate sufficient energy over atomic cross-sections to dislodge an electron, and that intense red light should eject electrons while weak violet light would not. Experimentally, intense red light ejects zero electrons from potassium, while even the dimmest flash of ultraviolet light ejects electrons instantaneously — conclusively demonstrating photon-by-electron quantization.", "worked": "NCERT Problem 2.9: A photon of wavelength 4 × 10⁻⁷ m strikes a metal surface with work function 2.13 eV. Calculate (i) energy of photon in eV, (ii) kinetic energy of photoelectron, and (iii) maximum velocity. Solution: (i) E = hc/λ = (6.626 × 10⁻³⁴ × 3 × 10⁸) / (4 × 10⁻⁷) = 4.97 × 10⁻¹⁹ J = 3.10 eV. (ii) K_max = E − W₀ = 3.10 − 2.13 = 0.97 eV = 1.554 × 10⁻¹⁹ J. (iii) v_max = √(2 K / m_e) = √(2 × 1.554 × 10⁻¹⁹ / 9.109 × 10⁻³¹) = 5.84 × 10⁵ m s⁻¹.", "prediction": {"prompt": "If monochromatic light of frequency ν &gt; ν₀ illuminates a photoelectric cell, what happens to stopping potential V₀ and saturation current I if the light intensity is quadrupled at constant frequency?", "options": ["Stopping potential V₀ remains unchanged; saturation photocurrent quadruples.", "Both stopping potential and saturation current quadruple.", "Stopping potential quadruples; saturation photocurrent remains constant.", "Stopping potential decreases because electrons collide with each other."], "answer": 0, "explanation": "Stopping potential V₀ = (h/e)(ν − ν₀) depends strictly on light frequency and metal work function, not intensity. Quadrupling intensity quadruples the photon flux, thus ejecting four times as many photoelectrons per second and quadrupling saturation current."}, "connect": [["Solar Photovoltaics & Digital Cameras", "Every digital smartphone camera CCD/CMOS sensor and rooftop solar panel converts photons into electric charges using Einstein's photoelectric and photovoltaic effect."], ["Night Vision Goggles", "Photomultiplier tubes inside night-vision optics use photoelectric cathodes to convert faint incoming photons into photoelectron cascades multiplied millions of times to reveal pitch-dark environments."]], "recall": "State the Einstein photoelectric equation and define each term: hν, W₀, and K_max.", "quizzes": [{"prompt": "The work function for caesium metal is 1.90 eV. What is the threshold wavelength λ₀ for photoelectric emission?", "options": ["654 nm (orange-red visible)", "320 nm (ultraviolet)", "1200 nm (infrared)", "450 nm (blue)"], "answer": 0, "hint": "λ₀ = hc / W₀ where W₀ = 1.90 × 1.602 × 10⁻¹⁹ J.", "explain": "W₀ = 1.90 × 1.6022 × 10⁻¹⁹ J = 3.044 × 10⁻¹⁹ J. λ₀ = (6.626 × 10⁻³⁴ × 3 × 10⁸) / (3.044 × 10⁻¹⁹) = 6.53 × 10⁻⁷ m = 653 nm ≈ 654 nm."}, {"prompt": "In a photoelectric experiment, a plot of stopping potential V₀ against incident light frequency ν yields a straight line whose slope is equal to:", "options": ["h / e (Planck's constant divided by electron charge)", "h · e", "Metal work function W₀", "Speed of light c"], "answer": 0, "hint": "Rearrange eV₀ = hν − W₀ into slope-intercept form V₀ = (h/e)ν − (W₀/e).", "explain": "V₀ = (h/e) ν − (W₀ / e). The slope is h/e, a universal constant independent of the target metal."}, {"prompt": "A 25-watt monochromatic yellow lamp emits light of wavelength 0.57 µm. How many photons does the lamp emit per second?", "options": ["7.17 × 10¹⁹ photons s⁻¹", "3.48 × 10¹⁸ photons s⁻¹", "1.25 × 10²¹ photons s⁻¹", "5.60 × 10¹⁷ photons s⁻¹"], "answer": 0, "hint": "Energy per photon E = hc/λ. Rate = Power / E.", "explain": "E = (6.626 × 10⁻³⁴ × 3 × 10⁸) / (0.57 × 10⁻⁶) = 3.487 × 10⁻¹⁹ J. Number of photons/s = 25 / (3.487 × 10⁻¹⁹) = 7.17 × 10¹⁹ s⁻¹."}]}, {"id": "bohr-model", "nav": "Bohr model & spectra", "title": "Bohr's Model of Hydrogen & Line Emission Spectra", "deck": "By quantizing orbital angular momentum, Niels Bohr explained atomic stability and predicted hydrogen spectral lines with unmatched spectroscopic accuracy.", "minutes": 10, "section": "2.4", "pages": [14, 20], "print": "14–20", "sim": "bohrmodel", "simTitle": "Bohr Hydrogen Atom Orbit Transitions & Emission Spectra Lab", "quick": ["When gaseous hydrogen is excited by an electric discharge, it emits light that separates through a prism into discrete bright lines — an <strong>atomic emission spectrum</strong>. In 1885, Johann Balmer found an empirical formula for visible lines: <em>ν̄ = 109,677 (1/2² − 1/n²) cm⁻¹</em>. Johannes Rydberg generalized this for all series: <strong>Lyman</strong> (<em>n₁=1</em>, UV), <strong>Balmer</strong> (<em>n₁=2</em>, visible), <strong>Paschen</strong> (<em>n₁=3</em>, IR), <strong>Brackett</strong> (<em>n₁=4</em>, IR), and <strong>Pfund</strong> (<em>n₁=5</em>, IR).", "In 1913, <strong>Niels Bohr</strong> postulated that: (1) The electron revolves only in specific circular non-radiating <strong>stationary orbits</strong>; (2) Orbital angular momentum is quantized in integer multiples of <em>h / 2π</em>: <em>m<sub>e</sub> v r = n (h / 2π)</em> (where <em>n = 1, 2, 3...</em>); (3) Radiation is emitted or absorbed only when an electron jumps between two stationary orbits: <em>ΔE = E₂ − E₁ = hν</em>.", "Bohr's model yielded exact formulas for hydrogenic ions (H, He⁺, Li²⁺, Be³⁺): orbit radius <em>r<sub>n</sub> = a₀ n² / Z</em> (where <em>a₀</em> = 52.9 pm is the Bohr radius) and orbital energy <strong>E<sub>n</sub> = −R<sub>H</sub> (Z² / n²) = −2.18 × 10⁻¹⁸ (Z² / n²) J</strong> (−13.6 Z²/n² eV). The negative sign signifies that an electron bound to the nucleus has lower energy than a free electron at infinite separation (E<sub>∞</sub> = 0)."], "formulas": [{"label": "Bohr Quantization of Angular Momentum", "html": "m_e v r = n · (h / 2π)", "cond": "n = 1, 2, 3... (principal quantum number)"}, {"label": "Bohr Orbit Radii", "html": "r_n = a₀ · (n² / Z) = 52.9 pm · (n² / Z)", "cond": "a₀ = 52.9 pm = 0.529 Å; Z = atomic nuclear charge"}, {"label": "Bohr Energy Levels & Rydberg Formula", "html": "E_n = −2.18 × 10⁻¹⁸ · (Z² / n²) J  ·  ν̄ = R_H Z² (1/n₁² − 1/n₂²)", "cond": "R_H = 109,677 cm⁻¹ = 1.09677 × 10⁷ m⁻¹"}], "deeper": "Despite its historic triumphs, Bohr's model suffered fundamental limitations: (1) It failed for any atom with more than one electron (even neutral Helium with 2 electrons); (2) It could not explain the fine doublet splitting of spectral lines; (3) It could not account for spectral line splitting in external magnetic fields (Zeeman effect) or electric fields (Stark effect); (4) It could not explain chemical bonding shapes; (5) It violated the wave nature of matter and Heisenberg's uncertainty principle.", "worked": "NCERT Problem 2.13: What is the wavelength of light emitted when the electron in a hydrogen atom undergoes a transition from n = 4 to n = 2? Solution: Balmer series transition (n₁ = 2, n₂ = 4). ν̄ = R_H (1/2² − 1/4²) = 109,677 (1/4 − 1/16) = 109,677 × (3/16) = 20,564.4 cm⁻¹ = 2.0564 × 10⁶ m⁻¹. Wavelength λ = 1 / ν̄ = 1 / (2.0564 × 10⁶ m⁻¹) = 4.86 × 10⁻⁷ m = 486.1 nm (characteristic cyan-blue H-beta line).", "prediction": {"prompt": "Which transition in the singly ionized Helium ion (He⁺, Z = 2) spectrum produces radiation of exactly the same wavelength as the Balmer transition n = 4 to n = 2 in atomic hydrogen (Z = 1)?", "options": ["Transition from n = 8 to n = 4 in He⁺", "Transition from n = 4 to n = 2 in He⁺", "Transition from n = 2 to n = 1 in He⁺", "Transition from n = 6 to n = 3 in He⁺"], "answer": 0, "explanation": "For hydrogen, ν̄ = R_H (1/2² − 1/4²). For He⁺ (Z = 2), ν̄ = R_H (2²) (1/n₁² − 1/n₂²) = R_H (1/(n₁/2)² − 1/(n₂/2)²). Equating terms yields n₁/2 = 2 => n₁ = 4, and n₂/2 = 4 => n₂ = 8. Thus, n = 8 to n = 4 in He⁺ produces identical wavelength."}, "connect": [["Astrophysical Fingerprints in Starlight", "Helium was first discovered not on Earth, but in the solar corona during the 1868 solar eclipse by Pierre Janssen and Norman Lockyer through an unidentified bright yellow spectral line (587.49 nm, D₃ line)."], ["Neon Lights & Laser Spectroscopy", "Gas discharge neon signs glow red-orange due to quantized electron de-excitations in neon atoms. Tunable laser spectroscopy uses these quantized transitions to detect trace pollutants at parts-per-trillion sensitivity."]], "recall": "Name the five spectral series of atomic hydrogen and specify the electromagnetic region for each.", "quizzes": [{"prompt": "What is the maximum number of emission spectral lines possible when an excited hydrogen electron in the n = 6 level drops back to ground state n = 1?", "options": ["15 lines", "6 lines", "21 lines", "10 lines"], "answer": 0, "hint": "Number of possible emission lines = n(n − 1) / 2.", "explain": "Total emission lines = n(n − 1) / 2 = 6(5) / 2 = 15 lines."}, {"prompt": "How much energy is required to ionize a hydrogen atom whose electron is already excited to the n = 5 orbit?", "options": ["0.544 eV (0.0872 × 10⁻¹⁸ J)", "13.6 eV (2.18 × 10⁻¹⁸ J)", "2.72 eV (0.436 × 10⁻¹⁸ J)", "0.054 eV (0.0087 × 10⁻¹⁸ J)"], "answer": 0, "hint": "E_n = −13.6 / n² eV. Ionization energy ΔE = E_∞ − E₅ = 0 − E₅.", "explain": "E₅ = −13.6 / 5² = −13.6 / 25 = −0.544 eV = −8.72 × 10⁻²⁰ J. Energy required = +0.544 eV = 8.72 × 10⁻²⁰ J."}, {"prompt": "The Bohr radius for hydrogen in the ground state is 52.9 pm. What is the radius of the second orbit (n = 2) for the Li²⁺ ion (Z = 3)?", "options": ["70.5 pm", "211.6 pm", "105.8 pm", "35.3 pm"], "answer": 0, "hint": "r_n = a₀ · (n² / Z).", "explain": "r₂ = 52.9 pm × (2² / 3) = 52.9 × 4 / 3 = 70.53 pm."}]}, {"id": "matter-waves", "nav": "de Broglie & uncertainty", "title": "Dual Behavior of Matter & Heisenberg's Uncertainty Principle", "deck": "Matter behaves as both wave and particle. Microscopically, position and momentum cannot be simultaneously determined, demolishing fixed planetary electron orbits.", "minutes": 10, "section": "2.5", "pages": [20, 25], "print": "20–25", "sim": "uncertainty", "simTitle": "de Broglie Standing Wave & Heisenberg Uncertainty Aperture Lab", "quick": ["In 1924, French physicist <strong>Louis de Broglie</strong> proposed that just as radiation possesses both wave and particle duality, matter (electrons, atoms, molecules) must also exhibit wave properties. The <strong>de Broglie wavelength</strong> of any moving particle with momentum <em>p = mv</em> is given by <strong>λ = h / p = h / (mv)</strong>.", "De Broglie's hypothesis was confirmed experimentally in 1927 by <strong>Clinton Davisson and Lester Germer</strong> in the US, and independently by <strong>George Paget Thomson</strong> in the UK, who directed electron beams at nickel crystal lattices and observed sharp circular wave diffraction patterns matching X-ray diffraction. Furthermore, Bohr's quantization condition <em>mvr = nh / 2π</em> is physically equivalent to a standing circular wave: <em>2πr = nλ</em>.", "In 1927, <strong>Werner Heisenberg</strong> formulated the <strong>Uncertainty Principle</strong>: It is fundamentally impossible to determine simultaneously both the exact position and momentum (or velocity) of a microscopic particle: <strong>Δx · Δp ≥ h / (4π)</strong>, or <strong>Δx · Δv ≥ h / (4π m)</strong>. For macroscopic objects (e.g. a 100 g cricket ball), the uncertainty product is ~10⁻³⁴ m² s⁻¹ (utterly negligible). But for an electron (m ~ 10⁻³⁰ kg), pinning position to 10⁻¹⁰ m imparts an enormous velocity uncertainty of ~10⁶ m s⁻¹ — rendering deterministic Bohr orbits physically meaningless!"], "formulas": [{"label": "de Broglie Matter Wavelength", "html": "λ = h / p = h / (m v) = h / √(2 m K)", "cond": "K = kinetic energy = q V for potential accelerated charge"}, {"label": "Bohr-de Broglie Standing Wave Resonance", "html": "2π r = n λ", "cond": "Circumference equals integer number of standing matter wavelengths"}, {"label": "Heisenberg Uncertainty Principle", "html": "Δx · Δp ≥ h / (4π)  ·  Δx · Δv ≥ h / (4π m)", "cond": "Δx = position uncertainty; Δp = momentum uncertainty"}], "deeper": "Why can an electron NOT reside inside the atomic nucleus? The nuclear radius is ~10⁻¹⁴ m. If an electron were confined inside the nucleus, its position uncertainty would be Δx ≤ 10⁻¹⁴ m. Heisenberg's principle requires minimum momentum uncertainty Δp ≥ h / (4π Δx) ≈ 5.27 × 10⁻²¹ kg m s⁻¹, corresponding to a relativistic kinetic energy >20 MeV. Nuclear beta-decay electrons possess energies of only 2–3 MeV, proving electrons cannot exist as nuclear constituents prior to emission.", "worked": "NCERT Problem 2.20 & 2.61: (A) Calculate de Broglie wavelength of an electron moving with velocity 2.05 × 10⁷ m s⁻¹. Solution: λ = h / (mv) = (6.626 × 10⁻³⁴) / (9.109 × 10⁻³¹ × 2.05 × 10⁷) = 3.55 × 10⁻¹¹ m = 0.0355 nm. (B) If position is measured with accuracy ±0.002 nm (Δx = 2 × 10⁻¹² m), calculate uncertainty in velocity: Δv ≥ h / (4π m Δx) = (6.626 × 10⁻³⁴) / (4 × 3.1416 × 9.109 × 10⁻³¹ × 2 × 10⁻¹²) = 2.89 × 10⁷ m s⁻¹ (almost 10% of light speed!).", "prediction": {"prompt": "If an electron and a proton are accelerated through the exact same electric potential difference V, what is the ratio of their de Broglie wavelengths (λ_e / λ_p)?", "options": ["λ_e / λ_p = √(m_p / m_e) ≈ 43 (electron wavelength is ~43 times longer)", "λ_e / λ_p = 1 (both have identical wavelength because charges are equal)", "λ_e / λ_p = m_e / m_p ≈ 1 / 1836", "λ_e / λ_p = √(m_e / m_p) ≈ 1 / 43"], "answer": 0, "explanation": "Kinetic energy K = qV is identical for both. Since λ = h / √(2mK), wavelength is inversely proportional to √m. Thus λ_e / λ_p = √(m_p / m_e) = √(1836) ≈ 42.85 ≈ 43."}, "connect": [["Transmission Electron Microscope (TEM)", "Because high-energy electrons possess de Broglie wavelengths &lt;0.05 Å (100,000 times shorter than visible light), electron microscopes achieve atomic-scale resolution capable of resolving individual DNA base pairs and viral capsids."], ["Quantum Tunneling in Microchips", "Heisenberg's uncertainty permits electrons to 'tunnel' across thin potential barriers. This quantum phenomenon powers flash memory transistors and tunnel diodes, but sets the ultimate 2-nanometer physical limit on modern silicon microchip scaling."]], "recall": "Explain why Heisenberg's uncertainty principle is significant for an electron but has no practical meaning for a moving tennis ball.", "quizzes": [{"prompt": "What is the de Broglie wavelength associated with an electron in the first Bohr orbit (r₁ = 52.9 pm) of the hydrogen atom?", "options": ["3.32 Å (0.332 nm), which exactly equals the orbit circumference 2π r₁", "0.529 Å, equal to the Bohr radius", "10.6 Å, twice the orbit circumference", "0.01 Å, corresponding to gamma radiation"], "answer": 0, "hint": "In the n = 1 orbit, 2π r₁ = 1 · λ.", "explain": "For n = 1: Circumference = 2π r₁ = 2 × 3.1416 × 0.529 Å = 3.32 Å. By the de Broglie resonance condition 2π r = nλ, for n = 1, λ = 3.32 Å."}, {"prompt": "A dust particle of mass 1.0 × 10⁻⁶ g has a velocity known to an accuracy of 5.0 × 10⁻²⁰ m s⁻¹. What is the minimum uncertainty in its position?", "options": ["1.05 × 10⁻⁶ m", "5.27 × 10⁻¹² m", "3.14 × 10⁻¹⁸ m", "9.11 × 10⁻²⁴ m"], "answer": 0, "hint": "Δx ≥ h / (4π m Δv). Note m = 1.0 × 10⁻⁹ kg.", "explain": "m = 10⁻⁹ kg. Δx ≥ (6.626 × 10⁻³⁴) / (4 × 3.1416 × 10⁻⁹ × 5.0 × 10⁻²⁰) = (6.626 × 10⁻³⁴) / (6.283 × 10⁻²⁸) = 1.05 × 10⁻⁶ m = 1.05 µm."}, {"prompt": "Which experimental observation definitively verified the wave nature of electrons proposed by Louis de Broglie?", "options": ["Electron diffraction patterns produced by a nickel single crystal (Davisson-Germer experiment)", "Oil droplet terminal velocity under gravity (Millikan experiment)", "Alpha particle deflection by gold foil (Rutherford experiment)", "Mass spectrometer isotope separation (Thomson experiment)"], "answer": 0, "hint": "Diffraction is an exclusively wave phenomenon.", "explain": "Davisson and Germer observed that electrons scatter off atomic crystal planes producing constructive and destructive interference diffraction rings, the hallmark of wave behavior."}]}, {"id": "quantum-model", "nav": "Orbitals & quantum numbers", "title": "Quantum Mechanical Model: Orbitals & Quantum Numbers", "deck": "Schrödinger's wave equation replaces rigid orbits with 3D probability clouds (orbitals) defined by four quantum numbers: n, l, ml, and ms.", "minutes": 12, "section": "2.6", "pages": [25, 33], "print": "25–33", "sim": "orbitalviewer", "simTitle": "3D Atomic Orbital Visualizer & Probability Density Mapper", "quick": ["In 1926, <strong>Erwin Schrödinger</strong> formulated wave mechanics with the fundamental wave equation: <strong>Ĥψ = Eψ</strong> (where Ĥ is the Hamiltonian differential operator). While the wave function <em>ψ</em> has no direct physical meaning, Max Born demonstrated that <strong>|ψ|²</strong> represents the <strong>probability density</strong> of finding the electron at a given volume element dV.", "An <strong>atomic orbital</strong> is a three-dimensional region around the nucleus where the probability of finding the electron is maximal (typically enclosed within a 90% boundary surface). Regions where electron probability drops to zero (|ψ|² = 0) are called <strong>nodes</strong>: <em>radial (spherical) nodes</em> = <strong>n − l − 1</strong>, and <em>angular (planar/conical) nodes</em> = <strong>l</strong>. The total number of nodes in any orbital is <strong>n − 1</strong>.", "Four quantum numbers completely define every electron in an atom: (1) <strong>Principal (n = 1, 2, 3...)</strong>: shell size and primary energy; (2) <strong>Azimuthal/Orbital Angular Momentum (l = 0, 1... n−1)</strong>: subshell shape (<em>l=0</em> is spherical <em>s</em>, <em>l=1</em> is dumbbell <em>p</em>, <em>l=2</em> is double dumbbell <em>d</em>, <em>l=3</em> is <em>f</em>); (3) <strong>Magnetic (m<sub>l</sub> = −l to +l)</strong>: spatial orientation (2l + 1 orbitals per subshell); (4) <strong>Electron Spin (m<sub>s</sub> = +½, −½)</strong>: intrinsic clockwise or counter-clockwise electron spin angular momentum."], "formulas": [{"label": "Schrödinger Time-Independent Wave Equation", "html": "Ĥ ψ = E ψ", "cond": "Ĥ = −(ℏ² / 2m) ∇² + V(r) is the total energy Hamiltonian operator"}, {"label": "Orbital Nodal Relations", "html": "Radial Nodes = n − l − 1  ·  Angular Nodes = l  ·  Total Nodes = n − 1", "cond": "At nodes, wave function ψ = 0 and electron probability density |ψ|² = 0"}, {"label": "Orbital Angular Momentum & Capacities", "html": "L = √(l(l+1)) · (h / 2π)  ·  Orbitals/shell = n²  ·  Max electrons/shell = 2n²", "cond": "For s (l=0), orbital angular momentum L = 0"}], "deeper": "Radial probability distribution curves plotted as 4πr² R(r)² dr reveal that while 2s and 2p electrons have the same principal quantum number (n = 2), the 2s electron has a small inner probability crest penetrating very close to the nucleus inside the 1s core. Consequently, 2s electrons experience less screening and a higher effective nuclear charge (Z_eff) than 2p electrons, explaining why E(2s) < E(2p) in multi-electron atoms.", "worked": "NCERT Problem 2.25, 2.29, 2.31: (A) An electron is in one of the 3d orbitals: give possible values of n, l, and ml. Solution: n = 3, l = 2, ml ∈ {−2, −1, 0, +1, +2}. (B) Describe orbitals: n = 1, l = 0 (1s); n = 3, l = 1 (3p); n = 4, l = 2 (4d); n = 4, l = 3 (4f). (C) How many electrons can have n = 4, ms = −½? Solution: Total orbitals in n = 4 is n² = 16. Each orbital holds one electron with ms = −½, so exactly 16 electrons.", "prediction": {"prompt": "How many radial nodes and how many angular nodes exist in a 4d atomic orbital?", "options": ["1 radial node and 2 angular nodes (total 3 nodes)", "2 radial nodes and 1 angular node (total 3 nodes)", "0 radial nodes and 3 angular nodes (total 3 nodes)", "3 radial nodes and 0 angular nodes (total 3 nodes)"], "answer": 0, "explanation": "For 4d: n = 4, l = 2. Radial nodes = n − l − 1 = 4 − 2 − 1 = 1. Angular nodes = l = 2. Total nodes = n − 1 = 3."}, "connect": [["Chemical Bonding & Molecular Shapes", "The directional orientation of p orbitals (along x, y, z axes at 90°) and d orbitals underpins hybrid orbital theory (sp, sp², sp³) that dictates the 3D geometry of organic molecules and DNA double helices."], ["Magnetic Resonance Imaging (MRI)", "Nuclear magnetic resonance utilizes the intrinsic nuclear spin quantum number to flip proton magnetic moments with radiofrequency pulses, generating high-contrast 3D medical images of human soft tissue."]], "recall": "List the four quantum numbers, their permitted numerical ranges, and the physical property each describes.", "quizzes": [{"prompt": "Which of the following sets of quantum numbers (n, l, ml, ms) is physically IMPOSSIBLE for an atomic electron?", "options": ["n = 2, l = 2, ml = 0, ms = +½", "n = 3, l = 2, ml = −1, ms = −½", "n = 4, l = 0, ml = 0, ms = +½", "n = 1, l = 0, ml = 0, ms = −½"], "answer": 0, "hint": "Azimuthal quantum number l can only range from 0 to n − 1.", "explain": "For n = 2, maximum allowed value of l is n − 1 = 1 (allowing only 2s and 2p). A state with l = 2 (2d) cannot exist."}, {"prompt": "What is the orbital angular momentum of an electron residing in a 3p atomic orbital?", "options": ["√2 · ℏ (where ℏ = h / 2π)", "0", "√6 · ℏ", "1 · ℏ"], "answer": 0, "hint": "L = √(l(l + 1)) ℏ. For p orbitals, l = 1.", "explain": "For p orbitals, l = 1. L = √(1(1 + 1)) ℏ = √2 ℏ."}, {"prompt": "What is the total number of orbitals associated with the fourth energy shell (n = 4)?", "options": ["16 orbitals (1s + 3p + 5d + 7f)", "32 orbitals", "8 orbitals", "4 orbitals"], "answer": 0, "hint": "Total number of orbitals in principal shell n is n².", "explain": "Total orbitals = n² = 4² = 16 orbitals (one 4s, three 4p, five 4d, and seven 4f)."}]}, {"id": "electronic-config", "nav": "Aufbau, Pauli & Hund", "title": "Electronic Configurations: Aufbau, Pauli Exclusion & Hund's Rule", "deck": "Multi-electron atoms assemble by progressive energy minimization governed by the (n+l) rule, Pauli's two-electron limit, and Hund's maximum spin multiplicity.", "minutes": 12, "section": "2.6", "pages": [33, 38], "print": "33–38", "sim": "electronconfig", "simTitle": "Interactive Aufbau Orbital Filling Engine & Hund Spin Multiplicity Lab", "quick": ["The electronic architecture of ground-state atoms follows three fundamental quantum principles: (1) <strong>Aufbau Principle</strong> (German for 'building up'): Electrons progressively occupy lowest-energy orbitals first. Relative energies are dictated by the <strong>(n + l) rule</strong>: orbitals with lower (n + l) fill first; if (n + l) is equal, lower n has lower energy (1s &lt; 2s &lt; 2p &lt; 3s &lt; 3p &lt; 4s &lt; 3d &lt; 4p &lt; 5s &lt; 4d &lt; 5p &lt; 6s &lt; 4f...);", "(2) <strong>Pauli Exclusion Principle</strong> (Wolfgang Pauli 1925): 'No two electrons in an atom can have the same set of all four quantum numbers (n, l, m<sub>l</sub>, m<sub>s</sub>).' As a direct corollary, any individual atomic orbital can accommodate at most <strong>two electrons</strong>, and they must possess <strong>antiparallel spins</strong> (↑↓);", "(3) <strong>Hund's Rule of Maximum Multiplicity</strong>: Electron pairing in degenerate orbitals (orbitals of identical energy, e.g. 2p<sub>x</sub>, 2p<sub>y</sub>, 2p<sub>z</sub>) cannot occur until every available subshell orbital is singly occupied with <strong>parallel spins</strong> (↑ ↑ ↑). Symmetrical half-filled (d⁵) and completely filled (d¹⁰) subshells possess extraordinary thermodynamic stability due to symmetrical electron distribution and maximum <strong>exchange energy</strong>, explaining anomalous configurations like Chromium (Z=24: [Ar] 3d⁵ 4s¹ instead of 3d⁴ 4s²) and Copper (Z=29: [Ar] 3d¹⁰ 4s¹ instead of 3d⁹ 4s²)."], "formulas": [{"label": "Bohr-Bury (n + l) Energy Order Rule", "html": "E ∝ (n + l);  If equal, Lower n fills first", "cond": "E.g. 4s (4+0=4) fills before 3d (3+2=5); 3d (3+2=5) fills before 4p (4+1=5)"}, {"label": "Exchange Energy Pairs", "html": "Number of Exchange Pairs K = n(n − 1) / 2", "cond": "n = number of electrons with parallel spin in degenerate subshell"}, {"label": "Spin Magnetic Moment", "html": "µ_s = √(n(n + 2))  Bohr Magnetons (BM)", "cond": "n = number of unpaired electrons in ground-state atom/ion"}], "deeper": "Exchange energy is a purely quantum-mechanical consequence of the antisymmetry of fermionic wave functions. When electrons share identical parallel spins, the Pauli exclusion principle forces them to remain spatially separated (forming a 'Fermi hole'). This significantly reduces electron-electron Coulomb repulsion while maintaining full attraction toward the positive nucleus, stabilizing half-filled d⁵ (10 exchange pairs) and filled d¹⁰ manifolds.", "worked": "NCERT Problem 2.26 & 2.66: (A) Deduce protons and configuration of an atom with 29 electrons and 35 neutrons. Protons = 29 (Copper, Cu). Mass number A = 29 + 35 = 64. Ground state configuration: 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s¹ (anomalous filled d¹⁰). (B) Count unpaired electrons: (a) Phosphorus P ([Ne] 3s² 3p³ => 3 unpaired), (b) Silicon Si ([Ne] 3s² 3p² => 2 unpaired), (c) Chromium Cr ([Ar] 3d⁵ 4s¹ => 6 unpaired), (d) Iron Fe ([Ar] 3d⁶ 4s² => 4 unpaired), (e) Krypton Kr (noble gas => 0 unpaired).", "prediction": {"prompt": "During the ionization of neutral Iron (Fe: [Ar] 3d⁶ 4s²) to form Fe²⁺ and Fe³⁺, which electrons are ionized first and why?", "options": ["The 4s electrons are removed first to form Fe²⁺ ([Ar] 3d⁶), then a 3d electron is removed to form stable half-filled Fe³⁺ ([Ar] 3d⁵).", "The 3d electrons are removed first because 3d has higher (n+l) than 4s.", "One 4s and one 3d electron are removed simultaneously because their energies are identical.", "Core 2p electrons are removed first due to high exchange repulsion."], "answer": 0, "explanation": "Although 4s fills before 3d in neutral atoms, once the 3d subshell begins populating, 3d electrons penetrate closer to the nucleus and become more tightly bound. The 4s electrons have a higher principal quantum number (n = 4) and extend farther outwards, so they are ionized first: Fe ([Ar] 3d⁶ 4s²) → Fe²⁺ ([Ar] 3d⁶) + 2e⁻ → Fe³⁺ ([Ar] 3d⁵) + e⁻."}, "connect": [["Superconducting Magnets & Spintronics", "The presence of unpaired electrons in transition metals gives rise to ferromagnetism (iron, cobalt, neodymium) essential for electric vehicle motors, MRI magnets, and next-generation spintronic computing devices."], ["Gemstones & Transition Metal Colors", "Ruby's deep red color arises from trace Cr³⁺ ([Ar] 3d³) ions occupying aluminum sites in corundum (Al₂O₃), absorbing yellow-green light via d–d electron transitions."]], "recall": "State Hund's rule of maximum multiplicity and explain why Chromium has the configuration [Ar] 3d⁵ 4s¹ instead of [Ar] 3d⁴ 4s².", "quizzes": [{"prompt": "What is the ground-state electronic configuration of the cupric ion Cu²⁺ (Z = 29)?", "options": ["[Ar] 3d⁹", "[Ar] 3d¹⁰ 4s¹", "[Ar] 3d⁸ 4s¹", "[Ar] 3d⁷ 4s²"], "answer": 0, "hint": "Neutral Cu is [Ar] 3d¹⁰ 4s¹. Remove 2 electrons (one from 4s, one from 3d).", "explain": "Neutral Cu is [Ar] 3d¹⁰ 4s¹. Ionization to Cu²⁺ removes the 4s¹ valence electron first and then one 3d electron, leaving [Ar] 3d⁹."}, {"prompt": "How many exchange pairs of electrons with parallel spin exist in the half-filled 3d⁵ subshell of Chromium?", "options": ["10 exchange pairs", "5 exchange pairs", "15 exchange pairs", "4 exchange pairs"], "answer": 0, "hint": "Number of pairs K = n(n − 1) / 2 where n = 5.", "explain": "For 5 electrons with parallel spin: K = 5(4) / 2 = 10 exchange pairs. This high exchange energy provides extraordinary thermodynamic stabilization."}, {"prompt": "Which of the following atoms/ions is DIAMAGNETIC (possesses zero unpaired electrons)?", "options": ["Zn²⁺ (Z = 30)", "Fe²⁺ (Z = 26)", "Mn²⁺ (Z = 25)", "Cu²⁺ (Z = 29)"], "answer": 0, "hint": "Zn is [Ar] 3d¹⁰ 4s². Zn²⁺ loses two 4s electrons.", "explain": "Zn²⁺ has electronic configuration [Ar] 3d¹⁰. All ten 3d electrons are paired into 5 orbitals, yielding 0 unpaired electrons (diamagnetic)."}]}], "exercises": [{"num": "2.1", "title": "Mass and charge of electrons & number per gram", "question": "(i) Calculate the number of electrons which will together weigh one gram.\n(ii) Calculate the mass and charge of one mole of electrons.", "approach": "Use electron mass m_e = 9.10938 × 10⁻³¹ kg (9.10938 × 10⁻²⁸ g) and elementary charge e = 1.6022 × 10⁻¹⁹ C along with Avogadro constant N_A = 6.022 × 10²³ mol⁻¹.", "solution": "<p><strong>(i) Number of electrons in 1 gram:</strong></p><p>Mass of one electron = 9.10938 × 10⁻²⁸ g.</p><p>Number of electrons = 1 g / (9.10938 × 10⁻²⁸ g) = <strong>1.0978 × 10²⁷ electrons</strong>.</p><p><strong>(ii) Mass and charge of 1 mole of electrons:</strong></p><p>Mass of 1 mole = N_A · m_e = (6.02214 × 10²³ mol⁻¹) × (9.10938 × 10⁻³¹ kg) = <strong>5.4858 × 10⁻⁷ kg = 0.5486 mg</strong>.</p><p>Charge of 1 mole = N_A · e = (6.02214 × 10²³ mol⁻¹) × (1.60218 × 10⁻¹⁹ C) = <strong>96,485 C (1 Faraday)</strong>.</p>", "verified": "1.098 × 10²⁷ electrons; 5.486 × 10⁻⁷ kg; 9.649 × 10⁴ C"}, {"num": "2.2", "title": "Electrons, neutrons and protons in methane, 14C and NH3", "question": "(i) Calculate the total number of electrons present in one mole of methane.\n(ii) Find (a) total number and (b) total mass of neutrons in 7 mg of ¹⁴C (mass of neutron = 1.675 × 10⁻²⁷ kg).\n(iii) Find (a) total number and (b) total mass of protons in 34 mg of NH₃ at STP. Will the answer change if temperature and pressure change?", "approach": "Break each molecule into its constituent atoms to count protons, neutrons, and electrons per molecule, then multiply by moles and N_A.", "solution": "<p><strong>(i) Electrons in 1 mole of CH₄:</strong></p><p>Each CH₄ molecule contains 6 (from C) + 4(1 from H) = 10 electrons.</p><p>Total electrons = 10 × N_A = 10 × 6.022 × 10²³ = <strong>6.022 × 10²⁴ electrons</strong>.</p><p><strong>(ii) Neutrons in 7 mg of ¹⁴C:</strong></p><p>Molar mass of ¹⁴C = 14 g mol⁻¹. Moles = (7 × 10⁻³ g) / 14 g mol⁻¹ = 5.0 × 10⁻⁴ mol.</p><p>Each ¹⁴₆C atom contains 14 − 6 = 8 neutrons.</p><p>(a) Total neutrons = (5.0 × 10⁻⁴ mol) × (6.022 × 10²³ mol⁻¹) × 8 = <strong>2.4088 × 10²¹ neutrons</strong>.</p><p>(b) Total mass = (2.4088 × 10²¹ neutrons) × (1.675 × 10⁻²⁷ kg) = <strong>4.035 × 10⁻⁶ kg = 4.035 mg</strong>.</p><p><strong>(iii) Protons in 34 mg of NH₃:</strong></p><p>Molar mass of NH₃ = 17 g mol⁻¹. Moles = (34 × 10⁻³ g) / 17 g mol⁻¹ = 2.0 × 10⁻³ mol.</p><p>Each NH₃ molecule has 7 (from N) + 3(1 from H) = 10 protons.</p><p>(a) Total protons = (2.0 × 10⁻³ mol) × (6.022 × 10²³ mol⁻¹) × 10 = <strong>1.2044 × 10²² protons</strong>.</p><p>(b) Total mass = (1.2044 × 10²² protons) × (1.6726 × 10⁻²⁷ kg) = <strong>2.0145 × 10⁻⁵ kg = 20.15 mg</strong>.</p><p><strong>Effect of temperature & pressure:</strong> Temperature and pressure affect the volume occupied by gaseous NH₃, but do not alter mass or number of moles; thus, the number and total mass of protons remain strictly unchanged.</p>", "verified": "6.022 × 10²⁴ electrons; 2.409 × 10²¹ neutrons (4.035 mg); 1.204 × 10²² protons (20.15 mg); No change with T and P"}, {"num": "2.3", "title": "Neutrons and protons in given nuclei", "question": "How many neutrons and protons are there in the following nuclei: ⁶₁₃C, ⁸₁₆O, ¹²₂₄Mg, ²⁶₅₆Fe, ³⁸₈₈Sr?", "approach": "For a nucleus with atomic number Z and mass number A: Protons = Z, Neutrons = A − Z.", "solution": "<p>Recall that Atomic Number Z = number of protons, and Mass Number A = protons + neutrons.</p><ul><li><strong>¹³₆C:</strong> Protons = 6, Neutrons = 13 − 6 = <strong>7</strong>.</li><li><strong>¹⁶₈O:</strong> Protons = 8, Neutrons = 16 − 8 = <strong>8</strong>.</li><li><strong>²⁴₁₂Mg:</strong> Protons = 12, Neutrons = 24 − 12 = <strong>12</strong>.</li><li><strong>⁵⁶₂₆Fe:</strong> Protons = 26, Neutrons = 56 − 26 = <strong>30</strong>.</li><li><strong>⁸⁸₃₈Sr:</strong> Protons = 38, Neutrons = 88 − 38 = <strong>50</strong>.</li></ul>", "verified": "¹³C: 6p, 7n; ¹⁶O: 8p, 8n; ²⁴Mg: 12p, 12n; ⁵⁶Fe: 26p, 30n; ⁸⁸Sr: 38p, 50n"}, {"num": "2.4", "title": "Standard atomic symbols from Z and A", "question": "Write the complete symbol for the atom with given atomic number (Z) and atomic mass (A):\n(i) Z = 17, A = 35;\n(ii) Z = 92, A = 233;\n(iii) Z = 4, A = 9.", "approach": "Standard isotopic notation is ᴬ_Z X where X is the element symbol uniquely determined by Z.", "solution": "<p>Identify element symbol from atomic number Z:</p><ul><li>(i) Z = 17 corresponds to Chlorine (Cl), A = 35: <strong>³⁵₁₇Cl</strong></li><li>(ii) Z = 92 corresponds to Uranium (U), A = 233: <strong>²³³₉₂U</strong></li><li>(iii) Z = 4 corresponds to Beryllium (Be), A = 9: <strong>⁹₄Be</strong></li></ul>", "verified": "³⁵₁₇Cl; ²³³₉₂U; ⁹₄Be"}, {"num": "2.5", "title": "Frequency and wavenumber of sodium yellow light", "question": "Yellow light emitted from a sodium lamp has a wavelength (λ) of 580 nm. Calculate the frequency (ν) and wavenumber (ν̄) of the yellow light.", "approach": "Use fundamental wave relations c = νλ and ν̄ = 1/λ, converting nm to metres.", "solution": "<p>Given: λ = 580 nm = 580 × 10⁻⁹ m = 5.80 × 10⁻⁷ m.</p><p><strong>1. Frequency (ν):</strong></p><p>ν = c / λ = (3.0 × 10⁸ m s⁻¹) / (5.80 × 10⁻⁷ m) = <strong>5.172 × 10¹⁴ s⁻¹ (Hz)</strong>.</p><p><strong>2. Wavenumber (ν̄):</strong></p><p>ν̄ = 1 / λ = 1 / (5.80 × 10⁻⁷ m) = <strong>1.724 × 10⁶ m⁻¹ = 1.724 × 10⁴ cm⁻¹</strong>.</p>", "verified": "ν = 5.172 × 10¹⁴ Hz, ν̄ = 1.724 × 10⁶ m⁻¹ (1.724 × 10⁴ cm⁻¹)"}, {"num": "2.6", "title": "Energy of photons from frequency and wavelength", "question": "Find energy of each of the photons which:\n(i) correspond to light of frequency 3 × 10¹⁵ Hz.\n(ii) have wavelength of 0.50 Å.", "approach": "Use Planck formula E = hν and E = hc/λ where h = 6.626 × 10⁻³⁴ J s and 1 Å = 10⁻¹⁰ m.", "solution": "<p><strong>(i) Frequency ν = 3 × 10¹⁵ Hz:</strong></p><p>E = h ν = (6.626 × 10⁻³⁴ J s) × (3.0 × 10¹⁵ s⁻¹) = <strong>1.988 × 10⁻¹⁸ J</strong> (12.41 eV).</p><p><strong>(ii) Wavelength λ = 0.50 Å = 0.50 × 10⁻¹⁰ m:</strong></p><p>E = h c / λ = (6.626 × 10⁻³⁴ J s × 3.0 × 10⁸ m s⁻¹) / (0.50 × 10⁻¹⁰ m) = <strong>3.976 × 10⁻¹⁵ J</strong> (24.82 keV, X-ray photon).</p>", "verified": "(i) 1.988 × 10⁻¹⁸ J; (ii) 3.976 × 10⁻¹⁵ J"}, {"num": "2.7", "title": "Wavelength, frequency and wavenumber from period", "question": "Calculate the wavelength, frequency and wavenumber of a light wave whose period is 2.0 × 10⁻¹⁰ s.", "approach": "Frequency is reciprocal of period (ν = 1/T); wavelength λ = c/ν; wavenumber ν̄ = 1/λ.", "solution": "<p>Given: Period T = 2.0 × 10⁻¹⁰ s.</p><p><strong>1. Frequency (ν):</strong></p><p>ν = 1 / T = 1 / (2.0 × 10⁻¹⁰ s) = <strong>5.0 × 10⁹ s⁻¹ (Hz)</strong>.</p><p><strong>2. Wavelength (λ):</strong></p><p>λ = c / ν = (3.0 × 10⁸ m s⁻¹) / (5.0 × 10⁹ s⁻¹) = <strong>6.0 × 10⁻² m = 6.0 cm</strong> (microwave region).</p><p><strong>3. Wavenumber (ν̄):</strong></p><p>ν̄ = 1 / λ = 1 / (0.060 m) = <strong>16.66 m⁻¹ = 0.1666 cm⁻¹</strong>.</p>", "verified": "ν = 5.0 × 10⁹ Hz, λ = 6.0 × 10⁻² m (6.0 cm), ν̄ = 16.67 m⁻¹"}, {"num": "2.8", "title": "Number of photons for 1 J energy at 4000 pm", "question": "What is the number of photons of light with a wavelength of 4000 pm that provide 1 J of energy?", "approach": "Total energy E_total = N · (hc / λ); solve for N = E_total · λ / (hc).", "solution": "<p>Given: λ = 4000 pm = 4000 × 10⁻¹² m = 4.0 × 10⁻⁹ m.</p><p>Energy of a single photon:</p><p>E_photon = h c / λ = (6.626 × 10⁻³⁴ J s × 3.0 × 10⁸ m s⁻¹) / (4.0 × 10⁻⁹ m) = 4.9695 × 10⁻¹⁷ J.</p><p>Number of photons needed for 1 J:</p><p>N = (1.0 J) / (4.9695 × 10⁻¹⁷ J) = <strong>2.012 × 10¹⁶ photons</strong>.</p>", "verified": "2.012 × 10¹⁶ photons"}, {"num": "2.9", "title": "Photoelectric effect on metal with work function 2.13 eV", "question": "A photon of wavelength 4 × 10⁻⁷ m strikes on a metal surface, the work function of the metal being 2.13 eV. Calculate (i) the energy of the photon (eV), (ii) the kinetic energy of the emission, and (iii) the velocity of the photoelectron (1 eV = 1.6020 × 10⁻¹⁹ J).", "approach": "Calculate photon energy E = hc/λ in Joules, convert to eV, subtract work function W₀ to find K_max, then solve v = √(2K/m_e).", "solution": "<p>Given: λ = 4.0 × 10⁻⁷ m, W₀ = 2.13 eV.</p><p><strong>(i) Photon energy:</strong></p><p>E = hc / λ = (6.626 × 10⁻³⁴ × 3.0 × 10⁸) / (4.0 × 10⁻⁷) = 4.9695 × 10⁻¹⁹ J.</p><p>In eV: E = (4.9695 × 10⁻¹⁹ J) / (1.602 × 10⁻¹⁹ J eV⁻¹) = <strong>3.102 eV</strong>.</p><p><strong>(ii) Kinetic energy of photoelectron:</strong></p><p>K_max = E − W₀ = 3.102 eV − 2.130 eV = <strong>0.972 eV</strong>.</p><p>In Joules: K_max = 0.972 × 1.602 × 10⁻¹⁹ J = <strong>1.557 × 10⁻¹⁹ J</strong>.</p><p><strong>(iii) Velocity of photoelectron:</strong></p><p>1/2 m_e v² = K_max => v = √(2 K_max / m_e) = √[(2 × 1.557 × 10⁻¹⁹ kg m² s⁻²) / (9.109 × 10⁻³¹ kg)]</p><p>v = √(3.419 × 10¹¹ m² s⁻²) = <strong>5.847 × 10⁵ m s⁻¹</strong>.</p>", "verified": "E = 3.10 eV; K_max = 0.97 eV (1.56 × 10⁻¹⁹ J); v = 5.85 × 10⁵ m s⁻¹"}, {"num": "2.10", "title": "Ionization energy of sodium from threshold wavelength", "question": "Electromagnetic radiation of wavelength 242 nm is just sufficient to ionise the sodium atom. Calculate the ionisation energy of sodium in kJ mol⁻¹.", "approach": "Energy to ionize one atom is E = hc/λ₀. Multiply by Avogadro's number N_A and divide by 1000 for kJ mol⁻¹.", "solution": "<p>Given: Threshold wavelength λ₀ = 242 nm = 2.42 × 10⁻⁷ m.</p><p>Ionization energy per sodium atom:</p><p>E_atom = hc / λ₀ = (6.626 × 10⁻³⁴ J s × 3.0 × 10⁸ m s⁻¹) / (2.42 × 10⁻⁷ m) = 8.214 × 10⁻¹⁹ J.</p><p>Ionization energy per mole of sodium atoms:</p><p>ΔH_ion = E_atom × N_A = (8.214 × 10⁻¹⁹ J) × (6.022 × 10²³ mol⁻¹) = 494,647 J mol⁻¹ = <strong>494.65 kJ mol⁻¹</strong>.</p>", "verified": "494.65 kJ mol⁻¹"}, {"num": "2.11", "title": "Rate of emission of yellow light quanta from a 25 W bulb", "question": "A 25 watt bulb emits monochromatic yellow light of wavelength of 0.57 µm. Calculate the rate of emission of quanta per second.", "approach": "Power P = 25 J s⁻¹. Rate of quanta emission = P / E_photon, where E_photon = hc/λ.", "solution": "<p>Given: Power P = 25 W = 25 J s⁻¹, λ = 0.57 µm = 5.7 × 10⁻⁷ m.</p><p>Energy of one quantum (photon):</p><p>E = hc / λ = (6.626 × 10⁻³⁴ J s × 3.0 × 10⁸ m s⁻¹) / (5.7 × 10⁻⁷ m) = 3.487 × 10⁻¹⁹ J.</p><p>Rate of emission of quanta per second:</p><p>N = P / E = (25 J s⁻¹) / (3.487 × 10⁻¹⁹ J) = <strong>7.169 × 10¹⁹ quanta s⁻¹</strong>.</p>", "verified": "7.17 × 10¹⁹ photons s⁻¹"}, {"num": "2.12", "title": "Threshold frequency and work function of metal from 6800 Å", "question": "Electrons are emitted with zero velocity from a metal surface when it is exposed to radiation of wavelength 6800 Å. Calculate threshold frequency (ν₀) and work function (W₀) of the metal.", "approach": "Zero kinetic energy means the incident radiation is exactly at the threshold wavelength: λ₀ = 6800 Å. ν₀ = c/λ₀, W₀ = hν₀.", "solution": "<p>Given: Threshold wavelength λ₀ = 6800 Å = 6.80 × 10⁻⁷ m.</p><p><strong>1. Threshold frequency (ν₀):</strong></p><p>ν₀ = c / λ₀ = (3.0 × 10⁸ m s⁻¹) / (6.80 × 10⁻⁷ m) = <strong>4.412 × 10¹⁴ s⁻¹ (Hz)</strong>.</p><p><strong>2. Work function (W₀):</strong></p><p>W₀ = h ν₀ = (6.626 × 10⁻³⁴ J s) × (4.412 × 10¹⁴ s⁻¹) = <strong>2.923 × 10⁻¹⁹ J</strong>.</p><p>In electron-volts: W₀ = (2.923 × 10⁻¹⁹ J) / (1.602 × 10⁻¹⁹ J eV⁻¹) = <strong>1.824 eV</strong>.</p>", "verified": "ν₀ = 4.41 × 10¹⁴ Hz, W₀ = 2.92 × 10⁻¹⁹ J (1.82 eV)"}, {"num": "2.13", "title": "Wavelength of hydrogen emission for n = 4 to n = 2", "question": "What is the wavelength of light emitted when the electron in a hydrogen atom undergoes transition from an energy level with n = 4 to an energy level with n = 2?", "approach": "Use Rydberg formula for Balmer series: ν̄ = 1/λ = R_H (1/2² − 1/4²) where R_H = 109,677 cm⁻¹ = 1.09677 × 10⁷ m⁻¹.", "solution": "<p>For atomic hydrogen, the wavenumber for transition from n₂ = 4 to n₁ = 2 is:</p><p>ν̄ = R_H · (1 / 2² − 1 / 4²) = 1.09677 × 10⁷ m⁻¹ × (1/4 − 1/16) = 1.09677 × 10⁷ × (3/16)</p><p>ν̄ = 2.0564 × 10⁶ m⁻¹.</p><p>Wavelength λ = 1 / ν̄ = 1 / (2.0564 × 10⁶ m⁻¹) = 4.862 × 10⁻⁷ m = <strong>486.2 nm (4862 Å)</strong>.</p><p>This corresponds to the blue-green H_β line in the Balmer emission series.</p>", "verified": "486.2 nm (4862 Å)"}, {"num": "2.14", "title": "Ionization energy of H atom from n = 5 orbit", "question": "How much energy is required to ionise a H atom if the electron occupies n = 5 orbit? Compare your answer with the ionization enthalpy of H atom (energy required to remove the electron from n = 1 orbit).", "approach": "Energy required to ionize from orbit n is ΔE = E_∞ − E_n = 0 − (−2.18 × 10⁻¹⁸ / n²) = 2.18 × 10⁻¹⁸ / n² J.", "solution": "<p>Energy of hydrogen orbit n is E_n = −2.18 × 10⁻¹⁸ / n² J.</p><p><strong>1. Ionization from n = 5:</strong></p><p>ΔE₅ = 0 − E₅ = (2.18 × 10⁻¹⁸ J) / 5² = (2.18 × 10⁻¹⁸ J) / 25 = <strong>8.72 × 10⁻²⁰ J = 0.544 eV</strong>.</p><p><strong>2. Ionization from ground state (n = 1):</strong></p><p>ΔE₁ = 2.18 × 10⁻¹⁸ J = 13.6 eV (1312 kJ mol⁻¹).</p><p><strong>Comparison:</strong></p><p>ΔE₅ / ΔE₁ = (8.72 × 10⁻²⁰ J) / (2.18 × 10⁻¹⁸ J) = 1 / 25 = <strong>0.04 (only 4% of ground state ionization enthalpy)</strong>.</p>", "verified": "8.72 × 10⁻²⁰ J (0.544 eV); exactly 1/25 of ground-state ionization enthalpy"}, {"num": "2.15", "title": "Maximum emission lines for H atom dropping from n = 6 to ground state", "question": "What is the maximum number of emission lines when the excited electron of a H atom in n = 6 drops to the ground state?", "approach": "Total number of possible spectral transitions between levels n₂ and n₁ is N = (n₂ − n₁)(n₂ − n₁ + 1) / 2.", "solution": "<p>Here n₂ = 6 and ground state n₁ = 1.</p><p>Number of emission lines N = (6 − 1)(6 − 1 + 1) / 2 = 5 × 6 / 2 = <strong>15 lines</strong>.</p><p>Breakdown: 5 lines in Lyman (n → 1), 4 in Balmer (n → 2), 3 in Paschen (n → 3), 2 in Brackett (n → 4), and 1 in Pfund (n → 5).</p>", "verified": "15 lines (5 Lyman, 4 Balmer, 3 Paschen, 2 Brackett, 1 Pfund)"}, {"num": "2.16", "title": "Energy and radius of the fifth Bohr orbit of H", "question": "(i) The energy associated with the first orbit in the hydrogen atom is −2.18 × 10⁻¹⁸ J atom⁻¹. What is the energy associated with the fifth orbit?\n(ii) Calculate the radius of Bohr's fifth orbit for hydrogen atom.", "approach": "Use E_n = E₁ / n² and r_n = a₀ · n² where a₀ = 0.529 Å (52.9 pm).", "solution": "<p><strong>(i) Energy of 5th orbit (n = 5):</strong></p><p>E₅ = E₁ / 5² = (−2.18 × 10⁻¹⁸ J) / 25 = <strong>−8.72 × 10⁻²⁰ J atom⁻¹</strong> (−0.544 eV).</p><p><strong>(ii) Radius of 5th orbit (n = 5):</strong></p><p>r₅ = a₀ · n² = 52.9 pm × 5² = 52.9 pm × 25 = <strong>1322.5 pm = 1.3225 nm = 13.225 Å</strong>.</p>", "verified": "(i) −8.72 × 10⁻²⁰ J; (ii) 1.3225 nm (1322.5 pm)"}, {"num": "2.17", "title": "Wavenumber for the longest wavelength transition in Balmer series", "question": "Calculate the wavenumber for the longest wavelength transition in the Balmer series of atomic hydrogen.", "approach": "Longest wavelength corresponds to the minimum energy difference: transition from immediately adjacent level n = 3 to n = 2.", "solution": "<p>In the Balmer series, n₁ = 2. The longest wavelength (lowest energy) transition occurs from n₂ = 3 (H_α line).</p><p>ν̄ = R_H · (1 / 2² − 1 / 3²) = 109,677 cm⁻¹ × (1/4 − 1/9) = 109,677 × (5/36)</p><p>ν̄ = <strong>15,232.9 cm⁻¹ = 1.5233 × 10⁶ m⁻¹</strong>.</p><p>Corresponding wavelength λ = 1 / ν̄ = 6.564 × 10⁻⁷ m = <strong>656.4 nm (red H_α line)</strong>.</p>", "verified": "1.523 × 10⁶ m⁻¹ (15,233 cm⁻¹), λ = 656.4 nm"}, {"num": "2.18", "title": "Energy to shift H electron from n = 1 to n = 5 and emission wavelength", "question": "What is the energy in joules, required to shift the electron of the hydrogen atom from the first Bohr orbit to the fifth Bohr orbit and what is the wavelength of the light emitted when the electron returns to the ground state? The ground state electron energy is −2.18 × 10⁻¹⁸ ergs.", "approach": "Note 1 erg = 10⁻⁷ J. In SI units, E₁ = −2.18 × 10⁻¹⁸ J. ΔE = E₅ − E₁; λ = hc / ΔE.", "solution": "<p>Ground state energy E₁ = −2.18 × 10⁻¹⁸ J. Energy of 5th orbit E₅ = −2.18 × 10⁻¹⁸ / 25 = −8.72 × 10⁻²⁰ J.</p><p><strong>1. Excitation energy (n = 1 → 5):</strong
