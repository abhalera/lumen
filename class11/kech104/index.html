<script>
(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp) disp.innerHTML = "t = <b>" + state.t.toFixed(1) + " s</b>";
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Concept View ---
  function renderConcept(idx){
    pause();
    state.conceptIndex = idx;
    state.t = 0;
    state.level = 0;

    var lessons = C.lessons || C.concepts || [];
    var l = lessons[idx];
    if(!l) return;

    var navTitle = l.nav || l.navTitle || l.title || ("Concept " + (idx + 1));

    // Update sidebar navigation active state
    var navBtns = document.querySelectorAll(".concept-nav");
    navBtns.forEach(function(b, i){
      if(b.id === "nav-revision") b.classList.remove("active");
      else b.classList.toggle("active", i === idx);
    });

    // Update top crumb
    var chNum = C.chapterNumber || (C.code ? C.code.replace(/\D/g, '') : "01");
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · " + navTitle.toUpperCase();

    // Show concept view, hide revision
    var cView = document.getElementById("concept-view");
    var rView = document.getElementById("revision-view");
    if(cView) cView.style.display = "block";
    if(rView) rView.style.display = "none";

    var html = "";

    // Concept Header
    var minutes = l.minutes || 10;
    var printPage = l.print || (l.pages ? l.pages.join("–") : (C.page_start ? "pp. " + C.page_start + "–" + C.page_end : ""));
    html += '<div class="concept-header">' +
      '<div class="concept-badge"><span>Concept ' + ("0" + (idx + 1)).slice(-2) + ' / ' + ("0" + lessons.length).slice(-2) + '</span>' +
      (printPage ? '<span class="time-pill">≈ ' + minutes + ' min · ' + printPage + '</span>' : '<span class="time-pill">≈ ' + minutes + ' min</span>') +
      '</div>' +
      '<h1 class="concept-title">' + (l.title || navTitle) + '</h1>' +
      '<p class="concept-deck">' + (l.deck || l.summary || "") + '</p>' +
      '</div>';

    // 01 LEARN BLOCK
    html += '<section class="learn-section" data-block="learn" aria-label="Learn Concept">' +
      '<span class="block-tag">01 · LEARN · CORE ESSENTIALS</span>';

    var quickItems = [];
    if(Array.isArray(l.quick)) {
      quickItems = l.quick;
    } else if(Array.isArray(l.summary)) {
      quickItems = l.summary;
    } else if(l.reading_content) {
      quickItems = [l.reading_content];
    } else if(l.summary || l.deck) {
      quickItems = [l.summary || l.deck];
    }

    html += '<div class="quick-summary">' + quickItems.map(function(p){
      if(p.includes('<p>') || p.includes('<div>') || p.includes('<h3>')) return p;
      var formatted = p.replace(/###\s+(.*?)\n/g, '<h3 style="margin-top:16px;color:var(--ink);">$1</h3>')
                       .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                       .replace(/\*(.*?)\*/g, '<em>$1</em>')
                       .replace(/\n\n/g, '</p><p>');
      return '<p>' + formatted + '</p>';
    }).join("") + '</div>';

    // Semantic Equations Card
    var formulas = l.formulas || [];
    if(formulas.length){
      html += '<div class="key-equations-card">' +
        '<div class="equations-heading">Key Relations for this Concept</div>' +
        '<div class="eq-grid">' +
        formulas.map(function(eq){
          var label = eq.label || eq.name || "Relation";
          var cond = eq.cond || "";
          var math = eq.html || eq.formula || "";
          return '<div class="eq-row">' +
            '<div class="eq-meta"><span class="eq-label">' + label + '</span>' + (cond ? '<span class="eq-cond">' + cond + '</span>' : '') + '</div>' +
            '<div class="eq-math">' + math + '</div>' +
            '</div>';
        }).join("") +
        '</div></div>';
    }

    // Deeper dive / core takeaways
    if(l.deeper){
      html += '<details class="deep-dive"><summary>Go deeper into the conceptual foundation</summary><p>' + l.deeper + '</p></details>';
    } else if(l.takeaways && l.takeaways.length){
      html += '<details class="deep-dive"><summary>Key Conceptual Takeaways</summary><ul>' +
        l.takeaways.map(function(t){ return '<li>' + t + '</li>'; }).join("") +
        '</ul></details>';
    }

    // Worked Example
    var worked = l.worked || l.worked_example;
    if(worked){
      var workedHtml = typeof worked === 'object' && worked !== null
        ? '<strong>' + (worked.title || 'Worked Example') + '</strong><br>' + (worked.problem || '') +
          (worked.given ? '<br><br><strong>Given:</strong> ' + worked.given : '') +
          (worked.steps ? '<br><strong>Steps:</strong><br>' + worked.steps.map(function(s){ return '&bull; ' + s; }).join('<br>') : '') +
          (worked.solution ? '<br><br><strong>Solution:</strong> ' + worked.solution : '') +
          (worked.answer ? '<br><br><strong>Answer:</strong> ' + worked.answer : '')
        : String(worked);
      html += '<details class="deep-dive"><summary>Worked textbook example step by step</summary><p>' + workedHtml + '</p></details>';
    }

    html += '</section>';

    // 02 PREDICT FIRST BLOCK
    var pred = l.prediction || l.predict || l.predict_first;
    if(pred && typeof pred === 'object' && (pred.prompt || pred.scenario) && pred.options && pred.options.length){
      var promptText = pred.prompt || pred.scenario || "";
      html += '<section class="predict-card" data-block="predict" aria-label="Predict First">' +
        '<div class="predict-badge">02 · PREDICT FIRST · TEST YOUR INTUITION</div>' +
        '<div class="predict-prompt">' + promptText.replace(/\n/g, '<br>') + '</div>' +
        '<div class="predict-options" id="predict-options">' +
        pred.options.map(function(opt, oi){
          return '<label class="predict-option"><input type="radio" name="predict_ans" value="' + oi + '"><span>' + opt + '</span></label>';
        }).join("") +
        '</div>' +
        '<div class="predict-actions">' +
        '<button class="btn-primary" id="btn-check-prediction">Check Prediction</button>' +
        '<button class="btn-secondary" id="btn-skip-prediction">Skip to Lab</button>' +
        '</div>' +
        '<div id="predict-feedback-box" class="predict-feedback" style="display:none;"></div>' +
        '</section>';
    }

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();
    var whatWatch = (pred && pred.prompt) ? pred.prompt : (typeof l.predict === 'string' ? l.predict : "Explore the interactive simulation controls, parameters, and readouts below.");
    html += '<section class="lab-card" data-block="play" aria-label="Interactive Laboratory">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +
      '<div id="sim-mount-point" class="sim-mount-container" style="width:100%;min-height:220px;margin-top:12px;">' +
        '<div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 720 300" role="img" aria-label="' + simTitle + '"></svg></div>' +
        '<div class="lab-legend" id="lab-legend"></div>' +
        '<div class="lab-toolbar" id="legacy-lab-toolbar">' +
          '<button class="toolbar-btn primary" id="btn-play-pause" aria-label="Play animation">▶ Play</button>' +
          '<button class="toolbar-btn" id="btn-step-fwd" aria-label="Step forward">⏭ Step (+0.5s)</button>' +
          '<button class="toolbar-btn" id="btn-reset-time" aria-label="Reset timeline">↺ Reset</button>' +
          '<span class="time-display" id="time-display">t = <b>0.0 s</b></span>' +
          '<div class="scrubber-wrap">' +
            '<input type="range" id="time-scrubber" class="timeline-scrubber" min="0" max="6" step="0.1" value="0" aria-label="Timeline time scrubber">' +
          '</div>' +
        '</div>' +
        '<div class="preset-bar" id="preset-bar"></div>' +
        '<div class="lab-controls-grid" id="lab-controls"></div>' +
        '<div class="lab-readout" id="lab-readout" role="status" aria-live="polite"></div>' +
        '<div class="lab-verdict" id="lab-verdict" role="status" aria-live="polite"></div>' +
      '</div>' +
      '</section>';

    // 04 CONNECT BLOCK
    var connectItems = l.connect || [];
    if(connectItems.length){
      html += '<section class="connect-section" data-block="connect" aria-label="Real World Connections">' +
        '<span class="block-tag">04 · CONNECT · REAL WORLD APPLICATIONS</span>' +
        '<div class="connect-grid">' +
        connectItems.map(function(item){
          var title = Array.isArray(item) ? item[0] : (item.title || "Real World Context");
          var desc = Array.isArray(item) ? item[1] : (item.text || item.desc || "");
          var links = Array.isArray(item) ? (item[2] || []) : (item.links || (item.link ? [{t: "Read Deeply", u: item.link}] : []));
          var v = Array.isArray(item) ? (item[3] || null) : (item.video || null);
          var wow = /^Wow/i.test(title);

          var cHtml = '<div class="connect-card' + (wow ? ' wow' : '') + '"' + (wow ? (links[0] && links[0].u ? ' data-wow data-source="' + links[0].u + '"' : ' data-wow') : '') + '>';
          if(wow) cHtml += '<span class="wow-badge">WOW · REAL WORLD</span>';
          cHtml += '<h3>' + title + '</h3><p>' + desc + '</p>';
          if(v && v.id){
            cHtml += '<button class="video-facade" data-yt="' + v.id + '" aria-label="Play video: ' + v.title + '">' +
              '<span class="thumb" aria-hidden="true"></span>' +
              '<span class="play-btn">▶</span>' +
              '<span class="video-title">' + v.title + ' · ' + v.channel + '</span>' +
              '</button>';
          }
          if(links && links.length){
            cHtml += '<p style="margin-top:10px;font-size:12px;color:var(--muted)">References: ' +
              links.map(function(a){ return '<a href="' + (a.u || a.link || "#") + '" target="_blank" rel="noopener">' + (a.t || a.label || "Read Deeply") + ' ↗</a>'; }).join(", ") +
              '</p>';
          }
          cHtml += '</div>';
          return cHtml;
        }).join("") +
        '</div></section>';
    }

    // 05 PRACTICE BLOCK
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(quizzes.length){
      html += '<section class="practice-section" data-block="practice" aria-label="Practice and Mastery">' +
        '<span class="block-tag">05 · PRACTICE · MULTI-TIER CHALLENGE</span>' +
        '<div class="practice-nav">';
      for(var qi = 0; qi < quizzes.length; qi++){
        var tierName = qi === 0 ? "Tier 1: Easy" : (qi === 1 ? "Tier 2: Medium" : (qi === 2 ? "Tier 3: Hard" : "Question " + (qi + 1)));
        html += '<button class="level-tab' + (qi === 0 ? ' active' : '') + '" data-lvl="' + qi + '">' + tierName + '</button>';
      }
      html += '</div>' +
        '<div id="quiz-container"></div>' +
        '</section>';
    }

    // 06 REVISE CALLOUT
    var recall = l.recall || (l.takeaways && l.takeaways.length ? l.takeaways[0] : (l.core_takeaways && l.core_takeaways.length ? l.core_takeaways[0] : "Reflect on how this concept connects to physical reality."));
    html += '<div class="revise-callout"><strong>06 · REVISE · SAY IT IN YOUR OWN WORDS:</strong> ' + recall + '</div>';

    // Footer Navigation
    var nextNav = idx < lessons.length - 1 ? (lessons[idx + 1].nav || lessons[idx + 1].navTitle || lessons[idx + 1].title || ("Concept " + (idx + 2))) : "";
    html += '<div class="concept-footer-nav">' +
      (idx > 0 ? '<button class="btn-secondary" id="btn-prev-concept">← Concept ' + ("0" + idx).slice(-2) + '</button>' : '<span></span>') +
      (idx < lessons.length - 1 ? '<button class="btn-primary" id="btn-next-concept">Concept ' + ("0" + (idx + 2)).slice(-2) + ': ' + nextNav + ' →</button>' : '<button class="btn-primary" id="btn-goto-revision">Chapter Revision & Exercises →</button>') +
      '</div>';

    cView.innerHTML = html;

    // Attach Prediction Listeners
    var btnCheckPred = document.getElementById("btn-check-prediction");
    var btnSkipPred = document.getElementById("btn-skip-prediction");
    if(btnCheckPred && pred){
      btnCheckPred.addEventListener("click", function(){
        var sel = document.querySelector('input[name="predict_ans"]:checked');
        var fb = document.getElementById("predict-feedback-box");
        if(!sel){
          fb.style.display = "block";
          fb.className = "predict-feedback revealed";
          fb.textContent = "Please select one of the predictions first.";
          return;
        }
        var chosen = Number(sel.value);
        var expectedAns = pred.answer !== undefined ? pred.answer : (pred.correct !== undefined ? pred.correct : 0);
        var isRight = chosen === expectedAns;
        fb.style.display = "block";
        fb.className = "predict-feedback " + (isRight ? "correct" : "revealed");
        fb.innerHTML = (isRight ? "<b>Spot on!</b> " : "<b>Good thought! Here is the physical principle:</b> ") + (pred.explanation || "");
      });
    }
    if(btnSkipPred && pred){
      btnSkipPred.addEventListener("click", function(){
        var fb = document.getElementById("predict-feedback-box");
        fb.style.display = "block";
        fb.className = "predict-feedback revealed";
        fb.innerHTML = "<b>Key Principle:</b> " + (pred.explanation || "");
      });
    }

    // Attach Timeline Controls for legacy SIMS
    var btnPP = document.getElementById("btn-play-pause");
    if(btnPP) btnPP.addEventListener("click", function(){ if(state.playing) pause(); else play(); });
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep) btnStep.addEventListener("click", function(){ step(0.5); });
    var btnResTime = document.getElementById("btn-reset-time");
    if(btnResTime) btnResTime.addEventListener("click", function(){ resetTimeline(); });
    var scrub = document.getElementById("time-scrubber");
    if(scrub) scrub.addEventListener("input", function(e){ seekTimeline(e.target.value); });

    // Footer Next/Prev listeners
    var btnPrev = document.getElementById("btn-prev-concept");
    var btnNext = document.getElementById("btn-next-concept");
    var btnRev = document.getElementById("btn-goto-revision");
    if(btnPrev) btnPrev.addEventListener("click", function(){ renderConcept(idx - 1); window.scrollTo(0,0); });
    if(btnNext) btnNext.addEventListener("click", function(){ renderConcept(idx + 1); window.scrollTo(0,0); });
    if(btnRev) btnRev.addEventListener("click", function(){ renderRevision(); window.scrollTo(0,0); });

    // Mount Active Simulation Engine
    var simMount = document.getElementById("sim-mount-point");
    if(simMount){
      var cKey = "c" + (idx + 1);
      var conceptId = l.id || ("concept-" + (idx + 1));
      var simId = l.sim || conceptId;

      // 1. window.mountSimulation (iemh101, iemh102)
      if(typeof window.mountSimulation === 'function'){
        simMount.innerHTML = "";
        window.mountSimulation(cKey, simMount);
      }
      // 2. window.SIM_ENGINES (iemh101-iemh105)
      else if(window.SIM_ENGINES && window.SIM_ENGINES[cKey] && typeof window.SIM_ENGINES[cKey].init === 'function'){
        simMount.innerHTML = "";
        window.SIM_ENGINES[cKey].init(simMount);
      }
      // 3. window.SimEngine (iemh106-iemh108)
      else if(window.SimEngine && typeof window.SimEngine.init === 'function'){
        var targetKey = null;
        var candidateKeys = [conceptId, "sim-" + conceptId, "sim-concept-" + (idx + 1), "concept-" + (idx + 1), simId, cKey];
        for(var k = 0; k < candidateKeys.length; k++){
          if(candidateKeys[k] && window.SimEngine.getEngine(candidateKeys[k])){
            targetKey = candidateKeys[k];
            break;
          }
        }
        if(targetKey){
          simMount.innerHTML = "";
          window.SimEngine.init(targetKey, simMount);
        }
      }
      // 4. window.SIMS (iesc101-iesc113)
      else if(window.SIMS && (window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey])){
        var simObj = window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey];
        if(typeof simObj.mount === 'function'){
          if(simObj.mount.length >= 1 && !simObj.draw){
            simMount.innerHTML = "";
            simObj.mount(simMount);
          } else {
            simObj.mount(l);
          }
        }
      }
    }

    // Render Quiz for current level
    renderQuiz();

    // Attach Practice Level Tabs
    var lvlTabs = document.querySelectorAll(".level-tab");
    lvlTabs.forEach(function(tab){
      tab.addEventListener("click", function(){
        lvlTabs.forEach(function(t){ t.classList.remove("active"); });
        tab.classList.add("active");
        state.level = Number(tab.getAttribute("data-lvl"));
        renderQuiz();
      });
    });

    // Update URL hash
    window.location.hash = "#concept-" + (idx + 1);
  }

  // --- Render Quiz ---
  function renderQuiz(){
    var lessons = C.lessons || C.concepts || [];
    var l = lessons[state.conceptIndex];
    if(!l) return;
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(!quizzes.length) return;
    var q = quizzes[state.level] || quizzes[0];
    if(!q) return;

    var qk = qKey(state.conceptIndex, state.level);
    var old = state.answers[qk] || {};

    var box = document.getElementById("quiz-container");
    if(!box) return;

    var promptText = q.prompt || q.question || "";
    var isMcq = q.type === "mcq" || (q.options && q.options.length > 0);
    var correctAns = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : 0);
    var solutionText = q.solution || q.explanation || "";
    var hintText = q.hint || "Review the key relationships in the concept overview above.";

    var html = '<div class="question-prompt">' + promptText + '</div>';
    if(isMcq && q.options){
      html += '<div class="quiz-options">' +
        q.options.map(function(opt, oi){
          var checked = old.value === String(oi) ? " checked" : "";
          return '<label class="quiz-option"><input type="radio" name="quiz_ans" value="' + oi + '"' + checked + '><span>' + opt + '</span></label>';
        }).join("") +
        '</div>';
    } else {
      html += '<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">' +
        '<input type="number" step="any" id="quiz_num_ans" placeholder="Your answer" value="' + (old.value || "") + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;width:160px;">' +
        '<span style="font-weight:600;color:var(--muted);">' + (q.unit || "") + '</span>' +
        '</div>';
    }

    html += '<div class="quiz-actions">' +
      '<button class="btn-primary" id="btn-submit-quiz">Submit Answer</button>' +
      '<button class="btn-secondary" id="btn-toggle-hint">Show Hint</button>' +
      '</div>' +
      '<div id="quiz-hint-box" class="quiz-hint" style="display:none;">' + hintText + '</div>' +
      '<div id="quiz-feedback-box" class="quiz-feedback" style="display:none;"></div>';

    box.innerHTML = html;

    // Hint toggle
    var hintBtn = document.getElementById("btn-toggle-hint");
    if(hintBtn){
      hintBtn.addEventListener("click", function(){
        var hb = document.getElementById("quiz-hint-box");
        if(hb) hb.style.display = hb.style.display === "none" ? "block" : "none";
      });
    }

    // Submit listener
    var submitBtn = document.getElementById("btn-submit-quiz");
    if(submitBtn){
      submitBtn.addEventListener("click", function(){
        var fb = document.getElementById("quiz-feedback-box");
        if(!fb) return;
        var isRight = false;
        var userVal = "";

        if(isMcq){
          var sel = document.querySelector('input[name="quiz_ans"]:checked');
          if(!sel){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please select an answer choice first.";
            return;
          }
          userVal = sel.value;
          isRight = Number(userVal) === Number(correctAns);
        } else {
          var inp = document.getElementById("quiz_num_ans");
          if(!inp || inp.value.trim() === ""){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please enter a numerical answer.";
            return;
          }
          userVal = inp.value.trim();
          var num = parseFloat(userVal);
          isRight = Math.abs(num - parseFloat(correctAns)) <= (q.tolerance || 0.05);
        }

        state.answers[qk] = { value: userVal, checked: true };
        if(isRight){
          state.correct[qk] = true;
          fb.style.display = "block";
          fb.className = "quiz-feedback success";
          fb.innerHTML = "<b>That’s right!</b> " + solutionText;
        } else {
          fb.style.display = "block";
          fb.className = "quiz-feedback retry";
          var wrongMsg = (isMcq && q.wrong && q.wrong[Number(userVal)]) ? q.wrong[Number(userVal)] : hintText;
          fb.innerHTML = "<b>Not quite.</b> " + wrongMsg + "<br><small style=\"margin-top:6px;display:block;\"><b>Full explanation:</b> " + solutionText + "</small>";
        }
        updateProgress();
      });
    }

    if(old.checked && submitBtn){
      submitBtn.click();
    }
  }

  // --- Render Revision View ---
  var currentExFilter = -1;

  function renderRevision(){
    pause();
    document.querySelectorAll(".concept-nav").forEach(function(b){ b.classList.remove("active"); });
    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.classList.add("active");

    var chNum = C.chapterNumber || (C.code ? C.code.replace(/\D/g, '') : "01");
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · NCERT EXERCISES & REVISION";

    var cView = document.getElementById("concept-view");
    var revView = document.getElementById("revision-view");
    if(cView) cView.style.display = "none";
    if(revView) revView.style.display = "block";

    var exList = C.exercises || [];
    if(!exList.length && C.exerciseMap){
      exList = C.exerciseMap.map(function(m){
        return {
          q: m[0],
          number: String(m[0]),
          title: m[1],
          conceptIdx: m[2],
          page: m[3],
          printPage: 47 + m[3],
          question: m[4] || m[1],
          steps: [m[5] || "Refer to concept explanation."],
          answer: m[5] || ""
        };
      });
    }

    var totalEx = exList.length;
    var html = '<div class="concept-header">' +
      '<span class="concept-badge">NCERT EXERCISE COMPENDIUM</span>' +
      '<h1 class="concept-title">Revise, Reflect, Refine</h1>' +
      '<p class="concept-deck">All ' + totalEx + ' exercises from NCERT Class 11 Physics with comprehensive step-by-step pedagogical solutions.</p>' +
      '</div>';

    // Filter Bar & Expand/Collapse All
    var lessons = C.lessons || C.concepts || [];
    html += '<div class="exercise-compendium-header">' +
      '<div class="exercise-filter-bar">' +
      '<button class="filter-chip ' + (currentExFilter === -1 ? 'active' : '') + '" data-cfilter="-1">All Exercises (' + totalEx + ')</button>' +
      lessons.map(function(l, li){
        var nav = l.nav || l.navTitle || l.title || ("C0" + (li+1));
        return '<button class="filter-chip ' + (currentExFilter === li ? 'active' : '') + '" data-cfilter="' + li + '">C0' + (li+1) + ': ' + nav + '</button>';
      }).join("") +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn-secondary" id="btn-expand-all" style="padding:6px 12px;font-size:13px;">Expand All Guidance</button>' +
      '<button class="btn-secondary" id="btn-collapse-all" style="padding:6px 12px;font-size:13px;">Collapse All</button>' +
      '</div>' +
      '</div>';

    // Exercise Cards List
    html += '<div id="exercise-cards-container">';
    var filtered = currentExFilter === -1 ? exList : exList.filter(function(e){
      return e.conceptIdx === currentExFilter || (e.section && e.section.includes(String(currentExFilter + 1)));
    });

    html += filtered.map(function(ex, eIdx){
      var qNum = ex.number || ex.q || (eIdx + 1);
      var sectionLabel = ex.section ? ('<span class="q-badge" style="background:#e0f2fe;color:#0369a1;margin-right:6px;">' + ex.section + '</span>') : '';
      var l = (ex.conceptIdx !== undefined && lessons[ex.conceptIdx]) ? lessons[ex.conceptIdx] : null;
      var conceptLink = l ? ('<a href="#concept-' + (ex.conceptIdx + 1) + '" class="q-concept-link" data-idx="' + ex.conceptIdx + '">Explore in Concept ' + ("0" + (ex.conceptIdx + 1)).slice(-2) + ' (' + (l.nav || l.navTitle || l.title) + ') ↗</a>') : '';

      var guidanceHtml = "";
      if(ex.guidance){
        if(typeof ex.guidance === 'string'){
          guidanceHtml = ex.guidance;
        } else if(Array.isArray(ex.guidance)){
          guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
            (ex.answer ? '<p><strong>Answer:</strong> ' + ex.answer + '</p>' : '') +
            '<ol>' + ex.guidance.map(function(g){ return '<li>' + g + '</li>'; }).join('') + '</ol></div>';
        }
      } else if(ex.steps && ex.steps.length){
        guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
          (ex.given ? '<div class="given-data"><b>Given:</b> ' + ex.given + '</div>' : '') +
          '<ol class="solution-steps">' + ex.steps.map(function(st){ return '<li>' + st + '</li>'; }).join('') + '</ol>' +
          (ex.answer ? '<div class="answer-box"><b>Final Answer:</b> ' + ex.answer + '</div>' : '') +
          '</div>';
      }
      if(!guidanceHtml && (ex.solution || ex.approach || ex.answer)){
        var approachHtml = ex.approach
          ? '<p class="solution-approach"><strong>Approach:</strong> ' +
            String(ex.approach).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') +
            '</p>'
          : '';
        var solutionHtml = ex.solution
          ? '<div class="solution-body">' + ex.solution + '</div>'
          : '';
        var answerHtml = (ex.answer && !ex.solution)
          ? '<div class="answer-box"><b>Final Answer:</b> ' + ex.answer + '</div>'
          : '';
        guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
          approachHtml + solutionHtml + answerHtml + '</div>';
      }

      return '<article class="exercise-card" id="exercise-q' + qNum + '">' +
        '<div class="exercise-card-meta">' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
        sectionLabel +
        '<span class="q-badge">QUESTION ' + qNum + '</span>' +
        '</div>' +
        conceptLink +
        '</div>' +
        
        '<div class="exercise-question-text" style="font-size:15px;line-height:1.6;margin:12px 0;white-space:pre-wrap;">' + (ex.question || ex.title || "") + '</div>' +
        
        '<details class="exercise-drawer">' +
        '<summary class="exercise-drawer-btn">📖 View Step-by-Step Guidance & Full Solution</summary>' +
        '<div class="exercise-solution-body" style="padding:14px;background:#f8fafc;border-radius:8px;margin-top:8px;">' +
        guidanceHtml +
        '</div>' +
        '</details>' +
        '</article>';
    }).join("");

    html += '</div>';

    revView.innerHTML = html;

    // Attach Filter Listeners
    revView.querySelectorAll(".filter-chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        currentExFilter = Number(chip.getAttribute("data-cfilter"));
        renderRevision();
      });
    });

    // Attach Expand/Collapse All Listeners
    var btnExp = document.getElementById("btn-expand-all");
    var btnCol = document.getElementById("btn-collapse-all");
    if(btnExp){
      btnExp.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = true; });
      });
    }
    if(btnCol){
      btnCol.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = false; });
      });
    }

    // Concept Navigation Links
    revView.querySelectorAll(".q-concept-link").forEach(function(a){
      a.addEventListener("click", function(e){
        e.preventDefault();
        var cIdx = Number(a.getAttribute("data-idx"));
        renderConcept(cIdx);
        window.scrollTo(0, 0);
      });
    });

    window.location.hash = "#revision";
  }

  // --- Build Sidebar Nav ---
  function buildSidebar(){
    var navContainer = document.getElementById("sidebar-nav");
    if(!navContainer) return;
    var lessons = C.lessons || C.concepts || [];
    navContainer.innerHTML = lessons.map(function(l, i){
      var nav = l.nav || l.navTitle || l.title || ("Concept " + (i + 1));
      return '<button class="concept-nav" data-cidx="' + i + '">' +
        '<span class="num">' + ("0" + (i + 1)).slice(-2) + '</span>' +
        '<span>' + nav + '</span>' +
        '</button>';
    }).join("");

    navContainer.querySelectorAll(".concept-nav").forEach(function(b){
      b.addEventListener("click", function(){
        var idx = Number(b.getAttribute("data-cidx"));
        renderConcept(idx);
      });
    });

    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.addEventListener("click", renderRevision);
  }

  // --- Reset Progress Button ---
  var resetProgBtn = document.getElementById("btn-reset-progress");
  if(resetProgBtn){
    resetProgBtn.addEventListener("click", function(){
      if(confirm("Reset all quiz answers and mastery progress for this chapter?")){
        state.answers = {};
        state.correct = {};
        saveStorage();
        updateProgress();
        renderQuiz();
      }
    });
  }

  // --- Handle Video Facades (No preloaded iframes) ---
  document.addEventListener("click", function(e){
    var btn = e.target.closest(".video-facade");
    if(btn){
      var vid = btn.getAttribute("data-yt");
      var parent = btn.parentElement;
      if(parent && vid){
        parent.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&rel=0" title="Video Lesson" style="width:100%;aspect-ratio:16/9;border:none;border-radius:8px;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
      }
    }
  });

  // --- URL Routing ---
  function routeFromHash(){
    var hash = window.location.hash;
    var lessons = C.lessons || C.concepts || [];
    if(hash === "#revision"){
      renderRevision();
    } else if(/^#concept-\d+$/.test(hash)){
      var cNum = parseInt(hash.replace("#concept-", ""), 10);
      if(cNum >= 1 && cNum <= lessons.length){
        renderConcept(cNum - 1);
        return;
      }
      renderConcept(0);
    } else {
      renderConcept(0);
    }
  }
  window.addEventListener("hashchange", routeFromHash);

  window.App = {
    state: state,
    play: play,
    pause: pause,
    step: step,
    resetTimeline: resetTimeline,
    seekTimeline: seekTimeline,
    renderConcept: renderConcept,
    renderRevision: renderRevision,
    routeFromHash: routeFromHash
  };
  if (typeof globalThis !== "undefined") {
    globalThis.App = window.App;
  }

  // Initialize
  initStorage();
  buildSidebar();
  updateProgress();
  routeFromHash();
})();

</script>
<script>
var App = window.App;
window.SIMS = {};

function setActivePreset(btn){
  document.querySelectorAll(".preset-btn").forEach(function(b){ b.classList.remove("active"); });
  if(btn) btn.classList.add("active");
}
function svgEl(){ return document.getElementById("diagram"); }
function readout(html){ var n = document.getElementById("lab-readout"); if(n) n.innerHTML = html; }
function verdict(html){ var n = document.getElementById("lab-verdict"); if(n) n.innerHTML = html; }
function cell(label, val, color){
  return '<div class="telemetry-cell"><div class="telemetry-label">' + label + '</div><div class="telemetry-val"' +
    (color ? ' style="color:' + color + '"' : '') + '>' + val + '</div></div>';
}

// -------------------------------------------------------------------------
// 1. SIMULATION 1: Lewis Electron Dot & Formal Charge Lab (lewisdot)
// -------------------------------------------------------------------------
window.SIMS.lewisdot = (function(){
  var currentMol = "co3"; // "co3", "o3", "hno3", "co"
  var selectedAtomIdx = 0;

  var molecules = {
    "co3": {
      name: "Carbonate Ion (CO₃²⁻)",
      totalE: 24,
      atoms: [
        { sym: "C", v: 4, l: 0, s: 8, label: "Central Carbon", x: 450, y: 250, color: "#38bdf8" },
        { sym: "O(1)", v: 6, l: 4, s: 4, label: "Carbonyl Oxygen (=O)", x: 450, y: 130, color: "#ef4444" },
        { sym: "O(2)", v: 6, l: 6, s: 2, label: "Negative Oxygen (—O⁻)", x: 330, y: 320, color: "#f59e0b" },
        { sym: "O(3)", v: 6, l: 6, s: 2, label: "Negative Oxygen (—O⁻)", x: 570, y: 320, color: "#f59e0b" }
      ],
      bonds: [
        { from: 0, to: 1, type: "double" },
        { from: 0, to: 2, type: "single" },
        { from: 0, to: 3, type: "single" }
      ],
      notes: "Resonance hybrid of 3 equivalent forms; net charge = -2; C-O bond order = 4/3 = 1.33."
    },
    "o3": {
      name: "Ozone (O₃)",
      totalE: 18,
      atoms: [
        { sym: "O(central)", v: 6, l: 2, s: 6, label: "Central Oxygen", x: 450, y: 200, color: "#38bdf8" },
        { sym: "O(left)", v: 6, l: 4, s: 4, label: "Double-bonded Oxygen", x: 340, y: 290, color: "#ef4444" },
        { sym: "O(right)", v: 6, l: 6, s: 2, label: "Single-bonded Oxygen", x: 560, y: 290, color: "#f59e0b" }
      ],
      bonds: [
        { from: 0, to: 1, type: "double" },
        { from: 0, to: 2, type: "single" }
      ],
      notes: "Central O formal charge = +1; single-bonded O = -1; double-bonded O = 0. Net charge = 0."
    },
    "hno3": {
      name: "Nitric Acid (HNO₃)",
      totalE: 24,
      atoms: [
        { sym: "N", v: 5, l: 0, s: 8, label: "Central Nitrogen", x: 450, y: 240, color: "#38bdf8" },
        { sym: "O(carbonyl)", v: 6, l: 4, s: 4, label: "Terminal Double O", x: 450, y: 120, color: "#ef4444" },
        { sym: "O(coordinate)", v: 6, l: 6, s: 2, label: "Terminal Single O⁻", x: 570, y: 310, color: "#f59e0b" },
        { sym: "O(hydroxyl)", v: 6, l: 4, s: 4, label: "Hydroxyl Oxygen", x: 330, y: 310, color: "#10b981" },
        { sym: "H", v: 1, l: 0, s: 2, label: "Hydrogen", x: 230, y: 310, color: "#e2e8f0" }
      ],
      bonds: [
        { from: 0, to: 1, type: "double" },
        { from: 0, to: 2, type: "single" },
        { from: 0, to: 3, type: "single" },
        { from: 3, to: 4, type: "single" }
      ],
      notes: "N has FC = +1; coordinate O has FC = -1; OH and carbonyl O have FC = 0."
    },
    "co": {
      name: "Carbon Monoxide (CO)",
      totalE: 10,
      atoms: [
        { sym: "C", v: 4, l: 2, s: 6, label: "Carbon Atom", x: 380, y: 250, color: "#f59e0b" },
        { sym: "O", v: 6, l: 2, s: 6, label: "Oxygen Atom", x: 520, y: 250, color: "#38bdf8" }
      ],
      bonds: [
        { from: 0, to: 1, type: "triple" }
      ],
      notes: "C has FC = 4 - 2 - 3 = -1; O has FC = 6 - 2 - 3 = +1. Triple bond with coordinate pair from O to C."
    }
  };

  function mount(){
    App.state.maxT = 5;
    var s = document.getElementById("time-scrubber"); if(s) s.max = 5;
    document.getElementById("lab-legend").innerHTML =
      '<div class="legend-item"><span class="legend-dot" style="background:#38bdf8;"></span><span>Central / Positive Atom</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b;"></span><span>Negative Formal Charge</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#ef4444;"></span><span>Zero Formal Charge</span></div>';

    document.getElementById("preset-bar").innerHTML =
      '<button class="preset-btn active" id="p-co3">Carbonate CO₃²⁻</button>' +
      '<button class="preset-btn" id="p-o3">Ozone O₃</button>' +
      '<button class="preset-btn" id="p-hno3">Nitric Acid HNO₃</button>' +
      '<button class="preset-btn" id="p-co">Carbon Monoxide CO</button>';

    document.getElementById("p-co3").onclick = function(){ setActivePreset(this); currentMol = "co3"; selectedAtomIdx = 0; draw(0); };
    document.getElementById("p-o3").onclick = function(){ setActivePreset(this); currentMol = "o3"; selectedAtomIdx = 0; draw(0); };
    document.getElementById("p-hno3").onclick = function(){ setActivePreset(this); currentMol = "hno3"; selectedAtomIdx = 0; draw(0); };
    document.getElementById("p-co").onclick = function(){ setActivePreset(this); currentMol = "co"; selectedAtomIdx = 0; draw(0); };

    document.getElementById("lab-controls").innerHTML =
      '<div class="control-group" style="grid-column:span 2;">' +
        '<label>Select Target Atom to Calculate Formal Charge:</label>' +
        '<select id="atom-select" style="padding:8px;border-radius:8px;background:#1e293b;color:#fff;border:1px solid #334155;font-size:14px;"></select>' +
      '</div>';

    updateAtomDropdown();
    draw(0);
  }

  function updateAtomDropdown(){
    var sel = document.getElementById("atom-select");
    if(!sel) return;
    var mol = molecules[currentMol];
    var html = "";
    mol.atoms.forEach(function(a, idx){
      html += '<option value="' + idx + '"' + (idx === selectedAtomIdx ? ' selected' : '') + '>' + a.sym + ' — ' + a.label + '</option>';
    });
    sel.innerHTML = html;
    sel.onchange = function(){
      selectedAtomIdx = parseInt(this.value, 10);
      draw(0);
    };
  }

  function draw(t){
    var svg = svgEl(); if(!svg) return;
    var mol = molecules[currentMol];
    var atom = mol.atoms[selectedAtomIdx] || mol.atoms[0];

    // Compute formal charge
    var fc = atom.v - atom.l - (atom.s / 2);
    var fcStr = (fc > 0 ? "+" + fc : fc.toString());

    var out = '<rect width="900" height="500" fill="#0b1120"/>';

    // Title and formula
    out += '<text x="450" y="40" fill="#f8fafc" font-size="19" font-weight="700" text-anchor="middle">' + mol.name + ' — Lewis Octet & Formal Charge</text>';
    out += '<text x="450" y="70" fill="#94a3b8" font-size="13" text-anchor="middle">Total Valence Electrons = ' + mol.totalE + ' e⁻ (' + (mol.totalE/2) + ' pairs) | Click any atom or dropdown to inspect</text>';

    // Draw bonds
    mol.bonds.forEach(function(b){
      var a1 = mol.atoms[b.from];
      var a2 = mol.atoms[b.to];
      var dx = a2.x - a1.x;
      var dy = a2.y - a1.y;
      var len = Math.sqrt(dx*dx + dy*dy);
      var nx = -dy / len;
      var ny = dx / len;

      if(b.type === "single"){
        out += '<line x1="' + a1.x + '" y1="' + a1.y + '" x2="' + a2.x + '" y2="' + a2.y + '" stroke="#64748b" stroke-width="4"/>';
      } else if(b.type === "double"){
        out += '<line x1="' + (a1.x + nx*4) + '" y1="' + (a1.y + ny*4) + '" x2="' + (a2.x + nx*4) + '" y2="' + (a2.y + ny*4) + '" stroke="#38bdf8" stroke-width="3.5"/>';
        out += '<line x1="' + (a1.x - nx*4) + '" y1="' + (a1.y - ny*4) + '" x2="' + (a2.x - nx*4) + '" y2="' + (a2.y - ny*4) + '" stroke="#38bdf8" stroke-width="3.5"/>';
      } else if(b.type === "triple"){
        out += '<line x1="' + a1.x + '" y1="' + a1.y + '" x2="' + a2.x + '" y2="' + a2.y + '" stroke="#f59e0b" stroke-width="3"/>';
        out += '<line x1="' + (a1.x + nx*7) + '" y1="' + (a1.y + ny*7) + '" x2="' + (a2.x + nx*7) + '" y2="' + (a2.y + ny*7) + '" stroke="#f59e0b" stroke-width="3"/>';
        out += '<line x1="' + (a1.x - nx*7) + '" y1="' + (a1.y - ny*7) + '" x2="' + (a2.x - nx*7) + '" y2="' + (a2.y - ny*7) + '" stroke="#f59e0b" stroke-width="3"/>';
      }
    });

    // Draw atoms
    mol.atoms.forEach(function(a, idx){
      var isSel = (idx === selectedAtomIdx);
      var r = isSel ? 36 : 30;
      var strokeColor = isSel ? "#38bdf8" : "#475569";
      var strokeWidth = isSel ? 4 : 2;

      out += '<circle cx="' + a.x + '" cy="' + a.y + '" r="' + r + '" fill="#1e293b" stroke="' + strokeColor + '" stroke-width="' + strokeWidth + '" style="cursor:pointer;" onclick="SIMS.lewisdot.selectAtom(' + idx + ')"/>';
      out += '<text x="' + a.x + '" y="' + (a.y + 7) + '" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" pointer-events="none">' + a.sym.split("(")[0] + '</text>';

      // Lone pairs visual indicator
      var lpCount = a.l / 2;
      for(var k = 0; k < lpCount; k++){
        var ang = (k * Math.PI / 2) + 0.3;
        var lx = a.x + (r + 10) * Math.cos(ang);
        var ly = a.y + (r + 10) * Math.sin(ang);
        out += '<circle cx="' + (lx - 3) + '" cy="' + ly + '" r="2.5" fill="#e2e8f0"/>';
        out += '<circle cx="' + (lx + 3) + '" cy="' + ly + '" r="2.5" fill="#e2e8f0"/>';
      }

      // Formal charge badge
      var thisFc = a.v - a.l - (a.s / 2);
      var badgeColor = thisFc === 0 ? "#64748b" : (thisFc > 0 ? "#38bdf8" : "#f59e0b");
      out += '<rect x="' + (a.x + 18) + '" y="' + (a.y - 32) + '" width="28" height="18" rx="4" fill="' + badgeColor + '"/>';
      out += '<text x="' + (a.x + 32) + '" y="' + (a.y - 19) + '" fill="#0f172a" font-size="11" font-weight="900" text-anchor="middle">' + (thisFc > 0 ? "+" + thisFc : thisFc) + '</text>';
    });

    // Formal charge formula display box
    out += '<g transform="translate(100, 390)">';
    out += '<rect width="700" height="90" rx="10" fill="#1e293b" stroke="#334155"/>';
    out += '<text x="20" y="30" fill="#38bdf8" font-size="15" font-weight="bold">Formal Charge Formula: FC = V − L − (1/2)·S</text>';
    out += '<text x="20" y="55" fill="#f8fafc" font-size="14">Selected: <tspan fill="#f59e0b" font-weight="bold">' + atom.sym + ' (' + atom.label + ')</tspan> → V = ' + atom.v + ', Lone Pair Electrons (L) = ' + atom.l + ', Shared Bonding Electrons (S) = ' + atom.s + '</text>';
    out += '<text x="20" y="76" fill="#10b981" font-size="15" font-weight="bold">Calculation: FC = ' + atom.v + ' − ' + atom.l + ' − (' + atom.s + '/2) = ' + atom.v + ' − ' + atom.l + ' − ' + (atom.s/2) + ' = ' + fcStr + '</text>';
    out += '</g>';

    svg.innerHTML = out;

    readout(
      cell("Target Atom", atom.sym + " (" + atom.label + ")", "#38bdf8") +
      cell("Valence (V)", atom.v + " e⁻", "#f8fafc") +
      cell("Non-bonding (L)", atom.l + " e⁻", "#f59e0b") +
      cell("Shared (S)", atom.s + " e⁻", "#e2e8f0") +
      cell("Formal Charge", fcStr, fc === 0 ? "#10b981" : (fc > 0 ? "#38bdf8" : "#f59e0b"))
    );

    verdict(
      '<div class="callout" style="background:#0f172a;border-left:4px solid #38bdf8;padding:12px;border-radius:6px;">' +
        '<strong>Lewis Structure Principle:</strong> Formal charge represents the difference between valence electrons in an isolated atom and the electron count assigned in a Lewis structure. ' +
        mol.notes +
      '</div>'
    );
  }

  function selectAtom(idx){
    selectedAtomIdx = idx;
    var sel = document.getElementById("atom-select");
    if(sel) sel.value = idx;
    draw(0);
  }

  return { mount: mount, draw: draw, selectAtom: selectAtom };
})();

// 2. SIMULATION 2: Born-Haber Cycle & Lattice Enthalpy Lab (bornhaber)
// -------------------------------------------------------------------------
window.SIMS.bornhaber = (function(){
  var currentSalt = "nacl"; // "nacl", "mgo", "cacl2"
  var currentStep = 5; // 0..5

  var salts = {
    "nacl": {
      name: "Sodium Chloride (NaCl)",
      delta_f: -411.2,
      sub: 108.4,
      diss: 121.0, // 1/2 of 242
      ie: 495.8,
      ea: -348.6,
      ul: -787.8, // Lattice enthalpy (released upon formation)
      metal: "Na", nonmetal: "Cl", solid: "NaCl(s)",
      gas_ions: "Na⁺(g) + Cl⁻(g)"
    },
    "mgo": {
      name: "Magnesium Oxide (MgO)",
      delta_f: -601.7,
      sub: 148.0,
      diss: 249.0, // 1/2 of 498
      ie: 2188.0, // IE1 + IE2
      ea: 657.0, // EA1 + EA2 (net endothermic for O²⁻)
      ul: -3843.7,
      metal: "Mg", nonmetal: "O", solid: "MgO(s)",
      gas_ions: "Mg²⁺(g) + O²⁻(g)"
    },
    "cacl2": {
      name: "Calcium Chloride (CaCl₂)",
      delta_f: -795.8,
      sub: 178.2,
      diss: 242.0, // 1 * 242 for Cl2
      ie: 1735.0, // IE1 + IE2
      ea: -697.2, // 2 * -348.6
      ul: -2253.8,
      metal: "Ca", nonmetal: "Cl₂", solid: "CaCl₂(s)",
      gas_ions: "Ca²⁺(g) + 2Cl⁻(g)"
    }
  };

  function mount(){
    App.state.maxT = 5;
    var s = document.getElementById("time-scrubber"); if(s) s.max = 5;
    document.getElementById("lab-legend").innerHTML =
      '<div class="legend-item"><span class="legend-dot" style="background:#10b981;"></span><span>Standard Enthalpy of Formation Δ_f H°</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#ef4444;"></span><span>Endothermic Steps (+ΔH)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#38bdf8;"></span><span>Lattice Enthalpy U_L</span></div>';

    document.getElementById("preset-bar").innerHTML =
      '<button class="preset-btn active" id="p-nacl">NaCl (Rock Salt, U = −788 kJ/mol)</button>' +
      '<button class="preset-btn" id="p-mgo">MgO (Divalent Oxide, U = −3844 kJ/mol)</button>' +
      '<button class="preset-btn" id="p-cacl2">CaCl₂ (Divalent Cation, U = −2254 kJ/mol)</button>';

    document.getElementById("p-nacl").onclick = function(){ setActivePreset(this); currentSalt = "nacl"; currentStep = 5; draw(0); };
    document.getElementById("p-mgo").onclick = function(){ setActivePreset(this); currentSalt = "mgo"; currentStep = 5; draw(0); };
    document.getElementById("p-cacl2").onclick = function(){ setActivePreset(this); currentSalt = "cacl2"; currentStep = 5; draw(0); };

    document.getElementById("lab-controls").innerHTML =
      '<div class="control-group">' +
        '<label>Cycle Stage Explorer (0 to 5):</label>' +
        '<input type="range" id="stage-range" min="0" max="5" value="5" step="1">' +
      '</div>' +
      '<div class="control-group">' +
        '<label>Direct Jump to Step:</label>' +
        '<div style="display:flex;gap:6px;margin-top:4px;">' +
          '<button class="btn btn-sm" onclick="SIMS.bornhaber.setStep(1)">Sublimation</button>' +
          '<button class="btn btn-sm" onclick="SIMS.bornhaber.setStep(3)">Ionization</button>' +
          '<button class="btn btn-sm" onclick="SIMS.bornhaber.setStep(5)">Full Cycle</button>' +
        '</div>' +
      '</div>';

    var rng = document.getElementById("stage-range");
    if(rng) rng.oninput = function(){ currentStep = parseInt(this.value, 10); draw(0); };
    draw(0);
  }

  function draw(t){
    var svg = svgEl(); if(!svg) return;
    var salt = salts[currentSalt];

    var out = '<rect width="900" height="500" fill="#0b1120"/>';
    out += '<text x="450" y="38" fill="#f8fafc" font-size="19" font-weight="bold" text-anchor="middle">' + salt.name + ' — Born-Haber Thermochemical Cycle</text>';

    // Energy ladder baseline
    // Levels:
    // Level 0: Elements in standard states: Na(s) + 1/2 Cl2(g) (y = 280)
    // Level -1: Product solid: NaCl(s) (y = 420) -> delta_f H
    // Level 1: Na(g) + 1/2 Cl2(g) (y = 240) -> +sub
    // Level 2: Na(g) + Cl(g) (y = 200) -> +diss
    // Level 3: Na+(g) + e- + Cl(g) (y = 100) -> +ie
    // Level 4: Na+(g) + Cl-(g) (y = 150) -> ea
    // From Level 4 down to Level -1 -> U_L (Lattice Enthalpy)

    var y0 = 280; // Standard state
    var yProd = 430; // Solid crystal
    var y1 = 235; // After sublimation
    var y2 = 195; // After dissociation
    var y3 = 85;  // After ionization (peak)
    var y4 = y3 + (salt.ea < 0 ? 55 : -25); // After electron gain

    // Baseline axis
    out += '<line x1="80" y1="460" x2="80" y2="60" stroke="#334155" stroke-width="2"/>';
    out += '<text x="75" y="70" fill="#94a3b8" font-size="12" text-anchor="end">Enthalpy (H)</text>';

    // Level 0: Elements
    out += '<line x1="120" y1="' + y0 + '" x2="360" y2="' + y0 + '" stroke="#94a3b8" stroke-width="4"/>';
    out += '<text x="240" y="' + (y0 - 8) + '" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">' + salt.metal + '(s) + ' + (salt.nonmetal === "Cl" ? "½Cl₂(g)" : salt.nonmetal + "(g)") + '</text>';

    // Direct formation arrow down to solid
    out += '<line x1="180" y1="' + y0 + '" x2="180" y2="' + yProd + '" stroke="#10b981" stroke-width="4" stroke-dasharray="' + (currentStep >= 5 ? 'none' : '4 4') + '"/>';
    out += '<polygon points="175,' + (yProd - 6) + ' 185,' + (yProd - 6) + ' 180,' + yProd + '" fill="#10b981"/>';
    out += '<text x="170" y="' + ((y0 + yProd)/2) + '" fill="#10b981" font-size="13" font-weight="bold" text-anchor="end">Δ_f H° = ' + salt.delta_f + ' kJ</text>';

    // Product level
    out += '<line x1="120" y1="' + yProd + '" x2="800" y2="' + yProd + '" stroke="#10b981" stroke-width="4"/>';
    out += '<text x="460" y="' + (yProd + 25) + '" fill="#10b981" font-size="15" font-weight="bold" text-anchor="middle">' + salt.solid + ' (Crystal Lattice)</text>';

    // Step 1: Sublimation
    if(currentStep >= 1){
      out += '<line x1="320" y1="' + y0 + '" x2="320" y2="' + y1 + '" stroke="#ef4444" stroke-width="3"/>';
      out += '<polygon points="316,' + (y1 + 6) + ' 324,' + (y1 + 6) + ' 320,' + y1 + '" fill="#ef4444"/>';
      out += '<line x1="300" y1="' + y1 + '" x2="480" y2="' + y1 + '" stroke="#ef4444" stroke-width="3"/>';
      out += '<text x="330" y="' + ((y0+y1)/2 + 4) + '" fill="#ef4444" font-size="11">Δ_sub H = +' + salt.sub + '</text>';
      out += '<text x="390" y="' + (y1 - 6) + '" fill="#f8fafc" font-size="12">' + salt.metal + '(g) + nonmetal</text>';
    }

    // Step 2: Dissociation
    if(currentStep >= 2){
      out += '<line x1="450" y1="' + y1 + '" x2="450" y2="' + y2 + '" stroke="#f59e0b" stroke-width="3"/>';
      out += '<polygon points="446,' + (y2 + 6) + ' 454,' + (y2 + 6) + ' 450,' + y2 + '" fill="#f59e0b"/>';
      out += '<line x1="430" y1="' + y2 + '" x2="600" y2="' + y2 + '" stroke="#f59e0b" stroke-width="3"/>';
      out += '<text x="460" y="' + ((y1+y2)/2 + 4) + '" fill="#f59e0b" font-size="11">½Δ_diss H = +' + salt.diss + '</text>';
    }

    // Step 3: Ionization
    if(currentStep >= 3){
      out += '<line x1="560" y1="' + y2 + '" x2="560" y2="' + y3 + '" stroke="#ec4899" stroke-width="3"/>';
      out += '<polygon points="556,' + (y3 + 6) + ' 564,' + (y3 + 6) + ' 560,' + y3 + '" fill="#ec4899"/>';
      out += '<line x1="530" y1="' + y3 + '" x2="720" y2="' + y3 + '" stroke="#ec4899" stroke-width="3"/>';
      out += '<text x="570" y="' + ((y2+y3)/2 + 4) + '" fill="#ec4899" font-size="11">Δ_i H = +' + salt.ie + '</text>';
    }

    // Step 4: Electron affinity
    if(currentStep >= 4){
      out += '<line x1="680" y1="' + y3 + '" x2="680" y2="' + y4 + '" stroke="#8b5cf6" stroke-width="3"/>';
      out += '<polygon points="676,' + (y4 - 6) + ' 684,' + (y4 - 6) + ' 680,' + y4 + '" fill="#8b5cf6"/>';
      out += '<line x1="640" y1="' + y4 + '" x2="800" y2="' + y4 + '" stroke="#8b5cf6" stroke-width="3"/>';
      out += '<text x="690" y="' + ((y3+y4)/2 + 4) + '" fill="#8b5cf6" font-size="11">Δ_eg H = ' + salt.ea + '</text>';
      out += '<text x="720" y="' + (y4 - 8) + '" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">' + salt.gas_ions + '</text>';
    }

    // Step 5: Lattice Enthalpy
    if(currentStep >= 5){
      out += '<line x1="770" y1="' + y4 + '" x2="770" y2="' + yProd + '" stroke="#38bdf8" stroke-width="4"/>';
      out += '<polygon points="765,' + (yProd - 8) + ' 775,' + (yProd - 8) + ' 770,' + yProd + '" fill="#38bdf8"/>';
      out += '<text x="780" y="' + ((y4+yProd)/2) + '" fill="#38bdf8" font-size="14" font-weight="bold">Lattice Enthalpy (U_L)<tspan x="780" dy="18" fill="#94a3b8" font-size="12">' + salt.ul + ' kJ/mol</tspan></text>';
    }

    svg.innerHTML = out;

    readout(
      cell("Substance", salt.name, "#38bdf8") +
      cell("Sublimation Δ_sub H", "+" + salt.sub + " kJ", "#ef4444") +
      cell("Dissociation ½Δ_d H", "+" + salt.diss + " kJ", "#f59e0b") +
      cell("Ionization Δ_i H", "+" + salt.ie + " kJ", "#ec4899") +
      cell("Electron Gain Δ_eg H", salt.ea + " kJ", "#8b5cf6") +
      cell("Lattice Enthalpy U_L", salt.ul + " kJ/mol", "#38bdf8")
    );

    verdict(
      '<div class="callout" style="background:#0f172a;border-left:4px solid #10b981;padding:12px;border-radius:6px;">' +
        '<strong>Hess&#39;s Law Verification:</strong> Δ_f H° = Δ_sub H + ½Δ_diss H + Δ_i H + Δ_eg H + U_L = ' +
        salt.sub + ' + ' + salt.diss + ' + ' + salt.ie + ' + (' + salt.ea + ') + (' + salt.ul + ') = <strong>' + salt.delta_f + ' kJ/mol</strong>. ' +
        'The massive negative lattice enthalpy proves that ionic stability arises from crystal formation, not isolated ion creation.' +
      '</div>'
    );
  }

  function setStep(s){
    currentStep = s;
    var rng = document.getElementById("stage-range");
    if(rng) rng.value = s;
    draw(0);
  }

  return { mount: mount, draw: draw, setStep: setStep };
})();

window.SIMS.dipolelab = (function(){
  var currentPreset = "nh3-nf3"; // "nh3-nf3", "co2-h2o"
  var userAngle = 104.5; // for bent comparison

  function mount(){
    App.state.maxT = 5;

    document.getElementById("lab-legend").innerHTML =
      '<div class="legend-item"><span class="legend-dot" style="background:#38bdf8;"></span><span>Individual Bond Dipoles</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b;"></span><span>Lone Pair Dipole</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#10b981;"></span><span>Net Resultant Vector (μ_net)</span></div>';

    document.getElementById("preset-bar").innerHTML =
      '<button class="preset-btn active" id="p-nh3-nf3">NH₃ vs NF₃ (Pyramidal Dipole Anomaly)</button>' +
      '<button class="preset-btn" id="p-co2-h2o">CO₂ vs H₂O (Linear 0 D vs Bent 1.85 D)</button>';

    document.getElementById("p-nh3-nf3").onclick = function(){ setActivePreset(this); currentPreset = "nh3-nf3"; draw(0); };
    document.getElementById("p-co2-h2o").onclick = function(){ setActivePreset(this); currentPreset = "co2-h2o"; draw(0); };

    document.getElementById("lab-controls").innerHTML =
      '<div class="control-group" style="grid-column:span 2;">' +
        '<label>Dynamic Bond Angle Bending (80° to 180°):</label>' +
        '<input type="range" id="angle-range" min="80" max="180" value="' + userAngle + '" step="0.5">' +
      '</div>';

    var rng = document.getElementById("angle-range");
    if(rng) rng.oninput = function(){ userAngle = parseFloat(this.value); draw(0); };
    draw(0);
  }

  function draw(t){
    var svg = svgEl(); if(!svg) return;
    var out = '<rect width="900" height="500" fill="#0b1120"/>';

    if(currentPreset === "nh3-nf3"){
      out += '<text x="450" y="36" fill="#f8fafc" font-size="19" font-weight="bold" text-anchor="middle">NH₃ vs NF₃ Dipole Moment Contrast</text>';
      out += '<text x="450" y="60" fill="#94a3b8" font-size="13" text-anchor="middle">Both pyramidal, but NH₃ (μ = 1.47 D) vastly exceeds NF₃ (μ = 0.24 D) due to vector alignment</text>';

      // Left: NH3
      out += '<g transform="translate(230, 240)">';
      out += '<rect x="-180" y="-140" width="360" height="280" rx="12" fill="#1e293b" stroke="#334155"/>';
      out += '<text x="0" y="-110" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">Ammonia (NH₃)</text>';
      out += '<text x="0" y="-88" fill="#10b981" font-size="16" font-weight="900" text-anchor="middle">μ = 1.47 D (Large)</text>';

      // N atom
      out += '<circle cx="0" cy="0" r="24" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>';
      out += '<text x="0" y="7" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">N</text>';

      // H atoms
      out += '<circle cx="-80" cy="70" r="14" fill="#475569"/><text x="-80" y="75" fill="#fff" font-size="12" text-anchor="middle">H</text>';
      out += '<circle cx="0" cy="85" r="14" fill="#475569"/><text x="0" y="90" fill="#fff" font-size="12" text-anchor="middle">H</text>';
      out += '<circle cx="80" cy="70" r="14" fill="#475569"/><text x="80" y="75" fill="#fff" font-size="12" text-anchor="middle">H</text>';

      // Bonds
      out += '<line x1="0" y1="0" x2="-80" y2="70" stroke="#64748b" stroke-width="3"/>';
      out += '<line x1="0" y1="0" x2="0" y2="85" stroke="#64748b" stroke-width="3"/>';
      out += '<line x1="0" y1="0" x2="80" y2="70" stroke="#64748b" stroke-width="3"/>';

      // N-H bond dipole arrows pointing UPWARD toward N (more electronegative)
      out += '<line x1="-55" y1="48" x2="-20" y2="18" stroke="#38bdf8" stroke-width="3"/>';
      out += '<polygon points="-20,18 -28,26 -21,28" fill="#38bdf8"/>';
      out += '<line x1="55" y1="48" x2="20" y2="18" stroke="#38bdf8" stroke-width="3"/>';
      out += '<polygon points="20,18 21,28 28,26" fill="#38bdf8"/>';

      // Lone pair dipole pointing UPWARD

      out += '<polygon points="0,-75 -5,-65 5,-65" fill="#f59e0b"/>';

      // Net resultant vector pointing strongly UPWARD
      out += '<line x1="120" y1="50" x2="120" y2="-60" stroke="#10b981" stroke-width="5"/>';
      out += '<polygon points="120,-68 113,-56 127,-56" fill="#10b981"/>';
      out += '<text x="120" y="-76" fill="#10b981" font-size="12" font-weight="bold" text-anchor="middle">μ_net</text>';
      out += '<text x="0" y="125" fill="#94a3b8" font-size="11" text-anchor="middle">Bond dipoles & lone pair REINFORCE</text>';
      out += '</g>';

      // Right: NF3
      out += '<g transform="translate(670, 240)">';
      out += '<rect x="-180" y="-140" width="360" height="280" rx="12" fill="#1e293b" stroke="#334155"/>';
      out += '<text x="0" y="-110" fill="#f59e0b" font-size="18" font-weight="bold" text-anchor="middle">Nitrogen Trifluoride (NF₃)</text>';
      out += '<text x="0" y="-88" fill="#f59e0b" font-size="16" font-weight="900" text-anchor="middle">μ = 0.24 D (Very Small)</text>';

      // N atom
      out += '<circle cx="0" cy="0" r="24" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>';
      out += '<text x="0" y="7" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">N</text>';

      // F atoms
      out += '<circle cx="-80" cy="70" r="16" fill="#ef4444"/><text x="-80" y="75" fill="#fff" font-size="12" text-anchor="middle">F</text>';
      out += '<circle cx="0" cy="85" r="16" fill="#ef4444"/><text x="0" y="90" fill="#fff" font-size="12" text-anchor="middle">F</text>';
      out += '<circle cx="80" cy="70" r="16" fill="#ef4444"/><text x="80" y="75" fill="#fff" font-size="12" text-anchor="middle">F</text>';

      // Bonds
      out += '<line x1="0" y1="0" x2="-80" y2="70" stroke="#64748b" stroke-width="3"/>';
      out += '<line x1="0" y1="0" x2="0" y2="85" stroke="#64748b" stroke-width="3"/>';
      out += '<line x1="0" y1="0" x2="80" y2="70" stroke="#64748b" stroke-width="3"/>';

      // N-F bond dipoles pointing DOWNWARD toward F (more electronegative)
      out += '<line x1="-20" y1="18" x2="-55" y2="48" stroke="#ef4444" stroke-width="3"/>';
      out += '<polygon points="-55,48 -46,42 -49,35" fill="#ef4444"/>';
      out += '<line x1="20" y1="18" x2="55" y2="48" stroke="#ef4444" stroke-width="3"/>';
      out += '<polygon points="55,48 49,35 46,42" fill="#ef4444"/>';

      // Lone pair dipole pointing UPWARD
      out += '<ellipse cx="0" cy="-45" rx="14" ry="22" fill="rgba(245, 158, 11, 0.25)" stroke="#f59e0b" stroke-width="2"/>';
      out += '<circle cx="-3" cy="-45" r="2.5" fill="#f59e0b"/><circle cx="3" cy="-45" r="2.5" fill="#f59e0b"/>';
      out += '<line x1="0" y1="-25" x2="0" y2="-75" stroke="#f59e0b" stroke-width="3"/>';
      out += '<polygon points="0,-75 -5,-65 5,-65" fill="#f59e0b"/>';

      // Net resultant vector is very short
      out += '<line x1="120" y1="10" x2="120" y2="-15" stroke="#f59e0b" stroke-width="3"/>';
      out += '<polygon points="120,-20 115,-10 125,-10" fill="#f59e0b"/>';
      out += '<text x="120" y="-28" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">μ_net</text>';
      out += '<text x="0" y="125" fill="#94a3b8" font-size="11" text-anchor="middle">Bond dipoles OPPOSE lone pair</text>';
      out += '</g>';

      readout(
        cell("Molecule 1", "Ammonia (NH₃)", "#38bdf8") +
        cell("NH₃ Net Dipole", "1.47 Debye", "#10b981") +
        cell("Molecule 2", "Nitrogen Trifluoride (NF₃)", "#f59e0b") +
        cell("NF₃ Net Dipole", "0.24 Debye", "#ef4444") +
        cell("Vector Interaction", "NH₃ reinforces / NF₃ opposes", "#f8fafc")
      );

      verdict(
        '<div class="callout" style="background:#0f172a;border-left:4px solid #38bdf8;padding:12px;border-radius:6px;">' +
          '<strong>Electronegativity Vector Analysis:</strong> In NH₃, N (3.0) is more electronegative than H (2.1), so bond dipoles and lone-pair dipole point in the same direction, adding constructively. In NF₃, F (4.0) is more electronegative than N (3.0), so bond dipoles oppose the lone pair dipole, leaving only a tiny residual dipole moment.' +
        '</div>'
      );
    } else {
      // CO2 vs H2O dynamic bending
      var rad = (userAngle * Math.PI) / 180;
      var bondLen = 120;
      var hx1 = -bondLen * Math.sin(rad / 2);
      var hy1 = bondLen * Math.cos(rad / 2);
      var hx2 = bondLen * Math.sin(rad / 2);
      var hy2 = bondLen * Math.cos(rad / 2);

      // μ_net = 2 * μ_bond * cos(θ/2)
      var muBond = 1.5;
      var muNet = (2 * muBond * Math.cos(rad / 2)).toFixed(2);

      out += '<text x="450" y="36" fill="#f8fafc" font-size="19" font-weight="bold" text-anchor="middle">Molecular Dipole vs Bond Angle θ</text>';
      out += '<text x="450" y="60" fill="#94a3b8" font-size="13" text-anchor="middle">Observe how linear geometry (180°) causes complete vector cancellation (CO₂ = 0 D) while bent geometry yields polarity</text>';

      out += '<g transform="translate(450, 240)">';
      out += '<circle cx="0" cy="0" r="28" fill="#ef4444" stroke="#f87171" stroke-width="3"/>';
      out += '<text x="0" y="8" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">Central</text>';

      out += '<circle cx="' + hx1 + '" cy="' + hy1 + '" r="18" fill="#38bdf8"/><text x="' + hx1 + '" y="' + (hy1 + 5) + '" fill="#fff" font-size="12" text-anchor="middle">X</text>';
      out += '<circle cx="' + hx2 + '" cy="' + hy2 + '" r="18" fill="#38bdf8"/><text x="' + hx2 + '" y="' + (hy2 + 5) + '" fill="#fff" font-size="12" text-anchor="middle">X</text>';

      out += '<line x1="0" y1="0" x2="' + hx1 + '" y2="' + hy1 + '" stroke="#64748b" stroke-width="4"/>';
      out += '<line x1="0" y1="0" x2="' + hx2 + '" y2="' + hy2 + '" stroke="#64748b" stroke-width="4"/>';

      // Angle arc
      out += '<path d="M ' + (hx1*0.3) + ' ' + (hy1*0.3) + ' A 36 36 0 0 0 ' + (hx2*0.3) + ' ' + (hy2*0.3) + '" fill="none" stroke="#f59e0b" stroke-width="2"/>';
      out += '<text x="0" y="' + (hy1*0.35 + 18) + '" fill="#f59e0b" font-size="14" font-weight="bold" text-anchor="middle">θ = ' + userAngle.toFixed(1) + '°</text>';

      // Resultant arrow
      if(userAngle < 179){
        var resLen = 60 * Math.cos(rad / 2);
        out += '<line x1="0" y1="0" x2="0" y2="' + (-resLen * 2) + '" stroke="#10b981" stroke-width="5"/>';
        out += '<polygon points="0,' + (-resLen * 2 - 8) + ' -7,' + (-resLen * 2 + 4) + ' 7,' + (-resLen * 2 + 4) + '" fill="#10b981"/>';
        out += '<text x="0" y="' + (-resLen * 2 - 16) + '" fill="#10b981" font-size="15" font-weight="bold" text-anchor="middle">μ_net = ' + muNet + ' D</text>';
      } else {
        out += '<text x="0" y="-40" fill="#10b981" font-size="16" font-weight="bold" text-anchor="middle">Linear: Vectors Cancel Strictly to μ = 0 D (CO₂ / BeF₂)</text>';
      }
      out += '</g>';

      readout(
        cell("Bond Angle (θ)", userAngle.toFixed(1) + "°", "#f59e0b") +
        cell("Vector Formula", "2 · μ_bond · cos(θ/2)", "#94a3b8") +
        cell("Net Dipole μ_net", muNet + " Debye", userAngle > 178 ? "#ef4444" : "#10b981") +
        cell("Real Analogue", userAngle > 175 ? "CO₂, BeCl₂ (Non-polar)" : "H₂O (104.5°, 1.85 D)", "#38bdf8")
      );

      verdict(
        '<div class="callout" style="background:#0f172a;border-left:4px solid #10b981;padding:12px;border-radius:6px;">' +
          '<strong>Linear vs Bent Geometry Proof:</strong> At 180°, the angle between the two bond dipole vectors is 180° so cos(90°) = 0, causing complete vector cancellation. This proves why CO₂ has zero dipole moment while bent H₂O (104.5°) has μ = 1.85 D.' +
        '</div>'
      );
    }

    svg.innerHTML = out;
  }

  return { mount: mount, draw: draw };
})();

        'In methane (0 lp), angle is 109.5°; in ammonia (1 lp), angle is compressed to 107.8°; in water (2 lp), lp-lp repulsion squashes the angle to 104.5°.' +
      '</div>'
    );
  }

  return { mount: mount, draw: draw };
})();

      '<button class="preset-btn active" id="p-sp">sp Hybridization (BeCl₂, C₂H₂)</button>' +
      '<button class="preset-btn" id="p-sp2">sp² Hybridization (BF₃, C₂H₄)</button>' +

      out += '<circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#64748b" stroke-width="2"/>';

      out += '<path d="M 0 0 C -70 -50, -160 -40, -180 0 C -160 40, -70 50, 0 0 Z" fill="rgba(56, 189, 248, 0.4)" stroke="#38bdf8" stroke-width="3"/>';
      out += '<text x="-100" y="7" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">+</text>';

      out += '<path d="M 0 0 C 70 -50, 160 -40, 180 0 C 160 40, 70 50, 0 0 Z" fill="rgba(16, 185, 129, 0.4)" stroke="#10b981" stroke-width="3"/>';

      readout(

        cell("Orbitals Mixed", "1s + 1p_x", "#f8fafc") +
        cell("Geometry", "Collinear / Linear", "#10b981") +
        cell("s-Character", "50.0%", "#f59e0b") +
        cell("Typical Angle", "180°", "#ef4444")
      );
    } else if(currentType === "sp2"){
      out += '<text x="450" y="38" fill="#f8fafc" font-size="19" font-weight="bold" text-anchor="middle">sp² Hybridization: Trigonal Planar (120°)</text>';
      out += '<text x="450" y="64" fill="#94a3b8" font-size="13" text-anchor="middle">Mixing 1s + 2p gives three equivalent sp² orbitals in a plane with 33.3% s-character</text>';

      out += '<g transform="translate(450, 250)">';
      var angs = [-Math.PI/2, Math.PI/6, 5*Math.PI/6];

        out += '<text x="80" y="6" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">+</text>';

      out += '<text x="0" y="55" fill="#f59e0b" font-size="16" font-weight="bold" text-anchor="middle">120° Planar</text>';
      out += '</g>';

      readout(
        cell("Hybrid Type", "sp² (Trigonal)", "#38bdf8") +
        cell("Orbitals Mixed", "1s + 2p (px, py)", "#f8fafc") +
        cell("Geometry", "Trigonal Planar", "#10b981") +
        cell("s-Character", "33.3%", "#f59e0b") +

      );
    } else if(currentType === "sp3"){
      out += '<text x="450" y="38" fill="#f8fafc" font-size="19" font-weight="bold" text-anchor="middle">sp³ Hybridization: Tetrahedral (109.5°)</text>';
      out += '<text x="450" y="64" fill="#94a3b8" font-size="13" text-anchor="middle">Mixing 1s + 3p gives four equivalent sp³ orbitals oriented towards tetrahedral vertices</text>';

      out += '<g transform="translate(450, 250)">';
      var angles4 = [-90, 45, 135, 180];
      angles4.forEach(function(deg){
        out += '<g transform="rotate(' + deg + ')">';
        out += '<path d="M 0 0 C 40 -30, 110 -25, 140 0 C 110 25, 40 30, 0 0 Z" fill="rgba(16, 185, 129, 0.35)" stroke="#10b981" stroke-width="3"/>';
        out += '<text x="70" y="6" fill="#10b981" font-size="16" font-weight="bold" text-anchor="middle">+</text>';

      });
      out += '<circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#64748b" stroke-width="2"/>';
      out += '<text x="0" y="65" fill="#f59e0b" font-size="16" font-weight="bold" text-anchor="middle">109° 28&#39;</text>';

      readout(

        cell("Orbitals Mixed", "1s + 3p (px, py, pz)", "#f8fafc") +
        cell("Geometry", "Tetrahedral", "#38bdf8") +
        cell("s-Character", "25.0%", "#f59e0b") +
        cell("Typical Angle", "109.5°", "#ef4444")
      );
    } else {
      // sigma vs pi
      out += '<text x="450" y="38" fill="#f8fafc" font-size="19" font-weight="bold" text-anchor="middle">Axial Overlap (σ-Bond) vs Lateral Overlap (π-Bond)</text>';

      // Left: Sigma
      out += '<g transform="translate(240, 250)">';
      out += '<rect x="-180" y="-150" width="360" height="300" rx="12" fill="#1e293b" stroke="#334155"/>';
      out += '<text x="0" y="-115" fill="#10b981" font-size="17" font-weight="bold" text-anchor="middle">Sigma (σ) Bond</text>';
      out += '<text x="0" y="-90" fill="#94a3b8" font-size="12" text-anchor="middle">Head-on / Axial Overlap</text>';

      out += '<line x1="-120" y1="0" x2="120" y2="0" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>';

      out += '</g>';

      // Right: Pi
      out += '<g transform="translate(660, 250)">';
      out += '<rect x="-180" y="-150" width="360" height="300" rx="12" fill="#1e293b" stroke="#334155"/>';
      out += '<text x="0" y="-115" fill="#ef4444" font-size="17" font-weight="bold" text-anchor="middle">Pi (π) Bond</text>';
      out += '<text x="0" y="-90" fill="#94a3b8" font-size="12" text-anchor="middle">Sideways / Lateral Overlap</text>';

      out += '<line x1="-120" y1="0" x2="120" y2="0" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3"/>';
      out += '<text x="0" y="-5" fill="#ef4444" font-size="10" text-anchor="middle">Nodal Plane (Electron Density = 0)</text>';

      // Upper lobes
      out += '<ellipse cx="-45" cy="-50" rx="26" ry="40" fill="rgba(56, 189, 248, 0.4)" stroke="#38bdf8" stroke-width="2"/>';
      out += '<ellipse cx="45" cy="-50" rx="26" ry="40" fill="rgba(56, 189, 248, 0.4)" stroke="#38bdf8" stroke-width="2"/>';
      // Lower lobes
      out += '<ellipse cx="-45" cy="50" rx="26" ry="40" fill="rgba(239, 68, 68, 0.4)" stroke="#ef4444" stroke-width="2"/>';
      out += '<ellipse cx="45" cy="50" rx="26" ry="40" fill="rgba(239, 68, 68, 0.4)" stroke="#ef4444" stroke-width="2"/>';

      out += '<text x="0" y="80" fill="#f8fafc" font-size="12" text-anchor="middle">Electron cloud above & below plane</text>';
      out += '<text x="0" y="105" fill="#ef4444" font-size="13" font-weight="bold" text-anchor="middle">Weaker Bond • Restricted Rotation</text>';
      out += '</g>';

      readout(
        cell("Overlap Comparison", "σ vs π Bonds", "#38bdf8") +
        cell("σ Electron Cloud", "Cylindrically Symmetric", "#10b981") +
        cell("π Electron Cloud", "Above & Below Nodal Plane", "#ef4444") +
        cell("Bond Strength", "σ > π", "#f59e0b") +
        cell("Rotational Freedom", "σ free / π rigid", "#f8fafc")
      );
    }

    svg.innerHTML = out;

    verdict(
      '<div class="callout" style="background:#0f172a;border-left:4px solid #10b981;padding:12px;border-radius:6px;">' +
        '<strong>Fundamental Overlap Rule:</strong> Head-on (axial) overlap along the internuclear axis creates maximum orbital interpenetration and lower potential energy, forming a strong σ-bond. Lateral overlap of unhybridized parallel p-orbitals is restricted to outer fringe contacts, yielding weaker π-bonds with a central nodal plane.' +
      '</div>'
    );
  }

  return { mount: mount, draw: draw };
})();
