d Pairs + Lone Pairs) to minimize mutual electrostatic repulsions:</p><table><thead><tr><th>Molecule</th><th>Central Atom</th><th>Valence $e^-$</th><th>Bond Pairs ($bp$)</th><th>Lone Pairs ($lp$)</th><th>Steric Number ($bp+lp$)</th><th>Electron Geometry</th><th>Molecular Shape</th><th>Ideal Bond Angle</th></tr></thead><tbody><tr><td><strong>BeCl₂</strong></td><td>Be</td><td>2</td><td>2</td><td>0</td><td>2</td><td>Linear</td><td><strong>Linear</strong></td><td>$180^\\circ$</td></tr><tr><td><strong>BCl₃</strong></td><td>B</td><td>3</td><td>3</td><td>0</td><td>3</td><td>Trigonal planar</td><td><strong>Trigonal planar</strong></td><td>$120^\\circ$</td></tr><tr><td><strong>SiCl₄</strong></td><td>Si</td><td>4</td><td>4</td><td>0</td><td>4</td><td>Tetrahedral</td><td><strong>Tetrahedral</strong></td><td>$109.5^\\circ$</td></tr><tr><td><strong>AsF₅</strong></td><td>As</td><td>5</td><td>5</td><td>0</td><td>5</td><td>Trigonal bipyramidal</td><td><strong>Trigonal bipyramidal</strong></td><td>$120^\\circ$ (eq), $90^\\circ$ (ax)</td></tr><tr><td><strong>H₂S</strong></td><td>S</td><td>6</td><td>2</td><td>2</td><td>4</td><td>Tetrahedral</td><td><strong>Bent / Angular (V-shaped)</strong></td><td>$\\approx 92.2^\\circ$ (contracted from $109.5^\\circ$)</td></tr><tr><td><strong>PH₃</strong></td><td>P</td><td>5</td><td>3</td><td>1</td><td>4</td><td>Tetrahedral</td><td><strong>Trigonal pyramidal</strong></td><td>$\\approx 93.6^\\circ$ (contracted from $109.5^\\circ$)</td></tr></tbody></table><p><em>Note:</em> In $H_2S$ and $PH_3$, Drago's rule also applies (pure $p$-orbitals participate with minimal hybridization), yielding bond angles close to $90^\\circ$.</p>", "verified": "BeCl2: linear; BCl3: trigonal planar; SiCl4: tetrahedral; AsF5: trigonal bipyramidal; H2S: bent; PH3: trigonal pyramidal"}, {"num": "4.8", "title": "Bond angle comparison: NH₃ vs H₂O", "question": "Although geometries of NH₃ and H₂O molecules are distorted tetrahedral, bond angle in water is less than that of ammonia. Discuss.", "approach": "Apply the VSEPR repulsion hierarchy: lone pair - lone pair > lone pair - bond pair > bond pair - bond pair.", "solution": "<p>Both ammonia ($NH_3$) and water ($H_2O$) have a central atom surrounded by four electron pairs (Steric Number = 4), which dictates an underlying <strong>tetrahedral electron-pair arrangement</strong> with an ideal angle of $109.5^\\circ$.</p><p>However, the actual bond angles differ noticeably ($NH_3 = 107.8^\\circ$, $H_2O = 104.5^\\circ$) due to the unequal repulsive forces between different types of electron pairs:</p>$$\\text{Lone pair -- Lone pair (lp-lp)} > \\text{Lone pair -- Bond pair (lp-bp)} > \\text{Bond pair -- Bond pair (bp-bp)}$$<ul><li>In <strong>NH₃</strong>, the central nitrogen atom has <strong>3 bond pairs and 1 lone pair</strong>. The lone pair repels the three $N-H$ bonding pairs, compressing the $H-N-H$ bond angle from $109.5^\\circ$ down to <strong>$107.8^\\circ$</strong>.</li><li>In <strong>H₂O</strong>, the central oxygen atom has <strong>2 bond pairs and 2 lone pairs</strong>. The intense mutual repulsion between the two non-bonding lone pairs ($lp-lp$ repulsion) pushes them apart, which in turn exerts strong $lp-bp$ repulsions against the two $O-H$ bonding pairs. This double compression squeezes the $H-O-H$ bond angle further down to <strong>$104.5^\\circ$</strong>.</li></ul><p>Therefore, because water possesses two lone pairs causing severe $lp-lp$ repulsion compared to only one lone pair in ammonia, the bond angle in water is smaller.</p>", "verified": "H2O has 2 lone pairs causing lp-lp > lp-bp repulsion compressing angle to 104.5° vs 1 lp in NH3 (107.8°)"}, {"num": "4.9", "title": "Bond strength in terms of bond order", "question": "How do you express the bond strength in terms of bond order?", "approach": "Correlate bond order directly with bond dissociation enthalpy and inversely with bond length.", "solution": "<p><strong>Bond order</strong> is defined in Molecular Orbital Theory as half the difference between the number of bonding electrons ($N_b$) and antibonding electrons ($N_a$):</p>$$\\text{Bond Order} = \\frac{N_b - N_a}{2}$$<p>The relationship between bond strength and bond order is direct and quantitative:</p><ol><li><strong>Direct Proportionality to Bond Enthalpy:</strong> Bond strength is directly proportional to bond order. As bond order increases (from single bond $\\text{BO}=1$, double bond $\\text{BO}=2$, to triple bond $\\text{BO}=3$), the number of shared electron pairs holding the two nuclei together increases, resulting in a deeper potential energy well and higher <strong>bond dissociation enthalpy</strong>:$$\\text{Bond Strength} \\propto \\text{Bond Dissociation Enthalpy} \\propto \\text{Bond Order}$$For example: $N_2$ (Bond Order = 3, $\\Delta_{diss} H = 946\\text{ kJ/mol}$) is vastly stronger and more inert than $O_2$ (Bond Order = 2, $\\Delta_{diss} H = 498\\text{ kJ/mol}$) and $F_2$ (Bond Order = 1, $\\Delta_{diss} H = 159\\text{ kJ/mol}$).</li><li><strong>Inverse Relation to Bond Length:</strong> Higher bond order draws the bonded nuclei closer together due to greater electron density between them:$$\\text{Bond Length} \\propto \\frac{1}{\\text{Bond Order}}$$<p>Consequently, shorter bonds with higher bond orders are significantly stronger and more resistant to cleavage.</p></li></ol>", "verified": "Bond strength is directly proportional to bond order and bond dissociation enthalpy, and inversely proportional to bond length"}, {"num": "4.10", "title": "Definition of bond length", "question": "Define the bond length.", "approach": "State the standard IUPAC definition in terms of equilibrium internuclear distance and explain its components.", "solution": "<p><strong>Bond length</strong> is defined as the <strong>equilibrium distance between the nuclei of two bonded atoms</strong> in a molecule.</p><p>Key characteristics of bond length:</p><ul><li><strong>Equilibrium state:</strong> It represents the inter-nuclear distance where attractive and repulsive forces are exactly balanced, corresponding to the global minimum on the potential energy curve of the diatomic system.</li><li><strong>Experimental Determination:</strong> Bond lengths are experimentally measured using spectroscopic techniques, X-ray diffraction, and electron diffraction methods. It is expressed in picometres ($1\\text{ pm} = 10^{-12}\\text{ m}$) or Ångströms ($1\\text{ \\AA} = 10^{-10}\\text{ m} = 100\\text{ pm}$).</li><li><strong>Covalent Radius:</strong> For a homonuclear diatomic covalent molecule $A_2$, the bond length $R$ equals twice the covalent radius of atom $A$: $R = 2 r_{cov}$. In a heteronuclear bond $A-B$, $R_{AB} \\approx r_A + r_B - 0.09(\\chi_A - \\chi_B)$ (Schomaker-Stevenson equation).</li><li><strong>Factors Influencing Bond Length:</strong><ol><li><em>Size of atoms:</em> Larger atomic radii yield longer bonds ($H-I > H-Br > H-Cl > H-F$).</li><li><em>Multiplicity of bond:</em> Higher bond order shortens bond length ($C\\equiv C\\; [120\\text{ pm}] < C=C\\; [134\\text{ pm}] < C-C\\; [154\\text{ pm}]$).</li><li><em>Hybridization state:</em> Greater $s$-character draws electrons closer to nucleus, shortening bond length ($sp < sp^2 < sp^3$).</li></ol></li></ul>", "verified": "Equilibrium distance between nuclei of two bonded atoms at minimum potential energy"}, {"num": "4.11", "title": "Important aspects of resonance in the carbonate ion", "question": "Explain the important aspects of resonance with reference to the CO₃²⁻ ion.", "approach": "Draw the three equivalent canonical structures of carbonate, explain fractional bond order, identical bond lengths, and charge delocalization.", "solution": "<p>A single Lewis structure for the carbonate ion ($CO_3^{2-}$) would depict one carbon-oxygen double bond ($C=O$) and two carbon-oxygen single bonds ($C-O^-$). This would predict one short bond ($122\\text{ pm}$) and two longer bonds ($143\\text{ pm}$).</p><p>However, experimental measurements show that <strong>all three carbon-oxygen bonds in CO₃²⁻ are strictly identical</strong> in length ($128\\text{ pm}$, intermediate between single and double bonds) and each oxygen carries an identical fractional charge of $-2/3$.</p><p>This phenomenon is explained by <strong>resonance</strong>:</p><ol><li><strong>Canonical Structures:</strong> The carbonate ion is represented by three equivalent Lewis canonical structures differing only in the placement of the $\\pi$-electron pair and formal negative charges:<ul><li><em>Structure I:</em> Double bond to $O_{(1)}$; single bonds to $O_{(2)}^-$ and $O_{(3)}^-$.</li><li><em>Structure II:</em> Double bond to $O_{(2)}$; single bonds to $O_{(1)}^-$ and $O_{(3)}^-$.</li><li><em>Structure III:</em> Double bond to $O_{(3)}$; single bonds to $O_{(1)}^-$ and $O_{(2)}^-$.</li></ul></li><li><strong>Resonance Hybrid:</strong> The real molecule does not oscillate between these forms; it is a permanent single species called the <strong>resonance hybrid</strong> where:<ul><li>The four pairs of bonding electrons (three $\\sigma$ bonds and one delocalized $\\pi$ system) are distributed evenly over all three $C-O$ linkages.</li><li><strong>Bond Order:</strong> $\\text{BO} = \\frac{\\text{Total number of bonds between C and O in all structures}}{\\text{Number of resonating positions}} = \\frac{4}{3} = 1.33$.</li><li><strong>Formal Charge on each O:</strong> $\\frac{\\text{Total ionic charge}}{\\text{Number of oxygen atoms}} = \\frac{-2}{3} = -0.67$.</li></ul></li><li><strong>Resonance Energy:</strong> Delocalization of $\\pi$-electrons spreads negative charge over a larger volume, lowering the overall electrostatic potential energy and imparting extra stability known as the <em>resonance energy</em>.</li></ol>", "verified": "Three equivalent canonical forms, identical C-O bond lengths (128 pm), bond order 4/3, formal charge -2/3 per O"}, {"num": "4.12", "title": "Can tautomeric forms of H₃PO₃ be canonical resonance forms?", "question": "H₃PO₃ can be represented by structures 1 and 2 shown below. Can these two structures be taken as the canonical forms of the resonance hybrid representing H₃PO₃? If not, give reasons for the same.", "approach": "Recall the fundamental requirement of resonance theory: the relative positions of atomic nuclei must remain strictly fixed.", "solution": "<p>In structure 1 of phosphorous acid ($H_3PO_3$), hydrogen is directly bonded to phosphorus ($P-H$), with two $P-OH$ bonds and one $P=O$ bond ($HP(=O)(OH)_2$). In structure 2 (the trihydroxy tautomer $P(OH)_3$), all three hydrogens are bonded to oxygen atoms ($P-O-H$) and phosphorus has a lone pair.</p><p><strong>Conclusion: NO, these two structures CANNOT be taken as canonical resonance forms.</strong></p><p><strong>Reasons:</strong></p><ol><li><strong>Movement of Atomic Nuclei:</strong> A core postulate of resonance theory states that <em>all canonical resonance structures must have identical relative positions of atomic nuclei</em>; they may differ ONLY in the arrangement of valence electrons ($\\pi$-electrons and lone pairs). In structure 1, a hydrogen nucleus is attached directly to phosphorus ($P-H$), whereas in structure 2, that same hydrogen nucleus has migrated to an oxygen atom ($O-H$).</li><li><strong>Tautomerism vs Resonance:</strong> Because a proton shifts positions, structures 1 and 2 represent <strong>structural isomers (tautomers)</strong> in dynamic chemical equilibrium, not resonance contributors. Canonical forms are non-isolable imaginary constructs, whereas tautomers represent distinct real chemical species that can in principle be isolated.</li></ol>", "verified": "No; canonical forms must have identical atomic positions; migration of H constitutes tautomerism/isomerism"}, {"num": "4.13", "title": "Resonance structures for SO₃, NO₂ and NO₃⁻", "question": "Write the resonance structures for SO₃, NO₂ and NO₃⁻.", "approach": "Construct valid octet and expanded canonical forms for sulfur trioxide, nitrogen dioxide (odd electron), and nitrate anion.", "solution": "<p><strong>1. Sulfur Trioxide (SO₃):</strong></p><p>Total valence electrons = $6 + 3(6) = 24$. In octet-compliant representations, sulfur forms one double bond ($S=O$) and two coordinate single bonds ($S^{+2} — (O^-)_2$). There are three equivalent canonical structures:</p><ul><li>$O = S(—O⁻)₂ \\longleftrightarrow ⁻O — S(=O)(—O⁻) \\longleftrightarrow (⁻O)₂S = O$</li><li>In expanded-octet formal representations, sulfur forms three double bonds ($O=S(=O)=O$), with resonance distributing the multiple bonds. All three $S-O$ bond lengths are experimentally identical ($142\\text{ pm}$) with a bond order of $1.33$ to $2.0$.</li></ul><p><strong>2. Nitrogen Dioxide (NO₂):</strong></p><p>Total valence electrons = $5 + 2(6) = 17$ (an odd-electron molecule). The unpaired electron resides on nitrogen. Resonance occurs between two major canonical forms:</p><ul><li>$\\dot{\\text{N}}(=O)(—O⁻) \\longleftrightarrow ⁻O — \\dot{\\text{N}}(=O)$</li><li>The $N-O$ bond length is identical for both bonds ($120\\text{ pm}$, intermediate between single $140\\text{ pm}$ and double $118\\text{ pm}$), with bond angle $134.3^\\circ$.</li></ul><p><strong>3. Nitrate Ion (NO₃⁻):</strong></p><p>Total valence electrons = $5 + 3(6) + 1 = 24$. Nitrogen cannot expand its octet ($n=2$, no $d$-orbitals). It forms one $N=O$ double bond, one single covalent bond, and one coordinate covalent bond ($N^+ — O^-$). There are three strictly equivalent canonical forms:</p><ul><li>$[O = N^+(—O⁻)₂] \\longleftrightarrow [⁻O — N^+(=O)(—O⁻)] \\longleftrightarrow [(⁻O)₂N^+ = O]$</li><li>Each $N-O$ bond order is $4/3 = 1.33$, bond length is $124\\text{ pm}$, and each oxygen carries $-2/3$ net formal charge.</li></ul>", "verified": "SO3 (3 equivalent forms), NO2 (2 forms with odd electron), NO3⁻ (3 equivalent forms with BO = 4/3)"}, {"num": "4.14", "title": "Electron transfer using Lewis symbols", "question": "Use Lewis symbols to show electron transfer between the following atoms to form cations and anions: (a) K and S, (b) Ca and O, (c) Al and N.", "approach": "Write Lewis dot structures showing stoichiometric loss of valence electrons by metal and uptake by non-metal to achieve noble-gas octets.", "solution": "<p><strong>(a) Potassium (K) and Sulfur (S):</strong></p><ul><li>Potassium ($Z=19$, $[\\text{Ar}]\\, 4s^1$) has 1 valence electron ($K\\cdot$). It loses $1e^-$ to become $K^+$.</li><li>Sulfur ($Z=16$, $[\\text{Ne}]\\, 3s^2 3p^4$) has 6 valence electrons ($:\\dot{\\text{S}}:$). It requires $2e^-$ to complete its octet.</li><li>Two potassium atoms transfer one electron each to one sulfur atom:$$2\\, K\\cdot + :\\dot{\\text{S}}: \\longrightarrow 2\\, [K]^+ + [:S̈̈:]^{2-} \\implies K_2S$$</li></ul><p><strong>(b) Calcium (Ca) and Oxygen (O):</strong></p><ul><li>Calcium ($Z=20$, $[\\text{Ar}]\\, 4s^2$) has 2 valence electrons ($Ca:$). It loses $2e^-$ to form $Ca^{2+}$.</li><li>Oxygen ($Z=8$, $[\\text{He}]\\, 2s^2 2p^4$) has 6 valence electrons ($:\\dot{\\text{O}}:$). It gains $2e^-$ to form $O^{2-}$.</li><li>$$Ca: + :\\dot{\\text{O}}: \\longrightarrow [Ca]^{2+} + [:Ö̈:]^{2-} \\implies CaO$$</li></ul><p><strong>(c) Aluminium (Al) and Nitrogen (N):</strong></p><ul><li>Aluminium ($Z=13$, $[\\text{Ne}]\\, 3s^2 3p^1$) has 3 valence electrons ($:\\dot{\\text{Al}}$). It loses $3e^-$ to form $Al^{3+}$.</li><li>Nitrogen ($Z=7$, $[\\text{He}]\\, 2s^2 2p^3$) has 5 valence electrons ($:\\dot{\\text{N}}\\cdot$). It requires $3e^-$ to form $N^{3-}$.</li><li>$$:\\dot{\\text{Al}} + :\\dot{\\text{N}}\\cdot \\longrightarrow [Al]^{3+} + [:N̈̈:]^{3-} \\implies AlN$$</li></ul>", "verified": "2K + S -> 2K+ + S2- (K2S); Ca + O -> Ca2+ + O2- (CaO); Al + N -> Al3+ + N3- (AlN)"}, {"num": "4.15", "title": "Geometry of CO₂ vs H₂O explained by dipole moments", "question": "Although both CO₂ and H₂O are triatomic molecules, the shape of H₂O molecule is bent while that of CO₂ is linear. Explain this on the basis of dipole moment.", "approach": "Relate experimentally measured dipole moments (CO2 = 0 D, H2O = 1.85 D) to vector summation of individual bond dipoles.", "solution": "<p>Dipole moment ($\\vec{\\mu}$) is a <strong>vector quantity</strong> possessing both magnitude and spatial direction. The net dipole moment of a polyatomic molecule is the vector sum of its individual bond dipoles and lone-pair moments.</p><ol><li><strong>Carbon Dioxide (CO₂): $\\mu_{net} = 0\\text{ D}$</strong><ul><li>In $CO_2$, the carbon-oxygen bonds are strongly polar due to the electronegativity difference between C ($2.5$) and O ($3.5$). Each $C=O$ bond has a substantial dipole moment of $\\approx 2.3\\text{ D}$ pointing from carbon toward oxygen.</li><li>Experimental measurement proves that the net molecular dipole moment of $CO_2$ is strictly <strong>zero</strong> ($\\mu = 0$).</li><li>For two equal and opposing bond dipole vectors to completely cancel each other to zero, the angle between them must be exactly $180^\\circ$:$$\\vec{\\mu}_{net} = \\vec{\\mu}_1 + \\vec{\\mu}_2 = \\mu - \\mu = 0$$Hence, $CO_2$ must possess a <strong>strictly linear geometry</strong> ($O = C = O$).</li></ul></li><li><strong>Water (H₂O): $\\mu_{net} = 1.85\\text{ D}$</strong><ul><li>Oxygen ($3.5$) is far more electronegative than hydrogen ($2.1$), producing two polar $O-H$ bonds directed toward oxygen.</li><li>If $H_2O$ were linear ($H-O-H$), the two collinear $O-H$ bond dipoles would oppose each other and cancel out, yielding $\\mu = 0\\text{ D}$.</li><li>However, water possesses a very large experimental dipole moment of <strong>$1.85\\text{ D}$</strong>.</li><li>This non-zero result requires that the two $O-H$ bond dipoles are inclined at an angle such that their vector components reinforce each other along the molecular symmetry axis. Combined with the reinforcing dipole moments of the two oxygen lone pairs, this confirms that $H_2O$ has a <strong>bent / angular geometry</strong> (bond angle $104.5^\\circ$).</li></ul></li></ol>", "verified": "CO2 linear because opposite C=O dipoles cancel to 0 D; H2O bent because inclined O-H dipoles + lone pairs add vectorially to 1.85 D"}, {"num": "4.16", "title": "Significance and applications of dipole moment", "question": "Write the significance/applications of dipole moment.", "approach": "Systematize applications into polarity distinction, geometric determination, percent ionic character calculation, and isomer distinction.", "solution": "<p>The <strong>dipole moment</strong> ($\\mu = q \\times d$) provides vital insights into molecular structure and bonding:</p><ol><li><strong>Distinguishing Polar from Non-polar Molecules:</strong> Molecules with $\\mu = 0\\text{ D}$ are non-polar ($H_2, Cl_2, O_2, CH_4, CCl_4, BF_3, CO_2$), whereas molecules with $\\mu > 0\\text{ D}$ are polar ($HCl, H_2O, NH_3, CHCl_3$).</li><li><strong>Determining Molecular Geometry and Shape:</strong><ul><li>A triatomic molecule $AB_2$ with $\\mu = 0$ is <em>linear</em> ($CO_2, BeF_2$), whereas if $\\mu > 0$, it is <em>bent/angular</em> ($H_2O, SO_2$).</li><li>A tetra-atomic molecule $AB_3$ with $\\mu = 0$ is <em>trigonal planar</em> ($BF_3, BCl_3$), whereas if $\\mu > 0$, it is <em>trigonal pyramidal</em> ($NH_3, NF_3, PCl_3$).</li><li>A penta-atomic molecule $AB_4$ with $\\mu = 0$ is symmetrical <em>tetrahedral</em> ($CH_4, CCl_4$).</li></ul></li><li><strong>Calculating Percentage Ionic Character:</strong> The fraction of ionic character in a covalent bond is calculated by comparing the experimental dipole moment ($\\mu_{obs}$) with the theoretical dipole moment assuming complete electron transfer ($\\mu_{ionic} = e \\times d$):$$\\%\\text{ Ionic Character} = \\frac{\\mu_{observed}}{\\mu_{theoretical}} \\times 100$$</li><li><strong>Distinguishing Cis- and Trans- Geometrical Isomers:</strong> Cis-isomers typically have a higher dipole moment than trans-isomers because in the trans-isomer, oppositely oriented bond dipoles cancel out:$$\\mu_{cis-\\text{1,2-dichloroethene}} = 1.90\\text{ D} \\quad \\text{vs} \\quad \\mu_{trans-\\text{1,2-dichloroethene}} = 0\\text{ D}$$</li><li><strong>Distinguishing Ortho, Meta, and Para Benzene Derivatives:</strong> For disubstituted benzenes like dichlorobenzene, the dipole moment decreases in the order: $\\mu_{ortho} (\\theta=60^\\circ) > \\mu_{meta} (\\theta=120^\\circ) > \\mu_{para} (\\theta=180^\\circ, \\mu=0)$.</li></ol>", "verified": "Polar vs non-polar, molecular geometry, % ionic character, cis/trans isomerism, ortho/meta/para differentiation"}, {"num": "4.17", "title": "Electronegativity vs Electron Gain Enthalpy", "question": "Define electronegativity. How does it differ from electron gain enthalpy?", "approach": "Contrast relative qualitative attraction in a bonded molecule against absolute thermodynamic energy change of an isolated gaseous atom.", "solution": "<p><strong>Definition of Electronegativity:</strong> Electronegativity is the <em>relative tendency or ability of an atom in a chemical molecule to attract the shared pair of electrons</em> towards itself in a covalent bond.</p><p><strong>Key Differences:</strong></p><table><thead><tr><th>Property</th><th>Electronegativity (EN)</th><th>Electron Gain Enthalpy ($\\Delta_{eg} H$)</th></tr></thead><tbody><tr><td><strong>Physical State</strong></td><td>Property of a <strong>bonded atom</strong> inside a molecule.</td><td>Property of an <strong>isolated neutral gaseous atom</strong> ($X(g)$).</td></tr><tr><td><strong>Process / Meaning</strong></td><td>Tendency to <em>attract</em> shared electron pair toward itself.</td><td>Actual <em>energy released or absorbed</em> when an electron is added: $X(g) + e^- \\rightarrow X^-(g)$.</td></tr><tr><td><strong>Nature of Quantity</strong></td><td>Relative, dimensionless comparative number (Pauling, Mulliken, Allred-Rochow scales).</td><td>Absolute, measurable thermodynamic energy quantity.</td></tr><tr><td><strong>Units</strong></td><td>No units (arbitrary numerical scale, e.g. Pauling scale where $\\text{F} = 4.0$).</td><td>$\\text{kJ}\\cdot\\text{mol}^{-1}$ or $\\text{eV}\\cdot\\text{atom}^{-1}$.</td></tr><tr><td><strong>Constancy</strong></td><td>Not constant; varies depending on hybridization, oxidation state, and bonded environment.</td><td>Constant characteristic thermodynamic constant for a given element.</td></tr></tbody></table>", "verified": "EN is relative tendency of bonded atom (no units); electron gain enthalpy is thermodynamic energy change of isolated gaseous atom (kJ/mol)"}, {"num": "4.18", "title": "Polar covalent bond with suitable example", "question": "Explain with the help of suitable example polar covalent bond.", "approach": "Explain electronegativity mismatch, asymmetrical electron cloud shift, partial charges, and illustrate using hydrogen fluoride (HF) or hydrogen chloride (HCl).", "solution": "<p>When a covalent bond is formed between two atoms having <strong>different electronegativities</strong>, the shared pair of electrons is not held equally between them. Instead, the electron cloud is displaced toward the more electronegative atom.</p><p>As a result, the more electronegative atom acquires a <strong>partial negative charge ($\\delta^-$)</strong>, while the less electronegative atom acquires an equal <strong>partial positive charge ($\\delta^+$)</strong>. A covalent bond having such separated partial charges (poles) is called a <strong>polar covalent bond</strong>.</p><p><strong>Example: Hydrogen Chloride (HCl)</strong></p><ul><li>Electronegativity of Hydrogen = $2.1$; Electronegativity of Chlorine = $3.0$.</li><li>Chlorine has a significantly higher attraction for the shared pair of electrons than hydrogen.</li><li>The bonding electron cloud shifts toward the chlorine atom:$$\\overset{\\delta+}{\\text{H}} \\;\\text{---}\\; \\overset{\\delta-}{\\text{Cl}}$$</li><li>This separation of positive and negative centers creates an electric dipole with a bond dipole moment:$$\\mu = 1.07\\text{ D}$$</li><li>While it remains a covalent bond (electrons are shared, not transferred into discrete ions), it possesses partial ionic character ($\\,\\approx 17\\%$ ionic character according to Pauling's formula).</li></ul>", "verified": "Unequal sharing due to electronegativity difference creating delta+ and delta- dipoles (e.g. H-Cl, H-F)"}, {"num": "4.19", "title": "Order of increasing ionic character", "question": "Arrange the bonds in order of increasing ionic character in the molecules: LiF, K₂O, N₂, SO₂ and ClF₃.", "approach": "Calculate the difference in Pauling electronegativities (Δχ) for each bonded pair: N-N, Cl-F, S-O, K-O, Li-F.", "solution": "<p>According to Pauling's electronegativity scale, the ionic character of a bond is directly proportional to the electronegativity difference ($\\Delta\\chi = |\\chi_A - \\chi_B|$) between the bonded atoms.</p><p>Let us examine the Pauling electronegativities of the constituent elements:</p><ul><li>$\\chi_N = 3.0$</li><li>$\\chi_S = 2.5,\\; \\chi_O = 3.5$</li><li>$\\chi_{Cl} = 3.0,\\; \\chi_F = 4.0$</li><li>$\\chi_K = 0.8,\\; \\chi_O = 3.5$</li><li>$\\chi_{Li} = 1.0,\\; \\chi_F = 4.0$</li></ul><p>Now, calculate $\\Delta\\chi$ for the respective bonds:</p><ol><li><strong>N₂ (N — N bond):</strong> $\\Delta\\chi = 3.0 - 3.0 = 0.0$ $\\implies$ 100% pure covalent (0% ionic character).</li><li><strong>ClF₃ (Cl — F bond):</strong> $\\Delta\\chi = 4.0 - 3.0 = 1.0$.</li><li><strong>SO₂ (S — O bond):</strong> $\\Delta\\chi = 3.5 - 2.5 = 1.0$. (Oxygen is significantly more polarizing; polar covalent).</li><li><strong>K₂O (K — O bond):</strong> $\\Delta\\chi = 3.5 - 0.8 = 2.7$ $\\implies$ Predominantly ionic lattice ($> 80\\%$ ionic).</li><li><strong>LiF (Li — F bond):</strong> $\\Delta\\chi = 4.0 - 1.0 = 3.0$ $\\implies$ Highly ionic salt ($> 89\\%$ ionic).</li></ol><p><em>Refined comparison between Cl-F and S-O:</em> Both have $\\Delta\\chi = 1.0$, but the Cl-F bond has greater bond polarity due to fluorine's extreme electronegativity ($4.0$) and high charge localization. Alternatively, grouping them by type yields:</p>$$\\mathbf{N_2 < ClF_3 \\le SO_2 < K_2O < LiF}$$<p>Therefore, the arranged order of increasing ionic character is: <strong>N₂ &lt; ClF₃ &lt; SO₂ &lt; K₂O &lt; LiF</strong> (with LiF having the highest ionic character due to $\\Delta\\chi = 3.0$).</p>", "verified": "N2 (0) < ClF3 (1.0) < SO2 (1.0) < K2O (2.7) < LiF (3.0)"}, {"num": "4.20", "title": "Correct Lewis structure for acetic acid (CH₃COOH)", "question": "The skeletal structure of CH₃COOH as shown below is correct, but some of the bonds are shown incorrectly. Write the correct Lewis structure for acetic acid.", "approach": "Count all valence electrons (24 e-), satisfy carbon tetravalency (4 bonds per C), oxygen divalency (2 bonds + 2 lone pairs), and hydrogen monovalency.", "solution": "<p><strong>Valence Electron Count:</strong></p><ul><li>Carbon ($C$): $2 \\times 4 = 8$ electrons</li><li>Hydrogen ($H$): $4 \\times 1 = 4$ electrons</li><li>Oxygen ($O$): $2 \\times 6 = 12$ electrons</li><li><strong>Total valence electrons = 24 electrons (12 electron pairs).</strong></li></ul><p><strong>Correct Structural Requirements:</strong></p><ol><li>The methyl carbon ($C_1$) is bonded to three hydrogen atoms by single bonds and to the carbonyl carbon ($C_2$) by a single bond (4 single bonds = 8 electrons, octet satisfied).</li><li>The carboxyl carbon ($C_2$) must form 4 covalent bonds: one single bond to $C_1$, one <strong>double bond to the carbonyl oxygen ($=O$)</strong>, and one single bond to the hydroxyl oxygen (—O—).</li><li>The carbonyl oxygen ($=O$) forms a double bond to carbon and retains <strong>two non-bonding lone pairs</strong> (8 electrons, octet satisfied).</li><li>The hydroxyl oxygen (—O—) forms two single bonds (one to carbon, one to hydrogen) and retains <strong>two non-bonding lone pairs</strong>.</li></ol><pre><code>      H   :O:\\n      |   //\\n  H — C — C\\n      |    \\\\\\n      H     :Ö — H</code></pre><p>This structure satisfies the octet of both carbon and both oxygen atoms, with all formal charges equal to zero.</p>", "verified": "CH3 bonded to C; C double bonded to =O (2 lp) and single bonded to -OH (2 lp)"}, {"num": "4.21", "title": "Why CH₄ is tetrahedral rather than square planar", "question": "Apart from tetrahedral geometry, another possible geometry for CH₄ is square planar with the four H atoms at the corners of the square and the C atom at its centre. Explain why CH₄ is not square planar?", "approach": "Compare electron pair repulsion and bond angles in square planar (90°) versus tetrahedral (109°28') geometries.", "solution": "<p>In methane ($CH_4$), the central carbon atom is surrounded by <strong>four bond pairs</strong> of valence electrons.</p><p>According to the Valence Shell Electron Pair Repulsion (VSEPR) theory, electron pairs in the valence shell repel one another and arrange themselves in three-dimensional space so as to <strong>maximize the distance between them and minimize mutual electrostatic repulsion</strong>, which minimizes the potential energy of the molecule.</p><ol><li><strong>Square Planar Geometry:</strong> If $CH_4$ were square planar (all five atoms in one plane), the four $C-H$ bond pairs would be separated by bond angles of only <strong>$90^\\circ$</strong>. At $90^\\circ$, electron-electron repulsion between adjacent bonding electron clouds is intense.</li><li><strong>Tetrahedral Geometry:</strong> By expanding into three dimensions towards the vertices of a regular tetrahedron, the four bond pairs achieve a much larger bond angle of <strong>$109^\\circ 28'$ ($109.5^\\circ$)</strong>.</li></ol><p>Because electrostatic repulsive potential energy is inversely proportional to distance, the $109.5^\\circ$ tetrahedral arrangement provides far lower repulsive energy and significantly greater thermodynamic stability than the cramped $90^\\circ$ square planar arrangement. Furthermore, valence bond theory shows carbon undergoes $sp^3$ hybridization with directional tetrahedral lobes, which is energetically more favourable than $dsp^2$ (which carbon cannot do anyway as it lacks $d$-orbitals in $n=2$).</p>", "verified": "Tetrahedral bond angle 109.5° has much lower repulsion than 90° square planar"}, {"num": "4.22", "title": "Why BeH₂ has zero dipole moment despite polar bonds", "question": "Explain why BeH₂ molecule has a zero dipole moment although the Be–H bonds are polar.", "approach": "Examine the linear molecular symmetry and apply vector addition of opposite bond dipoles.", "solution": "<p>In beryllium hydride ($BeH_2$), beryllium ($Z=4$) has an electronegativity of $1.5$, while hydrogen has an electronegativity of $2.1$. Because of this electronegativity difference, each $Be-H$ bond is polar with a bond dipole pointing from beryllium toward hydrogen:</p>$$\\overset{\\delta+}{\\text{Be}} \\;\\longrightarrow\\; \\overset{\\delta-}{\\text{H}}$$p><p>However, the central beryllium atom has only two valence electron pairs and no lone pairs (Steric Number = 2). By VSEPR theory and $sp$ hybridization, the molecule has a strictly <strong>linear geometry</strong> with a bond angle of <strong>$180^\\circ$</strong>:</p>$$\\text{H} \\;\\xleftarrow{\\quad\\mu\\quad}\\; \\text{Be} \\;\\xrightarrow{\\quad\\mu\\quad}\\; \\text{H}$$<p>Dipole moment is a vector quantity. The total molecular dipole moment $\\vec{\\mu}_{net}$ is the vector sum of the two individual bond dipole vectors:</p>$$\\vec{\\mu}_{net} = \\vec{\\mu}_{Be-H(1)} + \\vec{\\mu}_{Be-H(2)}$$<p>Since both bond dipoles have identical magnitude ($\\|\\vec{\\mu}_1\\| = \\|\\vec{\\mu}_2\\|$) and act along the same internuclear axis in exactly opposite directions ($180^\\circ$), they cancel each other completely:</p>$$\\mu_{net} = \\mu - \\mu = 0\\text{ Debye}$$<p>Hence, $BeH_2$ has zero dipole moment due to its symmetrical linear geometry.</p>", "verified": "Linear geometry (180°) causes two equal opposing Be-H bond dipoles to cancel vectorially to zero"}, {"num": "4.23", "title": "Dipole moment comparison: NH₃ vs NF₃", "question": "Which out of NH₃ and NF₃ has higher dipole moment and why?", "approach": "Compare the spatial vector directions of the central atom lone pair dipole and the three N-X bond dipoles.", "solution": "<p>Both ammonia ($NH_3$) and nitrogen trifluoride ($NF_3$) have a pyramidal shape with a central nitrogen atom holding <strong>3 bond pairs and 1 lone pair</strong>.</p><p>However, their experimentally measured dipole moments differ dramatically:</p>$$\\mu(\\text{NH}_3) = 1.47\\text{ D} \\quad \\gg \\quad \\mu(\\text{NF}_3) = 0.24\\text{ D}$$<p><strong>Explanation based on Vector Addition of Dipoles:</strong></p><ol><li><strong>In NH₃:</strong> Nitrogen ($3.0$) is more electronegative than hydrogen ($2.1$). Consequently, the three $N-H$ bond dipoles point <em>towards nitrogen</em> (upwards into the apex of the pyramid). The dipole moment of the lone pair on nitrogen also points <em>upwards</em> away from the nucleus. Thus, the resultant vector of the three $N-H$ bond dipoles <strong>adds constructively (reinforces)</strong> the lone-pair dipole moment:$$\\vec{\\mu}_{net} = \\vec{\\mu}_{lone\\,pair} + \\sum \\vec{\\mu}_{N-H} \\implies \\text{Large net dipole moment } (1.47\\text{ D})$$</li><li><strong>In NF₃:</strong> Fluorine ($4.0$) is significantly more electronegative than nitrogen ($3.0$). Therefore, the three $N-F$ bond dipoles point <em>away from nitrogen towards the fluorine atoms</em> (downwards). The lone-pair dipole moment still points <em>upwards</em>. As a result, the resultant vector of the three $N-F$ bond dipoles <strong>opposes (partially cancels)</strong> the lone-pair dipole moment:$$\\vec{\\mu}_{net} = \\vec{\\mu}_{lone\\,pair} - \\sum \\vec{\\mu}_{N-F} \\implies \\text{Very small net dipole moment } (0.24\\text{ D})$$</li></ol><p>Hence, <strong>NH₃ has a much higher dipole moment than NF₃</strong>.</p>", "verified": "NH3 (1.47 D) > NF3 (0.24 D) because N-H dipoles reinforce lone pair while N-F dipoles oppose lone pair"}, {"num": "4.24", "title": "Hybridisation of atomic orbitals: sp, sp², sp³", "question": "What is meant by hybridisation of atomic orbitals? Describe the shapes of sp, sp², sp³ hybrid orbitals.", "approach": "Define Pauling hybridization as mixing of atomic orbitals of comparable energy, then characterize sp, sp2, and sp3 geometries and angular distributions.", "solution": "<p><strong>Definition:</strong> <strong>Hybridisation</strong> is the concept of mixing atomic orbitals of slightly different energies (such as $s$ and $p$ orbitals of the same principal quantum shell) belonging to the same atom to produce an entirely new set of equivalent orbitals having identical energies, shapes, and definite orientations in space.</p><p><strong>Types and Shapes:</strong></p><ol><li><strong>sp Hybridisation (Diagonal / Linear):</strong><ul><li>Formed by intermixing one $s$ and one $p$ orbital.</li><li>Produces <strong>two equivalent sp hybrid orbitals</strong> oriented at an angle of <strong>$180^\\circ$</strong> along the internuclear axis.</li><li><strong>Shape:</strong> Linear geometry ($50\\%\\; s$-character, $50\\%\\; p$-character). Each hybrid orbital has one large positive lobe and one small negative tail. Example: $BeCl_2, C_2H_2$.</li></ul></li><li><strong>sp² Hybridisation (Trigonal Planar):</strong><ul><li>Formed by intermixing one $s$ and two $p$ orbitals (e.g., $p_x, p_y$).</li><li>Produces <strong>three equivalent sp² hybrid orbitals</strong> lying in the same plane directed towards the vertices of an equilateral triangle at angles of <strong>$120^\\circ$</strong>.</li><li><strong>Shape:</strong> Trigonal planar ($33.3\\%\\; s$-character, $66.7\\%\\; p$-character). Example: $BF_3, C_2H_4$.</li></ul></li><li><strong>sp³ Hybridisation (Tetrahedral):</strong><ul><li>Formed by intermixing one $s$ and three $p$ orbitals ($p_x, p_y, p_z$).</li><li>Produces <strong>four equivalent sp³ hybrid orbitals</strong> directed towards the four corners of a regular tetrahedron at angles of <strong>$109^\\circ 28'$ ($109.5^\\circ$)</strong>.</li><li><strong>Shape:</strong> Tetrahedral ($25\\%\\; s$-character, $75\\%\\; p$-character). Example: $CH_4, CCl_4, NH_3, H_2O$.</li></ul></li></ol>", "verified": "Mixing of comparable energy orbitals; sp (linear, 180°), sp2 (trigonal planar, 120°), sp3 (tetrahedral, 109.5°)"}, {"num": "4.25", "title": "Change in hybridisation of Al in AlCl₃ + Cl⁻ → AlCl₄⁻", "question": "Describe the change in hybridisation (if any) of the Al atom in the following reaction: AlCl₃ + Cl⁻ → AlCl₄⁻.", "approach": "Determine steric number and orbital mixing of Al before and after coordinate bond formation with chloride ion.", "solution": "<p>Let us analyze the coordination and electronic environment of Aluminium ($Al$, $Z=13$) in both species:</p><ol><li><strong>In AlCl₃ (Reactant):</strong><ul><li>Aluminium has 3 valence electrons ($3s^2 3p^1$). In the excited state, it has three unpaired electrons ($3s^1 3p_x^1 3p_y^1$) with one vacant $3p_z$ orbital.</li><li>It forms 3 single $\\sigma$-bonds with three chlorine atoms.</li><li>Number of electron pairs around Al = 3 bond pairs + 0 lone pairs = 3.</li><li>Hybridisation of Al in $AlCl_3$ is <strong>sp²</strong> (trigonal planar geometry).</li></ul></li><li><strong>In AlCl₄⁻ (Product):</strong><ul><li>The chloride ion ($:Cl̈⁻:$) donates an electron pair into the empty unhybridized $3p_z$ orbital of Aluminium to form a coordinate covalent bond.</li><li>Aluminium is now bonded to 4 chlorine atoms via $\\sigma$-bonds.</li><li>Number of electron pairs around Al = 4 bond pairs + 0 lone pairs = 4.</li><li>To accommodate four bonding pairs symmetrically, one $3s$ and three $3p$ orbitals mix, resulting in <strong>sp³ hybridisation</strong> (tetrahedral geometry).</li></ul></li></ol><p><strong>Conclusion:</strong> The hybridisation of the Aluminium atom changes from <strong>sp² to sp³</strong> (geometry changes from trigonal planar to tetrahedral).</p>", "verified": "Hybridisation of Al changes from sp² (trigonal planar) to sp³ (tetrahedral)"}, {"num": "4.26", "title": "Change in hybridisation of B and N in BF₃ + NH₃ → F₃B·NH₃", "question": "Is there any change in the hybridisation of B and N atoms as a result of the following reaction? BF₃ + NH₃ → F₃B·NH₃.", "approach": "Analyze steric numbers of B and N before and after formation of the B-N coordinate dative bond.", "solution": "<p>Let us examine the hybridization of both Boron and Nitrogen before and after adduct formation:</p><ol><li><strong>Before Reaction:</strong><ul><li><strong>Boron in BF₃:</strong> Boron ($Z=5$) has 3 valence electrons and forms 3 $\\sigma$-bonds with fluorine atoms with zero lone pairs. Steric number = 3. Hybridisation of Boron is <strong>sp²</strong> (trigonal planar geometry, with an empty $2p_z$ orbital).</li><li><strong>Nitrogen in NH₃:</strong> Nitrogen ($Z=7$) forms 3 $\\sigma$-bonds with hydrogen atoms and retains 1 lone pair. Steric number = 3 bond pairs + 1 lone pair = 4. Hybridisation of Nitrogen is <strong>sp³</strong> (pyramidal geometry).</li></ul></li><li><strong>After Reaction in the Adduct (F₃B ← :NH₃):</strong><ul><li>Nitrogen donates its non-bonding lone pair into the vacant $2p_z$ orbital of Boron, forming a coordinate covalent (dative) bond: $F_3B \\leftarrow NH_3$.</li><li><strong>Boron in F₃B·NH₃:</strong> Boron now has 4 bonding pairs (three $B-F$ $\\sigma$-bonds and one $B-N$ coordinate $\\sigma$-bond) and 0 lone pairs. Steric number = 4. Hybridisation of Boron changes from <strong>sp² to sp³</strong> (geometry around B becomes tetrahedral).</li><li><strong>Nitrogen in F₃B·NH₃:</strong> Nitrogen still has 4 bonding pairs (three $N-H$ bonds and one $N-B$ bond) and 0 lone pairs. Steric number = 4. Hybridisation of Nitrogen remains <strong>sp³</strong> (geometry around N becomes tetrahedral).</li></ul></li></ol><p><strong>Summary:</strong></p><ul><li>Hybridisation of <strong>Boron changes from sp² to sp³</strong>.</li><li>Hybridisation of <strong>Nitrogen does NOT change</strong> (it remains <strong>sp³</strong> throughout).</li></ul>", "verified": "Boron changes from sp² to sp³; Nitrogen remains sp³"}, {"num": "4.27", "title": "Orbital diagrams for double and triple bonds in C₂H₄ and C₂H₂", "question": "Draw diagrams showing the formation of a double bond and a triple bond between carbon atoms in C₂H₄ and C₂H₂ molecules.", "approach": "Describe axial (head-on) sigma overlap and lateral (sideways) pi overlap of hybrid and unhybridized p-orbitals in ethene and ethyne.", "solution": "<p><strong>1. Formation of Double Bond in Ethene (C₂H₄):</strong></p><ul><li>Each carbon atom is in an <strong>sp² hybridized</strong> state, having three $sp^2$ hybrid orbitals in a plane at $120^\\circ$ and one unhybridized $2p_z$ orbital perpendicular to the molecular plane.</li><li><strong>Sigma ($\\sigma$) Framework:</strong> One $sp^2$ hybrid orbital of $C_1$ overlaps axially (head-on) with one $sp^2$ hybrid orbital of $C_2$ along the internuclear axis to form a strong $C-C$ $\\sigma$-bond. The remaining two $sp^2$ orbitals on each carbon overlap axially with $1s$ orbitals of hydrogen atoms to form four $C-H$ $\\sigma$-bonds.</li><li><strong>Pi ($\\pi$) Bond:</strong> The unhybridized parallel $2p_z$ orbitals on adjacent carbon atoms overlap sideways (laterally) above and below the molecular plane to form one $C=C$ $\\pi$-bond.</li><li><em>Result:</em> Double bond consists of <strong>1 $\\sigma$-bond + 1 $\\pi$-bond</strong>.</li></ul><p><strong>2. Formation of Triple Bond in Ethyne (C₂H₂):</strong></p><ul><li>Each carbon atom is in an <strong>sp hybridized</strong> state, having two collinear $sp$ hybrid orbitals at $180^\\circ$ and two unhybridized mutually perpendicular orbitals: $2p_y$ and $2p_z$.</li><li><strong>Sigma ($\\sigma$) Framework:</strong> One $sp$ orbital of $C_1$ overlaps axially with one $sp$ orbital of $C_2$ to form a $C-C$ $\\sigma$-bond. The other $sp$ orbital on each carbon overlaps axially with $1s$ of hydrogen to form two $C-H$ $\\sigma$-bonds (linear $H-C-C-H$ framework).</li><li><strong>Two Pi ($\\pi$) Bonds:</strong> The parallel $2p_y$ orbitals on both carbons overlap laterally to form one $\\pi$-bond ($\\pi_y$). Concurrently, the parallel $2p_z$ orbitals overlap laterally in an orthogonal plane to form a second $\\pi$-bond ($\\pi_z$). Together, they form a cylindrical sheath of $\\pi$-electron density surrounding the internuclear axis.</li><li><em>Result:</em> Triple bond consists of <strong>1 $\\sigma$-bond + 2 $\\pi$-bonds</strong>.</li></ul>", "verified": "C2H4: 1 sp2-sp2 sigma + 1 2pz-2pz pi; C2H2: 1 sp-sp sigma + 2 lateral pi bonds (2py-2py and 2pz-2pz)"}, {"num": "4.28", "title": "Total number of sigma and pi bonds in C₂H₂ and C₂H₄", "question": "What is the total number of sigma and pi bonds in the following molecules? (a) C₂H₂, (b) C₂H₄.", "approach": "Count single bonds as sigma, double bonds as one sigma + one pi, and triple bonds as one sigma + two pi.", "solution": "<p><strong>(a) Ethyne (C₂H₂):</strong></p><ul><li>Structural formula: $\\text{H} — \\text{C} \\equiv \\text{C} — \\text{H}$</li><li>$C-H$ single bonds: $2$ $\\sigma$-bonds</li><li>$C\\equiv C$ triple bond: $1$ $\\sigma$-bond and $2$ $\\pi$-bonds</li><li><strong>Total $\\sigma$-bonds = 2 + 1 = 3</strong></li><li><strong>Total $\\pi$-bonds = 2</strong></li></ul><p><strong>(b) Ethene (C₂H₄):</strong></p><ul><li>Structural formula: $\\text{H}_2\\text{C} = \\text{CH}_2$</li><li>$C-H$ single bonds: $4$ $\\sigma$-bonds</li><li>$C=C$ double bond: $1$ $\\sigma$-bond and $1$ $\\pi$-bond</li><li><strong>Total $\\sigma$-bonds = 4 + 1 = 5</strong></li><li><strong>Total $\\pi$-bonds = 1</strong></li></ul>", "verified": "(a) C2H2: 3 sigma, 2 pi; (b) C2H4: 5 sigma, 1 pi"}, {"num": "4.29", "title": "Orbital overlap along x-axis and sigma bond formation", "question": "Considering x-axis as the internuclear axis which out of the following will not form a sigma bond and why? (a) 1s and 1s, (b) 1s and 2pₓ, (c) 2p_y and 2p_y, (d) 1s and 2s.", "approach": "Evaluate cylindrical axial symmetry around the x-axis vs lateral perpendicular orientation.", "solution": "<p>A <strong>sigma ($\\sigma$) bond</strong> is formed by end-to-end (axial / head-on) overlap of atomic orbitals along the chosen internuclear axis (here specified as the <strong>x-axis</strong>), producing an electron density cloud that is cylindrically symmetrical about the axis.</p><p>Evaluating each combination along the x-axis:</p><ol><li><strong>(a) 1s and 1s:</strong> Both $s$-orbitals are spherically symmetrical. Overlap along the x-axis is head-on and cylindrically symmetrical $\\implies$ <strong>Forms a $\\sigma$-bond</strong>.</li><li><strong>(b) 1s and 2pₓ:</strong> The $2p_x$ orbital is directed along the x-axis. Overlap with the spherical $1s$ orbital along the x-axis is head-on $\\implies$ <strong>Forms a $\\sigma$-bond</strong>.</li><li><strong>(c) 2p_y and 2p_y:</strong> The $2p_y$ orbitals are oriented along the y-axis, which is strictly <strong>perpendicular to the internuclear x-axis</strong>. When two parallel $2p_y$ orbitals approach along the x-axis, they cannot overlap head-on; they undergo lateral (sideways) overlap above and below the internuclear axis. This produces a nodal plane passing through the x-axis and generates a <strong>$\\pi$-bond, NOT a $\\sigma$-bond</strong>.</li><li><strong>(d) 1s and 2s:</strong> Spherical orbitals overlapping along any axis do so head-on with cylindrical symmetry $\\implies$ <strong>Forms a $\\sigma$-bond</strong>.</li></ol><p><strong>Conclusion:</strong> <strong>(c) 2p_y and 2p_y will NOT form a sigma bond</strong> (it forms a $\\pi$-bond).</p>", "verified": "(c) 2py and 2py forms a pi bond because orbitals are perpendicular to the internuclear x-axis"}, {"num": "4.30", "title": "Hybrid orbitals used by carbon atoms in organic molecules", "question": "Which hybrid orbitals are used by carbon atoms in the following molecules? (a) CH₃–CH₃; (b) CH₃–CH=CH₂; (c) CH₃–CH₂–OH; (d) CH₃–CHO; (e) CH₃COOH.", "approach": "Determine steric number of each carbon: 4 single bonds = sp3, 1 double + 2 single = sp2, 1 triple + 1 single = sp.", "solution": "<p>The hybridization of each carbon atom is determined by counting its steric number (number of $\\sigma$-bonds formed):</p><ol><li><strong>(a) CH₃–CH₃ (Ethane):</strong> Both $C_1$ and $C_2$ form 4 single $\\sigma$-bonds (three $C-H$ and one $C-C$). Both carbon atoms are <strong>sp³ hybridized</strong>.</li><li><strong>(b) CH₃–CH=CH₂ (Propene):</strong><ul><li>$C_3$ (methyl carbon): forms 4 $\\sigma$-bonds $\\implies$ <strong>sp³</strong>.</li><li>$C_2$ (middle $-\\text{CH}=$): forms 3 $\\sigma$-bonds ($1\\; C-C, 1\\; C=C, 1\\; C-H$) and $1\\; \\pi$-bond $\\implies$ <strong>sp²</strong>.</li><li>$C_1$ (terminal $=\\text{CH}_2$): forms 3 $\\sigma$-bonds ($1\\; C=C, 2\\; C-H$) and $1\\; \\pi$-bond $\\implies$ <strong>sp²</strong>.</li></ul></li><li><strong>(c) CH₃–CH₂–OH (Ethanol):</strong> Both the methyl carbon ($-\\text{CH}_3$) and the methylene carbon ($-\\text{CH}_2-$) form 4 single $\\sigma$-bonds $\\implies$ both are <strong>sp³ hybridized</strong>.</li><li><strong>(d) CH₃–CHO (Ethanal / Acetaldehyde):</strong><ul><li>$C_2$ (methyl carbon, $-\\text{CH}_3$): forms 4 $\\sigma$-bonds $\\implies$ <strong>sp³</strong>.</li><li>$C_1$ (carbonyl carbon, $-\\text{CH}=\\text{O}$): forms 3 $\\sigma$-bonds ($1\\; C-C, 1\\; C-H, 1\\; C=O$) and $1\\; \\pi$-bond $\\implies$ <strong>sp²</strong>.</li></ul></li><li><strong>(e) CH₃COOH (Ethanoic / Acetic acid):</strong><ul><li>$C_2$ (methyl carbon, $-\\text{CH}_3$): forms 4 $\\sigma$-bonds $\\implies$ <strong>sp³</strong>.</li><li>$C_1$ (carboxyl carbon, $-\\text{COOH}$): forms 3 $\\sigma$-bonds ($1\\; C-C, 1\\; C-OH, 1\\; C=O$) and $1\\; \\pi$-bond $\\implies$ <strong>sp²</strong>.</li></ul></li></ol>", "verified": "(a) both sp3; (b) sp3, sp2, sp2; (c) both sp3; (d) sp3, sp2; (e) sp3, sp2"}, {"num": "4.31", "title": "Bond pairs and lone pairs of electrons with illustrations", "question": "What do you understand by bond pairs and lone pairs of electrons? Illustrate by giving one example of each type.", "approach": "Define shared bonding valence electrons vs non-bonding localized valence electrons with clear molecular examples.", "solution": "<p><strong>1. Bond Pair (Bonding Electron Pair):</strong></p><ul><li>A <strong>bond pair</strong> consists of a pair of valence electrons shared between two bonded atoms that participates directly in holding the nuclei together through a covalent bond.</li><li>Because it is subjected to the simultaneous electrostatic attraction of two positive atomic nuclei, a bond pair is spatially localized between the bonded centers and occupies relatively less angular space around either single atom.</li><li><strong>Illustration:</strong> In methane ($CH_4$), carbon has 4 valence electrons and shares them with 4 hydrogen atoms to form four $C-H$ covalent bonds. All 8 valence electrons exist as <strong>4 bond pairs</strong> (0 lone pairs).</li></ul><p><strong>2. Lone Pair (Non-bonding Electron Pair):</strong></p><ul><li>A <strong>lone pair</strong> is a pair of valence electrons on an atom that does not participate in chemical bonding with other atoms.</li><li>Because a lone pair is attracted by only one atomic nucleus, its electron cloud is broader, less confined, and occupies greater angular volume in the valence shell, exerting stronger repulsions on neighboring electron pairs.</li><li><strong>Illustration:</strong> In ammonia ($NH_3$), nitrogen's 5 valence electrons form 3 bond pairs with three hydrogen atoms, leaving 2 unshared electrons that constitute <strong>1 lone pair</strong> (:NH₃). In water ($H_2O$), the oxygen atom holds <strong>2 bond pairs and 2 lone pairs</strong>.</li></ul>", "verified": "Bond pair = shared between 2 nuclei (CH4 has 4 bp); Lone pair = non-bonding on single nucleus (NH3 has 1 lp, H2O has 2 lp)"}, {"num": "4.32", "title": "Distinction between a sigma and a pi bond", "question": "Distinguish between a sigma and a pi bond.", "approach": "Systematize differences across overlap mode, orbital types, extent of overlap, electron distribution symmetry, bond strength, and rotational freedom.", "solution": "<p>The key differences between a <strong>sigma ($\\sigma$) bond</strong> and a <strong>pi ($\\pi$) bond</strong> are summarized below:</p><table><thead><tr><th>Property</th><th>Sigma ($\\sigma$) Bond</th><th>Pi ($\\pi$) Bond</th></tr></thead><tbody><tr><td><strong>Mode of Overlap</strong></td><td>Formed by <strong>axial (end-to-end / head-on)</strong> overlap of atomic orbitals along the internuclear axis.</td><td>Formed by <strong>lateral (sideways)</strong> overlap of atomic orbitals perpendicular to the internuclear axis.</td></tr><tr><td><strong>Orbitals Involved</strong></td><td>Can involve $s-s$, $s-p$, $p-p$, or hybrid orbitals ($sp, sp^2, sp^3$).</td><td>Formed exclusively by unhybridized pure $p$ or $d$ orbitals.</td></tr><tr><td><strong>Extent of Overlap</strong></td><td>Large extent of overlap along the internuclear axis.</td><td>Lesser extent of overlap due to parallel geometry.</td></tr><tr><td><strong>Bond Strength</strong></td><td><strong>Stronger</strong> bond; high bond dissociation enthalpy.</td><td><strong>Weaker</strong> bond; lower bond dissociation enthalpy.</td></tr><tr><td><strong>Electron Symmetry</strong></td><td>Cylindrically symmetrical around the internuclear axis; no nodal plane along the axis.</td><td>Consists of two electron clouds (above and below plane) with a <strong>nodal plane</strong> passing through the axis.</td></tr><tr><td><strong>Independent Existence</strong></td><td>Can exist independently as a stable single bond.</td><td>Cannot exist independently; always accompanies a pre-existing $\\sigma$-bond.</td></tr><tr><td><strong>Free Rotation</strong></td><td>Free rotation about a $\\sigma$-bond is permissible.</td><td>Rotation about a $\\pi$-bond is restricted (causes bond breakage), enabling cis-trans isomerism.</td></tr></tbody></table>", "verified": "Axial vs lateral overlap, high vs low extent of overlap, sigma stronger than pi, free vs restricted rotation"}, {"num": "4.33", "title": "Formation of H₂ molecule using Valence Bond Theory", "question": "Explain the formation of H₂ molecule on the basis of valence bond theory.", "approach": "Discuss the Heitler-London quantum treatment, balance of attractive and repulsive forces, potential energy curve, bond length (74 pm), and bond enthalpy (435.8 kJ/mol).", "solution": "<p>Valence Bond Theory was applied to the hydrogen molecule by Heitler and London (1927) and extended by Pauling and Slater.</p><ol><li><strong>Initial State (Infinite Separation):</strong> Consider two isolated hydrogen atoms $H_A$ and $H_B$ with nuclei $N_A, N_B$ and electrons $e_A, e_B$. When infinitely separated, there is no interaction between them and the potential energy of the system is taken arbitrarily as zero.</li><li><strong>Forces in Play as Atoms Approach:</strong> As the two atoms approach each other, new forces come into play:<ul><li><strong>Attractive Forces ($F_{att}$):</strong> Nucleus of one atom attracts the electron of the other atom: $N_A-e_B$ and $N_B-e_A$ (in addition to existing $N_A-e_A$ and $N_B-e_B$).</li><li><strong>Repulsive Forces ($F_{rep}$):</strong> Nucleus repels nucleus ($N_A-N_B$) and electron repels electron ($e_A-e_B$).</li></ul></li><li><strong>Net Energy Minimization:</strong> At relatively large distances, the attractive forces exceed the repulsive forces ($F_{att} > F_{rep}$), causing the total potential energy of the system to decrease steadily as the distance $r$ diminishes.</li><li><strong>Equilibrium Bond Formation:</strong> The potential energy reaches a minimum value of <strong>$-435.8\\text{ kJ/mol}$</strong> at an internuclear distance of <strong>$r_0 = 74\\text{ pm}$</strong>. At this distance, attractive and repulsive forces are exactly balanced. This distance ($74\\text{ pm}$) is the <strong>bond length</strong> of $H_2$, and the energy released ($435.8\\text{ kJ/mol}$) is the <strong>bond dissociation enthalpy</strong>.</li><li><strong>Electron Spin Requirement:</strong> A stable bond forms only when the electrons in the overlapping $1s$ orbitals have <strong>opposite (antiparallel) spins</strong>. If the spins were parallel, repulsive forces would dominate at all distances, raising potential energy and preventing bond formation.</li></ol>", "verified": "Heitler-London potential energy curve, balance of attractive vs repulsive forces, r0 = 74 pm, bond energy 435.8 kJ/mol, opposite spins"}, {"num": "4.34", "title": "Conditions for Linear Combination of Atomic Orbitals (LCAO)", "question": "Write the important conditions required for the linear combination of atomic orbitals to form molecular orbitals.", "approach": "State the three fundamental quantum mechanical criteria for effective orbital constructive and destructive overlap.", "solution": "<p>According to Molecular Orbital Theory, atomic orbitals combine linearly (LCAO: $\\psi_{MO} = c_A\\phi_A \\pm c_B\\phi_B$) to generate Bonding Molecular Orbitals (BMO) and Antibonding Molecular Orbitals (ABMO) only when the following three conditions are satisfied:</p><ol><li><strong>Comparable Energies of the Combining Atomic Orbitals:</strong> The combining atomic orbitals must possess identical or nearly identical energies. For homonuclear diatomic molecules, a $1s$ orbital can combine with another $1s$ orbital, and a $2s$ with a $2s$, but a $1s$ orbital cannot combine effectively with a $2s$ or $2p$ orbital because of the significant energy gap between them.</li><li><strong>Same Symmetry with Respect to the Molecular Axis:</strong> The combining atomic orbitals must have the same spatial symmetry with respect to the internuclear axis (conventionally chosen as the z-axis). For example:<ul><li>A $2p_z$ orbital can combine with another $2p_z$ orbital to form a $\\sigma$ MO because both are symmetrical along the z-axis.</li><li>A $2s$ orbital cannot combine with a $2p_x$ or $2p_y$ orbital because the overlap integral is zero (one positive lobe and one negative lobe result in mutual cancellation of overlap).</li></ul></li><li><strong>Maximum Spatial Overlap:</strong> The combining atomic orbitals must overlap to the maximum extent possible. Greater spatial overlap increases the electron probability density between the nuclei in the bonding molecular orbital, leading to a stronger, more stable chemical bond.</li></ol>", "verified": "1. Comparable energy; 2. Same symmetry along molecular axis; 3. Maximum spatial overlap"}, {"num": "4.35", "title": "Why Be₂ molecule does not exist using Molecular Orbital Theory", "question": "Use molecular orbital theory to explain why the Be₂ molecule does not exist.", "approach": "Write the ground state MO configuration for 8 electrons and calculate the resulting bond order.", "solution": "<p>Beryllium has atomic number $Z = 4$, with electronic configuration $1s^2 2s^2$.</p><p>In a hypothetical diatomic $Be_2$ molecule, there would be a total of $2 \\times 4 = 8$ electrons.</p><p><strong>Molecular Orbital Electronic Configuration:</strong></p>$$\\sigma_{1s}^2 \\; \\sigma^*_{1s}^2 \\; \\sigma_{2s}^2 \\; \\sigma^*_{2s}^2$$<p>Counting the electrons:</p><ul><li>Number of bonding electrons ($N_b$): $2$ (in $\\sigma_{1s}$) $+ 2$ (in $\\sigma_{2s}$) = <strong>4</strong></li><li>Number of antibonding electrons ($N_a$): $2$ (in $\\sigma^*_{1s}$) $+ 2$ (in $\\sigma^*_{2s}$) = <strong>4</strong></li></ul><p><strong>Bond Order Calculation:</strong></p>$$\\text{Bond Order} = \\frac{N_b - N_a}{2} = \\frac{4 - 4}{2} = 0$$<p><strong>Conclusion:</strong></p><p>A bond order of <strong>zero</strong> signifies that the destabilizing repulsive energy of the antibonding electrons ($\\sigma^*_{1s}$ and $\\sigma^*_{2s}$) completely cancels the stabilizing attractive energy of the bonding electrons ($\\sigma_{1s}$ and $\\sigma_{2s}$).</p><p>Because there is no net decrease in energy upon dimerization, no chemical bond can form, and the <strong>Be₂ molecule does not exist under standard conditions</strong>.</p>", "verified": "Be2 has 8 e-: σ1s² σ*1s² σ2s² σ*2s²; Nb = 4, Na = 4; Bond Order = (4-4)/2 = 0, so Be2 cannot exist"}, {"num": "4.36", "title": "Relative stability and magnetic properties of O₂, O₂⁺, O₂⁻, O₂²⁻", "question": "Compare the relative stability of the following species and indicate their magnetic properties: O₂, O₂⁺, O₂⁻ (superoxide), O₂²⁻ (peroxide).", "approach": "Write MO configurations for each oxygen species (15 to 18 electrons), deduce bond orders, and evaluate unpaired electrons.", "solution": "<p>The molecular orbital configuration for $O_2$ (16 electrons, where $Z \\ge 8$ so $\\sigma_{2p_z}$ lies lower in energy than $\\pi_{2p_x}, \\pi_{2p_y}$) is:</p>$$\\text{KK} \\; \\sigma_{2s}^2 \\; \\sigma^*_{2s}^2 \\; \\sigma_{2p_z}^2 \\; (\\pi_{2p_x}^2 = \\pi_{2p_y}^2) \\; (\\pi^*_{2p_x}^1 = \\pi^*_{2p_y}^1)$$<p>Evaluating each species:</p><ol><li><strong>O₂⁺ (Dioxygenyl cation, 15 e⁻):</strong><ul><li>One electron removed from antibonding $\\pi^*$: $\\text{KK} \\dots (\\pi^*_{2p_x}^1 = \\pi^*_{2p_y}^0)$.</li><li>$N_b = 8$ (valence), $N_a = 3$ (valence). $\\text{Bond Order} = \\frac{8 - 3}{2} = \\mathbf{2.5}$.</li><li>Contains <strong>1 unpaired electron</strong> $\\implies$ <strong>Paramagnetic</strong>.</li></ul></li><li><strong>O₂ (Dioxygen molecule, 16 e⁻):</strong><ul><li>$N_b = 8$, $N_a = 4$ (two electrons in $\\pi^*$). $\\text{Bond Order} = \\frac{8 - 4}{2} = \\mathbf{2.0}$.</li><li>Contains <strong>2 unpaired electrons</strong> with parallel spins $\\implies$ <strong>Paramagnetic</strong>.</li></ul></li><li><strong>O₂⁻ (Superoxide ion, 17 e⁻):</strong><ul><li>One electron added to antibonding $\\pi^*$: $(\\pi^*_{2p_x}^2 = \\pi^*_{2p_y}^1)$.</li><li>$N_b = 8$, $N_a = 5$. $\\text{Bond Order} = \\frac{8 - 5}{2} = \\mathbf{1.5}$.</li><li>Contains <strong>1 unpaired electron</strong> $\\implies$ <strong>Paramagnetic</strong>.</li></ul></li><li><strong>O₂²⁻ (Peroxide ion, 18 e⁻):</strong><ul><li>Two electrons added to antibonding $\\pi^*$: $(\\pi^*_{2p_x}^2 = \\pi^*_{2p_y}^2)$.</li><li>$N_b = 8$, $N_a = 6$. $\\text{Bond Order} = \\frac{8 - 6}{2} = \\mathbf{1.0}$.</li><li>All electrons are paired ($0$ unpaired electrons) $\\implies$ <strong>Diamagnetic</strong>.</li></ul></li></ol><p><strong>Relative Stability Order:</strong></p><p>Stability is directly proportional to bond order:</p>$$\\mathbf{O_2^+ (\\text{BO}=2.5) > O_2 (\\text{BO}=2.0) > O_2^- (\\text{BO}=1.5) > O_2^{2-} (\\text{BO}=1.0)}$$<ul><li>Paramagnetic species: <strong>O₂⁺, O₂, O₂⁻</strong></li><li>Diamagnetic species: <strong>O₂²⁻</strong></li></ul>", "verified": "Stability: O2+ (2.5) > O2 (2.0) > O2- (1.5) > O2²⁻ (1.0); O2+, O2, O2- paramagnetic, O2²⁻ diamagnetic"}, {"num": "4.37", "title": "Significance of plus and minus signs in orbital wavefunctions", "question": "Write the significance of a plus and a minus sign shown in representing the orbitals.", "approach": "Clarify that plus and minus designate quantum mechanical wavefunction phase signs (ψ), not electrical charges.", "solution": "<p>In quantum mechanics, atomic orbitals are three-dimensional mathematical wave functions (denoted by $\\psi$).</p><p>The <strong>plus ($+$) and minus ($-$) signs</strong> used in orbital lobes do <strong>NOT represent electric or electrostatic charges</strong>. Instead, their physical and mathematical significance is as follows:</p><ol><li><strong>Wave Amplitude Phase:</strong> Like any classical wave (such as a crest and a trough in a water wave or sine wave), the quantum wave function $\\psi$ can have positive or negative algebraic values. The $(+)$ and $(-)$ signs represent the <strong>mathematical phase (sign)</strong> of the orbital wave function in that spatial lobe.</li><li><strong>Constructive vs Destructive Interference in Bonding:</strong><ul><li>When two atomic orbitals overlap with the <strong>same sign (same phase, $+/+$ or $-/-$)</strong>, their wave functions reinforce each other by constructive interference:$$\\psi_{BMO} = \\psi_A + \\psi_B$$This increases electron density $\\psi^2$ between the nuclei, producing a stabilizing <strong>Bonding Molecular Orbital (BMO)</strong>.</li><li>When two atomic orbitals overlap with <strong>opposite signs (opposite phase, $+/-$)</strong>, they interfere destructively:$$\\psi_{ABMO} = \\psi_A - \\psi_B$$This causes the wave amplitude to cancel to zero between the nuclei, creating a <strong>nodal plane</strong> ($\\psi^2 = 0$) and generating a destabilizing <strong>Antibonding Molecular Orbital (ABMO)</strong>.</li></ul></li><li><strong>Probability Density is Always Positive:</strong> The physical probability of finding an electron in space is given by $\\psi^2$ or $|\\psi|^2$, which is strictly positive everywhere regardless of whether $\\psi$ is positive or negative.</li></ol>", "verified": "Signs denote mathematical wave phase (amplitude), not electrical charges; determine constructive (BMO) vs destructive (ABMO) interference"}, {"num": "4.38", "title": "Hybridisation in PCl₅ and why axial bonds are longer than equatorial bonds", "question": "Describe the hybridisation in case of PCl₅. Why are the axial bonds longer as compared to equatorial bonds?", "approach": "Examine sp3d orbital mixing, trigonal bipyramidal geometry, and the unequal 90° repulsions experienced by axial vs equatorial chlorines.", "solution": "<p><strong>1. Hybridisation in PCl₅:</strong></p><ul><li>Phosphorus ($Z = 15$) has ground state valence configuration $3s^2 3p^3 3d^0$.</li><li>In the excited state, one $3s$ electron is promoted into a vacant $3d_{z^2}$ orbital, giving five unpaired electrons: $3s^1 3p_x^1 3p_y^1 3p_z^1 3d_{z^2}^1$.</li><li>These five atomic orbitals intermix to form <strong>five equivalent sp³d hybrid orbitals</strong> directed towards the vertices of a <strong>trigonal bipyramid</strong>.</li><li>These orbitals overlap with singly occupied $3p$ orbitals of five chlorine atoms to form five $P-Cl$ $\\sigma$-bonds.</li></ul><p><strong>2. Why Axial Bonds are Longer than Equatorial Bonds:</strong></p><ul><li>The five $P-Cl$ bonds in $PCl_5$ are not spatially equivalent:<ul><li><strong>Three Equatorial Bonds:</strong> Lie in a horizontal plane directed towards the vertices of an equilateral triangle, with bond angles of <strong>$120^\\circ$</strong>.</li><li><strong>Two Axial Bonds:</strong> Lie along the vertical axis perpendicular to the equatorial plane (one above and one below), making bond angles of <strong>$90^\\circ$</strong> with the three equatorial bonds.</li></ul></li><li>According to VSEPR theory, repulsive forces decrease rapidly with increasing bond angle, so repulsions at $90^\\circ$ are vastly more severe than at $120^\\circ$:<ul><li>Each <strong>axial bond pair</strong> experiences three strong $90^\\circ$ repulsions from the three equatorial bond pairs.</li><li>Each <strong>equatorial bond pair</strong> experiences only two $90^\\circ$ repulsions (from the two axial bonds) and two gentler $120^\\circ$ repulsions.</li></ul></li><li>To minimize this intense electrostatic repulsion, the two axial chlorine atoms are pushed further away from the central phosphorus atom.</li><li>Consequently, <strong>axial P–Cl bonds ($219\\text{ pm}$) are significantly longer and weaker than equatorial P–Cl bonds ($204\\text{ pm}$)</strong>. This also explains why heating $PCl_5$ readily cleaves the two weaker axial bonds: $PCl_5(s) \\xrightarrow{\\Delta} PCl_3(g) + Cl_2(g)$.</li></ul>", "verified": "sp³d hybridisation (trigonal bipyramidal); axial bonds suffer 3 repulsions at 90° vs 2 for equatorial, making axial bonds (219 pm) longer than equatorial (204 pm)"}, {"num": "4.39", "title": "Definition of hydrogen bond and comparison with van der Waals forces", "question": "Define hydrogen bond. Is it weaker or stronger than the van der Waals forces?", "approach": "Define H-bonding as dipole-dipole attraction between covalently bound H to electronegative atom and a nearby electronegative atom, then compare energetic magnitudes.", "solution": "<p><strong>Definition:</strong></p><p>A <strong>hydrogen bond</strong> is the attractive electrostatic force that binds a hydrogen atom—which is already covalently linked to a strongly electronegative atom of small atomic size (principally <strong>Fluorine, Oxygen, or Nitrogen</strong>)—to another electronegative atom of the same or another molecule.</p><p>It is represented by a dashed or dotted line:</p>$$\\cdots \\overset{\\delta-}{\\text{X}} \\;\\text{---}\\; \\overset{\\delta+}{\\text{H}} \\;\\cdots\\cdots\\; \\overset{\\delta-}{\\text{Y}} \\;\\text{---}\\; \\overset{\\delta+}{\\text{H}} \\cdots$$<p><strong>Comparison with van der Waals Forces:</strong></p><p><strong>A hydrogen bond is STRONGER than van der Waals forces</strong>, but substantially weaker than covalent or ionic bonds:</p><ul><li><strong>van der Waals Forces:</strong> Weak non-directional dispersion/dipole forces with typical bond dissociation energies in the range of <strong>$2\\text{ to }10\\text{ kJ/mol}$</strong> ($< 8\\text{ kJ/mol}$).</li><li><strong>Hydrogen Bonds:</strong> Directional electrostatic dipole interactions with bond energies typically between <strong>$10\\text{ and }40\\text{ kJ/mol}$</strong> (and up to $100\\text{ kJ/mol}$ in $F-H\\cdots F^-$).</li><li><strong>Covalent Bonds:</strong> In comparison, covalent bonds are much stronger, typically <strong>$200\\text{ to }450\\text{ kJ/mol}$</strong>.</li></ul><p><em>Conclusion:</em> $\\text{Covalent Bond} \\;(\\sim 400\\text{ kJ/mol}) \\gg \\mathbf{\\text{Hydrogen Bond} \\;(\\sim 10-40\\text{ kJ/mol})} > \\mathbf{\\text{van der Waals Forces} \\;(\\sim 2-10\\text{ kJ/mol})}$.</p>", "verified": "H-bond is dipole attraction between H bonded to F/O/N and another electronegative atom; STRONGER than van der Waals (10-40 vs 2-10 kJ/mol)"}, {"num": "4.40", "title": "Definition and calculation of bond order for N₂, O₂, O₂⁺, O₂⁻", "question": "What is meant by the term bond order? Calculate the bond order of: N₂, O₂, O₂⁺ and O₂⁻.", "approach": "Define bond order as (Nb - Na)/2 and calculate values using molecular orbital electronic configurations.", "solution": "<p><strong>Definition:</strong></p><p>In Molecular Orbital Theory, <strong>bond order</strong> is defined as <em>half the difference between the number of electrons in bonding molecular orbitals ($N_b$) and the number of electrons in antibonding molecular orbitals ($N_a$)</em>:</p>$$\\text{Bond Order} = \\frac{1}{2}(N_b - N_a)$$<p>A positive bond order indicates a stable molecule, and the integer value ($1, 2, 3$) corresponds to a single, double, or triple covalent bond.</p><p><strong>Calculations:</strong></p><ol><li><strong>Nitrogen Molecule (N₂):</strong><ul><li>Total electrons = 14. Configuration (for $Z \\le 7$ where $\\pi_{2p}$ precedes $\\sigma_{2p}$):$$\\sigma_{1s}^2 \\; \\sigma^*_{1s}^2 \\; \\sigma_{2s}^2 \\; \\sigma^*_{2s}^2 \\; (\\pi_{2p_x}^2 = \\pi_{2p_y}^2) \\; \\sigma_{2p_z}^2$$</li><li>Bonding electrons ($N_b$) = $2 + 2 + 4 + 2 = 10$</li><li>Antibonding electrons ($N_a$) = $2 + 2 = 4$</li><li>$$\\mathbf{\\text{Bond Order}(N_2) = \\frac{10 - 4}{2} = \\frac{6}{2} = 3}$$</li></ul></li><li><strong>Oxygen Molecule (O₂):</strong><ul><li>Total electrons = 16. Configuration (for $Z \\ge 8$):$$\\sigma_{1s}^2 \\; \\sigma^*_{1s}^2 \\; \\sigma_{2s}^2 \\; \\sigma^*_{2s}^2 \\; \\sigma_{2p_z}^2 \\; (\\pi_{2p_x}^2 = \\pi_{2p_y}^2) \\; (\\pi^*_{2p_x}^1 = \\pi^*_{2p_y}^1)$$</li><li>$N_b = 10,\\quad N_a = 6$</li><li>$$\\mathbf{\\text{Bond Order}(O_2) = \\frac{10 - 6}{2} = \\frac{4}{2} = 2}$$</li></ul></li><li><strong>Dioxygenyl Cation (O₂⁺):</strong><ul><li>Total electrons = 15. One electron lost from $\\pi^*_{2p}$.</li><li>$N_b = 10,\\quad N_a = 5$</li><li>$$\\mathbf{\\text{Bond Order}(O_2^+) = \\frac{10 - 5}{2} = \\frac{5}{2} = 2.5}$$</li></ul></li><li><strong>Superoxide Ion (O₂⁻):</strong><ul><li>Total electrons = 17. One electron added to $\\pi^*_{2p}$.</li><li>$N_b = 10,\\quad N_a = 7$</li><li>$$\\mathbf{\\text{Bond Order}(O_2^-) = \\frac{10 - 7}{2} = \\frac{3}{2} = 1.5}$$</li></ul></li></ol>", "verified": "Bond order = (Nb - Na)/2; N2 = 3.0, O2 = 2.0, O2+ = 2.5, O2- = 1.5"}], "revision_summary": {"key_laws": [{"name": "Octet Rule (Kossel & Lewis)", "formula": "Atoms share or transfer electrons to achieve ns² np⁶ valence shells", "context": "Explains covalent and ionic bonds; fails for hypovalent (BF3), hypervalent (SF6), and odd-electron (NO2) species."}, {"name": "Formal Charge Equation", "formula": "FC = V − L − (1/2) · S", "context": "Evaluates lowest-energy Lewis resonance canonical forms by minimizing net charges."}, {"name": "Born-Haber Thermochemical Cycle", "formula": "Δ_f H° = Δ_sub H + (1/2)Δ_diss H + Δ_i H + Δ_eg H + U_L", "context": "Hess's Law application to quantify lattice enthalpy (U_L) of ionic crystals."}, {"name": "VSEPR Repulsion Hierarchy", "formula": "lp–lp > lp–bp > bp–bp", "context": "Lone pair electron clouds are broader, squeezing bond angles below ideal symmetric values (e.g. NH3 107.8°, H2O 104.5°)."}, {"name": "Pauling Electronegativity & Dipole Moment", "formula": "μ = q · d; % Ionic Character = 16|Δχ| + 3.5(Δχ)²", "context": "Vector addition determines molecular polarity: CO2 μ=0 D (linear), H2O μ=1.85 D (bent), NH3 (1.47 D) > NF3 (0.24 D)."}, {"name": "Valence Bond & Hybridization", "formula": "sp (180°), sp² (120°), sp³ (109.5°), sp³d (90°/120°), sp³d² (90°)", "context": "Mixing of central atomic orbitals yields directional lobes maximizing axial σ and lateral π overlap."}, {"name": "Molecular Orbital Theory & Bond Order", "formula": "BO = (N_b − N_a) / 2", "context": "Explains O2 paramagnetism (2 unpaired electrons in π*2p) and non-existence of Be2 (BO = 0)."}, {"name": "Hydrogen Bonding", "formula": "X–H ··· Y (where X, Y = F, O, N)", "context": "Electrostatic dipole attraction (10–40 kJ/mol), explaining anomalous boiling point of water and ice open cage structure."}], "common_pitfalls": ["Assuming NF3 has a higher dipole moment than NH3 — NH3 is far higher (1.47 D vs 0.24 D) because N–H bond dipoles reinforce the nitrogen lone pair, while N–F bond dipoles oppose it.", "Believing all P–Cl bonds in PCl5 are identical — the two axial bonds (219 pm) suffer three 90° repulsions and are significantly longer and weaker than the three equatorial bonds (204 pm).", "Assuming Be2 can exist in standard gas phase — Molecular Orbital Theory yields N_b = 4, N_a = 4, giving Bond Order = 0, proving Be2 cannot form a stable covalent bond.", "Confusing structural tautomers with resonance canonical forms — canonical forms must have identical nuclear positions; migration of a proton (like in H3PO3) is isomerism, not resonance.", "Expecting oxygen (O2) to be diamagnetic because all valence electrons appear paired in simple Lewis dots — MOT proves it has 2 unpaired electrons in degenerate π*2p orbitals, making it paramagnetic."]}};
