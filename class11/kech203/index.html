:", "   x = 5, y = 10 ⟹ O₂ coefficient = 5 + 10/4 = 15/2 = 7.5.", "   C₅H₁₀(l) + 15/2 O₂(g) ⟶ 5 CO₂(g) + 5 H₂O(l)", "   Or: 2 C₅H₁₀(l) + 15 O₂(g) ⟶ 10 CO₂(g) + 10 H₂O(l)", "(iii) Hexyne (C₆H₁₀):", "   x = 6, y = 10 ⟹ O₂ coefficient = 6 + 10/4 = 17/2 = 8.5.", "   C₆H₁₀(l) + 17/2 O₂(g) ⟶ 6 CO₂(g) + 5 H₂O(l)", "   Or: 2 C₆H₁₀(l) + 17 O₂(g) ⟶ 12 CO₂(g) + 10 H₂O(l)", "(iv) Toluene (C₇H₈):", "   x = 7, y = 8 ⟹ O₂ coefficient = 7 + 8/4 = 9.", "   C₇H₈(l) + 9 O₂(g) ⟶ 7 CO₂(g) + 4 H₂O(l)"], "answer": "(i) 2 C₄H₁₀ + 13 O₂ ⟶ 8 CO₂ + 10 H₂O; (ii) 2 C₅H₁₀ + 15 O₂ ⟶ 10 CO₂ + 10 H₂O; (iii) 2 C₆H₁₀ + 17 O₂ ⟶ 12 CO₂ + 10 H₂O; (iv) C₇H₈ + 9 O₂ ⟶ 7 CO₂ + 4 H₂O."}, {"number": "9.9", "title": "cis and trans structures of hex-2-ene and boiling point comparison", "question": "Draw the cis and trans structures of hex-2-ene. Which isomer will have higher b.p. and why?", "steps": ["1. Structures of hex-2-ene (CH₃–CH=CH–CH₂CH₂CH₃):", "   - cis-Hex-2-ene: Both the –CH₃ group and the –CH₂CH₂CH₃ group are on the SAME side of the C=C double bond.", "   - trans-Hex-2-ene: The –CH₃ group and the –CH₂CH₂CH₃ group are on OPPOSITE sides of the C=C double bond.", "2. Boiling point comparison:", "   - Alkyl groups are electron-releasing (+I effect) relative to sp² hybridized carbons.", "   - In cis-hex-2-ene, the bond dipoles of the C_sp³–C_sp² bonds point in roughly the same direction, resulting in a net dipole moment (μ > 0).", "   - In trans-hex-2-ene, the bond dipoles point in nearly opposite directions and cancel each other, giving a dipole moment close to zero (μ ≈ 0).", "   - Due to its higher dipole moment, cis-hex-2-ene experiences stronger intermolecular dipole-dipole attractions in addition to London dispersion forces.", "3. Conclusion: cis-Hex-2-ene has a higher boiling point than trans-hex-2-ene."], "answer": "cis-Hex-2-ene has the higher boiling point because its dipole vectors reinforce to produce a net dipole moment (μ > 0), causing stronger intermolecular dipole-dipole attractions than in the near-nonpolar trans isomer."}, {"number": "9.10", "title": "Extraordinary stability of benzene despite three double bonds", "question": "Why is benzene extra ordinarily stable though it contains three double bonds?", "steps": ["1. Electronic Delocalization: All 6 carbon atoms in benzene are sp² hybridized with unhybridized 2p_z orbitals perpendicular to the ring. These 6 p-orbitals overlap laterally to form a completely continuous, delocalized cyclic π-electron cloud above and below the ring plane.", "2. Uniform Bond Character: Because of complete resonance delocalization, all six C–C bonds are completely identical in length (139 pm), intermediate between a pure single bond (154 pm) and pure double bond (134 pm). Benzene does not contain localized single or double bonds.", "3. Resonance Stabilization Energy: The resonance energy of benzene is 150.5 kJ/mol (36 kcal/mol). This represents the thermodynamic stabilization gained relative to a hypothetical localized 1,3,5-cyclohexatriene.", "4. Closed MO Shell: The 6 π-electrons completely fill the three bonding molecular orbitals (ψ₁, ψ₂, ψ₃) with paired spins, resulting in an exceptionally stable closed electronic shell analogous to noble gases.", "Conclusion: The extensive resonance delocalization and huge resonance energy of 150.5 kJ/mol confer extraordinary stability on benzene, causing it to resist addition reactions and favor substitution."], "answer": "Benzene is extraordinarily stable due to complete delocalization of its 6 π-electrons over the entire hexagonal planar ring, yielding a substantial resonance energy of 150.5 kJ/mol (36 kcal/mol)."}, {"number": "9.11", "title": "Necessary conditions for aromaticity (Hückel criteria)", "question": "What are the necessary conditions for any system to be aromatic?", "steps": ["For a chemical compound to be aromatic, it must satisfy four fundamental criteria:", "1. Cyclic Structure: The molecule or ion must contain at least one closed ring of atoms.", "2. Planarity: The ring atoms must lie strictly in a flat, planar (or nearly planar) geometry so that p-orbitals remain parallel for effective lateral overlap.", "3. Complete Conjugation: Every atom in the ring must possess an unhybridized p-orbital (sp² or sp hybridized), allowing complete cyclic delocalization of π-electrons with no intervening sp³ carbon.", "4. Hückel's Rule of (4n + 2) π-Electrons: The ring must contain (4n + 2) delocalized π-electrons, where n is zero or a positive integer (n = 0, 1, 2, 3... ⟹ 2, 6, 10, 14, 18 π-electrons)."], "answer": "The necessary conditions are: (1) Cyclic ring structure, (2) Planarity, (3) Complete cyclic conjugation (all ring atoms sp²/sp), and (4) Presence of (4n + 2) delocalized π-electrons (Hückel's rule)."}, {"number": "9.12", "title": "Explain why three specified systems are not aromatic", "question": "Explain why the following systems are not aromatic?\n(i) Methylenecyclohexadiene (exocyclic =CH₂)\n(ii) 1,3-Cyclopentadiene\n(iii) Cyclooctatetraene", "steps": ["(i) Methylenecyclohexadiene (exocyclic =CH₂):", "   - The ring has only 4 π-electrons from its two ring double bonds, while the remaining 2 π-electrons are localized in the exocyclic C=CH₂ bond outside the ring.", "   - Because the ring itself lacks a closed cyclic sextet of (4n + 2) delocalized π-electrons, it does not satisfy Hückel's criterion for ring aromaticity.", "(ii) 1,3-Cyclopentadiene:", "   - The ring contains a –CH₂– methylene carbon atom that is sp³ hybridized.", "   - This sp³ carbon atom has no unhybridized p-orbital, completely breaking the cyclic conjugation across the ring.", "   - Because the π-electron system is not completely conjugated, the system is non-aromatic.", "(iii) Cyclooctatetraene (C₈H₈):", "   - Possesses 8 π-electrons (four double bonds).", "   - 8 is a 4n number (where n = 2), which would make the molecule antiaromatic and highly unstable if it were planar.", "   - To escape antiaromatic destabilization, cyclooctatetraene adopts a non-planar 'tub-shaped' conformation.", "   - Because it is non-planar, p-orbitals cannot overlap continuously, making it an ordinary non-aromatic conjugated polyene."], "answer": "(i) Ring itself lacks a closed (4n+2) cyclic π system; (ii) The sp³ –CH₂– carbon interrupts cyclic conjugation; (iii) Cyclooctatetraene has 8 π-electrons (4n) and avoids antiaromaticity by puckering into a non-planar tub shape."}, {"number": "9.13", "title": "Synthesis of four substituted benzenes from benzene", "question": "How will you convert benzene into\n(i) p-nitrobromobenzene\n(ii) m-nitrochlorobenzene\n(iii) p-nitrotoluene\n(iv) acetophenone?", "steps": ["(i) Benzene to p-nitrobromobenzene:", "   - Step 1: Brominate benzene with Br₂ in the presence of FeBr₃ catalyst to yield bromobenzene.", "   - Step 2: Nitrate bromobenzene using conc. HNO₃ + conc. H₂SO₄.", "   - Bromine is an ortho/para director (due to +R effect), directing –NO₂ to ortho and para positions.", "   - The para isomer (p-nitrobromobenzene) is less sterically hindered and separated by fractional crystallization.", "(ii) Benzene to m-nitrochlorobenzene:", "   - Step 1: Nitrate benzene first with conc. HNO₃ + conc. H₂SO₄ at 323–333 K to yield nitrobenzene.", "   - Step 2: Chlorinate nitrobenzene with Cl₂ in the presence of anhydrous FeCl₃ catalyst.", "   - The –NO₂ group is a strong meta-director (due to -I and -R effects), directing the incoming Cl to the meta position, cleanly forming m-nitrochlorobenzene.", "(iii) Benzene to p-nitrotoluene:", "   - Step 1: Alkylate benzene with methyl chloride (CH₃Cl) in the presence of anhydrous AlCl₃ (Friedel-Crafts alkylation) to yield toluene.", "   - Step 2: Nitrate toluene with conc. HNO₃ + conc. H₂SO₄ at 303–313 K.", "   - The methyl group (–CH₃) is an ortho/para director (via hyperconjugation and +I effect), yielding p-nitrotoluene as the major product.", "(iv) Benzene to acetophenone:", "   - Treat benzene directly with acetyl chloride (CH₃COCl) in the presence of anhydrous AlCl₃ (Friedel-Crafts acylation):", "   C₆H₆ + CH₃COCl ⟶ C₆H₅COCH₃ (Acetophenone) + HCl."], "answer": "(i) Bromination (Br₂/FeBr₃) then Nitration (HNO₃/H₂SO₄); (ii) Nitration (HNO₃/H₂SO₄) then Chlorination (Cl₂/FeCl₃); (iii) Friedel-Crafts alkylation (CH₃Cl/AlCl₃) then Nitration; (iv) Friedel-Crafts acylation (CH₃COCl/AlCl₃)."}, {"number": "9.14", "title": "Identification of 1°, 2°, 3°, 4° carbons and hydrogen counts in branched alkane", "question": "In the alkane H₃C–CH₂–C(CH₃)₂–CH₂–CH(CH₃)₂, identify 1°, 2°, 3°, 4° carbon atoms and give the number of H atoms bonded to each one of these.", "steps": ["Analyze the structure: H₃C(1)–CH₂(2)–C(3)(CH₃)₂–CH₂(4)–CH(5)(CH₃)₂:", "1. Primary (1°) Carbons (bonded to only 1 other carbon):", "   - Terminal left C1: bonded to C2 (3 H atoms).", "   - Two methyl carbons on quaternary C3: each bonded only to C3 (2 × 3 = 6 H atoms).", "   - Two methyl carbons on tertiary C5: each bonded only to C5 (2 × 3 = 6 H atoms).", "   - Total 1° Carbons = 5 carbons.", "   - Total H atoms on 1° carbons = 5 × 3 = 15 H atoms.", "2. Secondary (2°) Carbons (bonded to 2 other carbons):", "   - Carbon C2 (–CH₂–): bonded to C1 and C3 (2 H atoms).", "   - Carbon C4 (–CH₂–): bonded to C3 and C5 (2 H atoms).", "   - Total 2° Carbons = 2 carbons.", "   - Total H atoms on 2° carbons = 2 × 2 = 4 H atoms.", "3. Tertiary (3°) Carbon (bonded to 3 other carbons):", "   - Carbon C5 (–CH–): bonded to C4 and two methyl carbons (1 H atom).", "   - Total 3° Carbons = 1 carbon.", "   - Total H atoms on 3° carbon = 1 H atom.", "4. Quaternary (4°) Carbon (bonded to 4 other carbons):", "   - Carbon C3: bonded to C2, C4, and two methyl carbons (0 H atoms).", "   - Total 4° Carbons = 1 carbon.", "   - Total H atoms on 4° carbon = 0 H atoms.", "Verification: Total carbons = 5 + 2 + 1 + 1 = 9 carbons. Total H = 15 + 4 + 1 + 0 = 20 H (satisfies C_n H_{2n+2} for C₉H₂₀)."], "answer": "1° Carbons: 5 (with 15 H atoms); 2° Carbons: 2 (with 4 H atoms); 3° Carbon: 1 (with 1 H atom); 4° Carbon: 1 (with 0 H atoms)."}, {"number": "9.15", "title": "Effect of branching of an alkane chain on its boiling point", "question": "What effect does branching of an alkane chain has on its boiling point?", "steps": ["1. Molecular Shape: As branching in an alkane increases, the molecule assumes a more compact, spherical geometry.", "2. Surface Area: A sphere possesses the minimum surface area per unit volume. Therefore, branching significantly decreases the molecular surface area of contact between adjacent molecules.", "3. Intermolecular Forces: Alkanes are non-polar molecules held together purely by van der Waals dispersion forces (London forces), which depend directly on molecular contact surface area.", "4. Resulting Boiling Point Trend: Smaller surface area weakens the intermolecular van der Waals forces, requiring less thermal energy to separate molecules into the vapor phase.", "5. Example: Pentane isomers (C₅H₁₂):", "   - n-Pentane (straight chain): b.p. = 36.1°C (309 K)", "   - Isopentane (2-methylbutane, one branch): b.p. = 28.0°C (301 K)", "   - Neopentane (2,2-dimethylpropane, spherical): b.p. = 9.5°C (282.5 K)."], "answer": "Branching decreases the boiling point of an alkane because it makes the molecule more spherical and compact, reducing the surface area of contact and weakening intermolecular van der Waals dispersion forces."}, {"number": "9.16", "title": "Mechanism of Markovnikov vs anti-Markovnikov peroxide addition of HBr to propene", "question": "Addition of HBr to propene yields 2-bromopropane, while in the presence of benzoyl peroxide, the same reaction yields 1-bromopropane. Explain and give mechanism.", "steps": ["1. In the Absence of Peroxide (Electrophilic Addition / Markovnikov Rule):", "   - Mechanism: Ionic addition via carbocation intermediate.", "   - Step 1: H⁺ attacks propene to form a carbocation. Protonation can yield either a 1° carbocation (CH₃CH₂CH₂⁺) or a 2° carbocation (CH₃C⁺HCH₃).", "   - The 2° carbocation is far more stable than the 1° carbocation due to hyperconjugation (6 α-H vs 2 α-H) and +I inductive effect.", "   - Step 2: Bromide ion (Br⁻) rapidly attacks the 2° carbocation:", "     CH₃–C⁺H–CH₃ + Br⁻ ⟶ CH₃–CH(Br)–CH₃ (2-Bromopropane).", "2. In the Presence of Benzoyl Peroxide (Free-Radical Addition / Kharasch Effect):", "   - Mechanism: Homolytic free-radical chain reaction.", "   - Initiation: Peroxide decomposes homolytically to benzoyloxy radicals, which lose CO₂ to form phenyl radicals (•C₆H₅). Phenyl radical abstracts H from HBr to generate a bromine free radical:", "     (C₆H₅COO)₂ ⟶ 2 C₆H₅COO• ⟶ 2 •C₆H₅ + 2 CO₂", "     •C₆H₅ + HBr ⟶ C₆H₆ + Br•", "   - Propagation Step 1: Br• attacks the double bond of propene. Attack at C1 yields a 2° alkyl radical (CH₃C•H–CH₂Br), whereas attack at C2 yields a less stable 1° alkyl radical (CH₃CH(Br)–C•H₂).", "   - Because 2° free radicals are more stable (3° > 2° > 1°), addition occurs predominantly at C1.", "   - Propagation Step 2: The 2° free radical abstracts H from HBr, regenerating Br• and producing 1-bromopropane:", "     CH₃–C•H–CH₂Br + HBr ⟶ CH₃–CH₂–CH₂Br + Br•", "3. Conclusion: The ionic pathway proceeds via the more stable 2° carbocation to yield 2-bromopropane; the radical peroxide pathway proceeds via the more stable 2° free radical to yield 1-bromopropane."], "answer": "Without peroxide, ionic addition via the more stable secondary carbocation (CH₃C⁺HCH₃) yields 2-bromopropane (Markovnikov). With peroxide, a free-radical chain mechanism occurs where Br• adds to C1 to form the more stable secondary carbon radical (CH₃C•HCH₂Br), yielding 1-bromopropane (anti-Markovnikov)."}, {"number": "9.17", "title": "Ozonolysis products of o-xylene supporting Kekulé structure of benzene", "question": "Write down the products of ozonolysis of 1,2-dimethylbenzene (o-xylene). How does the result support Kekulé structure for benzene?", "steps": ["1. Kekulé proposed that benzene exists as a dynamic equilibrium / resonance between two oscillating structures (Structure I and Structure II).", "2. Consider Structure I of o-xylene (double bond between the two methyl-bearing carbon atoms, C1=C2):", "   - Cleavage of C1=C2 (with two –CH₃ groups) yields: CH₃–CO–CO–CH₃ (Dimethylglyoxal / Butane-2,3-dione, 1 mole).", "   - Cleavage of C3=C4 and C5=C6 yields: 2 moles of OHC–CHO (Glyoxal).", "3. Consider Structure II of o-xylene (single bond between the two methyl-bearing carbon atoms, C1–C2, and double bonds at C2=C3, C4=C5, C6=C1):", "   - Cleavage of C2=C3 and C6=C1 yields: 2 moles of CH₃–CO–CHO (Methylglyoxal).", "   - Cleavage of C4=C5 yields: 1 mole of OHC–CHO (Glyoxal).", "4. Combined Products and Molar Ratio:", "   - Glyoxal (OHC–CHO): 2 + 1 = 3 moles", "   - Methylglyoxal (CH₃–CO–CHO): 2 moles", "   - Dimethylglyoxal (CH₃–CO–CO–CH₃): 1 mole", "   - Overall molar ratio = 3 : 2 : 1.", "5. Significance: If o-xylene had only one fixed static structure, it could not simultaneously yield all three dicarbonyl products. The isolation of glyoxal, methylglyoxal, and dimethylglyoxal in a 3:2:1 ratio proves that benzene resonance involves both Kekulé structures."], "answer": "Ozonolysis of o-xylene yields Glyoxal, Methylglyoxal, and Dimethylglyoxal (butane-2,3-dione) in a 3:2:1 molar ratio. This strictly confirms that benzene exists as a resonance hybrid of both Kekulé structures with oscillating double and single bonds."}, {"number": "9.18", "title": "Order of acidity of benzene, n-hexane and ethyne and electronic rationale", "question": "Arrange benzene, n-hexane and ethyne in decreasing order of acidic behaviour. Also give reason for this behaviour.", "steps": ["1. Identify the hybridization of the carbon atom bonded to the abstracted proton:", "   - Ethyne (HC≡CH): Carbon is sp hybridized (50% s-character, 50% p-character).", "   - Benzene (C₆H₆): Carbon is sp² hybridized (33.3% s-character, 66.7% p-character).", "   - n-Hexane (C₆H₁₄): Carbon is sp³ hybridized (25% s-character, 75% p-character).", "2. Electronic Influence of s-Character:", "   - s-Orbitals are spherical and penetrate much closer to the nucleus than directional p-orbitals.", "   - Greater s-character increases the effective electronegativity of the carbon atom.", "   - Electronegativity order: C(sp) [χ ≈ 3.29] > C(sp²) [χ ≈ 2.75] > C(sp³) [χ ≈ 2.50].", "3. Stabilization of Conjugate Base:", "   - Higher electronegativity polarizes the C–H σ-bond (Cδ⁻–Hδ⁺), facilitating proton release.", "   - More importantly, after proton loss, the unshared electron pair of the resulting carbanion is held in an orbital with higher s-character, closer to the nucleus, rendering the conjugate base more stable:", "     HC≡C:⁻ (sp, highly stable) > C₆H₅:⁻ (sp², moderately stable) > C₆H₁₃:⁻ (sp³, highly unstable).", "4. Decreasing Order of Acidity: Ethyne > Benzene > n-Hexane (pK_a ≈ 25 > 43 > 50)."], "answer": "Decreasing order: Ethyne > Benzene > n-Hexane. Higher s-character in the hybrid orbital (sp: 50% > sp²: 33.3% > sp³: 25%) increases carbon's electronegativity, weakening the C–H bond and stabilizing the conjugate carbanion."}, {"number": "9.19", "title": "Why benzene undergoes electrophilic substitution easily and nucleophilic with difficulty", "question": "Why does benzene undergo electrophilic substitution reactions easily and nucleophilic substitutions with difficulty?", "steps": ["1. Electron Density Distribution:", "   - Benzene possesses a continuous, delocalized cloud of 6 π-electrons distributed symmetrically in donut-shaped lobes above and below the planar ring.", "   - This electron-rich π-cloud acts as a Lewis base (nucleophile), exerting electrostatic attraction toward electron-deficient species (electrophiles, E⁺).", "2. Electrostatic Repulsion against Nucleophiles:", "   - Nucleophiles (Nu:⁻) are themselves electron-rich species.", "   - As a nucleophile approaches benzene, severe electrostatic repulsion from the exposed π-electron cloud repels the reagent, creating a formidable activation energy barrier.", "3. Preservation of Aromatic Resonance Energy:", "   - Electrophilic substitution proceeds via the temporary formation of an arenium ion (σ-complex), which rapidly expels H⁺ to recover the complete aromatic sextet and retain the 150.5 kJ/mol resonance stabilization.", "   - Nucleophilic attack would force two electrons into already filled orbitals or require loss of a very poor leaving group (hydride, H⁻), destroying aromaticity."], "answer": "Benzene is wrapped in a delocalized cloud of 6 π-electrons that strongly attracts electron-deficient electrophiles (E⁺) but electrostatically repels electron-rich nucleophiles (Nu⁻). Furthermore, electrophilic substitution readily restores the 150.5 kJ/mol aromatic stabilization."}, {"number": "9.20", "title": "Synthetic conversions of ethyne, ethene, and hexane into benzene", "question": "How would you convert the following compounds into benzene?\n(i) Ethyne\n(ii) Ethene\n(iii) Hexane", "steps": ["(i) Ethyne to Benzene:", "   - Pass ethyne gas through a red-hot iron (or quartz) tube at 873 K (600°C).", "   - Three molecules of ethyne undergo cyclic trimerization to produce benzene:", "   3 CH≡CH ⟶ C₆H₆.", "(ii) Ethene to Benzene:", "   - Step 1: Brominate ethene with Br₂ in CCl₄ to form 1,2-dibromoethane:", "     CH₂=CH₂ + Br₂ ⟶ CH₂Br–CH₂Br", "   - Step 2: Dehydrohalogenate 1,2-dibromoethane using alcoholic KOH followed by sodamide (NaNH₂) to yield ethyne:", "     CH₂Br–CH₂Br + 2 NaNH₂ ⟶ CH≡CH + 2 NaBr + 2 NH₃", "   - Step 3: Pass the ethyne through a red-hot iron tube at 873 K to yield benzene (3 CH≡CH ⟶ C₆H₆).", "(iii) Hexane to Benzene (Aromatization / Catalytic Reforming):", "   - Heat n-hexane at 773 K under 10–20 atm pressure over a catalyst consisting of oxides of chromium (Cr₂O₃), vanadium (V₂O₅), or molybdenum (Mo₂O₃) supported on alumina (Al₂O₃):", "   CH₃(CH₂)₄CH₃ ⟶ C₆H₆ + 4 H₂."], "answer": "(i) Ethyne: Cyclic trimerization through red-hot iron tube at 873 K; (ii) Ethene: Bromination to 1,2-dibromoethane, dehydrohalogenation with NaNH₂ to ethyne, then cyclic trimerization at 873 K; (iii) Hexane: Catalytic aromatization over Cr₂O₃/Al₂O₃ at 773 K and 10–20 atm."}, {"number": "9.21", "title": "Structures of all alkenes yielding 2-methylbutane upon hydrogenation", "question": "Write structures of all the alkenes which on hydrogenation give 2-methylbutane.", "steps": ["1. Identify the carbon skeleton of 2-methylbutane (isopentane):", "   C1–C2(CH₃)–C3–C4  ⟹  CH₃–CH(CH₃)–CH₂–CH₃.", "2. Hydrogenation (H₂ / Ni, Pt, or Pd) adds two hydrogen atoms across a C=C double bond without altering the carbon skeleton.", "3. To find all precursor alkenes, place a double bond between every adjacent pair of carbons in the 2-methylbutane skeleton:", "   - Double bond between C1 and C2:", "     CH₂ = C(CH₃)–CH₂–CH₃ ⟹ 2-Methylbut-1-ene.", "   - Double bond between C2 and C3:", "     CH₃–C(CH₃) = CH–CH₃ ⟹ 2-Methylbut-2-ene.", "   - Double bond between C3 and C4:", "     (CH₃)₂CH–CH = CH₂ ⟹ 3-Methylbut-1-ene.", "4. Verification:", "   - 2-Methylbut-1-ene + H₂ ⟶ 2-Methylbutane", "   - 2-Methylbut-2-ene + H₂ ⟶ 2-Methylbutane", "   - 3-Methylbut-1-ene + H₂ ⟶ 2-Methylbutane", "5. Total number of alkenes = 3."], "answer": "Three alkenes: (1) 2-Methylbut-1-ene [CH₂=C(CH₃)CH₂CH₃], (2) 2-Methylbut-2-ene [(CH₃)₂C=CHCH₃], and (3) 3-Methylbut-1-ene [(CH₃)₂CHCH=CH₂]."}, {"number": "9.22", "title": "Order of decreasing reactivity of substituted benzenes toward electrophiles", "question": "Arrange the following set of compounds in order of their decreasing relative reactivity with an electrophile, E⁺:\n(a) Chlorobenzene, 2,4-dinitrochlorobenzene, p-nitrochlorobenzene\n(b) Toluene, p-H₃C–C₆H₄–NO₂, p-O₂N–C₆H₄–NO₂", "steps": ["The rate of electrophilic aromatic substitution depends on the electron density of the benzene ring:", "- Electron-donating groups (+I, +R, hyperconjugation) activate the ring toward E⁺.", "- Electron-withdrawing groups (-I, -R) deactivate the ring toward E⁺.", "(a) Chlorobenzene, 2,4-dinitrochlorobenzene, p-nitrochlorobenzene:", "   - Chlorine has –I > +R (moderately deactivating).", "   - The nitro group (–NO₂) is a very powerful electron-withdrawing deactivator via both –I and –R effects.", "   - Chlorobenzene has zero –NO₂ groups (most reactive in this series).", "   - p-Nitrochlorobenzene has one –NO₂ group (more deactivated).", "   - 2,4-Dinitrochlorobenzene has two –NO₂ groups (most severely deactivated).", "   - Decreasing reactivity order: Chlorobenzene > p-Nitrochlorobenzene > 2,4-Dinitrochlorobenzene.", "(b) Toluene, p-H₃C–C₆H₄–NO₂, p-O₂N–C₆H₄–NO₂ (1,4-dinitrobenzene):", "   - Toluene has an electron-releasing methyl group (+I, hyperconjugation), which strongly activates the ring.", "   - In p-nitrotoluene (p-H₃C–C₆H₄–NO₂), the activating effect of –CH₃ is partially counteracted by the deactivating –NO₂ group.", "   - In 1,4-dinitrobenzene (p-O₂N–C₆H₄–NO₂), two powerful electron-withdrawing –NO₂ groups drastically deplete ring electron density.", "   - Decreasing reactivity order: Toluene > p-Nitrotoluene > 1,4-Dinitrobenzene."], "answer": "(a) Chlorobenzene > p-Nitrochlorobenzene > 2,4-Dinitrochlorobenzene; (b) Toluene > p-Nitrotoluene > 1,4-Dinitrobenzene."}, {"number": "9.23", "title": "Ease of nitration comparison among benzene, m-dinitrobenzene and toluene", "question": "Out of benzene, m–dinitrobenzene and toluene which will undergo nitration most easily and why?", "steps": ["1. Nitration is an electrophilic aromatic substitution reaction where the active attacking electrophile is the nitronium ion (NO₂⁺).", "2. Substituent Electronic Effects:", "   - Toluene (C₆H₅CH₃): The methyl group (–CH₃) is an electron-donating substituent. It donates electron density into the ring through hyperconjugation and +I inductive effect, increasing ring π-electron density and stabilizing the arenium ion intermediate. Thus, toluene is activated.", "   - Benzene (C₆H₆): Unsubstituted baseline reference standard.", "   - m-Dinitrobenzene [C₆H₄(NO₂)₂]: Contains two strongly electron-withdrawing nitro groups (–NO₂) exhibiting both powerful –I inductive and –R resonance effects. These pull electron density out of the ring, severely destabilizing the arenium ion and deactivating the ring toward electrophilic attack.", "3. Conclusion: Toluene undergoes nitration most easily, roughly 25 times faster than benzene. Order: Toluene > Benzene > m-Dinitrobenzene."], "answer": "Toluene undergoes nitration most easily because the electron-donating methyl group (–CH₃) activates the benzene ring via hyperconjugation and +I inductive effect, enhancing electron density for electrophilic attack."}, {"number": "9.24", "title": "Alternative Lewis acid catalyst for ethylation of benzene", "question": "Suggest the name of a Lewis acid other than anhydrous aluminium chloride which can be used during ethylation of benzene.", "steps": ["1. Ethylation of benzene is a Friedel-Crafts alkylation reaction: C₆H₆ + C₂H₅Cl ⟶ C₆H₅C₂H₅ + HCl.", "2. Role of the Catalyst: The catalyst must be an electron-deficient Lewis acid capable of coordinating with the chlorine atom of ethyl chloride to generate an electrophilic ethyl cation or polarized complex [C₂H₅⁺ ··· Cl–LA⁻].", "3. Suitable Lewis Acid Alternatives to anhydrous AlCl₃:", "   - Anhydrous Iron(III) chloride (FeCl₃)", "   - Boron trifluoride (BF₃)", "   - Tin(IV) chloride (SnCl₄)", "   - Antimony pentachloride (SbCl₅)", "   - Anhydrous Zinc chloride (ZnCl₂)."], "answer": "Anhydrous Ferric chloride (FeCl₃) or Boron trifluoride (BF₃)."}, {"number": "9.25", "title": "Why Wurtz reaction is not preferred for odd-carbon alkanes", "question": "Why is Wurtz reaction not preferred for the preparation of alkanes containing odd number of carbon atoms? Illustrate your answer by taking one example.", "steps": ["1. Wurtz reaction involves coupling of alkyl halides with sodium in dry ether:", "   2 R–X + 2 Na ⟶ R–R + 2 NaX.", "   This method is excellent for preparing symmetrical alkanes with an even number of carbon atoms using a single alkyl halide.", "2. Preparing an Alkane with an Odd Number of Carbons:", "   - To synthesize an alkane with an odd number of carbons (e.g., propane, C₃H₈), two different alkyl halides must be used: an alkyl halide with 1 carbon (iodomethane, CH₃I) and an alkyl halide with 2 carbons (iodoethane, C₂H₅I).", "3. Competing Reactions in the Matrix:", "   Sodium reacts indiscriminately with both halides, producing a statistical mixture of three distinct alkanes:", "   (a) Cross-coupling: CH₃I + C₂H₅I + 2 Na ⟶ CH₃–CH₂–CH₃ (Propane, desired odd-carbon alkane)", "   (b) Self-coupling of methyl iodide: 2 CH₃I + 2 Na ⟶ CH₃–CH₃ (Ethane) + 2 NaI", "   (c) Self-coupling of ethyl iodide: 2 C₂H₅I + 2 Na ⟶ CH₃–CH₂–CH₂–CH₃ (Butane) + 2 NaI", "4. Separation Difficulty and Poor Yield:", "   - A mixture of ethane (b.p. −89°C), propane (b.p. −42°C), and butane (b.p. −0.5°C) is formed.", "   - Fractional distillation of such volatile homologues is difficult and economically inefficient.", "   - The percentage yield of the desired odd-carbon alkane is unacceptably low."], "answer": "Wurtz reaction fails for odd-carbon alkanes because using two different alkyl halides (e.g. CH₃I and C₂H₅I for propane) produces a mixture of three different alkanes (ethane, propane, and butane) that are difficult to separate, resulting in extremely poor yields."}], "revision_summary": {"key_laws": [{"name": "Ethane Torsional Rotation Barrier", "formula": "ΔE_torsional = 12.55 kJ/mol (4.18 kJ/mol per H–H eclipse)", "context": "Staggered conformation (θ = 60°) minimizes electronic repulsion; eclipsed (θ = 0°) suffers maximum torsional strain."}, {"name": "Free-Radical Halogenation Chain Mechanism", "formula": "Initiation (Cl₂ ⟶ 2 Cl•) + Propagation (Cl• + CH₄ ⟶ •CH₃ + HCl; •CH₃ + Cl₂ ⟶ CH₃Cl + Cl•) + Termination (•CH₃ + •CH₃ ⟶ C₂H₆)", "context": "Formation of trace ethane during methane chlorination confirms methyl radical intermediate."}, {"name": "Markovnikov's Addition Rule", "formula": "R–CH=CH₂ + H–X ⟶ R–CH(X)–CH₃ (via more stable 2° carbocation R–C⁺H–CH₃)", "context": "Governed by carbocation stability (3° > 2° > 1°) and hyperconjugation."}, {"name": "Peroxide Effect (Kharasch Effect)", "formula": "R–CH=CH₂ + H–Br ⟶ R–CH₂–CH₂Br (in presence of benzoyl peroxide, via 2° free radical)", "context": "Exclusive to HBr; HCl bond is too strong, HI radical addition is endothermic."}, {"name": "Hybridization Acidity Trend", "formula": "Ethyne (sp, 50% s) > Benzene (sp², 33.3% s) > Hexane (sp³, 25% s)", "context": "Higher s-character increases carbon electronegativity, stabilizing the conjugate carbanion."}, {"name": "Hückel's Rule of Aromaticity", "formula": "N_π = 4n + 2 (n = 0, 1, 2, 3... ⟹ 2, 6, 10, 14 π-electrons)", "context": "Requires cyclic, planar, completely conjugated ring system with filled bonding MO shell."}, {"name": "Benzene Resonance Stabilization Energy", "formula": "ΔH_resonance = 150.5 kJ/mol (36 kcal/mol)", "context": "Difference between observed heat of hydrogenation (−208 kJ/mol) and theoretical cyclohexatriene (−358.5 kJ/mol)."}, {"name": "Universal Electrophilic Aromatic Substitution", "formula": "Benzene + E⁺ ⟶ Arenium Ion [C₆H₆E]⁺ (Wheland Intermediate, RDS) ⟶ Substituted Benzene + H⁺", "context": "Fast proton loss regenerates the aromatic sextet and restores 150.5 kJ/mol resonance energy."}], "common_pitfalls": ["Assuming the peroxide effect applies to HCl or HI; it operates EXCLUSIVELY with HBr because both radical propagation steps are exothermic only for HBr.", "Confusing conformational isomers (rotamers interconverting freely at room temperature) with isolable stereoisomers (such as cis-trans geometrical isomers separated by a 260 kJ/mol π-bond barrier).", "Expecting Wurtz reaction to give high yields of odd-carbon alkanes (e.g. propane); using two different alkyl halides inevitably produces a statistical mixture of 3 different alkanes (ethane, propane, butane).", "Labeling cyclooctatetraene as antiaromatic; planar COT would be 8π antiaromatic, but it flexes into a non-planar tub conformation to behave as an ordinary non-aromatic polyene.", "Forgetting that halogens on a benzene ring are deactivating yet ortho/para-directing due to the competition between strong –I inductive electron withdrawal and +R resonance donation."]}};

<script>
(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp) disp.innerHTML = "t = <b>" + state.t.toFixed(1) + " s</b>";
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Concept View ---
  function renderConcept(idx){
    pause();
    state.conceptIndex = idx;
    state.t = 0;
    state.level = 0;

    var lessons = C.lessons || C.concepts || [];
    var l = lessons[idx];
    if(!l) return;

    var navTitle = l.nav || l.navTitle || l.title || ("Concept " + (idx + 1));

    // Update sidebar navigation active state
    var navBtns = document.querySelectorAll(".concept-nav");
    navBtns.forEach(function(b, i){
      if(b.id === "nav-revision") b.classList.remove("active");
      else b.classList.toggle("active", i === idx);
    });

    // Update top crumb
    var rawNum = C.chapterNumber || (C.chapter_meta && C.chapter_meta.number) || (C.code ? C.code.replace(/\D/g, '') : "01");
    var chNum = (!isNaN(parseInt(rawNum))) ? String(rawNum).padStart(2, '0') : rawNum;
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · " + navTitle.toUpperCase();

    // Show concept view, hide revision
    var cView = document.getElementById("concept-view");
    var rView = document.getElementById("revision-view");
    if(cView) cView.style.display = "block";
    if(rView) rView.style.display = "none";

    var html = "";

    // Concept Header
    var minutes = l.minutes || 10;
    var printPage = l.print || (l.pages ? (Array.isArray(l.pages) ? l.pages.join("–") : l.pages) : (C.page_start ? "pp. " + C.page_start + "–" + C.page_end : ""));
    html += '<div class="concept-header">' +
      '<div class="concept-badge"><span>Concept ' + ("0" + (idx + 1)).slice(-2) + ' / ' + ("0" + lessons.length).slice(-2) + '</span>' +
      (printPage ? '<span class="time-pill">≈ ' + minutes + ' min · ' + printPage + '</span>' : '<span class="time-pill">≈ ' + minutes + ' min</span>') +
      '</div>' +
      '<h1 class="concept-title">' + (l.title || navTitle) + '</h1>' +
      '<p class="concept-deck">' + (l.deck || l.summary || "") + '</p>' +
      '</div>';

    // 01 LEARN BLOCK
    html += '<section class="learn-section" data-block="learn" aria-label="Learn Concept">' +
      '<span class="block-tag">01 · LEARN · CORE ESSENTIALS</span>';

    var quickItems = [];
    if(Array.isArray(l.quick)) {
      quickItems = l.quick;
    } else if(typeof l.quick === 'string' && l.quick) {
      quickItems = [l.quick];
    } else if(Array.isArray(l.summary)) {
      quickItems = l.summary;
    } else if(l.reading_content) {
      quickItems = [l.reading_content];
    } else if(l.summary || l.deck) {
      quickItems = [l.summary || l.deck];
    }

    html += '<div class="quick-summary">' + quickItems.map(function(p){
      if(typeof p !== 'string') return '';
      if(p.includes('<p>') || p.includes('<div>') || p.includes('<h3>')) return p;
      var formatted = p.replace(/###\s+(.*?)\n/g, '<h3 style="margin-top:16px;color:var(--ink);">$1</h3>')
                       .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                       .replace(/\*(.*?)\*/g, '<em>$1</em>')
                       .replace(/\n\n/g, '</p><p>');
      return '<p>' + formatted + '</p>';
    }).join("") + '</div>';

    // Semantic Equations Card
    var formulas = l.formulas || [];
    if(formulas.length){
      html += '<div class="key-equations-card">' +
        '<div class="equations-heading">Key Relations for this Concept</div>' +
        '<div class="eq-grid">' +
        formulas.map(function(eq){
          var label = eq.label || eq.name || "Relation";
          var cond = eq.cond || "";
          var math = eq.html || eq.formula || "";
          return '<div class="eq-row">' +
            '<div class="eq-meta"><span class="eq-label">' + label + '</span>' + (cond ? '<span class="eq-cond">' + cond + '</span>' : '') + '</div>' +
            '<div class="eq-math">' + math + '</div>' +
            '</div>';
        }).join("") +
        '</div></div>';
    }

    // Deeper dive / core takeaways
    if(l.deeper){
      html += '<details class="deep-dive"><summary>Go deeper into the conceptual foundation</summary><p>' + l.deeper + '</p></details>';
    } else if(l.takeaways && l.takeaways.length){
      html += '<details class="deep-dive"><summary>Key Conceptual Takeaways</summary><ul>' +
        l.takeaways.map(function(t){ return '<li>' + t + '</li>'; }).join("") +
        '</ul></details>';
    }

    // Worked Example
    var worked = l.worked || l.worked_example;
    if(worked){
      var workedHtml = typeof worked === 'object' && worked !== null
        ? '<strong>' + (worked.title || 'Worked Example') + '</strong><br>' + (worked.problem || '') +
          (worked.given ? '<br><br><strong>Given:</strong> ' + worked.given : '') +
          (worked.steps ? '<br><strong>Steps:</strong><br>' + worked.steps.map(function(s){ return '&bull; ' + s; }).join('<br>') : '') +
          (worked.solution ? '<br><br><strong>Solution:</strong> ' + worked.solution : '') +
          (worked.answer ? '<br><br><strong>Answer:</strong> ' + worked.answer : '')
        : String(worked);
      html += '<details class="deep-dive"><summary>Worked textbook example step by step</summary><p>' + workedHtml + '</p></details>';
    }

    html += '</section>';

    // 02 PREDICT FIRST BLOCK
    var pred = l.prediction || l.predict || l.predict_first;
    if(pred && typeof pred === 'object' && (pred.prompt || pred.scenario) && pred.options && pred.options.length){
      var promptText = pred.prompt || pred.scenario || "";
      html += '<section class="predict-card" data-block="predict" aria-label="Predict First">' +
        '<div class="predict-badge">02 · PREDICT FIRST · TEST YOUR INTUITION</div>' +
        '<div class="predict-prompt">' + promptText.replace(/\n/g, '<br>') + '</div>' +
        '<div class="predict-options" id="predict-options">' +
        pred.options.map(function(opt, oi){
          return '<label class="predict-option"><input type="radio" name="predict_ans" value="' + oi + '"><span>' + opt + '</span></label>';
        }).join("") +
        '</div>' +
        '<div class="predict-actions">' +
        '<button class="btn-primary" id="btn-check-prediction">Check Prediction</button>' +
        '<button class="btn-secondary" id="btn-skip-prediction">Skip to Lab</button>' +
        '</div>' +
        '<div id="predict-feedback-box" class="predict-feedback" style="display:none;"></div>' +
        '</section>';
    }

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();
    var whatWatch = (pred && pred.prompt) ? pred.prompt : (typeof l.predict === 'string' ? l.predict : "Explore the interactive simulation controls, parameters, and readouts below.");
    html += '<section class="lab-card" data-block="play" aria-label="Interactive Laboratory">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +
      '<div id="sim-mount-point" class="sim-mount-container" style="width:100%;min-height:220px;margin-top:12px;">' +
        '<div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 720 300" role="img" aria-label="' + simTitle + '"></svg></div>' +
        '<div class="lab-legend" id="lab-legend"></div>' +
        '<div class="lab-toolbar" id="legacy-lab-toolbar">' +
          '<button class="toolbar-btn primary" id="btn-play-pause" aria-label="Play animation">▶ Play</button>' +
          '<button class="toolbar-btn" id="btn-step-fwd" aria-label="Step forward">⏭ Step (+0.5s)</button>' +
          '<button class="toolbar-btn" id="btn-reset-time" aria-label="Reset timeline">↺ Reset</button>' +
          '<span class="time-display" id="time-display">t = <b>0.0 s</b></span>' +
          '<div class="scrubber-wrap">' +
            '<input type="range" id="time-scrubber" class="timeline-scrubber" min="0" max="6" step="0.1" value="0" aria-label="Timeline time scrubber">' +
          '</div>' +
        '</div>' +
        '<div class="preset-bar" id="preset-bar"></div>' +
        '<div class="lab-controls-grid" id="lab-controls"></div>' +
        '<div class="lab-readout" id="lab-readout" role="status" aria-live="polite"></div>' +
        '<div class="lab-verdict" id="lab-verdict" role="status" aria-live="polite"></div>' +
      '</div>' +
      '</section>';

    // 04 CONNECT BLOCK
    var rawConnect = l.connect || [];
    var connectItems = [];
    if (typeof rawConnect === 'string' && rawConnect.trim()) {
      connectItems = [{ title: "Real-World Application", text: rawConnect }];
    } else if (Array.isArray(rawConnect)) {
      connectItems = rawConnect;
    } else if (rawConnect && typeof rawConnect === 'object') {
      connectItems = [rawConnect];
    }

    if(connectItems.length){
      html += '<section class="connect-section" data-block="connect" aria-label="Real World Connections">' +
        '<span class="block-tag">04 · CONNECT · REAL WORLD APPLICATIONS</span>' +
        '<div class="connect-grid">' +
        connectItems.map(function(item){
          var title = typeof item === 'string' ? "Real World Application" : (Array.isArray(item) ? item[0] : (item.title || "Real World Context"));
          var desc = typeof item === 'string' ? item : (Array.isArray(item) ? item[1] : (item.text || item.desc || ""));
          var links = (typeof item === 'object' && item !== null) ? (Array.isArray(item) ? (item[2] || []) : (item.links || (item.link ? [{t: "Read Deeply", u: item.link}] : []))) : [];
          var v = (typeof item === 'object' && item !== null) ? (Array.isArray(item) ? (item[3] || null) : (item.video || null)) : null;
          var wow = /^Wow/i.test(title);

          var cHtml = '<div class="connect-card' + (wow ? ' wow' : '') + '"' + (wow ? (links[0] && links[0].u ? ' data-wow data-source="' + links[0].u + '"' : ' data-wow') : '') + '>';
          if(wow) cHtml += '<span class="wow-badge">WOW · REAL WORLD</span>';
          cHtml += '<h3>' + title + '</h3><p>' + desc + '</p>';
          if(v && v.id){
            cHtml += '<button class="video-facade" data-yt="' + v.id + '" aria-label="Play video: ' + v.title + '">' +
              '<span class="thumb" aria-hidden="true"></span>' +
              '<span class="play-btn">▶</span>' +
              '<span class="video-title">' + v.title + ' · ' + v.channel + '</span>' +
              '</button>';
          }
          if(links && links.length){
            cHtml += '<p style="margin-top:10px;font-size:12px;color:var(--muted)">References: ' +
              links.map(function(a){ return '<a href="' + (a.u || a.link || "#") + '" target="_blank" rel="noopener">' + (a.t || a.label || "Read Deeply") + ' ↗</a>'; }).join(", ") +
              '</p>';
          }
          cHtml += '</div>';
          return cHtml;
        }).join("") +
        '</div></section>';
    }

    // 05 PRACTICE BLOCK
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(quizzes.length){
      html += '<section class="practice-section" data-block="practice" aria-label="Practice and Mastery">' +
        '<span class="block-tag">05 · PRACTICE · MULTI-TIER CHALLENGE</span>' +
        '<div class="practice-nav">';
      for(var qi = 0; qi < quizzes.length; qi++){
        var tierName = qi === 0 ? "Tier 1: Easy" : (qi === 1 ? "Tier 2: Medium" : (qi === 2 ? "Tier 3: Hard" : "Question " + (qi + 1)));
        html += '<button class="level-tab' + (qi === 0 ? ' active' : '') + '" data-lvl="' + qi + '">' + tierName + '</button>';
      }
      html += '</div>' +
        '<div id="quiz-container"></div>' +
        '</section>';
    }

    // 06 REVISE CALLOUT
    var recall = l.recall || (l.takeaways && l.takeaways.length ? l.takeaways[0] : (l.core_takeaways && l.core_takeaways.length ? l.core_takeaways[0] : "Reflect on how this concept connects to physical reality."));
    html += '<div class="revise-callout"><strong>06 · REVISE · SAY IT IN YOUR OWN WORDS:</strong> ' + recall + '</div>';

    // Footer Navigation
    var nextNav = idx < lessons.length - 1 ? (lessons[idx + 1].nav || lessons[idx + 1].navTitle || lessons[idx + 1].title || ("Concept " + (idx + 2))) : "";
    html += '<div class="concept-footer-nav">' +
      (idx > 0 ? '<button class="btn-secondary" id="btn-prev-concept">← Concept ' + ("0" + idx).slice(-2) + '</button>' : '<span></span>') +
      (idx < lessons.length - 1 ? '<button class="btn-primary" id="btn-next-concept">Concept ' + ("0" + (idx + 2)).slice(-2) + ': ' + nextNav + ' →</button>' : '<button class="btn-primary" id="btn-goto-revision">Chapter Revision & Exercises →</button>') +
      '</div>';

    cView.innerHTML = html;

    // Attach Prediction Listeners
    var btnCheckPred = document.getElementById("btn-check-prediction");
    var btnSkipPred = document.getElementById("btn-skip-prediction");
    if(btnCheckPred && pred){
      btnCheckPred.addEventListener("click", function(){
        var sel = document.querySelector('input[name="predict_ans"]:checked');
        var fb = document.getElementById("predict-feedback-box");
        if(!sel){
          fb.style.display = "block";
          fb.className = "predict-feedback revealed";
          fb.textContent = "Please select one of the predictions first.";
          return;
        }
        var chosen = Number(sel.value);
        var expectedAns = pred.answer !== undefined ? pred.answer : (pred.correct !== undefined ? pred.correct : 0);
        var isRight = chosen === expectedAns;
        fb.style.display = "block";
        fb.className = "predict-feedback " + (isRight ? "correct" : "revealed");
        fb.innerHTML = (isRight ? "<b>Spot on!</b> " : "<b>Good thought! Here is the physical principle:</b> ") + (pred.explanation || "");
      });
    }
    if(btnSkipPred && pred){
      btnSkipPred.addEventListener("click", function(){
        var fb = document.getElementById("predict-feedback-box");
        fb.style.display = "block";
        fb.className = "predict-feedback revealed";
        fb.innerHTML = "<b>Key Principle:</b> " + (pred.explanation || "");
      });
    }

    // Attach Timeline Controls for legacy SIMS
    var btnPP = document.getElementById("btn-play-pause");
    if(btnPP) btnPP.addEventListener("click", function(){ if(state.playing) pause(); else play(); });
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep) btnStep.addEventListener("click", function(){ step(0.5); });
    var btnResTime = document.getElementById("btn-reset-time");
    if(btnResTime) btnResTime.addEventListener("click", function(){ resetTimeline(); });
    var scrub = document.getElementById("time-scrubber");
    if(scrub) scrub.addEventListener("input", function(e){ seekTimeline(e.target.value); });

    // Footer Next/Prev listeners
    var btnPrev = document.getElementById("btn-prev-concept");
    var btnNext = document.getElementById("btn-next-concept");
    var btnRev = document.getElementById("btn-goto-revision");
    if(btnPrev) btnPrev.addEventListener("click", function(){ renderConcept(idx - 1); window.scrollTo(0,0); });
    if(btnNext) btnNext.addEventListener("click", function(){ renderConcept(idx + 1); window.scrollTo(0,0); });
    if(btnRev) btnRev.addEventListener("click", function(){ renderRevision(); window.scrollTo(0,0); });

    // Mount Active Simulation Engine
    var simMount = document.getElementById("sim-mount-point");
    if(simMount){
      var cKey = "c" + (idx + 1);
      var conceptId = l.id || ("concept-" + (idx + 1));
      var simId = l.sim || conceptId;

      // 1. window.mountSimulation (iemh101, iemh102)
      if(typeof window.mountSimulation === 'function'){
        simMount.innerHTML = "";
        window.mountSimulation(cKey, simMount);
      }
      // 2. window.SIM_ENGINES (iemh101-iemh105)
      else if(window.SIM_ENGINES && window.SIM_ENGINES[cKey] && typeof window.SIM_ENGINES[cKey].init === 'function'){
        simMount.innerHTML = "";
        window.SIM_ENGINES[cKey].init(simMount);
      }
      // 3. window.SimEngine (iemh106-iemh108)
      else if(window.SimEngine && typeof window.SimEngine.init === 'function'){
        var targetKey = null;
        var candidateKeys = [conceptId, "sim-" + conceptId, "sim-concept-" + (idx + 1), "concept-" + (idx + 1), simId, cKey];
        for(var k = 0; k < candidateKeys.length; k++){
          if(candidateKeys[k] && window.SimEngine.getEngine(candidateKeys[k])){
            targetKey = candidateKeys[k];
            break;
          }
        }
        if(targetKey){
          simMount.innerHTML = "";
          window.SimEngine.init(targetKey, simMount);
        }
      }
      // 4. window.SIMS (iesc101-iesc113)
      else if(window.SIMS && (window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey])){
        var simObj = window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey];
        if(typeof simObj.mount === 'function'){
          if(simObj.mount.length >= 1 && !simObj.draw){
            simMount.innerHTML = "";
            simObj.mount(simMount);
          } else {
            simObj.mount(l);
          }
        }
      }
    }

    // Render Quiz for current level
    renderQuiz();

    // Attach Practice Level Tabs
    var lvlTabs = document.querySelectorAll(".level-tab");
    lvlTabs.forEach(function(tab){
      tab.addEventListener("click", function(){
        lvlTabs.forEach(function(t){ t.classList.remove("active"); });
        tab.classList.add("active");
        state.level = Number(tab.getAttribute("data-lvl"));
        renderQuiz();
      });
    });

    // Update URL hash
    window.location.hash = "#concept-" + (idx + 1);
  }

  // --- Render Quiz ---
  function renderQuiz(){
    var lessons = C.lessons || C.concepts || [];
    var l = lessons[state.conceptIndex];
    if(!l) return;
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(!quizzes.length) return;
    var q = quizzes[state.level] || quizzes[0];
    if(!q) return;

    var qk = qKey(state.conceptIndex, state.level);
    var old = state.answers[qk] || {};

    var box = document.getElementById("quiz-container");
    if(!box) return;

    var promptText = q.prompt || q.question || "";
    var isMcq = q.type === "mcq" || (q.options && q.options.length > 0);
    var correctAns = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : 0);
    var solutionText = q.solution || q.explanation || "";
    var hintText = q.hint || "Review the key relationships in the concept overview above.";

    var html = '<div class="question-prompt">' + promptText + '</div>';
    if(isMcq && q.options){
      html += '<div class="quiz-options">' +
        q.options.map(function(opt, oi){
          var checked = old.value === String(oi) ? " checked" : "";
          return '<label class="quiz-option"><input type="radio" name="quiz_ans" value="' + oi + '"' + checked + '><span>' + opt + '</span></label>';
        }).join("") +
        '</div>';
    } else {
      html += '<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">' +
        '<input type="number" step="any" id="quiz_num_ans" placeholder="Your answer" value="' + (old.value || "") + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;width:160px;">' +
        '<span style="font-weight:600;color:var(--muted);">' + (q.unit || "") + '</span>' +
        '</div>';
    }

    html += '<div class="quiz-actions">' +
      '<button class="btn-primary" id="btn-submit-quiz">Submit Answer</button>' +
      '<button class="btn-secondary" id="btn-toggle-hint">Show Hint</button>' +
      '</div>' +
      '<div id="quiz-hint-box" class="quiz-hint" style="display:none;">' + hintText + '</div>' +
      '<div id="quiz-feedback-box" class="quiz-feedback" style="display:none;"></div>';

    box.innerHTML = html;

    // Hint toggle
    var hintBtn = document.getElementById("btn-toggle-hint");
    if(hintBtn){
      hintBtn.addEventListener("click", function(){
        var hb = document.getElementById("quiz-hint-box");
        if(hb) hb.style.display = hb.style.display === "none" ? "block" : "none";
      });
    }

    // Submit listener
    var submitBtn = document.getElementById("btn-submit-quiz");
    if(submitBtn){
      submitBtn.addEventListener("click", function(){
        var fb = document.getElementById("quiz-feedback-box");
        if(!fb) return;
        var isRight = false;
        var userVal = "";

        if(isMcq){
          var sel = document.querySelector('input[name="quiz_ans"]:checked');
          if(!sel){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please select an answer choice first.";
            return;
          }
          userVal = sel.value;
          isRight = Number(userVal) === Number(correctAns);
        } else {
          var inp = document.getElementById("quiz_num_ans");
          if(!inp || inp.value.trim() === ""){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please enter a numerical answer.";
            return;
          }
          userVal = inp.value.trim();
          var num = parseFloat(userVal);
          isRight = Math.abs(num - parseFloat(correctAns)) <= (q.tolerance || 0.05);
        }

        state.answers[qk] = { value: userVal, checked: true };
        if(isRight){
          state.correct[qk] = true;
          fb.style.display = "block";
          fb.className = "quiz-feedback success";
          fb.innerHTML = "<b>That’s right!</b> " + solutionText;
        } else {
          fb.style.display = "block";
          fb.className = "quiz-feedback retry";
          var wrongMsg = (isMcq && q.wrong && q.wrong[Number(userVal)]) ? q.wrong[Number(userVal)] : hintText;
          fb.innerHTML = "<b>Not quite.</b> " + wrongMsg + "<br><small style=\"margin-top:6px;display:block;\"><b>Full explanation:</b> " + solutionText + "</small>";
        }
        updateProgress();
      });
    }

    if(old.checked && submitBtn){
      submitBtn.click();
    }
  }

  // --- Render Revision View ---
  var currentExFilter = -1;

  function renderRevision(){
    pause();
    document.querySelectorAll(".concept-nav").forEach(function(b){ b.classList.remove("active"); });
    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.classList.add("active");

    var rawNum = C.chapterNumber || (C.chapter_meta && C.chapter_meta.number) || (C.code ? C.code.replace(/\D/g, '') : "01");
    var chNum = (!isNaN(parseInt(rawNum))) ? String(rawNum).padStart(2, '0') : rawNum;
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · NCERT EXERCISES & REVISION";

    var cView = document.getElementById("concept-view");
    var revView = document.getElementById("revision-view");
    if(cView) cView.style.display = "none";
    if(revView) revView.style.display = "block";

    var exList = C.exercises || [];
    if(!exList.length && C.exerciseMap){
      exList = C.exerciseMap.map(function(m){
        return {
          q: m[0],
          number: String(m[0]),
          title: m[1],
          conceptIdx: m[2],
          page: m[3],
          printPage: 47 + m[3],
          question: m[4] || m[1],
          steps: [m[5] || "Refer to concept explanation."],
          answer: m[5] || ""
        };
      });
    }

    var totalEx = exList.length;
    var html = '<div class="concept-header">' +
      '<span class="concept-badge">NCERT EXERCISE COMPENDIUM</span>' +
      '<h1 class="concept-title">Revise, Reflect, Refine</h1>' +
      '<p class="concept-deck">All ' + totalEx + ' exercises from NCERT Class 11 Physics with comprehensive step-by-step pedagogical solutions.</p>' +
      '</div>';

    // Filter Bar & Expand/Collapse All
    var lessons = C.lessons || C.concepts || [];
    html += '<div class="exercise-compendium-header">' +
      '<div class="exercise-filter-bar">' +
      '<button class="filter-chip ' + (currentExFilter === -1 ? 'active' : '') + '" data-cfilter="-1">All Exercises (' + totalEx + ')</button>' +
      lessons.map(function(l, li){
        var nav = l.nav || l.navTitle || l.title || ("C0" + (li+1));
        return '<button class="filter-chip ' + (currentExFilter === li ? 'active' : '') + '" data-cfilter="' + li + '">C0' + (li+1) + ': ' + nav + '</button>';
      }).join("") +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn-secondary" id="btn-expand-all" style="padding:6px 12px;font-size:13px;">Expand All Guidance</button>' +
      '<button class="btn-secondary" id="btn-collapse-all" style="padding:6px 12px;font-size:13px;">Collapse All</button>' +
      '</div>' +
      '</div>';

    // Exercise Cards List
    html += '<div id="exercise-cards-container">';
    var filtered = currentExFilter === -1 ? exList : exList.filter(function(e){
      return e.conceptIdx === currentExFilter || (e.section && e.section.includes(String(currentExFilter + 1)));
    });

    html += filtered.map(function(ex, eIdx){
      var qNum = ex.number || ex.q || (eIdx + 1);
      var sectionLabel = ex.section ? ('<span class="q-badge" style="background:#e0f2fe;color:#0369a1;margin-right:6px;">' + ex.section + '</span>') : '';
      var l = (ex.conceptIdx !== undefined && lessons[ex.conceptIdx]) ? lessons[ex.conceptIdx] : null;
      var conceptLink = l ? ('<a href="#concept-' + (ex.conceptIdx + 1) + '" class="q-concept-link" data-idx="' + ex.conceptIdx + '">Explore in Concept ' + ("0" + (ex.conceptIdx + 1)).slice(-2) + ' (' + (l.nav || l.navTitle || l.title) + ') ↗</a>') : '';

      var guidanceHtml = "";
      if(ex.guidance){
        if(typeof ex.guidance === 'string'){
          guidanceHtml = ex.guidance;
        } else if(Array.isArray(ex.guidance)){
          guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
            (ex.answer ? '<p><strong>Answer:</strong> ' + ex.answer + '</p>' : '') +
            '<ol>' + ex.guidance.map(function(g){ return '<li>' + g + '</li>'; }).join('') + '</ol></div>';
        }
      } else if(ex.steps && ex.steps.length){
        guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
          (ex.given ? '<div class="given-data"><b>Given:</b> ' + ex.given + '</div>' : '') +
          '<ol class="solution-steps">' + ex.steps.map(function(st){ return '<li>' + st + '</li>'; }).join('') + '</ol>' +
          (ex.answer ? '<div class="answer-box"><b>Final Answer:</b> ' + ex.answer + '</div>' : '') +
          '</div>';
      }

      return '<article class="exercise-card" id="exercise-q' + qNum + '">' +
        '<div class="exercise-card-meta">' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
        sectionLabel +
        '<span class="q-badge">QUESTION ' + qNum + '</span>' +
        '</div>' +
        conceptLink +
        '</div>' +
        
        '<div class="exercise-question-text" style="font-size:15px;line-height:1.6;margin:12px 0;white-space:pre-wrap;">' + (ex.question || ex.title || "") + '</div>' +
        
        '<details class="exercise-drawer">' +
        '<summary class="exercise-drawer-btn">📖 View Step-by-Step Guidance & Full Solution</summary>' +
        '<div class="exercise-solution-body" style="padding:14px;background:#f8fafc;border-radius:8px;margin-top:8px;">' +
        guidanceHtml +
        '</div>' +
        '</details>' +
        '</article>';
    }).join("");

    html += '</div>';

    revView.innerHTML = html;

    // Attach Filter Listeners
    revView.querySelectorAll(".filter-chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        currentExFilter = Number(chip.getAttribute("data-cfilter"));
        renderRevision();
      });
    });

    // Attach Expand/Collapse All Listeners
    var btnExp = document.getElementById("btn-expand-all");
    var btnCol = document.getElementById("btn-collapse-all");
    if(btnExp){
      btnExp.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = true; });
      });
    }
    if(btnCol){
      btnCol.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = false; });
      });
    }

    // Concept Navigation Links
    revView.querySelectorAll(".q-concept-link").forEach(function(a){
      a.addEventListener("click", function(e){
        e.preventDefault();
        var cIdx = Number(a.getAttribute("data-idx"));
        renderConcept(cIdx);
        window.scrollTo(0, 0);
      });
    });

    window.location.hash = "#revision";
  }

  // --- Build Sidebar Nav ---
  function buildSidebar(){
    var navContainer = document.getElementById("sidebar-nav");
    if(!navContainer) return;
    var lessons = C.lessons || C.concepts || [];
    navContainer.innerHTML = lessons.map(function(l, i){
      var nav = l.nav || l.navTitle || l.title || ("Concept " + (i + 1));
      return '<button class="concept-nav" data-cidx="' + i + '">' +
        '<span class="num">' + ("0" + (i + 1)).slice(-2) + '</span>' +
        '<span>' + nav + '</span>' +
        '</button>';
    }).join("");

    navContainer.querySelectorAll(".concept-nav").forEach(function(b){
      b.addEventListener("click", function(){
        var idx = Number(b.getAttribute("data-cidx"));
        renderConcept(idx);
      });
    });

    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.addEventListener("click", renderRevision);
  }

  // --- Reset Progress Button ---
  var resetProgBtn = document.getElementById("btn-reset-progress");
  if(resetProgBtn){
    resetProgBtn.addEventListener("click", function(){
      if(confirm("Reset all quiz answers and mastery progress for this chapter?")){
        state.answers = {};
        state.correct = {};
        saveStorage();
        updateProgress();
        renderQuiz();
      }
    });
  }

  // --- Handle Video Facades (No preloaded iframes) ---
  document.addEventListener("click", function(e){
    var btn = e.target.closest(".video-facade");
    if(btn){
      var vid = btn.getAttribute("data-yt");
      var parent = btn.parentElement;
      if(parent && vid){
        parent.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&rel=0" title="Video Lesson" style="width:100%;aspect-ratio:16/9;border:none;border-radius:8px;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
      }
    }
  });

  // --- URL Routing ---
  function routeFromHash(){
    var hash = window.location.hash;
    var lessons = C.lessons || C.concepts || [];
    if(hash === "#revision"){
      renderRevision();
    } else if(/^#concept-\d+$/.test(hash)){
      var cNum = parseInt(hash.replace("#concept-", ""), 10);
      if(cNum >= 1 && cNum <= lessons.length){
        renderConcept(cNum - 1);
        return;
      }
      renderConcept(0);
    } else {
      renderConcept(0);
    }
  }
  window.addEventListener("hashchange", routeFromHash);

  window.App = {
    state: state,
    play: play,
    pause: pause,
    step: step,
    resetTimeline: resetTimeline,
    seekTimeline: seekTimeline,
    renderConcept: renderConcept,
    renderRevision: renderRevision,
    routeFromHash: routeFromHash
  };
  if (typeof globalThis !== "undefined") {
    globalThis.App = window.App;
  }

  // Initialize
  initStorage();
  buildSidebar();
  updateProgress();
  routeFromHash();
})();

</script>
<script>

var App = window.App;
window.SIMS = {};

function setActivePreset(btn){
  var p = btn.parentElement;
  if(p){
    p.querySelectorAll('.filter-chip').forEach(function(b){ b.classList.remove('active'); });
  }
  btn.classList.add('active');
}

// ==========================================
// 1. conformationlab: Ethane & Butane Newman / Sawhorse Rotator
// ==========================================
window.SIMS.conformationlab = {
  mount: function(container){
    var angle = 60; // dihedral angle
    var mol = 'ethane'; // ethane, butane

    container.innerHTML = 
      '<div class="sim-wrapper" style="font-family:var(--font-sans);color:var(--ink);">' +
      '  <div class="preset-bar" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">' +
      '    <button class="filter-chip active" id="btn-eth-stag">Ethane Staggered (60°, Min Strain)</button>' +
      '    <button class="filter-chip" id="btn-eth-ecl">Ethane Eclipsed (0°, Max Strain)</button>' +
      '    <button class="filter-chip" id="btn-but-anti">Butane Anti (180°, 0 kJ/mol)</button>' +
      '    <button class="filter-chip" id="btn-but-gauche">Butane Gauche (60°, 3.8 kJ/mol)</button>' +
      '    <button class="filter-chip" id="btn-but-ecl">Butane Eclipsed (120°, 16 kJ/mol)</button>' +
      '  </div>' +
      '  <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap;">' +
      '    <label style="font-size:13px;font-weight:600;">Dihedral Angle (θ):</label>' +
      '    <input type="range" id="rng-dihedral" min="0" max="360" value="60" style="width:220px;cursor:pointer;">' +
      '    <span id="dihedral-val" style="font-weight:bold;color:var(--primary);font-size:15px;">60° (Staggered)</span>' +
      '  </div>' +
      '  <div style="background:var(--paper-soft);padding:14px;border-radius:8px;border:1px solid var(--line);">' +
      '    <svg id="svg-newman" viewBox="0 0 700 260" style="width:100%;height:auto;max-height:260px;background:#0f172a;border-radius:6px;"></svg>' +
      '    <div id="newman-readout" style="margin-top:12px;padding:12px;background:var(--paper);border-radius:6px;border:1px solid var(--line);font-size:13px;line-height:1.5;"></div>' +
      '  </div>' +
      '</div>';

    function render(){
      var svg = document.getElementById('svg-newman');
      var rd = document.getElementById('newman-readout');
      var valSpan = document.getElementById('dihedral-val');
      if(!svg || !rd || !valSpan) return;

      var rad = (angle * Math.PI) / 180;
      var radFront1 = -Math.PI / 2; // 12 o'clock
      var radFront2 = radFront1 + (2 * Math.PI / 3);
      var radFront3 = radFront1 + (4 * Math.PI / 3);

      var radBack1 = radFront1 + rad;
      var radBack2 = radFront2 + rad;
      var radBack3 = radFront3 + rad;

      // Energy calculation
      var energy, confName, stabilityTxt;
      if(mol === 'ethane'){
        // E = (V0 / 2) * (1 - cos(3 * theta)) where V0 = 12.55 kJ/mol
        energy = (12.55 / 2) * (1 - Math.cos(3 * rad));
        if(angle % 120 === 60) { confName = 'Staggered Conformation'; stabilityTxt = '<span style="color:#10b981;font-weight:bold;">Global Energy Minimum (Most Stable, 0 kJ/mol)</span>'; }
        else if(angle % 120 === 0) { confName = 'Eclipsed Conformation'; stabilityTxt = '<span style="color:#ef4444;font-weight:bold;">Maximum Torsional Strain (12.55 kJ/mol, Least Stable)</span>'; }
        else { confName = 'Skew / Intermediate Conformation'; stabilityTxt = '<span style="color:#f59e0b;font-weight:bold;">Intermediate Torsional Energy</span>'; }
      } else {
        // Butane
        if(Math.abs(angle - 180) <= 5) { confName = 'Anti Conformation'; energy = 0.0; stabilityTxt = '<span style="color:#10b981;font-weight:bold;">Global Minimum: Anti-Staggered (0.0 kJ/mol)</span>'; }
        else if(Math.abs(angle - 60) <= 5 || Math.abs(angle - 300) <= 5) { confName = 'Gauche Conformation'; energy = 3.8; stabilityTxt = '<span style="color:#38bdf8;font-weight:bold;">Local Minimum: Gauche (Steric Strain 3.8 kJ/mol)</span>'; }
        else if(Math.abs(angle - 120) <= 5 || Math.abs(angle - 240) <= 5) { confName = 'Eclipsed Conformation (CH₃/H)'; energy = 16.0; stabilityTxt = '<span style="color:#f59e0b;font-weight:bold;">Torsional + Steric Barrier (16.0 kJ/mol)</span>'; }
        else if(angle === 0 || angle === 360) { confName = 'Fully Eclipsed (CH₃/CH₃)'; energy = 19.0; stabilityTxt = '<span style="color:#ef4444;font-weight:bold;">Global Maximum: Fully Eclipsed (19.0 kJ/mol)</span>'; }
        else { confName = 'Skew Butane Conformation'; energy = 8.5; stabilityTxt = 'Non-stationary rotamer'; }
      }

      valSpan.innerHTML = angle + '° · ' + confName;

      // Draw Newman projection in SVG
      var cx = 350, cy = 130, R = 58, L = 88;

      // Rear circle
      var rearBonds = '';
      var rearLigand1 = mol === 'ethane' ? 'H' : 'CH₃';
      var rearLigands = [rearLigand1, 'H', 'H'];
      var rearAngles = [radBack1, radBack2, radBack3];
      for(var i = 0; i < 3; i++){
        var bx1 = cx + R * Math.cos(rearAngles[i]);
        var by1 = cy + R * Math.sin(rearAngles[i]);
        var bx2 = cx + L * Math.cos(rearAngles[i]);
        var by2 = cy + L * Math.sin(rearAngles[i]);
        rearBonds += '<line x1="' + bx1 + '" y1="' + by1 + '" x2="' + bx2 + '" y2="' + by2 + '" stroke="#94a3b8" stroke-width="4"/>' +
                     '<circle cx="' + bx2 + '" cy="' + by2 + '" r="15" fill="#f8fafc"/>' +
                     '<text x="' + bx2 + '" y="' + (by2 + 4) + '" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">' + rearLigands[i] + '</text>';
      }

      // Front bonds from center
      var frontBonds = '';
      var frontLigand1 = mol === 'ethane' ? 'H' : 'CH₃';
      var frontLigands = [frontLigand1, 'H', 'H'];
      var frontAngles = [radFront1, radFront2, radFront3];
      for(var j = 0; j < 3; j++){
        var fx2 = cx + L * Math.cos(frontAngles[j]);
        var fy2 = cy + L * Math.sin(frontAngles[j]);
        frontBonds += '<line x1="' + cx + '" y1="' + cy + '" x2="' + fx2 + '" y2="' + fy2 + '" stroke="#38bdf8" stroke-width="5"/>' +
                      '<circle cx="' + fx2 + '" cy="' + fy2 + '" r="15" fill="#38bdf8"/>' +
                      '<text x="' + fx2 + '" y="' + (fy2 + 4) + '" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">' + frontLigands[j] + '</text>';
      }

      svg.innerHTML = 
        '<!-- Rear Carbon Circle -->' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="#1e293b" stroke="#94a3b8" stroke-width="4"/>' +
        rearBonds +
        frontBonds +
        '<!-- Front Carbon Center Point -->' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="8" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>' +
        '<text x="60" y="40" fill="#38bdf8" font-size="12" font-weight="bold">■ Front Carbon (Center dot)</text>' +
        '<text x="60" y="60" fill="#94a3b8" font-size="12" font-weight="bold">■ Rear Carbon (Outer circle)</text>';

      rd.innerHTML = 
        '<div style="font-size:16px;font-weight:700;color:var(--primary);margin-bottom:6px;">' + (mol === 'ethane' ? 'Ethane' : 'Butane') + ': ' + confName + ' (θ = ' + angle + '°)</div>' +
        '<div style="display:flex;gap:20px;margin-bottom:8px;font-size:14px;">' +
        '  <div><b>Potential Energy:</b> <span style="font-size:16px;color:#f59e0b;font-weight:bold;">' + energy.toFixed(2) + ' kJ/mol</span></div>' +
        '  <div><b>Conformational Status:</b> ' + stabilityTxt + '</div>' +
        '</div>' +
        '<div style="color:var(--muted);font-size:12.5px;">' +
        '  • <b>Torsional Strain Origin:</b> Repulsive overlap between bonding electron clouds of adjacent C–H (or C–C) σ-bonds when dihedral angle approaches 0°.<br>' +
        '  • <b>Thermal Rotation:</b> At 298 K, ambient thermal energy (RT ≈ 2.48 kJ/mol) causes rotation about the C–C σ-bond at a frequency of ~10¹¹ rotations per second.' +
        '</div>';
    }

    container.querySelector('#rng-dihedral').oninput = function(e){ angle = parseInt(e.target.value); render(); };
    container.querySelector('#btn-eth-stag').onclick = function(e){ setActivePreset(e.target); mol = 'ethane'; angle = 60; document.getElementById('rng-dihedral').value = 60; render(); };
    container.querySelector('#btn-eth-ecl').onclick = function(e){ setActivePreset(e.target); mol = 'ethane'; angle = 0; document.getElementById('rng-dihedral').value = 0; render(); };
    container.querySelector('#btn-but-anti').onclick = function(e){ setActivePreset(e.target); mol = 'butane'; angle = 180; document.getElementById('rng-dihedral').value = 180; render(); };
    container.querySelector('#btn-but-gauche').onclick = function(e){ setActivePreset(e.target); mol = 'butane'; angle = 60; document.getElementById('rng-dihedral').value = 60; render(); };
    container.querySelector('#btn-but-ecl').onclick = function(e){ setActivePreset(e.target); mol = 'butane'; angle = 120; document.getElementById('rng-dihedral').value = 120; render(); };
    render();
  }
};
