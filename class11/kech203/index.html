<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 9: Chapter 9 — Interactive Textbook</title>
<style>
:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: var(--radius-sm);
  position: relative;
  overflow: hidden;
  border: none;
  padding: 0;
  cursor: pointer;
  display: block;
}
.video-facade img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
}
.play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 48px;
  height: 48px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.video-title {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 8px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  color: #fff;
  font-size: 12px;
  text-align: left;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);

<script>
window.CHAPTER = {"chapter_meta": {"id": "kech203", "number": 9, "title": "Hydrocarbons", "book": "Chemistry Part II", "class": 11, "reprint": "2026-27", "tagline": "From alkane conformations and free-radical substitution to alkene Markovnikov additions, alkyne acidity, benzene resonance, and electrophilic aromatic substitution.", "total_concepts": 7, "total_practice_questions": 21, "total_exercises": 25}, "concepts": [{"id": "c1", "title": "Classification of Hydrocarbons, Alkanes & Conformations", "navTitle": "Alkanes & Conformations", "minutes": 16, "pages": "1–6", "deck": "Master the structural classification of hydrocarbons, alkane nomenclature, conformational isomerism, and torsional strain in Sawhorse and Newman projections of ethane.", "quick": ["Hydrocarbons contain exclusively carbon and hydrogen; classified into open-chain aliphatic (saturated alkanes C_nH_{2n+2}, unsaturated alkenes C_nH_{2n} and alkynes C_nH_{2n-2}) and cyclic (alicyclic and aromatic).", "Carbon atoms in alkanes are sp³ hybridized with tetrahedral geometry (109.5° bond angles and 154 pm C–C bond length).", "Free rotation about the cylindrical C–C σ-bond produces an infinite number of spatial arrangements termed conformations or rotamers.", "In ethane, the two extreme conformations are staggered (dihedral angle θ = 60°, minimum torsional strain, most stable) and eclipsed (θ = 0°, maximum electron cloud repulsion, least stable).", "The energy difference between staggered and eclipsed ethane is 12.55 kJ/mol (3 kcal/mol), representing the torsional barrier to rotation."], "formulas": [{"name": "General Alkane Molecular Formula", "formula": "C_n H_{2n+2} \\quad (n \\ge 1)", "note": "Complete saturation; each carbon is tetrahedrally bonded to 4 atoms."}, {"name": "Dihedral (Torsional) Angle", "formula": "\\theta = 60^\\circ \\text{ (Staggered)}, \\quad \\theta = 0^\\circ \\text{ (Eclipsed)}", "note": "Angle between C–H bonds on adjacent carbon atoms viewed along C–C axis."}, {"name": "Torsional Strain Barrier of Ethane", "formula": "\\Delta E_{\\text{torsional}} = 12.55 \\text{ kJ/mol} \\quad (\\approx 4.2 \\text{ kJ/mol per H-H eclipse})", "note": "Thermal energy at 298 K (RT ≈ 2.49 kJ/mol) easily overcomes this barrier, making conformational interconversion rapid."}, {"name": "Conformational Stability Hierarchy", "formula": "\\text{Staggered} > \\text{Skew / Gauche} > \\text{Eclipsed}", "note": "Staggered maximizes spatial distance between electron clouds of adjacent C–H bonds."}], "deeper": "In Newman projections, the molecule is viewed along the C–C bond axis. The front carbon is represented by a central point with three radiating bonds at 120°, and the rear carbon is represented by a larger circle with bonds extending from its circumference. In the eclipsed conformation, the electron clouds of the adjacent C–H σ-bonds are at their closest approach (229 pm), causing strong electrostatic repulsive interactions termed torsional strain. In the staggered conformation, the dihedral angle is 60° and the internuclear C–H distance is maximized (311 pm), virtually eliminating torsional repulsion. Although ethane rotates freely several million times per second at room temperature, it spends roughly 99% of its time in or near the staggered conformation.", "worked": {"problem": "Calculate the individual energy penalty of a single H/H eclipsing interaction in ethane, given the total torsional strain barrier is 12.55 kJ/mol. Explain why ethane cannot be separated into distinct conformational isomers at 25°C.", "solution": ["1. In the fully eclipsed conformation of ethane, three pairs of C–H bonds eclipse each other simultaneously.", "2. Individual strain per H/H eclipse = 12.55 kJ/mol / 3 = 4.18 kJ/mol (≈ 1.0 kcal/mol).", "3. At room temperature (T = 298 K), the average thermal kinetic energy available from molecular collisions is RT = (8.314 J/mol·K)(298 K) ≈ 2.48 kJ/mol.", "4. Because RT is comparable to the 12.55 kJ/mol barrier, the molecules overcome the barrier millions of times per second (rotation frequency ≈ 10¹¹ s⁻¹).", "5. Therefore, individual conformations interconvert far too rapidly to be physically isolated or resolved at room temperature."]}, "prediction": {"question": "If ethane is cooled to near absolute zero or substituted with bulky groups (such as in 1,2-dichloroethane or butane), which conformation is the predominant ground state, and why?", "options": ["Eclipsed, because the electron clouds overlap to form favorable temporary covalent bonds.", "Anti-staggered, because bulky groups and C-H bonds are positioned 180° apart, minimizing both torsional and steric strain.", "Gauche, because dipole moments cancel only in the 60° arrangement.", "Fully eclipsed, because polarizability increases when atoms are nearest."], "correct": 1, "explanation": "In anti-staggered conformations, the largest substituents are situated at a dihedral angle of 180°, which minimizes both electronic torsional strain and steric (van der Waals) repulsion."}, "simTitle": "Ethane & Butane Newman / Sawhorse Rotator", "connect": [{"title": "Petroleum Fractionation", "desc": "Alkanes are the primary constituents of liquefied petroleum gas (LPG: propane + butane) and compressed natural gas (CNG: methane)."}, {"title": "Enzyme-Substrate Active Sites", "desc": "Substrate molecules must adopt specific staggered conformations to fit precisely into enzymatic binding pockets without steric clash."}], "quizzes": [{"question": "What is the dihedral angle between adjacent C–H bonds in the staggered conformation of ethane?", "options": ["0°", "60°", "109.5°", "120°"], "answer": 1, "explanation": "In the staggered conformation of ethane, adjacent C–H bonds are staggered exactly midway between each other at a dihedral angle of 60°.", "hint": "Think of half of 120° spacing in a 3-fold planar projection."}, {"question": "Which of the following statements about the conformations of ethane is FALSE?", "options": ["The staggered conformation is more stable than the eclipsed conformation by ~12.55 kJ/mol.", "The eclipsed conformation experiences maximum torsional strain.", "The two conformations can be easily isolated into separate bottles at 25°C.", "Ethane molecules rotate continuously about the central C–C single bond."], "answer": 2, "explanation": "The rotational barrier of 12.55 kJ/mol is easily overcome by thermal energy at room temperature; conformational isomers rapidly interconvert and cannot be isolated.", "hint": "Consider the magnitude of thermal energy RT compared to the small barrier."}, {"question": "How many C–C σ bonds and C–H σ bonds are present in a molecule of 2-methylpropane (isobutane, C₄H₁₀)?", "options": ["3 C–C σ bonds and 10 C–H σ bonds", "4 C–C σ bonds and 10 C–H σ bonds", "3 C–C σ bonds and 8 C–H σ bonds", "2 C–C σ bonds and 10 C–H σ bonds"], "answer": 0, "explanation": "Isobutane has a central tertiary carbon bonded to 3 methyl carbons (3 C–C σ bonds) and a total of 10 hydrogen atoms (10 C–H σ bonds).", "hint": "Count bonds radiating from the central carbon to 3 methyl groups and 1 hydrogen."}]}, {"id": "c2", "title": "Reactions of Alkanes & Free-Radical Halogenation Mechanism", "navTitle": "Alkane Reactions & Free Radicals", "minutes": 18, "pages": "6–12", "deck": "Examine the substitution chemistry of alkanes, free-radical halogenation mechanism (initiation, propagation, termination), combustion, aromatization, and pyrolysis.", "quick": ["Alkanes are chemically inert (paraffins: parum affinis = little affinity) towards acids, bases, and oxidizing agents under mild conditions due to strong non-polar C–C and C–H σ-bonds.", "Halogenation of alkanes proceeds by a free-radical chain mechanism initiated by homolytic cleavage of halogen molecules in the presence of UV light (hν) or high heat (573–773 K).", "The 3 classical stages are: (1) Chain Initiation, (2) Chain Propagation, and (3) Chain Termination.", "The formation of trace amounts of ethane during chlorination of methane provides definitive proof of the free radical mechanism via the termination step: •CH₃ + •CH₃ ⟶ CH₃–CH₃.", "Higher alkanes undergo aromatization (dehydrogenation + cyclization) at 773 K and 10–20 atm over Cr₂O₃/Al₂O₃ (e.g., n-hexane yields benzene).", "Wurtz reaction couples alkyl halides using sodium in dry ether: 2 R–X + 2 Na ⟶ R–R + 2 NaX (unsuitable for odd-carbon alkanes due to mixture of 3 products)."], "formulas": [{"name": "Chlorination Initiation Step", "formula": "\\text{Cl}_2 \\xrightarrow{h\\nu} 2 \\text{Cl}^\\bullet \\quad (\\Delta H^\\circ = +242 \\text{ kJ/mol})", "note": "Homolytic bond cleavage of weakest bond (Cl–Cl) by photochemical energy."}, {"name": "Chlorination Propagation Steps", "formula": "\\text{Cl}^\\bullet + \\text{CH}_4 \\to ^\\bullet\\text{CH}_3 + \\text{HCl}; \\quad ^\\bullet\\text{CH}_3 + \\text{Cl}_2 \\to \\text{CH}_3\\text{Cl} + \\text{Cl}^\\bullet", "note": "Regenerates chlorine radical Cl• to propagate an ongoing self-sustaining chain reaction."}, {"name": "General Combustion Reaction", "formula": "\\text{C}_n\\text{H}_{2n+2} + \\left(\\frac{3n+1}{2}\\right)\\text{O}_2 \\longrightarrow n\\text{CO}_2 + (n+1)\\text{H}_2\\text{O} + \\text{Heat}", "note": "Highly exothermic oxidation; forms the thermodynamic basis for hydrocarbons as domestic/industrial fuels."}, {"name": "Catalytic Aromatization Reforming", "formula": "\\text{CH}_3(\\text{CH}_2)_4\\text{CH}_3 \\xrightarrow[773\\text{ K, 10-20 atm}]{\\text{Cr}_2\\text{O}_3 / \\text{Al}_2\\text{O}_3} \\text{C}_6\\text{H}_6 + 4\\text{H}_2", "note": "Conversion of open chain n-hexane into aromatic benzene ring with loss of 4 moles of hydrogen."}], "deeper": "The reactivity of halogens with alkanes follows the order: F₂ > Cl₂ > Br₂ > I₂. Fluorination is explosively exothermic and causes extensive C–C bond cleavage; it requires inert gas dilution. Chlorination is rapid and relatively unselective, whereas bromination is slower and highly regioselective for 3° C–H bonds over 2° and 1° (reactivity ratio 3° : 2° : 1° is roughly 1600 : 82 : 1 for bromination versus 5 : 3.8 : 1 for chlorination). Iodination is reversible and endothermic (ΔH° > 0); it requires an oxidizing agent like HNO₃ or HIO₃ to destroy the HI coproduct (5 HI + HIO₃ ⟶ 3 I₂ + 3 H₂O) and drive the equilibrium forward.", "worked": {"problem": "Explain why the Wurtz reaction between an equimolar mixture of iodomethane (CH₃I) and iodoethane (C₂H₅I) in the presence of sodium in dry ether fails to produce pure propane. Write equations for all products formed.", "solution": ["1. Sodium metal reacts indiscriminately with both alkyl halides via free radical or organosodium pathways.", "2. Methyl radicals (•CH₃) and ethyl radicals (•C₂H₅) are generated simultaneously in the reaction matrix.", "3. Three distinct combination pathways occur:", "   (a) Cross-coupling: •CH₃ + •C₂H₅ ⟶ CH₃–CH₂–CH₃ (Propane, desired)", "   (b) Self-coupling 1: •CH₃ + •CH₃ ⟶ CH₃–CH₃ (Ethane, b.p. −89°C)", "   (c) Self-coupling 2: •C₂H₅ + •C₂H₅ ⟶ CH₃–CH₂–CH₂–CH₃ (Butane, b.p. −0.5°C)", "4. A complex mixture of three alkanes (ethane, propane, butane) is produced.", "5. Because their boiling points and physical properties are closely spaced, separation by fractional distillation is inefficient and yield of pure propane is dismal."]}, "prediction": {"question": "When methane is treated with excess chlorine gas in the presence of bright sunlight (UV light), what is the ultimate stable organic product formed after exhaustive chlorination?", "options": ["Only chloromethane (CH₃Cl), because chlorine radicals terminate immediately.", "Carbon tetrachloride (tetrachloromethane, CCl₄), as successive propagation steps substitute all 4 hydrogen atoms.", "Hexachloroethane (C₂Cl₆), because dimerization is the fastest step.", "Phosgene (COCl₂), because atmospheric oxygen oxidizes the radical."], "correct": 1, "explanation": "With excess chlorine, each chlorinated intermediate (CH₃Cl ⟶ CH₂Cl₂ ⟶ CHCl₃ ⟶ CCl₄) undergoes subsequent H-abstraction until all hydrogens are replaced by chlorine, yielding carbon tetrachloride."}, "simTitle": "Free-Radical Chain Halogenation & Cracking Simulator", "connect": [{"title": "Ozone Layer Depletion", "desc": "Chlorofluorocarbons (CFCs) release chlorine free radicals (Cl•) under stratospheric UV light, catalyzing ozone destruction via analogous propagation cycles."}, {"title": "Petroleum Cracking", "desc": "High-temperature thermal cracking of heavy alkane fractions proceeds via homolytic C–C cleavage to produce high-octane gasoline and light alkene monomers."}], "quizzes": [{"question": "Which of the following termination steps accounts for the formation of trace ethane during the chlorination of methane?", "options": ["•CH₃ + Cl• ⟶ CH₃Cl", "•CH₃ + •CH₃ ⟶ C₂H₆", "Cl• + Cl• ⟶ Cl₂", "CH₄ + Cl₂ ⟶ CH₃Cl + HCl"], "answer": 1, "explanation": "Combination of two methyl radicals (•CH₃ + •CH₃ ⟶ C₂H₆) during chain termination produces trace amounts of ethane, confirming the presence of methyl radicals.", "hint": "Look for the step that joins two one-carbon radical fragments into a two-carbon alkane."}, {"question": "Why is an oxidizing agent such as iodic acid (HIO₃) or nitric acid (HNO₃) added during the iodination of alkanes?", "options": ["To generate iodine radicals photochemically.", "To oxidize the toxic alkane reactant into an ester.", "To destroy the reducing agent HI formed, preventing the reverse reaction.", "To act as a Lewis acid catalyst."], "answer": 2, "explanation": "Iodination is reversible because HI is a strong reducing agent that reduces the alkyl iodide back to alkane; oxidizing agents consume HI and drive the equilibrium to completion.", "hint": "Consider the reversible nature of iodination and the role of HI."}, {"question": "What catalyst and conditions are required to convert n-hexane into benzene via catalytic reforming (aromatization)?", "options": ["Anhydrous AlCl₃ at room temperature", "Cr₂O₃, V₂O₅ or Mo₂O₃ on Al₂O₃ at 773 K and 10–20 atm", "Concentrated H₂SO₄ at 443 K", "Sodium metal in dry ether"], "answer": 1, "explanation": "Aromatization of n-hexane to benzene occurs at 773 K and 10–20 atm over oxides of chromium, vanadium, or molybdenum supported on alumina.", "hint": "Requires transition metal oxide catalysts under high temperature and pressure."}]}, {"id": "c3", "title": "Alkenes: Structure, Nomenclature & Geometrical (cis-trans) Isomerism", "navTitle": "Alkenes & Geometrical Isomerism", "minutes": 18, "pages": "12–18", "deck": "Explore the sp² trigonal planar geometry of alkenes, the π-bond orbital overlap, IUPAC nomenclature rules, and the origin of cis-trans stereoisomerism.", "quick": ["Alkenes (olefins: oil-forming) possess at least one carbon-carbon double bond (>C=C<) with general formula C_nH_{2n}.", "Both double-bonded carbons are sp² hybridized with bond angles near 120° in a planar arrangement.", "The double bond consists of one strong σ-bond (bond enthalpy 397 kJ/mol, formed by sp²-sp² head-on overlap) and one weaker π-bond (bond enthalpy 284 kJ/mol, formed by lateral 2p_z overlap).", "Rotation around the C=C double bond is restricted because rotation by 90° completely destroys the lateral overlap of 2p orbitals (barrier ~260 kJ/mol).", "This restricted rotation leads to geometrical stereoisomerism when each double-bonded carbon is attached to two different atoms or groups (Cab=Cab or Cab=Ccd).", "In the cis-isomer, identical or high-priority groups lie on the same side of the double bond; in the trans-isomer, they lie on opposite sides.", "cis-Isomers are typically more polar (higher dipole moment μ and higher boiling point), whereas trans-isomers are more symmetrical (higher melting point due to superior crystal packing)."], "formulas": [{"name": "Alkene General Formula", "formula": "\\text{C}_n\\text{H}_{2n} \\quad (n \\ge 2)", "note": "One degree of unsaturation (index of hydrogen deficiency = 1)."}, {"name": "Condition for Geometrical Isomerism", "formula": "\\text{C}(a)(b) = \\text{C}(x)(y) \\quad \\text{where } a \\ne b \\text{ and } x \\ne y", "note": "If either carbon has two identical ligands (e.g. =CH₂ or =C(CH₃)₂), geometrical isomerism is impossible."}, {"name": "Dipole Moment Vector Addition", "formula": "\\vec{\\mu}_{\\text{cis}} = \\vec{\\mu}_1 + \\vec{\\mu}_2 \\ne 0; \\quad \\vec{\\mu}_{\\text{trans}} = \\vec{\\mu}_1 + (-\\vec{\\mu}_1) = 0 \\text{ (symmetric)}", "note": "cis-But-2-ene has μ = 0.33 D; trans-but-2-ene has μ = 0.00 D."}, {"name": "Rotational Activation Barrier", "formula": "E_a \\approx 260 \\text{ kJ/mol} \\quad (\\text{Breaking of } \\pi \\text{ bond})", "note": "Thermal energy at ambient temperatures cannot overcome this barrier, rendering cis and trans isolable stereoisomers."}], "deeper": "Because the π-electron cloud resides above and below the internuclear axis, the π-electrons are loosely held and highly polarizable. This makes alkenes act as electron-rich Lewis bases (nucleophiles) that readily undergo electrophilic addition reactions. Regarding geometrical isomerism, hex-2-ene (CH₃–CH=CH–CH₂CH₂CH₃) shows cis and trans isomers: in the cis-isomer, the methyl and propyl groups are on the same side, creating a net dipole pointing toward the double bond (higher b.p.). In the trans-isomer, the two alkyl group bond moments oppose each other across the inversion center, resulting in a near-zero dipole moment and a lower boiling point.", "worked": {"problem": "Examine hex-2-ene. Draw the structures of its cis and trans isomers. Predict which isomer exhibits a higher boiling point and explain why in terms of molecular polarity.", "solution": ["1. Hex-2-ene has the condensed formula CH₃–CH=CH–CH₂–CH₂–CH₃. Both C2 and C3 are bonded to two different groups: C2 has –H and –CH₃; C3 has –H and –CH₂CH₂CH₃.", "2. cis-Hex-2-ene: Both alkyl groups (–CH₃ and –C₃H₇) lie on the same side of the C=C double bond (Z-configuration).", "3. trans-Hex-2-ene: The alkyl groups lie on opposite sides of the double bond (E-configuration).", "4. Alkyl groups are electron-releasing (+I effect) toward the sp² double-bonded carbons.", "5. In cis-hex-2-ene, the two C_sp³–C_sp² bond dipoles reinforce each other, producing a significant resultant dipole moment (μ > 0).", "6. In trans-hex-2-ene, the bond dipoles oppose each other and nearly cancel, resulting in μ ≈ 0.", "7. Due to stronger dipole-dipole intermolecular attractions, cis-hex-2-ene has a higher boiling point than trans-hex-2-ene."]}, "prediction": {"question": "Which of the following alkenes CANNOT exhibit cis-trans geometrical isomerism?", "options": ["Pent-2-ene (CH₃–CH=CH–CH₂CH₃)", "But-1-ene (CH₂=CH–CH₂CH₃)", "1-Chloroprop-1-ene (CH₃–CH=CHCl)", "Hex-3-ene (CH₃CH₂–CH=CH–CH₂CH₃)"], "correct": 1, "explanation": "In but-1-ene, the terminal C1 atom is bonded to two identical hydrogen atoms (CH₂=). Swapping these two identical hydrogens produces an identical molecule, so geometrical isomerism cannot exist."}, "simTitle": "Geometrical Isomerism & Dipole Moment Chamber", "connect": [{"title": "Vision Chemistry (Rhodopsin)", "desc": "Light absorption triggers an ultra-fast cis-to-trans photoisomerization of 11-cis-retinal to all-trans-retinal in rhodopsin, creating the nerve impulses for vision."}, {"title": "Trans Fatty Acids in Nutrition", "desc": "Partial hydrogenation of vegetable oils converts cis double bonds into trans-fats, which pack tightly like saturated fats and increase cardiovascular risk."}], "quizzes": [{"question": "Why is rotation restricted around a carbon–carbon double bond in alkenes at ordinary temperatures?", "options": ["Because of electrostatic attraction between the two carbon nuclei.", "Because rotation by 90° requires breaking the lateral overlap of 2p orbitals (π-bond), requiring ~260 kJ/mol.", "Because σ-bonds are directional and cannot bend.", "Because hydrogen atoms physically block rotation."], "answer": 1, "explanation": "Rotation about C=C twists the unhybridized 2p orbitals out of alignment, breaking the π-bond. The high energy required (~260 kJ/mol) prevents rotation at room temperature.", "hint": "Consider what happens to the parallel p-orbital overlap during rotation."}, {"question": "Between cis-but-2-ene and trans-but-2-ene, which isomer has a higher melting point and why?", "options": ["cis-but-2-ene, because it has a higher dipole moment.", "trans-but-2-ene, because its symmetrical shape packs more efficiently into the crystal lattice.", "cis-but-2-ene, because it has stronger London dispersion forces.", "Both have identical melting points because their molecular weights are the same."], "answer": 1, "explanation": "trans-But-2-ene is highly symmetrical and fits more tightly into a crystal lattice, requiring more thermal energy to disrupt the crystal structure (higher melting point: −106°C vs −139°C).", "hint": "Think about crystal lattice packing efficiency."}, {"question": "What is the systematic IUPAC name of the compound (CH₃)₂C=CH–CH₂–CH₃?", "options": ["2-Methylpent-2-ene", "4-Methylpent-3-ene", "2-Ethylbut-2-ene", "1,1-Dimethylbut-1-ene"], "answer": 0, "explanation": "The longest chain containing the double bond has 5 carbons (pent-). Numbering from the left gives the double bond locant 2 and methyl substituent locant 2: 2-methylpent-2-ene.", "hint": "Number the 5-carbon chain from the end closer to the double bond."}]}, {"id": "c4", "title": "Electrophilic Addition to Alkenes: Markovnikov & Peroxide Effects", "navTitle": "Markovnikov & Peroxide Effects", "minutes": 20, "pages": "18–24", "deck": "Deconstruct electrophilic addition mechanisms, Markovnikov's rule carbocation stability, anti-Markovnikov peroxide effect with HBr, and ozonolysis cleavage.", "quick": ["Alkenes undergo electrophilic addition because the exposed, loosely held π-electron cloud attacks electrophiles (E⁺) to form a carbocation intermediate.", "Markovnikov's Rule: In the addition of an unsymmetrical reagent (H–X) to an unsymmetrical alkene, the acidic hydrogen (positive part) attaches to the double-bonded carbon having more hydrogen atoms.", "Markovnikov's rule is fundamentally driven by carbocation stability: addition of H⁺ to the less substituted carbon produces the more stable secondary (2°) or tertiary (3°) carbocation.", "Peroxide Effect (Kharasch Effect): In the presence of organic peroxides (e.g. benzoyl peroxide), addition of HBr (only!) to unsymmetrical alkenes proceeds against Markovnikov's rule, yielding the 1-bromoalkane.", "The peroxide effect occurs via a free-radical mechanism where Br• radical adds first to generate the more stable 2° or 3° carbon radical.", "The peroxide effect is NOT observed with HCl (H–Cl bond too strong: 430.5 kJ/mol) or HI (C–I bond too weak, I• radicals dimerize to I₂ instead of adding to alkene).", "Ozonolysis: Cleavage of alkenes with O₃ followed by Zn/H₂O reduction splits the C=C bond into two carbonyl compounds (>C=O), locating the exact position of double bonds."], "formulas": [{"name": "Markovnikov Ionic Addition", "formula": "\\text{R–CH=CH}_2 + \\text{H–Br} \\xrightarrow{\\text{no peroxide}} \\text{R–CH(Br)–CH}_3 \\quad (2^\\circ \\text{ Carbocation Pathway})", "note": "Step 1: H⁺ attacks to form 2° carbocation R–C⁺H–CH₃; Step 2: Br⁻ attacks carbocation."}, {"name": "Anti-Markovnikov Radical Addition (HBr Only)", "formula": "\\text{R–CH=CH}_2 + \\text{H–Br} \\xrightarrow{\\text{Peroxide}} \\text{R–CH}_2\\text{–CH}_2\\text{Br} \\quad (2^\\circ \\text{ Radical Pathway})", "note": "Step 1: Br• attacks less substituted carbon to form more stable 2° radical R–C•H–CH₂Br."}, {"name": "Ozonolysis Reductive Cleavage", "formula": ">\\text{C}=\\text{C}< \\xrightarrow[2.\\text{ Zn/H}_2\\text{O}]{1.\\text{ O}_3} >\\text{C}=\\text{O} + \\text{O}=\\text{C}< + \\text{ZnO}", "note": "Zn dust destroys H₂O₂ preventing secondary oxidation of aldehydes to carboxylic acids."}, {"name": "Carbocation Stability Governing Markovnikov", "formula": "3^\\circ > 2^\\circ > 1^\\circ > \\text{CH}_3^+", "note": "Governed by hyperconjugation and +I inductive electron donation."}], "deeper": "Why does only HBr exhibit the peroxide effect? In the free radical chain addition of H–X to alkenes, two propagation steps must both be exothermic (ΔH° < 0): (1) addition of X• to the alkene, and (2) abstraction of H from H–X by the resulting alkyl radical. For HCl, the H–Cl bond is exceptionally strong (430.5 kJ/mol), making Step 2 endothermic (+27 kJ/mol). For HI, the H–I bond is weak (296.8 kJ/mol) so Step 2 is exothermic, but addition of I• to the double bond is endothermic (+52 kJ/mol) due to large iodine radius and weak C–I bond (267 kJ/mol); instead, iodine atoms combine with each other (2 I• ⟶ I₂, ΔH° = −151 kJ/mol). Only for HBr are both propagation steps exothermic (Step 1: −42 kJ/mol; Step 2: −37 kJ/mol), allowing an uninterrupted chain reaction.", "worked": {"problem": "An alkene 'A' on ozonolysis gives a mixture of ethanal (CH₃CHO) and pentan-3-one (CH₃CH₂COCH₂CH₃). Deduce the structural formula and systematic IUPAC name of alkene 'A'.", "solution": ["1. In ozonolysis, the two carbonyl oxygen atoms replace the original carbon-carbon double bond.", "2. Align the two carbonyl fragments facing each other at their oxygen atoms:", "   CH₃–CH=O  +  O=C(CH₂CH₃)₂", "3. Remove the two oxygen atoms and connect the carbonyl carbons with a double bond:", "   CH₃–CH = C(CH₂CH₃)₂", "4. Expanding the structure:", "   CH₃–CH = C(CH₂CH₃)–CH₂CH₃", "5. Find the longest continuous carbon chain containing the double bond: 5 carbons (pent-).", "6. Numbering from the left gives the double bond at C2 and an ethyl group at C3: 3-ethylpent-2-ene.", "7. Verification: Ozonolysis of 3-ethylpent-2-ene splits at C2=C3 into ethanal (CH₃CHO) and pentan-3-one (CH₃CH₂COCH₂CH₃)."]}, "prediction": {"question": "If propene is treated with HCl in the presence of benzoyl peroxide, what is the major organic product formed?", "options": ["1-Chloropropane, because peroxide flips the addition regiochemistry for all hydrogen halides.", "2-Chloropropane, because the H–Cl bond is too strong for the free-radical chain mechanism, so ionic Markovnikov addition prevails.", "A 50:50 mixture of 1-chloropropane and 2-chloropropane.", "Propyl benzoate, by nucleophilic acyl substitution."], "correct": 1, "explanation": "The peroxide effect is unique to HBr! Because the H–Cl bond enthalpy is too high (430.5 kJ/mol), chlorine radicals cannot sustain the chain reaction, and the reaction proceeds via the normal ionic Markovnikov pathway yielding 2-chloropropane."}, "simTitle": "Carbocation vs Peroxide Addition & Ozonolysis Lab", "connect": [{"title": "Industrial Polypropylene Production", "desc": "Ziegler-Natta coordinated polymerisation of propene produces stereoregular isotactic polypropylene for textiles and medical plastics."}, {"title": "Ozonolysis in Natural Rubber Analysis", "desc": "Harries utilized ozonolysis to prove that natural rubber is a polymer of repeating 2-methylbuta-1,3-diene (isoprene) units."}], "quizzes": [{"question": "What is the major product obtained when HBr adds to propene in the presence of benzoyl peroxide?", "options": ["2-Bromopropane", "1-Bromopropane", "1,2-Dibromopropane", "Cyclopropane"], "answer": 1, "explanation": "In the presence of peroxide, HBr adds via an anti-Markovnikov free-radical pathway where Br• adds to C1, yielding 1-bromopropane as the major product.", "hint": "Peroxide reverses the regiochemistry of HBr addition to unsymmetrical alkenes."}, {"question": "Why does HI fail to exhibit the peroxide effect in addition to alkenes?", "options": ["Because H–I bond is too strong to undergo homolytic cleavage.", "Because addition of I• to the double bond is endothermic and I• radicals prefer to dimerize to I₂.", "Because HI is insoluble in organic solvents.", "Because iodine is too electronegative."], "answer": 1, "explanation": "Addition of iodine radical to double bond is endothermic (+52 kJ/mol); instead of adding to alkene, iodine radicals spontaneously recombine into I₂.", "hint": "Consider the thermodynamics of the large iodine radical adding to carbon."}, {"question": "An alkene on ozonolysis followed by Zn/H₂O reduction gives only acetone (propan-2-one). What is the alkene?", "options": ["2-Methylpropene", "2,3-Dimethylbut-2-ene", "But-2-ene", "2-Methylbut-2-ene"], "answer": 1, "explanation": "Two molecules of propan-2-one (CH₃)₂C=O join at the carbonyl carbons to form 2,3-dimethylbut-2-ene: (CH₃)₂C=C(CH₃)₂.", "hint": "Combine two acetone molecules at their C=O groups."}]}, {"id": "c5", "title": "Alkynes: Structure, Acidic Character & Addition Reactions", "navTitle": "Alkynes & Terminal Acidity", "minutes": 18, "pages": "24–30", "deck": "Examine the linear sp cylindrical π-electron cloud of alkynes, terminal alkyne acidity, heavy metal acetylides, hydration to carbonyls, and cyclic polymerization.", "quick": ["Alkynes contain at least one carbon-carbon triple bond (–C≡C–) with general formula C_nH_{2n-2}.", "Both alkyne carbons are sp hybridized with a linear 180° bond angle and a shortened C≡C bond length of 120 pm.", "The triple bond consists of one strong sp-sp σ-bond and two mutually perpendicular π-bonds (2p_y-2p_y and 2p_z-2p_z), creating a cylindrical sheath of negative π-electron density.", "Hydrogen atoms attached to sp-hybridized carbons in terminal alkynes (e.g. ethyne, propyne) are acidic because the high 50% s-character holds bonding electrons closely to carbon, stabilizing the conjugate acetylide anion (R–C≡C:⁻).", "Terminal alkynes react with sodium metal or sodamide (NaNH₂) to liberate hydrogen gas and form sodium acetylides.", "Terminal alkynes form insoluble characteristic precipitates with ammoniacal silver nitrate (white silver acetylide Ag–C≡C–Ag) and ammoniacal cuprous chloride (red copper acetylide Cu–C≡C–Cu).", "Hydration: Addition of water in the presence of HgSO₄ and dilute H₂SO₄ at 333 K yields enols that tautomerize to aldehydes (from ethyne) or ketones (from propyne and higher alkynes).", "Cyclic Polymerization: Passing ethyne through a red-hot iron tube at 873 K yields benzene: 3 C₂H₂ ⟶ C₆H₆."], "formulas": [{"name": "Alkyne General Formula", "formula": "\\text{C}_n\\text{H}_{2n-2} \\quad (n \\ge 2)", "note": "Two degrees of unsaturation (Index of hydrogen deficiency = 2)."}, {"name": "Terminal Alkyne Acid-Base Reaction", "formula": "\\text{HC}\\equiv\\text{CH} + 2\\text{NaNH}_2 \\longrightarrow \\text{Na}^+\\,^-\\text{C}\\equiv\\text{C}^-\\,\\text{Na}^+ + 2\\text{NH}_3", "note": "Demonstrates ethyne is a stronger acid than ammonia (NH₃), but weaker than water or alcohol."}, {"name": "Acidity Hierarchy by Carbon Hybridization", "formula": "\\text{HC}\\equiv\\text{CH } (sp, 50\\% s) > \\text{H}_2\\text{C}=\\text{CH}_2 \\ (sp^2, 33.3\\% s) > \\text{H}_3\\text{C–CH}_3 \\ (sp^3, 25\\% s)", "note": "pK_a values: Ethyne ≈ 25, Ethene ≈ 44, Ethane ≈ 50."}, {"name": "Kucherov Catalytic Hydration", "formula": "\\text{HC}\\equiv\\text{CH} + \\text{H}_2\\text{O} \\xrightarrow[333\\text{ K}]{\\text{Hg}^{2+} / \\text{H}^+} [\\text{CH}_2=\\text{CH–OH}] \\xrightarrow{\\text{tautomerism}} \\text{CH}_3\\text{CHO}", "note": "Markovnikov addition of H-OH gives unstable enol which rapidly tautomerizes to ethanal."}, {"name": "Cyclic Trimerization to Benzene", "formula": "3 \\text{ C}_2\\text{H}_2 \\xrightarrow[873\\text{ K}]{\\text{Red Hot Fe Tube}} \\text{C}_6\\text{H}_6", "note": "Aromatic resonance stabilization (150.5 kJ/mol) provides the thermodynamic driving force."}], "deeper": "Why are terminal alkynes acidic while alkanes and alkenes are not? In an sp hybrid orbital, the electrons spend 50% of their time in the spherical s orbital, which has no nodal plane at the nucleus and penetrates closest to the positively charged carbon nucleus. Consequently, an sp carbon has a much higher electronegativity (χ ≈ 3.29) than an sp² carbon (χ ≈ 2.75) or an sp³ carbon (χ ≈ 2.50). This pronounced electronegativity strongly polarizes the C–H σ bond, allowing the proton to be removed by a strong base such as the amide ion (:NH₂⁻). Furthermore, the resulting negative charge in the acetylide carbanion (R–C≡C:⁻) resides in an sp hybrid orbital, where it is held close to the nucleus and stabilized.", "worked": {"problem": "Arrange ethyne, benzene, and n-hexane in decreasing order of acidic behavior and provide a rigorous electronic justification for the sequence.", "solution": ["1. Identify the hybridization of the carbon atom bonded to the hydrogen being abstracted:", "   - Ethyne (HC≡CH): Carbon is sp hybridized (50% s-character).", "   - Benzene (C₆H₆): Carbon is sp² hybridized (33.3% s-character).", "   - n-Hexane (C₆H₁₄): Carbon is sp³ hybridized (25% s-character).", "2. The higher the percentage of s-character, the closer the bonding electrons are held to the carbon nucleus, making the carbon atom more electronegative.", "3. Greater carbon electronegativity increases the partial positive charge on hydrogen and stabilizes the conjugate carbanion after proton loss.", "4. Therefore, the decreasing order of electronegativity of hybrid orbitals is: sp > sp² > sp³.", "5. Decreasing order of acidic behavior: Ethyne > Benzene > n-Hexane."]}, "prediction": {"question": "What product is obtained when propyne (CH₃–C≡CH) is heated with dilute H₂SO₄ in the presence of HgSO₄ at 333 K?", "options": ["Propanal (CH₃CH₂CHO), by anti-Markovnikov hydration.", "Propan-2-one (Acetone, CH₃COCH₃), by Markovnikov addition followed by enol-keto tautomerism.", "Propane-1,2-diol, by syn-dihydroxylation.", "Propanoic acid, by destructive oxidative cleavage."], "correct": 1, "explanation": "According to Markovnikov's rule, H⁺ adds to C1 and OH⁻ adds to C2 to form prop-1-en-2-ol [CH₃–C(OH)=CH₂]. This enol rapidly tautomerizes into the thermodynamically stable ketone, propan-2-one (acetone)."}, "simTitle": "Terminal Alkyne Acidity & Hydration Reactor", "connect": [{"title": "Oxy-Acetylene Welding", "desc": "Combustion of ethyne with pure oxygen produces temperatures exceeding 3300°C, capable of cutting and welding structural steel."}, {"title": "Calcium Carbide Synthesis", "desc": "Hydrolysis of calcium carbide (CaC₂ + 2 H₂O ⟶ Ca(OH)₂ + C₂H₂), historically manufactured from limestone and coal, pioneered industrial acetylene chemistry."}], "quizzes": [{"question": "Which of the following compounds reacts with sodium metal to liberate hydrogen gas?", "options": ["But-2-yne", "But-1-yne", "But-2-ene", "Butane"], "answer": 1, "explanation": "Only terminal alkynes with an acidic acetylenic hydrogen (–C≡C–H) like but-1-yne react with sodium to evolve H₂ gas; but-2-yne is an internal alkyne lacking acidic protons.", "hint": "The triple bond must be at the end of the carbon chain."}, {"question": "What reagent can chemically distinguish between but-1-yne and but-2-yne?", "options": ["Bromine water", "Cold dilute alkaline KMnO₄ (Baeyer's reagent)", "Ammoniacal silver nitrate solution (Tollens' reagent)", "Hydrogen gas over nickel"], "answer": 2, "explanation": "Ammoniacal AgNO₃ forms a white precipitate of silver butynide with terminal but-1-yne, but does not react with internal but-2-yne.", "hint": "Look for a test specific to terminal acetylenic protons."}, {"question": "Passing ethyne gas through a red-hot iron tube at 873 K yields which aromatic compound?", "options": ["Toluene", "Benzene", "Naphthalene", "Cyclooctatetraene"], "answer": 1, "explanation": "Three moles of ethyne undergo cyclic trimerization at 873 K over red-hot iron to form benzene (C₆H₆).", "hint": "Trimerization of three C₂ units produces a 6-carbon aromatic ring."}]}, {"id": "c6", "title": "Aromatic Hydrocarbons: Benzene Structure, Resonance & Hückel's Rule", "navTitle": "Aromaticity & Hückel's Rule", "minutes": 20, "pages": "30–36", "deck": "Uncover the electronic structure of benzene, Kekulé resonance hybrid, planar delocalization, Hückel (4n+2)π electron rule, and criteria for aromaticity.", "quick": ["Aromatic hydrocarbons (arenes) are characterized by extraordinary thermodynamic stability and reluctance to undergo addition reactions despite possessing high formal unsaturation.", "Kekulé proposed two oscillating cyclohexatriene structures for benzene; modern valence bond and MO theories describe benzene as a resonance hybrid of these canonical forms.", "All 6 carbon atoms in benzene are sp² hybridized, forming a regular planar hexagon with 120° bond angles and identical C–C bond lengths of 139 pm (intermediate between C–C 154 pm and C=C 134 pm).", "The resonance energy of benzene is 150.5 kJ/mol (36 kcal/mol), representing its extra stabilization compared to hypothetical cyclohexatriene.", "Hückel's Rule of Aromaticity: A monocyclic, planar, completely conjugated ring containing (4n + 2) π-electrons (where n = 0, 1, 2, 3...) is aromatic.", "Systems with 4n π-electrons in a planar conjugated ring (e.g. cyclobutadiene with 4π, planar cyclooctatetraene with 8π) are antiaromatic and exceptionally unstable.", "To avoid antiaromatic destabilization, cyclooctatetraene (COT, 8π electrons) puckers into a non-planar tub-shaped conformation, behaving as a normal non-aromatic polyene."], "formulas": [{"name": "Hückel's (4n + 2) Rule", "formula": "N_\\pi = 4n + 2 \\quad (n = 0, 1, 2, 3... \\implies 2, 6, 10, 14, 18\\ \\pi\\text{-electrons})", "note": "Benzene (n=1, 6π), Naphthalene (n=2, 10π), Anthracene/Phenanthrene (n=3, 14π)."}, {"name": "Benzene Resonance Energy", "formula": "\\Delta H_{\\text{resonance}} = \\Delta H_{\\text{hydrog}}(\\text{calc}) - \\Delta H_{\\text{hydrog}}(\\text{obs}) = 358.5 - 208 = 150.5 \\text{ kJ/mol}", "note": "Hydrogenation of cyclohexene releases 119.5 kJ/mol; benzene releases only 208 kJ/mol instead of 3×119.5 = 358.5 kJ/mol."}, {"name": "Three Criteria for Aromaticity", "formula": "1.\\text{ Cyclic} \\quad 2.\\text{ Planar + Completely Conjugated (all } sp^2/sp) \\quad 3.\\ (4n+2)\\pi \\text{ electrons}", "note": "Violation of planarity or conjugation renders a system non-aromatic."}, {"name": "Antiaromaticity Condition", "formula": "N_\\pi = 4n \\quad (n = 1, 2, 3... \\implies 4, 8, 12\\ \\pi\\text{-electrons in planar conjugated ring})", "note": "Antiaromatic systems have unpaired electrons in non-bonding MOs and are highly reactive/unstable."}], "deeper": "The molecular orbital description of benzene provides the deepest insight into Hückel's rule. Six 2p_z atomic orbitals combine to produce six molecular orbitals: three bonding (ψ₁, ψ₂, ψ₃) and three antibonding (ψ₄*, ψ₅*, ψ₆*). The six π-electrons completely fill all three bonding molecular orbitals with paired spins, creating a closed-shell electronic configuration analogous to the inert noble gas electron shells. In contrast, in a 4n system like cyclobutadiene (4π electrons), two electrons fill the lowest bonding orbital ψ₁, but the remaining two electrons must singly occupy two degenerate non-bonding orbitals (ψ₂ and ψ₃) as a diradical, resulting in massive antiaromatic instability.", "worked": {"problem": "Determine whether each of the following species is aromatic, antiaromatic, or non-aromatic, citing Hückel's rule: (a) Cyclopentadienyl anion (C₅H₅⁻), (b) Cycloheptatrienyl cation (Tropylium, C₇H₇⁺), and (c) 1,3-Cyclopentadiene.", "solution": ["(a) Cyclopentadienyl anion (C₅H₅⁻):", "   - Cyclic and planar 5-membered ring.", "   - Four π-electrons from two double bonds + two electrons from the carbanion lone pair = 6 π-electrons.", "   - 4n + 2 = 6 with n = 1. All 5 carbons are sp² hybridized.", "   - Verdict: Aromatic (exceptionally stable carbanion).", "(b) Tropylium cation (C₇H₇⁺):", "   - Cyclic and planar 7-membered ring.", "   - Six π-electrons from three double bonds; the carbocation carbon has an empty p-orbital.", "   - 4n + 2 = 6 with n = 1. Complete cyclic delocalization.", "   - Verdict: Aromatic (highly stable carbocation).", "(c) 1,3-Cyclopentadiene:", "   - Contains an sp³ hybridized –CH₂– carbon in the ring.", "   - The sp³ carbon has no unhybridized p-orbital, breaking cyclic conjugation.", "   - Verdict: Non-aromatic."]}, "prediction": {"question": "Why does cyclooctatetraene (C₈H₈) NOT behave as an antiaromatic compound despite possessing 8 π-electrons (4n with n = 2)?", "options": ["Because it undergoes rapid resonance between two Kekulé structures.", "Because it adopts a non-planar tub-shaped conformation, avoiding continuous p-orbital overlap and antiaromatic destabilization.", "Because it contains an odd number of double bonds.", "Because it protonates spontaneously in air."], "correct": 1, "explanation": "Antiaromaticity requires strict planarity. To escape the severe destabilization of a planar 8π antiaromatic state, cyclooctatetraene flexes into a non-planar 'tub' shape, behaving as an ordinary non-aromatic tetraene."}, "simTitle": "Hückel (4n+2)π Rule & Ring Planarity Analyzer", "connect": [{"title": "DNA Base Stacking", "desc": "Aromatic purine (adenine, guanine) and pyrimidine (cytosine, thymine) rings stack in the core of DNA via π–π interactions, stabilizing the double helix."}, {"title": "Graphene & Carbon Nanotubes", "desc": "Graphene consists of a 2D sheet of sp² hybridized carbon atoms in fused aromatic benzene rings, imparting extraordinary electrical conductivity and mechanical strength."}], "quizzes": [{"question": "What is the resonance energy of benzene, which accounts for its unique thermodynamic stability?", "options": ["28.5 kJ/mol", "150.5 kJ/mol (36 kcal/mol)", "358.5 kJ/mol", "498.0 kJ/mol"], "answer": 1, "explanation": "The resonance stabilization energy of benzene is 150.5 kJ/mol (36 kcal/mol), calculated from the difference between observed and theoretical heats of hydrogenation.", "hint": "Recall the value around 36 kcal/mol."}, {"question": "Which of the following numbers of π-electrons satisfies Hückel's rule for aromaticity?", "options": ["4", "8", "10", "12"], "answer": 2, "explanation": "According to Hückel's rule (4n + 2), allowed π-electron counts are 2 (n=0), 6 (n=1), 10 (n=2), 14 (n=3). Thus 10 π-electrons (like naphthalene) is aromatic.", "hint": "Calculate 4n + 2 for integer values of n."}, {"question": "Why is benzene reluctant to undergo addition reactions such as bromination without a catalyst?", "options": ["Because benzene lacks double bonds.", "Because addition destroys the aromatic sextet and sacrifices 150.5 kJ/mol of resonance energy.", "Because the carbon atoms are sp³ hybridized.", "Because bromine is too small to attack benzene."], "answer": 1, "explanation": "Addition converts sp² carbons into sp³ carbons, destroying the delocalized π-sextet and forfeiting 150.5 kJ/mol of aromatic resonance stabilization.", "hint": "Consider the immense energetic penalty of losing aromaticity."}]}, {"id": "c7", "title": "Electrophilic Aromatic Substitution (EAS) & Directive Influence", "navTitle": "EAS Reactions & Directive Effects", "minutes": 22, "pages": "36–42", "deck": "Master the universal 3-step mechanism of electrophilic aromatic substitution, nitration, halogenation, Friedel-Crafts reactions, and ortho/para vs meta directive effects.", "quick": ["Benzene undergoes Electrophilic Aromatic Substitution (EAS) because substitution preserves the aromatic resonance stabilization while addition destroys it.", "Universal EAS Mechanism: (1) Generation of electrophile E⁺ by Lewis acid catalyst, (2) Attack of benzene π-cloud on E⁺ to form resonance-stabilized arenium ion (σ-complex / Wheland intermediate), (3) Loss of proton (H⁺) to base restoring aromatic sextet.", "Nitration uses nitrating mixture (conc. HNO₃ + conc. H₂SO₄) where H₂SO₄ protonates HNO₃ to generate the nitronium ion (NO₂⁺).", "Halogenation requires a Lewis acid (FeCl₃, AlCl₃, FeBr₃) to polarize the halogen and generate halonium ion (Cl⁺ or Br⁺).", "Friedel-Crafts Alkylation couples R–Cl using anhydrous AlCl₃ to introduce an alkyl group; prone to carbocation rearrangement and polyalkylation.", "Friedel-Crafts Acylation couples R–COCl using anhydrous AlCl₃ to introduce an acyl group (R–CO–); forms ketones without carbocation rearrangement.", "Activating groups (–OH, –NH₂, –OCH₃, –CH₃) donate electron density to the ring (+R or +I/+H), speeding up reaction and directing electrophiles to ortho and para positions.", "Deactivating groups (–NO₂, –CN, –COOH, –CHO) withdraw electron density (-R, -I), slowing down reaction and directing electrophiles to meta position.", "Halogens (–F, –Cl, –Br, –I) are anomalous: they are deactivating due to strong –I inductive effect, but ortho/para directing due to +R resonance donation from lone pairs."], "formulas": [{"name": "Generation of Nitronium Ion", "formula": "\\text{HNO}_3 + 2\\text{H}_2\\text{SO}_4 \\rightleftharpoons \\text{NO}_2^+ + \\text{H}_3\\text{O}^+ + 2\\text{HSO}_4^-", "note": "HNO₃ acts as a Bronsted-Lowry base, accepting a proton from stronger H₂SO₄."}, {"name": "Arenium Ion (σ-Complex) Formation", "formula": "\\text{C}_6\\text{H}_6 + \\text{E}^+ \\xrightarrow{\\text{slow (RDS)}} [\\text{C}_6\\text{H}_6\\text{E}]^+ \\quad (\\text{Resonance delocalized across } o, p)", "note": "Rate-determining step; temporarily disrupts aromaticity, forming sp³ carbon at site of attack."}, {"name": "Restoration of Aromaticity", "formula": "[\\text{C}_6\\text{H}_6\\text{E}]^+ + :\\text{B} \\xrightarrow{\\text{fast}} \\text{C}_6\\text{H}_5\\text{E} + \\text{H–B}^+", "note": "Fast proton loss recovers 150.5 kJ/mol of aromatic resonance stabilization energy."}, {"name": "Friedel-Crafts Acylation", "formula": "\\text{C}_6\\text{H}_6 + \\text{CH}_3\\text{COCl} \\xrightarrow{\\text{anh. AlCl}_3} \\text{C}_6\\text{H}_5\\text{COCH}_3 + \\text{HCl}", "note": "Acylium ion intermediate (CH₃–C≡O⁺) is resonance-stabilized and does not rearrange."}], "deeper": "Why are halogens ortho/para-directing yet deactivating? Halogens possess both an electron-withdrawing inductive effect (-I, electronegativity F > Cl > Br > I) and an electron-donating resonance effect (+R, donation of a lone pair into the ring π-system). Because the -I effect is stronger than the +R effect overall, the halogen reduces total electron density in the ring compared to benzene, making the ring less reactive toward electrophiles (deactivating). However, during electrophilic attack at the ortho or para positions, the halogen can donate its lone pair to form a fourth resonance contributor where all atoms (including carbon and halogen) have complete octets. This special octet stabilization is impossible during meta attack, directing the incoming electrophile selectively to ortho and para positions.", "worked": {"problem": "Design synthetic pathways to convert benzene into (a) p-nitrobromobenzene and (b) m-nitrochlorobenzene, justifying the sequence of reactions.", "solution": ["(a) Synthesis of p-nitrobromobenzene:", "   - Step 1: Brominate benzene first using Br₂ in the presence of FeBr₃ catalyst to yield bromobenzene.", "   - Rationale: The bromo group (–Br) is an ortho/para director.", "   - Step 2: Treat bromobenzene with nitrating mixture (conc. HNO₃ + conc. H₂SO₄).", "   - The incoming –NO₂ group is directed to ortho and para positions. The para isomer (p-nitrobromobenzene) is less sterically hindered and can be isolated by fractional crystallization.", "(b) Synthesis of m-nitrochlorobenzene:", "   - Step 1: Nitrate benzene first using conc. HNO₃ + conc. H₂SO₄ to yield nitrobenzene.", "   - Rationale: The nitro group (–NO₂) is a powerful meta director.", "   - Step 2: Treat nitrobenzene with Cl₂ in the presence of anhydrous FeCl₃ catalyst.", "   - The incoming –Cl electrophile is directed selectively to the meta position, cleanly yielding m-nitrochlorobenzene."]}, "prediction": {"question": "Which of the following aromatic compounds undergoes electrophilic nitration most rapidly?", "options": ["Benzene", "Toluene (Methylbenzene)", "Nitrobenzene", "Chlorobenzene"], "correct": 1, "explanation": "Toluene contains an electron-donating methyl group (+I and hyperconjugation) that activates the benzene ring, making it react roughly 25 times faster than unsubstituted benzene. In contrast, –NO₂ is strongly deactivating and –Cl is moderately deactivating."}, "simTitle": "Electrophilic Aromatic Substitution (EAS) & Directive Influence Engine", "connect": [{"title": "Pharmaceutical Synthesis (Aspirin & Paracetamol)", "desc": "Both aspirin and paracetamol (acetaminophen) are synthesized industrially via regioselective EAS on phenol derivatives."}, {"title": "Polycyclic Aromatic Hydrocarbons (PAHs) & Carcinogenicity", "desc": "Fused benzenoid compounds like benzo[a]pyrene in cigarette smoke undergo enzymatic epoxidation in vivo, forming electrophilic diol-epoxides that covalently bind DNA and initiate carcinogenesis."}], "quizzes": [{"question": "What is the active electrophile in the nitration of benzene using a mixture of concentrated HNO₃ and concentrated H₂SO₄?", "options": ["Nitrite ion (NO₂⁻)", "Nitronium ion (NO₂⁺)", "Nitrate ion (NO₃⁻)", "Nitrosyl cation (NO⁺)"], "answer": 1, "explanation": "Sulfuric acid protonates nitric acid, which eliminates water to produce the linear, powerful electrophile nitronium ion (NO₂⁺).", "hint": "Formed by loss of water from protonated nitric acid."}, {"question": "Which of the following substituents acts as a meta-directing deactivator in electrophilic aromatic substitution?", "options": ["–OCH₃", "–OH", "–NO₂", "–NH₂"], "answer": 2, "explanation": "The nitro group (–NO₂) withdraws electron density via both strong -I inductive and -R resonance effects, deactivating the ring and directing electrophiles to the meta position.", "hint": "Look for a group with a formal positive or polarized positive atom attached directly to the ring."}, {"question": "Why is Friedel-Crafts acylation generally preferred over Friedel-Crafts alkylation for preparing straight-chain alkylbenzenes?", "options": ["Acylation does not use a Lewis acid.", "The intermediate acylium ion (R–CO⁺) is resonance-stabilized and does not undergo carbocation rearrangement, and the mono-acylated product is deactivated against polyacylation.", "Acylation produces only gases as byproducts.", "Alkyl halides are explosive."], "answer": 1, "explanation": "The acylium ion cannot rearrange, ensuring unbranched connectivity. Furthermore, the carbonyl group deactivates the ring, completely preventing unwanted polyacylation (unlike alkylation). Subsequent Clemmensen or Wolff-Kishner reduction yields pure unbranched alkylbenzene.", "hint": "Think about carbocation rearrangement and over-reaction (polyalkylation)."}]}], "exercises": [{"number": "9.1", "title": "Account for the formation of ethane during chlorination of methane", "question": "How do you account for the formation of ethane during chlorination of methane?", "steps": ["Chlorination of methane proceeds through a free-radical substitution chain mechanism comprising three stages: initiation, propagation, and termination.", "1. Chain Initiation: Homolysis of chlorine molecules by UV light produces chlorine free radicals:", "   Cl₂ ⟶ 2 Cl•", "2. Chain Propagation: Chlorine radicals abstract hydrogen from methane to generate methyl radicals, which then react with chlorine molecules to sustain the chain:", "   Cl• + CH₄ ⟶ •CH₃ + HCl", "   •CH₃ + Cl₂ ⟶ CH₃Cl + Cl•", "3. Chain Termination: The reaction terminates when two free radicals collide and combine. One of the termination pathways is the dimerization of two methyl radicals:", "   •CH₃ + •CH₃ ⟶ CH₃–CH₃ (Ethane)", "Conclusion: The combination of two methyl radicals in the chain termination step definitively accounts for the formation of trace amounts of ethane."], "answer": "Ethane is formed during the chain termination stage when two methyl free radicals (•CH₃) combine: •CH₃ + •CH₃ ⟶ CH₃–CH₃."}, {"number": "9.2", "title": "IUPAC nomenclature of seven unsaturated and branched hydrocarbons", "question": "Write IUPAC names of the following compounds:\n(a) CH₃CH=C(CH₃)₂\n(b) CH₂=CH–C≡C–CH₃\n(c) CH₂=CH–CH=CH₂ (bond line butadiene)\n(d) C₆H₅–CH₂–CH₂–CH=CH₂\n(e) 2-Methylphenol (o-cresol)\n(f) CH₃(CH₂)₄–CH(CH₂–CH(CH₃)₂)–(CH₂)₃–CH₃\n(g) CH₃–CH=CH–CH₂–CH=CH–CH(C₂H₅)–CH₂–CH=CH₂", "steps": ["(a) CH₃–CH=C(CH₃)₂:", "   - Longest chain contains 4 carbons (but-).", "   - Number from right to give double bond and substituent lowest locants:", "   - C1 is right CH₃, C2 has =C(CH₃), C3 is =CH, C4 is left CH₃.", "   - IUPAC Name: 2-Methylbut-2-ene.", "(b) CH₂=CH–C≡C–CH₃:", "   - Chain contains 5 carbons with one double bond and one triple bond.", "   - When both double and triple bonds are equidistant from ends or have choice, double bond takes lower locant priority (numbering from left: 1-en-3-yne vs 2-yn-4-ene).", "   - C1=C2–C3≡C4–C5 ⟹ IUPAC Name: Pent-1-en-3-yne.", "(c) CH₂=CH–CH=CH₂:", "   - Symmetrical 4-carbon diene with double bonds at positions 1 and 3.", "   - IUPAC Name: Buta-1,3-diene.", "(d) C₆H₅–CH₂–CH₂–CH=CH₂:", "   - Principal functional group is double bond (4-carbon chain: but-1-ene).", "   - Benzene ring at C4 is treated as a phenyl substituent.", "   - IUPAC Name: 4-Phenylbut-1-ene.", "(e) Benzene ring with –OH and adjacent –CH₃:", "   - Principal functional group is –OH (phenol). Methyl substituent at C2.", "   - IUPAC Name: 2-Methylphenol (commonly o-cresol).", "(f) CH₃(CH₂)₄–CH(CH₂–CH(CH₃)₂)–(CH₂)₃–CH₃:", "   - Longest continuous carbon chain has 10 carbons (decane).", "   - Number from left to give substituent lowest locant: C5 has a –CH₂–CH(CH₃)₂ (2-methylpropyl / isobutyl) group.", "   - IUPAC Name: 5-(2-Methylpropyl)decane (or 5-isobutyldecane).", "(g) CH₃–CH=CH–CH₂–CH=CH–CH(C₂H₅)–CH₂–CH=CH₂:", "   - Longest chain containing all double bonds has 10 carbons (decatriene).", "   - Number from right: C1=C2, C3, C4(with –C₂H₅), C5=C6, C7, C8=C9, C10.", "   - Locants for double bonds: 1, 5, 8. Ethyl group at C4.", "   - IUPAC Name: 4-Ethyldeca-1,5,8-triene."], "answer": "(a) 2-Methylbut-2-ene, (b) Pent-1-en-3-yne, (c) Buta-1,3-diene, (d) 4-Phenylbut-1-ene, (e) 2-Methylphenol, (f) 5-(2-Methylpropyl)decane, (g) 4-Ethyldeca-1,5,8-triene."}, {"number": "9.3", "title": "Structural formulas and IUPAC names of C4H8 and C5H8 isomers", "question": "For the following compounds, write structural formulas and IUPAC names for all possible isomers having the number of double or triple bond as indicated:\n(a) C₄H₈ (one double bond)\n(b) C₅H₈ (one triple bond)", "steps": ["(a) Isomers of C₄H₈ containing one double bond (Alkenes):", "   1. But-1-ene: CH₂=CH–CH₂–CH₃", "   2. cis-But-2-ene: (Z)-CH₃–CH=CH–CH₃ (both methyls on same side of C=C)", "   3. trans-But-2-ene: (E)-CH₃–CH=CH–CH₃ (methyls on opposite sides of C=C)", "   4. 2-Methylprop-1-ene (Isobutene): CH₂=C(CH₃)₂ (branched chain isomer)", "   (Total: 4 alkene isomers including stereoisomers; 3 structural isomers).", "(b) Isomers of C₅H₈ containing one triple bond (Alkynes):", "   1. Pent-1-yne: CH≡C–CH₂–CH₂–CH₃ (terminal alkyne, straight chain)", "   2. Pent-2-yne: CH₃–C≡C–CH₂–CH₃ (internal alkyne, straight chain)", "   3. 3-Methylbut-1-yne: CH≡C–CH(CH₃)₂ (terminal alkyne, branched chain)", "   (Total: 3 alkyne structural isomers)."], "answer": "(a) For C₄H₈: But-1-ene, cis-But-2-ene, trans-But-2-ene, and 2-Methylprop-1-ene. (b) For C₅H₈: Pent-1-yne, Pent-2-yne, and 3-Methylbut-1-yne."}, {"number": "9.4", "title": "IUPAC names of ozonolysis products of four alkenes", "question": "Write IUPAC names of the products obtained by the ozonolysis of the following compounds:\n(i) Pent-2-ene\n(ii) 3,4-Dimethylhept-3-ene\n(iii) 2-Ethylbut-1-ene\n(iv) 1-Phenylbut-1-ene", "steps": ["In ozonolysis followed by Zn/H₂O reductive cleavage, the >C=C< double bond is cleaved and each double-bonded carbon is converted into a carbonyl group (>C=O):", "(i) Pent-2-ene: CH₃–CH=CH–CH₂–CH₃", "   Cleavage at C2=C3 yields:", "   CH₃–CHO (Ethanal) + CH₃–CH₂–CHO (Propanal).", "(ii) 3,4-Dimethylhept-3-ene: CH₃–CH₂–C(CH₃)=C(CH₃)–CH₂–CH₂–CH₃", "   Cleavage at C3=C4 yields:", "   CH₃–CH₂–CO–CH₃ (Butan-2-one) + CH₃–CO–CH₂–CH₂–CH₃ (Pentan-2-one).", "(iii) 2-Ethylbut-1-ene: CH₂=C(CH₂CH₃)₂", "   Cleavage at C1=C2 yields:", "   HCHO (Methanal) + CH₃–CH₂–CO–CH₂–CH₃ (Pentan-3-one).", "(iv) 1-Phenylbut-1-ene: C₆H₅–CH=CH–CH₂–CH₃", "   Cleavage at C1=C2 yields:", "   C₆H₅–CHO (Benzaldehyde) + CH₃–CH₂–CHO (Propanal)."], "answer": "(i) Ethanal and Propanal; (ii) Butan-2-one and Pentan-2-one; (iii) Methanal and Pentan-3-one; (iv) Benzaldehyde and Propanal."}, {"number": "9.5", "title": "Deduce alkene giving ethanal and pentan-3-one on ozonolysis", "question": "An alkene ‘A’ on ozonolysis gives a mixture of ethanal and pentan-3-one. Write structure and IUPAC name of ‘A’.", "steps": ["1. Identify the carbonyl products:", "   - Ethanal: CH₃–CH=O", "   - Pentan-3-one: O=C(CH₂CH₃)₂  ⟹  O=C(C₂H₅)₂", "2. Reconstruct the parent alkene by joining the two carbonyl carbon atoms with a double bond while removing oxygen atoms:", "   CH₃–CH = C(CH₂CH₃)₂", "3. Write the expanded structural formula:", "   CH₃–CH=C(CH₂CH₃)–CH₂–CH₃", "4. Determine the IUPAC name:", "   - The longest continuous carbon chain containing the double bond has 5 carbons (pent-).", "   - Number from the left: C1(CH₃)–C2(H)=C3(C₂H₅)–C4(H₂)–C5(H₃).", "   - The double bond is at C2 and an ethyl group substituent is at C3.", "   - IUPAC Name: 3-Ethylpent-2-ene."], "answer": "Structure: CH₃–CH=C(CH₂CH₃)₂; IUPAC Name: 3-Ethylpent-2-ene."}, {"number": "9.6", "title": "Deduce alkene from bond counts and ozonolysis molar mass", "question": "An alkene ‘A’ contains three C–C, eight C–H σ bonds and one C–C π bond. ‘A’ on ozonolysis gives two moles of an aldehyde of molar mass 44 u. Write IUPAC name of ‘A’.", "steps": ["1. Analyze the aldehyde product:", "   - Molar mass = 44 u.", "   - General formula of an aliphatic aldehyde is C_n H_{2n} O.", "   - 12n + 2n + 16 = 44  ⟹  14n = 28  ⟹  n = 2.", "   - The aldehyde is ethanal (CH₃CHO, molecular weight = 2×12 + 4×1 + 16 = 44 g/mol).", "2. Deduce the structure of alkene 'A':", "   - Since 1 mole of 'A' produces 2 moles of ethanal, the alkene must be symmetrical:", "   - CH₃–CH = CH–CH₃ (But-2-ene).", "3. Verify the bond counts:", "   - Carbon-Carbon σ bonds: C1–C2, C2–C3, C3–C4 = exactly 3 C–C σ bonds.", "   - Carbon-Hydrogen σ bonds: 3 (on C1) + 1 (on C2) + 1 (on C3) + 3 (on C4) = exactly 8 C–H σ bonds.", "   - Carbon-Carbon π bonds: 1 C2=C3 π bond.", "   - All given specifications are fully satisfied.", "4. IUPAC Name: But-2-ene."], "answer": "IUPAC Name: But-2-ene (CH₃–CH=CH–CH₃)."}, {"number": "9.7", "title": "Deduce structural formula of alkene from propanal and pentan-3-one", "question": "Propanal and pentan-3-one are the ozonolysis products of an alkene? What is the structural formula of the alkene?", "steps": ["1. Write the structures of the ozonolysis products:", "   - Propanal: CH₃–CH₂–CH=O", "   - Pentan-3-one: O=C(CH₂CH₃)₂", "2. Connect the carbonyl carbon atoms with a double bond:", "   CH₃–CH₂–CH = C(CH₂CH₃)₂", "3. Condensed formula:", "   CH₃–CH₂–CH=C(C₂H₅)–CH₂–CH₃", "4. Systematics:", "   - Longest chain contains 6 carbons (hex-).", "   - Number from right: C1(CH₃)–C2(CH₂)–C3(C₂H₅)=C4(H)–C5(CH₂)–C6(CH₃) or left: double bond at C3.", "   - From left: C1, C2, C3=C4. At C4 we have ethyl: 3-ethylhex-3-ene (symmetrical numbering gives C3 locant).", "   - Structural formula: CH₃–CH₂–CH=C(C₂H₅)₂ or CH₃–CH₂–CH=C(CH₂CH₃)–CH₂–CH₃."], "answer": "Structural formula: CH₃–CH₂–CH=C(CH₂CH₃)₂ (IUPAC: 3-Ethylhex-3-ene)."}, {"number": "9.8", "title": "Balanced chemical equations for combustion of four hydrocarbons", "question": "Write chemical equations for combustion reaction of the following hydrocarbons:\n(i) Butane\n(ii) Pentene\n(iii) Hexyne\n(iv) Toluene", "steps": ["Complete combustion of any hydrocarbon C_x H_y in excess oxygen yields carbon dioxide and water vapor according to the general equation:", "C_x H_y + (x + y/4) O₂ ⟶ x CO₂ + (y/2) H₂O + Heat", "(i) Butane (C₄H₁₀):", "   x = 4, y = 10 ⟹ O₂ coefficient = 4 + 10/4 = 13/2 = 6.5.", "   C₄H₁₀(g) + 13/2 O₂(g) ⟶ 4 CO₂(g) + 5 H₂O(l)", "   Or: 2 C₄H₁₀(g) + 13 O₂(g) ⟶ 8 CO₂(g) + 10 H₂O(l)", "(ii) Pentene (C₅H₁₀)
