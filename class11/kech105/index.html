<script>
window.CHAPTER = {"chapter_meta": {"id": "kech105", "number": 5, "title": "Chemical Thermodynamics", "book": "Chemistry Part I", "class": 11, "reprint": "2026-27", "tagline": "From the First Law and Hess's thermochemical cycles to entropy dispersion, Gibbs free energy, and chemical equilibrium criteria.", "total_concepts": 7, "total_practice_questions": 21, "total_exercises": 22}, "concepts": [{"id": "thermo-systems-state", "nav": "01 · Systems & State", "title": "Thermodynamic Systems, Boundaries, State Functions & Properties", "deck": "Establish the macroscopic language of thermodynamics: open, closed, and isolated systems, state functions independent of history, and extensive vs intensive properties.", "minutes": 15, "section": "5.1", "pages": "1–5", "print": "PDF pp. 1–5 (NCERT Class 11 Chemistry Part I, Chapter 5)", "sim": "systemtypes", "simTitle": "Interactive System & Boundary Simulator", "quick": "Thermodynamics studies macroscopic energy transformations. A thermodynamic system is separated from the surroundings by a real or imaginary boundary. Systems are classified by mass and energy exchange. State functions depend solely on the current state.", "formulas": [{"label": "State Function Invariance", "formula": "\\Delta X = X_{\\text{final}} - X_{\\text{initial}}"}, {"label": "Extensive to Intensive Ratio", "formula": "\\text{Property}_{\\text{molar}} = \\frac{X_{\\text{extensive}}}{n}"}], "deeper": "Why do state functions allow us to predict chemical feasibility without knowing reaction kinetics? Because state functions like $U, H, S, G$ are exact mathematical differentials whose line integrals over closed cyclic paths vanish strictly: $\\oint dX = 0$. Consequently, net changes depend solely on initial and final coordinates, freeing thermodynamic analysis from the intricate microscopic collision pathways and catalytic mechanisms.", "worked": [{"title": "Classifying Intensive vs Extensive Properties", "problem": "Categorize the following properties as either extensive or intensive: Volume, Temperature, Density, Internal Energy, Molar Heat Capacity, Surface Tension, Mass.", "solution": "<p><strong>Extensive properties</strong> depend directly on the quantity or mass of matter present in the system, whereas <strong>intensive properties</strong> are independent of sample size:</p><ul><li><strong>Extensive:</strong> Volume ($V$), Internal Energy ($U$), Mass ($m$) — dividing the system into two equal halves halves each of these values.</li><li><strong>Intensive:</strong> Temperature ($T$), Density ($\\rho = m/V$), Molar Heat Capacity ($C_m = C/n$), Surface Tension ($\\gamma$) — dividing the system leaves these local intensive ratios completely unchanged.</li></ul>"}], "prediction": {"scenario": "A sample of water at 25 °C is placed inside a sealed, completely rigid vessel with thermally insulated (adiabatic) walls. A paddle wheel stirs the water, doing 500 J of shaft work.", "question": "How will the temperature and internal energy of this isolated/closed system change?", "options": ["Temperature and internal energy both remain strictly constant because the walls are adiabatic.", "Work done on the water is converted into thermal molecular motion, increasing both internal energy and temperature.", "Temperature decreases because mechanical stirring dissipates energy into the rigid walls.", "Internal energy increases but temperature drops due to localized cavitation."], "answer": 1, "reveal": "Even though heat cannot cross adiabatic walls ($q = 0$), mechanical work is transferred across the boundary ($w = +500\\text{ J}$). By the First Law, $\\Delta U = q + w = +500\\text{ J}$. The viscous shear forces dissipate the macroscopic stirring into microscopic kinetic energy of water molecules, causing temperature to rise."}, "connect": "Engineers designing spacecraft thermal insulation must balance closed systems (radiators rejecting heat) with isolated cryo-tanks, where zero mass and minimum heat leak protect liquid hydrogen fuel.", "recall": ["An open system exchanges both matter and energy with surroundings.", "A closed system exchanges energy (heat/work) but NOT matter.", "An isolated system exchanges NEITHER matter NOR energy ($q = 0, w = 0$).", "State functions ($U, H, S, G, P, V, T$) depend only on initial and final states, not path.", "Path functions ($q, w$) depend directly on the specific path taken between states."], "quizzes": [{"prompt": "Which of the following is a path-dependent quantity rather than a state function?", "options": ["Work done ($w$)", "Enthalpy ($H$)", "Entropy ($S$)", "Internal energy ($U$)"], "answer": 0, "hint": "State functions have unique values at each equilibrium state; path functions represent energy transferred during a transition.", "explain": "Work ($w$) and heat ($q$) depend explicitly on the trajectory or mechanical path taken between initial and final states; hence they are path functions, whereas $H, S, U$ are state functions."}, {"prompt": "If an extensive property $X$ is divided by another extensive property $Y$, what is the nature of the resulting quotient $Z = X / Y$?", "options": ["Always an intensive property", "Always an extensive property", "A path function", "A dimensionless constant"], "answer": 0, "hint": "Consider density = mass / volume or molar volume = volume / moles.", "explain": "The ratio of two extensive properties is always an intensive property (e.g., density = mass/volume, concentration = moles/volume, molar mass = mass/moles)."}, {"prompt": "In an adiabatic container with rigid non-movable boundaries, what type of thermodynamic system is enclosed?", "options": ["Isolated system", "Closed system", "Open system", "Isothermal system"], "answer": 0, "hint": "No mass can leave (rigid/closed), no work can be done ($dV = 0$), and no heat can cross (adiabatic).", "explain": "Because the boundary is sealed (no mass transfer), rigid ($dV = 0 \\implies w = 0$), and adiabatic ($q = 0$), neither matter nor energy can be exchanged with the surroundings, defining an isolated system."}]}, {"id": "first-law-work", "nav": "02 · First Law & PV Work", "title": "First Law of Thermodynamics, PV-Work & Reversible Expansion", "deck": "Formulate the conservation of energy principle ΔU = q + w, define mechanical pressure-volume work, and contrast irreversible sudden expansion against maximum reversible work.", "minutes": 18, "section": "5.2, 5.3", "pages": "5–10", "print": "PDF pp. 5–10 (NCERT Class 11 Chemistry Part I, Chapter 5)", "sim": "pvworklab", "simTitle": "Piston Compression & PV Indicator Lab", "quick": "The First Law states energy cannot be created or destroyed: ΔU = q + w. Expansion work against external pressure is w = -P_ext ΔV. Reversible isothermal expansion delivers maximum work: w_rev = -2.303 nRT log(V2/V1).", "formulas": [{"label": "First Law of Thermodynamics", "formula": "\\Delta U = q + w"}, {"label": "Irreversible PV-Work", "formula": "w = -P_{\\text{ext}} \\Delta V = -P_{\\text{ext}}(V_2 - V_1)"}, {"label": "Isothermal Reversible Work", "formula": "w_{\\text{rev}} = -nRT \\ln\\left(\\frac{V_2}{V_1}\\right) = -2.303\\, nRT \\log_{10}\\left(\\frac{V_2}{V_1}\\right)"}, {"label": "Free Expansion in Vacuum", "formula": "P_{\\text{ext}} = 0 \\implies w = 0"}], "deeper": "Why does a reversible expansion yield more work than an irreversible expansion between the exact same initial and final states? In a reversible process, the driving internal pressure $P_{int}$ exceeds external opposition $P_{ext}$ by only an infinitesimal increment $dP$ at every stage ($P_{ext} = P_{int} - dP$), keeping the system in continuous thermodynamic equilibrium and capturing the entire area under the $PV$ isotherm. In a single-stage sudden irreversible expansion against constant final pressure, the pressure drops instantly, and the work produced is merely $P_{final}(V_2 - V_1)$, losing the excess potential energy to irreversible frictional dissipation.", "worked": [{"title": "Reversible vs Irreversible Work Calculation", "problem": "Two moles of an ideal gas at 300 K expand isothermally from 10 L to 20 L. Calculate (a) work done in an isothermal reversible expansion, and (b) work done against a constant external pressure of 1.0 bar.", "solution": "<p><strong>(a) Isothermal Reversible Expansion:</strong></p>$$w_{\\text{rev}} = -2.303\\, nRT \\log_{10}\\left(\\frac{V_2}{V_1}\\right)$$$$w_{\\text{rev}} = -2.303 \\times 2 \\times 8.314 \\times 300 \\times \\log_{10}\\left(\\frac{20}{10}\\right) = -11488 \\times 0.3010 = -3458\\text{ J} = -3.46\\text{ kJ}$$<p><strong>(b) Irreversible Expansion against constant $P_{\\text{ext}} = 1.0\\text{ bar} = 10^5\\text{ Pa}$:</strong></p>$$\\Delta V = 20\\text{ L} - 10\\text{ L} = 10\\text{ L} = 10 \\times 10^{-3}\\text{ m}^3 = 0.010\\text{ m}^3$$$$w_{\\text{irrev}} = -P_{\\text{ext}} \\Delta V = -(1.0 \\times 10^5\\text{ Pa}) \\times (0.010\\text{ m}^3) = -1000\\text{ J} = -1.00\\text{ kJ}$$<p><em>Conclusion:</em> The reversible process extracts $|-3.46\\text{ kJ}|$ of useful work compared to only $|-1.00\\text{ kJ}|$ in the single-stage irreversible drop.</p>"}], "prediction": {"scenario": "An ideal gas expands isothermally from 5 L to 15 L into an evacuated chamber (vacuum, P_ext = 0).", "question": "What are the values of work done (w), heat absorbed (q), and change in internal energy (ΔU)?", "options": ["w = 0, q = 0, and ΔU = 0", "w < 0, q > 0, and ΔU = 0", "w < 0, q = 0, and ΔU < 0", "w = 0, q > 0, and ΔU > 0"], "answer": 0, "reveal": "Because expansion occurs into a vacuum, external opposing pressure $P_{\\text{ext}} = 0$, so $w = -P_{\\text{ext}}\\Delta V = 0$ (free expansion). For an ideal gas undergoing an isothermal process ($T = \\text{constant}$), internal energy depends solely on temperature, so $\\Delta U = 0$. By the First Law: $q = \\Delta U - w = 0 - 0 = 0$. Hence $w = 0, q = 0, \\Delta U = 0$."}, "connect": "Internal combustion engine cylinders compress fuel-air mixtures along near-adiabatic paths: compressing rapidly allows little time for heat loss, spiking gas temperature to trigger auto-ignition in diesel cycles.", "recall": ["IUPAC sign convention: $q > 0$ when heat is absorbed by system; $q < 0$ when released.", "$w > 0$ when work is done ON the system (compression); $w < 0$ when work is done BY the system (expansion).", "Internal energy $U$ of an ideal gas depends strictly on temperature ($U = f(T)$).", "Free expansion into a vacuum produces zero work ($w = 0$).", "Maximum mechanical work is extracted under reversible conditions."], "quizzes": [{"prompt": "A system absorbs 701 J of heat from the surroundings and performs 394 J of expansion work. What is the net change in its internal energy?", "options": ["+307 J", "-307 J", "+1095 J", "-1095 J"], "answer": 0, "hint": "Apply the First Law: ΔU = q + w, noting that work done BY the system has a negative sign.", "explain": "Here, heat absorbed by system $q = +701\\text{ J}$; work done by system $w = -394\\text{ J}$. Therefore, $\\Delta U = q + w = 701 + (-394) = +307\\text{ J}$."}, {"prompt": "During the isothermal free expansion of an ideal gas into a vacuum, which set of thermodynamic variables is strictly zero?", "options": ["w = 0, q = 0, and ΔU = 0", "w = 0, q > 0, and ΔU = 0", "w < 0, q = 0, and ΔU < 0", "w = 0, q = 0, and ΔU > 0"], "answer": 0, "hint": "P_ext = 0 implies no work; isothermal ideal gas implies no internal energy change.", "explain": "Because $P_{ext} = 0$, work $w = 0$. Since temperature is constant and $U$ depends only on $T$ for ideal gases, $\\Delta U = 0$. Thus $q = \\Delta U - w = 0$."}, {"prompt": "How does the magnitude of work done during a reversible isothermal expansion compare to an irreversible expansion between identical volume limits?", "options": ["|w_rev| > |w_irrev|", "|w_rev| < |w_irrev|", "|w_rev| = |w_irrev|", "Depends on molecular weight of the gas"], "answer": 0, "hint": "Reversible paths operate at infinitesimally balanced driving pressure throughout the stroke.", "explain": "Reversible isothermal expansion maintains continuous equilibrium between internal and external pressure, enveloping the maximum possible area under the PV curve: $|w_{\\text{rev}}| > |w_{\\text{irrev}}|$."}]}, {"id": "enthalpy-calorimetry", "nav": "03 · Enthalpy & Calorimetry", "title": "Enthalpy, Heat Capacities (Cp − Cv = R) & Calorimetry", "deck": "Define enthalpy as heat transferred at constant pressure (H = U + PV), derive the relation ΔH = ΔU + Δng RT for chemical reactions, and explore bomb vs coffee-cup calorimetry.", "minutes": 18, "section": "5.4, 5.5", "pages": "10–16", "print": "PDF pp. 10–16 (NCERT Class 11 Chemistry Part I, Chapter 5)", "sim": "calorimeter", "simTitle": "Bomb vs Coffee-Cup Calorimeter Simulator", "quick": "Most chemical reactions occur in open vessels under constant atmospheric pressure. Enthalpy H = U + PV measures constant pressure heat flow: q_p = ΔH. For gas reactions, ΔH = ΔU + Δng RT. Heat capacity at constant P exceeds constant V by R: Cp - Cv = R.", "formulas": [{"label": "Enthalpy Definition", "formula": "H = U + PV \\implies \\Delta H = \\Delta U + P\\Delta V"}, {"label": "Gas Reaction Enthalpy Relation", "formula": "\\Delta H = \\Delta U + \\Delta n_g RT"}, {"label": "Molar Heat Capacity Relation", "formula": "C_p - C_v = R \\quad (\\text{for 1 mol of ideal gas})"}, {"label": "Calorimetric Heat Equation", "formula": "q = m \\cdot c \\cdot \\Delta T = n \\cdot C_m \\cdot \\Delta T"}], "deeper": "Why is $C_p$ strictly greater than $C_v$ for an ideal gas? At constant volume, heat added to a gas goes entirely into raising internal kinetic energy ($q_v = \\Delta U = n C_v \\Delta T$) because the rigid walls prevent expansion work ($w = 0$). At constant pressure, however, the gas expands against the atmosphere as its temperature rises. Therefore, the heat supplied at constant pressure must simultaneously raise internal energy AND provide the mechanical expansion work ($P\\Delta V = nR\\Delta T$) done on the atmosphere. Consequently, $C_p = C_v + R$.", "worked": [{"title": "Relating ΔH and ΔU in a Combustion Reaction", "problem": "The combustion of benzene, C₆H₆(l) + 15/2 O₂(g) → 6 CO₂(g) + 3 H₂O(l), carried out in a bomb calorimeter yields ΔU = −3263.9 kJ/mol at 298 K. Calculate the standard enthalpy of combustion (ΔH) at 298 K.", "solution": "<p><strong>1. Calculate change in gaseous moles ($\\Delta n_g$):</strong></p>$$\\Delta n_g = n_{\\text{gaseous products}} - n_{\\text{gaseous reactants}} = 6 - \\frac{15}{2} = 6 - 7.5 = -1.5\\text{ mol}$$<p>(Note: $C_6H_6(l)$ and $H_2O(l)$ are liquids and excluded from $\\Delta n_g$).</p><p><strong>2. Apply the enthalpy-internal energy formula:</strong></p>$$\\Delta H = \\Delta U + \\Delta n_g RT$$$$\\Delta n_g RT = (-1.5\\text{ mol}) \\times (8.314 \\times 10^{-3}\\text{ kJ}\\cdot\\text{mol}^{-1}\\cdot\\text{K}^{-1}) \\times (298\\text{ K}) = -3.72\\text{ kJ/mol}$$$$\\Delta H = -3263.9\\text{ kJ/mol} + (-3.72\\text{ kJ/mol}) = -3267.62\\text{ kJ/mol}$$<p><em>Interpretation:</em> Because the reaction consumes more moles of gas than it produces (contraction), the atmosphere does work on the system, making $\\Delta H$ slightly more exothermic than $\\Delta U$.</p>"}], "prediction": {"scenario": "Consider the combustion of methane gas: CH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(l) at 298 K. The heat released in a rigid constant-volume bomb calorimeter is measured as q_v.", "question": "How does the constant-pressure heat of combustion (q_p = ΔH) compare to the bomb calorimeter measurement (q_v = ΔU)?", "options": ["ΔH < ΔU (more negative / more heat released at constant pressure)", "ΔH > ΔU (less negative / less heat released at constant pressure)", "ΔH = ΔU (strictly equal for hydrocarbon combustion)", "ΔH is positive while ΔU is negative"], "answer": 0, "reveal": "Calculate gaseous mole change: $\\Delta n_g = 1\\text{ (CO}_2\\text{)} - [1\\text{ (CH}_4\\text{)} + 2\\text{ (O}_2\\text{)}] = 1 - 3 = -2\\text{ mol}$. Because $\\Delta H = \\Delta U + \\Delta n_g RT = \\Delta U - 2RT$, and $2RT > 0$, $\\Delta H$ is more negative than $\\Delta U$ (i.e. $\\Delta H < \\Delta U$)."}, "connect": "Bomb calorimeters are used in food science to measure nutritional calories: burning a dried food sample in pressurized pure oxygen yields its precise gross chemical combustion energy.", "recall": ["At constant volume, $w = 0 \\implies q_v = \\Delta U$ (measured in rigid bomb calorimeters).", "At constant pressure, $q_p = \\Delta H$ (measured in coffee-cup calorimeters).", "$\\Delta H = \\Delta U + \\Delta n_g RT$, where $\\Delta n_g$ counts ONLY gaseous species.", "For solids and liquids, $\\Delta V \\approx 0$, so $\\Delta H \\approx \\Delta U$.", "$C_p - C_v = R$ for an ideal gas due to work done during isobaric expansion."], "quizzes": [{"prompt": "Under what condition are the enthalpy change (ΔH) and internal energy change (ΔU) of a chemical reaction strictly equal?", "options": ["When the change in number of moles of gaseous species is zero (Δn_g = 0)", "When the reaction is carried out at absolute zero only", "When the reaction is highly exothermic", "When all reactants and products are ideal gases"], "answer": 0, "hint": "Recall the relation ΔH = ΔU + Δng RT.", "explain": "Since $\\Delta H = \\Delta U + \\Delta n_g RT$, when $\\Delta n_g = 0$ (no net change in moles of gas, e.g. $H_2(g) + Cl_2(g) \\rightarrow 2HCl(g)$), the product $\\Delta n_g RT$ vanishes, making $\\Delta H = \\Delta U$."}, {"prompt": "Why is the molar heat capacity at constant pressure (C_p) always greater than that at constant volume (C_v) for an ideal gas?", "options": ["Heat at constant pressure must raise temperature AND perform expansion work on surroundings", "Molecules move faster at constant pressure than at constant volume", "Intermolecular forces are stronger at constant pressure", "The gas decomposes upon heating at constant pressure"], "answer": 0, "hint": "Consider where energy goes: internal temperature rise vs mechanical pushing.", "explain": "At constant volume no work is done ($w=0$). At constant pressure, the gas expands against the atmosphere, requiring extra energy equal to $P\\Delta V = R\\Delta T$ per mole to do expansion work: $C_p = C_v + R$."}, {"prompt": "The reaction NH₂CN(s) + 3/2 O₂(g) → N₂(g) + CO₂(g) + H₂O(l) has ΔU = −742.7 kJ/mol at 298 K. What is the value of Δn_g for this reaction?", "options": ["+0.5 mol", "-0.5 mol", "+1.5 mol", "-1.0 mol"], "answer": 0, "hint": "Count gaseous moles only: products (N2 + CO2) minus reactants (O2).", "explain": "Products have $1\\text{ mol N}_2(g) + 1\\text{ mol CO}_2(g) = 2\\text{ mol gas}$. Reactants have $1.5\\text{ mol O}_2(g)$ (cyanamide is solid). Thus $\\Delta n_g = 2 - 1.5 = +0.5\\text{ mol}$."}]}, {"id": "thermochemistry-hess", "nav": "04 · Thermochemistry & Hess's Law", "title": "Thermochemical Equations, Hess's Law & Bond Enthalpies", "deck": "Master Hess's Law of constant heat summation as a direct consequence of enthalpy being a state function, and calculate reaction enthalpies from formation and bond enthalpies.", "minutes": 18, "section": "5.6, 5.7", "pages": "16–22", "print": "PDF pp. 16–22 (NCERT Class 11 Chemistry Part I, Chapter 5)", "sim": "hesscycle", "simTitle": "Interactive Thermochemical Cycle & Hess Builder", "quick": "Hess's Law states that the total enthalpy change for a chemical process is independent of the number of steps. Standard enthalpies of formation allow calculating Δ_r H° = Σ Δ_f H°(products) - Σ Δ_f H°(reactants). Bond enthalpies estimate gas-phase enthalpies.", "formulas": [{"label": "Hess's Law of Constant Heat Summation", "formula": "\\Delta_r H^\\circ = \\Delta H_1 + \\Delta H_2 + \\Delta H_3 + \\dots"}, {"label": "Reaction Enthalpy from Formation Enthalpies", "formula": "\\Delta_r H^\\circ = \\sum a_i \\Delta_f H^\\circ(\\text{products}) - \\sum b_j \\Delta_f H^\\circ(\\text{reactants})"}, {"label": "Reaction Enthalpy from Bond Enthalpies", "formula": "\\Delta_r H^\\circ = \\sum \\text{Bond Enthalpy}(\\text{broken}) - \\sum \\text{Bond Enthalpy}(\\text{formed})"}, {"label": "Standard State of Elements", "formula": "\\Delta_f H^\\circ(\\text{element in reference state}) = 0"}], "deeper": "Why can standard enthalpies of formation be defined as zero for elements in their most stable reference state, yet bond enthalpies are always positive? The zero point of enthalpy is an arbitrary convention because absolute enthalpy cannot be measured—only changes ($\\Delta H$) can. By defining $\\Delta_f H^\\circ = 0$ for graphite, $O_2(g)$, $N_2(g)$, and $H_2(g)$ at 298 K, every compound's formation enthalpy is referenced to a universal benchmark. In contrast, bond enthalpy measures the homolytic cleavage of a chemical bond in the gaseous state, which invariably requires energy input to overcome electrostatic attraction, making bond dissociation enthalpy strictly positive ($> 0$).", "worked": [{"title": "Calculating Standard Enthalpy of Formation via Hess's Law", "problem": "Calculate the standard enthalpy of formation of methanol, CH₃OH(l), given:\n(1) CH₃OH(l) + 3/2 O₂(g) → CO₂(g) + 2 H₂O(l); Δ_r H° = −726 kJ/mol\n(2) C(graphite) + O₂(g) → CO₂(g); Δ_c H° = −393 kJ/mol\n(3) H₂(g) + 1/2 O₂(g) → H₂O(l); Δ_f H° = −286 kJ/mol", "solution": "<p><strong>Target Formation Reaction:</strong></p>$$\\text{C(graphite)} + 2\\,\\text{H}_2(g) + \\frac{1}{2}\\,\\text{O}_2(g) \\longrightarrow \\text{CH}_3\\text{OH}(l) \\quad [\\Delta_f H^\\circ = ?]$$<p><strong>Linear Combination of Given Equations:</strong></p><ul><li>Keep Eq. (2) as is: $\\text{C} + \\text{O}_2 \\rightarrow \\text{CO}_2\\quad (\\Delta H = -393\\text{ kJ})$</li><li>Multiply Eq. (3) by 2: $2\\,\\text{H}_2 + \\text{O}_2 \\rightarrow 2\\,\\text{H}_2\\text{O}\\quad (\\Delta H = 2 \\times (-286) = -572\\text{ kJ})$</li><li>Reverse Eq. (1): $\\text{CO}_2 + 2\\,\\text{H}_2\\text{O} \\rightarrow \\text{CH}_3\\text{OH} + \\frac{3}{2}\\,\\text{O}_2\\quad (\\Delta H = +726\\text{ kJ})$</li></ul><p><strong>Summing the Equations:</strong></p>$$\\Delta_f H^\\circ(\\text{CH}_3\\text{OH}) = (-393) + (-572) + (+726) = -965 + 726 = \\mathbf{-239\\text{ kJ/mol}}$$"}], "prediction": {"scenario": "Consider the formation of gaseous carbon tetrachloride: C(graphite) + 2 Cl₂(g) → CCl₄(g). To convert C(graphite) into separated gas atoms, one needs sublimation energy (715 kJ/mol); to dissociate Cl₂ requires 242 kJ/mol.", "question": "If four C–Cl bonds are formed each releasing ~326 kJ/mol, what dictates whether the net reaction is exothermic or endothermic?", "options": ["The energy released during four C–Cl bond formations exceeds the sum of graphite atomization and Cl₂ dissociation energies", "The reaction must always be endothermic because graphite atomization requires massive heat (715 kJ/mol)", "Hess's law prevents predicting the sign without experimental bomb calorimetry", "Enthalpy of formation is zero because chlorine is in its standard elemental state"], "answer": 0, "reveal": "Energy required to atomize reactants = $715\\text{ (C)} + 2 \\times 242\\text{ (Cl}_2\\text{)} = 715 + 484 = 1199\\text{ kJ}$. Energy released upon forming 4 $C-Cl$ bonds = $4 \\times 326 = 1304\\text{ kJ}$. Because bond formation releases MORE energy ($1304\\text{ kJ}$) than atomization consumes ($1199\\text{ kJ}$), the net formation reaction is exothermic: $\\Delta_f H^\\circ \\approx 1199 - 1304 = -105\\text{ kJ/mol}$."}, "connect": "Chemical rocket propellants (like liquid hydrogen and liquid oxygen) are engineered using Hess cycles to maximize combustion enthalpy release per unit launch mass, delivering maximum specific impulse.", "recall": ["Hess's Law: Enthalpy change is identical whether a reaction occurs in one step or ten steps.", "Reversing a thermochemical equation changes the sign of $\\Delta H$.", "Multiplying stoichiometric coefficients by $n$ multiplies $\\Delta H$ by $n$.", "$\\Delta_f H^\\circ$ of all elements in their standard states (graphite, $O_2$, $N_2$, $H_2$, $Br_2(l)$) is zero.", "$\\Delta_r H^\\circ = \\sum \\text{Bond Energy}(\\text{broken}) - \\sum \\text{Bond Energy}(\\text{formed})$ applies strictly to gas-phase species."], "quizzes": [{"prompt": "Given that N₂(g) + 3 H₂(g) → 2 NH₃(g) has Δ_r H° = −92.4 kJ/mol, what is the standard enthalpy of formation of gaseous ammonia, Δ_f H°(NH₃)?", "options": ["−46.2 kJ/mol", "−92.4 kJ/mol", "+46.2 kJ/mol", "−184.8 kJ/mol"], "answer": 0, "hint": "Standard enthalpy of formation is defined for the synthesis of ONE mole of compound from constituent elements.", "explain": "The thermochemical equation produces 2 moles of $NH_3(g)$. By definition, $\\Delta_f H^\\circ$ is per mole of substance formed: $\\Delta_f H^\\circ = \\frac{-92.4\\text{ kJ}}{2\\text{ mol}} = -46.2\\text{ kJ/mol}$."}, {"prompt": "Why is the standard enthalpy of formation (Δ_f H°) of diamond NOT zero, even though it consists of pure elemental carbon?", "options": ["Graphite is the thermodynamically most stable allotrope of carbon at 298 K and 1 bar, chosen as reference", "Diamond contains trace nitrogen impurities that release heat", "Diamond is a gas at high temperatures", "Diamond has no covalent bonds"], "answer": 0, "hint": "Standard state reference is assigned to the most stable allotrope at 298 K and 1 bar.", "explain": "The convention assigns $\\Delta_f H^\\circ = 0$ to the most stable allotrope under standard conditions ($298\\text{ K}, 1\\text{ bar}$). For carbon, graphite is more stable than diamond by $1.89\\text{ kJ/mol}$; hence $\\Delta_f H^\\circ(\\text{diamond}) = +1.89\\text{ kJ/mol}$."}, {"prompt": "Which equation correctly calculates the reaction enthalpy from bond enthalpies for a gas-phase reaction?", "options": ["Δ_r H° = Σ Bond Enthalpies(broken) − Σ Bond Enthalpies(formed)", "Δ_r H° = Σ Bond Enthalpies(formed) − Σ Bond Enthalpies(broken)", "Δ_r H° = Σ Δ_f H°(reactants) − Σ Δ_f H°(products)", "Δ_r H° = Σ Bond Enthalpies(broken) + Σ Bond Enthalpies(formed)"], "answer": 0, "hint": "Breaking bonds requires energy (+), while forming bonds releases energy (-).", "explain": "Bond breaking is an endothermic process ($+\\Delta H$) while bond formation is exothermic ($-\\Delta H$). Thus, $\\Delta_r H^\\circ = \\sum BE(\\text{reactants broken}) - \\sum BE(\\text{products formed})$."}]}, {"id": "entropy-second-law", "nav": "05 · Entropy & the Second Law", "title": "Spontaneity, Entropy & the Second Law of Thermodynamics", "deck": "Investigate why enthalpy minimization alone cannot explain endothermic spontaneous processes, define entropy as a microscopic measure of dispersion, and formulate the Second Law: ΔS_total ≥ 0.", "minutes": 18, "section": "5.8", "pages": "22–27", "print": "PDF pp. 22–27 (NCERT Class 11 Chemistry Part I, Chapter 5)", "sim": "entropylab", "simTitle": "Molecular Disorder & Free Expansion Microstate Lab", "quick": "A spontaneous process proceeds without external assistance. Enthalpy decrease is not the sole driving force (ice melts spontaneously at 25 °C). Entropy S measures molecular randomness and energy dispersal: ΔS = q_rev / T. The universe's entropy continuously increases.", "formulas": [{"label": "Thermodynamic Entropy Definition", "formula": "\\Delta S = \\frac{q_{\\text{rev}}}{T}"}, {"label": "Second Law of Thermodynamics", "formula": "\\Delta S_{\\text{total}} = \\Delta S_{\\text{system}} + \\Delta S_{\\text{surroundings}} \\ge 0"}, {"label": "Surroundings Entropy Change", "formula": "\\Delta S_{\\text{surroundings}} = -\\frac{\\Delta H_{\\text{system}}}{T}"}, {"label": "Phase Transition Entropy", "formula": "\\Delta_{\\text{trans}} S = \\frac{\\Delta_{\\text{trans}} H}{T_{\\text{trans}}}"}], "deeper": "How does Boltzmann's microscopic statistical definition $S = k_B \\ln W$ unite with Clausius's macroscopic heat ratio $\\Delta S = q_{rev}/T$? In statistical mechanics, $W$ represents the number of microscopic quantum microstates corresponding to a given macroscopic state. When heat $q_{rev}$ is transferred into a substance at absolute temperature $T$, thermal energy populates higher quantized energy levels, multiplying the accessible permutations of molecular positions and momenta. At lower temperatures, introducing thermal packets produces a dramatically larger fractional increase in accessible microstates than at high temperatures, explaining why the entropy surge is inversely proportional to $T$ ($dS = dq/T$).", "worked": [{"title": "Entropy Change of the Surroundings during Water Formation", "problem": "Calculate the entropy change in the surroundings when 1.00 mol of H₂O(l) is formed under standard conditions at 298 K, given Δ_f H° = −286 kJ/mol.", "solution": "<p><strong>1. Heat transferred to surroundings:</strong></p><p>Because the formation reaction is exothermic, heat released by the system is absorbed reversibly by the vast thermal reservoir of the surroundings at constant temperature $T = 298\\text{ K}$:</p>$$q_{\\text{surroundings}} = -\\Delta H_{\\text{system}} = -(-286\\text{ kJ}) = +286\\text{ kJ} = +286000\\text{ J}$$<p><strong>2. Calculate $\\Delta S_{\\text{surroundings}}$:</strong></p>$$\\Delta S_{\\text{surroundings}} = \\frac{q_{\\text{surroundings}}}{T} = \\frac{+286000\\text{ J}}{298\\text{ K}} = \\mathbf{+959.7\\text{ J}\\cdot\\text{K}^{-1}\\cdot\\text{mol}^{-1}}$$<p><em>Insight:</em> The large positive entropy generated in the surrounding environment overwhelmingly overcomes the modest entropy reduction of condensing gas into liquid water ($\\Delta S_{\\text{system}} = -163\\text{ J/K}$), driving net $\\Delta S_{\\text{total}} > 0$.</p>"}], "prediction": {"scenario": "Two chlorine free radicals combine in the gas phase to form a stable chlorine molecule: 2 Cl(g) → Cl₂(g).", "question": "What are the algebraic signs of ΔH and ΔS for this association reaction?", "options": ["ΔH < 0 (negative) and ΔS < 0 (negative)", "ΔH > 0 (positive) and ΔS > 0 (positive)", "ΔH < 0 (negative) and ΔS > 0 (positive)", "ΔH > 0 (positive) and ΔS < 0 (negative)"], "answer": 0, "reveal": "Forming a covalent $Cl-Cl$ bond releases potential energy, so heat is released $\\implies \\Delta H < 0$ (exothermic). Combining two independent gaseous atoms into a single diatomic molecule reduces translational degrees of freedom and spatial disorder $\\implies \\Delta S < 0$ (entropy decreases)."}, "connect": "Atmospheric weather systems and hurricanes are planetary heat engines driven by the second law: warm equatorial waters release latent heat of condensation, producing intense localized entropy dispersal toward cold upper atmospheric sinks.", "recall": ["Entropy ($S$) is a thermodynamic state function measuring molecular disorder and dispersal.", "Units of entropy: $\\text{J}\\cdot\\text{K}^{-1}\\cdot\\text{mol}^{-1}$.", "For a spontaneous process in an isolated system, $\\Delta S > 0$.", "Entropy increases during: melting, vaporization, gas expansion, and reactions where $\\Delta n_g > 0$.", "At equilibrium, the entropy of an isolated system reaches a maximum ($\\,\\Delta S = 0$)."], "quizzes": [{"prompt": "For an isolated thermodynamic system (ΔU = 0), what is the criterion for a spontaneous irreversible change according to the Second Law?", "options": ["ΔS > 0", "ΔS < 0", "ΔS = 0", "ΔS = ΔU / T"], "answer": 0, "hint": "In an isolated system, no heat or work enters from surroundings.", "explain": "For an isolated system, no energy exchange with surroundings is possible. The Second Law dictates that any natural spontaneous process within an isolated system must increase total entropy until equilibrium is reached, where $\\Delta S = 0$. Thus $\\Delta S > 0$ for spontaneous change."}, {"prompt": "Which of the following processes is accompanied by an INCREASE in entropy (ΔS > 0)?", "options": ["Sublimation of solid iodine into violet vapor: I₂(s) → I₂(g)", "Freezing of liquid water into solid ice: H₂O(l) → H₂O(s)", "Condensation of steam into water: H₂O(g) → H₂O(l)", "Haber synthesis of ammonia: N₂(g) + 3 H₂(g) → 2 NH₃(g)"], "answer": 0, "hint": "Look for transitions that increase molecular freedom, volume, or gaseous particles.", "explain": "Sublimation converts a rigid crystalline solid with fixed lattice sites into widely dispersed, freely moving gas molecules, causing a dramatic increase in spatial and velocity disorder ($\\Delta S \\gg 0$)."}, {"prompt": "If a chemical reaction is endothermic (ΔH > 0) yet proceeds spontaneously at room temperature, what MUST be true about its entropy change?", "options": ["ΔS must be positive and T·ΔS must exceed ΔH", "ΔS must be negative", "ΔS must equal zero", "Surroundings entropy must be negative and larger in magnitude than system entropy"], "answer": 0, "hint": "Recall that ΔG = ΔH − T·ΔS must be negative for spontaneity.", "explain": "If $\\Delta H > 0$, the only way $\\Delta G = \\Delta H - T\\Delta S$ can be negative ($< 0$) is if $\\Delta S > 0$ and the temperature is high enough that $T\\Delta S > \\Delta H$."}]}, {"id": "gibbs-spontaneity", "nav": "06 · Gibbs Free Energy", "title": "Gibbs Free Energy & Temperature-Dependent Spontaneity", "deck": "Unite the First and Second Laws into the Gibbs Helmholtz relation ΔG = ΔH − TΔS, establishing the master criterion for chemical spontaneity at constant temperature and pressure.", "minutes": 18, "section": "5.9", "pages": "27–31", "print": "PDF pp. 27–31 (NCERT Class 11 Chemistry Part I, Chapter 5)", "sim": "gibbslab", "simTitle": "Gibbs Free Energy & Temperature Spontaneity Phase Explorer", "quick": "J. Willard Gibbs combined enthalpy and entropy into Gibbs Energy: G = H - TS. At constant T and P, spontaneity requires ΔG < 0. The four cases of ΔH and ΔS dictate whether a reaction is spontaneous at all temperatures, high temperatures, low temperatures, or never.", "formulas": [{"label": "Gibbs Energy Definition", "formula": "G = H - TS"}, {"label": "Gibbs Helmholtz Equation", "formula": "\\Delta G = \\Delta H - T \\Delta S \\quad (\\text{at constant } T, P)"}, {"label": "Spontaneity Master Criteria", "formula": "\\Delta G < 0 \\;(\\text{Spontaneous}), \\quad \\Delta G = 0 \\;(\\text{Equilibrium}), \\quad \\Delta G > 0 \\;(\\text{Non-spontaneous})"}, {"label": "Threshold Temperature", "formula": "T_{\\text{switch}} = \\frac{\\Delta H}{\\Delta S} \\quad (\\text{when } \\Delta G = 0)"}], "deeper": "Why is Gibbs free energy called 'free' energy? In any isobaric-isothermal process, the total energy released as enthalpy is $\\Delta H$. However, the Second Law demands that an amount equal to $T\\Delta S$ must be dispersed into thermal disorder to prevent the universe's entropy from decreasing. Therefore, only the remaining portion, $-\\Delta G = -(\\Delta H - T\\Delta S)$, is 'free' and thermodynamically available to perform non-expansion mechanical, chemical, or electrical work (such as generating current in a galvanic Daniell cell: $w_{\\text{non-PV, max}} = -\\Delta G = nFE_{\\text{cell}}$).", "worked": [{"title": "Finding the Threshold Temperature for Spontaneity", "problem": "For the endothermic reaction 2 A + B → C, ΔH = +400 kJ/mol and ΔS = +0.2 kJ·K⁻¹·mol⁻¹ (+200 J·K⁻¹·mol⁻¹). At what temperature will this reaction become spontaneous?", "solution": "<p><strong>1. Condition for spontaneity:</strong></p>$$\\Delta G = \\Delta H - T\\Delta S < 0 \\implies T\\Delta S > \\Delta H \\implies T > \\frac{\\Delta H}{\\Delta S}$$<p><strong>2. Calculate the crossover temperature ($T_{\\text{switch}}$):</strong></p>$$T_{\\text{switch}} = \\frac{400\\text{ kJ}\\cdot\\text{mol}^{-1}}{0.2\\text{ kJ}\\cdot\\text{K}^{-1}\\cdot\\text{mol}^{-1}} = \\mathbf{2000\\text{ K}}$$<p><strong>Conclusion:</strong></p><ul><li>At $T < 2000\\text{ K}$, $\\Delta G > 0$ (non-spontaneous, enthalpy-opposed).</li><li>At $T = 2000\\text{ K}$, $\\Delta G = 0$ (dynamic equilibrium).</li><li>At $T > 2000\\text{ K}$, $\\Delta G < 0$ (the favorable entropy term $-T\\Delta S$ overpowers $+\\Delta H$, driving the reaction spontaneously).</li></ul>"}], "prediction": {"scenario": "A reaction has ΔH = −10.5 kJ and ΔS = −44.1 J/K at 298 K.", "question": "Will this reaction occur spontaneously at 298 K, and how will heating affect its spontaneity?", "options": ["It is non-spontaneous at 298 K (ΔG = +0.16 kJ), and heating makes it even less spontaneous", "It is spontaneous at 298 K, and heating increases spontaneity", "It is spontaneous at all temperatures because ΔH is exothermic", "It is at dynamic equilibrium at 298 K"], "answer": 0, "reveal": "Calculate $\\Delta G = \\Delta H - T\\Delta S = -10.5\\text{ kJ} - [298 \\times (-0.0441\\text{ kJ/K})] = -10.5 + 13.14 = +0.16\\text{ kJ} > 0$. Because $\\Delta G > 0$, the reaction is non-spontaneous at 298 K. Because $\\Delta S < 0$, the unfavorable term $+T|\\Delta S|$ grows larger upon heating, driving $\\Delta G$ even more positive."}, "connect": "Biological ATP hydrolysis ($\\Delta G^\\circ = -30.5\text{ kJ/mol}$) acts as the universal free energy currency of living cells, coupling its exergonic energy release to power non-spontaneous endergonic reactions like protein synthesis and muscle contraction.", "recall": ["$\\Delta G = \\Delta H - T\\Delta S$ at constant $T$ and $P$.", "If $\\Delta H < 0$ and $\\Delta S > 0$: $\\Delta G < 0$ at ALL temperatures (always spontaneous).", "If $\\Delta H > 0$ and $\\Delta S < 0$: $\\Delta G > 0$ at ALL temperatures (never spontaneous).", "If $\\Delta H > 0$ and $\\Delta S > 0$: spontaneous ONLY at HIGH temperatures ($T > \\Delta H / \\Delta S$).", "If $\\Delta H < 0$ and $\\Delta S < 0$: spontaneous ONLY at LOW temperatures ($T < \\Delta H / \\Delta S$)."], "quizzes": [{"prompt": "Under what thermodynamic conditions is a chemical reaction guaranteed to be spontaneous at all temperatures?", "options": ["ΔH < 0 (exothermic) and ΔS > 0 (entropy increases)", "ΔH > 0 and ΔS > 0", "ΔH < 0 and ΔS < 0", "ΔH > 0 and ΔS < 0"], "answer": 0, "hint": "Check the signs in ΔG = ΔH − T·ΔS: both terms must be negative.", "explain": "When $\\Delta H$ is negative and $\\Delta S$ is positive, both $\\Delta H$ and the $-T\\Delta S$ term are negative regardless of temperature $T$. Consequently, $\\Delta G$ is unconditionally negative at all temperatures."}, {"prompt": "At the normal boiling point of a liquid at 1 atm, what is the value of the Gibbs free energy of vaporization (Δ_vap G)?", "options": ["Δ_vap G = 0", "Δ_vap G < 0", "Δ_vap G > 0", "Δ_vap G = Δ_vap H"], "answer": 0, "hint": "At a phase transition temperature, the two phases coexist in dynamic equilibrium.", "explain": "At the normal boiling point, liquid and vapor phases coexist in dynamic thermodynamic equilibrium at 1 atm. At equilibrium, $\\Delta G = 0$, which yields Trouton's rule relation: $T_b = \\Delta_{vap} H / \\Delta_{vap} S$."}, {"prompt": "What is the maximum non-expansion (useful electrical or chemical) work obtainable from a system at constant temperature and pressure?", "options": ["Equal to −ΔG", "Equal to −ΔH", "Equal to −T·ΔS", "Equal to −ΔU"], "answer": 0, "hint": "Recall the thermodynamic definition of Gibbs free energy.", "explain": "The maximum net non-expansion work (electrical, shaft, biochemical) that can be extracted from a closed system at constant $T$ and $P$ is precisely equal to the decrease in Gibbs free energy: $w_{\\text{non-PV, max}} = -\\Delta G$."}]}, {"id": "free-energy-equilibrium", "nav": "07 · Equilibrium & Third Law", "title": "Free Energy, Equilibrium Constant (ΔG° = −RT ln K) & Third Law", "deck": "Connect thermodynamics to chemical equilibrium through ΔG° = −RT ln K, explore absolute entropy via the Third Law, and understand thermodynamic vs kinetic stability.", "minutes": 18, "section": "5.10, 5.11", "pages": "31–36", "print": "PDF pp. 31–36 (NCERT Class 11 Chemistry Part I, Chapter 5)", "sim": "thirdlawsim", "simTitle": "Equilibrium K vs ΔG° & Absolute Zero Crystal Lab", "quick": "Chemical equilibrium occurs when G reaches a minimum: Δ_r G = 0. The standard free energy dictates the equilibrium constant: Δ_r G° = -RT ln K = -2.303 RT log K. The Third Law states that the entropy of a perfectly crystalline solid is zero at 0 K.", "formulas": [{"label": "Reaction Quotient Gibbs Energy", "formula": "\\Delta_r G = \\Delta_r G^\\circ + RT \\ln Q"}, {"label": "Standard Free Energy & Equilibrium Constant", "formula": "\\Delta_r G^\\circ = -RT \\ln K = -2.303\\, RT \\log_{10} K"}, {"label": "Third Law of Thermodynamics", "formula": "\\lim_{T \\to 0\\text{ K}} S = 0 \\quad (\\text{for a perfect crystal})"}, {"label": "Standard Absolute Entropy", "formula": "S^\\circ(T) = \\int_0^T \\frac{C_p}{T}\\, dT"}], "deeper": "Why does the Third Law permit the determination of absolute molar entropies ($S^\\circ$) whereas absolute enthalpies ($H$) remain inaccessible? Because absolute enthalpy includes rest-mass binding energies and nuclear forces whose ultimate baseline is unquantified. In contrast, Boltzmann's formula $S = k_B \\ln W$ establishes an absolute physical baseline: at $0\\text{ K}$, thermal motion ceases and every atom in a perfect crystal occupies a unique, ground-state configuration ($W = 1$). Since $\\ln(1) = 0$, entropy at absolute zero is zero. Integrating experimental heat capacity data $\\int_0^T (C_p/T) dT$ from $0\\text{ K}$ yields the absolute entropy $S^\\circ(T)$.", "worked": [{"title": "Calculating Standard Free Energy from the Equilibrium Constant", "problem": "The equilibrium constant for a chemical reaction is K = 10 at T = 300 K. Calculate the standard Gibbs free energy change (Δ_r G°) in kJ/mol. (R = 8.314 J·K⁻¹·mol⁻¹).", "solution": "<p><strong>1. Apply the equilibrium-free energy relation:</strong></p>$$\\Delta_r G^\\circ = -2.303\\, RT \\log_{10} K$$<p><strong>2. Substitute known values:</strong></p>$$\\Delta_r G^\\circ = -2.303 \\times (8.314\\text{ J}\\cdot\\text{K}^{-1}\\cdot\\text{mol}^{-1}) \\times (300\\text{ K}) \\times \\log_{10}(10)$$$$\\Delta_r G^\\circ = -2.303 \\times 2494.2 \\times 1 = -5744.14\\text{ J/mol} = \\mathbf{-5.74\\text{ kJ/mol}}$$<p><em>Interpretation:</em> Because $K > 1$, $\\Delta_r G^\\circ$ is negative, meaning that at standard state ($1\\text{ bar}$ all species), the forward reaction has a thermodynamic driving force to form products until equilibrium is reached.</p>"}], "prediction": {"scenario": "For the formation of nitric oxide: 1/2 N₂(g) + 1/2 O₂(g) → NO(g), Δ_r H° = +90 kJ/mol (endothermic).", "question": "What does this positive enthalpy of formation imply about the thermodynamic stability of NO gas at room temperature?", "options": ["NO(g) is thermodynamically unstable with respect to decomposition into N₂ and O₂", "NO(g) is thermodynamically inert and cannot react with oxygen", "NO(g) will spontaneously form from air at room temperature without energy input", "NO(g) has zero entropy at room temperature"], "answer": 0, "reveal": "Because $\\Delta_f H^\\circ = +90\\text{ kJ/mol} > 0$ and $\\Delta_f G^\\circ = +86.6\\text{ kJ/mol} > 0$, nitric oxide is thermodynamically unstable relative to its constituent elements $N_2$ and $O_2$. The reverse reaction (decomposition $NO \\rightarrow 1/2 N_2 + 1/2 O_2$) is exergonic ($\\Delta G < 0$). It persists in atmosphere only because the activation energy barrier for decomposition is high (kinetic stability)."}, "connect": "Industrial chemical syntheses (like the Haber-Bosch ammonia process) operate in the delicate interplay between thermodynamic yield ($\\Delta G^\\circ = -RT \\ln K$) and kinetic reaction rate (Arrhenius law $k = A e^{-E_a/RT}$), requiring high pressures and catalysts to achieve rapid throughput.", "recall": ["$\\Delta_r G = \\Delta_r G^\\circ + RT \\ln Q$. At equilibrium, $\\Delta_r G = 0$ and $Q = K$.", "$\\Delta_r G^\\circ = -RT \\ln K = -2.303 RT \\log_{10} K$.", "If $K > 1 \\implies \\Delta_r G^\\circ < 0$ (products favored at equilibrium).", "If $K < 1 \\implies \\Delta_r G^\\circ > 0$ (reactants favored at equilibrium).", "Third Law: A perfectly crystalline solid at $0\\text{ K}$ has zero entropy ($S = 0$)."], "quizzes": [{"prompt": "If a chemical reaction has a standard Gibbs free energy change Δ_r G° = 0, what is its equilibrium constant (K)?", "options": ["K = 1", "K = 0", "K = 10", "K = ∞"], "answer": 0, "hint": "Substitute ΔG° = 0 into ΔG° = −RT ln K.", "explain": "From $\\Delta_r G^\\circ = -RT \\ln K$, when $\\Delta_r G^\\circ = 0$, $\\ln K = 0$, which means $K = e^0 = 1$."}, {"prompt": "According to the Third Law of Thermodynamics, what happens to the entropy of a pure, perfectly ordered crystal as temperature approaches 0 K?", "options": ["Entropy approaches strictly zero", "Entropy approaches negative infinity", "Entropy approaches positive infinity", "Entropy approaches the gas constant R"], "answer": 0, "hint": "At absolute zero, all thermal vibrations cease, yielding a single quantum microstate (W = 1).", "explain": "At absolute zero ($0\\text{ K}$), all thermal vibrations freeze and atoms settle into a single ground-state crystalline arrangement ($W = 1$). By Boltzmann's equation $S = k_B \\ln(1) = 0$, the entropy is zero."}, {"prompt": "If the equilibrium constant K for a reaction is 100 at 300 K, what is the sign and character of Δ_r G°?", "options": ["Negative (forward reaction favored at standard states)", "Positive (reactants favored at standard states)", "Zero (system in frozen equilibrium)", "Unpredictable without knowing activation energy"], "answer": 0, "hint": "Consider the sign of ln(100) where K > 1.", "explain": "Because $K = 100 > 1$, $\\ln K = \\ln(100) > 0$. Therefore, $\\Delta_r G^\\circ = -RT \\ln K$ is negative, indicating that products are favored under standard conditions."}]}], "exercises": [{"num": "5.1", "title": "Definition of a thermodynamic state function", "question": "Choose the correct answer. A thermodynamic state function is a quantity\n(i) used to determine heat changes\n(ii) whose value is independent of path\n(iii) used to determine pressure volume work\n(iv) whose value depends on temperature only.", "approach": "Recall the fundamental distinction between state functions (path-independent) and path functions (heat, work).", "solution": "<p><strong>Correct Answer: (ii) whose value is independent of path.</strong></p><p><strong>Explanation:</strong></p><p>A <strong>state function</strong> (or state variable) is a thermodynamic property of a system whose value depends exclusively on the current state of the system (defined by macroscopic parameters such as temperature $T$, pressure $P$, volume $V$, and amount $n$), and is <strong>completely independent of the path or history</strong> by which that state was reached.</p><p>When a system undergoes a transition from State 1 to State 2, the change in a state function $X$ is simply:$$\\Delta X = X_2 - X_1$$Examples of state functions include internal energy ($U$), enthalpy ($H$), entropy ($S$), Gibbs free energy ($G$), pressure ($P$), volume ($V$), and temperature ($T$). In contrast, heat ($q$) and work ($w$) depend on the specific path taken and are <em>path functions</em>.</p>", "verified": "(ii) whose value is independent of path"}, {"num": "5.2", "title": "Thermodynamic condition for an adiabatic process", "question": "For the process to occur under adiabatic conditions, the correct condition is:\n(i) ΔT = 0\n(ii) Δp = 0\n(iii) q = 0\n(iv) w = 0", "approach": "Define adiabatic boundary and condition for zero heat exchange across system boundaries.", "solution": "<p><strong>Correct Answer: (iii) q = 0.</strong></p><p><strong>Explanation:</strong></p><p>An <strong>adiabatic process</strong> is defined as a thermodynamic process in which <strong>no heat enters or leaves the system</strong> across its boundary during the entire course of the change:$$q = 0$$Key comparisons:</p><ul><li>$\\Delta T = 0$ corresponds to an <em>isothermal</em> process. (In an adiabatic process, temperature generally changes: adiabatic expansion causes cooling, while adiabatic compression causes heating).</li><li>$\\Delta p = 0$ corresponds to an <em>isobaric</em> process.</li><li>$w = 0$ corresponds to an <em>isochoric</em> process with zero non-expansion work, or free expansion in vacuum.</li></ul>", "verified": "(iii) q = 0"}, {"num": "5.3", "title": "Standard enthalpies of elements in reference states", "question": "The enthalpies of all elements in their standard states are:\n(i) unity\n(ii) zero\n(iii) < 0\n(iv) different for each element", "approach": "Recall IUPAC convention for standard enthalpy of formation of pure elements in their most stable allotropic reference state.", "solution": "<p><strong>Correct Answer: (ii) zero.</strong></p><p><strong>Explanation:</strong></p><p>By international IUPAC thermodynamic convention, the <strong>standard enthalpy of formation ($\\Delta_f H^\\circ$) of every pure chemical element in its most stable physical and allotropic state of aggregation at 298.15 K and 1 bar pressure is assigned an arbitrary reference value of ZERO</strong>.</p><p>Examples:</p><ul><li>$\\Delta_f H^\\circ[\\text{C(graphite)}] = 0\\text{ kJ/mol}$ (whereas diamond is $+1.89\\text{ kJ/mol}$).</li><li>$\\Delta_f H^\\circ[\\text{O}_2(g)] = 0\\text{ kJ/mol}$ (whereas ozone $O_3(g)$ is $+142.7\\text{ kJ/mol}$).</li><li>$\\Delta_f H^\\circ[\\text{H}_2(g)] = 0\\text{ kJ/mol}$, $\\Delta_f H^\\circ[\\text{Cl}_2(g)] = 0\\text{ kJ/mol}$, $\\Delta_f H^\\circ[\\text{Br}_2(l)] = 0\\text{ kJ/mol}$, $\\Delta_f H^\\circ[\\text{I}_2(s)] = 0\\text{ kJ/mol}$.</li></ul>", "verified": "(ii) zero"}, {"num": "5.4", "title": "Relation between ΔH° and ΔU° for methane combustion", "question": "ΔU° of combustion of methane is – X kJ mol–1. The value of ΔH° is:\n(i) = ΔU°\n(ii) > ΔU°\n(iii) < ΔU°\n(iv) = 0", "approach": "Write balanced combustion equation, calculate Δn_g, and evaluate ΔH° = ΔU° + Δn_g RT.", "solution": "<p><strong>Correct Answer: (iii) &lt; ΔU°.</strong></p><p><strong>Step-by-Step Derivation:</strong></p><ol><li>Write the balanced thermochemical equation for the combustion of methane at 298 K:$$\\text{CH}_4(g) + 2\\,\\text{O}_2(g) \\longrightarrow \\text{CO}_2(g) + 2\\,\\text{H}_2\\text{O}(l)$$</li><li>Calculate the change in number of moles of gaseous species ($\\Delta n_g$):$$\\Delta n_g = n_g(\\text{products}) - n_g(\\text{reactants}) = 1\\text{ (from CO}_2) - [1\\text{ (from CH}_4) + 2\\text{ (from O}_2)] = 1 - 3 = -2$$<em>(Note: Water is in the liquid state at 298 K, so it does not contribute to gaseous moles).</em></li><li>Apply the fundamental thermodynamic relation:$$\\Delta H^\\circ = \\Delta U^\\circ + \\Delta n_g RT$$$$\\Delta H^\\circ = -X + (-2RT) = -X - 2RT$$</li><li>Because absolute temperature $T > 0$ and gas constant $R > 0$, the term $2RT$ is positive. Subtracting a positive quantity makes $\\Delta H^\\circ$ more negative than $-X$:$$\\Delta H^\\circ < -X \\implies \\Delta H^\\circ < \\Delta U^\\circ$$</li></ol>", "verified": "(iii) < ΔU°"}, {"num": "5.5", "title": "Enthalpy of formation of methane from combustion data", "question": "The enthalpy of combustion of methane, graphite and dihydrogen at 298 K are, –890.3 kJ mol–1, –393.5 kJ mol–1, and –285.8 kJ mol–1 respectively. Enthalpy of formation of CH₄(g) will be:\n(i) –74.8 kJ mol–1\n(ii) –52.27 kJ mol–1\n(iii) +74.8 kJ mol–1\n(iv) +52.26 kJ mol–1", "approach": "Apply Hess's Law: Δ_f H°(CH4) = Δ_c H°(C) + 2·Δ_c H°(H2) − Δ_c H°(CH4).", "solution": "<p><strong>Correct Answer: (i) –74.8 kJ mol–1.</strong></p><p><strong>Step-by-Step Calculation:</strong></p><ol><li><strong>Target Formation Reaction:</strong>$$\\text{C(graphite)} + 2\\,\\text{H}_2(g) \\longrightarrow \\text{CH}_4(g) \\quad [\\Delta_f H^\\circ = ?]$$</li><li><strong>Given Combustion Equations:</strong><ul><li>(1) $\\text{CH}_4(g) + 2\\,\\text{O}_2(g) \\rightarrow \\text{CO}_2(g) + 2\\,\\text{H}_2\\text{O}(l); \\quad \\Delta H_1 = -890.3\\text{ kJ/mol}$</li><li>(2) $\\text{C(graphite)} + \\text{O}_2(g) \\rightarrow \\text{CO}_2(g); \\quad \\Delta H_2 = -393.5\\text{ kJ/mol}$</li><li>(3) $\\text{H}_2(g) + \\frac{1}{2}\\,\\text{O}_2(g) \\rightarrow \\text{H}_2\\text{O}(l); \\quad \\Delta H_3 = -285.8\\text{ kJ/mol}$</li></ul></li><li><strong>Linear Combination of Equations:</strong>$$\\text{Target} = \\text{Eq (2)} + 2 \\times \\text{Eq (3)} - \\text{Eq (1)}$$$$\\Delta_f H^\\circ(\\text{CH}_4) = \\Delta H_2 + 2\\,\\Delta H_3 - \\Delta H_1$$$$\\Delta_f H^\\circ = (-393.5) + 2(-285.8) - (-890.3)$$$$\\Delta_f H^\\circ = -393.5 - 571.6 + 890.3 = -965.1 + 890.3 = \\mathbf{-74.8\\text{ kJ/mol}}$$</li></ol>", "verified": "(i) –74.8 kJ mol–1"}, {"num": "5.6", "title": "Spontaneity of an exothermic reaction with positive entropy", "question": "A reaction, A + B → C + D + q is found to have a positive entropy change. The reaction will be:\n(i) possible at high temperature\n(ii) possible only at low temperature\n(iii) not possible at any temperature\n(iv) possible at any temperature", "approach": "Evaluate ΔG = ΔH − TΔS where ΔH < 0 (heat released +q) and ΔS > 0.", "solution": "<p><strong>Correct Answer: (iv) possible at any temperature.</strong></p><p><strong>Explanation:</strong></p><ol><li>The reaction releases heat ($+q$ on the product side), which means it is <strong>exothermic</strong>:$$\\Delta H < 0\\quad (\\text{negative})$$</li><li>The problem states that there is a <strong>positive entropy change</strong>:$$\\Delta S > 0\\quad (\\text{positive})$$</li><li>Applying the Gibbs-Helmholtz criterion for spontaneity at constant $T$ and $P$:$$\\Delta G = \\Delta H - T\\Delta S$$<ul><li>Since $\\Delta H$ is negative ($-$) and $\\Delta S$ is positive ($+$), the term $-T\\Delta S$ is also strictly negative for all absolute temperatures ($T > 0\\text{ K}$).</li><li>Therefore, $\\Delta G = (\\text{negative}) + (\\text{negative}) < 0$ at <strong>all temperatures</strong>.</li></ul></li></ol><p>Because $\\Delta G$ is unconditionally negative, the reaction is thermodynamically spontaneous and possible at any temperature.</p>", "verified": "(iv) possible at any temperature"}, {"num": "5.7", "title": "Internal energy change from First Law parameters", "question": "In a process, 701 J of heat is absorbed by a system and 394 J of work is done by the system. What is the change in internal energy for the process?", "approach": "Apply First Law of Thermodynamics ΔU = q + w with IUPAC sign conventions.", "solution": "<p>According to the First Law of Thermodynamics:$$\\Delta U = q + w$$where:</p><ul><li>$q$ is the heat absorbed by the system. Since heat is absorbed by the system:$$q = +701\\text{ J}$$</li><li>$w$ is the work. According to IUPAC sign convention, work done <em>by</em> the system (expansion) is negative:$$w = -394\\text{ J}$$</li></ul><p>Substituting into the First Law equation:$$\\Delta U = (+701\\text{ J}) + (-394\\text{ J}) = \\mathbf{+307\\text{ J}}$$</p><p><strong>Conclusion:</strong> The internal energy of the system increases by <strong>307 J</strong>.</p>", "verified": "ΔU = +307 J"}, {"num": "5.8", "title": "Enthalpy change of cyanamide reaction in bomb calorimeter", "question": "The reaction of cyanamide, NH₂CN (s), with dioxygen was carried out in a bomb calorimeter, and ΔU was found to be –742.7 kJ mol–1 at 298 K. Calculate enthalpy change for the reaction at 298 K.\nNH₂CN(s) + 3/2 O₂(g) → N₂(g) + CO₂(g) + H₂O(l)", "approach": "Find Δn_g from gaseous coefficients, then use ΔH = ΔU + Δn_g RT.", "solution": "<p><strong>Given reaction:</strong>$$\\text{NH}_2\\text{CN}(s) + \\frac{3}{2}\\,\\text{O}_2(g) \\longrightarrow \\text{N}_2(g) + \\text{CO}_2(g) + \\text{H}_2\\text{O}(l)$$$$\\Delta U = -742.7\\text{ kJ}\\cdot\\text{mol}^{-1}, \\quad T = 298\\text{ K}, \\quad R = 8.314 \\times 10^{-3}\\text{ kJ}\\cdot\\text{K}^{-1}\\cdot\\text{mol}^{-1}$$</p><p><strong>1. Calculate change in gaseous moles ($\\Delta n_g$):</strong></p><ul><li>Moles of gaseous products = $1\\text{ mol N}_2(g) + 1\\text{ mol CO}_2(g) = 2\\text{ mol}$</li><li>Moles of gaseous reactants = $\\frac{3}{2}\\text{ mol O}_2(g) = 1.5\\text{ mol}$</li><li><em>(Note: $\\text{NH}_2\\text{CN}$ is solid and $\\text{H}_2\\text{O}$ is liquid, so neither is counted in $\\Delta n_g$).</em></li><li>$$\\Delta n_g = 2 - 1.5 = \\mathbf{+0.5\\text{ mol}}$$</li></ul><p><strong>2. Calculate $\\Delta n_g RT$:</strong></p>$$\\Delta n_g RT = (+0.5\\text{ mol}) \\times (8.314 \\times 10^{-3}\\text{ kJ}\\cdot\\text{K}^{-1}\\cdot\\text{mol}^{-1}) \\times (298\\text{ K}) = +1.239\\text{ kJ/mol}$$<p><strong>3. Calculate Enthalpy Change ($\\Delta H$):</strong></p>$$\\Delta H = \\Delta U + \\Delta n_g RT = -742.7\\text{ kJ/mol} + 1.239\\text{ kJ/mol} = \\mathbf{-741.46\\text{ kJ/mol} \\approx -741.5\\text{ kJ/mol}}$$</p>", "verified": "ΔH = −741.5 kJ/mol"}, {"num": "5.9", "title": "Heat required to raise temperature using molar heat capacity", "question": "Calculate the number of kJ of heat necessary to raise the temperature of 60.0 g of aluminium from 35°C to 55°C. Molar heat capacity of Al is 24 J mol–1 K–1.", "approach": "Convert mass to moles of Al (molar mass = 27 g/mol), then use q = n · C_m · ΔT.", "solution": "<p><strong>Given parameters:</strong></p><ul><li>Mass of aluminium ($m$) = $60.0\\text{ g}$</li><li>Molar mass of aluminium ($M$) = $27.0\\text{ g/mol}$</li><li>Initial temperature ($T_1$) = $35^\\circ\\text{C}$</li><li>Final temperature ($T_2$) = $55^\\circ\\text{C}$</li><li>Temperature change ($\\Delta T$) = $55 - 35 = 20^\\circ\\text{C} = 20\\text{ K}$</li><li>Molar heat capacity ($C_m$) = $24\\text{ J}\\cdot\\text{mol}^{-1}\\cdot\\text{K}^{-1}$</li></ul><p><strong>1. Calculate moles of aluminium ($n$):</strong></p>$$n = \\frac{m}{M} = \\frac{60.0\\text{ g}}{27.0\\text{ g/mol}} = 2.222\\text{ mol}$$<p><strong>2. Calculate heat required ($q$):</strong></p>$$q = n \\times C_m \\times \\Delta T$$$$q = (2.222\\text{ mol}) \\times (24\\text{ J}\\cdot\\text{mol}^{-1}\\cdot\\text{K}^{-1}) \\times (20\\text{ K}) = 1066.67\\text{ J}$$<p><strong>3. Convert Joules to kiloJoules:</strong></p>$$q = \\frac{1066.67}{1000} = \\mathbf{1.067\\text{ kJ}}$$</p>", "verified": "q = 1.067 kJ (or 1.07 kJ)"}, {"num": "5.10", "title": "Enthalpy change on freezing supercooled water", "question": "Calculate the enthalpy change on freezing of 1.0 mol of water at 10.0°C to ice at –10.0°C. Δ_fus H = 6.03 kJ mol–1 at 0°C.\nC_p [H₂O(l)] = 75.3 J mol–1 K–1\nC_p [H₂O(s)] = 36.8 J mol–1 K–1", "approach": "Break the cooling and phase change process into a three-step thermochemical path at constant pressure.", "solution": "<p>The process $\\text{H}_2\\text{O}(l, 10^\\circ\\text{C}) \\rightarrow \\text{H}_2\\text{O}(s, -10^\\circ\\text{C})$ can be carried out in three reversible steps:</p><ol><li><strong>Step 1: Cool liquid water from 10.0 °C to 0.0 °C:</strong>$$\\Delta H_1 = n \\times C_p[\\text{H}_2\\text{O}(l)] \\times \\Delta T_1 = (1.0\\text{ mol}) \\times (75.3\\text{ J}\\cdot\\text{mol}^{-1}\\cdot\\text{K}^{-1}) \\times (0 - 10\\text{ K})$$$$\\Delta H_1 = -753\\text{ J} = -0.753\\text{ kJ}$$</li><li><strong>Step 2: Freeze liquid water to ice at 0.0 °C:</strong>$$\\Delta H_2 = -\\Delta_{\\text{fus}} H = -(1.0\\text{ mol}) \\times (6.03\\text{ kJ/mol}) = -6.03\\text{ kJ}$$</li><li><strong>Step 3: Cool solid ice from 0.0 °C to –10.0 °C:</strong>$$\\Delta H_3 = n \\times C_p[\\text{H}_2\\text{O}(s)] \\times \\Delta T_3 = (1.0\\text{ mol}) \\times (36.8\\text{ J}\\cdot\\text{mol}^{-1}\\cdot\\text{K}^{-1}) \\times (-10 - 0\\text{ K})$$$$\\Delta H_3 = -368\\text{ J} = -0.368\\text{ kJ}$$</li></ol><p><strong>Total Enthalpy Change ($\\Delta H$):</strong></p>$$\\Delta H = \\Delta H_1 + \\Delta H_2 + \\Delta H_3 = (-0.753) + (-6.03) + (-0.368) = \\mathbf{-7.151\\text{ kJ/mol}}$$</p><p><strong>Conclusion:</strong> The enthalpy change on freezing 1 mol of water under these conditions is <strong>–7.15 kJ</strong> (7.15 kJ of heat released).</p>", "verified": "ΔH = −7.151 kJ/mol"}, {"num": "5.11", "title": "Heat released upon forming 35.2 g of CO₂ from carbon combustion", "question": "Enthalpy of combustion of carbon to CO₂ is –393.5 kJ mol–1. Calculate the heat released upon formation of 35.2 g of CO₂ from carbon and dioxygen gas.", "approach": "Find moles of CO2 formed (molar mass = 44 g/mol) and multiply by molar enthalpy of combustion.", "solution": "<p><strong>Thermochemical reaction:</strong>$$\\text{C}(s) + \\text{O}_2(g) \\longrightarrow \\text{CO}_2(g); \\quad \\Delta_c H^\\circ = -393.5\\text{ kJ}\\cdot\\text{mol}^{-1}$$</p><p>This indicates that the formation of $1\\text{ mole}$ of $CO_2$ ($44.0\\text{ g}$) releases $393.5\\text{ kJ}$ of heat.</p><p><strong>1. Calculate moles of CO₂ in 35.2 g:</strong></p>$$n(\\text{CO}_2) = \\frac{\\text{mass}}{\\text{molar mass}} = \\frac{35.2\\text{ g}}{44.0\\text{ g/mol}} = 0.80\\text{ mol}$$<p><strong>2. Calculate heat released ($q$):</strong></p>$$q = 0.80\\text{ mol} \\times 393.5\\text{ kJ/mol} = \\mathbf{314.8\\text{ kJ}}$$<p><strong>Conclusion:</strong> The heat released upon formation of 35.2 g of CO₂ is <strong>314.8 kJ</strong> (or $\\Delta H = -314.8\\text{ kJ}$).</p>", "verified": "Heat released = 314.8 kJ (ΔH = −314.8 kJ)"}, {"num": "5.12", "title": "Enthalpy of reaction from standard formation enthalpies", "question": "Enthalpies of formation of CO(g), CO₂(g), N₂O(g) and N₂O₄(g) are –110, –393, 81 and 9.7 kJ mol–1 respectively. Find the value of Δ_r H for the reaction:\nN₂O₄(g) + 3 CO(g) → N₂O(g) + 3 CO₂(g)", "approach": "Apply Δ_r H° = Σ Δ_f H°(products) − Σ Δ_f H°(reactants).", "solution": "<p><strong>Reaction:</strong>$$\\text{N}_2\\text{O}_4(g) + 3\\,\\text{CO}(g) \\longrightarrow \\text{N}_2\\text{O}(g) + 3\\,\\text{CO}_2(g)$$</p><p><strong>Given standard enthalpies of formation:</strong></p><ul><li>$\\Delta_f H^\\circ[\\text{N}_2\\text{O}_4(g)] = +9.7\\text{ kJ/mol}$</li><li>$\\Delta_f H^\\circ[\\text{CO}(g)] = -110\\text{ kJ/mol}$</li><li>$\\Delta_f H^\\circ[\\text{N}_2\\text{O}(g)] = +81\\text{ kJ/mol}$</li><li>$\\Delta_f H^\\circ[\\text{CO}_2(g)] = -393\\text{ kJ/mol}$</li></ul><p><strong>Formula:</strong>$$\\Delta_r H = \\sum \\Delta_f H^\\circ(\\text{products}) - \\sum \\Delta_f H^\\circ(\\text{reactants})$$$$\\Delta_r H = [\\Delta_f H^\\circ(\\text{N}_2\\text{O}) + 3\\,\\Delta_f H^\\circ(\\text{CO}_2)] - [\\Delta_f H^\\circ(\\text{N}_2\\text{O}_4) + 3\\,\\Delta_f H^\\circ(\\text{CO})]$$$$\\Delta_r H = [81 + 3(-393)] - [9.7 + 3(-110)]$$$$\\Delta_r H = [81 - 1179] - [9.7 - 330] = [-1098] - [-320.3]$$$$\\Delta_r H = -1098 + 320.3 = \\mathbf{-777.7\\text{ kJ/mol}}$$</p>", "verified": "Δ_r H = −777.7 kJ/mol"}, {"num": "5.13", "title": "Standard enthalpy of formation of ammonia from reaction enthalpy", "question": "Given:\nN₂(g) + 3 H₂(g) → 2 NH₃(g); Δ_r H° = –92.4 kJ mol–1\nWhat is the standard enthalpy of formation of NH₃ gas?", "approach": "Recall that standard enthalpy of formation is defined for ONE mole of compound formed from elements in standard states.", "solution": "<p><strong>Definition:</strong> The <strong>standard enthalpy of formation ($\\Delta_f H^\\circ$)</strong> is defined as the enthalpy change accompanying the formation of <strong>one mole</strong> of a compound from its constituent elements in their standard reference states.</p><p>The given reaction represents the synthesis of <strong>2 moles</strong> of gaseous ammonia:$$\\text{N}_2(g) + 3\\,\\text{H}_2(g) \\longrightarrow 2\\,\\text{NH}_3(g); \\quad \\Delta_r H^\\circ = -92.4\\text{ kJ/mol}$$</p><p>Therefore, the enthalpy change for the formation of 1 mole of $NH_3(g)$ is:$$\\Delta_f H^\\circ[\\text{NH}_3(g)] = \\frac{\\Delta_r H^\\circ}{2} = \\frac{-92.4\\text{ kJ/mol}}{2} = \\mathbf{-46.2\\text{ kJ/mol}}$$</p>", "verified": "Δ_f H°(NH3) = −46.2 kJ/mol"}, {"num": "5.14", "title": "Standard enthalpy of formation of liquid methanol", "question": "Calculate the standard enthalpy of formation of CH₃OH(l) from the following data:\n(1) CH₃OH(l) + 3/2 O₂(g) → CO₂(g) + 2 H₂O(l); Δ_r H° = –726 kJ mol–1\n(2) C(graphite) + O₂(g) → CO₂(g); Δ_c H° = –393 kJ mol–1\n(3) H₂(g) + 1/2 O₂(g) → H₂O(l); Δ_f H° = –286 kJ mol–1", "approach": "Set up target reaction C + 2 H2 + 1/2 O2 -> CH3OH and combine given combustion reactions via Hess's Law.", "solution": "<p><strong>Target Reaction:</strong>$$\\text{C(graphite)} + 2\\,\\text{H}_2(g) + \\frac{1}{2}\\,\\text{O}_2(g) \\longrightarrow \\text{CH}_3\\text{OH}(l) \\quad [\\Delta_f H^\\circ = ?]$$</p><p><strong>Using Hess's Law:</strong></p><ul><li>$\\text{Equation (2)}: \\text{C} + \\text{O}_2 \\rightarrow \\text{CO}_2 \\quad (\\Delta H = -393\\text{ kJ})$</li><li>$2 \\times \\text{Equation (3)}: 2\\,\\text{H}_2 + \\text{O}_2 \\rightarrow 2\\,\\text{H}_2\\text{O} \\quad (\\Delta H = 2 \\times (-286) = -572\\text{ kJ})$</li><li>$\\text{Reverse Equation (1)}: \\text{CO}_2 + 2\\,\\text{H}_2\\text{O} \\rightarrow \\text{CH}_3\\text{OH} + \\frac{3}{2}\\,\\text{O}_2 \\quad (\\Delta H = +726\\text{ kJ})$</li></ul><p><strong>Summing the reactions:</strong>$$\\Delta_f H^\\circ[\\text{CH}_3\\text{OH}(l)] = (-393) + (-572) + (+726) = -965 + 726 = \\mathbf{-239\\text{ kJ/mol}}$$</p>", "verified": "Δ_f H°(CH3OH(l)) = −239 kJ/mol"}, {"num": "5.15", "title": "Atomization enthalpy and mean C–Cl bond enthalpy in CCl₄", "question": "Calculate the enthalpy change for the process:\nCCl₄(g) → C(g) + 4 Cl(g)\nand calculate bond enthalpy of C – Cl in CCl₄(g).\nΔ_vap H°(CCl₄) = 30.5 kJ mol–1\nΔ_f H°(CCl₄) = –135.5 kJ mol–1\nΔ_a H°(C) = 715.0 kJ mol–1\nΔ_a H°(Cl₂) = 242 kJ mol–1", "approach": "Construct a thermochemical cycle for atomization of CCl4(g) from elements in standard states and divide by 4 for mean bond enthalpy.", "solution": "<p><strong>1. Find standard enthalpy of formation of gaseous CCl₄:</strong></p>$$\\text{C}(s) + 2\\,\\text{Cl}_2(g) \\longrightarrow \\text{CCl}_4(l); \\quad \\Delta_f H^\\circ(\\text{liquid}) = -135.5\\text{ kJ/mol}$$$$\\text{CCl}_4(l) \\longrightarrow \\text{CCl}_4(g); \\quad \\Delta_{\\text{vap}} H^\\circ = +30.5\\text{ kJ/mol}$$$$\\Delta_f H^\\circ[\\text{CCl}_4(g)] = -135.5 + 30.5 = -105.0\\text{ kJ/mol}$$</p><p><strong>2. Enthalpy required to atomize constituent elements into gas atoms:</strong></p><ul><li>Atomization of carbon: $\\text{C}(s) \\rightarrow \\text{C}(g); \\quad \\Delta_a H^\\circ = 715.0\\text{ kJ/mol}$</li><li>Atomization of chlorine: $2\\,\\text{Cl}_2(g) \\rightarrow 4\\,\\text{Cl}(g); \\quad 2 \\times 242 = 484.0\\text{ kJ/mol}$</li><li>Total energy to form gaseous atoms from elements = $715.0 + 484.0 = 1199.0\\text{ kJ/mol}$</li></ul><p><strong>3. Calculate enthalpy of atomization for CCl₄(g) → C(g) + 4 Cl(g):</strong></p>$$\\Delta_a H[\\text{CCl}_4(g)] = [\\Delta_a H(\\text{C}) + 2\\,\\Delta_a H(\\text{Cl}_2)] - \\Delta_f H^\\circ[\\text{CCl}_4(g)]$$$$\\Delta_a H[\\text{CCl}_4(g)] = 1199.0 - (-105.0) = \\mathbf{1304.0\\text{ kJ/mol}}$$</p><p><strong>4. Calculate the mean C–Cl bond enthalpy:</strong></p><p>In $CCl_4$, there are four identical $C-Cl$ single bonds:$$\\text{Bond Enthalpy}(C-Cl) = \\frac{\\Delta_a H[\\text{CCl}_4(g)]}{4} = \\frac{1304.0\\text{ kJ/mol}}{4} = \\mathbf{326.0\\text{ kJ/mol}}$$</p>", "verified": "Δ_a H = 1304.0 kJ/mol; C-Cl bond enthalpy = 326.0 kJ/mol"}, {"num": "5.16", "title": "Entropy change for an isolated system", "question": "For an isolated system, ΔU = 0, what will be ΔS ?", "approach": "Apply the Second Law of Thermodynamics to an isolated system undergoing irreversible spontaneous change.", "solution": "<p>In an <strong>isolated system</strong>, there is no exchange of either matter or energy (neither heat nor work) with the surroundings ($q = 0, w = 0$), so by the First Law:$$\\Delta U = q + w = 0$$</p><p>According to the <strong>Second Law of Thermodynamics</strong>:</p><ul><li>For any <strong>spontaneous (irreversible) process</strong> occurring in an isolated system, the entropy must increase:$$\\Delta S > 0$$</li><li>When the isolated system reaches <strong>dynamic thermodynamic equilibrium</strong>, the entropy reaches its maximum value, and no further change occurs:$$\\Delta S = 0$$</li><li>For an impossible (non-spontaneous) process: $\\Delta S < 0$.</li></ul><p><strong>Conclusion:</strong> For an isolated system, <strong>ΔS &gt; 0 for any spontaneous process</strong>, and <strong>ΔS = 0 at equilibrium</strong> (overall: $\\mathbf{\\Delta S \\ge 0}$).</p>", "verified": "ΔS > 0 for spontaneous process; ΔS = 0 at equilibrium (ΔS ≥ 0)"}, {"num": "5.17", "title": "Temperature threshold for reaction spontaneity", "question": "For the reaction at 298 K,\n2 A + B → C\nΔH = 400 kJ mol–1 and ΔS = 0.2 kJ K–1 mol–1\nAt what temperature will the reaction become spontaneous considering ΔH and ΔS to be constant over the temperature range.", "approach": "Set ΔG = ΔH − TΔS < 0 and solve for T.", "solution": "<p><strong>Given:</strong>$$\\Delta H = 400\\text{ kJ}\\cdot\\text{mol}^{-1}$$$$\\Delta S = 0.2\\text{ kJ}\\cdot\\text{K}^{-1}\\cdot\\text{mol}^{-1} = 200\\text{ J}\\cdot\\text{K}^{-1}\\cdot\\text{mol}^{-1}$$</p><p>According to the Gibbs-Helmholtz equation, a reaction is spontaneous when the Gibbs free energy change is negative:$$\\Delta G = \\Delta H - T\\Delta S < 0$$</p><p>At the point of transition between non-spontaneous and spontaneous behavior (equilibrium point):$$\\Delta G = 0 \\implies \\Delta H - T\\Delta S = 0 \\implies T = \\frac{\\Delta H}{\\Delta S}$$$$T = \\frac{400\\text{ kJ}\\cdot\\text{mol}^{-1}}{0.2\\text{ kJ}\\cdot\\text{K}^{-1}\\cdot\\text{mol}^{-1}} = \\mathbf{2000\\text{ K}}$$</p><p><strong>Conclusion:</strong> For $\\Delta G$ to be negative, $T\\Delta S$ must exceed $\\Delta H$. Therefore, the reaction will become spontaneous at temperatures <strong>above 2000 K</strong> ($T > 2000\\text{ K}$).</p>", "verified": "T > 2000 K"}, {"num": "5.18", "title": "Signs of ΔH and ΔS for chlorine atom dimerization", "question": "For the reaction,\n2 Cl(g) → Cl₂(g), what are the signs of ΔH and ΔS ?", "approach": "Analyze energetics of bond formation vs spatial degree of freedom loss.", "solution": "<p><strong>Reaction:</strong>$$2\\,\\text{Cl}(g) \\longrightarrow \\text{Cl}_2(g)$$</p><ol><li><strong>Sign of ΔH:</strong> In this reaction, a covalent bond ($Cl-Cl$) is formed between two free, isolated gaseous chlorine atoms. Bond formation is always accompanied by release of potential energy (exothermic process). Therefore:$$\\mathbf{\\Delta H < 0 \\quad (\\text{negative})}$$</li><li><strong>Sign of ΔS:</strong> On the reactant side, there are 2 moles of independent gaseous chlorine atoms possessing high translational and spatial disorder. On the product side, they are combined into 1 mole of diatomic chlorine molecules. Combining particles reduces the number of independent microstates and molecular randomness:$$\\mathbf{\\Delta S < 0 \\quad (\\text{negative})}$$</li></ol><p><strong>Summary:</strong> Both <strong>ΔH is negative</strong> and <strong>ΔS is negative</strong>.</p>", "verified": "ΔH < 0 (negative) and ΔS < 0 (negative)"}, {"num": "5.19", "title": "Standard Gibbs free energy change and spontaneity test", "question": "For the reaction\n2 A(g) + B(g) → 2 D(g)\nΔU° = –10.5 kJ and ΔS° = –44.1 J K–1 at 298 K.\nCalculate ΔG° for the reaction, and predict whether the reaction may occur spontaneously.", "approach": "Calculate Δn_g, find ΔH° = ΔU° + Δn_g RT, then evaluate ΔG° = ΔH° − TΔS°.", "solution": "<p><strong>Reaction:</strong>$$2\\,\\text{A}(g) + \\text{B}(g) \\longrightarrow 2\\,\\text{D}(g)$$$$\\Delta U^\\circ = -10.5\\text{ kJ}, \\quad \\Delta S^\\circ = -44.1\\text{ J}\\cdot\\text{K}^{-1} = -0.0441\\text{ kJ}\\cdot\\text{K}^{-1}, \\quad T = 298\\text{ K}$$</p><p><strong>1. Calculate change in gaseous moles ($\\Delta n_g$):</strong></p>$$\\Delta n_g = n_g(\\text{products}) - n_g(\\text{reactants}) = 2 - (2 + 1) = 2 - 3 = -1$$</p><p><strong>2. Calculate $\\Delta H^\\circ$:</strong></p>$$\\Delta H^\\circ = \\Delta U^\\circ + \\Delta n_g RT$$$$\\Delta H^\\circ = -10.5\\text{ kJ} + [(-1) \\times (8.314 \\times 10^{-3}\\text{ kJ}\\cdot\\text{K}^{-1}) \\times (298\\text{ K})]$$$$\\Delta H^\\circ = -10.5\\text{ kJ} - 2.478\\text{ kJ} = \\mathbf{-12.978\\text{ kJ}}$$</p><p><strong>3. Calculate $\\Delta G^\\circ$:</strong></p>$$\\Delta G^\\circ = \\Delta H^\\circ - T\\Delta S^\\circ$$$$\\Delta G^\\circ = -12.978\\text{ kJ} - [298\\text{ K} \\times (-0.0441\\text{ kJ}\\cdot\\text{K}^{-1})]$$$$\\Delta G^\\circ = -12.978\\text{ kJ} + 13.142\\text{ kJ} = \\mathbf{+0.164\\text{ kJ} = +164\\text{ J}}$$</p><p><strong>Prediction of Spontaneity:</strong></p><p>Since $\\Delta G^\\circ > 0$ (positive), the reaction <strong>will NOT occur spontaneously</strong> under standard conditions at 298 K.</p>", "verified": "ΔG° = +0.164 kJ (+164 J); reaction is non-spontaneous"}, {"num": "5.20", "title": "Standard Gibbs free energy from equilibrium constant", "question": "The equilibrium constant for a reaction is 10. What will be the value of ΔG° ? R = 8.314 J K–1 mol–1, T = 300 K.", "approach": "Apply ΔG° = −2.303 RT log10(K).", "solution": "<p><strong>Given:</strong>$$K = 10, \\quad R = 8.314\\text{ J}\\cdot\\text{K}^{-1}\\cdot\\text{mol}^{-1}, \\quad T = 300\\text{ K}$$</p><p>The relation between standard Gibbs free energy and the equilibrium constant is:$$\\Delta G^\\circ = -RT \\ln K = -2.303\\, RT \\log_{10} K$$</p><p>Substitute the given values:$$\\Delta G^\\circ = -2.303 \\times (8.314\\text{ J}\\cdot\\text{K}^{-1}\\cdot\\text{mol}^{-1}) \\times (300\\text{ K}) \\times \\log_{10}(10)$$$$\\Delta G^\\circ = -2.303 \\times 2494.2 \\times 1 = -5744.14\\text{ J}\\cdot\\text{mol}^{-1} = \\mathbf{-5.744\\text{ kJ}\\cdot\\text{mol}^{-1}}$$</p><p><strong>Conclusion:</strong> The value of $\\Delta G^\\circ$ is <strong>–5.74 kJ/mol</strong>.</p>", "verified": "ΔG° = −5.744 kJ/mol"}, {"num": "5.21", "title": "Thermodynamic stability of nitric oxide (NO gas)", "question": "Comment on the thermodynamic stability of NO(g), given:\n1/2 N₂(g) + 1/2 O₂(g) → NO(g); Δ_r H° = 90 kJ mol–1\nNO(g) + 1/2 O₂(g) → NO₂(g); Δ_r H° = –74 kJ mol–1", "approach": "Evaluate standard enthalpy of formation sign: positive Δ_f H° implies thermodynamic instability relative to elements.", "solution": "<p><strong>Analysis:</strong></p><ol><li>For the reaction:$$\\frac{1}{2}\\,\\text{N}_2(g) + \\frac{1}{2}\\,\\text{O}_2(g) \\longrightarrow \\text{NO}(g); \\quad \\Delta_f H^\\circ = +90\\text{ kJ}\\cdot\\text{mol}^{-1}$$Because $\\Delta_f H^\\circ$ is <strong>positive (endothermic formation)</strong>, nitric oxide possesses higher enthalpy than its constituent elements in their standard states. This signifies that $NO(g)$ is <strong>thermodynamically UNSTABLE with respect to decomposition into N₂ and O₂</strong>:$$\\text{NO}(g) \\longrightarrow \\frac{1}{2}\\,\\text{N}_2(g) + \\frac{1}{2}\\,\\text{O}_2(g); \\quad \\Delta_r H^\\circ = -90\\text{ kJ}\\cdot\\text{mol}^{-1}\\quad (\\text{exothermic})$$</li><li>For the reaction:$$\\text{NO}(g) + \\frac{1}{2}\\,\\text{O}_2(g) \\longrightarrow \\text{NO}_2(g); \\quad \\Delta_r H^\\circ = -74\\text{ kJ}\\cdot\\text{mol}^{-1}$$Because oxidation to nitrogen dioxide is <strong>exothermic</strong>, $NO(g)$ readily combines with oxygen to form the more stable $NO_2(g)$.</li></ol><p><strong>Conclusion:</strong> $NO(g)$ is thermodynamically unstable relative to $N_2$ and $O_2$, and is easily oxidized to $NO_2$. It persists at room temperature only because its uncatalyzed decomposition has a high kinetic activation energy barrier.</p>", "verified": "NO(g) is thermodynamically unstable due to positive formation enthalpy (+90 kJ/mol)"}, {"num": "5.22", "title": "Surroundings entropy change during water synthesis", "question": "Calculate the entropy change in surroundings when 1.00 mol of H₂O(l) is formed under standard conditions. Δ_f H° = –286 kJ mol–1.", "approach": "Apply ΔS_surr = q_surr / T = −ΔH_sys / T at standard temperature 298 K.", "solution": "<p><strong>Given:</strong>$$\\Delta_f H^\\circ = -286\\text{ kJ}\\cdot\\text{mol}^{-1} = -286000\\text{ J}\\cdot\\text{mol}^{-1}, \\quad T = 298\\text{ K}$$</p><p><strong>1. Heat absorbed by surroundings ($q_{\\text{surr}}$):</strong></p><p>Because the formation reaction is exothermic, the heat released by the system is transferred into the surroundings at constant pressure:$$q_{\\text{surr}} = -\\Delta_f H^\\circ = -(-286000\\text{ J}) = +286000\\text{ J}$$</p><p><strong>2. Calculate $\\Delta S_{\\text{surroundings}}$:</strong></p>$$\\Delta S_{\\text{surr}} = \\frac{q_{\\text{surr}}}{T} = \\frac{+286000\\text{ J}\\cdot\\text{mol}^{-1}}{298\\text{ K}} = \\mathbf{+959.73\\text{ J}\\cdot\\text{K}^{-1}\\cdot\\text{mol}^{-1} \\approx +960\\text{ J}\\cdot\\text{K}^{-1}\\cdot\\text{mol}^{-1}}$$</p><p><strong>Conclusion:</strong> The entropy change in the surroundings is <strong>+959.7 J K⁻¹ mol⁻¹</strong>.</p>", "verified": "ΔS_surr = +959.7 J K⁻¹ mol⁻¹"}], "revision_summary": {"key_laws": [{"name": "First Law of Thermodynamics", "formula": "ΔU = q + w", "context": "Conservation of energy; q > 0 (heat absorbed), w > 0 (work done on system)."}, {"name": "PV-Expansion Work", "formula": "w_irrev = −P_ext ΔV; w_rev = −2.303 nRT log(V2/V1)", "context": "Reversible isothermal expansion yields maximum work; free expansion into vacuum gives w = 0."}, {"name": "Enthalpy & Internal Energy", "formula": "ΔH = ΔU + Δn_g RT", "context": "Relates constant-pressure heat (q_p) to constant-volume heat (q_v) via gaseous mole change Δn_g."}, {"name": "Ideal Gas Heat Capacities", "formula": "C_p − C_v = R", "context": "Constant pressure requires additional heat to perform isobaric expansion work."}, {"name": "Hess's Law of Heat Summation", "formula": "Δ_r H° = Σ Δ_f H°(products) − Σ Δ_f H°(reactants)", "context": "Enthalpy is a state function; reaction enthalpy depends only on initial and final states."}, {"name": "Second Law & Entropy", "formula": "ΔS = q_rev / T; ΔS_univ = ΔS_sys + ΔS_surr ≥ 0", "context": "Spontaneous processes increase universe entropy; for isolated systems, ΔS > 0."}, {"name": "Gibbs-Helmholtz Equation", "formula": "ΔG = ΔH − T ΔS", "context": "Master spontaneity criterion at constant T, P: ΔG < 0 (spontaneous), ΔG = 0 (equilibrium), ΔG > 0 (non-spontaneous)."}, {"name": "Free Energy & Equilibrium", "formula": "Δ_r G° = −RT ln K = −2.303 RT log₁₀ K", "context": "Direct quantitative bridge between thermodynamic driving force and chemical equilibrium composition."}, {"name": "Third Law of Thermodynamics", "formula": "lim_{T→0 K} S = 0 (for a perfect crystal)", "context": "Defines absolute zero entropy baseline, enabling calculation of absolute standard molar entropies."}], "common_pitfalls": ["Counting liquids or solids in Δn_g — only gaseous species contribute to Δn_g = n_g(products) − n_g(reactants) in ΔH = ΔU + Δn_g RT.", "Assuming endothermic reactions (ΔH > 0) can never be spontaneous — if ΔS > 0, the reaction becomes spontaneous at high temperatures where T·ΔS > ΔH.", "Confusing ΔG with ΔG° — ΔG° is the standard free energy change at standard states (1 bar), while ΔG governs spontaneity at actual non-standard concentrations (ΔG = ΔG° + RT ln Q).", "Assigning non-zero formation enthalpy to elemental reference states — Δ_f H° is strictly ZERO for elements in their reference standard states (graphite, O2, N2, H2).", "Believing an adiabatic process is isothermal — adiabatic means zero heat exchange (q = 0), but temperature changes significantly during expansion or compression."]}};
