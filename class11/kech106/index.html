<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 6: Chapter 6 — Interactive Textbook</title>
<style>
:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: var(--radius-sm);
  position: relative;
  overflow: hidden;
  border: none;
  padding: 0;
  cursor: pointer;
  display: block;
}
.video-facade img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
}
.play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 48px;
  height: 48px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.video-title {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 8px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  color: #fff;
  font-size: 12px;
  text-align: left;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);

window.CHAPTER = {"chapter_meta": {"id": "kech106", "number": 6, "title": "Equilibrium", "book": "Chemistry Part I", "class": 11, "reprint": "2026-27", "tagline": "From physical and chemical dynamic equilibria and Le Chatelier's response to Brønsted-Lewis acids, pH buffers, and solubility products.", "total_concepts": 7, "total_practice_questions": 21, "total_exercises": 73}, "concepts": [{"id": "physical-chemical-equilibrium", "nav": "01 · Dynamic Equilibrium & Kc", "title": "Dynamic Equilibrium, Physical Equilibria & Law of Mass Action", "deck": "Discover how macroscopic constancy masks microscopic ceaseless motion: liquid-vapor and solid-liquid equilibria, Guldberg and Waage's Law of Chemical Equilibrium, and the concentration quotient Kc.", "minutes": 18, "section": "6.1, 6.2, 6.3", "pages": "1–7", "print": "PDF pp. 1–7 (NCERT Class 11 Chemistry Part I, Chapter 6)", "sim": "dynamiceq", "simTitle": "Dynamic Chemical Equilibrium & Rate Equalization Lab", "quick": "Equilibrium is reached when the rate of the forward reaction equals the rate of the reverse reaction. In physical equilibria, vapor pressure is constant at a given T. In chemical reactions, Kc = [C]^c [D]^d / ([A]^a [B]^b) remains constant at constant temperature.", "formulas": [{"label": "Equilibrium Rate Balance", "formula": "r_{\\text{forward}} = r_{\\text{reverse}}"}, {"label": "Equilibrium Constant Expression (Kc)", "formula": "K_c = \\frac{[C]^c [D]^d}{[A]^a [B]^b}"}, {"label": "Reverse Reaction Constant", "formula": "K_c' = \\frac{1}{K_c}"}, {"label": "Henry's Law for Gas Solubility", "formula": "m = k_H \\cdot P"}], "deeper": "Why is chemical equilibrium called 'dynamic' rather than static? Because chemical bonds continue to break and form at enormous frequencies (billions of collisions per second). In 1958, an elegant radiotracer experiment added radioactive $^{131}\\text{I}$ to an equilibrium mixture of non-radioactive $H_2 + I_2 \\rightleftharpoons 2HI$: within seconds, radioactive iodine was detected inside the $HI$ molecules without any change in the total macroscopic concentrations of $I_2$ or $HI$, proving that forward and reverse reactions proceed at equal, non-zero velocities.", "worked": [{"title": "Writing and Inverting the Equilibrium Constant Expression", "problem": "At 450 K, K_c for the reaction 2 SO₂(g) + O₂(g) ⇌ 2 SO₃(g) is 100 mol⁻¹·L. What is the value of K_c for the decomposition reaction: SO₃(g) ⇌ SO₂(g) + 1/2 O₂(g)?", "solution": "<p><strong>1. Original reaction:</strong></p>$$2\\,\\text{SO}_2(g) + \\text{O}_2(g) \\rightleftharpoons 2\\,\\text{SO}_3(g); \\quad K_{c1} = 100$$<p><strong>2. Desired reaction:</strong></p>$$\\text{SO}_3(g) \\rightleftharpoons \\text{SO}_2(g) + \\frac{1}{2}\\,\\text{O}_2(g)$$<p>Notice that the desired reaction is the <strong>reverse of the original reaction multiplied by 1/2</strong>.</p><p><strong>3. Apply the mathematical rules of equilibrium constants:</strong></p><ul><li>Reversing the reaction inverts $K_c$: $K_{c,\\text{reversed}} = \\frac{1}{K_{c1}} = \\frac{1}{100} = 0.01$</li><li>Multiplying stoichiometric coefficients by a factor $n = 1/2$ raises $K_c$ to the power $n$:$$K_{c2} = (K_{c,\\text{reversed}})^{1/2} = (0.01)^{1/2} = \\sqrt{0.01} = \\mathbf{0.1\\text{ mol}^{1/2}\\cdot\\text{L}^{-1/2}}$$<p><strong>Answer:</strong> $K_c = 0.1$.</p>"}], "prediction": {"scenario": "A sealed flask containing water and water vapor is in dynamic equilibrium at 25 °C (vapor pressure = 23.8 mmHg). The piston is pulled outward, doubling the volume of the gas space while maintaining constant temperature.", "question": "What happens to the rate of vaporization and the equilibrium vapor pressure once equilibrium is restored?", "options": ["More water evaporates until the vapor pressure returns to exactly 23.8 mmHg", "The vapor pressure permanently drops to half (11.9 mmHg)", "Water stops evaporating and the liquid completely boils away", "The vapor pressure doubles to compensate for larger volume"], "answer": 0, "reveal": "Vapor pressure of a pure liquid depends exclusively on temperature, not on volume. Pulling the piston temporarily halves the concentration of vapor molecules, dropping condensation rate below vaporization rate. Net evaporation occurs until vapor concentration and condensation rate match vaporization again, restoring the exact same vapor pressure of 23.8 mmHg."}, "connect": "Carbonated soft drink bottling utilizes Henry's law: bottling under 3–4 atm of pressurized CO₂ forces high gas solubility ($m = k_H P$); opening the cap releases the headspace pressure, driving the dynamic equilibrium backward to release effervescent bubbles.", "recall": ["Dynamic equilibrium: forward rate equals reverse rate; macroscopic properties ($P, T$, color, concentrations) remain constant.", "Equilibrium can be approached from either direction (all reactants or all products).", "Homogeneous equilibrium: all reactants and products are in a single phase.", "If reaction is multiplied by $n$, $K_{\\text{new}} = (K_{\\text{old}})^n$.", "If reaction is reversed, $K_{\\text{new}} = 1 / K_{\\text{old}}$."], "quizzes": [{"prompt": "If the equilibrium constant for N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g) is K, what is the equilibrium constant for NH₃(g) ⇌ 1/2 N₂(g) + 3/2 H₂(g)?", "options": ["1 / √K", "√K", "1 / K²", "−K / 2"], "answer": 0, "hint": "The reaction is reversed and halved (coefficients multiplied by 1/2).", "explain": "Reversing the equation inverts the constant ($1/K$), and multiplying by $1/2$ raises it to the power $1/2$: $K' = (1/K)^{1/2} = 1/\\sqrt{K}$."}, {"prompt": "Which of the following statements is strictly TRUE when a chemical system attains dynamic equilibrium?", "options": ["The rate of the forward reaction equals the rate of the reverse reaction", "The concentrations of reactants and products must be equal", "All chemical reaction activity ceases entirely", "The equilibrium constant K_c must equal 1"], "answer": 0, "hint": "Equilibrium is dynamic (ongoing microscopic collisions), with equal opposing rates.", "explain": "At dynamic equilibrium, forward and reverse reactions proceed at identical, non-zero velocities ($r_f = r_b$), keeping macroscopic concentrations constant (not necessarily equal)."}, {"prompt": "For the physical equilibrium solid ⇌ liquid at 1 atm, what is the specific temperature called at which both phases coexist indefinitely?", "options": ["Normal melting point / freezing point", "Critical temperature", "Boiling point", "Sublimation point"], "answer": 0, "hint": "At 1 atm, solid and liquid coexist in equilibrium at the melting point.", "explain": "The temperature at which solid and liquid phases of a pure substance coexist in dynamic equilibrium under a standard atmospheric pressure of 1 atm is defined as the normal melting point (or normal freezing point)."}]}, {"id": "kp-kc-relationship", "nav": "02 · Kp, Kc & Reaction Quotient", "title": "Relation between Kp and Kc, Reaction Quotient Qc & Heterogeneous Equilibria", "deck": "Derive Kp = Kc (RT)^Δng for gas-phase equilibria, evaluate reaction direction using the reaction quotient Qc vs Kc, and apply the pure solid/liquid activity convention.", "minutes": 18, "section": "6.4, 6.5, 6.6", "pages": "7–15", "print": "PDF pp. 7–15 (NCERT Class 11 Chemistry Part I, Chapter 6)", "sim": "kpconverter", "simTitle": "Kp vs Kc Calculator & Reaction Quotient Qc Explorer", "quick": "For gas reactions, partial pressures define Kp. Ideal gas law yields Kp = Kc (RT)^Δng, where Δng = gaseous products − gaseous reactants. If Qc < Kc, reaction shifts forward; if Qc > Kc, reverse. Pure solids and liquids have unit activity and are omitted from K expressions.", "formulas": [{"label": "Kp to Kc Relationship", "formula": "K_p = K_c (RT)^{\\Delta n_g}"}, {"label": "Gaseous Mole Change", "formula": "\\Delta n_g = \\sum n_g(\\text{products}) - \\sum n_g(\\text{reactants})"}, {"label": "Reaction Quotient Direction Criteria", "formula": "Q_c < K_c \\;(\\rightarrow), \\quad Q_c = K_c \\;(\\rightleftharpoons), \\quad Q_c > K_c \\;(\\leftarrow)"}, {"label": "Heterogeneous Unit Activity", "formula": "[\\text{Pure Solid}] = 1, \\quad [\\text{Pure Liquid}] = 1"}], "deeper": "Why are pure solids and pure liquids omitted from equilibrium constant expressions? The activity of a substance in chemical thermodynamics is referenced to its pure standard state ($a_i = \\gamma_i c_i / c_i^\\circ$). For a pure solid or liquid, the molar concentration $[X] = \\text{density} / \\text{molar mass}$ is an intensive constant that does not change as the reaction proceeds. Because this constant concentration is permanently absorbed into the equilibrium constant $K$, pure solids (like $CaCO_3(s)$ and $CaO(s)$) and pure liquid solvents are assigned an effective activity of unity ($a = 1$), leaving $K_p = P_{CO_2}$.", "worked": [{"title": "Predicting Direction of Reaction using Reaction Quotient Qc", "problem": "At 448 °C, the equilibrium constant K_c for H₂(g) + I₂(g) ⇌ 2 HI(g) is 50.0. A reaction vessel contains [H₂] = 0.10 M, [I₂] = 0.20 M, and [HI] = 0.40 M. Is the system at equilibrium? If not, in which direction will it proceed?", "solution": "<p><strong>1. Write the expression for the reaction quotient (Q_c):</strong></p>$$Q_c = \\frac{[\\text{HI}]^2}{[\\text{H}_2][\\text{I}_2]}$$<p><strong>2. Substitute current concentrations:</strong></p>$$Q_c = \\frac{(0.40)^2}{(0.10)(0.20)} = \\frac{0.16}{0.020} = \\mathbf{8.0}$$<p><strong>3. Compare $Q_c$ with $K_c$:</strong></p>$$Q_c = 8.0 < K_c = 50.0$$<p><strong>Conclusion:</strong></p><p>Because $Q_c < K_c$, the ratio of products to reactants is lower than at equilibrium. To reach equilibrium, the reaction will <strong>proceed in the forward direction</strong> (left to right), consuming $H_2$ and $I_2$ to generate more $HI$ until $Q_c$ rises to equal $50.0$.</p>"}], "prediction": {"scenario": "Consider the decomposition of solid ammonium carbamate: NH₂COONH₄(s) ⇌ 2 NH₃(g) + CO₂(g).", "question": "What is the relationship between total equilibrium pressure P and the equilibrium constant Kp?", "options": ["K_p = (4/27) · P³", "K_p = P²", "K_p = 2 P³", "K_p = P / 3"], "answer": 0, "reveal": "At equilibrium, solid carbamate produces $2\\text{ mol NH}_3$ for every $1\\text{ mol CO}_2$. Total gas moles = 3. Partial pressures: $p_{NH_3} = \\frac{2}{3}P$ and $p_{CO_2} = \\frac{1}{3}P$. Thus $K_p = (p_{NH_3})^2 (p_{CO_2}) = \\left(\\frac{2}{3}P\\right)^2 \\left(\\frac{1}{3}P\\right) = \\frac{4}{9}P^2 \\times \\frac{1}{3}P = \\frac{4}{27}P^3$."}, "connect": "Lime kilns produce quicklime ($CaO$) by thermally decomposing limestone ($CaCO_3(s) \\rightleftharpoons CaO(s) + CO_2(g)$). Continuously flushing $CO_2$ gas keeps $Q_p < K_p$, preventing the reaction from reaching equilibrium and achieving 100% conversion.", "recall": ["$K_p = K_c(RT)^{\\Delta n_g}$. If $\\Delta n_g = 0$, $K_p = K_c$.", "If $\\Delta n_g > 0$, $K_p > K_c$ (at $RT > 1$).", "Reaction quotient $Q$: computed with non-equilibrium concentrations.", "$Q < K$: shifts forward; $Q = K$: at equilibrium; $Q > K$: shifts backward.", "Heterogeneous equilibria: omit concentrations of pure solids ($[s] = 1$) and pure liquids ($[l] = 1$)."], "quizzes": [{"prompt": "Under which of the following conditions is K_p strictly equal to K_c for a gaseous equilibrium?", "options": ["When the change in gaseous moles is zero (Δn_g = 0)", "When the temperature is 0 °C", "When all reactants and products are monoatomic", "When total pressure is 1 atm"], "answer": 0, "hint": "Recall the formula Kp = Kc (RT)^Δng.", "explain": "From $K_p = K_c(RT)^{\\Delta n_g}$, when $\\Delta n_g = 0$, $(RT)^0 = 1$, which makes $K_p = K_c$ (e.g. $H_2(g) + I_2(g) \\rightleftharpoons 2HI(g)$)."}, {"prompt": "For the heterogeneous thermal decomposition CaCO₃(s) ⇌ CaO(s) + CO₂(g), what is the correct expression for K_p?", "options": ["K_p = p(CO₂)", "K_p = [p(CaO) · p(CO₂)] / p(CaCO₃)", "K_p = p(CO₂) / [p(CaCO₃)]", "K_p = [p(CO₂)]²"], "answer": 0, "hint": "Pure solids have constant concentration and unit activity.", "explain": "Because $CaCO_3(s)$ and $CaO(s)$ are pure crystalline solids, their activities are unity ($1$). Thus the equilibrium constant depends solely on the partial pressure of carbon dioxide: $K_p = p_{CO_2}$."}, {"prompt": "If the reaction quotient Q_c is calculated to be 120 for a reaction whose equilibrium constant K_c is 45, what will occur?", "options": ["The reaction will shift in the reverse direction (forming more reactants)", "The reaction will shift in the forward direction (forming more products)", "The system is already at dynamic equilibrium", "The equilibrium constant will increase to 120"], "answer": 0, "hint": "Compare Qc > Kc: excess product numerator must decrease.", "explain": "Since $Q_c > K_c$, there is an excess of products relative to reactants compared to the equilibrium ratio. The system spontaneously shifts backward (reverse direction) to consume products and form reactants until $Q_c = K_c$."}]}, {"id": "le-chatelier-principle", "nav": "03 · Le Chatelier's Principle", "title": "Le Chatelier's Principle: Disturbance, Shift & Equilibrium Response", "deck": "Analyze the universal response of chemical equilibria to external stresses: concentration changes, pressure/volume shifts, temperature variations, inert gas addition, and catalysts.", "minutes": 18, "section": "6.7, 6.8, 6.9", "pages": "15–22", "print": "PDF pp. 15–22 (NCERT Class 11 Chemistry Part I, Chapter 6)", "sim": "lechatelier", "simTitle": "Le Chatelier Disturbance Responder Lab", "quick": "Le Chatelier's Principle states that if a stress is applied to an equilibrium, the system shifts to counteract the perturbation. Increasing P shifts toward fewer gas moles. Increasing T favors endothermic reactions. Catalysts accelerate approach to equilibrium without shifting K.", "formulas": [{"label": "Le Chatelier's Postulate", "formula": "\\text{System responds to minimize applied stress}"}, {"label": "van 't Hoff Temperature Isochore", "formula": "\\ln\\left(\\frac{K_2}{K_1}\\right) = \\frac{\\Delta H^\\circ}{R}\\left(\\frac{1}{T_1} - \\frac{1}{T_2}\\right)"}, {"label": "Pressure Effect on Gas Moles", "formula": "\\text{Pressure } \\uparrow \\implies \\text{Shift toward smaller } \\sum n_g"}, {"label": "Inert Gas at Constant Volume", "formula": "\\Delta n_g \\;\\text{unaffected} \\implies \\text{No shift in equilibrium}"}], "deeper": "Why does adding an inert gas at constant pressure cause a shift, whereas adding it at constant volume causes zero shift? At constant volume, adding argon increases total pressure, but does NOT alter the partial pressures or molar concentrations of the reacting gases ($p_i = n_i RT / V$). Because individual reactant and product concentrations remain unchanged, $Q_c$ remains equal to $K_c$, and no shift occurs. At constant pressure, however, the vessel volume must expand to accommodate the extra inert gas molecules. This dilution lowers all partial pressures: if $\\Delta n_g > 0$, $Q_p$ drops below $K_p$, shifting the equilibrium forward toward the side with more moles of gas.", "worked": [{"title": "Applying Le Chatelier's Principle to Industrial Ammonia Synthesis", "problem": "For the exothermic Haber process: N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g); ΔH = −92.4 kJ/mol. Predict the effect of: (a) Increasing pressure, (b) Increasing temperature, (c) Adding helium at constant volume, and (d) Adding iron catalyst.", "solution": "<p><strong>(a) Increasing Pressure:</strong> Gaseous moles of reactants = $1 + 3 = 4$; products = $2$. Increasing pressure favors the side with fewer gas moles to relieve pressure. <em>Equilibrium shifts FORWARD (yield of NH₃ increases).</em></p><p><strong>(b) Increasing Temperature:</strong> The forward reaction is exothermic (releases heat). Adding heat shifts equilibrium in the endothermic direction (reverse) to absorb added thermal energy. <em>Equilibrium shifts REVERSE (yield of NH₃ decreases; K decreases).</em></p><p><strong>(c) Adding Helium at Constant Volume:</strong> Partial pressures and concentrations of $N_2, H_2, NH_3$ do not change. <em>NO SHIFT in equilibrium.</em></p><p><strong>(d) Adding Iron Catalyst:</strong> A catalyst lowers activation energy equally for both forward and reverse paths. It accelerates the rate of reaching equilibrium, but <em>does NOT change the equilibrium position or the value of K</em>.</p>"}], "prediction": {"scenario": "A glass syringe contains a reddish-brown equilibrium mixture of nitrogen dioxide and colorless dinitrogen tetroxide: 2 NO₂(g) (brown) ⇌ N₂O₄(g) (colorless); ΔH = −57.2 kJ/mol. The syringe plunger is suddenly pushed inward, compressing the gas to half its volume.", "question": "What sequence of color changes is observed immediately and after equilibrium is re-established?", "options": ["Color instantly darkens due to compression, then gradually fades lighter as it shifts toward colorless N₂O₄", "Color instantly turns completely colorless and stays colorless", "Color turns dark brown and stays dark brown permanently", "Color does not change because compression does not affect color"], "answer": 0, "reveal": "Instantaneously upon compression, all concentrations double, so $[\\text{NO}_2]$ increases, causing the mixture to flash momentarily darker brown. However, higher pressure stresses the system; by Le Chatelier's principle, it shifts forward toward the side with fewer moles of gas ($2\\text{ NO}_2 \\rightarrow 1\\text{ N}_2\\text{O}_4$), consuming brown $NO_2$ and causing the color to gradually fade lighter until new equilibrium is established."}, "connect": "Hyperbaric oxygen therapy treats carbon monoxide poisoning using Le Chatelier's principle: supplying high partial pressure of pure $O_2$ (2–3 atm) shifts the hemoglobin equilibrium $Hb(CO) + O_2 \\rightleftharpoons Hb(O_2) + CO$ forward, rapidly displacing toxic $CO$ from red blood cells.", "recall": ["Le Chatelier's Principle: System shifts to counteract applied stress.", "Increasing concentration of reactant shifts reaction forward; adding product shifts backward.", "Increasing pressure / decreasing volume shifts toward FEWER gaseous moles.", "Increasing temperature favors the ENDOTHERMIC direction; decreasing $T$ favors EXOTHERMIC.", "Adding inert gas at constant $V$: NO EFFECT. At constant $P$: shifts toward MORE gaseous moles.", "Catalyst: speeds up both directions equally; does NOT shift equilibrium or change $K$."], "quizzes": [{"prompt": "Which change will increase the equilibrium concentration of sulfur trioxide in the exothermic reaction: 2 SO₂(g) + O₂(g) ⇌ 2 SO₃(g) + heat?", "options": ["Decreasing the temperature", "Increasing the volume of the vessel", "Removing oxygen gas", "Adding an inert gas at constant volume"], "answer": 0, "hint": "The forward reaction releases heat and decreases gaseous moles.", "explain": "Because the forward reaction is exothermic ($-\\Delta H$), decreasing temperature removes heat, shifting the equilibrium in the forward direction to produce more $SO_3$. (Also, increasing pressure would help)."}, {"prompt": "What is the effect of adding a chemical catalyst to a reversible reaction at equilibrium?", "options": ["Increases rates of both forward and reverse reactions equally without shifting equilibrium", "Shifts equilibrium toward products", "Increases the numerical value of K_c", "Suppresses the reverse reaction completely"], "answer": 0, "hint": "A catalyst lowers activation energy for both directions by the exact same amount.", "explain": "A catalyst provides an alternative pathway with a lower activation energy ($E_a$) for both forward and reverse processes equally. It accelerates the attainment of equilibrium but leaves the equilibrium composition and $K_c$ completely unaltered."}, {"prompt": "For the dissociation reaction PCl₅(g) ⇌ PCl₃(g) + Cl₂(g), what happens if noble gas Argon is added at CONSTANT PRESSURE?", "options": ["Equilibrium shifts forward (more PCl₅ dissociates)", "Equilibrium shifts backward (more PCl₅ forms)", "No shift occurs", "Temperature spikes dramatically"], "answer": 0, "hint": "Constant total pressure forces volume to expand, diluting reactant and product partial pressures.", "explain": "At constant pressure, adding an inert gas increases vessel volume, lowering the partial pressures of all reactive gases. By Le Chatelier's principle, the system shifts toward the side with more moles of gas ($\\Delta n_g = 2 - 1 = +1$), driving the forward dissociation."}]}, {"id": "acid-base-theories", "nav": "04 · Acid-Base Concepts & Kw", "title": "Acid-Base Theories (Arrhenius, Brønsted, Lewis) & Water Autoionization", "deck": "Trace the evolution of acid-base concepts: Arrhenius H+/OH- ions, Brønsted-Lowry proton transfer & conjugate pairs, Lewis electron pair coordinate donation, and water's autoionization constant Kw.", "minutes": 18, "section": "6.10, 6.11.1", "pages": "22–27", "print": "PDF pp. 22–27 (NCERT Class 11 Chemistry Part I, Chapter 6)", "sim": "acidbasetheory", "simTitle": "Brønsted Conjugate Pairs & Lewis Coordinate Lab", "quick": "Arrhenius: acids yield H+, bases OH- in water. Brønsted-Lowry: acids donate protons (H+), bases accept protons, forming conjugate acid-base pairs differing by one H+. Lewis: acids accept electron pairs, bases donate electron pairs. Water autoionizes: Kw = [H+][OH-] = 1.0 × 10^-14 at 298 K.", "formulas": [{"label": "Water Autoionization Constant", "formula": "K_w = [H_3O^+][OH^-] = 1.0 \\times 10^{-14} \\quad (\\text{at } 298\\text{ K})"}, {"label": "Neutral Water Criterion", "formula": "[H_3O^+] = [OH^-] = \\sqrt{K_w} = 1.0 \\times 10^{-7}\\text{ M} \\quad (\\text{at } 25^\\circ\\text{C})"}, {"label": "Brønsted-Lowry Conjugate Relation", "formula": "\\text{Acid} \\rightleftharpoons \\text{Base} + H^+"}, {"label": "Temperature Dependence of Kw", "formula": "\\text{Endothermic: } T \\uparrow \\implies K_w \\uparrow \\implies \\text{neutral pH} < 7"}], "deeper": "Why is the proton in aqueous solution represented as a hydronium ion ($H_3O^+$) or Zundel/Eigen clusters rather than a bare $H^+$? A bare proton is a naked atomic nucleus with a radius of $\\sim 10^{-15}\\text{ m}$, giving it an astronomically high charge density ($> 10^{10}$ times that of any typical cation). A bare $H^+$ cannot exist independently in polar water: it penetrates the electron cloud of a neighboring $H_2O$ molecule, forming a covalent coordinate bond to yield hydronium ($H_3O^+$), which further hydrogen-bonds to form $[H_9O_4]^+$ clusters.", "worked": [{"title": "Identifying Conjugate Acid-Base Pairs", "problem": "Identify the conjugate acid-base pairs in the following reactions:\n(a) NH₃(aq) + H₂O(l) ⇌ NH₄⁺(aq) + OH⁻(aq)\n(b) HSO₄⁻(aq) + H₂O(l) ⇌ H₃O⁺(aq) + SO₄²⁻(aq)\n(c) What is the conjugate base of HCO₃⁻ and the conjugate acid of HCO₃⁻?", "solution": "<p><strong>(a) NH₃ + H₂O ⇌ NH₄⁺ + OH⁻:</strong></p><ul><li>$NH_3$ accepts a proton to become $NH_4^+$ $\\implies$ $NH_3$ (Base) / $NH_4^+$ (Conjugate Acid).</li><li>$H_2O$ donates a proton to become $OH^-$ $\\implies$ $H_2O$ (Acid) / $OH^-$ (Conjugate Base).</li></ul><p><strong>(b) HSO₄⁻ + H₂O ⇌ H₃O⁺ + SO₄²⁻:</strong></p><ul><li>$HSO_4^-$ donates a proton $\\implies$ $HSO_4^-$ (Acid) / $SO_4^{2-}$ (Conjugate Base).</li><li>$H_2O$ accepts a proton $\\implies$ $H_2O$ (Base) / $H_3O^+$ (Conjugate Acid).</li></ul><p><strong>(c) Amphoteric HCO₃⁻ (Bicarbonate):</strong></p><ul><li><strong>Conjugate Base (remove H⁺):</strong> $HCO_3^- - H^+ \\longrightarrow \\mathbf{CO_3^{2-}}$ (Carbonate ion).</li><li><strong>Conjugate Acid (add H⁺):</strong> $HCO_3^- + H^+ \\longrightarrow \\mathbf{H_2CO_3}$ (Carbonic acid).</li></ul>"}], "prediction": {"scenario": "Pure water is heated from 25 °C to 60 °C. Because water autoionization (2 H₂O ⇌ H₃O⁺ + OH⁻) is an endothermic bond-breaking process, K_w increases to ~1.0 × 10⁻¹³.", "question": "What happens to the pH of pure water at 60 °C, and is the water acidic, neutral, or basic?", "options": ["pH drops below 7 (pH ≈ 6.5), but the water remains strictly neutral because [H⁺] = [OH⁻]", "pH drops to 6.5, so the water becomes acidic", "pH remains strictly 7.00 because water is always neutral", "pH rises above 7 (pH ≈ 7.5), becoming basic"], "answer": 0, "reveal": "At 60 °C, $K_w = 1.0 \\times 10^{-13}$. In pure water, $[H^+] = [OH^-] = \\sqrt{K_w} = \\sqrt{10^{-13}} = 3.16 \\times 10^{-7}\\text{ M}$. Taking negative logarithm: $\\text{pH} = -\\log(3.16 \\times 10^{-7}) = 6.50$. Even though $\\text{pH} < 7$, the water is <strong>strictly NEUTRAL</strong> because the concentration of hydrogen ions still exactly equals the concentration of hydroxide ions ($[H^+] = [OH^-]$). The neutral point of the pH scale shifts with temperature."}, "connect": "Antacid medications (like aluminum hydroxide and magnesium hydroxide) neutralize excess gastric hydrochloric acid ($pH \\approx 1.5$) via Brønsted acid-base reactions, restoring stomach lining balance without causing systemic alkalosis.", "recall": ["Arrhenius: Acid produces $H^+$ in water; Base produces $OH^-$ in water.", "Brønsted-Lowry: Acid = Proton donor; Base = Proton acceptor.", "Conjugate pair: two species differing by exactly ONE proton ($H^+$).", "Lewis: Acid = Electron pair acceptor (electrophile, e.g. $BF_3, AlCl_3$); Base = Electron pair donor (nucleophile, e.g. $:NH_3, H_2O:$).", "Autoionization of water: $K_w = [H^+][OH^-] = 1.0 \\times 10^{-14}$ at 298 K; $\\text{pH} + \\text{pOH} = 14$."], "quizzes": [{"prompt": "Which of the following species acts as a Lewis acid but CANNOT act as a Brønsted-Lowry acid?", "options": ["BF₃ (Boron trifluoride)", "HCl (Hydrochloric acid)", "H₂SO₄ (Sulfuric acid)", "CH₃COOH (Acetic acid)"], "answer": 0, "hint": "Brønsted acids must have a transferable proton (H+), whereas Lewis acids need only an electron pair vacancy.", "explain": "$BF_3$ has an incomplete octet (6 valence electrons) with an empty $2p$ orbital that readily accepts an electron pair, making it a powerful Lewis acid. Because it contains no hydrogen atoms, it cannot donate a proton and is not a Brønsted acid."}, {"prompt": "What is the conjugate base of the dihydrogen phosphate ion, H₂PO₄⁻?", "options": ["HPO₄²⁻", "H₃PO₄", "PO₄³⁻", "P₂O₇⁴⁻"], "answer": 0, "hint": "To find the conjugate base of an acid, remove one proton (H+).", "explain": "Removing a single proton ($H^+$) from $H_2PO_4^-$ yields $HPO_4^{2-}$: $H_2PO_4^- \\rightleftharpoons H^+ + HPO_4^{2-}$. Hence, $HPO_4^{2-}$ is the conjugate base."}, {"prompt": "In pure water at 25 °C, what is the concentration of hydroxide ions [OH⁻]?", "options": ["1.0 × 10⁻⁷ M", "1.0 × 10⁻¹⁴ M", "7.0 M", "1.0 × 10⁻¹ M"], "answer": 0, "hint": "In pure water, autoionization yields equal H+ and OH- ions: [H+] = [OH-] = √Kw.", "explain": "At 25 °C, $K_w = [H^+][OH^-] = 1.0 \\times 10^{-14}$. In pure water, $[H^+] = [OH^-] = \\sqrt{1.0 \\times 10^{-14}} = 1.0 \\times 10^{-7}\\text{ M}$."}]}, {"id": "ph-weak-acids-bases", "nav": "05 · pH Scale & Weak Ionization", "title": "The pH Scale, Weak Acid/Base Ionization (Ka, Kb) & Ostwald Dilution", "deck": "Master Sørensen's logarithmic pH scale, quantify weak electrolyte equilibria using acid dissociation constant Ka and base dissociation constant Kb, and apply Ostwald's dilution law.", "minutes": 18, "section": "6.11.2, 6.11.3, 6.11.4", "pages": "27–34", "print": "PDF pp. 27–34 (NCERT Class 11 Chemistry Part I, Chapter 6)", "sim": "phweakacid", "simTitle": "Weak Acid Ionization & pH Titration Simulator", "quick": "Sørensen defined pH = -log10[H+]. Strong acids ionize 100%. Weak acids set up equilibrium: HA ⇌ H+ + A-, Ka = [H+][A-]/[HA]. Degree of dissociation α = √(Ka/C). For conjugate pairs, Ka · Kb = Kw, so pKa + pKb = 14. Polyprotic acids show Ka1 >> Ka2 >> Ka3.", "formulas": [{"label": "pH and pOH Definitions", "formula": "\\text{pH} = -\\log_{10}[H^+], \\quad \\text{pOH} = -\\log_{10}[OH^-]"}, {"label": "Neutrality & Summation Relation", "formula": "\\text{pH} + \\text{pOH} = \\text{pK}_w = 14.00 \\quad (\\text{at } 25^\\circ\\text{C})"}, {"label": "Weak Acid Ionization Constant", "formula": "K_a = \\frac{C\\alpha^2}{1 - \\alpha} \\approx C\\alpha^2 \\implies \\alpha = \\sqrt{\\frac{K_a}{C}}"}, {"label": "Hydrogen Ion Concentration of Weak Acid", "formula": "[H^+] = C\\alpha = \\sqrt{K_a \\cdot C} \\implies \\text{pH} = \\frac{1}{2}(\\text{pK}_a - \\log_{10} C)"}, {"label": "Conjugate Acid-Base Product", "formula": "K_a \\cdot K_b = K_w = 10^{-14} \\implies \\text{pK}_a + \\text{pK}_b = 14"}], "deeper": "Why is the first dissociation constant ($K_{a1}$) of a polybasic acid like carbonic acid ($H_2CO_3$) or phosphoric acid ($H_3PO_4$) orders of magnitude greater than the second ($K_{a2}$)? Removing a positively charged proton ($H^+$) from a neutral molecule (e.g. $H_2CO_3 \\rightarrow H^+ + HCO_3^-$) requires overcoming only moderate electrostatic attraction. However, removing a second proton requires detaching $H^+$ from a negatively charged anion ($HCO_3^- \\rightarrow H^+ + CO_3^{2-}$). The intense electrostatic attraction between $H^+$ and the negative conjugate anion exerts a powerful barrier, drastically suppressing the second dissociation: $K_{a1} = 4.2 \\times 10^{-7} \\gg K_{a2} = 4.8 \\times 10^{-11}$ ($K_{a1} / K_{a2} \\approx 10^4$).", "worked": [{"title": "Calculating pH and Degree of Dissociation of a Weak Acid", "problem": "Calculate the degree of dissociation (α) and pH of a 0.05 M solution of acetic acid (CH₃COOH) at 298 K, given K_a = 1.8 × 10⁻⁵.", "solution": "<p><strong>1. Equilibrium expression for acetic acid:</strong></p>$$\\text{CH}_3\\text{COOH} \\rightleftharpoons \\text{H}^+ + \\text{CH}_3\\text{COO}^-$$$$\\begin{matrix} & \\text{HA} & \\rightleftharpoons & \\text{H}^+ & + & \\text{A}^- \\\\ \\text{Initial:} & C & & 0 & & 0 \\\\ \\text{Equilibrium:} & C(1-\\alpha) & & C\\alpha & & C\\alpha \\end{matrix}$$<p><strong>2. Calculate degree of dissociation ($\\alpha$):</strong></p><p>Since $K_a$ is very small, assume $\\alpha \\ll 1$, so $1 - \\alpha \\approx 1$:</p>$$\\alpha = \\sqrt{\\frac{K_a}{C}} = \\sqrt{\\frac{1.8 \\times 10^{-5}}{0.05}} = \\sqrt{3.6 \\times 10^{-4}} = \\mathbf{0.019\\; (1.9\\%)}$$<p><em>(Check assumption: $\\alpha = 1.9\\% < 5\\%$, approximation is valid).</em></p><p><strong>3. Calculate $[H^+]$:</strong></p>$$[H^+] = C\\alpha = (0.05\\text{ M}) \\times (0.019) = 9.5 \\times 10^{-4}\\text{ M}$$<p><strong>4. Calculate pH:</strong></p>$$\\text{pH} = -\\log_{10}[H^+] = -\\log_{10}(9.5 \\times 10^{-4}) = 4 - \\log_{10}(9.5) = 4 - 0.978 = \\mathbf{3.02}$$"}], "prediction": {"scenario": "A 0.1 M solution of acetic acid has α = 1.34% (pH = 2.87). Pure distilled water is added to dilute the solution tenfold to 0.01 M.", "question": "According to Ostwald's dilution law, what happens to the degree of dissociation (α) and the total concentration of H⁺ ions in solution?", "options": ["Degree of dissociation α increases, but total [H⁺] decreases (pH rises)", "Degree of dissociation α decreases, and [H⁺] decreases", "Both α and [H⁺] remain strictly constant", "Degree of dissociation α increases and total [H⁺] increases"], "answer": 0, "reveal": "According to Ostwald's dilution law $\\alpha = \\sqrt{K_a / C}$: as concentration $C$ drops tenfold from $0.1$ to $0.01\\text{ M}$, $\\alpha$ increases by a factor of $\\sqrt{10} \\approx 3.16$ (from $1.34\\%$ to $4.24\\%$). However, $[H^+] = C\\alpha = 0.01 \\times 0.0424 = 4.24 \\times 10^{-4}\\text{ M}$, which is lower than the original $1.34 \\times 10^{-3}\\text{ M}$. Thus total $[H^+]$ decreases and pH rises (from 2.87 to 3.37)."}, "connect": "Ocean acidification is driven by weak acid equilibria: rising atmospheric CO₂ dissolves into seawater forming carbonic acid ($H_2CO_3$), whose first ionization releases $H^+$ ions, lowering oceanic pH and depleting the carbonate ($CO_3^{2-}$) needed by corals to build calcium carbonate skeletons.", "recall": ["$\\text{pH} = -\\log_{10}[H^+]$; an increase of 1 pH unit represents a tenfold decrease in $[H^+]$.", "Ostwald's dilution law: $\\alpha = \\sqrt{K_a / C}$; weak electrolytes dissociate more upon dilution.", "$K_a \\cdot K_b = K_w = 1.0 \\times 10^{-14}$; a strong acid has a very weak conjugate base.", "For weak acids, $[H^+] = \\sqrt{K_a \\cdot C}$ (when $\\alpha < 0.05$).", "Polyprotic acids ionize stepwise: $K_{a1} \\gg K_{a2} \\gg K_{a3}$."], "quizzes": [{"prompt": "What is the pH of a 1.0 × 10⁻⁸ M aqueous solution of hydrochloric acid (HCl) at 25 °C?", "options": ["Between 6.95 and 7.00 (slightly acidic)", "8.00 (basic)", "7.00 (neutral)", "1.00 (strongly acidic)"], "answer": 0, "hint": "In extremely dilute acid solutions, do not neglect the H+ ions contributed by water autoionization (10^-7 M).", "explain": "Total $[H^+] = [H^+]_{\\text{acid}} + [H^+]_{\\text{water}} = 10^{-8} + 10^{-7} = 1.1 \\times 10^{-7}\\text{ M}$. Taking negative logarithm: $\\text{pH} = -\\log(1.1 \\times 10^{-7}) \\approx 6.96$. An acid solution can never become basic (pH > 7) regardless of how dilute it is."}, {"prompt": "If the acid dissociation constant K_a of hydrocyanic acid (HCN) is 4.9 × 10⁻¹⁰ at 298 K, what is the base dissociation constant K_b of its conjugate base, the cyanide ion (CN⁻)?", "options": ["2.04 × 10⁻⁵", "4.9 × 10⁻⁴", "1.0 × 10⁻¹⁴", "2.04 × 10⁻¹⁰"], "answer": 0, "hint": "Use the relation Ka · Kb = Kw = 1.0 × 10^-14.", "explain": "$K_b = \\frac{K_w}{K_a} = \\frac{1.0 \\times 10^{-14}}{4.9 \\times 10^{-10}} = 2.04 \\times 10^{-5}$."}, {"prompt": "Why is the second dissociation constant K_a2 of sulfuric acid (H₂SO₄) much smaller than its first dissociation constant K_a1?", "options": ["It is much harder to remove a positive proton from a negatively charged HSO₄⁻ anion", "HSO₄⁻ is a stronger acid than H₂SO₄", "Sulfuric acid decomposes completely after the first dissociation", "The sulfate ion has no covalent bonds"], "answer": 0, "hint": "Consider electrostatic attraction between the escaping H+ and the remaining negative charge.", "explain": "In the first ionization, $H^+$ leaves a neutral $H_2SO_4$ molecule ($K_{a1} \\gg 1$). In the second step, $H^+$ must overcome the strong Coulombic attractive force of the negatively charged hydrogen sulfate anion ($HSO_4^-$), suppressing $K_{a2}$ to $1.2 \\times 10^{-2}$."}]}, {"id": "salt-hydrolysis-buffers", "nav": "06 · Salt Hydrolysis & Buffers", "title": "Salt Hydrolysis, Buffer Solutions & Henderson-Hasselbalch Equation", "deck": "Investigate why salts of weak acids and bases alter solution pH through ionic hydrolysis, and construct buffer systems that resist pH changes using the Henderson-Hasselbalch equation.", "minutes": 18, "section": "6.11.9, 6.12", "pages": "34–42", "print": "PDF pp. 34–42 (NCERT Class 11 Chemistry Part I, Chapter 6)", "sim": "buffersim", "simTitle": "Buffer Resistance & Henderson-Hasselbalch Lab", "quick": "Salts of strong acid + strong base (NaCl) do not hydrolyze (pH = 7). Weak acid + strong base (CH3COONa) hydrolyze anions (basic, pH > 7). Strong acid + weak base (NH4Cl) hydrolyze cations (acidic, pH < 7). Buffers resist pH change: pH = pKa + log([Conjugate Base]/[Acid]).", "formulas": [{"label": "Salt of Weak Acid & Strong Base pH", "formula": "\\text{pH} = 7 + \\frac{1}{2}\\text{pK}_a + \\frac{1}{2}\\log_{10} C"}, {"label": "Salt of Strong Acid & Weak Base pH", "formula": "\\text{pH} = 7 - \\frac{1}{2}\\text{pK}_b - \\frac{1}{2}\\log_{10} C"}, {"label": "Salt of Weak Acid & Weak Base pH", "formula": "\\text{pH} = 7 + \\frac{1}{2}\\text{pK}_a - \\frac{1}{2}\\text{pK}_b"}, {"label": "Henderson-Hasselbalch Equation (Acid Buffer)", "formula": "\\text{pH} = \\text{pK}_a + \\log_{10}\\left(\\frac{[\\text{Salt}]}{[\\text{Acid}]}\\right)"}, {"label": "Henderson-Hasselbalch Equation (Basic Buffer)", "formula": "\\text{pOH} = \\text{pK}_b + \\log_{10}\\left(\\frac{[\\text{Salt}]}{[\\text{Base}]}\\right)"}], "deeper": "How do buffer solutions resist pH changes upon addition of strong acids or strong bases? A buffer contains significant reserve concentrations of both a weak acid ($HA$) and its conjugate base ($A^-$). When strong acid ($H^+$) is introduced, the reserve base neutralizes it: $A^- + H^+ \\rightarrow HA$, converting strong $H^+$ into weak un-ionized $HA$. When strong base ($OH^-$) is introduced, the reserve acid neutralizes it: $HA + OH^- \\rightarrow A^- + H_2O$. Because the $[A^-]/[HA]$ ratio shifts only marginally inside the logarithm term of the Henderson-Hasselbalch equation ($\\Delta \\text{pH} = \\log([A^-]/[HA])$), the pH remains remarkably stable.", "worked": [{"title": "Designing an Acetate Buffer Solution", "problem": "Calculate the pH of a buffer solution prepared by mixing 0.10 mol of sodium acetate (CH₃COONa) and 0.05 mol of acetic acid (CH₃COOH) in 1.0 L of water. (pK_a of acetic acid = 4.76).", "solution": "<p><strong>1. Identify buffer components:</strong></p><ul><li>Weak acid: $[\\text{CH}_3\\text{COOH}] = 0.05\\text{ M}$</li><li>Conjugate salt: $[\\text{CH}_3\\text{COONa}] = 0.10\\text{ M}$</li><li>$\\text{pK}_a = 4.76$</li></ul><p><strong>2. Apply the Henderson-Hasselbalch equation:</strong></p>$$\\text{pH} = \\text{pK}_a + \\log_{10}\\left(\\frac{[\\text{Salt}]}{[\\text{Acid}]}\\right)$$$$\\text{pH} = 4.76 + \\log_{10}\\left(\\frac{0.10}{0.05}\\right) = 4.76 + \\log_{10}(2)$$$$\\text{pH} = 4.76 + 0.301 = \\mathbf{5.06}$$<p><em>Interpretation:</em> Because the conjugate base concentration is double the acid concentration, the pH lies $0.30$ units above the $\\text{pK}_a$ ($5.06 > 4.76$).</p>"}], "prediction": {"scenario": "To 1 L of pure distilled water at pH 7.0, you add 1 mL of 1 M HCl. To 1 L of an acetate buffer (0.1 M CH₃COOH + 0.1 M CH₃COONa, pH = 4.76), you also add 1 mL of 1 M HCl.", "question": "What happens to the pH in the two solutions?", "options": ["Water pH plummets from 7.0 to ~3.0 (drop of 4 units), while buffer pH shifts by barely ~0.01 units", "Both solutions drop by 4 pH units", "Neither solution changes pH because 1 mL is negligible", "The buffer pH drops to 1.0 while water remains at 7.0"], "answer": 0, "reveal": "In unbuffered water, adding $10^{-3}\\text{ mol } H^+$ to 1 L makes $[H^+] = 10^{-3}\\text{ M}$, crashing pH from 7.0 to 3.0 (a 10,000-fold surge in acidity). In the buffer, the $10^{-3}\\text{ mol } H^+$ reacts with acetate: $CH_3COO^- + H^+ \\rightarrow CH_3COOH$. Salt becomes $0.099\\text{ M}$ and acid becomes $0.101\\text{ M}$. New $\\text{pH} = 4.76 + \\log(0.099/0.101) = 4.76 - 0.0087 = 4.75$, demonstrating extraordinary buffering power."}, "connect": "Human blood maintains a strict physiological pH of $7.40 \\pm 0.05$ via the carbonic acid-bicarbonate buffer system ($H_2CO_3 / HCO_3^-$). A blood pH drop below 7.35 (acidosis) or surge above 7.45 (alkalosis) causes severe metabolic failure and death.", "recall": ["Salts of strong acid + strong base: neutral, $\\text{pH} = 7.0$.", "Salts of weak acid + strong base ($CH_3COONa$): basic, $\\text{pH} = 7 + \\frac{1}{2}\\text{pK}_a + \\frac{1}{2}\\log C$.", "Salts of strong acid + weak base ($NH_4Cl$): acidic, $\\text{pH} = 7 - \\frac{1}{2}\\text{pK}_b - \\frac{1}{2}\\log C$.", "Acid buffer: weak acid + its salt with strong base (e.g. $CH_3COOH + CH_3COONa$).", "Basic buffer: weak base + its salt with strong acid (e.g. $NH_4OH + NH_4Cl$).", "Henderson-Hasselbalch: $\\text{pH} = \\text{pK}_a + \\log([\\text{Salt}]/[\\text{Acid}])$."], "quizzes": [{"prompt": "An aqueous solution of ammonium chloride (NH₄Cl) tests acidic (pH < 7) to litmus. Which ion is responsible for this hydrolysis?", "options": ["NH₄⁺ cation (cationic hydrolysis)", "Cl⁻ anion (anionic hydrolysis)", "Both NH₄⁺ and Cl⁻ equally", "Dissolved atmospheric carbon dioxide"], "answer": 0, "hint": "Chloride ion is the conjugate base of a strong acid (HCl) and does not react with water.", "explain": "$Cl^-$ is the conjugate base of the strong acid $HCl$ and has negligible affinity for protons. $NH_4^+$ is the conjugate acid of the weak base $NH_3$: it hydrolyzes by donating a proton to water: $NH_4^+ + H_2O \\rightleftharpoons NH_3 + H_3O^+$, generating excess $H_3O^+$ and producing an acidic solution."}, {"prompt": "Under what condition does the pH of an acidic buffer solution equal the pK_a of its weak acid?", "options": ["When molar concentration of salt equals molar concentration of acid ([Salt] = [Acid])", "When the buffer is diluted to infinite volume", "When the acid is completely un-ionized", "Only at 0 °C"], "answer": 0, "hint": "Examine the logarithm term in pH = pKa + log([Salt]/[Acid]).", "explain": "When $[\\text{Salt}] = [\\text{Acid}]$, the ratio $[\\text{Salt}]/[\\text{Acid}] = 1$. Since $\\log_{10}(1) = 0$, the Henderson-Hasselbalch equation simplifies to $\\text{pH} = \\text{pK}_a$. This is the point of maximum buffer capacity."}, {"prompt": "What is the pH of a 0.1 M aqueous solution of sodium acetate (CH₃COONa), given pK_a(CH₃COOH) = 4.76?", "options": ["8.88", "5.12", "7.00", "13.00"], "answer": 0, "hint": "Apply pH = 7 + 0.5 pKa + 0.5 log10 C for a salt of weak acid and strong base.", "explain": "$\\text{pH} = 7 + \\frac{1}{2}\\text{pK}_a + \\frac{1}{2}\\log_{10}(C) = 7 + \\frac{1}{2}(4.76) + \\frac{1}{2}\\log_{10}(0.1) = 7 + 2.38 + \\frac{1}{2}(-1) = 9.38 - 0.50 = 8.88$."}]}, {"id": "solubility-product-ksp", "nav": "07 · Solubility Product & Ksp", "title": "Solubility Equilibria, Solubility Product (Ksp) & Common Ion Effect", "deck": "Quantify the dynamic dissolution of sparingly soluble salts, distinguish solubility product Ksp from ionic product Qsp to predict precipitation, and apply the common ion effect in qualitative analysis.", "minutes": 18, "section": "6.13", "pages": "42–47", "print": "PDF pp. 42–47 (NCERT Class 11 Chemistry Part I, Chapter 6)", "sim": "ksplab", "simTitle": "Solubility Product Ksp & Precipitation Threshold Lab", "quick": "For a sparingly soluble salt AxBy(s) ⇌ x A^y+ + y B^x-, Ksp = [A^y+]^x [B^x-]^y. If molar solubility is S, Ksp = x^x y^y S^(x+y). Precipitation occurs only when the ionic product Qsp exceeds Ksp. Adding a common ion suppresses solubility.", "formulas": [{"label": "Solubility Product Expression", "formula": "A_x B_y(s) \\rightleftharpoons x\\, A^{y+}(aq) + y\\, B^{x-}(aq) \\implies K_{sp} = [A^{y+}]^x [B^{x-}]^y"}, {"label": "Relation between Ksp and Molar Solubility S", "formula": "K_{sp} = x^x \\cdot y^y \\cdot S^{x+y}"}, {"label": "Precipitation Master Criterion", "formula": "Q_{sp} > K_{sp} \\;(\\text{Precipitation}), \\quad Q_{sp} = K_{sp} \\;(\\text{Saturated}), \\quad Q_{sp} < K_{sp} \\;(\\text{Unsaturated})"}, {"label": "Common Ion Solubility Suppression", "formula": "S_{\\text{common ion}} \\approx \\frac{K_{sp}}{[\\text{Common Ion}]}"}], "deeper": "How does the common ion effect enable the systematic separation of Group II cations ($Cu^{2+}, Pb^{2+}$) from Group IV cations ($Ni^{2+}, Zn^{2+}$) in qualitative salt analysis? Both groups precipitate as sulfides ($MS$). However, Group II sulfides have exceedingly tiny $K_{sp}$ values (e.g. $K_{sp}(CuS) \\approx 10^{-36}$), whereas Group IV sulfides have larger $K_{sp}$ values (e.g. $K_{sp}(ZnS) \\approx 10^{-22}$). By passing $H_2S$ gas in the presence of dilute $HCl$, the common $H^+$ ion suppresses $H_2S$ ionization ($H_2S \\rightleftharpoons 2H^+ + S^{2-}$), holding $[S^{2-}]$ very low. This low $[S^{2-}]$ satisfies $Q_{sp} > K_{sp}$ ONLY for the insoluble Group II cations, leaving Group IV cations safely in solution.", "worked": [{"title": "Predicting Precipitation on Mixing Solutions", "problem": "Equal volumes of 0.002 M CaCl₂ and 0.0004 M Na₂SO₄ are mixed together at 298 K. Will a precipitate of calcium sulfate form? (K_sp of CaSO₄ = 2.4 × 10⁻⁵).", "solution": "<p><strong>1. Account for dilution upon mixing equal volumes:</strong></p><p>When equal volumes are mixed, total volume doubles, so each concentration is halved:</p>$$[\\text{Ca}^{2+}] = \\frac{0.002\\text{ M}}{2} = 1.0 \\times 10^{-3}\\text{ M}$$$$[\\text{SO}_4^{2-}] = \\frac{0.0004\\text{ M}}{2} = 2.0 \\times 10^{-4}\\text{ M}$$<p><strong>2. Calculate the ionic product ($Q_{sp}$):</strong></p>$$Q_{sp} = [\\text{Ca}^{2+}][\\text{SO}_4^{2-}] = (1.0 \\times 10^{-3}) \\times (2.0 \\times 10^{-4}) = \\mathbf{2.0 \\times 10^{-7}}$$<p><strong>3. Compare $Q_{sp}$ with $K_{sp}$:</strong></p>$$Q_{sp} = 2.0 \\times 10^{-7} < K_{sp} = 2.4 \\times 10^{-5}$$<p><strong>Conclusion:</strong></p><p>Because the ionic product is smaller than the solubility product ($Q_{sp} < K_{sp}$), the mixed solution is <strong>unsaturated</strong> and <strong>NO PRECIPITATE will form</strong>.</p>"}], "prediction": {"scenario": "A saturated solution of silver chloride (AgCl, K_sp = 1.8 × 10⁻¹⁰) has molar solubility S = 1.34 × 10⁻⁵ M. A small amount of solid sodium chloride (NaCl) is dissolved to make [Cl⁻] = 0.10 M.", "question": "What happens to the solubility of AgCl in this 0.10 M NaCl solution?", "options": ["Solubility drops dramatically from 1.34 × 10⁻⁵ M down to 1.8 × 10⁻⁹ M", "Solubility increases because NaCl acts as a catalyst", "Solubility remains completely unchanged because K_sp is constant", "AgCl dissolves completely into free atoms"], "answer": 0, "reveal": "In $0.10\\text{ M } NaCl$, $[Cl^-] = 0.10\\text{ M}$. By the common ion effect: $K_{sp} = [Ag^+][Cl^-] = S' \\times (0.10) = 1.8 \\times 10^{-10} \\implies S' = 1.8 \\times 10^{-9}\\text{ M}$. The presence of the common chloride ion suppresses the solubility of $AgCl$ by almost $10,000$-fold!"}, "connect": "Medical barium swallow imaging utilizes barium sulfate ($BaSO_4$): although free $Ba^{2+}$ ions are acutely lethal poisons, $BaSO_4$ has an ultra-low solubility product ($K_{sp} = 1.1 \\times 10^{-10}$), making dissolved $Ba^{2+}$ concentration negligible ($10^{-5}\\text{ M}$) and entirely safe for radiographic gastrointestinal scanning.", "recall": ["$K_{sp}$ applies strictly to saturated solutions of sparingly soluble salts.", "For $AB$ salt: $K_{sp} = S^2 \\implies S = \\sqrt{K_{sp}}$.", "For $AB_2$ salt: $K_{sp} = 4S^3 \\implies S = (K_{sp} / 4)^{1/3}$.", "For $A_2B_3$ salt: $K_{sp} = 108 S^5$.", "Precipitation criterion: $Q_{sp} > K_{sp}$."], "quizzes": [{"prompt": "If the molar solubility of zirconium phosphate, Zr₃(PO₄)₄, is S mol/L, what is the correct algebraic relationship for its solubility product K_sp?", "options": ["K_sp = 6912 · S⁷", "K_sp = 108 · S⁵", "K_sp = 144 · S⁷", "K_sp = S⁷"], "answer": 0, "hint": "Use Ksp = x^x · y^y · S^(x+y) with x = 3 and y = 4.", "explain": "Here $x = 3$ and $y = 4$. $K_{sp} = (3)^3 \\cdot (4)^4 \\cdot S^{3+4} = 27 \\times 256 \\times S^7 = 6912\\, S^7$."}, {"prompt": "When will a precipitate form upon mixing solutions of two soluble salts that contain ions of a sparingly soluble compound?", "options": ["When the ionic product Q_sp exceeds the solubility product K_sp (Q_sp > K_sp)", "When Q_sp < K_sp", "When Q_sp = K_sp", "Whenever temperature is above 25 °C"], "answer": 0, "hint": "Precipitation occurs only when the solution is supersaturated.", "explain": "Precipitation occurs only when the actual ionic concentration product in solution exceeds the thermodynamic saturation limit: $Q_{sp} > K_{sp}$ (supersaturated state), driving spontaneous precipitation until $Q_{sp} = K_{sp}$."}, {"prompt": "Why is the solubility of AgCl significantly LOWER in a 0.1 M NaCl solution than in pure distilled water?", "options": ["The common Cl⁻ ion shifts the equilibrium AgCl(s) ⇌ Ag⁺ + Cl⁻ in the reverse direction", "Sodium ions react with silver to form an alloy", "NaCl neutralizes the acidity of water", "The dielectric constant of water decreases"], "answer": 0, "hint": "Recall the common ion effect on sparingly soluble equilibria.", "explain": "By Le Chatelier's principle, the high concentration of the common ion $Cl^-$ from dissolved $NaCl$ stresses the dissolution equilibrium $AgCl(s) \\rightleftharpoons Ag^+ + Cl^-$, driving it backward to precipitate more solid $AgCl$ and reducing $[Ag^+]$."}]}], "exercises": [{"num": "6.1", "title": "Effect of volume change on liquid-vapor equilibrium", "question": "A liquid is in equilibrium with its vapour in a sealed container at a fixed temperature. The volume of the container is suddenly doubled.\n(a) What is the initial effect of the change on vapour pressure?\n(b) How do rates of evaporation and condensation change initially?\n(c) What happens when equilibrium is restored and what will be the final vapour pressure?", "approach": "Apply kinetic molecular theory of vaporization and condensation and the principle that equilibrium vapor pressure of a pure liquid depends solely on temperature.", "solution": "<p><strong>(a) Initial effect on vapour pressure:</strong><br>When the volume of the container is suddenly doubled, the same number of gaseous vapor molecules are now distributed over twice the volume. Therefore, the concentration of vapor molecules per unit volume is halved, and the <strong>vapour pressure initially decreases to half</strong> of its original equilibrium value.</p><p><strong>(b) Initial effect on rates of evaporation and condensation:</strong><br>The rate of evaporation depends strictly on the surface area of the liquid and temperature, both of which remain constant; thus, the <strong>rate of evaporation remains unchanged</strong>.<br>However, the rate of condensation depends directly on the number of vapor molecules colliding with the liquid surface per second (vapor concentration). Because vapor concentration has halved, the <strong>rate of condensation decreases sharply</strong> ($r_{\\text{cond}} < r_{\\text{evap}}$).</p><p><strong>(c) Final state and equilibrium vapour pressure:</strong><br>Because $r_{\\text{evap}} > r_{\\text{cond}}$, net evaporation of the liquid occurs. As more liquid evaporates into the vapor phase, the number of vapor molecules increases until the rate of condensation once again equals the rate of evaporation. At that point, dynamic equilibrium is restored. Because equilibrium vapor pressure of a pure liquid is an intensive property governed exclusively by temperature, the <strong>final vapour pressure returns to its original value</strong>.</p>", "verified": "Vapor pressure initially halves; evap unchanged, cond decreases; net evaporation restores original vapor pressure"}, {"num": "6.2", "title": "Calculating Kc for SO₂ oxidation equilibrium", "question": "What is Kc for the following equilibrium when the equilibrium concentration of each substance is: [SO₂] = 0.60 M, [O₂] = 0.82 M and [SO₃] = 1.90 M?\n2 SO₂(g) + O₂(g) ⇌ 2 SO₃(g)", "approach": "Write the equilibrium constant expression Kc = [SO3]^2 / ([SO2]^2 [O2]) and substitute equilibrium values.", "solution": "<p><strong>Reaction:</strong>$$2\\,\\text{SO}_2(g) + \\text{O}_2(g) \\rightleftharpoons 2\\,\\text{SO}_3(g)$$</p><p><strong>Equilibrium constant expression:</strong>$$K_c = \\frac{[\\text{SO}_3]^2}{[\\text{SO}_2]^2 [\\text{O}_2]}$$</p><p><strong>Given equilibrium concentrations:</strong></p><ul><li>$[\\text{SO}_3] = 1.90\\text{ M}$</li><li>$[\\text{SO}_2] = 0.60\\text{ M}$</li><li>$[\\text{O}_2] = 0.82\\text{ M}$</li></ul><p><strong>Calculation:</strong>$$K_c = \\frac{(1.90)^2}{(0.60)^2 \\times (0.82)} = \\frac{3.61}{0.36 \\times 0.82} = \\frac{3.61}{0.2952} = \\mathbf{12.228\\text{ L}\\cdot\\text{mol}^{-1} \\approx 12.23\\text{ M}^{-1}}$$</p>", "verified": "Kc = 12.23 M⁻¹"}, {"num": "6.3", "title": "Kp for iodine dissociation from volume percentage", "question": "At a certain temperature and total pressure of 10⁵ Pa, iodine vapour contains 40% by volume of I atoms:\nI₂(g) ⇌ 2 I(g)\nCalculate Kp for the equilibrium.", "approach": "Use volume percentage as mole fraction to determine partial pressures p(I) and p(I2), then compute Kp = [p(I)]^2 / p(I2).", "solution": "<p><strong>Reaction:</strong>$$\\text{I}_2(g) \\rightleftharpoons 2\\,\\text{I}(g), \\quad P_{\\text{total}} = 10^5\\text{ Pa}$$</p><p><strong>1. Partial Pressures from Volume Percentages:</strong></p><p>By Avogadro's law, volume percent equals mole percent:</p><ul><li>Partial pressure of $I$ atoms: $p_I = \\frac{40}{100} \\times 10^5\\text{ Pa} = 0.40 \\times 10^5\\text{ Pa} = 4.0 \\times 10^4\\text{ Pa}$</li><li>Partial pressure of $I_2$ molecules: $p_{I_2} = \\frac{100 - 40}{100} \\times 10^5\\text{ Pa} = 0.60 \\times 10^5\\text{ Pa} = 6.0 \\times 10^4\\text{ Pa}$</li></ul><p><strong>2. Calculate K_p:</strong></p>$$K_p = \\frac{(p_I)^2}{p_{I_2}} = \\frac{(4.0 \\times 10^4\\text{ Pa})^2}{6.0 \\times 10^4\\text{ Pa}} = \\frac{1.6 \\times 10^9}{6.0 \\times 10^4} = \\mathbf{2.67 \\times 10^4\\text{ Pa}}$$</p>", "verified": "Kp = 2.67 × 10⁴ Pa (or 0.267 bar)"}, {"num": "6.4", "title": "Writing Kc expressions for homogeneous and heterogeneous equilibria", "question": "Write the expression for the equilibrium constant, Kc for each of the following reactions:\n(i) 2 NOCl(g) ⇌ 2 NO(g) + Cl₂(g)\n(ii) 2 Cu(NO₃)₂(s) ⇌ 2 CuO(s) + 4 NO₂(g) + O₂(g)\n(iii) CH₃COOC₂H₅(aq) + H₂O(l) ⇌ CH₃COOH(aq) + C₂H₅OH(aq)\n(iv) Fe³⁺(aq) + 3 OH⁻(aq) ⇌ Fe(OH)₃(s)\n(v) I₂(s) + 5 F₂(g) ⇌ 2 IF₅(g)", "approach": "Apply the Law of Mass Action, assigning unit activity ([solid] = 1, [pure liquid solvent] = 1) to heterogeneous phases.", "solution": "<p><strong>Rules:</strong> Pure solids and pure solvent liquids are omitted from $K_c$ expressions because their molar concentrations remain constant.</p><ol><li><strong>(i) 2 NOCl(g) ⇌ 2 NO(g) + Cl₂(g):</strong>$$K_c = \\frac{[\\text{NO}]^2 [\\text{Cl}_2]}{[\\text{NOCl}]^2}$$</li><li><strong>(ii) 2 Cu(NO₃)₂(s) ⇌ 2 CuO(s) + 4 NO₂(g) + O₂(g):</strong><br>Since $Cu(NO_3)_2(s)$ and $CuO(s)$ are pure solids ($[\\text{solid}] = 1$):$$K_c = [\\text{NO}_2]^4 [\\text{O}_2]$$</li><li><strong>(iii) CH₃COOC₂H₅(aq) + H₂O(l) ⇌ CH₃COOH(aq) + C₂H₅OH(aq):</strong><br>In dilute aqueous solution, water is the solvent ($[\\text{H}_2\\text{O}] = \\text{constant}$):$$K_c = \\frac{[\\text{CH}_3\\text{COOH}][\\text{C}_2\\text{H}_5\\text{OH}]}{[\\text{CH}_3\\text{COOC}_2\\text{H}_5]}$$</li><li><strong>(iv) Fe³⁺(aq) + 3 OH⁻(aq) ⇌ Fe(OH)₃(s):</strong><br>Solid $Fe(OH)_3$ has unit activity:$$K_c = \\frac{1}{[\\text{Fe}^{3+}][\\text{OH}^-]^3}$$</li><li><strong>(v) I₂(s) + 5 F₂(g) ⇌ 2 IF₅(g):</strong><br>Solid $I_2$ has unit activity:$$K_c = \\frac{[\\text{IF}_5]^2}{[\\text{F}_2]^5}$$</li></ol>", "verified": "(i) [NO]²[Cl2]/[NOCl]²; (ii) [NO2]⁴[O2]; (iii) [CH3COOH][C2H5OH]/[ester]; (iv) 1/([Fe3+][OH-]³); (v) [IF5]²/[F2]⁵"}, {"num": "6.5", "title": "Converting Kp to Kc for gaseous equilibria", "question": "Find out the value of Kc for each of the following equilibria from the value of Kp:\n(i) 2 NOCl(g) ⇌ 2 NO(g) + Cl₂(g); Kp = 1.8 × 10⁻² at 500 K\n(ii) CaCO₃(s) ⇌ CaO(s) + CO₂(g); Kp = 167 at 1073 K", "approach": "Use Kp = Kc (RT)^Δng, so Kc = Kp / (RT)^Δng with R = 0.0831 L·bar·K⁻¹·mol⁻¹.", "solution": "<p><strong>Relationship:</strong>$$K_p = K_c(RT)^{\\Delta n_g} \\implies K_c = \\frac{K_p}{(RT)^{\\Delta n_g}}$$where $R = 0.0831\\text{ bar}\\cdot\\text{L}\\cdot\\text{K}^{-1}\\cdot\\text{mol}^{-1}$.</p><p><strong>(i) 2 NOCl(g) ⇌ 2 NO(g) + Cl₂(g):</strong></p><ul><li>$\\Delta n_g = (2 + 1) - 2 = 3 - 2 = 1$</li><li>$T = 500\\text{ K}, \\quad K_p = 1.8 \\times 10^{-2}$</li><li>$$K_c = \\frac{1.8 \\times 10^{-2}}{(0.0831 \\times 500)^1} = \\frac{1.8 \\times 10^{-2}}{41.55} = \\mathbf{4.33 \\times 10^{-4}\\text{ M}}$$</li></ul><p><strong>(ii) CaCO₃(s) ⇌ CaO(s) + CO₂(g):</strong></p><ul><li>$\\Delta n_g = 1 - 0 = 1$ (only $CO_2$ is gas)</li><li>$T = 1073\\text{ K}, \\quad K_p = 167$</li><li>$$K_c = \\frac{167}{(0.0831 \\times 1073)^1} = \\frac{167}{89.166} = \\mathbf{1.87\\text{ M}}$$</li></ul>", "verified": "(i) Kc = 4.33 × 10⁻⁴; (ii) Kc = 1.87"}, {"num": "6.6", "title": "Reverse reaction Kc for NO + O₃ equilibrium", "question": "For the following equilibrium, Kc = 6.3 × 10¹⁴ at 1000 K:\nNO(g) + O₃(g) ⇌ NO₂(g) + O₂(g)\nBoth the forward and reverse reactions in the equilibrium are elementary bimolecular reactions. What is Kc, for the reverse reaction?", "approach": "The equilibrium constant for the reverse reaction is the reciprocal of the forward constant: Kc' = 1 / Kc.", "solution": "<p><strong>Forward Reaction:</strong>$$\\text{NO}(g) + \\text{O}_3(g) \\rightleftharpoons \\text{NO}_2(g) + \\text{O}_2(g); \\quad K_c = 6.3 \\times 10^{14}$$</p><p><strong>Reverse Reaction:</strong>$$\\text{NO}_2(g) + \\text{O}_2(g) \\rightleftharpoons \\text{NO}(g) + \\text{O}_3(g)$$</p><p>By the fundamental properties of equilibrium constants, reversing the chemical equation inverts its equilibrium constant:$$K_c' = \\frac{1}{K_c} = \\frac{1}{6.3 \\times 10^{14}} = \\mathbf{1.59 \\times 10^{-15}}$$<p><strong>Interpretation:</strong> The exceedingly tiny value of $K_c'$ ($1.6 \\times 10^{-15}$) indicates that the reverse reaction is almost completely non-spontaneous, while the forward reaction proceeds virtually to completion.</p>", "verified": "Kc' = 1.59 × 10⁻¹⁵"}, {"num": "6.7", "title": "Why pure liquids and solids are omitted from Kc", "question": "Explain why pure liquids and solids can be ignored while writing the equilibrium constant expression?", "approach": "Relate molar concentration of pure condensed phases to density and molar mass.", "solution": "<p>The molar concentration ($C$) of any pure condensed phase (solid or liquid) is given by:$$[\\text{Pure Solid/Liquid}] = \\frac{\\text{Moles}}{\\text{Volume}} = \\frac{\\text{Mass} / \\text{Molar Mass}}{\\text{Mass} / \\text{Density}} = \\frac{\\text{Density}}{\\text{Molar Mass}}$$Because density ($\\rho$) and molar mass ($M$) of a pure solid or pure liquid are intrinsic, intensive physical constants at a given temperature, their molar concentrations <strong>remain strictly constant throughout the reaction</strong>, regardless of how much solid or liquid is present.</p><p>In thermodynamic equilibrium formulations, these constant concentration terms are mathematically absorbed into the equilibrium constant $K_c$ itself. By convention, pure solids and pure liquids are assigned an effective <strong>activity of unity ($a = 1$)</strong>, and are therefore omitted from the equilibrium expression.</p>", "verified": "Density / Molar Mass is constant; assigned unit activity (a = 1)"}, {"num": "6.8", "title": "Reaction quotient and direction for N₂ + O₂ ⇌ 2 N₂O", "question": "Reaction between N₂ and O₂ takes place as follows:\n2 N₂(g) + O₂(g) ⇌ 2 N₂O(g)\nIf a mixture of 0.482 mol N₂ and 0.933 mol of O₂ is placed in a 10 L reaction vessel and allowed to form N₂O at a temperature for which Kc = 2.0 × 10⁻³⁷, determine the composition of the equilibrium mixture.", "approach": "Given the astronomically small Kc (2.0 × 10^-37), virtually no reaction occurs; equilibrium concentrations equal initial values.", "solution": "<p><strong>Given:</strong>$$2\\,\\text{N}_2(g) + \\text{O}_2(g) \\rightleftharpoons 2\\,\\text{N}_2\\text{O}(g); \\quad K_c = 2.0 \\times 10^{-37}, \\quad V = 10\\text{ L}$$</p><p><strong>1. Initial concentrations:</strong></p><ul><li>$[\\text{N}_2]_0 = \\frac{0.482\\text{ mol}}{10\\text{ L}} = 0.0482\\text{ M}$</li><li>$[\\text{O}_2]_0 = \\frac{0.933\\text{ mol}}{10\\text{ L}} = 0.0933\\text{ M}$</li><li>$[\\text{N}_2\\text{O}]_0 = 0$</li></ul><p><strong>2. Equilibrium analysis:</strong></p><p>Because $K_c = 2.0 \\times 10^{-37}$ is extraordinarily small ($K_c \\ll 10^{-3}$), the extent of forward reaction is completely negligible. Let $2x$ be the concentration of $N_2O$ formed:</p>$$K_c = \\frac{(2x)^2}{[\\text{N}_2]^2 [\\text{O}_2]} \\approx \\frac{4x^2}{(0.0482)^2 (0.0933)} = 2.0 \\times 10^{-37}$$$$4x^2 = (2.0 \\times 10^{-37}) \\times (2.323 \\times 10^{-3}) \\times (0.0933) = 4.336 \\times 10^{-41}$$$$x^2 = 1.084 \\times 10^{-41} = 10.84 \\times 10^{-42} \\implies x = 3.29 \\times 10^{-21}\\text{ M}$$<p><strong>Composition of Equilibrium Mixture:</strong></p><ul><li>$[\\text{N}_2] = 0.0482 - 2x \\approx \\mathbf{0.0482\\text{ M}}$ ($0.482\\text{ mol}$)</li><li>$[\\text{O}_2] = 0.0933 - x \\approx \\mathbf{0.0933\\text{ M}}$ ($0.933\\text{ mol}$)</li><li>$[\\text{N}_2\\text{O}] = 2x = 2(3.29 \\times 10^{-21}) = \\mathbf{6.6 \\times 10^{-21}\\text{ M}}$ ($6.6 \\times 10^{-20}\\text{ mol}$)
