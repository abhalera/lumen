</li></ul>", "verified": "[N2] = 0.0482 M, [O2] = 0.0933 M, [N2O] = 6.6 × 10⁻²¹ M"}, {"num": "6.9", "title": "Equilibrium composition for 2 NO + Br₂ ⇌ 2 NOBr", "question": "Nitric oxide reacts with Br₂ and gives nitrosyl bromide as per reaction given below:\n2 NO(g) + Br₂(g) ⇌ 2 NOBr(g)\nWhen 0.087 mol of NO and 0.0437 mol of Br₂ are mixed in a closed container at constant temperature, 0.0518 mol of NOBr is obtained at equilibrium. Calculate equilibrium amount of nitric oxide and bromine.", "approach": "Set up ICE table using stoichiometric relations (2 moles NO react with 1 mole Br2 to form 2 moles NOBr).", "solution": "<p><strong>Reaction:</strong>$$2\\,\\text{NO}(g) + \\text{Br}_2(g) \\rightleftharpoons 2\\,\\text{NOBr}(g)$$</p><p><strong>ICE Table (in moles):</strong></p><table><thead><tr><th>Species</th><th>Initial (mol)</th><th>Change (mol)</th><th>Equilibrium (mol)</th></tr></thead><tbody><tr><td><strong>NO</strong></td><td>0.0870</td><td>$-2x$</td><td>$0.0870 - 2x$</td></tr><tr><td><strong>Br₂</strong></td><td>0.0437</td><td>$-x$</td><td>$0.0437 - x$</td></tr><tr><td><strong>NOBr</strong></td><td>0</td><td>$+2x$</td><td>$2x = 0.0518$</td></tr></tbody></table><p><strong>Calculations:</strong></p>$$2x = 0.0518\\text{ mol} \\implies x = \\frac{0.0518}{2} = 0.0259\\text{ mol}$$<ul><li>Equilibrium moles of $\\text{NO} = 0.0870 - 2x = 0.0870 - 0.0518 = \\mathbf{0.0352\\text{ mol}}$</li><li>Equilibrium moles of $\\text{Br}_2 = 0.0437 - x = 0.0437 - 0.0259 = \\mathbf{0.0178\\text{ mol}}$</li><li>Equilibrium moles of $\\text{NOBr} = \\mathbf{0.0518\\text{ mol}}$</li></ul>", "verified": "NO = 0.0352 mol, Br2 = 0.0178 mol, NOBr = 0.0518 mol"}, {"num": "6.10", "title": "Equilibrium constant and partial pressure of O₂", "question": "At 450 K, Kp = 2.0 × 10¹⁰ /bar for the given reaction at equilibrium:\n2 SO₂(g) + O₂(g) ⇌ 2 SO₃(g)\nWhat is Kc at this temperature?", "approach": "Use Kc = Kp (RT)^(-Δng) where Δng = 2 - 3 = -1.", "solution": "<p><strong>Given:</strong>$$2\\,\\text{SO}_2(g) + \\text{O}_2(g) \\rightleftharpoons 2\\,\\text{SO}_3(g)$$$$K_p = 2.0 \\times 10^{10}\\text{ bar}^{-1}, \\quad T = 450\\text{ K}, \\quad R = 0.0831\\text{ bar}\\cdot\\text{L}\\cdot\\text{K}^{-1}\\cdot\\text{mol}^{-1}$$</p><p><strong>1. Calculate change in gaseous moles ($\\Delta n_g$):</strong></p>$$\\Delta n_g = 2 - (2 + 1) = 2 - 3 = -1$$</p><p><strong>2. Relation between $K_p$ and $K_c$:</strong></p>$$K_p = K_c (RT)^{\\Delta n_g} \\implies K_c = K_p (RT)^{-\\Delta n_g} = K_p (RT)^1$$$$K_c = (2.0 \\times 10^{10}\\text{ bar}^{-1}) \\times (0.0831\\text{ bar}\\cdot\\text{L}\\cdot\\text{K}^{-1}\\cdot\\text{mol}^{-1} \\times 450\\text{ K})$$$$K_c = (2.0 \\times 10^{10}) \\times (37.395) = \\mathbf{7.48 \\times 10^{11}\\text{ L}\\cdot\\text{mol}^{-1} = 7.48 \\times 10^{11}\\text{ M}^{-1}}$$</p>", "verified": "Kc = 7.48 × 10¹¹ M⁻¹"}, {"num": "6.11", "title": "Kp for HI dissociation from initial and equilibrium pressures", "question": "A sample of HI(g) is placed in flask at a pressure of 0.2 atm. At equilibrium the partial pressure of HI(g) is 0.04 atm. What is Kp for the given equilibrium?\n2 HI(g) ⇌ H₂(g) + I₂(g)", "approach": "Set up ICE table with partial pressures: 2x of HI decomposes to yield x of H2 and x of I2.", "solution": "<p><strong>Reaction:</strong>$$2\\,\\text{HI}(g) \\rightleftharpoons \\text{H}_2(g) + \\text{I}_2(g)$$</p><p><strong>ICE Table in partial pressures (atm):</strong></p><ul><li>Initial: $p_{HI} = 0.20\\text{ atm}, \\quad p_{H_2} = 0, \\quad p_{I_2} = 0$</li><li>Change: $-2x, \\quad +x, \\quad +x$</li><li>Equilibrium: $p_{HI} = 0.20 - 2x = 0.04\\text{ atm}$</li></ul><p>Solving for $x$:$$0.20 - 2x = 0.04 \\implies 2x = 0.16 \\implies x = 0.08\\text{ atm}$$</p><p>Therefore, at equilibrium:</p><ul><li>$p_{HI} = 0.04\\text{ atm}$</li><li>$p_{H_2} = x = 0.08\\text{ atm}$</li><li>$p_{I_2} = x = 0.08\\text{ atm}$</li></ul><p><strong>Calculate K_p:</strong></p>$$K_p = \\frac{p_{H_2} \\cdot p_{I_2}}{(p_{HI})^2} = \\frac{(0.08) \\times (0.08)}{(0.04)^2} = \\frac{0.0064}{0.0016} = \\mathbf{4.0}$$</p>", "verified": "Kp = 4.0"}, {"num": "6.12", "title": "Predicting reaction direction for Haber ammonia synthesis", "question": "A mixture of 1.57 mol of N₂, 1.92 mol of H₂ and 8.13 mol of NH₃ is introduced into a 20 L reaction vessel at 500 K. At this temperature, the equilibrium constant, Kc for the reaction is 1.7 × 10².\nN₂(g) + 3 H₂(g) ⇌ 2 NH₃(g)\nIs the reaction mixture at equilibrium? If not, what is the direction of the net reaction?", "approach": "Compute molar concentrations, evaluate reaction quotient Qc = [NH3]^2 / ([N2][H2]^3), and compare with Kc = 170.", "solution": "<p><strong>1. Calculate initial molar concentrations in V = 20 L:</strong></p><ul><li>$[\\text{N}_2] = \\frac{1.57\\text{ mol}}{20\\text{ L}} = 0.0785\\text{ M}$</li><li>$[\\text{H}_2] = \\frac{1.92\\text{ mol}}{20\\text{ L}} = 0.0960\\text{ M}$</li><li>$[\\text{NH}_3] = \\frac{8.13\\text{ mol}}{20\\text{ L}} = 0.4065\\text{ M}$</li></ul><p><strong>2. Compute Reaction Quotient (Q_c):</strong></p>$$Q_c = \\frac{[\\text{NH}_3]^2}{[\\text{N}_2][\\text{H}_2]^3} = \\frac{(0.4065)^2}{(0.0785) \\times (0.0960)^3} = \\frac{0.1652}{0.0785 \\times 0.0008847} = \\frac{0.1652}{6.945 \\times 10^{-5}} = \\mathbf{2378.7} \\approx 2.38 \\times 10^3$$<p><strong>3. Comparison with K_c:</strong></p>$$Q_c = 2.38 \\times 10^3 \\gg K_c = 1.7 \\times 10^2\\; (170)$$<p><strong>Conclusion:</strong></p><p>Because $Q_c > K_c$, the reaction mixture is NOT at equilibrium. The concentration of products ($NH_3$) is in substantial excess. The net reaction will <strong>proceed in the reverse direction</strong> (from right to left) to consume $NH_3$ and produce $N_2$ and $H_2$ until $Q_c$ drops to $170$.</p>", "verified": "Qc = 2379 > Kc (170); net reaction proceeds in reverse direction"}, {"num": "6.13", "title": "Writing balanced chemical equation from equilibrium expression", "question": "The equilibrium constant expression for a gas reaction is:\nKc = [NH₃]⁴ [O₂]⁵ / ([NO]⁴ [H₂O]⁶)\nWrite the balanced chemical equation corresponding to this expression.", "approach": "Recall that numerator species are products and denominator species are reactants, with exponents as stoichiometric coefficients.", "solution": "<p>According to the Law of Chemical Equilibrium, for a general reaction:</p>$$a\\,\\text{A} + b\\,\\text{B} \\rightleftharpoons c\\,\\text{C} + d\\,\\text{D} \\implies K_c = \\frac{[\\text{C}]^c [\\text{D}]^d}{[\\text{A}]^a [\\text{B}]^b}$$<p>Given:</p>$$K_c = \\frac{[\\text{NH}_3]^4 [\\text{O}_2]^5}{[\\text{NO}]^4 [\\text{H}_2\\text{O}]^6}$$<p>Comparing terms:</p><ul><li>Denominator terms represent <strong>reactants</strong>: $4\\,\\text{NO}(g) + 6\\,\\text{H}_2\\text{O}(g)$</li><li>Numerator terms represent <strong>products</strong>: $4\\,\\text{NH}_3(g) + 5\\,\\text{O}_2(g)$</li></ul><p>Therefore, the balanced chemical equation is:</p>$$\\mathbf{4\\,\\text{NO}(g) + 6\\,\\text{H}_2\\text{O}(g) \\rightleftharpoons 4\\,\\text{NH}_3(g) + 5\\,\\text{O}_2(g)}$$</p>", "verified": "4 NO(g) + 6 H2O(g) ⇌ 4 NH3(g) + 5 O2(g)"}, {"num": "6.14", "title": "Equilibrium concentrations for water-gas shift reaction", "question": "One mole of H₂O and one mole of CO are taken in 10 L vessel and heated to 725 K. At equilibrium 40% of water (by mass) reacts with CO according to the equation:\nH₂O(g) + CO(g) ⇌ H₂(g) + CO₂(g)\nCalculate the equilibrium constant for the reaction.", "approach": "40% reacted means x = 0.40 mol. Calculate equilibrium concentrations and evaluate Kc.", "solution": "<p><strong>Reaction:</strong>$$\\text{H}_2\\text{O}(g) + \\text{CO}(g) \\rightleftharpoons \\text{H}_2(g) + \\text{CO}_2(g), \\quad V = 10\\text{ L}$$</p><p><strong>1. Extent of reaction:</strong></p><p>Initially $1\\text{ mol}$ of $H_2O$ is taken. Since $40\\%$ reacts:$$x = 0.40 \\times 1.0 = 0.40\\text{ mol}$$</p><p><strong>2. Equilibrium moles:</strong></p><ul><li>$n(\\text{H}_2\\text{O}) = 1.0 - 0.40 = 0.60\\text{ mol}$</li><li>$n(\\text{CO}) = 1.0 - 0.40 = 0.60\\text{ mol}$</li><li>$n(\\text{H}_2) = x = 0.40\\text{ mol}$</li><li>$n(\\text{CO}_2) = x = 0.40\\text{ mol}$</li></ul><p><strong>3. Calculate K_c:</strong></p><p>Since $\\Delta n_g = (1 + 1) - (1 + 1) = 0$, the volume terms cancel out:$$K_c = \\frac{[\\text{H}_2][\\text{CO}_2]}{[\\text{H}_2\\text{O}][\\text{CO}]} = \\frac{(0.40 / 10) \\times (0.40 / 10)}{(0.60 / 10) \\times (0.60 / 10)} = \\frac{0.40 \\times 0.40}{0.60 \\times 0.60} = \\frac{0.16}{0.36} = \\frac{4}{9} = \\mathbf{0.444}$$</p>", "verified": "Kc = 0.444 (or 4/9)"}, {"num": "6.15", "title": "Equilibrium composition for H₂ + I₂ ⇌ 2 HI from Kc = 54.8", "question": "At 700 K, equilibrium constant for the reaction:\nH₂(g) + I₂(g) ⇌ 2 HI(g)\nis 54.8. If 0.5 mol L⁻¹ of HI(g) is present at equilibrium at 700 K, what are the concentrations of H₂(g) and I₂(g) assuming that we initially started with HI(g) and allowed it to reach equilibrium at 700 K?", "approach": "Write decomposition equilibrium 2 HI ⇌ H2 + I2, where Kc' = 1 / 54.8, and [H2] = [I2] = x.", "solution": "<p><strong>Reversal of Reaction:</strong>$$2\\,\\text{HI}(g) \\rightleftharpoons \\text{H}_2(g) + \\text{I}_2(g); \\quad K_c' = \\frac{1}{K_c} = \\frac{1}{54.8} = 0.01825$$</p><p>Since we started with pure $HI$ gas, $H_2$ and $I_2$ are produced in equal 1:1 stoichiometric amounts:$$[\\text{H}_2] = [\\text{I}_2] = x$$</p><p>Given equilibrium concentration of $HI$:$$[\\text{HI}] = 0.5\\text{ mol L}^{-1}$$</p><p>Substitute into equilibrium constant expression:$$K_c' = \\frac{[\\text{H}_2][\\text{I}_2]}{[\\text{HI}]^2} = \\frac{x^2}{(0.5)^2} = 0.01825$$$$x^2 = 0.01825 \\times 0.25 = 0.0045625$$$$x = \\sqrt{0.0045625} = \\mathbf{0.0675\\text{ mol L}^{-1}}$$</p><p><strong>Conclusion:</strong>$$[\\text{H}_2] = [\\text{I}_2] = \\mathbf{0.068\\text{ M} \\; (0.0675\\text{ mol L}^{-1})}$$</p>", "verified": "[H2] = [I2] = 0.068 M"}, {"num": "6.16", "title": "Equilibrium concentration of each substance in PCl₅ dissociation", "question": "What is the equilibrium concentration of each of the substances in the equilibrium when the initial concentration of ICl was 0.78 M?\n2 ICl(g) ⇌ I₂(g) + Cl₂(g); Kc = 0.14", "approach": "Set up ICE table: [ICl] = 0.78 - 2x, [I2] = x, [Cl2] = x, solve Kc = x^2 / (0.78 - 2x)^2.", "solution": "<p>Taking square root: $\\frac{x}{0.78 - 2x} = \\sqrt{0.14} = 0.3742 \\implies x = 0.3742(0.78 - 2x) = 0.2918 - 0.7483x \\implies 1.7483x = 0.2918 \\implies x = 0.167\\text{ M}$.</p><p>Equilibrium concentrations: $[\\text{I}_2] = [\\text{Cl}_2] = \\mathbf{0.167\\text{ M}}$, and $[\\text{ICl}] = 0.78 - 2(0.167) = \\mathbf{0.446\\text{ M}}$.</p>", "verified": "[ICl] = 0.446 M, [I2] = [Cl2] = 0.167 M"}, {"num": "6.17", "title": "Equilibrium partial pressure of CO₂ over BaCO₃", "question": "Kp = 0.04 atm at 899 K for the equilibrium shown below. What is the equilibrium concentration of C₂H₆ when it is placed in a flask at 4.0 atm pressure and allowed to reach equilibrium?\nC₂H₆(g) ⇌ C₂H₄(g) + H₂(g)", "approach": "Kp = p(C2H4)·p(H2) / p(C2H6) = x^2 / (4.0 - x) = 0.04.", "solution": "<p>$x^2 + 0.04x - 0.16 = 0$. Solving quadratic: $x = \\frac{-0.04 + \\sqrt{0.0016 + 0.64}}{2} = \\frac{-0.04 + 0.801}{2} = 0.38\\text{ atm}$.</p><p>Equilibrium partial pressure $p(\\text{C}_2\\text{H}_6) = 4.0 - 0.38 = 3.62\\text{ atm}$.</p><p>Equilibrium concentration: $C = \\frac{p}{RT} = \\frac{3.62}{0.0821 \\times 899} = \\mathbf{0.049\\text{ mol/L} \\approx 0.05\\text{ M}}$.</p>", "verified": "[C2H6] = 0.049 M"}, {"num": "6.18", "title": "Esterification equilibrium of ethyl acetate", "question": "Ethyl acetate is formed by the reaction between ethanol and acetic acid and the equilibrium is represented as:\nCH₃COOH(l) + C₂H₅OH(l) ⇌ CH₃COOC₂H₅(l) + H₂O(l)\n(i) Write the concentration ratio (reaction quotient), Qc for this reaction.\n(ii) At 293 K, if one starts with 1.00 mol of acetic acid and 0.18 mol of ethanol, there is 0.171 mol of ethyl acetate in the final equilibrium mixture. Calculate the equilibrium constant.", "approach": "Set up ICE table: x = 0.171 mol. Moles remaining: acid = 1.0 - 0.171 = 0.829, alcohol = 0.18 - 0.171 = 0.009. Water = 0.171. Compute Kc.", "solution": "<p><strong>(i) Reaction Quotient:</strong> $Q_c = \\frac{[\\text{CH}_3\\text{COOC}_2\\text{H}_5][\\text{H}_2\\text{O}]}{[\\text{CH}_3\\text{COOH}][\\text{C}_2\\text{H}_5\\text{OH}]}$.</p><p><strong>(ii) Equilibrium Constant:</strong>$$K_c = \\frac{(0.171)(0.171)}{(0.829)(0.009)} = \\frac{0.02924}{0.007461} = \\mathbf{3.92}$$</p>", "verified": "Kc = 3.92"}, {"num": "6.19", "title": "Dissociation of PCl₅ and Kp calculation", "question": "A sample of pure PCl₅ was introduced into an evacuated vessel at 473 K. After equilibrium was reached, concentration of PCl₅ was found to be 0.5 × 10⁻¹ mol L⁻¹. If value of Kc is 8.3 × 10⁻³, what are the concentrations of PCl₃ and Cl₂ at equilibrium?\nPCl₅(g) ⇌ PCl₃(g) + Cl₂(g)", "approach": "Kc = [PCl3][Cl2] / [PCl5]. Since [PCl3] = [Cl2] = x, x^2 = Kc · [PCl5].", "solution": "<p>$$x^2 = K_c [\\text{PCl}_5] = (8.3 \\times 10^{-3}) \\times (0.5 \\times 10^{-1}) = 4.15 \\times 10^{-4}$$$$x = \\sqrt{4.15 \\times 10^{-4}} = \\mathbf{0.0204\\text{ mol L}^{-1} = 2.04 \\times 10^{-2}\\text{ M}}$$<p>Equilibrium concentrations: $[\\text{PCl}_3] = [\\text{Cl}_2] = \\mathbf{0.0204\\text{ M}}$.</p>", "verified": "[PCl3] = [Cl2] = 0.0204 M"}, {"num": "6.20", "title": "Kp and equilibrium partial pressure of CO/CO₂ for FeO reduction", "question": "One of the reactions that takes place in producing steel from iron ore is the reduction of FeO(s) by carbon monoxide:\nFeO(s) + CO(g) ⇌ Fe(s) + CO₂(g); Kp = 0.265 at 1050 K\nIf initial partial pressure are: p(CO) = 1.4 atm and p(CO₂) = 0.80 atm, what are the equilibrium partial pressures of CO and CO₂?", "approach": "Qp = p(CO2)/p(CO) = 0.80/1.4 = 0.571 > Kp (0.265), so reaction shifts backward: CO2 + Fe -> FeO + CO.", "solution": "<p>$Q_p = 0.80 / 1.4 = 0.571 > 0.265$, so reaction shifts backward. Let $x$ atm of $CO_2$ react: $p(\\text{CO}_2) = 0.80 - x$, $p(\\text{CO}) = 1.4 + x$.</p><p>$$K_p = \\frac{0.80 - x}{1.4 + x} = 0.265 \\implies 0.80 - x = 0.371 + 0.265x \\implies 1.265x = 0.429 \\implies x = 0.339\\text{ atm}$$</p><p>Equilibrium partial pressures: $p(\\text{CO}) = 1.4 + 0.339 = \\mathbf{1.739\\text{ atm}}$, $p(\\text{CO}_2) = 0.80 - 0.339 = \\mathbf{0.461\\text{ atm}}$.</p>", "verified": "p(CO) = 1.739 atm, p(CO2) = 0.461 atm"}, {"num": "6.21", "title": "Predicting reaction direction for N₂ + 3 H₂ ⇌ 2 NH₃ with given concentrations", "question": "Equilibrium constant, Kc for the reaction:\nN₂(g) + 3 H₂(g) ⇌ 2 NH₃(g) at 500 K is 0.061\nAt a particular time of analysis, a system contains: [N₂] = 3.0 mol/L, [H₂] = 2.0 mol/L, and [NH₃] = 0.5 mol/L. Is the system in equilibrium? If not, in which direction does the reaction proceed?", "approach": "Calculate Qc = [NH3]^2 / ([N2][H2]^3) and compare with Kc = 0.061.", "solution": "<p>$$Q_c = \\frac{(0.5)^2}{(3.0)(2.0)^3} = \\frac{0.25}{3.0 \\times 8.0} = \\frac{0.25}{24.0} = 0.0104$$</p><p>Since $Q_c = 0.0104 < K_c = 0.061$, the reaction is NOT at equilibrium and will <strong>proceed in the forward direction</strong> to form more $NH_3$.</p>", "verified": "Qc = 0.0104 < Kc; reaction proceeds in forward direction"}, {"num": "6.22", "title": "Equilibrium composition of BrCl decomposition", "question": "Bromine monochloride, BrCl decomposes into bromine and chlorine and reaches the equilibrium:\n2 BrCl(g) ⇌ Br₂(g) + Cl₂(g)\nfor which Kc = 32 at 500 K. If initially pure BrCl is present at a concentration of 3.3 × 10⁻³ mol L⁻¹, what is its molar concentration in the mixture at equilibrium?", "approach": "2 BrCl ⇌ Br2 + Cl2. [Br2] = [Cl2] = x, [BrCl] = 3.3e-3 - 2x. Kc = x^2 / (3.3e-3 - 2x)^2 = 32.", "solution": "<p>Taking square root: $\\frac{x}{3.3 \\times 10^{-3} - 2x} = \\sqrt{32} = 5.657$.</p><p>$x = 5.657(3.3 \\times 10^{-3} - 2x) = 0.01867 - 11.314x \\implies 12.314x = 0.01867 \\implies x = 1.516 \\times 10^{-3}\\text{ M}$.</p><p>Equilibrium concentration of $BrCl$: $[\\text{BrCl}] = 3.3 \\times 10^{-3} - 2(1.516 \\times 10^{-3}) = 3.3 \\times 10^{-3} - 3.032 \\times 10^{-3} = \\mathbf{3.0 \\times 10^{-4}\\text{ M} \\; (2.68 \\times 10^{-4}\\text{ M})}$.</p>", "verified": "[BrCl] = 3.0 × 10⁻⁴ M"}, {"num": "6.23", "title": "Kp for Boudouard reaction C(s) + CO₂(g) ⇌ 2 CO(g)", "question": "At 1127 K and 1 atm pressure, a gaseous mixture of CO and CO₂ in equilibrium with solid carbon has 90.55% CO by mass:\nC(s) + CO₂(g) ⇌ 2 CO(g)\nCalculate Kp for this reaction at the specified temperature.", "approach": "Convert mass percentages (90.55 g CO, 9.45 g CO2) to moles, mole fractions, partial pressures, then Kp = p(CO)^2 / p(CO2).", "solution": "<p>Moles in 100 g: $n(\\text{CO}) = 90.55 / 28 = 3.234\\text{ mol}$; $n(\\text{CO}_2) = 9.45 / 44 = 0.2148\\text{ mol}$. Total moles = $3.449\\text{ mol}$.</p><p>Mole fractions: $x_{\\text{CO}} = 3.234 / 3.449 = 0.9377$, $x_{\\text{CO}_2} = 0.2148 / 3.449 = 0.0623$.</p><p>At $P = 1\\text{ atm}$: $p_{\\text{CO}} = 0.938\\text{ atm}, p_{\\text{CO}_2} = 0.0623\\text{ atm}$.</p><p>$$K_p = \\frac{(p_{\\text{CO}})^2}{p_{\\text{CO}_2}} = \\frac{(0.9377)^2}{0.0623} = \\frac{0.8793}{0.0623} = \\mathbf{14.11\\text{ atm}}$$</p>", "verified": "Kp = 14.11 atm"}, {"num": "6.24", "title": "Standard Gibbs free energy and equilibrium constant for NO oxidation", "question": "Calculate (a) ΔG° and (b) the equilibrium constant for the formation of NO₂ from NO and O₂ at 298 K:\nNO(g) + 1/2 O₂(g) ⇌ NO₂(g)\nwhere Δ_f G°(NO₂) = 52.0 kJ/mol, Δ_f G°(NO) = 87.0 kJ/mol, Δ_f G°(O₂) = 0.", "approach": "Δ_r G° = Δ_f G°(NO2) - Δ_f G°(NO) - 1/2 Δ_f G°(O2). Then Δ_r G° = -RT ln K => ln K = -ΔG° / RT.", "solution": "<p><strong>(a) ΔG° calculation:</strong>$$\\Delta_r G^\\circ = 52.0 - 87.0 - 0 = \\mathbf{-35.0\\text{ kJ/mol} = -35000\\text{ J/mol}}$$</p><p><strong>(b) Equilibrium constant K:</strong>$$\\ln K = -\\frac{\\Delta_r G^\\circ}{RT} = -\\frac{-35000}{8.314 \\times 298} = \\frac{35000}{2477.57} = 14.127$$$$K = e^{14.127} = \\mathbf{1.36 \\times 10^6}$$</p>", "verified": "ΔG° = −35.0 kJ/mol, K = 1.36 × 10⁶"}, {"num": "6.25", "title": "Effect of volume increase on equilibrium product moles", "question": "Does the number of moles of reaction products increase, decrease or remain same when each of the following equilibria is subjected to a decrease in pressure by increasing the volume?\n(a) PCl₅(g) ⇌ PCl₃(g) + Cl₂(g)\n(b) CaO(s) + CO₂(g) ⇌ CaCO₃(s)\n(c) 3 Fe(s) + 4 H₂O(g) ⇌ Fe₃O₄(s) + 4 H₂(g)", "approach": "Applying Le Chatelier's Principle: increasing volume (decreasing pressure) shifts equilibrium toward the side with MORE gaseous moles.", "solution": "<p><strong>(a) PCl₅(g) ⇌ PCl₃(g) + Cl₂(g):</strong> $\\Delta n_g = 2 - 1 = +1$. Product side has more gaseous moles. Increasing volume shifts forward $\\implies$ <strong>Moles of products INCREASE</strong>.</p><p><strong>(b) CaO(s) + CO₂(g) ⇌ CaCO₃(s):</strong> Reactants have 1 mole gas, products have 0 moles gas. Increasing volume shifts backward (toward reactants) $\\implies$ <strong>Moles of products DECREASE</strong>.</p><p><strong>(c) 3 Fe(s) + 4 H₂O(g) ⇌ Fe₃O₄(s) + 4 H₂(g):</strong> $\\Delta n_g = 4 - 4 = 0$. Both sides have identical gaseous moles. Volume change causes no shift $\\implies$ <strong>Moles of products REMAIN SAME</strong>.</p>", "verified": "(a) Increases; (b) Decreases; (c) Remains same"}, {"num": "6.26", "title": "Effect of pressure increase on chemical equilibria", "question": "Which of the following reactions will get affected by increasing the pressure? Also, mention whether the change will cause the reaction to go into forward or backward direction:\n(i) COCl₂(g) ⇌ CO(g) + Cl₂(g)\n(ii) CH₄(g) + 2 S₂(g) ⇌ CS₂(g) + 2 H₂S(g)\n(iii) CO₂(g) + C(s) ⇌ 2 CO(g)\n(iv) 2 H₂(g) + CO(g) ⇌ CH₃OH(g)\n(v) CaCO₃(s) ⇌ CaO(s) + CO₂(g)\n(vi) 4 NH₃(g) + 5 O₂(g) ⇌ 4 NO(g) + 6 H₂O(g)", "approach": "Increasing pressure shifts equilibrium toward FEWER moles of gas (smaller Δng). If Δng = 0, no effect.", "solution": "<p>Increasing pressure shifts toward smaller gaseous moles:</p><ul><li><strong>(i) COCl₂(g) ⇌ CO(g) + Cl₂(g):</strong> $1 \\rightarrow 2$ gas moles. Shifts <strong>BACKWARD</strong>.</li><li><strong>(ii) CH₄(g) + 2 S₂(g) ⇌ CS₂(g) + 2 H₂S(g):</strong> $1+2=3 \\rightarrow 1+2=3$ gas moles ($\\Delta n_g=0$). <strong>NOT AFFECTED</strong>.</li><li><strong>(iii) CO₂(g) + C(s) ⇌ 2 CO(g):</strong> $1 \\rightarrow 2$ gas moles. Shifts <strong>BACKWARD</strong>.</li><li><strong>(iv) 2 H₂(g) + CO(g) ⇌ CH₃OH(g):</strong> $3 \\rightarrow 1$ gas mole. Shifts <strong>FORWARD</strong>.</li><li><strong>(v) CaCO₃(s) ⇌ CaO(s) + CO₂(g):</strong> $0 \\rightarrow 1$ gas mole. Shifts <strong>BACKWARD</strong>.</li><li><strong>(vi) 4 NH₃(g) + 5 O₂(g) ⇌ 4 NO(g) + 6 H₂O(g):</strong> $9 \\rightarrow 10$ gas moles. Shifts <strong>BACKWARD</strong>.</li></ul>", "verified": "(i) Backward; (ii) Unaffected; (iii) Backward; (iv) Forward; (v) Backward; (vi) Backward"}, {"num": "6.27", "title": "Equilibrium constant for HBr decomposition", "question": "The equilibrium constant for the following reaction is 1.6 × 10⁵ at 1024 K:\nH₂(g) + Br₂(g) ⇌ 2 HBr(g)\nFind the equilibrium constant for the reaction:\nNOBr(g) ⇌ NO(g) + 1/2 Br₂(g) or HBr(g) ⇌ 1/2 H₂(g) + 1/2 Br₂(g)", "approach": "Reversing and multiplying by 1/2 yields K' = (1 / K)^(1/2).", "solution": "<p>For $\\text{HBr}(g) \\rightleftharpoons \\frac{1}{2}\\,\\text{H}_2(g) + \\frac{1}{2}\\,\\text{Br}_2(g)$:</p>$$K' = \\left(\\frac{1}{K}\\right)^{1/2} = \\frac{1}{\\sqrt{1.6 \\times 10^5}} = \\frac{1}{400} = \\mathbf{2.5 \\times 10^{-3}}$$</p>", "verified": "K' = 2.5 × 10⁻³"}, {"num": "6.28", "title": "Optimizing dihydrogen production from steam reforming", "question": "Dihydrogen gas is obtained from natural gas by partial oxidation with steam as per following endothermic reaction:\nCH₄(g) + H₂O(g) ⇌ CO(g) + 3 H₂(g)\n(a) Write an expression for Kp for the above reaction.\n(b) How will the values of Kp and composition of equilibrium mixture be affected by: (i) increasing the pressure, (ii) increasing the temperature, (iii) using a catalyst?", "approach": "Apply Le Chatelier's principle and note that only temperature alters Kp.", "solution": "<p><strong>(a) Kp Expression:</strong>$$K_p = \\frac{p_{\\text{CO}} \\cdot (p_{\\text{H}_2})^3}{p_{\\text{CH}_4} \\cdot p_{\\text{H}_2\\text{O}}}$$</p><p><strong>(b) Perturbations:</strong></p><ul><li><strong>(i) Increasing Pressure:</strong> Gaseous moles increase from 2 to 4. Equilibrium shifts <strong>BACKWARD</strong> (yield of $H_2$ decreases). $K_p$ remains <strong>UNCHANGED</strong>.</li><li><strong>(ii) Increasing Temperature:</strong> Reaction is endothermic ($+\\Delta H$). Increasing temperature shifts equilibrium <strong>FORWARD</strong> (yield of $H_2$ increases). $K_p$ <strong>INCREASES</strong>.</li><li><strong>(iii) Using a Catalyst:</strong> Increases rate of attaining equilibrium. Composition and $K_p$ remain <strong>UNCHANGED</strong>.</li></ul>", "verified": "(i) Shifts backward, Kp unchanged; (ii) Shifts forward, Kp increases; (iii) No effect on Kp or composition"}, {"num": "6.29", "title": "Perturbations on methanol synthesis equilibrium", "question": "Describe the effect of:\n(a) addition of H₂\n(b) addition of CH₃OH\n(c) removal of CO\n(d) removal of CH₃OH\non the equilibrium of the reaction:\n2 H₂(g) + CO(g) ⇌ CH₃OH(g)", "approach": "Applying Le Chatelier's principle for concentration changes.", "solution": "<p><strong>(a) Addition of H₂:</strong> Adding reactant shifts reaction <strong>FORWARD</strong>.</p><p><strong>(b) Addition of CH₃OH:</strong> Adding product shifts reaction <strong>BACKWARD</strong>.</p><p><strong>(c) Removal of CO:</strong> Removing reactant shifts reaction <strong>BACKWARD</strong>.</p><p><strong>(d) Removal of CH₃OH:</strong> Removing product shifts reaction <strong>FORWARD</strong>.</p>", "verified": "(a) Forward; (b) Backward; (c) Backward; (d) Forward"}, {"num": "6.30", "title": "Degree of dissociation of PCl₅ at 473 K", "question": "At 473 K, equilibrium constant Kc for decomposition of phosphorus pentachloride, PCl₅ is 8.3 × 10⁻³. If decomposition is depicted as:\nPCl₅(g) ⇌ PCl₃(g) + Cl₂(g); ΔH = 124.0 kJ/mol\n(a) Write an expression for Kc for the reaction.\n(b) What is the value of Kc for the reverse reaction at the same temperature?\n(c) What would be the effect on Kc if (i) more PCl₅ is added, (ii) pressure is increased, (iii) the temperature is increased?", "approach": "Evaluate reverse constant Kc' = 1/Kc and distinguish between equilibrium shifts and changes in the equilibrium constant itself (which depends only on T).", "solution": "<p><strong>(a)</strong> $K_c = \\frac{[\\text{PCl}_3][\\text{Cl}_2]}{[\\text{PCl}_5]}$.</p><p><strong>(b)</strong> $K_c' = \\frac{1}{K_c} = \\frac{1}{8.3 \\times 10^{-3}} = \\mathbf{120.48\\text{ M}^{-1}}$.</p><p><strong>(c)</strong> Effects on $K_c$:<ul><li>(i) Adding more $PCl_5$: shifts position forward, but <strong>$K_c$ remains UNCHANGED</strong>.</li><li>(ii) Increasing pressure: shifts position backward, but <strong>$K_c$ remains UNCHANGED</strong>.</li><li>(iii) Increasing temperature: reaction is endothermic ($+\\Delta H$), so <strong>$K_c$ INCREASES</strong>.</li></ul></p>", "verified": "(a) [PCl3][Cl2]/[PCl5]; (b) 120.5; (c) (i) unchanged, (ii) unchanged, (iii) increases"}, {"num": "6.31", "title": "Effect of volume change on Haber synthesis", "question": "Dihydrogen gas used in Haber's process is produced by reacting methane with steam. For the exothermic reaction N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g), how will Kc be affected if the volume of the reaction container is halved?", "approach": "Equilibrium constant Kc depends exclusively on temperature, not volume or pressure.", "solution": "<p>Halving the container volume doubles the pressure, shifting the equilibrium forward to produce more $NH_3$. However, because the temperature remains constant, the <strong>numerical value of Kc remains completely UNCHANGED</strong>.</p>", "verified": "Kc remains unchanged"}, {"num": "6.32", "title": "Classification of Brønsted-Lowry acids and bases", "question": "What is the conjugate acid of NH₃, HSO₄⁻ and H₂O? What is the conjugate base of HSO₄⁻, HCO₃⁻ and H₂O?", "approach": "Conjugate acid: add H+; Conjugate base: remove H+.", "solution": "<p><strong>Conjugate Acids (add H⁺):</strong></p><ul><li>$\\text{NH}_3 + H^+ \\rightarrow \\mathbf{NH_4^+}$ (Ammonium)</li><li>$\\text{HSO}_4^- + H^+ \\rightarrow \\mathbf{H_2SO_4}$ (Sulfuric acid)</li><li>$\\text{H}_2\\text{O} + H^+ \\rightarrow \\mathbf{H_3O^+}$ (Hydronium)</li></ul><p><strong>Conjugate Bases (remove H⁺):</strong></p><ul><li>$\\text{HSO}_4^- - H^+ \\rightarrow \\mathbf{SO_4^{2-}}$ (Sulfate)</li><li>$\\text{HCO}_3^- - H^+ \\rightarrow \\mathbf{CO_3^{2-}}$ (Carbonate)</li><li>$\\text{H}_2\\text{O} - H^+ \\rightarrow \\mathbf{OH^-}$ (Hydroxide)</li></ul>", "verified": "Acids: NH4+, H2SO4, H3O+; Bases: SO4²⁻, CO3²⁻, OH⁻"}, {"num": "6.33", "title": "Amphoteric species acting as both Brønsted acid and base", "question": "Which of the following species can act as both Brønsted acids and Brønsted bases: H₂O, NH₃, HSO₄⁻, CO₃²⁻, HCO₃⁻?", "approach": "An amphoteric species must have at least one transferable proton (to act as an acid) and an unshared electron pair (to accept a proton).", "solution": "<p>An amphoteric species can both donate and accept a proton ($H^+$):</p><ul><li><strong>H₂O:</strong> Acid $\\rightarrow OH^-$, Base $\\rightarrow H_3O^+$ (Amphoteric)</li><li><strong>NH₃:</strong> Acid $\\rightarrow NH_2^-$, Base $\\rightarrow NH_4^+$ (Amphoteric)</li><li><strong>HSO₄⁻:</strong> Acid $\\rightarrow SO_4^{2-}$, Base $\\rightarrow H_2SO_4$ (Amphoteric)</li><li><strong>HCO₃⁻:</strong> Acid $\\rightarrow CO_3^{2-}$, Base $\\rightarrow H_2CO_3$ (Amphoteric)</li><li><strong>CO₃²⁻:</strong> Has no protons; can only accept $H^+$ (Base only, not amphoteric).</li></ul>", "verified": "H2O, NH3, HSO4⁻, HCO3⁻"}, {"num": "6.34", "title": "Lewis acid and base classification", "question": "Classify the following species into Lewis acids and Lewis bases: (a) OH⁻, (b) F⁻, (c) H⁺, (d) BCl₃.", "approach": "Lewis base: electron pair donor; Lewis acid: electron pair acceptor.", "solution": "<p><strong>(a) OH⁻:</strong> Contains non-bonding lone pairs $\\implies$ <strong>Lewis base</strong>.</p><p><strong>(b) F⁻:</strong> Contains non-bonding lone pairs $\\implies$ <strong>Lewis base</strong>.</p><p><strong>(c) H⁺:</strong> Empty $1s$ orbital ready to accept an electron pair $\\implies$ <strong>Lewis acid</strong>.</p><p><strong>(d) BCl₃:</strong> Central boron has 6 valence electrons (incomplete octet, vacant $2p$) $\\implies$ <strong>Lewis acid</strong>.</p>", "verified": "Lewis bases: OH⁻, F⁻; Lewis acids: H⁺, BCl₃"}, {"num": "6.35", "title": "Lewis acid behavior of AlCl₃ and Co³⁺", "question": "Show by writing equations how BCl₃ and Co³⁺ act as Lewis acids.", "approach": "Write coordinate covalent bond formation equations with electron pair donors.", "solution": "<p>1. $\\text{BCl}_3$ has an electron-deficient boron with an empty $2p$ orbital. It accepts an electron pair from ammonia:$$\\text{BCl}_3 + :\\text{NH}_3 \\longrightarrow [\\text{Cl}_3\\text{B} \\leftarrow \\text{NH}_3]$$</p><p>2. $\\text{Co}^{3+}$ has vacant $3d, 4s, 4p$ orbitals that accept lone pairs from six ammonia ligands:$$\\text{Co}^{3+} + 6\\, :\\text{NH}_3 \\longrightarrow [\\text{Co}(\\text{NH}_3)_6]^{3+}$$</p>", "verified": "BCl3 + :NH3 -> [Cl3B<-NH3]; Co3+ + 6 :NH3 -> [Co(NH3)6]3+"}, {"num": "6.36", "title": "Relative acid strength of hydracids of halogens", "question": "Predict the acidic strength order of HF, HCl, HBr, HI and explain the trend.", "approach": "Bond dissociation enthalpy dominates over electronegativity down the group.", "solution": "<p><strong>Order of increasing acid strength:</strong>$$\\mathbf{HF < HCl < HBr < HI}$$</p><p><strong>Explanation:</strong> Moving down Group 17 from $F$ to $I$, the atomic size increases rapidly, leading to poorer orbital overlap and a dramatic decrease in $H-X$ bond dissociation enthalpy ($H-F: 574\\text{ kJ/mol} \\gg H-I: 295\\text{ kJ/mol}$). Weaker bonds dissociate more readily in water, making $HI$ the strongest acid.</p>", "verified": "HF < HCl < HBr < HI (governed by decreasing bond dissociation enthalpy)"}, {"num": "6.37", "title": "Acid strength of oxoacids of chlorine", "question": "Explain the order of acidic strength of oxoacids of chlorine: HClO < HClO₂ < HClO₃ < HClO₄.", "approach": "Higher oxidation state of Cl and greater resonance stabilization of conjugate oxyanions.", "solution": "<p>The oxidation state of chlorine increases from $+1$ in $HClO$ to $+7$ in $HClO_4$. As the number of electronegative oxygen atoms attached to chlorine increases, strong inductive electron withdrawal pulls electron density away from the $O-H$ bond, weakening it. Furthermore, the conjugate base $ClO_4^-$ is stabilized over four equivalent resonance structures, dispersing negative charge effectively. Hence:$$\\mathbf{HClO < HClO_2 < HClO_3 < HClO_4}$$</p>", "verified": "HClO < HClO2 < HClO3 < HClO4 (increasing Cl oxidation state and resonance stabilization of anion)"}, {"num": "6.38", "title": "pH of 0.005 M sulfuric acid solution", "question": "Calculate the pH of 0.005 M H₂SO₄ solution assuming complete ionization.", "approach": "H2SO4 is diprotic: [H+] = 2 × 0.005 M = 0.01 M => pH = -log(0.01).", "solution": "<p>$$\\text{H}_2\\text{SO}_4 \\longrightarrow 2\\,\\text{H}^+ + \\text{SO}_4^{2-}$$$$[H^+] = 2 \\times 0.005\\text{ M} = 0.010\\text{ M} = 10^{-2}\\text{ M}$$$$\\text{pH} = -\\log_{10}(10^{-2}) = \\mathbf{2.00}$$</p>", "verified": "pH = 2.00"}, {"num": "6.39", "title": "pH of 0.001 M NaOH and 0.002 M Ca(OH)₂ solutions", "question": "Calculate the pH of the following solutions:\n(a) 0.001 M NaOH\n(b) 0.002 M Ca(OH)₂", "approach": "Calculate [OH-], pOH = -log[OH-], pH = 14 - pOH.", "solution": "<p><strong>(a) 0.001 M NaOH:</strong> $[OH^-] = 10^{-3}\\text{ M} \\implies \\text{pOH} = 3.0 \\implies \\text{pH} = 14 - 3 = \\mathbf{11.00}$.</p><p><strong>(b) 0.002 M Ca(OH)₂:</strong> $[OH^-] = 2 \\times 0.002 = 0.004\\text{ M} \\implies \\text{pOH} = -\\log(4 \\times 10^{-3}) = 3 - 0.602 = 2.398 \\implies \\text{pH} = 14 - 2.40 = \\mathbf{11.60}$.</p>", "verified": "(a) pH = 11.00; (b) pH = 11.60"}, {"num": "6.40", "title": "pH and pOH of 0.05 M Ba(OH)₂", "question": "Calculate [H⁺], [OH⁻], pH and pOH for a 0.05 M Ba(OH)₂ solution at 298 K.", "approach": "[OH-] = 2 × 0.05 M = 0.1 M, pOH = 1, pH = 13, [H+] = 10^-13 M.", "solution": "<p>$$\\text{Ba(OH)}_2 \\longrightarrow \\text{Ba}^{2+} + 2\\,\\text{OH}^-$$<ul><li>$[\\text{OH}^-] = 2 \\times 0.05\\text{ M} = \\mathbf{0.10\\text{ M}}$</li><li>$\\text{pOH} = -\\log_{10}(0.10) = \\mathbf{1.00}$</li><li>$\\text{pH} = 14 - \\text{pOH} = 14 - 1 = \\mathbf{13.00}$</li><li>$[\\text{H}^+] = 10^{-13}\\text{ M}$</li></ul></p>", "verified": "[OH⁻] = 0.1 M, pOH = 1.0, pH = 13.0, [H⁺] = 10⁻¹³ M"}, {"num": "6.41", "title": "Hydrogen ion concentration in soft drinks at pH 3.8", "question": "The concentration of hydrogen ion in a sample of soft drink is 3.8 × 10⁻³ M. What is its pH?", "approach": "pH = -log[H+] = -log(3.8 × 10^-3).", "solution": "<p>$$\\text{pH} = -\\log_{10}(3.8 \\times 10^{-3}) = 3 - \\log_{10}(3.8) = 3 - 0.58 = \\mathbf{2.42}$$</p>", "verified": "pH = 2.42"}, {"num": "6.42", "title": "pH of vinegar with [H⁺] = 3.6 × 10⁻³ M", "question": "The pH of a sample of vinegar is 3.76. Calculate the concentration of hydrogen ion in it.", "approach": "[H+] = 10^(-pH) = 10^(-3.76).", "solution": "<p>$$[H^+] = 10^{-3.76} = 10^{0.24 - 4} = 10^{0.24} \\times 10^{-4} = \\mathbf{1.74 \\times 10^{-4}\\text{ M}}$$</p>", "verified": "[H⁺] = 1.74 × 10⁻⁴ M"}, {"num": "6.43", "title": "Ionization constant of HF and degree of dissociation", "question": "The ionization constant of HF is 3.2 × 10⁻⁴. Calculate the degree of dissociation of HF in its 0.02 M solution. Calculate the concentration of all species present (H₃O⁺, F⁻ and HF) in the solution and its pH.", "approach": "Ka = Cα^2 / (1 - α). Check if α < 0.05.", "solution": "<p>$\\alpha = \\sqrt{K_a / C} = \\sqrt{3.2 \\times 10^{-4} / 0.02} = \\sqrt{0.016} = \\mathbf{0.126\\; (12.6\\%)}$.</p><p>Using exact quadratic: $\\alpha = 0.119$.</p><p>$[H^+] = [F^-] = C\\alpha = 0.02 \\times 0.119 = \\mathbf{2.38 \\times 10^{-3}\\text{ M}}$, $[HF] = 0.02(1 - 0.119) = \\mathbf{0.0176\\text{ M}}$.</p><p>$\\text{pH} = -\\log(2.38 \\times 10^{-3}) = 3 - 0.377 = \\mathbf{2.62}$.</p>", "verified": "α = 0.12, [H⁺] = [F⁻] = 2.38 × 10⁻³ M, [HF] = 0.0176 M, pH = 2.62"}, {"num": "6.44", "title": "pH of 0.08 M hypochlorous acid solution", "question": "The ionization constant of hypochlorous acid (HOCl) is 2.5 × 10⁻⁸. Calculate the pH of 0.08 M solution of HOCl.", "approach": "[H+] = sqrt(Ka · C), pH = -log[H+].", "solution": "<p>$$[H^+] = \\sqrt{K_a \\cdot C} = \\sqrt{2.5 \\times 10^{-8} \\times 0.08} = \\sqrt{2.0 \\times 10^{-9}} = \\sqrt{20 \\times 10^{-10}} = 4.47 \\times 10^{-5}\\text{ M}$$$$\\text{pH} = -\\log_{10}(4.47 \\times 10^{-5}) = 5 - 0.65 = \\mathbf{4.35}$$</p>", "verified": "pH = 4.35"}, {"num": "6.45", "title": "Ionization constant of propanoic acid from pH", "question": "The pH of 0.1 M solution of cyanic acid (HCNO) is 2.34. Calculate the ionization constant of the acid and its degree of ionization in the solution.", "approach": "[H+] = 10^-2.34 = 4.57 × 10^-3 M. α = [H+] / C = 4.57 × 10^-2. Ka = Cα^2 / (1 - α).", "solution": "<p>$[H^+] = 10^{-2.34} = 4.57 \\times 10^{-3}\\text{ M}$.</p><p>$\\alpha = \\frac{4.57 \\times 10^{-3}}{0.1} = \\mathbf{0.0457\\; (4.57\\%)}$.</p><p>$$K_a = \\frac{C\\alpha^2}{1 - \\alpha} = \\frac{0.1 \\times (0.0457)^2}{1 - 0.0457} = \\frac{0.1 \\times 0.002088}{0.9543} = \\mathbf{2.19 \\times 10^{-4}}$$</p>", "verified": "α = 0.0457 (4.57%), Ka = 2.19 × 10⁻⁴"}, {"num": "6.46", "title": "Degree of ionization of weak base hydrazine", "question": "The ionization constant of nitrous acid is 4.5 × 10⁻⁴. Calculate the degree of hydrolysis of 0.04 M sodium nitrite and pH of the solution.", "approach": "Kh = Kw / Ka = 10^-14 / 4.5e-4 = 2.22 × 10^-11. h = sqrt(Kh / C). pH = 7 + 0.5 pKa + 0.5 log C.", "solution": "<p>$$K_h = \\frac{K_w}{K_a} = \\frac{10^{-14}}{4.5 \\times 10^{-4}} = 2.22 \\times 10^{-11}$$$$h = \\sqrt{\\frac{K_h}{C}} = \\sqrt{\\frac{2.22 \\times 10^{-11}}{0.04}} = \\sqrt{5.55 \\times 10^{-10}} = \\mathbf{2.36 \\times 10^{-5}}$$</p><p>$$[OH^-] = C \\cdot h = 0.04 \\times (2.36 \\times 10^{-5}) = 9.44 \\times 10^{-7}\\text{ M} \\implies \\text{pOH} = 6.03 \\implies \\text{pH} = \\mathbf{7.97}$$</p>", "verified": "h = 2.36 × 10⁻⁵, pH = 7.97"}, {"num": "6.47", "title": "pH of pyridinium chloride solution", "question": "A 0.02 M solution of pyridinium hydrochloride has pH = 3.44. Calculate the ionization constant of pyridine.", "approach": "Salt of weak base + strong acid: pH = 7 - 0.5 pKb - 0.5 log C.", "solution": "<p>$$3.44 = 7 - \\frac{1}{2}\\text{pK}_b - \\frac{1}{2}\\log_{10}(0.02) = 7 - \\frac{1}{2}\\text{pK}_b - \\frac{1}{2}(-1.699) = 7 - \\frac{1}{2}\\text{pK}_b + 0.85$$</p><p>$$\\frac{1}{2}\\text{pK}_b = 7.85 - 3.44 = 4.41 \\implies \\text{pK}_b = 8.82$$$$K_b = 10^{-8.82} = \\mathbf{1.51 \\times 10^{-9}}$$</p>", "verified": "Kb = 1.51 × 10⁻⁹"}, {"num": "6.48", "title": "pH and degree of ionization of chloroacetic acid", "question": "Calculate the degree of ionization of 0.05 M chloroacetic acid (Ka = 1.35 × 10⁻³).", "approach": "Since Ka is moderately large (~10^-3), solve quadratic Cα^2 + Ka α - Ka = 0.", "solution": "<p>$$0.05\\alpha^2 + 1.35 \\times 10^{-3}\\alpha - 1.35 \\times 10^{-3} = 0$$$$\\alpha = \\frac{-1.35 \\times 10^{-3} + \\sqrt{(1.35 \\times 10^{-3})^2 + 4(0.05)(1.35 \\times 10^{-3})}}{2(0.05)} = \\mathbf{0.151\\; (15.1\\%)}$$</p>", "verified": "α = 0.151 (15.1%)"}, {"num": "6.49", "title": "pH of fluoroacetic acid and [H⁺]", "question": "Calculate the pH of 0.01 M solution of fluoroacetic acid (Ka = 2.6 × 10⁻³).", "approach": "Solve quadratic for α: 0.01 α^2 + 2.6e-3 α - 2.6e-3 = 0.", "solution": "<p>Solving quadratic yields $\\alpha = 0.403$.</p><p>$$[H^+] = C\\alpha = 0.01 \\times 0.403 = 4.03 \\times 10^{-3}\\text{ M}$$$$\\text{pH} = -\\log_{10}(4.03 \\times 10^{-3}) = 3 - 0.605 = \\mathbf{2.39}$$</p>", "verified": "pH = 2.39"}, {"num": "6.50", "title": "pH of bromoacetic acid from degree of ionization", "question": "The degree of ionization of a 0.1 M bromoacetic acid solution is 0.132. Calculate the pH of the solution and its pKa.", "approach": "[H+] = C·α = 0.1 × 0.132 = 0.0132 M => pH = -log(0.0132). Ka = Cα^2 / (1 - α).", "solution": "<p>$$[H^+] = 0.1 \\times 0.132 = 0.0132\\text{ M} \\implies \\text{pH} = -\\log_{10}(0.0132) = \\mathbf{1.88}$$</p><p>$$K_a = \\frac{0.1 \\times (0.132)^2}{1 - 0.132} = \\frac{0.001742}{0.868} = 2.01 \\times 10^{-3} \\implies \\text{pK}_a = \\mathbf{2.70}$$</p>", "verified": "pH = 1.88, pKa = 2.70"}, {"num": "6.51", "title": "pH of dimethylamine solution", "question": "The pH of 0.005 M codeine (C₁₈H₂₁NO₃) solution is 9.95. Calculate its ionization constant Kb and pKb.", "approach": "pH = 9.95 => pOH = 14 - 9.95 = 4.05 => [OH-] = 8.91 × 10^-5 M. Kb = [OH-]^2 / C.", "solution": "<p>$\\text{pOH} = 14 - 9.95 = 4.05 \\implies [OH^-] = 10^{-4.05} = 8.91 \\times 10^{-5}\\text{ M}$.</p><p>$$K_b = \\frac{[OH^-]^2}{C} = \\frac{(8.91 \\times 10^{-5})^2}{0.005} = \\frac{7.94 \\times 10^{-9}}{0.005} = \\mathbf{1.59 \\times 10^{-6} \\implies \\text{pK}_b = 5.80}$$</p>", "verified": "Kb = 1.59 × 10⁻⁶, pKb = 5.80"}, {"num": "6.52", "title": "Degree of ionization of aniline in water and in NaOH", "question": "What is the degree of ionization of 0.01 M aniline solution? (Kb = 4.27 × 10⁻¹⁰). What is the degree of ionization if the solution is also 0.01 M in NaOH?", "approach": "In pure water: α = sqrt(Kb / C). In 0.01 M NaOH: common ion OH- suppresses ionization.", "solution": "<p><strong>1. In pure water:</strong>$$\\alpha = \\sqrt{\\frac{K_b}{C}} = \\sqrt{\\frac{4.27 \\times 10^{-10}}{0.01}} = \\sqrt{4.27 \\times 10^{-8}} = \\mathbf{2.07 \\times 10^{-4}\\; (0.021\\%)}$$</p><p><strong>2. In 0.01 M NaOH:</strong> $[OH^-] \\approx 0.01\\text{ M}$.$$K_b = \\frac{[\\text{C}_6\\text{H}_5\\text{NH}_3^+][\\text{OH}^-]}{[\\text{C}_6\\text{H}_5\\text{NH}_2]} = \\frac{(C\\alpha')(0.01)}{C} \\implies \\alpha' = \\frac{K_b}{0.01} = \\frac{4.27 \\times 10^{-10}}{0.01} = \\mathbf{4.27 \\times 10^{-8}}$$</p>", "verified": "In water: α = 2.07 × 10⁻⁴; in NaOH: α = 4.27 × 10⁻⁸"}, {"num": "6.53", "title": "Ionization constant of propanoic acid and pH of sodium propanoate", "question": "The ionization constant of propanoic acid is 1.32 × 10⁻⁵. Calculate the degree of ionization of the acid in its 0.05 M solution and also its pH. What will be its degree of ionization if the solution is 0.01 M in HCl?", "approach": "In pure solution: α = sqrt(Ka/C). In 0.01 M HCl: common ion H+ suppresses ionization: α' = Ka / 0.01.", "solution": "<p>1. In pure water: $\\alpha = \\sqrt{1.32 \\times 10^{-5} / 0.05} = \\mathbf{1.62 \\times 10^{-2}\\; (1.62\\%)}$. $[H^+] = C\\alpha = 8.12 \\times 10^{-4}\\text{ M} \\implies \\text{pH} = \\mathbf{3.09}$.</p><p>2. In $0.01\\text{ M } HCl$: $[H^+] \\approx 0.01\\text{ M} \\implies \\alpha' = \\frac{1.32 \\times 10^{-5}}{0.01} = \\mathbf{1.32 \\times 10^{-3}\\; (0.13\\%)}$.</p>", "verified": "Pure: α = 0.0162, pH = 3.09; in HCl: α = 1.32 × 10⁻³"}, {"num": "6.54", "title": "pH of 0.1 M hydroxylamine hydrochloride", "question": "The ionization constant of dimethylamine is 5.4 × 10⁻⁴. Calculate its degree of ionization in its 0.02 M solution. What percentage of dimethylamine is ionized if the solution is also 0.1 M in NaOH?", "approach": "In pure solution: α = sqrt(Kb/C). In 0.1 M NaOH: α' = Kb / 0.1.", "solution": "<p>In pure water: $\\alpha = \\sqrt{5.4 \\times 10^{-4} / 0.02} = \\sqrt{0.027} = \\mathbf{0.164\\; (16.4\\%)}$.</p><p>In $0.1\\text{ M } NaOH$: $\\alpha' = \\frac{5.4 \\times 10^{-4}}{0.1} = 5.4 \\times 10^{-3} = \\mathbf{0.54\\%}$.</p>", "verified": "Pure: 16.4%; in NaOH: 0.54%"}, {"num": "6.55", "title": "Hydrogen ion concentration in biological fluids", "question": "Calculate the hydrogen ion concentration in the following biological fluids whose pH are given below:\n(a) Human muscle-fluid, 6.83\n(b) Human stomach fluid, 1.20\n(c) Human blood, 7.38\n(d) Human saliva, 6.40", "approach": "Apply [H+] = 10^(-pH).", "solution": "<p><strong>(a) Muscle-fluid (pH 6.83):</strong> $[H^+] = 10^{-6.83} = 10^{0.17 - 7} = 1.48 \\times 10^{-7}\\text{ M}$.</p><p><strong>(b) Stomach fluid (pH 1.20):</strong> $[H^+] = 10^{-1.20} = 10^{0.80 - 2} = 6.31 \\times 10^{-2}\\text{ M}$.</p><p><strong>(c) Human blood (pH 7.38):</strong> $[H^+] = 10^{-7.38} = 10^{0.62 - 8} = 4.17 \\times 10^{-8}\\text{ M}$.</p><p><strong>(d) Human saliva (pH 6.40):</strong> $[H^+] = 10^{-6.40} = 10^{0.60 - 7} = 3.98 \\times 10^{-7}\\text{ M}$.</p>", "verified": "(a) 1.48 × 10⁻⁷ M; (b) 6.31 × 10⁻² M; (c) 4.17 × 10⁻⁸ M; (d) 3.98 × 10⁻⁷ M"}, {"num": "6.56", "title": "pH of milk, coffee, tomato juice, egg white", "question": "The pH of milk, black coffee, tomato juice, lemon juice and egg white are 6.8, 5.0, 4.2, 2.2 and 7.8 respectively. Calculate corresponding hydrogen ion concentration in each.", "approach": "[H+] = 10^(-pH).", "solution": "<p>Milk (6.8): $[H^+] = 1.58 \\times 10^{-7}\\text{ M}$; Coffee (5.0): $[H^+] = 1.0 \\times 10^{-5}\\text{ M}$; Tomato juice (4.2): $[H^+] = 6.31 \\times 10^{-5}\\text{ M}$; Lemon juice (2.2): $[H^+] = 6.31 \\times 10^{-3}\\text{ M}$; Egg white (7.8): $[H^+] = 1.58 \\times 10^{-8}\\text{ M}$.</p>", "verified": "Milk: 1.58e-7; Coffee: 1.0e-5; Tomato: 6.31e-5; Lemon: 6.31e-3; Egg: 1.58e-8 M"}, {"num": "6.57", "title": "Solubility of AgCl in water and common ion solutions", "question": "If 0.561 g of KOH is dissolved in water to give 200 mL of solution at 298 K, calculate the concentrations of potassium, hydrogen and hydroxyl ions. What is its pH?", "approach": "Moles KOH = 0.561 / 56.1 = 0.01 mol. [OH-] = 0.01 / 0.2 = 0.05 M. pOH = 1.30, pH = 12.70.", "solution": "<p>Moles of $KOH = 0.561 / 56.1 = 0.010\\text{ mol}$. In $200\\text{ mL} = 0.20\\text{ L}$:</p><p>$[K^+] = [OH^-] = 0.010 / 0.20 = \\mathbf{0.050\\text{ M}}$.</p><p>$[H^+] = \\frac{10^{-14}}{0.050} = \\mathbf{2.0 \\times 10^{-13}\\text{ M}}$.</p><p>$\\text{pH} = -\\log_{10}(2.0 \\times 10^{-13}) = 13 - 0.301 = \\mathbf{12.70}$.</p>", "verified": "[K⁺] = [OH⁻] = 0.05 M, [H⁺] = 2.0 × 10⁻¹³ M, pH = 12.70"}, {"num": "6.58", "title": "Solubility product of BaSO₄ from solubility", "question": "The solubility of Sr(OH)₂ at 298 K is 19.23 g/L of solution. Calculate the concentrations of strontium and hydroxyl ions and the pH of the solution.", "approach": "Molar mass Sr(OH)2 = 121.6 g/mol. S = 19.23 / 121.6 = 0.158 M. [Sr2+] = 0.158 M, [OH-] = 0.316 M.", "solution": "<p>$Molar\\; mass = 87.6 + 2(17) = 121.6\\text{ g/mol}$.</p><p>Molar solubility $S = 19.23 / 121.6 = 0.1581\\text{ M}$.</p><p>$[\\text{Sr}^{2+}] = \\mathbf{0.158\\text{ M}}$, $[\\text{OH}^-] = 2 \\times 0.1581 = \\mathbf{0.316\\text{ M}}$.</p><p>$\\text{pOH} = -\\log(0.316) = 0.50 \\implies \\text{pH} = 14 - 0.50 = \\mathbf{13.50}$.</p>", "verified": "[Sr²⁺] = 0.158 M, [OH⁻] = 0.316 M, pH = 13.50"}, {"num": "6.59", "title": "Ionization constant of weak base pyridine", "question": "The ionization constant of propanoic acid is 1.32 × 10⁻⁵. What is the pH of a solution containing 0.1 M propanoic acid and 0.05 M sodium propanoate?", "approach": "Henderson-Hasselbalch equation: pH = pKa + log([Salt]/[Acid]).", "solution": "<p>$\\text{pK}_a = -\\log_{10}(1.32 \\times 10^{-5}) = 5 - 0.12 = 4.88$.</p><p>$$\\text{pH} = \\text{pK}_a + \\log_{10}\\left(\\frac{[\\text{Salt}]}{[\\text{Acid}]}\\right) = 4.88 + \\log_{10}\\left(\\frac{0.05}{0.10}\\right) = 4.88 + \\log_{10}(0.5) = 4.88 - 0.301 = \\mathbf{4.58}$$</p>", "verified": "pH = 4.58"}, {"num": "6.60", "title": "pH of 0.1 M cyanic acid solution", "question": "The pH of 0.1 M solution of cyanic acid (HCNO) is 2.34. Calculate the ionization constant of the acid and its degree of ionization in the solution.", "approach": "[H+] = 10^-2.34 = 4.57 × 10^-3 M. α = 0.0457. Ka = Cα^2 / (1 - α).", "solution": "<p>$[H^+] = 4.57 \\times 10^{-3}\\text{ M} \\implies \\alpha = 4.57 \\times 10^{-2} = \\mathbf{4.57\\%}$.</p><p>$$K_a = \\frac{C\\alpha^2}{1 - \\alpha} = \\frac{0.1 \\times (0.0457)^2}{0.9543} = \\mathbf{2.19 \\times 10^{-4}}$$</p>", "verified": "α = 4.57%, Ka = 2.19 × 10⁻⁴"}, {"num": "6.61", "title": "Equilibrium constant for ester hydrolysis", "question": "If 0.1 M solution of ammonia is 1.34% ionized, calculate the ionization constant of ammonia.", "approach": "α = 0.0134, C = 0.1 M. Kb = Cα^2.", "solution": "<p>$$K_b = C\\alpha^2 = 0.1 \\times (0.0134)^2 = 0.1 \\times 1.796 \\times 10^{-4} = \\mathbf{1.80 \\times 10^{-5}}$$</p>", "verified": "Kb = 1.80 × 10⁻⁵"}, {"num": "6.62", "title": "pH of buffer solution after adding acid or base", "question": "A buffer solution contains 0.20 mol of NH₄Cl and 0.10 mol of NH₃ in 1.0 L. Calculate its pH. (Kb for NH₃ = 1.8 × 10⁻⁵).", "approach": "Basic buffer: pOH = pKb + log([Salt]/[Base]), pH = 14 - pOH.", "solution": "<p>$\\text{pK}_b = -\\log(1.8 \\times 10^{-5}) = 4.74$.</p><p>$$\\text{pOH} = \\text{pK}_b + \\log_{10}\\left(\\frac{[\\text{NH}_4^+]}{[\\text{NH}_3]}\\right) = 4.74 + \\log_{10}\\left(\\frac{0.20}{0.10}\\right) = 4.74 + 0.301 = 5.04$$$$\\text{pH} = 14 - 5.04 = \\mathbf{8.96}$$</p>", "verified": "pH = 8.96"}, {"num": "6.63", "title": "pH of sodium acetate and ammonium acetate solutions", "question": "Calculate the pH of 0.1 M solution of ammonium acetate (CH₃COONH₄), given Ka(CH₃COOH) = 1.8 × 10⁻⁵ and Kb(NH₃) = 1.8 × 10⁻⁵.", "approach": "Salt of weak acid + weak base: pH = 7 + 0.5 pKa - 0.5 pKb.", "solution": "<p>$\\text{pK}_a = 4.76, \\quad \\text{pK}_b = 4.76$.</p><p>$$\\text{pH} = 7 + \\frac{1}{2}\\text{pK}_a - \\frac{1}{2}\\text{pK}_b = 7 + \\frac{1}{2}(4.76) - \\frac{1}{2}(4.76) = \\mathbf{7.00}$$</p>", "verified": "pH = 7.00"}, {"num": "6.64", "title": "Solubility product Ksp of Ag₂CrO₄ and AgBr", "question": "Calculate the solubility of Ag₂CrO₄ in water at 298 K if Ksp = 1.1 × 10⁻¹².", "approach": "Ag2CrO4 ⇌ 2 Ag+ + CrO4^2-. Ksp = (2S)^2 · S = 4S^3 => S = (Ksp / 4)^(1/3).", "solution": "<p>$$K_{sp} = 4S^3 \\implies S = \\left(\\frac{K_{sp}}{4}\\right)^{1/3} = \\left(\\frac{1.1 \\times 10^{-12}}{4}\\right)^{1/3} = (2.75 \\times 10^{-13})^{1/3} = \\mathbf{6.5 \\times 10^{-5}\\text{ mol/L}}$$</p>", "verified": "S = 6.5 × 10⁻⁵ M"}, {"num": "6.65", "title": "Ksp and molar solubility of CaF₂ and PbI₂", "question": "The solubility of CaF₂ in water is 1.7 × 10⁻³ g/100 mL at 298 K. Calculate its solubility product Ksp.", "approach": "Molar mass CaF2 = 78 g/mol. S = (1.7e-3 g / 78 g/mol) / 0.1 L = 2.18 × 10^-4 M. Ksp = 4S^3.", "solution": "<p>$$S = \\frac{1.7 \\times 10^{-3}\\text{ g}}{78\\text{ g/mol} \\times 0.10\\text{ L}} = 2.18 \\times 10^{-4}\\text{ mol L}^{-1}$$</p><p>$$K_{sp} = 4S^3 = 4 \\times (2.18 \\times 10^{-4})^3 = 4 \\times (1.036 \\times 10^{-11}) = \\mathbf{4.14 \\times 10^{-11}}$$</p>", "verified": "Ksp = 4.14 × 10⁻¹¹"}, {"num": "6.66", "title": "Common ion effect on solubility of AgCl in 0.1 M NaCl", "question": "Calculate the solubility of AgCl (Ksp = 1.8 × 10⁻¹⁰) in (a) pure water, (b) 0.1 M NaCl solution.", "approach": "(a) S = sqrt(Ksp). (b) S' = Ksp / [Cl-] = Ksp / 0.1.", "solution": "<p><strong>(a) In pure water:</strong>$$S = \\sqrt{K_{sp}} = \\sqrt{1.8 \\times 10^{-10}} = \\mathbf{1.34 \\times 10^{-5}\\text{ M}}$$</p><p><strong>(b) In 0.1 M NaCl:</strong> $[Cl^-] = 0.1\\text{ M}$.$$S' = \\frac{K_{sp}}{[\\text{Cl}^-]} = \\frac{1.8 \\times 10^{-10}}{0.1} = \\mathbf{1.8 \\times 10^{-9}\\text{ M}}$$</p>", "verified": "(a) S = 1.34 × 10⁻⁵ M; (b) S' = 1.8 × 10⁻⁹ M"}, {"num": "6.67", "title": "Precipitation prediction for BaSO₄ on mixing solutions", "question": "Will a precipitate of BaSO₄ form if 100 mL of 0.001 M BaCl₂ is mixed with 100 mL of 0.0001 M Na₂SO₄? (Ksp of BaSO₄ = 1.1 × 10⁻¹⁰).", "approach": "Equal volumes double total volume (concentrations halved). Qsp = [Ba2+][SO4^2-]. Compare Qsp with Ksp.", "solution": "<p>After mixing: $[\\text{Ba}^{2+}] = 0.001 / 2 = 5.0 \\times 10^{-4}\\text{ M}$, $[\\text{SO}_4^{2-}] = 0.0001 / 2 = 5.0 \\times 10^{-5}\\text{ M}$.</p><p>$$Q_{sp} = [\\text{Ba}^{2+}][\\text{SO}_4^{2-}] = (5.0 \\times 10^{-4}) \\times (5.0 \\times 10^{-5}) = \\mathbf{2.5 \\times 10^{-8}}$$</p><p>Since $Q_{sp} = 2.5 \\times 10^{-8} > K_{sp} = 1.1 \\times 10^{-10}$, the solution is supersaturated and a <strong>PRECIPITATE of BaSO₄ WILL FORM</strong>.</p>", "verified": "Qsp = 2.5 × 10⁻⁸ > Ksp; precipitate will form"}, {"num": "6.68", "title": "Solubility product of Fe(OH)₃ from solubility", "question": "The solubility of Fe(OH)₃ in water is 1.0 × 10⁻¹⁰ mol/L at 298 K. Calculate its solubility product Ksp.", "approach": "Fe(OH)3 ⇌ Fe^3+ + 3 OH-. Ksp = S · (3S)^3 = 27 S^4.", "solution": "<p>$$K_{sp} = 27 S^4 = 27 \\times (1.0 \\times 10^{-10})^4 = 27 \\times 10^{-40} = \\mathbf{2.7 \\times 10^{-39}}$$</p>", "verified": "Ksp = 2.7 × 10⁻³⁹"}, {"num": "6.69", "title": "Minimum volume of water required to dissolve 1 g of CaSO₄", "question": "What is the minimum volume of water required to dissolve 1.0 g of calcium sulphate at 298 K? (Ksp for CaSO₄ is 9.1 × 10⁻⁶; molar mass of CaSO₄ = 136 g/mol).", "approach": "S = sqrt(Ksp) = sqrt(9.1e-6) = 3.017 × 10^-3 M. Moles = 1 / 136 = 7.35 × 10^-3 mol. V = moles / S.", "solution": "<p>$$S = \\sqrt{K_{sp}} = \\sqrt{9.1 \\times 10^{-6}} = 3.017 \\times 10^{-3}\\text{ mol/L}$$</p><p>Moles in $1.0\\text{ g} = 1.0 / 136 = 7.353 \\times 10^{-3}\\text{ mol}$.</p><p>$$V = \\frac{\\text{Moles}}{S} = \\frac{7.353 \\times 10^{-3}\\text{ mol}}{3.017 \\times 10^{-3}\\text{ mol/L}} = \\mathbf{2.44\\text{ L}}$$</p>", "verified": "Volume = 2.44 L"}, {"num": "6.70", "title": "Solubility of silver benzoate in buffer at pH 3.19", "question": "The ionization constant of benzoic acid is 6.46 × 10⁻⁵ and Ksp for silver benzoate is 2.5 × 10⁻¹³. How many times is silver benzoate more soluble in a buffer of pH 3.19 compared to its solubility in pure water?", "approach": "In pure water: S = sqrt(Ksp). In buffer of pH 3.19: [H+] = 6.46 × 10^-4 M, benzoate ion hydrolyzes into benzoic acid.", "solution": "<p><strong>In pure water:</strong> $S_0 = \\sqrt{K_{sp}} = \\sqrt{2.5 \\times 10^{-13}} = 5.0 \\times 10^{-7}\\text{ M}$.</p><p><strong>In buffer (pH 3.19):</strong> $[H^+] = 10^{-3.19} = 6.46 \\times 10^{-4}\\text{ M}$.</p><p>Benzoate fraction $\\alpha_1 = \\frac{K_a}{K_a + [H^+]} = \\frac{6.46 \\times 10^{-5}}{6.46 \\times 10^{-5} + 6.46 \\times 10^{-4}} = \\frac{1}{1 + 10} = \\frac{1}{11}$.</p><p>$$S' = \\sqrt{\\frac{K_{sp}}{\\alpha_1}} = \\sqrt{11 \\times K_{sp}} = \\sqrt{11} \\times S_0 = 3.32 \\times S_0$$</p><p>Silver benzoate is <strong>3.32 times more soluble</strong> in this buffer than in pure water.</p>", "verified": "3.32 times more soluble"}, {"num": "6.71", "title": "Selective precipitation of Ag⁺ and Pb²⁺ with chloride", "question": "A solution contains 0.1 M Ag⁺ and 0.1 M Pb²⁺. If HCl is added gradually, which ion precipitates first? (Ksp of AgCl = 1.8 × 10⁻¹⁰, Ksp of PbCl₂ = 1.7 × 10⁻⁵).", "approach": "Calculate [Cl-] required for precipitation of each cation: [Cl-] = Ksp / [cation].", "solution": "<p>For $AgCl$: $[Cl^-] = \\frac{K_{sp}}{[Ag^+]} = \\frac{1.8 \\times 10^{-10}}{0.1} = \\mathbf{1.8 \\times 10^{-9}\\text{ M}}$.</p><p>For $PbCl_2$: $[Cl^-]^2 = \\frac{K_{sp}}{[Pb^{2+}]} = \\frac{1.7 \\times 10^{-5}}{0.1} = 1.7 \\times 10^{-4} \\implies [Cl^-] = \\mathbf{1.3 \\times 10^{-2}\\text{ M}}$.</p><p>Because $AgCl$ requires a vastly lower chloride concentration ($1.8 \\times 10^{-9}\\text{ M}$ vs $1.3 \\times 10^{-2}\\text{ M}$), <strong>AgCl PRECIPITATES FIRST</strong>.</p>", "verified": "AgCl precipitates first ([Cl⁻] = 1.8 × 10⁻⁹ M vs 1.3 × 10⁻² M for PbCl₂)"}, {"num": "6.72", "title": "Solubility of Fe(OH)₂ at pH 8.0", "question": "What is the maximum concentration of Fe²⁺ ions that can exist in a solution buffered at pH = 8.0 without precipitation of Fe(OH)₂? (Ksp of Fe(OH)₂ = 8.0 × 10⁻¹⁶).", "approach": "pH = 8.0 => pOH = 6.0 => [OH-] = 1.0 × 10^-6 M. [Fe2+]_max = Ksp / [OH-]^2.", "solution": "<p>At $\\text{pH} = 8.0$: $\\text{pOH} = 14 - 8.0 = 6.0 \\implies [\\text{OH}^-] = 1.0 \\times 10^{-6}\\text{ M}$.</p><p>$$[\\text{Fe}^{2+}]_{\\text{max}} = \\frac{K_{sp}}{[\\text{OH}^-]^2} = \\frac{8.0 \\times 10^{-16}}{(1.0 \\times 10^{-6})^2} = \\frac{8.0 \\times 10^{-16}}{1.0 \\times 10^{-12}} = \\mathbf{8.0 \\times 10^{-4}\\text{ M}}$$</p>", "verified": "[Fe²⁺]max = 8.0 × 10⁻⁴ M"}, {"num": "6.73", "title": "Precipitation of metal sulfides in acidic H₂S solution", "question": "The concentration of sulphide ion in 0.1 M HCl solution saturated with hydrogen sulphide is 1.0 × 10⁻¹⁹ M. If 10 mL of this solution is added to 5 mL of 0.04 M solutions of FeSO₄, MnCl₂, ZnCl₂ and CdCl₂, in which of these solutions will precipitation occur?\nKsp: FeS = 6.3 × 10⁻¹⁸, MnS = 2.5 × 10⁻¹³, ZnS = 1.6 × 10⁻²⁴, CdS = 8.0 × 10⁻²⁷.", "approach": "Dilution upon mixing (5 mL + 10 mL = 15 mL): [M2+] = 0.04 × (5/15) = 0.0133 M. [S2-] = 1.0e-19 × (10/15) = 6.67 × 10^-20 M. Qsp = [M2+][S2-] = 8.89 × 10^-22. Compare Qsp with Ksp for each metal.", "solution": "<p><strong>1. Calculate concentrations after mixing (total volume = 15 mL):</strong></p><ul><li>$[\\text{M}^{2+}] = 0.04\\text{ M} \\times \\frac{5}{15} = 0.0133\\text{ M} = 1.33 \\times 10^{-2}\\text{ M}$</li><li>$[\\text{S}^{2-}] = 1.0 \\times 10^{-19}\\text{ M} \\times \\frac{10}{15} = 6.67 \\times 10^{-20}\\text{ M}$</li></ul><p><strong>2. Compute ionic product (Q_sp):</strong></p>$$Q_{sp} = [\\text{M}^{2+}][\\text{S}^{2-}] = (1.33 \\times 10^{-2}) \\times (6.67 \\times 10^{-20}) = \\mathbf{8.89 \\times 10^{-22}}$$</p><p><strong>3. Compare Q_sp with K_sp:</strong></p><ul><li><strong>FeS ($K_{sp} = 6.3 \\times 10^{-18}$):</strong> $Q_{sp} < K_{sp} \\implies$ <strong>No precipitation</strong>.</li><li><strong>MnS ($K_{sp} = 2.5 \\times 10^{-13}$):</strong> $Q_{sp} < K_{sp} \\implies$ <strong>No precipitation</strong>.</li><li><strong>ZnS ($K_{sp} = 1.6 \\times 10^{-24}$):</strong> $Q_{sp} > K_{sp} \\implies$ <strong>PRECIPITATION OCCURS</strong>.</li><li><strong>CdS ($K_{sp} = 8.0 \\times 10^{-27}$):</strong> $Q_{sp} > K_{sp} \\implies$ <strong>PRECIPITATION OCCURS</strong>.</li></ul><p><strong>Conclusion:</strong> Precipitation will occur only in <strong>ZnCl₂ and CdCl₂</strong> solutions.</p>", "verified": "Precipitation occurs in ZnCl2 and CdCl2 (Qsp = 8.89 × 10⁻²² > Ksp)"}], "revision_summary": {"key_laws": [{"name": "Law of Chemical Equilibrium", "formula": "K_c = [C]^c [D]^d / ([A]^a [B]^b)", "context": "Equilibrium constant depends strictly on temperature; pure solids/liquids have unit activity."}, {"name": "Kp vs Kc Relationship", "formula": "K_p = K_c (RT)^{Δn_g}", "context": "Bridges gas partial pressures and molar concentrations; Δn_g = gaseous products − reactants."}, {"name": "Reaction Quotient Direction", "formula": "Q_c < K_c (forward); Q_c = K_c (equilibrium); Q_c > K_c (reverse)", "context": "Predicts spontaneous direction toward equilibrium from non-equilibrium concentrations."}, {"name": "Le Chatelier's Principle", "formula": "System shifts to counteract applied stress (P, T, concentration)", "context": "Pressure ↑ favors fewer gas moles; T ↑ favors endothermic; inert gas at const V has no effect."}, {"name": "Water Autoionization Constant", "formula": "K_w = [H⁺][OH⁻] = 1.0 × 10⁻¹⁴ (at 298 K)", "context": "pH + pOH = 14; in pure water, [H⁺] = [OH⁻] = 10⁻⁷ M."}, {"name": "Weak Acid Ionization (Ostwald)", "formula": "K_a = Cα² / (1 − α) ≈ Cα²; α = √(K_a / C)", "context": "Degree of ionization increases with dilution; [H⁺] = √(K_a · C)."}, {"name": "Conjugate Acid-Base Relation", "formula": "K_a · K_b = K_w = 10⁻¹⁴; pK_a + pK_b = 14", "context": "The stronger the acid, the weaker its conjugate base."}, {"name": "Henderson-Hasselbalch Equation", "formula": "pH = pK_a + log([Salt] / [Acid])", "context": "Calculates buffer pH and demonstrates resistance to pH changes when strong acid/base is added."}, {"name": "Solubility Product & Precipitation", "formula": "K_sp = [A^{y+}]^x [B^{x-}]^y; Precipitation occurs when Q_sp > K_sp", "context": "Governs sparingly soluble salts; common ion suppresses molar solubility S."}], "common_pitfalls": ["Including pure solids or pure liquids in Kc/Kp expressions — their molar concentrations are constant and absorbed into K (activity = 1).", "Assuming adding inert gas always shifts equilibrium — at constant volume, inert gas does NOT change partial pressures or Kc (zero shift); only at constant pressure does it shift toward more gas moles.", "Calculating pH of extremely dilute strong acid (like 10⁻⁸ M HCl) as 8.0 — acid solutions cannot be basic; water autoionization (10⁻⁷ M H⁺) must be added, yielding pH ≈ 6.96.", "Confusing Qsp with Ksp — Ksp is the thermodynamic equilibrium limit in a saturated solution; Qsp is calculated from actual non-equilibrium ion concentrations to test for precipitation.", "Assuming catalysts alter equilibrium composition or Kc — catalysts increase forward and reverse rates equally, accelerating attainment of equilibrium without shifting K."]}};
</script>
<script>
(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp) disp.innerHTML = "t = <b>" + state.t.toFixed(1) + " s</b>";
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Concept View ---
  function renderConcept(idx){
    pause();
    state.conceptIndex = idx;
    state.t = 0;
    state.level = 0;

    var lessons = C.lessons || C.concepts || [];
    var l = lessons[idx];
    if(!l) return;

    var navTitle = l.nav || l.navTitle || l.title || ("Concept " + (idx + 1));

    // Update sidebar navigation active state
    var navBtns = document.querySelectorAll(".concept-nav");
    navBtns.forEach(function(b, i){
      if(b.id === "nav-revision") b.classList.remove("active");
      else b.classList.toggle("active", i === idx);
    });

    // Update top crumb
    var chNum = C.chapterNumber || (C.code ? C.code.replace(/\D/g, '') : "01");
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · " + navTitle.toUpperCase();

    // Show concept view, hide revision
    var cView = document.getElementById("concept-view");
    var rView = document.getElementById("revision-view");
    if(cView) cView.style.display = "block";
    if(rView) rView.style.display = "none";

    var html = "";

    // Concept Header
    var minutes = l.minutes || 10;
    var printPage = l.print || (l.pages ? l.pages.join("–") : (C.page_start ? "pp. " + C.page_start + "–" + C.page_end : ""));
    html += '<div class="concept-header">' +
      '<div class="concept-badge"><span>Concept ' + ("0" + (idx + 1)).slice(-2) + ' / ' + ("0" + lessons.length).slice(-2) + '</span>' +
      (printPage ? '<span class="time-pill">≈ ' + minutes + ' min · ' + printPage + '</span>' : '<span class="time-pill">≈ ' + minutes + ' min</span>') +
      '</div>' +
      '<h1 class="concept-title">' + (l.title || navTitle) + '</h1>' +
      '<p class="concept-deck">' + (l.deck || l.summary || "") + '</p>' +
      '</div>';

    // 01 LEARN BLOCK
    html += '<section class="learn-section" data-block="learn" aria-label="Learn Concept">' +
      '<span class="block-tag">01 · LEARN · CORE ESSENTIALS</span>';

    var quickItems = [];
    if(Array.isArray(l.quick)) {
      quickItems = l.quick;
    } else if(typeof l.quick === 'string' && l.quick) {
      quickItems = [l.quick];
    } else if(Array.isArray(l.summary)) {
      quickItems = l.summary;
    } else if(l.reading_content) {
      quickItems = [l.reading_content];
    } else if(l.summary || l.deck) {
      quickItems = [l.summary || l.deck];
    }

    html += '<div class="quick-summary">' + quickItems.map(function(p){
      if(typeof p !== 'string') return '';
      if(p.includes('<p>') || p.includes('<div>') || p.includes('<h3>')) return p;
      var formatted = p.replace(/###\s+(.*?)\n/g, '<h3 style="margin-top:16px;color:var(--ink);">$1</h3>')
                       .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                       .replace(/\*(.*?)\*/g, '<em>$1</em>')
                       .replace(/\n\n/g, '</p><p>');
      return '<p>' + formatted + '</p>';
    }).join("") + '</div>';

    // Semantic Equations Card
    var formulas = l.formulas || [];
    if(formulas.length){
      html += '<div class="key-equations-card">' +
        '<div class="equations-heading">Key Relations for this Concept</div>' +
        '<div class="eq-grid">' +
        formulas.map(function(eq){
          var label = eq.label || eq.name || "Relation";
          var cond = eq.cond || "";
          var math = eq.html || eq.formula || "";
          return '<div class="eq-row">' +
            '<div class="eq-meta"><span class="eq-label">' + label + '</span>' + (cond ? '<span class="eq-cond">' + cond + '</span>' : '') + '</div>' +
            '<div class="eq-math">' + math + '</div>' +
            '</div>';
        }).join("") +
        '</div></div>';
    }

    // Deeper dive / core takeaways
    if(l.deeper){
      html += '<details class="deep-dive"><summary>Go deeper into the conceptual foundation</summary><p>' + l.deeper + '</p></details>';
    } else if(l.takeaways && l.takeaways.length){
      html += '<details class="deep-dive"><summary>Key Conceptual Takeaways</summary><ul>' +
        l.takeaways.map(function(t){ return '<li>' + t + '</li>'; }).join("") +
        '</ul></details>';
    }

    // Worked Example
    var worked = l.worked || l.worked_example;
    if(worked){
      var workedHtml = typeof worked === 'object' && worked !== null
        ? '<strong>' + (worked.title || 'Worked Example') + '</strong><br>' + (worked.problem || '') +
          (worked.given ? '<br><br><strong>Given:</strong> ' + worked.given : '') +
          (worked.steps ? '<br><strong>Steps:</strong><br>' + worked.steps.map(function(s){ return '&bull; ' + s; }).join('<br>') : '') +
          (worked.solution ? '<br><br><strong>Solution:</strong> ' + worked.solution : '') +
          (worked.answer ? '<br><br><strong>Answer:</strong> ' + worked.answer : '')
        : String(worked);
      html += '<details class="deep-dive"><summary>Worked textbook example step by step</summary><p>' + workedHtml + '</p></details>';
    }

    html += '</section>';

    // 02 PREDICT FIRST BLOCK
    var pred = l.prediction || l.predict || l.predict_first;
    if(pred && typeof pred === 'object' && (pred.prompt || pred.scenario) && pred.options && pred.options.length){
      var promptText = pred.prompt || pred.scenario || "";
      html += '<section class="predict-card" data-block="predict" aria-label="Predict First">' +
        '<div class="predict-badge">02 · PREDICT FIRST · TEST YOUR INTUITION</div>' +
        '<div class="predict-prompt">' + promptText.replace(/\n/g, '<br>') + '</div>' +
        '<div class="predict-options" id="predict-options">' +
        pred.options.map(function(opt, oi){
          return '<label class="predict-option"><input type="radio" name="predict_ans" value="' + oi + '"><span>' + opt + '</span></label>';
        }).join("") +
        '</div>' +
        '<div class="predict-actions">' +
        '<button class="btn-primary" id="btn-check-prediction">Check Prediction</button>' +
        '<button class="btn-secondary" id="btn-skip-prediction">Skip to Lab</button>' +
        '</div>' +
        '<div id="predict-feedback-box" class="predict-feedback" style="display:none;"></div>' +
        '</section>';
    }

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();
    var whatWatch = (pred && pred.prompt) ? pred.prompt : (typeof l.predict === 'string' ? l.predict : "Explore the interactive simulation controls, parameters, and readouts below.");
    html += '<section class="lab-card" data-block="play" aria-label="Interactive Laboratory">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +
      '<div id="sim-mount-point" class="sim-mount-container" style="width:100%;min-height:220px;margin-top:12px;">' +
        '<div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 720 300" role="img" aria-label="' + simTitle + '"></svg></div>' +
        '<div class="lab-legend" id="lab-legend"></div>' +
        '<div class="lab-toolbar" id="legacy-lab-toolbar">' +
          '<button class="toolbar-btn primary" id="btn-play-pause" aria-label="Play animation">▶ Play</button>' +
          '<button class="toolbar-btn" id="btn-step-fwd" aria-label="Step forward">⏭ Step (+0.5s)</button>' +
          '<button class="toolbar-btn" id="btn-reset-time" aria-label="Reset timeline">↺ Reset</button>' +
          '<span class="time-display" id="time-display">t = <b>0.0 s</b></span>' +
          '<div class="scrubber-wrap">' +
            '<input type="range" id="time-scrubber" class="timeline-scrubber" min="0" max="6" step="0.1" value="0" aria-label="Timeline time scrubber">' +
          '</div>' +
        '</div>' +
        '<div class="preset-bar" id="preset-bar"></div>' +
        '<div class="lab-controls-grid" id="lab-controls"></div>' +
        '<div class="lab-readout" id="lab-readout" role="status" aria-live="polite"></div>' +
        '<div class="lab-verdict" id="lab-verdict" role="status" aria-live="polite"></div>' +
      '</div>' +
      '</section>';

    // 04 CONNECT BLOCK
    var rawConnect = l.connect || [];
    var connectItems = [];
    if (typeof rawConnect === 'string' && rawConnect.trim()) {
      connectItems = [{ title: "Real-World Application", text: rawConnect }];
    } else if (Array.isArray(rawConnect)) {
      connectItems = rawConnect;
    } else if (rawConnect && typeof rawConnect === 'object') {
      connectItems = [rawConnect];
    }

    if(connectItems.length){
      html += '<section class="connect-section" data-block="connect" aria-label="Real World Connections">' +
        '<span class="block-tag">04 · CONNECT · REAL WORLD APPLICATIONS</span>' +
        '<div class="connect-grid">' +
        connectItems.map(function(item){
          var title = typeof item === 'string' ? "Real World Application" : (Array.isArray(item) ? item[0] : (item.title || "Real World Context"));
          var desc = typeof item === 'string' ? item : (Array.isArray(item) ? item[1] : (item.text || item.desc || ""));
          var links = (typeof item === 'object' && item !== null) ? (Array.isArray(item) ? (item[2] || []) : (item.links || (item.link ? [{t: "Read Deeply", u: item.link}] : []))) : [];
          var v = (typeof item === 'object' && item !== null) ? (Array.isArray(item) ? (item[3] || null) : (item.video || null)) : null;
          var wow = /^Wow/i.test(title);

          var cHtml = '<div class="connect-card' + (wow ? ' wow' : '') + '"' + (wow ? (links[0] && links[0].u ? ' data-wow data-source="' + links[0].u + '"' : ' data-wow') : '') + '>';
          if(wow) cHtml += '<span class="wow-badge">WOW · REAL WORLD</span>';
          cHtml += '<h3>' + title + '</h3><p>' + desc + '</p>';
          if(v && v.id){
            cHtml += '<button class="video-facade" data-yt="' + v.id + '" aria-label="Play video: ' + v.title + '">' +
              '<span class="thumb" aria-hidden="true"></span>' +
              '<span class="play-btn">▶</span>' +
              '<span class="video-title">' + v.title + ' · ' + v.channel + '</span>' +
              '</button>';
          }
          if(links && links.length){
            cHtml += '<p style="margin-top:10px;font-size:12px;color:var(--muted)">References: ' +
              links.map(function(a){ return '<a href="' + (a.u || a.link || "#") + '" target="_blank" rel="noopener">' + (a.t || a.label || "Read Deeply") + ' ↗</a>'; }).join(", ") +
              '</p>';
          }
          cHtml += '</div>';
          return cHtml;
        }).join("") +
        '</div></section>';
    }

    // 05 PRACTICE BLOCK
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(quizzes.length){
      html += '<section class="practice-section" data-block="practice" aria-label="Practice and Mastery">' +
        '<span class="block-tag">05 · PRACTICE · MULTI-TIER CHALLENGE</span>' +
        '<div class="practice-nav">';
      for(var qi = 0; qi < quizzes.length; qi++){
        var tierName = qi === 0 ? "Tier 1: Easy" : (qi === 1 ? "Tier 2: Medium" : (qi === 2 ? "Tier 3: Hard" : "Question " + (qi + 1)));
        html += '<button class="level-tab' + (qi === 0 ? ' active' : '') + '" data-lvl="' + qi + '">' + tierName + '</button>';
      }
      html += '</div>' +
        '<div id="quiz-container"></div>' +
        '</section>';
    }

    // 06 REVISE CALLOUT
    var recall = l.recall || (l.takeaways && l.takeaways.length ? l.takeaways[0] : (l.core_takeaways && l.core_takeaways.length ? l.core_takeaways[0] : "Reflect on how this concept connects to physical reality."));
    html += '<div class="revise-callout"><strong>06 · REVISE · SAY IT IN YOUR OWN WORDS:</strong> ' + recall + '</div>';

    // Footer Navigation
    var nextNav = idx < lessons.length - 1 ? (lessons[idx + 1].nav || lessons[idx + 1].navTitle || lessons[idx + 1].title || ("Concept " + (idx + 2))) : "";
    html += '<div class="concept-footer-nav">' +
      (idx > 0 ? '<button class="btn-secondary" id="btn-prev-concept">← Concept ' + ("0" + idx).slice(-2) + '</button>' : '<span></span>') +
      (idx < lessons.length - 1 ? '<button class="btn-primary" id="btn-next-concept">Concept ' + ("0" + (idx + 2)).slice(-2) + ': ' + nextNav + ' →</button>' : '<button class="btn-primary" id="btn-goto-revision">Chapter Revision & Exercises →</button>') +
      '</div>';

    cView.innerHTML = html;

    // Attach Prediction Listeners
    var btnCheckPred = document.getElementById("btn-check-prediction");
    var btnSkipPred = document.getElementById("btn-skip-prediction");
    if(btnCheckPred && pred){
      btnCheckPred.addEventListener("click", function(){
        var sel = document.querySelector('input[name="predict_ans"]:checked');
        var fb = document.getElementById("predict-feedback-box");
        if(!sel){
          fb.style.display = "block";
          fb.className = "predict-feedback revealed";
          fb.textContent = "Please select one of the predictions first.";
          return;
        }
        var chosen = Number(sel.value);
        var expectedAns = pred.answer !== undefined ? pred.answer : (pred.correct !== undefined ? pred.correct : 0);
        var isRight = chosen === expectedAns;
        fb.style.display = "block";
        fb.className = "predict-feedback " + (isRight ? "correct" : "revealed");
        fb.innerHTML = (isRight ? "<b>Spot on!</b> " : "<b>Good thought! Here is the physical principle:</b> ") + (pred.explanation || "");
      });
    }
    if(btnSkipPred && pred){
      btnSkipPred.addEventListener("click", function(){
        var fb = document.getElementById("predict-feedback-box");
        fb.style.display = "block";
        fb.className = "predict-feedback revealed";
        fb.innerHTML = "<b>Key Principle:</b> " + (pred.explanation || "");
      });
    }

    // Attach Timeline Controls for legacy SIMS
    var btnPP = document.getElementById("btn-play-pause");
    if(btnPP) btnPP.addEventListener("click", function(){ if(state.playing) pause(); else play(); });
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep) btnStep.addEventListener("click", function(){ step(0.5); });
    var btnResTime = document.getElementById("btn-reset-time");
    if(btnResTime) btnResTime.addEventListener("click", function(){ resetTimeline(); });
    var scrub = document.getElementById("time-scrubber");
    if(scrub) scrub.addEventListener("input", function(e){ seekTimeline(e.target.value); });

    // Footer Next/Prev listeners
    var btnPrev = document.getElementById("btn-prev-concept");
    var btnNext = document.getElementById("btn-next-concept");
    var btnRev = document.getElementById("btn-goto-revision");
    if(btnPrev) btnPrev.addEventListener("click", function(){ renderConcept(idx - 1); window.scrollTo(0,0); });
    if(btnNext) btnNext.addEventListener("click", function(){ renderConcept(idx + 1); window.scrollTo(0,0); });
    if(btnRev) btnRev.addEventListener("click", function(){ renderRevision(); window.scrollTo(0,0); });

    // Mount Active Simulation Engine
    var simMount = document.getElementById("sim-mount-point");
    if(simMount){
      var cKey = "c" + (idx + 1);
      var conceptId = l.id || ("concept-" + (idx + 1));
      var simId = l.sim || conceptId;

      // 1. window.mountSimulation (iemh101, iemh102)
      if(typeof window.mountSimulation === 'function'){
        simMount.innerHTML = "";
        window.mountSimulation(cKey, simMount);
      }
      // 2. window.SIM_ENGINES (iemh101-iemh105)
      else if(window.SIM_ENGINES && window.SIM_ENGINES[cKey] && typeof window.SIM_ENGINES[cKey].init === 'function'){
        simMount.innerHTML = "";
        window.SIM_ENGINES[cKey].init(simMount);
      }
      // 3. window.SimEngine (iemh106-iemh108)
      else if(window.SimEngine && typeof window.SimEngine.init === 'function'){
        var targetKey = null;
        var candidateKeys = [conceptId, "sim-" + conceptId, "sim-concept-" + (idx + 1), "concept-" + (idx + 1), simId, cKey];
        for(var k = 0; k < candidateKeys.length; k++){
          if(candidateKeys[k] && window.SimEngine.getEngine(candidateKeys[k])){
            targetKey = candidateKeys[k];
            break;
          }
        }
        if(targetKey){
          simMount.innerHTML = "";
          window.SimEngine.init(targetKey, simMount);
        }
      }
      // 4. window.SIMS (iesc101-iesc113)
      else if(window.SIMS && (window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey])){
        var simObj = window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey];
        if(typeof simObj.mount === 'function'){
          if(simObj.mount.length >= 1 && !simObj.draw){
            simMount.innerHTML = "";
            simObj.mount(simMount);
          } else {
            simObj.mount(l);
          }
        }
      }
    }

    // Render Quiz for current level
    renderQuiz();

    // Attach Practice Level Tabs
