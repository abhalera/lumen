ntrated H2SO4 readily oxidizes 2 Br^- to reddish-brown elemental bromine vapour: 2 NaBr + 2 H2SO4 -> Na2SO4 + SO2 + Br2(g) + 2 H2O."], "answer": "(a) Alcohol acts as a mutual homogenizing solvent for non-polar toluene and polar KMnO4; (b) H2SO4 is not strong enough to oxidize Cl^- (+1.36 V), yielding HCl; but easily oxidizes Br^- (+1.09 V) to red Br2 vapour."}, {"q": "7.13", "number": "7.13", "title": "Identification of oxidised/reduced species, oxidants, and reductants", "conceptIdx": 0, "page": 19, "printPage": 253, "question": "Identify the substance oxidised, reduced, oxidising agent and reducing agent for each of the following reactions: (a) 2 AgBr(s) + C6H6O2(aq) -> 2 Ag(s) + 2 HBr(aq) + C6H4O2(aq); (b) HCHO(l) + 2 [Ag(NH3)2]+(aq) + 3 OH^-(aq) -> 2 Ag(s) + HCOO^-(aq) + 4 NH3(aq) + 2 H2O(l); (c) HCHO(l) + 2 Cu2+(aq) + 5 OH^-(aq) -> Cu2O(s) + HCOO^-(aq) + 3 H2O(l); (d) N2H4(l) + 2 H2O2(l) -> N2(g) + 4 H2O(l); (e) Pb(s) + PbO2(s) + 2 H2SO4(aq) -> 2 PbSO4(s) + 2 H2O(l).", "steps": ["(a) Ag in AgBr (+1 -> 0): reduced (AgBr is oxidant). C6H6O2 (hydroquinone): C increases (-1 in C6H6O2 to 0 in quinone C6H4O2): oxidised (C6H6O2 is reductant).", "(b) Ag in [Ag(NH3)2]+ (+1 -> 0): reduced (Tollens reagent is oxidant). C in HCHO (0 -> +2 in HCOO^-): oxidised (HCHO is reductant).", "(c) Cu in Cu2+ (+2 -> +1 in Cu2O): reduced (Cu2+ is oxidant). C in HCHO (0 -> +2 in HCOO^-): oxidised (HCHO is reductant).", "(d) N in N2H4 (-2 -> 0 in N2): oxidised (N2H4 is reductant). O in H2O2 (-1 -> -2 in H2O): reduced (H2O2 is oxidant).", "(e) Pb(s) (0 -> +2 in PbSO4): oxidised (Pb is reductant). Pb in PbO2 (+4 -> +2 in PbSO4): reduced (PbO2 is oxidant)."], "answer": "(a) Oxidised: C6H6O2, Reduced: AgBr, Oxidant: AgBr, Reductant: C6H6O2; (b) Oxidised: HCHO, Reduced: [Ag(NH3)2]+, Oxidant: [Ag(NH3)2]+, Reductant: HCHO; (c) Oxidised: HCHO, Reduced: Cu2+, Oxidant: Cu2+, Reductant: HCHO; (d) Oxidised: N2H4, Reduced: H2O2, Oxidant: H2O2, Reductant: N2H4; (e) Oxidised: Pb, Reduced: PbO2, Oxidant: PbO2, Reductant: Pb."}, {"q": "7.14", "number": "7.14", "title": "Differential reaction of thiosulphate with iodine and bromine", "conceptIdx": 2, "page": 19, "printPage": 253, "question": "Consider the reactions: 2 S2O3^2-(aq) + I2(s) -> S4O6^2-(aq) + 2 I^-(aq); S2O3^2-(aq) + 2 Br2(l) + 5 H2O(l) -> 2 SO4^2-(aq) + 4 Br^-(aq) + 10 H+(aq). Why does the same reductant, thiosulphate, react differently with iodine and bromine?", "steps": ["Bromine is a substantially stronger oxidising agent than iodine because E°(Br2/Br^-) = +1.09 V, whereas E°(I2/I^-) = +0.54 V.", "Iodine, being a mild oxidant, oxidizes sulfur in thiosulphate (average O.N. = +2) only partially to tetrathionate (S4O6^2-, average O.N. = +2.5).", "Bromine, being a much more powerful oxidant, completely oxidizes sulfur from +2 all the way to its maximum possible oxidation state of +6 in sulfate ion (SO4^2-).", "Hence, the difference in product arises from the differing standard oxidation potentials of halogens (Br2 >> I2)."], "answer": "Bromine is a stronger oxidising agent (E° = +1.09 V) than iodine (E° = +0.54 V), oxidising S in S2O3^2- completely to SO4^2- (+6), whereas iodine only oxidises it mildly to S4O6^2- (+2.5)."}, {"q": "7.15", "number": "7.15", "title": "Fluorine as the best oxidant and HI as the best reductant among hydrohalic acids", "conceptIdx": 6, "page": 19, "printPage": 253, "question": "Justify giving reactions that among halogens, fluorine is the best oxidant and among hydrohalic compounds, hydroiodic acid is the best reductant.", "steps": ["(1) Fluorine as the strongest oxidant: Fluorine oxidizes all other halide ions (Cl^-, Br^-, I^-) in solution to their elemental states: F2 + 2 X^- -> 2 F^- + X2 (where X = Cl, Br, I). It even oxidizes water to oxygen: 2 F2(g) + 2 H2O(l) -> 4 HF(aq) + O2(g). Standard reduction potential of F2 is the highest of all chemical elements (+2.87 V).", "(2) Hydroiodic acid (HI) as the strongest reductant: Iodide ion has the largest ionic radius and lowest ionization/hydration energy among halides, losing electrons most readily. HI reduces sulfuric acid to hydrogen sulfide: 8 HI + H2SO4 -> 4 I2 + H2S + 4 H2O (HCl cannot reduce H2SO4, and HBr only reduces it to SO2). HI also readily reduces Fe3+ to Fe2+: 2 Fe3+ + 2 I^- -> 2 Fe2+ + I2."], "answer": "F2 has the highest reduction potential (+2.87 V) and oxidises all halides and water; HI has the lowest bond dissociation enthalpy and readily reduces H2SO4 to H2S and Fe3+ to Fe2+."}, {"q": "7.16", "number": "7.16", "title": "Spontaneity of perxenate fluorination and oxidizing power of Na4XeO6", "conceptIdx": 6, "page": 19, "printPage": 253, "question": "Why does the following reaction occur? XeO6^4-(aq) + 2 F^-(aq) + 6 H+(aq) -> XeO3(g) + F2(g) + 3 H2O(l). What conclusion about the compound Na4XeO6 (of which XeO6^4- is a part) can be drawn from the reaction?", "steps": ["The reaction shows that perxenate ion (XeO6^4-) oxidizes fluoride ion (F^-) to elemental fluorine gas (F2).", "Elemental fluorine is the strongest known chemical oxidising agent with a standard reduction potential E°(F2/F^-) = +2.87 V.", "For XeO6^4- to oxidize F^- to F2, the standard reduction potential of the perxenate couple (XeO6^4- / XeO3) must be even more positive than +2.87 V (E° > +2.87 V) in acidic medium.", "Conclusion: Sodium perxenate (Na4XeO6) is an exceptionally powerful and ferocious oxidising agent, stronger than elemental fluorine under these conditions."], "answer": "The reaction occurs because the reduction potential of XeO6^4- exceeds that of F2 (+2.87 V). Na4XeO6 is an extraordinarily powerful oxidising agent, capable of oxidising fluoride to fluorine gas."}, {"q": "7.17", "number": "7.17", "title": "Inference regarding the oxidizing behaviour of Ag+ vs Cu2+", "conceptIdx": 6, "page": 19, "printPage": 254, "question": "Consider the reactions: (a) H3PO2(aq) + 4 AgNO3(aq) + 2 H2O(l) -> H3PO4(aq) + 4 Ag(s) + 4 HNO3(aq); (b) H3PO2(aq) + 2 CuSO4(aq) + 2 H2O(l) -> H3PO4(aq) + 2 Cu(s) + H2SO4(aq); (c) C6H5CHO(l) + 2 [Ag(NH3)2]+(aq) + 3 OH^-(aq) -> C6H5COO^-(aq) + 2 Ag(s) + 4 NH3(aq) + 2 H2O(l); (d) C6H5CHO(l) + 2 Cu2+(aq) + 5 OH^-(aq) -> No change observed. What inference do you draw about the behaviour of Ag+ and Cu2+ from these reactions?", "steps": ["Reactions (a) and (b) show that both Ag+ and Cu2+ can oxidize hypophosphorous acid (H3PO2), which is a very strong reducing agent.", "However, when reacted with benzaldehyde (C6H5CHO, a weaker reducing agent), Ag+ (as Tollens reagent [Ag(NH3)2]+) readily oxidizes benzaldehyde to benzoate ion, depositing a silver mirror (reaction c).", "In contrast, Cu2+ (Fehling's solution) fails completely to oxidize benzaldehyde (reaction d).", "This proves that Ag+ has a higher standard reduction potential (E° = +0.80 V) than Cu2+ (E° = +0.34 V).", "Inference: Ag+ is a stronger oxidising agent than Cu2+."], "answer": "Ag+ is a stronger oxidising agent than Cu2+. Both oxidize strong reductants like H3PO2, but only Ag+ can oxidize weaker reductants like benzaldehyde."}, {"q": "7.18", "number": "7.18", "title": "Balancing four redox reactions by the ion-electron method", "conceptIdx": 3, "page": 20, "printPage": 254, "question": "Balance the following redox reactions by ion–electron method: (a) MnO4^-(aq) + I^-(aq) -> MnO2(s) + I2(s) (in basic medium); (b) MnO4^-(aq) + SO2(g) -> Mn2+(aq) + HSO4^-(aq) (in acidic solution); (c) H2O2(aq) + Fe2+(aq) -> Fe3+(aq) + H2O(l) (in acidic solution); (d) Cr2O7^2-(aq) + SO2(g) -> Cr3+(aq) + SO4^2-(aq) (in acidic solution).", "steps": ["(a) Basic medium: Oxidation: 2 I^- -> I2 + 2 e- (x3 => 6 I^- -> 3 I2 + 6 e-). Reduction: MnO4^- + 2 H2O + 3 e- -> MnO2 + 4 OH^- (x2 => 2 MnO4^- + 4 H2O + 6 e- -> 2 MnO2 + 8 OH^-). Adding: 2 MnO4^-(aq) + 6 I^-(aq) + 4 H2O(l) -> 2 MnO2(s) + 3 I2(s) + 8 OH^-(aq).", "(b) Acidic medium: Oxidation: SO2 + 2 H2O -> HSO4^- + 3 H+ + 2 e- (x5). Reduction: MnO4^- + 8 H+ + 5 e- -> Mn2+ + 4 H2O (x2). Adding: 2 MnO4^- + 5 SO2 + 16 H+ + 10 H2O -> 2 Mn2+ + 5 HSO4^- + 15 H+ + 8 H2O. Simplifying H+ and H2O: 2 MnO4^-(aq) + 5 SO2(g) + 2 H2O(l) + H+(aq) -> 2 Mn2+(aq) + 5 HSO4^-(aq).", "(c) Acidic medium: Oxidation: Fe2+ -> Fe3+ + e- (x2). Reduction: H2O2 + 2 H+ + 2 e- -> 2 H2O. Adding: 2 Fe2+(aq) + H2O2(aq) + 2 H+(aq) -> 2 Fe3+(aq) + 2 H2O(l).", "(d) Acidic medium: Oxidation: SO2 + 2 H2O -> SO4^2- + 4 H+ + 2 e- (x3). Reduction: Cr2O7^2- + 14 H+ + 6 e- -> 2 Cr3+ + 7 H2O. Adding: Cr2O7^2- + 3 SO2 + 14 H+ + 6 H2O -> 2 Cr3+ + 3 SO4^2- + 12 H+ + 7 H2O. Simplifying: Cr2O7^2-(aq) + 3 SO2(g) + 2 H+(aq) -> 2 Cr3+(aq) + 3 SO4^2-(aq) + H2O(l)."], "answer": "(a) 2 MnO4^- + 6 I^- + 4 H2O -> 2 MnO2 + 3 I2 + 8 OH^-; (b) 2 MnO4^- + 5 SO2 + 2 H2O + H+ -> 2 Mn2+ + 5 HSO4^-; (c) 2 Fe2+ + H2O2 + 2 H+ -> 2 Fe3+ + 2 H2O; (d) Cr2O7^2- + 3 SO2 + 2 H+ -> 2 Cr3+ + 3 SO4^2- + H2O."}, {"q": "7.19", "number": "7.19", "title": "Balancing equations in basic medium and identifying oxidants and reductants", "conceptIdx": 3, "page": 20, "printPage": 254, "question": "Balance the following equations in basic medium by ion-electron method and oxidation number methods and identify the oxidising agent and the reducing agent: (a) P4(s) + OH^-(aq) -> PH3(g) + H2PO2^-(aq); (b) N2H4(l) + ClO3^-(aq) -> NO(g) + Cl^-(g); (c) Cl2O7(g) + H2O2(aq) -> ClO2^-(aq) + O2(g) + H+.", "steps": ["(a) P4 is both oxidized and reduced (disproportionation). P4 acts as both oxidant and reductant. Reduction: P4 + 12 H2O + 12 e- -> 4 PH3 + 12 OH^-. Oxidation: P4 + 8 OH^- -> 4 H2PO2^- + 4 e- (x3 => 3 P4 + 24 OH^- -> 12 H2PO2^- + 12 e-). Adding: 4 P4 + 12 H2O + 12 OH^- -> 4 PH3 + 12 H2PO2^-. Dividing by 4: P4(s) + 3 OH^-(aq) + 3 H2O(l) -> PH3(g) + 3 H2PO2^-(aq).", "(b) Oxidation: N2H4 + 8 OH^- -> 2 NO + 6 H2O + 8 e- (x3). Reduction: ClO3^- + 3 H2O + 6 e- -> Cl^- + 6 OH^- (x4). Adding: 3 N2H4 + 4 ClO3^- -> 6 NO + 4 Cl^- + 6 H2O. Oxidant: ClO3^-; Reductant: N2H4.", "(c) Basic medium: Reduction: Cl2O7 + 3 H2O + 8 e- -> 2 ClO2^- + 6 OH^-. Oxidation: H2O2 + 2 OH^- -> O2 + 2 H2O + 2 e- (x4 => 4 H2O2 + 8 OH^- -> 4 O2 + 8 H2O + 8 e-). Adding: Cl2O7(g) + 4 H2O2(aq) + 2 OH^-(aq) -> 2 ClO2^-(aq) + 4 O2(g) + 5 H2O(l). Oxidant: Cl2O7; Reductant: H2O2."], "answer": "(a) P4 + 3 OH^- + 3 H2O -> PH3 + 3 H2PO2^- (P4 is both oxidant and reductant); (b) 3 N2H4 + 4 ClO3^- -> 6 NO + 4 Cl^- + 6 H2O (Oxidant: ClO3^-, Reductant: N2H4); (c) Cl2O7 + 4 H2O2 + 2 OH^- -> 2 ClO2^- + 4 O2 + 5 H2O (Oxidant: Cl2O7, Reductant: H2O2)."}, {"q": "7.20", "number": "7.20", "title": "Information drawn from cyanogen disproportionation in basic medium", "conceptIdx": 2, "page": 20, "printPage": 254, "question": "What sorts of information can you draw from the following reaction? (CN)2(g) + 2 OH^-(aq) -> CN^-(aq) + CNO^-(aq) + H2O(l).", "steps": ["(1) Redox Classification: In cyanogen (CN)2, carbon has O.N. +3 (bonded to N -3). In cyanide (CN^-), carbon is +2. In cyanate (CNO^-), carbon is +4. Carbon is simultaneously reduced (+3 -> +2) and oxidised (+3 -> +4). Therefore, this is a disproportionation redox reaction.", "(2) Pseudohalogen Character: The reaction is entirely analogous to halogen disproportionation in alkaline medium: Cl2 + 2 OH^- -> Cl^- + ClO^- + H2O. This demonstrates that cyanogen (CN)2 acts as a pseudohalogen, and CN^- / CNO^- act as pseudohalide ions.", "(3) Medium Dependence: The reaction requires basic medium (OH^-) to proceed spontaneously."], "answer": "1. It is a disproportionation redox reaction (C changes from +3 to +2 and +4). 2. Cyanogen behaves as a pseudohalogen, mimicking chlorine's alkaline disproportionation."}, {"q": "7.21", "number": "7.21", "title": "Disproportionation of unstable Mn3+ ion in aqueous solution", "conceptIdx": 2, "page": 20, "printPage": 254, "question": "The Mn3+ ion is unstable in solution and undergoes disproportionation to give Mn2+, MnO2, and H+ ion. Write a balanced ionic equation for the reaction.", "steps": ["Identify the two half-reactions for Mn3+ disproportionation:", "Reduction: Mn3+ gains 1 electron to form Mn2+: Mn3+(aq) + e- -> Mn2+(aq).", "Oxidation: Mn3+ loses 1 electron to form MnO2 (Mn in +4): Mn3+(aq) + 2 H2O(l) -> MnO2(s) + 4 H+(aq) + e-.", "Both half-reactions involve 1 electron. Adding them directly:", "Mn3+(aq) + e- + Mn3+(aq) + 2 H2O(l) -> Mn2+(aq) + MnO2(s) + 4 H+(aq) + e-.", "Cancel the electron on both sides: 2 Mn3+(aq) + 2 H2O(l) -> Mn2+(aq) + MnO2(s) + 4 H+(aq)."], "answer": "2 Mn3+(aq) + 2 H2O(l) -> Mn2+(aq) + MnO2(s) + 4 H+(aq)"}, {"q": "7.22", "number": "7.22", "title": "Oxidation state profiles of Cs, Ne, I, and F", "conceptIdx": 1, "page": 20, "printPage": 254, "question": "Consider the elements: Cs, Ne, I and F. (a) Identify the element that exhibits only negative oxidation state. (b) Identify the element that exhibits only positive oxidation state. (c) Identify the element that exhibits both positive and negative oxidation states. (d) Identify the element which exhibits neither negative nor positive oxidation state.", "steps": ["(a) Fluorine (F): Being the most electronegative element of all, fluorine strictly exhibits an oxidation state of -1 in all its compounds (and 0 as F2). It never exhibits a positive oxidation state.", "(b) Cesium (Cs): Being an alkali metal with very low ionization enthalpy, cesium readily loses its single valence electron, exhibiting exclusively the +1 oxidation state in its compounds.", "(c) Iodine (I): Being a halogen with accessible d-orbitals and lower electronegativity, iodine exhibits -1 (in iodides like KI) as well as positive oxidation states: +1 (ICl), +3 (ICl3), +5 (HIO3, IF5), and +7 (IF7, H5IO6).", "(d) Neon (Ne): A noble gas with a completely filled valence octet (2s2 2p6); it forms no known chemical compounds and exists strictly in the 0 oxidation state."], "answer": "(a) F (only -1); (b) Cs (only +1); (c) I (-1 to +7); (d) Ne (only 0, neither positive nor negative)."}, {"q": "7.23", "number": "7.23", "title": "Balanced redox equation for removal of excess chlorine by sulfur dioxide", "conceptIdx": 3, "page": 20, "printPage": 254, "question": "Chlorine is used to purify drinking water. Excess of chlorine is harmful. The excess of chlorine is removed by treating with sulphur dioxide. Present a balanced equation for this redox change taking place in water.", "steps": ["Chlorine (Cl2) acts as the oxidant, being reduced to chloride (Cl^-).", "Sulfur dioxide (SO2) acts as the reductant, being oxidized to sulfate (SO4^2-).", "Reduction half-reaction: Cl2(aq) + 2 e- -> 2 Cl^-(aq).", "Oxidation half-reaction: SO2(g) + 2 H2O(l) -> SO4^2-(aq) + 4 H+(aq) + 2 e-.", "Adding the two half-reactions together (2 electrons cancel):", "Cl2(aq) + SO2(g) + 2 H2O(l) -> 2 Cl^-(aq) + SO4^2-(aq) + 4 H+(aq).", "In molecular form: Cl2 + SO2 + 2 H2O -> 2 HCl + H2SO4."], "answer": "Ionic: Cl2(aq) + SO2(g) + 2 H2O(l) -> 2 Cl^-(aq) + SO4^2-(aq) + 4 H+(aq); Molecular: Cl2 + SO2 + 2 H2O -> 2 HCl + H2SO4."}, {"q": "7.24", "number": "7.24", "title": "Non-metals and metals capable of showing disproportionation reactions", "conceptIdx": 2, "page": 20, "printPage": 254, "question": "Refer to the periodic table and answer the following questions: (a) Select the possible non-metals that can show disproportionation reaction. (b) Select three metals that can show disproportionation reaction.", "steps": ["(a) Non-metals capable of disproportionation: Must have multiple oxidation states and intermediate states available. Examples include Phosphorus (P4 in basic medium -> PH3 + H2PO2^-), Sulfur (S8 in basic medium -> S^2- + S2O3^2-), Chlorine (Cl2 -> Cl^- + ClO^- / ClO3^-), and Bromine (Br2 -> Br^- + BrO3^-).", "(b) Metals capable of disproportionation: Transition and post-transition metals exhibiting multiple oxidation states where an intermediate state is thermodynamically unstable with respect to higher and lower states.", "1. Copper: Cu+ disproportionates in aqueous solution: 2 Cu+(aq) -> Cu2+(aq) + Cu(s).", "2. Manganese: Mn3+ disproportionates: 2 Mn3+(aq) + 2 H2O(l) -> Mn2+(aq) + MnO2(s) + 4 H+(aq); also manganate: 3 MnO4^2- + 4 H+ -> 2 MnO4^- + MnO2 + 2 H2O.", "3. Gallium (or Thallium): Ga+ disproportionates: 3 Ga+(aq) -> Ga3+(aq) + 2 Ga(s)."], "answer": "(a) Non-metals: P, S, Cl, Br; (b) Three metals: Cu (Cu+ -> Cu2+ + Cu), Mn (Mn3+ -> Mn2+ + MnO2), and Ga (Ga+ -> Ga3+ + Ga)."}, {"q": "7.25", "number": "7.25", "title": "Stoichiometry and limiting reagent in Ostwald ammonia oxidation", "conceptIdx": 3, "page": 20, "printPage": 254, "question": "In Ostwald's process for the manufacture of nitric acid, the first step involves the oxidation of ammonia gas by oxygen gas to give nitric oxide gas and steam. What is the maximum weight of nitric oxide that can be obtained starting only with 10.00 g of ammonia and 20.00 g of oxygen?", "steps": ["Balanced chemical equation: 4 NH3(g) + 5 O2(g) -> 4 NO(g) + 6 H2O(g).", "Molar masses: NH3 = 14 + 3 = 17.03 g/mol; O2 = 32.00 g/mol; NO = 14 + 16 = 30.01 g/mol.", "Moles of reactants supplied: n(NH3) = 10.00 g / 17.03 g/mol = 0.5872 mol; n(O2) = 20.00 g / 32.00 g/mol = 0.6250 mol.", "Determine limiting reagent: From stoichiometry, 4 moles of NH3 require 5 moles of O2, i.e., ratio O2/NH3 = 5/4 = 1.25.", "Actual mole ratio: 0.6250 / 0.5872 = 1.064 < 1.25. Therefore, O2 is the limiting reagent.", "Moles of NO formed = (4/5) * moles of O2 = (4/5) * 0.6250 mol = 0.5000 mol.", "Mass of NO = 0.5000 mol * 30.01 g/mol = 15.00 g."], "answer": "Oxygen is the limiting reagent; maximum weight of nitric oxide (NO) obtained is 15.00 g."}, {"q": "7.26", "number": "7.26", "title": "Predicting feasibility of redox reactions using standard electrode potentials", "conceptIdx": 6, "page": 20, "printPage": 254, "question": "Using standard electrode potentials, predict if the reaction between the following is feasible: (a) Fe3+(aq) and I^-(aq), (b) Ag+(aq) and Cu(s), (c) Fe3+(aq) and Cu(s), (d) Ag(s) and Fe3+(aq), (e) Br2(aq) and Fe2+(aq).", "steps": ["Standard reduction potentials: E°(Fe3+/Fe2+) = +0.77 V; E°(I2/I^-) = +0.54 V; E°(Ag+/Ag) = +0.80 V; E°(Cu2+/Cu) = +0.34 V; E°(Br2/Br^-) = +1.09 V.", "(a) Fe3+ + I^-: E°cell = E°(Fe3+/Fe2+) - E°(I2/I^-) = +0.77 V - (+0.54 V) = +0.23 V > 0. Feasible!", "(b) Ag+ + Cu: E°cell = E°(Ag+/Ag) - E°(Cu2+/Cu) = +0.80 V - (+0.34 V) = +0.46 V > 0. Feasible!", "(c) Fe3+ + Cu: E°cell = E°(Fe3+/Fe2+) - E°(Cu2+/Cu) = +0.77 V - (+0.34 V) = +0.43 V > 0. Feasible!", "(d) Ag + Fe3+: Reaction would be Fe3+ + Ag -> Fe2+ + Ag+. E°cell = E°(Fe3+/Fe2+) - E°(Ag+/Ag) = +0.77 V - (+0.80 V) = -0.03 V < 0. Not feasible!", "(e) Br2 + Fe2+: E°cell = E°(Br2/Br^-) - E°(Fe3+/Fe2+) = +1.09 V - (+0.77 V) = +0.32 V > 0. Feasible!"], "answer": "(a) Feasible (E° = +0.23 V); (b) Feasible (E° = +0.46 V); (c) Feasible (E° = +0.43 V); (d) Not feasible (E° = -0.03 V); (e) Feasible (E° = +0.32 V)."}, {"q": "7.27", "number": "7.27", "title": "Predicting products of electrolysis under four distinct conditions", "conceptIdx": 5, "page": 21, "printPage": 255, "question": "Predict the products of electrolysis in each of the following: (i) An aqueous solution of AgNO3 with silver electrodes; (ii) An aqueous solution of AgNO3 with platinum electrodes; (iii) A dilute solution of H2SO4 with platinum electrodes; (iv) An aqueous solution of CuCl2 with platinum electrodes.", "steps": ["(i) AgNO3 with silver electrodes: At cathode: Ag+(aq) + e- -> Ag(s) (silver deposits). At active anode: Ag(s) -> Ag+(aq) + e- (silver anode dissolves into solution). Products: Ag deposited at cathode, Ag dissolved at anode.", "(ii) AgNO3 with inert Pt electrodes: At cathode: Ag+(aq) + e- -> Ag(s) (silver deposits, since E° = +0.80 V > E°(H+/H2)). At inert anode: water is oxidized preferentially over nitrate: 2 H2O(l) -> O2(g) + 4 H+(aq) + 4 e-. Products: Ag at cathode, O2 gas at anode.", "(iii) Dilute H2SO4 with Pt electrodes: At cathode: 2 H+(aq) + 2 e- -> H2(g). At anode: water is oxidized preferentially over sulfate: 2 H2O(l) -> O2(g) + 4 H+(aq) + 4 e-. Products: H2 gas at cathode, O2 gas at anode (electrolysis of water).", "(iv) Aqueous CuCl2 with Pt electrodes: At cathode: Cu2+(aq) + 2 e- -> Cu(s) (E° = +0.34 V > 0.00 V, copper deposits). At anode: Cl^-(aq) is oxidized to Cl2(g) due to lower oxygen overpotential: 2 Cl^-(aq) -> Cl2(g) + 2 e-. Products: Cu metal at cathode, Cl2 gas at anode."], "answer": "(i) Cathode: Ag metal, Anode: Ag dissolves; (ii) Cathode: Ag metal, Anode: O2 gas; (iii) Cathode: H2 gas, Anode: O2 gas; (iv) Cathode: Cu metal, Anode: Cl2 gas."}, {"q": "7.28", "number": "7.28", "title": "Metal displacement order for Al, Cu, Fe, Mg, and Zn", "conceptIdx": 6, "page": 21, "printPage": 255, "question": "Arrange the following metals in the order in which they displace each other from the solution of their salts: Al, Cu, Fe, Mg and Zn.", "steps": ["A metal with a more negative standard reduction potential is more electropositive, a stronger reducing agent, and displaces any metal with a less negative (or positive) potential from its aqueous salt solution.", "Standard reduction potentials (E°):", "Mg2+/Mg = -2.37 V", "Al3+/Al = -1.66 V", "Zn2+/Zn = -0.76 V", "Fe2+/Fe = -0.44 V", "Cu2+/Cu = +0.34 V", "Therefore, Magnesium displaces Al, Zn, Fe, Cu. Aluminum displaces Zn, Fe, Cu. Zinc displaces Fe, Cu. Iron displaces Cu. Copper cannot displace any of them.", "Displacement order: Mg > Al > Zn > Fe > Cu."], "answer": "Mg > Al > Zn > Fe > Cu (Mg displaces all four metals; Cu is displaced by all)."}, {"q": "7.29", "number": "7.29", "title": "Arranging metals in increasing order of reducing power from standard electrode potentials", "conceptIdx": 6, "page": 21, "printPage": 255, "question": "Given the standard electrode potentials: K+/K = -2.93 V, Ag+/Ag = +0.80 V, Hg2+/Hg = +0.79 V, Mg2+/Mg = -2.37 V, Cr3+/Cr = -0.74 V, arrange these metals in their increasing order of reducing power.", "steps": ["Reducing power is the tendency of a metal to lose electrons (undergo oxidation).", "The more negative the standard reduction potential (E°), the greater the tendency to be oxidised, and the stronger the reducing power.", "Conversely, a higher positive E° corresponds to weaker reducing power.", "Given E° values:", "Ag+/Ag = +0.80 V (weakest reducing agent)", "Hg2+/Hg = +0.79 V", "Cr3+/Cr = -0.74 V", "Mg2+/Mg = -2.37 V", "K+/K = -2.93 V (strongest reducing agent)", "Arranging in increasing order of reducing power (from weakest to strongest): Ag < Hg < Cr < Mg < K."], "answer": "Ag < Hg < Cr < Mg < K"}, {"q": "7.30", "number": "7.30", "title": "Galvanic cell depiction, polarity, current carriers, and electrode reactions for Zn-Ag cell", "conceptIdx": 5, "page": 21, "printPage": 255, "question": "Depict the galvanic cell in which the reaction Zn(s) + 2 Ag+(aq) -> Zn2+(aq) + 2 Ag(s) takes place. Further show: (i) which of the electrodes is negatively charged, (ii) the carriers of the current in the cell, and (iii) individual reaction at each electrode.", "steps": ["Cell Depiction (IUPAC): Zn(s) | Zn2+(aq, 1 M) || Ag+(aq, 1 M) | Ag(s).", "(i) Negative electrode: Zinc electrode (anode) undergoes oxidation, releasing electrons onto the metal surface. Hence, the Zinc electrode is negatively charged.", "(ii) Current carriers: In the external circuit (wire), current is carried by electrons flowing from the negative zinc anode to the positive silver cathode (conventional current flows from Ag to Zn). In the internal circuit (electrolytic solution and salt bridge), current is carried by ions (cations migrate toward the cathode; anions migrate toward the anode).", "(iii) Individual electrode reactions:", "At Anode (Oxidation): Zn(s) -> Zn2+(aq) + 2 e-.", "At Cathode (Reduction): Ag+(aq) + e- -> Ag(s) (or 2 Ag+(aq) + 2 e- -> 2 Ag(s))."], "answer": "Cell: Zn(s) | Zn2+(aq) || Ag+(aq) | Ag(s); (i) Zinc electrode is negatively charged (anode); (ii) Electrons in external wire, ions in solution and salt bridge; (iii) Anode: Zn -> Zn2+ + 2e^-, Cathode: Ag+ + e^- -> Ag."}], "revision_summary": {"key_laws": [{"name": "Electronic Definition of Redox", "formula": "Oxidation: de-electronation (loss of e⁻); Reduction: electronation (gain of e⁻)", "context": "OIL RIG mnemonic; electron donor is reductant, electron acceptor is oxidant."}, {"name": "Conservation of Oxidation State", "formula": "∑ (n_i · O.N._i) = 0 (neutral) or z (polyatomic ion)", "context": "Oxidation number is the formal residual charge when bonds are allocated to more electronegative atoms."}, {"name": "Disproportionation Condition", "formula": "Reactant must have intermediate oxidation state (e.g., Cl in Cl₂, P in P₄, O in H₂O₂)", "context": "Element is simultaneously oxidised and reduced; F cannot disproportionate (no positive states)."}, {"name": "Redox Balancing Conservation", "formula": "Total increase in O.N. = Total decrease in O.N. ⟺ Total e⁻ lost = Total e⁻ gained", "context": "Satisfies simultaneous conservation of mass and electrical charge in acidic and basic media."}, {"name": "Daniell Cell EMF", "formula": "E°_cell = E°_cathode − E°_anode = +0.34 V − (−0.76 V) = +1.10 V", "context": "Zn(s) | Zn²⁺(aq) || Cu²⁺(aq) | Cu(s); salt bridge maintains internal circuit electrical neutrality."}, {"name": "Redox Thermodynamic Criterion", "formula": "ΔG° = −n F E°_cell; Spontaneous if E°_cell > 0", "context": "Links electrochemical potential to Gibbs free energy and chemical equilibrium constant (E° = (0.0591/n) log K)."}, {"name": "Electrochemical Displacement Series", "formula": "Metals with E° < 0.00 V liberate H₂ from dilute acids; lower E° displaces higher E° from salt solution", "context": "Governs metal reactivity order: Mg > Al > Zn > Fe > Cu."}], "common_pitfalls": ["Exceeding group valence for maximum oxidation state — S cannot exceed +6, Cr cannot exceed +6, N cannot exceed +5; peroxo linkages (-O-O- with O = -1) resolve apparent fallacies in H₂SO₅, CrO₅, etc.", "Confusing average oxidation number with individual structural oxidation states in molecules like C₃O₂ (terminal C = +2, central C = 0; average = +4/3) and S₄O₆²⁻ (terminal S = +5, central S-S = 0; average = +2.5).", "Using HCl to acidify KMnO₄ sol <script>
(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp) disp.innerHTML = "t = <b>" + state.t.toFixed(1) + " s</b>";
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Concept View ---
  function renderConcept(idx){
    pause();
    state.conceptIndex = idx;
    state.t = 0;
    state.level = 0;

    var lessons = C.lessons || C.concepts || [];
    var l = lessons[idx];
    if(!l) return;

    var navTitle = l.nav || l.navTitle || l.title || ("Concept " + (idx + 1));

    // Update sidebar navigation active state
    var navBtns = document.querySelectorAll(".concept-nav");
    navBtns.forEach(function(b, i){
      if(b.id === "nav-revision") b.classList.remove("active");
      else b.classList.toggle("active", i === idx);
    });

    // Update top crumb
    var rawNum = C.chapterNumber || (C.chapter_meta && C.chapter_meta.number) || (C.code ? C.code.replace(/\D/g, '') : "01");
    var chNum = (!isNaN(parseInt(rawNum))) ? String(rawNum).padStart(2, '0') : rawNum;
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · " + navTitle.toUpperCase();

    // Show concept view, hide revision
    var cView = document.getElementById("concept-view");
    var rView = document.getElementById("revision-view");
    if(cView) cView.style.display = "block";
    if(rView) rView.style.display = "none";

    var html = "";

    // Concept Header
    var minutes = l.minutes || 10;
    var printPage = l.print || (l.pages ? l.pages.join("–") : (C.page_start ? "pp. " + C.page_start + "–" + C.page_end : ""));
    html += '<div class="concept-header">' +
      '<div class="concept-badge"><span>Concept ' + ("0" + (idx + 1)).slice(-2) + ' / ' + ("0" + lessons.length).slice(-2) + '</span>' +
      (printPage ? '<span class="time-pill">≈ ' + minutes + ' min · ' + printPage + '</span>' : '<span class="time-pill">≈ ' + minutes + ' min</span>') +
      '</div>' +
      '<h1 class="concept-title">' + (l.title || navTitle) + '</h1>' +
      '<p class="concept-deck">' + (l.deck || l.summary || "") + '</p>' +
      '</div>';

    // 01 LEARN BLOCK
    html += '<section class="learn-section" data-block="learn" aria-label="Learn Concept">' +
      '<span class="block-tag">01 · LEARN · CORE ESSENTIALS</span>';

    var quickItems = [];
    if(Array.isArray(l.quick)) {
      quickItems = l.quick;
    } else if(typeof l.quick === 'string' && l.quick) {
      quickItems = [l.quick];
    } else if(Array.isArray(l.summary)) {
      quickItems = l.summary;
    } else if(l.reading_content) {
      quickItems = [l.reading_content];
    } else if(l.summary || l.deck) {
      quickItems = [l.summary || l.deck];
    }

    html += '<div class="quick-summary">' + quickItems.map(function(p){
      if(typeof p !== 'string') return '';
      if(p.includes('<p>') || p.includes('<div>') || p.includes('<h3>')) return p;
      var formatted = p.replace(/###\s+(.*?)\n/g, '<h3 style="margin-top:16px;color:var(--ink);">$1</h3>')
                       .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                       .replace(/\*(.*?)\*/g, '<em>$1</em>')
                       .replace(/\n\n/g, '</p><p>');
      return '<p>' + formatted + '</p>';
    }).join("") + '</div>';

    // Semantic Equations Card
    var formulas = l.formulas || [];
    if(formulas.length){
      html += '<div class="key-equations-card">' +
        '<div class="equations-heading">Key Relations for this Concept</div>' +
        '<div class="eq-grid">' +
        formulas.map(function(eq){
          var label = eq.label || eq.name || "Relation";
          var cond = eq.cond || "";
          var math = eq.html || eq.formula || "";
          return '<div class="eq-row">' +
            '<div class="eq-meta"><span class="eq-label">' + label + '</span>' + (cond ? '<span class="eq-cond">' + cond + '</span>' : '') + '</div>' +
            '<div class="eq-math">' + math + '</div>' +
            '</div>';
        }).join("") +
        '</div></div>';
    }

    // Deeper dive / core takeaways
    if(l.deeper){
      html += '<details class="deep-dive"><summary>Go deeper into the conceptual foundation</summary><p>' + l.deeper + '</p></details>';
    } else if(l.takeaways && l.takeaways.length){
      html += '<details class="deep-dive"><summary>Key Conceptual Takeaways</summary><ul>' +
        l.takeaways.map(function(t){ return '<li>' + t + '</li>'; }).join("") +
        '</ul></details>';
    }

    // Worked Example
    var worked = l.worked || l.worked_example;
    if(worked){
      var workedHtml = typeof worked === 'object' && worked !== null
        ? '<strong>' + (worked.title || 'Worked Example') + '</strong><br>' + (worked.problem || '') +
          (worked.given ? '<br><br><strong>Given:</strong> ' + worked.given : '') +
          (worked.steps ? '<br><strong>Steps:</strong><br>' + worked.steps.map(function(s){ return '&bull; ' + s; }).join('<br>') : '') +
          (worked.solution ? '<br><br><strong>Solution:</strong> ' + worked.solution : '') +
          (worked.answer ? '<br><br><strong>Answer:</strong> ' + worked.answer : '')
        : String(worked);
      html += '<details class="deep-dive"><summary>Worked textbook example step by step</summary><p>' + workedHtml + '</p></details>';
    }

    html += '</section>';

    // 02 PREDICT FIRST BLOCK
    var pred = l.prediction || l.predict || l.predict_first;
    if(pred && typeof pred === 'object' && (pred.prompt || pred.scenario) && pred.options && pred.options.length){
      var promptText = pred.prompt || pred.scenario || "";
      html += '<section class="predict-card" data-block="predict" aria-label="Predict First">' +
        '<div class="predict-badge">02 · PREDICT FIRST · TEST YOUR INTUITION</div>' +
        '<div class="predict-prompt">' + promptText.replace(/\n/g, '<br>') + '</div>' +
        '<div class="predict-options" id="predict-options">' +
        pred.options.map(function(opt, oi){
          return '<label class="predict-option"><input type="radio" name="predict_ans" value="' + oi + '"><span>' + opt + '</span></label>';
        }).join("") +
        '</div>' +
        '<div class="predict-actions">' +
        '<button class="btn-primary" id="btn-check-prediction">Check Prediction</button>' +
        '<button class="btn-secondary" id="btn-skip-prediction">Skip to Lab</button>' +
        '</div>' +
        '<div id="predict-feedback-box" class="predict-feedback" style="display:none;"></div>' +
        '</section>';
    }

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();
    var whatWatch = (pred && pred.prompt) ? pred.prompt : (typeof l.predict === 'string' ? l.predict : "Explore the interactive simulation controls, parameters, and readouts below.");
    html += '<section class="lab-card" data-block="play" aria-label="Interactive Laboratory">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +
      '<div id="sim-mount-point" class="sim-mount-container" style="width:100%;min-height:220px;margin-top:12px;">' +
        '<div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 720 300" role="img" aria-label="' + simTitle + '"></svg></div>' +
        '<div class="lab-legend" id="lab-legend"></div>' +
        '<div class="lab-toolbar" id="legacy-lab-toolbar">' +
          '<button class="toolbar-btn primary" id="btn-play-pause" aria-label="Play animation">▶ Play</button>' +
          '<button class="toolbar-btn" id="btn-step-fwd" aria-label="Step forward">⏭ Step (+0.5s)</button>' +
          '<button class="toolbar-btn" id="btn-reset-time" aria-label="Reset timeline">↺ Reset</button>' +
          '<span class="time-display" id="time-display">t = <b>0.0 s</b></span>' +
          '<div class="scrubber-wrap">' +
            '<input type="range" id="time-scrubber" class="timeline-scrubber" min="0" max="6" step="0.1" value="0" aria-label="Timeline time scrubber">' +
          '</div>' +
        '</div>' +
        '<div class="preset-bar" id="preset-bar"></div>' +
        '<div class="lab-controls-grid" id="lab-controls"></div>' +
        '<div class="lab-readout" id="lab-readout" role="status" aria-live="polite"></div>' +
        '<div class="lab-verdict" id="lab-verdict" role="status" aria-live="polite"></div>' +
      '</div>' +
      '</section>';

    // 04 CONNECT BLOCK
    var rawConnect = l.connect || [];
    var connectItems = [];
    if (typeof rawConnect === 'string' && rawConnect.trim()) {
      connectItems = [{ title: "Real-World Application", text: rawConnect }];
    } else if (Array.isArray(rawConnect)) {
      connectItems = rawConnect;
    } else if (rawConnect && typeof rawConnect === 'object') {
      connectItems = [rawConnect];
    }

    if(connectItems.length){
      html += '<section class="connect-section" data-block="connect" aria-label="Real World Connections">' +
        '<span class="block-tag">04 · CONNECT · REAL WORLD APPLICATIONS</span>' +
        '<div class="connect-grid">' +
        connectItems.map(function(item){
          var title = typeof item === 'string' ? "Real World Application" : (Array.isArray(item) ? item[0] : (item.title || "Real World Context"));
          var desc = typeof item === 'string' ? item : (Array.isArray(item) ? item[1] : (item.text || item.desc || ""));
          var links = (typeof item === 'object' && item !== null) ? (Array.isArray(item) ? (item[2] || []) : (item.links || (item.link ? [{t: "Read Deeply", u: item.link}] : []))) : [];
          var v = (typeof item === 'object' && item !== null) ? (Array.isArray(item) ? (item[3] || null) : (item.video || null)) : null;
          var wow = /^Wow/i.test(title);

          var cHtml = '<div class="connect-card' + (wow ? ' wow' : '') + '"' + (wow ? (links[0] && links[0].u ? ' data-wow data-source="' + links[0].u + '"' : ' data-wow') : '') + '>';
          if(wow) cHtml += '<span class="wow-badge">WOW · REAL WORLD</span>';
          cHtml += '<h3>' + title + '</h3><p>' + desc + '</p>';
          if(v && v.id){
            cHtml += '<button class="video-facade" data-yt="' + v.id + '" aria-label="Play video: ' + v.title + '">' +
              '<span class="thumb" aria-hidden="true"></span>' +
              '<span class="play-btn">▶</span>' +
              '<span class="video-title">' + v.title + ' · ' + v.channel + '</span>' +
              '</button>';
          }
          if(links && links.length){
            cHtml += '<p style="margin-top:10px;font-size:12px;color:var(--muted)">References: ' +
              links.map(function(a){ return '<a href="' + (a.u || a.link || "#") + '" target="_blank" rel="noopener">' + (a.t || a.label || "Read Deeply") + ' ↗</a>'; }).join(", ") +
              '</p>';
          }
          cHtml += '</div>';
          return cHtml;
        }).join("") +
        '</div></section>';
    }

    // 05 PRACTICE BLOCK
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(quizzes.length){
      html += '<section class="practice-section" data-block="practice" aria-label="Practice and Mastery">' +
        '<span class="block-tag">05 · PRACTICE · MULTI-TIER CHALLENGE</span>' +
        '<div class="practice-nav">';
      for(var qi = 0; qi < quizzes.length; qi++){
        var tierName = qi === 0 ? "Tier 1: Easy" : (qi === 1 ? "Tier 2: Medium" : (qi === 2 ? "Tier 3: Hard" : "Question " + (qi + 1)));
        html += '<button class="level-tab' + (qi === 0 ? ' active' : '') + '" data-lvl="' + qi + '">' + tierName + '</button>';
      }
      html += '</div>' +
        '<div id="quiz-container"></div>' +
        '</section>';
    }

    // 06 REVISE CALLOUT
    var recall = l.recall || (l.takeaways && l.takeaways.length ? l.takeaways[0] : (l.core_takeaways && l.core_takeaways.length ? l.core_takeaways[0] : "Reflect on how this concept connects to physical reality."));
    html += '<div class="revise-callout"><strong>06 · REVISE · SAY IT IN YOUR OWN WORDS:</strong> ' + recall + '</div>';

    // Footer Navigation
    var nextNav = idx < lessons.length - 1 ? (lessons[idx + 1].nav || lessons[idx + 1].navTitle || lessons[idx + 1].title || ("Concept " + (idx + 2))) : "";
    html += '<div class="concept-footer-nav">' +
      (idx > 0 ? '<button class="btn-secondary" id="btn-prev-concept">← Concept ' + ("0" + idx).slice(-2) + '</button>' : '<span></span>') +
      (idx < lessons.length - 1 ? '<button class="btn-primary" id="btn-next-concept">Concept ' + ("0" + (idx + 2)).slice(-2) + ': ' + nextNav + ' →</button>' : '<button class="btn-primary" id="btn-goto-revision">Chapter Revision & Exercises →</button>') +
      '</div>';

    cView.innerHTML = html;

    // Attach Prediction Listeners
    var btnCheckPred = document.getElementById("btn-check-prediction");
    var btnSkipPred = document.getElementById("btn-skip-prediction");
    if(btnCheckPred && pred){
      btnCheckPred.addEventListener("click", function(){
        var sel = document.querySelector('input[name="predict_ans"]:checked');
        var fb = document.getElementById("predict-feedback-box");
        if(!sel){
          fb.style.display = "block";
          fb.className = "predict-feedback revealed";
          fb.textContent = "Please select one of the predictions first.";
          return;
        }
        var chosen = Number(sel.value);
        var expectedAns = pred.answer !== undefined ? pred.answer : (pred.correct !== undefined ? pred.correct : 0);
        var isRight = chosen === expectedAns;
        fb.style.display = "block";
        fb.className = "predict-feedback " + (isRight ? "correct" : "revealed");
        fb.innerHTML = (isRight ? "<b>Spot on!</b> " : "<b>Good thought! Here is the physical principle:</b> ") + (pred.explanation || "");
      });
    }
    if(btnSkipPred && pred){
      btnSkipPred.addEventListener("click", function(){
        var fb = document.getElementById("predict-feedback-box");
        fb.style.display = "block";
        fb.className = "predict-feedback revealed";
        fb.innerHTML = "<b>Key Principle:</b> " + (pred.explanation || "");
      });
    }

    // Attach Timeline Controls for legacy SIMS
    var btnPP = document.getElementById("btn-play-pause");
    if(btnPP) btnPP.addEventListener("click", function(){ if(state.playing) pause(); else play(); });
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep) btnStep.addEventListener("click", function(){ step(0.5); });
    var btnResTime = document.getElementById("btn-reset-time");
    if(btnResTime) btnResTime.addEventListener("click", function(){ resetTimeline(); });
    var scrub = document.getElementById("time-scrubber");
    if(scrub) scrub.addEventListener("input", function(e){ seekTimeline(e.target.value); });

    // Footer Next/Prev listeners
    var btnPrev = document.getElementById("btn-prev-concept");
    var btnNext = document.getElementById("btn-next-concept");
    var btnRev = document.getElementById("btn-goto-revision");
    if(btnPrev) btnPrev.addEventListener("click", function(){ renderConcept(idx - 1); window.scrollTo(0,0); });
    if(btnNext) btnNext.addEventListener("click", function(){ renderConcept(idx + 1); window.scrollTo(0,0); });
    if(btnRev) btnRev.addEventListener("click", function(){ renderRevision(); window.scrollTo(0,0); });

    // Mount Active Simulation Engine
    var simMount = document.getElementById("sim-mount-point");
    if(simMount){
      var cKey = "c" + (idx + 1);
      var conceptId = l.id || ("concept-" + (idx + 1));
      var simId = l.sim || conceptId;

      // 1. window.mountSimulation (iemh101, iemh102)
      if(typeof window.mountSimulation === 'function'){
        simMount.innerHTML = "";
        window.mountSimulation(cKey, simMount);
      }
      // 2. window.SIM_ENGINES (iemh101-iemh105)
      else if(window.SIM_ENGINES && window.SIM_ENGINES[cKey] && typeof window.SIM_ENGINES[cKey].init === 'function'){
        simMount.innerHTML = "";
        window.SIM_ENGINES[cKey].init(simMount);
      }
      // 3. window.SimEngine (iemh106-iemh108)
      else if(window.SimEngine && typeof window.SimEngine.init === 'function'){
        var targetKey = null;
        var candidateKeys = [conceptId, "sim-" + conceptId, "sim-concept-" + (idx + 1), "concept-" + (idx + 1), simId, cKey];
        for(var k = 0; k < candidateKeys.length; k++){
          if(candidateKeys[k] && window.SimEngine.getEngine(candidateKeys[k])){
            targetKey = candidateKeys[k];
            break;
          }
        }
        if(targetKey){
          simMount.innerHTML = "";
          window.SimEngine.init(targetKey, simMount);
        }
      }
      // 4. window.SIMS (iesc101-iesc113)
      else if(window.SIMS && (window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey])){
        var simObj = window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey];
        if(typeof simObj.mount === 'function'){
          if(simObj.mount.length >= 1 && !simObj.draw){
            simMount.innerHTML = "";
            simObj.mount(simMount);
          } else {
            simObj.mount(l);
          }
        }
      }
    }

    // Render Quiz for current level
    renderQuiz();

    // Attach Practice Level Tabs
    var lvlTabs = document.querySelectorAll(".level-tab");
    lvlTabs.forEach(function(tab){
      tab.addEventListener("click", function(){
        lvlTabs.forEach(function(t){ t.classList.remove("active"); });
        tab.classList.add("active");
        state.level = Number(tab.getAttribute("data-lvl"));
        renderQuiz();
      });
    });

    // Update URL hash
    window.location.hash = "#concept-" + (idx + 1);
  }

  // --- Render Quiz ---
  function renderQuiz(){
    var lessons = C.lessons || C.concepts || [];
    var l = lessons[state.conceptIndex];
    if(!l) return;
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(!quizzes.length) return;
    var q = quizzes[state.level] || quizzes[0];
    if(!q) return;

    var qk = qKey(state.conceptIndex, state.level);
    var old = state.answers[qk] || {};

    var box = document.getElementById("quiz-container");
    if(!box) return;

    var promptText = q.prompt || q.question || "";
    var isMcq = q.type === "mcq" || (q.options && q.options.length > 0);
    var correctAns = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : 0);
    var solutionText = q.solution || q.explanation || "";
    var hintText = q.hint || "Review the key relationships in the concept overview above.";

    var html = '<div class="question-prompt">' + promptText + '</div>';
    if(isMcq && q.options){
      html += '<div class="quiz-options">' +
        q.options.map(function(opt, oi){
          var checked = old.value === String(oi) ? " checked" : "";
          return '<label class="quiz-option"><input type="radio" name="quiz_ans" value="' + oi + '"' + checked + '><span>' + opt + '</span></label>';
        }).join("") +
        '</div>';
    } else {
      html += '<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">' +
        '<input type="number" step="any" id="quiz_num_ans" placeholder="Your answer" value="' + (old.value || "") + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;width:160px;">' +
        '<span style="font-weight:600;color:var(--muted);">' + (q.unit || "") + '</span>' +
        '</div>';
    }

    html += '<div class="quiz-actions">' +
      '<button class="btn-primary" id="btn-submit-quiz">Submit Answer</button>' +
      '<button class="btn-secondary" id="btn-toggle-hint">Show Hint</button>' +
      '</div>' +
      '<div id="quiz-hint-box" class="quiz-hint" style="display:none;">' + hintText + '</div>' +
      '<div id="quiz-feedback-box" class="quiz-feedback" style="display:none;"></div>';

    box.innerHTML = html;

    // Hint toggle
    var hintBtn = document.getElementById("btn-toggle-hint");
    if(hintBtn){
      hintBtn.addEventListener("click", function(){
        var hb = document.getElementById("quiz-hint-box");
        if(hb) hb.style.display = hb.style.display === "none" ? "block" : "none";
      });
    }

    // Submit listener
    var submitBtn = document.getElementById("btn-submit-quiz");
    if(submitBtn){
      submitBtn.addEventListener("click", function(){
        var fb = document.getElementById("quiz-feedback-box");
        if(!fb) return;
        var isRight = false;
        var userVal = "";

        if(isMcq){
          var sel = document.querySelector('input[name="quiz_ans"]:checked');
          if(!sel){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please select an answer choice first.";
            return;
          }
          userVal = sel.value;
          isRight = Number(userVal) === Number(correctAns);
        } else {
          var inp = document.getElementById("quiz_num_ans");
          if(!inp || inp.value.trim() === ""){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please enter a numerical answer.";
            return;
          }
          userVal = inp.value.trim();
          var num = parseFloat(userVal);
          isRight = Math.abs(num - parseFloat(correctAns)) <= (q.tolerance || 0.05);
        }

        state.answers[qk] = { value: userVal, checked: true };
        if(isRight){
          state.correct[qk] = true;
          fb.style.display = "block";
          fb.className = "quiz-feedback success";
          fb.innerHTML = "<b>That’s right!</b> " + solutionText;
        } else {
          fb.style.display = "block";
          fb.className = "quiz-feedback retry";
          var wrongMsg = (isMcq && q.wrong && q.wrong[Number(userVal)]) ? q.wrong[Number(userVal)] : hintText;
          fb.innerHTML = "<b>Not quite.</b> " + wrongMsg + "<br><small style=\"margin-top:6px;display:block;\"><b>Full explanation:</b> " + solutionText + "</small>";
        }
        updateProgress();
      });
    }

    if(old.checked && submitBtn){
      submitBtn.click();
    }
  }

  // --- Render Revision View ---
  var currentExFilter = -1;

  function renderRevision(){
    pause();
    document.querySelectorAll(".concept-nav").forEach(function(b){ b.classList.remove("active"); });
    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.classList.add("active");

    var rawNum = C.chapterNumber || (C.chapter_meta && C.chapter_meta.number) || (C.code ? C.code.replace(/\D/g, '') : "01");
    var chNum = (!isNaN(parseInt(rawNum))) ? String(rawNum).padStart(2, '0') : rawNum;
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · NCERT EXERCISES & REVISION";

    var cView = document.getElementById("concept-view");
    var revView = document.getElementById("revision-view");
    if(cView) cView.style.display = "none";
    if(revView) revView.style.display = "block";

    var exList = C.exercises || [];
    if(!exList.length && C.exerciseMap){
      exList = C.exerciseMap.map(function(m){
        return {
          q: m[0],
          number: String(m[0]),
          title: m[1],
          conceptIdx: m[2],
          page: m[3],
          printPage: 47 + m[3],
          question: m[4] || m[1],
          steps: [m[5] || "Refer to concept explanation."],
          answer: m[5] || ""
        };
      });
    }

    var totalEx = exList.length;
    var html = '<div class="concept-header">' +
      '<span class="concept-badge">NCERT EXERCISE COMPENDIUM</span>' +
      '<h1 class="concept-title">Revise, Reflect, Refine</h1>' +
      '<p class="concept-deck">All ' + totalEx + ' exercises from NCERT Class 11 Physics with comprehensive step-by-step pedagogical solutions.</p>' +
      '</div>';

    // Filter Bar & Expand/Collapse All
    var lessons = C.lessons || C.concepts || [];
    html += '<div class="exercise-compendium-header">' +
      '<div class="exercise-filter-bar">' +
      '<button class="filter-chip ' + (currentExFilter === -1 ? 'active' : '') + '" data-cfilter="-1">All Exercises (' + totalEx + ')</button>' +
      lessons.map(function(l, li){
        var nav = l.nav || l.navTitle || l.title || ("C0" + (li+1));
        return '<button class="filter-chip ' + (currentExFilter === li ? 'active' : '') + '" data-cfilter="' + li + '">C0' + (li+1) + ': ' + nav + '</button>';
      }).join("") +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn-secondary" id="btn-expand-all" style="padding:6px 12px;font-size:13px;">Expand All Guidance</button>' +
      '<button class="btn-secondary" id="btn-collapse-all" style="padding:6px 12px;font-size:13px;">Collapse All</button>' +
      '</div>' +
      '</div>';

    // Exercise Cards List
    html += '<div id="exercise-cards-container">';
    var filtered = currentExFilter === -1 ? exList : exList.filter(function(e){
      return e.conceptIdx === currentExFilter || (e.section && e.section.includes(String(currentExFilter + 1)));
    });

    html += filtered.map(function(ex, eIdx){
      var qNum = ex.number || ex.q || (eIdx + 1);
      var sectionLabel = ex.section ? ('<span class="q-badge" style="background:#e0f2fe;color:#0369a1;margin-right:6px;">' + ex.section + '</span>') : '';
      var l = (ex.conceptIdx !== undefined && lessons[ex.conceptIdx]) ? lessons[ex.conceptIdx] : null;
      var conceptLink = l ? ('<a href="#concept-' + (ex.conceptIdx + 1) + '" class="q-concept-link" data-idx="' + ex.conceptIdx + '">Explore in Concept ' + ("0" + (ex.conceptIdx + 1)).slice(-2) + ' (' + (l.nav || l.navTitle || l.title) + ') ↗</a>') : '';

      var guidanceHtml = "";
      if(ex.guidance){
        if(typeof ex.guidance === 'string'){
          guidanceHtml = ex.guidance;
        } else if(Array.isArray(ex.guidance)){
          guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
            (ex.answer ? '<p><strong>Answer:</strong> ' + ex.answer + '</p>' : '') +
            '<ol>' + ex.guidance.map(function(g){ return '<li>' + g + '</li>'; }).join('') + '</ol></div>';
        }
      } else if(ex.steps && ex.steps.length){
        guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
          (ex.given ? '<div class="given-data"><b>Given:</b> ' + ex.given + '</div>' : '') +
          '<ol class="solution-steps">' + ex.steps.map(function(st){ return '<li>' + st + '</li>'; }).join('') + '</ol>' +
          (ex.answer ? '<div class="answer-box"><b>Final Answer:</b> ' + ex.answer + '</div>' : '') +
          '</div>';
      }

      return '<article class="exercise-card" id="exercise-q' + qNum + '">' +
        '<div class="exercise-card-meta">' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
        sectionLabel +
        '<span class="q-badge">QUESTION ' + qNum + '</span>' +
        '</div>' +
        conceptLink +
        '</div>' +
        
        '<div class="exercise-question-text" style="font-size:15px;line-height:1.6;margin:12px 0;white-space:pre-wrap;">' + (ex.question || ex.title || "") + '</div>' +
        
        '<details class="exercise-drawer">' +
        '<summary class="exercise-drawer-btn">📖 View Step-by-Step Guidance & Full Solution</summary>' +
        '<div class="exercise-solution-body" style="padding:14px;background:#f8fafc;border-radius:8px;margin-top:8px;">' +
        guidanceHtml +
        '</div>' +
        '</details>' +
        '</article>';
    }).join("");

    html += '</div>';

    revView.innerHTML = html;

    // Attach Filter Listeners
    revView.querySelectorAll(".filter-chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        currentExFilter = Number(chip.getAttribute("data-cfilter"));
        renderRevision();
      });
    });

    // Attach Expand/Collapse All Listeners
    var btnExp = document.getElementById("btn-expand-all");
    var btnCol = document.getElementById("btn-collapse-all");
    if(btnExp){
      btnExp.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = true; });
      });
    }
    if(btnCol){
      btnCol.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = false; });
      });
    }

    // Concept Navigation Links
    revView.querySelectorAll(".q-concept-link").forEach(function(a){
      a.addEventListener("click", function(e){
        e.preventDefault();
        var cIdx = Number(a.getAttribute("data-idx"));
        renderConcept(cIdx);
        window.scrollTo(0, 0);
      });
    });

    window.location.hash = "#revision";
  }

  // --- Build Sidebar Nav ---
  function buildSidebar(){
    var navContainer = document.getElementById("sidebar-nav");
    if(!navContainer) return;
    var lessons = C.lessons || C.concepts || [];
    navContainer.innerHTML = lessons.map(function(l, i){
      var nav = l.nav || l.navTitle || l.title || ("Concept " + (i + 1));
      return '<button class="concept-nav" data-cidx="' + i + '">' +
        '<span class="num">' + ("0" + (i + 1)).slice(-2) + '</span>' +
        '<span>' + nav + '</span>' +
        '</button>';
    }).join("");

    navContainer.querySelectorAll(".concept-nav").forEach(function(b){
      b.addEventListener("click", function(){
        var idx = Number(b.getAttribute("data-cidx"));
        renderConcept(idx);
      });
    });

    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.addEventListener("click", renderRevision);
  }

  // --- Reset Progress Button ---
  var resetProgBtn = document.getElementById("btn-reset-progress");
  if(resetProgBtn){
    resetProgBtn.addEventListener("click", function(){
      if(confirm("Reset all quiz answers and mastery progress for this chapter?")){
        state.answers = {};
        state.correct = {};
        saveStorage();
        updateProgress();
        renderQuiz();
      }
    });
  }

  // --- Handle Video Facades (No preloaded iframes) ---
  document.addEventListener("click", function(e){
    var btn = e.target.closest(".video-facade");
    if(btn){
      var vid = btn.getAttribute("data-yt");
      var parent = btn.parentElement;
      if(parent && vid){
        parent.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&rel=0" title="Video Lesson" style="width:100%;aspect-ratio:16/9;border:none;border-radius:8px;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
      }
    }
  });

  // --- URL Routing ---
  function routeFromHash(){
    var hash = window.location.hash;
    var lessons = C.lessons || C.concepts || [];
    if(hash === "#revision"){
      renderRevision();
    } else if(/^#concept-\d+$/.test(hash)){
      var cNum = parseInt(hash.replace("#concept-", ""), 10);
      if(cNum >= 1 && cNum <= lessons.length){
        renderConcept(cNum - 1);
        return;
      }
      renderConcept(0);
    } else {
      renderConcept(0);
    }
  }
  window.addEventListener("hashchange", routeFromHash);

  window.App = {
    state: state,
    play: play,
    pause: pause,
    step: step,
    resetTimeline: resetTimeline,
    seekTimeline: seekTimeline,
    renderConcept: renderConcept,
    renderRevision: renderRevision,
    routeFromHash: routeFromHash
  };
  if (typeof globalThis !== "undefined") {
    globalThis.App = window.App;
  }

  // Initialize
  initStorage();
  buildSidebar();
  updateProgress();
  routeFromHash();
})();

</script>
<script>

var App = window.App;
window.SIMS = {};

function setActivePreset(btn){
  var p = btn.parentElement;
  if(p){
    p.querySelectorAll('.filter-chip').forEach(function(b){ b.classList.remove('active'); });
  }
  btn.classList.add('active');
}

// ==========================================
// 1. electrontransfer: Competitive Electron Transfer Lab
// ==========================================
window.SIMS.electrontransfer = {
  mount: function(container){
    var pair = 'zn_cu'; // zn_cu, cu_ag, cu_zn
    container.innerHTML = 
      '<div class="sim-wrapper" style="font-family:var(--font-sans);color:var(--ink);">' +
      '  <div class="preset-bar" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">' +
      '    <button class="filter-chip active" id="btn-pair-zncu">Zn in CuSO4 (Blue Fades)</button>' +
      '    <button class="filter-chip" id="btn-pair-cuag">Cu in AgNO3 (Silver Needles)</button>' +
      '    <button class="filter-chip" id="btn-pair-cuzn">Cu in ZnSO4 (No Reaction)</button>' +
      '  </div>' +
      '  <div style="background:var(--paper-soft);padding:14px;border-radius:8px;border:1px solid var(--line);">' +
      '    <svg id="svg-et" viewBox="0 0 700 280" style="width:100%;height:auto;max-height:280px;background:#0f172a;border-radius:6px;"></svg>' +
      '    <div id="et-readout" style="margin-top:12px;padding:12px;background:var(--paper);border-radius:6px;border:1px solid var(--line);font-size:13px;line-height:1.5;"></div>' +
      '  </div>' +
      '</div>';

    function render(){
      var svg = document.getElementById('svg-et');
      var rd = document.getElementById('et-readout');
      if(!svg || !rd) return;

      var solnColor, stripColor, depositColor, rxnTitle, equation, e0, statusTxt, desc;
      if(pair === 'zn_cu'){
        solnColor = 'rgba(56, 189, 248, 0.4)'; // blue fading
        stripColor = '#94a3b8'; // zinc silvery grey
        depositColor = '#b45309'; // copper reddish brown
        rxnTitle = 'Zinc Metal dipped in Aqueous Copper Sulfate (CuSO4)';

      '        <option value="zn" selected>Zn²⁺ / Zn (−0.76 V)</option>' +
      '        <option value="fe">Fe²⁺ / Fe (−0.44 V)</option>' +
      '        <option value="she">2H⁺ / H₂ (0.00 V)</option>' +
      '        <option value="cu">Cu²⁺ / Cu (+0.34 V)</option>' +
      '        <option value="ag">Ag⁺ / Ag (+0.80 V)</option>' +
      '      </select>' +
      '    </div>' +
      '    <div>' +
      '      <label style="font-size:12px;font-weight:700;display:block;margin-bottom:4px;">Cathode Couple (Reduction):</label>' +
      '      <select id="sel-cathode" class="select-input" style="padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);">' +
      '        <option value="she">2H⁺ / H₂ (0.00 V)</option>' +
      '        <option value="cu" selected>Cu²⁺ / Cu (+0.34 V)</option>' +
      '        <option value="i2">I₂ / 2I⁻ (+0.54 V)</option>' +
      '        <option value="fe3">Fe³⁺ / Fe²⁺ (+0.77 V)</option>' +
      '        <option value="ag">Ag⁺ / Ag (+0.80 V)</option>' +
      '        <option value="br2">Br₂ / 2Br⁻ (+1.09 V)</option>' +
      '        <option value="cr2">Cr₂O₇²⁻ / Cr³⁺ (+1.33 V)</option>' +
      '        <option value="cl2">Cl₂ / 2Cl⁻ (+1.36 V)</option>' +
      '        <option value="mno4">MnO₄⁻ / Mn²⁺ (+1.51 V)</option>' +
      '        <option value="f2">F₂ / 2F⁻ (+2.87 V)</option>' +
      '      </select>' +
      '    </div>' +
      '  </div>' +
      '  <div style="background:var(--paper-soft);padding:16px;border-radius:8px;border:1px solid var(--line);">' +
      '    <div id="ec-readout" style="background:var(--paper);border-radius:6px;border:1px solid var(--line);padding:14px;font-size:14px;line-height:1.7;"></div>' +
      '  </div>' +
      '</div>';

    function render(){
      var rd = document.getElementById('ec-readout');
      if(!rd) return;

      var cA = potentials[couple1];
      var cC = potentials[couple2];
      var eCell = cC.e0 - cA.e0;
      var nVal = Math.max(cA.n, cC.n);
      var deltaG = -nVal * 96.485 * eCell; // kJ/mol

      var isSpont = eCell > 0;
      var verdict = isSpont 
        ? '<span style="color:#10b981;font-weight:700;">★ Thermodynamically Feasible & Spontaneous (ΔG° < 0)</span>'
        : '<span style="color:#ef4444;font-weight:700;">✗ Non-Spontaneous (Thermodynamically Forbidden under standard conditions, ΔG° > 0)</span>';

      rd.innerHTML = 
        '<div style="font-size:16px;font-weight:700;color:var(--primary);margin-bottom:8px;">' +
        '  E°_cell = E°_cathode − E°_anode = (' + (cC.e0 >= 0 ? '+' : '') + cC.e0.toFixed(2) + ' V) − (' + (cA.e0 >= 0 ? '+' : '') + cA.e0.toFixed(2) + ' V) = <b>' + (eCell >= 0 ? '+' : '') + eCell.toFixed(2) + ' V</b>' +
        '</div>' +
        '<div>' + verdict + '</div>' +
        '<div style="margin-top:10px;font-family:monospace;font-size:13px;color:var(--muted);">' +
        '  • Standard Gibbs Free Energy Change: ΔG° = −n F E°_cell ≈ <b>' + deltaG.toFixed(1) + ' kJ/mol</b><br>' +
        '  • Anode Reaction (Oxidation): ' + cA.name + ' donor<br>' +
        '  • Cathode Reaction (Reduction): ' + cC.name + ' acceptor' +
        '</div>';
    }

    container.querySelector('#sel-anode').onchange = function(e){ couple1 = e.target.value; render(); };
    container.querySelector('#sel-cathode').onchange = function(e){ couple2 = e.target.value; render(); };
    render();
  }
};

// Map concept aliases
window.SIMS.c1 = window.SIMS.electrontransfer;
window.SIMS.c2 = window.SIMS.oxnumberlab;
window.SIMS.c3 = window.SIMS.redoxtypes;
window.SIMS.c4 = window.SIMS.balancerlab;
window.SIMS.c5 = window.SIMS.redoxtitration;
window.SIMS.c6 = window.SIMS.daniellcell;
window.SIMS.c7 = window.SIMS.ecserieslab;

if (window.App && typeof window.App.routeFromHash === "function") {
  window.App.routeFromHash();
}
</script>
