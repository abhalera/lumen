<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 7: Chapter 7 — Interactive Textbook</title>
<style>
:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: var(--radius-sm);
  position: relative;
  overflow: hidden;
  border: none;
  padding: 0;
  cursor: pointer;
  display: block;
}
.video-facade img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
}
.play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 48px;
  height: 48px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.video-title {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 8px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  color: #fff;
  font-size: 12px;
  text-align: left;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);

<script>
window.CHAPTER = {"chapter_meta": {"id": "kech201", "number": 7, "title": "Redox Reactions", "book": "Chemistry Part II", "class": 11, "reprint": "2026-27", "tagline": "From classical and electronic oxidation-reduction definitions to balancing redox equations, electrochemical cells, and standard electrode potentials.", "total_concepts": 7, "total_practice_questions": 21, "total_exercises": 30}, "concepts": [{"id": "c1", "title": "Classical and Electronic Concepts of Oxidation and Reduction", "navTitle": "Classical & Electronic Concepts", "minutes": 15, "pages": ["1", "4"], "deck": "Unify classical oxygen-hydrogen transfer with modern electronation theory: competitive electron displacement and half-reactions.", "quick": "Classical chemistry defined oxidation as addition of oxygen/electronegative element or removal of hydrogen/electropositive element, and reduction as addition of hydrogen/electropositive element or removal of oxygen/electronegative element. The electronic theory defines oxidation as loss of electrons (de-electronation) and reduction as gain of electrons (electronation). A reducing agent (reductant) supplies electrons, while an oxidising agent (oxidant) accepts electrons.", "formulas": [{"label": "Zinc Half-Oxidation (Electron Loss)", "cond": "Anodic de-electronation", "html": "Zn(s) \\to Zn^{2+}(aq) + 2e^-"}, {"label": "Copper Half-Reduction (Electron Gain)", "cond": "Cathodic electronation", "html": "Cu^{2+}(aq) + 2e^- \\to Cu(s)"}, {"label": "Overall Redox Electron Balance", "cond": "Stoichiometric electron cancellation", "html": "Zn(s) + Cu^{2+}(aq) \\to Zn^{2+}(aq) + Cu(s)"}, {"label": "Silver Ion Reduction", "cond": "Cu in AgNO3 solution", "html": "Cu(s) + 2Ag^+(aq) \\to Cu^{2+}(aq) + 2Ag(s)"}], "deeper": "Competitive electron transfer experiments reveal the relative tendencies of metals to lose electrons. Dipping a zinc rod into blue aqueous CuSO4 solution results in a spontaneous deposition of reddish-brown copper metal on zinc, with the blue color of hydrated Cu2+ fading to colorless Zn2+. Conversely, placing a copper wire in ZnSO4 yields no reaction whatsoever. When copper is placed in colorless AgNO3 solution, the solution turns sky blue (forming Cu2+) and shimmering silver needles crystallize onto the copper. This establishes an electron-releasing hierarchy: Zn > Cu > Ag.", "worked": {"title": "Identifying Oxidants and Reductants via Electron Transfer", "problem": "In the reaction: 2 Na(s) + Cl2(g) -> 2 NaCl(s), identify the species oxidised, the species reduced, the oxidising agent, and the reducing agent.", "given": "Reactants: elemental sodium Na(s) and elemental chlorine gas Cl2(g).", "steps": ["Split the reaction into half-reactions: 2 Na(s) -> 2 Na+(s) + 2 e- (loss of electrons, oxidation).", "Cl2(g) + 2 e- -> 2 Cl-(s) (gain of electrons, reduction).", "Sodium atoms lose electrons; hence Na is oxidised and acts as the reducing agent (reductant).", "Chlorine molecules accept electrons; hence Cl2 is reduced and acts as the oxidising agent (oxidant)."], "solution": "Na loses electrons to form Na+, and Cl2 gains electrons to form Cl-.", "answer": "Oxidised: Na; Reduced: Cl2; Reducing agent: Na; Oxidising agent: Cl2."}, "prediction": {"prompt": "A polished strip of copper metal is immersed into a 1.0 M aqueous solution of zinc sulfate (ZnSO4). What will be observed over time?", "options": ["Zinc metal plates onto copper and the solution turns deep blue.", "No visible change occurs because copper cannot displace zinc ions.", "Copious bubbles of hydrogen gas evolve immediately.", "The copper strip dissolves completely forming copper sulfate precipitate."], "answer": 1, "explanation": "Copper has a much lower tendency to release electrons than zinc (E° for Cu2+/Cu is +0.34 V, while Zn2+/Zn is -0.76 V). Copper cannot transfer electrons to Zn2+ ions, so no reaction occurs."}, "simTitle": "Competitive Electron Transfer Lab", "connect": "Biological electron transport chains in mitochondrial inner membranes use sequential redox centers (NADH-Q oxidoreductase, Cytochrome c, and Cytochrome oxidase) to transfer electrons down a precise thermodynamic gradient to terminal molecular oxygen, driving ATP synthesis.", "quizzes": [{"tier": "easy", "question": "Which of the following processes represents oxidation in terms of modern electronic theory?", "options": ["Gain of electrons (electronation)", "Loss of electrons (de-electronation)", "Addition of electropositive element", "Decrease in oxidation state"], "answer": 1, "hint": "Remember the mnemonic 'OIL RIG' — Oxidation Is Loss, Reduction Is Gain of electrons.", "explanation": "According to the electronic concept, oxidation is defined strictly as de-electronation, or the loss of one or more electrons by an atom, molecule, or ion."}, {"tier": "medium", "question": "In the reaction: 2 Fe3+(aq) + Sn2+(aq) -> 2 Fe2+(aq) + Sn4+(aq), which species functions as the reducing agent?", "options": ["Fe3+", "Fe2+", "Sn2+", "Sn4+"], "answer": 2, "hint": "The reducing agent loses electrons and undergoes an increase in its own oxidation state.", "explanation": "Sn2+ loses 2 electrons to become Sn4+ (oxidation: Sn2+ -> Sn4+ + 2e-). Because it supplies electrons to reduce Fe3+ to Fe2+, Sn2+ is the reducing agent."}, {"tier": "hard", "question": "When copper wire is dipped into aqueous AgNO3, shimmering silver crystals form and the solution turns blue. Why does this electron transfer occur spontaneously?", "options": ["Ag has a greater tendency to lose electrons than Cu.", "Cu has a lower reduction potential than Ag+, meaning Cu is oxidized more readily and transfers electrons to Ag+.", "Ag+ acts as a strong reducing agent in aqueous medium.", "NO3- ions oxidize Cu to Cu2+ while leaving Ag unchanged."], "answer": 1, "hint": "Compare standard reduction potentials: E°(Ag+/Ag) = +0.80 V, while E°(Cu2+/Cu) = +0.34 V.", "explanation": "Because E°(Ag+/Ag) = +0.80 V is more positive than E°(Cu2+/Cu) = +0.34 V, Ag+ is a stronger oxidant than Cu2+. Cu spontaneously donates electrons to Ag+ (Cu + 2Ag+ -> Cu2+ + 2Ag), releasing blue hydrated Cu2+ ions."}]}, {"id": "c2", "title": "Oxidation Number: Rules, Calculation & Stock Notation", "navTitle": "Oxidation Number & Stock Notation", "minutes": 18, "pages": ["4", "7"], "deck": "Master IUPAC assignment rules for oxidation states, resolve the paradox of fractional oxidation states, and apply Stock notation.", "quick": "Oxidation number denotes the residual electrical charge an atom appears to possess when all bonding electron pairs are allocated entirely to the more electronegative partner. Pure elements carry O.N. = 0; fluorine is strictly -1; oxygen is -2 (except peroxides -1, superoxides -1/2, OF2 +2); hydrogen is +1 (except ionic hydrides -1). Stock notation specifies metal oxidation states using Roman numerals in parentheses immediately following the metal symbol or name, e.g., Fe(II)SO4, Fe2(III)(SO4)3.", "formulas": [{"label": "Sum of Oxidation States (Neutral Molecule)", "cond": "All neutral compounds", "html": "\\sum_{i} n_i \\cdot \\text{O.N.}_i = 0"}, {"label": "Sum of Oxidation States (Polyatomic Ion)", "cond": "Ions with net charge z", "html": "\\sum_{i} n_i \\cdot \\text{O.N.}_i = z"}, {"label": "Peroxo Linkage Oxygen O.N.", "cond": "In H2O2, H2SO5 (Caro's), H2S2O8", "html": "\\text{O.N. of } (-O-O-) = -1"}, {"label": "Average Fractional State in Suboxides", "cond": "C3O2, Br3O8, S4O6^2-", "html": "\\text{O.N.}_{\\text{avg}} = \\frac{\\sum \\text{individual structural states}}{N_{\\text{atoms}}}"}], "deeper": "The 'paradox of fractional oxidation states' arises when we assign an average state to chemically non-equivalent atoms of the same element in a molecule. In carbon suboxide (C3O2: O=C=C=C=O), the terminal carbons are bonded to electronegative oxygen and have oxidation state +2, while the central carbon atom is bonded only to adjacent carbon atoms, carrying oxidation state 0. The stoichiometric average is (2 + 0 + 2)/3 = +4/3. Similarly, in the tetrathionate ion (S4O6^2-), the two central sulfur atoms form an S-S homonuclear bond (O.N. = 0), while the two terminal sulfur atoms are each bonded to three oxygens (O.N. = +5), giving an average of (5 + 0 + 0 + 5)/4 = +2.5.", "worked": {"title": "Oxidation Number of Sulfur in Caro's Acid (H2SO5)", "problem": "Calculate the oxidation number of sulfur in peroxomonosulfuric acid (Caro's acid, H2SO5). Explain the fallacy if applying conventional rules directly.", "given": "Formula: H2SO5. Structure: HO-SO2-O-O-H containing one peroxo (-O-O-) group.", "steps": ["Direct algebraic formula: 2(+1) + x + 5(-2) = 0 => x - 8 = 0 => x = +8.", "Fallacy: Sulfur belongs to Group 16 and has only 6 valence electrons (3s2 3p4). It cannot have an oxidation number exceeding +6.", "Structural analysis: H2SO5 contains one peroxo group (-O-O-) where each peroxo oxygen has O.N. = -1. The other three oxygens are oxo oxygens with O.N. = -2.", "Equation: 2(+1) [for H] + x [for S] + 2(-1) [for peroxo O] + 3(-2) [for oxo O] = 0.", "+2 + x - 2 - 6 = 0 => x - 6 = 0 => x = +6."], "solution": "By accounting for the -O-O- peroxo bridge, the true oxidation state of S is +6.", "answer": "Oxidation number of S in H2SO5 is +6."}, "prediction": {"prompt": "Potassium superoxide (KO2) is used in submarine and aerospace rebreathers. What is the oxidation state of oxygen in KO2?", "options": ["-2 (standard oxide)", "-1 (peroxide)", "-1/2 (superoxide)", "+1 (fluoride analog)"], "answer": 2, "explanation": "Potassium is an alkali metal (Group 1) and strictly carries an oxidation state of +1. Since the compound is neutral: +1 + 2(x) = 0 => 2x = -1 => x = -1/2. The superoxide radical ion is O2^-."}, "simTitle": "Oxidation Number & Stock Notation Calculator", "connect": "Breathalyzer devices used by law enforcement utilize the oxidation of ethanol by orange potassium dichromate in acidic medium (Cr in +6) to green chromium sulfate (Cr in +3). The photometric absorbance of the green color quantifies blood alcohol concentration.", "quizzes": [{"tier": "easy", "question": "What is the Stock notation formula for chromium(III) oxide?", "options": ["CrO", "Cr2O3 with Cr in state (III), written as Cr2(III)O3 or Cr2O3", "CrO3", "Cr3O2"], "answer": 1, "hint": "Stock notation puts the Roman numeral representing the metal's oxidation state in parentheses.", "explanation": "In chromium(III) oxide, chromium has an oxidation state of +3 and oxide is -2. Balancing charges gives Cr2O3, designated in Stock notation as Cr2(III)O3 or chromium(III) oxide."}, {"tier": "medium", "question": "Calculate the oxidation numbers of the three individual bromine atoms in tribromooctoxide (Br3O8).", "options": ["+16/3 for all three bromines uniformly", "+6 for the two terminal bromines and +4 for the central bromine", "+7 for two bromines and +2 for one bromine", "+5 for all three bromines"], "answer": 1, "hint": "Draw the Lewis structure: O3Br - Br(O2) - BrO3. Terminal Br atoms are bonded to 3 oxygens each; the central Br is bonded to 2 oxygens.", "explanation": "In Br3O8, the two terminal Br atoms are each bonded to three oxygens (O.N. = +6 each). The central Br atom is bonded to two oxygens and two Br atoms (O.N. = +4). The average oxidation state is (6 + 4 + 6)/3 = +16/3."}, {"tier": "hard", "question": "Chromium pentoxide (CrO5) is an ethereal blue compound formed when dichromate reacts with H2O2. What is the actual oxidation state of Cr in CrO5?", "options": ["+10 (by naive formula 5 * -2)", "+6, because it has a butterfly structure with four peroxo oxygens (-1) and one oxo oxygen (-2)", "+4 with two superoxide bonds", "+3 with two ozone bridges"], "answer": 1, "hint": "Cr is in Group 6 and cannot exceed its total valence count of 6. CrO5 has a butterfly structure with two (-O-O-) peroxo rings.", "explanation": "CrO5 has a butterfly geometry with two peroxo linkages: four oxygen atoms belong to peroxo groups (O.N. = -1 each) and one oxygen is doubly bonded (oxo oxygen, O.N. = -2). Therefore, x + 4(-1) + 1(-2) = 0 => x = +6."}]}, {"id": "c3", "title": "Types of Redox Reactions: Combination, Decomposition, Displacement & Disproportionation", "navTitle": "Types of Redox Reactions", "minutes": 16, "pages": ["8", "11"], "deck": "Classify combination, decomposition, metal and non-metal displacement, and disproportionation redox transformations.", "quick": "Redox reactions are classified into four major categories: (1) Combination: two or more reactants unite into one product, with at least one reactant in elemental form; (2) Decomposition: breakdown into simpler species where at least one product is elemental (e.g. 2H2O -> 2H2 + O2; note CaCO3 -> CaO + CO2 is non-redox); (3) Displacement: an atom or ion in a compound is replaced by another (metal displacement: Zn + CuSO4; non-metal displacement: Na + H2O -> NaOH + H2); (4) Disproportionation: an element in an intermediate oxidation state is simultaneously oxidised and reduced.", "formulas": [{"label": "Disproportionation of Hydrogen Peroxide", "cond": "O(-1) -> O(-2) + O(0)", "html": "2H_2O_2(aq) \\to 2H_2O(l) + O_2(g)"}, {"label": "Disproportionation of White Phosphorus", "cond": "P(0) -> P(-3) in PH3 and P(+1) in H2PO2^-", "html": "P_4(s) + 3OH^-(aq) + 3H_2O(l) \\to PH_3(g) + 3H_2PO_2^-(aq)"}, {"label": "Chlorine in Cold Dilute Alkali", "cond": "Cl(0) -> Cl(-1) and Cl(+1)", "html": "Cl_2(g) + 2OH^-(aq) \\to Cl^-(aq) + ClO^-(aq) + H_2O(l)"}, {"label": "Chlorine in Hot Concentrated Alkali", "cond": "Cl(0) -> Cl(-1) and Cl(+5)", "html": "3Cl_2(g) + 6OH^-(aq) \\to 5Cl^-(aq) + ClO_3^-(aq) + 3H_2O(l)"}], "deeper": "Disproportionation is a special redox reaction in which one and the same element undergoes simultaneous oxidation and reduction. For an element to undergo disproportionation, it must exist in an intermediate oxidation state; it cannot be in its maximum or minimum oxidation state. Fluorine is the most electronegative element of all and exhibits only 0 (in F2) and -1 (in fluorides). Having no positive oxidation states and no available d-orbitals, fluorine can never undergo disproportionation. Conversely, chlorine, bromine, and iodine exhibit oxidation states of -1, 0, +1, +3, +5, and +7, enabling rich disproportionation chemistry in basic media.", "worked": {"title": "Classifying a Disproportionation Reaction", "problem": "Which of the following reactions is a disproportionation reaction? (a) 2 KClO3 -> 2 KCl + 3 O2; (b) 2 NO2 + H2O -> HNO2 + HNO3.", "given": "Reactions (a) thermal decomposition of potassium chlorate, and (b) hydration of nitrogen dioxide.", "steps": ["For (a): In KClO3, Cl is +5 and O is -2. In products, Cl is -1 (in KCl) and O is 0 (in O2). Chlorine is reduced (+5 -> -1) and oxygen is oxidised (-2 -> 0). Two different elements change oxidation states. This is a decomposition redox reaction, NOT disproportionation.", "For (b): In NO2, nitrogen is in oxidation state +4. In HNO2, nitrogen is +3 (reduction: +4 -> +3). In HNO3, nitrogen is +5 (oxidation: +4 -> +5).", "The same element, nitrogen, is simultaneously reduced and oxidised from intermediate state +4 to +3 and +5."], "solution": "Reaction (b) is a true disproportionation reaction.", "answer": "Reaction (b) 2 NO2 + H2O -> HNO2 + HNO3 is a disproportionation reaction."}, "prediction": {"prompt": "Elemental fluorine gas (F2) is bubbled through a cold, dilute aqueous sodium hydroxide solution. Can fluorine undergo disproportionation into F^- and FO^-?", "options": ["Yes, forming NaF and NaOF analogous to chlorine.", "No, because fluorine is the most electronegative element and cannot exhibit a positive oxidation state.", "Yes, but only under high ultraviolet radiation.", "Yes, fluorine disproportionates to F^- and OF2."], "answer": 1, "explanation": "Fluorine is the most electronegative element and has no d-orbitals. It cannot have a positive oxidation state; hence it cannot undergo disproportionation. Instead, it vigorously oxidizes oxygen in water/alkali: 2 F2 + 2 OH^- -> 2 F^- + OF2 + H2O."}, "simTitle": "Redox Reaction Classifier & Disproportionation Chamber", "connect": "Household bleaching powder (CaOCl2) acts as a disinfectant through redox disproportionation: in water, it releases hypochlorite ion (ClO^-), which readily oxidizes bacterial cell walls and denatures microbial proteins by decomposing into chloride and nascent oxygen.", "quizzes": [{"tier": "easy", "question": "Which of the following decomposition reactions is NOT a redox reaction?", "options": ["2 H2O(l) -> 2 H2(g) + O2(g)", "2 KClO3(s) -> 2 KCl(s) + 3 O2(g)", "CaCO3(s) -> CaO(s) + CO2(g)", "2 NaH(s) -> 2 Na(s) + H2(g)"], "answer": 2, "hint": "Check whether the oxidation numbers of calcium, carbon, or oxygen change during limestone heating.", "explanation": "In CaCO3 -> CaO + CO2, Ca remains +2, C remains +4, and O remains -2. There is no transfer of electrons and no change in oxidation state; hence it is a thermal non-redox decomposition."}, {"tier": "medium", "question": "When chlorine gas reacts with hot, concentrated sodium hydroxide solution, the products formed are:", "options": ["NaCl + NaOCl + H2O", "NaCl + NaClO3 + H2O", "NaClO2 + NaClO3 + H2", "NaCl + Cl2O7 + H2O"], "answer": 1, "hint": "In hot concentrated alkali, chlorate (ClO3^-) is favored over hypochlorite (ClO^-).", "explanation": "Hot concentrated NaOH drives the disproportionation of Cl2 to chloride (Cl^- in -1) and chlorate (ClO3^- in +5): 3 Cl2 + 6 OH^- -> 5 Cl^- + ClO3^- + 3 H2O."}, {"tier": "hard", "question": "Which species CANNOT undergo a disproportionation reaction under any circumstances?", "options": ["ClO^-", "ClO2^-", "ClO3^-", "ClO4^-"], "answer": 3, "hint": "An ion in its maximum oxidation state cannot be oxidised any further.", "explanation": "In the perchlorate ion (ClO4^-), chlorine is in its maximum possible oxidation state of +7 (Group 17). It cannot be oxidised further to a higher oxidation state, so it cannot undergo disproportionation."}]}, {"id": "c4", "title": "Balancing Redox Equations: Oxidation Number & Ion-Electron Methods", "navTitle": "Balancing Redox Equations", "minutes": 20, "pages": ["11", "15"], "deck": "Execute algorithmic step-by-step balancing in acidic and basic media using both oxidation number and half-reaction techniques.", "quick": "Balancing redox reactions requires satisfying both the Law of Conservation of Mass (atom balance) and the Conservation of Charge. Two standard systematic algorithms are used: (1) The Oxidation Number Method adjusts stoichiometric coefficients so that the total increase in oxidation number equals the total decrease in oxidation number; (2) The Ion-Electron (Half-Reaction) Method splits the process into separate oxidation and reduction half-reactions, balances non-O/H atoms, balances O with H2O, balances H with H+ (in acid) or H2O/OH- (in base), balances electrical charges with electrons, and adds the half-reactions so electrons cancel out completely.", "formulas": [{"label": "Electron Conservation Criterion", "cond": "All redox reactions", "html": "n_{\\text{electrons lost (oxidation)}} = n_{\\text{electrons gained (reduction)}}"}, {"label": "Acidic Medium Oxygen/Hydrogen Balancing", "cond": "For each deficient O atom add H2O; balance H with H+", "html": "\\text{O balance: } +\\text{H}_2\\text{O}; \\quad \\text{H balance: } +\\text{H}^+"}, {"label": "Basic Medium Hydrogen/Oxygen Balancing", "cond": "For each H+ add equal OH^- to both sides", "html": "\\text{H}^+ + \\text{OH}^- \\to \\text{H}_2\\text{O}"}, {"label": "Dichromate Half-Reaction in Acid", "cond": "Standard reduction in H2SO4", "html": "Cr_2O_7^{2-} + 14H^+ + 6e^- \\to 2Cr^{3+} + 7H_2O"}], "deeper": "In basic medium, students frequently stumble over balancing hydrogen and oxygen. A foolproof algorithmic shortcut is to balance the half-reaction initially as if it were in acidic medium (using H+ and H2O). Once atoms and charges are balanced with electrons, add an equal number of OH- ions to both sides of the equation corresponding to the number of H+ present. Combine H+ and OH- on the same side into H2O molecules (H+ + OH- -> H2O), and then cancel out common H2O molecules from both sides. This guarantees flawless mass and charge conservation without confusing basic-medium rules.", "worked": {"title": "Balancing Permanganate and Iron(II) in Acidic Solution", "problem": "Balance the following skeletal ionic equation in acidic solution using the ion-electron method: MnO4^-(aq) + Fe2+(aq) -> Mn2+(aq) + Fe3+(aq).", "given": "Skeletal equation in acidic medium with H+ and H2O available.", "steps": ["Step 1: Identify half-reactions. Oxidation: Fe2+ -> Fe3+; Reduction: MnO4^- -> Mn2+.", "Step 2: Balance atoms other than O and H. Fe and Mn are already balanced.", "Step 3: Balance O in reduction half-reaction by adding 4 H2O to right: MnO4^- -> Mn2+ + 4 H2O.", "Step 4: Balance H by adding 8 H+ to left: MnO4^- + 8 H+ -> Mn2+ + 4 H2O.", "Step 5: Balance charge with electrons. Left charge = -1 + 8 = +7; Right charge = +2. Add 5 e- to left: MnO4^- + 8 H+ + 5 e- -> Mn2+ + 4 H2O.", "Step 6: Balance charge in oxidation half-reaction: Fe2+ -> Fe3+ + e-.", "Step 7: Equalize electrons. Multiply oxidation half-reaction by 5: 5 Fe2+ -> 5 Fe3+ + 5 e-.", "Step 8: Add the two half-reactions together; 5 e- cancel on both sides: MnO4^- + 5 Fe2+ + 8 H+ -> Mn2+ + 5 Fe3+ + 4 H2O."], "solution": "Mass and charge (+17 on both sides) are perfectly conserved.", "answer": "MnO4^-(aq) + 5 Fe2+(aq) + 8 H+(aq) -> Mn2+(aq) + 5 Fe3+(aq) + 4 H2O(l)"}, "prediction": {"prompt": "In balancing the reduction of dichromate Cr2O7^2- to Cr^3+ in acidic solution, how many electrons (e^-) must be added to the reactant side?", "options": ["2 electrons", "3 electrons", "6 electrons", "14 electrons"], "answer": 2, "explanation": "Each chromium atom changes from +6 in Cr2O7^2- to +3 in Cr^3+ (a gain of 3 e^- per Cr atom). Since there are 2 Cr atoms in dichromate, the total electrons gained is 2 * 3 = 6 e^-: Cr2O7^2- + 14 H^+ + 6 e^- -> 2 Cr^3+ + 7 H2O."}, "simTitle": "Interactive Step-by-Step Redox Reaction Balancer", "connect": "Industrial water treatment plants neutralize toxic hexavalent chromium Cr(VI) in electroplating wastewater by reducing it to Cr(III) using sulfur dioxide (SO2) or ferrous sulfate at pH 2–3, followed by precipitation as harmless Cr(OH)3 sludge at pH 8.5.", "quizzes": [{"tier": "easy", "question": "What is the stoichiometric coefficient of H+ when balancing the reduction half-reaction: MnO4^- + H+ + 5e^- -> Mn2+ + 4H2O?", "options": ["4", "8", "5", "10"], "answer": 1, "hint": "Notice that 4 water molecules on the right require 4 * 2 = 8 hydrogen atoms.", "explanation": "4 H2O molecules contain 8 hydrogen atoms; therefore, 8 H+ ions must be added to the reactant side to balance hydrogen."}, {"tier": "medium", "question": "Balance the reaction in basic medium: MnO4^-(aq) + I^-(aq) -> MnO2(s) + I2(s). What is the coefficient of OH^- in the balanced equation?", "options": ["8 on the product side", "4 on the product side", "2 on the product side", "2 on the reactant side"], "answer": 0, "hint": "The reduction half-reaction is 2 MnO4^- + 4 H2O + 6 e^- -> 2 MnO2 + 8 OH^-, and oxidation is 6 I^- -> 3 I2 + 6 e^-.", "explanation": "Balancing in basic medium: 2 MnO4^- + 6 I^- + 4 H2O -> 2 MnO2 + 3 I2 + 8 OH^-. The coefficient of OH^- on the product side is 8."}, {"tier": "hard", "question": "In the balanced reaction: a Cr2O7^2- + b SO2 + c H+ -> d Cr^3+ + e SO4^2- + f H2O, what are the coefficients a, b, and c?", "options": ["a = 1, b = 3, c = 2", "a = 2, b = 3, c = 4", "a = 1, b = 1, c = 2", "a = 1, b = 3, c = 4"], "answer": 0, "hint": "Cr2O7^2- gains 6 e^-; each SO2 loses 2 e^- (S from +4 to +6). Equating electrons: 1 Cr2O7^2- reacts with 3 SO2.", "explanation": "Oxidation: 3 [SO2 + 2 H2O -> SO4^2- + 4 H+ + 2 e^-]; Reduction: Cr2O7^2- + 14 H+ + 6 e^- -> 2 Cr^3+ + 7 H2O. Adding them cancels 6 e^- and 6 H2O, leaving 2 H+ on the left: Cr2O7^2- + 3 SO2 + 2 H+ -> 2 Cr^3+ + 3 SO4^2- + H2O. Thus a=1, b=3, c=2."}]}, {"id": "c5", "title": "Redox Reactions as the Basis for Titrations: Indicators & Endpoints", "navTitle": "Redox Titrations & Indicators", "minutes": 18, "pages": ["15", "17"], "deck": "Explore permanganometry self-indicators, dichromatometry internal redox indicators, and iodometric starch complexes.", "quick": "Redox titrations determine the unknown concentration of a reductant (or oxidant) using a standard solution of an oxidant (or reductant). Three major titration classes are: (1) Permanganate titrations (Permanganometry): KMnO4 is an intense purple self-indicator; at the endpoint, the first excess drop of MnO4^- imparts a persistent faint pink color; (2) Potassium dichromate titrations (Dichromatometry): K2Cr2O7 is a primary standard but requires an external or internal redox indicator (like diphenylamine) which changes to deep violet at equivalence; (3) Iodometry and Iodimetry: titration of I2 with standard sodium thiosulfate (Na2S2O3) using starch as an indicator, transitioning from intense deep blue to crystal clear colorless.", "formulas": [{"label": "Permanganate Reduction in Acid", "cond": "Self-indicating reduction (faint pink endpoint)", "html": "MnO_4^- + 8H^+ + 5e^- \\to Mn^{2+} + 4H_2O"}, {"label": "Iodometric Thiosulfate Reaction", "cond": "Titration of liberated iodine", "html": "I_2 + 2S_2O_3^{2-} \\to 2I^- + S_4O_6^{2-}"}, {"label": "Liberation of Iodine from Iodide by Oxidant", "cond": "Iodometric step 1", "html": "2Cu^{2+} + 4I^- \\to Cu_2I_2(s) + I_2"}, {"label": "Equivalence Law in Redox Titrations", "cond": "Milliequivalents balance", "html": "N_1 V_1 = N_2 V_2 \\iff (n_1 M_1) V_1 = (n_2 M_2) V_2"}], "deeper": "In iodometric titrations, starch must NOT be added at the beginning when the iodine concentration is high. At high iodine concentrations, iodine forms a strong, stable water-insoluble complex with amylose in starch, which releases iodine extremely slowly and causes a lagging, inaccurate endpoint. Instead, thiosulfate titrant is added until the dark brown solution fades to a pale straw-yellow color (signifying that only trace iodine remains). At that precise moment, starch solution is added, turning the mixture intensely blue. A few final drops of thiosulfate discharge the blue color sharply to water-clear.", "worked": {"title": "Stoichiometry of Iodometric Copper Assay", "problem": "A 25.0 mL sample containing Cu2+ is treated with excess KI, liberating iodine: 2 Cu2+ + 4 I- -> Cu2I2 + I2. The liberated I2 requires 20.0 mL of 0.05 M Na2S2O3 solution for complete titration. Calculate the molarity of Cu2+.", "given": "Volume of Cu2+ = 25.0 mL; Volume of Na2S2O3 = 20.0 mL; Molarity of thiosulfate = 0.05 M.", "steps": ["Moles of thiosulfate = M * V = 0.05 mol/L * 0.020 L = 1.0 * 10^-3 mol.", "From the equation: I2 + 2 S2O3^2- -> 2 I^- + S4O6^2-, 1 mole of I2 reacts with 2 moles of S2O3^2-.", "Moles of I2 = (1.0 * 10^-3) / 2 = 5.0 * 10^-4 mol.", "From 2 Cu2+ -> 1 I2, moles of Cu2+ = 2 * moles of I2 = 2 * (5.0 * 10^-4) = 1.0 * 10^-3 mol.", "Molarity of Cu2+ = moles / volume = (1.0 * 10^-3 mol) / 0.025 L = 0.040 M."], "solution": "The stoichiometric mole ratio Cu2+ : S2O3^2- is exactly 1 : 1.", "answer": "Molarity of Cu2+ is 0.040 M (or 0.04 mol/L)."}, "prediction": {"prompt": "Why can dilute sulfuric acid (H2SO4) be used to acidify KMnO4 titrations, but dilute hydrochloric acid (HCl) cannot?", "options": ["H2SO4 acts as a catalyst, while HCl destroys the conical flask.", "KMnO4 oxidizes chloride ions (Cl^-) in HCl to toxic chlorine gas (Cl2), consuming titrant erroneously.", "HCl precipitates potassium permanganate as insoluble KCl.", "H2SO4 produces a brighter pink color at the endpoint."], "answer": 1, "explanation": "KMnO4 is a sufficiently powerful oxidant (E° = +1.51 V) to oxidize Cl^- to Cl2 (E° = +1.36 V). Part of the KMnO4 is consumed in oxidizing HCl rather than the analyte, causing severe experimental error. Sulfate in H2SO4 cannot be oxidized further."}, "simTitle": "Redox Permanganate & Iodine Titration Simulator", "connect": "Winkler titration is the gold-standard environmental assay used worldwide to measure Dissolved Oxygen (DO) in aquatic ecosystems: dissolved O2 oxidizes Mn(II) to Mn(IV) hydroxide, which quantitatively liberates iodine from KI upon acidification, followed by thiosulfate titration to detect hypoxia in lakes.", "quizzes": [{"tier": "easy", "question": "In a permanganate titration, what indicates that the equivalence point has been reached?", "options": ["A deep blue starch complex appears.", "A persistent faint pink color appears without adding any external indicator.", "The purple solution turns completely green.", "Dense white precipitate of MnSO4 settles."], "answer": 1, "hint": "KMnO4 acts as a self-indicator: Mn2+ is nearly colorless, while unreacted MnO4^- is intensely purple.", "explanation": "During titration, purple MnO4^- is reduced to almost colorless Mn2+. As soon as all analyte is consumed, the very first excess drop of standard KMnO4 imparts a permanent faint pink tint."}, {"tier": "medium", "question": "Why is starch indicator added only when the solution becomes pale straw yellow during an iodometric titration?", "options": ["Starch decomposes if exposed to air for more than 5 minutes.", "At high iodine concentrations, starch forms an insoluble blue complex with iodine that releases iodine very slowly.", "Starch reacts directly with sodium thiosulfate in concentrated solutions.", "Starch is only soluble in cold water."], "answer": 1, "hint": "Think about the reversibility of the starch-iodine adsorption complex at high vs low I2 concentration.", "explanation": "At high I2 concentrations, iodine irreversibly adsorbs into the helical amylose structure of starch, trapping iodine and preventing it from reacting cleanly with thiosulfate, causing a sluggish, inaccurate endpoint."}, {"tier": "hard", "question": "What is the n-factor (valency factor) of potassium dichromate (K2Cr2O7) when it acts as an oxidizing agent in acidic medium?", "options": ["2", "3", "6", "1"], "answer": 2, "hint": "In acidic medium, Cr2O7^2- is reduced to 2 Cr^3+. Count total electrons gained per molecule of K2Cr2O7.", "explanation": "Cr changes from +6 in Cr2O7^2- to +3 in Cr^3+, gaining 3 electrons per chromium atom. Since there are 2 Cr atoms in K2Cr2O7, total electrons gained per mole is 2 * 3 = 6. Thus, n-factor = 6, and Equivalent Weight = Molecular Weight / 6."}]}, {"id": "c6", "title": "Electrochemical Cells & Electrode Potential: The Daniell Cell", "navTitle": "Daniell Cell & Electrode Potentials", "minutes": 18, "pages": ["17", "19"], "deck": "Construct galvanic cells, unravel salt bridge ionic migration, and formulate standard electrode potentials via SHE.", "quick": "A galvanic (voltaic) cell converts spontaneous chemical redox energy into electrical energy. The classic Daniell cell consists of a Zinc anode immersed in ZnSO4 solution (oxidation: Zn -> Zn2+ + 2e-) and a Copper cathode immersed in CuSO4 solution (reduction: Cu2+ + 2e- -> Cu). The two half-cells are connected externally by a wire with a voltmeter and internally by a salt bridge (an inverted U-tube filled with agar gel and inert electrolyte like KCl or KNO3). The salt bridge maintains electrical neutrality by ion migration and prevents accumulation of liquid junction potential. The standard cell potential is E°cell = E°cathode - E°anode = +0.34 V - (-0.76 V) = +1.10 V.", "formulas": [{"label": "Standard Cell Potential (EMF)", "cond": "IUPAC convention (Cathode - Anode)", "html": "E^{\\circ}_{\\text{cell}} = E^{\\circ}_{\\text{right (cathode)}} - E^{\\circ}_{\\text{left (anode)}}"}, {"label": "Daniell Cell Standard Potential", "cond": "Zn-Cu cell at 298 K, 1 M", "html": "E^{\\circ}_{\\text{cell}} = +0.34\\text{ V} - (-0.76\\text{ V}) = +1.10\\text{ V}"}, {"label": "Standard Hydrogen Electrode (SHE)", "cond": "Universal potential benchmark", "html": "E^{\\circ}_{H^+/H_2} = 0.00\\text{ V} \\quad (p_{H_2} = 1\\text{ bar}, [H^+] = 1\\text{ M})"}, {"label": "IUPAC Cell Representation", "cond": "Anode | Solution || Solution | Cathode", "html": "Zn(s) \\mid Zn^{2+}(aq, 1\\text{ M}) \\parallel Cu^{2+}(aq, 1\\text{ M}) \\mid Cu(s)"}], "deeper": "When an external opposing potential (V_ext) is applied to the Daniell cell: (1) If V_ext < 1.10 V, electrons continue flowing from Zn to Cu, and current flows from Cu to Zn; (2) If V_ext = 1.10 V, the opposing electromotive forces balance exactly: no electrons flow, no chemical reaction occurs, and the cell is in thermodynamic equilibrium; (3) If V_ext > 1.10 V, the reaction reverses entirely! Electrons are forced to flow from Cu to Zn, copper dissolves at the positive terminal, zinc plates out at the negative terminal, and the cell acts as an electrolytic cell consuming electrical power.", "worked": {"title": "Calculating Daniell Cell Potential from Electrode Potentials", "problem": "Given standard reduction potentials: E°(Zn2+/Zn) = -0.76 V and E°(Cu2+/Cu) = +0.34 V, write the cell notation and calculate the standard cell EMF.", "given": "E°(Zn2+/Zn) = -0.76 V, E°(Cu2+/Cu) = +0.34 V.", "steps": ["Identify anode and cathode: More negative E° (-0.76 V) undergoes oxidation (anode: Zn -> Zn2+ + 2e-).", "More positive E° (+0.34 V) undergoes reduction (cathode: Cu2+ + 2e- -> Cu).", "Write IUPAC cell notation: Zn(s) | Zn2+(aq, 1 M) || Cu2+(aq, 1 M) | Cu(s).", "Calculate cell EMF: E°cell = E°cathode - E°anode = E°(Cu2+/Cu) - E°(Zn2+/Zn).", "E°cell = +0.34 V - (-0.76 V) = +0.34 V + 0.76 V = +1.10 V."], "solution": "The positive potential confirms spontaneous current generation.", "answer": "Cell notation: Zn | Zn2+(1 M) || Cu2+(1 M) | Cu; E°cell = +1.10 V."}, "prediction": {"prompt": "What happens if the salt bridge is suddenly pulled out of a functioning Daniell cell generating 1.10 V?", "options": ["The voltage doubles to 2.20 V.", "The voltage immediately drops to 0.00 V and current ceases.", "The cell begins generating alternating current (AC).", "Zinc dissolves much faster due to lower resistance."], "answer": 1, "explanation": "Removing the salt bridge breaks the internal electrical circuit and prevents ion counter-diffusion. Charge builds up instantly in both half-cells (+ in zinc beaker, - in copper beaker), halting electron flow completely; cell voltage drops to zero."}, "simTitle": "Daniell Galvanic Cell & Voltmeter Lab", "connect": "Lithium-ion batteries in modern smartphones and electric vehicles utilize the same electrochemical principles: lithium atoms de-intercalate from a graphite anode (oxidation: Li_x C6 -> 6C + xLi+ + xe-), migrate across an organic electrolyte, and intercalate into a lithium cobalt oxide cathode (reduction).", "quizzes": [{"tier": "easy", "question": "What is the primary role of the salt bridge in a galvanic cell?", "options": ["To supply electrons directly to the cathode", "To maintain electrical neutrality in both half-cell solutions and complete the circuit", "To increase the standard cell potential beyond 2.0 V", "To mix the zinc and copper sulfate solutions together"], "answer": 1, "hint": "Consider what happens to charges in the two beakers as Zn2+ ions are produced and Cu2+ ions are consumed.", "explanation": "As Zn oxidizes to Zn2+, positive charge builds up in the anode beaker; as Cu2+ deposits, negative SO4^2- accumulates in the cathode beaker. The salt bridge allows ions (e.g. Cl- to anode, K+ to cathode) to migrate, preserving electrical neutrality without bulk liquid mixing."}, {"tier": "medium", "question": "In the IUPAC representation of a galvanic cell, which component is written on the far left?", "options": ["Cathode metal electrode", "Anode metal electrode (oxidation site)", "Salt bridge double line", "Cathodic electrolyte solution"], "answer": 1, "hint": "Remember the acronym 'LOAN': Left, Oxidation, Anode, Negative.", "explanation": "Under IUPAC conventions, the oxidation half-cell (anode) is always positioned on the left, separated by a single line from its electrolyte, followed by double vertical lines for the salt bridge, and cathode on the right."}, {"tier": "hard", "question": "An external voltage V_ext = 1.40 V is applied against a standard Daniell cell (E° = 1.10 V). What happens in the cell?", "options": ["The cell continues discharging normally with higher current.", "No current flows because the voltages cancel out.", "Current direction reverses: Zn plates out on the zinc rod, Cu dissolves from the copper rod, and it functions as an electrolytic cell.", "Both electrodes dissolve rapidly."], "answer": 2, "hint": "When the external opposing potential exceeds the spontaneous cell EMF (V_ext > E°cell), the reaction is forced in reverse.", "explanation": "Because V_ext = 1.40 V > 1.10 V, the external power source forces electrons in the reverse direction (from Cu to Zn). Zinc ions are reduced and deposit at the zinc electrode, while copper dissolves as Cu2+; the cell acts as an electrolytic cell."}]}, {"id": "c7", "title": "Electrochemical Series & Redox Feasibility", "navTitle": "Electrochemical Series & Feasibility", "minutes": 18, "pages": ["19", "21"], "deck": "Evaluate standard reduction potentials to predict thermodynamic spontaneity (delta G° = -nFE°), metal displacement, and corrosion prevention.", "quick": "The Electrochemical Series arranges electrode redox couples in order of increasing standard reduction potential (E°). A high positive E° indicates a strong affinity for electrons (powerful oxidising agent, e.g. F2/F- with E° = +2.87 V); a large negative E° indicates a high tendency to lose electrons (powerful reducing agent, e.g. Li+/Li with E° = -3.05 V). Thermodynamically, a redox reaction is spontaneous under standard conditions if and only if E°cell > 0, which corresponds to a negative standard Gibbs free energy change: delta G° = -n F E°cell.", "formulas": [{"label": "Thermodynamic Redox Criterion", "cond": "Spontaneous if delta G° < 0", "html": "\\Delta G^{\\circ} = -n F E^{\\circ}_{\\text{cell}}"}, {"label": "Equilibrium Constant Relation", "cond": "Link between EMF and Kc at 298 K", "html": "E^{\\circ}_{\\text{cell}} = \\frac{2.303 RT}{nF} \\log_{10} K = \\frac{0.0591}{n} \\log_{10} K"}, {"label": "Acid Hydrogen Displacement Condition", "cond": "Metal displaces H2 from acid if", "html": "E^{\\circ}_{M^{n+}/M} < 0.00\\text{ V} \\quad (\\text{more negative than SHE})"}, {"label": "Rusting of Iron (Anodic Oxidation)", "cond": "Corrosion cell initiation", "html": "2Fe(s) + O_2(g) + 4H^+(aq) \\to 2Fe^{2+}(aq) + 2H_2O(l)"}], "deeper": "The electrochemical series directly explains why copper metal does not dissolve in dilute hydrochloric acid, but dissolves vigorously in concentrated or dilute nitric acid. In dilute HCl, the only available oxidizing agent is the H+ ion (E° = 0.00 V). Since E°(Cu2+/Cu) = +0.34 V is more positive than SHE, H+ cannot oxidize Cu to Cu2+ (E°cell = -0.34 V < 0, non-spontaneous). In nitric acid, however, nitrate ion in acidic medium (NO3^- + 4H+ + 3e- -> NO + 2H2O) has a standard reduction potential of E° = +0.96 V. Because +0.96 V > +0.34 V, nitrate easily oxidizes copper metal to Cu2+ with E°cell = +0.62 V > 0, evolving nitric oxide gas.", "worked": {"title": "Predicting Spontaneity and Standard Gibbs Energy", "problem": "Calculate delta G° for the reaction: Zn(s) + 2 Ag+(aq) -> Zn2+(aq) + 2 Ag(s). (Given: E°(Ag+/Ag) = +0.80 V, E°(Zn2+/Zn) = -0.76 V, F = 96485 C/mol). Is the reaction spontaneous?", "given": "E°(Ag+/Ag) = +0.80 V, E°(Zn2+/Zn) = -0.76 V, n = 2 electrons transferred.", "steps": ["E°cell = E°cathode - E°anode = E°(Ag+/Ag) - E°(Zn2+/Zn) = +0.80 V - (-0.76 V) = +1.56 V.", "Since E°cell > 0 (+1.56 V), the reaction is thermodynamically spontaneous.", "Calculate delta G°: delta G° = -n F E°cell = -(2) * (96485 C/mol) * (1.56 J/C).", "delta G° = -301,033 J/mol = -301.03 kJ/mol."], "solution": "The large negative delta G° confirms strong forward thermodynamic driving force.", "answer": "E°cell = +1.56 V; delta G° = -301.03 kJ/mol; Spontaneous."}, "prediction": {"prompt": "Can a solution of copper sulfate (CuSO4) be safely stored in an iron container without reacting?", "options": ["Yes, because iron has a higher density than copper.", "No, because iron has a lower reduction potential (-0.44 V) than copper (+0.34 V) and will spontaneously displace copper.", "Yes, because copper forms an impenetrable oxide coating on iron.", "No, because sulfate ions corrode the iron container into rust."], "answer": 1, "explanation": "E°(Fe2+/Fe) = -0.44 V and E°(Cu2+/Cu) = +0.34 V. E°cell = +0.34 - (-0.44) = +0.78 V > 0. Iron spontaneously dissolves as Fe2+, plating out metallic copper and eating holes through the vessel: Fe + Cu2+ -> Fe2+ + Cu."}, "simTitle": "Electrochemical Series & Feasibility Predictor", "connect": "Sacrificial cathodic protection utilizes the electrochemical series to prevent underwater rusting of steel ship hulls and offshore oil drilling platforms: blocks of zinc or magnesium (E° = -0.76 V or -2.37 V) are bolted to the steel hull (E° = -0.44 V), corroding preferentially and sparing the iron.", "quizzes": [{"tier": "easy", "question": "Which of the following metals can liberate hydrogen gas from dilute hydrochloric acid?", "options": ["Copper (E° = +0.34 V)", "Silver (E° = +0.80 V)", "Zinc (E° = -0.76 V)", "Gold (E° = +1.50 V)"], "answer": 2, "hint": "Metals with standard reduction potentials more negative than 0.00 V reduce H+ to H2 gas.", "explanation": "Zinc has E° = -0.76 V < 0.00 V. It spontaneously reduces H+ to H2 (Zn + 2H+ -> Zn2+ + H2, E°cell = +0.76 V > 0). Cu, Ag, and Au have positive reduction potentials and cannot displace H2 from non-oxidizing acids."}, {"tier": "medium", "question": "Given standard potentials: E°(Mg2+/Mg) = -2.37 V and E°(Fe2+/Fe) = -0.44 V. Why is magnesium used as a sacrificial anode for buried iron pipelines?", "options": ["Magnesium has a more positive potential and reduces iron oxide.", "Magnesium has a more negative potential (-2.37 V) and oxidizes preferentially, protecting the iron.", "Magnesium creates a magnetic shield around the iron pipe.", "Magnesium neutralizes soil acidity."], "answer": 1, "hint": "In cathodic protection, the sacrificial metal must be more easily oxidized than iron.", "explanation": "Because E°(Mg2+/Mg) = -2.37 V is far more negative than E°(Fe2+/Fe) = -0.44 V, magnesium oxidizes much more readily than iron. The magnesium anode donates electrons to the iron pipe, keeping iron in its reduced metallic state while magnesium sacrifices itself."}, {"tier": "hard", "question": "If standard cell potential E°cell for a 2-electron redox process is +1.10 V at 298 K, what is the order of magnitude of the equilibrium constant Kc?", "options": ["Kc ≈ 10^10", "Kc ≈ 10^20", "Kc ≈ 10^37", "Kc ≈ 10^-37"], "answer": 2, "hint": "Use E°cell = (0.0591 / n) * log10 Kc. Here n = 2 and E°cell = 1.10 V.", "explanation": "1.10 = (0.0591 / 2) * log10 Kc => log10 Kc = (1.10 * 2) / 0.0591 = 2.20 / 0.0591 ≈ 37.22. Therefore, Kc = 10^37.22 ≈ 1.7 * 10^37, indicating the reaction goes to virtually 100% completion."}]}], "exercises": [{"q": "7.1", "number": "7.1", "title": "Assign oxidation numbers to underlined elements", "conceptIdx": 1, "page": 18, "printPage": 252, "question": "Assign oxidation number to the underlined elements in each of the following species: (a) NaH2PO4, (b) NaHSO4, (c) H4P2O7, (d) K2MnO4, (e) CaO2, (f) NaBH4, (g) H2S2O7, (h) KAl(SO4)2·12 H2O.", "steps": ["(a) NaH2PO4 (P underlined): +1(Na) + 2(+1)(H) + x(P) + 4(-2)(O) = 0 => 1 + 2 + x - 8 = 0 => x = +5.", "(b) NaHSO4 (S underlined): +1(Na) + 1(+1)(H) + x(S) + 4(-2)(O) = 0 => 1 + 1 + x - 8 = 0 => x = +6.", "(c) H4P2O7 (P underlined): 4(+1)(H) + 2x(P) + 7(-2)(O) = 0 => 4 + 2x - 14 = 0 => 2x = 10 => x = +5.", "(d) K2MnO4 (Mn underlined): 2(+1)(K) + x(Mn) + 4(-2)(O) = 0 => 2 + x - 8 = 0 => x = +6.", "(e) CaO2 (O underlined): Calcium is an alkaline earth metal (+2). In calcium peroxide CaO2: +2 + 2x(O) = 0 => 2x = -2 => x = -1 (peroxide linkage).", "(f) NaBH4 (B underlined): +1(Na) + x(B) + 4(-1)(hydridic H) = 0 => 1 + x - 4 = 0 => x = +3.", "(g) H2S2O7 (pyrosulfuric acid / oleum, S underlined): 2(+1)(H) + 2x(S) + 7(-2)(O) = 0 => 2 + 2x - 14 = 0 => 2x = 12 => x = +6.", "(h) KAl(SO4)2·12 H2O (S underlined): Neutral alum molecule. Waters of crystallization are neutral (0). +1(K) + 3(Al) + 2[x(S) + 4(-2)(O)] + 12(0) = 0 => 4 + 2x - 16 = 0 => 2x = 12 => x = +6 (standard sulfate S)."], "answer": "(a) P = +5; (b) S = +6; (c) P = +5; (d) Mn = +6; (e) O = -1; (f) B = +3; (g) S = +6; (h) S = +6."}, {"q": "7.2", "number": "7.2", "title": "Oxidation numbers and rationalization of fractional/apparent states", "conceptIdx": 1, "page": 18, "printPage": 252, "question": "What are the oxidation numbers of the underlined elements in each of the following and how do you rationalise your results? (a) KI3, (b) H2S4O6, (c) Fe3O4, (d) CH3CH2OH, (e) CH3COOH.", "steps": ["(a) KI3 (I underlined): In potassium triiodide, K+ is coordinated to I3^-. Overall average O.N. is -1/3. Structurally, I3^- is composed of an I2 molecule bonded via a coordinate bond to an I^- ion (I-I <- I^-). Thus, two iodine atoms have O.N. = 0 and one iodine atom has O.N. = -1.", "(b) H2S4O6 (tetrathionic acid, S underlined): 2(+1) + 4x + 6(-2) = 0 => 4x = +10 => x = +2.5 (average). Structurally, HO-SO2-S-S-SO2-OH: the two central sulfur atoms are joined by an S-S homonuclear covalent bond, each having O.N. = 0. The two terminal sulfur atoms are bonded to three oxygens each, possessing O.N. = +5. Average = (5 + 0 + 0 + 5)/4 = +2.5.", "(c) Fe3O4 (magnetite, Fe underlined): 3x + 4(-2) = 0 => 3x = +8 => x = +8/3 (average). Magnetite is a mixed oxide: FeO·Fe2O3. In FeO, Fe is in the +2 oxidation state; in Fe2O3, two Fe atoms are in the +3 oxidation state. Average = (2 + 2*3)/3 = +8/3.", "(d) CH3CH2OH (ethanol, C in CH2 underlined): In ethanol, assigning states based on electronegativity: for methyl C (CH3): C is bonded to 3 H (+1 each) and 1 C (0) => O.N. of C(1) = -3. For CH2 carbon: C is bonded to 1 C (0), 2 H (+1 each), and 1 O (-1 contribution to C) => x + 2(+1) - 1 = 0 => x = -1.", "(e) CH3COOH (acetic acid, C in COOH underlined): In CH3COOH, for methyl C: x + 3(+1) = 0 => x = -3. For carboxylic C: bonded to C (0), =O (-2), and -OH (-1) => x - 2 - 1 = 0 => x = +3. Average C oxidation state is (-3 + 3)/2 = 0."], "answer": "(a) Average = -1/3 (two 0, one -1); (b) Average = +2.5 (two 0, two +5); (c) Average = +8/3 (one +2, two +3); (d) C(in CH2) = -1; (e) C(in COOH) = +3."}, {"q": "7.3", "number": "7.3", "title": "Justification of redox nature in five chemical reactions", "conceptIdx": 0, "page": 18, "printPage": 252, "question": "Justify that the following reactions are redox reactions: (a) CuO(s) + H2(g) -> Cu(s) + H2O(g); (b) Fe2O3(s) + 3 CO(g) -> 2 Fe(s) + 3 CO2(g); (c) 4 BCl3(g) + 3 LiAlH4(s) -> 2 B2H6(g) + 3 LiCl(s) + 3 AlCl3(s); (d) 2 K(s) + F2(g) -> 2 K+F^-(s); (e) 4 NH3(g) + 5 O2(g) -> 4 NO(g) + 6 H2O(g).", "steps": ["(a) Cu decreases from +2 in CuO to 0 in Cu(s) (reduction; CuO is oxidant). H increases from 0 in H2 to +1 in H2O (oxidation; H2 is reductant). Hence redox.", "(b) Fe decreases from +3 in Fe2O3 to 0 in Fe(s) (reduction; Fe2O3 is oxidant). Carbon increases from +2 in CO to +4 in CO2 (oxidation; CO is reductant). Hence redox.", "(c) B decreases from +3 in BCl3 to -3 in B2H6 (reduction; BCl3 is oxidant). Hydrogen increases from -1 in LiAlH4 (hydride) to +1 in B2H6 (bonded to more electronegative B) (oxidation; LiAlH4 is reductant). Hence redox.", "(d) K increases from 0 in K(s) to +1 in K+ (oxidation; K is reductant). F decreases from 0 in F2 to -1 in F^- (reduction; F2 is oxidant). Hence redox.", "(e) Nitrogen increases from -3 in NH3 to +2 in NO (oxidation; NH3 is reductant). Oxygen decreases from 0 in O2 to -2 in NO and H2O (reduction; O2 is oxidant). Hence redox."], "answer": "All five reactions involve simultaneous increase and decrease of oxidation numbers (electron transfer) and are therefore redox reactions."}, {"q": "7.4", "number": "7.4", "title": "Fluorine reaction with ice as a redox process", "conceptIdx": 0, "page": 18, "printPage": 252, "question": "Fluorine reacts with ice and results in the change: H2O(s) + F2(g) -> HF(g) + HOF(g). Justify that this reaction is a redox reaction.", "steps": ["Assign oxidation numbers to all atoms before and after the reaction:", "In reactants: In H2O, H = +1, O = -2. In elemental F2, F = 0.", "In products: In HF, H = +1, F = -1. In HOF (hypofluorous acid), H = +1; fluorine is more electronegative than oxygen, so F = -1, and oxygen is therefore in the 0 oxidation state.", "Changes in oxidation states:", "Fluorine atom from F2 (0) goes to -1 in HF and -1 in HOF: decrease in oxidation number from 0 to -1 (reduction; F2 acts as oxidant).", "Oxygen atom from H2O (-2) goes to 0 in HOF: increase in oxidation number from -2 to 0 (oxidation; H2O acts as reductant).", "Since oxidation and reduction occur simultaneously, the reaction is unequivocally a redox reaction."], "answer": "Fluorine is reduced (0 -> -1) and oxygen is oxidised (-2 -> 0); hence it is a redox reaction."}, {"q": "7.5", "number": "7.5", "title": "Oxidation numbers and structures of H2SO5, Cr2O7^2-, and NO3^- (accounting for fallacies)", "conceptIdx": 1, "page": 18, "printPage": 252, "question": "Calculate the oxidation number of sulphur, chromium and nitrogen in H2SO5, Cr2O7^2- and NO3^-. Suggest structure of these compounds. Count for the fallacy.", "steps": ["(1) H2SO5 (Caro's acid): Naive calculation: 2(+1) + x + 5(-2) = 0 => x = +8. Fallacy: S has only 6 valence electrons (Group 16) and cannot exceed +6. Structure: contains one peroxo bridge (-O-O-): HO-SO2-O-O-H. The two peroxo oxygens have O.N. = -1 each; the three oxo oxygens have O.N. = -2. Correct equation: 2(+1) + x + 2(-1) + 3(-2) = 0 => x = +6.", "(2) Cr2O7^2- (dichromate ion): 2x + 7(-2) = -2 => 2x - 14 = -2 => 2x = 12 => x = +6. Structure: two tetrahedral CrO4 units sharing one central bridging oxygen (Cr-O-Cr), with three terminal oxygens on each chromium. No fallacy here; +6 is chromium's maximum group oxidation state.", "(3) NO3^- (nitrate ion): x + 3(-2) = -1 => x - 6 = -1 => x = +5. Structure: planar trigonal nitrogen resonance hybrid with three equivalent N-O bonds. Nitrogen's valence shell has 5 electrons, so +5 corresponds to the maximum group oxidation state with no fallacy."], "answer": "S in H2SO5 = +6 (fallacy avoided by peroxo linkage O.N. = -1); Cr in Cr2O7^2- = +6; N in NO3^- = +5."}, {"q": "7.6", "number": "7.6", "title": "Formulas of compounds using Stock notation", "conceptIdx": 1, "page": 18, "printPage": 252, "question": "Write formulas for the following compounds: (a) Mercury(II) chloride, (b) Nickel(II) sulphate, (c) Tin(IV) oxide, (d) Thallium(I) sulphate, (e) Iron(III) sulphate, (f) Chromium(III) oxide.", "steps": ["(a) Mercury(II) chloride: Hg has O.N. +2, Cl has -1 => HgCl2.", "(b) Nickel(II) sulphate: Ni has O.N. +2, SO4 has -2 => NiSO4.", "(c) Tin(IV) oxide: Sn has O.N. +4, O has -2 => SnO2.", "(d) Thallium(I) sulphate: Tl has O.N. +1, SO4 has -2 => Tl2SO4.", "(e) Iron(III) sulphate: Fe has O.N. +3, SO4 has -2 => Fe2(SO4)3.", "(f) Chromium(III) oxide: Cr has O.N. +3, O has -2 => Cr2O3."], "answer": "(a) HgCl2; (b) NiSO4; (c) SnO2; (d) Tl2SO4; (e) Fe2(SO4)3; (f) Cr2O3."}, {"q": "7.7", "number": "7.7", "title": "Substances exhibiting carbon (-4 to +4) and nitrogen (-3 to +5) oxidation states", "conceptIdx": 1, "page": 18, "printPage": 252, "question": "Suggest a list of the substances where carbon can exhibit oxidation states from -4 to +4 and nitrogen from -3 to +5.", "steps": ["Carbon exhibits oxidation states from -4 to +4 as follows:", "-4 in CH4 (methane); -3 in C2H6 (ethane); -2 in CH3OH (methanol) or CH2Cl2; -1 in C2H2 (ethyne); 0 in CH2O (formaldehyde) or C(diamond/graphite); +1 in C2H2O4 (oxalic acid); +2 in CO (carbon monoxide); +3 in (COOH)2; +4 in CO2 (carbon dioxide) or CF4.", "Nitrogen exhibits oxidation states from -3 to +5 as follows:", "-3 in NH3 (ammonia); -2 in N2H4 (hydrazine); -1 in NH2OH (hydroxylamine); 0 in N2 (elemental dinitrogen); +1 in N2O (nitrous oxide); +2 in NO (nitric oxide); +3 in N2O3 (dinitrogen trioxide) or HNO2; +4 in NO2 (nitrogen dioxide) or N2O4; +5 in N2O5 (dinitrogen pentoxide) or HNO3."], "answer": "Carbon: CH4 (-4), C2H6 (-3), CH3OH (-2), C2H2 (-1), HCHO (0), CO (+2), CO2 (+4). Nitrogen: NH3 (-3), N2H4 (-2), NH2OH (-1), N2 (0), N2O (+1), NO (+2), N2O3 (+3), NO2 (+4), HNO3 (+5)."}, {"q": "7.8", "number": "7.8", "title": "Dual vs exclusive oxidant behavior of SO2, H2O2, O3, and HNO3", "conceptIdx": 2, "page": 18, "printPage": 252, "question": "While sulphur dioxide and hydrogen peroxide can act as oxidising as well as reducing agents in their reactions, ozone and nitric acid act only as oxidants. Why?", "steps": ["For SO2: Sulfur is in oxidation state +4. Sulfur belongs to Group 16 with possible oxidation states ranging from -2 to +6. Since +4 is an intermediate oxidation state, sulfur can increase its O.N. to +6 (acting as reductant) or decrease to 0 or -2 (acting as oxidant).", "For H2O2: Oxygen is in oxidation state -1 (peroxide). The range of oxygen states is -2 to +2 (or 0). Since -1 is intermediate, oxygen can be oxidized to 0 (in O2, reducing agent) or reduced to -2 (in H2O, oxidizing agent).", "For HNO3: Nitrogen is in oxidation state +5, which is its maximum possible oxidation state (Group 15 has 5 valence electrons). Nitrogen cannot be oxidized further; it can only decrease its O.N. by accepting electrons. Therefore, HNO3 acts strictly as an oxidant.", "For O3: Ozone decomposes to O2 + [O]. The nascent oxygen atom has an intense thermodynamic affinity to gain 2 electrons to attain the stable -2 state. Oxygen in ozone cannot easily be oxidized above 0; hence O3 acts exclusively as a powerful oxidant."], "answer": "In SO2 and H2O2, S (+4) and O (-1) are in intermediate states and can be oxidized or reduced. In HNO3, N is in its maximum state (+5) and can only be reduced; O3 readily releases nascent oxygen to attain the -2 state."}, {"q": "7.9", "number": "7.9", "title": "Stoichiometric writing of photosynthesis and ozonolysis reactions and tracer technique", "conceptIdx": 2, "page": 18, "printPage": 253, "question": "Consider the reactions: (a) 6 CO2(g) + 6 H2O(l) -> C6H12O6(aq) + 6 O2(g); (b) O3(g) + H2O2(l) -> H2O(l) + 2 O2(g). Why is it more appropriate to write these reactions as: (a) 6 CO2 + 12 H2O -> C6H12O6 + 6 H2O + 6 O2; (b) O3 + H2O2 -> H2O + O2 + O2? Also suggest a technique to investigate their paths.", "steps": ["(a) In photosynthesis, isotopic tracer studies using 18O-labeled water (H2^18O) prove that all 6 moles of molecular oxygen (6 O2 = 12 oxygen atoms) originate entirely from water, NOT from carbon dioxide. To produce 12 oxygen atoms of O2, 12 molecules of H2O must participate as reactants, yielding 6 H2O molecules regenerated as byproducts. Hence, 6 CO2 + 12 H2O -> C6H12O6 + 6 H2O + 6 O2 reflects the true photochemical mechanism.", "(b) In the reaction O3 + H2O2 -> H2O + O2 + O2, isotopic labeling of H2O2 with 18O demonstrates that one mole of O2 comes exclusively from H2O2 (oxidation: H2^18O2 -> ^18O2 + 2 H+ + 2 e-), while the other mole of O2 comes from ozone (reduction: O3 + 2 H+ + 2 e- -> H2O + O2). Writing O2 + O2 indicates two mechanistically distinct oxygen molecules.", "Technique: The isotopic tracer technique (using stable isotope 18O or radioactive tracers detected via Mass Spectrometry) is used to establish the exact reaction pathways."], "answer": "Writing 12 H2O shows that all evolved O2 comes from H2O; writing O2 + O2 indicates distinct origins (one from O3, one from H2O2). The isotopic tracer technique with 18O is used."}, {"q": "7.10", "number": "7.10", "title": "Instability and powerful oxidizing nature of silver(II) fluoride (AgF2)", "conceptIdx": 6, "page": 19, "printPage": 253, "question": "The compound AgF2 is an unstable compound. However, if formed, the compound acts as a very strong oxidising agent. Why?", "steps": ["In AgF2, silver is in the unusual +2 oxidation state (Ag2+ with electron configuration [Kr] 4d9).", "The standard electronic configuration of silver is [Kr] 4d10 5s1. The +1 oxidation state (Ag+ with completely filled, highly stable [Kr] 4d10 configuration) is exceptionally stable.", "The Ag2+ ion with an incompletely filled 4d9 subshell has a tremendous thermodynamic tendency to gain an electron to reach the fully filled, stable 4d10 configuration of Ag+:", "Ag2+(aq) + e- -> Ag+(aq) with a very large positive reduction potential (E° ≈ +1.98 V).", "Consequently, AgF2 readily oxidizes other substances (even water to oxygen) by accepting an electron, acting as an extraordinarily strong oxidising agent."], "answer": "Ag2+ has a 4d9 configuration and violently seeks one electron to reach the stable 4d10 configuration of Ag+ (E° ≈ +1.98 V), making AgF2 a fierce oxidising agent."}, {"q": "7.11", "number": "7.11", "title": "Dependence of product oxidation state on reactant stoichiometry (excess reductant vs oxidant)", "conceptIdx": 2, "page": 19, "printPage": 253, "question": "Whenever a reaction between an oxidising agent and a reducing agent is carried out, a compound of lower oxidation state is formed if the reducing agent is in excess and a compound of higher oxidation state is formed if the oxidising agent is in excess. Justify this statement giving three illustrations.", "steps": ["Illustration 1 (Carbon with Oxygen):", "Excess reducing agent (C): 2 C(s) + O2(g) [limited] -> 2 CO(g) (C is in lower oxidation state +2).", "Excess oxidising agent (O2): C(s) + O2(g) [excess] -> CO2(g) (C is in higher oxidation state +4).", "Illustration 2 (Phosphorus with Chlorine):", "Excess reducing agent (P4): P4 + 6 Cl2 [limited] -> 4 PCl3 (P is in lower oxidation state +3).", "Excess oxidising agent (Cl2): P4 + 10 Cl2 [excess] -> 4 PCl5 (P is in higher oxidation state +5).", "Illustration 3 (Sulfur with Fluorine):", "Excess reducing agent (S): S8 + 4 F2 [limited] -> 4 S2F2 or S + 3 F2 -> SF4 (S is in state +1 or +4).", "Excess oxidising agent (F2): S + 3 F2 [excess] -> SF6 (S is in its maximum oxidation state +6)."], "answer": "Justified by: (1) C + limited O2 -> CO (+2) vs excess O2 -> CO2 (+4); (2) P4 + limited Cl2 -> PCl3 (+3) vs excess Cl2 -> PCl5 (+5); (3) S + limited F2 -> SF4 (+4) vs excess F2 -> SF6 (+6)."}, {"q": "7.12", "number": "7.12", "title": "Alcoholic KMnO4 in toluene oxidation and H2SO4 reaction with chloride vs bromide", "conceptIdx": 4, "page": 19, "printPage": 253, "question": "How do you account for the following observations? (a) Though alkaline potassium permanganate and acidic potassium permanganate both are used as oxidants, yet in the manufacture of benzoic acid from toluene we use alcoholic potassium permanganate as an oxidant. Why? Write a balanced redox equation for the reaction. (b) When concentrated sulphuric acid is added to an inorganic mixture containing chloride, we get colourless pungent smelling gas HCl, but if the mixture contains bromide then we get red vapour of bromine. Why?", "steps": ["(a) Toluene (C6H5CH3) is an organic non-polar hydrocarbon, insoluble in pure water. Alcohol acts as a mutual solvent that dissolves both non-polar toluene and polar KMnO4, creating a homogeneous single-phase reaction medium for rapid, uniform contact.", "Balanced equation in alkaline alcoholic medium: C6H5CH3 + 2 KMnO4 -> C6H5COOK + 2 MnO2 + KOH + H2O, followed by acidification to yield benzoic acid C6H5COOH.", "(b) Concentrated H2SO4 is a moderately strong oxidizing agent. Chloride ion (Cl^-) has E°(Cl2/Cl^-) = +1.36 V, which is higher than the oxidizing power of concentrated H2SO4 (E° = +0.17 V). Thus, H2SO4 cannot oxidize Cl^- to Cl2; it simply acts as a non-oxidizing acid to displace volatile HCl: NaCl + H2SO4 -> NaHSO4 + HCl(g) (pungent fumes).", "In contrast, bromide ion (Br^-) is a much stronger reducing agent with a lower reduction potential E°(Br2/Br^-) = +1.09 V. Conce
