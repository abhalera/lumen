<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 3: Reproductive Health — Interactive Textbook</title>
<style>
:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  text-align: left;
  background: #0f172a;
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
}
.play-btn {
  flex: none;
  width: 34px;
  height: 34px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 14px;
}
.video-title {
  font-size: 13px;
  line-height: 1.4;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.q-badge {
  background: var(--soft);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 3px 10px;
  border-radius: 6px;
}
.q-concept-link {
  color: var(--blue);
  text-decoration: none;
  font-size: 13px;

ale foeticide"}], "deeper": "Text sequence (PDF pp. 1–3): 1951 family planning → RCH; awareness via governmental and non-governmental agencies plus schools (sex education against myths); care content for fertile and marriageable-age groups (birth control, pregnancy, post-natal, breast feeding, equal opportunities); infrastructure for reproduction-related problems; ban on sex-determination and immunisation as named programmes; research including ‘Saheli’ developed at CDRI Lucknow (detailed in §3.2). Improvement is judged by assisted deliveries, post-natal care, maternal/infant mortality, small families, STD detection/cure and sex-related medical facilities.", "worked": "Worked (why sex education?): the book argues adolescents otherwise rely on myths and misconceptions. The correct chain is: right information on organs, adolescence changes, hygienic practices and STDs/AIDS → reproductively healthy decisions in the adolescent group. This is an awareness measure, not a contraceptive method, and sits alongside adult counselling on birth control and maternal care.", "prediction": {"prompt": "Which pair of actions best matches the book's RCH strategy?", "options": ["Create awareness (organs, adolescence, STDs/AIDS, birth control) and provide medical infrastructure for pregnancy, delivery, contraception and infertility", "Only distribute contraceptives with no counselling or follow-up care", "Use amniocentesis to determine sex and then select the child"], "answer": 0, "explanation": "Section 3.1 tasks are awareness plus facilities/support. Sex-determination by amniocentesis is statutorily banned to check female foeticide."}, "connect": [["Sex education against myths", "NCERT explicitly asks schools to give right information so children do not believe myths about sex-related aspects — the same awareness logic behind media campaigns and counselling of marriageable-age couples.", [], {"id": "48gImtbYLsQ", "title": "Reproductive Health Class 12 One Shot | NCERT + PYQs | Biology tors on p. 43.", "wrong": ["Opposite of the book's indicators.", "The book calls this a disturbing trend (§3.3), not improvement."]}], "resources": [{"title": "NCERT §3.1 — RCH: problems & strategies (official PDF, PDF p.1)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo103.pdf#page=1"}]}, {"id": "population-contraception", "nav": "Population & birth control", "title": "From 350 million to 1.2 billion: every contraceptive class in the book, no invented numbers", "deck": "In-text heading is ‘Population Stabilisation and Birth Control’ (TOC says ‘Explosion’). World 2B→6B→7.2B; India ~350M at independence to 1.2B in May 2011. Ideal contraceptive criteria plus natural, barrier, IUD, pill, injectable/implant, emergency and surgical methods — all qualitative, as the book gives them.", "minutes": 10, "section": "3.2", "pages": [3, 6], "print": "3–6", "sim": "contraception", "simTitle": "Method comparator: type · mechanism · book facts (no invented rates)", "quick": ["In the last century health facilities and living conditions explosively raised population. World: around <strong>2 billion in 1900 → about 6 billion by 2000 → 7.2 billion in 2011</strong>. India: approximately <strong>350 million at independence → close to a billion by 2000 → crossed 1.2 billion in May 2011</strong>. Probable reasons: rapid decline in death rate, maternal mortality rate (MMR) and infant mortality rate (IMR), plus more people in reproductive age. RCH cut the growth rate only marginally; the <strong>2011 census growth rate was less than 2 per cent (20/1000/year)</strong>, still rapid enough to threaten scarcity of food, shelter and clothing.", "Responses: motivate smaller families with contraceptives (<strong>Hum Do Hamare Do</strong>; many young urban working couples adopt a one-child norm), <strong>statutory marriageable age 18 years (female) and 21 years (males)</strong>, and incentives for small families. An <strong>ideal contraceptive</strong> is user-friendly, easily available, effective and reversible with no or least side-effects, and must not interfere with sexual drive, desire or the sexual act. Categories: <strong>Natural/Traditional, Barrier, IUDs, Oral contraceptives, Injectables, Implants and Surgical methods</strong>.", "<strong>Natural methods</strong> avoid ovum–sperm meeting with no devices: <strong>periodic abstinence</strong> (no coitus day <strong>10–17</strong> of the cycle, the fertile period around ovulation), <strong>withdrawal/coitus interruptus</strong> (penis withdrawn before ejaculation), and <strong>lactational amenorrhoea</strong> (no ovulation during intense lactation after parturition; effective only up to <strong>six months</strong> with full breast-feeding; chances of conception almost nil). Side effects almost nil; failure chances high. <strong>Barriers</strong> block meeting: <strong>condoms</strong> (thin rubber/latex on penis or vagina–cervix; ‘Nirodh’ male brand; disposable, self-inserted, private; added STI/AIDS protection), and <strong>diaphragms, cervical caps, vaults</strong> (rubber, cover cervix, reusable) usually with <strong>spermicidal creams/jellies/foams</strong>.", "<strong>IUDs</strong> (inserted by doctors/expert nurses through vagina): non-medicated <strong>Lippes loop</strong>, copper-releasing <strong>CuT, Cu7, Multiload 375</strong>, hormone-releasing <strong>Progestasert, LNG-20</strong>. They increase <strong>phagocytosis of sperms</strong>; <strong>Cu ions suppress sperm motility and fertilising capacity</strong>; hormone IUDs additionally make the <strong>uterus unsuitable for implantation</strong> and the <strong>cervix hostile to sperms</strong>. Ideal for delaying/spacing; among the most widely accepted in India. <strong>Pills</strong>: small daily doses of <strong>progestogen or progestogen–estrogen</strong> for <strong>21 days starting within the first five days of the cycle, then a 7-day gap</strong>; they <strong>inhibit ovulation and implantation</strong> and <strong>alter cervical mucus</strong> against sperm entry; very effective with lesser side effects. <strong>Saheli</strong> is a non-steroidal <strong>once-a-week</strong> pill. <strong>Injectables/implants</strong> (progestogen ± estrogen) act like pills but longer. <strong>Emergency contraceptives</strong> (progestogen/progestogen–estrogen or IUDs) <strong>within 72 hours</strong> of rape or unprotected intercourse. <strong>Surgical/sterilisation</strong> (terminal): <strong>vasectomy</strong> (vas deferens cut/tied via scrotal incision) and <strong>tubectomy</strong> (fallopian tube cut/tied via abdominal/vaginal incision) <strong>block gamete transport</strong>; highly effective, <strong>reversibility very poor</strong>. Use under qualified medical advice; contraceptives oppose conception/pregnancy and carry possible ill-effects (nausea, abdominal/breakthrough/irregular bleeding, even breast cancer — not very significant but not to be ignored)."], "formulas": [{"label": "Natural windows", "html": "fertile period day 10–17 (abstain); lactational amenorrhoea effective only ≤ 6 months with full breast-feeding", "cond": "No devices; side effects ~nil; failure chances high"}, {"label": "Pill and emergency schedule", "html": "pills 21 days from first 5 days of cycle + 7-day gap; Saheli once a week (non-steroidal); emergency ≤ 72 h of coitus", "cond": "Pills inhibit ovulation/implantation + alter cervical mucus"}, {"label": "IUD classes and surgery", "html": "Lippes loop | CuT, Cu7, Multiload 375 | Progestasert, LNG-20; surgery blocks gamete transport (vasectomy/tubectomy)", "cond": "Cu: motility/fertilising capacity; hormone: uterus + cervix; surgery: poor reversibility"}], "deeper": "Zoom-verified names (PDF pp. 4–6): condoms Fig. 3.1a/b; Copper T Fig. 3.2; implants Fig. 3.3; vasectomy/tubectomy Fig. 3.4a/b. IUD mechanism sentence: phagocytosis + Cu-ion suppression + hormone dual action. Pill mechanism sentence: ovulation + implantation + mucus. Marriageable-age and s abstain then.", "wrong": ["Pills start within the first five days; that is a different rule.", "Menstruation occurs in the 7-day pill gap, not the fertile window."]}, {"level": "Medium", "type": "mcq", "prompt": "Copper-releasing IUDs named in the book are", "options": ["CuT, Cu7, Multiload 375", "Progestasert, LNG-20", "Lippes loop only"], "answer": 0, "hint": "Three groups on p. 44.", "solution": "CuT/Cu7/Multiload 375 release copper; Progestasert/LNG-20 are hormone-releasing; Lippes loop is non-medicated.", "wrong": ["Those are the hormone-releasing IUDs.", "That is the non-medicated example."]}, {"level": "Hard", "type": "mcq", "prompt": "As stated in the book, emergency contraceptives are effective when used", "options": ["within 72 hours of coitus", "only after 6 months of lactation", "only after 24 weeks of pregnancy"], "answer": 0, "hint": "p. 45, rape or casual unprotected intercourse.", "solution": "Progestogen/progestogen–estrogen or IUDs within 72 hours can avoid possible pregnancy.", "wrong": ["Six months is the lactational-amenorrhoea limit.", "24 weeks is the MTP opinion-rule limit (§3.3), not emergency contraception."]}], "resources": [{"title": "NCERT §3.2 — Population & birth control (official PDF, PDF p.3)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo103.pdf#page=3"}]}, {"id": "mtp", "nav": "MTP", "title": "MTP: legal since 1971, relatively safe to 12 weeks, with 12/24-week opinion rules", "deck": "Intentional termination before full term. 45–50 million MTPs yearly (~1/5 of conceptions). India legalised MTP in 1971; the 2017 Amendment box allows ≤12 weeks on one RMP's opinion and >12–<24 weeks on two RMPs' opinions on stated grounds. Misuse for female foeticide is illegal.", "minutes": 8, "section": "3.3", "pages": [6, 7], "print": "6–7", "sim": "mtp", "simTitle": "Legal-window explainer: 12-week / 24-week opinion rules (2017 Amendment box)", "quick": ["<strong>Medical termination of pregnancy (MTP) or induced abortion</strong> is intentional or voluntary termination before full term. Nearly <strong>45–50 million MTPs</strong> are performed yearly worldwide — about <strong>one-fifth</strong> of conceived pregnancies. Legalisation is debated on emotional, ethical, religious and social grounds; the <strong>Government of India legalised MTP in 1971</strong> with strict conditions to avoid misuse, especially to check indiscriminate illegal <strong>female foeticides</strong>.", "Why MTP: to get rid of <strong>unwanted pregnancies</strong> from casual unprotected intercourse, contraceptive failure or rapes, and where continuing the pregnancy could be <strong>harmful or fatal to mother or foetus or both</strong>. MTPs are considered <strong>relatively safe during the first trimester, up to 12 weeks</strong>; second-trimester abortions are much riskier.", "Two unhealthy trends: a majority of MTPs performed <strong>illegally by unqualified quacks</strong> (unsafe, possibly fatal), and <strong>misuse of amniocentesis</strong> to find foetal sex followed by MTP if female — totally against what is legal. Effective counselling against unprotected coitus and illegal abortion, plus more health-care facilities, should reverse the trend.", "The <strong>MTP (Amendment) Act, 2017</strong> box (p. 46) aims to reduce illegal abortion and maternal mortality/morbidity. A pregnancy may be terminated <strong>within the first 12 weeks on the opinion of one registered medical practitioner</strong>; if it has lasted <strong>more than 12 weeks but fewer than 24 weeks, two registered medical practitioners</strong> must opine in good faith that the grounds exist: <strong>(i)</strong> continuation risks the woman's life or grave injury to physical or mental health; or <strong>(ii)</strong> substantial risk the child would suffer abnormalities amounting to serious handicap."], "formulas": [{"label": "Safety window", "html": "first trimester, up to 12 weeks: relatively safe; second trimester: much riskier", "cond": "Section 3.3, p. 46"}, {"label": "Opinion rule (2017 box)", "html": "≤ 12 weeks: one RMP opinion; &gt; 12 and &lt; 24 weeks: two RMP opinions in good faith", "cond": "On the considered grounds stated in the Act"}, {"label": "Grounds", "html": "(i) risk to woman's life / grave injury to health; (ii) substantial risk of serious handicap to the child", "cond": "Both from the Amendment box, p. 46"}], "deeper": "Exact box wording preserved: ‘within the first 12 weeks … on the opinion of one registered medical practitioner’ and ‘more than 12 weeks, but fewer than 24 weeks, two registered medical practitioners must be of the opinion, formed in good faith’. Grounds (i)–(ii) quoted as in the book, including the box's line-break typo ‘(ii There is a substantial risk that of the child were born…’ read as ‘if the child were born’.", "worked": "Worked (apply the box): at 8 weeks with a qualifying ground, one RMP's opinion suffices; at 20 weeks, two RMPs must concur in good faith. Beyond the book: the box states ‘fewer than 24 weeks’, so 24+ weeks is outside the stated rule — refer to the Act and medical advice rather than this chapter.", "prediction": {"prompt": "A pregnancy of 20 weeks is sought to be terminated on a ground listed in the 2017 box. How many RMP opinions does the book's box require?", "options": ["Two registered medical practitioners, in good faith", "One registered medical practitioner only", "No medical opinion is needed"], "answer": 0, "explanation": "More than 12 but fewer than 24 weeks needs two RMPs under the Amendment box."}, "connect": [["Quacks vs safe care", "The book contrasts relatively safe first-trimester MTP under care with illegal abortions by unqualified quacks — the same infrastructure gap RCH is meant to close."], ["Wow — one-fifth of conceptions", "45–50 million MTPs a year is about 1/5 of all conceived pregnancies worldwide — the book's own scale for why safe, legal, counselled care matters."]], "recall": "State the 1971 fact, the 12-week safety line, and the 2017 opinion rule with both grounds.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "MTP was legalised in India in", "options": ["1971", "1951", "2011"], "answer": 0, "hint": "p. 46, with strict conditions.", "solution": "Government of India legalised MTP in 1971 to avoid misuse.", "wrong": ["1951 is family planning, not MTP.", "2011 is the census/population reference year."]}, {"level": "Medium", "type": "mcq", "prompt": "Under the 2017 Amendment box, termination at 8 weeks needs", "options": ["opinion of one registered medical practitioner", "opinion of two registered medical practitioners", "no opinion"], "answer": 0, "hint": "First 12 weeks rule.", "solution": "Within the first 12 weeks, one RMP's opinion on the considered grounds.", "wrong": ["Two RMPs are for >12 and <24 weeks.", "An opinion is always required in the box."]}, {"level": "Hard", "type": "mcq", "prompt": "Which is a listed ground for termination in the 2017 box?", "options": ["Substantial risk the child, if born, would be seriously handicapped", "Desire to select the sex of the child", "No ground is ever needed"], "answer": 0, "hint": "Ground (ii).", "solution": "Ground (ii): substantial risk of physical or mental abnormalities amounting to serious handicap.", "wrong": ["Sex-selection followed by MTP is totally against what is legal.", "The box requires considered grounds with RMP opinion(s)."]}], "resources": [{"title": "NCERT §3.3 — MTP (official PDF, PDF p.6)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo103.pdf#page=6"}]}, {"id": "stis", "nav": "STIs", "title": "STIs: most curable if caught early — except HIV, hepatitis-B and genital herpes", "deck": "In-text heading is ‘Sexually Transmitted Infections (STIs)’ (TOC says ‘Diseases’). Eight named infections, minor early symptoms, asymptomatic females, PID/infertility/cancer complications, peak at 15–24, and three prevention principles including condoms.", "minutes": 8, "section": "3.4", "pages": [7, 7], "print": "7", "sim": "sti", "simTitle": "Preventable/curable classifier: which STIs are curable if caught early?", "quick": ["In-text heading: <strong>SEXUALLY TRANSMITTED INFECTIONS (STIs)</strong> — the contents page calls this section ‘Sexually Transmitted Diseases’. They are also called <strong>venereal diseases (VD) or reproductive tract infections (RTI)</strong>. Named commons: <strong>gonorrhoea, syphilis, genital herpes, chlamydiasis, genital warts, trichomoniasis, hepatitis-B</strong> and <strong>HIV leading to AIDS</strong> (HIV detailed in Chapter 7).", "Besides sexual intercourse, <strong>hepatitis-B and HIV</strong> can spread by <strong>sharing injection needles/surgical instruments</strong>, <strong>blood transfusion</strong>, or <strong>infected mother to foetus</strong>. <strong>Except hepatitis-B, genital herpes and HIV</strong>, other diseases are <strong>completely curable if detected early and treated properly</strong>. Early symptoms are minor — itching, fluid discharge, slight pain, swellings in the genital region; infected females are often <strong>asymptomatic</strong> and stay undetected. Stigma and weak symptoms delay detection, leading to <strong>pelvic inflammatory diseases (PID), abortions, still births, ectopic pregnancies, infertility or even cancer</strong> of the reproductive tract.", "STIs threaten a healthy society, so <strong>prevention, early detection and cure</strong> get prime consideration under reproductive health-care programmes. Incidence is very high at <strong>15–24 years</strong>. Prevention principles: <strong>(i)</strong> avoid sex with unknown/multiple partners; <strong>(ii)</strong> always use <strong>condoms</strong> during coitus; <strong>(iii)</strong> in doubt, consult a <strong>qualified doctor</strong> early and take complete treatment if diagnosed."], "formulas": [{"label": "Curability classifier", "html": "curable if early: gonorrhoea · syphilis · chlamydiasis · genital warts · trichomoniasis; NOT completely curable: HIV · hepatitis-B · genital herpes", "cond": "p. 47; early detection + proper treatment"}, {"label": "Non-sexual routes", "html": "HIV + hepatitis-B also via needles/instruments · transfusion · mother→foetus", "cond": "Other listed STIs: sexual transmission as defined"}, {"label": "Prevention triad", "html": "(i) no unknown/multiple partners · (ii) condoms · (iii) qualified doctor + complete treatment", "cond": "Section 3.4 closing principles"}], "deeper": "Why 15–24 matters: the book places the reader in that very age group (‘the age group to which you also belong’) while stating there is no reason to panic because prevention is possible. Complications list and asymptomatic-female warning explain why ‘minor’ early signs must still trigger a qualified-doctor visit rather than silence due to stigma.", "worked": "Worked (classifier): discharge with slight pain → suspect STI → qualified doctor immediately; if diagnosed gonorrhoea/syphilis/chlamydiasis/warts/trichomoniasis, complete cure is expected with early proper treatment; if HIV/hepatitis-B/genital herpes, the book excludes complete cure — management, not the curable set. Condoms during coitus additionally protect (cf. §3.2 barrier benefit against STIs/AIDS).", "prediction": {"prompt": "Two patients are diagnosed early: one with syphilis, one with HIV. What does the book say about curability?", "options": ["Syphilis is completely curable with early proper treatment; HIV is in the excepted (not completely curable) group", "Both are completely curable with any brief treatment", "Neither needs a qualified doctor"], "answer": 0, "explanation": "Except hepatitis-B, genital herpes and HIV, other listed STIs are completely curable if detected early and treated properly."}, "connect": [["Condoms do double duty", "The same condoms in §3.2 (including ‘Nirodh’) reappear here as prevention principle (ii) — contraception plus STI/AIDS protection, which is why the book notes their increased recent use."], ["Wow — the silent cases", "Infected females may be asymptomatic for long, so infections remain undetected — the book's reason that stigma plus mild symptoms is itself a medical risk factor for PID, ectopy and infertility later."]], "recall": "Name the eight STIs, the three exceptions to complete cure, the non-sexual routes, and the three prevention principles.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Which group is NOT completely curable according to the book?", "options": ["HIV, hepatitis-B and genital herpes", "Gonorrhoea, syphilis and chlamydiasis", "Trichomoniasis and genital warts"], "answer": 0, "hint": "‘Except for …’ sentence, p. 47.", "solution": "Hepatitis-B, genital herpes and HIV are excepted; the others are completely curable if detected early and treated properly.", "wrong": ["Those are in the curable-with-early-treatment set.", "Those are in the curable-with-early-treatment set."]}, {"level": "Medium", "type": "mcq", "prompt": "Hepatitis-B and HIV can additionally spread through", "options": ["shared needles/instruments, blood transfusion, mother to foetus", "only through casual touch", "only through the air"], "answer": 0, "hint": "Second paragraph of §3.4.", "solution": "The book lists needles/instruments, transfusion and mother-to-foetus routes for these two.", "wrong": ["Not stated in the book.", "Not stated in the book."]}, {"level": "Hard", "type": "mcq", "prompt": "Late complications of undetected STIs listed in the book include", "options": ["PID, abortions, still births, ectopic pregnancies, infertility, reproductive-tract cancer", "only a brief itch with no sequelae", "immediate immunity to all later infections"], "answer": 0, "hint": "Complications sentence, p. 47.", "solution": "Delayed detection can lead to exactly that complication set.", "wrong": ["Early symptoms are minor, but complications are not.", "No such immunity is claimed."]}], "resources": [{"title": "NCERT §3.4 — STIs (official PDF, PDF p.7)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo103.pdf#page=7"}]}, {"id": "infertility-art", "nav": "Infertility & ART", "title": "Infertility and ART: ZIFT at ≤8 blastomeres, IUT above, plus GIFT, ICSI and AI", "deck": "Inability to produce children despite unprotected cohabitation (summary: even after 2 years). Often the male partner, not only the female. IVF-ET with ZIFT/IUT, GIFT, ICSI and AI/IUI under precision care — plus legal adoption as one of the best options.", "minutes": 9, "section": "3.5", "pages": [7, 8], "print": "7–8", "sim": "art", "simTitle": "ART matcher: IVF-ET · ZIFT · IUT · GIFT · ICSI · AI/IUI", "quick": ["<strong>Infertility</strong> is inability to produce children despite <strong>unprotected sexual cohabitation</strong> (the chapter summary specifies <strong>even after 2 years</strong>). Causes may be <strong>physical, congenital, diseases, drugs, immunological or even psychological</strong>. In India the female is often blamed, but <strong>more often the problem lies in the male partner</strong>. Infertility clinics can diagnose and correct some disorders; otherwise <strong>assisted reproductive technologies (ART)</strong> assist.", "<strong>IVF (fertilisation outside the body under simulated conditions) followed by embryo transfer (ET)</strong> — the <strong>‘test tube baby’ programme</strong> — collects ova (wife/donor) and sperms (husband/donor) to form the zygote in the laboratory. The <strong>zygote or early embryos up to 8 blastomeres go into the fallopian tube (ZIFT — zygote intra fallopian transfer)</strong>; <strong>embryos with more than 8 blastomeres go into the uterus (IUT — intra uterine transfer)</strong> for further development. Embryos from <strong>in-vivo fertilisation</strong> can also be transferred to assist females who cannot conceive.", "<strong>GIFT (gamete intra fallopian transfer)</strong> places a <strong>donor ovum into the fallopian tube</strong> of a female who cannot produce one but can support fertilisation and development. <strong>ICSI (intra cytoplasmic sperm injection)</strong> injects a <strong>sperm directly into the ovum</strong> in the laboratory. <strong>AI (artificial insemination)</strong> corrects inability to inseminate or very low sperm counts: semen (husband/healthy donor) is introduced into the <strong>vagina or uterus (IUI — intra-uterine insemination)</strong>.", "All techniques need <strong>extremely high precision handling by specialists with expensive instrumentation</strong>, available in very few centres and affordable to few; <strong>emotional, religious and social factors</strong> also deter adoption. India has many orphaned/destitute children; <strong>legal adoption is permitted and is as yet one of the best methods</strong> for couples seeking parenthood."], "formulas": [{"label": "ET blastomere rule", "html": "≤ 8 blastomeres → fallopian tube (ZIFT); &gt; 8 blastomeres → uterus (IUT)", "cond": "IVF-ET, p. 48; in-vivo embryos also transferable"}, {"label": "GIFT · ICSI · AI", "html": "GIFT: donor ovum → fallopian; ICSI: sperm → into ovum; AI/IUI: semen → vagina/uterus", "cond": "AI for non-insemination or very low counts"}, {"label": "Infertility threshold", "html": "no conception after 2 years of unprotected cohabitation", "cond": "Summary, p. 49 (main text: unprotected co-habitation)"}], "deeper": "Donor logic preserved exactly: ova from wife/donor and sperms from husband/donor for IVF; GIFT ovum from a donor into another female's tube; AI semen from husband or healthy donor. ‘Test tube baby’ = IVF–ET popular name. IUT vs ZIFT differ only by blastomere count and destination tube/uterus in the book's sentence.", "worked": "Worked (choose the transfer): 4-blastomere laboratory zygote → ZIFT into the fallopian tube; 12-blastomere embryo → IUT into the uterus; donor ovum for a female who cannot produce one but can carry → GIFT; sperm-count too low for natural insemination → AI/IUI. Each choice follows the book's one-sentence definition, not clinical judgement beyond the chapter.", "prediction": {"prompt": "A laboratory embryo has more than 8 blastomeres. Where does the book send it?", "options": ["Into the uterus (IUT — intra uterine transfer)", "Into the fallopian tube (ZIFT)", "Into the donor's ovary"], "answer": 0, "explanation": "Up to 8 blastomeres → ZIFT (tube); more than 8 → IUT (uterus), p. 48."}, "connect": [["Test-tube baby, precisely", "‘Test tube baby’ is only the popular name for IVF followed by ET — the laboratory step plus the ZIFT/IUT transfer step that completes development in the female tract."], ["Wow — adoption as the humane option", "After pages of precision laboratories, the book closes by noting India's orphaned children and calling legal adoption ‘as yet, one of the best methods’ for parenthood — a social answer beside the technical ones."]], "recall": "Define infertility with the 2-year threshold and match IVF/ZIFT/IUT/GIFT/ICSI/AI-IUI to donor, count and destination.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "ZIFT transfers a zygote or early embryo (up to 8 blastomeres) into the", "options": ["fallopian tube", "uterus", "cervix only"], "answer": 0, "hint": "Zygote intra fallopian transfer.", "solution": "ZIFT: up to 8 blastomeres into the fallopian tube; IUT handles more than 8 into the uterus.", "wrong": ["That is IUT's destination.", "Not a transfer destination in the book."]}, {"level": "Medium", "type": "mcq", "prompt": "GIFT is", "options": ["transfer of a donor ovum into the fallopian tube of a female who cannot produce one", "injection of sperm directly into the ovum", "introduction of semen into the vagina/uterus"], "answer": 0, "hint": "Gamete intra fallopian transfer.", "solution": "GIFT moves the ovum; ICSI injects sperm into ovum; AI/IUI introduces semen.", "wrong": ["That is ICSI.", "That is AI (IUI when intra-uterine)."]}, {"level": "Hard", "type": "mcq", "prompt": "The chapter summary defines infertility as inability to conceive or produce children even after", "options": ["2 years of unprotected sexual cohabitation", "6 months of lactation", "72 hours of coitus"], "answer": 0, "hint": "Summary, p. 49.", "solution": "Summary threshold is 2 years; main text says unprotected co-habitation without restating the duration.", "wrong": ["Six months is the lactational-amenorrhoea limit.", "72 hours is the emergency-contraceptive window."]}], "resources": [{"title": "NCERT §3.5 — Infertility & ART (official PDF, PDF p.7)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo103.pdf#page=7"}]}], "exercises": [{"number": "1", "conceptIdx": 0, "page": 10, "printPage": null, "question": "What do you think is the significance of reproductive health in a society?", "steps": ["Reproductive health is total well-being — physical, emotional, behavioural and social (WHO) — not merely healthy organs.", "A reproductively healthy society has normal organs and healthy sex-related interactions, stable desired-size families, and responsible attitudes to population, abuse and crimes.", "It lowers maternal/infant mortality, improves STD detection/cure and maternal/child care, and builds a socially responsible population."], "answer": "Healthy organs plus WHO total well-being; stable healthy families, lower MMR/IMR, better STD/maternal care and a socially responsible society."}, {"number": "2", "conceptIdx": 0, "page": 10, "printPage": null, "question": "Suggest the aspects of reproductive health which need to be given special attention in the present scenario.", "steps": ["Counselling and awareness: organs, adolescence changes, safe hygienic practices, STDs including AIDS, birth control, pregnancy and post-natal care, breast feeding, equal opportunities.", "Medical facilities and care: menstrual problems, pregnancy, delivery, MTP, STDs, birth control, infertility, post-natal mother–child management.", "Infrastructure, expertise, sex education in schools, marriageable-age and small-family norms, ban on sex-determination, immunisation and research."], "answer": "Awareness/sex education plus full medical, infrastructural and legal support across the RCH list above."}, {"number": "3", "conceptIdx": 0, "page": 10, "printPage": null, "question": "Is sex education necessary in schools? Why?", "steps": ["Yes. The book explicitly encourages introducing sex education in schools.", "It gives right information on organs, adolescence changes, safe hygienic practices, STDs/AIDS, and discourages myths and misconceptions.", "This helps adolescents, especially, lead a reproductively healthy life."], "answer": "Yes — right information replacing myths, CBC: organs, adolescence, hygiene, STDs/AIDS."}, {"number": "4", "conceptIdx": 0, "page": 10, "printPage": null, "question": "Do you think that reproductive health in our country has improved in the past 50 years? If yes, mention some such areas of improvement.", "steps": ["Yes. The book lists clear indicators of improvement.", "Better awareness of sex-related matters, more medically assisted deliveries, better post-natal care with decreased maternal and infant mortality.", "More couples with small families, better detection and cure of STDs, and overall increased medical facilities for sex-related problems."], "answer": "Yes — awareness, assisted deliveries, post-natal care, lower MMR/IMR, small families, STD detection/cure, wider facilities."}, {"number": "5", "conceptIdx": 1, "page": 10, "printPage": null, "question": "What are the suggested reasons for population explosion?", "steps": ["Rapid decline in death rate, maternal mortality rate (MMR) and infant mortality rate (IMR), plus more people in reproducible age.", "Better health facilities and living conditions; RCH cut growth only marginally — 2011 census growth still under 2 per cent (20/1000/year).", "Scale: world about 2 billion (1900) to 6 billion (2000) to 7.2 billion (2011); India about 350 million at independence to near a billion by 2000, crossing 1.2 billion in May 2011."], "answer": "Falling death/MMR/IMR with more reproductive-age people and better living conditions; see the book's world/India figures."}, {"number": "6", "conceptIdx": 1, "page": 10, "printPage": null, "question": "Is the use of contraceptives justified? Give reasons.", "steps": ["Yes, with medical consultation. Contraceptives prevent, delay or space pregnancy for personal reasons and check uncontrolled population growth.", "They serve Hum Do Hamare Do / small-family goals when chosen suitably and used as advised.", "They are not regular health requirements — they oppose conception — and possible ill-effects (nausea, pain, bleeding irregularities, even breast cancer, though not very significant) must not be ignored."], "answer": "Justified to avoid/delay/space pregnancy and stabilise population, under qualified advice, accepting the stated risks."}, {"number": "7", "conceptIdx": 1, "page": 10, "printPage": null, "question": "Removal of gonads cannot be considered as a contraceptive option. Why?", "steps": ["An ideal contraceptive is reversible and must not interfere with drive, desire or the sexual act.", "Gonad removal permanently ends gamete formation and gonadal hormones, affecting drive and physiology irreversibly.", "Surgical contraception in the book (vasectomy/tubectomy) only blocks gamete transport; it does not remove gonads or stop formation."], "answer": "Gonad removal is irreversible sterilisation with hormonal loss — not a reversible transport-blocking contraceptive."}, {"number": "8", "conceptIdx": 2, "page": 10, "printPage": null, "question": "Amniocentesis for sex determination is banned in our country. Is this ban necessary? Comment.", "steps": ["Yes. Amniocentesis legitimately tests fetal cells/fluid for Down syndrome, haemophilia, sickle-cell anaemia and survivability.", "It was misused to determine foetal sex, followed by illegal MTP when female — female foeticide.", "The statutory ban legally checks this menace; misuse trends are condemned in both §3.1 and §3.3."], "answer": "Yes — the ban stops sex-determination misuse and consequent illegal female foeticide while preserving diagnostic use."}, {"number": "9", "conceptIdx": 4, "page": 10, "printPage": null, "question": "Suggest some methods to assist infertile couples to have children.", "steps": ["Diagnose and correct treatable disorders in infertility clinics first.", "ART: IVF-ET (test-tube baby) with ZIFT (up to 8 blastomeres to tube) or IUT (more than 8 to uterus); GIFT (donor ovum to tube); ICSI (sperm into ovum); AI/IUI (semen into vagina/uterus).", "Note limits (precision, cost, few centres, social factors); legal adoption is one of the best methods."], "answer": "Correctable treatment plus IVF/ZIFT/IUT, GIFT, ICSI, AI/IUI; adoption as the humane alternative."}, {"number": "10", "conceptIdx": 3, "page": 10, "printPage": null, "question": "What are the measures one has to take to prevent from contracting STDs?", "steps": ["Avoid sex with unknown/multiple partners.", "Always use condoms during coitus.", "In doubt, consult a qualified doctor early and complete the full treatment if diagnosed."], "answer": "The book's triad: safe partner choice, condoms, early qualified-doctor detection with complete treatment."}, {"number": "11", "conceptIdx": 0, "page": 10, "printPage": null, "question": "State True/False with explanation (a) Abortions could happen spontaneously too. (True/False) (b) Infertility is defined as the inability to produce a viable offspring and is always due to abnormalities/defects in the female partner. (True/False) (c) Complete lactation could help as a natural method of contraception. (True/False) (d) Creating awareness about sex related aspects is an effective method to improve reproductive health of the people. (True/False)", "steps": ["(a) True. Abortions include spontaneous loss as well as induced MTP; the book's MTP discussion concerns induced termination, which does not deny spontaneous abortion.", "(b) False. Infertility is inability to produce children despite unprotected cohabitation (summary: even after 2 years), and more often the problem lies in the male partner — not always the female.", "(c) True with the book's limits. Lactational amenorrhoea (no ovulation in intense lactation with full breast-feeding) makes conception almost nil, but is effective only up to six months after parturition and has high failure otherwise.", "(d) True. Awareness/sex education and counselling are the primary RCH step toward reproductive health."], "answer": "(a) True; (b) False (often male; 2-year cohabitation definition); (c) True within six months/full-feeding limits; (d) True."}, {"number": "12", "conceptIdx": 1, "page": 10, "printPage": null, "question": "Correct the following statements : (a) Surgical methods of contraception prevent gamete formation. (b) All sexually transmitted diseases are completely curable. (c) Oral pills are very popular contraceptives among the rural women. (d) In E. T. techniques, embryos are always transferred into the uterus.", "steps": ["(a) Surgical methods block gamete transport (vas deferens / fallopian tube cut or tied), not gamete formation; reversibility is very poor.", "(b) Not all: except hepatitis-B, genital herpes and HIV, other listed STIs are completely curable if detected early and treated properly.", "(c) The book calls pills very effective with lesser side effects and well accepted, taken daily 21 days plus 7-day gap (Saheli weekly), but names IUDs among the most widely accepted in India; popularity cannot be assigned to rural women as stated.", "(d) In ET, zygote/embryos up to 8 blastomeres go to the fallopian tube (ZIFT); only embryos with more than 8 blastomeres go to the uterus (IUT)."], "answer": "(a) Block transport, not formation. (b) HIV, hepatitis-B, genital herpes excepted. (c) Pills need daily discipline; IUDs most widely accepted. (d) ZIFT to tube at ≤8 blastomeres; IUT to uterus above."}], "pageOffset": null, "printPageStart": null, "printPageEnd": null, "paginationProvenance": "folio-absent-in-source"};
</script>
<script>
(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");

  // --- Render Quiz ---
  function renderQuiz(){
    var lessons = C.lessons || C.concepts || [];
    var l = lessons[state.conceptIndex];
    if(!l) return;
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(!quizzes.length) return;
    var q = quizzes[state.level] || quizzes[0];
    if(!q) return;

    var qk = qKey(state.conceptIndex, state.level);
    var old = state.answers[qk] || {};

    var box = document.getElementById("quiz-container");
    if(!box) return;

    var promptText = q.prompt || q.question || "";
    var isMcq = q.type === "mcq" || (q.options && q.options.length > 0);
    var correctAns = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : 0);
    var solutionText = q.solution || q.explanation || "";
    var hintText = q.hint || "Review the key relationships in the concept overview above.";

    var html = '<div class="question-prompt">' + promptText + '</div>';
    if(isMcq && q.options){
      html += '<div class="quiz-options">' +
        q.options.map(function(opt, oi){
          var checked = old.value === String(oi) ? " checked" : "";
          return '<label class="quiz-option"><input type="radio" name="quiz_ans" value="' + oi + '"' + checked + '><span>' + opt + '</span></label>';
        }).join("") +
        '</div>';
    } else {
      html += '<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">' +
        '<input type="number" step="any" id="quiz_num_ans" placeholder="Your answer" value="' + (old.value || "") + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;width:160px;">' +
        '<span style="font-weight:600;color:var(--muted);">' + (q.unit || "") + '</span>' +
        '</div>';
    }

    html += '<div class="quiz-actions">' +
      '<button class="btn-primary" id="btn-submit-quiz">Submit Answer</button>' +
      '<button class="btn-secondary" id="btn-toggle-hint">Show Hint</button>' +
      '</div>' +
      '<div id="quiz-hint-box" class="quiz-hint" style="display:none;">' + hintText + '</div>' +
      '<div id="quiz-feedback-box" class="quiz-feedback" style="display:none;"></div>';

    box.innerHTML = html;

    // Hint toggle
    var hintBtn = document.getElementById("btn-toggle-hint");
    if(hintBtn){
      hintBtn.addEventListener("click", function(){
        var hb = document.getElementById("quiz-hint-box");
        if(hb) hb.style.display = hb.style.display === "none" ? "block" : "none";
      });
    }

    // Submit listener
    var submitBtn = document.getElementById("btn-submit-quiz");
    if(submitBtn){
      submitBtn.addEventListener("click", function(){
        var fb = document.getElementById("quiz-feedback-box");
        if(!fb) return;
        var isRight = false;
        var userVal = "";

        if(isMcq){
          var sel = document.querySelector('input[name="quiz_ans"]:checked');
          if(!sel){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please select an answer choice first.";
            return;
          }
          userVal = sel.value;
          isRight = Number(userVal) === Number(correctAns);
        } else {
          var inp = document.getElementById("quiz_num_ans");
          if(!inp || inp.value.trim() === ""){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please enter a numerical answer.";
            return;
          }
          userVal = inp.value.trim();
          var num = parseFloat(userVal);
          isRight = Math.abs(num - parseFloat(correctAns)) <= (q.tolerance || 0.05);
        }

        state.answers[qk] = { value: userVal, checked: true };
        if(isRight){
          state.correct[qk] = true;
          fb.style.display = "block";
          fb.className = "quiz-feedback success";
          fb.innerHTML = "<b>That’s right!</b> " + solutionText;
        } else {
          fb.style.display = "block";
          fb.className = "quiz-feedback retry";
          var wrongMsg = (isMcq && q.wrong && q.wrong[Number(userVal)]) ? q.wrong[Number(userVal)] : hintText;
          fb.innerHTML = "<b>Not quite.</b> " + wrongMsg + "<br><small style=\"margin-top:6px;display:block;\"><b>Full explanation:</b> " + solutionText + "</small>";
        }
        updateProgress();
      });
    }

    if(old.checked && submitBtn){
      submitBtn.click();
    }
  }

  // --- Render Revision View ---
  var currentExFilter = -1;

  function renderRevision(){
    pause();
    document.querySelectorAll(".concept-nav").forEach(function(b){ b.classList.remove("active"); });
    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.classList.add("active");

    var rawNum = C.chapterNumber || (C.chapter_meta && C.chapter_meta.number) || (C.code ? C.code.replace(/\D/g, '') : "01");
    var chNum = (!isNaN(parseInt(rawNum))) ? String(rawNum).padStart(2, '0') : rawNum;
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · NCERT EXERCISES & REVISION";

    var cView = document.getElementById("concept-view");
    var revView = document.getElementById("revision-view");
    if(cView) cView.style.display = "none";
    if(revView) revView.style.display = "block";

    var exList = C.exercises || [];
    if(!exList.length && C.exerciseMap){
      exList = C.exerciseMap.map(function(m){
        return {
          q: m[0],
          number: String(m[0]),
          title: m[1],
          conceptIdx: m[2],
          page: m[3],
          printPage: null,
          question: m[4] || m[1],
          steps: [m[5] || "Refer to concept explanation."],
          answer: m[5] || ""
        };
      });
    }

    var totalEx = exList.length;
    var html = '<div class="concept-header">' +
      '<span class="concept-badge">NCERT EXERCISE COMPENDIUM</span>' +
      '<h1 class="concept-title">Revise, Reflect, Refine</h1>' +
      '<p class="concept-deck">All ' + totalEx + ' exercises from NCERT Class 12 ' + (C.book_name || '') + ' with step-by-step solutions.</p>' +
      '</div>';

    // Filter Bar & Expand/Collapse All
    var lessons = C.lessons || C.concepts || [];
    html += '<div class="exercise-compendium-header">' +
      '<div class="exercise-filter-bar">' +
      '<button class="filter-chip ' + (currentExFilter === -1 ? 'active' : '') + '" data-cfilter="-1">All Exercises (' + totalEx + ')</button>' +
      lessons.map(function(l, li){
        var nav = l.nav || l.navTitle || l.title || ("C0" + (li+1));
        return '<button class="filter-chip ' + (currentExFilter === li ? 'active' : '') + '" data-cfilter="' + li + '">C0' + (li+1) + ': ' + nav + '</button>';
      }).join("") +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn-secondary" id="btn-expand-all" style="padding:6px 12px;font-size:13px;">Expand All Guidance</button>' +
      '<button class="btn-secondary" id="btn-collapse-all" style="padding:6px 12px;font-size:13px;">Collapse All</button>' +
      '</div>' +
      '</div>';

    // Exercise Cards List
    html += '<div id="exercise-cards-container">';
    var filtered = currentExFilter === -1 ? exList : exList.filter(function(e){
      return e.conceptIdx === currentExFilter || (e.section && e.section.includes(String(currentExFilter + 1)));
    });

    html += filtered.map(function(ex, eIdx){
      var qNum = ex.number || ex.q || (eIdx + 1);
      var sectionLabel = ex.section ? ('<span class="q-badge" style="background:#e0f2fe;color:#0369a1;margin-right:6px;">' + ex.section + '</span>') : '';
      var l = (ex.conceptIdx !== undefined && lessons[ex.conceptIdx]) ? lessons[ex.conceptIdx] : null;
      var conceptLink = l ? ('<a href="#concept-' + (ex.conceptIdx + 1) + '" class="q-concept-link" data-idx="' + ex.conceptIdx + '">Explore in Concept ' + ("0" + (ex.conceptIdx + 1)).slice(-2) + ' (' + (l.nav || l.navTitle || l.title) + ') ↗</a>') : '';

      var guidanceHtml = "";
      if(ex.guidance){
        if(typeof ex.guidance === 'string'){
          guidanceHtml = ex.guidance;
        } else if(Array.isArray(ex.guidance)){
          guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
            (ex.answer ? '<p><strong>Answer:</strong> ' + ex.answer + '</p>' : '') +
            '<ol>' + ex.guidance.map(function(g){ return '<li>' + g + '</li>'; }).join('') + '</ol></div>';
        }
      } else if(ex.steps && ex.steps.length){
        guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
          (ex.given ? '<div class="given-data"><b>Given:</b> ' + ex.given + '</div>' : '') +
          '<ol class="solution-steps">' + ex.steps.map(function(st){ return '<li>' + st + '</li>'; }).join('') + '</ol>' +
          (ex.answer ? '<div class="answer-box"><b>Final Answer:</b> ' + ex.answer + '</div>' : '') +
          '</div>';
      }

      var exPg = ex.page || ex.pdfPage;
      var exCite = exPg ? ('<span class="q-cite">PDF p.' + exPg + ((C.pageOffset === null || C.pageOffset === undefined) ? ' · printed folio absent in source' : ' · printed p.' + (exPg + C.pageOffset)) + '</span>') : '';
      return '<article class="exercise-card" id="exercise-q' + qNum + '">' +
        '<div class="exercise-card-meta">' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
        sectionLabel +
        '<span class="q-badge">QUESTION ' + qNum + '</span>' + exCite +
        '</div>' +
        conceptLink +
        '</div>' +
        
        '<div class="exercise-question-text" style="font-size:15px;line-height:1.6;margin:12px 0;white-space:pre-wrap;">' + (ex.question || ex.title || "") + '</div>' +
        
        '<details class="exercise-drawer">' +
        '<summary class="exercise-drawer-btn">📖 View Step-by-Step Guidance & Full Solution</summary>' +
        '<div class="exercise-solution-body" style="padding:14px;background:#f8fafc;border-radius:8px;margin-top:8px;">' +
        guidanceHtml +
        '</div>' +
        '</details>' +
        '</article>';
    }).join("");

    html += '</div>';

    revView.innerHTML = html;

    // Attach Filter Listeners
    revView.querySelectorAll(".filter-chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        currentExFilter = Number(chip.getAttribute("data-cfilter"));
        renderRevision();
      });
    });

    // Attach Expand/Collapse All Listeners
    var btnExp = document.getElementById("btn-expand-all");
    var btnCol = document.getElementById("btn-collapse-all");
    if(btnExp){
      btnExp.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = true; });
      });
    }
    if(btnCol){
      btnCol.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = false; });
      });
    }

    // Concept Navigation Links
    revView.querySelectorAll(".q-concept-link").forEach(function(a){
      a.addEventListener("click", function(e){
        e.preventDefault();
        var cIdx = Number(a.getAttribute("data-idx"));
        renderConcept(cIdx);
        window.scrollTo(0, 0);
      });
    });

    window.location.hash = "#revision";
  }

  // --- Build Sidebar Nav ---
  function buildSidebar(){
    var navContainer = document.getElementById("sidebar-nav");
    if(!navContainer) return;
    var lessons = C.lessons || C.concepts || [];
    navContainer.innerHTML = lessons.map(function(l, i){
      var nav = l.nav || l.navTitle || l.title || ("Concept " + (i + 1));
      return '<button class="concept-nav" data-cidx="' + i + '">' +
        '<span class="num">' + ("0" + (i + 1)).slice(-2) + '</span>' +
        '<span>' + nav + '</span>' +
        '</button>';
    }).join("");

    navContainer.querySelectorAll(".concept-nav").forEach(function(b){
      b.addEventListener("click", function(){
        var idx = Number(b.getAttribute("data-cidx"));
        renderConcept(idx);
      });
    });

    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.addEventListener("click", renderRevision);
  }

  // --- Reset Progress Button ---
  var resetProgBtn = document.getElementById("btn-reset-progress");
  if(resetProgBtn){
    resetProgBtn.addEventListener("click", function(){
      if(confirm("Reset all quiz answers and mastery progress for this chapter?")){
        state.answers = {};
        state.correct = {};
        saveStorage();
        updateProgress();
        renderQuiz();
      }
    });
  }

  // --- Handle Video Facades (No preloaded iframes) ---
  document.addEventListener("click", function(e){
    var btn = e.target.closest(".video-facade");
    if(btn){
      var vid = btn.getAttribute("data-yt");
      var parent = btn.parentElement;
      if(parent && vid){
        parent.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&rel=0" title="Video Lesson" style="width:100%;aspect-ratio:16/9;border:none;border-radius:8px;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
      }
    }
  });

  // --- URL Routing ---
  function routeFromHash(){
    var hash = window.location.hash;
    var lessons = C.lessons || C.concepts || [];
    if(hash === "#revision"){
      renderRevision();
    } else if(/^#concept-\d+$/.test(hash)){
      var cNum = parseInt(hash.replace("#concept-", ""), 10);
      if(cNum >= 1 && cNum <= lessons.length){
        renderConcept(cNum - 1);
        return;
      }
      renderConcept(0);
    } else {
      renderConcept(0);
    }
  }
  window.addEventListener("hashchange", routeFromHash);

  window.App = {
    state: state,
    play: play,
    pause: pause,
    step: step,
    resetTimeline: resetTimeline,
    seekTimeline: seekTimeline,
    renderConcept: renderConcept,
    renderRevision: renderRevision,
    routeFromHash: routeFromHash
  };
  if (typeof globalThis !== "undefined") {
    globalThis.App = window.App;
  }

  // Initialize
  initStorage();
  buildSidebar();
  updateProgress();
  routeFromHash();
})();

</script>

      m += '<rect x="60" y="50" width="600" height="200" rx="8" fill="#0f1f2e" stroke="#38bdf8"/>';
      m += '<text x="360" y="76" fill="#38bdf8" font-size="14" text-anchor="middle">' + d[0] + ': ' + method + '</text>';
      m += '<text x="90" y="112" fill="#e2e8f0" font-size="12">regimen/names: ' + d[1] + '</text>';
      m += '<text x="90" y="142" fill="#94a3b8" font-size="12">mechanism: ' + d[2] + '</text>';
      m += '<text x="90" y="172" fill="#f59e0b" font-size="12">natural windows: fertile day 10-17; lactational only &lt;= 6 mo + full feeding</text>';
      m += '<text x="90" y="196" fill="#f59e0b" font-size="12">pill: 21 d from first 5 d + 7 d gap; emergency: &lt;= 72 h; surgery: poor reversibility</text>';
      m += '<text x="90" y="220" fill="#f87171" font-size="12">no efficacy rates in book - comparator stays qualitative by design</text>';
      m += '<text x="90" y="262" fill="#94a3b8" font-size="11" text-anchor="middle">Fig. 3.1 condoms 3.2 Copper-T 3.3 implants 3.4 vasectomy/tubectomy; Saheli: non-steroidal, once a week</text>';
    }
    svg.innerHTML = m;
    readout(cell("method", method) + cell("type", info[method][0], "#38bdf8") + cell("fertile", "day 10-17", "#f59e0b") + cell("emergency", "<= 72 h", "#f87171"));
    if(mode === "pop") verdict("<b>Exercise 5, Sec 3.2:</b> explosion from falling death/MMR/IMR + more reproductive-age people. 2011 census growth <b>&lt;2% (20/1000/yr)</b> — still scarcity-threatening. Answers: smaller families, <b>Hum Do Hamare Do</b>, marriage <b>18/21</b>, incentives.");
    else if(mode === "ideal") verdict("<b>Exercises 6-7, Sec 3.2:</b> ideal = user-friendly, available, effective, reversible, safe, desire-neutral. <b>Ex 7:</b> gonad removal fails every test (permanent, hormonal). Contraceptives oppose conception — take only under <b>qualified medical advice</b>.");
    else verdict("<b>Section 3.2, Ex 12(a)(c)(d):</b> <b>" + method + "</b> (" + info[method][0] + "): " + info[method][1] + ". Mechanism: " + info[method][2] + ". Surgery blocks <b>transport, not formation</b>; pills are 21+7 (Saheli weekly); IUDs: Lippes | CuT/Cu7/Multiload 375 | Progestasert/LNG-20.");
  }
  return { mount: mount, draw: draw };
})();

window.SIMS["mtp"] = (function(){

    document.getElementById("lab-legend").innerHTML =
      '<div class="legend-item"><span class="legend-dot" style="background:#34d399;"></span><span>First trimester: relatively safe (&lt;=12 wk)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b;"></span><span>12-24 wk: two RMPs, riskier</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#f87171;"></span><span>Illegal/quack + misuse: unsafe</span></div>';
    document.getElementById("preset-bar").innerHTML =
      '<button class="preset-btn active" id="p-w8">8 weeks: one RMP</button>' +
      '<button class="preset-btn" id="p-w20">20 weeks: two RMPs</button>' +
      '<button class="preset-btn" id="p-trend">Unhealthy trends</button>';
    document.getElementById("p-w8").onclick = function(){ setActivePreset(this); App.state.t = 8; var r=document.getElementById("ctrl-wk-range"); if(r) r.value=8; draw(App.state.t); };

    document.getElementById("p-trend").onclick = function(){ setActivePreset(this); draw(App.state.t); };
    document.getElementById("lab-controls").innerHTML =
      '<div class="control-item"><div class="control-label"><span>Weeks of pregnancy</span><span class="val" id="ctrl-wk">8</span></div>' +
      '<input type="range" id="ctrl-wk-range" min="1" max="24" step="1" value="8"></div>';
    document.getElementById("ctrl-wk-range").oninput = function(){ App.state.t = Number(this.value); draw(App.state.t); };
    draw(8);
  }
  function draw(t){
    var svg = svgEl(); if(!svg) return;
    var ctrl = document.getElementById("ctrl-wk-range");
