<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Class 12 Mathematics — Linear Programming.">
  <title>Linear Programming — Class 12 Mathematics</title>
  <style>:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  text-align: left;
  background: #0f172a;
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
}
.play-btn {
  flex: none;
  width: 34px;
  height: 34px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 14px;
}
.video-title {
  font-size: 13px;
  line-height: 1.4;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.q-badge {
  background: var(--soft);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 3px 10px;
  border-radius: 6px;
}
.q-concept-link {
  color: var(--blue);
  text-decoration: none;

  <script>(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp) disp.innerHTML = "t = <b>" + state.t.toFixed(1) + " s</b>";
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Concept View ---
  function renderConcept(idx){
    pause();
    state.conceptIndex = idx;
    state.t = 0;
    state.level = 0;

    var lessons = C.lessons || C.concepts || [];
    var l = lessons[idx];
    if(!l) return;

    var navTitle = l.nav || l.navTitle || l.title || ("Concept " + (idx + 1));

    // Update sidebar navigation active state
    var navBtns = document.querySelectorAll(".concept-nav");
    navBtns.forEach(function(b, i){
      if(b.id === "nav-revision") b.classList.remove("active");
      else b.classList.toggle("active", i === idx);
    });

    // Update top crumb
    var chNum = C.chapterNumber || (C.code ? C.code.replace(/\D/g, '') : "01");
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · " + navTitle.toUpperCase();

    // Show concept view, hide revision
    var cView = document.getElementById("concept-view");
    var rView = document.getElementById("revision-view");
    if(cView) cView.style.display = "block";
    if(rView) rView.style.display = "none";

    var html = "";

    // Concept Header

     var printedPages = l.printPages ? ' · printed pp. ' + l.printPages : ' · printed folio absent in source';
     var printPage = l.print || (l.pages ? l.pages.join("–") : (C.page_start ? "pp. " + C.page_start + "–" + C.page_end : ""));
    html += '<div class="concept-header">' +
      '<div class="concept-badge"><span>Concept ' + ("0" + (idx + 1)).slice(-2) + ' / ' + ("0" + lessons.length).slice(-2) + '</span>' +
      (printPage ? '<span class="time-pill">≈ ' + minutes + ' min · ' + pdfRef + printedPages + '</span>' : '<span class="time-pill">≈ ' + minutes + ' min</span>') +
      '</div>' +
      '<h1 class="concept-title">' + (l.title || navTitle) + '</h1>' +
      '<p class="concept-deck">' + (l.deck || l.summary || "") + '</p>' +
      '</div>';

    // 01 LEARN BLOCK
    html += '<section class="learn-section" data-block="learn" aria-label="Learn Concept">' +
      '<span class="block-tag">01 · LEARN · CORE ESSENTIALS</span>';

    var quickItems = [];
    if(Array.isArray(l.quick)) {
      quickItems = l.quick;
    } else if(Array.isArray(l.summary)) {
      quickItems = l.summary;
    } else if(l.reading_content) {
      quickItems = [l.reading_content];
    } else if(l.summary || l.deck) {
      quickItems = [l.summary || l.deck];
    }

    html += '<div class="quick-summary">' + quickItems.map(function(p){
      if(p.includes('<p>') || p.includes('<div>') || p.includes('<h3>')) return p;
      var formatted = p.replace(/###\s+(.*?)\n/g, '<h3 style="margin-top:16px;color:var(--ink);">$1</h3>')
                       .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                       .replace(/\*(.*?)\*/g, '<em>$1</em>')
                       .replace(/\n\n/g, '</p><p>');
      return '<p>' + formatted + '</p>';
    }).join("") + '</div>';

    // Semantic Equations Card
    var formulas = l.formulas || [];
    if(formulas.length){
      html += '<div class="key-equations-card">' +
        '<div class="equations-heading">Key Relations for this Concept</div>' +
        '<div class="eq-grid">' +
        formulas.map(function(eq){
          var label = eq.label || eq.name || "Relation";
          var cond = eq.cond || "";
          var math = eq.html || eq.formula || "";
          return '<div class="eq-row">' +
            '<div class="eq-meta"><span class="eq-label">' + label + '</span>' + (cond ? '<span class="eq-cond">' + cond + '</span>' : '') + '</div>' +
            '<div class="eq-math">' + math + '</div>' +
            '</div>';
        }).join("") +
        '</div></div>';
    }

    // Deeper dive / core takeaways
    if(l.deeper){
      html += '<details class="deep-dive"><summary>Go deeper into the conceptual foundation</summary><p>' + l.deeper + '</p></details>';
    } else if(l.takeaways && l.takeaways.length){
      html += '<details class="deep-dive"><summary>Key Conceptual Takeaways</summary><ul>' +
        l.takeaways.map(function(t){ return '<li>' + t + '</li>'; }).join("") +
        '</ul></details>';
    }

    // Worked Example
    var worked = l.worked || l.worked_example;
    if(worked){
      var workedHtml = typeof worked === 'object' && worked !== null
        ? '<strong>' + (worked.title || 'Worked Example') + '</strong><br>' + (worked.problem || '') +
          (worked.given ? '<br><br><strong>Given:</strong> ' + worked.given : '') +
          (worked.steps ? '<br><strong>Steps:</strong><br>' + worked.steps.map(function(s){ return '&bull; ' + s; }).join('<br>') : '') +
          (worked.solution ? '<br><br><strong>Solution:</strong> ' + worked.solution : '') +
          (worked.answer ? '<br><br><strong>Answer:</strong> ' + worked.answer : '')
        : String(worked);
      html += '<details class="deep-dive"><summary>Worked textbook example step by step</summary><p>' + workedHtml + '</p></details>';
    }

    html += '</section>';

    // 02 PREDICT FIRST BLOCK
    var pred = l.prediction || l.predict || l.predict_first;
    if(pred && typeof pred === 'object' && (pred.prompt || pred.scenario) && pred.options && pred.options.length){
      var promptText = pred.prompt || pred.scenario || "";
      html += '<section class="predict-card" data-block="predict" aria-label="Predict First">' +
        '<div class="predict-badge">02 · PREDICT FIRST · TEST YOUR INTUITION</div>' +
        '<div class="predict-prompt">' + promptText.replace(/\n/g, '<br>') + '</div>' +
        '<div class="predict-options" id="predict-options">' +
        pred.options.map(function(opt, oi){
          return '<label class="predict-option"><input type="radio" name="predict_ans" value="' + oi + '"><span>' + opt + '</span></label>';
        }).join("") +
        '</div>' +
        '<div class="predict-actions">' +
        '<button class="btn-primary" id="btn-check-prediction">Check Prediction</button>' +
        '<button class="btn-secondary" id="btn-skip-prediction">Skip to Lab</button>' +
        '</div>' +
        '<div id="predict-feedback-box" class="predict-feedback" style="display:none;"></div>' +
        '</section>';
    }

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();
    var whatWatch = (pred && pred.prompt) ? pred.prompt : (typeof l.predict === 'string' ? l.predict : "Explore the interactive simulation controls, parameters, and readouts below.");
    html += '<section class="lab-card" data-block="play" aria-label="Interactive Laboratory">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +

          var cHtml = '<div class="connect-card' + (wow ? ' wow" data-wow="true" data-source="NCERT ' + C.book_name + ' Ch ' + C.chapterNumber + ' · ' + wowSrc + wowPrint + '"' : '') + '">';
          if(wow) cHtml += '<span class="wow-badge">WOW · REAL WORLD</span>';
          cHtml += '<h3>' + title + '</h3><p>' + desc + '</p>';

        html += '<button class="level-tab' + (qi === 0 ? ' active' : '') + '" data-lvl="' + qi + '">' + tierName + '</button>';

        '<div id="quiz-container"></div>' +

    // 06 REVISE CALLOUT
    var recall = l.recall || (l.takeaways && l.takeaways.length ? l.takeaways[0] : (l.core_takeaways && l.core_takeaways.length ? l.core_takeaways[0] : "Reflect on how this concept connects to physical reality."));
    html += '<div class="revise-callout"><strong>06 · REVISE · SAY IT IN YOUR OWN WORDS:</strong> ' + recall + '</div>';

    // Footer Navigation
    var nextNav = idx < lessons.length - 1 ? (lessons[idx + 1].nav || lessons[idx + 1].navTitle || lessons[idx + 1].title || ("Concept " + (idx + 2))) : "";
    html += '<div class="concept-footer-nav">' +
      (idx > 0 ? '<button class="btn-secondary" id="btn-prev-concept">← Concept ' + ("0" + idx).slice(-2) + '</button>' : '<span></span>') +
      (idx < lessons.length - 1 ? '<button class="btn-primary" id="btn-next-concept">Concept ' + ("0" + (idx + 2)).slice(-2) + ': ' + nextNav + ' →</button>' : '<button class="btn-primary" id="btn-goto-revision">Chapter Revision & Exercises →</button>') +
      '</div>';

    cView.innerHTML = html;

    // Attach Prediction Listeners
    var btnCheckPred = document.getElementById("btn-check-prediction");
    var btnSkipPred = document.getElementById("btn-skip-prediction");
    if(btnCheckPred && pred){
      btnCheckPred.addEventListener("click", function(){
        var sel = document.querySelector('input[name="predict_ans"]:checked');
        var fb = document.getElementById("predict-feedback-box");
        if(!sel){
          fb.style.display = "block";
          fb.className = "predict-feedback revealed";
          fb.textContent = "Please select one of the predictions first.";
          return;
        }
        var chosen = Number(sel.value);
        var expectedAns = pred.answer !== undefined ? pred.answer : (pred.correct !== undefined ? pred.correct : 0);
        var isRight = chosen === expectedAns;
        fb.style.display = "block";
        fb.className = "predict-feedback " + (isRight ? "correct" : "revealed");
        fb.innerHTML = (isRight ? "<b>Spot on!</b> " : "<b>Good thought! Here is the physical principle:</b> ") + (pred.explanation || "");
      });
    }
    if(btnSkipPred && pred){
      btnSkipPred.addEventListener("click", function(){
        var fb = document.getElementById("predict-feedback-box");
        fb.style.display = "block";
        fb.className = "predict-feedback revealed";
        fb.innerHTML = "<b>Key Principle:</b> " + (pred.explanation || "");
      });
    }

    // Attach Timeline Controls for legacy SIMS
    var btnPP = document.getElementById("btn-play-pause");
    if(btnPP) btnPP.addEventListener("click", function(){ if(state.playing) pause(); else play(); });
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep) btnStep.addEventListener("click", function(){ step(0.5); });
    var btnResTime = document.getElementById("btn-reset-time");
    if(btnResTime) btnResTime.addEventListener("click", function(){ resetTimeline(); });
    var scrub = document.getElementById("time-scrubber");
    if(scrub) scrub.addEventListener("input", function(e){ seekTimeline(e.target.value); });

    // Footer Next/Prev listeners
    var btnPrev = document.getElementById("btn-prev-concept");
    var btnNext = document.getElementById("btn-next-concept");
    var btnRev = document.getElementById("btn-goto-revision");
    if(btnPrev) btnPrev.addEventListener("click", function(){ renderConcept(idx - 1); window.scrollTo(0,0); });
    if(btnNext) btnNext.addEventListener("click", function(){ renderConcept(idx + 1); window.scrollTo(0,0); });
    if(btnRev) btnRev.addEventListener("click", function(){ renderRevision(); window.scrollTo(0,0); });

    // Mount Active Simulation Engine
    var simMount = document.getElementById("sim-mount-point");
    if(simMount){
      var cKey = "c" + (idx + 1);
      var conceptId = l.id || ("concept-" + (idx + 1));
      var simId = l.sim || conceptId;

      // 1. window.mountSimulation (iemh101, iemh102)
      if(typeof window.mountSimulation === 'function'){
        simMount.innerHTML = "";
        window.mountSimulation(cKey, simMount);
      }
      // 2. window.SIM_ENGINES (iemh101-iemh105)
      else if(window.SIM_ENGINES && window.SIM_ENGINES[cKey] && typeof window.SIM_ENGINES[cKey].init === 'function'){
        simMount.innerHTML = "";
        window.SIM_ENGINES[cKey].init(simMount);
      }
      // 3. window.SimEngine (iemh106-iemh108)
      else if(window.SimEngine && typeof window.SimEngine.init === 'function'){
        var targetKey = null;
        var candidateKeys = [conceptId, "sim-" + conceptId, "sim-concept-" + (idx + 1), "concept-" + (idx + 1), simId, cKey];
        for(var k = 0; k < candidateKeys.length; k++){
          if(candidateKeys[k] && window.SimEngine.getEngine(candidateKeys[k])){
            targetKey = candidateKeys[k];
            break;
          }
        }
        if(targetKey){
          simMount.innerHTML = "";
          window.SimEngine.init(targetKey, simMount);
        }
      }
      // 4. window.SIMS (iesc101-iesc113)
      else if(window.SIMS && (window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey])){
        var simObj = window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey];
        if(typeof simObj.mount === 'function'){
          if(simObj.mount.length >= 1 && !simObj.draw){
            simMount.innerHTML = "";
            simObj.mount(simMount);
          } else {
            simObj.mount(l);
          }
        }
      }
    }

    // Render Quiz for current level
    renderQuiz();

    // Attach Practice Level Tabs
    var lvlTabs = document.querySelectorAll(".level-tab");
    lvlTabs.forEach(function(tab){
      tab.addEventListener("click", function(){
        lvlTabs.forEach(function(t){ t.classList.remove("active"); });
        tab.classList.add("active");
        state.level = Number(tab.getAttribute("data-lvl"));
        renderQuiz();
      });
    });

    // Update URL hash
    window.location.hash = "#concept-" + (idx + 1);
  }

  // --- Render Quiz ---
  function renderQuiz(){
    var lessons = C.lessons || C.concepts || [];
    var l = lessons[state.conceptIndex];
    if(!l) return;
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(!quizzes.length) return;
    var q = quizzes[state.level] || quizzes[0];
    if(!q) return;

    var qk = qKey(state.conceptIndex, state.level);
    var old = state.answers[qk] || {};

    var box = document.getElementById("quiz-container");
    if(!box) return;

    var promptText = q.prompt || q.question || "";
    var isMcq = q.type === "mcq" || (q.options && q.options.length > 0);
    var correctAns = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : 0);
    var solutionText = q.solution || q.explanation || "";
    var hintText = q.hint || "Review the key relationships in the concept overview above.";

    var html = '<div class="question-prompt">' + promptText + '</div>';
    if(isMcq && q.options){
      html += '<div class="quiz-options">' +
        q.options.map(function(opt, oi){
          var checked = old.value === String(oi) ? " checked" : "";
          return '<label class="quiz-option"><input type="radio" name="quiz_ans" value="' + oi + '"' + checked + '><span>' + opt + '</span></label>';
        }).join("") +
        '</div>';
    } else {
      html += '<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">' +
        '<input type="number" step="any" id="quiz_num_ans" placeholder="Your answer" value="' + (old.value || "") + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;width:160px;">' +
        '<span style="font-weight:600;color:var(--muted);">' + (q.unit || "") + '</span>' +
        '</div>';
    }

    html += '<div class="quiz-actions">' +
      '<button class="btn-primary" id="btn-submit-quiz">Submit Answer</button>' +
      '<button class="btn-secondary" id="btn-toggle-hint">Show Hint</button>' +
      '</div>' +
      '<div id="quiz-hint-box" class="quiz-hint" style="display:none;">' + hintText + '</div>' +
      '<div id="quiz-feedback-box" class="quiz-feedback" style="display:none;"></div>';

    box.innerHTML = html;

    // Hint toggle
    var hintBtn = document.getElementById("btn-toggle-hint");
    if(hintBtn){
      hintBtn.addEventListener("click", function(){
        var hb = document.getElementById("quiz-hint-box");
        if(hb) hb.style.display = hb.style.display === "none" ? "block" : "none";
      });
    }

    // Submit listener
    var submitBtn = document.getElementById("btn-submit-quiz");
    if(submitBtn){
      submitBtn.addEventListener("click", function(){
        var fb = document.getElementById("quiz-feedback-box");
        if(!fb) return;
        var isRight = false;
        var userVal = "";

        if(isMcq){
          var sel = document.querySelector('input[name="quiz_ans"]:checked');
          if(!sel){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please select an answer choice first.";
            return;
          }
          userVal = sel.value;
          isRight = Number(userVal) === Number(correctAns);
        } else {
          var inp = document.getElementById("quiz_num_ans");
          if(!inp || inp.value.trim() === ""){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please enter a numerical answer.";
            return;
          }
          userVal = inp.value.trim();
          var num = parseFloat(userVal);
          isRight = Math.abs(num - parseFloat(correctAns)) <= (q.tolerance || 0.05);
        }

        state.answers[qk] = { value: userVal, checked: true };
        if(isRight){
          state.correct[qk] = true;
          fb.style.display = "block";
          fb.className = "quiz-feedback success";
          fb.innerHTML = "<b>That’s right!</b> " + solutionText;
        } else {
          fb.style.display = "block";
          fb.className = "quiz-feedback retry";
          var wrongMsg = (isMcq && q.wrong && q.wrong[Number(userVal)]) ? q.wrong[Number(userVal)] : hintText;
          fb.innerHTML = "<b>Not quite.</b> " + wrongMsg + "<br><small style=\"margin-top:6px;display:block;\"><b>Full explanation:</b> " + solutionText + "</small>";
        }
        updateProgress();
      });
    }

    if(old.checked && submitBtn){
      submitBtn.click();
    }
  }

  // --- Render Revision View ---
  var currentExFilter = -1;

  function renderRevision(){
    pause();

          conceptIdx: m[2],

      '</div>';

    // Filter Bar & Expand/Collapse All
    var lessons = C.lessons || C.concepts || [];
    html += '<div class="exercise-compendium-header">' +
      '<div class="exercise-filter-bar">' +
      '<button class="filter-chip ' + (currentExFilter === -1 ? 'active' : '') + '" data-cfilter="-1">All Exercises (' + totalEx + ')</button>' +

      '</div>' +
      '</div>';

    // Exercise Cards List
    html += '<div id="exercise-cards-container">';
    var filtered = currentExFilter === -1 ? exList : exList.filter(function(e){
      return e.conceptIdx === currentExFilter || (e.section && e.section.includes(String(currentExFilter + 1)));
    });

    html += filtered.map(function(ex, eIdx){
      var qNum = ex.number || ex.q || (eIdx + 1);
      var sectionLabel = ex.section ? ('<span class="q-badge" style="background:#e0f2fe;color:#0369a1;margin-right:6px;">' + ex.section + '</span>') : '';
      var l = (ex.conceptIdx !== undefined && lessons[ex.conceptIdx]) ? lessons[ex.conceptIdx] : null;
      var conceptLink = l ? ('<a href="#concept-' + (ex.conceptIdx + 1) + '" class="q-concept-link" data-idx="' + ex.conceptIdx + '">Explore in Concept ' + ("0" + (ex.conceptIdx + 1)).slice(-2) + ' (' + (l.nav || l.navTitle || l.title) + ') ↗</a>') : '';

      var guidanceHtml = "";
      if(ex.guidance){
        if(typeof ex.guidance === 'string'){
          guidanceHtml = ex.guidance;
        } else if(Array.isArray(ex.guidance)){
          guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
            (ex.answer ? '<p><strong>Answer:</strong> ' + ex.answer + '</p>' : '') +
            '<ol>' + ex.guidance.map(function(g){ return '<li>' + g + '</li>'; }).join('') + '</ol></div>';
        }
      } else if(ex.steps && ex.steps.length){
        guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
          (ex.given ? '<div class="given-data"><b>Given:</b> ' + ex.given + '</div>' : '') +
          '<ol class="solution-steps">' + ex.steps.map(function(st){ return '<li>' + st + '</li>'; }).join('') + '</ol>' +
          (ex.answer ? '<div class="answer-box"><b>Final Answer:</b> ' + ex.answer + '</div>' : '') +
          '</div>';
      }

      var exPg = ex.page || ex.pdfPage;
      var exCite = exPg ? ('<span class="q-cite">PDF p.' + exPg + ((C.pageOffset === null || C.pageOffset === undefined) ? ' · printed folio absent in source' : ' · printed p.' + (exPg + C.pageOffset)) + '</span>') : '';
      return '<article class="exercise-card" id="exercise-q' + qNum + '">' +
        '<div class="exercise-card-meta">' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
        sectionLabel +
        '<span class="q-badge">QUESTION ' + qNum + '</span>' + exCite +
        '</div>' +
        conceptLink +
        '</div>' +
        
        '<div class="exercise-question-text" style="font-size:15px;line-height:1.6;margin:12px 0;white-space:pre-wrap;">' + (ex.question || ex.title || "") + '</div>' +
        
        '<details class="exercise-drawer">' +
        '<summary class="exercise-drawer-btn">📖 View Step-by-Step Guidance & Full Solution</summary>' +
        '<div class="exercise-solution-body" style="padding:14px;background:#f8fafc;border-radius:8px;margin-top:8px;">' +
        guidanceHtml +
        '</div>' +
        '</details>' +
        '</article>';

    html += '</div>';

    revView.innerHTML = html;

    // Attach Filter Listeners
    revView.querySelectorAll(".filter-chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        currentExFilter = Number(chip.getAttribute("data-cfilter"));
        renderRevision();
      });
    });

    // Attach Expand/Collapse All Listeners
    var btnExp = document.getElementById("btn-expand-all");
    var btnCol = document.getElementById("btn-collapse-all");

      });

    // Concept Navigation Links
    revView.querySelectorAll(".q-concept-link").forEach(function(a){
      a.addEventListener("click", function(e){
        e.preventDefault();
        var cIdx = Number(a.getAttribute("data-idx"));
        renderConcept(cIdx);
        window.scrollTo(0, 0);
      });

    window.location.hash = "#revision";
  }

  // --- URL Routing ---
  function routeFromHash(){

    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span><span>reference direction</span></div>');

  install("lp", "Linear-programming feasible region", { slope: 1 }, function (s) {
    return range("slope", "Objective slope", -2, 3, 0.1, s.slope, "");
  }, function (s) {
    var y1 = 4 - s.slope * 1, y2 = 4 - s.slope * 3;
    return {
      svg: shell('<line x1="95" y1="245" x2="600" y2="245" stroke="#475569"></line><line x1="95" y1="55" x2="95" y2="245" stroke="#475569"></line><polygon points="95,245 95,105 300,105 470,245" fill="#34d39955" stroke="#34d399" stroke-width="3"></polygon>' +
        '<line x1="100" y1="' + (245 - y1 * 35) + '" x2="560" y2="' + (245 - y2 * 35) + '" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 5"></line>' +
        '<circle cx="95" cy="105" r="7" fill="#38bdf8"></circle><circle cx="300" cy="105" r="7" fill="#38bdf8"></circle><circle cx="470" cy="245" r="7" fill="#38bdf8"></circle>' +
        text(500, 65, "objective line slides", "#f8fafc", 17) + text(500, 100, "test the vertices", "#94a3b8", 15)),
      readout: cell("slope", s.slope.toFixed(1)) + cell("candidate points", "vertices", "#34d399") + cell("method", "corner test", "#f59e0b"),
      verdict: "<b>Graphical method:</b> the optimum occurs at a corner of the feasible region unless the objective is constant along an edge."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#34d399"></span><span>feasible region</span></div>');

  install("probability", "Probability tree", { pA: 0.6, pB: 0.3 }, function (s) {
    return range("pA", "P(A)", 0.1, 0.9, 0.05, s.pA, "") + range("pB", "P(B|A)", 0.1, 0.9, 0.05, s.pB, "");
  }, function (s) {
    var joint = s.pA * s.pB, other = (1 - s.pA) * 0.2, total = joint + other;
    return {
      svg: shell('<line x1="110" y1="150" x2="260" y2="90" stroke="#38bdf8" stroke-width="3"></line><line x1="110" y1="150" x2="260" y2="220" stroke="#94a3b8" stroke-width="3"></line><line x1="260" y1="90" x2="470" y2="60" stroke="#34d399" stroke-width="3"></line><line x1="260" y1="90" x2="470" y2="125" stroke="#94a3b8" stroke-width="3"></line><line x1="260" y1="220" x2="470" y2="190" stroke="#f59e0b" stroke-width="3"></line><line x1="260" y1="220" x2="470" y2="250" stroke="#94a3b8" stroke-width="3"></line>' +
        text(100, 140, "start", "#f8fafc", 14) + text(260, 78, "A", "#38bdf8", 17) + text(260, 210, "Aᶜ", "#94a3b8", 17) + text(505, 60, "B", "#34d399", 17) + text(505, 125, "Bᶜ", "#94a3b8", 17) +
        text(505, 190, "B", "#f59e0b", 17) + text(505, 250, "Bᶜ", "#94a3b8", 17)),
      readout: cell("P(A∩B)", joint.toFixed(3), "#34d399") + cell("P(B)", total.toFixed(3), "#f59e0b") + cell("P(A|B)", (joint / Math.max(total, 0.001)).toFixed(3), "#38bdf8"),
      verdict: "<b>Bayes:</b> multiply along a branch, add disjoint branches for P(B), then reverse the condition with P(A|B) = P(A∩B)/P(B)."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#34d399"></span><span>target branch</span></div>');
})();
</script>
  <script>if (window.App && typeof window.App.routeFromHash === "function") window.App.routeFromHash();</script>
