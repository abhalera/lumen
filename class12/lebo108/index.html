<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 8: Microbes in Human Welfare — Interactive Textbook</title>
<style>
:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  text-align: left;
  background: #0f172a;
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
}
.play-btn {
  flex: none;
  width: 34px;
  height: 34px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 14px;
}
.video-title {
  font-size: 13px;
  line-height: 1.4;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.q-badge {
  background: var(--soft);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 3px 10px;
  border-radius: 6px;
}
.q-concept-link {
  color: var(--blue);
  text-decoration: none;
  font-size: 13px;

stilled pair."]}, {"level": "Medium", "type": "mcq", "prompt": "Penicillin's full potential as an effective antibiotic was established by", "options": ["Ernest Chain and Howard Florey", "Alexander Fleming alone in 1928", "The KVIC and IARI teams"], "answer": 0, "hint": "Fleming discovered; two others developed it.", "solution": "Chain and Florey established penicillin as an effective drug; all three shared the 1945 Nobel Prize.", "wrong": ["Fleming made the chance discovery but not the drug.", "KVIC/IARI developed biogas technology, not penicillin."]}, {"level": "Hard", "type": "number", "map": "Section 8.2.1", "prompt": "Mass of ethanol (g) produced by yeast from 180 g of glucose (C6H12O6 → 2C2H5OH + 2CO2)", "answer": 92, "unit": "g", "tolerance": 0.5, "hint": "2 mol ethanol × 46 g mol⁻¹.", "solution": "180 g glucose = 1 mol → 2 mol ethanol = 92 g (plus 88 g CO2; 92 + 88 = 180)."}], "resources": [{"title": "NCERT §8.2.1, 8.2.2 — Beverages & antibiotics (official PDF, PDF p.4)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo108.pdf#page=4"}]}, {"id": "chemical-enzyme", "nav": "Chemicals & enzymes", "title": "Acids, alcohols, clot-busters and cholesterol-lowering molecules", "deck": "Aspergillus gives citric acid, Acetobacter acetic acid, Clostridium butyric acid; lipases wash, pectinases clarify, streptokinase unclots, cyclosporin-A suppresses immunity and statins lower cholesterol.", "minutes": 9, "section": "8.2.3", "pages": [5, 5], "print": "5", "sim": "bioactive", "simTitle": "Bioactive matcher: chemical to microbe (citric, statins, cyclosporin)", "quick": ["Microbes industrially produce organic acids, alcohols and enzymes. The named acid producers are <strong>Aspergillus niger (fungus) → citric acid</strong>, <strong>Acetobacter aceti (bacterium) → acetic acid</strong>, <strong>Clostridium butylicum (bacterium) → butyric acid</strong> and <strong>Lactobacillus (bacterium) → lactic acid</strong>. <strong>Yeast (Saccharomyces cerevisia ed) clears clots after myocardial infarction.", "wrong": ["Cholesterol lowering is the statin role.", "Immunosuppression is cyclosporin A's role."]}, {"level": "Hard", "type": "number", "map": "Section 8.2.3", "prompt": "Number of organic-acid producers named with their acids in Section 8.2.3", "answer": 4, "unit": "", "tolerance": 0.1, "hint": "Citric, acetic, butyric and lactic.", "solution": "Four pairs: Aspergillus–citric, Acetobacter–acetic, Clostridium–butyric, Lactobacillus–lactic."}], "resources": [{"title": "NCERT §8.2.3 — Chemicals & enzymes (official PDF, PDF p.5)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo108.pdf#page=5"}]}, {"id": "sewage-bod", "nav": "Sewage & BOD", "title": "Primary settling, secondary flocs and the BOD yardstick", "deck": "Primary treatment physically settles sludge; secondary treatment grows aerobic flocs that eat organic matter and cut BOD — the oxygen cost of oxidising a litre's organics, and the measure of pollution.", "minutes": 9, "section": "8.3", "pages": [5, 7], "print": "5–7", "sim": "sewage", "simTitle": "Sewage stepper: primary vs secondary plus BOD slider", "quick": ["Municipal waste-water (<strong>sewage</strong>) carries human excreta, large amounts of organic matter and microbes, many pathogenic — so it cannot go straight into rivers and is treated in <strong>sewage treatment plants (STPs)</strong> by <strong>heterotrophic microbes naturally present in the sewage</strong>, in two stages.", "<strong>Primary treatment is physical</strong>: sequential filtration removes floating debris, sedimentation removes grit (soil, small pebbles); settled solids form <strong>primary sludge</strong> and the supernatant is the <strong>effluent</strong>, which goes to secondary treatment.", "<strong>Secondary (biological) treatment</strong>: the primary effluent is agitated with pumped air in aeration tanks, growing useful aerobic microbes into <strong>flocs — masses of bacteria with fungal filaments in mesh-like structures</strong>. Growing, they consume most organic matter and sharply cut the <strong>BOD (biochemical oxygen demand)</strong>: the <strong>amount of oxygen consumed if all organic matter in one litre of water were oxidised by bacteria</strong>. Greater BOD means more polluting potential.", "The flocs settle as <strong>activated sludge</strong>; a small part returns to the aeration tank as <strong>inoculum</strong>, the major part goes to <strong>anaerobic sludge digesters</strong>, where anaerobic bacteria digest the sludge microbes and release <strong>methane, hydrogen sulphide and carbon dioxide — biogas</strong>. Treated effluent flows to rivers. The method is a century old and <strong>no man-made technology has rivalled microbial sewage treatment</strong>; outpaced by urbanisation, untreated sewage still pollutes rivers, prompting the <strong>Ganga Action Plan and Yamuna Action Plan</strong> (Ministry of Environment and Forests) to build STPs."], "formulas": [{"label": "BOD definition", "html": "BOD = O<sub>2</sub> consumed if all organics in 1 L were oxidised by bacteria", "cond": "Section 8.3; BOD ∝ organic matter ∝ polluting potential"}, {"label": "Two stages", "html": "primary (physical: filtration + sedimentation) → secondary (biological: aeration + flocs)", "cond": "Section 8.3; Exercise 8"}, {"label": "Sludge loop", "html": "activated sludge → part back as inoculum; major part → anaerobic digesters → CH<sub>4</sub> + H<sub>2</sub>S + CO<sub>2</sub>", "cond": "Section 8.3"}], "deeper": "The BOD test measures the rate of oxygen uptake by micro-organisms in a water sample — an indirect organic-matter assay, which is why Exercise 11 can label three mystery samples from BOD numbers alone. Watch the book's precise split: primary sludge settles in the primary tank, activated sludge settles after aeration, and only the anaerobic digesters make biogas — three sludges/gases students often merge.", "worked": "Exercise 11 labelling: BOD C = 400 mg/L is highest, so most polluted — untreated sewage; A = 20 mg/L is reduced but not clean — secondary effluent; B = 8 mg/L is lowest — relatively clean river water. Treatment cut BOD from 400 to 20, a (400 − 20)/400 × 100 = 95% reduction.", "prediction": {"prompt": "An STP's aeration blowers fail for a day while screens and settling tanks keep working. What happens to the effluent's BOD?", "options": ["BOD stays high — flocs starve of oxygen, organics uneaten; primary steps alone cannot cut BOD", "BOD falls to zero — settling removes dissolved organics", "BOD is unaffected — BOD measures only floating debris"], "answer": 0, "explanation": "Secondary aerobic flocs consume the organics; primary treatment only removes particles. BOD tracks dissolved organics, not debris."}, "connect": [["Yamuna and Ganga STPs near you", "The Ganga and Yamuna Action Plans exist because STP capacity lags sewage volume; the book invites a visit to the nearest STP — watching aeration tanks foam and digesters glow is Section 8.3 alive."], ["Wow — no machine beats the microbes", "After more than a century, no man-made technology has rivalled microbial sewage treatment — the cheapest, largest biotechnology on Earth runs on flocs."]], "recall": "Define BOD exactly and contrast primary (physical) with secondary (biological) treatment plus the sludge loop.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "BOD refers to", "options": ["Oxygen consumed if all organic matter in one litre were oxidised by bacteria", "Volume of biogas per litre of dung slurry", "Mass of primary sludge per tank"], "answer": 0, "hint": "Biochemical oxygen demand — read the definition sentence.", "solution": "BOD is the oxygen cost of bacterially oxidising one litre's organics; higher BOD means more pollution.", "wrong": ["Biogas composition is methane-dominated, not BOD.", "Sludge mass is not an oxygen demand."]}, {"level": "Medium", "type": "number", "map": "Exercise 11", "prompt": "BOD (mg/L) of the most polluted sample among 20 (A), 8 (B) and 400 (C)", "answer": 400, "unit": "mg/L", "tolerance": 1, "hint": "Greatest BOD means greatest pollution.", "solution": "C at 400 mg/L is the untreated sewage — most polluted; A (20) is secondary effluent, B (8) river water."}, {"level": "Hard", "type": "number", "map": "Exercise 11", "prompt": "Percent BOD reduction when sewage at 400 mg/L leaves secondary treatment at 20 mg/L", "answer": 95, "unit": "%", "tolerance": 0.5, "hint": "(400 − 20)/400 × 100.", "solution": "(380/400) × 100 = 95% of the oxygen demand removed before river discharge."}], "resources": [{"title": "NCERT §8.3 — Sewage & BOD (official PDF, PDF p.5)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo108.pdf#page=5"}]}, {"id": "biogas-biocontrol", "nav": "Biogas & biocontrol", "title": "Methanogens in dung and rumen — ladybirds, Bt and NPV in the field", "deck": "Methanobacterium turns cellulose into methane-rich gobar gas in KVIC plants; in fields, ladybirds eat aphids, Bt spores kill caterpillars, Trichoderma guards roots and NPV viruses spare everything else.", "minutes": 9, "section": "8.4, 8.5", "pages": [7, 9], "print": "7–9", "sim": "biogas", "simTitle": "Gobar-gas plant flow simulator (with biocontrol matcher)", "quick": ["<strong>Biogas is a mixture of gases containing predominantly methane</strong>, made by microbial activity and usable as fuel. While dough, cheese and beverage fermentations release mainly <strong>CO2</strong>, bacteria growing <strong>anaerobically on cellulosic material</strong> release large amounts of <strong>methane along with CO2 and H2</strong> — collectively <strong>methanogens</strong>, e.g. <strong>Methanobacterium</strong>, found in anaerobic sludge and in the <strong>rumen of cattle</strong>, where they digest cellulose for the animal.", "Cattle <strong>dung (gobar) is rich in methanogens</strong>, so it feeds the <strong>gobar-gas plant</strong>: a <strong>concrete tank 10–15 feet deep</strong> taking bio-wastes and dung slurry, with a <strong>floating cover that rises as gas is produced</strong>, an outlet pipe supplying nearby houses, and <strong>spent slurry removed as fertiliser</strong>. Plants suit rural areas (dung abundant) and the gas serves <strong>cooking and lighting</strong>; the technology grew from <strong>IARI and KVIC</strong> efforts.", "Chemical insecticides, pesticides and weedicides are toxic and pollute soil, groundwater, fruits, vegetables and crops; <strong>biocontrol uses biological methods</strong> instead, keeping pests manageable within a biodiverse system rather than eradicating all life. The <strong>ladybird</strong> eats <strong>aphids</strong>, <strong>dragonflies</strong> eat <strong>mosquitoes</strong>.", "<strong>Bacillus thuringiensis (Bt)</strong> spores come dried in sachets, are mixed with water and sprayed on brassicas and fruit trees; eaten larvae release the toxin in the gut and die while other insects are unharmed — and <strong>Bt toxin genes engineered into plants (e.g. Bt-cotton)</strong> resist insect pests. The root fungus <strong>Trichoderma</strong> checks plant pathogens, and <strong>baculoviruses (mostly genus Nucleopolyhedrovirus, NPV)</strong> are species-specific, narrow-spectrum insecticides harmless to plants, mammals, birds, fish and non-target insects — ideal for IPM and sensitive areas."], "formulas": [{"label": "Methanogenesis", "html": "cellulose —anaerobic, Methanobacterium→ CH<sub>4</sub> (predominant) + CO<sub>2</sub> + H<sub>2</sub>", "cond": "Section 8.4"}, {"label": "Gobar-gas flow", "html": "dung slurry → concrete tank (10–15 ft) → floating cover rises → pipe to houses; spent slurry → fertiliser", "cond": "Section 8.4; IARI + KVIC"}, {"label": "Biocontrol pairs", "html": "ladybird→aphids; dragonfly→mosquitoes; Bt→caterpillars; Trichoderma→root pathogens; NPV→target insects only", "cond": "Section 8.5"}], "deeper": "Link the two halves: anaerobic digester sludge (Section 8.3) already hosts methanogens, so an STP digester and a gobar-gas plant are cousins — one cleans cities, the other lights villages. On biocontrol, note the precision ladder: predators (ladybird) → bacterial toxin (Bt, gut-activated) → engineered crop (Bt-cotton, Chapter 10) → hyper-specific virus (NPV, harmless to vertebrates and non-target insects).", "worked": "Gobar-gas mass flow: dung slurry (methanogen-rich) enters the 10–15 ft concrete tank; microbial activity generates gas; the floating cover rises in proportion to gas stored; piped gas cooks and lights houses; spent slurry leaves as fertiliser — fuel plus manure from the same dung, developed by IARI and KVIC.", "prediction": {"prompt": "A village has dung but no power lines. A concrete tank is built, slurry fed, and the floating cover keeps rising. What does the household gain?", "options": ["Cooking/lighting gas plus a fertiliser (spent slurry) from one plant", "Only fertiliser — the rising cover stores rainwater", "Only light — the slurry is destroyed, not reused"], "answer": 0, "explanation": "Section 8.4: biogas supplies cooking and lighting, and the spent slurry is removed for use as fertiliser."}, "connect": [["KVIC gobar-gas plants in villages", "The Khadi and Village Industries Commission with IARI spread the floating-cover plant across rural India, where cattle dung is plentiful — the book even suggests visiting a nearby plant and asking its keepers."], ["Wow — Bt cotton is a spray turned into a gene", "Bt began as dried spores sprayed on brassicas; genetic engineering moved the toxin gene into the plant itself, so Bt-cotton poisons only the caterpillar that bites it — biocontrol rewritten as inheritance (more in Chapter 10)."]], "recall": "Trace dung-to-flame flow with tank depth and agencies, and list four biocontrol pairs with NPV's safety edge.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Biogas contains predominantly", "options": ["Methane", "Hydrogen sulphide", "Carbon dioxide only"], "answer": 0, "hint": "Section 8.4 defines biogas in one line.", "solution": "Biogas is predominantly methane (with CO2 and H2 from methanogens; H2S appears in digester gas).", "wrong": ["Hydrogen sulphide is a minor digester gas.", "CO2 dominates dough/cheese gas, not biogas."]}, {"level": "Medium", "type": "mcq", "prompt": "Bt spores sprayed on brassicas kill caterpillars because", "options": ["Larvae eat them and the toxin releases in the gut", "Spores photosynthesise on the leaf surface", "The spray fertilises the plant past pest damage"], "answer": 0, "hint": "Where is the toxin released?", "solution": "Eaten spores release toxin in the larval gut; other insects are unharmed.", "wrong": ["Bacteria do not photosynthesise on leaves.", "Bt is not a fertiliser."]}, {"level": "Hard", "type": "number", "map": "Section 8.3", "prompt": "Number of gases named in the anaerobic-sludge-digester mixture", "answer": 3, "unit": "gases", "tolerance": 0.1, "hint": "Methane, hydrogen sulphide and …?", "solution": "Three: methane, hydrogen sulphide and carbon dioxide — together forming biogas."}], "resources": [{"title": "NCERT §8.4, 8.5 — Biogas & biocontrol (official PDF, PDF p.7)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo108.pdf#page=7"}]}, {"id": "biofertiliser", "nav": "Biofertilisers", "title": "Rhizobium, Glomus and paddy-field cyanobacteria instead of chemicals", "deck": "Rhizobium fixes nitrogen in legume nodules, Azospirillum and Azotobacter free in soil, Glomus mycorrhiza feeds phosphorus, and Anabaena, Nostoc and Oscillatoria fertilise paddy.", "minutes": 8, "section": "8.6", "pages": [9, 10], "print": "9–10", "sim": "biofertiliser", "simTitle": "Crop to microbe matcher including paddy cyanobacteria", "quick": ["Overuse of chemical fertilisers pollutes, pressuring a switch to organic farming with <strong>biofertilisers — organisms that enrich the nutrient quality of the soil</strong> — sourced from <strong>bacteria, fungi and cyanobacteria</strong>.", "<strong>Rhizobium</strong> forms nodules on legume roots and <strong>fixes atmospheric nitrogen into organic forms</strong> the plant uses; free-living soil bacteria <strong>Azospirillum and Azotobacter</strong> similarly enrich soil nitrogen.", "Fungi form <strong>mycorrhiza</strong> with plants — many <strong>Glomus</strong> members do — where the <strong>fungal symbiont absorbs phosphorus from soil and passes it to the plant</strong>; such plants also resist root-borne pathogens, tolerate salinity and drought, and grow better overall.", "<strong>Cyanobacteria</strong> (autotrophic, aquatic and terrestrial) fixing nitrogen include <strong>Anabaena, Nostoc and Oscillatoria</strong>; in <strong>paddy fields they are important biofertilisers</strong>, and as blue-green algae they add organic matter and raise fertility. Commercial biofertilisers now cut farmers' dependence on chemical fertilisers."], "formulas": [{"label": "Nitrogen fixers", "html": "Rhizobium (legume nodules) + Azospirillum/Azotobacter (free-living) → soil N ↑", "cond": "Section 8.6; Exercise 15"}, {"label": "Mycorrhiza trade", "html": "Glomus absorbs soil P → plant; plant shelters/feeds fungus; +pathogen/salinity/drought benefits", "cond": "Section 8.6"}, {"label": "Paddy trio", "html": "Anabaena + Nostoc + Oscillatoria → N fixation + organic matter in paddy", "cond": "Section 8.6"}], "deeper": "Answer the text's own question — what does the fungus get from mycorrhiza? Shelter and nourishment (photosynthate) from the plant, trading against phosphorus plus stress tolerance. Note the chapter's closing arc: biocontrol replaces pesticides (Section 8.5) while biofertilisers replace chemical fertilisers (Section 8.6) — together they answer Exercise 10 in one stroke.", "worked": "Paddy-field chain: standing water suits cyanobacteria → Anabaena/Nostoc/Oscillatoria fix atmospheric nitrogen → nitrogen plus added organic matter enrich the field → rice grows with less chemical fertiliser. Legume parallel: Rhizobium nodules convert air nitrogen into organic plant food.", "prediction": {"prompt": "A paddy farmer adds Anabaena-rich biofertiliser and cuts urea use. What should follow, per Section 8.6?", "options": ["Fixed nitrogen plus organic matter keep fertility up with less chemical fertiliser", "Rice immediately dies — cyanobacteria eat roots", "Nothing changes — cyanobacteria only fix phosphorus"], "answer": 0, "explanation": "In paddy fields cyanobacteria are important biofertilisers: they fix nitrogen and add organic matter, raising fertility."}, "connect": [["Paddy belts and pulse rotations", "Flooded rice fields from Tamil Nadu to West Bengal host the book's cyanobacterial trio, while rotating pulses (legumes) lets Rhizobium nodules recharge nitrogen — traditional Indian farming already biofertilising."], ["Wow — a fungus mines phosphorus for its plant", "Glomus threads extend the root into soil the plant cannot reach, hand over phosphorus, and throw in pathogen resistance plus drought and salinity tolerance — a mining contract written in symbiosis."]], "recall": "Name the N-fixers (symbiotic + free-living), the mycorrhizal partner and its trade, and the paddy trio.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Biofertilisers are", "options": ["Organisms enriching the nutrient quality of the soil", "Chemical fertilisers in smaller packets", "Pesticides killing soil pathogens"], "answer": 0, "hint": "Section 8.6 defines the term in one line.", "solution": "Biofertilisers are living organisms (bacteria, fungi, cyanobacteria) that enrich soil nutrients.", "wrong": ["They replace chemicals, not repackage them.", "Killing pests is biocontrol, not biofertilisation."]}, {"level": "Medium", "type": "mcq", "prompt": "In mycorrhiza, the fungal symbiont (e.g. Glomus) chiefly", "options": ["Absorbs phosphorus from soil and passes it to the plant", "Fixes atmospheric nitrogen into organic forms", "Produces biogas from root cellulose"], "answer": 0, "hint": "Which nutrient does the fungus deliver?", "solution": "The fungus supplies phosphorus (plus pathogen resistance, salinity/drought tolerance); nitrogen fixation is Rhizobium's job.", "wrong": ["Nitrogen fixation belongs to Rhizobium/Azotobacter/cyanobacteria.", "Biogas comes from methanogens, not mycorrhiza."]}, {"level": "Hard", "type": "number", "map": "Section 8.6", "prompt": "Number of nitrogen-fixing cyanobacteria named for paddy fields", "answer": 3, "unit": "", "tolerance": 0.1, "hint": "Anabaena, Nostoc and …?", "solution": "Three: Anabaena, Nostoc and Oscillatoria serve as biofertilisers in paddy fields."}], "resources": [{"title": "NCERT §8.6 — Biofertilisers (official PDF, PDF p.9)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo108.pdf#page=9"}]}], "exercises": [{"number": 1, "conceptIdx": 0, "page": 11, "printPage": null, "question": "Bacteria cannot be seen with the naked eyes, but these can be seen with the help of a microscope. If you have to carry a sample from your home to your biology laboratory to demonstrate the presence of microbes with the help of a microscope, which sample would you carry and why?", "steps": ["Bacteria need magnification, but their colonies (Figure 8.3) and their effects (set curd, risen dough) are visible — carry something already teeming with microbes.", "Best choice: a spoon of curd (or its whey), or fermented batter/yeast suspension — LAB/yeast are present in millions per spoonful as the starter itself proves.", "Why: guaranteed dense, safe, home-grown microbial population straight from Section 8.1, showing cells under the microscope."], "answer": "Curd (or fermented batter/yeast suspension) — millions of LAB/yeast per spoonful, safe and home-available."}, {"number": 2, "conceptIdx": 0, "page": 11, "printPage": null, "question": "Give examples to prove that microbes release gases during metabolism.", "steps": ["Puffed idli/dosa dough: bacteria ferment and release CO2 that raises the batter (Section 8.1).", "Bread dough: baker's yeast (Saccharomyces cerevisiae) releases CO2 during fermentation.", "Swiss cheese holes: Propionibacterium sharmanii releases large CO2 volumes; beverage fermentation also evolves CO2, while methanogens release methane with CO2 and H2."], "answer": "CO2 in idli/dosa dough, bread dough and Swiss-cheese holes; CO2 in beverages; CH4/CO2/H2 from methanogens."}, {"number": 3, "conceptIdx": 0, "page": 11, "printPage": null, "question": "In which food would you find lactic acid bacteria? Mention some of their useful applications.", "steps": ["Food: curd (milk converted by Lactobacillus and other LAB).", "Applications: acids coagulate and partly digest milk proteins to set curd; raise vitamin B12 (nutritional quality); the same LAB check disease-causing microbes in our stomach."], "answer": "Curd; sets/digests milk protein, adds B12, guards the gut."}, {"number": 4, "conceptIdx": 0, "page": 11, "printPage": null, "question": "Name some traditional Indian foods made of wheat, rice and Bengal gram (or their products) which involve use of microbes.", "steps": ["Principle from the text: cereal/pulse doughs and batters are fermented by bacteria or baker's yeast (idli, dosa, bread).", "Wheat: bhatura/bread (leavened with yeast); Rice: idli and dosa (rice batter fermented by bacteria); Bengal gram: dhokla (fermented besan batter).", "Honest note: the chapter names idli, dosa and bread; bhatura and dhokla are standard examples applying the same fermentation principle."], "answer": "Wheat: bhatura/bread; Rice: idli/dosa; Bengal gram: dhokla — all microbial fermentations."}, {"number": 5, "conceptIdx": 1, "page": 11, "printPage": null, "question": "In which way have microbes played a major role in controlling diseases caused by harmful bacteria?", "steps": ["Some microbes make antibiotics — chemicals that kill or retard the growth of disease-causing microbes (Section 8.2.2).", "Penicillin (Penicillium notatum; developed by Chain and Florey) led the way against  11, "printPage": null, "question": "Do you think microbes can also be used as source of energy? If yes, how?", "steps": ["Yes — biogas: methanogens (e.g. Methanobacterium) digest cellulosic dung anaerobically into methane-rich gas used for cooking and lighting (Section 8.4).", "Also, anaerobic sludge digesters in STPs release methane, hydrogen sulphide and carbon dioxide as inflammable biogas — an energy source."], "answer": "Yes: gobar-gas plants and STP digesters yield inflammable biogas fuel."}, {"number": 10, "conceptIdx": 4, "page": 11, "printPage": null, "question": "Microbes can be used to decrease the use of chemical fertilisers and pesticides. Explain how this can be accomplished.", "steps": ["Against pesticides: biocontrol — ladybird vs aphids, dragonflies vs mosquitoes, Bt spores/genes vs caterpillars (Bt-cotton), Trichoderma vs root pathogens, NPV vs target insects (Section 8.5).", "Against fertilisers: biofertilisers — Rhizobium/Azospirillum/Azotobacter fix nitrogen, Glomus mycorrhiza supplies phosphorus, paddy cyanobacteria add nitrogen plus organic matter (Section 8.6).", "Both replace toxic chemicals with living agents."], "answer": "Biocontrol agents replace pesticides; biofertilisers replace chemical fertilisers."}, {"number": 11, "conceptIdx": 3, "page": 11, "printPage": null, "question": "Three water samples namely river water, untreated sewage water and secondary effluent discharged from a sewage treatment plant were subjected to BOD test. The samples were labelled A, B and C; but the laboratory attendant did not note which was which. The BOD values of the three samples A, B and C were recorded as 20mg/L, 8mg/L and 400mg/L, respectively. Which sample of the water is most polluted? Can you assign the correct label to each assuming the river water is relatively clean?", "steps": ["BOD measures organic matter: greater BOD means more polluting potential (Section 8.3).", "Highest BOD = 400 mg/L (sample C) is most polluted → untreated sewage water.", "Middle 20 mg/L (sample A) is partly treated → secondary effluent; lowest 8 mg/L (sample B) → relatively clean river water."], "answer": "C (400) most polluted = untreated sewage; A (20) = secondary effluent; B (8) = river water."}, {"number": 12, "conceptIdx": 2, "page": 12, "printPage": null, "question": "Find out the name of the microbes from which Cyclosporin A (an immunosuppressive drug) and Statins (blood cholesterol lowering agents) are obtained.", "steps": ["Cyclosporin A: fungus Trichoderma polysporum — immunosuppressive agent for organ-transplant patients.", "Statins: yeast Monascus purpureus — blood-cholesterol lowering agents acting by competitive inhibition of the cholesterol-synthesis enzyme."], "answer": "Cyclosporin A: Trichoderma polysporum; Statins: Monascus purpureus."}, {"number": 13, "conceptIdx": 5, "page": 12, "printPage": null, "question": "Find out the role of microbes in the following and discuss it with your teacher. (a) Single cell protein (SCP) (b) Soil", "steps": ["(a) SCP: microbes (e.g. Spirulina, yeast, Methylophilus) grown in bulk as protein-rich food/feed supplement — a high-protein microbial harvest. Honest note: SCP is not detailed in this reprint's body text; treat as beyond-scope enrichment.", "(b) Soil: microbes decompose organic matter and cycle nutrients; Rhizobium/Azospirillum/Azotobacter fix nitrogen, Glomus mycorrhiza mobilises phosphorus, and cyanobacteria add nitrogen plus organic matter — the biofertiliser workforce of Section 8.6."], "answer": "(a) SCP: protein-rich microbial biomass for food/feed; (b) Soil: decomposition, nutrient cycling, biofertilisation."}, {"number": 14, "conceptIdx": 1, "page": 12, "printPage": null, "question": "Arrange the following in the decreasing order (most important first) of their importance, for the welfare of human society. Give reasons for your answer. Biogas, Citric acid, Penicillin and Curd", "steps": ["Criterion: life-saving scale first, then energy/livelihood, then daily nutrition, then industrial use.", "Penicillin first — cures deadly infections (plague, diphtheria, whooping cough, leprosy); without antibiotics the text says the world is unimaginable.", "Biogas next — cooking/lighting fuel plus spent-slurry fertiliser for rural masses (IARI/KVIC); then Curd — daily protein/B12 nutrition via LAB; then Citric acid — industrial/food ingredient with narrower welfare scope.", "Honest note: ordering involves judgement; any well-reasoned order is acceptable."], "answer": "Penicillin > Biogas > Curd > Citric acid, by life-saving scale, energy, nutrition, industry."}, {"number": 15, "conceptIdx": 5, "page": 12, "printPage": null, "question": "How do biofertilisers enrich the fertility of the soil?", "steps": ["Nitrogen: Rhizobium in legume nodules fixes atmospheric nitrogen into organic plant food; free-living Azospirillum and Azotobacter enrich soil nitrogen.", "Phosphorus: Glomus mycorrhiza absorbs soil phosphorus and passes it to the plant (plus pathogen resistance, salinity/drought tolerance, growth).", "Paddy and organic matter: Anabaena, Nostoc and Oscillatoria fix nitrogen in paddy fields while blue-green algae add organic matter — jointly cutting chemical-fertiliser dependence."], "answer": "By fixing nitrogen, mobilising phosphorus and adding organic matter to the soil."}], "pageOffset": null, "printPageStart": null, "printPageEnd": null, "paginationProvenance": "folio-absent-in-source"};

  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp) disp.innerHTML = "t = <b>" + state.t.toFixed(1) + " s</b>";
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Quiz ---
  function renderQuiz(){
    var lessons = C.lessons || C.concepts || [];
    var l = lessons[state.conceptIndex];
    if(!l) return;
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(!quizzes.length) return;
    var q = quizzes[state.level] || quizzes[0];
    if(!q) return;

    var qk = qKey(state.conceptIndex, state.level);
    var old = state.answers[qk] || {};

    var box = document.getElementById("quiz-container");
    if(!box) return;

    var promptText = q.prompt || q.question || "";
    var isMcq = q.type === "mcq" || (q.options && q.options.length > 0);
    var correctAns = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : 0);
    var solutionText = q.solution || q.explanation || "";
    var hintText = q.hint || "Review the key relationships in the concept overview above.";

    var html = '<div class="question-prompt">' + promptText + '</div>';
    if(isMcq && q.options){
      html += '<div class="quiz-options">' +
        q.options.map(function(opt, oi){
          var checked = old.value === String(oi) ? " checked" : "";
          return '<label class="quiz-option"><input type="radio" name="quiz_ans" value="' + oi + '"' + checked + '><span>' + opt + '</span></label>';
        }).join("") +
        '</div>';
    } else {
      html += '<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">' +
        '<input type="number" step="any" id="quiz_num_ans" placeholder="Your answer" value="' + (old.value || "") + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;width:160px;">' +
        '<span style="font-weight:600;color:var(--muted);">' + (q.unit || "") + '</span>' +
        '</div>';
    }

    html += '<div class="quiz-actions">' +
      '<button class="btn-primary" id="btn-submit-quiz">Submit Answer</button>' +
      '<button class="btn-secondary" id="btn-toggle-hint">Show Hint</button>' +
      '</div>' +
      '<div id="quiz-hint-box" class="quiz-hint" style="display:none;">' + hintText + '</div>' +
      '<div id="quiz-feedback-box" class="quiz-feedback" style="display:none;"></div>';

    box.innerHTML = html;

    // Hint toggle
    var hintBtn = document.getElementById("btn-toggle-hint");
    if(hintBtn){
      hintBtn.addEventListener("click", function(){
        var hb = document.getElementById("quiz-hint-box");
        if(hb) hb.style.display = hb.style.display === "none" ? "block" : "none";
      });
    }

    // Submit listener
    var submitBtn = document.getElementById("btn-submit-quiz");
    if(submitBtn){
      submitBtn.addEventListener("click", function(){
        var fb = document.getElementById("quiz-feedback-box");
        if(!fb) return;
        var isRight = false;
        var userVal = "";

        if(isMcq){
          var sel = document.querySelector('input[name="quiz_ans"]:checked');
          if(!sel){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please select an answer choice first.";
            return;
          }
          userVal = sel.value;
          isRight = Number(userVal) === Number(correctAns);
        } else {
          var inp = document.getElementById("quiz_num_ans");
          if(!inp || inp.value.trim() === ""){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please enter a numerical answer.";
            return;
          }
          userVal = inp.value.trim();
          var num = parseFloat(userVal);
          isRight = Math.abs(num - parseFloat(correctAns)) <= (q.tolerance || 0.05);
        }

        state.answers[qk] = { value: userVal, checked: true };
        if(isRight){
          state.correct[qk] = true;
          fb.style.display = "block";
          fb.className = "quiz-feedback success";
          fb.innerHTML = "<b>That’s right!</b> " + solutionText;
        } else {
          fb.style.display = "block";
          fb.className = "quiz-feedback retry";
          var wrongMsg = (isMcq && q.wrong && q.wrong[Number(userVal)]) ? q.wrong[Number(userVal)] : hintText;
          fb.innerHTML = "<b>Not quite.</b> " + wrongMsg + "<br><small style=\"margin-top:6px;display:block;\"><b>Full explanation:</b> " + solutionText + "</small>";
        }
        updateProgress();
      });
    }

    if(old.checked && submitBtn){
      submitBtn.click();
    }
  }

  // --- Render Revision View ---
  var currentExFilter = -1;

  function renderRevision(){
    pause();
    document.querySelectorAll(".concept-nav").forEach(function(b){ b.classList.remove("active"); });
    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.classList.add("active");

    var rawNum = C.chapterNumber || (C.chapter_meta && C.chapter_meta.number) || (C.code ? C.code.replace(/\D/g, '') : "01");
    var chNum = (!isNaN(parseInt(rawNum))) ? String(rawNum).padStart(2, '0') : rawNum;
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · NCERT EXERCISES & REVISION";

    var cView = document.getElementById("concept-view");
    var revView = document.getElementById("revision-view");
    if(cView) cView.style.display = "none";
    if(revView) revView.style.display = "block";

    var exList = C.exercises || [];
    if(!exList.length && C.exerciseMap){
      exList = C.exerciseMap.map(function(m){
        return {
          q: m[0],
          number: String(m[0]),
          title: m[1],
          conceptIdx: m[2],
          page: m[3],
          printPage: null,
          question: m[4] || m[1],
          steps: [m[5] || "Refer to concept explanation."],
          answer: m[5] || ""
        };
      });
    }

    var totalEx = exList.length;
    var html = '<div class="concept-header">' +
      '<span class="concept-badge">NCERT EXERCISE COMPENDIUM</span>' +
      '<h1 class="concept-title">Revise, Reflect, Refine</h1>' +
      '<p class="concept-deck">All ' + totalEx + ' exercises from NCERT Class 12 ' + (C.book_name || '') + ' with step-by-step solutions.</p>' +
      '</div>';

    // Filter Bar & Expand/Collapse All
    var lessons = C.lessons || C.concepts || [];
    html += '<div class="exercise-compendium-header">' +
      '<div class="exercise-filter-bar">' +
      '<button class="filter-chip ' + (currentExFilter === -1 ? 'active' : '') + '" data-cfilter="-1">All Exercises (' + totalEx + ')</button>' +
      lessons.map(function(l, li){
        var nav = l.nav || l.navTitle || l.title || ("C0" + (li+1));
        return '<button class="filter-chip ' + (currentExFilter === li ? 'active' : '') + '" data-cfilter="' + li + '">C0' + (li+1) + ': ' + nav + '</button>';
      }).join("") +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn-secondary" id="btn-expand-all" style="padding:6px 12px;font-size:13px;">Expand All Guidance</button>' +
      '<button class="btn-secondary" id="btn-collapse-all" style="padding:6px 12px;font-size:13px;">Collapse All</button>' +
      '</div>' +
      '</div>';

    // Exercise Cards List
    html += '<div id="exercise-cards-container">';
    var filtered = currentExFilter === -1 ? exList : exList.filter(function(e){
      return e.conceptIdx === currentExFilter || (e.section && e.section.includes(String(currentExFilter + 1)));
    });

    html += filtered.map(function(ex, eIdx){
      var qNum = ex.number || ex.q || (eIdx + 1);
      var sectionLabel = ex.section ? ('<span class="q-badge" style="background:#e0f2fe;color:#0369a1;margin-right:6px;">' + ex.section + '</span>') : '';
      var l = (ex.conceptIdx !== undefined && lessons[ex.conceptIdx]) ? lessons[ex.conceptIdx] : null;
      var conceptLink = l ? ('<a href="#concept-' + (ex.conceptIdx + 1) + '" class="q-concept-link" data-idx="' + ex.conceptIdx + '">Explore in Concept ' + ("0" + (ex.conceptIdx + 1)).slice(-2) + ' (' + (l.nav || l.navTitle || l.title) + ') ↗</a>') : '';

      var guidanceHtml = "";
      if(ex.guidance){
        if(typeof ex.guidance === 'string'){
          guidanceHtml = ex.guidance;
        } else if(Array.isArray(ex.guidance)){
          guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
            (ex.answer ? '<p><strong>Answer:</strong> ' + ex.answer + '</p>' : '') +
            '<ol>' + ex.guidance.map(function(g){ return '<li>' + g + '</li>'; }).join('') + '</ol></div>';
        }
      } else if(ex.steps && ex.steps.length){
        guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
          (ex.given ? '<div class="given-data"><b>Given:</b> ' + ex.given + '</div>' : '') +
          '<ol class="solution-steps">' + ex.steps.map(function(st){ return '<li>' + st + '</li>'; }).join('') + '</ol>' +
          (ex.answer ? '<div class="answer-box"><b>Final Answer:</b> ' + ex.answer + '</div>' : '') +
          '</div>';
      }

      var exPg = ex.page || ex.pdfPage;
      var exCite = exPg ? ('<span class="q-cite">PDF p.' + exPg + ((C.pageOffset === null || C.pageOffset === undefined) ? ' · printed folio absent in source' : ' · printed p.' + (exPg + C.pageOffset)) + '</span>') : '';
      return '<article class="exercise-card" id="exercise-q' + qNum + '">' +
        '<div class="exercise-card-meta">' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
        sectionLabel +
        '<span class="q-badge">QUESTION ' + qNum + '</span>' + exCite +
        '</div>' +
        conceptLink +
        '</div>' +
        
        '<div class="exercise-question-text" style="font-size:15px;line-height:1.6;margin:12px 0;white-space:pre-wrap;">' + (ex.question || ex.title || "") + '</div>' +
        
        '<details class="exercise-drawer">' +
        '<summary class="exercise-drawer-btn">📖 View Step-by-Step Guidance & Full Solution</summary>' +
        '<div class="exercise-solution-body" style="padding:14px;background:#f8fafc;border-radius:8px;margin-top:8px;">' +
        guidanceHtml +
        '</div>' +
        '</details>' +
        '</article>';
    }).join("");

    html += '</div>';

    revView.innerHTML = html;

    // Attach Filter Listeners
    revView.querySelectorAll(".filter-chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        currentExFilter = Number(chip.getAttribute("data-cfilter"));
        renderRevision();
      });
    });

    // Attach Expand/Collapse All Listeners
    var btnExp = document.getElementById("btn-expand-all");
    var btnCol = document.getElementById("btn-collapse-all");
    if(btnExp){
      btnExp.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = true; });
      });
    }
    if(btnCol){
      btnCol.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = false; });
      });
    }

    // Concept Navigation Links
    revView.querySelectorAll(".q-concept-link").forEach(function(a){
      a.addEventListener("click", function(e){
        e.preventDefault();
        var cIdx = Number(a.getAttribute("data-idx"));
        renderConcept(cIdx);
        window.scrollTo(0, 0);
      });
    });

    window.location.hash = "#revision";
  }

  // --- Build Sidebar Nav ---
  function buildSidebar(){
    var navContainer = document.getElementById("sidebar-nav");
    if(!navContainer) return;
    var lessons = C.lessons || C.concepts || [];
    navContainer.innerHTML = lessons.map(function(l, i){
      var nav = l.nav || l.navTitle || l.title || ("Concept " + (i + 1));
      return '<button class="concept-nav" data-cidx="' + i + '">' +
        '<span class="num">' + ("0" + (i + 1)).slice(-2) + '</span>' +
        '<span>' + nav + '</span>' +
        '</button>';
    }).join("");

    navContainer.querySelectorAll(".concept-nav").forEach(function(b){
      b.addEventListener("click", function(){
        var idx = Number(b.getAttribute("data-cidx"));
        renderConcept(idx);
      });
    });

    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.addEventListener("click", renderRevision);
  }

  // --- Reset Progress Button ---
  var resetProgBtn = document.getElementById("btn-reset-progress");
  if(resetProgBtn){
    resetProgBtn.addEventListener("click", function(){
      if(confirm("Reset all quiz answers and mastery progress for this chapter?")){
        state.answers = {};
        state.correct = {};
        saveStorage();
        updateProgress();
        renderQuiz();
      }
    });
  }

  // --- Handle Video Facades (No preloaded iframes) ---
  document.addEventListener("click", function(e){
    var btn = e.target.closest(".video-facade");
    if(btn){
      var vid = btn.getAttribute("data-yt");
      var parent = btn.parentElement;
      if(parent && vid){
        parent.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&rel=0" title="Video Lesson" style="width:100%;aspect-ratio:16/9;border:none;border-radius:8px;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
      }
    }
  });

  // --- URL Routing ---
  function routeFromHash(){
    var hash = window.location.hash;
    var lessons = C.lessons || C.concepts || [];
    if(hash === "#revision"){
      renderRevision();
    } else if(/^#concept-\d+$/.test(hash)){
      var cNum = parseInt(hash.replace("#concept-", ""), 10);
      if(cNum >= 1 && cNum <= lessons.length){
        renderConcept(cNum - 1);
        return;
      }
      renderConcept(0);
    } else {
      renderConcept(0);
    }
  }
  window.addEventListener("hashchange", routeFromHash);

  window.App = {
    state: state,
    play: play,
    pause: pause,
    step: step,
    resetTimeline: resetTimeline,
    seekTimeline: seekTimeline,
    renderConcept: renderConcept,
    renderRevision: renderRevision,
    routeFromHash: routeFromHash
  };
  if (typeof globalThis !== "undefined") {
    globalThis.App = window.App;
  }

  // Initialize
  initStorage();
  buildSidebar();
  updateProgress();
  routeFromHash();
})();

</script>

        var bx2 = 120 + (i * 31) % 120;
        var by2 = 210 - ((t * 30 + i * 25) % 60);
        m += '<circle cx="' + bx2 + '" cy="' + by2 + '" r="4" fill="#34d399" opacity="0.9"/>';
      }
      m += '<line x1="280" y1="110" x2="420" y2="110" stroke="#34d399" stroke-width="3"/>';
      m += '<text x="480" y="95" fill="#34d399" font-size="12">CH4 (predominant)</text>';
      m += '<text x="480" y="113" fill="#94a3b8" font-size="11">+ CO2 + H2 -&gt; houses</text>';
      m += '<text x="480" y="135" fill="#e2e8f0" font-size="12">cooking + lighting</text>';
      m += '<text x="480" y="160" fill="#94a3b8" font-size="11">Methanobacterium;</text>';
      m += '<text x="480" y="178" fill="#94a3b8" font-size="11">rumen digests cellulose</text>';
      m += '<text x="480" y="200" fill="#94a3b8" font-size="11">spent slurry -&gt; fertiliser</text>';
      m += '<text x="360" y="268" fill="#94a3b8" font-size="11" text-anchor="middle">Ex 9: yes — dung + STP digesters (CH4/H2S/CO2) are energy sources.</text>';
      svg.innerHTML = m;
      readout(cell("gas", "CH4 predominant", "#34d399") + cell("feed", feed + "%") + cell("cover", lift >= 30 ? "rising" : "low") + cell("slurry", "fertiliser"));
      verdict("<b>Sec 8.4:</b> <b>Methanobacterium</b> (also in <b>cattle rumen</b>) makes <b>biogas (CH4 predominant + CO2 + H2)</b>; <b>10-15 ft tank, floating cover rises</b>, piped for <b>cooking + lighting</b>, slurry = fertiliser (IARI + KVIC).");
    }
  }
  return { mount: mount, draw: draw };
})();

window.SIMS["biofertiliser"] = (function(){
  var item = 0;
  var crops = ["legume (pulses)", "cereals / soil", "many crops", "paddy field"];
  var microbes = ["Rhizobium (nodules)", "Azospirillum / Azotobacter (free-living)", "Glomus mycorrhiza (fungus)", "Anabaena + Nostoc + Oscillatoria"];
  var gifts = ["fixes air N to organic plant food", "free soil N enrichment", "absorbs soil P for plant + stress cover", "fix N + add organic matter"];
  function mount(){
    App.state.maxT = 6;
    var s = document.getElementById("time-scrubber"); if(s) s.max = 6;
    document.getElementById("lab-legend").innerHTML =
      '<div class="legend-item"><span class="legend-dot" style="background:#38bdf8;"></span><span>N-fixers: Rhizobium / Azotobacter</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#a78bfa;"></span><span>Mycorrhiza: Glomus gives P</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#34d399;"></span><span>Paddy trio: Anabaena / Nostoc / Oscillatoria</span></div>';
    document.getElementById("preset-bar").innerHTML =
      '<button class="preset-btn active" id="p-rh">Rhizobium nodules</button>' +
      '<button class="preset-btn" id="p-my">Glomus trade</button>' +
      '<button class="preset-btn" id="p-pa">Paddy trio (3)</button>';
    document.getElementById("p-rh").onclick = function(){ setActivePreset(this); item = 0; var r = document.getElementById("ctrl-i-range"); if(r) r.value = 0; draw(App.state.t); };
    document.getElementById("p-my").onclick = function(){ setActivePreset(this); item = 2; var r = document.getElementById("ctrl-i-range"); if(r) r.value = 2; draw(App.state.t); };
    document.getElementById("p-pa").onclick = function(){ setActivePreset(this); item = 3; var r = document.getElementById("ctrl-i-range"); if(r) r.value = 3; draw(App.state.t); };
    document.getElementById("lab-controls").innerHTML =
      '<div class="control-item"><div class="control-label"><span>Crop card</span><span class="val" id="ctrl-i">1 / 4</span></div>' +
      '<input type="range" id="ctrl-i-range" min="0" max="3" step="1" value="0"></div>' +
      '<div class="control-item"><div class="control-label"><span>Definition</span><span class="val">Ex 15</span></div>' +
      '<div style="font-size:12px;color:#94a3b8">organisms enriching soil nutrient quality</div></div>';
    document.getElementById("ctrl-i-range").oninput = function(){ item = numEl("ctrl-i-range", 0); draw(App.state.t); };
    draw(0);
  }
  function draw(t){
    var svg = svgEl(); if(!svg) return;
    item = numEl("ctrl-i-range", item);
    var el = document.getElementById("ctrl-i"); if(el) el.textContent = (item + 1) + " / 4";
    var r = document.getElementById("ctrl-i-range"); if(r) r.value = item;
    var cols = ["#38bdf8", "#38bdf8", "#a78bfa", "#34d399"];
    var m = '<rect width="720" height="300" fill="#09131d"/>';
    m += '<text x="360" y="26" fill="#94a3b8" font-size="13" text-anchor="middle">Biofertilisers (Sec 8.6; Ex 10 + 15): replace chemicals with living agents</text>';
    m += '<rect x="90" y="70" width="230" height="110" rx="8" fill="#0f1f2e" stroke="' + cols[item] + '"/>';
    m += '<text x="205" y="105" fill="#e2e8f0" font-size="13" text-anchor="middle">' + crops[item] + '</text>';
    m += '<text x="205" y="130" fill="' + cols[item] + '" font-size="11" text-anchor="middle">' + microbes[item] + '</text>';
    m += '<text x="205" y="155" fill="#94a3b8" font-size="10" text-anchor="middle">card ' + (item + 1) + ' / 4</text>';
    m += '<rect x="400" y="70" width="230" height="110" rx="8" fill="#0f1f2e" stroke="#334155"/>';
    m += '<text x="515" y="110" fill="#34d399" font-size="11" text-anchor="middle">' + gifts[item] + '</text>';
    if(item === 2){
      m += '<text x="515" y="135" fill="#94a3b8" font-size="10" text-anchor="middle">fungus gets shelter + food;</text>';
      m += '<text x="515" y="152" fill="#94a3b8" font-size="10" text-anchor="middle">plant resists pathogens/salt/drought</text>';
    }
    if(item === 3){
      var sway = Math.sin(t * 2) * 4;
      m += '<rect x="120" y="200" width="480" height="40" rx="8" fill="#0f2f3a" stroke="#34d399"/>';
      m += '<text x="360" y="' + (225 + sway) + '" fill="#34d399" font-size="11" text-anchor="middle">standing paddy water suits cyanobacteria -&gt; less urea</text>';
    }
    if(item === 0){
      m += '<circle cx="180" cy="220" r="16" fill="#14532d" stroke="#34d399"/>';
      m += '<circle cx="220" cy="228" r="10" fill="#14532d" stroke="#34d399"/>';
      m += '<text x="300" y="228" fill="#94a3b8" font-size="11">nodules on legume roots</text>';
    }
    svg.innerHTML = m;
    readout(cell("crop", crops[item]) + cell("microbe", microbes[item], cols[item]) + cell("gift", gifts[item], "#34d399"));
    if(item === 0) verdict("<b>Sec 8.6:</b> <b>Rhizobium</b> nodules on <b>legumes</b> fix air nitrogen to organic plant food — rotate pulses to recharge soil N.");
    else if(item === 1) verdict("<b>Sec 8.6:</b> free-living <b>Azospirillum + Azotobacter</b> enrich soil nitrogen without nodules.");
    else if(item === 2) verdict("<b>Sec 8.6:</b> <b>Glomus mycorrhiza</b>: fungus <b>absorbs soil phosphorus for the plant</b> (+pathogen/salinity/drought cover); plant gives shelter + nourishment.");
    else verdict("<b>Sec 8.6:</b> paddy trio <b>Anabaena + Nostoc + Oscillatoria</b> fix nitrogen and <b>add organic matter</b> — flooded fields fertilise themselves, cutting urea.");
  }
  return { mount: mount, draw: draw };
})();

  window.App.routeFromHash();
}
