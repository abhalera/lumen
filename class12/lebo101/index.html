<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 1: Sexual Reproduction in Flowering Plants — Interactive Textbook</title>
<style>
:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  text-align: left;
  background: #0f172a;
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
}
.play-btn {
  flex: none;
  width: 34px;
  height: 34px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 14px;
}
.video-title {
  font-size: 13px;
  line-height: 1.4;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.q-badge {
  background: var(--soft);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 3px 10px;
  border-radius: 6px;
}
.q-concept-link {
  color: var(--blue);
  text-decoration: none;
  font-size: 13px;

window.CHAPTER = {"code": "lebo101", "chapterNumber": 1, "book_name": "Biology", "title": "Sexual Reproduction in Flowering Plants", "subtitle": "Flower whorls to double fertilisation, endosperm and embryo, seed and fruit, apomixis and polyembryony.", "edition": "Reprint 2026-27", "source": "https://ncert.nic.in/textbook/pdf/lebo101.pdf", "page_start": 1, "page_end": 25, "extraction": "PyMuPDF text layer + section/exercise page maps in /tmp/opencode/bio_maps.json. pdftotext not used.", "lessons": [{"id": "flower-whorls", "nav": "Flower & whorls", "title": "The flower: androecium and gynoecium, sites of sexual reproduction", "deck": "Flowers exist as an aid to sexual reproduction: fruits and seeds are its end products. The androecium (stamens) is the male organ, the gynoecium (pistil) the female organ — the two parts where gametophytes develop.", "minutes": 8, "section": "1.1, 1.2", "pages": [3, 4], "print": "3–4", "sim": "flowerparts", "simTitle": "Flower whorls: toggle androecium and gynoecium", "quick": ["Are we not lucky that plants reproduce sexually? The myriads of flowers, their scents and rich colours are all there as an <strong>aid to sexual reproduction</strong>. All flowering plants show sexual reproduction, and the diversity of inflorescences, flowers and floral parts is an amazing range of adaptations to ensure formation of the end products — the <strong>fruits and seeds</strong>.", "To a biologist, flowers are <strong>morphological and embryological marvels and the sites of sexual reproduction</strong>. Figure 1.1 (L.S. of a flower) recalls the parts of a typical flower. The two parts in which the two most important units of sexual reproduction develop are the <strong>androecium</strong> (whorl of stamens, male) and the <strong>gynoecium</strong> (female).", "Much before a flower is seen, the decision to flower has taken place: <strong>hormonal and structural changes</strong> lead to differentiation of the <strong>floral primordium</strong>, inflorescences bearing floral buds form, and then, in the flower, the <strong>androecium</strong> (male reproductive organ) and the <strong>gynoecium</strong> (female reproductive organ) differentiate and develop."], "formulas": [{"label": "Male vs female whorl", "html": "androecium (stamens) → male gametophyte; gynoecium (pistil) → female gametophyte", "cond": "Sections 1.1–1.2; Exercise 1"}, {"label": "Stamen parts", "html": "stamen = filament (stalk) + anther (bilobed, dithecous)", "cond": "Figure 1.2; §1.2.1 opener"}, {"label": "Pistil parts", "html": "pistil = stigma (landing platform) + style + ovary (locule, placenta, ovules)", "cond": "§1.2.2; Figure 1.7a"}], "deeper": "Activity (§1.1): list five ornamental flowers cultivated at homes/gardens and five used in social and cultural celebrations; floriculture is the cultivation of such flowers. The chapter opener frames everything that follows: every adaptation of inflorescence and floral parts serves the formation of fruits and seeds.", "worked": "In-text check (p. 4): name the two flower parts where sexual reproduction units develop — the androecium (stamens → pollen grains, male gametophytes) and the gynoecium (pistil → embryo sac in the ovule, female gametophyte). This is Exercise 1, answered directly by §1.1–1.2.", "prediction": {"prompt": "A student touches the opened anthers of Hibiscus and finds yellowish powdery grains on the fingers. What is this powder?", "options": ["Male gametophytes — pollen grains produced in the anther (androecium)", "Female gametophytes from the embryo sac", "Broken bits of anther wall (sporophytic tissue)"], "answer": 0, "explanation": "Pollen grains represent the male gametophytes (§1.2.1); the Hibiscus-anther observation is the book's own activity."}, "connect": [["Floriculture around Indian homes", "Marigold, rose, jasmine and chrysanthemum grown for ornament, worship and weddings are the §1.1 activity made real — aesthetic value built on organs whose biological job is sexual reproduction.", [], {"id": "lW8hbdNGhBE", "title": "Sexual Reproduction In Flowering Plants Class 12 | NCERT + Diagram + PYQs | Biology chapter 1", "channel": "NCERT Wallah"}], ["Wow — selfishness vs seed-set", "Flowers do not exist only for us to be used for our own selfishness (chapter opener). Every scent, colour and shape is an adaptation to ensure fruits and seeds — the plant's own agenda."]], "recall": "Name the two whorls where male and female gametophytes develop, and trace the pre-flowering sequence: decision → floral primordium → inflorescence → androecium/gynoecium.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The male reproductive organ (whorl) of the flower is the", "options": ["Androecium, a whorl of stamens", "Gynoecium, the pistil", "Thalamus, the floral base"], "answer": 0, "hint": "Section 1.2 names each whorl's role.", "solution": "Androecium = male (stamens); gynoecium = female (pistil).", "wrong": ["The gynoecium is the female reproductive organ.", "The thalamus bears the whorls; it is not itself reproductive."]}, {"level": "Medium", "type": "mcq", "prompt": "Long before any flower is seen, the plant commits to flowering through", "options": ["Hormonal and structural changes → floral primordium → inflorescences → flowers", "Direct conversion of petals into stamens", "Immediate meiosis in cells of the thalamus"], "answer": 0, "hint": "Read the first paragraph of §1.2.", "solution": "The decision to flower triggers hormonal/structural changes, differentiation of the floral primordium, then inflorescences with floral buds.", "wrong": ["Petals do not convert into stamens in normal development.", "Meiosis happens later, inside anther and ovule, not in the thalamus."]}, {"level": "Hard", "type": "number", "map": "§1.2.2", "prompt": "Number of parts of each pistil (stigma, style, ovary)", "answer": 3, "unit": "parts", "tolerance": 0.1, "hint": "Figure 1.7a labels them.", "solution": "Each pistil has three parts: stigma, style and ovary."}], "resources": [{"title": "NCERT §1.1, 1.2 — Flower & whorls (official PDF, PDF p.3)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo101.pdf#page=3"}]}, {"id": "stamen-pollen", "nav": "Stamen & pollen grain", "title": "Microsporogenesis: from sporogenous tissue to the 2-celled pollen grain", "deck": "A dithecous tetragonal anther holds four microsporangia. Sporogenous tissue → PMC → meiosis → microspore tetrad → pollen grains with sporopollenin exine; shed 2-celled in over 60% of angiosperms.", "minutes": 9, "section": "1.2.1", "pages": [5, 8], "print": "5–8", "sim": "pollenlab", "simTitle": "Microsporogenesis stepper: PMC → tetrad → pollen grain", "quick": ["A typical stamen has a long slender <strong>filament</strong> and a terminal generally <strong>bilobed anther</strong>. The anther is <strong>dithecous</strong> (each lobe two thecae) and, in transverse section, <strong>tetragonal with four microsporangia</strong> at the corners — the future pollen sacs packed with pollen grains.", "Each microsporangium is surrounded by four wall layers — <strong>epidermis, endothecium, middle layers and tapetum</strong>. The outer three protect and help dehiscence; the innermost <strong>tapetum nourishes the developing pollen grains</strong>, its cells with dense cytoplasm and generally more than one nucleus. The centre holds compact <strong>sporogenous tissue</strong>.", "<strong>Microsporogenesis</strong>: cells of sporogenous tissue act as <strong>pollen mother cells (PMCs)</strong> and undergo <strong>meiosis</strong> to form <strong>microspore tetrads</strong> (haploid). As anthers mature and dehydrate, microspores dissociate and develop into <strong>pollen grains</strong> — several thousands per microsporangium, released at dehiscence.", "Pollen grains are the <strong>male gametophytes</strong>, generally spherical, <strong>25–50 micrometres</strong>. The hard outer <strong>exine of sporopollenin</strong> (most resistant organic material known; germ pores where it is absent; preserves as fossils) covers a thin <strong>intine of cellulose and pectin</strong>. Mature grains hold a large <strong>vegetative cell</strong> plus a small spindle-shaped <strong>generative cell</strong>; shed <strong>2-celled in over 60% of angiosperms</strong>, 3-celled (two male gametes) in the rest. Viability varies: <strong>rice/wheat lose it within 30 minutes</strong>, some Rosaceae/Leguminosae/Solanaceae keep it for months, and pollen banks store grains for years in <strong>liquid nitrogen (−196 °C)</strong>. <em>Parthenium</em> (carrot grass, a contaminant with imported wheat) pollen causes severe allergy."], "formulas": [{"label": "Microsporogenesis", "html": "sporogenous tissue → PMC → meiosis → microspore tetrad (n) → pollen grain", "cond": "§1.2.1; Exercise 3 order"}, {"label": "Pollen wall", "html": "exine (sporopollenin, germ pores) + intine (cellulose, pectin)", "cond": "§1.2.1"}, {"label": "Shed stage", "html": "2-celled (vegetative + generative) in >60%; 3-celled (+2 male gametes) in the rest", "cond": "§1.2.1"}], "deeper": "In-text questions (§1.2.1): the tetrad cells are haploid (meiosis of diploid PMC); the book asks how tapetal cells could become bi-nucleate (posed as an open in-text question). Figure 1.3 shows young anther T.S., one microsporangium with wall layers, and the mature dehisced anther; Figure 1.4 shows pollen diversity by SEM.", "worked": "In-text ploidy check: PMC is diploid (sporophytic); meiosis gives four haploid microspores, so each cell of the microspore tetrad is n. The vegetative + generative cells of the pollen grain arise by mitosis of the microspore nucleus, hence also n.", "prediction": {"prompt": "A diploid PMC (2n) completes microsporogenesis. What is the ploidy of each cell of the resulting microspore tetrad?", "options": ["Haploid (n) — meiosis halves the chromosome number", "Diploid (2n) — same as the PMC", "Triploid (3n) — fused with a polar nucleus"], "answer": 0, "explanation": "Microsporogenesis is meiosis: one diploid PMC yields four haploid microspores (the book's own in-text question)."}, "connect": [["Parthenium: the contaminant weed", "Carrot grass came into India as a contaminant with imported wheat and is now ubiquitous — its pollen triggers asthma and bronchitis. Exine built to survive now rides the wind into lungs."], ["Wow — the indestructible wall", "Sporopollenin withstands high temperature, strong acids and alkali, and no enzyme degrading it is yet known — so pollen grains are preserved as fossils millions of years old."]], "recall": "State the four anther wall layers with functions, the microsporogenesis sequence, the ploidy of the tetrad, and the 2-celled vs 3-celled shedding rule.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The innermost anther wall layer that nourishes developing pollen grains is the", "options": ["Tapetum", "Endothecium", "Epidermis"], "answer": 0, "hint": "Four wall layers; which is innermost?", "solution": "Tapetum: dense cytoplasm, often multinucleate, nutritive.", "wrong": ["Endothecium is protective and aids dehiscence.", "Epidermis is the outermost protective layer."]}, {"level": "Medium", "type": "number", "map": "Figure 1.3", "prompt": "Number of wall layers surrounding a typical microsporangium", "answer": 4, "unit": "layers", "tolerance": 0.1, "hint": "Epidermis, endothecium, middle layers, tapetum.", "solution": "Four: epidermis, endothecium, middle layers, tapetum."}, {"level": "Hard", "type": "number", "map": "§1.2.1 viability", "prompt": "Time within which rice/wheat pollen grains lose viability after release", "answer": 30, "unit": "min", "tolerance": 5, "hint": "Cereals lose it fast; some families keep it months.", "solution": "Rice and wheat pollen lose viability within 30 minutes (temperature/humidity dependent)."}], "resources": [{"title": "NCERT §1.2.1 — Stamen & pollen grain (official PDF, PDF p.5)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo101.pdf#page=5"}]}, {"id": "pistil-embryosac", "nav": "Pistil & embryo sac", "title": "Megasporogenesis to the monosporic 7-celled, 8-nucleate embryo sac", "deck": "One MMC in the micropylar nucellus undergoes meiosis; one functional megaspore divides mitotically (free-nuclear) into the 7-celled, 8-nucleate female gametophyte: egg apparatus + antipodals + central cell.", "minutes": 9, "section": "1.2.2", "pages": [8, 11], "print": "8–11", "sim": "embryosac", "simTitle": "Embryo-sac builder: monosporic 7-celled, 8-nucleate", "quick": ["The <strong>gynoecium</strong> may be a single pistil (<strong>monocarpellary</strong>) or several (<strong>multicarpellary</strong>) — fused (<strong>syncarpous</strong>, e.g. <em>Papaver</em>) or free (<strong>apocarpous</strong>, e.g. <em>Michelia</em>). Each pistil has <strong>stigma</strong> (landing platform), <strong>style</strong> and <strong>ovary</strong> with locule and placenta bearing <strong>ovules (megasporangia)</strong>: one in wheat, paddy and mango, many in papaya, watermelon and orchids.", "A typical anatropous ovule (Fig. 1.7d) has a stalk (<strong>funicle</strong>; junction = <strong>hilum</strong>), one or two <strong>integuments</strong> leaving a <strong>micropyle</strong> at the tip, basal <strong>chalaza</strong>, and a mass of reserve-rich cells, the <strong>nucellus</strong>, housing the <strong>embryo sac (female gametophyte)</strong> — generally one per ovule, from a megaspore.", "<strong>Megasporogenesis</strong>: usually a single <strong>megaspore mother cell (MMC)</strong> differentiates in the micropylar nucellus — large, dense cytoplasm, prominent nucleus — and undergoes <strong>meiotic division</strong> into <strong>four megaspores</strong> (Fig. 1.8a).", "In most flowering plants <strong>one megaspore is functional</strong> and three degenerate — <strong>monosporic development</strong>. Its nucleus divides <strong>mitotically</strong> to the 2-nucleate stage (nuclei to opposite poles), then 4- and 8-nucleate stages; these divisions are <strong>strictly free-nuclear</strong> (no walls yet). Walls then organise the <strong>typical 7-celled, 8-nucleate embryo sac</strong>: micropylar <strong>egg apparatus</strong> (two synergids with <strong>filiform apparatus</strong> guiding pollen tubes + one egg cell), chalazal <strong>three antipodals</strong>, and a large <strong>central cell with two polar nuclei</strong>."], "formulas": [{"label": "Megasporogenesis", "html": "MMC (2n) → meiosis → 4 megaspores (n); 1 functional", "cond": "§1.2.2; Fig. 1.8a"}, {"label": "Mature embryo sac", "html": "8 nuclei, 7 cells = egg apparatus (2 synergids + egg) + 3 antipodals + central cell (2 polar nuclei)", "cond": "§1.2.2; Fig. 1.8b–c"}, {"label": "Ploidy line", "html": "nucellus 2n, MMC 2n, functional megaspore n, embryo sac n", "cond": "in-text ploidy question, §1.2.2"}], "deeper": "Why must the MMC undergo meiosis? To halve the chromosome number so the gametophyte and gametes are haploid (the book's in-text question). Ploidy answers: nucellus 2n (sporophytic), MMC 2n, functional megaspore n, embryo sac n. The synergids' filiform apparatus at the micropylar tip later guides the pollen tube into a synergid (§1.2.3/Fig. 1.12).", "worked": "Exercise 5 reasoning: monosporic = embryo sac from a single megaspore of the tetrad. Exercise 6 reasoning: count nuclei — egg apparatus 3 nuclei in 3 cells + antipodals 3 nuclei in 3 cells + central cell 2 nuclei in 1 cell = 8 nuclei in 7 cells.", "prediction": {"prompt": "The functional megaspore nucleus divides mitotically three times with no cell walls, then walls are laid down. The result is", "options": ["An 8-nucleate stage organising into the 7-celled embryo sac", "A 4-nucleate, 4-celled embryo sac directly", "Eight separate megaspores"], "answer": 0, "explanation": "Three free-nuclear mitoses give 8 nuclei; six get walls (egg apparatus + antipodals), two polar nuclei share the central cell: 7 cells, 8 nuclei."}, "connect": [["One ovule or thousands", "A mango ovary holds a single ovule while an orchid ovary holds thousands of tiny ovules — the same megasporogenesis running once or en masse; orchid fruits later carry thousands of tiny seeds."], ["Wow — three degenerate so one can live", "Of four meiotic megaspores only one is functional; the other three degenerate. The entire female gametophyte masculinity of the flower's future hangs on a single haploid cell."]], "recall": "Draw and label the anatropous ovule and the mature embryo sac; state the monosporic sequence and the ploidy of nucellus, MMC, functional megaspore and embryo sac.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "A typical mature angiosperm embryo sac is", "options": ["7-celled and 8-nucleate", "8-celled and 7-nucleate", "8-celled and 8-nucleate"], "answer": 0, "hint": "Count cells vs nuclei in Fig. 1.8c.", "solution": "Seven cells (3 egg apparatus + 3 antipodals + 1 central) holding eight nuclei (central cell has two).", "wrong": ["Cells and nuclei are swapped here.", "The central cell's two nuclei share one cell, so cells are seven, not eight."]}, {"level": "Medium", "type": "number", "map": "Fig. 1.8c", "prompt": "Number of antipodal cells at the chalazal end", "answer": 3, "unit": "cells", "tolerance": 0.1, "hint": "Chalazal trio.", "solution": "Three antipodals at the chalazal end."}, {"level": "Hard", "type": "mcq", "prompt": "Ploidy of nucellus, MMC and functional megaspore respectively is", "options": ["2n, 2n, n", "n, n, 2n", "2n, n, n"], "answer": 0, "hint": "Meiosis happens once, at the MMC.", "solution": "Nucellus and MMC are sporophytic (2n); meiosis yields haploid (n) megaspores.", "wrong": ["The MMC is not haploid; it is the cell that undergoes meiosis.", "The nucellus never undergoes meiosis; it stays diploid."]}], "resources": [{"title": "NCERT §1.2.2 — Pistil & embryo sac (official PDF, PDF p.8)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo101.pdf#page=8"}]}, {"id": "pollination", "nav": "Pollination", "title": "Pollination: autogamy, geitonogamy, xenogamy and outbreeding devices", "deck": "Pollen meets stigma by wind, water or animals. Cleistogamy locks in autogamy; dichogamy, herkogamy, self-incompatibility, monoecy and dioecy push toward xenogamy. Emasculation + bagging lets breeders control crosses.", "minutes": 9, "section": "1.2.3", "pages": [11, 17], "print": "11–17", "sim": "pollination", "simTitle": "Pollination agents: wind, water, insect + flower types", "quick": ["<strong>Pollination</strong> is the transfer of pollen grains (shed from the anther) to the stigma — needed because both gametes are <strong>non-motile</strong>. By pollen source: <strong>autogamy</strong> (same flower; needs synchrony of release/receptivity plus close anther–stigma), <strong>geitonogamy</strong> (another flower, same plant — functionally cross-pollination but <strong>genetically autogamy</strong>), <strong>xenogamy</strong> (different plant — the <strong>only genetically cross</strong> type).", "<em>Viola</em>, <em>Oxalis</em> and <em>Commelina</em> bear <strong>chasmogamous</strong> flowers (open, exposed anthers/stigma) and <strong>cleistogamous</strong> flowers (never open; anthers/stigma close; anthers dehisce in the bud). Cleistogamous flowers are <strong>invariably autogamous</strong> — no cross-pollen can land — giving <strong>assured seed-set without pollinators</strong>.", "Agents: <strong>wind</strong> (light non-sticky pollen, exposed stamens, large feathery stigmas, single ovule, packed inflorescences; corn cob = waving stigmas/styles; grasses) and <strong>water</strong> — rare, about <strong>30 genera, mostly monocots</strong>: <em>Vallisneria</em> (female flowers at the surface by long stalks; male flowers/pollen float over), <em>Hydrilla</em>, submerged <em>Zostera</em> (long ribbon-like pollen; mucilaginous anti-wetting coat). Water hyacinth and water lily instead rise above water for insect/wind pollination. Wind/water flowers are dull and nectarless. <strong>Animals</strong> (mostly <strong>insects, especially bees</strong>; also butterflies, moths, birds like sunbirds/humming birds, bats, lemurs, rodents, gecko/garden lizards) serve large, colourful, fragrant, nectar-rich flowers with sticky pollen; rewards are nectar/pollen or egg-laying sites — the 6-feet Amorphophallus and the Yucca–moth obligate pair; mere visitors that skip anther–stigma contact are <strong>pollen/nectar robbers</strong>.", "<strong>Outbreeding devices</strong> against inbreeding depression: <strong>non-synchronised</strong> release/receptivity and <strong>separated</strong> anther–stigma positions (both block autogamy); genetic <strong>self-incompatibility</strong> (inhibits self-pollen germination/tube growth); <strong>unisexual flowers</strong> — monoecious castor and maize (blocks autogamy, not geitonogamy), dioecious papaya (blocks both). <strong>Pollen–pistil interaction</strong>: the pistil recognises compatible vs incompatible pollen via a chemical dialogue, promoting or rejecting (no germination / no tube growth). Compatible tubes grow germ pore → stigma/style → ovary → <strong>micropyle</strong> → a <strong>synergid via the filiform apparatus</strong> (Fig. 1.12); 2-celled pollen makes its two male gametes en route, 3-celled pollen carries them. Breeders enforce crosses by <strong>artificial hybridisation</strong>: <strong>emasculation</strong> (forceps-remove anthers from bisexual buds before dehiscence) + <strong>bagging</strong> (butter-paper bag), dust desired pollen at receptivity, rebag; unisexual females need bagging only."], "formulas": [{"label": "Three kinds", "html": "autogamy (same flower) → geitonogamy (same plant) → xenogamy (different plant)", "cond": "§1.2.3"}, {"label": "Outbreeding ladder", "html": "non-synchrony/separation < self-incompatibility < monoecy (no autogamy) < dioecy (no autogamy, no geitonogamy)", "cond": "§1.2.3; castor, maize, papaya"}, {"label": "Emasculation + bagging", "html": "remove anthers before dehiscence → bag (butter paper) → dust desired pollen at receptivity → rebag", "cond": "§1.2.3 artificial hybridisation"}], "deeper": "Field activity (§1.2.3): watch cucumber, mango, peepal, coriander, papaya, onion, lobia, cotton, tobacco, rose, lemon, eucalyptus and banana flowers across days/times; only visitors contacting both anthers and stigma are pollinators. Pollen germination can be watched in the lab: dust pea/chickpea/Crotalaria/balsam/Vinca pollen on ~10% sugar solution, see tubes in 15–30 minutes.", "worked": "Exercise 7 reasoning: chasmogamous = open with exposed anthers/stigma (cross-pollination possible); cleistogamous = never open, so cross-pollen cannot land — cross-pollination cannot occur; they are invariably autogamous with assured seed-set.", "prediction": {"prompt": "Pollen moves from one flower to another flower on the same maize plant. Genetically, this is", "options": ["Similar to autogamy — pollen and stigma belong to the same plant", "True xenogamy — different flowers means different genes", "A mutation event"], "answer": 0, "explanation": "Geitonogamy: functionally cross-pollination (needs an agent) but genetically autogamy since pollen comes from the same plant."}, "connect": [["Corn cob and Vallisneria ponds", "The corn cob's silky ears are giant stigmas waving for wind pollen, and village-pond <em>Vallisneria</em> floats male flowers to surface-borne female ones — abiotic pollination visible across Indian fields and ponds."], ["Wow — the 6-foot flower and its moth", "Amorphophallus rises about 6 feet offering egg-laying sites, and the Yucca moth cannot complete its life cycle without the Yucca flower — pollination as an obligate pact."]], "recall": "Distinguish autogamy/geitonogamy/xenogamy and chasmogamy/cleistogamy; list four outbreeding devices with examples; state the emasculation–bagging sequence.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Xenogamy is the transfer of pollen from anther to the stigma of", "options": ["A flower of a different plant", "Another flower of the same plant", "The same flower"], "answer": 0, "hint": "Only one type brings genetically different pollen.", "solution": "Xenogamy = different plant; the only genetically cross-pollination.", "wrong": ["That is geitonogamy (genetically autogamy).", "That is autogamy."]}, {"level": "Medium", "type": "number", "map": "§1.2.3 water pollination", "prompt": "Approximate number of genera using water pollination (mostly monocots)", "answer": 30, "unit": "genera", "tolerance": 5, "hint": "Rare: Vallisneria, Hydrilla, Zostera and few others.", "solution": "Limited to about 30 genera, mostly monocotyledons."}, {"level": "Hard", "type": "mcq", "prompt": "Which condition prevents BOTH autogamy and geitonogamy?", "options": ["Dioecy — e.g. papaya with male and female flowers on different plants", "Monoecy — e.g. castor and maize", "Cleistogamy"], "answer": 0, "hint": "Separate plants vs same plant.", "solution": "Dioecy: each plant is male or female, so neither same-flower nor same-plant pollination is possible.", "wrong": ["Monoecy blocks autogamy but geitonogamy between flowers of one plant remains.", "Cleistogamy enforces autogamy; it never permits crossing."]}], "resources": [{"title": "NCERT §1.2.3 — Pollination (official PDF, PDF p.11)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo101.pdf#page=11"}]}, {"id": "double-fertilisation", "nav": "Double fertilisation", "title": "Double fertilisation: syngamy (2n) plus triple fusion (3n)", "deck": "The pollen tube discharges two male gametes into a synergid: one fuses with the egg (syngamy → 2n zygote), the other with two polar nuclei (triple fusion → 3n PEN). Unique to flowering plants.", "minutes": 8, "section": "1.2.3 (pollen tube), 1.3", "pages": [16, 18], "print": "16–18", "sim": "fertilisation", "simTitle": "Double-fertilisation stepper: syngamy + triple fusion", "quick": ["After entering a <strong>synergid</strong>, the pollen tube releases the <strong>two male gametes</strong> into the synergid cytoplasm (Fig. 1.13a). One male gamete moves toward the <strong>egg cell</strong> and fuses with its nucleus — <strong>syngamy</strong> — forming the diploid <strong>zygote (2n)</strong>.", "The other male gamete moves toward the <strong>two polar nuclei</strong> in the central cell and fuses with them to produce the triploid <strong>primary endosperm nucleus (PEN, 3n)</strong>. Since three haploid nuclei fuse, this is <strong>triple fusion</strong>.", "Because <strong>two fusions — syngamy and triple fusion — occur in one embryo sac</strong>, the phenomenon is <strong>double fertilisation, unique to flowering plants</strong>. The central cell becomes the <strong>primary endosperm cell (PEC)</strong> → endosperm, while the <strong>zygote → embryo</strong>."], "formulas": [{"label": "Syngamy", "html": "egg (n) + male gamete (n) → zygote (2n)", "cond": "§1.3"}, {"label": "Triple fusion", "html": "polar nucleus (n) + polar nucleus (n) + male gamete (n) → PEN (3n)", "cond": "§1.3; Exercise 11"}, {"label": "Double fertilisation", "html": "syngamy + triple fusion in one embryo sac — unique to angiosperms", "cond": "§1.3"}], "deeper": "Reading note for this reprint: the §1.4 POST-FERTILISATION heading and the endosperm opener print on the same page before the §1.3 DOUBLE FERTILISATION text; the TOC order 1.3 then 1.4 is retained in this chapter. Figure 1.12 traces the tube path (stigma → style → micropyle → synergid) and Figure 1.13a shows zygote + PEN side by side.", "worked": "Exercise 11 reasoning: triple fusion happens in the central cell of the embryo sac when the second male gamete fuses with the two polar nuclei; the three haploid nuclei involved are polar nucleus + polar nucleus + male gamete, giving the triploid PEN.", "prediction": {"prompt": "One male gamete fuses with the egg (n); the other fuses with two polar nuclei (n + n). The two products are", "options": ["Diploid zygote (2n) + triploid PEN (3n)", "Haploid zygote (n) + diploid PEN (2n)", "Triploid zygote (3n) + diploid PEN (2n)"], "answer": 0, "explanation": "n + n = 2n zygote (syngamy); n + n + n = 3n PEN (triple fusion) — the signature of double fertilisation."}, "connect": [["Why breeders care about the tube's journey", "Pollen–pistil recognition decides acceptance or rejection; breeders manipulate even incompatible pollinations to force desired hybrids — double fertilisation is the gate they must reach."], ["Wow — one tube, two fusions, two futures", "A single pollen tube delivers two gametes with two destinies: one builds the embryo, the other builds its food reserve — an arrangement found nowhere outside flowering plants."]], "recall": "Write both fusion equations with ploidy, name the nuclei in triple fusion, and state what PEC and zygote each become.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "After syngamy (egg + male gamete), the zygote is", "options": ["Diploid (2n)", "Haploid (n)", "Triploid (3n)"], "answer": 0, "hint": "n + n = ?", "solution": "Two haploid nuclei fuse: the zygote is diploid (2n).", "wrong": ["Haploid is each gamete before fusion.", "Triploid is the PEN, not the zygote."]}, {"level": "Medium", "type": "number", "map": "Exercise 11", "prompt": "Number of haploid nuclei that fuse in triple fusion", "answer": 3, "unit": "nuclei", "tolerance": 0.1, "hint": "Two polar + one male gamete.", "solution": "Three haploid nuclei (2 polar nuclei + 1 male gamete) form the 3n PEN."}, {"level": "Hard", "type": "mcq", "prompt": "The primary endosperm cell (central cell after triple fusion) develops into the", "options": ["Endosperm", "Embryo", "Seed coat (testa)"], "answer": 0, "hint": "PEC → ?; zygote → ?", "solution": "PEC develops into the (triploid) endosperm; the zygote forms the embryo.", "wrong": ["The embryo comes from the zygote, not the PEC.", "Testa comes from the integuments, not the PEC."]}], "resources": [{"title": "NCERT §1.2.3 (pollen tube), 1.3 — Double fertilisation (official PDF, PDF p.16)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo101.pdf#page=16"}]}, {"id": "post-fertilisation", "nav": "Endosperm, embryo, seed", "title": "Post-fertilisation: endosperm first, then embryo, seed and fruit", "deck": "Endosperm develops before the embryo (coconut water is free-nuclear endosperm). Dicot embryos carry two cotyledons, grasses one scutellum with coleoptile/coleorrhiza. Ovary → fruit, ovule → seed; apple is false, banana parthenocarpic.", "minutes": 9, "section": "1.4–1.4.3", "pages": [18, 22], "print": "18–22", "sim": "seedfruit", "simTitle": "Fate mapper: ovary→fruit, ovule→seed, integuments→testa", "quick": ["<strong>Endosperm develops before the embryo</strong> — an adaptation for assured nutrition, since most zygotes divide only after some endosperm exists. The <strong>primary endosperm cell divides into triploid tissue</strong> rich in reserve food. Commonly the PEN first undergoes successive nuclear divisions into <strong>free-nuclear endosperm</strong>, then walls form (<strong>cellular</strong>). Tender <strong>coconut water is free-nuclear endosperm</strong> (thousands of nuclei); the white kernel is cellular endosperm. Endosperm is fully consumed before maturation in <strong>pea, groundnut, beans</strong>, but persists in <strong>castor, coconut and cereals (wheat, rice, maize)</strong>.", "The <strong>embryo</strong> develops at the micropylar end: <strong>zygote → proembryo → globular → heart-shaped → mature</strong> (Fig. 1.13b). A dicot embryo has an <strong>embryonal axis + two cotyledons</strong>; axis above cotyledons = <strong>epicotyl</strong> (plumule/stem tip), below = <strong>hypocotyl</strong> (radicle/root tip + root cap). Grass (monocot) embryos have one lateral cotyledon, the <strong>scutellum</strong>; radicle + root cap sit in the <strong>coleorrhiza</strong> sheath, while epicotyl (shoot apex + leaf primordia) sits in the hollow <strong>coleoptile</strong>.", "The <strong>seed</strong> (fertilised ovule; inside fruits) holds seed coat(s), cotyledon(s) and embryo axis. <strong>Non-albuminous</strong> seeds keep no endosperm (pea, groundnut); <strong>albuminous</strong> seeds retain some (wheat, maize, barley, castor). <strong>Perisperm</strong> is persistent nucellus remnant (black pepper, beet). <strong>Integuments → tough testa</strong>; micropyle stays a pore for water/oxygen entry. Maturing seeds dry to <strong>10–15% moisture</strong>, metabolism slows, and the embryo may go <strong>dormant</strong> or germinate given moisture, oxygen and warmth. Viability spans months to centuries — <strong>Lupinus arcticus ~10,000 years</strong>, date palm ~2,000 years. Seeds free reproduction from water, disperse, feed seedlings, protect embryos and generate variation — the basis of agriculture and storage.", "As ovules → seeds, the <strong>ovary → fruit</strong> simultaneously; ovary wall → <strong>pericarp</strong> (fleshy: guava, orange, mango; dry: groundnut, mustard). <strong>True fruits</strong> come from the ovary alone; <strong>false fruits</strong> add thalamus tissue (<strong>apple, strawberry, cashew</strong>). Fruits from fertilisation are the rule, but <strong>parthenocarpic fruits develop without fertilisation</strong> (<strong>banana</strong>; inducible by growth hormones; seedless)."], "formulas": [{"label": "Endosperm order", "html": "PEN → free-nuclear divisions → cellularisation → consumed or persistent", "cond": "§1.4.1; coconut water/kernel"}, {"label": "Embryo stages", "html": "zygote → proembryo → globular → heart-shaped → mature", "cond": "§1.4.2; Fig. 1.13b"}, {"label": "Fate map", "html": "ovary → fruit (pericarp); ovule → seed; integuments → testa; nucellus remnant → perisperm", "cond": "§1.4.3"}], "deeper": "Exercise 12 reasoning: the zygote stays dormant for a while so that endosperm — its assured food supply — forms first. Seed–fruit number link (§1.4.3 question): ovule count bounds seed count. Orchid and Orobanche/Striga fruits pack thousands of tiny seeds; one tiny Ficus seed can raise a giant tree producing billions of seeds.", "worked": "Exercise 13 reasoning: (a) hypocotyl = axis below cotyledons ending in radicle; epicotyl = axis above cotyledons ending in plumule. (b) coleoptile = hollow sheath over epicotyl/shoot apex; coleorrhiza = undifferentiated sheath over radicle/root cap. (c) integument = ovule envelope; testa = hardened seed coat it becomes. (d) perisperm = persistent nucellus (seed, e.g. black pepper); pericarp = ovary wall turned fruit wall.", "prediction": {"prompt": "Tender coconut water is sweet and liquid with thousands of nuclei; the white kernel is solid. They are", "options": ["Free-nuclear endosperm (water) and cellular endosperm (kernel)", "Cellular endosperm (water) and perisperm (kernel)", "Nucellus and testa respectively"], "answer": 0, "explanation": "The book's own example: coconut water = free-nuclear stage, kernel = the later cellular endosperm."}, "connect": [["Coconut, mango, groundnut, mustard", "Split open castor, peas, beans, groundnut and coconut and look for endosperm (book activity): fleshy mango/guava/orange vs dry groundnut/mustard shows pericarp's two styles on the thali."], ["Wow — seeds that outlive civilisations", "An Arctic lupine seed germinated after ~10,000 years of dormancy; a 2,000-year-old date-palm seed from King Herod's palace did too — dehydration plus dormancy is time travel."]], "recall": "State the endosperm-first rule with the coconut example, the embryo stage sequence, dicot vs grass embryo parts, the four fate-map arrows, and true vs false vs parthenocarpic fruits.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The liquid coconut water from a tender coconut is", "options": ["Free-nuclear endosperm with thousands of nuclei", "Cellular endosperm", "Persistent perisperm"], "answer": 0, "hint": "Which stage has free nuclei before walls form?", "solution": "Successive nuclear divisions without walls give the free-nuclear liquid; the kernel is the cellular phase.", "wrong": ["The solid kernel — not the water — is cellular endosperm.", "Perisperm is residual nucellus (black pepper, beet), not coconut water."]}, {"level": "Medium", "type": "number", "map": "§1.4.3 drying", "prompt": "Upper bound of moisture content (by mass) of a mature dry seed", "answer": 15, "unit": "%", "tolerance": 1, "hint": "Mature seeds are relatively dry: 10–15%.", "solution": "About 10–15% moisture by mass; metabolism slows toward dormancy."}, {"level": "Hard", "type": "mcq", "prompt": "In a grass embryo, the hollow foliar sheath enclosing the shoot apex and leaf primordia is the", "options": ["Coleoptile", "Coleorrhiza", "Scutellum"], "answer": 0, "hint": "One sheath guards the shoot, one guards the root.", "solution": "Coleoptile covers the epicotyl/shoot; coleorrhiza covers radicle/root cap; scutellum is the single cotyledon.", "wrong": ["Coleorrhiza encloses the radicle and root cap, not the shoot.", "Scutellum is the cotyledon itself, not a sheath."]}], "resources": [{"title": "NCERT §1.4–1.4.3 — Endosperm, embryo, seed (official PDF, PDF p.18)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo101.pdf#page=18"}]}, {"id": "apomixis-polyembryony", "nav": "Apomixis & polyembryony", "title": "Apomixis and polyembryony: seeds without fertilisation, clones in orchards", "deck": "Some Asteraceae and grasses make seeds without fertilisation (apomixis) — fixing hybrid traits so farmers could reuse seed. Citrus and mango show polyembryony: nucellar embryos crowd one seed.", "minutes": 8, "section": "1.5", "pages": [22, 23], "print": "22–23", "sim": "apomixis", "simTitle": "Apomixis vs polyembryony comparator (grasses, Citrus, mango)", "quick": ["<strong>Apomixis</strong> (some Asteraceae and grasses) produces <strong>seeds without fertilisation</strong> — a form of <strong>asexual reproduction that mimics sexual reproduction</strong>. Routes vary: in some species a <strong>diploid egg forms without reduction division</strong> and develops into the embryo with no fertilisation.", "More often — as in many <strong>Citrus and mango</strong> varieties — some <strong>nucellar cells around the embryo sac divide, protrude into it and develop into embryos</strong>, so each ovule holds many embryos. <strong>More than one embryo per seed is polyembryony</strong>: squeeze orange seeds and count embryos of different sizes and shapes. Such apomictic embryos, arising from maternal tissue without fertilisation, are genetically uniform — <strong>clones</strong> of the parent.", "The <strong>hybrid-seed problem</strong>: hybrids raise productivity but their collected seeds <strong>segregate</strong> and lose hybrid characters, so costly hybrid seed must be produced <strong>every year</strong>. Apomictic hybrids would show <strong>no segregation</strong> — farmers could <strong>reuse hybrid seed year after year</strong> instead of buying it. Hence active worldwide research to understand apomixis genetics and <strong>transfer apomictic genes into hybrid varieties</strong>."], "formulas": [{"label": "Apomixis", "html": "seed formation without fertilisation (asexual mimic of sexual reproduction)", "cond": "§1.5; grasses, Asteraceae"}, {"label": "Polyembryony", "html": ">1 embryo per seed; e.g. nucellar embryos in Citrus, mango", "cond": "§1.5; orange-seed activity"}, {"label": "Hybrid-seed logic", "html": "apomictic hybrid → no segregation → reuse seed yearly", "cond": "§1.5 hybrid seed industry"}], "deeper": "Book questions (§1.5): fruit without fertilisation is parthenocarpy (contrast with apomixis = seed without fertilisation); apomictic embryos' genetic nature — clones, since they skip meiosis and fusion. Note the summary's placement: apomixis in grasses, polyembryony across angiosperms.", "worked": "Exercise 18 reasoning: apomixis = asexual seed formation mimicking sexual reproduction (diploid egg without reduction, or nucellar embryos as in Citrus/mango); importance = fixes hybrid vigour, ends yearly hybrid-seed purchase, cuts farmer cost — the hybrid seed industry's prize.", "prediction": {"prompt": "Orange seeds squeezed open show several embryos of different sizes in one seed. Their likely genetic nature is", "options": ["Maternal clones — nucellar apomictic embryos alongside the sexual one", "All genetically distinct sexual embryos from many fertilisations", "Triploid endosperm fragments, not embryos"], "answer": 0, "explanation": "Nucellar cells divide into embryos without fertilisation (polyembryony); lacking meiosis/fusion they are clones — the book asks exactly this."}, "connect": [["Mango stones and orange seeds in Indian orchards", "Cut open mango stones or squeeze orange pips and the extra nucellar embryos are visible — polyembryony already sitting in the fruit basket, and the reason some mango seedlings breed true."], ["Wow — hybrids you never rebuy", "If hybrid rice and vegetables turned apomictic, a farmer could replant harvested hybrid grain forever with no segregation — the costly yearly hybrid-seed treadmill would stop."]], "recall": "Define apomixis and polyembryony with examples, explain the clone question, and argue the hybrid-seed importance in three points.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Apomixis is the production of", "options": ["Seeds without fertilisation", "Fruits without fertilisation", "Embryo sacs without a megaspore"], "answer": 0, "hint": "Asexual reproduction mimicking sexual reproduction.", "solution": "Seeds without fertilisation (grasses, Asteraceae); fruit without fertilisation is parthenocarpy.", "wrong": ["That is parthenocarpy (e.g. banana), not apomixis.", "Apomictic seeds still use an embryo sac; the shortcut is at egg/embryo formation."]}, {"level": "Medium", "type": "mcq", "prompt": "Polyembryony via nucellar embryos is seen in", "options": ["Citrus and mango varieties", "Banana", "Pea and groundnut"], "answer": 0, "hint": "Squeeze orange seeds and count embryos.", "solution": "Nucellar cells protrude into the embryo sac and form extra embryos in Citrus and mango.", "wrong": ["Banana exemplifies parthenocarpy (seedless fruit), not polyembryony.", "Pea/groundnut exemplify endosperm consumed before maturation."]}, {"level": "Hard", "type": "mcq", "prompt": "Why does the hybrid seed industry want apomictic hybrids?", "options": ["No segregation in progeny — farmers can reuse hybrid seed yearly", "Apomixis doubles the chromosome number every generation", "Apomictic seeds need no storage or dormancy"], "answer": 0, "hint": "What goes wrong when hybrid seeds are resown?", "solution": "Resown hybrids segregate and lose hybrid characters; apomixis fixes them, ending yearly seed purchase.", "wrong": ["Apomixis skips reduction; it does not pile up chromosome sets.", "Seed storage biology (dehydration, dormancy) still applies to apomictic seeds."]}], "resources": [{"title": "NCERT §1.5 — Apomixis & polyembryony (official PDF, PDF p.22)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo101.pdf#page=22"}]}], "exercises": [{"number": 1, "conceptIdx": 0, "page": 24, "printPage": null, "question": "Name the parts of an angiosperm flower in which development of male and female gametophyte take place.", "steps": ["The male gametophyte (pollen grain) develops from the microspore inside the anther — the stamen of the androecium.", "The female gametophyte (embryo sac) develops from the functional megaspore inside the ovule in the ovary — the pistil of the gynoecium."], "answer": "Anther (stamen/androecium) for the male gametophyte; ovule in the ovary (pistil/gynoecium) for the female gametophyte."}, {"number": 2, "conceptIdx": 1, "page": 24, "printPage": null, "question": "Differentiate between microsporogenesis and megasporogenesis. Which type of cell division occurs during these events? Name the structures formed at the end of these two events.", "steps": ["Microsporogenesis: PMC in the microsporangium undergoes meiosis to form a microspore tetrad, maturing into pollen grains (male gametophytes).", "Megasporogenesis: MMC in the micropylar nucellus undergoes meiosis to form four megaspores, one functional, developing into the embryo sac (female gametophyte).", "Cell division: meiosis in both (followed by mitotic divisions during gametophyte development)."], "answer": "Meiosis in both; microsporogenesis ends in pollen grains, megasporogenesis ends in the embryo sac."}, {"number": 3, "conceptIdx": 1, "page": 24, "printPage": null, "question": "Arrange the following terms in the correct developmental sequence: Pollen grain, sporogenous tissue, microspore tetrad, pollen mother cell, male gametes.", "steps": ["Sporogenous tissue cells act as pollen mother cells.", "Each PMC undergoes meiosis to give a microspore tetrad.", "Microspores mature into pollen grains; the generative cell divides (before or after shedding) to give the two male gametes."], "answer": "Sporogenous tissue → pollen mother cell → microspore tetrad → pollen grain → male gametes (5 stages)."}, {"number": 4, "conceptIdx": 2, "page": 24, "printPage": null, "question": "With a neat, labelled diagram, describe the parts of a typical angiosperm ovule.", "steps": ["Stalk (funicle) attaching to the placenta; junction with the ovule body = hilum.", "One or two integuments (protective envelopes) leaving the micropyle at the tip; basal chalaza opposite it.", "Central nucellus (reserve-rich cells) enclosing the embryo sac (female gametophyte), generally one per ovule (Fig. 1.7d)."], "answer": "Funicle, hilum, integument(s), micropyle, chalaza, nucellus, embryo sac — see Fig. 1.7d."}, {"number": 5, "conceptIdx": 2, "page": 24, "printPage": null, "question": "What is meant by monosporic development of female gametophyte?", "steps": ["Of the four megaspores from MMC meiosis, only one is functional; the other three degenerate.", "That single megaspore's nucleus divides mitotically (free-nuclear: 2-, 4-, 8-nucleate) and walls then organise the 7-celled embryo sac."], "answer": "Embryo-sac formation from a single (one) functional megaspore — the majority pattern in flowering plants."}, {"number": 6, "conceptIdx": 2, "page": 24, "printPage": null, "question": "With a neat diagram explain the 7-celled, 8-nucleate nature of the female gametophyte.", "steps": ["After the 8-nucleate free-nuclear stage, walls enclose six nuclei into cells; the two polar nuclei share the large central cell.", "Micropylar egg apparatus: 2 synergids + 1 egg cell (3 cells, 3 nuclei). Chalazal: 3 antipodals (3 cells, 3 nuclei). Centre: 1 central cell with 2 polar nuclei.", "Total: 3 + 3 + 1 = 7 cells; 3 + 3 + 2 = 8 nuclei (Fig. 1.8b–c)."], "answer": "7 cells (egg apparatus 3 + antipodals 3 + central cell 1) holding 8 nuclei (central cell has 2)."}, {"number": 7, "conceptIdx": 3, "page": 25, "printPage": null, "question": "What are chasmogamous flowers? Can cross-pollination occur in cleistogamous flowers? Give reasons for your answer.", "steps": ["Chasmogamous flowers open like other species' flowers, with exposed anthers and stigma — cross-pollen can land.", "Cleistogamous flowers (<em>Viola</em>, <em>Oxalis</em>, <em>Commelina</em>) never open; anthers dehisce inside the bud with stigma close by.", "Since no foreign pollen can reach the stigma, cross-pollination cannot occur; they are invariably autogamous with assured seed-set."], "answer": "Chasmogamous = open, exposed; no — cleistogamous buds exclude all cross-pollen, so only autogamy is possible."}, {"number": 8, "conceptIdx": 3, "page": 25, "printPage": null, "question": "Mention two strategies evolved to prevent self-pollination in flowers.", "steps": ["Any two of: non-synchronised pollen release and stigma receptivity; spatial separation of anther and stigma; genetic self-incompatibility; unisexual flowers (monoecy/dioecy).", "Example pair: self-incompatibility (inhibits self-pollen germination/tube growth) and dioecy as in papaya (male and female flowers on different plants, blocking autogamy and geitonogamy)."], "answer": "E.g. self-incompatibility + unisexual (dioecious/monoecious) flowers; or dichogamy + herkogamy."}, {"number": 9, "conceptIdx": 3, "page": 25, "printPage": null, "question": "What is self-incompatibility? Why does self-pollination not lead to seed formation in self-incompatible species?", "steps": ["Self-incompatibility is a genetic mechanism preventing self-pollen (same flower or same plant) from fertilising ovules.", "It inhibits pollen germination on the stigma or pollen-tube growth in the style, so the male gametes never reach the embryo sac — no syngamy, no seed."], "answer": "Genetic block of self-pollen (no germination/tube growth) → no fertilisation → no seed."}, {"number": 10, "conceptIdx": 3, "page": 25, "printPage": null, "question": "What is bagging technique? How is it useful in a plant breeding programme?", "steps": ["Bagging = covering emasculated flowers (or unisexual female buds) with a butter-paper bag to block unwanted pollen.", "At stigma receptivity, desired male-parent pollen is dusted on and flowers are rebagged until fruit set.", "It guarantees only the chosen cross occurs — essential for artificial hybridisation."], "answer": "Butter-paper bags exclude contaminant pollen so breeders control exactly which pollen fertilises the flower."}, {"number": 11, "conceptIdx": 4, "page": 25, "printPage": null, "question": "What is triple fusion? Where and how does it take place? Name the nuclei involved in triple fusion.", "steps": ["Triple fusion = fusion of three haploid nuclei into the triploid primary endosperm nucleus (PEN).", "It takes place in the central cell of the embryo sac: the second male gamete released from the pollen tube fuses with the two polar nuclei.", "Nuclei: polar nucleus + polar nucleus + male gamete (all n) → PEN (3n)."], "answer": "Central-cell fusion of 2 polar nuclei + 1 male gamete → triploid PEN; with syngamy this is double fertilisation."}, {"number": 12, "conceptIdx": 5, "page": 25, "printPage": null, "question": "Why do you think the zygote is dormant for sometime in a fertilised ovule?", "steps": ["Endosperm development precedes embryo development.", "The zygote waits until a certain amount of triploid endosperm has formed — an adaptation providing assured nutrition to the developing embryo."], "answer": "Dormancy lets the nutritive endosperm form first, so the embryo is never starved."}, {"number": 13, "conceptIdx": 5, "page": 25, "printPage": null, "question": "Differentiate between: (a) hypocotyl and epicotyl; (b) coleoptile and coleorrhiza; (c) integument and testa; (d) perisperm and pericarp.", "steps": ["(a) Hypocotyl = embryonal axis below cotyledons, ending in radicle; epicotyl = axis above cotyledons, ending in plumule.", "(b) Coleoptile = hollow sheath enclosing epicotyl/shoot apex (grass); coleorrhiza = undifferentiated sheath enclosing radicle/root cap.", "(c) Integument = protective envelope of the ovule; testa = tough seed coat it hardens into.", "(d) Perisperm = persistent nucellus remnant in the seed (black pepper, beet); pericarp = ovary wall developed into the fruit wall."], "answer": "Axis below/above cotyledons; shoot/root sheaths; ovule coat/seed coat; seed nucellus-remnant/fruit wall."}, {"number": 14, "conceptIdx": 5, "page": 25, "printPage": null, "question": "Why is apple called a false fruit? Which part(s) of the flower forms the fruit?", "steps": ["Most fruits develop only from the ovary (true fruits); in apple (also strawberry, cashew) the thalamus also contributes to fruit formation.", "Such thalamus-assisted fruits are called false fruits.", "Parts: ovary (with thalamus contribution)."], "answer": "False fruit because the thalamus joins the ovary in forming it."}, {"number": 15, "conceptIdx": 3, "page": 25, "printPage": null, "question": "What is meant by emasculation? When and why does a plant breeder employ this technique?", "steps": ["Emasculation = removal of anthers (with forceps) from the bisexual flower bud before the anther dehisces.", "Used when the female parent bears bisexual flowers, before any self-pollen is shed.", "Why: to prevent self-pollination/contamination so only desired male-parent pollen (dusted later under bagging) effects fertilisation."], "answer": "Pre-dehiscence anther removal in bisexual buds to enforce a chosen cross."}, {"number": 16, "conceptIdx": 5, "page": 25, "printPage": null, "question": "If one can induce parthenocarpy through the application of growth substances, which fruits would you select to induce parthenocarpy and why?", "steps": ["Parthenocarpic fruits develop without fertilisation and are seedless (banana is the book's example).", "Select fleshy fruits where seeds are undesirable — eaten fresh or processed — so seedlessness raises edible/commercial value.", "Growth-hormone application then yields seedless fruits without pollination/fertilisation dependence."], "answer": "Fleshy edible fruits (banana-type): seedlessness improves eating quality and commercial value."}, {"number": 17, "conceptIdx": 1, "page": 25, "printPage": null, "question": "Explain the role of tapetum in the formation of pollen-grain wall.", "steps": ["Tapetum is the innermost microsporangium wall layer with dense cytoplasm (often multinucleate); it nourishes the developing pollen grains.", "The pollen wall's outer exine is made of sporopollenin — laid down with tapetal contribution around the developing grains — with germ pores left where sporopollenin is absent.", "The inner intine (cellulose, pectin) completes the two-layered wall."], "answer": "Tapetum feeds developing pollen and contributes the sporopollenin exine (with germ pores) over the intine."}, {"number": 18, "conceptIdx": 6, "page": 25, "printPage": null, "question": "What is apomixis and what is its importance?", "steps": ["Apomixis = seed production without fertilisation (some Asteraceae, grasses) — asexual reproduction mimicking sexual reproduction; e.g. diploid egg without reduction, or nucellar embryos as in Citrus/mango.", "Hybrid seeds segregate when resown, so costly hybrid seed must be bought yearly.", "Apomictic hybrids show no segregation: farmers could reuse hybrid seed year after year — hence global research to transfer apomictic genes into hybrids."], "answer": "Seed without fertilisation; fixes hybrid vigour, ends yearly hybrid-seed purchase, cuts farmer cost."}], "pageOffset": null, "printPageStart": null, "printPageEnd": null, "paginationProvenance": "folio-absent-in-source"};
