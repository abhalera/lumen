 log y = 2log(x+3) + 3log(x+4) + 4log(x+5); y′ = y[2/(x+3) + 3/(x+4) + 4/(x+5)].", "Q6: u = (x+1/x)ˣ gives u′ = u[log(x+1/x) + (x²–1)/(x²+1)]; v = x^(1+1/x) gives v′ = v(x + 1 – log x)/x².", "Answer is the sum of the two derivatives."], "answer": "Q5: y[2/(x+3) + 3/(x+4) + 4/(x+5)]. Q6: (x+1/x)ˣ[log(x+1/x) + (x²–1)/(x²+1)] + x^(1+1/x)(x + 1 – log x)/x²."}, {"number": "5.5.7", "exercise": "5.5", "question": "(log x)ˣ + x^(log x) — differentiate w.r.t. x.", "page": 31, "endPage": 31, "title": "NCERT Exercise 5.5 · Question 7", "conceptIdx": 4, "steps": ["u = (log x)ˣ: u′ = u[log(log x) + 1/log x]. v = x^(log x): log v = (log x)² so v′ = v·2log x/x.", "Add: dy/dx = (log x)ˣ[log(log x) + 1/log x] + x^(log x)·2log x/x."], "answer": "dy/dx = (log x)ˣ[log(log x) + 1/log x] + 2x^(log x – 1)·log x."}, {"number": "5.5.8", "exercise": "5.5", "question": "(sin x)ˣ + sin⁻¹√x 9. x^(sin x) + (sin x)^(cos x) — differentiate w.r.t. x.", "page": 31, "endPage": 31, "title": "NCERT Exercise 5.5 · Question 8", "conceptIdx": 4, "steps": ["Q8: u = (sin x)ˣ gives u′ = u[x cot x + log sin x]; d/dx sin⁻¹√x = 1/(2√(x–x²)).", "Q9: u = x^(sin x) gives u′ = u[cos x·log x + sin x/x]; v = (sin x)^(cos x) gives v′ = v[–sin x·log sin x + cos²x/sin x]."], "answer": "Q8: (sin x)ˣ[x cot x + log sin x] + 1/(2√(x–x²)). Q9: x^(sin x)[cos x·log x + sin x/x] + (sin x)^(cos x)[cos²x/sin x – sin x·log sin x]."}, {"number": "5.5.9", "exercise": "5.5", "question": "x^(sin x) + (sin x)^(cos x) 10. x^(x cos x) + (x² + 1)/(x² – 1) — differentiate w.r.t. x.", "page": 31, "endPage": 31, "title": "NCERT Exercise 5.5 · Question 9", "conceptIdx": 4, "steps": ["Q9: as above: u′ = u[cos x·log x + sin x/x], v′ = v[cos²x/sin x – sin x·log sin x].", "Q10: u = x^(x cos x) gives u′ = u[(cos x – x sin x)log x + cos x]; quotient gives –4x/(x²–1)².", "Add the two parts in each question."], "answer": "Q9: x^(sin x)[cos x·log x + sin x/x] + (sin x)^(cos x)[cos²x/sin x – sin x·log sin x]. Q10: x^(x cos x)[(cos x – x sin x)log x + cos x] – 4x/(x²–1)²."}, {"number": "5.5.11", "exercise": "5.5", "question": "(x cos x)ˣ + (x sin x)^(1/x) — find dy/dx. (Header for the next group: find dy/dx of the functions given in Exercises 12 to 15.)", "page": 31, "endPage": 31, "title": "NCERT Exercise 5.5 · Question 11", "conceptIdx": 4, "steps": ["u = (x cos x)ˣ: u′/u = log(x cos x) + 1 – x tan x.", "v = (x sin x)^(1/x): log v = log(x sin x)/x, so v′/v = [(1 + x cot x) – log(x sin x)]/x².", "dy/dx = u[log(x cos x) + 1 – x tan x] + v[(1 + x cot x – log(x sin x))/x²]."], "answer": "dy/dx = (x cos x)ˣ[log(x cos x) + 1 – x tan x] + (x sin x)^(1/x)[1 + x cot x – log(x sin x)]/x²."}, {"number": "5.5.12", "exercise": "5.5", "question": "xʸ + yˣ = 1 — find dy/dx.", "page": 31, "endPage": 31, "title": "NCERT Exercise 5.5 · Question 12", "conceptIdx": 4, "steps": ["Differentiate: xʸ(y/x + y′log x) + yˣ(x·y′/y + log y) = 0.", "Solve: dy/dx = –(y·x^(y–1) + yˣ log y)/(xʸ log x + x·y^(x–1))."], "answer": "dy/dx = –(y·x^(y–1) + yˣ·log y)/(xʸ·log x + x·y^(x–1))."}, {"number": "5.5.13", "exercise": "5.5", "question": "yˣ = xʸ — find dy/dx.", "page": 31, "endPage": 31, "title": "NCERT Exercise 5.5 · Question 13", "conceptIdx": 4, "steps": ["Take logs: x log y = y log x; differentiate: log y + x·y′/y = y′·log x + y/x.", "Solve: dy/dx = y²(1 – log x)/(x²(1 – log y))."], "answer": "dy/dx = y²(1 – log x)/(x²(1 – log y))."}, {"number": "5.5.14", "exercise": "5.5", "question": "(cos x)ʸ = (cos y)ˣ — find dy/dx.", "page": 31, "endPage": 31, "title": "NCERT Exercise 5.5 · Question 14", "conceptIdx": 4, "steps": ["Take logs: y log cos x = x log cos y; differentiate: y′log cos x – y tan x = log cos y – x tan y·y′.", "Solve: dy/dx = (log cos y + y tan x)/(log cos x + x tan y)."], "answer": "dy/dx = (log cos y + y tan x)/(log cos x + x tan y)."}, {"number": "5.5.15", "exercise": "5.5", "question": "xy = e^(x – y) — find dy/dx.", "page": 31, "endPage": 31, "title": "NCERT Exercise 5.5 · Question 15", "conceptIdx": 4, "steps": ["Take logs: log x + log y = x – y; differentiate: 1/x + y′/y = 1 – y′.", "Solve: dy/dx = y(x – 1)/(x(y + 1))."], "answer": "dy/dx = y(x – 1)/(x(y + 1))."}, {"number": "5.5.16", "exercise": "5.5", "question": "Find the derivative of the function given by f(x) = (1 + x)(1 + x²)(1 + x⁴)(1 + x⁸) and hence find f′(1).", "page": 31, "endPage": 31, "title": "NCERT Exercise 5.5 · Question 16", "conceptIdx": 4, "steps": ["log f = Σ log(1 + x^(2^k)); f′/f = 1/(1+x) + 2x/(1+x²) + 4x³/(1+x⁴) + 8x⁷/(1+x⁸).", "f(1) = 16 and f′/f at 1 = 1/2 + 1 + 2 + 4 = 15/2, so f′(1) = 120."], "answer": "f′(x) = f(x)[1/(1+x) + 2x/(1+x²) + 4x³/(1+x⁴) + 8x⁷/(1+x⁸)]; f′(1) = 120."}, {"number": "5.5.17", "exercise": "5.5", "question": "Differentiate (x² – 5x + 8)(x³ + 7x + 9) in three ways mentioned below: (i) by using product rule (ii) by expanding the product to obtain a single polynomial. (iii) by logarithmic differentiation. Do they all give the same answer?", "page": 31, "endPage": 31, "title": "NCERT Exercise 5.5 · Question 17", "conceptIdx": 4, "steps": ["(i) Product rule: (2x–5)(x³+7x+9) + (x²–5x+8)(3x²+7). (ii) Expand: x⁵–5x⁴+15x³–26x²+11x+72, differentiate termwise.", "(iii) log y = log(x²–5x+8) + log(x³+7x+9); y′ = y[(2x–5)/(x²–5x+8) + (3x²+7)/(x³+7x+9)].", "All three simplify to 5x⁴ – 20x³ + 45x² – 52x + 11. Yes, all give the same answer."], "answer": "Yes — all three give 5x⁴ – 20x³ + 45x² – 52x + 11."}, {"number": "5.5.18", "exercise": "5.5", "question": "If u, v and w are functions of x, then show that d/dx(u·v·w) = du/dx·v·w + u·dv/dx·w + u·v·dw/dx in two ways — first by repeated application of product rule, second by logarithmic differentiation.", "page": 31, "endPage": 31, "title": "NCERT Exercise 5.5 · Question 18", "conceptIdx": 4, "steps": ["Way 1: treat uv as one factor: d/dx[(uv)w] = (uv)′w + (uv)w′ = (u′v + uv′)w + uvw′.", "Way 2: log z = log u + log v + log w gives z′/z = u′/u + v′/v + w′/w; multiply by z = uvw.", "Both give d/dx(uvw) = u′vw + uv′w + uvw′."], "answer": "d/dx(u·v·w) = u′vw + uv′w + uvw′ proved both ways."}, {"number": "5.6.1", "exercise": "5.6", "question": "x = 2at², y = at⁴ — find dy/dx without eliminating the parameter.", "page": 34, "endPage": 34, "title": "NCERT Exercise 5.6 · Question 1", "conceptIdx": 5, "steps": ["dx/dt = 4at and dy/dt = 4at³.", "dy/dx = (dy/dt)/(dx/dt) = t² = x/(2a)."], "answer": "dy/dx = t² ( = x/(2a))."}, {"number": "5.6.2", "exercise": "5.6", "question": "x = a cos θ, y = b cos θ 4. x = 4t, y = 4/t — find dy/dx without eliminating the parameter.", "page": 34, "endPage": 34, "title": "NCERT Exercise 5.6 · Question 2", "conceptIdx": 5, "steps": ["Q2: dx/dθ = –a sin θ, dy/dθ = –b sin θ, so dy/dx = b/a. Q4: dx/dt = 4, dy/dt = –4/t², so dy/dx = –1/t² = –16/x².", "Both follow from dy/dx = (dy/dt)/(dx/dt)."], "answer": "Q2: b/a. Q4: –1/t² ( = –16/x²)."}, {"number": "5.6.3", "exercise": "5.6", "question": "x = sin t, y = cos 2t 4. x = 4t, y = 4/t — find dy/dx without eliminating the parameter.", "page": 34, "endPage": 34, "title": "NCERT Exercise 5.6 · Question 3", "conceptIdx": 5, "steps": ["Q3: dx/dt = cos t, dy/dt = –2 sin 2t = –4 sin t cos t, so dy/dx = –4 sin t = –4x.", "Q4: dy/dx = –1/t² = –16/x²."], "answer": "Q3: –4 sin t ( = –4x). Q4: –1/t² ( = –16/x²)."}, {"number": "5.6.5", "exercise": "5.6", "question": "x = cos θ – cos 2θ, y = sin θ – sin 2θ 6. x = a(θ – sin θ), y = a(1 + cos θ) 7. x = sin³t/√(cos 2t), y = cos³t/√(cos 2t) 8. x = a(cos t + log tan(t/2)), y = a sin t 9. x = a sec θ, y = b tan θ — find dy/dx without eliminating the parameter.", "page": 34, "endPage": 34, "title": "NCERT Exercise 5.6 · Question 5", "conceptIdx": 5, "steps": ["Q5: dx/dθ = 2sin 2θ – sin θ, dy/dθ = cos θ – 2cos 2θ; ratio as below. Q6: dx/dθ = a(1–cos θ), dy/dθ = –a sin θ, so dy/dx = –cot(θ/2).", "Q7: logarithmic differentiation of each w.r.t. t gives dy/dx = –cot 3t. Q8: dx/dt = a cos²t/sin t, dy/dt = a cos t, so dy/dx = tan t. Q9: dx/dθ = a sec θ tan θ, dy/dθ = b sec²θ, so dy/dx = (b/a)cosec θ."], "answer": "Q5: (cos θ – 2cos 2θ)/(2sin 2θ – sin θ). Q6: –cot(θ/2). Q7: –cot 3t. Q8: tan t. Q9: (b/a)cosec θ."}, {"number": "5.6.8", "exercise": "5.6", "question": "x = a(cos t + log tan(t/2)), y = a sin t 9. x = a sec θ, y = b tan θ — find dy/dx without eliminating the parameter.", "page": 34, "endPage": 34, "title": "NCERT Exercise 5.6 · Question 8", "conceptIdx": 5, "steps": ["Q8: d/dt log tan(t/2) = 1/sin t, so dx/dt = a(–sin t + 1/sin t) = a cos²t/sin t; dy/dt = a cos t.", "Hence Q8: dy/dx = tan t. Q9: dy/dx = b sec²θ/(a sec θ tan θ) = (b/a)cosec θ."], "answer": "Q8: tan t. Q9: (b/a)cosec θ."}, {"number": "5.6.10", "exercise": "5.6", "question": "x = a(cos θ + θ sin θ), y = a(sin θ – θ cos θ) 11. If x = √(a^(sin⁻¹t)), y = √(a^(cos⁻¹t)), show that dy/dx = –y/x.", "page": 34, "endPage": 34, "title": "NCERT Exercise 5.6 · Question 10", "conceptIdx": 5, "steps": ["Q10: dx/dθ = aθ cos θ, dy/dθ = aθ sin θ, so dy/dx = tan θ.", "Q11: log x = ½ sin⁻¹t·log a gives x′/x = (log a)/(2√(1–t²)); log y = ½ cos⁻¹t·log a gives y′/y = –(log a)/(2√(1–t²)).", "Hence dy/dx = (y′/y)/(x′/x)·(y/x) = –y/x."], "answer": "Q10: tan θ. Q11: dy/dx = –y/x."}, {"number": "5.7.1", "exercise": "5.7", "question": "x² + 3x + 2 2. x²⁰ — find the second order derivatives.", "page": 36, "endPage": 36, "title": "NCERT Exercise 5.7 · Question 1", "conceptIdx": 6, "steps": ["Q1: y′ = 2x + 3, so y″ = 2. Q2: y′ = 20x¹⁹, so y″ = 380x¹⁸.", "Differentiate twice termwise."], "answer": "Q1: 2. Q2: 380x¹⁸."}, {"number": "5.7.3", "exercise": "5.7", "question": "x · cos x — find the second order derivative.", "page": 36, "endPage": 36, "title": "NCERT Exercise 5.7 · Question 3", "conceptIdx": 6, "steps": ["y′ = cos x – x sin x.", "y″ = –sin x – (sin x + x cos x) = –2 sin x – x cos x."], "answer": "d²y/dx² = –2 sin x – x cos x."}, {"number": "5.7.4", "exercise": "5.7", "question": "log x — find the second order derivative.", "page": 36, "endPage": 36, "title": "NCERT Exercise 5.7 · Question 4", "conceptIdx": 6, "steps": ["y′ = 1/x.", "y″ = –1/x²."], "answer": "d²y/dx² = –1/x²."}, {"number": "5.7.5", "exercise": "5.7", "question": "x³ log x — find the second order derivative.", "page": 36, "endPage": 36, "title": "NCERT Exercise 5.7 · Question 5", "conceptIdx": 6, "steps": ["y′ = 3x² log x + x².", "y″ = 6x log x + 3x + 2x = x(6 log x + 5)."], "answer": "d²y/dx² = 6x log x + 5x."}, {"number": "5.7.6", "exercise": "5.7", "question": "eˣ sin 5x — find the second order derivative.", "page": 36, "endPage": 36, "title": "NCERT Exercise 5.7 · Question 6", "conceptIdx": 6, "steps": ["y′ = eˣ sin 5x + 5eˣ cos 5x.", "y″ = eˣ(10 cos 5x – 24 sin 5x) = 2eˣ(5 cos 5x – 12 sin 5x)."], "answer": "d²y/dx² = eˣ(10 cos 5x – 24 sin 5x)."}, {"number": "5.7.7", "exercise": "5.7", "question": "e^(6x) cos 3x — find the second order derivative.", "page": 36, "endPage": 36, "title": "NCERT Exercise 5.7 · Question 7", "conceptIdx": 6, "steps": ["y′ = 6e^(6x)cos 3x – 3e^(6x)sin 3x.", "y″ = 36e^(6x)cos 3x – 36e^(6x)sin 3x – 9e^(6x)cos 3x = 9e^(6x)(3 cos 3x – 4 sin 3x)."], "answer": "d²y/dx² = 9e^(6x)(3 cos 3x – 4 sin 3x)."}, {"number": "5.7.8", "exercise": "5.7", "question": "tan⁻¹ x — find the second order derivative.", "page": 36, "endPage": 36, "title": "NCERT Exercise 5.7 · Question 8", "conceptIdx": 6, "steps": ["y′ = 1/(1 + x²).", "y″ = –2x/(1 + x²)²."], "answer": "d²y/dx² = –2x/(1 + x²)²."}, {"number": "5.7.9", "exercise": "5.7", "question": "log (log x) — find the second order derivative.", "page": 36, "endPage": 36, "title": "NCERT Exercise 5.7 · Question 9", "conceptIdx": 6, "steps": ["y′ = 1/(x log x).", "y″ = –(1 + log x)/(x log x)²."], "answer": "d²y/dx² = –(1 + log x)/(x log x)²."}, {"number": "5.7.10", "exercise": "5.7", "question": "sin (log x) — find the second order derivative.", "page": 36, "endPage": 36, "title": "NCERT Exercise 5.7 · Question 10", "conceptIdx": 6, "steps": ["y′ = cos(log x)/x.", "y″ = –(sin(log x) + cos(log x))/x²."], "answer": "d²y/dx² = –(sin(log x) + cos(log x))/x²."}, {"number": "5.7.11", "exercise": "5.7", "question": "If y = 5 cos x – 3 sin x, prove that d²y/dx² + y = 0.", "page": 36, "endPage": 36, "title": "NCERT Exercise 5.7 · Question 11", "conceptIdx": 6, "steps": ["y′ = –5 sin x – 3 cos x.", "y″ = –5 cos x + 3 sin x = –y, so d²y/dx² + y = 0."], "answer": "d²y/dx² + y = 0 proved."}, {"number": "5.7.12", "exercise": "5.7", "question": "If y = cos⁻¹ x, find, in terms of y alone, d²y/dx².", "page": 37, "endPage": 37, "title": "NCERT Exercise 5.7 · Question 12", "conceptIdx": 6, "steps": ["y₁ = –1/√(1–x²), so y₂ = –x/(1–x²)^(3/2).", "With x = cos y: y₂ = –cos y/sin³y = –cot y·cosec²y."], "answer": "d²y/dx² = –cot y·cosec²y."}, {"number": "5.7.13", "exercise": "5.7", "question": "If y = 3 cos(log x) + 4 sin(log x), show that x²y₂ + xy₁ + y = 0 14. If y = Ae^(mx) + Be^(nx), show that d²y/dx² – (m+n)dy/dx + mny = 0.", "page": 37, "endPage": 37, "title": "NCERT Exercise 5.7 · Question 13", "conceptIdx": 6, "steps": ["Q13: xy₁ = –3 sin(log x) + 4 cos(log x); differentiating again and simplifying gives x²y₂ + xy₁ + y = 0.", "Q14: y₁ = mAe^(mx) + nBe^(nx), y₂ = m²Ae^(mx) + n²Be^(nx); then y₂ – (m+n)y₁ + mny = 0 since m²–m(m+n)+mn = 0 (and likewise for n)."], "answer": "Q13: x²y₂ + xy₁ + y = 0. Q14: d²y/dx² – (m+n)dy/dx + mny = 0."}, {"number": "5.7.14", "exercise": "5.7", "question": "If y = Ae^(mx) + Be^(nx), show that d²y/dx² – (m + n)dy/dx + mny = 0.", "page": 37, "endPage": 37, "title": "NCERT Exercise 5.7 · Question 14", "conceptIdx": 6, "steps": ["y₁ = mAe^(mx) + nBe^(nx); y₂ = m²Ae^(mx) + n²Be^(nx).", "y₂ – (m+n)y₁ + mny = [m²–m(m+n)+mn]Ae^(mx) + [n²–n(m+n)+mn]Be^(nx) = 0."], "answer": "d²y/dx² – (m+n)dy/dx + mny = 0 proved."}, {"number": "5.7.15", "exercise": "5.7", "question": "If y = 500e^(7x) + 600e^(–7x), show that d²y/dx² = 49y.", "page": 37, "endPage": 37, "title": "NCERT Exercise 5.7 · Question 15", "conceptIdx": 6, "steps": ["y₁ = 3500e^(7x) – 4200e^(–7x).", "y₂ = 24500e^(7x) + 29400e^(–7x) = 49(500e^(7x) + 600e^(–7x)) = 49y."], "answer": "d²y/dx² = 49y proved."}, {"number": "5.7.16", "exercise": "5.7", "question": "If eʸ(x + 1) = 1, show that d²y/dx² = (dy/dx)².", "page": 37, "endPage": 37, "title": "NCERT Exercise 5.7 · Question 16", "conceptIdx": 6, "steps": ["eʸ = 1/(x+1), so y = –log(x+1) and y₁ = –1/(x+1).", "y₂ = 1/(x+1)² = y₁²."], "answer": "d²y/dx² = (dy/dx)² proved."}, {"number": "5.7.17", "exercise": "5.7", "question": "If y = (tan⁻¹x)², show that (x² + 1)²y₂ + 2x(x² + 1)y₁ = 2.", "page": 37, "endPage": 37, "title": "NCERT Exercise 5.7 · Question 17", "conceptIdx": 6, "steps": ["y₁ = 2tan⁻¹x/(1+x²), so (1+x²)y₁ = 2tan⁻¹x.", "Differentiate: 2xy₁ + (1+x²)y₂ = 2/(1+x²); multiply by (1+x²) to get (x²+1)²y₂ + 2x(x²+1)y₁ = 2."], "answer": "(x²+1)²y₂ + 2x(x²+1)y₁ = 2 proved."}, {"number": "Misc.1", "exercise": "Misc", "question": "(3x² – 9x + 5)⁹ — differentiate w.r.t. x.", "page": 41, "endPage": 41, "title": "NCERT Exercise Misc · Question 1", "conceptIdx": 0, "steps": ["Chain rule: 9(3x²–9x+5)⁸ times d/dx(3x²–9x+5) = 6x–9.", "Hence dy/dx = 9(6x–9)(3x²–9x+5)⁸ = 27(2x–3)(3x²–9x+5)⁸."], "answer": "dy/dx = 27(2x–3)(3x²–9x+5)⁸."}, {"number": "Misc.2", "exercise": "Misc", "question": "sin³ x + cos⁶ x — differentiate w.r.t. x.", "page": 41, "endPage": 41, "title": "NCERT Exercise Misc · Question 2", "conceptIdx": 0, "steps": ["d/dx sin³x = 3sin²x cos x; d/dx cos⁶x = –6cos⁵x sin x.", "Hence dy/dx = 3 sin x cos x(sin x – 2cos⁴x)."], "answer": "dy/dx = 3sin²x cos x – 6cos⁵x sin x."}, {"number": "Misc.3", "exercise": "Misc", "question": "(5x)^(3 cos 2x) — differentiate w.r.t. x.", "page": 41, "endPage": 41, "title": "NCERT Exercise Misc · Question 3", "conceptIdx": 0, "steps": ["log y = 3cos 2x·log(5x); y′/y = –6 sin 2x·log(5x) + 3cos 2x/x.", "Hence dy/dx = (5x)^(3cos 2x)[3cos 2x/x – 6 sin 2x·log(5x)]."], "answer": "dy/dx = (5x)^(3cos 2x)[3cos 2x/x – 6 sin 2x·log(5x)]."}, {"number": "Misc.4", "exercise": "Misc", "question": "sin⁻¹(x√x), 0 ≤ x ≤ 1 — differentiate w.r.t. x.", "page": 41, "endPage": 41, "title": "NCERT Exercise Misc · Question 4", "conceptIdx": 0, "steps": ["Write x√x = x^(3/2); d/dx = (3√x)/2.", "dy/dx = (3√x/2)/√(1–x³) = 3√x/(2√(1–x³))."], "answer": "dy/dx = 3√x/(2√(1–x³))."}, {"number": "Misc.5", "exercise": "Misc", "question": "cos⁻¹(x/2)/√(2x + 7), –2 < x < 2 — differentiate w.r.t. x.", "page": 41, "endPage": 41, "title": "NCERT Exercise Misc · Question 5", "conceptIdx": 0, "steps": ["d/dx cos⁻¹(x/2) = –1/√(4–x²); quotient rule with 1/√(2x+7).", "dy/dx = [–√(2x+7)/√(4–x²) – cos⁻¹(x/2)/√(2x+7)]/(2x+7)."], "answer": "dy/dx = –[1/√(4–x²) + cos⁻¹(x/2)/(2x+7)]/√(2x+7)."}, {"number": "Misc.6", "exercise": "Misc", "question": "cot⁻¹[(√(1+sin x) + √(1–sin x))/(√(1+sin x) – √(1–sin x))], 0 < x < π/2 — differentiate w.r.t. x.", "page": 41, "endPage": 41, "title": "NCERT Exercise Misc · Question 6", "conceptIdx": 0, "steps": ["For 0 < x < π/2: √(1+sin x) = cos(x/2)+sin(x/2), √(1–sin x) = cos(x/2)–sin(x/2).", "Ratio = cot(x/2), so y = cot⁻¹(cot(x/2)) = x/2 and dy/dx = 1/2."], "answer": "dy/dx = 1/2."}, {"number": "Misc.7", "exercise": "Misc", "question": "(log x)^(log x), x > 1 — differentiate w.r.t. x.", "page": 41, "endPage": 41, "title": "NCERT Exercise Misc · Question 7", "conceptIdx": 0, "steps": ["log y = log x·log(log x); y′/y = (1 + log(log x))/x.", "Hence dy/dx = (log x)^(log x)·(1 + log(log x))/x."], "answer": "dy/dx = (log x)^(log x)(1 + log(log x))/x."}, {"number": "Misc.8", "exercise": "Misc", "question": "cos (a cos x + b sin x), for some constant a and b — differentiate w.r.t. x.", "page": 41, "endPage": 41, "title": "NCERT Exercise Misc · Question 8", "conceptIdx": 0, "steps": ["d/dx(a cos x + b sin x) = –a sin x + b cos x.", "Hence dy/dx = (a sin x – b cos x)·sin(a cos x + b sin x)."], "answer": "dy/dx = (a sin x – b cos x) sin(a cos x + b sin x)."}, {"number": "Misc.9", "exercise": "Misc", "question": "(sin x – cos x)^(sin x – cos x), π/4 < x < 3π/4 — differentiate w.r.t. x.", "page": 41, "endPage": 41, "title": "NCERT Exercise Misc · Question 9", "conceptIdx": 0, "steps": ["log y = (sin x–cos x)log(sin x–cos x); y′/y = (cos x+sin x)[1 + log(sin x–cos x)].", "Hence dy/dx = y(cos x + sin x)[1 + log(sin x – cos x)]."], "answer": "dy/dx = (sin x – cos x)^(sin x – cos x)(sin x + cos x)[1 + log(sin x – cos x)]."}, {"number": "Misc.10", "exercise": "Misc", "question": "xˣ + xᵃ + aˣ + aᵃ, for some fixed a > 0 and x > 0 11. x^(x²–3) + (x–3)^(x²), for x > 3 — differentiate w.r.t. x.", "page": 41, "endPage": 41, "title": "NCERT Exercise Misc · Question 10", "conceptIdx": 0, "steps": ["Q10: d/dx xˣ = xˣ(1+log x); d/dx xᵃ = ax^(a–1); d/dx aˣ = aˣ log a; aᵃ is constant.", "Q11: u = x^(x²–3) gives u′ = u[(x²–3)/x + 2x log x]; v = (x–3)^(x²) gives v′ = v[2x log(x–3) + x²/(x–3)]."], "answer": "Q10: xˣ(1+log x) + ax^(a–1) + aˣ log a. Q11: x^(x²–3)[(x²–3)/x + 2x log x] + (x–3)^(x²)[2x log(x–3) + x²/(x–3)]."}, {"number": "Misc.12", "exercise": "Misc", "question": "Find dy/dx, if y = 12(1 – cos t), x = 10(t – sin t), –π/2 < t < π/2.", "page": 42, "endPage": 42, "title": "NCERT Exercise Misc · Question 12", "conceptIdx": 0, "steps": ["dy/dt = 12 sin t and dx/dt = 10(1 – cos t).", "dy/dx = 12 sin t/(10(1–cos t)) = (6/5)cot(t/2) using half-angle identities."], "answer": "dy/dx = (6/5)cot(t/2)."}, {"number": "Misc.13", "exercise": "Misc", "question": "Find dy/dx, if y = sin⁻¹x + sin⁻¹√(1–x²), 0 < x < 1 14. If x√(1+y) + y√(1+x) = 0, for –1 < x < 1, prove that dy/dx = –1/(1+x)².", "page": 42, "endPage": 42, "title": "NCERT Exercise Misc · Question 13", "conceptIdx": 0, "steps": ["Q13: y′ = 1/√(1–x²) + (1/x)(–x/√(1–x²)) = 0.", "Q14: squaring x√(1+y) = –y√(1+x) gives (x–y)(x+y+xy) = 0; with x ≠ y, y = –x/(1+x), so y′ = –1/(1+x)²."], "answer": "Q13: dy/dx = 0. Q14: dy/dx = –1/(1+x)² proved."}, {"number": "Misc.15", "exercise": "Misc", "question": "If (x – a)² + (y – b)² = c², for some c > 0, prove that [1 + (dy/dx)²]^(3/2)/(d²y/dx²) is a constant independent of a and b.", "page": 42, "endPage": 42, "title": "NCERT Exercise Misc · Question 15", "conceptIdx": 0, "steps": ["Differentiate: (x–a) + (y–b)y₁ = 0; again: 1 + y₁² + (y–b)y₂ = 0, so (y–b) = –(1+y₁²)/y₂ and (x–a) = y₁(1+y₁²)/y₂.", "Substitute in the circle: (1+y₁²)³/y₂² = c², so [1+(dy/dx)²]^(3/2)/(d²y/dx²) = ±c, independent of a and b."], "answer": "[1+(dy/dx)²]^(3/2)/(d²y/dx²) = ±c, a constant independent of a and b."}, {"number": "Misc.16", "exercise": "Misc", "question": "If cos y = x cos(a + y), with cos a ≠ ±1, prove that dy/dx = cos²(a + y)/sin a.", "page": 42, "endPage": 42, "title": "NCERT Exercise Misc · Question 16", "conceptIdx": 0, "steps": ["Differentiate: –sin y·y′ = cos(a+y) – x sin(a+y)·y′, so y′ = cos(a+y)/(x sin(a+y) – sin y).", "Using x = cos y/cos(a+y), the denominator is sin a/cos(a+y); hence y′ = cos²(a+y)/sin a."], "answer": "dy/dx = cos²(a+y)/sin a proved."}, {"number": "Misc.17", "exercise": "Misc", "question": "If x = a(cos t + t sin t) and y = a(sin t – t cos t), find d²y/dx².", "page": 42, "endPage": 42, "title": "NCERT Exercise Misc · Question 17", "conceptIdx": 0, "steps": ["dx/dt = at cos t, dy/dt = at sin t, so dy/dx = tan t.", "d²y/dx² = sec²t·dt/dx = sec²t/(at cos t) = sec³t/(at)."], "answer": "d²y/dx² = sec³t/(at)."}, {"number": "Misc.18", "exercise": "Misc", "question": "If f(x) = |x|³, show that f″(x) exists for all real x and find it.", "page": 42, "endPage": 42, "title": "NCERT Exercise Misc · Question 18", "conceptIdx": 0, "steps": ["For x > 0: f = x³, f′ = 3x², f″ = 6x. For x < 0: f = –x³, f′ = –3x², f″ = –6x.", "At 0: f′(0) = 0 and f″(0) = lim 3|h| = 0. Hence f″(x) = 6|x| for all real x."], "answer": "f″(x) = 6|x| for all real x (6x if x ≥ 0, –6x if x < 0)."}, {"number": "Misc.19", "exercise": "Misc", "question": "Using the fact that sin(A + B) = sin A cos B + cos A sin B and the differentiation, obtain the sum formula for cosines.", "page": 42, "endPage": 42, "title": "NCERT Exercise Misc · Question 19", "conceptIdx": 0, "steps": ["Differentiate both sides w.r.t. A (B constant): left gives cos(A+B).", "Right gives cos A cos B – sin A sin B. Hence cos(A+B) = cos A cos B – sin A sin B."], "answer": "cos(A + B) = cos A cos B – sin A sin B."}, {"number": "Misc.20", "exercise": "Misc", "question": "Does there exist a function which is continuous everywhere but not differentiable at exactly two points? Justify your answer. 21. If y = |f(x) g(x) h(x); l m n; a b c|, prove that dy/dx = |f′(x) g′(x) h′(x); l m n; a b c|.", "page": 42, "endPage": 42, "title": "NCERT Exercise Misc · Question 20", "conceptIdx": 0, "steps": ["Q20: yes — e.g. f(x) = |x| + |x–1| is continuous everywhere (sum of moduli) but has corner points at x = 0 and x = 1 only, so not differentiable exactly there.", "Q21: expanding along R1, y = f·M₁ – g·M₂ + h·M₃ with constant minors Mᵢ; differentiating gives y′ = f′M₁ – g′M₂ + h′M₃, the stated determinant."], "answer": "Q20: yes, e.g. f(x) = |x| + |x – 1|. Q21: dy/dx equals the determinant with the first row differentiated."}, {"number": "Misc.22", "exercise": "Misc", "question": "If y = e^(a cos⁻¹x), –1 ≤ x ≤ 1, show that (1–x²)d²y/dx² – x dy/dx – a²y = 0.", "page": 42, "endPage": 42, "title": "NCERT Exercise Misc · Question 22", "conceptIdx": 0, "steps": ["y₁ = –ay/√(1–x²), so (1–x²)y₁² = a²y².", "Differentiate: –2xy₁² + (1–x²)2y₁y₂ = 2a²yy₁; divide by 2y₁ to get (1–x²)y₂ – xy₁ – a²y = 0."], "answer": "(1–x²)d²y/dx² – x dy/dx – a²y = 0 proved."}], "pageOffset": 103, "printPageStart": 104, "printPageEnd": 146, "paginationProvenance": "folio-read-43-samples"};</script>
  <script>(function(){

    console.error("No CHAPTER data object found on window.");

  }

    answers: {},

    simState: {}

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){

      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;

  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp) disp.innerHTML = "t = <b>" + state.t.toFixed(1) + " s</b>";
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

     var printedPages = l.printPages ? ' · printed pp. ' + l.printPages : ' · printed folio absent in source';

          (worked.steps ? '<br><strong>Steps:</strong><br>' + worked.steps.map(function(s){ return '&bull; ' + s; }).join('<br>') : '') +
          (worked.solution ? '<br><br><strong>Solution:</strong> ' + worked.solution : '') +
          (worked.answer ? '<br><br><strong>Answer:</strong> ' + worked.answer : '')
        : String(worked);

    }

    html += '</section>';

    // 02 PREDICT FIRST BLOCK
    var pred = l.prediction || l.predict || l.predict_first;
    if(pred && typeof pred === 'object' && (pred.prompt || pred.scenario) && pred.options && pred.options.length){

        '</div>' +

        '</section>';

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();
    var whatWatch = (pred && pred.prompt) ? pred.prompt : (typeof l.predict === 'string' ? l.predict : "Explore the interactive simulation controls, parameters, and readouts below.");
    html += '<section class="lab-card" data-block="play" aria-label="Interactive Laboratory">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +
      '<div id="sim-mount-point" class="sim-mount-container" style="width:100%;min-height:220px;margin-top:12px;">' +
        '<div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 720 300" role="img" aria-label="' + simTitle + '"></svg></div>' +
        '<div class="lab-legend" id="lab-legend"></div>' +
        '<div class="lab-toolbar" id="legacy-lab-toolbar">' +
          '<button class="toolbar-btn primary" id="btn-play-pause" aria-label="Play animation">▶ Play</button>' +
          '<button class="toolbar-btn" id="btn-step-fwd" aria-label="Step forward">⏭ Step (+0.5s)</button>' +
          '<button class="toolbar-btn" id="btn-reset-time" aria-label="Reset timeline">↺ Reset</button>' +
          '<span class="time-display" id="time-display">t = <b>0.0 s</b></span>' +
          '<div class="scrubber-wrap">' +
            '<input type="range" id="time-scrubber" class="timeline-scrubber" min="0" max="6" step="0.1" value="0" aria-label="Timeline time scrubber">' +

    // 04 CONNECT BLOCK
    var connectItems = l.connect || [];

    var resHtml = resList.length ? '<div class="resource-list">' + resList.map(function(r){
      var rt = String(r.title).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      var rp = String(r.provider).replace(/&/g,'&amp;').replace(/</g,'&lt;');
      return '<div class="resource-card" data-resource="true"><span class="res-badge">RESOURCE \u00b7 OPTIONAL</span><div class="res-body"><strong>' + rt + '</strong><span class="res-provider">' + rp + '</span></div><a class="res-link" href="' + r.url + '" target="_blank" rel="noopener">Open source \u2197</a><span class="res-off">Needs internet \u00b7 lesson works offline</span></div>';
    }).join("") + '</div>' : '';
    if(connectItems.length){
      html += '<section class="connect-section" data-block="connect" aria-label="Real World Connections">' +
        '<span class="block-tag">04 · CONNECT · REAL WORLD APPLICATIONS</span>' +
        '<div class="connect-grid">' +

          var title = Array.isArray(item) ? item[0] : (item.title || "Real World Context");
          var desc = Array.isArray(item) ? item[1] : (item.text || item.desc || "");
          var links = Array.isArray(item) ? (item[2] || []) : (item.links || (item.link ? [{t: "Read Deeply", u: item.link}] : []));
          var v = Array.isArray(item) ? (item[3] || null) : (item.video || null);
          var wow = /^Wow/i.test(title);

          var wowSrc = pdfRef;
          var wowPrint = (l && l.printPages) ? ' · printed pp. ' + l.printPages : ' (printed folio absent in source)';
          var cHtml = '<div class="connect-card' + (wow ? ' wow" data-wow="true" data-source="NCERT ' + C.book_name + ' Ch ' + C.chapterNumber + ' · ' + wowSrc + wowPrint + '"' : '') + '">';
          if(wow) cHtml += '<span class="wow-badge">WOW · REAL WORLD</span>';
          cHtml += '<h3>' + title + '</h3><p>' + desc + '</p>';
          if(v && v.id){
            cHtml += '<button class="video-facade" data-yt="' + v.id + '" aria-label="Play video: ' + v.title + '">' +
              '<span class="play-btn">▶</span>' +
              '<span class="video-title">' + v.title + ' · ' + v.channel + '</span>' +
              '</button>';
          }
          if(links && links.length){
            cHtml += '<p style="margin-top:10px;font-size:12px;color:var(--muted)">References: ' +
              links.map(function(a){ return '<a href="' + (a.u || a.link || "#") + '" target="_blank" rel="noopener">' + (a.t || a.label || "Read Deeply") + ' ↗</a>'; }).join(", ") +
              '</p>';

      for(var qi = 0; qi < quizzes.length; qi++){

        html += '<button class="level-tab' + (qi === 0 ? ' active' : '') + '" data-lvl="' + qi + '">' + tierName + '</button>';
      }

        '<div id="quiz-container"></div>' +
        '</section>';

    // 06 REVISE CALLOUT
    var recall = l.recall || (l.takeaways && l.takeaways.length ? l.takeaways[0] : (l.core_takeaways && l.core_takeaways.length ? l.core_takeaways[0] : "Reflect on how this concept connects to physical reality."));
    html += '<div class="revise-callout"><strong>06 · REVISE · SAY IT IN YOUR OWN WORDS:</strong> ' + recall + '</div>';

    // Footer Navigation
    var nextNav = idx < lessons.length - 1 ? (lessons[idx + 1].nav || lessons[idx + 1].navTitle || lessons[idx + 1].title || ("Concept " + (idx + 2))) : "";
    html += '<div class="concept-footer-nav">' +
      (idx > 0 ? '<button class="btn-secondary" id="btn-prev-concept">← Concept ' + ("0" + idx).slice(-2) + '</button>' : '<span></span>') +
      (idx < lessons.length - 1 ? '<button class="btn-primary" id="btn-next-concept">Concept ' + ("0" + (idx + 2)).slice(-2) + ': ' + nextNav + ' →</button>' : '<button class="btn-primary" id="btn-goto-revision">Chapter Revision & Exercises →</button>') +
      '</div>';

    cView.innerHTML = html;

    // Attach Prediction Listeners
    var btnCheckPred = document.getElementById("btn-check-prediction");
    var btnSkipPred = document.getElementById("btn-skip-prediction");
    if(btnCheckPred && pred){
      btnCheckPred.addEventListener("click", function(){
        var sel = document.querySelector('input[name="predict_ans"]:checked');

        var expectedAns = pred.answer !== undefined ? pred.answer : (pred.correct !== undefined ? pred.correct : 0);
        var isRight = chosen === expectedAns;
        fb.style.display = "block";
        fb.className = "predict-feedback " + (isRight ? "correct" : "revealed");
        fb.innerHTML = (isRight ? "<b>Spot on!</b> " : "<b>Good thought! Here is the physical principle:</b> ") + (pred.explanation || "");
      });

    if(btnSkipPred && pred){
      btnSkipPred.addEventListener("click", function(){
        var fb = document.getElementById("predict-feedback-box");
        fb.style.display = "block";
        fb.className = "predict-feedback revealed";
        fb.innerHTML = "<b>Key Principle:</b> " + (pred.explanation || "");
      });

    // Attach Timeline Controls for legacy SIMS
    var btnPP = document.getElementById("btn-play-pause");
    if(btnPP) btnPP.addEventListener("click", function(){ if(state.playing) pause(); else play(); });
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep) btnStep.addEventListener("click", function(){ step(0.5); });
    var btnResTime = document.getElementById("btn-reset-time");
    if(btnResTime) btnResTime.addEventListener("click", function(){ resetTimeline(); });
    var scrub = document.getElementById("time-scrubber");
    if(scrub) scrub.addEventListener("input", function(e){ seekTimeline(e.target.value); });

    // Footer Next/Prev listeners
    var btnPrev = document.getElementById("btn-prev-concept");
    var btnNext = document.getElementById("btn-next-concept");
    var btnRev = document.getElementById("btn-goto-revision");
    if(btnPrev) btnPrev.addEventListener("click", function(){ renderConcept(idx - 1); window.scrollTo(0,0); });
    if(btnNext) btnNext.addEventListener("click", function(){ renderConcept(idx + 1); window.scrollTo(0,0); });
    if(btnRev) btnRev.addEventListener("click", function(){ renderRevision(); window.scrollTo(0,0); });

    // Mount Active Simulation Engine
    var simMount = document.getElementById("sim-mount-point");
    if(simMount){
      var cKey = "c" + (idx + 1);
      var conceptId = l.id || ("concept-" + (idx + 1));
      var simId = l.sim || conceptId;

      // 1. window.mountSimulation (iemh101, iemh102)
      if(typeof window.mountSimulation === 'function'){
        simMount.innerHTML = "";
        window.mountSimulation(cKey, simMount);
      }
      // 2. window.SIM_ENGINES (iemh101-iemh105)
      else if(window.SIM_ENGINES && window.SIM_ENGINES[cKey] && typeof window.SIM_ENGINES[cKey].init === 'function'){
        simMount.innerHTML = "";
        window.SIM_ENGINES[cKey].init(simMount);
      }
      // 3. window.SimEngine (iemh106-iemh108)
      else if(window.SimEngine && typeof window.SimEngine.init === 'function'){
        var targetKey = null;
        var candidateKeys = [conceptId, "sim-" + conceptId, "sim-concept-" + (idx + 1), "concept-" + (idx + 1), simId, cKey];
        for(var k = 0; k < candidateKeys.length; k++){
          if(candidateKeys[k] && window.SimEngine.getEngine(candidateKeys[k])){
            targetKey = candidateKeys[k];
            break;
          }
        }
        if(targetKey){
          simMount.innerHTML = "";
          window.SimEngine.init(targetKey, simMount);
        }
      }
      // 4. window.SIMS (iesc101-iesc113)
      else if(window.SIMS && (window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey])){
        var simObj = window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey];
        if(typeof simObj.mount === 'function'){
          if(simObj.mount.length >= 1 && !simObj.draw){
            simMount.innerHTML = "";
            simObj.mount(simMount);

            simObj.mount(l);
          }
        }
      }
    }

    // Render Quiz for current level
    renderQuiz();

    // Attach Practice Level Tabs
    var lvlTabs = document.querySelectorAll(".level-tab");
    lvlTabs.forEach(function(tab){
      tab.addEventListener("click", function(){
        lvlTabs.forEach(function(t){ t.classList.remove("active"); });
        tab.classList.add("active");
        state.level = Number(tab.getAttribute("data-lvl"));
        renderQuiz();
      });
    });

    // Update URL hash
    window.location.hash = "#concept-" + (idx + 1);
  }

  // --- Render Quiz ---
  function renderQuiz(){
    var lessons = C.lessons || C.concepts || [];
    var l = lessons[state.conceptIndex];
    if(!l) return;
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(!quizzes.length) return;
    var q = quizzes[state.level] || quizzes[0];
    if(!q) return;

    var qk = qKey(state.conceptIndex, state.level);
    var old = state.answers[qk] || {};

    var box = document.getElementById("quiz-container");
    if(!box) return;

    var promptText = q.prompt || q.question || "";
    var isMcq = q.type === "mcq" || (q.options && q.options.length > 0);
    var correctAns = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : 0);
    var solutionText = q.solution || q.explanation || "";
    var hintText = q.hint || "Review the key relationships in the concept overview above.";

    var html = '<div class="question-prompt">' + promptText + '</div>';
    if(isMcq && q.options){
      html += '<div class="quiz-options">' +
        q.options.map(function(opt, oi){
          var checked = old.value === String(oi) ? " checked" : "";
          return '<label class="quiz-option"><input type="radio" name="quiz_ans" value="' + oi + '"' + checked + '><span>' + opt + '</span></label>';
        }).join("") +
        '</div>';
    } else {
      html += '<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">' +
        '<input type="number" step="any" id="quiz_num_ans" placeholder="Your answer" value="' + (old.value || "") + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;width:160px;">' +
        '<span style="font-weight:600;color:var(--muted);">' + (q.unit || "") + '</span>' +
        '</div>';
    }

    html += '<div class="quiz-actions">' +
      '<button class="btn-primary" id="btn-submit-quiz">Submit Answer</button>' +
      '<button class="btn-secondary" id="btn-toggle-hint">Show Hint</button>' +
      '</div>' +
      '<div id="quiz-hint-box" class="quiz-hint" style="display:none;">' + hintText + '</div>' +
      '<div id="quiz-feedback-box" class="quiz-feedback" style="display:none;"></div>';

    box.innerHTML = html;

    // Hint toggle
    var hintBtn = document.getElementById("btn-toggle-hint");
    if(hintBtn){
      hintBtn.addEventListener("click", function(){
        var hb = document.getElementById("quiz-hint-box");
        if(hb) hb.style.display = hb.style.display === "none" ? "block" : "none";
      });
    }

    // Submit listener
    var submitBtn = document.getElementById("btn-submit-quiz");
    if(submitBtn){
      submitBtn.addEventListener("click", function(){
        var fb = document.getElementById("quiz-feedback-box");
        if(!fb) return;
        var isRight = false;
        var userVal = "";

        if(isMcq){
          var sel = document.querySelector('input[name="quiz_ans"]:checked');
          if(!sel){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please select an answer choice first.";
            return;

  // --- URL Routing ---
  function routeFromHash(){
    var hash = window.location.hash;

      renderRevision();

        return;
      }
      renderConcept(0);
    } else {
      renderConcept(0);
    }

  };

  buildSidebar();
  updateProgress();
  routeFromHash();

    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span><span>removable hole</span></div>');

  install("derivative", "Derivative as slope", { x: 1 }, function (s) {
    return range("x", "Point x", -2.5, 2.5, 0.1, s.x, "");
  }, function (s) {
    var x = s.x, y = x * x, m = 2 * x;
    var x1 = -2.5, x2 = 2.5, y1 = y + m * (x1 - x), y2 = y + m * (x2 - x);
    var curve = "";
    for (var u = -2.5; u <= 2.51; u += 0.08) curve += (u === -2.5 ? "M" : "L") + (360 + u * 65) + " " + (160 - u * u * 24) + " ";
    return {
      svg: shell('<line x1="80" y1="160" x2="650" y2="160" stroke="#475569"></line><line x1="360" y1="45" x2="360" y2="270" stroke="#475569"></line><path d="' + curve + '" fill="none" stroke="#38bdf8" stroke-width="3"></path>' +
        '<line x1="' + (360 + x1 * 65) + '" y1="' + (160 - y1 * 24) + '" x2="' + (360 + x2 * 65) + '" y2="' + (160 - y2 * 24) + '" stroke="#f59e0b" stroke-width="3"></line><circle cx="' + (360 + x * 65) + '" cy="' + (160 - y * 24) + '" r="7" fill="#34d399"></circle>' +
        text(500, 70, "y = x²", "#38bdf8", 18) + text(500, 105, "slope f′(x) = 2x", "#f59e0b", 16)),
      readout: cell("x", x.toFixed(1)) + cell("f(x)", y.toFixed(2), "#38bdf8") + cell("f′(x)", m.toFixed(2), "#f59e0b"),
      verdict: "<b>Derivative:</b> it is the slope of the tangent. At x = 0 the parabola is flat; on the right the slope is positive and on the left it is negative."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span><span>tangent slope</span></div>');

  install("integration", "Integral as accumulated area", { upper: 3 }, function (s) {
    return range("upper", "Upper limit b", 0.5, 4, 0.1, s.upper, "");
  }, function (s) {
    var b = s.upper, area = b * b * b / 3, bars = "", n = 12, w = b / n;
    for (var i = 0; i < n; i += 1) {
      var u = i * w, h = u * u;
      bars += '<rect x="' + (100 + u * 110) + '" y="' + (245 - h * 12) + '" width="' + (w * 110 - 2) + '" height="' + (h * 12) + '" fill="#38bdf844"></rect>';
    }
    var curve = "";
    for (var x = 0; x <= 4.01; x += 0.08) curve += (x === 0 ? "M" : "L") + (100 + x * 110) + " " + (245 - x * x * 12) + " ";
    return {
      svg: shell('<line x1="95" y1="245" x2="555" y2="245" stroke="#475569"></line><path d="' + curve + '" fill="none" stroke="#f59e0b" stroke-width="3"></path>' + bars +
        '<line x1="' + (100 + b * 110) + '" y1="65" x2="' + (100 + b * 110) + '" y2="245" stroke="#34d399" stroke-dasharray="6 5" stroke-width="2"></line>' +
        text(510, 70, "∫₀ᵇ x² dx = b³/3", "#f8fafc", 18) + text(510, 105, "rectangles approximate the area", "#94a3b8", 14)),
      readout: cell("b", b.toFixed(1)) + cell("area", area.toFixed(3), "#34d399") + cell("meaning", "accumulation", "#f59e0b"),
      verdict: "<b>Integral:</b> an antiderivative gives a compact way to accumulate infinitely many thin contributions. The rectangles improve as their width shrinks."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#38bdf8"></span><span>area strips</span></div>');

  install("area", "Area between curves", { upper: 1 }, function (s) {
    return range("upper", "Boundary b", 0.2, 2, 0.05, s.upper, "");
  }, function (s) {
    var b = s.upper, area = b * b / 2 - b * b * b / 3, path = "", region = "";
    for (var x = 0; x <= b + 0.01; x += 0.03) {
      path += (x === 0 ? "M" : "L") + (120 + x * 190) + " " + (235 - x * 70) + " ";
      region += (x === 0 ? "M" : "L") + (120 + x * 190) + " " + (235 - x * 70) + " ";
    }
    for (var y = b; y >= -0.01; y -= 0.03) region += "L" + (120 + y * 190) + " " + (235 - y * y * 70) + " ";
    return {
      svg: shell('<line x1="110" y1="235" x2="520" y2="235" stroke="#475569"></line><path d="' + path + '" fill="none" stroke="#38bdf8" stroke-width="3"></path><path d="' + region + 'Z" fill="#34d39955" stroke="#34d399"></path>' +
        text(500, 70, "between y=x and y=x²", "#f8fafc", 17) + text(500, 105, "∫(x−x²) dx", "#f59e0b", 16)),
      readout: cell("b", b.toFixed(2)) + cell("area", area.toFixed(4), "#34d399") + cell("bounds", "0 to b", "#f59e0b"),
      verdict: "<b>Set up before integrating:</b> area is upper curve minus lower curve on the chosen interval. A sketch prevents a reversed sign."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#34d399"></span><span>bounded region</span></div>');

  install("differential", "Differential-equation flow", { family: "separable", t: 1 }, function (s) {
    return select("family", "Choose a model", [["separable", "dy/dx = y"], ["linear", "dy/dx + y = 1"], ["decay", "dy/dx = −y"]], s.family) +
      range("t", "time t", 0, 4, 0.1, s.t, "");
  }, function (s) {
    var sign = s.family === "decay" ? -1 : 1;
    var y = s.family === "linear" ? 1 - Math.exp(-s.t) : Math.exp(sign * s.t);
    var curve = "";
    for (var x = 0; x <= 4.01; x += 0.08) {
      var value = s.family === "linear" ? 1 - Math.exp(-x) : Math.exp(sign * x);
      curve += (x === 0 ? "M" : "L") + (100 + x * 100) + " " + (235 - Math.min(2.7, value) * 55) + " ";
    }
    return {
      svg: shell('<line x1="95" y1="235" x2="530" y2="235" stroke="#475569"></line><path d="' + curve + '" fill="none" stroke="#38bdf8" stroke-width="3"></path><circle cx="' + (100 + s.t * 100) + '" cy="' + (235 - Math.min(2.7, y) * 55) + '" r="7" fill="#34d399"></circle>' +
        text(500, 70, "solve → apply initial condition", "#f8fafc", 16) + text(500, 105, "one family, many possible constants", "#94a3b8", 14)),
      readout: cell("model", s.family) + cell("y(t)", y.toFixed(3), "#34d399") + cell("t", s.t.toFixed(1), "#f59e0b"),
      verdict: "<b>Solution family:</b> integrating produces a constant. An initial condition selects one member of the family."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#34d399"></span><span>solution curve</span></div>');

  install("vectors", "Vector components", { ax: 3, ay: 2, bx: -1, by: 2 }, function (s) {
    return range("ax", "Aₓ", -4, 4, 1, s.ax, "") + range("ay", "Aᵧ", -4, 4, 1, s.ay, "") +
      range("bx", "Bₓ", -4, 4, 1, s.bx, "") + range("by", "Bᵧ", -4, 4, 1, s.by, "");
  }, function (s) {
    var rx = s.ax + s.bx, ry = s.ay + s.by, mag = Math.sqrt(rx * rx + ry * ry);
    function arrow(x, y, dx, dy, color) {
      return '<line x1="' + x + '" y1="' + y + '" x2="' + (x + dx * 35) + '" y2="' + (y - dy * 35) + '" stroke="' + color + '" stroke-width="4" marker-end="url(#arrow-v)"></line>';
    }
    return {
      svg: shell('<line x1="90" y1="180" x2="630" y2="180" stroke="#475569"></line><line x1="360" y1="45" x2="360" y2="270" stroke="#475569"></line>' +
        arrow(360, 180, s.ax, s.ay, "#38bdf8") + arrow(360, 180, s.bx, s.by, "#f59e0b") + arrow(360, 180, rx, ry, "#34d399") +
        '<defs><marker id="arrow-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34d399"></path></marker></defs>' +
        text(500, 65, "R = A + B", "#34d399", 18) + text(500, 105, "components add separately", "#94a3b8", 14)),
      readout: cell("Rₓ", rx.toFixed(0), "#34d399") + cell("Rᵧ", ry.toFixed(0), "#34d399") + cell("|R|", mag.toFixed(2), "#f59e0b"),
      verdict: "<b>Vector addition:</b> add horizontal components together and vertical components together. The resultant arrow is the diagonal of the component parallelogram."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span><span>input vectors</span></div><div class="legend-item"><span class="legend-dot" style="background:#34d399"></span><span>resultant</span></div>');

  install("lines3d", "Angle between lines", { angle: 45 }, function (s) {
    return range("angle", "Projected angle", 0, 90, 1, s.angle, "°");
  }, function (s) {
    var c = Math.cos(s.angle * Math.PI / 180);
    return {
      svg: shell('<line x1="165" y1="220" x2="530" y2="90" stroke="#38bdf8" stroke-width="5"></line><line x1="165" y1="220" x2="530" y2="220" stroke="#f59e0b" stroke-width="5"></line><path d="M235 195 A75 75 0 0 1 275 174" fill="none" stroke="#34d399" stroke-width="3"></path>' +
        text(500, 70, "cos θ = (a₁a₂+b₁b₂+c₁c₂)/(|a₁||a₂|)", "#f8fafc", 14) + text(500, 115, "direction ratios → angle", "#94a3b8", 15)),
      readout: cell("θ", s.angle.toFixed(0) + "°", "#34d399") + cell("cos θ", c.toFixed(3), "#f59e0b"),
      verdict: "<b>3D line angle:</b> direction ratios are enough. The dot product compares how much the two directions point the same way."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span><span>reference direction</span></div>');

  install("lp", "Linear-programming feasible region", { slope: 1 }, function (s) {
    return range("slope", "Objective slope", -2, 3, 0.1, s.slope, "");
  }, function (s) {
    var y1 = 4 - s.slope * 1, y2 = 4 - s.slope * 3;
    return {
      svg: shell('<line x1="95" y1="245" x2="600" y2="245" stroke="#475569"></line><line x1="95" y1="55" x2="95" y2="245" stroke="#475569"></line><polygon points="95,245 95,105 300,105 470,245" fill="#34d39955" stroke="#34d399" stroke-width="3"></polygon>' +
        '<line x1="100" y1="' + (245 - y1 * 35) + '" x2="560" y2="' + (245 - y2 * 35) + '" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 5"></line>' +
        '<circle cx="95" cy="105" r="7" fill="#38bdf8"></circle><circle cx="300" cy="105" r="7" fill="#38bdf8"></circle><circle cx="470" cy="245" r="7" fill="#38bdf8"></circle>' +
        text(500, 65, "objective line slides", "#f8fafc", 17) + text(500, 100, "test the vertices", "#94a3b8", 15)),
      readout: cell("slope", s.slope.toFixed(1)) + cell("candidate points", "vertices", "#34d399") + cell("method", "corner test", "#f59e0b"),
      verdict: "<b>Graphical method:</b> the optimum occurs at a corner of the feasible region unless the objective is constant along an edge."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#34d399"></span><span>feasible region</span></div>');

  install("probability", "Probability tree", { pA: 0.6, pB: 0.3 }, function (s) {
    return range("pA", "P(A)", 0.1, 0.9, 0.05, s.pA, "") + range("pB", "P(B|A)", 0.1, 0.9, 0.05, s.pB, "");
  }, function (s) {
    var joint = s.pA * s.pB, other = (1 - s.pA) * 0.2, total = joint + other;
    return {
      svg: shell('<line x1="110" y1="150" x2="260" y2="90" stroke="#38bdf8" stroke-width="3"></line><line x1="110" y1="150" x2="260" y2="220" stroke="#94a3b8" stroke-width="3"></line><line x1="260" y1="90" x2="470" y2="60" stroke="#34d399" stroke-width="3"></line><line x1="260" y1="90" x2="470" y2="125" stroke="#94a3b8" stroke-width="3"></line><line x1="260" y1="220" x2="470" y2="190" stroke="#f59e0b" stroke-width="3"></line><line x1="260" y1="220" x2="470" y2="250" stroke="#94a3b8" stroke-width="3"></line>' +
        text(100, 140, "start", "#f8fafc", 14) + text(260, 78, "A", "#38bdf8", 17) + text(260, 210, "Aᶜ", "#94a3b8", 17) + text(505, 60, "B", "#34d399", 17) + text(505, 125, "Bᶜ", "#94a3b8", 17) +
        text(505, 190, "B", "#f59e0b", 17) + text(505, 250, "Bᶜ", "#94a3b8", 17)),
      readout: cell("P(A∩B)", joint.toFixed(3), "#34d399") + cell("P(B)", total.toFixed(3), "#f59e0b") + cell("P(A|B)", (joint / Math.max(total, 0.001)).toFixed(3), "#38bdf8"),
      verdict: "<b>Bayes:</b> multiply along a branch, add disjoint branches for P(B), then reverse the condition with P(A|B) = P(A∩B)/P(B)."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#34d399"></span><span>target branch</span></div>');
})();
</script>
  <script>if (window.App && typeof window.App.routeFromHash === "function") window.App.routeFromHash();</script>
</body>
