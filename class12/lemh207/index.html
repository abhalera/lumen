<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Class 12 Mathematics — Probability.">
  <title>Probability — Class 12 Mathematics</title>
  <style>:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  text-align: left;
  background: #0f172a;
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
}
.play-btn {
  flex: none;
  width: 34px;
  height: 34px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 14px;
}
.video-title {
  font-size: 13px;
  line-height: 1.4;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.q-badge {
  background: var(--soft);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 3px 10px;
  border-radius: 6px;
}
.q-concept-link {
  color: var(--blue);
  text-decoration: none;

 and F are events such that P(E) = 0.6, P(F) = 0.3 and P(E ∩ F) = 0.2, find P(E|F) and P(F|E).", "page": 8, "endPage": 8, "title": "NCERT Exercise 13.1 · Question 1", "conceptIdx": 0, "steps": ["P(E|F) = P(E ∩ F)/P(F) = 0.2/0.3 = 2/3.", "P(F|E) = P(E ∩ F)/P(E) = 0.2/0.6 = 1/3."], "answer": "P(E|F) = 2/3, P(F|E) = 1/3"}, {"number": "13.1.2", "exercise": "13.1", "question": "Compute P(A|B), if P(B) = 0.5 and P(A ∩ B) = 0.32.", "page": 8, "endPage": 8, "title": "NCERT Exercise 13.1 · Question 2", "conceptIdx": 0, "steps": ["Use P(A|B) = P(A ∩ B)/P(B).", "P(A|B) = 0.32/0.5 = 0.64."], "answer": "P(A|B) = 0.64"}, {"number": "13.1.3", "exercise": "13.1", "question": "If P(A) = 0.8, P(B) = 0.5 and P(B|A) = 0.4, find (i) P(A ∩ B) (ii) P(A|B) (iii) P(A ∪ B).", "page": 8, "endPage": 8, "title": "NCERT Exercise 13.1 · Question 3", "conceptIdx": 0, "steps": ["(i) P(A ∩ B) = P(A)·P(B|A) = 0.8 × 0.4 = 0.32.", "(ii) P(A|B) = P(A ∩ B)/P(B) = 0.32/0.5 = 0.64.", "(iii) P(A ∪ B) = P(A) + P(B) − P(A ∩ B) = 0.8 + 0.5 − 0.32 = 0.98."], "answer": "(i) 0.32, (ii) 0.64, (iii) 0.98"}, {"number": "13.1.4", "exercise": "13.1", "question": "Evaluate P(A ∪ B), if 2P(A) = P(B) = 5/13 and P(A|B) = 2/5.", "page": 8, "endPage": 8, "title": "NCERT Exercise 13.1 · Question 4", "conceptIdx": 0, "steps": ["P(A) = 5/26, P(B) = 5/13.", "P(A ∩ B) = P(B)·P(A|B) = (5/13)(2/5) = 2/13.", "P(A ∪ B) = 5/26 + 5/13 − 2/13 = 11/26."], "answer": "P(A ∪ B) = 11/26"}, {"number": "13.1.5", "exercise": "13.1", "question": "If P(A) = 6/11, P(B) = 5/11 and P(A ∪ B) = 7/11, find (i) P(A ∩ B) (ii) P(A|B) (iii) P(B|A).", "page": 8, "endPage": 8, "title": "NCERT Exercise 13.1 · Question 5", "conceptIdx": 0, "steps": ["(i) P(A ∩ B) = 6/11 + 5/11 − 7/11 = 4/11.", "(ii) P(A|B) = (4/11)/(5/11) = 4/5.", "(iii) P(B|A) = (4/11)/(6/11) = 2/3."], "answer": "(i) 4/11, (ii) 4/5, (iii) 2/3"}, {"number": "13.1.6", "exercise": "13.1", "question": "Determine P(E|F) if a coin is tossed three times, where (i) E: head on third toss, F: heads on first two tosses (ii) E: at least two heads, F: at most two heads (iii) E: at most two tails, F: at least one tail.", "page": 8, "endPage": 8, "title": "NCERT Exercise 13.1 · Question 6", "conceptIdx": 0, "steps": ["Sample space has 8 outcomes. (i) |F| = 2, |E ∩ F| = 1, so P = 1/2.", "(ii) |F| = 7, |E ∩ F| = 3, so P = 3/7.", "(iii) |F| = 7, |E ∩ F| = 6, so P = 6/7."], "answer": "(i) 1/2, (ii) 3/7, (iii) 6/7"}, {"number": "13.1.7", "exercise": "13.1", "question": "Determine P(E|F) if two coins are tossed once, where (i) E: tail appears on one coin, F: one coin shows head (ii) E: no tail appears, F: no head appears.", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 7", "conceptIdx": 0, "steps": ["(i) F = {HH, HT, TH}, E ∩ F = {HT, TH}, so P = 2/3.", "(ii) F = {TT}, E = {HH}, E ∩ F = φ, so P = 0."], "answer": "(i) 2/3, (ii) 0"}, {"number": "13.1.8", "exercise": "13.1", "question": "Determine P(E|F) if a die is thrown three times, E: 4 appears on the third toss, F: 6 and 5 appear respectively on the first two tosses.", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 8", "conceptIdx": 0, "steps": ["|F| = 6 outcomes (6, 5, ·), |E ∩ F| = 1 outcome (6, 5, 4).", "P(E|F) = 1/6."], "answer": "1/6"}, {"number": "13.1.9", "exercise": "13.1", "question": "Determine P(E|F) if mother, father and son line up at random for a family picture, E: son on one end, F: father in middle.", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 9", "conceptIdx": 0, "steps": ["|F| = 2 arrangements (father fixed in middle), both have son on an end.", "P(E|F) = 2/2 = 1."], "answer": "1"}, {"number": "13.1.10", "exercise": "13.1", "question": "A black and a red die are rolled. (a) Find the conditional probability of obtaining a sum greater than 9, given that the black die resulted in a 5. (b) Find the conditional probability of obtaining the sum 8, given that the red die resulted in a number less than 4.", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 10", "conceptIdx": 0, "steps": ["(a) Given black 5, 6 cases; sums > 9 are (5,5),(5,6): 2/6 = 1/3.", "(b) Given red ∈ {1,2,3}, 18 cases; sum 8 needs (6,2),(5,3): 2/18 = 1/9."], "answer": "(a) 1/3, (b) 1/9"}, {"number": "13.1.11", "exercise": "13.1", "question": "A fair die is rolled. Consider events E = {1,3,5}, F = {2,3} and G = {2,3,4,5}. Find (i) P(E|F) and P(F|E) (ii) P(E|G) and P(G|E) (iii) P((E ∪ F)|G) and P((E ∩ F)|G).", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 11", "conceptIdx": 0, "steps": ["(i) E ∩ F = {3}: P(E|F) = 1/2, P(F|E) = 1/3.", "(ii) E ∩ G = {3,5}: P(E|G) = 2/4 = 1/2, P(G|E) = 2/3.", "(iii) E ∪ F = {1,2,3,5}: P((E ∪ F)|G) = 3/4; P((E ∩ F)|G) = 1/4."], "answer": "(i) 1/2, 1/3; (ii) 1/2, 2/3; (iii) 3/4, 1/4"}, {"number": "13.1.12", "exercise": "13.1", "question": "Assume that each born child is equally likely to be a boy or a girl. If a family has two children, what is the conditional probability that both are girls given that (i) the youngest is a girl, (ii) at least one is a girl?", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 12", "conceptIdx": 0, "steps": ["(i) Given youngest is a girl, cases {GG, BG}: P = 1/2.", "(ii) Given at least one girl, cases {GG, BG, GB}: P = 1/3."], "answer": "(i) 1/2, (ii) 1/3"}, {"number": "13.1.13", "exercise": "13.1", "question": "An instructor has a question bank consisting of 300 easy True/False questions, 200 difficult True/False questions, 500 easy multiple choice questions and 400 difficult multiple choice questions. If a question is selected at random from the question bank, what is the probability that it will be an easy question given that it is a multiple choice question?", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 13", "conceptIdx": 0, "steps": ["900 multiple choice questions, of which 500 are easy.", "P = 500/900 = 5/9."], "answer": "5/9"}, {"number": "13.1.14", "exercise": "13.1", "question": "Given that the two numbers appearing on throwing two dice are different, find the probability of the event 'the sum of numbers on the dice is 4'.", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 14", "conceptIdx": 0, "steps": ["30 outcomes with different numbers.", "Sum 4 needs (1,3),(3,1): 2 outcomes, so P = 2/30 = 1/15."], "answer": "1/15"}, {"number": "13.1.15", "exercise": "13.1", "question": "Consider the experiment of throwing a die, if a multiple of 3 comes up, throw the die again and if any other number comes, toss a coin. Find the conditional probability of the event 'the coin shows a tail', given that 'at least one die shows a 3'.", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 15", "conceptIdx": 0, "steps": ["A coin is tossed only when the first die is not 3 or 6, so no die shows 3 then.", "Hence A ∩ B = φ and P = 0."], "answer": "0"}, {"number": "13.1.16", "exercise": "13.1", "question": "If P(A) = 1/2, P(B) = 0, then P(A|B) is (A) 0 (B) 1/2 (C) not defined (D) 1.", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 16", "conceptIdx": 0, "steps": ["P(A|B) = P(A ∩ B)/P(B) requires division by P(B) = 0.", "Hence it is not defined. Option (C)."], "answer": "(C) not defined"}, {"number": "13.1.17", "exercise": "13.1", "question": "If A and B are events such that P(A|B) = P(B|A), then (A) A ⊂ B but A ≠ B (B) A = B (C) A ∩ B = φ (D) P(A) = P(B).", "page": 10, "endPage": 10, "title": "NCERT Exercise 13.1 · Question 17", "conceptIdx": 0, "steps": ["P(A ∩ B)/P(B) = P(A ∩ B)/P(A) gives P(A) = P(B).", "Option (D)."], "answer": "(D) P(A) = P(B)"}, {"number": "13.2.1", "exercise": "13.2", "question": "If P(A) = 3/5 and P(B) = 1/5, find P(A ∩ B) if A and B are independent events.", "page": 16, "endPage": 16, "title": "NCERT Exercise 13.2 · Question 1", "conceptIdx": 1, "steps": ["For independent events P(A ∩ B) = P(A)·P(B).", "P = (3/5)(1/5) = 3/25."], "answer": "3/25"}, {"number": "13.2.2", "exercise": "13.2", "question": "Two cards are drawn at random and without replacement from a pack of 52 playing cards. Find the probability that both the cards are black.", "page": 16, "endPage": 16, "title": "NCERT Exercise 13.2 · Question 2", "conceptIdx": 1, "steps": ["P(first black) = 26/52, P(second black | first black) = 25/51.", "P = (26/52)(25/51) = 25/102."], "answer": "25/102"}, {"number": "13.2.3", "exercise": "13.2", "question": "A box of oranges is inspected by examining three randomly selected oranges drawn without replacement. If all the three oranges are good, the box is approved for sale, otherwise, it is rejected. Find the probability that a box containing 15 oranges out of which 12 are good and 3 are bad ones will be approved for sale.", "page": 16, "endPage": 16, "title": "NCERT Exercise 13.2 · Question 3", "conceptIdx": 1, "steps": ["P = (12/15)(11/14)(10/13).", "P = 1320/2730 = 44/91."], "answer": "44/91"}, {"number": "13.2.4", "exercise": "13.2", "question": "A fair coin and an unbiased die are tossed. Let A be the event 'head appears on the coin' and B be the event '3 on the die'. Check whether A and B are independent events or not.", "page": 16, "endPage": 16, "title": "NCERT Exercise 13.2 · Question 4", "conceptIdx": 1, "steps": ["P(A) = 1/2, P(B) = 1/6, P(A ∩ B) = 1/12.", "P(A)·P(B) = 1/12 = P(A ∩ B), so A and B are independent."], "answer": "Yes, A and B are independent"}, {"number": "13.2.5", "exercise": "13.2", "question": "A die marked 1, 2, 3 in red and 4, 5, 6 in green is tossed. Let A be the event, 'the number is even,' and B be the event, 'the number is red'. Are A and B independent?", "page": 16, "endPage": 16, "title": "NCERT Exercise 13.2 · Question 5", "conceptIdx": 1, "steps": ["P(A) = 3/6 = 1/2, P(B) = 3/6 = 1/2, P(A ∩ B) = P({2}) = 1/6.", "P(A)·P(B) = 1/4 ≠ 1/6, so A and B are not independent."], "answer": "No, A and B are not independent"}, {"number": "13.2.6", "exercise": "13.2", "question": "Let E and F be events with P(E) = 3/5, P(F) = 3/10 and P(E ∩ F) = 1/5. Are E and F independent?", "page": 16, "endPage": 16, "title": "NCERT Exercise 13.2 · Question 6", "conceptIdx": 1, "steps": ["P(E)·P(F) = (3/5)(3/10) = 9/50.", "9/50 ≠ 1/5, so E and F are not independent."], "answer": "No, E and F are not independent"}, {"number": "13.2.7", "exercise": "13.2", "question": "Given that the events A and B are such that P(A) = 1/2, P(A ∪ B) = 3/5 and P(B) = p. Find p if they are (i) mutually exclusive (ii) independent.", "page": 17, "endPage": 17, "title": "NCERT Exercise 13.2 · Question 7", "conceptIdx": 1, "steps": ["(i) Mutually exclusive: 1/2 + p = 3/5, so p = 1/10.", "(ii) Independent: 3/5 = 1/2 + p − p/2, so p/2 = 1/10 and p = 1/5."], "answer": "(i) p = 1/10, (ii) p = 1/5"}, {"number": "13.2.8", "exercise": "13.2", "question": "Let A and B be independent events with P(A) = 0.3 and P(B) = 0.4. Find (i) P(A ∩ B) (ii) P(A ∪ B) (iii) P(A|B) (iv) P(B|A). Also: if P(A) = 1/4, P(B) = 1/2 and P(A ∩ B) = 1/8, find P(not A and not B). Also: events A and B have P(A) = 1/2, P(B) = 7/12 and P(not A or not B) = 1/4; state whether A and B are independent.", "page": 17, "endPage": 17, "title": "NCERT Exercise 13.2 · Question 8", "conceptIdx": 1, "steps": ["(i) 0.3 × 0.4 = 0.12; (ii) 0.3 + 0.4 − 0.12 = 0.58; (iii) 0.3; (iv) 0.4.", "P(not A and not B) = 1 − (1/4 + 1/2 − 1/8) = 3/8.", "P(A ∩ B) = 1 − 1/4 = 3/4 ≠ (1/2)(7/12) = 7/24, so not independent."], "answer": "(i) 0.12, (ii) 0.58, (iii) 0.3, (iv) 0.4; P(not A and not B) = 3/8; A and B are not independent"}, {"number": "13.2.11", "exercise": "13.2", "question": "Given two independent events A and B such that P(A) = 0.3, P(B) = 0.6. Find (i) P(A and B) (ii) P(A and not B) (iii) P(A or B) (iv) P(neither A nor B).", "page": 17, "endPage": 17, "title": "NCERT Exercise 13.2 · Question 11", "conceptIdx": 1, "steps": ["(i) 0.3 × 0.6 = 0.18; (ii) 0.3 × 0.4 = 0.12.", "(iii) 0.3 + 0.6 − 0.18 = 0.72; (iv) 1 − 0.72 = 0.28."], "answer": "(i) 0.18, (ii) 0.12, (iii) 0.72, (iv) 0.28"}, {"number": "13.2.12", "exercise": "13.2", "question": "A die is tossed thrice. Find the probability of getting an odd number at least once.", "page": 17, "endPage": 17, "title": "NCERT Exercise 13.2 · Question 12", "conceptIdx": 1, "steps": ["P(no odd in 3 tosses) = (1/2)³ = 1/8.", "P(at least one odd) = 1 − 1/8 = 7/8."], "answer": "7/8"}, {"number": "13.2.13", "exercise": "13.2", "question": "Two balls are drawn at random with replacement from a box containing 10 black and 8 red balls. Find the probability that (i) both balls are red (ii) first ball is black and second is red (iii) one of them is black and the other is red.", "page": 17, "endPage": 17, "title": "NCERT Exercise 13.2 · Question 13", "conceptIdx": 1, "steps": ["(i) (8/18)² = 16/81.", "(ii) (10/18)(8/18) = 20/81.", "(iii) 2 × (10/18)(8/18) = 40/81."], "answer": "(i) 16/81, (ii) 20/81, (iii) 40/81"}, {"number": "13.2.14", "exercise": "13.2", "question": "Probability of solving a specific problem independently by A and B are 1/2 and 1/3 respectively. If both try to solve the problem independently, find the probability that (i) the problem is solved (ii) exactly one of them solves the problem.", "page": 17, "endPage": 17, "title": "NCERT Exercise 13.2 · Question 14", "conceptIdx": 1, "steps": ["(i) P(solved) = 1 − (1/2)(2/3) = 2/3.", "(ii) P(exactly one) = (1/2)(2/3) + (1/2)(1/3) = 1/2."], "answer": "(i) 2/3, (ii) 1/2"}, {"number": "13.2.15", "exercise": "13.2", "question": "One card is drawn at random from a well shuffled deck of 52 cards. In which of the following cases are the events E and F independent? (i) E: 'the card drawn is a spade' F: 'the card drawn is an ace' (ii) E: 'the card drawn is black' F: 'the card drawn is a king' (iii) E: 'the card drawn is a king or queen' F: 'the card drawn is a queen or jack'.", "page": 17, "endPage": 17, "title": "NCERT Exercise 13.2 · Question 15", "conceptIdx": 1, "steps": ["(i) 1/4 × 1/13 = 1/52 = P(E ∩ F): independent.", "(ii) 1/2 × 1/13 = 1/26 = P(E ∩ F): independent.", "(iii) P(E)·P(F) = 4/169 ≠ 1/13 = P(E ∩ F): not independent."], "answer": "(i) independent, (ii) independent, (iii) not independent"}, {"number": "13.2.16", "exercise": "13.2", "question": "In a hostel, 60% of the students read Hindi newspaper, 40% read English newspaper and 20% read both Hindi and English newspapers. A student is selected at random. (a) Find the probability that she reads neither Hindi nor English newspapers. (b) If she reads Hindi newspaper, find the probability that she reads English newspaper. (c) If she reads English newspaper, find the probability that she reads Hindi newspaper.", "page": 18, "endPage": 18, "title": "NCERT Exercise 13.2 · Question 16", "conceptIdx": 1, "steps": ["(a) 1 − 0.6 − 0.4 + 0.2 = 0.2.", "(b) 0.2/0.6 = 1/3; (c) 0.2/0.4 = 1/2."], "answer": "(a) 0.2, (b) 1/3, (c) 1/2"}, {"number": "13.2.17", "exercise": "13.2", "question": "The probability of obtaining an even prime number on each die, when a pair of dice is rolled is (A) 0 (B) 1/3 (C) 1/12 (D) 1/36.", "page": 18, "endPage": 18, "title": "NCERT Exercise 13.2 · Question 17", "conceptIdx": 1, "steps": ["Even prime is 2 only: probability 1/6 on each die.", "P = (1/6)(1/6) = 1/36. Option (D)."], "answer": "(D) 1/36"}, {"number": "13.2.18", "exercise": "13.2", "question": "Two events A and B will be independent, if (A) A and B are mutually exclusive (B) P(A′B′) = [1 − P(A)][1 − P(B)] (C) P(A) = P(B) (D) P(A) + P(B) = 1.", "page": 18, "endPage": 18, "title": "NCERT Exercise 13.2 · Question 18", "conceptIdx": 1, "steps": ["P(A′ ∩ B′) = P(A′)P(B′) is exactly the independence condition.", "Option (B)."], "answer": "(B) P(A′B′) = [1 − P(A)][1 − P(B)]"}, {"number": "13.3.1", "exercise": "13.3", "question": "An urn contains 5 red and 5 black balls. A ball is drawn at random, its colour is noted and is returned to the urn. Moreover, 2 additional balls of the colour drawn are put in the urn and then a ball is drawn at random. What is the probability that the second ball is red?", "page": 26, "endPage": 26, "title": "NCERT Exercise 13.3 · Question 1", "conceptIdx": 2, "steps": ["P(R2) = P(R1)P(R2|R1) + P(B1)P(R2|B1).", "P = (1/2)(7/12) + (1/2)(5/12) = 1/2."], "answer": "1/2"}, {"number": "13.3.2", "exercise": "13.3", "question": "A bag contains 4 red and 4 black balls, another bag contains 2 red and 6 black balls. One of the two bags is selected at random and a ball is drawn from the bag which is found to be red. Find the probability that the ball is drawn from the first bag.", "page": 26, "endPage": 26, "title": "NCERT Exercise 13.3 · Question 2", "conceptIdx": 2, "steps": ["P(E1) = P(E2) = 1/2; P(R|E1) = 4/8, P(R|E2) = 2/8.", "By Bayes: P(E1|R) = (1/2 × 4/8)/((1/2)(4/8) + (1/2)(2/8)) = 2/3."], "answer": "2/3"}, {"number": "13.3.3", "exercise": "13.3", "question": "Of the students in a college, it is known that 60% reside in hostel and 40% are day scholars (not residing in hostel). Previous year results report that 30% of all students who reside in hostel attain A grade and 20% of day scholars attain A grade in their annual examination. At the end of the year, one student is chosen at random from the college and he has an A grade, what is the probability that the student is a hostelier?", "page": 26, "endPage": 26, "title": "NCERT Exercise 13.3 · Question 3", "conceptIdx": 2, "steps": ["P(H) = 0.6, P(D) = 0.4; P(A|H) = 0.3, P(A|D) = 0.2.", "P(H|A) = (0.6 × 0.3)/(0.6 × 0.3 + 0.4 × 0.2) = 0.18/0.26 = 9/13."], "answer": "9/13"}, {"number": "13.3.4", "exercise": "13.3", "question": "In answering a question on a multiple choice test, a student either knows the answer or guesses. Let 3/4 be the probability that he knows the answer and 1/4 be the probability that he guesses. Assuming that a student who guesses at the answer will be correct with probability 1/4, what is the probability that the student knows the answer given that he answered it correctly?", "page": 26, "endPage": 26, "title": "NCERT Exercise 13.3 · Question 4", "conceptIdx": 2, "steps": ["P(K) = 3/4, P(G) = 1/4; P(C|K) = 1, P(C|G) = 1/4.", "P(K|C) = (3/4)/((3/4) + (1/4)(1/4)) = (3/4)/(13/16) = 12/13."], "answer": "12/13"}, {"number": "13.3.5", "exercise": "13.3", "question": "A laboratory blood test is 99% effective in detecting a certain disease when it is in fact present. However, the test also yields a false positive result for 0.5% of the healthy persons tested (i.e. if a healthy person is tested, then with probability 0.005 the test will imply he has the disease). If 0.1 percent of the population actually has the disease, what is the probability that a person has the disease given that his test result is positive?", "page": 26, "endPage": 26, "title": "NCERT Exercise 13.3 · Question 5", "conceptIdx": 2, "steps": ["P(D) = 0.001, P(+|D) = 0.99; P(+|D′) = 0.005.", "P(D|+) = 0.00099/(0.00099 + 0.999 × 0.005) = 22/133 ≈ 0.165."], "answer": "22/133 ≈ 0.165"}, {"number": "13.3.6", "exercise": "13.3", "question": "There are three coins. One is a two-headed coin (having head on both faces), another is a biased coin that comes up heads 75% of the time and the third is an unbiased coin. One of the three coins is chosen at random and tossed, it shows heads. What is the probability that it was the two-headed coin?", "page": 27, "endPage": 27, "title": "NCERT Exercise 13.3 · Question 6", "conceptIdx": 2, "steps": ["P(H) = (1/3)(1 + 3/4 + 1/2) = (1/3)(9/4) = 3/4.", "P(two-headed|H) = ((1/3)(1))/(3/4) = 4/9."], "answer": "4/9"}, {"number": "13.3.7", "exercise": "13.3", "question": "An insurance company insured 2000 scooter drivers, 4000 car drivers and 6000 truck drivers. The probabilities of accidents are 0.01, 0.03 and 0.15 respectively. One of the insured persons meets with an accident. What is the probability that he is a scooter driver?", "page": 27, "endPage": 27, "title": "NCERT Exercise 13.3 · Question 7", "conceptIdx": 2, "steps": ["P(S) = 2000/12000 = 1/6, P(C) = 1/3, P(T) = 1/2.", "P(S|A) = (1/6 × 0.01)/((1/6)(0.01) + (1/3)(0.03) + (1/2)(0.15)) = 20/1040 = 1/52."], "answer": "1/52"}, {"number": "13.3.8", "exercise": "13.3", "question": "A factory has two machines A and B. Past record shows that machine A produced 60% of the items of output and machine B produced 40% of the items. Further, 2% of the items produced by machine A and 1% produced by machine B were defective. All the items are put into one stockpile and then one item is chosen at random from this and is found to be defective. What is the probability that it was produced by machine B?", "page": 27, "endPage": 27, "title": "NCERT Exercise 13.3 · Question 8", "conceptIdx": 2, "steps": ["P(D) = 0.6 × 0.02 + 0.4 × 0.01 = 0.016.", "P(B|D) = 0.004/0.016 = 1/4."], "answer": "1/4"}, {"number": "13.3.9", "exercise": "13.3", "question": "Two groups are competing for the position on the Board of directors of a corporation. The probabilities that the first and the second groups will win are 0.6 and 0.4 respectively. Further, if the first group wins, the probability of introducing a new product is 0.7 and the corresponding probability is 0.3 if the second group wins. Find the probability that the new product introduced was by the second group.", "page": 27, "endPage": 27, "title": "NCERT Exercise 13.3 · Question 9", "conceptIdx": 2, "steps": ["P(new) = 0.6 × 0.7 + 0.4 × 0.3 = 0.54.", "P(G2|new) = 0.12/0.54 = 2/9."], "answer": "2/9"}, {"number": "13.3.10", "exercise": "13.3", "question": "Suppose a girl throws a die. If she gets a 5 or 6, she tosses a coin three times and notes the number of heads. If she gets 1, 2, 3 or 4, she tosses a coin once and notes whether a head or tail is obtained. If she obtained exactly one head, what is the probability that she threw 1, 2, 3 or 4 with the die?", "page": 27, "endPage": 27, "title": "NCERT Exercise 13.3 · Question 10", "conceptIdx": 2, "steps": ["P(E1) = 1/3 (5 or 6), P(one H|E1) = 3/8; P(E2) = 2/3, P(one H|E2) = 1/2.", "P(E2|one H) = ((2/3)(1/2))/((2/3)(1/2) + (1/3)(3/8)) = (1/3)/(11/24) = 8/11."], "answer": "8/11"}, {"number": "13.3.11", "exercise": "13.3", "question": "A manufacturer has three machine operators A, B and C. The first operator A produces 1% defective items, whereas the other two operators B and C produce 5% and 7% defective items respectively. A is on the job for 50% of the time, B is on the job for 30% of the time and C is on the job for 20% of the time. A defective item is produced, what is the probability that it was produced by A?", "page": 27, "endPage": 27, "title": "NCERT Exercise 13.3 · Question 11", "conceptIdx": 2, "steps": ["P(D) = 0.5 × 0.01 + 0.3 × 0.05 + 0.2 × 0.07 = 0.034.", "P(A|D) = 0.005/0.034 = 5/34."], "answer": "5/34"}, {"number": "13.3.12", "exercise": "13.3", "question": "A card from a pack of 52 cards is lost. From the remaining cards of the pack, two cards are drawn and are found to be both diamonds. Find the probability of the lost card being a diamond.", "page": 27, "endPage": 27, "title": "NCERT Exercise 13.3 · Question 12", "conceptIdx": 2, "steps": ["P(2D|lost diamond) = C(12,2)/C(51,2) = 22/425; P(2D|lost non-diamond) = C(13,2)/C(51,2) = 26/425.", "P(lost diamond|2D) = (1/4 × 22/425)/((1/4)(22/425) + (3/4)(26/425)) = 22/100 = 11/50."], "answer": "11/50"}, {"number": "13.3.13", "exercise": "13.3", "question": "Probability that A speaks truth is 4/5. A coin is tossed. A reports that a head appears. The probability that actually there was a head is (A) 4/5 (B) 1/2 (C) 1/5 (D) 2/5.", "page": 27, "endPage": 27, "title": "NCERT Exercise 13.3 · Question 13", "conceptIdx": 2, "steps": ["P(reports H) = (1/2)(4/5) + (1/2)(1/5) = 1/2.", "P(H|reports H) = ((1/2)(4/5))/(1/2) = 4/5. Option (A)."], "answer": "(A) 4/5"}, {"number": "13.3.14", "exercise": "13.3", "question": "If A and B are two events such that A ⊂ B and P(B) ≠ 0, then which of the following is correct? (A) P(A|B) = P(A)/P(B) (B) P(A|B) < P(A) (C) P(A|B) ≥ P(A) (D) None of these.", "page": 28, "endPage": 28, "title": "NCERT Exercise 13.3 · Question 14", "conceptIdx": 2, "steps": ["A ⊂ B gives P(A ∩ B) = P(A), so P(A|B) = P(A)/P(B).", "Since P(B) ≤ 1, P(A)/P(B) ≥ P(A). Option (C)."], "answer": "(C) P(A|B) ≥ P(A)"}, {"number": "Misc.1", "exercise": "Misc", "question": "A and B are two events such that P(A) ≠ 0. Find P(B|A), if (i) A is a subset of B (ii) A ∩ B = φ.", "page": 30, "endPage": 30, "title": "NCERT Exercise Misc · Question 1", "conceptIdx": 0, "steps": ["(i) A ⊂ B gives A ∩ B = A, so P(B|A) = P(A)/P(A) = 1.", "(ii) A ∩ B = φ gives P(B|A) = 0/P(A) = 0."], "answer": "(i) 1, (ii) 0"}, {"number": "Misc.2", "exercise": "Misc", "question": "A couple has two children. (i) Find the probability that both children are males, if it is known that at least one of the children is male. (ii) Find the probability that both children are females, if it is known that the elder child is a female.", "page": 30, "endPage": 30, "title": "NCERT Exercise Misc · Question 2", "conceptIdx": 0, "steps": ["(i) Given at least one male, cases {MM, MF, FM}: P = 1/3.", "(ii) Given elder is female, cases {FM, FF}: P = 1/2."], "answer": "(i) 1/3, (ii) 1/2"}, {"number": "Misc.3", "exercise": "Misc", "question": "Suppose that 5% of men and 0.25% of women have grey hair. A grey-haired person is selected at random. What is the probability of this person being male? Assume that there are equal numbers of males and females.", "page": 30, "endPage": 30, "title": "NCERT Exercise Misc · Question 3", "conceptIdx": 0, "steps": ["P(M) = P(W) = 1/2; P(G|M) = 0.05, P(G|W) = 0.0025.", "P(M|G) = 0.05/(0.05 + 0.0025) = 0.05/0.0525 = 20/21."], "answer": "20/21"}, {"number": "Misc.4", "exercise": "Misc", "question": "Suppose that 90% of people are right-handed. What is the probability that at most 6 of a random sample of 10 people are right-handed?", "page": 30, "endPage": 30, "title": "NCERT Exercise Misc · Question 4", "conceptIdx": 0, "steps": ["X ~ Bin(10, 0.9); P(X ≤ 6) = Σ_{r=0}^{6} C(10,r)(0.9)^r(0.1)^{10−r}.", "Equals 1 − [P(7)+P(8)+P(9)+P(10)] ≈ 1 − 0.9872 = 0.0128."], "answer": "≈ 0.0128"}, {"number": "Misc.5", "exercise": "Misc", "question": "If a leap year is selected at random, what is the chance that it will contain 53 Tuesdays?", "page": 30, "endPage": 30, "title": "NCERT Exercise Misc · Question 5", "conceptIdx": 0, "steps": ["A leap year has 366 = 52 weeks + 2 days; 53 Tuesdays iff Tuesday is among the 2 extra days.", "Of the 7 possible consecutive pairs, 2 contain Tuesday: P = 2/7."], "answer": "2/7"}, {"number": "Misc.6", "exercise": "Misc", "question": "Suppose we have four boxes A, B, C and D containing coloured marbles: A: 1 red, 6 white, 3 black; B: 6 red, 2 white, 2 black; C: 8 red, 1 white, 1 black; D: 0 red, 6 white, 4 black. One box is selected at random and a marble drawn is red. What is the probability it was drawn from box A? box B? box C?", "page": 30, "endPage": 30, "title": "NCERT Exercise Misc · Question 6", "conceptIdx": 0, "steps": ["P(R) = (1/4)(1/10 + 6/10 + 8/10 + 0) = 15/40.", "P(A|R) = (1/40)/(15/40) = 1/15; P(B|R) = 6/15 = 2/5; P(C|R) = 8/15."], "answer": "A: 1/15, B: 2/5, C: 8/15"}, {"number": "Misc.7", "exercise": "Misc", "question": "Assume that the chances of a patient having a heart attack is 40%. It is also assumed that a meditation and yoga course reduces the risk of heart attack by 30% and a prescription drug reduces its chances by 25%. A patient chooses one of the two options with equal probability. Given that a randomly selected patient who went through one option suffers a heart attack, find the probability that the patient followed meditation and yoga.", "page": 31, "endPage": 31, "title": "NCERT Exercise Misc · Question 7", "conceptIdx": 0, "steps": ["P(HA|M) = 0.4 × 0.7 = 0.28; P(HA|D) = 0.4 × 0.75 = 0.30.", "P(M|HA) = 0.28/(0.28 + 0.30) = 28/58 = 14/29."], "answer": "14/29"}, {"number": "Misc.8", "exercise": "Misc", "question": "If each element of a second order determinant is either zero or one, what is the probability that the value of the determinant is positive? (Assume entries are chosen independently, each value with probability 1/2.)", "page": 31, "endPage": 31, "title": "NCERT Exercise Misc · Question 8", "conceptIdx": 0, "steps": ["ad − bc > 0 with 0/1 entries needs ad = 1 and bc = 0.", "P(ad=1) = 1/4, P(bc=0) = 3/4, so P = 3/16."], "answer": "3/16"}, {"number": "Misc.9", "exercise": "Misc", "question": "An electronic assembly consists of two subsystems A and B. From previous testing: P(A fails) = 0.2, P(B fails alone) = 0.15, P(A and B fail) = 0.15. Evaluate (i) P(A fails | B has failed) (ii) P(A fails alone).", "page": 31, "endPage": 31, "title": "NCERT Exercise Misc · Question 9", "conceptIdx": 0, "steps": ["P(B fails) = 0.15 + 0.15 = 0.30; (i) P = 0.15/0.30 = 0.5.", "(ii) P(A alone) = 0.2 − 0.15 = 0.05."], "answer": "(i) 0.5, (ii) 0.05"}, {"number": "Misc.10", "exercise": "Misc", "question": "Bag I contains 3 red and 4 black balls and Bag II contains 4 red and 5 black balls. One ball is transferred from Bag I to Bag II and then a ball is drawn from Bag II. The ball so drawn is found to be red in colour. Find the probability that the transferred ball is black.", "page": 31, "endPage": 31, "title": "NCERT Exercise Misc · Question 10", "conceptIdx": 0, "steps": ["P(R transferred) = 3/7, P(B transferred) = 4/7; P(R2|R) = 5/10, P(R2|B) = 4/10.", "P(B|R2) = ((4/7)(2/5))/((3/7)(1/2) + (4/7)(2/5)) = 16/31."], "answer": "16/31"}, {"number": "Misc.11", "exercise": "Misc", "question": "If A and B are two events such that P(A) ≠ 0 and P(B|A) = 1, then (A) A ⊂ B (B) B ⊂ A (C) B = φ (D) A = φ.", "page": 31, "endPage": 31, "title": "NCERT Exercise Misc · Question 11", "conceptIdx": 0, "steps": ["P(B|A) = 1 gives P(A ∩ B) = P(A), so A ⊂ B (up to null set).", "Option (A)."], "answer": "(A) A ⊂ B"}, {"number": "Misc.12", "exercise": "Misc", "question": "If P(A|B) > P(A), then which of the following is correct: (A) P(B|A) < P(B) (B) P(A ∩ B) < P(A)·P(B) (C) P(B|A) > P(B) (D) P(B|A) = P(B)?", "page": 32, "endPage": 32, "title": "NCERT Exercise Misc · Question 12", "conceptIdx": 0, "steps": ["P(A ∩ B)/P(B) > P(A) gives P(A ∩ B) > P(A)P(B).", "Dividing by P(A): P(B|A) > P(B). Option (C)."], "answer": "(C) P(B|A) > P(B)"}, {"number": "Misc.13", "exercise": "Misc", "question": "If A and B are any two events such that P(A) + P(B) − P(A and B) = P(A), then (A) P(B|A) = 1 (B) P(A|B) = 1 (C) P(B|A) = 0 (D) P(A|B) = 0.", "page": 32, "endPage": 32, "title": "NCERT Exercise Misc · Question 13", "conceptIdx": 0, "steps": ["The equation gives P(B) = P(A ∩ B).", "So P(A|B) = P(A ∩ B)/P(B) = 1. Option (B)."], "answer": "(B) P(A|B) = 1"}], "exerciseMap": [{"number": "13.1.1", "exercise": "13.1", "question": "Given that E and F are events such that P(E) = 0.6, P(F) = 0.3 and P(E ∩ F) = 0.2, find P(E|F) and P(F|E).", "page": 8, "endPage": 8, "title": "NCERT Exercise 13.1 · Question 1", "conceptIdx": 0, "steps": ["P(E|F) = P(E ∩ F)/P(F) = 0.2/0.3 = 2/3.", "P(F|E) = P(E ∩ F)/P(E) = 0.2/0.6 = 1/3."], "answer": "P(E|F) = 2/3, P(F|E) = 1/3"}, {"number": "13.1.2", "exercise": "13.1", "question": "Compute P(A|B), if P(B) = 0.5 and P(A ∩ B) = 0.32.", "page": 8, "endPage": 8, "title": "NCERT Exercise 13.1 · Question 2", "conceptIdx": 0, "steps": ["Use P(A|B) = P(A ∩ B)/P(B).", "P(A|B) = 0.32/0.5 = 0.64."], "answer": "P(A|B) = 0.64"}, {"number": "13.1.3", "exercise": "13.1", "question": "If P(A) = 0.8, P(B) = 0.5 and P(B|A) = 0.4, find (i) P(A ∩ B) (ii) P(A|B) (iii) P(A ∪ B).", "page": 8, "endPage": 8, "title": "NCERT Exercise 13.1 · Question 3", "conceptIdx": 0, "steps": ["(i) P(A ∩ B) = P(A)·P(B|A) = 0.8 × 0.4 = 0.32.", "(ii) P(A|B) = P(A ∩ B)/P(B) = 0.32/0.5 = 0.64.", "(iii) P(A ∪ B) = P(A) + P(B) − P(A ∩ B) = 0.8 + 0.5 − 0.32 = 0.98."], "answer": "(i) 0.32, (ii) 0.64, (iii) 0.98"}, {"number": "13.1.4", "exercise": "13.1", "question": "Evaluate P(A ∪ B), if 2P(A) = P(B) = 5/13 and P(A|B) = 2/5.", "page": 8, "endPage": 8, "title": "NCERT Exercise 13.1 · Question 4", "conceptIdx": 0, "steps": ["P(A) = 5/26, P(B) = 5/13.", "P(A ∩ B) = P(B)·P(A|B) = (5/13)(2/5) = 2/13.", "P(A ∪ B) = 5/26 + 5/13 − 2/13 = 11/26."], "answer": "P(A ∪ B) = 11/26"}, {"number": "13.1.5", "exercise": "13.1", "question": "If P(A) = 6/11, P(B) = 5/11 and P(A ∪ B) = 7/11, find (i) P(A ∩ B) (ii) P(A|B) (iii) P(B|A).", "page": 8, "endPage": 8, "title": "NCERT Exercise 13.1 · Question 5", "conceptIdx": 0, "steps": ["(i) P(A ∩ B) = 6/11 + 5/11 − 7/11 = 4/11.", "(ii) P(A|B) = (4/11)/(5/11) = 4/5.", "(iii) P(B|A) = (4/11)/(6/11) = 2/3."], "answer": "(i) 4/11, (ii) 4/5, (iii) 2/3"}, {"number": "13.1.6", "exercise": "13.1", "question": "Determine P(E|F) if a coin is tossed three times, where (i) E: head on third toss, F: heads on first two tosses (ii) E: at least two heads, F: at most two heads (iii) E: at most two tails, F: at least one tail.", "page": 8, "endPage": 8, "title": "NCERT Exercise 13.1 · Question 6", "conceptIdx": 0, "steps": ["Sample space has 8 outcomes. (i) |F| = 2, |E ∩ F| = 1, so P = 1/2.", "(ii) |F| = 7, |E ∩ F| = 3, so P = 3/7.", "(iii) |F| = 7, |E ∩ F| = 6, so P = 6/7."], "answer": "(i) 1/2, (ii) 3/7, (iii) 6/7"}, {"number": "13.1.7", "exercise": "13.1", "question": "Determine P(E|F) if two coins are tossed once, where (i) E: tail appears on one coin, F: one coin shows head (ii) E: no tail appears, F: no head appears.", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 7", "conceptIdx": 0, "steps": ["(i) F = {HH, HT, TH}, E ∩ F = {HT, TH}, so P = 2/3.", "(ii) F = {TT}, E = {HH}, E ∩ F = φ, so P = 0."], "answer": "(i) 2/3, (ii) 0"}, {"number": "13.1.8", "exercise": "13.1", "question": "Determine P(E|F) if a die is thrown three times, E: 4 appears on the third toss, F: 6 and 5 appear respectively on the first two tosses.", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 8", "conceptIdx": 0, "steps": ["|F| = 6 outcomes (6, 5, ·), |E ∩ F| = 1 outcome (6, 5, 4).", "P(E|F) = 1/6."], "answer": "1/6"}, {"number": "13.1.9", "exercise": "13.1", "question": "Determine P(E|F) if mother, father and son line up at random for a family picture, E: son on one end, F: father in middle.", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 9", "conceptIdx": 0, "steps": ["|F| = 2 arrangements (father fixed in middle), both have son on an end.", "P(E|F) = 2/2 = 1."], "answer": "1"}, {"number": "13.1.10", "exercise": "13.1", "question": "A black and a red die are rolled. (a) Find the conditional probability of obtaining a sum greater than 9, given that the black die resulted in a 5. (b) Find the conditional probability of obtaining the sum 8, given that the red die resulted in a number less than 4.", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 10", "conceptIdx": 0, "steps": ["(a) Given black 5, 6 cases; sums > 9 are (5,5),(5,6): 2/6 = 1/3.", "(b) Given red ∈ {1,2,3}, 18 cases; sum 8 needs (6,2),(5,3): 2/18 = 1/9."], "answer": "(a) 1/3, (b) 1/9"}, {"number": "13.1.11", "exercise": "13.1", "question": "A fair die is rolled. Consider events E = {1,3,5}, F = {2,3} and G = {2,3,4,5}. Find (i) P(E|F) and P(F|E) (ii) P(E|G) and P(G|E) (iii) P((E ∪ F)|G) and P((E ∩ F)|G).", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 11", "conceptIdx": 0, "steps": ["(i) E ∩ F = {3}: P(E|F) = 1/2, P(F|E) = 1/3.", "(ii) E ∩ G = {3,5}: P(E|G) = 2/4 = 1/2, P(G|E) = 2/3.", "(iii) E ∪ F = {1,2,3,5}: P((E ∪ F)|G) = 3/4; P((E ∩ F)|G) = 1/4."], "answer": "(i) 1/2, 1/3; (ii) 1/2, 2/3; (iii) 3/4, 1/4"}, {"number": "13.1.12", "exercise": "13.1", "question": "Assume that each born child is equally likely to be a boy or a girl. If a family has two children, what is the conditional probability that both are girls given that (i) the youngest is a girl, (ii) at least one is a girl?", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 12", "conceptIdx": 0, "steps": ["(i) Given youngest is a girl, cases {GG, BG}: P = 1/2.", "(ii) Given at least one girl, cases {GG, BG, GB}: P = 1/3."], "answer": "(i) 1/2, (ii) 1/3"}, {"number": "13.1.13", "exercise": "13.1", "question": "An instructor has a question bank consisting of 300 easy True/False questions, 200 difficult True/False questions, 500 easy multiple choice questions and 400 difficult multiple choice questions. If a question is selected at random from the question bank, what is the probability that it will be an easy question given that it is a multiple choice question?", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 13", "conceptIdx": 0, "steps": ["900 multiple choice questions, of which 500 are easy.", "P = 500/900 = 5/9."], "answer": "5/9"}, {"number": "13.1.14", "exercise": "13.1", "question": "Given that the two numbers appearing on throwing two dice are different, find the probability of the event 'the sum of numbers on the dice is 4'.", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 14", "conceptIdx": 0, "steps": ["30 outcomes with different numbers.", "Sum 4 needs (1,3),(3,1): 2 outcomes, so P = 2/30 = 1/15."], "answer": "1/15"}, {"number": "13.1.15", "exercise": "13.1", "question": "Consider the experiment of throwing a die, if a multiple of 3 comes up, throw the die again and if any other number comes, toss a coin. Find the conditional probability of the event 'the coin shows a tail', given that 'at least one die shows a 3'.", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 15", "conceptIdx": 0, "steps": ["A coin is tossed only when the first die is not 3 or 6, so no die shows 3 then.", "Hence A ∩ B = φ and P = 0."], "answer": "0"}, {"number": "13.1.16", "exercise": "13.1", "question": "If P(A) = 1/2, P(B) = 0, then P(A|B) is (A) 0 (B) 1/2 (C) not defined (D) 1.", "page": 9, "endPage": 9, "title": "NCERT Exercise 13.1 · Question 16", "conceptIdx": 0, "steps": ["P(A|B) = P(A ∩ B)/P(B) requires division by P(B) = 0.", "Hence it is not defined. Option (C)."], "answer": "(C) not defined"}, {"number": "13.1.17", "exercise": "13.1", "question": "If A and B are events such that P(A|B) = P(B|A), then (A) A ⊂ B but A ≠ B (B) A = B (C) A ∩ B = φ (D) P(A) = P(B).", "page": 10, "endPage": 10, "title": "NCERT Exercise 13.1 · Question 17", "conceptIdx": 0, "steps": ["P(A ∩ B)/P(B) = P(A ∩ B)/P(A) gives P(A) = P(B).", "Option (D)."], "answer": "(D) P(A) = P(B)"}, {"number": "13.2.1", "exercise": "13.2", "question": "If P(A) = 3/5 and P(B) = 1/5, find P(A ∩ B) if A and B are independent events.", "page": 16, "endPage": 16, "title": "NCERT Exercise 13.2 · Question 1", "conceptIdx": 1, "steps": ["For independent events P(A ∩ B) = P(A)·P(B).", "P = (3/5)(1/5) = 3/25."], "answer": "3/25"}, {"number": "13.2.2", "exercise": "13.2", "question": "Two cards are drawn at random and without replacement from a pack of 52 playing cards. Find the probability that both the cards are black.", "page": 16, "endPage": 16, "title": "NCERT Exercise 13.2 · Question 2", "conceptIdx": 1, "steps": ["P(first black) = 26/52, P(second black | first black) = 25/51.", "P = (26/52)(25/51) = 25/102."], "answer": "25/102"}, {"number": "13.2.3", "exercise": "13.2", "question": "A box of oranges is inspected by examining three randomly selected oranges drawn without replacement. If all the three oranges are good, the box is approved for sale, otherwise, it is rejected. Find the probability that a box containing 15 oranges out of which 12 are good and 3 are bad ones will be approved for sale.", "page": 16, "endPage": 16, "title": "NCERT Exercise 13.2 · Question 3", "conceptIdx": 1, "steps": ["P = (12/15)(11/14)(10/13).", "P = 1320/2730 = 44/91."], "answer": "44/91"}, {"number": "13.2.4", "exercise": "13.2", "question": "A fair coin and an unbiased die are tossed. Let A be the event 'head appears on the coin' and B be the event '3 on the die'. Check whether A and B are independent events or not.", "page": 16, "endPage": 16, "title": "NCERT Exercise 13.2 · Question 4", "conceptIdx": 1, "steps": ["P(A) = 1/2, P(B) = 1/6, P(A ∩ B) = 1/12.", "P(A)·P(B) = 1/12 = P(A ∩ B), so A and B are independent."], "answer": "Yes, A and B are independent"}, {"number": "13.2.5", "exercise": "13.2", "question": "A die marked 1, 2, 3 in red and 4, 5, 6 in green is tossed. Let A be the event, 'the number is even,' and B be the event, 'the number is red'. Are A and B independent?", "page": 16, "endPage": 16, "title": "NCERT Exercise 13.2 · Question 5", "conceptIdx": 1, "steps": ["P(A) = 3/6 = 1/2, P(B) = 3/6 = 1/2, P(A ∩ B) = P({2}) = 1/6.", "P(A)·P(B) = 1/4 ≠ 1/6, so A and B are not independent."], "answer": "No, A and B are not independent"}, {"number": "13.2.6", "exercise": "13.2", "question": "Let E and F be events with P(E) = 3/5, P(F) = 3/10 and P(E ∩ F) = 1/5. Are E and F independent?", "page": 16, "endPage": 16, "title": "NCERT Exercise 13.2 · Question 6", "conceptIdx": 1, "steps": ["P(E)·P(F) = (3/5)(3/10) = 9/50.", "9/50 ≠ 1/5, so E and F are not independent."], "answer": "No, E and F are not independent"}, {"number": "13.2.7", "exercise": "13.2", "question": "Given that the events A and B are such that P(A) = 1/2, P(A ∪ B) = 3/5 and P(B) = p. Find p if they are (i) mutually exclusive (ii) independent.", "page": 17, "endPage": 17, "title": "NCERT Exercise 13.2 · Question 7", "conceptIdx": 1, "steps": ["(i) Mutually exclusive: 1/2 + p = 3/5, so p = 1/10.", "(ii) Independent: 3/5 = 1/2 + p − p/2, so p/2 = 1/10 and p = 1/5."], "answer": "(i) p = 1/10, (ii) p = 1/5"}, {"number": "13.2.8", "exercise": "13.2", "question": "Let A and B be independent events with P(A) = 0.3 and P(B) = 0.4. Find (i) P(A ∩ B) (ii) P(A ∪ B) (iii) P(A|B) (iv) P(B|A). Also: if P(A) = 1/4, P(B) = 1/2 and P(A ∩ B) = 1/8, find P(not A and not B). Also: events A and B have P(A) = 1/2, P(B) = 7/12 and P(not A or not B) = 1/4; state whether A and B are independent.", "page": 17, "endPage": 17, "title": "NCERT Exercise 13.2 · Question 8", "conceptIdx": 1, "steps": ["(i) 0.3 × 0.4 = 0.12; (ii) 0.3 + 0.4 − 0.12 = 0.58; (iii) 0.3; (iv) 0.4.", "P(not A and not B) = 1 − (1/4 + 1/2 − 1/8) = 3/8.", "P(A ∩ B) = 1 − 1/4 = 3/4 ≠ (1/2)(7/12) = 7/24, so not independent."], "answer": "(i) 0.12, (ii) 0.58, (iii) 0.3, (iv) 0.4; P(not A and not B) = 3/8; A and B are not independent"}, {"number": "13.2.11", "exercise": "13.2", "question": "Given two independent events A and B such that P(A) = 0.3, P(B) = 0.6. Find (i) P(A and B) (ii) P(A and not B) (iii) P(A or B) (iv) P(neither A nor B).", "page": 17, "endPage": 17, "title": "NCERT Exercise 13.2 · Question 11", "conceptIdx": 1, "steps": ["(i) 0.3 × 0.6 = 0.18; (ii) 0.3 × 0.4 = 0.12.", "(iii) 0.3 + 0.6 − 0.18 = 0.72; (iv) 1 − 0.72 = 0.28."], "answer": "(i) 0.18, (ii) 0.12, (iii) 0.72, (iv) 0.28"}, {"number": "13.2.12", "exercise": "13.2", "question": "A die is tossed thrice. Find the probability of getting an odd number at least once.", "page": 17, "endPage": 17, "title": "NCERT Exercise 13.2 · Question 12", "conceptIdx": 1, "steps": ["P(no odd in 3 tosses) = (1/2)³ = 1/8.", "P(at least one odd) = 1 − 1/8 = 7/8."], "answer": "7/8"}, {"number": "13.2.13", "exercise": "13.2", "question": "Two balls are drawn at random with replacement from a box containing 10 black and 8 red balls. Find the probability that (i) both balls are red (ii) first ball is black and second is red (iii) one of them is black and the other is red.", "page": 17, "endPage": 17, "title": "NCERT Exercise 13.2 · Question 13", "conceptIdx": 1, "steps": ["(i) (8/18)² = 16/81.", "(ii) (10/18)(8/18) = 20/81.", "(iii) 2 × (10/18)(8/18) = 40/81."], "answer": "(i) 16/81, (ii) 20/81, (iii) 40/81"}, {"number": "13.2.14", "exercise": "13.2", "question": "Probability of solving a specific problem independently by A and B are 1/2 and 1/3 respectively. If both try to solve the problem independently, find the probability that (i) the problem is solved (ii) exactly one of them solves the problem.", "page": 17, "endPage": 17, "title": "NCERT Exercise 13.2 · Question 14", "conceptIdx": 1, "steps": ["(i) P(solved) = 1 − (1/2)(2/3) = 2/3.", "(ii) P(exactly one) = (1/2)(2/3) + (1/2)(1/3) = 1/2."], "answer": "(i) 2/3, (ii) 1/2"}, {"number": "13.2.15", "exercise": "13.2", "question": "One card is drawn at random from a well shuffled deck of 52 cards. In which of the following cases are the events E and F independent? (i) E: 'the card drawn is a spade' F: 'the card drawn is an ace' (ii) E: 'the card drawn is black' F: 'the card drawn is a king' (iii) E: 'the card drawn is a king or queen' F: 'the card drawn is a queen or jack'.", "page": 17, "endPage": 17, "title": "NCERT Exercise 13.2 · Question 15", "conceptIdx": 1, "steps": ["(i) 1/4 × 1/13 = 1/52 = P(E ∩ F): independent.", "(ii) 1/2 × 1/13 = 1/26 = P(E ∩ F): independent.", "(iii) P(E)·P(F) = 4/169 ≠ 1/13 = P(E ∩ F): not independent."], "answer": "(i) independent, (ii) independent, (iii) not independent"}, {"number": "13.2.16", "exercise": "13.2", "question": "In a hostel, 60% of the students read Hindi newspaper, 40% read English newspaper and 20% read both Hindi and English newspapers. A student is selected at random. (a) Find the probability that she reads neither Hindi nor English newspapers. (b) If she reads Hindi newspaper, find the probability that she reads English newspaper. (c) If she reads English newspaper, find the probability that she reads Hindi newspaper.", "page": 18, "endPage": 18, "title": "NCERT Exercise 13.2 · Question 16", "conceptIdx": 1, "steps": ["(a) 1 − 0.6 − 0.4 + 0.2 = 0.2.", "(b) 0.2/0.6 = 1/3; (c) 0.2/0.4 = 1/2."], "answer": "(a) 0.2, (b) 1/3, (c) 1/2"}, {"number": "13.2.17", "exercise": "13.2", "question": "The probability of obtaining an even prime number on each die, when a pair of dice is rolled is (A) 0 (B) 1/3 (C) 1/12 (D) 1/36.", "page": 18, "endPage": 18, "title": "NCERT Exercise 13.2 · Question 17", "conceptIdx": 1, "steps": ["Even prime is 2 only: probability 1/6 on each die.", "P = (1/6)(1/6) = 1/36. Option (D)."], "answer": "(D) 1/36"}, {"number": "13.2.18", "exercise": "13.2", "question": "Two events A and B will be independent, if (A) A and B are mutually exclusive (B) P(A′B′) = [1 − P(A)][1 − P(B)] (C) P(A) = P(B) (D) P(A) + P(B) = 1.", "page": 18, "endPage": 18, "title": "NCERT Exercise 13.2 · Question 18", "conceptIdx": 1, "steps": ["P(A′ ∩ B′) = P(A′)P(B′) is exactly the independence condition.", "Option (B)."], "answer": "(B) P(A′B′) = [1 − P(A)][1 − P(B)]"}, {"number": "13.3.1", "exercise": "13.3", "question": "An urn contains 5 red and 5 black balls. A ball is drawn at random, its colour is noted and is returned to the urn. Moreover, 2 additional balls of the colour drawn are put in the urn and then a ball is drawn at random. What is the probability that the second ball is red?", "page": 26, "endPage": 26, "title": "NCERT Exercise 13.3 · Question 1", "conceptIdx": 2, "steps": ["P(R2) = P(R1)P(R2|R1) + P(B1)P(R2|B1).", "P = (1/2)(7/12) + (1/2)(5/12) = 1/2."], "answer": "1/2"}, {"number": "13.3.2", "exercise": "13.3", "question": "A bag contains 4 red and 4 black balls, another bag contains 2 red and 6 black balls. One of the two bags is selected at random and a ball is drawn from the bag which is found to be red. Find the probability that the ball is drawn from the first bag.", "page": 26, "endPage": 26, "title": "NCERT Exercise 13.3 · Question 2", "conceptIdx": 2, "steps": ["P(E1) = P(E2) = 1/2; P(R|E1) = 4/8, P(R|E2) = 2/8.", "By Bayes: P(E1|R) = (1/2 × 4/8)/((1/2)(4/8) + (1/2)(2/8)) = 2/3."], "answer": "2/3"}, {"number": "13.3.3", "exercise": "13.3", "question": "Of the students in a college, it is known that 60% reside in hostel and 40% are day scholars (not residing in hostel). Previous year results report that 30% of all students who reside in hostel attain A grade and 20% of day scholars attain A grade in their annual examination. At the end of the year, one student is chosen at random from the college and he has an A grade, what is the probability that the student is a hostelier?", "page": 26, "endPage": 26, "title": "NCERT Exercise 13.3 · Question 3", "conceptIdx": 2, "steps": ["P(H) = 0.6, P(D) = 0.4; P(A|H) = 0.3, P(A|D) = 0.2.", "P(H|A) = (0.6 × 0.3)/(0.6 × 0.3 + 0.4 × 0.2) = 0.18/0.26 = 9/13."], "answer": "9/13"}, {"number": "13.3.4", "exercise": "13.3", "question": "In answering a question on a multiple choice test, a student either knows the answer or guesses. Let 3/4 be the probability that he knows the answer and 1/4 be the probability that he guesses. Assuming that a student who guesses at the answer will be correct with probability 1/4, what is the probability that the student knows the answer given that he answered it correctly?", "page": 26, "endPage": 26, "title": "NCERT Exercise 13.3 · Question 4", "conceptIdx": 2, "steps": ["P(K) = 3/4, P(G) = 1/4; P(C|K) = 1, P(C|G) = 1/4.", "P(K|C) = (3/4)/((3/4) + (1/4)(1/4)) = (3/4)/(13/16) = 12/13."], "answer": "12/13"}, {"number": "13.3.5", "exercise": "13.3", "question": "A laboratory blood test is 99% effective in detecting a certain disease when it is in fact present. However, the test also yields a false positive result for 0.5% of the healthy persons tested (i.e. if a healthy person is tested, then with probability 0.005 the test will imply he has the disease). If 0.1 percent of the population actually has the disease, what is the probability that a person has the disease given that his test result is positive?", "page": 26, "endPage": 26, "title": "NCERT Exercise 13.3 · Question 5", "conceptIdx": 2, "steps": ["P(D) = 0.001, P(+|D) = 0.99; P(+|D′) = 0.005.", "P(D|+) = 0.00099/(0.00099 + 0.999 × 0.005) = 22/133 ≈ 0.165."], "answer": "22/133 ≈ 0.165"}, {"number": "13.3.6", "exercise": "13.3", "question": "There are three coins. One is a two-headed coin (having head on both faces), another is a biased coin that comes up heads 75% of the time and the third is an unbiased coin. One of the three coins is chosen at random and tossed, it shows heads. What is the probability that it was the two-headed coin?", "page": 27, "endPage": 27, "title": "NCERT Exercise 13.3 · Question 6", "conceptIdx": 2, "steps": ["P(H) = (1/3)(1 + 3/4 + 1/2) = (1/3)(9/4) = 3/4.", "P(two-headed|H) = ((1/3)(1))/(3/4) = 4/9."], "answer": "4/9"}, {"number": "13.3.7", "exercise": "13.3", "question": "An insurance company insured 2000 scooter drivers, 4000 car drivers and 6000 truck drivers. The probabilities of accidents are 0.01, 0.03 and 0.15 respectively. One of the insured persons meets with an accident. What is the probability that he is a scooter driver?", "page": 27, "endPage": 27, "title": "NCERT Exercise 13.3 · Question 7", "conceptIdx": 2, "steps": ["P(S) = 2000/12000 = 1/6, P(C) = 1/3, P(T) = 1/2.", "P(S|A) = (1/6 × 0.01)/((1/6)(0.01) + (1/3)(0.03) + (1/2)(0.15)) = 20/1040 = 1/52."], "answer": "1/52"}, {"number": "13.3.8", "exercise": "13.3", "question": "A factory has two machines A and B. Past record shows that machine A produced 60% of the items of output and machine B produced 40% of the items. Further, 2% of the items produced by machine A and 1% produced by machine B were defective. All the items are put into one stockpile and then one item is chosen at random from this and is found to be defective. What is the probability that it was produced by machine B?", "page": 27, "endPage": 27, "title": "NCERT Exercise 13.3 · Question 8", "conceptIdx": 2, "steps": ["P(D) = 0.6 × 0.02 + 0.4 × 0.01 = 0.016.", "P(B|D) = 0.004/0.016 = 1/4."], "answer": "1/4"}, {"number": "13.3.9", "exercise": "13.3", "question": "Two groups are competing for the position on the Board of directors of a corporation. The probabilities that the first and the second groups will win are 0.6 and 0.4 respectively. Further, if the first group wins, the probability of introducing a new product is 0.7 and the corresponding probability is 0.3 if the second group wins. Find the probability that the new product introduced was by the second group.", "page": 27, "endPage": 27, "title": "NCERT Exercise 13.3 · Question 9", "conceptIdx": 2, "steps": ["P(new) = 0.6 × 0.7 + 0.4 × 0.3 = 0.54.", "P(G2|new) = 0.12/0.54 = 2/9."], "answer": "2/9"}, {"number": "13.3.10", "exercise": "13.3", "question": "Suppose a girl throws a die. If she gets a 5 or 6, she tosses a coin three times and notes the number of heads. If she gets 1, 2, 3 or 4, she tosses a coin once and notes whether a head or tail is obtained. If she obtained exactly one head, what is the probability that she threw 1, 2, 3 or 4 with the die?", "page": 27, "endPage": 27, "title": "NCERT Exercise 13.3 · Question 10", "conceptIdx": 2, "steps": ["P(E1) = 1/3 (5 or 6), P(one H|E1) = 3/8; P(E2) = 2/3, P(one H|E2) = 1/2.", "P(E2|one H) = ((2/3)(1/2))/((2/3)(1/2) + (1/3)(3/8)) = (1/3)/(11/24) = 8/11."], "answer": "8/11"}, {"number": "13.3.11", "exercise": "13.3", "question": "A manufacturer has three machine operators A, B and C. The first operator A produces 1% defective items, whereas the other two operators B and C produce 5% and 7% defective items respectively. A is on the job for 50% of the time, B is on the job for 30% of the time and C is on the job for 20% of the time. A defective item is produced, what is the probability that it was produced by A?", "page": 27, "endPage": 27, "title": "NCERT Exercise 13.3 · Question 11", "conceptIdx": 2, "steps": ["P(D) = 0.5 × 0.01 + 0.3 × 0.05 + 0.2 × 0.07 = 0.034.", "P(A|D) = 0.005/0.034 = 5/34."], "answer": "5/34"}, {"number": "13.3.12", "exercise": "13.3", "question": "A card from a pack of 52 cards is lost. From the remaining cards of the pack, two cards are drawn and are found to be both diamonds. Find the probability of the lost card being a diamond.", "page": 27, "endPage": 27, "title": "NCERT Exercise 13.3 · Question 12", "conceptIdx": 2, "steps": ["P(2D|lost diamond) = C(12,2)/C(51,2) = 22/425; P(2D|lost non-diamond) = C(13,2)/C(51,2) = 26/425.", "P(lost diamond|2D) = (1/4 × 22/425)/((1/4)(22/425) + (3/4)(26/425)) = 22/100 = 11/50."], "answer": "11/50"}, {"number": "13.3.13", "exercise": "13.3", "question": "Probability that A speaks truth is 4/5. A coin is tossed. A reports that a head appears. The probability that actually there was a head is (A) 4/5 (B) 1/2 (C) 1/5 (D) 2/5.", "page": 27, "endPage": 27, "title": "NCERT Exercise 13.3 · Question 13", "conceptIdx": 2, "steps": ["P(reports H) = (1/2)(4/5) + (1/2)(1/5) = 1/2.", "P(H|reports H) = ((1/2)(4/5))/(1/2) = 4/5. Option (A)."], "answer": "(A) 4/5"}, {"number": "13.3.14", "exercise": "13.3", "question": "If A and B are two events such that A ⊂ B and P(B) ≠ 0, then which of the following is correct? (A) P(A|B) = P(A)/P(B) (B) P(A|B) < P(A) (C) P(A|B) ≥ P(A) (D) None of these.", "page": 28, "endPage": 28, "title": "NCERT Exercise 13.3 · Question 14", "conceptIdx": 2, "steps": ["A ⊂ B gives P(A ∩ B) = P(A), so P(A|B) = P(A)/P(B).", "Since P(B) ≤ 1, P(A)/P(B) ≥ P(A). Option (C)."], "answer": "(C) P(A|B) ≥ P(A)"}, {"number": "Misc.1", "exercise": "Misc", "question": "A and B are two events such that P(A) ≠ 0. Find P(B|A), if (i) A is a subset of B (ii) A ∩ B = φ.", "page": 30, "endPage": 30, "title": "NCERT Exercise Misc · Question 1", "conceptIdx": 0, "steps": ["(i) A ⊂ B gives A ∩ B = A, so P(B|A) = P(A)/P(A) = 1.", "(ii) A ∩ B = φ gives P(B|A) = 0/P(A) = 0."], "answer": "(i) 1, (ii) 0"}, {"number": "Misc.2", "exercise": "Misc", "question": "A couple has two children. (i) Find the probability that both children are males, if it is known that at least one of the children is male. (ii) Find the probability that both children are females, if it is known that the elder child is a female.", "page": 30, "endPage": 30, "title": "NCERT Exercise Misc · Question 2", "conceptIdx": 0, "steps": ["(i) Given at least one male, cases {MM, MF, FM}: P = 1/3.", "(ii) Given elder is female, cases {FM, FF}: P = 1/2."], "answer": "(i) 1/3, (ii) 1/2"}, {"number": "Misc.3", "exercise": "Misc", "question": "Suppose that 5% of men and 0.25% of women have grey hair. A grey-haired person is selected at random. What is the probability of this person being male? Assume that there are equal numbers of males and females.", "page": 30, "endPage": 30, "title": "NCERT Exercise Misc · Question 3", "conceptIdx": 0, "steps": ["P(M) = P(W) = 1/2; P(G|M) = 0.05, P(G|W) = 0.0025.", "P(M|G) = 0.05/(0.05 + 0.0025) = 0.05/0.0525 = 20/21."], "answer": "20/21"}, {"number": "Misc.4", "exercise": "Misc", "question": "Suppose that 90% of people are right-handed. What is the probability that at most 6 of a random sample of 10 people are right-handed?", "page": 30, "endPage": 30, "title": "NCERT Exercise Misc · Question 4", "conceptIdx": 0, "steps": ["X ~ Bin(10, 0.9); P(X ≤ 6) = Σ_{r=0}^{6} C(10,r)(0.9)^r(0.1)^{10−r}.", "Equals 1 − [P(7)+P(8)+P(9)+P(10)] ≈ 1 − 0.9872 = 0.0128."], "answer": "≈ 0.0128"}, {"number": "Misc.5", "exercise": "Misc", "question": "If a leap year is selected at random, what is the chance that it will contain 53 Tuesdays?", "page": 30, "endPage": 30, "title": "NCERT Exercise Misc · Question 5", "conceptIdx": 0, "steps": ["A leap year has 366 = 52 weeks + 2 days; 53 Tuesdays iff Tuesday is among the 2 extra days.", "Of the 7 possible consecutive pairs, 2 contain Tuesday: P = 2/7."], "answer": "2/7"}, {"number": "Misc.6", "exercise": "Misc", "question": "Suppose we have four boxes A, B, C and D containing coloured marbles: A: 1 red, 6 white, 3 black; B: 6 red, 2 white, 2 black; C: 8 red, 1 white, 1 black; D: 0 red, 6 white, 4 black. One box is selected at random and a marble drawn is red. What is the probability it was drawn from box A? box B? box C?", "page": 30, "endPage": 30, "title": "NCERT Exercise Misc · Question 6", "conceptIdx": 0, "steps": ["P(R) = (1/4)(1/10 + 6/10 + 8/10 + 0) = 15/40.", "P(A|R) = (1/40)/(15/40) = 1/15; P(B|R) = 6/15 = 2/5; P(C|R) = 8/15."], "answer": "A: 1/15, B: 2/5, C: 8/15"}, {"number": "Misc.7", "exercise": "Misc", "question": "Assume that the chances of a patient having a heart attack is 40%. It is also assumed that a meditation and yoga course reduces the risk of heart attack by 30% and a prescription drug reduces its chances by 25%. A patient chooses one of the two options with equal probability. Given that a randomly selected patient who went through one option suffers a heart attack, find the probability that the patient followed meditation and yoga.", "page": 31, "endPage": 31, "title": "NCERT Exercise Misc · Question 7", "conceptIdx": 0, "steps": ["P(HA|M) = 0.4 × 0.7 = 0.28; P(HA|D) = 0.4 × 0.75 = 0.30.", "P(M|HA) = 0.28/(0.28 + 0.30) = 28/58 = 14/29."], "answer": "14/29"}, {"number": "Misc.8", "exercise": "Misc", "question": "If each element of a second order determinant is either zero or one, what is the probability that the value of the determinant is positive? (Assume entries are chosen independently, each value with probability 1/2.)", "page": 31, "endPage": 31, "title": "NCERT Exercise Misc · Question 8", "conceptIdx": 0, "steps": ["ad − bc > 0 with 0/1 entries needs ad = 1 and bc = 0.", "P(ad=1) = 1/4, P(bc=0) = 3/4, so P = 3/16."], "answer": "3/16"}, {"number": "Misc.9", "exercise": "Misc", "question": "An electronic assembly consists of two subsystems A and B. From previous testing: P(A fails) = 0.2, P(B fails alone) = 0.15, P(A and B fail) = 0.15. Evaluate (i) P(A fails | B has failed) (ii) P(A fails alone).", "page": 31, "endPage": 31, "title": "NCERT Exercise Misc · Question 9", "conceptIdx": 0, "steps": ["P(B fails) = 0.15 + 0.15 = 0.30; (i) P = 0.15/0.30 = 0.5.", "(ii) P(A alone) = 0.2 − 0.15 = 0.05."], "answer": "(i) 0.5, (ii) 0.05"}, {"number": "Misc.10", "exercise": "Misc", "question": "Bag I contains 3 red and 4 black balls and Bag II contains 4 red and 5 black balls. One ball is transferred from Bag I to Bag II and then a ball is drawn from Bag II. The ball so drawn is found to be red in colour. Find the probability that the transferred ball is black.", "page": 31, "endPage": 31, "title": "NCERT Exercise Misc · Question 10", "conceptIdx": 0, "steps": ["P(R transferred) = 3/7, P(B transferred) = 4/7; P(R2|R) = 5/10, P(R2|B) = 4/10.", "P(B|R2) = ((4/7)(2/5))/((3/7)(1/2) + (4/7)(2/5)) = 16/31."], "answer": "16/31"}, {"number": "Misc.11", "exercise": "Misc", "question": "If A and B are two events such that P(A) ≠ 0 and P(B|A) = 1, then (A) A ⊂ B (B) B ⊂ A (C) B = φ (D) A = φ.", "page": 31, "endPage": 31, "title": "NCERT Exercise Misc · Question 11", "conceptIdx": 0, "steps": ["P(B|A) = 1 gives P(A ∩ B) = P(A), so A ⊂ B (up to null set).", "Option (A)."], "answer": "(A) A ⊂ B"}, {"number": "Misc.12", "exercise": "Misc", "question": "If P(A|B) > P(A), then which of the following is correct: (A) P(B|A) < P(B) (B) P(A ∩ B) < P(A)·P(B) (C) P(B|A) > P(B) (D) P(B|A) = P(B)?", "page": 32, "endPage": 32, "title": "NCERT Exercise Misc · Question 12", "conceptIdx": 0, "steps": ["P(A ∩ B)/P(B) > P(A) gives P(A ∩ B) > P(A)P(B).", "Dividing by P(A): P(B|A) > P(B). Option (C)."], "answer": "(C) P(B|A) > P(B)"}, {"number": "Misc.13", "exercise": "Misc", "question": "If A and B are any two events such that P(A) + P(B) − P(A and B) = P(A), then (A) P(B|A) = 1 (B) P(A|B) = 1 (C) P(B|A) = 0 (D) P(A|B) = 0.", "page": 32, "endPage": 32, "title": "NCERT Exercise Misc · Question 13", "conceptIdx": 0, "steps": ["The equation gives P(B) = P(A ∩ B).", "So P(A|B) = P(A ∩ B)/P(B) = 1. Option (B)."], "answer": "(B) P(A|B) = 1"}], "pageOffset": 405, "printPageStart": 406, "printPageEnd": 438, "paginationProvenance": "folio-read-21-samples"};</script>
  <script>(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
