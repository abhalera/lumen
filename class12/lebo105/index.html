      '<div class="predict-actions">' +
      '<button class="btn-primary" id="btn-check-prediction">Check Prediction</button>' +
      '<button class="btn-secondary" id="btn-skip-prediction">Skip to Lab</button>' +
      '</div>' +
      '<div id="predict-feedback-box" class="predict-feedback" style="display:none;"></div>' +
      '</section>';

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();
    var whatWatch = l.watch || (typeof l.predict === 'string' ? l.predict : "Explore the simulation controls and readouts below.");
    html += '<section class="lab-card" data-block="play" aria-label="Play">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +
      '<div id="sim-mount-point" class="sim-mount-container" style="width:100%;min-height:220px;margin-top:12px;">' +
        '<div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 720 300" role="img" aria-label="' + simTitle + '"></svg></div>' +
        '<div class="lab-legend" id="lab-legend"></div>' +
        '<div class="lab-toolbar" id="legacy-lab-toolbar">' +
          '<button class="toolbar-btn primary" id="btn-play-pause" aria-label="Play animation">▶ Play</button>' +
          '<button class="toolbar-btn" id="btn-step-fwd" aria-label="Step forward">⏭ Step</button>' +
          '<button class="toolbar-btn" id="btn-reset-time" aria-label="Reset timeline">↺ Reset</button>' +
          '<span class="time-display" id="time-display">t = <b>0.0 s</b></span>' +
          '<div class="scrubber-wrap">' +
            '<input type="range" id="time-scrubber" class="timeline-scrubber" min="0" max="6" step="0.1" value="0" aria-label="Timeline time scrubber">' +
          '</div>' +
        '</div>' +
        '<div class="preset-bar" id="preset-bar"></div>' +
        '<div class="lab-controls-grid" id="lab-controls"></div>' +
        '<div class="lab-readout" id="lab-readout"></div>' +
        '<div class="lab-verdict" id="lab-verdict" role="status" aria-live="polite"></div>' +
      '</div>' +
      '</section>';

    // 04 CONNECT BLOCK
    var connectItems = l.connect || [];
    if(connectItems.length) html += '<section class="connect-section" data-block="connect" aria-label="Connect">' +
      '<span class="block-tag">04 · CONNECT · REAL WORLD APPLICATIONS</span>' +
      '<div class="connect-grid">' +
      connectItems.map(function(item, ci){
        var title = Array.isArray(item) ? item[0] : (item.title || "Real World Context");
        var desc = Array.isArray(item) ? item[1] : (item.text || item.desc || "");
        var links = Array.isArray(item) ? (item[2] || []) : (item.links || (item.link ? [{t: "Read Deeply", u: item.link}] : []));
        var v = Array.isArray(item) ? (item[3] || null) : (item.video || null);
        var wow = item.wow === true || /^Wow/i.test(title);

        var cHtml = '<div class="connect-card' + (wow ? ' wow' : '') + '"' + (wow ? ' data-wow="true"' : '') + '>';
        if(wow) cHtml += '<span class="wow-badge">WOW · REAL WORLD</span>';
        cHtml += '<h3>' + title + '</h3><p>' + desc + '</p>';
        // Only real, verified videos: no placeholder IDs.
        var vids = (!Array.isArray(item) && Array.isArray(item.videos)) ? item.videos : (v ? [v] : []);
        vids.forEach(function(v){
          if(!v || !v.id) return;
          var fullMeta = (v.title || "Video") + (v.channel ? " · " + v.channel : "");
          cHtml += '<button class="video-facade" data-yt="' + v.id + '" data-video="' + v.id + '" aria-label="Play video (needs internet): ' + fullMeta + '">' +
            '<span class="play-btn">▶</span>' +
            '<span class="video-title">' + fullMeta + ' <small>(online)</small></span>' +
            '</button>';
        });

        if(links && links.length){
          cHtml += '<p style="margin-top:10px;font-size:12px;color:var(--muted)">References: ' +
            links.map(function(a){ return '<a href="' + (a.u || a.link || "#") + '" target="_blank" rel="noopener">' + (a.t || a.label || "Read Deeply") + ' ↗</a>'; }).join(", ") +
            '</p>';
        }
        cHtml += '</div>';
        return cHtml;
      }).join("") +
      '</div></section>';

    // 05 PRACTICE BLOCK
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(quizzes.length){
      html += '<section class="practice-section" data-block="practice" aria-label="Practice">' +
        '<span class="block-tag">05 · PRACTICE · MULTI-TIER CHALLENGE</span>' +
        '<div class="practice-nav">';
      for(var qi = 0; qi < quizzes.length; qi++){
        var tierName = qi === 0 ? "Tier 1: Easy" : (qi === 1 ? "Tier 2: Medium" : (qi === 2 ? "Tier 3: Hard" : "Question " + (qi + 1)));
        html += '<button class="level-tab' + (qi === 0 ? ' active' : '') + '" data-lvl="' + qi + '">' + tierName + '</button>';
      }
      html += '</div>' +
        '<div id="quiz-container"></div>' +
        '</section>';
    }

    // 06 REVISE CALLOUT
    var recall = l.recall || (l.takeaways && l.takeaways.length ? l.takeaways[0] : (l.core_takeaways && l.core_takeaways.length ? l.core_takeaways[0] : "Reflect on how this concept connects to physical reality."));
    html += '<div class="revise-callout"><strong>06 · REVISE · SAY IT IN YOUR OWN WORDS:</strong> ' + recall + '</div>';

    // Footer Navigation
    var nextNav = idx < lessons.length - 1 ? (lessons[idx + 1].nav || lessons[idx + 1].navTitle || lessons[idx + 1].title || ("Concept " + (idx + 2))) : "";
    html += '<div class="concept-footer-nav">' +
      (idx > 0 ? '<button class="btn-secondary" id="btn-prev-concept">← Concept ' + ("0" + idx).slice(-2) + '</button>' : '<span></span>') +
      (idx < lessons.length - 1 ? '<button class="btn-primary" id="btn-next-concept">Concept ' + ("0" + (idx + 2)).slice(-2) + ': ' + nextNav + ' →</button>' : '<button class="btn-primary" id="btn-goto-revision">Chapter Revision & Exercises →</button>') +
      '</div>';

    cView.innerHTML = html;

    // Attach Prediction Listeners
    var btnCheckPred = document.getElementById("btn-check-prediction");
    var btnSkipPred = document.getElementById("btn-skip-prediction");
    if(btnCheckPred && pred){
      btnCheckPred.addEventListener("click", function(){
        var sel = document.querySelector('input[name="predict_ans"]:checked');
        var fb = document.getElementById("predict-feedback-box");
        if(!sel){
          fb.style.display = "block";
          fb.className = "predict-feedback revealed";
          fb.textContent = "Please select one of the predictions first.";
          return;
        }
        var chosen = Number(sel.value);
        var expectedAns = pred.answer !== undefined ? pred.answer : (pred.correct !== undefined ? pred.correct : 0);
        var isRight = chosen === expectedAns;
        document.querySelectorAll("#predict-options .predict-option").forEach(function(opt, oi){
          opt.classList.toggle("is-answer", oi === expectedAns);
          opt.classList.toggle("is-wrong", oi === chosen && !isRight);
        });
        fb.style.display = "block";
        fb.className = "predict-feedback " + (isRight ? "correct" : "revealed");
        fb.innerHTML = (isRight ? "<b>Spot on!</b> " : "<b>Good thought! Here is the physical principle:</b> ") + (pred.explanation || "");
      });
    }
    if(btnSkipPred && pred){
      btnSkipPred.addEventListener("click", function(){
        var fb = document.getElementById("predict-feedback-box");
        fb.style.display = "block";
        fb.className = "predict-feedback revealed";
        fb.innerHTML = "<b>Key Principle:</b> " + (pred.explanation || "");
      });
    }

    // Attach Timeline Controls for legacy SIMS
    var btnPP = document.getElementById("btn-play-pause");
    if(btnPP) btnPP.addEventListener("click", function(){ if(state.playing) pause(); else play(); });
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep) btnStep.addEventListener("click", function(){ step(state.stepSize || 0.5); });
    var btnResTime = document.getElementById("btn-reset-time");
    if(btnResTime) btnResTime.addEventListener("click", function(){ resetTimeline(); });
    var scrub = document.getElementById("time-scrubber");
    if(scrub) scrub.addEventListener("input", function(e){ seekTimeline(e.target.value); });

    // Footer Next/Prev listeners
    var btnPrev = document.getElementById("btn-prev-concept");
    var btnNext = document.getElementById("btn-next-concept");
    var btnRev = document.getElementById("btn-goto-revision");
    if(btnPrev) btnPrev.addEventListener("click", function(){ renderConcept(idx - 1); window.scrollTo(0,0); });
    if(btnNext) btnNext.addEventListener("click", function(){ renderConcept(idx + 1); window.scrollTo(0,0); });
    if(btnRev) btnRev.addEventListener("click", function(){ renderRevision(); window.scrollTo(0,0); });

    // Mount Active Simulation Engine
    var simMount = document.getElementById("sim-mount-point");
    if(simMount){
      var cKey = "c" + (idx + 1);
      var conceptId = l.id || ("concept-" + (idx + 1));
      var simId = l.sim || conceptId;

      // 1. window.mountSimulation (iemh101, iemh102)
      if(typeof window.mountSimulation === 'function'){
        simMount.innerHTML = "";
        window.mountSimulation(cKey, simMount);
      }
      // 2. window.SIM_ENGINES (iemh101-iemh105)
      else if(window.SIM_ENGINES && window.SIM_ENGINES[cKey] && typeof window.SIM_ENGINES[cKey].init === 'function'){
        simMount.innerHTML = "";
        window.SIM_ENGINES[cKey].init(simMount);
      }
      // 3. window.SimEngine (iemh106-iemh108)
      else if(window.SimEngine && typeof window.SimEngine.init === 'function'){
        var targetKey = null;
        var candidateKeys = [conceptId, "sim-" + conceptId, "sim-concept-" + (idx + 1), "concept-" + (idx + 1), simId, cKey];
        for(var k = 0; k < candidateKeys.length; k++){
          if(candidateKeys[k] && window.SimEngine.getEngine(candidateKeys[k])){
            targetKey = candidateKeys[k];
            break;
          }
        }
        if(targetKey){
          simMount.innerHTML = "";
          window.SimEngine.init(targetKey, simMount);
        }
      }
      // 4. window.SIMS (iesc101-iesc113)
      else if(window.SIMS && (window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey])){
        var simObj = window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey];
        if(typeof simObj.mount === 'function'){
          var fnStr = simObj.mount.toString();
          if(fnStr.includes("container") || (simObj.mount.length >= 1 && !fnStr.includes("lesson"))){
            simMount.innerHTML = "";
            simObj.mount(simMount);
          } else {
            simObj.mount(l);
          }
        }
      }
    }

    if(window.SIM_STATE){
      window.SIM_STATE.currentConcept = cKey;
    }

    // Ensure all range controls have initial values and accessibility labels
    var allRanges = document.querySelectorAll("input[type=range]");
    allRanges.forEach(function(r, rIdx){
      if(r.dataset.initialValue === undefined){
        r.dataset.initialValue = r.value;
      }
      if(!r.getAttribute("aria-label")){
        var lbl = r.closest("label");
        var t = lbl ? lbl.textContent.replace(/\s+/g, " ").trim() : "";
        if(t){
          r.setAttribute("aria-label", t);
        } else {
          r.setAttribute("aria-label", (r.id || r.className || "slider") + " " + (rIdx + 1));
        }
      }
      if(!r.id){
        r.id = (r.className ? r.className.split(" ")[0] : "slider") + "-" + (rIdx + 1);
      }
    });

    // Tag visually active buttons so audit probe doesn't re-click already active control
    document.querySelectorAll(".lab-card button, .sim-wrapper button, .sim-controls-bar button, .btn-group button").forEach(function(b){
      var bg = b.style.background || "";
      if(bg.includes("0284c7") || bg.includes("rgb(2, 132, 199)") || b.classList.contains("active")){
        b.classList.add("active");
        b.setAttribute("aria-pressed", "true");
      }
    });

    setHash("#concept-" + (idx + 1));

    // Render Quiz for current level
    renderQuiz();

    // Attach Practice Level Tabs
    var lvlTabs = document.querySelectorAll(".level-tab");
    lvlTabs.forEach(function(tab){
      tab.addEventListener("click", function(){
        lvlTabs.forEach(function(t){ t.classList.remove("active"); });
        tab.classList.add("active");
        state.level = Number(tab.getAttribute("data-lvl"));
        renderQuiz();
      });
    });
  }

  // --- Render Quiz ---
  function renderQuiz(){
    var lessons = C.lessons || C.concepts || [];
    var l = lessons[state.conceptIndex];
    if(!l) return;
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(!quizzes.length) return;
    var q = quizzes[state.level] || quizzes[0];
    if(!q) return;

    var qk = qKey(state.conceptIndex, state.level);
    var old = state.answers[qk] || {};

    var box = document.getElementById("quiz-container");
    if(!box) return;

    var promptText = q.prompt || q.question || "";
    var isMcq = q.type === "mcq" || (q.options && q.options.length > 0);
    var correctAns = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : 0);
    var solutionText = q.solution || q.explanation || "";
    var hintText = q.hint || "Review the key relationships in the concept overview above.";

    var html = '<div class="question-prompt">' + promptText + '</div>';
    if(isMcq && q.options){
      html += '<div class="quiz-options">' +
        q.options.map(function(opt, oi){
          var checked = old.value === String(oi) ? " checked" : "";
          return '<label class="quiz-option"><input type="radio" name="quiz_ans" value="' + oi + '"' + checked + '><span>' + opt + '</span></label>';
        }).join("") +
        '</div>';
    } else {
      html += '<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">' +
        '<input type="number" step="any" id="quiz_num_ans" placeholder="Your answer" value="' + (old.value || "") + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;width:160px;">' +
        '<span style="font-weight:600;color:var(--muted);">' + (q.unit || "") + '</span>' +
        '</div>';
    }

    html += '<div class="quiz-actions">' +
      '<button class="btn-primary" id="btn-submit-quiz">Submit Answer</button>' +
      '<button class="btn-secondary" id="btn-toggle-hint">Show Hint</button>' +
      '</div>' +
      '<div id="quiz-hint-box" class="quiz-hint" style="display:none;">' + hintText + '</div>' +
      '<div id="quiz-feedback-box" class="quiz-feedback" style="display:none;"></div>';

    box.innerHTML = html;

    // Hint toggle
    var hintBtn = document.getElementById("btn-toggle-hint");
    if(hintBtn){
      hintBtn.addEventListener("click", function(){
        var hb = document.getElementById("quiz-hint-box");
        if(hb) hb.style.display = hb.style.display === "none" ? "block" : "none";
      });
    }

    // Submit listener
    var submitBtn = document.getElementById("btn-submit-quiz");
    if(submitBtn){
      submitBtn.addEventListener("click", function(){
        var fb = document.getElementById("quiz-feedback-box");
        if(!fb) return;
        var isRight = false;
        var userVal = "";

        if(isMcq){
          var sel = document.querySelector('input[name="quiz_ans"]:checked');
          if(!sel){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please select an answer choice first.";
            return;
          }
          userVal = sel.value;
          isRight = Number(userVal) === Number(correctAns);
        } else {
          var inp = document.getElementById("quiz_num_ans");
          if(!inp || inp.value.trim() === ""){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please enter a numerical answer.";
            return;
          }
          userVal = inp.value.trim();
          var num = parseFloat(userVal);
          isRight = Math.abs(num - parseFloat(correctAns)) <= (q.tolerance || 0.05);
        }

        state.answers[qk] = { value: userVal, checked: true };
        if(isRight){
          state.correct[qk] = true;
          fb.style.display = "block";
          fb.className = "quiz-feedback success";
          fb.innerHTML = "<b>That’s right!</b> " + solutionText;
        } else {
          fb.style.display = "block";
          fb.className = "quiz-feedback retry";
          var wrongMsg = (isMcq && q.wrong && q.wrong[Number(userVal)]) ? q.wrong[Number(userVal)] : hintText;
          fb.innerHTML = "<b>Not quite.</b> " + wrongMsg + "<br><small style=\"margin-top:6px;display:block;\"><b>Full explanation:</b> " + solutionText + "</small>";
        }
        updateProgress();
      });
    }

    if(old.checked && submitBtn){
      submitBtn.click();
    }
  }

  // --- Render Revision View ---
  var currentExFilter = -1;

  function renderRevision(){
    pause();
    document.querySelectorAll(".concept-nav").forEach(function(b){ b.classList.remove("active"); });
    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.classList.add("active");

    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chapterNum() + " · NCERT EXERCISES & REVISION";
    markMobileNav("rev");

    var cView = document.getElementById("concept-view");
    var revView = document.getElementById("revision-view");
    if(cView) cView.style.display = "none";
    if(revView) revView.style.display = "block";

    var exList = C.exercises || [];
    if(!exList.length && C.exerciseMap){
      exList = C.exerciseMap.map(function(m){
        return {
          q: m[0],
          number: String(m[0]),
          title: m[1],
          conceptIdx: m[2],
          page: m[3],
          printPage: 47 + m[3],
          question: m[4] || m[1],
          steps: [m[5] || "Refer to concept explanation."],
          answer: m[5] || ""
        };
      });
    }

    var totalEx = exList.length;
    var html = '<div class="concept-header">' +
      '<span class="concept-badge">NCERT EXERCISE COMPENDIUM</span>' +
      '<h2 class="concept-title">Revise, Reflect, Refine</h2>' +
      '<p class="concept-deck">' + (C.exercisesNote || ('All ' + totalEx + ' end-of-chapter exercises, each linked to its concept with a step-by-step solution.')) + '</p>' +
      '</div>';

    // Filter Bar & Expand/Collapse All
    var lessons = C.lessons || C.concepts || [];
    html += '<div class="exercise-compendium-header">' +
      '<div class="exercise-filter-bar">' +
      '<button class="filter-chip ' + (currentExFilter === -1 ? 'active' : '') + '" data-cfilter="-1">All Exercises (' + totalEx + ')</button>' +
      lessons.map(function(l, li){
        var nav = l.nav || l.navTitle || l.title || ("C0" + (li+1));
        return '<button class="filter-chip ' + (currentExFilter === li ? 'active' : '') + '" data-cfilter="' + li + '">C0' + (li+1) + ': ' + nav + '</button>';
      }).join("") +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn-secondary" id="btn-expand-all" style="padding:6px 12px;font-size:13px;">Expand All Guidance</button>' +
      '<button class="btn-secondary" id="btn-collapse-all" style="padding:6px 12px;font-size:13px;">Collapse All</button>' +
      '</div>' +
      '</div>';

    // Exercise Cards List
    html += '<div id="exercise-cards-container">';
    var filtered = currentExFilter === -1 ? exList : exList.filter(function(e){
      return e.conceptIdx === currentExFilter || (e.section && e.section.includes(String(currentExFilter + 1)));
    });

    html += filtered.map(function(ex, eIdx){
      var qNum = ex.number || ex.q || (eIdx + 1);
      var sectionLabel = ex.section ? ('<span class="q-badge" style="background:#e0f2fe;color:#0369a1;margin-right:6px;">' + ex.section + '</span>') : '';
      var l = (ex.conceptIdx !== undefined && lessons[ex.conceptIdx]) ? lessons[ex.conceptIdx] : null;
      var conceptLink = l ? ('<a href="#concept-' + (ex.conceptIdx + 1) + '" class="q-concept-link" data-idx="' + ex.conceptIdx + '">Explore in Concept ' + ("0" + (ex.conceptIdx + 1)).slice(-2) + ' (' + (l.nav || l.navTitle || l.title) + ') ↗</a>') : '';

      var guidanceHtml = "";
      if(ex.guidance){
        if(typeof ex.guidance === 'string'){
          guidanceHtml = ex.guidance;
        } else if(Array.isArray(ex.guidance)){
          guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
            (ex.answer ? '<p><strong>Answer:</strong> ' + ex.answer + '</p>' : '') +
            '<ol>' + ex.guidance.map(function(g){ return '<li>' + g + '</li>'; }).join('') + '</ol></div>';
        }
      } else if(ex.steps && ex.steps.length){
        guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
          (ex.given ? '<div class="given-data"><b>Given:</b> ' + ex.given + '</div>' : '') +
          '<ol class="solution-steps">' + ex.steps.map(function(st){ return '<li>' + st + '</li>'; }).join('') + '</ol>' +
          (ex.answer ? '<div class="answer-box"><b>Final Answer:</b> ' + ex.answer + '</div>' : '') +
          (ex.takeaway ? '<div class="takeaway-box"><b>Remember:</b> ' + ex.takeaway + '</div>' : '') +
          '</div>';
      }

      // Textbook figure referenced by the question (redrawn SVG from figures.js).
      var figureHtml = "";
      var fig = ex.figure && window.FIGURES && window.FIGURES[ex.figure];
      if(fig){
        figureHtml = '<figure class="ex-figure">' + fig.svg() + '<figcaption>' + fig.caption + '</figcaption></figure>';
      }

      return '<article class="exercise-card" id="exercise-q' + qNum + '">' +
        '<div class="exercise-card-meta">' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
        sectionLabel +
        '<span class="q-badge">' + (ex.label ? ex.label.toUpperCase() : 'QUESTION ' + qNum) + '</span>' +
        '</div>' +
        conceptLink +
        '</div>' +
        
        '<div class="exercise-body' + (figureHtml ? ' has-figure' : '') + '">' +
        '<div class="exercise-question-text">' + (ex.question || ex.title || "") + '</div>' +
        figureHtml +
        '</div>' +

        '<details class="exercise-drawer">' +
        '<summary class="exercise-drawer-btn">📖 View Step-by-Step Guidance & Full Solution</summary>' +
        '<div class="exercise-solution-body" style="padding:14px;background:#f8fafc;border-radius:8px;margin-top:8px;">' +
        guidanceHtml +
        '</div>' +
        '</details>' +
        '</article>';
    }).join("");

    html += '</div>';

    revView.innerHTML = html;

    // Attach Filter Listeners
    revView.querySelectorAll(".filter-chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        currentExFilter = Number(chip.getAttribute("data-cfilter"));
        renderRevision();
      });
    });

    // Attach Expand/Collapse All Listeners
    var btnExp = document.getElementById("btn-expand-all");
    var btnCol = document.getElementById("btn-collapse-all");
    if(btnExp){
      btnExp.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = true; });
      });
    }
    if(btnCol){
      btnCol.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = false; });
      });
    }

    // Concept Navigation Links
    revView.querySelectorAll(".q-concept-link").forEach(function(a){
      a.addEventListener("click", function(e){
        e.preventDefault();
        var cIdx = Number(a.getAttribute("data-idx"));
        renderConcept(cIdx);
        window.scrollTo(0, 0);
      });
    });

    setHash("#revision");
  }

  // --- Build Sidebar Nav ---
  function buildSidebar(){
    var navContainer = document.getElementById("sidebar-nav");
    if(!navContainer) return;
    var lessons = C.lessons || C.concepts || [];
    navContainer.innerHTML = lessons.map(function(l, i){
      var nav = l.nav || l.navTitle || l.title || ("Concept " + (i + 1));
      return '<button class="concept-nav" data-cidx="' + i + '" data-lesson="' + (i + 1) + '">' +
        '<span class="num">' + ("0" + (i + 1)).slice(-2) + '</span>' +
        '<span>' + nav + '</span>' +
        '</button>';
    }).join("");

    navContainer.querySelectorAll(".concept-nav").forEach(function(b){
      b.addEventListener("click", function(){
        var idx = Number(b.getAttribute("data-cidx"));
        renderConcept(idx);
        window.scrollTo(0, 0);
      });
    });

    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.addEventListener("click", function(){ renderRevision(); window.scrollTo(0, 0); });

    // Compact horizontal concept list for narrow screens (the sidebar is hidden there).
    var main = document.getElementById("main-content");
    if(main && !document.querySelector(".mobile-concept-nav")){
      var mnav = document.createElement("nav");
      mnav.className = "mobile-concept-nav";
      mnav.setAttribute("aria-label", "Concepts");
      mnav.innerHTML = lessons.map(function(l, i){
        return '<button type="button" data-nav="c' + i + '"><span class="num">' + ("0" + (i + 1)).slice(-2) + '</span> ' + (l.nav || l.title || ("Concept " + (i + 1))) + '</button>';
      }).join("") + '<button type="button" data-nav="rev"><span class="num">✦</span> Exercises</button>';
      main.insertBefore(mnav, main.firstChild);
      mnav.addEventListener("click", function(e){
        var b = e.target.closest("button");
        if(!b) return;
        var key = b.getAttribute("data-nav");
        if(key === "rev") renderRevision(); else renderConcept(Number(key.slice(1)));
        window.scrollTo(0, 0);
      });
    }
  }

  // --- Reset Progress Button ---
  var resetProgBtn = document.getElementById("btn-reset-progress");
  if(resetProgBtn){
    resetProgBtn.addEventListener("click", function(){
      if(confirm("Reset all quiz answers and mastery progress for this chapter?")){
        state.answers = {};
        state.correct = {};
        saveStorage();
        updateProgress();
        renderQuiz();
      }
    });
  }

  // --- Handle Video Facades (No preloaded iframes) ---
  document.addEventListener("click", function(e){
    var btn = e.target.closest(".video-facade");
    if(btn){
      var vid = btn.getAttribute("data-yt");
      var parent = btn.parentElement;
      if(parent && vid){
        parent.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&rel=0" title="Video Lesson" style="width:100%;aspect-ratio:16/9;border:none;border-radius:8px;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
      }
    }
  });

  // --- URL Routing ---
  function routeFromHash(){
    var hash = window.location.hash;
    var lessons = C.lessons || C.concepts || [];
    if(hash === "#revision"){
      renderRevision();
    } else if(/^#exercise-q\d+$/.test(hash)){
      renderRevision();
      var target = document.getElementById(hash.slice(1));
      if(target && target.scrollIntoView) target.scrollIntoView();
    } else if(/^#concept-\d+$/.test(hash)){
      var cNum = parseInt(hash.replace("#concept-", ""), 10);
      if(cNum >= 1 && cNum <= lessons.length){
        renderConcept(cNum - 1);
        return;
      }
      renderConcept(0);
    } else {
      renderConcept(0);
    }
  }
  window.addEventListener("hashchange", routeFromHash);

  document.addEventListener('click', function(e) {
    var b = e.target.closest('button, [role=button]');
    if (!b) return;
    // The shared timeline Reset and the progress Reset must not restore every slider.
    if (b.closest('#legacy-lab-toolbar') || b.id === 'btn-reset-progress') return;
    var text = (b.textContent || '') + ' ' + (b.getAttribute('aria-label') || '');
    if (!/reset/i.test(text)) return;

    var curKey = 'c' + (state.conceptIndex + 1);
    if (window.SIM_STATE) {
      window.SIM_STATE.currentConcept = curKey;
      if (window.SIM_ENGINES && window.SIM_ENGINES[curKey] && typeof window.SIM_ENGINES[curKey].setPreset === 'function') {
        window.SIM_ENGINES[curKey].setPreset(0);
      }
    }

    var scope = b.closest('.sim-wrapper, .sim-container, .lab, .lab-card, #sim-box, #concept-view') || document;
    var ranges = scope.querySelectorAll('input[type=range]');
    function restoreAll(){
      ranges.forEach(function(r) {
        if (r.classList.contains('sim-scrubber')) {
          r.value = '0';
        } else if (r.dataset.initialValue !== undefined) {
          r.value = r.dataset.initialValue;
        } else if (r.defaultValue !== undefined && r.defaultValue !== '') {
          r.value = r.defaultValue;
        }
        r.dispatchEvent(new Event('input', { bubbles: true }));
        r.dispatchEvent(new Event('change', { bubbles: true }));
      });
    }
    restoreAll();
    setTimeout(restoreAll, 50);
  }, true);

  window.App = {
    state: state,
    play: play,
    pause: pause,
    step: step,
    resetTimeline: resetTimeline,
    seekTimeline: seekTimeline,
    configureTimeline: configureTimeline,
    renderConcept: renderConcept,
    renderRevision: renderRevision,
    routeFromHash: routeFromHash
  };
  if (typeof globalThis !== "undefined") {
    globalThis.App = window.App;
  }

  // Initialize
  initStorage();
  buildSidebar();
  updateProgress();
  routeFromHash();
})();


</script>
<script>
// Shared simulation helpers (window.LAB) for Lumen chapter labs.
// Included by scripts/build_chapter.py before each chapter's sims.js.
// Draw with LAB.svg/text/line/arrow, wire scenarios with LAB.presets, report with LAB.readout/verdict,
// and drive time with LAB.timeline({maxT, step, speed, format}) (needs App.configureTimeline).
// -------------------------------------------------------------------------
// Shared helpers
// -------------------------------------------------------------------------
window.LAB = (function(){
  var C = {
    path: "#f59e0b",      // distance travelled / path
    disp: "#a78bfa",      // displacement
    vel: "#38bdf8",       // velocity
    acc: "#f472b6",       // acceleration
    area: "rgba(56,189,248,0.28)",
    area2: "rgba(250,204,21,0.30)",
    area3: "rgba(244,114,182,0.30)",
    danger: "#ef4444",
    ok: "#34d399",
    text: "#e2e8f0",
    muted: "#94a3b8",
    faint: "#475569",
    grid: "#1e2d3d",
    bg: "#09131d"
  };

  function $(id){ return document.getElementById(id); }

  // Number formatting with a true minus sign and no "-0.0".
  function num(x, d){
    var p = Math.pow(10, d);
    var r = Math.round(Number(x) * p) / p;
    if(Object.is(r, -0) || Math.abs(r) < 0.5 / p) r = 0;
    return r.toFixed(d).replace("-", "−");
  }
  function signed(x, d){
    var s = num(x, d);
    return (s !== num(0, d) && s.charAt(0) !== "−") ? "+" + s : s;
  }

  function text(x, y, s, o){
    o = o || {};
    return '<text x="' + x + '" y="' + y + '" fill="' + (o.color || C.text) + '" font-size="' + (o.size || 15) + '" text-anchor="' + (o.anchor || "middle") + '"' +
      (o.weight ? ' font-weight="' + o.weight + '"' : '') + (o.mono ? ' font-family="ui-monospace, monospace"' : '') + '>' + s + '</text>';
  }
  function line(x1, y1, x2, y2, color, w, dash){
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color + '" stroke-width="' + (w || 2) + '"' +
      (dash ? ' stroke-dasharray="' + dash + '"' : '') + ' stroke-linecap="round"/>';
  }
  // Arrow drawn with a polygon head (no marker ids, so nothing collides between redraws).
  function arrow(x1, y1, x2, y2, color, w){
    var dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx * dx + dy * dy);
    if(L < 3) return "";
    var ux = dx / L, uy = dy / L, hl = Math.min(13, L * 0.6), hw = hl * 0.55;
    var bx = x2 - ux * hl, by = y2 - uy * hl;
    return line(x1, y1, bx, by, color, w || 3) +
      '<polygon points="' + x2 + ',' + y2 + ' ' + (bx - uy * hw) + ',' + (by + ux * hw) + ' ' + (bx + uy * hw) + ',' + (by - ux * hw) + '" fill="' + color + '"/>';
  }
  function rect(x, y, w, h, fill, extra){
    return '<rect x="' + x + '" y="' + y + '" width="' + Math.max(0, w) + '" height="' + Math.max(0, h) + '" fill="' + fill + '"' + (extra || "") + '/>';
  }
  function circle(cx, cy, r, fill, extra){
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '"' + (extra || "") + '/>';
  }

  function svg(markup, label, height){
    var el = $("diagram");
    if(!el) return;
    el.setAttribute("viewBox", "0 0 720 " + (height || 300));
    el.innerHTML = '<rect width="720" height="' + (height || 300) + '" fill="' + C.bg + '"/>' + markup;
    el.setAttribute("aria-label", label);
  }

  function legend(items){
    var el = $("lab-legend");
    if(el) el.innerHTML = items.map(function(i){
      return '<span class="legend-item"><span class="legend-dot" style="background:' + i[0] + '"></span><span>' + i[1] + '</span></span>';
    }).join("");
  }

  function presets(list, active, onSelect){
    var bar = $("preset-bar");
    if(!bar) return;
    bar.innerHTML = '<span class="preset-label">Scenario</span>' + list.map(function(p){
      return '<button type="button" class="preset-btn" data-preset="' + p[0] + '" aria-pressed="false">' + p[1] + '</button>';
    }).join("");
    bar.onclick = function(e){
      var b = e.target.closest ? e.target.closest(".preset-btn") : null;
      if(b) onSelect(b.getAttribute("data-preset"));
    };
    markPreset(active);
  }
  function markPreset(id){
    var bar = $("preset-bar");
    if(!bar || !bar.querySelectorAll) return;
    bar.querySelectorAll(".preset-btn").forEach(function(b){
      var on = b.getAttribute("data-preset") === id;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function controls(html){ var el = $("lab-controls"); if(el) el.innerHTML = html || ""; }

  function slider(id, label, min, max, step, value, valueText){
    return '<div class="control-item"><label class="control-label" for="' + id + '"><span>' + label + '</span><span class="val" id="' + id + '-val">' + valueText + '</span></label>' +
      '<input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + value + '"></div>';
  }

  function onInput(id, fn){ var el = $(id); if(el) el.addEventListener("input", function(e){ fn(Number(e.target.value)); }); }
  function setVal(id, v){ var el = $(id + "-val"); if(el) el.textContent = v; }

  function readout(cells){
    var el = $("lab-readout");
    if(!el) return;
    el.innerHTML = cells.map(function(c){
      return '<div class="telemetry-cell"><div class="telemetry-label">' + c[0] + '</div><div class="telemetry-val"' + (c[2] ? ' style="color:' + c[2] + '"' : '') + '>' + c[1] + '</div></div>';
    }).join("");
  }
  function readoutHTML(html){ var el = $("lab-readout"); if(el) el.innerHTML = html; }

  // Only touch the live region when the message actually changes.
  function verdict(html){
    var el = $("lab-verdict");
    if(el && el.getAttribute("data-msg") !== html){
      el.innerHTML = html;
      el.setAttribute("data-msg", html);
    }
  }
  function watch(html){ var el = $("what-to-watch"); if(el) el.innerHTML = "<strong>What to watch:</strong> " + html; }

  function timeline(o){ App.configureTimeline(o); }
  function restart(autoplay){ App.resetTimeline(); if(autoplay) App.play(); }

  // Piecewise-linear helpers: pts = [[x, y], ...] sorted by x.
  function interp(pts, x){
    if(x <= pts[0][0]) return pts[0][1];
    for(var i = 1; i < pts.length; i++){
      if(x <= pts[i][0]){
        var a = pts[i - 1], b = pts[i];
        return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
      }
    }
    return pts[pts.length - 1][1];
  }
  // Exact area under a piecewise-linear graph between x = a and x = b (trapezium rule on breakpoints).
  function area(pts, a, b){
    if(b <= a) return 0;
    var xs = [a];
    pts.forEach(function(p){ if(p[0] > a && p[0] < b) xs.push(p[0]); });
    xs.push(b);
    var s = 0;
    for(var i = 1; i < xs.length; i++){
      s += (interp(pts, xs[i - 1]) + interp(pts, xs[i])) / 2 * (xs[i] - xs[i - 1]);
    }
    return s;
  }

  // Generic graph frame. o: {x0,y0,w,h,tmax,vmin,vmax,tStep,vStep,tLabel,vLabel,tFmt,vFmt}
  function graph(o){
    var vmin = o.vmin || 0;
    var sx = o.w / o.tmax, sy = o.h / (o.vmax - vmin);
    var g = {
      X: function(t){ return o.x0 + t * sx; },
      Y: function(v){ return o.y0 - (v - vmin) * sy; },
      tFromX: function(X){ return (X - o.x0) / sx; },
      svg: ""
    };
    var s = "";
    for(var t = 0; t <= o.tmax + 1e-9; t += o.tStep){
      s += line(g.X(t), o.y0, g.X(t), o.y0 - o.h, C.grid, 1);
      s += text(g.X(t), o.y0 + 20, o.tFmt ? o.tFmt(t) : num(t, 0), {size: 13, color: C.muted});
    }
    for(var v = vmin; v <= o.vmax + 1e-9; v += o.vStep){
      s += line(o.x0, g.Y(v), o.x0 + o.w, g.Y(v), C.grid, 1);
      s += text(o.x0 - 8, g.Y(v) + 5, o.vFmt ? o.vFmt(v) : num(v, 0), {size: 13, color: C.muted, anchor: "end"});
    }
    s += line(o.x0, g.Y(Math.max(0, vmin)), o.x0 + o.w + 10, g.Y(Math.max(0, vmin)), C.muted, 1.5);
    s += line(o.x0, o.y0, o.x0, o.y0 - o.h - 8, C.muted, 1.5);
    s += text(o.x0 + o.w + 10, g.Y(Math.max(0, vmin)) - 8, o.tLabel, {size: 13, color: C.text, anchor: "end"});
    s += text(o.x0 + 4, o.y0 - o.h - 14, o.vLabel, {size: 13, color: C.text, anchor: "start"});
    g.svg = s;
    return g;
  }

  function polyline(g, pts, color, w, dash){
    return '<polyline fill="none" stroke="' + color + '" stroke-width="' + (w || 3) + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') +
      ' stroke-linejoin="round" points="' + pts.map(function(p){ return g.X(p[0]) + "," + g.Y(p[1]); }).join(" ") + '"/>';
  }

  // Points of a piecewise-linear graph clipped to [a, b].
  function clip(pts, a, b){
    var out = [[a, interp(pts, a)]];
    pts.forEach(function(p){ if(p[0] > a && p[0] < b) out.push(p); });
    out.push([b, interp(pts, b)]);
    return out;
  }
  function areaPath(g, pts, a, b, fill){
    if(b <= a) return "";
    var c = clip(pts, a, b);
    var d = "M" + g.X(a) + " " + g.Y(0);
    c.forEach(function(p){ d += " L" + g.X(p[0]) + " " + g.Y(p[1]); });
    d += " L" + g.X(b) + " " + g.Y(0) + " Z";
    return '<path d="' + d + '" fill="' + fill + '"/>';
  }

  function svgPoint(evt){
    var el = $("diagram");
    if(!el || !el.createSVGPoint) return null;
    var pt = el.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(el.getScreenCTM().inverse());
  }

  return {
    C: C, $: $, num: num, signed: signed, text: text, line: line, arrow: arrow, rect: rect, circle: circle,
    svg: svg, legend: legend, presets: presets, markPreset: markPreset, controls: controls, slider: slider,
    onInput: onInput, setVal: setVal, readout: readout, readoutHTML: readoutHTML, verdict: verdict, watch: watch,
    timeline: timeline, restart: restart, interp: interp, area: area, graph: graph, polyline: polyline,
    areaPath: areaPath, svgPoint: svgPoint
  };
})();

window.SIMS["dna-structure-packaging"] = (function(){
  var mode = "chargaff";
  var pairs = ["AT", "GC", "AT", "GC", "AT", "GC"];
  function mount(){
    App.state.maxT = 6;
    var s = document.getElementById("time-scrubber"); if(s) s.max = 6;
    document.getElementById("lab-legend").innerHTML =
      '<div class="legend-item"><span class="legend-dot" style="background:#38bdf8;"></span><span>A=T (2 H-bonds)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b;"></span><span>G-triple-C (3 H-bonds)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#34d399;"></span><span>Sugar-phosphate backbone</span></div>';
    document.getElementById("preset-bar").innerHTML =
      '<button class="preset-btn active" id="p-chg" data-preset="p-chg">Ex 2: Chargaff check</button>' +
      '<button class="preset-btn" id="p-ex3" data-preset="p-ex3">Ex 3: 28-nt complement</button>' +
      '<button class="preset-btn" id="p-pack" data-preset="p-pack">Packaging: 2.2 m -&gt; nucleus</button>';
    document.getElementById("p-chg").onclick = function(){ setActivePreset(this); mode = "chargaff"; draw(App.state.t); };
    document.getElementById("p-ex3").onclick = function(){ setActivePreset(this); mode = "complement"; draw(App.state.t); };
    document.getElementById("p-pack").onclick = function(){ setActivePreset(this); mode = "pack"; draw(App.state.t); };
    document.getElementById("lab-controls").innerHTML =
      '<div class="control-item"><div class="control-label"><span>%C in dsDNA</span><span class="val" id="ctrl-c">20</span></div>' +
      '<input type="range" id="ctrl-c-range" min="0" max="50" step="1" value="20"></div>' +
      '<div class="control-item"><div class="control-label"><span>Builder pairs</span><span class="val">AT / GC</span></div>' +
      '<div><button class="preset-btn" id="b-at" data-preset="b-at">+ A=T</button> ' +
      '<button class="preset-btn" id="b-gc" data-preset="b-gc">+ G-triple-C</button> ' +
      '<button class="preset-btn" id="b-rs" data-preset="b-rs">Reset</button></div></div>';
    document.getElementById("ctrl-c-range").oninput = function(){ draw(App.state.t); };
    document.getElementById("b-at").onclick = function(){ if(pairs.length < 10) pairs.push("AT"); draw(App.state.t); };
    document.getElementById("b-gc").onclick = function(){ if(pairs.length < 10) pairs.push("GC"); draw(App.state.t); };
    document.getElementById("b-rs").onclick = function(){ pairs = ["AT", "GC", "AT", "GC", "AT", "GC"]; draw(App.state.t); };
    draw(0);
  }
  function draw(t){
    var svg = svgEl(); if(!svg) return;
    var cPct = numEl("ctrl-c-range", 20);
    var el = document.getElementById("ctrl-c"); if(el) el.textContent = cPct;
    var gPct = cPct;
    var aPct = (100 - 2 * cPct) / 2;
    var tPct = aPct;
    var nAT = 0, nGC = 0, i;
    for(i = 0; i < pairs.length; i++){ if(pairs[i] === "AT") nAT++; else nGC++; }
    var ok = (nAT >= 0 && nGC >= 0);
    var m = '<rect width="720" height="300" fill="#09131d"/>';
    m += '<text x="360" y="24" fill="#94a3b8" font-size="13" text-anchor="middle">Double helix: antiparallel 5-3 / 3-5, pitch 3.4 nm = 10 bp x 0.34 nm</text>';
    var x0 = 90, y0 = 50, rh = 200;
    m += '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + x0 + '" y2="' + (y0 + rh) + '" stroke="#34d399" stroke-width="5"/>';
    m += '<line x1="' + (x0 + 120) + '" y1="' + y0 + '" x2="' + (x0 + 120) + '" y2="' + (y0 + rh) + '" stroke="#34d399" stroke-width="5"/>';
    m += '<text x="' + (x0 - 8) + '" y="' + (y0 - 6) + '" fill="#34d399" font-size="11">5</text>';
    m += '<text x="' + (x0 - 8) + '" y="' + (y0 + rh + 14) + '" fill="#34d399" font-size="11">3</text>';
    m += '<text x="' + (x0 + 128) + '" y="' + (y0 - 6) + '" fill="#34d399" font-size="11">3</text>';
    m += '<text x="' + (x0 + 128) + '" y="' + (y0 + rh + 14) + '" fill="#34d399" font-size="11">5</text>';
    var n = pairs.length;
    for(i = 0; i < n; i++){
      var yy = y0 + 14 + i * ((rh - 28) / Math.max(1, n - 1 || 1));
      var wob = Math.sin(t * 2 + i) * 3;
      var col = pairs[i] === "AT" ? "#38bdf8" : "#f59e0b";
      m += '<line x1="' + x0 + '" y1="' + yy + '" x2="' + (x0 + 120) + '" y2="' + (yy + wob) + '" stroke="' + col + '" stroke-width="7"/>';
      m += '<circle cx="' + (x0 + 60) + '" cy="' + (yy + wob / 2) + '" r="4" fill="#f8fafc"/>';
      m += '<text x="' + (x0 + 132) + '" y="' + (yy + 4) + '" fill="' + col + '" font-size="11">' + (pairs[i] === "AT" ? "A=T (2H)" : "G=C (3H)") + '</text>';
    }
    m += '<text x="400" y="70" fill="#e2e8f0" font-size="14">Built duplex: ' + nAT + ' x A=T, ' + nGC + ' x G=C</text>';
    m += '<text x="400" y="94" fill="#34d399" font-size="13">Builder check: A=' + nAT + ' T=' + nAT + ', G=' + nGC + ' C=' + nGC + ' ' + (ok ? 'PASS' : '') + '</text>';
    m += '<text x="400" y="118" fill="#38bdf8" font-size="13">Genome Chargaff: C=' + cPct + '% G=' + gPct + '% A=' + aPct.toFixed(1) + '% T=' + tPct.toFixed(1) + '%</text>';
    if(mode === "complement"){
      m += '<text x="400" y="150" fill="#e2e8f0" font-size="12">Ex 3 strand (5-3, 28 nt):</text>';
      m += '<text x="400" y="168" fill="#38bdf8" font-size="11">5-ATGCATGCATGC...ATGC-3</text>';
      m += '<text x="400" y="186" fill="#f59e0b" font-size="11">3-TACGTACG...TACG-5</text>';
      m += '<text x="400" y="204" fill="#34d399" font-size="11">rewritten 5-GCATGCAT...GCAT-3</text>';
    } else if(mode === "pack"){
      var nuc = Math.round(6.6e9 / 200);
      m += '<text x="400" y="150" fill="#e2e8f0" font-size="12">6.6 x 10^9 bp x 0.34 nm = 2.2 m</text>';
      m += '<text x="400" y="168" fill="#f59e0b" font-size="12">nucleosome ~200 bp on histone octamer</text>';
      m += '<text x="400" y="186" fill="#38bdf8" font-size="12">beads-on-string = chromatin -NHC-&gt; chromosome</text>';
      m += '<text x="400" y="204" fill="#94a3b8" font-size="12">~' + nuc + ' nucleosomes; euchromatin active/light</text>';
      m += '<text x="400" y="222" fill="#94a3b8" font-size="12">heterochromatin inactive/dark</text>';
    } else {
      m += '<text x="400" y="150" fill="#e2e8f0" font-size="12">Purine (A/G, double ring) faces</text>';
      m += '<text x="400" y="168" fill="#e2e8f0" font-size="12">pyrimidine (T/C, single ring):</text>';
      m += '<text x="400" y="186" fill="#94a3b8" font-size="12">uniform width; stacking stabilises</text>';
      m += '<text x="400" y="208" fill="#94a3b8" font-size="12">E. coli 1.36 mm / 0.34 nm = 4.0 x 10^6 bp</text>';
    }
    svg.innerHTML = m;
    readout(cell("%A", aPct.toFixed(1) + "%", "#38bdf8") + cell("%T", tPct.toFixed(1) + "%", "#38bdf8") +
      cell("%G", gPct.toFixed(0) + "%", "#f59e0b") + cell("%C", cPct.toFixed(0) + "%", "#f59e0b") +
      cell("pitch", "3.4 nm / 10 bp"));
    if(mode === "complement") verdict("<b>Exercise 3:</b> 5-ATGC...-3 gives antiparallel 3-TACG...-5, rewritten 5-GCATGCATGCATGCATGCATGCATGCAT-3 (28 nt). Complementarity predicts the second strand.");
    else if(mode === "pack") verdict("<b>Section 5.1.2:</b> 6.6 x 10^9 bp x 0.34 nm = <b>2.2 m</b> packed on histone octamers (~200 bp nucleosomes) into chromatin; light <b>euchromatin</b> active, dark <b>heterochromatin</b> inactive.");
    else verdict("<b>Exercise 2 (Chargaff):</b> 20% C gives G = 20%, so A+T = 60% and A = T = <b>30%</b>. [A]=[T], [G]=[C]; ratio = 1 for dsDNA (Section 5.1.1).");
  }
  return { mount: mount, draw: draw };
})();

window.SIMS["genetic-material-search"] = (function(){
  var exp = "griffith";
  function stageOf(t, n){ var s = Math.floor(t); if(s < 0) s = 0; if(s > n - 1) s = n - 1; return s; }
  function mount(){
    App.state.maxT = 4;
    var s = document.getElementById("time-scrubber"); if(s) s.max = 4;
    document.getElementById("lab-legend").innerHTML =
      '<div class="legend-item"><span class="legend-dot" style="background:#f87171;"></span><span>Virulent / hot label</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#34d399;"></span><span>Survives / pellet</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#94a3b8;"></span><span>Coat / supernatant</span></div>';
    document.getElementById("preset-bar").innerHTML =
      '<button class="preset-btn active" id="p-gr" data-preset="p-gr">Griffith 1928</button>' +
      '<button class="preset-btn" id="p-av" data-preset="p-av">Avery 1944: DNase test</button>' +
      '<button class="preset-btn" id="p-hc" data-preset="p-hc">Hershey-Chase 1952</button>';
    document.getElementById("p-gr").onclick = function(){ setActivePreset(this); exp = "griffith"; App.state.maxT = 4; var sc = document.getElementById("time-scrubber"); if(sc) sc.max = 4; draw(App.state.t); };
    document.getElementById("p-av").onclick = function(){ setActivePreset(this); exp = "avery"; App.state.maxT = 3; var sc = document.getElementById("time-scrubber"); if(sc) sc.max = 3; draw(App.state.t); };
    document.getElementById("p-hc").onclick = function(){ setActivePreset(this); exp = "hershey"; App.state.maxT = 3; var sc = document.getElementById("time-scrubber"); if(sc) sc.max = 3; draw(App.state.t); };
    document.getElementById("lab-controls").innerHTML =
      '<div class="control-item"><div class="control-label"><span>Step (scrub time or step)</span><span class="val" id="ctrl-st">0</span></div>' +
      '<div><button class="preset-btn" id="b-prev" data-preset="b-prev">Prev</button> <button class="preset-btn" id="b-next" data-preset="b-next">Next</button></div></div>';
    document.getElementById("b-prev").onclick = function(){ App.state.t = Math.max(0, App.state.t - 1); var sc = document.getElementById("time-scrubber"); if(sc) sc.value = App.state.t; draw(App.state.t); };
    document.getElementById("b-next").onclick = function(){ App.state.t = Math.min(App.state.maxT, App.state.t + 1); var sc = document.getElementById("time-scrubber"); if(sc) sc.value = App.state.t; draw(App.state.t); };
    draw(0);
  }
  function mouse(x, alive, label, col){
    var s = '<circle cx="' + x + '" cy="170" r="26" fill="' + (alive ? col : '#1e293b') + '" stroke="#64748b"/>';
    s += '<circle cx="' + (x - 9) + '" cy="163" r="3" fill="#0f172a"/><circle cx="' + (x + 9) + '" cy="163" r="3" fill="#0f172a"/>';
    if(!alive){ s += '<line x1="' + (x - 18) + '" y1="150" x2="' + (x + 18) + '" y2="190" stroke="#f87171" stroke-width="3"/>'; }
    s += '<text x="' + x + '" y="215" fill="#94a3b8" font-size="11" text-anchor="middle">' + label + '</text>';
    return s;
  }
  function draw(t){
    var svg = svgEl(); if(!svg) return;
    var m = '<rect width="720" height="300" fill="#09131d"/>';
    if(exp === "griffith"){
      var st = stageOf(t, 5);
      var elb = document.getElementById("ctrl-st"); if(elb) elb.textContent = st;
      var groups = ["live R", "live S", "heat-killed S", "heat-killed S + live R", "recovered live S"];
      var alive = [true, false, true, false, false];
      m += '<text x="360" y="30" fill="#94a3b8" font-size="13" text-anchor="middle">Griffith: Streptococcus pneumoniae S (smooth, virulent) vs R (rough)</text>';
      m += '<text x="360" y="52" fill="#e2e8f0" font-size="14" text-anchor="middle">Step ' + (st + 1) + '/5: ' + groups[st] + ' -&gt; mouse ' + (alive[st] ? 'LIVES' : 'DIES') + '</text>';
      m += mouse(150, alive[st], "mouse", "#34d399");
      m += '<rect x="260" y="120" width="120" height="90" rx="8" fill="#0f1f2e" stroke="#334155"/>';
      m += '<text x="320" y="145" fill="#94a3b8" font-size="11" text-anchor="middle">injected</text>';
      m += '<text x="320" y="165" fill="#e2e8f0" font-size="11" text-anchor="middle">' + groups[st] + '</text>';
      m += '<text x="520" y="130" fill="#f87171" font-size="12">transforming</text>';
      m += '<text x="520" y="148" fill="#f87171" font-size="12">principle moves</text>';
      m += '<text x="520" y="166" fill="#94a3b8" font-size="12">R -&gt; virulent S</text>';
      m += '<text x="520" y="190" fill="#94a3b8" font-size="11">chemistry unknown</text>';
      m += '<text x="520" y="206" fill="#94a3b8" font-size="11">at this stage</text>';
      svg.innerHTML = m;
      readout(cell("step", (st + 1) + " / 5") + cell("mix", groups[st]) + cell("mouse", alive[st] ? "lives" : "dies", alive[st] ? "#34d399" : "#f87171"));
      verdict("<b>Section 5.2 (Griffith 1928):</b> heat-killed S alone is harmless, but heat-killed S + live R kills and yields live S — R was <b>transformed</b>. Scrub time to walk the four injections plus recovery.");
    } else if(exp === "avery"){
      var sa = stageOf(t, 4);
      var ela = document.getElementById("ctrl-st"); if(ela) ela.textContent = sa;
      var names = ["DNA alone", "+ protease", "+ RNase", "+ DNase"];
      var works = [true, true, true, false];
      m += '<text x="360" y="30" fill="#94a3b8" font-size="13" text-anchor="middle">Avery-MacLeod-McCarty 1933-44: purified fractions from heat-killed S</text>';
      m += '<text x="360" y="54" fill="#e2e8f0" font-size="14" text-anchor="middle">' + names[sa] + ': transformation ' + (works[sa] ? 'WORKS (R-&gt;S)' : 'BLOCKED') + '</text>';
      for(var i = 0; i < 4; i++){
        var xx = 120 + i * 160;
        var hot = (i === sa);
        m += '<rect x="' + (xx - 60) + '" y="100" width="120" height="90" rx="8" fill="' + (hot ? '#1e3a5f' : '#0f1f2e') + '" stroke="' + (hot ? '#38bdf8' : '#334155') + '"/>';
        m += '<text x="' + xx + '" y="130" fill="#e2e8f0" font-size="11" text-anchor="middle">' + names[i] + '</text>';
        m += '<text x="' + xx + '" y="155" fill="' + (works[i] ? '#34d399' : '#f87171') + '" font-size="13" text-anchor="middle">' + (works[i] ? 'S colonies' : 'no S') + '</text>';
      }
      m += '<text x="360" y="240" fill="#94a3b8" font-size="12" text-anchor="middle">Protease/RNase spare it; DNase destroys it -&gt; DNA is the hereditary material</text>';
      svg.innerHTML = m;
      readout(cell("fraction", names[sa]) + cell("R->S", works[sa] ? "yes" : "no", works[sa] ? "#34d399" : "#f87171") + cell("verdict", works[sa] ? "DNA intact" : "DNA digested"));
      verdict("<b>Section 5.2 (Avery):</b> only <b>DNase abolishes</b> transformation; proteases and RNases do not. DNA, not protein or RNA, is the transforming principle.");
    } else {
      var sh = stageOf(t, 4);
      var elh = document.getElementById("ctrl-st"); if(elh) elh.textContent = sh;
      var labels = ["label phage", "infect + blend", "centrifuge", "read pellet/supernatant"];
      m += '<text x="360" y="30" fill="#94a3b8" font-size="13" text-anchor="middle">Hershey-Chase 1952: 32P labels DNA, 35S labels protein (Fig. 5.5)</text>';
      m += '<text x="360" y="54" fill="#e2e8f0" font-size="14" text-anchor="middle">Step: ' + labels[sh] + '</text>';
      m += '<rect x="120" y="100" width="200" height="120" rx="8" fill="#0f1f2e" stroke="#334155"/>';
      m += '<text x="220" y="125" fill="#94a3b8" font-size="11" text-anchor="middle">E. coli + phage</text>';
      var bob = 130 + ((t * 40) % 60);
      m += '<circle cx="180" cy="' + bob + '" r="8" fill="none" stroke="#f59e0b" stroke-width="2"/>';
      m += '<circle cx="260" cy="' + (220 - ((t * 40) % 60)) + '" r="8" fill="none" stroke="#38bdf8" stroke-width="2"/>';
      m += '<text x="220" y="205" fill="#94a3b8" font-size="11" text-anchor="middle">blender strips coats</text>';
      m += '<rect x="400" y="100" width="200" height="120" rx="8" fill="#0f1f2e" stroke="#334155"/>';
      m += '<rect x="410" y="170" width="180" height="40" fill="#164e63"/>';
      m += '<text x="500" y="163" fill="#94a3b8" font-size="11" text-anchor="middle">supernatant: coats (35S hot)</text>';
      m += '<text x="500" y="205" fill="#34d399" font-size="11" text-anchor="middle">pellet: cells (32P hot)</text>';
      m += '<text x="360" y="255" fill="#94a3b8" font-size="12" text-anchor="middle">32P enters cells; 35S stays out -&gt; DNA passed virus -&gt; bacterium</text>';
      svg.innerHTML = m;
      readout(cell("32P (DNA)", "pellet hot", "#34d399") + cell("35S (protein)", "supernatant hot", "#f59e0b") + cell("step", labels[sh]));
      verdict("<b>Exercise 7 / Fig. 5.5:</b> blend, then spin: radioactivity in the <b>pellet only for 32P</b> proves <b>DNA entered</b>; 35S stays in coats. DNA is the genetic material.");
    }
  }
  return { mount: mount, draw: draw };
})();

      if(hyb > 0) m += '<rect x="100" y="155" width="110" height="14" fill="#a78bfa"/>';

      m += '<text x="380" y="138" fill="#f87171" font-size="13">heavy = ' + (heavy * 100).toFixed(1) + '%</text>';
      m += '<text x="380" y="168" fill="#e2e8f0" font-size="12">Gen I: hybrid only. Gen II: 50/50.</text>';
      m += '<text x="380" y="188" fill="#e2e8f0" font-size="12">80 min (4 gen): 12.5% hybrid, 87.5% light.</text>';
      m += '<text x="380" y="212" fill="#94a3b8" font-size="12">Taylor (Vicia faba) confirms on chromosomes.</text>';
      m += '<text x="380" y="236" fill="#94a3b8" font-size="12">Each duplex: 1 parental + 1 new strand.</text>';
      svg.innerHTML = m;
      readout(cell("gen", gen) + cell("hybrid", (hyb * 100).toFixed(1) + "%", "#a78bfa") + cell("light", (light * 100).toFixed(1) + "%", "#38bdf8") + cell("heavy", (heavy * 100).toFixed(1) + "%", "#f87171"));
      if(gen === 1) verdict("<b>Section 5.4.1 / Fig. 5.7:</b> after one doubling every duplex is <b>hybrid</b> — rules out conservative/dispersive. Daughters each keep one parental strand (<b>Exercise 5</b>).");
      else if(gen === 2) verdict("<b>Fig. 5.7 Gen II (40 min):</b> equal <b>hybrid + light</b> bands. Hybrid fraction halves each round: 2/2^n.");
      else verdict("<b>In-text 80-min check:</b> 80/20 = 4 generations, hybrid = 2/16 = <b>12.5%</b>, light 87.5%. Semiconservative replication confirmed.");
    } else {
      var open = 60 + (t / 4) * 120;
      m += '<text x="360" y="26" fill="#94a3b8" font-size="13" text-anchor="middle">Fork: polymerase builds 5-3 only; ~2000 bp/s; dNTPs = substrate + energy (Fig. 5.8)</text>';
      m += '<line x1="80" y1="120" x2="' + (300 + open) + '" y2="120" stroke="#38bdf8" stroke-width="4"/>';
      m += '<line x1="80" y1="180" x2="' + (300 + open) + '" y2="180" stroke="#f59e0b" stroke-width="4"/>';
      m += '<text x="90" y="110" fill="#38bdf8" font-size="11">template 3-5: continuous</text>';
      m += '<text x="90" y="205" fill="#f59e0b" font-size="11">template 5-3: fragments + ligase</text>';
      for(var i = 0; i < 4; i++){
        var fx = 120 + i * 45;
        m += '<rect x="' + fx + '" y="150" width="34" height="12" fill="#1e3a5f" stroke="#38bdf8"/>';
      }
      m += '<text x="' + (300 + open + 8) + '" y="155" fill="#34d399" font-size="12">fork opens</text>';
      m += '<text x="480" y="120" fill="#94a3b8" font-size="12">ori required (vectors supply ori)</text>';
      m += '<text x="480" y="145" fill="#94a3b8" font-size="12">E. coli 4.6 x 10^6 bp in 18 min</text>';
      m += '<text x="480" y="170" fill="#94a3b8" font-size="12">eukaryotes: S-phase; failure -&gt; polyploidy</text>';
      m += '<text x="480" y="200" fill="#f59e0b" font-size="12">DNA ligase joins fragments</text>';
      svg.innerHTML = m;
      readout(cell("rate", "2000 bp/s", "#38bdf8") + cell("leading", "continuous") + cell("lagging", "fragments + ligase", "#f59e0b") + cell("origin", "ori needed"));
      verdict("<b>Section 5.4.2:</b> polymerase only builds <b>5-3</b>, so one side is continuous and the other is <b>discontinuous fragments joined by ligase</b>. Polymerase cannot initiate — <b>ori</b> defines start.");
    }
  }
  return { mount: mount, draw: draw };
})();

window.SIMS["genetic-code-trna-mutation"] = (function(){
  var mut = "none";
  var CODE = { AUG: "Met", UUU: "Phe", UUC: "Phe", UAA: "STOP", UAG: "STOP", UGA: "STOP", GAG: "Glu", GUG: "Val", CGU: "Arg", AAA: "Lys" };
  function mount(){
    App.state.maxT = 6;
    var s = document.getElementById("time-scrubber"); if(s) s.max = 6;
    document.getElementById("lab-legend").innerHTML =
      '<div class="legend-item"><span class="legend-dot" style="background:#38bdf8;"></span><span>Sense codon</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#f87171;"></span><span>Stop / shifted frame</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#34d399;"></span><span>Start AUG</span></div>';
    document.getElementById("preset-bar").innerHTML =
      '<button class="preset-btn active" id="p-no" data-preset="p-no">In-text: 7 codons</button>' +
      '<button class="preset-btn" id="p-fs" data-preset="p-fs">Frameshift +1 (RAM demo)</button>' +
      '<button class="preset-btn" id="p-3" data-preset="p-3">Insert 3 (frame kept)</button>' +
      '<button class="preset-btn" id="p-sc" data-preset="p-sc">Sickle GAG-&gt;GUG</button>';
    document.getElementById("p-no").onclick = function(){ setActivePreset(this); mut = "none"; draw(App.state.t); };
    document.getElementById("p-fs").onclick = function(){ setActivePreset(this); mut = "fs"; draw(App.state.t); };
    document.getElementById("p-3").onclick = function(){ setActivePreset(this); mut = "ins3"; draw(App.state.t); };
    document.getElementById("p-sc").onclick = function(){ setActivePreset(this); mut = "sickle"; draw(App.state.t); };
    document.getElementById("lab-controls").innerHTML =
      '<div class="control-item"><div class="control-label"><span>tRNA view</span><span class="val">clover-leaf</span></div>' +
      '<div style="font-size:12px;color:#94a3b8">anticodon loop + 3 acceptor; no tRNA for stops; initiator for AUG</div></div>';
    draw(0);
  }
  function codonsFor(){
    if(mut === "sickle") return ["GAG", "UUC", "AUG"];
    return ["AUG", "UUU", "UUC", "UUC", "UUU", "UUU", "UUC"];
  }
  function draw(t){
    var svg = svgEl(); if(!svg) return;
    var codons = codonsFor();
    var m = '<rect width="720" height="300" fill="#09131d"/>';
    m += '<text x="360" y="26" fill="#94a3b8" font-size="13" text-anchor="middle">Gamow triplet 4^3 = 64 = 61 sense + 3 stops; degenerate, contiguous, nearly universal</text>';
    var disp = [], i;
    if(mut === "fs"){
      var joined = codons.join("").split("");
      joined.splice(1, 0, "B");
      var jstr = joined.join("");
      for(i = 0; i < 7; i++){ disp.push(jstr.substr(i * 3, 3)); }
      m += '<text x="360" y="48" fill="#f87171" font-size="12" text-anchor="middle">RAM-HAS-RED-CAP + 1 base -&gt; RAM-HAS-BRE-DCA-P: frame shifted after insertion</text>';
    } else if(mut === "ins3"){
      m += '<text x="360" y="48" fill="#34d399" font-size="12" text-anchor="middle">RAM-HAS-BIG-RED-CAP: 3-base insert adds codons, frame preserved</text>';
      disp = codons.slice(0, 7);
    } else if(mut === "sickle"){
      m += '<text x="360" y="48" fill="#f59e0b" font-size="12" text-anchor="middle">Point mutation: beta-globin GAG (Glu) -&gt; GUG (Val) = sickle-cell anaemia</text>';
      disp = ["GUG", "UUC", "AUG"];
    } else {
      m += '<text x="360" y="48" fill="#e2e8f0" font-size="12" text-anchor="middle">-AUG UUU UUC UUC UUU UUU UUC- =&gt; Met-Phe x 6 (reverse is ambiguous: Phe = UUU/UUC)</text>';
      disp = codons;
    }
    for(i = 0; i < disp.length; i++){
      var cx = 60 + i * 92;
      var aa = CODE[disp[i]] || "?";
      var isStart = disp[i] === "AUG" && mut !== "sickle";
      var isStop = (aa === "STOP");
      var shifted = (mut === "fs");
      var col = isStop || shifted ? "#f87171" : (isStart ? "#34d399" : "#38bdf8");
      m += '<rect x="' + cx + '" y="80" width="80" height="46" rx="6" fill="#0f1f2e" stroke="' + col + '"/>';
      m += '<text x="' + (cx + 40) + '" y="100" fill="#e2e8f0" font-size="12" text-anchor="middle">' + disp[i] + '</text>';
      m += '<rect x="' + cx + '" y="132" width="80" height="40" rx="6" fill="#0f1f2e" stroke="' + col + '"/>';
      m += '<text x="' + (cx + 40) + '" y="157" fill="' + col + '" font-size="12" text-anchor="middle">' + aa + '</text>';
    }
    var pulse = 150 + Math.sin(t * 3) * 4;
    m += '<g><line x1="560" y1="200" x2="560" y2="230" stroke="#34d399" stroke-width="4"/>';
    m += '<line x1="560" y1="200" x2="520" y2="225" stroke="#34d399" stroke-width="4"/>';
    m += '<line x1="560" y1="200" x2="600" y2="225" stroke="#34d399" stroke-width="4"/>';
    m += '<circle cx="560" cy="' + pulse + '" r="10" fill="none" stroke="#34d399" stroke-width="2"/>';
    m += '<text x="560" y="262" fill="#94a3b8" font-size="11" text-anchor="middle">tRNA: anticodon + acceptor</text>';
    m += '<text x="560" y="276" fill="#94a3b8" font-size="11" text-anchor="middle">clover-leaf -&gt; inverted L (Fig. 5.12)</text></g>';
    m += '<text x="200" y="240" fill="#94a3b8" font-size="12">AUG = Met + start (dual); UAA/UAG/UGA stop; UUU = Phe.</text>';
    svg.innerHTML = m;
    readout(cell("codons", "64", "#38bdf8") + cell("sense", "61") + cell("stops", "UAA/UAG/UGA", "#f87171") + cell("start", "AUG=Met", "#34d399"));
    if(mut === "fs") verdict("<b>Section 5.6.1 RAM demo:</b> insert/delete of <b>1-2 bases shifts the frame</b> from that point (RAM-HAS-BRE-DCA-P); insert of <b>3 keeps the frame</b> (BIG-RED-CAP).");
    else if(mut === "ins3") verdict("<b>Section 5.6.1:</b> a 3 (or multiple of 3) indel adds/loses codon(s) but the <b>frame is preserved</b> — RAM-HAS-BIG-RED-CAP.");
    else if(mut === "sickle") verdict("<b>Section 5.6.1:</b> point mutation <b>GAG-&gt;GUG</b> swaps <b>Glu-&gt;Val</b> in beta-globin — <b>sickle-cell anaemia</b> from one base.");
    else verdict("<b>Section 5.6 (in-text):</b> AUG UUU UUC UUC UUU UUU UUC = <b>Met-Phe-Phe-Phe-Phe-Phe-Phe</b>. Code is <b>degenerate</b>, so aa-&gt;nt has 2^6 = 64 answers for the Phes.");
  }
  return { mount: mount, draw: draw };
})();

      m += '<text x="' + cx + '" y="154" fill="#e2e8f0" font-size="11" text-anchor="middle">' + codons[i] + '</text>';
    }
    var rx = 190 + phase * 130 + Math.sin(t * 2) * 4;
    m += '<rect x="' + (rx - 70) + '" y="70" width="150" height="60" rx="12" fill="#451a03" stroke="#f59e0b"/>';
    m += '<rect x="' + (rx - 70) + '" y="180" width="150" height="46" rx="10" fill="#451a03" stroke="#f59e0b"/>';
    m += '<text x="' + (rx + 5) + '" y="105" fill="#f59e0b" font-size="11" text-anchor="middle">ribosome</text>';
    m += '<text x="' + (rx + 5) + '" y="120" fill="#94a3b8" font-size="10" text-anchor="middle">small + large; 23S</text>';
    if(phase === 0){
      m += '<text x="360" y="250" fill="#34d399" font-size="13" text-anchor="middle">Initiation: ribosome binds mRNA; AUG recognised only by initiator tRNA.</text>';
      cx = 190;
      m += '<rect x="' + (cx - 18) + '" y="185" width="36" height="50" rx="6" fill="#064e3b" stroke="#34d399"/>';
      m += '<text x="' + cx + '" y="212" fill="#e2e8f0" font-size="10" text-anchor="middle">Met</text>';
    } else if(phase === 1){
      m += '<text x="360" y="250" fill="#34d399" font-size="13" text-anchor="middle">Elongation: aa-tRNA pairs by anticodon; ribosome steps codon to codon.</text>';
      for(i = 0; i < 3; i++){
        cx = rx - 30 + i * 32;
        m += '<rect x="' + (cx - 15) + '" y="185" width="30" height="48" rx="6" fill="#064e3b" stroke="#34d399"/>';
      }
      m += '<polyline points="' + (rx - 45) + ',70 ' + (rx - 10) + ',55 ' + (rx + 25) + ',70" fill="none" stroke="#34d399" stroke-width="3"/>';
      m += '<text x="' + (rx + 5) + '" y="50" fill="#34d399" font-size="11" text-anchor="middle">Met-Phe-Phe-...</text>';
    } else {
      m += '<text x="360" y="250" fill="#f59e0b" font-size="13" text-anchor="middle">Termination: release factor binds UAA (no tRNA for stops); chain released.</text>';
      m += '<rect x="' + (rx + 20) + '" y="185" width="44" height="48" rx="6" fill="#7c2d12" stroke="#f59e0b"/>';
      m += '<text x="' + (rx + 42) + '" y="212" fill="#e2e8f0" font-size="9" text-anchor="middle">RF</text>';
      m += '<text x="' + (rx - 60) + '" y="60" fill="#34d399" font-size="11">free polypeptide</text>';
    }
    m += '<text x="360" y="278" fill="#94a3b8" font-size="11" text-anchor="middle">Phase: ' + names[phase] + ' (scrub time 0-3). Charging = ATP + aa + tRNA -&gt; aminoacyl-tRNA.</text>';
    svg.innerHTML = m;
    readout(cell("phase", names[phase], phase === 2 ? "#f59e0b" : "#34d399") + cell("catalyst", "23S rRNA", "#f59e0b") + cell("proteins", "~80") + cell("sites", "2 tRNA"));
    if(phase === 0) verdict("<b>Section 5.7:</b> <b>charging</b> (ATP links aa to cognate tRNA) precedes synthesis; <b>initiation</b> needs ribosome + mRNA + <b>initiator tRNA at AUG</b> (Exercise 9).");
    else if(phase === 1) verdict("<b>Section 5.7 / Fig. 5.13:</b> <b>elongation</b> adds residues as aa-tRNAs pair by <b>anticodon</b>; peptide bonds catalysed by <b>23S rRNA ribozyme</b>.");
    else verdict("<b>Section 5.7:</b> <b>release factor binds stop</b> (UAA/UAG/UGA have no tRNAs); translation ends and the <b>polypeptide is released</b>. UTRs flank for efficiency.");
  }
  return { mount: mount, draw: draw };
})();

window.SIMS["lac-operon-regulation"] = (function(){
  var lactose = false;
  function mount(){
    App.state.maxT = 6;
    var s = document.getElementById("time-scrubber"); if(s) s.max = 6;
    document.getElementById("lab-legend").innerHTML =
      '<div class="legend-item"><span class="legend-dot" style="background:#f87171;"></span><span>Repressor (i product)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#34d399;"></span><span>RNA polymerase + mRNA</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#38bdf8;"></span><span>z / y / a enzymes</span></div>';
    document.getElementById("preset-bar").innerHTML =
      '<button class="preset-btn active" id="p-off" data-preset="p-off">No lactose: OFF</button>' +
      '<button class="preset-btn" id="p-on" data-preset="p-on">+ lactose: ON</button>' +
      '<button class="preset-btn" id="p-done" data-preset="p-done">Ex 10: inducer eaten: OFF</button>';
    document.getElementById("p-off").onclick = function(){ setActivePreset(this); lactose = false; draw(App.state.t); };
    document.getElementById("p-on").onclick = function(){ setActivePreset(this); lactose = true; draw(App.state.t); };
    document.getElementById("p-done").onclick = function(){ setActivePreset(this); lactose = false; draw(App.state.t); };
    document.getElementById("lab-controls").innerHTML =
      '<div class="control-item"><div class="control-label"><span>Lactose / allolactose</span><span class="val" id="ctrl-l">absent</span></div>' +
      '<input type="range" id="ctrl-l-range" min="0" max="1" step="1" value="0"></div>';
    document.getElementById("ctrl-l-range").oninput = function(){
      lactose = numEl("ctrl-l-range", 0) === 1;
      draw(App.state.t);
    };
    draw(0);
  }
  function draw(t){
    var svg = svgEl(); if(!svg) return;
    var lr = document.getElementById("ctrl-l-range"); if(lr) lr.value = lactose ? 1 : 0;
    var elb = document.getElementById("ctrl-l"); if(elb) elb.textContent = lactose ? "present" : "absent";
    var on = lactose;
    var m = '<rect width="720" height="300" fill="#09131d"/>';
    m += '<text x="360" y="26" fill="#94a3b8" font-size="13" text-anchor="middle">lac operon (Jacob + Monod): i + p + o + z + y + a (Fig. 5.14)</text>';
    var genes = ["i", "p", "o", "z", "y", "a"];
    var cols = ["#f87171", "#34d399", "#f59e0b", "#38bdf8", "#38bdf8", "#38bdf8"];
    var i, gx;
    for(i = 0; i < genes.length; i++){
      gx = 80 + i * 95;
      m += '<rect x="' + gx + '" y="100" width="80" height="52" rx="6" fill="#0f1f2e" stroke="' + cols[i] + '"/>';
      m += '<text x="' + (gx + 40) + '" y="130" fill="#e2e8f0" font-size="15" text-anchor="middle">' + genes[i] + '</text>';
    }
    m += '<text x="120" y="175" fill="#94a3b8" font-size="10" text-anchor="middle">repressor</text>';
    m += '<text x="215" y="175" fill="#94a3b8" font-size="10" text-anchor="middle">promoter</text>';
    m += '<text x="310" y="175" fill="#94a3b8" font-size="10" text-anchor="middle">operator</text>';
    m += '<text x="405" y="175" fill="#94a3b8" font-size="10" text-anchor="middle">beta-gal</text>';
    m += '<text x="500" y="175" fill="#94a3b8" font-size="10" text-anchor="middle">permease</text>';
    m += '<text x="595" y="175" fill="#94a3b8" font-size="10" text-anchor="middle">transac.</text>';
    if(!on){
      m += '<rect x="290" y="60" width="60" height="34" rx="6" fill="#f87171"/>';
      m += '<text x="320" y="82" fill="#0f172a" font-size="10" text-anchor="middle">REP</text>';
      m += '<line x1="320" y1="94" x2="310" y2="100" stroke="#f87171" stroke-width="3"/>';
      m += '<text x="480" y="82" fill="#64748b" font-size="12">polymerase BLOCKED at o</text>';
      m += '<text x="360" y="220" fill="#f87171" font-size="14" text-anchor="middle">STATUS: OFF - repressor bound to operator</text>';
    } else {
      var wob = Math.sin(t * 3) * 3;
      m += '<rect x="120" y="60" width="60" height="34" rx="6" fill="#1e293b" stroke="#f87171"/>';
      m += '<text x="150" y="82" fill="#f87171" font-size="10" text-anchor="middle">REP+X</text>';
      m += '<text x="250" y="70" fill="#f59e0b" font-size="11">lactose/allolactose</text>';
      m += '<text x="250" y="86" fill="#94a3b8" font-size="11">inactivates repressor</text>';
      m += '<line x1="360" y1="' + (90 + wob) + '" x2="620" y2="' + (90 + wob) + '" stroke="#34d399" stroke-width="3"/>';
      m += '<polygon points="620,' + (90 + wob) + ' 610,' + (84 + wob) + ' 610,' + (96 + wob) + '" fill="#34d399"/>';
      m += '<text x="480" y="115" fill="#34d399" font-size="11">pol transcribes z/y/a</text>';
      m += '<text x="360" y="220" fill="#34d399" font-size="14" text-anchor="middle">STATUS: ON - enzymes for lactose metabolism made</text>';
    }
    m += '<text x="360" y="248" fill="#94a3b8" font-size="12" text-anchor="middle">z: lactose-&gt;galactose+glucose; y: entry; a: transacetylase. Basal leak lets first lactose in.</text>';
    m += '<text x="360" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">Glucose/galactose cannot induce. Negative regulation by repressor.</text>';
    svg.innerHTML = m;
    readout(cell("inducer", on ? "present" : "absent", on ? "#34d399" : "#f87171") + cell("repressor", on ? "off DNA" : "on operator") + cell("z/y/a", on ? "transcribed" : "blocked", on ? "#34d399" : "#f87171"));
    if(on) verdict("<b>Section 5.8.1:</b> <b>lactose/allolactose inactivates repressor</b>; polymerase transcribes <b>z (beta-gal), y (permease), a (transacetylase)</b>. i = <b>inhibitor</b>, not inducer.");
    else verdict("<b>Exercise 10:</b> enzymes consume the inducer; freed <b>repressor rebinds o</b> and shuts the operon — substrate induces its own enzymes (<b>negative regulation</b>).");
  }
  return { mount: mount, draw: draw };
})();

window.SIMS["hgp-fingerprinting"] = (function(){
  var suspect = "B";
  function mount(){
    App.state.maxT = 6;
    var s = document.getElementById("time-scrubber"); if(s) s.max = 6;
    document.getElementById("lab-legend").innerHTML =
      '<div class="legend-item"><span class="legend-dot" style="background:#38bdf8;"></span><span>VNTR bands (0.1-20 kb)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#34d399;"></span><span>Scene match</span></div>';
    document.getElementById("preset-bar").innerHTML =
      '<button class="preset-btn" id="p-a" data-preset="p-a">Suspect A</button>' +
      '<button class="preset-btn active" id="p-b" data-preset="p-b">Suspect B (scene match)</button>' +
      '<button class="preset-btn" id="p-c" data-preset="p-c">Suspect C</button>';
    document.getElementById("p-a").onclick = function(){ setActivePreset(this); suspect = "A"; draw(App.state.t); };
    document.getElementById("p-b").onclick = function(){ setActivePreset(this); suspect = "B"; draw(App.state.t); };
    document.getElementById("p-c").onclick = function(){ setActivePreset(this); suspect = "C"; draw(App.state.t); };
    document.getElementById("lab-controls").innerHTML =
      '<div class="control-item"><div class="control-label"><span>HGP portrait</span><span class="val">3164.7 Mb</span></div>' +
      '<div style="font-size:12px;color:#94a3b8">~30,000 genes; &lt;2% coding; chr1 2968 / Y 231; 1.4M SNPs; 99.9% identical</div></div>';
    draw(0);
  }
  function lane(x, bands, label, hi){
    var s = '<rect x="' + (x - 45) + '" y="70" width="90" height="180" fill="#0f1f2e" stroke="' + (hi ? '#34d399' : '#334155') + '" stroke-width="' + (hi ? 3 : 1) + '"/>';
    for(var i = 0; i < bands.length; i++){
      s += '<rect x="' + (x - 32) + '" y="' + bands[i] + '" width="64" height="8" rx="2" fill="' + (hi ? '#34d399' : '#38bdf8') + '"/>';
    }
    s += '<text x="' + x + '" y="268" fill="' + (hi ? '#34d399' : '#94a3b8') + '" font-size="12" text-anchor="middle">' + label + '</text>';
    return s;
  }
  function draw(t){
    var svg = svgEl(); if(!svg) return;
    var scene = [95, 130, 170, 205];
    var A = [95, 145, 175, 220];
    var B = [95, 130, 170, 205];
    var C = [100, 140, 185, 215];
    var m = '<rect width="720" height="300" fill="#09131d"/>';
    m += '<text x="360" y="26" fill="#94a3b8" font-size="13" text-anchor="middle">Jeffreys VNTR-Southern blot: isolate - restrict - electrophorese - blot - probe - autoradiograph (Sec 5.10)</text>';
    var pick = suspect === "A" ? A : (suspect === "B" ? B : C);
    var matchA = (suspect === "A") && (A.join() === scene.join());
    var matchB = (suspect === "B") && (B.join() === scene.join());
    var matchC = (suspect === "C") && (C.join() === scene.join());
    m += lane(150, scene, "crime scene", true);
    m += lane(300, A, "suspect A", suspect === "A");
    m += lane(450, B, "suspect B", suspect === "B");
    m += lane(600, C, "suspect C", suspect === "C");
    var isMatch = pick.join() === scene.join();
    var glow = 0.6 + 0.4 * Math.sin(t * 3);
    if(isMatch){
      m += '<line x1="195" y1="' + (130 + glow * 6) + '" x2="405" y2="130" stroke="#34d399" stroke-width="2" stroke-dasharray="5 4"/>';
      m += '<text x="300" y="55" fill="#34d399" font-size="13" text-anchor="middle">MATCH: suspect ' + suspect + ' bands = scene (Fig. 5.16 logic)</text>';
    } else {
      m += '<text x="360" y="55" fill="#f87171" font-size="13" text-anchor="middle">NO MATCH: suspect ' + suspect + ' bands differ - exclude</text>';
    }
    m += '<text x="360" y="290" fill="#94a3b8" font-size="11" text-anchor="middle">HGP 1990-2003; 3 x 10^9 bp; 3300 books; BAC/YAC + Sanger; PCR -&gt; single-cell; twins excepted.</text>';
    svg.innerHTML = m;
    readout(cell("scene bands", scene.length) + cell("suspect " + suspect, isMatch ? "MATCH" : "no match", isMatch ? "#34d399" : "#f87171") + cell("probe", "VNTR mini-satellite") + cell("differing bp", "~3 million"));
    if(isMatch) verdict("<b>Exercise 13 / Fig. 5.16:</b> suspect <b>" + suspect + "</b> matches the scene — VNTR copy-number patterns are unique per individual (identical twins excepted). Uses: <b>forensics, paternity, diversity</b>.");
    else verdict("<b>Section 5.10:</b> 0.1% of 3 x 10^9 = <b>3 million</b> differing bp; <b>polymorphism (&gt;0.01)</b> in <b>VNTR 0.1-20 kb</b> gives unique Southern bands. Select another suspect to find the Fig. 5.16-style match.");
  }
  return { mount: mount, draw: draw };
})();
