<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 5: Molecular Basis of Inheritance — Interactive Textbook</title>
<style>

:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
  margin: 0;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
}
/* width:100% stops main from sizing to the scrolling concept list's content width */
main { min-width: 0; width: 100%; }

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav, .revision-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover, .revision-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active, .revision-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num, .revision-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num, .revision-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  .topbar {
    padding: 0 10px;
    height: 56px;
  }
  .chapter-crumb {
    display: none !important;
  }
  .top-actions {
    gap: 6px;
  }
  .progress-pill span:first-child {
    display: none !important;
  }
  .progress-pill progress {
    width: 44px;
  }
  .toolbar-btn {
    padding: 4px 8px;
    font-size: 12px;
  }
  main { padding: 16px 12px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
.concept-title {
  font: 34px/1.2 Georgia, "Times New Roman", serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.3px;
}
@media (max-width: 640px) {
  .concept-title { font-size: 27px; }
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
  min-width: 0;
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 2px 16px;
  font-size: 12.5px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  max-height: 460px;
  touch-action: pan-y;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  /* No text-transform: labels contain case-sensitive symbols such as s₁, u, t. */
  font-size: 12px;
  color: #94a3b8;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font-size: 16px;
  line-height: 1.35;
  font-weight: 700;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: var(--radius-sm);
  position: relative;
  overflow: hidden;
  border: none;
  padding: 0;
  cursor: pointer;
  display: block;
}
.video-facade img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
}
.play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 48px;
  height: 48px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.video-title {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 8px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  color: #fff;
  font-size: 12px;
  text-align: left;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font-size: 16.5px;
  line-height: 1.5;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;

ng> transformation; <strong>DNase inhibits</strong> it — DNA is the hereditary material (not all biologists convinced yet).", "<strong>Hershey and Chase (1952)</strong> bacteriophage proof: phage grown on <strong>³²P labels DNA</strong> (protein has no P) and on <strong>³⁵S labels protein</strong> (DNA has no S). Infect <em>E. coli</em>, agitate in a <strong>blender</strong>, spin in a <strong>centrifuge</strong> to strip coats: <strong>³²P enters bacteria (radioactive cells), ³⁵S stays out</strong> — DNA passed from virus to bacterium (Fig. 5.5).", "Properties of a genetic material: (i) replicate, (ii) chemically/structurally stable, (iii) mutable for evolution, (iv) express as Mendelian characters. Both nucleic acids template via complementarity; proteins fail (i). <strong>DNA is more stable</strong>: heating separates strands which re-anneal; RNA's <strong>2'-OH at every nucleotide is reactive/labile</strong> and catalytic, and <strong>thymine (vs uracil)</strong> adds stability. RNA mutates faster (RNA-genome viruses evolve fast); RNA codes directly while DNA needs RNA. <strong>RNA World</strong>: RNA was first (genetic + catalytic: metabolism, translation, splicing); DNA evolved from RNA with stabilising modifications + repair."], "formulas": [{"label": "Transforming principle logic", "html": "live R + heat-killed S → live virulent S recovered ⇒ transferable genetic material", "cond": "§5.2 Griffith"}, {"label": "Hershey-Chase labels", "html": "³²P → DNA enters cell; ³⁵S → protein stays out (blender + centrifuge)", "cond": "§5.2.1 Fig. 5.5"}, {"label": "Stability rule", "html": "DNA (no 2'-OH, T not U, ds + repair) > RNA (2'-OH reactive, catalytic) in stability", "cond": "§5.2.2; §5.3 RNA world"}], "deeper": "DNAs vs DNase (in-text): DNA is the substrate, DNase the digesting enzyme — Avery's DNase control destroys transforming activity. Griffith's heat kills cells but complementary strands re-form, so transforming DNA survives. TMV and QB phage show RNA can be ion", "RNase digestion"], "answer": 0, "hint": "Which enzyme destroys the transforming substance?", "solution": "DNase inhibits transformation; protease/RNase do not — DNA is the principle.", "wrong": ["Protease leaves transformation intact.", "RNase leaves transformation intact."]}, {"level": "Hard", "type": "number", "map": "§5.2–5.2.1 years", "prompt": "Years between Griffith (1928) and Hershey-Chase (1952)", "answer": 24, "unit": "years", "tolerance": 0.5, "hint": "1952 − 1928.", "solution": "24 years of protein-vs-DNA debate closed by the blender experiment."}], "resources": [{"title": "NCERT §5.2, 5.2.1, 5.2.2, 5.3 — Genetic material proof (official PDF, PDF p.6)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo105.pdf#page=6"}]}, {"id": "dna-replication", "nav": "Replication", "title": "Semiconservative replication: Meselson-Stahl 15N bands, fork and ligase", "deck": "Watson-Crick: each strand templates a new complement — one parental + one new per duplex. 15N→14N gives hybrid then 50/50 hybrid/light. Polymerase builds 5'→3'; lagging fragments joined by ligase.", "minutes": 9, "section": "5.4, 5.4.1, 5.4.2", "pages": [10, 13], "print": "88–91", "sim": "replication", "simTitle": "Meselson-Stahl density bands + fork explorer", "quick": ["Watson-Crick (1953): '<strong>specific pairing immediately suggests a possible copying mechanism</strong>' — strands separate, each templates a complement; each daughter duplex keeps <strong>one parental + one new strand</strong>: <strong>semiconservative</strong> (Fig. 5.6).", "<strong>Meselson and Stahl (1958)</strong>: grow <em>E. coli</em> many generations on <strong>¹⁵NH₄Cl (heavy ¹⁵N)</strong>, shift to <strong>¹⁴N</strong>, sample as cells divide (20 min), extract dsDNA, spin on <strong>CsCl density gradient</strong> (¹⁵N separable by density, not radioactivity). Gen I (20 min): <strong>hybrid/intermediate density only</strong>; Gen II (40 min): <strong>equal hybrid + light</strong>; Gen III–IV halves hybrid each round (Fig. 5.7). Taylor (1958) with radioactive thymidine on <em>Vicia faba</em> confirms semiconservative chromosomes.", "Machinery: <strong>DNA-dependent DNA polymerase</strong> polymerises deoxynucleotides on a DNA template, only <strong>5'→3'</strong>, fast (~<strong>2000 bp/s</strong>; <em>E. coli</em> 4.6×10⁶ bp in 18 min) and accurate (errors → mutations). <strong>dNTPs are substrate + energy</strong> (two terminal phosphates ≈ ATP). A <strong>replication fork</strong> opens a small bubble (whole-length unwinding too costly); template 3'→5' gives <strong>continuous</strong> synthesis, template 5'→3' gives <strong>discontinuous fragments joined by DNA ligase</strong> (Fig. 5.8). Polymerase cannot initiate; <strong>origin of replication</strong> defines start (vectors supply ori for recombinant DNA).", "Eukaryotes replicate in <strong>S-phase</strong>, coordinated with division — failure after replication gives <strong>polyploidy</strong>."], "formulas": [{"label": "Semiconservative rule", "html": "parental duplex → 2 duplexes each 1 parental + 1 new strand", "cond": "§5.4 Fig. 5.6; Exercise 5"}, {"label": "Meselson-Stahl bands", "html": "Gen I 100% hybrid; Gen II 50% hybrid + 50% light; Gen n hybrid = 2/2<sup>n</sup>", "cond": "§5.4.1 Fig. 5.7"}, {"label": "Fork direction", "html": "synthesis 5'→3' only ⇒ continuous (3'→5' template) + discontinuous + ligase; ori required", "cond": "§5.4.2 Fig. 5.8"}], "deeper": "80-minute question (in-text): 80/20 = 4 generations ⇒ hybrid = 2/16 = 12.5%, light = 87.5%. Centrifugal force pellets denser (¹⁵N) DNA faster/lower in CsCl. dNTP → dNMP + PPi powers polymerisation.", "worked": "Exercise 5 reasoning: complementarity means each parental strand can direct its complement; daughters must each carry one old + one new strand — the semiconservative hypothesis Meselson-Stahl proved (hybrid band at Gen I rules out conservative/dispersive).", "prediction": {"prompt": "After shift ¹⁵N→¹⁴N, Gen I (20 min) DNA bands are", "options": ["Single hybrid/intermediate band only", "Equal heavy + light bands", "Single light band only"], "answer": 0, "explanation": "Every duplex has one heavy parental + one light new strand after one doubling."}, "connect": [["2000 letters a second", "E. coli copies 4.6 million bp in 18 minutes — polymerase speed with proofreading, paid for by dNTP energy itself."], ["Wow — heavy nitrogen as weighing scale", "¹⁵N is not radioactive; CsCl spinning simply weighs DNA — hybrid molecules float exactly between heavy and light parents.", [], {"id": "jaJ3NlqK5dA", "title": "Semi conservative replication | Biomolecules | MCAT | Khan Academy", "channel": "khanacademymedicine"}]], "recall": "State the semiconservative scheme, Meselson-Stahl protocol and Gen I/II results, fork asymmetry with ligase, ori, dNTP dual role, S-phase/polyploidy.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Semiconservative replication means each daughter duplex has", "options": ["One parental + one newly synthesised strand", "Two parental strands", "Two newly synthesised strands"], "answer": 0, "hint": "Figure 5.6.", "solution": "Each old strand templates one new complement.", "wrong": ["That is conservative (ruled out).", "That is also conservative, not seen."]}, {"level": "Medium", "type": "number", "map": "§5.4.1 Fig. 5.7", "prompt": "Percent hybrid DNA at Gen II (40 min) after ¹⁵N→¹⁴N shift", "answer": 50, "unit": "%", "tolerance": 1, "hint": "Equal hybrid + light.", "solution": "50% hybrid, 50% light."}, {"level": "Hard", "type": "number", "map": "§5.4.1 80-min question", "prompt": "Percent hybrid DNA after 80 min (4 generations, 20 min each)", "answer": 12.5, "unit": "%", "tolerance": 0.5, "hint": "Hybrid = 2/2^n.", "solution": "2/16 = 12.5% hybrid; 87.5% light."}], "resources": [{"title": "NCERT §5.4, 5.4.1, 5.4.2 — Replication (official PDF, PDF p.10)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo105.pdf#page=10"}]}, {"id": "transcription-unit", "nav": "Transcription", "title": "Transcription unit: promoter–gene–terminator, 3'→5' template, splicing/capping/tailing", "deck": "Only one strand (3'→5' template) is copied to 5'→3' RNA (U for A). Bacteria use one polymerase + sigma/rho; eukaryotes split genes (exons/introns) and process hnRNA: splice, cap, tail.", "minutes": 9, "section": "5.5, 5.5.1, 5.5.2, 5.5.3", "pages": [13, 17], "print": "91–95", "sim": "transcription", "simTitle": "Transcription-unit walker: template / coding / mRNA", "quick": ["<strong>Transcription</strong> copies one DNA segment, one strand, into RNA by complementarity (A→U). Copying both strands would code different proteins and make complementary dsRNA blocking translation — so only one strand per segment is template. A <strong>transcription unit = promoter + structural gene + terminator</strong> (Fig. 5.9).", "Conventions (coding-strand reference): the <strong>template is 3'→5'</strong>, <strong>coding is 5'→3'</strong> (same as RNA, T for U; codes nothing, displaced). Hypothetical unit: 3'-ATGC…-5' template / 5'-TACG…-3' coding ⇒ RNA 5'-UACG…-3'. <strong>Promoter (upstream, 5' of coding)</strong> binds RNA polymerase and defines strands (swap with terminator reverses them); <strong>terminator (downstream, 3')</strong> ends transcription; extra upstream/downstream regulatory sequences exist.", "<strong>Gene/cistron</strong>: functional inheritance unit; DNA coding tRNA/rRNA is also a gene; <strong>cistron</strong> = DNA coding a polypeptide — <strong>monocistronic</strong> (eukaryotes) vs <strong>polycistronic</strong> (bacteria). Eukaryotic genes are <strong>split: exons (expressed, in mature RNA) interrupted by introns (removed)</strong>; promoter/regulatory sequences affect inheritance though coding nothing.", "Bacteria: <strong>mRNA/tRNA/rRNA</strong> all by <strong>single DNA-dependent RNA polymerase</strong> (mRNA template, tRNA adapter, rRNA structural/catalytic); polymerase binds <strong>promoter → initiation</strong>, elongates 5'→3' on NTPs, falls off at <strong>terminator</strong>; <strong>sigma (initiation) / rho (termination)</strong> confer specificity (Fig. 5.10). No processing; transcription–translation <strong>coupled</strong> in same compartment. Eukaryotes: <strong>Pol I (28S/18S/5.8S rRNA), Pol III (tRNA/5S/snRNA), Pol II (hnRNA→mRNA)</strong>; hnRNA spliced (<strong>introns out, exons joined</strong>), <strong>5' capped (methyl guanosine triphosphate)</strong>, <strong>3' tailed (200–300 A, template-independent)</strong> → mRNA exported (Fig. 5.11). Split genes/splicing echo the <strong>RNA world</strong>."], "formulas": [{"label": "Strand rule", "html": "template 3'→5' → RNA 5'→3' (A→U); coding 5'→3' = RNA (T→U)", "cond": "§5.5.1; Exercises 4, 8c"}, {"label": "Transcription unit", "html": "promoter (upstream 5') — structural gene — terminator (downstream 3')", "cond": "§5.5.1 Fig. 5.9"}, {"label": "Eukaryotic processing", "html": "hnRNA → splice introns + 5' cap (mGppp) + 3' poly-A (200–300) → mRNA", "cond": "§5.5.3 Fig. 5.11"}], "deeper": "Why polymerase needs factors: core enzyme only elongates; sigma/rho switch specificity to start/stop. Bacterial mRNA needs no processing so ribosomes load before transcription finishes — coupled. Promoter position decides which strand is template.", "worked": "Q4 (Exercise 4): coding 5'-ATGCATGCATGCATGCATGCATGCATGC-3' ⇒ mRNA 5'-AUGCAUGCAUGCAUGCAUGCAUGCAUGC-3' (same sequence, U for T; 28 nt). Template (antiparallel) is 3'-TACGTACG…-5'.", "prediction": {"prompt": "Template 3'-ATGCATGC-5'. The RNA made (5'→3') is", "options": ["5'-UACGUACG-3' (A→U, T→A, G→C, C→G)", "5'-ATGCATGC-3' (identical to template)", "5'-TACGTACG-3' (identical to coding without U)"], "answer": 0, "explanation": "Complement template, U for A, written 5'→3'."}, "connect": [["One strand, not both", "Two simultaneous RNAs would be complementary and lock into untranslatable dsRNA — transcription copies one strand to keep information single-stranded."], ["Wow — cap and tail as passports", "A methyl-guanosine cap plus 200–300 extra As (added without template) license hnRNA to leave the nucleus as mRNA.", [], {"id": "JQIwwJqF5D0", "title": "Transcription and mRNA processing | Biomolecules | MCAT | Khan Academy", "channel": "Khan Academy"}]], "recall": "Define the unit, template vs coding polarity, promoter/terminator positions, mono/polycistronic, exons/introns, bacterial sigma/rho vs eukaryotic Pol I/II/III + splice/cap/tail.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The template strand has polarity", "options": ["3'→5' (RNA built 5'→3')", "5'→3' (RNA built 3'→5')", "No polarity"], "answer": 0, "hint": "Polymerase builds 5'→3'.", "solution": "Template 3'→5', coding 5'→3' same as RNA (T→U).", "wrong": ["Polymerase never builds 3'→5'.", "Polarity defines the unit."]}, {"level": "Medium", "type": "number", "map": "§5.5.3 tailing", "prompt": "Adenylate residues added at the 3'-end during tailing (lower bound)", "answer": 200, "unit": "residues", "tolerance": 60, "hint": "200–300 As.", "solution": "200–300 adenylates, template-independent."}, {"level": "Hard", "type": "number", "map": "§5.5.3 polymerases", "prompt": "Number of distinct nuclear RNA polymerases in eukaryotes (I, II, III)", "answer": 3, "unit": "polymerases", "tolerance": 0.1, "hint": "Division of labour paragraph.", "solution": "Pol I rRNAs, Pol III tRNA/5S/snRNA, Pol II hnRNA."}], "resources": [{"title": "NCERT §5.5, 5.5.1, 5.5.2, 5.5.3 — Transcription (official PDF, PDF p.13)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo105.pdf#page=13"}]}, {"id": "genetic-code-trna-mutation", "nav": "Genetic code & tRNA", "title": "64 triplets, 61 sense + 3 stop, AUG start; tRNA adapter; frameshifts", "deck": "Gamow's triplet (4³=64) cracked by Khorana/Nirenberg/Ochoa: degenerate, contiguous, universal; AUG is Met/start, UAA/UAG/UGA stop. tRNA reads with anticodon; ±1/2 bases shift frame.", "minutes": 9, "section": "5.6, 5.6.1, 5.6.2", "pages": [17, 20], "print": "95–98", "sim": "codon", "simTitle": "Codon-table translator + mutation effect", "quick": ["Replication/transcription copy nucleic acid→nucleic acid by complementarity; <strong>translation (nucleotides→amino acids)</strong> has no such complementarity, so a <strong>genetic code</strong> was proposed. <strong>Gamow</strong>: 4 bases for 20 amino acids ⇒ <strong>triplet (4³ = 64 codons)</strong>. <strong>Khorana's defined homopolymers/copolymers + Nirenberg's cell-free system + Ochoa's polynucleotide phosphorylase</strong> (template-independent RNA synthesis) cracked it (Table 5.1).", "Features: (i) <strong>triplet; 61 sense + 3 stop</strong>; (ii) <strong>degenerate</strong> (one aa, several codons); (iii) <strong>contiguous, no punctuation</strong>; (iv) <strong>nearly universal</strong> (UUU=Phe bacteria→human; mitochondrial/protozoan exceptions); (v) <strong>AUG = Met + start (dual)</strong>; (vi) <strong>UAA/UAG/UGA stop</strong>. In-text: -AUG UUU UUC UUC UUU UUU UUC- ⇒ <strong>Met-Phe-Phe-Phe-Phe-Phe-Phe</strong>; reverse (aa→nt) is ambiguous because of degeneracy.", "<strong>Mutations</strong>: large deletions/rearrangements gain/lose genes (Ch. 4); <strong>point</strong> single-bp change (e.g. β-globin <strong>Glu→Val ⇒ sickle-cell anaemia</strong>). RAM-HAS-RED-CAP demo: <strong>insert/delete 1–2 bases ⇒ frameshift</strong> from that point (RAM-HAS-BRE-DCA-P; RAM-HAS-EDC-AP); <strong>3/multiple of 3 ⇒ one/more codons gained/lost, frame preserved</strong> (RAM-HAS-BIG-RED-CAP).", "<strong>tRNA adapter (Crick)</strong>: amino acids cannot read codons, so tRNA (sRNA) reads on one end and carries the aa on the other — <strong>anticodon loop (complement) + 3' amino-acid acceptor</strong>, specific per aa; <strong>initiator tRNA</strong> for start; <strong>no tRNA for stops</strong>. Secondary <strong>clover-leaf</strong>, tertiary compact <strong>inverted L</strong> (Fig. 5.12)."], "formulas": [{"label": "Code arithmetic", "html": "4<sup>3</sup> = 64 codons = 61 sense + 3 stops (UAA, UAG, UGA); AUG = Met/start", "cond": "§5.6 (i)–(vi)"}, {"label": "Code properties", "html": "triplet, degenerate, contiguous/punctuationless, nearly universal", "cond": "§5.6 (ii)–(iv); UUU=Phe"}, {"label": "Frameshift rule", "html": "indel 1–2 ⇒ frame shifted; indel 3n ⇒ codon(s) added/lost, frame kept", "cond": "§5.6.1 RAM demo"}], "deeper": "Degeneracy ⇒ reverse prediction (Met-Phe×6) has many answers: AUG + (UUU/UUC)⁶. Contiguous ⇒ insertion shifts every downstream codon. Sickle-cell shows single-base → single-aa → disease.", "worked": "In-text translation: AUG (Met/start) then UUU/UUC all Phe ⇒ Met-Phe-Phe-Phe-Phe-Phe-Phe (7 codons, 21 nt). Opposite (aa→RNA) is indeterminate: Phe = UUU or UUC, so 2⁶ = 64 possible nt sequences for the six Phes.", "prediction": {"prompt": "Insert one letter B into RAM HAS RED CAP (triplet words). The result is", "options": ["RAM HAS BRE DCA P — frame shifted after insertion", "RAM HAS BIG RED CAP — frame preserved", "No change in reading"], "answer": 0, "explanation": "One-base indel shifts all downstream triplets; three-base indel preserves frame."}, "connect": [["Sickle-cell single letter", "GAG→GUG changes glutamate to valine in β-globin — a point mutation read straight through the triplet table into disease."], ["Wow — 64 words for 20 meanings", "Degeneracy is built-in redundancy: most amino acids own several codons, so many DNA changes leave protein unchanged.", [], {"id": "LzTxXK8nPlg", "title": "tRNA | Molecular Basis of Inheritance | Class XII | Biology | Khan Academy", "channel": "Khan Academy India - English"}]], "recall": "Give 64/61/3, AUG dual role, stops, four properties with UUU example, RAM frameshift rule, tRNA anticodon/acceptor + clover-leaf/L + no stops + initiator.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The start codon that also codes methionine is", "options": ["AUG", "UAA", "UUU"], "answer": 0, "hint": "Dual-function codon.", "solution": "AUG = Met + initiator.", "wrong": ["UAA is a stop codon.", "UUU codes phenylalanine."]}, {"level": "Medium", "type": "number", "map": "§5.6 Table 5.1", "prompt": "Number of codons in the genetic code dictionary", "answer": 64, "unit": "codons", "tolerance": 0.5, "hint": "4³.", "solution": "4×4×4 = 64."}, {"level": "Hard", "type": "number", "map": "§5.6 (i)", "prompt": "Number of sense codons coding amino acids (total minus stops)", "answer": 61, "unit": "codons", "tolerance": 0.5, "hint": "64 − 3 stops.", "solution": "61 sense + UAA/UAG/UGA stops."}], "resources": [{"title": "NCERT §5.6, 5.6.1, 5.6.2 — Genetic code & tRNA (official PDF, PDF p.17)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo105.pdf#page=17"}]}, {"id": "translation-synthesis", "nav": "Translation", "title": "Translation: charging, ribosome (23S ribozyme), initiation→termination", "deck": "Amino acids activated with ATP onto tRNA, then ribosome (small + large, 80 proteins) joins them 5'→3' along mRNA from AUG to stop where release factor frees the chain; UTRs flank.", "minutes": 8, "section": "5.7", "pages": [20, 21], "print": "98–99", "sim": "translation", "simTitle": "Ribosome stepper: initiation, elongation, termination", "quick": ["<strong>Translation</strong> polymerises amino acids into polypeptide in mRNA base order via <strong>peptide bonds</strong> (Fig. 5.13). First, amino acids are <strong>activated (ATP) and linked to cognate tRNA — charging/aminoacylation</strong>; bringing two charged tRNAs together favours peptide-bond formation with a catalyst.", "The factory is the <strong>ribosome: structural RNAs + ~80 proteins; small + large subunits</strong> (split when inactive). Small subunit meets mRNA to start; large subunit offers <strong>two sites</strong> for successive tRNAs; <strong>23S rRNA (bacteria) is the ribozyme</strong> catalysing peptide bonds.", "A <strong>translational unit = AUG start … stop codon</strong> coding a polypeptide, flanked by <strong>5' and 3' untranslated regions (UTRs)</strong> needed for efficiency. <strong>Initiation</strong>: ribosome binds mRNA at <strong>AUG recognised only by initiator tRNA</strong>. <strong>Elongation</strong>: aa-tRNA complexes bind codons via <strong>anticodon pairing</strong> as ribosome steps codon-to-codon, adding residues. <strong>Termination</strong>: <strong>release factor binds stop</strong>, translation ends, polypeptide released."], "formulas": [{"label": "Charging", "html": "amino acid + ATP + tRNA → aminoacyl-tRNA (cognate)", "cond": "§5.7 phase one"}, {"label": "Ribosome", "html": "small + large (80 proteins); 2 tRNA sites; 23S rRNA = ribozyme", "cond": "§5.7 Fig. 5.13"}, {"label": "Unit order", "html": "5'-UTR — AUG … codons … stop — 3'-UTR; initiation → elongation → release factor", "cond": "§5.7"}], "deeper": "Translation evolved around RNA: mRNA message, tRNA adapter, rRNA catalyst — the RNA-world signature. UTRs are untranslated but required for efficient initiation/termination.", "worked": "Exercise 9 reasoning: (1) ribosome binds mRNA and provides the platform bringing charged tRNAs/codons together in order; (2) it catalyses peptide-bond formation (23S rRNA ribozyme) and translocates codon-to-codon until release factor ends synthesis.", "prediction": {"prompt": "A release factor binds a stop codon (UAA). What happens?", "options": ["Translation terminates and the complete polypeptide is released", "Another amino acid is added by a stop-tRNA", "Transcription restarts"], "answer": 0, "explanation": "No tRNAs for stops; release factor ends elongation and frees the chain."}, "connect": [["Charging before building", "ATP first welds each amino acid to its tRNA — translation spends energy before the first peptide bond, so order is never left to chance."], ["Wow — RNA that is an enzyme", "The peptidyl-transfer catalyst is not protein but 23S rRNA — the ribosome is a ribozyme fossil of the RNA world.", [], {"id": "ocAAkB32Hqs", "title": "Translation (mRNA to protein) | Biomolecules | MCAT | Khan Academy", "channel": "Khan Academy"}]], "recall": "State charging, ribosome subunits/sites/80 proteins/23S ribozyme, translational unit + UTRs, and the three phases ending with release factor.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Charging of tRNA means", "options": ["ATP-driven linking of amino acid to cognate tRNA (aminoacylation)", "Adding a cap to mRNA", "Splitting the ribosome"], "answer": 0, "hint": "First phase needs energy.", "solution": "Aminoacylation activates each aa on its tRNA before peptide bonds form.", "wrong": ["Capping is hnRNA processing.", "Subunits join, not split, to initiate."]}, {"level": "Medium", "type": "number", "map": "§5.7 ribosome", "prompt": "Approximate number of different proteins in the ribosome", "answer": 80, "unit": "proteins", "tolerance": 5, "hint": "Structural RNAs plus many proteins.", "solution": "About 80 different proteins plus rRNAs."}, {"level": "Hard", "type": "mcq", "prompt": "Initiation codon recognition is unique because AUG is recognised", "options": ["Only by the initiator tRNA when ribosome binds mRNA", "By any tRNA carrying methionine", "By the release factor"], "answer": 0, "hint": "Start is special.", "solution": "Only initiator tRNA starts at AUG; elongation uses other aa-tRNAs; release factor ends at stops.", "wrong": ["Elongator Met-tRNAs do not initiate.", "Release factor binds stops, not AUG."]}], "resources": [{"title": "NCERT §5.7 — Translation (official PDF, PDF p.20)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo105.pdf#page=20"}]}, {"id": "lac-operon-regulation", "nav": "lac operon", "title": "lac operon i/p/o/z/y/a: repressor off, lactose/allolactose on (negative control)", "deck": "Jacob–Monod operon: i makes repressor that blocks o; lactose/allolactose inactivates it so polymerase transcribes z (β-gal), y (permease), a (transacetylase). Substrate regulates its own enzymes.", "minutes": 9, "section": "5.8, 5.8.1", "pages": [21, 23], "print": "99–101", "sim": "lacoperon", "simTitle": "Lactose on/off gene switch (repressor–operator)", "quick": ["Regulation can act at <strong>transcription, splicing, mRNA transport (eukaryotes), translation</strong>. <em>E. coli</em> needing <strong>β-galactosidase</strong> only with lactose around shows expression follows <strong>metabolic/physiological/environmental</strong> cues; embryo differentiation is coordinated multi-gene regulation. In prokaryotes <strong>transcription initiation</strong> dominates: accessory <strong>activators (+) / repressors (−)</strong> modulate polymerase at promoters; <strong>operators</strong> adjacent to promoters bind specific repressors (lac operator only lac repressor).", "<strong>lac operon (Jacob + Monod)</strong>: polycistronic genes under one promoter — <strong>regulatory i (inhibitor, not inducer) + structural z, y, a + promoter (p) + operator (o)</strong>. <strong>i → repressor; z → β-galactosidase</strong> (lactose→galactose+glucose); <strong>y → permease</strong> (entry of β-galactosides); <strong>a → transacetylase</strong> — all for lactose metabolism (Fig. 5.14). Operons (lac, trp, ara, his, val) group same-pathway genes.", "<strong>Inducer = lactose/allolactose</strong> (substrate). Basal leak expression lets a little lactose enter via permease. <strong>Repressor made constitutively</strong> from i binds o and <strong>blocks polymerase</strong>. Inducer binds and <strong>inactivates repressor</strong>; polymerase accesses promoter and transcribes. <strong>Glucose/galactose cannot induce</strong>. After lactose is consumed, repressor re-binds and the operon shuts — <strong>negative regulation</strong> (positive control beyond scope). Duration = while inducer present."], "formulas": [{"label": "Operon map", "html": "i (repressor) + p + o + z (β-gal) + y (permease) + a (transacetylase)", "cond": "§5.8.1 Fig. 5.14"}, {"label": "Switch logic", "html": "no inducer: repressor·o blocks pol; formatics</strong>. Goals: <strong>20,000–25,000 genes; 3 billion bp sequence; databases; tools; tech transfer; ELSI</strong>. Model organisms (bacteria, yeast, <em>C. elegans</em>, <em>Drosophila</em>, rice, <em>Arabidopsis</em>) also sequenced.", "Methods: <strong>ESTs</strong> (genes expressed as RNA) vs <strong>whole-genome blind sequencing + annotation</strong>. DNA → random small fragments → clone/amplify in <strong>bacteria/yeast with BAC/YAC vectors</strong> → <strong>Sanger automated sequencers</strong> → overlap assembly by computers (Fig. 5.15) → annotate to chromosomes. <strong>Chromosome 1 last (May 2006)</strong>; genetic/physical maps from <strong>restriction polymorphisms + microsatellites</strong>.", "Salient features: (i) <strong>3164.7 million bp</strong>; (ii) avg gene <strong>3000 bases</strong>, dystrophin largest <strong>2.4 Mb</strong>; (iii) <strong>~30,000 genes</strong> (not 80,000–140,000), <strong>99.9% bases identical</strong> in all humans; (iv) <strong>>50% unknown function</strong>; (v) <strong>&lt;2% codes proteins</strong>; (vi–vii) vast <strong>repetitive</strong> stretches (100s–1000s copies, non-coding, chromosome structure/evolution clues); (viii) <strong>chr1 most 2968, Y fewest 231</strong>; (ix) <strong>~1.4 million SNPs</strong> for disease mapping/history. Future: whole-genome/high-throughput systems biology of transcripts, networks, health/agri/energy/environment.", "<strong>Fingerprinting</strong>: 99.9% same in 3×10⁹ bp still leaves ~3 million differences — sequencing everyone is daunting, so compare <strong>repetitive DNA</strong>: bulk vs <strong>satellite peaks</strong> in density gradients; <strong>micro-/mini-satellites</strong> by composition/length/copies (non-coding, highly <strong>polymorphic</strong>, same in every tissue, inheritable ⇒ <strong>forensics + paternity</strong>). <strong>Polymorphism</strong> = allelic variant &gt;0.01 (mutations in somatic vs germ cells; germline heritable if fertile; non-coding : ["Nitrogenous bases are the free purine/pyrimidine rings; nucleosides are base + pentose sugar (N-glycosidic to 1' C).", "Bases: Adenine (purine), Thymine (pyrimidine, DNA), Uracil (pyrimidine, RNA), Cytosine (pyrimidine, both).", "Nucleosides: Cytidine (cytosine + ribose), Guanosine (guanine + ribose)."], "answer": "Bases: Adenine, Thymine, Uracil, Cytosine; Nucleosides: Cytidine, Guanosine."}, {"number": 2, "conceptIdx": 0, "page": 31, "printPage": 109, "question": "If a double stranded DNA has 20 per cent of cytosine, calculate the per cent of adenine in the DNA.", "steps": ["Chargaff: G = C = 20%.", "So G + C = 40%; remainder A + T = 60%.", "A = T, so A = 60/2 = 30%."], "answer": "30% adenine."}, {"number": 3, "conceptIdx": 0, "page": 31, "printPage": 109, "question": "If the sequence of one strand of DNA is written as follows: 5'-ATGCATGCATGCATGCATGCATGCATGC-3' Write down the sequence of complementary strand in 5'→3' direction.", "steps": ["Write the antiparallel complement 3'→5': 3'-TACGTACGTACGTACGTACGTACGTACG-5' (A↔T, G↔C).", "Reverse it to 5'→3' order.", "Result is 28 nt: 5'-GCATGCATGCATGCATGCATGCATGCAT-3'."], "answer": "5'-GCATGCATGCATGCATGCATGCATGCAT-3'."}, {"number": 4, "conceptIdx": 3, "page": 31, "printPage": 109, "question": "If the sequence of the coding strand in a transcription unit is written as follows: 5'-ATGCATGCATGCATGCATGCATGCATGC-3' Write down the sequence of mRNA.", "steps": ["Coding strand (5'→3') has the same sequence as RNA, with thymine in place of uracil.", "Replace each T by U, keep 5'→3' polarity.", "28 nt mRNA: 5'-AUGCAUGCAUGCAUGCAUGCAUGCAUGC-3'."], "answer": "5'-AUGCAUGCAUGCAUGCAUGCAUGCAUGC-3'."}, {"number": 5, "conceptIdx": 2, "page": 31, "printPage": 109, "question": "Which property of DNA double helix led Watson and Crick to hypothesise semi-conservative mode of DNA replication? Explain.", "steps": ["The property is base complementarity (A=T, G≡C) of the two antiparallel strands.", "Each strand can therefore act as a template rifugation (micro-/mini-satellites by composition/length/copies).", "(b) mRNA = messenger template from hnRNA providing codons; tRNA = adapter bringing amino acids, reading codons by anticodon, with acceptor end (no tRNA for stops).", "(c) Template = 3'→5' strand copied by polymerase into 5'→3' RNA; coding = 5'→3' strand with RNA-like sequence (T for U), displaced, defining promoter/terminator reference."], "answer": "(a) repeats vs gradient satellite peaks; (b) message vs adapter; (c) 3'→5' copied vs 5'→3' RNA-like."}, {"number": 9, "conceptIdx": 5, "page": 31, "printPage": 109, "question": "List two essential roles of ribosome during translation.", "steps": ["Ribosome binds mRNA and provides adjacent sites bringing charged tRNAs/codons together in order (platform for sequential pairing and translocation).", "It catalyses peptide-bond formation — 23S rRNA in bacteria is the ribozyme."], "answer": "Platform/positioning for codon–anticodon pairing; catalysis of peptide bonds (23S rRNA)."}, {"number": 10, "conceptIdx": 6, "page": 31, "printPage": 109, "question": "In the medium where E. coli was growing, lactose was added, which induced the lac operon. Then, why does lac operon shut down some time after addition of lactose in the medium?", "steps": ["Added lactose (via basal permease) forms allolactose, inactivates repressor, and z/y/a are transcribed.", "β-galactosidase + permease import and hydrolyse lactose to glucose + galactose.", "When inducer is consumed, free repressor rebinds the operator and blocks polymerase — shutdown (negative regulation)."], "answer": "Inducer exhausted by the induced enzymes; repressor re-occupies the operator."}, {"number": 11, "conceptIdx": 4, "page": 31, "printPage": 109, "question": "Explain (in one or two lines) the function of the followings: (a) Promoter (b) tRNA (c) Exons", "steps": ["(a) Promoter: upstream DNA binding site for RNA polymerase defining template/coding strands and initiating transcription.", "(b) tRNA: adapter reading mRNA codons by anticodon and delivering the specific amino acid (amino-acid acceptor end).", "(c) Exons: expressed coding sequences retained in mature/processed RNA after introns are spliced out."], "answer": "Promoter initiates; tRNA adapts codon→amino acid; exons are the retained coding parts."}, {"number": 12, "conceptIdx": 7, "page": 31, "printPage": 109, "question": "Why is the Human Genome project called a mega project?", "steps": ["Scale: ~3×10⁹ bp at ~$3/bp ≈ $9 billion; 3300 thousand-page books per cell; massive compute/storage/analysis (bioinformatics).", "Coordination: 13 years (1990–2003), US DOE + NIH with Wellcome (UK) plus Japan/France/Germany/China; goals from 20,000–25,000 genes to databases, tools, tech transfer and ELSI.", "Hence 'mega' in cost, data, manpower and impact."], "answer": "3 billion bases, billion-dollar/compute scale, 13-year international programme — a mega project."}, {"number": 13, "conceptIdx": 7, "page": 31, "printPage": 109, "question": "What is DNA fingerprinting? Mention its application.", "steps": ["DNA fingerprinting compares individuals via highly polymorphic repetitive (satellite/VNTR/mini-satellite, 0.1–20 kb) regions: isolate DNA, restrict, electrophorese, blot to nitrocellulose/nylon (Southern), hybridise labelled VNTR probe, autoradiograph — band pattern unique per individual (identical twins excepted); PCR gives single-cell sensitivity (Jeffreys).", "Applications: forensic crime-scene matching, paternity testing, population/genetic-diversity and evolutionary studies."], "answer": "VNTR–Southern-blot identity test; forensics, paternity, diversity/evolution."}, {"number": 14, "conceptIdx": 7, "page": 31, "printPage": 109, "question": "Briefly describe the following: (a) Transcription (b) Polymorphism (c) Translation (d) Bioinformatics", "steps": ["(a) Transcription: copying one DNA strand (3'→5' template) into 5'→3' RNA (U for A) from promoter to terminator; bacterial one polymerase (+sigma/rho, coupled to transla   var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp){
      var label = state.formatTime ? state.formatTime(state.t) : "t = <b>" + state.t.toFixed(1) + " s</b>";
      var rate = "";
      if(state.speed && Math.abs(state.speed - 1) > 1e-9){
        rate = state.speed < 1 ? "slow motion ×" + state.speed : "plays " + state.speed + "× faster";
      }
      disp.innerHTML = label + (rate ? ' <span class="time-rate">' + rate + '</span>' : '');
    }
  }

  // Lets a simulation set its own timeline: {maxT, step, speed, format}.
  function configureTimeline(opts){
    opts = opts || {};
    pause();
    state.maxT = opts.maxT || state.maxT;
    state.stepSize = opts.step || 0.5;
    state.speed = opts.speed || 1;
    state.formatTime = opts.format || null;
    if(state.t > state.maxT) state.t = state.maxT;
    var scrubber = document.getElementById("time-scrubber");
    if(scrubber){ scrubber.max = state.maxT; scrubber.step = "any"; }
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep){
      var unit = state.formatTime ? "" : " s";
      btnStep.innerHTML = "⏭ Step";
      btnStep.setAttribute("aria-label", "Step forward by " + state.stepSize + unit);
      btnStep.title = "Step forward by " + state.stepSize + unit;
    }
    syncTimelineUI();
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Concept View ---
  function renderConcept(idx){
    pause();
    state.conceptIndex = idx;
    state.t = 0;
    state.level = 0;

    if(rBtn) rBtn.classList.remove("active");

    var crumb = document.getElementById("chapter-crumb");

    // Show concept view, hide revision

    var html = "";

    var cites = [];
    if(l.section) cites.push("NCERT §" + l.section);
    if(l.print) cites.push("textbook pp. " + l.print);
    if(Array.isArray(l.pages) && l.pages.length === 2) cites.push("PDF pp. " + l.pages[0] + "–" + l.pages[1]);
    var pageCitations = cites.join(" · ");
    html += '<div class="concept-header">' +
      '<div class="concept-badge"><span>Concept ' + ("0" + (idx + 1)).slice(-2) + ' / ' + ("0" + lessons.length).slice(-2) + '</span>' +
      '<span class="time-pill">≈ ' + minutes + ' min' + (pageCitations ? ' · ' + pageCitations : '') + '</span>' +
      '</div>' +
      '<h2 class="concept-title">' + (l.title || navTitle) + '</h2>' +
      '<p class="concept-deck">' + (l.deck || l.summary || "") + '</p>' +
      '</div>';

    // 01 LEARN BLOCK
    html += '<section class="learn-section" data-block="learn" aria-label="Learn">' +
      '<span class="block-tag">01 · LEARN · CORE ESSENTIALS</span>';

    var quickItems = [];

    } else if(Array.isArray(l.summary)) {
      quickItems = l.summary;
    } else if(l.reading_content) {

    } else if(l.summary || l.deck) {

    }

    html += '<div class="quick-summary">' + quickItems.map(function(p){
      if(p.includes('<p>') || p.includes('<div>') || p.includes('<h3>')) return p;
      var formatted = p.replace(/###\s+(.*?)\n/g, '<h3 style="margin-top:16px;color:var(--ink);">$1</h3>')
                       .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                       .replace(/\*(.*?)\*/g, '<em>$1</em>')
                       .replace(/\n\n/g, '</p><p>');
      return '<p>' + formatted + '</p>';
    }).join("") + '</div>';

    // Semantic Equations Card
    var formulas = l.formulas || [];
    if(formulas.length){
      html += '<div class="key-equations-card">' +
        '<div class="equations-heading">' + (l.formulasHeading || C.formulasHeading || "Key Relations for this Concept") + '</div>' +
        '<div class="eq-grid">' +
        formulas.map(function(eq){
          var label = eq.label || eq.name || "Relation";
          var cond = eq.cond || "";
          var math = eq.html || eq.formula || "";
          return '<div class="eq-row">' +
            '<div class="eq-meta"><span class="eq-label">' + label + '</span>' + (cond ? '<span class="eq-cond">' + cond + '</span>' : '') + '</div>' +
            '<div class="eq-math">' + math + '</div>' +

        }).join("") +
        '</div></div>';
    }

    // Deeper dive / core takeaways
    if(l.deeper){
      html += '<details class="deep-dive"><summary>Go deeper into the conceptual foundation</summary><p>' + l.deeper + '</p></details>';
    } else if(l.takeaways && l.takeaways.length){
      html += '<details class="deep-dive"><summary>Key Conceptual Takeaways</summary><ul>' +
        l.takeaways.map(function(t){ return '<li>' + t + '</li>'; }).join("") +
        '</ul></details>';
    }

    // Worked Example
    var worked = l.worked || l.worked_example;
    if(worked){
      if(typeof worked === 'object' && worked !== null){
        html += '<details class="deep-dive worked"><summary>Worked example: ' + (worked.title || 'step by step') + '</summary>' +
          '<div class="worked-body">' +
          (worked.problem ? '<p class="worked-problem">' + worked.problem + '</p>' : '') +
          (worked.given ? '<p class="worked-given"><strong>Given:</strong> ' + worked.given + '</p>' : '') +
          (worked.steps ? '<ol class="solution-steps">' + worked.steps.map(function(s){ return '<li>' + s + '</li>'; }).join('') + '</ol>' : '') +
          (worked.solution ? '<p><strong>Solution:</strong> ' + worked.solution + '</p>' : '') +
          (worked.answer ? '<div class="answer-box">' + worked.answer + '</div>' : '') +
          '</div></details>';
      } else {
        html += '<details class="deep-dive"><summary>Worked textbook example step by step</summary><p>' + String(worked) + '</p></details>';
      }
    }

    html += '</section>';

    // 02 PREDICT FIRST BLOCK
    var pred = l.prediction || l.predict || l.predict_first;
    if(!pred || typeof pred !== 'object' || !pred.options || !pred.options.length){

    }
    var promptText = pred ? (pred.prompt || pred.scenario || "") : "";

      '<div class="predict-options" id="predict-options">' +

      }).join("") +
