<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 4: Principles of Inheritance and Variation — Interactive Textbook</title>
<style>
:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  text-align: left;
  background: #0f172a;
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
}
.play-btn {
  flex: none;
  width: 34px;
  height: 34px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 14px;
}
.video-title {
  font-size: 13px;
  line-height: 1.4;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.q-badge {
  background: var(--soft);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 3px 10px;
  border-radius: 6px;
}
.q-concept-link {
  color: var(--blue);
  text-decoration: none;
  font-size: 13px;

window.CHAPTER = {"code": "lebo104", "chapterNumber": 4, "book_name": "Biology", "title": "Principles of Inheritance and Variation", "subtitle": "Mendel's laws, linkage and recombination, polygenic and pleiotropic inheritance, sex determination, mutation and genetic disorders.", "edition": "Reprint 2026-27", "source": "https://ncert.nic.in/textbook/pdf/lebo104.pdf", "page_start": 1, "page_end": 28, "extraction": "PyMuPDF text layer + section/exercise page maps in /tmp/opencode/bio_maps.json. pdftotext not used.", "lessons": [{"id": "mendel-one-gene", "nav": "Mendel & one gene", "title": "Mendel's pea crosses: dominance, segregation and the 3:1 F2", "deck": "Seven years on garden pea with mathematics: the F1 shows one parent, the F2 shows 3:1 phenotypes and 1:2:1 genotypes, and the test cross (1:1) exposes the hidden heterozygote.", "minutes": 9, "section": "4.1, 4.2, 4.2.1, 4.2.2 (incl. 4.2.2.1-4.2.2.2)", "pages": [3, 12], "print": "3–12", "sim": "punnett1", "simTitle": "Monohybrid Punnett lab: pick parental genotypes (TT, Tt, tt)", "quick": ["<strong>Gregor Mendel</strong> ran hybridisation experiments on garden peas for <strong>seven years (1856-1863)</strong> and proposed the laws of inheritance. For the first time <strong>statistical analysis and mathematical logic</strong> were applied to biology, with a <strong>large sampling size</strong> and confirmation on successive generations. He used <strong>14 true-breeding pea lines</strong> - lines showing stable trait inheritance after continuous self-pollination - differing in <strong>seven pairs of contrasting traits</strong> (Table 4.1): stem height tall/dwarf, flower colour violet/white, flower position axial/terminal, pod shape inflated/constricted, pod colour green/yellow, seed shape round/wrinkled, seed colour yellow/green.", "In a <strong>monohybrid cross</strong> (TT tall x tt dwarf) all <strong>F1 (Tt) are tall</strong>; selfing the F1 gives an <strong>F2 of 3/4 tall and 1/4 dwarf</strong> with no blending. The <strong>phenotypic ratio is 3:1</strong> while the <strong>genotypic ratio is 1/4 TT : 1/2 Tt : 1/4 tt (1:2:1)</strong>, condensable as <strong>(1/2T + 1/2t) squared</strong>. Dwarf F2 plants breed true (tt); tall F2 plants are a mix of TT and Tt. Capital/lower-case of one letter (T/t) marks alleles of the same gene - never T for tall and d for dwarf.", "The <strong>Punnett Square</strong> (Reginald C. Punnett) writes possible gametes on the top row and left column and fills zygotes in the boxes. Because phenotype cannot reveal whether a tall plant is TT or Tt, Mendel used the <strong>test cross</strong>: cross the dominant-phenotype plant with the <strong>recessive parent</strong> (e.g. violet V x white v, Figure 4.5). <strong>Tt x tt gives 1 tall : 1 dwarf</strong>, while TT x tt gives all tall.", "Mendel's two rules from monohybrid work are the <strong>Law of Dominance (4.2.1)</strong> - characters controlled by discrete factors, factors occur in pairs, one of a dissimilar pair dominates - and the <strong>Law of Segregation (4.2.2)</strong> - alleles do not blend and separate at gamete formation so each gamete gets one factor (homozygotes make one gamete type, heterozygotes two types in equal proportion). Dominance is not absolute: <strong>snapdragon shows incomplete dominance</strong> (RR red x rr white gives Rr pink; F2 1 red : 2 pink : 1 white) and <strong>ABO blood shows co-dominance with multiple alleles</strong> (IA, IB, i; IA and IB both expressed in IAIB; six genotypes in Table 4.2, four phenotypes). A gene is dominant or recessive only relative to the phenotype examined - heterozygous Bb pea makes round seeds like BB yet starch grains of intermediate size."], "formulas": [{"label": "Monohybrid F2", "html": "phenotype 3 tall : 1 dwarf; genotype 1 TT : 2 Tt : 1 tt", "cond": "TT x tt gives Tt self; 4.2"}, {"label": "Binomial form", "html": "(1/2T + 1/2t) squared = 1/4 TT + 1/2 Tt + 1/4 tt", "cond": "Gametes T/t at 1/2 each; 4.2"}, {"label": "Test cross", "html": "Tt x tt gives 1 dominant : 1 recessive; TT x tt gives all dominant", "cond": "Cross with recessive parent; Fig. 4.5"}], "deeper": "Selfing a tall F2: about 1/3 (TT) breed true tall while 2/3 (Tt) throw 3:1 again - the book's in-text question. Enzyme view of dominance (4.2.2 box): each gene informs an enzyme converting substrate S; the modified allele may make normal/less-efficient, non-functional, or no enzyme - the recessive trait appears when the product is non-functional or absent, so the unmodified allele dominates.", "worked": "Test cross of violet/white (V dominant): Vv x vv gametes (1/2V + 1/2v) x (v) gives 1/2 Vv violet + 1/2 vv white, a 1:1 phenotypic ratio proving the violet parent was heterozygous. Had it been VV, every progeny would be Vv violet.", "prediction": {"prompt": "A tall F2 pea plant is test-crossed to a dwarf (tt) and the progeny are 1 tall : 1 dwarf. The tall parent was", "options": ["Heterozygous Tt - only Tt x tt gives half dwarf progeny", "Homozygous TT - TT x tt can also give dwarfs", "Homozygous tt - a dwarf mistaken for a tall plant"], "answer": 0, "explanation": "Tt makes T and t gametes equally, so half the progeny get tt (dwarf). TT x tt gives all Tt tall."}, "connect": [["Sahiwal cows of Punjab", "The chapter opens with artificial selection from wild cows to Indian breeds such as Sahiwal cows in Punjab - domestication exploited the same inherited variation Mendel later measured with mathematics.", [], {"id": "fuglbkNZ7ac", "title": "Principles of Inheritance and Variation Class 12 One Shot | Biology Chapter 4 | NCERT + PYQs", "channel": "NCERT Wallah"}], ["Wow - biology's first big dataset", "Mendel's edge was statistics on thousands of plants over seven years with checks across F1-F4 generations - rules of inheritance extracted like a modern data experiment, decades before genes or chromosomes were known."]], "recall": "State both laws, the 3:1 and 1:2:1 ratios with the binomial, and design a test cross predicting 1:1 vs uniform progeny.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "In Mendel's monohybrid cross TT x tt, the F1 generation is", "options": ["All tall with genotype Tt", "3 tall : 1 dwarf", "All dwarf with genotype tt"], "answer": 0, "hint": "Which parental trait appears in F1?", "solution": "T dominates t, so every Tt F1 plant is tall; the dwarf trait reappears only in F2.", "wrong": ["That is the F2 phenotypic ratio, not F1.", "The recessive phenotype cannot appear in Tt heterozygotes."]}, {"level": "Medium", "type": "number", "map": "4.2 F2 3:1", "prompt": "Dwarf plants expected among 960 F2 offspring of Tt x Tt", "answer": 240, "unit": "plants", "tolerance": 2, "hint": "Dwarfs are 1/4 of F2.", "solution": "960 x 1/4 = 240 dwarf (tt); 720 tall (1/4 TT + 1/2 Tt)."}, {"level": "Hard", "type": "number", "map": "4.2.2.1 snapdragon", "prompt": "Pink-flowered plants among 400 F2 offspring of Rr x Rr snapdragon (incomplete dominance)", "answer": 200, "unit": "plants", "tolerance": 2, "hint": "F2 is 1 red : 2 pink : 1 white.", "solution": "Heterozygotes Rr are 1/2 of F2: 400 x 1/2 = 200 pink."}], "resources": [{"title": "NCERT §4.1, 4.2, 4.2.1, 4.2.2 (incl. 4.2.2.1-4.2.2.2) — Mendel & one gene (official PDF, PDF p.3)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo104.pdf#page=3"}]}, {"id": "two-genes", "nav": "Two genes & assortment", "title": "Dihybrid 9:3:3:1: independent assortment of two gene pairs", "deck": "RRYY x rryy gives RrYy F1; the F1 makes four gamete types at 1/4 each, so F2 phenotypes split 9:3:3:1 - simply (3:1) x (3:1).", "minutes": 9, "section": "4.3, 4.3.1", "pages": [12, 14], "print": "12–14", "sim": "punnett2", "simTitle": "Dihybrid Punnett lab: RrYy x RrYy and the 9:3:3:1 grid", "quick": ["Mendel crossed <strong>yellow round (RRYY) x green wrinkled (rryy)</strong>: the F1 (RrYy) had <strong>yellow colour and round shape</strong>, so yellow dominates green and round dominates wrinkled - the same verdicts as the separate monohybrid crosses. Selfing the F1, each single trait still segregated <strong>3:1</strong> (3/4 yellow : 1/4 green; 3/4 round : 1/4 wrinkled).", "Jointly the F2 phenotypes are <strong>9 round-yellow : 3 wrinkled-yellow : 3 round-green : 1 wrinkled-green (9:3:3:1)</strong>, derived as <strong>(3 round : 1 wrinkled) x (3 yellow : 1 green)</strong>. The F1 makes <strong>four gamete types - RY, Ry, rY, ry - each 1/4</strong>, because 50% R : 50% r segregates independently of 50% Y : 50% y; the 16 Punnett boxes then generate the ratio (Figure 4.7).", "The <strong>Law of Independent Assortment (4.3.1)</strong>: when two pairs of traits combine in a hybrid, <strong>segregation of one pair is independent of the other pair</strong>. The book asks whether the F2 <strong>genotypic</strong> ratio is also 9:3:3:1 - it is not: there are nine genotype classes (1:2:1:2:4:2:1:2:1) hiding under four phenotypes."], "formulas": [{"label": "Dihybrid F2", "html": "9 : 3 : 3 : 1 = (3 : 1) x (3 : 1)", "cond": "RrYy x RrYy; 4.3.1"}, {"label": "F1 gametes", "html": "RY : Ry : rY : ry = 1/4 each", "cond": "Independent 50/50 segregations; Fig. 4.7"}, {"label": "Single-trait check", "html": "each trait still 3 : 1 within the dihybrid F2", "cond": "4.3"}], "deeper": "Counting genotypes in Figure 4.7: 1 RRYY : 2 RRYy : 1 RRyy : 2 RrYY : 4 RrYy : 2 Rryy : 1 rrYY : 2 rrYy : 1 rryy. Only 1/16 (rryy) shows both recessives; 9/16 show both dominants. Any dihybrid F2 count (e.g. 1600 seeds) is tested against 9/16 : 3/16 : 3/16 : 1/16.", "worked": "Exercise 7 (TtYy x Ttyy): stem height Tt x Tt gives 3/4 tall, 1/4 dwarf; seed colour Yy x yy gives 1/2 yellow, 1/2 green. Tall-green = 3/4 x 1/2 = 3/8; dwarf-green = 1/4 x 1/2 = 1/8 (of 800 offspring: 300 tall-green, 100 dwarf-green).", "prediction": {"prompt": "An F1 RrYy plant forms gametes. The correct statement is", "options": ["Four types RY, Ry, rY, ry at 25% each - the two pairs assort independently", "Two types RY and ry only - parental combinations never break", "Eight types at equal frequency - each allele doubles the count"], "answer": 0, "explanation": "50% R : 50% r times 50% Y : 50% y gives four 1/4 classes; parental and new combinations are equally likely here."}, "connect": [["Pea-seed sorting by breeders", "Round vs wrinkled and yellow vs green are seed characters a breeder scores by eye and counting - the 9:3:3:1 grid turns two such counts into one joint prediction."], ["Wow - one ratio is two ratios multiplied", "9:3:3:1 looks complex until bracketed as (3:1)x(3:1): independent assortment means the dihybrid prediction is just two monohybrid predictions multiplied - probability doing genetics."]], "recall": "Write the parental/F1 genotypes, the four 1/4 gametes, the 9:3:3:1 derivation, and the law statement.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The F1 of RRYY x rryy is", "options": ["RrYy, round and yellow", "RRYY, round and yellow", "rryy, wrinkled and green"], "answer": 0, "hint": "Each parent gives one gamete type.", "solution": "RY x ry gives RrYy; both dominant traits (round, yellow) are expressed.", "wrong": ["F1 are hybrids, not parental homozygotes.", "Recessive traits stay hidden in F1."]}, {"level": "Medium", "type": "number", "map": "4.3.1 9:3:3:1", "prompt": "Round-yellow seeds expected among 1600 F2 seeds of RrYy x RrYy", "answer": 900, "unit": "seeds", "tolerance": 3, "hint": "Round-yellow is 9/16.", "solution": "1600 x 9/16 = 900 (with 300 : 300 : 100 in the other classes)."}, {"level": "Hard", "type": "number", "map": "Exercise 7", "prompt": "Fraction of offspring that are tall and green in TtYy x Ttyy", "answer": 0.375, "unit": "fraction", "tolerance": 0.005, "hint": "3/4 tall times 1/2 green.", "solution": "3/4 x 1/2 = 3/8 = 0.375 (dwarf-green is 1/4 x 1/2 = 1/8)."}], "resources": [{"title": "NCERT §4.3, 4.3.1 — Two genes & assortment (official PDF, PDF p.12)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo104.pdf#page=12"}]}, {"id": "chromosomal-linkage", "nav": "Chromosomes & linkage", "title": "Chromosomal theory plus Morgan's linkage: 1.3% vs 37.2% recombination", "deck": "Sutton and Boveri (1902) mapped Mendel onto chromosomes; Morgan's Drosophila crosses showed linked genes break 9:3:3:1, with recombination frequency measuring gene distance.", "minutes": 9, "section": "4.3.2, 4.3.3", "pages": [14, 18], "print": "14–18", "sim": "linkage", "simTitle": "Linkage vs recombination: parental vs non-parental % explorer", "quick": ["Mendel published in <strong>1865 but stayed unrecognised till 1900</strong>, when <strong>de Vries, Correns and von Tschermak</strong> independently rediscovered his results. By then microscopy showed <strong>chromosomes</strong> doubling and dividing before each division, and by <strong>1902 chromosome movement during meiosis</strong> was worked out. <strong>Walter Sutton and Theodore Boveri</strong> noted the behaviour of chromosomes parallels the behaviour of genes (Table 4.3: both occur in pairs, both segregate so one of each pair enters a gamete, pairs assort independently) and united them as the <strong>chromosomal theory of inheritance</strong>.", "Experimental verification came from <strong>Thomas Hunt Morgan</strong> and colleagues on the tiny fruit fly <strong>Drosophila melanogaster</strong> (Figure 4.10): grown on simple synthetic medium, <strong>life cycle about two weeks</strong>, a single mating producing many progeny, sexes easily distinguishable, and many hereditary variations visible with low-power microscopes. Morgan crossed <strong>yellow-bodied white-eyed females x brown-bodied red-eyed males</strong> and intercrossed the F1: the two genes <strong>did not segregate independently</strong> and the F2 deviated very significantly from <strong>9:3:3:1</strong>.", "Morgan saw the genes were on the <strong>X chromosome</strong>: when two dihybrid genes sit on the same chromosome, <strong>parental gene combinations far exceed non-parental ones</strong>. He coined <strong>linkage</strong> for this physical association of genes on a chromosome and <strong>recombination</strong> for the generation of non-parental combinations (Figure 4.11). Some genes are <strong>tightly linked (very low recombination)</strong>, others <strong>loosely linked (higher recombination)</strong>: <strong>white and yellow showed only 1.3% recombination</strong> (Cross A) while <strong>white and miniature wing showed 37.2%</strong> (Cross B).", "Morgan's student <strong>Alfred Sturtevant</strong> used the <strong>frequency of recombination between gene pairs on the same chromosome as a measure of distance</strong> and mapped gene positions on the chromosome. Today such <strong>genetic maps</strong> are the starting point for sequencing whole genomes, as done for the <strong>Human Genome Sequencing Project</strong>."], "formulas": [{"label": "Recombination frequency", "html": "recombination % = (non-parental progeny / total progeny) x 100", "cond": "4.3.3; Fig. 4.11 Cross A/B"}, {"label": "Tight vs loose", "html": "white-yellow 1.3% (tightly linked); white-miniature 37.2% (loosely linked)", "cond": "Morgan Drosophila dihybrid crosses"}, {"label": "Sturtevant mapping", "html": "recombination frequency between a gene pair = distance between the genes", "cond": "Basis of linkage maps; Human Genome Project"}], "deeper": "Why independent assortment fails here: Mendel's pairs lay on different chromosomes (or far apart), so metaphase-I alignment (Figure 4.9, Possibilities I/II) randomises them; genes on one chromosome travel together unless crossing over separates them. Distantly located genes recombine so often they assort nearly independently - the bridge between linkage and the 9:3:3:1 ideal.", "worked": "Cross A math: 1.3% recombination in 1000 F2 flies gives about 13 recombinant (non-parental) and 987 parental-type flies - the huge parental excess that falsifies independence. Cross B: 37.2% of 1000 gives 372 recombinant and 628 parental - weak linkage, close to free assortment.", "prediction": {"prompt": "A Drosophila dihybrid F2 shows parental combinations far above non-parental ones. The correct conclusion is", "options": ["The two genes are linked on the same chromosome - recombination is rare", "The two genes assort independently on different chromosomes", "Mendel's law of segregation is violated in Drosophila"], "answer": 0, "explanation": "Parental excess is Morgan's linkage signature; segregation within each pair still holds, only independence between the pairs fails."}, "connect": [["Human genome maps from fly crosses", "Sturtevant's recombination-as-ruler idea grew into the genetic maps that opened the Human Genome Sequencing Project - chromosome mapping learnt on flies now orders 3 billion human base pairs."], ["Wow - distance measured in percentages", "No microscope can see genes in a row, yet 1.3% vs 37.2% recombinant flies place white nearer yellow than miniature - gene order read purely from counting progeny."]], "recall": "Name the 1900 rediscoverers, state Sutton-Boveri's parallel, list Morgan's fly advantages, define linkage vs recombination with both % values, and credit Sturtevant.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Linkage, as coined by Morgan, means", "options": ["Physical association of genes on the same chromosome", "Independent assortment of all gene pairs", "Fusion of two chromosomes into one"], "answer": 0, "hint": "Why do parental combinations predominate?", "solution": "Linked genes travel together on one chromosome; crossing over only occasionally makes recombinants.", "wrong": ["Linked genes violate independence - that is the point.", "Chromosome number is unchanged by linkage."]}, {"level": "Medium", "type": "number", "map": "4.3.3 Cross A 1.3%", "prompt": "Recombinant progeny expected among 1000 F2 flies if two genes show 1.3% recombination", "answer": 13, "unit": "flies", "tolerance": 1, "hint": "1.3% of 1000.", "solution": "0.013 x 1000 = 13 recombinant; 987 parental-type."}, {"level": "Hard", "type": "number", "map": "4.3.3 Cross B 37.2%", "prompt": "Parental-type progeny among 1000 F2 flies if recombination between the genes is 37.2%", "answer": 628, "unit": "flies", "tolerance": 2, "hint": "Parental = 100% minus 37.2%.", "solution": "62.8% parental x 1000 = 628; only 372 recombinant - loose linkage."}], "resources": [{"title": "NCERT §4.3.2, 4.3.3 — Chromosomes & linkage (official PDF, PDF p.14)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo104.pdf#page=14"}]}, {"id": "polygenic-pleiotropy", "nav": "Polygenic & pleiotropy", "title": "Many genes one trait, one gene many traits: skin colour and phenylketonuria", "deck": "Three genes A/B/C add up to skin colour (AABBCC darkest, aabbcc lightest); a single pleiotropic gene such as phenylketonuria's can retard mind and lighten hair and skin together.", "minutes": 8, "section": "4.4, 4.5", "pages": [19, 19], "print": "19", "sim": "polygenic", "simTitle": "Polygenic bell curve: add dominant alleles across A/B/C", "quick": ["Mendel described traits with distinct alternate forms (purple or white flowers), but many traits spread across a gradient - humans are not just tall or short. Such traits are controlled by <strong>three or more genes (polygenic)</strong>, with <strong>environment</strong> also contributing. <strong>Human skin colour</strong> is the classic example: assume three genes <strong>A, B, C</strong> with dominant forms giving dark colour and recessive forms light colour.", "The phenotype reflects <strong>each allele's additive contribution</strong>: <strong>AABBCC (all dominant) is darkest, aabbcc (all recessive) is lightest</strong>, and a genotype with <strong>three dominant and three recessive alleles is intermediate</strong> - darkness follows the count of dominant alleles (0 to 6). Human height works the same polygenic way.", "The reverse pattern is <strong>pleiotropy</strong>: one gene with <strong>multiple phenotypic effects</strong>, usually via metabolic pathways feeding different phenotypes. <strong>Phenylketonuria</strong> comes from mutation in the single gene coding the enzyme <strong>phenylalanine hydroxylase</strong>, and shows as <strong>mental retardation plus reduction in hair and skin pigmentation</strong>."], "formulas": [{"label": "Additive dose", "html": "skin darkness rises with the number of dominant alleles (0-6 across A/B/C)", "cond": "4.4; AABBCC darkest, aabbcc lightest"}, {"label": "Extreme probability", "html": "P(AABBCC child of AaBbCc x AaBbCc) = (1/4) cubed = 1/64", "cond": "Independent 1/4 per gene"}, {"label": "Pleiotropy", "html": "one gene mutation -> several phenotypes (phenylketonuria: brain + hair + skin)", "cond": "4.5; single phenylalanine-hydroxylase gene"}], "deeper": "An AaBbCc individual makes 2 cubed = 8 gamete types (ABC ... abc) at 1/8 each, so the F2 of two such parents spreads over 7 phenotypic classes in a bell-like distribution - the gradient the chapter contrasts with Mendel's either/or traits. Environment (sun exposure for skin, nutrition for height) then blurs the genetic steps further.", "worked": "Darkest-child cross: each gene pair Aa x Aa gives AA at 1/4, so AABBCC needs 1/4 x 1/4 x 1/4 = 1/64 of offspring (about 10 in 640 children); the same 1/64 are lightest aabbcc, and the great majority cluster at intermediate doses.", "prediction": {"prompt": "Two AaBbCc parents have children. The darkest (AABBCC) children are expected to be", "options": ["Rare - 1/64, since each gene must independently give AA", "Common - 1/4, like a monohybrid dominant class", "Half of all children - darkness dominates lightness"], "answer": 0, "explanation": "(1/4)^3 = 1/64; polygenic extremes are rare and most children fall in the middle - hence the continuous gradient."}, "connect": [["Wheat height and skin tone in India", "From tall/short extremes to every height between, Indian populations show the polygenic gradient daily - plus environment: sun exposure darkens any genotype, exactly the gene-plus-environment lesson of 4.4."], ["Wow - one spelling mistake, three symptoms", "A single faulty phenylalanine-hydroxylase gene simultaneously slows the mind and lightens hair and skin - pleiotropy means one gene's failure echoes through every pathway it feeds."]], "recall": "Contrast polygenic vs pleiotropic with the AABBCC/aabbcc endpoints and the phenylketonuria triad.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Polygenic inheritance is distinguished by", "options": ["Three or more genes with additive effects plus environment, giving a gradient", "One gene with two sharply distinct forms", "Traits unaffected by any gene"], "answer": 0, "hint": "Think skin colour and height.", "solution": "Multiple genes each contribute a dose and environment modifies the result - continuous variation.", "wrong": ["That is a Mendelian one-gene trait.", "Polygenic traits are strongly genetic, just multi-gene."]}, {"level": "Medium", "type": "number", "map": "4.4 three genes", "prompt": "Distinct gamete types produced by an AaBbCc individual", "answer": 8, "unit": "types", "tolerance": 0.1, "hint": "2 choices per gene, 3 genes.", "solution": "2^3 = 8 (ABC, ABc, AbC, Abc, aBC, aBc, abC, abc) at 1/8 each."}, {"level": "Hard", "type": "number", "map": "4.4 AABBCC 1/64", "prompt": "Darkest-skinned (AABBCC) children expected among 640 children of AaBbCc x AaBbCc", "answer": 10, "unit": "children", "tolerance": 1, "hint": "Probability is 1/64.", "solution": "640 x 1/64 = 10 darkest (and 10 lightest); most cluster intermediate."}], "resources": [{"title": "NCERT §4.4, 4.5 — Polygenic & pleiotropy (official PDF, PDF p.19)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo104.pdf#page=19"}]}, {"id": "sex-determination", "nav": "Sex determination", "title": "XO, XY and ZW plus the haplodiploid honey bee: 32 vs 16 chromosomes", "deck": "Henking's X body became the X chromosome: grasshopper XO, human/Drosophila XY (male heterogamety), birds ZW (female heterogamety), honey bee haplodiploid (female 32, male 16).", "minutes": 9, "section": "4.6, 4.6.1, 4.6.2", "pages": [19, 21], "print": "19–21", "sim": "sexdetermination", "simTitle": "Sex switcher: XX-XY vs ZW vs haplodiploid honey bee", "quick": ["The chromosomal mechanism began with insects: <strong>Henking (1891)</strong> traced a nuclear structure through spermatogenesis in some insects - <strong>50% of sperm received it, 50% did not</strong> - and named it the <strong>X body</strong> without knowing its significance. It proved to be a chromosome, the <strong>X-chromosome</strong>; the rest were named <strong>autosomes</strong>, and the X became the first <strong>sex chromosome</strong>.", "In the <strong>XO type</strong> (grasshopper example) all eggs carry an X besides autosomes while only some sperm do: <strong>X-bearing sperm gives a female (XX), sperm without X gives a male (XO)</strong>. In the <strong>XY type</strong> (many insects, mammals including man, Drosophila) <strong>males are XY and females XX</strong> with equal autosomes (Figure 4.12a-b). Both are <strong>male heterogamety</strong> - males make two gamete types. In <strong>birds</strong> (Figure 4.12c) the system flips to <strong>female heterogamety</strong>: females are <strong>ZW</strong> (two different sex chromosomes) and males <strong>ZZ</strong>, so the egg, not the sperm, decides the chick's sex.", "In <strong>humans (4.6.1, XY type)</strong> there are <strong>23 pairs: 22 autosome pairs identical in both sexes</strong> plus XX in females and XY in males. Males make <strong>50% X-sperm and 50% Y-sperm</strong>; females make only X-ova, so <strong>X-sperm gives a girl (XX), Y-sperm a boy (XY)</strong> - the <strong>sperm's genetic makeup determines the child's sex</strong>, with <strong>50% probability each pregnancy</strong>. The book stresses it is a false notion blaming women for daughters.", "In the <strong>honey bee (4.6.2, haplodiploid system)</strong> sex follows chromosome sets: a <strong>fertilised egg (sperm + egg) becomes a female (queen or worker)</strong>, an <strong>unfertilised egg develops by parthenogenesis into a male (drone)</strong>. Females are <strong>diploid with 32 chromosomes</strong>, males <strong>haploid with 16</strong>. Males make sperm by <strong>mitosis</strong>: they have <strong>no father and no sons, but have a grandfather and can have grandsons</strong>."], "formulas": [{"label": "Human XY", "html": "22 pairs autosomes + XX (female) / XY (male); P(boy) = P(girl) = 1/2", "cond": "4.6.1; sperm decides"}, {"label": "Bird ZW", "html": "males ZZ, females ZW - female heterogamety, egg decides", "cond": "4.6; Fig. 4.12c"}, {"label": "Honey bee sets", "html": "female diploid 32 = 16 + 16; male haploid 16; male gametes by mitosis", "cond": "4.6.2; fertilised vs parthenogenesis"}], "deeper": "Counting check: grasshopper XO males carry one fewer chromosome than females (odd vs even totals); human sexes carry equal totals (46 each) since Y replaces the second X. Honey-bee drones, being haploid, transmit their entire 16-chromosome genome to every daughter - no segregation variance from the father.", "worked": "Boy/girl probability: each pregnancy is an independent fertilisation by an X- or Y-sperm at 1/2 each, so among 200 births about 100 boys and 100 girls are expected; a run of daughters never changes the next pregnancy's 1/2. Honey-bee cross: a queen (32) x drone (16) gives daughters 32 (16 maternal + 16 paternal) and unfertilised eggs give sons 16.", "prediction": {"prompt": "A couple's first three children are girls. The probability the fourth child is a boy is", "options": ["1/2 - each fertilisation is an independent X- vs Y-sperm event", "Near zero - three girls force a fourth girl", "Certain - a boy is now due by balance"], "answer": 0, "explanation": "50% of sperm carry X and 50% Y every time; past outcomes do not alter the next fertilisation."}, "connect": [["Blaming mothers is unscientific", "NCERT states plainly that ostracising women for bearing daughters rests on a false notion - the egg is always X; only the sperm brings X or Y."], ["Wow - sons without fathers", "A drone has a mother and a grandfather but no father, and daughters but no sons - haplodiploid arithmetic rewrites what family means."]], "recall": "Define XO/XY/ZW with an example each, state the 50/50 human rule and who decides, and give the bee 32/16 + mitosis facts.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "In human beings the sex of the child is determined by", "options": ["The sperm - X-bearing gives XX girl, Y-bearing gives XY boy", "The ovum - it carries X or Y", "The mother's diet in pregnancy"], "answer": 0, "hint": "Which gamete comes in two sex-chromosome types?", "solution": "Ova are all X; sperm are 50% X and 50% Y, so fertilisation decides.", "wrong": ["All ova carry a single X.", "Sex is fixed at fertilisation, not by later conditions."]}, {"level": "Medium", "type": "number", "map": "4.6.2 honey bee", "prompt": "Chromosome number of a drone (male) honey bee if females are diploid with 32", "answer": 16, "unit": "chromosomes", "tolerance": 0.1, "hint": "Males develop from unfertilised eggs.", "solution": "Haploid males carry half the female number: 32/2 = 16."}, {"level": "Hard", "type": "number", "map": "4.6.1 50% rule", "prompt": "Boys expected among 240 births at 1/2 probability per pregnancy", "answer": 120, "unit": "boys", "tolerance": 3, "hint": "240 x 1/2.", "solution": "120 boys and about 120 girls; each pregnancy is independent."}], "resources": [{"title": "NCERT §4.6, 4.6.1, 4.6.2 — Sex determination (official PDF, PDF p.19)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo104.pdf#page=19"}]}, {"id": "mutation", "nav": "Mutation", "title": "Mutation: point changes (GAG to GUG) and frame-shifts from indels", "deck": "Any alteration of DNA sequence: deletions/duplications reshape chromosomes (seen in cancer cells), single-base point mutations cause sickle-cell anaemia, and 1-2 base indels shift the reading frame. UV is a mutagen.", "minutes": 8, "section": "4.7", "pages": [22, 22], "print": "22", "sim": "bloodgroup", "simTitle": "ABO cross solver (Ex 12): single-gene blood-trait crosses", "quick": ["A <strong>mutation</strong> is a phenomenon resulting in <strong>alteration of DNA sequences</strong>, changing genotype and then phenotype. Alongside recombination it is the other great source of <strong>variation in DNA</strong>. Since one DNA helix runs continuously end-to-end in each highly supercoiled chromatid, <strong>loss (deletions) or gain (insertion/duplication) of a DNA segment alters chromosomes</strong> - genes sit on chromosomes, so chromosome alteration means abnormalities (aberrations), commonly observed in <strong>cancer cells</strong>.", "A change in a <strong>single base pair</strong> is a <strong>point mutation</strong>, classically <strong>sickle-cell anaemia</strong>: the sixth codon of the beta-globin gene changes <strong>GAG to GUG</strong>, substituting <strong>valine for glutamic acid</strong> at position 6 of the beta chain. <strong>Deletions and insertions of base pairs cause frame-shift mutations</strong> (detailed in Chapter 5).", "Mutation mechanism is beyond this level, but many <strong>chemical and physical factors induce mutations (mutagens)</strong> - <strong>UV radiation</strong> is named as one. Whole-set changes (<strong>polyploidy</strong>: failure of cytokinesis after telophase) and single-chromosome gains/losses (<strong>aneuploidy</strong>: failure of chromatid segregation) are previewed here and detailed under genetic disorders."], "formulas": [{"label": "Point mutation", "html": "single base-pair change; e.g. beta-globin codon 6: GAG -> GUG (Glu -> Val)", "cond": "4.7; sickle-cell anaemia"}, {"label": "Frame-shift", "html": "indel of 1-2 bases shifts the reading frame (multiples of 3 add/lose codons)", "cond": "4.7; see Chapter 5"}, {"label": "Chromosome scale", "html": "deletion/duplication -> aberration; segregation failure -> aneuploidy; cytokinesis failure -> polyploidy", "cond": "4.7-4.8.3"}], "deeper": "One base in 3 billion still matters: GAG->GUG rewrites a single codon, a single amino acid, then (under low oxygen) the whole red cell's shape. Frame-shifts are harsher - every codon downstream of a 1-2 base indel is re-read - which is why the book separates point from frame-shift mutations.", "worked": "Codon math: normal codon 6 GAG codes glutamic acid (textbook spelling also glutamic acid/glutamic); mutant GUG codes valine - a one-letter DNA change (A->U in mRNA terms) flipping a charged side chain to a hydrophobic one, driving haemoglobin polymerisation under low oxygen tension.", "prediction": {"prompt": "A single base-pair substitution changes beta-globin codon 6 from GAG to GUG. The expected effect is", "options": ["Sickle-cell haemoglobin - Glu replaced by Val at position 6", "No change - the code has no such codon", "A whole extra chromosome 21"], "answer": 0, "explanation": "The book's classical point-mutation example: one base, one amino acid, diseased phenotype."}, "connect": [["UV warning in Indian summers", "UV radiation is the book's named mutagen - the same sunlight Indian field workers face daily can damage DNA, which is why cells carry repair systems (Chapter 5)."], ["Wow - one letter bends a cell", "Swapping a single base bends disc-shaped red cells into sickles that clog vessels - the smallest possible mutation with a body-wide phenotype."]], "recall": "Define mutation, distinguish point vs frame-shift with the GAG/GUG example, name one mutagen and the two chromosome-scale outcomes.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "A point mutation is", "options": ["A change in a single base pair of DNA", "Gain of a whole extra chromosome set", "Fusion of two homologous chromosomes"], "answer": 0, "hint": "Sickle-cell anaemia is the classical example.", "solution": "One base pair changes (GAG to GUG at beta-globin codon 6).", "wrong": ["That is polyploidy, not a point change.", "That describes no standard mutation class here."]}, {"level": "Medium", "type": "mcq", "prompt": "Insertions/deletions of 1-2 base pairs cause", "options": ["Frame-shift mutations - the reading frame shifts from that point", "No effect on the protein ever", "Always an extra chromosome 21"], "answer": 0, "hint": "Chapter 5 develops the reading-frame idea.", "solution": "Shifting the triplet frame rewrites every downstream codon.", "wrong": ["Frame-shifts usually damage the protein severely.", "Chromosome gain is aneuploidy, a different scale."]}, {"level": "Hard", "type": "number", "map": "4.7 codon 6", "prompt": "Codon position in beta-globin changed in sickle-cell anaemia (GAG to GUG)", "answer": 6, "unit": "codon", "tolerance": 0.1, "hint": "Sixth codon of the beta-globin gene.", "solution": "Position 6: glutamic acid to valine."}], "resources": [{"title": "NCERT §4.7 — Mutation (official PDF, PDF p.22)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo104.pdf#page=22"}]}, {"id": "pedigree-mendelian", "nav": "Pedigree & Mendelian", "title": "Pedigree symbols plus haemophilia, sickle-cell, thalassemia, colour blindness", "deck": "Family trees replace test crosses in humans: X-linked recessive haemophilia passes carrier mother to son (Queen Victoria), autosomal recessive sickle-cell needs HbSHbS, and thalassemia is quantitative shortage vs sickle-cell's qualitative defect.", "minutes": 9, "section": "4.8, 4.8.1, 4.8.2", "pages": [22, 25], "print": "22–25", "sim": "pedigree", "simTitle": "Pedigree builder: symbols plus autosomal/X-linked classifier", "quick": ["Controlled crosses are impossible in humans, so geneticists study <strong>family history over several generations - pedigree analysis (4.8.1)</strong>: the inheritance of a trait drawn as a family tree using <strong>standard symbols (Figure 4.13)</strong>. It traces whether a trait is <strong>dominant or recessive, autosomal or sex-linked</strong> (Figure 4.14 shows autosomal dominant myotonic dystrophy vs autosomal recessive sickle-cell anaemia). The book invites students to design pedigrees for autosomal and sex-chromosome characters with the teacher.", "<strong>Mendelian disorders (4.8.2)</strong> come from <strong>mutation in a single gene</strong> and follow Mendel's principles: haemophilia, cystic fibrosis, <strong>sickle-cell anaemia, colour blindness, phenylketonuria, thalassemia</strong>. <strong>Colour blindness</strong> is <strong>sex-linked recessive</strong> (red/green cone defect, X-chromosome genes): about <strong>8% of males but only 0.4% of females</strong>; a carrier mother's son has a <strong>50% chance</strong> of being colour blind, and a daughter is colour blind only if her mother is a carrier and her father colour blind.", "<strong>Haemophilia</strong> is <strong>sex-linked recessive</strong>: one clotting-cascade protein fails, so a simple cut bleeds non-stop. It passes from <strong>unaffected carrier female to some sons</strong>; a haemophilic daughter is extremely rare (carrier mother plus haemophilic father, unviable later). <strong>Queen Victoria's pedigree</strong> shows many haemophilic descendants - she was a carrier.", "<strong>Sickle-cell anaemia</strong> is <strong>autosomal recessive (HbA/HbS)</strong>: only <strong>HbSHbS homozygotes</strong> show disease; <strong>HbAHbS heterozygotes</strong> are unaffected carriers with <strong>50% transmission probability</strong> to progeny (sickle-cell trait). The cause is <strong>Glu->Val at position 6 of beta-globin (GAG to GUG)</strong>; mutant haemoglobin <strong>polymerises under low oxygen</strong>, turning biconcave discs into <strong>sickles</strong> (Figure 4.15). <strong>Phenylketonuria</strong> (autosomal recessive) lacks the enzyme turning <strong>phenylalanine into tyrosine</strong>; phenylalanine becomes phenylpyruvic acid, accumulating in brain (<strong>mental retardation</strong>) and urine. <strong>Thalassemia</strong> (autosomal recessive) is reduced synthesis of alpha or beta globin chains - <strong>alpha: HBA1/HBA2 on chromosome 16</strong> (four genes, worse with more affected), <strong>beta: HBB on chromosome 11</strong> - causing anaemia. Thalassemia is <strong>quantitative (too few globins)</strong>; sickle-cell is <strong>qualitative (wrong globin)</strong>."], "formulas": [{"label": "Carrier x carrier (autosomal recessive)", "html": "HbAHbS x HbAHbS -> 1/4 HbSHbS affected : 1/2 carriers : 1/4 normal", "cond": "Sickle-cell/thalassemia/PKU logic"}, {"label": "Carrier mother (X-linked)", "html": "XHXh x XHY -> 1/2 of sons affected; daughters carriers/ normals", "cond": "Colour blindness/haemophilia; son gets X from mother"}, {"label": "Sickle vs thalassemia", "html": "sickle-cell = qualitative wrong globin (Glu->Val); thalassemia = quantitative shortage", "cond": "4.8.2 closing contrast"}], "deeper": "Why 8% vs 0.4%: males need one copy on their single X (q = 0.08) while females need two (q squared = 0.0064, near the 0.4% quoted). HbAHbS x HbAHbS gives the classic 1:2:1 with only the 1/4 HbSHbS diseased - the same arithmetic as Mendel's F2 wearing a clinical coat.", "worked": "Carrier-couple risk: HbAHbS x HbAHbS gametes (1/2 HbA + 1/2 HbS) each give 1/4 HbSHbS affected children - so 1 in 4 per pregnancy (40 in 160 births). Colour-blind son math: carrier mother XHXh gives Xh to half her sons, who are then XhY colour blind regardless of the father.", "prediction": {"prompt": "Two sickle-cell carriers (HbAHbS) plan children. The expected proportion affected (HbSHbS) is", "options": ["1/4 per pregnancy - the monohybrid recessive class", "All children - carriers always transmit disease", "None - carriers are immune to transmission"], "answer": 0, "explanation": "Each parent gives HbS at 1/2, so 1/2 x 1/2 = 1/4 HbSHbS; half the children are carriers like the parents."}, "connect": [["Thalassemia screening in India", "Because thalassemia needs both parents as carriers, Indian blood-disorder programmes screen couples and newborns - carrier detection before pregnancy is pedigree analysis put into public-health practice."], ["Wow - the sickle-cell belt of central India", "Sickle-cell trait concentrates in tribal populations across central India (Maharashtra, Madhya Pradesh, Chhattisgarh, Odisha, Gujarat) - the textbook's HbA/HbS cross explains why carrier screening there prevents affected births."]], "recall": "Define pedigree use, list the Mendelian disorders, contrast X-linked vs autosomal-recessive transmission, and reproduce the sickle/thalassemia contrast with genes and chromosomes.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Sickle-cell anaemia shows disease only in", "options": ["HbSHbS homozygotes - heterozygotes are carriers", "HbAHbS heterozygotes only", "HbAHbA normal homozygotes"], "answer": 0, "hint": "Autosomal recessive logic.", "solution": "Only HbSHbS shows the phenotype; HbAHbS appear unaffected but transmit HbS at 50%.", "wrong": ["Heterozygotes show trait, not disease.", "HbAHbA individuals are fully normal."]}, {"level": "Medium", "type": "number", "map": "4.8.2 carrier x carrier", "prompt": "Affected (HbSHbS) children expected among 160 births to HbAHbS x HbAHbS parents", "answer": 40, "unit": "children", "tolerance": 2, "hint": "1/4 affected.", "solution": "160 x 1/4 = 40 affected; 80 carriers; 40 HbAHbA."}, {"level": "Hard", "type": "number", "map": "4.8.2 colour blindness 50%", "prompt": "Colour-blind sons expected among 120 sons of carrier mothers (50% risk each)", "answer": 60, "unit": "sons", "tolerance": 3, "hint": "Half of sons get the mother's Xh.", "solution": "120 x 1/2 = 60 colour-blind sons (XhY)."}], "resources": [{"title": "NCERT §4.8, 4.8.1, 4.8.2 — Pedigree & Mendelian (official PDF, PDF p.22)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo104.pdf#page=22"}]}, {"id": "chromosomal-disorders", "nav": "Chromosomal disorders", "title": "Down (47, trisomy 21), Turner (45, XO), Klinefelter (47, XXY): counting chromosomes", "deck": "Aneuploidy from failed segregation (gain/loss) vs polyploidy from failed cytokinesis: normal human cell 46, Down 47, Turner 45, Klinefelter 47 - read straight off the karyotype.", "minutes": 9, "section": "4.8.3", "pages": [25, 26], "print": "25–26", "sim": "karyotype", "simTitle": "Karyotype counter: Down 47 vs Turner 45 vs Klinefelter 47", "quick": ["Chromosomal disorders come from <strong>absence, excess or abnormal arrangement of chromosomes</strong>. <strong>Failure of chromatid segregation</strong> gains or loses chromosomes (<strong>aneuploidy</strong>): <strong>Down's</strong> gains chromosome 21, <strong>Turner's</strong> loses an X in females. <strong>Failure of cytokinesis after telophase</strong> multiplies whole sets (<strong>polyploidy</strong>), often seen in <strong>plants</strong>.", "The baseline: a <strong>normal human cell has 46 chromosomes (23 pairs): 22 autosome pairs + 1 sex-chromosome pair</strong>. Gain of one gives <strong>trisomy</strong>, loss gives <strong>monosomy</strong> - both with very serious consequences. The three common examples are <strong>Down's, Turner's and Klinefelter's syndromes</strong>.", "<strong>Down's syndrome</strong> (Langdon Down, 1866): extra copy of <strong>chromosome 21 (trisomy 21)</strong>, total <strong>47</strong>. Features: <strong>short stature, small round head, furrowed tongue, partially open mouth</strong> (Figure 4.16), <strong>broad palm with characteristic crease</strong>, retarded physical, psychomotor and mental development. <strong>Klinefelter's</strong>: extra X giving <strong>47, XXY</strong> - overall <strong>masculine development plus gynaecomastia (breast development)</strong>, sterile (Figure 4.17a). <strong>Turner's</strong>: missing X giving <strong>45, XO</strong> females - <strong>sterile with rudimentary ovaries, lacking secondary sexual characters</strong> (Figure 4.17b)."], "formulas": [{"label": "Normal count", "html": "46 = 22 autosome pairs + 1 sex pair (XX or XY)", "cond": "4.8.3 baseline"}, {"label": "Three karyotypes", "html": "Down 47 (+21); Klinefelter 47, XXY; Turner 45, XO", "cond": "Trisomy vs monosomy"}, {"label": "Aneuploidy vs polyploidy", "html": "segregation failure -> +/- chromosome(s); cytokinesis failure -> whole-set gain", "cond": "4.8.3 mechanisms"}], "deeper": "The summary's closing arithmetic: Down's 47 = 46 + one chromosome 21; Turner's 45 = 46 - one X; Klinefelter's 47 = 46 + one X. Karyotype study (ordered chromosome display) reads each directly - trisomy shows three copies, monosomy one.", "worked": "Counting drill: normal gamete 23 + normal gamete 23 = 46 zygote. Non-disjunction giving a 24-chromosome gamete + 23 gives 47 (Down/Klinefelter); a 22-chromosome gamete + 23 gives 45 (Turner). ABO bonus (Exercise 12): O child (ii) with A father and B mother forces father IAi x mother IBi, so other children can be A (IAi), B (IBi), AB (IAIB) or O (ii) at 1/4 each.", "prediction": {"prompt": "A karyotype shows 47 chromosomes with three copies of chromosome 21. The diagnosis is", "options": ["Down's syndrome - trisomy 21 (Langdon Down, 1866)", "Turner's syndrome - 45, XO female", "Klinefelter's syndrome - 47, XXY male"], "answer": 0, "explanation": "Extra chromosome 21 with total 47 is the textbook definition of Down's syndrome."}, "connect": [["Karyotype labs in Indian hospitals", "Amniocentesis samples (Chapter 3) are karyotyped to count 46 vs 47 vs 45 before birth - the aneuploidy arithmetic of 4.8.3 underlies prenatal diagnosis offered in Indian medical colleges."], ["Wow - one chromosome rewrites development", "A single extra chromosome 21 - under 2% more DNA - produces the full Down's phenotype of face, palm, heart and learning: dosage matters as much as sequence."]], "recall": "State 46 baseline, both failure mechanisms, all three karyotypes with counts, and one feature set each.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Down's syndrome is caused by", "options": ["Trisomy of chromosome 21 (47 chromosomes total)", "Loss of an X chromosome (45, XO)", "An extra X in a male (47, XXY)"], "answer": 0, "hint": "Which numbered autosome is tripled?", "solution": "An additional copy of chromosome 21; first described by Langdon Down (1866).", "wrong": ["That is Turner's syndrome.", "That is Klinefelter's syndrome."]}, {"level": "Medium", "type": "number", "map": "4.8.3 karyotypes", "prompt": "Total chromosomes in a Klinefelter (XXY) individual", "answer": 47, "unit": "chromosomes", "tolerance": 0.1, "hint": "46 plus one X.", "solution": "47, XXY - masculine development with gynaecomastia, sterile."}, {"level": "Hard", "type": "number", "map": "4.8.3 Turner 45", "prompt": "Total chromosomes in a Turner (XO) individual", "answer": 45, "unit": "chromosomes", "tolerance": 0.1, "hint": "46 minus one X.", "solution": "45 with XO - sterile female with rudimentary ovaries."}], "resources": [{"title": "NCERT §4.8.3 — Chromosomal disorders (official PDF, PDF p.25)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo104.pdf#page=25"}]}], "exercises": [{"number": 1, "conceptIdx": 0, "page": 28, "printPage": null, "question": "Mention the advantages of selecting pea plant for experiment by Mendel.", "steps": ["Pea offers pairs of contrasting traits (Table 4.1: tall/dwarf, violet/white, axial/terminal, inflated/constricted, green/yellow pods, round/wrinkled and yellow/green seeds) so one character can be tracked at a time.", "Many true-breeding lines (14 used) give stable parental genotypes, flowers allow artificial cross-pollination as well as selfing, and large progeny numbers permit statistical 3:1/1:2:1 analysis over successive generations.", "Short life cycle and confirmation across F1-F4 generations proved general rules rather than unsubstantiated ideas."], "answer": "Contrasting traits, true-breeding lines, controllable crosses, large samples with mathematics, successive-generation checks."}, {"number": 2, "conceptIdx": 0, "page": 28, "printPage": null, "question": "Differentiate between the following – (a) Dominance and Recessive (b) Homozygous and Heterozygous (c) Monohybrid and Dihybrid.", "steps": ["(a) Dominance vs recessive: in a dissimilar factor pair (e.g. Tt) the dominant factor (T) expresses in F1 while the recessive (t) is hidden and reappears only in homozygous (tt) F2 - Law of Dominance 4.2.1.", "(b) Homozygous vs heterozygous: identical allele pair (TT, tt - true-breeding) vs dissimilar pair (Tt - F1 hybrid); homozygotes make one gamete type, heterozygotes two types at 1/2 each.", "(c) Monohybrid vs dihybrid: cross differing in one gene pair (TT x tt, F2 3:1) vs two gene pairs (RRYY x rryy, F2 9:3:3:1)."], "answer": "Dominant expresses in heterozygote / recessive only in homozygote; homozygous identical / heterozygous dissimilar; monohybrid one trait / dihybrid two traits."}, {"number": 3, "conceptIdx": 1, "page": 28, "printPage": null, "question": "A diploid organism is heterozygous for 4 loci, how many types of gametes can be produced?", "steps": ["Each heterozygous locus segregates 1/2 : 1/2 independently (Law of Segregation + Independent Assortment).", "Gamete types = 2^4 = 16, each at (1/2)^4 = 1/16.", "Example: AaBbCcDd gives ABCd-type classes ABC D through abc d, 16 in all."], "answer": "16 types of gametes (2^4, each 1/16)."}, {"number": 4, "conceptIdx": 0, "page": 28, "printPage": null, "question": "Explain the Law of Dominance using a monohybrid cross.", "steps": ["Cross true-breeding tall (TT) x dwarf (tt): gametes T x t give all F1 Tt, and every F1 plant is tall - only the T parental character expresses.", "Self the F1 (Tt x Tt): gametes (1/2T + 1/2t) each side give 1/4 TT + 1/2 Tt + 1/4 tt, i.e. 3/4 tall : 1/4 dwarf (3:1) with both parental traits recovered unblended.", "Hence Law of Dominance 4.2.1: factors occur in pairs and one of a dissimilar pair dominates, explaining one trait in F1 and both (3:1) in F2."], "answer": "F1 all tall (Tt); F2 3 tall : 1 dwarf with 1:2:1 genotypes - dominant T hides t in the heterozygote."}, {"number": 5, "conceptIdx": 0, "page": 28, "printPage": null, "question": "Define and design a test-cross.", "steps": ["Definition: cross an organism showing a dominant phenotype (genotype to be determined) with the recessive parent (homozygous recessive), instead of self-crossing.", "Design for tall pea: cross the unknown tall (T_) x dwarf (tt). Gametes: tt parent gives only t; unknown gives T only (if TT) or 1/2T + 1/2t (if Tt).", "Readout: TT x tt gives 100% tall (all Tt); Tt x tt gives 1/2 tall (Tt) : 1/2 dwarf (tt), a 1:1 ratio proving heterozygosity (Fig. 4.5 violet V x white v)."], "answer": "Test cross = dominant-phenotype x recessive parent; 1:1 progeny diagnoses Tt, uniform tall diagnoses TT."}, {"number": 6, "conceptIdx": 0, "page": 28, "printPage": null, "question": "Using a Punnett Square, workout the distribution of phenotypic features in the first filial generation after a cross between a homozygous female and a heterozygous male for a single locus.", "steps": ["Let the gene be A/a with A dominant. Homozygous female: AA (or aa); heterozygous male: Aa. Take AA x Aa.", "Female gametes: all A (1). Male gametes: 1/2 A + 1/2 a. Punnett boxes: 1/2 AA + 1/2 Aa.", "Phenotypes: 100% dominant (all A_) - 1/2 AA and 1/2 Aa, no recessive. (If the female were aa x Aa, F1 = 1/2 Aa dominant : 1/2 aa recessive, a 1:1 test-cross pattern.)"], "answer": "AA x Aa gives 1/2 AA + 1/2 Aa: 100% dominant phenotype in F1 (1:0; the reciprocal aa x Aa gives 1:1)."}, {"number": 7, "conceptIdx": 1, "page": 28, "printPage": null, "question": "When a cross in made between tall plant with yellow seeds (TtYy) and tall plant with green seed (Ttyy), what proportions of phenotype in the offspring could be expected to be (a) tall and green. (b) dwarf and green.", "steps": ["Split by trait (independent assortment): height Tt x Tt gives 3/4 tall (T_) : 1/4 dwarf (tt); seed colour Yy x yy gives 1/2 yellow (Yy) : 1/2 green (yy).", "(a) Tall and green = 3/4 x 1/2 = 3/8.", "(b) Dwarf and green = 1/4 x 1/2 = 1/8. (Checks: tall-yellow 3/8, dwarf-yellow 1/8; total 3/8+3/8+1/8+1/8 = 1.)"], "answer": "(a) Tall and green 3/8; (b) dwarf and green 1/8."}, {"number": 8, "conceptIdx": 2, "page": 28, "printPage": null, "question": "Two heterozygous parents are crossed. If the two loci are linked what would be the distribution of phenotypic features in F1 generation for a dibybrid cross?", "steps": ["Unlinked expectation (reference): RrYy x RrYy gives 9:3:3:1 (9/16 both-dominant : 3/16 : 3/16 : 1/16 both-recessive) via four 1/4 gametes.", "Linked case: genes on the same chromosome travel together (Morgan 4.3.3), so parental gamete combinations far exceed recombinant ones and the F2 deviates very significantly from 9:3:3:1.", "Distribution: parental phenotypes dominate (nearly all progeny), non-parental (recombinant) phenotypes are rare - e.g. at 1.3% recombination only ~1.3% recombinant; exact split needs the given recombination frequency."], "answer": "Parental combinations predominate; recombinants are rare - F1/F2 deviates strongly from 9:3:3:1 toward the two parental phenotypes."}, {"number": 9, "conceptIdx": 2, "page": 28, "printPage": null, "question": "Briefly mention the contribution of T.H. Morgan in genetics.", "steps": ["Provided experimental verification of the chromosomal theory of inheritance using Drosophila melanogaster (two-week cycle, simple medium, large families, distinguishable sexes, visible variations).", "Showed linked genes on the same (X) chromosome violate independent assortment: yellow-bodied white-eyed x brown-bodied red-eyed crosses deviate from 9:3:3:1 with parental excess.", "Coined linkage (physical association) and recombination (non-parental combinations); found tight (white-yellow 1.3%) vs loose (white-miniature 37.2%) linkage; student Sturtevant turned recombination frequency into gene maps (basis of Human Genome Project maps)."], "answer": "Verified chromosomal theory on Drosophila; discovered linkage/recombination with 1.3%/37.2% measures leading to genetic maps."}, {"number": 10, "conceptIdx": 6, "page": 28, "printPage": null, "question": "What is pedigree analysis? Suggest how such an analysis, can be useful.", "steps": ["Pedigree analysis (4.8.1): tracing a trait, abnormality or disease through several generations of a family tree, since control crosses are impossible in humans, using standard symbols (Fig. 4.13).", "It reveals whether the trait is dominant or recessive (Fig. 4.14 myotonic dystrophy vs sickle-cell anaemia) and whether it is autosomal or sex-chromosome linked.", "Uses: genetic counselling (carrier/recurrence risks), identifying haemophilia/colour-blindness/sickle-cell/thalassemia patterns, and guiding screening before pregnancy."], "answer": "Family-tree tracing of a trait over generations; reveals dominant/recessive and autosomal/sex-linked patterns for counselling and screening."}, {"number": 11, "conceptIdx": 4, "page": 28, "printPage": null, "question": "How is sex determined in human beings?", "steps": ["Humans use XY male heterogamety: 23 pairs = 22 identical autosome pairs + XX (female) or XY (male).", "Females make only X-ova; males make 50% X-sperm + 50% Y-sperm. X-sperm + ovum gives XX girl; Y-sperm + ovum gives XY boy.", "So the sperm's makeup decides, with 50% boy/girl probability each pregnancy; blaming women for daughters is a false notion."], "answer": "XY system: X-sperm -> XX girl, Y-sperm -> XY boy; 1/2 each, decided by the sperm."}, {"number": 12, "conceptIdx": 6, "page": 28, "printPage": null, "question": "A child has blood group O. If the father has blood group A and mother blood group B, work out the genotypes of the parents and the possible genotypes of the other offsprings.", "steps": ["ABO alleles: IA, IB co-dominant, both dominant over i. O child must be ii - one i from each parent.", "Hence A father must be IAi (not IAIA) and B mother IBi (not IBIB). Cross IAi x IBi gametes (1/2IA + 1/2i) x (1/2IB + 1/2i).", "Other children: 1/4 IAIB (AB), 1/4 IAi (A), 1/4 IBi (B), 1/4 ii (O) - all four blood groups possible at 1/4 each."], "answer": "Parents IAi (A) x IBi (B); other children 1/4 AB (IAIB) : 1/4 A (IAi) : 1/4 B (IBi) : 1/4 O (ii)."}, {"number": 13, "conceptIdx": 0, "page": 28, "printPage": null, "question": "Explain the following terms with example (a) Co-dominance (b) Incomplete dominance", "steps": ["(a) Co-dominance: F1 resembles both parents - both alleles express. ABO: IAIB red cells carry both A and B sugars (Table 4.2); six genotypes (IAIA, IAi, IBIB, IBi, IAIB, ii) give four phenotypes (A, B, AB, O).", "(b) Incomplete dominance: F1 is intermediate. Snapdragon RR red x rr white gives Rr pink; selfing gives 1 RR red : 2 Rr pink : 1 rr white (genotypes as in Mendel, phenotypes 1:2:1 not 3:1).", "Related: starch synthesis Bb peas look round like BB yet make intermediate-size starch grains - dominance depends on which phenotype is scored."], "answer": "(a) Co-dominance: IAIB shows both A and B; (b) Incomplete dominance: Rr snapdragon pink with 1:2:1 F2."}, {"number": 14, "conceptIdx": 5, "page": 28, "printPage": null, "question": "What is point mutation? Give one example.", "steps": ["Point mutation (4.7): change in a single base pair of DNA (cf. frame-shifts from 1-2 base indels).", "Classical example: sickle-cell anaemia - sixth codon of the beta-globin gene GAG -> GUG, replacing glutamic acid (Glu) with valine (Val) at position 6 of the beta chain.", "Mutant haemoglobin polymerises under low oxygen, sickling the red cells; UV radiation is a named mutagen."], "answer": "Single base-pair change; e.g. beta-globin codon 6 GAG -> GUG (Glu -> Val) causing sickle-cell anaemia."}, {"number": 15, "conceptIdx": 2, "page": 28, "printPage": null, "question": "Who had proposed the chromosomal theory of the inheritance?", "steps": ["Walter Sutton and Theodore Boveri (1902 synthesis): chromosome behaviour parallels gene behaviour (pairs, segregation, independent assortment - Table 4.3).", "Pairing/separation of chromosomes explains segregation of the factors they carry; meiosis work available by 1902 made the correlation possible.", "Experimentally verified later by Thomas Hunt Morgan and colleagues on Drosophila."], "answer": "Sutton and Boveri (chromosomal theory of inheritance)."}, {"number": 16, "conceptIdx": 7, "page": 28, "printPage": null, "question": "Mention any two autosomal genetic disorders with their symptoms.", "steps": ["Any two of (autosomal, per text): sickle-cell anaemia (HbSHbS only; Glu->Val position 6; sickled RBCs under low oxygen - Fig. 4.15); thalassemia (reduced alpha/beta globin synthesis; HBA1/HBA2 chr16 / HBB chr11; anaemia; quantitative shortage); phenylketonuria (no phenylalanine->tyrosine enzyme; phenylpyruvic acid; brain accumulation -> mental retardation, urine excretion); Down's syndrome (trisomy 21, 47; short stature, small round head, furrowed tongue, open mouth, broad palm crease, retarded development).", "Example pair: sickle-cell anaemia - only HbSHbS diseased, carriers HbAHbS transmit at 50%, sickle RBCs; thalassemia - too few globins made, anaemia (alpha chr16 / beta chr11).", "Chromosomal vs Mendelian: Down's is aneuploidy (extra chromosome), not a single-gene Mendelian disorder, though the question accepts autosomal disorders broadly."], "answer": "E.g. sickle-cell anaemia (HbSHbS, Glu->Val, sickled cells) and thalassemia (globin shortage, anaemia); or phenylketonuria / Down's with textbook symptoms."}], "pageOffset": null, "printPageStart": null, "printPageEnd": null, "paginationProvenance": "folio-absent-in-source"};
</script>
<script>
(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
