<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 7: Human Health and Disease — Interactive Textbook</title>
<style>

:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
  margin: 0;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
}
/* width:100% stops main from sizing to the scrolling concept list's content width */
main { min-width: 0; width: 100%; }

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav, .revision-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover, .revision-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active, .revision-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num, .revision-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num, .revision-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  .topbar {
    padding: 0 10px;
    height: 56px;
  }
  .chapter-crumb {
    display: none !important;
  }
  .top-actions {
    gap: 6px;
  }
  .progress-pill span:first-child {
    display: none !important;
  }
  .progress-pill progress {
    width: 44px;
  }
  .toolbar-btn {
    padding: 4px 8px;
    font-size: 12px;
  }
  main { padding: 16px 12px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
.concept-title {
  font: 34px/1.2 Georgia, "Times New Roman", serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.3px;
}
@media (max-width: 640px) {
  .concept-title { font-size: 27px; }
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
  min-width: 0;
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 2px 16px;
  font-size: 12.5px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  max-height: 460px;
  touch-action: pan-y;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
  min-width: 0;
}
.telemetry-label {
  /* No text-transform: labels contain case-sensitive symbols such as s₁, u, t. */
  font-size: 12px;
  color: #94a3b8;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
  overflow-wrap: anywhere;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font-size: 16px;
  line-height: 1.35;
  font-weight: 700;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: var(--radius-sm);
  position: relative;
  overflow: hidden;
  border: none;
  padding: 0;
  cursor: pointer;
  display: block;
}
.video-facade img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
}
.play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 48px;
  height: 48px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.video-title {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 8px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  color: #fff;
  font-size: 12px;
  text-align: left;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font-size: 16.5px;
  line-height: 1.5;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;

ages) anchors the vector-borne model reused for Wuchereria; 7.2 (elephantiasis limb) and 7.3 (ringworm patch) are recognition diagrams. The hygiene section is organised by transmission mode — food/water, air, vector — which is exactly how Exercise Q1/Q4 expect answers to be structured.", "worked": "Worked (mode matching): internal bleeding + intestinal blockage with eggs in faeces → Ascaris (faecal–oral, wash produce, safe water). Chronic lower-limb lymphatic swelling over years → Wuchereria (mosquito vector, nets/larval control). Itchy scaly groin/toe lesions in heat and moisture → ringworm (do not share towels/clothes/combs). Each worked case pairs the disease with its textbook transmission break.", "prediction": {"prompt": "A village reports ascariasis in children and filarial swelling in adults. Which combined textbook response fits?", "options": ["Safe water + washed produce + waste disposal (faecal–oral break) together with nets, Gambusia, drainage and wire mesh (vector break)", "Only distribute antibiotics and ignore water and mosquitoes", "Spray perfume on stagnant water and share combs to build immunity"], "answer": 0, "explanation": "Ascariasis is faecal–oral (public hygiene + clean food/water); filariasis is mosquito-vector (nets, Gambusia, insecticides, no stagnation). The book treats each mode separately."}, "connect": [["NVBDCP and the textbook list", "India's National Vector Borne Disease Control Programme targets malaria and filariasis with exactly the book's tools — nets, larvivorous fish like Gambusia, anti-larval spraying and drainage — the vector-borne half of this lesson applied at national scale."], ["Wow — a fish that eats the vector", "Gambusia ponds are biological warfare: the fish eats mosquito larvae before they can carry Plasmodium or Wuchereria. Vector control in the book is not only chemicals — it is ecology."]], "recall": "Distinguish the three transmission chains (faecal–oral, vector-borne, fomite/close-contact) with one disease example and one textbook break each.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Elephantiasis (filariasis) is caused by and spread by", "options": ["Wuchereria bancrofti/malayi; female mosquito bite", "Ascaris eggs; contaminated vegetables", "Epidermophyton; shared combs"], "answer": 0, "hint": "Chronic lymphatic inflammation of lower limbs.", "solution": "W. bancrofti and W. malayi live years in lymphatic vessels; female mosquitoes transmit them.", "wrong": ["That is the ascariasis chain.", "Those fungi cause ringworm, not elephantiasis."]}, {"level": "Medium", "type": "mcq", "prompt": "A student gets itchy scaly lesions between the toes after monsoon football in shared boots. Textbook diagnosis and advice?", "options": ["Ringworm (Microsporum/Trichophyton/Epidermophyton); keep feet dry, do not share towels/clothes", "Ascariasis; deworm the football field", "Pneumonia; alveoli are filled with fluid"], "answer": 0, "hint": "Heat + moisture + skin folds + shared items.", "solution": "Ringworm thrives in heat and moisture (groin, between toes) and spreads via towels/clothes/combs or soil.", "wrong": ["Ascaris is intestinal with faecal–oral eggs.", "Pneumonia is alveolar, unrelated to toe lesions."]}, {"level": "Hard", "type": "number", "map": "Section 7.1", "prompt": "Number of helminth genera named as pathogenic to man in this section (Ascaris, Wuchereria)", "answer": 2, "unit": "genera", "tolerance": 0.1, "hint": "Roundworm + filarial worm.", "solution": "Ascaris (ascariasis) and Wuchereria (elephantiasis/filariasis) — two genera."}], "resources": [{"title": "NCERT §7.1 — Worms, ringworm & hygiene (official PDF, PDF p.6)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo107.pdf#page=6"}]}, {"id": "innate-acquired-immunity", "nav": "Innate & acquired immunity", "title": "Innate barriers and acquired memory: B/T cells and the H2L2 antibody", "deck": "Skin to interferons at birth; then pathogen-specific memory: weak primary, intense secondary response, B-cell antibodies (H2L2; IgA/IgM/IgE/IgG) and T-cell CMI that rejects grafts.", "minutes": 10, "section": "7.2, 7.2.1, 7.2.2", "pages": [8, 10], "print": "134–136", "sim": "immunity", "simTitle": "Innate vs acquired classifier + antibody H2L2 builder", "quick": ["We meet countless infectious agents yet rarely fall ill because the <strong>immune system</strong> fights them; this overall ability is <strong>immunity</strong>, of two types: <strong>innate</strong> and <strong>acquired</strong>. <strong>Innate immunity</strong> is the <strong>non-specific defence present at birth</strong>, built from four barriers: <strong>(i) physical</strong> — skin (main barrier), mucus coating respiratory, gastrointestinal and urogenital epithelia trapping microbes; <strong>(ii) physiological</strong> — stomach acid, saliva, tears preventing microbial growth; <strong>(iii) cellular</strong> — phagocytic/destroyer leukocytes: <strong>polymorpho-nuclear leukocytes (PMNL-neutrophils)</strong>, <strong>monocytes</strong>, <strong>natural killer lymphocytes</strong> in blood and <strong>macrophages</strong> in tissues; <strong>(iv) cytokine</strong> — <strong>interferons</strong> secreted by virus-infected cells protecting non-infected cells.", "<strong>Acquired immunity</strong> is <strong>pathogen-specific with memory</strong>: first encounter gives a <strong>primary response of low intensity</strong>; the same pathogen later triggers a highly intensified <strong>secondary (anamnestic) response</strong> — the body remembers. Two special lymphocytes run it: <strong>B-lymphocytes</strong> produce an army of <strong>antibodies</strong> into blood; <strong>T-cells</strong> do not secrete antibodies but <strong>help B cells</strong> produce them.", "Each antibody has <strong>four peptide chains — two small light and two longer heavy — represented H<sub>2</sub>L<sub>2</sub></strong> (Figure 7.4 cartoon; e.g. IgA, IgM, IgE, IgG). Blood-borne antibodies give the <strong>humoral (antibody-mediated) response</strong>; the second arm is <strong>cell-mediated immunity (CMI)</strong>, mediated by <strong>T-lymphocytes</strong>.", "Because the body distinguishes <strong>self from nonself</strong>, grafts/transplants (heart, eye, liver, kidney) from just any source are <strong>rejected</strong>: tissue and blood-group matching are essential, and the patient takes <strong>immunosuppressants lifelong</strong>. Graft rejection is a cell-mediated response."], "formulas": [{"label": "Antibody H2L2", "html": "antibody = H<sub>2</sub>L<sub>2</sub> (2 heavy + 2 light chains); classes IgA, IgM, IgE, IgG", "cond": "Figure 7.4; B-cell humoral arm"}, {"label": "Memory rule", "html": "primary response (low) → secondary/anamnestic response (high, fast) on re-exposure", "cond": "Basis of vaccination (§7.2.4)"}, {"label": "Two arms", "html": "humoral = B-cell antibodies in blood; CMI = T-lymphocytes (graft rejection)", "cond": "§7.2.2; self vs nonself"}], "deeper": "Figure 7.4 (antibody cartoon) is the diagram behind Exercise Q9: two heavy chains forming the Y stem and arms, two light chains along the arms, variable tips binding antigen. The innate four-barrier list is an exam favourite — each barrier maps to named agents (skin/mucus; acid/saliva/tears; PMNL/monocyte/NK/macrophage; interferons). The graft paragraph previews transplantation immunology: matching plus lifelong immunosuppression.", "worked": "Worked (antibody diagram reading, Q9): label the Y as two identical heavy (H) chains (longer, inner) plus two identical light (L) chains (smaller, outer) — hence H2L2; mark antigen-binding tips at the arm ends; note classes IgA/IgM/IgE/IgG as variants of this plan. Worked (response timing): first tetanus exposure (primary, slow/low) vs booster encounter (secondary, rapid/massive) — the memory gap vaccination exploits.", "prediction": {"prompt": "A child gets chickenpox once and never again despite exposures. Which textbook mechanism explains it?", "options": ["Acquired memory: weak primary response first, then rapid intense secondary responses clear the same pathogen", "Innate skin thickens permanently after every infection", "Interferons delete the child's B-lymphocytes"], "answer": 0, "explanation": "Acquired immunity is pathogen-specific with memory; re-encounter triggers the intensified anamnestic response."}, "connect": [["Pulse polio and memory", "India's pulse-polio rounds succeeded because each oral dose trained memory B and T cells — the secondary response in §7.2.2 scaled to a whole population until transmission stopped."], ["Wow — the Y that remembers", "One H2L2 molecule is tiny, but the repertoire of tips across IgA/IgM/IgE/IgG remembers nearly every pathogen you have met — immunity is a library written in antibody tips."]], "recall": "Name the four innate barriers with agents, write H2L2 with chain counts, and contrast primary vs secondary response intensity.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Which set lists innate barriers correctly?", "options": ["Skin/mucus; stomach acid/saliva/tears; PMNL/monocytes/NK/macrophages; interferons", "B-cell antibodies; T-cell CMI; memory cells", "Colostrum IgA; placental antibodies; vaccines"], "answer": 0, "hint": "Non-specific, present at birth, four types.", "solution": "Physical, physiological, cellular and cytokine (interferon) barriers are innate; the rest are acquired/passive items.", "wrong": ["Those are acquired-response agents.", "Those are passive-immunity/vaccination items."]}, {"level": "Medium", "type": "mcq", "prompt": "After matching, a kidney graft still needs lifelong immunosuppressants because", "options": ["Cell-mediated immunity distinguishes self from nonself and rejects the graft", "Antibodies run out after one transplant", "Interferons dissolve transplanted tissue"], "answer": 0, "hint": "Which arm rejects grafts?", "solution": "T-lymphocyte CMI recognises nonself tissue; suppression must continue lifelong even after tissue/blood matching.", "wrong": ["Antibody supply is not the issue in rejection.", "Interferons protect cells from viruses; they do not dissolve grafts."]}, {"level": "Hard", "type": "number", "map": "Figure 7.4", "prompt": "Total peptide chains in one antibody molecule (H2L2)", "answer": 4, "unit": "chains", "tolerance": 0.1, "hint": "2 heavy + 2 light.", "solution": "H2L2 = 2 heavy + 2 light = 4 chains per antibody."}], "resources": [{"title": "NCERT §7.2, 7.2.1, 7.2.2 — Innate & acquired immunity (official PDF, PDF p.8)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo107.pdf#page=8"}]}, {"id": "vaccination-allergy-lymphoid", "nav": "Vaccines, allergy & organs", "title": "Active vs passive immunity, vaccines, allergy, autoimmunity and lymphoid organs", "deck": "Colostrum IgA to hepatitis-B-from-yeast: active is slow self-made, passive is ready-made. IgE–histamine allergy, rheumatoid-arthritis autoimmunity, and marrow/thymus vs spleen/nodes with MALT at 50%.", "minutes": 10, "section": "7.2.3–7.2.7", "pages": [10, 12], "print": "136–138", "sim": "lymphoid", "simTitle": "Primary vs secondary lymphoid-organ sorter + MALT", "quick": ["<strong>Active immunity</strong>: host exposed to antigens (living/dead microbes, proteins) <strong>makes its own antibodies — slow</strong>, full effect takes time; induced by natural infection or <strong>deliberate immunisation</strong>. <strong>Passive immunity</strong>: <strong>ready-made antibodies</strong> given directly. Textbook examples: <strong>colostrum</strong> (yellowish first milk, abundant <strong>IgA</strong>) and antibodies crossing the <strong>placenta</strong> to the foetus.", "<strong>Vaccination</strong> uses immune <strong>memory</strong>: antigenic proteins or <strong>inactivated/weakened pathogen (vaccine)</strong> generate antibodies plus <strong>memory B and T cells</strong> that overwhelm the pathogen on later exposure with massive antibody production. When speed matters (tetanus), inject <strong>preformed antibodies/antitoxin</strong>; snakebite injections likewise carry preformed anti-venom antibodies — <strong>passive immunisation</strong>. <strong>Recombinant-DNA vaccines</strong> (antigenic polypeptides made in bacteria/yeast; e.g. <strong>hepatitis-B vaccine from yeast</strong>) allow large-scale supply.", "<strong>Allergy</strong> is the <strong>exaggerated response to environmental antigens</strong>; the substances are <strong>allergens</strong> (dust mites, pollens, animal dander) and the antibodies are <strong>IgE</strong>. Symptoms: sneezing, watery eyes, running nose, breathing difficulty. Mechanism: <strong>histamine and serotonin from mast cells</strong>; diagnosis by tiny-dose allergen exposure; treatment <strong>anti-histamine, adrenalin, steroids</strong>. More metro children suffer allergies/asthma — possibly the protected early-life environment lowering immunity. <strong>Autoimmunity</strong>: the body <strong>attacks self-cells</strong> (genetic/unknown reasons); e.g. <strong>rheumatoid arthritis</strong>.", "<strong>Lymphoid organs</strong> (origin/maturation/proliferation sites): <strong>primary — bone marrow and thymus</strong> (immature lymphocytes → antigen-sensitive); <strong>secondary — spleen, lymph nodes, tonsils, Peyer's patches of small intestine, appendix</strong> (lymphocyte–antigen interaction → effector cells; Figure 7.5). <strong>Bone marrow</strong> makes all blood cells including lymphocytes; the <strong>thymus</strong> (lobed, near heart beneath breastbone; large at birth, tiny by puberty) with marrow matures <strong>T-lymphocytes</strong>. The <strong>spleen</strong> (large, bean-shaped) filters blood-borne microbes and reservoirs erythrocytes. <strong>Lymph nodes</strong> trap antigens from lymph/tissue fluid and activate lymphocytes. <strong>MALT</strong> (mucosa-associated lymphoid tissue of respiratory, digestive, urogenital linings) is about <strong>50 per cent of lymphoid tissue</strong>."], "formulas": [{"label": "Active vs passive", "html": "active = host makes antibodies (slow; infection or vaccine) vs passive = ready-made antibodies (colostrum IgA, placenta, antitoxin)", "cond": "§7.2.3; tetanus/snakebite = passive"}, {"label": "Allergy axis", "html": "allergen → IgE → mast-cell histamine + serotonin → anti-histamine/adrenalin/steroids", "cond": "§7.2.5"}, {"label": "Lymphoid split + MALT", "html": "primary (marrow, thymus) vs secondary (spleen, nodes, tonsils, Peyer's, appendix); MALT ≈ 50% of lymphoid tissue", "cond": "§7.2.7; Exercise Q6"}], "deeper": "This lesson chains four exam answers: Q5's DNA-vaccine 'suitable gene' (antigenic polypeptide gene expressed in bacteria/yeast, cf. hepatitis-B-from-yeast), Q6's organ list, Q7's MALT/CMI expansions, and Q8's two differentiations. Note active immunity is slow even after vaccination — memory, not instant antibodies, is what the vaccine installs; passive gives instant but borrowed protection.", "worked": "Worked (Q8a in 30 seconds): innate = non-specific, present at birth, four barriers (no memory) vs acquired = pathogen-specific, memory-based, B/T cells, primary-low/secondary-high. Worked (Q8b): active = antigen exposure → own antibodies, slow (infection, vaccine) vs passive = ready-made (colostrum IgA, placenta, tetanus antitoxin, snakebite serum), fast but temporary.", "prediction": {"prompt": "A tetanus-prone wound needs protection today, not next week. Textbook choice?", "options": ["Preformed antibodies/antitoxin (passive immunisation) for immediate cover", "A first vaccine dose alone, which protects within minutes", "Anti-histamine, which neutralises tetanus toxin"], "answer": 0, "explanation": "Active immunity is slow; deadly infections needing quick response get directly injected preformed antibodies (passive immunisation)."}, "connect": [["Yoga, the textbook's own prescription", "The chapter prescribes yoga 'since time immemorial' for physical and mental health alongside diet, hygiene and exercise — the book's preventive lifestyle before any vaccine or drug enters the picture."], ["Wow — half your lymphoid tissue is MALT", "About 50% of lymphoid tissue lines the respiratory, digestive and urogenital tracts — the immune system's biggest garrison guards the doors (mucosae), not the blood."]], "recall": "Differentiate active vs passive with two examples each; state the allergy axis; list primary vs secondary lymphoid organs and the MALT share.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Colostrum protects the newborn because it is rich in", "options": ["Ready-made IgA antibodies (passive immunity)", "Live weakened pathogens for active immunity", "Histamine against allergens"], "answer": 0, "hint": "Yellowish first milk.", "solution": "Colostrum's abundant IgA is a passive-immunity example, like placental antibodies.", "wrong": ["Colostrum is not a vaccine.", "Histamine causes allergy; it does not protect newborns."]}, {"level": "Medium", "type": "mcq", "prompt": "A patient sneezes with watery eyes near mites and pollen; the doctor suspects allergy. The textbook chain is", "options": ["Allergen → IgE → mast-cell histamine/serotonin → anti-histamine relief", "Allergen → IgA → macrophage interferons", "Allergen → H2L2 destruction → autoimmunity"], "answer": 0, "hint": "Which antibody class and chemicals?", "solution": "Allergy antibodies are IgE; mast cells release histamine and serotonin; anti-histamine/adrenalin/steroids relieve symptoms.", "wrong": ["IgA is colostrum's antibody; interferons are cytokine barriers.", "H2L2 is the general antibody plan, not an allergy destroyer."]}, {"level": "Hard", "type": "number", "map": "Section 7.2.7", "prompt": "Share of human lymphoid tissue that is MALT", "answer": 50, "unit": "%", "tolerance": 2, "hint": "About half.", "solution": "MALT constitutes about 50 per cent of the lymphoid tissue in the human body."}], "resources": [{"title": "NCERT §7.2.3–7.2.7 — Vaccines, allergy & organs (official PDF, PDF p.10)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo107.pdf#page=10"}]}, {"id": "aids", "nav": "AIDS", "title": "AIDS: retroviral HIV, helper-T destruction, ELISA and NACO prevention", "deck": "RNA + reverse transcriptase → DNA in macrophages and helper T-lymphocytes; four transmission routes only (never touch); ELISA diagnosis; no cure — NACO, safe blood, condoms, disposable needles.", "minutes": 9, "section": "7.3", "pages": [12, 14], "print": "138–140", "sim": "aids", "simTitle": "HIV replication stepper + transmission myth-buster", "quick": ["<strong>AIDS</strong> = <strong>Acquired Immuno Deficiency Syndrome</strong>: immune deficiency acquired during life (<strong>not congenital</strong>); <strong>syndrome</strong> = group of symptoms. First reported <strong>1981</strong>; in ~25 years it spread worldwide killing <strong>more than 25 million</strong>. Cause: <strong>Human Immuno-deficiency Virus (HIV)</strong>, a <strong>retrovirus</strong> with an <strong>envelope enclosing the RNA genome</strong> (Figure 7.6).", "Transmission is <strong>only through body fluids</strong>: <strong>(a)</strong> sexual contact with an infected person, <strong>(b)</strong> transfusion of contaminated blood/blood products, <strong>(c)</strong> sharing infected needles (intravenous drug abusers), <strong>(d)</strong> infected mother to child <strong>through the placenta</strong>. High-risk: multiple sexual partners, IV drug users, repeated-transfusion patients, children of HIV-infected mothers. <strong>HIV/AIDS is NOT spread by mere touch or physical contact</strong> — infected persons must not be isolated from family and society. Lag from infection to AIDS: months to many years (<strong>usually 5–10 years</strong>).", "Mechanism (Figure 7.6): virus enters <strong>macrophages</strong>; viral RNA → <strong>viral DNA via reverse transcriptase</strong>; DNA integrates into host DNA and directs <strong>virus production (macrophage as HIV factory)</strong>. HIV simultaneously enters <strong>helper T-lymphocytes (T<sub>H</sub>)</strong>, replicates, and progeny attack other helper T cells — a <strong>progressive fall in helper-T numbers</strong> with fever, diarrhoea, weight loss. The patient becomes immuno-deficient against otherwise beatable infections (<em>Mycobacterium</em>, viruses, fungi, <em>Toxoplasma</em>). Diagnosis: <strong>ELISA (enzyme-linked immuno-sorbent assay)</strong>. Anti-retroviral drugs are <strong>only partially effective — they prolong life but cannot prevent death</strong>.", "No cure, so <strong>prevention is best</strong>: HIV spreads mostly through <strong>conscious behaviour patterns</strong> ('don't die of ignorance'). <strong>NACO (National AIDS Control Organisation)</strong> and NGOs educate; WHO runs spread-prevention programmes: <strong>safe blood-bank blood, disposable needles/syringes only, free condoms, drug-abuse control, safe sex, regular check-ups</strong> in susceptible groups. Infection must <strong>not be hidden</strong>; patients need <strong>help and sympathy, not shunning</strong> — society and medicine must act together."], "formulas": [{"label": "Retrovirus flow", "html": "RNA → (reverse transcriptase) → DNA → host genome → progeny virions", "cond": "Figure 7.6; macrophages = HIV factory"}, {"label": "Immune-collapse clock", "html": "helper-T numbers fall progressively; AIDS lag usually 5–10 years", "cond": "Opportunistic Mycobacterium/Toxoplasma window"}, {"label": "Transmission set", "html": "sex + blood + shared needles + placenta; NEVER touch/hug/contact", "cond": "Body fluids only; ELISA diagnoses, ART only prolongs"}], "deeper": "Figure 7.6 (retrovirus replication) is the mechanism behind Exercise Q11: emphasise reverse transcriptase making DNA from RNA, integration, factory macrophages, then the helper-T depletion loop. The prevention paragraph is the source of Q10's route list and Q7's NACO expansion — note the book's moral framing: conscious behaviour, no hiding, sympathy over shunning.", "worked": "Worked (NACO facts, Q7/Q10): expand NACO as National AIDS Control Organisation; list its textbook tools — safe blood, disposable needles/syringes, free condoms, drug-abuse control, safe sex, check-ups. Worked (myth-busting): sharing a classroom bench or hugging cannot transmit HIV (body fluids only), so isolating infected students is both cruel and unscientific per the text.", "prediction": {"prompt": "A school debates isolating an HIV-positive student from classmates. What does the chapter mandate?", "options": ["No isolation: HIV spreads only through body fluids, never mere touch or physical contact", "Full isolation, since touch transmits retroviruses", "Isolation until ELISA turns negative after ART cure"], "answer": 0, "explanation": "The book states HIV/AIDS is not spread by mere touch or physical contact and patients must not be isolated; ART prolongs life but does not cure."}, "connect": [["NACO and World AIDS Day in India", "NACO's school-awareness drives, condom distribution and safe-blood rules are the textbook prevention list operating nationwide — 'don't die of ignorance' turned into policy."], ["Wow — the virus that writes itself into you", "Reverse transcriptase copies RNA into DNA and stitches it into your own genome — the macrophage then manufactures its invader. Few textbook diagrams are as chilling as Figure 7.6."]], "recall": "Draw the RNA→DNA→factory→helper-T-fall chain; list the four transmission routes plus the touch exclusion; state ELISA and the ART limit.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "HIV is best described as", "options": ["A retrovirus with envelope-enclosed RNA, diagnosed by ELISA", "A bacterium cured by antibiotics", "A fungus spread by towels"], "answer": 0, "hint": "Reverse transcriptase + Figure 7.6.", "solution": "HIV is a retrovirus (RNA genome); ELISA is the widely used diagnostic test; treatment is only partially effective.", "wrong": ["Antibiotics do not act on viruses.", "Towel-spread fungi cause ringworm, not AIDS."]}, {"level": "Medium", "type": "mcq", "prompt": "Which pair is a real HIV transmission route?", "options": ["Shared IV needles; mother-to-child through placenta", "Hugging; sharing a classroom bench", "Mosquito bite; housefly contact"], "answer": 0, "hint": "Body fluids only.", "solution": "Infected needles and placental transfer are textbook routes; touch, hugs, benches and insects are explicitly excluded.", "wrong": ["Touch/physical contact never transmits HIV.", "Mosquitoes transmit Plasmodium/Wuchereria, not HIV."]}, {"level": "Hard", "type": "number", "map": "Section 7.3", "prompt": "Usual time-lag midpoint between HIV infection and AIDS symptoms (5–10 years)", "answer": 7.5, "unit": "years", "tolerance": 0.6, "hint": "(5 + 10)/2.", "solution": "The lag varies from months to many years, usually 5–10 years (midpoint 7.5)."}], "resources": [{"title": "NCERT §7.3 — AIDS (official PDF, PDF p.12)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo107.pdf#page=12"}]}, {"id": "cancer", "nav": "Cancer", "title": "Cancer: contact inhibition lost, benign vs malignant, metastasis and therapy", "deck": "Tumours from unregulated division; benign stays put, malignant invades, starves and metastasises. X-rays, UV, tobacco, oncogenes; biopsy/CT/MRI/antibodies; surgery, radio-, chemo- and α-interferon.", "minutes": 9, "section": "7.4", "pages": [14, 16], "print": "140–142", "sim": "cancer", "simTitle": "Benign vs malignant sorter + metastasis path", "quick": ["Cancer is among the most <strong>dreaded diseases</strong> and a major global cause of death; <strong>more than a million Indians</strong> suffer from it and many die annually. Normal growth and differentiation are <strong>highly controlled</strong>; in cancer these controls break. Normal cells show <strong>contact inhibition</strong> (contact stops growth); cancer cells <strong>lose it</strong> and keep dividing into <strong>tumours</strong>.", "<strong>Benign tumours</strong> stay <strong>confined to their location</strong>, do not spread, cause little damage. <strong>Malignant tumours</strong> are proliferating <strong>neoplastic cells</strong> that grow rapidly, <strong>invade and damage surrounding tissue</strong>, <strong>starve normal cells</strong> by competing for nutrients, and shed cells that travel <strong>through blood</strong> to start <strong>new tumours</strong> wherever lodged — this is <strong>metastasis</strong>, the most feared property.", "Causes (<strong>carcinogens</strong>): physical — <strong>ionising radiations (X-rays, gamma rays)</strong> and <strong>non-ionising (UV)</strong> damaging DNA; chemical — <strong>tobacco-smoke chemicals</strong>, a major cause of <strong>lung cancer</strong>; biological — <strong>oncogenic viruses</strong> with <strong>viral oncogenes</strong>, plus <strong>cellular oncogenes (c-onc)/proto-oncogenes</strong> in normal cells that can transform cells when activated.", "Detection: <strong>biopsy + histopathology</strong> (thin stained sections under microscope), <strong>blood/bone-marrow cell counts</strong> for leukaemias, <strong>radiography (X-rays), CT</strong> (X-rays, 3-D image) and <strong>MRI</strong> (strong magnetic fields, non-ionising) for internal organs, <strong>antibodies against cancer-specific antigens</strong>, and <strong>molecular-biology susceptibility genes</strong> (avoid the carcinogen you are prone to, e.g. tobacco smoke for lung cancer). Treatment: <strong>surgery, radiotherapy</strong> (lethal irradiation sparing normal tissue), <strong>chemotherapy</strong> (some tumour-specific; side effects <strong>hair loss, anemia</strong>), mostly in <strong>combination</strong>; <strong>biological response modifiers like α-interferon</strong> activate immunity against the tumour."], "formulas": [{"label": "Benign vs malignant", "html": "benign = confined, little damage vs malignant = invade + starve + metastasise via blood", "cond": "Neoplastic cells; metastasis most feared"}, {"label": "Carcinogen set", "html": "X-rays/gamma + UV + tobacco smoke + oncogenic viruses + c-onc activation", "cond": "Physical, chemical, biological agents"}, {"label": "Detect → treat", "html": "biopsy/histopathology + CT/MRI/antibodies/genes → surgery + radiotherapy + chemotherapy + α-interferon", "cond": "Early detection curable in many cases"}], "deeper": "The contact-inhibition sentence is the conceptual key to Q12: normal cells stop on contact, cancer cells do not — everything else (tumour, invasion, starvation, metastasis) follows. Diagnosis tools split cleanly: tissue (biopsy/histopathology), counts (leukaemias), imaging (X-ray/CT/MRI with the ionising vs non-ionising distinction), molecules (antibodies, susceptibility genes). Therapy is almost always combination, with α-interferon as the immune-activating adjunct.", "worked": "Worked (Q12): normal cell — controlled growth, contact inhibition, stays in place vs cancerous cell — regulation broken, inhibition lost, uncontrolled division, tumour mass, invasion and nutrient competition. Worked (Q13): metastasis = sloughed malignant cells carried by blood, lodging at distant sites and seeding new tumours — the definition plus the blood route plus the new-tumour endpoint.", "prediction": {"prompt": "A lump stays confined for years without spreading; another sheds cells that seed lung tumours via blood. Textbook labels?", "options": ["First is benign, second is malignant showing metastasis", "Both are benign because both are tumours", "Both are malignant because both divide"], "answer": 0, "explanation": "Benign tumours remain confined; malignant cells invade, travel (blood) and start distant tumours — metastasis."}, "connect": [["Tobacco warnings and lung cancer", "The statutory 'smoking injurious to health' warningsincible on Indian packs echo the book's chemical-carcinogen line: tobacco-smoke chemicals are a major cause of lung cancer — prevention beats the oncology ward."], ["Wow — the tumour that starves you", "Malignant cells do not just grow; they out-eat neighbouring normal cells while invading them, then mail themselves through the blood to start new colonies. Metastasis is invasion plus logistics."]], "recall": "Contrast benign vs malignant on four points; list one physical, one chemical and one biological carcinogen; name three detection and three treatment modes.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Metastasis means", "options": ["Sloughed tumour cells travel (blood) and start new tumours at distant sites", "A tumour stays confined to its origin", "Normal cells regain contact inhibition"], "answer": 0, "hint": "Most feared property of malignant tumours.", "solution": "Cells sloughed from malignant tumours reach distant sites through blood and seed new tumours there.", "wrong": ["Confinement defines benign tumours.", "Lost contact inhibition is the cancer defect, not its cure."]}, {"level": "Medium", "type": "mcq", "prompt": "Which carcinogen–effect pair matches the book?", "options": ["Tobacco-smoke chemicals — major cause of lung cancer", "MRI magnetic fields — cause DNA damage like X-rays", "α-interferon — induces oncogenic transformation"], "answer": 0, "hint": "Chemical carcinogens in smoke.", "solution": "Tobacco smoke chemicals are identified as a major lung-cancer cause; MRI uses non-ionising radiation for detection; α-interferon treats by immune activation.", "wrong": ["MRI is non-ionising detection, not a carcinogen.", "α-interferon is a biological response modifier for therapy."]}, {"level": "Hard", "type": "number", "map": "Section 7.4", "prompt": "Named secondary lymphoid sites? No — count the listed cancer treatment approaches (surgery, radiotherapy, chemotherapy, immunotherapy-with-α-interferon)", "answer": 4, "unit": "approaches", "tolerance": 0.1, "hint": "Surgery + radio + chemo + immune.", "solution": "Common approaches: surgery, radiation therapy, chemotherapy and immunotherapy (α-interferon) — four, mostly combined."}], "resources": [{"title": "NCERT §7.4 — Cancer (official PDF, PDF p.14)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo107.pdf#page=14"}]}, {"id": "drugs-alcohol", "nav": "Drugs & alcohol", "title": "Drugs and alcohol abuse: adolescence, addiction, harm and prevention", "deck": "Opioids, cannabinoids, cocaine — and nicotine's adrenaline surge. Curiosity-to-peer-pressure at 12–18, addiction vs dependence, cirrhosis to HIV needles, and the five-step prevention ladder. Educational throughout.", "minutes": 10, "section": "7.5, 7.5.1–7.5.4", "pages": [16, 21], "print": "142–147", "sim": "drugs", "simTitle": "Addiction vs dependence sorter + prevention planner", "quick": ["Commonly abused drugs — <strong>opioids, cannabinoids, coca alkaloids</strong> (mostly from flowering plants, some from fungi) — are rising among youth. <strong>Opioids</strong> bind <strong>opioid receptors (CNS, GIT)</strong>: <strong>heroin/smack (diacetylmorphine)</strong>, white odourless bitter crystals from <strong>acetylation of morphine</strong> extracted from <strong>poppy latex (<em>Papaver somniferum</em>, Figure 7.8)</strong>; snorted or injected; a <strong>depressant slowing body functions</strong>. <strong>Cannabinoids</strong> act on <strong>brain cannabinoid receptors</strong>: natural ones from <strong><em>Cannabis sativa</em> inflorescences</strong> as <strong>marijuana, hashish, charas, ganja</strong>; inhaled or ingested; affect the <strong>cardiovascular system</strong>. <strong>Cocaine (coke/crack)</strong> from <strong><em>Erythroxylum coca</em></strong> (South America) blocks <strong>dopamine transport</strong>; snorted; potent <strong>CNS stimulant</strong> (euphoria, energy); overdose → <strong>hallucinations</strong>. <em>Atropa belladonna</em> and <em>Datura</em> are other hallucinogenic plants, and cannabinoids are abused by some sportspersons. Abused medicines include <strong>barbiturates, amphetamines, benzodiazepines</strong> (depression/insomnia drugs); <strong>morphine</strong> is a legitimate sedative/painkiller post-surgery. <strong>Abuse</strong> = non-medicinal purpose or impairing amount/frequency. <strong>Smoking</strong> (400+ years; smoked/chewed/snuff): <strong>nicotine</strong> releases <strong>adrenaline/nor-adrenaline</strong> → higher <strong>BP and heart rate</strong>; cancers of <strong>lung, urinary bladder, throat</strong> (oral cavity from chewing), bronchitis, emphysema, coronary disease, gastric ulcer; <strong>CO displaces haem-bound oxygen</strong>. Statutory pack warnings exist — addicts need counselling and medical help.", "<strong>Adolescence (12–18 years)</strong> — bridge between childhood and adulthood, a <strong>vulnerable phase</strong> of mental/psychological development. Drivers toward drugs/alcohol: <strong>curiosity, adventure/excitement, experimentation</strong>, perceived benefits, escape from problems, <strong>exam/academic stress</strong>, the '<strong>cool</strong>/progressive' perception, <strong>TV/movies/newspapers/internet</strong>, <strong>unstable or unsupportive families</strong>, and <strong>peer pressure</strong>.", "<strong>Addiction</strong> = psychological attachment to effects (euphoria, temporary well-being), driving use even when self-destructive; <strong>tolerance rises</strong> so receptors respond only to <strong>higher doses</strong> — a vicious circle, and <strong>even one use can forerun addiction</strong>. <strong>Dependence</strong> = the body's <strong>withdrawal syndrome</strong> (anxiety, shakiness, nausea, sweating; sometimes severe/life-threatening, needing supervision) when the dose stops; it makes patients <strong>ignore social norms</strong> to fund use, causing social-adjustment problems.", "Harms: <strong>reckless behaviour, vandalism, violence</strong>; overdose → <strong>coma/death</strong> (respiratory/heart failure, cerebral haemorrhage); drug+alcohol <strong>combinations kill</strong>. Warning signs: academic drop, absence, hygiene loss, withdrawal, isolation, depression, fatigue, aggression, broken relationships, lost hobbies, changed sleep/eating/weight. Knock-ons: <strong>stealing</strong>, family <strong>mental/financial distress</strong>, <strong>IV needles → AIDS and Hepatitis B</strong> (chronic, fatal; also sexual/blood spread), adolescent drinking → <strong>heavy adult drinking</strong>, <strong>cirrhosis</strong> (liver) + nervous-system damage, <strong>foetal harm</strong> in pregnancy, and <strong>sports doping</strong> (narcotic analgesics, anabolic steroids, diuretics, hormones) with masculinisation/organ damage and adolescent <strong>stunted growth</strong>. Prevention (better than cure; parents/teachers responsible; nurturance + consistent discipline lowers risk): <strong>(i)</strong> avoid undue peer pressure (respect the child's thresholds); <strong>(ii)</strong> education/counselling (face problems, accept disappointments as part of life; channelise into sports, reading, music, <strong>yoga</strong>, extracurriculars); <strong>(iii)</strong> seek help from parents/peers/trusted friends (vent anxiety/guilt); <strong>(iv)</strong> watch for danger signs and report (even friends must tell parents/teachers); <strong>(v)</strong> professional/medical help — psychologists, psychiatrists, <strong>de-addiction/rehabilitation</strong>; with will power, full return to normal life."], "formulas": [{"label": "Addiction vs dependence", "html": "addiction = psychological craving + rising tolerance → higher doses vs dependence = withdrawal syndrome (anxiety, shakiness, nausea, sweating) on stopping", "cond": "§7.5.2; withdrawal may need supervision"}, {"label": "Drug→receptor map", "html": "opioids → CNS/GIT receptors; cannabinoids → brain receptors; cocaine → dopamine transport; nicotine → adrenaline/nor-adrenaline", "cond": "Figures 7.7–7.11"}, {"label": "Prevention ladder", "html": "peer-pressure guard + counselling/yoga + parents/peers + danger-sign watch + de-addiction/rehab", "cond": "§7.5.4 five steps"}], "deeper": "Figures 7.7–7.11 (morphine structure, poppy, cannabinoid skeleton, Cannabis leaves, Datura branch) make this the most diagram-dense section after immunity; Exercise Q14–Q17 all draw on it. Keep the clinical line: describe sources, routes (snorting, injection, inhalation, oral), actions (depressant/stimulant/hallucinogenic) and harms without instructions that enable use. The tobacco paragraph doubles as the smoking–cancer bridge back to §7.4.", "worked": "Worked (Q16 — why quitting is hard): tolerance forces higher doses (addiction loop) and stopping triggers withdrawal (dependence) — craving plus physical syndrome, sometimes needing supervised care; hence 'even once can forerun addiction'. Worked (Q15 — resisting friends): avoid undue peer pressure, lean on parents/trusted friends, channelise into sports/music/yoga, and report danger signs — the §7.5.4 steps as personal rules.", "prediction": {"prompt": "A topper starts smoking before exams, saying it is 'cool' and relieves stress, then needs more cigarettes for the same effect. Textbook reading?", "options": ["Adolescent risk factors (stress + cool perception + curiosity) leading into addiction via rising tolerance", "Safe medicinal use with no addictive potential", "Passive immunity protecting the lungs"], "answer": 0, "explanation": "Exam stress, 'cool' perception and curiosity are listed drivers; needing higher doses is tolerance — the addiction loop (§7.5.1–7.5.2)."}, "connect": [["Statutory warnings on every pack", "Cigarette packs sold in India carry the pictorial 'smoking injurious to health' warning — the tobacco paragraph of this lesson printed on the product itself, yet use persists, which is why the book adds counselling and de-addiction."], ["Wow — the receptors that betray you", "Tolerance means your own receptors demand ever-higher doses for the same euphoria — the drug rewires the lock it picked. That single sentence is why the book warns even one use can forerun addiction."]], "recall": "Name the three abused drug groups with one source each; contrast addiction vs dependence; list four harms and the five prevention steps.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Heroin (smack) is", "options": ["Diacetylmorphine from acetylation of poppy-latex morphine; a depressant", "A cannabinoid from Cannabis inflorescences", "Coca alkaloid blocking dopamine transport"], "answer": 0, "hint": "Papaver somniferum latex.", "solution": "Heroin is diacetylmorphine (acetylated morphine from poppy latex), snorted/injected, slowing body functions.", "wrong": ["Those come from Cannabis sativa.", "That describes cocaine from Erythroxylum coca."]}, {"level": "Medium", "type": "mcq", "prompt": "Withdrawal anxiety, shakiness, nausea and sweating on stopping the dose illustrate", "options": ["Dependence", "Vaccination memory", "Allergy to IgE"], "answer": 0, "hint": "Characteristic unpleasant syndrome.", "solution": "Dependence is the tendency to show withdrawal when the regular dose stops; severe cases need medical supervision.", "wrong": ["Memory gives secondary responses, not withdrawal.", "IgE/histamine is the allergy axis."]}, {"level": "Hard", "type": "number", "map": "Section 7.5.1", "prompt": "Length of the adolescence window 12–18 years", "answer": 6, "unit": "years", "tolerance": 0.1, "hint": "18 − 12.", "solution": "Adolescence spans 12–18 years — a 6-year vulnerable bridge to adulthood."}], "resources": [{"title": "NCERT §7.5, 7.5.1–7.5.4 — Drugs & alcohol (official PDF, PDF p.16)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo107.pdf#page=16"}]}], "exercises": [{"number": 1, "conceptIdx": 1, "page": 22, "printPage": 148, "question": "What are the various public health measures, which you would suggest as safeguard against infectious diseases?", "steps": ["Personal hygiene: keep the body clean; consume clean drinking water, food, vegetables and fruits.", "Public hygiene: proper disposal of waste and excreta; periodic cleaning and disinfection of water reservoirs, pools, cesspools and tanks; standard hygiene in public catering.", "Air-borne diseases (pneumonia, common cold): additionally avoid close contact with infected persons or their belongings.", "Vector-borne diseases (malaria, filariasis): control or eliminate vectors and breeding places — no stagnant water, clean coolers, mosquito nets, Gambusia fish, insecticides in ditches/drains/swamps, wire mesh on doors/windows.", "Backstop with vaccination/immunisation programmes and antibiotics for treatment."], "answer": "Personal + public hygiene, contact avoidance for air-borne disease, vector/breeding control for malaria/filariasis, vaccination and treatment."}, {"number": 2, "conceptIdx": 1, "page": 22, "printPage": 148, "question": "In which way has the study of biology helped us to control infectious diseases?", "steps": ["Vaccines and immunisation programmes: complete eradication of smallpox; polio, diphtheria, pneumonia and tetanus controlled to a large extent.", "Biotechnology promises newer and safer vaccines (cf. recombinant hepatitis-B vaccine).", "Discovery of antibiotics and other drugs enables effective treatment of infections.", "Vector biology guides control (nets, Gambusia, insecticides, drainage) against malaria/filariasis and Aedes-borne dengue/chikungunya."], "answer": "Vaccines (smallpox eradicated; polio/diphtheria/pneumonia/tetanus controlled), antibiotics/drugs, and vector-control biology."}, {"number": 3, "conceptIdx": 0, "page": 22, "printPage": 148, "question": "How does the transmission of each of the following diseases take place? (a) Amoebiasis (b) Malaria (c) Ascariasis (d) Pneumonia", "steps": ["(a) Amoebiasis: faecal-contaminated drinking water and food; houseflies act as mechanical carriers from faeces to food.", "(b) Malaria: bite of infected female Anopheles mosquito carrying sporozoites in salivary glands (two-host cycle).", "(c) Ascariasis: eggs excreted in faeces contaminate soil, water, plants; infection via contaminated water, vegetables, fruits.", "(d) Pneumonia: inhaling droplets/aerosols of an infected person, or sharing glasses and utensils."], "answer": "(a) faecal–oral + houseflies; (b) female Anopheles bite; (c) faecal–oral eggs via soil/water/produce; (d) droplets or shared utensils."}, {"number": 4, "conceptIdx": 1, "page": 22, "printPage": 148, "question": "What measure would you take to prevent water-borne diseases?", "steps": ["Consume clean drinking water; keep food, vegetables and fruits clean.", "Proper disposal of waste and excreta so faeces never reach water or food.", "Periodic cleaning and disinfection of water reservoirs, pools, cesspools and tanks.", "These block typhoid, amoebiasis and ascariasis, whose agents spread through food and water."], "answer": "Clean water/food, waste/excreta disposal, and disinfection of reservoirs and tanks."}, {"number": 5, "conceptIdx": 3, "page": 22, "printPage": 148, "question": "Discuss with your teacher what does ‘a suitable gene’ means, in the context of DNA vaccines.", "steps": ["DNA vaccines carry a gene whose protein product acts as the antigen.", "A 'suitable gene' is one encoding an antigenic polypeptide of the pathogen that provokes protective antibodies and memory B/T cells without causing disease.", "The book's parallel is recombinant-DNA vaccines: antigenic polypeptides produced in bacteria or yeast (e.g. hepatitis-B vaccine from yeast) for large-scale immunisation."], "answer": "A gene encoding a safe antigenic polypeptide of the pathogen that induces antibodies and memory without disease."}, {"number": 6, "conceptIdx": 3, "page": 22, "printPage": 148, "question": "Name the primary and secondary lymphoid organs.", "steps": ["Primary lymphoid organs (origin/maturation of antigen-sensitive lymphocytes): bone marrow and thymus.", "Secondary lymphoid organs (lymphocyte–antigen interaction, proliferation to effector cells): spleen, lymph nodes, tonsils, Peyer's patches of small intestine and appendix."], "answer": "Primary: bone marrow, thymus. Secondary: spleen, lymph nodes, tonsils, Peyer's patches, appendix."}, {"number": 7, "conceptIdx": 3, "page": 22, "printPage": 148, "question": "The following are some well-known abbreviations, which have been used in this chapter. Expand each one to its full form: (a) MALT (b) CMI (c) AIDS (d) NACO (e) HIV", "steps": ["(a) MALT: Mucosa-Associated Lymphoid Tissue (about 50% of lymphoid tissue).", "(b) CMI: Cell-Mediated Immunity (T-lymphocyte arm; graft rejection).", "(c) AIDS: Acquired Immuno Deficiency Syndrome.", "(d) NACO: National AIDS Control Organisation.", "(e) HIV: Human Immuno-deficiency Virus (retrovirus)."], "answer": "(a) Mucosa-Associated Lymphoid Tissue; (b) Cell-Mediated Immunity; (c) Acquired Immuno Deficiency Syndrome; (d) National AIDS Control Organisation; (e) Human Immuno-deficiency Virus."}, {"number": 8, "conceptIdx": 2, "page": 22, "printPage": 148, "question": "Differentiate the following and give examples of each: (a) Innate and acquired immunity (b) Active and passive immunity", "steps": ["(a) Innate: non-specific, present at birth, four barriers (physical: skin/mucus; physiological: acid/saliva/tears; cellular: PMNL/monocytes/NK/macrophages; cytokine: interferons), no memory. Acquired: pathogen-specific with memory (primary low, secondary high), B-cell antibodies (humoral) + T-cell CMI.", "(b) Active: host exposed to antigens makes its own antibodies — slow (natural infection; deliberate immunisation, e.g. vaccines). Passive: ready-made antibodies given — fast (colostrum IgA, placental antibodies, tetanus antitoxin, snakebite serum)."], "answer": "(a) Innate non-specific birth barriers vs acquired specific memory (B/T). (b) Active self-made slow vs passive ready-made fast."}, {"number": 9, "conceptIdx": 2, "page": 22, "printPage": 148, "question": "Draw a well-labelled diagram of an antibody molecule.", "steps": ["Draw the Y-shaped cartoon (Figure 7.4): two longer heavy (H) chains forming stem and arms, two smaller light (L) chains along the outer arms — antibody plan H2L2.", "Label the variable antigen-binding tips at the ends of the arms; note variant classes IgA, IgM, IgE, IgG built on this plan.", "(Answered descriptively: the offline build carries no image upload; labels above reproduce the textbook cartoon.)"], "answer": "Y-shaped H2L2: 2 heavy + 2 light chains, antigen-binding tips; classes IgA/IgM/IgE/IgG."}, {"number": 10, "conceptIdx": 4, "page": 22, "printPage": 148, "question": "What are the various routes by which transmission of human immuno-deficiency virus takes place?", "steps": ["(a) Sexual contact with an infected person.", "(b) Transfusion of contaminated blood and blood products.", "(c) Sharing infected needles (intravenous drug abusers).", "(d) Infected mother to child through the placenta.", "Only through body fluids — never by mere touch or physical contact."], "answer": "Sex, contaminated blood, shared needles, placenta; body fluids only, never touch."}, {"number": 11, "conceptIdx": 4, "page": 22, "printPage": 148, "question": "What is the mechanism by which the AIDS virus causes deficiency of immune system of the infected person?", "steps": ["HIV enters macrophages; viral RNA replicates to viral DNA via reverse transcriptase; the DNA integrates into host DNA and directs virus production (macrophages as HIV factory).", "HIV simultaneously enters helper T-lymphocytes, replicates, and progeny viruses attack other helper T-lymphocytes.", "Repeated cycles progressively decrease helper-T numbers; with fever, diarrhoea and weight loss the patient cannot resist opportunistic infections (Mycobacterium, viruses, fungi, Toxoplasma) — immuno-deficiency."], "answer": "Reverse-transcriptase integration + HIV factory, then progressive helper-T destruction → opportunistic infections."}, {"number": 12, "conceptIdx": 5, "page": 22, "printPage": 148, "question": "How is a cancerous cell different from a normal cell?", "steps": ["Normal cells: highly controlled growth and differentiation; contact inhibition stops growth on contact.", "Cancerous cells: regulatory breakdown; contact inhibition lost; uncontrolled division into tumours.", "Malignant cells additionally invade and damage surrounding tissue, starve normal cells for nutrients, and metastasise via blood to seed distant tumours."], "answer": "Controlled + contact-inhibited vs unregulated, inhibition lost, dividing, invading and metastasising."}, {"number": 13, "conceptIdx": 5, "page": 22, "printPage": 148, "question": "Explain what is meant by metastasis.", "steps": ["Cells sloughed from malignant (neoplastic) tumours reach distant sites through blood.", "Wherever lodged, they start a new tumour there.", "This spread-to-new-tumour property is metastasis — the most feared property of malignant tumours."], "answer": "Blood-borne spread of tumour cells seeding new tumours at distant sites."}, {"number": 14, "conceptIdx": 6, "page": 22, "printPage": 148, "question": "List the harmful effects caused by alcohol/drug abuse.", "steps": ["Immediate: reckless behaviour, vandalism, violence; overdose coma/death (respiratory/heart failure, cerebral haemorrhage); combinations with alcohol kill.", "Behavioural: academic drop, absence, hygiene loss, withdrawal, isolation, depression, fatigue, aggression, broken relationships, lost hobbies, changed sleep/eating/weight.", "Social/medical: stealing, family distress, IV AIDS/Hepatitis B, adult heavy drinking, cirrhosis and nervous damage, foetal harm, sports-doping damage."], "answer": "Reckless/violent behaviour, overdose death, warning-sign behaviours, crime/family distress, infections, cirrhosis, foetal and doping harms."}, {"number": 15, "conceptIdx": 6, "page": 22, "printPage": 148, "question": "Do you think that friends can influence one to take alcohol/drugs? If yes, how may one protect himself/herself from such an influence?", "steps": ["Yes: peer pressure is a listed driver alongside the 'cool'/progressive perception and media.", "Protect by: avoiding undue peer pressure and respecting one's own thresholds; education/counselling and healthy channelising (sports, reading, music, yoga); seeking help from parents/peers/trusted friends; watching for danger signs and reporting use to parents/teachers."], "answer": "Yes — peer pressure drives initiation; resist via §7.5.4 steps: own thresholds, counselling/healthy pursuits, parent/peer help, reporting."}, {"number": 16, "conceptIdx": 6, "page": 22, "printPage": 148, "question": "Why is that once a person starts taking alcohol or drugs, it is difficult to get rid of this habit? Discuss it with your teacher.", "steps": ["Addiction: psychological attachment to euphoria/well-being drives repeated use; tolerance rises so only higher doses work — a vicious circle, and even one use can forerun addiction.", "Dependence: stopping brings withdrawal (anxiety, shakiness, nausea, sweating), sometimes severe/life-threatening and needing supervision; relief on resuming locks the habit.", "Together craving + withdrawal make unaided quitting very difficult — professional/medical (de-addiction/rehabilitation) help is needed."], "answer": "Addiction (tolerance loop) plus dependence (withdrawal syndrome) lock the user in; supervised help is needed."}, {"number": 17, "conceptIdx": 6, "page": 22, "printPage": 148, "question": "In your view what motivates youngsters to take to alcohol or drugs and how can this be avoided?", "steps": ["Motives (§7.5.1): curiosity, adventure/excitement, experimentation, perceived benefits, escape from problems, exam/academic stress, 'cool'/progressive image, TV/movies/newspapers/internet, unstable or unsupportive families, peer pressure.", "Avoidance (§7.5.4): avoid undue peer pressure; education/counselling (face problems, accept disappointments; sports/reading/music/yoga); help from parents/peers/friends; danger-sign watch and reporting; professional/medical and de-addiction/rehabilitation help."], "answer": "Curiosity, stress, cool-image, media, family, peers motivate; the five-step §7.5.4 ladder avoids and reverses use."}], "pageOffset": null, "printPageStart": 127, "printPageEnd": 148, "paginationProvenance": "folio-verified: printed folio appears as the first extracted text line on nearly every page; confirmed printed = 1-based PDF page + 126 across 3 independent anchor points with zero deviation"};
</script>
<script>

(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    stepSize: 0.5,
    formatTime: null,
    simState: {}
  };

  // Two-digit chapter number, e.g. "iesc104" -> "04".
  function chapterNum(){
    if(C.chapterNumber) return String(C.chapterNumber);
    var digits = C.code ? C.code.replace(/\D/g, "") : "";
    return digits ? ("0" + (parseInt(digits, 10) % 100)).slice(-2) : "01";
  }

  function totalQuizzes(){
    var lessons = C.lessons || C.concepts || [];
    var n = 0;
    lessons.forEach(function(l){ n += (l.quizzes || l.practice_quizzes || []).length; });
    return n || lessons.length * 3;
  }

  // Update the address bar without triggering a second render.
  function setHash(hash){
    if(window.location.hash === hash) return;
    try {
      // First render (no hash yet) replaces the entry so Back leaves the page normally.
      if(!window.location.hash) history.replaceState(null, "", hash);
      else history.pushState(null, "", hash);
    } catch(e){ window.location.hash = hash; }
  }

  function markMobileNav(key){
    document.querySelectorAll(".mobile-concept-nav button").forEach(function(b){
      var on = b.getAttribute("data-nav") === key;
      b.classList.toggle("active", on);
      if(on && b.scrollIntoView && b.parentElement && b.parentElement.scrollWidth > b.parentElement.clientWidth){
        b.parentElement.scrollLeft = b.offsetLeft - 16;
      }
    });
  }

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var total = totalQuizzes();
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp){
      var label = state.formatTime ? state.formatTime(state.t) : "t = <b>" + state.t.toFixed(1) + " s</b>";
      var rate = "";
      if(state.speed && Math.abs(state.speed - 1) > 1e-9){
        rate = state.speed < 1 ? "slow motion ×" + state.speed : "plays " + state.speed + "× faster";
      }
      disp.innerHTML = label + (rate ? ' <span class="time-rate">' + rate + '</span>' : '');
    }
  }

  // Lets a simulation set its own timeline: {maxT, step, speed, format}.
  function configureTimeline(opts){
    opts = opts || {};
    pause();
    state.maxT = opts.maxT || state.maxT;
    state.stepSize = opts.step || 0.5;
    state.speed = opts.speed || 1;
    state.formatTime = opts.format || null;
    if(state.t > state.maxT) state.t = state.maxT;
    var scrubber = document.getElementById("time-scrubber");
    if(scrubber){ scrubber.max = state.maxT; scrubber.step = "any"; }
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep){
      var unit = state.formatTime ? "" : " s";
      btnStep.innerHTML = "⏭ Step";
      btnStep.setAttribute("aria-label", "Step forward by " + state.stepSize + unit);
      btnStep.title = "Step forward by " + state.stepSize + unit;
    }
    syncTimelineUI();
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

      '</div>' +

      '</section>';

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();

    html += '<section class="lab-card" data-block="play" aria-label="Play">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +
      '<div id="sim-mount-point" class="sim-mount-container" style="width:100%;min-height:220px;margin-top:12px;">' +
        '<div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 720 300" role="img" aria-label="' + simTitle + '"></svg></div>' +
        '<div class="lab-legend" id="lab-legend"></div>' +
        '<div class="lab-toolbar" id="legacy-lab-toolbar">' +
          '<button class="toolbar-btn primary" id="btn-play-pause" aria-label="Play animation">▶ Play</button>' +
          '<button class="toolbar-btn" id="btn-step-fwd" aria-label="Step forward">⏭ Step</button>' +
          '<button class="toolbar-btn" id="btn-reset-time" aria-label="Reset timeline">↺ Reset</button>' +
          '<span class="time-display" id="time-display">t = <b>0.0 s</b></span>' +
          '<div class="scrubber-wrap">' +
            '<input type="range" id="time-scrubber" class="timeline-scrubber" min="0" max="6" step="0.1" value="0" aria-label="Timeline time scrubber">' +
