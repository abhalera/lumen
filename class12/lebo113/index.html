<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 13: Biodiversity and Conservation — Interactive Textbook</title>
<style>
:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  text-align: left;
  background: #0f172a;
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
}
.play-btn {
  flex: none;
  width: 34px;
  height: 34px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 14px;
}
.video-title {
  font-size: 13px;
  line-height: 1.4;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.q-badge {
  background: var(--soft);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 3px 10px;
  border-radius: 6px;
}
.q-concept-link {
  color: var(--blue);
  text-decoration: none;
  font-size: 13px;

<script>
window.CHAPTER = {"code": "lebo113", "chapterNumber": 13, "book_name": "Biology", "title": "Biodiversity and Conservation", "subtitle": "Levels and counts of biodiversity, latitudinal and species–area patterns, the Evil Quartet of loss, and why and how to conserve — hotspots, reserves, groves and summits.", "edition": "Reprint 2026-27", "source": "https://ncert.nic.in/textbook/pdf/lebo113.pdf", "page_start": 1, "page_end": 13, "extraction": "PyMuPDF text layer (/tmp/opencode/bio_text/lebo113.txt) + section/exercise page maps in /tmp/opencode/bio_maps.json (key lebo113). pdftotext not used. No PNG zooms (prose-quantitative chapter: species counts, Z slopes, Red List tallies, hotspot counts).", "lessons": [{"id": "levels-counts", "nav": "Levels & species counts", "title": "Three levels of biodiversity — and how many species exist", "deck": "Genetic, species and ecological diversity: Rauwolfia reserpine across Himalayan ranges, 50,000 rice strains, Western Ghats amphibians, and India's 2.4% land holding 8.1% of species. IUCN 2004 lists 1.5 million described; Robert May estimates about 7 million.", "minutes": 9, "section": "13.1, 13.1.1", "pages": [1, 4], "print": "1–4", "sim": "diversity", "simTitle": "Diversity explorer: genetic · species · ecological + species counters", "quick": ["<strong>Biodiversity</strong> is the term popularised by the sociobiologist <strong>Edward Wilson</strong> to describe the combined diversity at all levels of biological organisation, from macromolecules within cells to biomes. The most important levels are three: <strong>(i) genetic diversity</strong>, <strong>(ii) species diversity</strong> and <strong>(iii) ecological diversity</strong>.", "<strong>Genetic diversity:</strong> a single species shows high diversity over its distributional range — the medicinal plant <strong>Rauwolfia vomitoria</strong> growing in different Himalayan ranges varies in the potency and concentration of the active chemical <strong>reserpine</strong>. India has more than <strong>50,000 genetically different strains of rice and 1,000 varieties of mango</strong>. <strong>Species diversity:</strong> the Western Ghats have a greater amphibian species diversity than the Eastern Ghats. <strong>Ecological diversity:</strong> India, with deserts, rain forests, mangroves, coral reefs, wetlands, estuaries and alpine meadows, has greater ecosystem diversity than a Scandinavian country like Norway.", "How many species exist? The <strong>IUCN (2004)</strong> records slightly more than <strong>1.5 million</strong> described plant and animal species, but estimates of the undiscovered range from <strong>20–50 million</strong> at the extreme to a conservative, scientifically sound <strong>about 7 million by Robert May</strong>. More than <strong>70 per cent</strong> of recorded species are animals while plants (including algae, fungi, bryophytes, gymnosperms and angiosperms) are no more than <strong>22 per cent</strong>; among animals, <strong>insects exceed 70 per cent — out of every 10 animals, 7 are insects</strong>. Fungi species outnumber the combined species of fishes, amphibians, reptiles and mammals, and prokaryote numbers are unknown because conventional taxonomic methods fail and many species are not culturable.", "Although India has only <strong>2.4 per cent of the world's land area</strong>, its share of global species diversity is <strong>8.1 per cent</strong>, making it one of the <strong>12 mega diversity countries</strong>: nearly <strong>45,000 plant species and twice as many animal species</strong> are recorded. Accepting May's estimate, only <strong>22 per cent</strong> of species are recorded, so probably more than <strong>1,00,000 plant and 3,00,000 animal species</strong> await discovery — yet a large fraction faces extinction before discovery: <strong>nature's biological library is burning even before we catalogued the titles</strong>."], "formulas": [{"label": "Insect dominance", "html": "> 70% of animals are insects ⇒ 7 of every 10 animals is an insect", "cond": "§13.1.1; Figure 13.1"}, {"label": "India's share", "html": "2.4% of land area → 8.1% of global species diversity (12 mega-diversity countries)", "cond": "§13.1.1"}, {"label": "Recorded fraction", "html": "≈ 1.5 million described / ≈ 7 million (May) ≈ 22% recorded", "cond": "IUCN 2004; May estimate"}], "deeper": "May's estimate is an extrapolation: species inventories are more complete in temperate than tropical countries, so biologists compare temperate–tropical richness of an exhaustively studied insect group and extend that ratio to other animals and plants. The opener's scale-setting numbers — 20,000 ants, 3,00,000 beetles, 28,000 fishes, nearly 20,000 orchids — show why the tropics, where most undiscovered species wait, dominate the missing fraction. Prokaryotes are excluded from the tallies: accepting biochemical or molecular species criteria, their diversity alone might run into millions.", "worked": "Exercise 9 chain: plants are 22% and animals about 72% of recorded species (≈ 70%+ animals in text). With 1.5 million described, animals ≈ 0.72 × 1.5M ≈ 1.08M and plants ≈ 0.22 × 1.5M ≈ 0.33M. India's undiscovered share: recorded plants 45,000 are ~22% of the true total, so total ≈ 45,000/0.22 ≈ 2,05,000 and undiscovered ≈ 1,60,000 — hence the text's 'more than 1,00,000 plant species' yet to be discovered (likewise animals: 90,000/0.22 ≈ 4,09,000 total, >3,00,000 undiscovered).", "prediction": {"prompt": "If Robert May's global estimate (~7 million) is right and only ~1.5 million species are described, what fraction of Earth's species is recorded, and what does it imply for India (45,000 plants recorded)?", "options": ["About 22% recorded — so India likely holds >1,00,000 plant species still undiscovered", "Nearly 100% recorded — India's inventory is essentially complete", "About 50% recorded — India holds only a few thousand more plants"], "answer": 0, "explanation": "1.5/7 ≈ 0.21 (≈22% in text). Applying that proportion to India's 45,000 recorded plants gives ~2,05,000 total, i.e. over 1,00,000 still to be discovered (§13.1.1)."}, "connect": [["Rauwolfia: Himalayan chemistry varies by range", "The antihypertensive reserpine from Rauwolfia vomitoria differs in potency between Himalayan ranges — genetic diversity you can dose. Indian drug prospectors must sample many populations, not one, because the same species is chemically different valley to valley.", [], {"id": "XLRxoLcyhuw", "title": "Biodiversity And Conservation Class 12 One Shot | NCERT + PYQs | Biology Chapter 13", "channel": "NCERT Wallah"}], ["Wow — 50,000 rices, 1,000 mangoes", "India's 50,000 rice strains and 1,000 mango varieties (Alphonso to Zardalu) are genetic diversity on the dinner plate — the raw material every future flood-tolerant paddy or disease-resistant orchard will be bred from."]], "recall": "Name the three levels of biodiversity with one Indian example each, and state the 1.5M/7M/22% figures with India's 2.4%/8.1% share.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The three important components of biodiversity are", "options": ["Genetic, species and ecological (ecosystem) diversity", "Plant, animal and microbial diversity", "Forest, desert and marine diversity"], "answer": 0, "hint": "Section 13.1 lists three levels (i), (ii), (iii).", "solution": "Genetic (Rauwolfia, rice strains), species (amphibians), ecological (biomes).", "wrong": ["That groups by kingdom, not level of organisation.", "Those are habitat examples of ecological diversity only."]}, {"level": "Medium", "type": "number", "map": "Section 13.1.1", "prompt": "If 1.5 million species are described of an estimated 7 million, the recorded percentage is", "answer": 21.4, "unit": "%", "tolerance": 1.0, "hint": "1.5/7 × 100.", "solution": "1.5/7 × 100 ≈ 21.4% — the text rounds to 22% recorded."}, {"level": "Hard", "type": "number", "map": "Section 13.1.1", "prompt": "Out of every 10 recorded animals, how many are insects (text's 70% rule)?", "answer": 7, "unit": "", "tolerance": 0.1, "hint": "More than 70% of animals are insects.", "solution": "7 of every 10 animals on the planet are insects."}], "resources": [{"title": "NCERT §13.1, 13.1.1 — Levels & species counts (official PDF, PDF p.1)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo113.pdf#page=1"}]}, {"id": "patterns-diversity", "nav": "Patterns: latitude & area", "title": "Latitudinal gradients and the species–area equation", "deck": "Diversity falls from equator to poles — Colombia 1,400 birds vs Greenland 56 — and rises with area as log S = log C + Z log A, with Z = 0.1–0.2 locally and 0.6–1.2 across continents (1.15 for frugivores).", "minutes": 9, "section": "13.1.2", "pages": [4, 5], "print": "4–5", "sim": "speciesarea", "simTitle": "Species–area lab: log S curve with Z slider 0.1–1.2", "quick": ["<strong>Latitudinal gradients:</strong> species diversity decreases as we move away from the equator towards the poles; with very few exceptions, the <strong>tropics (23.5° N to 23.5° S)</strong> harbour more species than temperate or polar areas. <strong>Colombia</strong> near the equator has nearly <strong>1,400 bird species</strong> while <strong>New York (41° N) has 105 and Greenland (71° N) only 56</strong>; India, largely tropical, has more than <strong>1,200 bird species</strong>. A tropical forest (Ecuador) holds up to <strong>10 times</strong> the vascular-plant species of an equal temperate area (Midwest USA).", "The largely tropical <strong>Amazonian rain forest</strong> has Earth's greatest biodiversity: more than <strong>40,000 plants, 3,000 fishes, 1,300 birds, 427 mammals, 427 amphibians, 378 reptiles and over 1,25,000 invertebrates</strong>, with at least <strong>two million insect species</strong> estimated still to be discovered and named there. Three hypotheses explain tropical richness: <strong>(a)</strong> speciation is a function of time — tropics, unlike glaciated temperate zones, were undisturbed for millions of years; <strong>(b)</strong> tropical environments are less seasonal, more constant and predictable, promoting niche specialisation; <strong>(c)</strong> more solar energy gives higher productivity, indirectly favouring diversity.", "<strong>Species–area relationships:</strong> Alexander von Humboldt observed in South American jungles that species richness increases with explored area, but only up to a limit — a <strong>rectangular hyperbola</strong> for angiosperms, birds, bats and freshwater fishes, becoming a <strong>straight line on a logarithmic scale</strong>: <strong>log S = log C + Z log A</strong>, where S = species richness, A = area, Z = slope (regression coefficient), C = Y-intercept. Ecologists find <strong>Z in 0.1–0.2</strong> regardless of group or region (plants in Britain, birds in California, molluscs in New York), but across very large areas like entire continents the slope steepens to <strong>Z = 0.6–1.2</strong> — e.g. <strong>1.15 for frugivorous birds and mammals</strong> of tropical forests on different continents."], "formulas": [{"label": "Species–area (log form)", "html": "log S = log C + Z log A", "cond": "§13.1.2; straight line on log scale"}, {"label": "Local Z", "html": "Z = 0.1–0.2 (Britain plants, California birds, New York molluscs)", "cond": "Within-region slopes"}, {"label": "Continental Z", "html": "Z = 0.6–1.2; frugivorous birds/mammals = 1.15", "cond": "Across continents; Exercise 4"}], "deeper": "Figure 13.2 carries the warning that the straight line lives only on the log scale; on the arithmetic scale the curve flattens toward a limit — Humboldt's 'only up to a limit'. Steeper continental slopes mean richness accumulates far faster with area when whole biogeographic realms (with distinct evolutionary histories and endemic radiations) are pooled than when sampling nested plots within one region.", "worked": "Exercise 4 significance of the slope: Z measures how fast new species accumulate with area. Doubling explored area multiplies richness by 2^Z. With continental Z = 1.15, doubling gives 2^1.15 ≈ 2.22 (richness more than doubles — new realms add endemics); with local Z = 0.15, doubling gives 2^0.15 ≈ 1.11 (only ~11% more species — same pool, sampled harder). Hence Z ≈ 0.1–0.2 within regions but 0.6–1.2 across continents.", "prediction": {"prompt": "Two surveys double their explored area. Survey A (within one state, Z ≈ 0.15) and Survey B (across continents, Z ≈ 1.15). Which gains more new species, and why?", "options": ["B — richness scales as area^Z, and 2^1.15 ≈ 2.22 dwarfs 2^0.15 ≈ 1.11", "A — small areas always gain more species than continents", "Both gain equally — Z is constant everywhere"], "answer": 0, "explanation": "S ∝ A^Z, so the multiplier on doubling is 2^Z. Continental sampling crosses endemic faunas (steep Z); local sampling resamples one pool (shallow Z)."}, "connect": [["India's 1,200+ birds are latitude at work", "Much of India lies in the tropics, so its >1,200 bird species sit on the Colombia end of the gradient, not the Greenland end — school bird lists in the Western Ghats vs Ladakh replay the chapter's transect."], ["Wow — the Amazon's two million unknown insects", "Scientists estimate at least two million Amazonian insects await naming — more than all species described in India. One rain forest's backlog exceeds a mega-diversity country's catalogue."]], "recall": "State the latitudinal gradient with the Colombia/New York/Greenland bird numbers, the three tropic hypotheses, and log S = log C + Z log A with both Z ranges.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The latitudinal gradient in diversity states that", "options": ["Species diversity decreases from equator towards the poles", "Species diversity increases from equator towards the poles", "Latitude has no relation to species diversity"], "answer": 0, "hint": "Colombia 1,400 vs Greenland 56.", "solution": "Tropics (23.5° N–23.5° S) harbour more species than temperate or polar areas.", "wrong": ["That reverses Colombia vs Greenland.", "The bird counts across latitudes refute this."]}, {"level": "Medium", "type": "number", "map": "Section 13.1.2", "prompt": "Richness multiplier on doubling area with continental Z = 1.15 (2^1.15)", "answer": 2.22, "unit": "", "tolerance": 0.05, "hint": "S2/S1 = (A2/A1)^Z = 2^1.15.", "solution": "2^1.15 ≈ 2.22 — richness more than doubles."}, {"level": "Hard", "type": "number", "map": "Exercise 4", "prompt": "Richness multiplier on doubling area with local Z = 0.15 (2^0.15)", "answer": 1.11, "unit": "", "tolerance": 0.03, "hint": "Same formula, shallow slope.", "solution": "2^0.15 ≈ 1.11 — only ~11% more species locally."}], "resources": [{"title": "NCERT §13.1.2 — Patterns: latitude & area (official PDF, PDF p.4)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo113.pdf#page=4"}]}, {"id": "loss-evil-quartet", "nav": "Loss & Evil Quartet", "title": "Why diversity matters — and the Evil Quartet destroying it", "deck": "Tilman's plots and Ehrlich's rivet-popper show diverse communities are stable and productive. Yet the IUCN Red List (2004) records 784 extinctions, current rates run 100–1,000× faster, and four human causes — the Evil Quartet — drive the Sixth Extinction.", "minutes": 9, "section": "13.1.3, 13.1.4", "pages": [5, 8], "print": "5–8", "sim": "evilquartet", "simTitle": "Evil Quartet sorter: habitat loss · over-exploitation · alien invasion · co-extinction", "quick": ["Does species number matter to ecosystem functioning? <strong>David Tilman's long-term outdoor-plot experiments</strong> found plots with more species showed <strong>less year-to-year variation in biomass</strong> and <strong>higher productivity</strong>. A stable community varies little in productivity, resists or recovers from disturbance, and resists alien invasion — and the text's questions bite: would the Western Ghats work as well minus one tree-frog species, or Earth with 15,000 ant species instead of 20,000? Stanford ecologist <strong>Paul Ehrlich's rivet-popper hypothesis</strong> answers by analogy: species are rivets on the ecosystem-airplane; popping a few seems harmless, but cumulative loss weakens flight, and <strong>losing wing rivets (key species driving major functions) is graver than losing seat rivets</strong>.", "Losses are certain while new species (speciation) are doubtful. Colonisation of tropical Pacific islands wiped out <strong>more than 2,000 native bird species</strong>; the <strong>IUCN Red List (2004)</strong> documents <strong>784 extinctions in the last 500 years — 338 vertebrates, 359 invertebrates and 87 plants</strong>, including the <strong>dodo (Mauritius), quagga (Africa), thylacine (Australia), Steller's Sea Cow (Russia)</strong> and three tiger subspecies (<strong>Bali, Javan, Caspian</strong>), with <strong>27 species lost in the last twenty years alone</strong>. Over <strong>15,500 species</strong> face extinction: <strong>12% of birds, 23% of mammals, 32% of amphibians, 31% of gymnosperms</strong>; amphibians are the most vulnerable group. Five mass extinctions struck across >3 billion years, but the present <strong>Sixth Extinction runs 100–1,000 times faster</strong> than pre-human rates — at current trends <strong>nearly half of all species could vanish within 100 years</strong>, lowering plant production, drought resistance and stabilising pest, water-use and productivity cycles.", "The accelerated losses are human-driven — <strong>'The Evil Quartet'</strong>: <strong>(i) Habitat loss and fragmentation</strong>, the most important cause — rain forests fell from <strong>14% to 6%</strong> of land surface and <strong>1,000 more hectares vanish while you read the chapter</strong>; the <strong>Amazon ('lungs of the planet')</strong> is cleared for soya beans and beef cattle, pollution degrades the rest, and fragments doom wide-ranging mammals, birds and migrants. <strong>(ii) Over-exploitation</strong> — need turned to greed: Steller's sea cow and the passenger pigeon in 500 years, now over-harvested marine fishes. <strong>(iii) Alien species invasions</strong> — Nile perch in Lake Victoria exterminated <strong>200+ endemic cichlid fishes</strong>; carrot grass (<strong>Parthenium</strong>), <strong>Lantana</strong>, water hyacinth (<strong>Eichhornia</strong>) and illegal African catfish (<strong>Clarias gariepinus</strong>) threaten India's natives. <strong>(iv) Co-extinctions</strong> — obligate partners die together: host fish with its parasites, coevolved plant with its pollinator."], "formulas": [{"label": "Red List 2004 toll", "html": "784 extinctions = 338 vertebrates + 359 invertebrates + 87 plants (500 years)", "cond": "§13.1.4"}, {"label": "Sixth Extinction rate", "html": "current rates ≈ 100–1,000× pre-human; ~50% of species at risk in 100 years", "cond": "§13.1.4"}, {"label": "Evil Quartet", "html": "habitat loss/fragmentation + over-exploitation + alien invasion + co-extinction", "cond": "§13.1.4; Exercise 5"}], "deeper": "The Summary rounds the toll as 'nearly 700 species extinct in recent times' with more than 15,500 threatened — of which over 650 are from India — consistent with the 784 Red List entries once subspecies and recently vanished taxa are grouped. Extinctions are taxonomically non-random: the 32% threat figure for amphibians (against 12% for birds) flags permeable skins, dual aquatic–terrestrial life and narrow ranges as vulnerability multipliers.", "worked": "Rivet-popper logic as Exercise 6's answer: Tilman links diversity to function through (a) stability — diverse plots vary less year to year, (b) productivity — diverse plots fix more biomass, (c) resistance — diverse plots repel invaders. Removing a 'seat rivet' (redundant species) barely changes output; removing a 'wing rivet' (key species such as a dominant plant, top pollinator or major decomposer) crashes the function — which is why losing one Western Ghats tree-frog species could matter if it is the key pollinator, seed disperser or pest controller in its web.", "prediction": {"prompt": "A developer clears half a forest, hunts its pheasants for feasts, stocks the lake with Nile-perch-like predators, and the forest's sole pollinator-dependent orchid vanishes with its bee. How many of the Evil Quartet acted?", "options": ["All four — fragmentation, over-exploitation, alien invasion and co-extinction", "Only one — habitat loss covers everything", "Two — hunting and fishing are the same cause"], "answer": 0, "explanation": "Clearing/fragments = (i); hunting = (ii); stocked predator = (iii); orchid following its bee = (iv) co-extinction."}, "connect": [["Project Tiger's Bali–Javan–Caspian warning", "Three tiger subspecies (Bali, Javan, Caspian) already went extinct while India's surviving tigers were saved only by protecting whole forests — the textbook's 'save the entire forest to save the tiger' is Project Tiger's founding logic."], ["Wow — 1,000 hectares while you read", "The text clocks rain-forest loss at 1,000 hectares per chapter-read — roughly two Kaziranga core zones per sitting. Habitat loss is not a statistic but a stopwatch."]], "recall": "State the rivet-popper analogy (wings vs seats), the 784/338/359/87 toll with four named extinctions, the 100–1,000× rate, and all four Evil Quartet causes with one example each.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The most important cause driving animals and plants to extinction is", "options": ["Habitat loss and fragmentation", "Co-extinction", "Over-exploitation alone"], "answer": 0, "hint": "Section 13.1.4 ranks the Quartet's first cause.", "solution": "Habitat loss and fragmentation — 14% to 6% rain-forest cover — tops the list.", "wrong": ["Co-extinction follows after a primary extinction.", "Over-exploitation is second, not first."]}, {"level": "Medium", "type": "number", "map": "Section 13.1.4", "prompt": "Total Red List (2004) extinctions: 338 vertebrates + 359 invertebrates + 87 plants", "answer": 784, "unit": "", "tolerance": 0.5, "hint": "Add the three tallies.", "solution": "338 + 359 + 87 = 784 species in 500 years."}, {"level": "Hard", "type": "number", "map": "Section 13.1.4", "prompt": "Endemic cichlid species lost to Nile perch in Lake Victoria (minimum stated)", "answer": 200, "unit": "species", "tolerance": 1, "hint": "More than … species of cichlid fish.", "solution": "More than 200 ecologically unique cichlid species."}], "resources": [{"title": "NCERT §13.1.3, 13.1.4 — Loss & Evil Quartet (official PDF, PDF p.5)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo113.pdf#page=5"}]}, {"id": "why-conserve", "nav": "Why conserve", "title": "Why conserve: narrow, broad and ethical reasons", "deck": "Over 25% of drugs come from plants and 25,000 serve traditional medicine; the Amazon makes 20% of atmospheric oxygen; pollinators, flood control and a bulbul's song complete the case — plus a moral duty to future generations.", "minutes": 8, "section": "13.2.1", "pages": [8, 9], "print": "8–9", "sim": "whyconserve", "simTitle": "Why-conserve explorer: narrow · broad · ethical values", "quick": ["Reasons group into three categories — <strong>narrowly utilitarian, broadly utilitarian and ethical</strong>. The <strong>narrowly utilitarian</strong> case is direct economics: food (cereals, pulses, fruits), firewood, fibre, construction material, industrial products (<strong>tannins, lubricants, dyes, resins, perfumes</strong>) and medicines. More than <strong>25 per cent of drugs</strong> sold worldwide derive from plants, <strong>25,000 plant species</strong> feed traditional medicines of native peoples, unknown rain-forest plants await screening, and <strong>bioprospecting</strong> (exploring molecular, genetic and species-level diversity for economic products) lets biodiversity-rich nations reap enormous benefits.", "The <strong>broadly utilitarian</strong> case is ecosystem services: the fast-dwindling <strong>Amazon forest produces about 20 per cent of Earth's atmospheric oxygen</strong> via photosynthesis — price it against a hospital oxygen cylinder. <strong>Pollination</strong> by bees, bumblebees, birds and bats gives fruits and seeds — price farming without them. Forests also deliver flood control, soil-erosion control, pest control and climate moderation, plus intangible aesthetics: thick woods, spring flowers, a <strong>bulbul's song</strong> at dawn.", "The <strong>ethical</strong> case: we owe millions of plant, animal and microbe co-inhabitants recognition of <strong>intrinsic value</strong> beyond current economic use, with a <strong>moral duty</strong> to care for their well-being and pass our biological legacy in good order to future generations."], "formulas": [{"label": "Medicine share", "html": "> 25% of marketed drugs from plants; 25,000 species in traditional medicine", "cond": "§13.2.1 narrowly utilitarian"}, {"label": "Oxygen service", "html": "Amazon ≈ 20% of atmospheric O₂ via photosynthesis", "cond": "§13.2.1 broadly utilitarian"}, {"label": "Three reasons", "html": "narrowly utilitarian + broadly utilitarian + ethical", "cond": "§13.2.1; Exercise 8"}], "deeper": "Exercise 8 (floods and erosion) is the broadly-utilitarian mechanism made concrete: plant roots bind soil, canopy and litter slow runoff and/demo(so the biotic cover meters water release, traps silt and checks erosion — services that vanish with the cover. Bioprospecting closes the loop back to Lesson 1: Rauwolfia's reserpine is exactly the kind of molecular dividend the narrowly-utilitarian argument prices.", "worked": "Valuing the 20% oxygen service: if the Amazon yields a fifth of atmospheric O₂, replacing even a fraction industrially means manufacturing, compressing and distributing that gas — the textbook's hospital-cylinder test. Likewise, replacing bee/bird/bat pollination across India's fruit and seed crops would need hand-pollination armies; the service is free only while the pollinators live, which is why pollinator-hostile farming is self-taxing.", "prediction": {"prompt": "A planner says: 'Rauwolfia's reserpine earns revenue, bees pollinate our mangoes free, and the bulbul's song is priceless — but only one argument covers all three.' Which classification is right?", "options": ["Reserpine is narrowly utilitarian, mango pollination broadly utilitarian, the bulbul's song broadly utilitarian (intangible) — three values, two categories", "All three are narrowly utilitarian market goods", "All three are ethical arguments with no economic content"], "answer": 0, "explanation": "Direct products (drugs) = narrow; services and aesthetics (oxygen, pollination, song, flood control) = broad; intrinsic-value duty = ethical."}, "connect": [["Rauwolfia to vincristine: India's medicine chest", "From Himalayan Rauwolfia (reserpine) to Madagascar's periwinkle, plant molecules became hypertension and cancer drugs — the >25% statistic is India's Ayurvedic garden plus modern pharma in one number."], ["Wow — price a breath, then save a forest", "Hospitals buy oxygen by the cylinder while the Amazon exhales a fifth of the planet's supply free — the chapter's cylinder test turns every breath into a conservation invoice."]], "recall": "List the three reason-categories and, for each, two textbook examples with the 25%/25,000/20% numbers.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Bioprospecting, as defined in the chapter, is", "options": ["Exploring molecular, genetic and species-level diversity for products of economic importance", "Prospecting for minerals inside national parks", "Counting tigers with camera traps"], "answer": 0, "hint": "Narrowly utilitarian paragraph, last lines.", "solution": "Systematic exploration of biodiversity for economic products.", "wrong": ["Mining is not bioprospecting.", "That is census, not prospecting for products."]}, {"level": "Medium", "type": "number", "map": "Section 13.2.1", "prompt": "Plant-derived share if 200 drugs are sampled (text: more than 25%)", "answer": 50, "unit": "drugs", "tolerance": 1, "hint": "25% of 200.", "solution": "At least ~50 of 200 drugs derive from plants."}, {"level": "Hard", "type": "mcq", "prompt": "The bulbul's song and spring flowers illustrate", "options": ["Broadly utilitarian intangible benefits of nature", "Narrowly utilitarian timber values", "The Evil Quartet's alien-invasion cause"], "answer": 0, "hint": "'Can we put a price tag on such things?'", "solution": "Aesthetic, priceless services ecosystems provide.", "wrong": ["No timber is involved.", "That is a cause of loss, not a reason to conserve."]}], "resources": [{"title": "NCERT §13.2.1 — Why conserve (official PDF, PDF p.8)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo113.pdf#page=8"}]}, {"id": "how-conserve", "nav": "How to conserve", "title": "How to conserve: in situ, ex situ, hotspots and summits", "deck": "Save the entire forest to save the tiger: 14 biosphere reserves, 90 national parks, 448 sanctuaries and sacred groves in situ; zoos, seed banks and cryopreservation ex situ; 34 hotspots (3 in India); Rio 1992 and Johannesburg 2002 pledging restraint by 2010.", "minutes": 9, "section": "13.2.2", "pages": [9, 11], "print": "9–11", "sim": "conserve", "simTitle": "Conservation matcher: in situ vs ex situ + hotspots + summit timeline", "quick": ["Two strategies: <strong>in situ (on site)</strong> — conserve the whole ecosystem so all levels of biodiversity persist ('<strong>we save the entire forest to save the tiger</strong>'); and <strong>ex situ (off site)</strong> — when an animal or plant is <strong>endangered or threatened</strong> (very high near-future extinction risk in the wild) and needs urgent rescue outside its habitat. Because species awaiting rescue exceed resources, conservationists prioritise <strong>biodiversity hotspots</strong>: regions of very high species richness plus high <strong>endemism</strong> (species confined there and nowhere else) under accelerated habitat loss.", "Initially <strong>25 hotspots</strong> were identified, then <strong>nine more — 34 in all</strong>; together they cover <strong>less than 2% of Earth's land</strong> yet hold extreme species numbers, so strict protection could cut ongoing mass extinctions by <strong>almost 30%</strong>. <strong>Three hotspots cover India: Western Ghats and Sri Lanka, Indo-Burma and Himalaya.</strong> India's in-situ network: <strong>14 biosphere reserves, 90 national parks and 448 wildlife sanctuaries</strong> (Summary: >450 sanctuaries), plus cultural protection — <strong>sacred groves</strong> in the <strong>Khasi and Jaintia Hills (Meghalaya), Aravalli Hills (Rajasthan), Western Ghats (Karnataka, Maharashtra)</strong> and <strong>Sarguja, Chanda and Bastar (Madhya Pradesh)</strong>, with Meghalaya's groves the last refuges of many rare, threatened plants.", "<strong>Ex situ:</strong> zoological parks, botanical gardens and wildlife safari parks; some animals extinct in the wild persist only in zoos. Modern methods go further: <strong>cryopreservation of gametes</strong> (viable, fertile, long-term), <strong>in-vitro fertilisation</strong>, <strong>tissue-culture propagation</strong> of plants and <strong>seed banks</strong> holding genetic strains of commercial crops. Biodiversity ignores borders, so conservation is collective: the historic <strong>Convention on Biological Diversity ('The Earth Summit'), Rio de Janeiro, 1992</strong>, bound nations to conserve and sustainably use biodiversity; the follow-up <strong>World Summit on Sustainable Development, Johannesburg, 2002 — 190 countries</strong> — pledged a <strong>significant reduction of biodiversity loss by 2010</strong> at global, regional and local levels."], "formulas": [{"label": "Hotspot count", "html": "25 initial + 9 added = 34 hotspots; 3 cover India", "cond": "§13.2.2"}, {"label": "India's in-situ estate", "html": "14 biosphere reserves + 90 national parks + 448 sanctuaries (+ sacred groves)", "cond": "§13.2.2"}, {"label": "Summit timeline", "html": "Rio Earth Summit 1992 → Johannesburg 2002 (190 countries) → 2010 reduction pledge", "cond": "§13.2.2"}], "deeper": "In-situ vs ex-situ is triage logic: in situ protects processes (pollination webs, gene flow, succession) at landscape scale, while ex situ banks genes and individuals against imminent extinction. Hotspots concentrate effort where richness × endemism × threat is maximal — under 2% of land buying ~30% less extinction — which is why two of India's three hotspots (Western Ghats–Sri Lanka, Himalaya) coincide with its sacred-grove belts and reserve networks.", "worked": "Hotspot arithmetic: 34 hotspots on <2% of land holding a disproportionate share of endemics means protecting a fiftieth of Earth's surface can avert nearly a third of impending extinctions — the highest leverage in conservation. India's ledger: 14 + 90 + 448 protected units plus groves in Meghalaya, Rajasthan, Karnataka, Maharashtra and Madhya Pradesh, nested inside 3 of the 34 global hotspots.", "prediction": {"prompt": "A threatened orchid survives as 20 plants inside a Meghalaya sacred grove, and loggers approach. Which response matches the chapter's strategy ladder?", "options": ["Defend the grove in situ first (whole-habitat protection); bank seeds and tissue-culture lines ex situ as urgent backup", "Ignore the grove and only photograph the orchid for records", "Move all 20 plants to a city park and log the grove"], "answer": 0, "explanation": "In situ protects the ecosystem and its processes; ex situ (seed banks, tissue culture, cryopreservation) is the urgent complement for threatened taxa (§13.2.2)."}, "connect": [["Sacred groves: faith fenced forests first", "Long before wildlife laws, Khasi–Jaintia, Aravalli, Western Ghat and Sarguja–Chanda–Bastar communities venerated whole forest tracts — India's oldest in-situ reserves, drawn by religion rather than legislation."], ["Wow — save the forest, keep the tiger", "'We save the entire forest to save the tiger' is Project Tiger's wager in one line: Kaziranga-style reserves and biosphere reserves protect the tiger by protecting everything beneath it — deer, grass, pollinators and all."]], "recall": "Define in situ vs ex situ, list the 25→34→3 hotspot numbers, India's 14/90/448 estate with four grove regions, three ex-situ biotechnologies, and the Rio→Johannesburg→2010 timeline.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "'We save the entire forest to save the tiger' describes", "options": ["In situ (on-site) conservation", "Ex situ (off-site) conservation", "Co-extinction"], "answer": 0, "hint": "Protecting the whole ecosystem protects all its levels.", "solution": "In-situ conservation: ecosystem-scale, on-site protection.", "wrong": ["Ex situ removes organisms to zoos/banks.", "That is joint extinction of obligate partners."]}, {"level": "Medium", "type": "number", "map": "Section 13.2.2", "prompt": "Total biodiversity hotspots after nine were added to the initial 25", "answer": 34, "unit": "", "tolerance": 0.1, "hint": "25 + 9.", "solution": "34 hotspots worldwide; three cover India."}, {"level": "Hard", "type": "mcq", "prompt": "Which set lists only Indian sacred-grove regions named in the text?", "options": ["Khasi–Jaintia (Meghalaya), Aravalli (Rajasthan), Western Ghats (Karnataka/Maharashtra), Sarguja–Chanda–Bastar (MP)", "Sundarbans, Rann of Kutch, Thar, Ladakh", "Nilgiri, Anaimalai, Cardamom, Palni only"], "answer": 0, "hint": "Section 13.2.2 names four grove belts.", "solution": "The text's four grove regions, with Meghalaya's as last refuges.", "wrong": ["Those are biogeographic areas, not the named groves.", "Those hills are not the text's grove list."]}], "resources": [{"title": "NCERT §13.2.2 — How to conserve (official PDF, PDF p.9)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo113.pdf#page=9"}]}], "exercises": [{"number": 1, "conceptIdx": 0, "page": 11, "printPage": null, "question": "Name the three important components of biodiversity.", "steps": ["Section 13.1 lists three levels: (i) genetic diversity, (ii) species diversity, (iii) ecological diversity.", "Genetic: Rauwolfia vomitoria reserpine variation across Himalayan ranges; 50,000 rice strains, 1,000 mango varieties.", "Species: e.g. Western Ghats richer in amphibians than Eastern Ghats. Ecological: e.g. India's deserts-to-alpine-meadows vs Norway."], "answer": "Genetic diversity, species diversity and ecological (ecosystem) diversity."}, {"number": 2, "conceptIdx": 0, "page": 11, "printPage": null, "question": "How do ecologists estimate the total number of species present in the world?", "steps": ["Published records give described species (IUCN 2004: slightly more than 1.5 million), not the undiscovered total.", "Inventories are more complete in temperate than tropical countries, while most undiscovered species are tropical.", "Ecologists statistically compare temperate–tropical richness of an exhaustively studied insect group and extrapolate the ratio to other animals and plants — extreme guesses 20–50 million; Robert May's conservative estimate about 7 million."], "answer": "Temperate–tropical comparison of a well-studied insect group, extrapolated to other taxa (May: ~7 million)."}, {"number": 3, "conceptIdx": 1, "page": 12, "printPage": null, "question": "Give three hypotheses for explaining why tropics show greatest levels of species richness.", "steps": ["(a) Time: unlike temperate zones hit by frequent glaciations, tropical latitudes stayed relatively undisturbed for millions of years, giving long evolutionary time for diversification.", "(b) Constancy: tropical environments are less seasonal, more constant and predictable, promoting niche specialisation and greater diversity.", "(c) Productivity: more solar energy in the tropics raises productivity, which indirectly supports greater diversity."], "answer": "(a) Long undisturbed evolutionary time; (b) constant, predictable environments and niche specialisation; (c) higher solar energy and productivity."}, {"number": 4, "conceptIdx": 1, "page": 12, "printPage": null, "question": "What is the significance of the slope of regression in a species – area relationship?", "steps": ["On the log scale, log S = log C + Z log A is a straight line whose slope is Z, the regression coefficient.", "Z measures how fast species richness accumulates with area: S scales as A^Z, so doubling area multiplies richness by 2^Z.", "Within regions Z is 0.1–0.2 (plants in Britain, birds in California, molluscs in New York); across very large areas like continents Z steepens to 0.6–1.2 (frugivorous birds/mammals: 1.15) — steeper slopes mean new areas add many previously unencountered (endemic) species."], "answer": "Z is the rate of species accumulation with area (S ∝ A^Z); ~0.1–0.2 locally, 0.6–1.2 across continents."}, {"number": 5, "conceptIdx": 2, "page": 12, "printPage": null, "question": "What are the major causes of species losses in a geographical region?", "steps": ["The accelerated losses are human-driven: 'The Evil Quartet'. (i) Habitat loss and fragmentation — the most important cause (rain forests 14% to 6%; Amazon cleared for soya/beef; fragments doom wide-ranging and migratory species).", "(ii) Over-exploitation — need turned to greed (Steller's sea cow, passenger pigeon; over-harvested marine fishes). (iii) Alien species invasions (Nile perch vs 200+ Lake Victoria cichlids; Parthenium, Lantana, Eichhornia; Clarias gariepinus vs native catfishes).", "(iv) Co-extinctions — obligate partners die together (host fish and its parasites; coevolved plant–pollinator pairs)."], "answer": "The Evil Quartet: habitat loss/fragmentation, over-exploitation, alien invasion, co-extinction."}, {"number": 6, "conceptIdx": 2, "page": 12, "printPage": null, "question": "How is biodiversity important for ecosystem functioning?", "steps": ["Tilman's outdoor-plot experiments: more species → less year-to-year biomass variation and higher productivity; stable communities resist disturbance and alien invasion.", "Ehrlich's rivet-popper hypothesis: species are rivets on the ecosystem-airplane; cumulative loss weakens flight, and losing wing rivets (key functional species) is graver than losing seat rivets.", "Hence rich biodiversity is essential for ecosystem health and human survival — loss lowers plant production, drought resistance and process stability."], "answer": "Diversity brings stability, productivity and resistance (Tilman); rivet-popper warns key-species loss crashes function."}, {"number": 7, "conceptIdx": 4, "page": 12, "printPage": null, "question": "What are sacred groves? What is their role in conservation?", "steps": ["Sacred groves are forest tracts set aside by religious and cultural traditions, where all trees and wildlife are venerated and given total protection.", "Found in Khasi and Jaintia Hills (Meghalaya), Aravalli Hills (Rajasthan), Western Ghats (Karnataka, Maharashtra) and Sarguja, Chanda and Bastar areas (Madhya Pradesh).", "Role: in-situ refuges — in Meghalaya the last refuges for many rare and threatened plants — preserving whole communities outside the formal reserve network."], "answer": "Tradition-protected forest patches; in-situ refuges for rare/threatened taxa in four named belts."}, {"number": 8, "conceptIdx": 3, "page": 12, "printPage": null, "question": "Among the ecosystem services are control of floods and soil erosion. How is this achieved by the biotic components of the ecosystem?", "steps": ["Plant cover is the biotic engineer: canopy and litter intercept rainfall and slow runoff; roots bind soil particles into a coherent matrix.", "This meters water release (checking flood peaks), traps silt and resists topsoil wash — the broadly-utilitarian service priced in Section 13.2.1.", "Removing the cover reverses all three effects: faster runoff, eroded soil, silted rivers."], "answer": "Roots bind soil; canopy/litter slow runoff and trap silt — biotic cover meters floods and holds soil."}, {"number": 9, "conceptIdx": 0, "page": 12, "printPage": null, "question": "The species diversity of plants (22 per cent) is much less than that of animals (72 per cent). What could be the explanations to how animals achieved greater diversification?", "steps": ["Animals dominate the described biota (>70%) and insects alone exceed 70% of animals — 7 of every 10 animals is an insect — so animal diversification is largely insect diversification.", "Insects show extreme niche specialisation (constant tropical environments, coevolution with flowering plants as pollinators/herbivores, flight-aided dispersal, short generations) multiplying speciation opportunities.", "Plants, though fewer in species, underpin the system as producers; fungi exceed all vertebrates combined, and prokaryote diversity (millions by molecular criteria) is still uncounted."], "answer": "Chiefly insect radiation via niche specialisation, plant coevolution, mobility and rapid generations."}, {"number": 10, "conceptIdx": 3, "page": 12, "printPage": null, "question": "Can you think of a situation where we deliberately want to make a species extinct? How would you justify it?", "steps": ["Yes — obligate human pathogens or parasites with no redeeming ecological role, e.g. the smallpox virus (already eradicated) or Guinea-worm / polio-type targets: deliberate extinction protects human life.", "Justification is narrowly utilitarian plus ethical-towards-humans: the lives saved and suffering averted outweigh the intrinsic-value claim of a disease agent, especially where no dependent species (co-extinction risk) exists.", "The chapter's own ethic anticipates this tension: every species has intrinsic value, yet conservation triage already weighs human survival first."], "answer": "Yes — e.g. smallpox virus eradication; justified by human lives saved with no wider ecological dependence."}], "pageOffset": null, "printPageStart": null, "printPageEnd": null, "paginationProvenance": "folio-absent-in-source"};
</script>
<script>
(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp) disp.innerHTML = "t = <b>" + state.t.toFixed(1) + " s</b>";
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Concept View ---
  function renderConcept(idx){
    pause();
    state.conceptIndex = idx;
    state.t = 0;
    state.level = 0;

    var lessons = C.lessons || C.concepts || [];
    var l = lessons[idx];
    if(!l) return;

    // 01 LEARN BLOCK
    html += '<section class="learn-section" data-block="learn" aria-label="Learn Concept">' +
      '<span class="block-tag">01 · LEARN · CORE ESSENTIALS</span>';

    var quickItems = [];
    if(Array.isArray(l.quick)) {
      quickItems = l.quick;
    } else if(typeof l.quick === 'string' && l.quick) {

    } else if(l.reading_content) {

      quickItems = [l.summary || l.deck];
    }

    html += '<div class="quick-summary">' + quickItems.map(function(p){

      var formatted = p.replace(/###\s+(.*?)\n/g, '<h3 style="margin-top:16px;color:var(--ink);">$1</h3>')

    }).join("") + '</div>';

    // Semantic Equations Card
    var formulas = l.formulas || [];
    if(formulas.length){
      html += '<div class="key-equations-card">' +
        '<div class="equations-heading">Key Relations for this Concept</div>' +
        '<div class="eq-grid">' +
        formulas.map(function(eq){
          var label = eq.label || eq.name || "Relation";

            '<div class="eq-meta"><span class="eq-label">' + label + '</span>' + (cond ? '<span class="eq-cond">' + cond + '</span>' : '') + '</div>' +
            '<div class="eq-math">' + math + '</div>' +

        }).join("") +
        '</div></div>';
    }

    // Deeper dive / core takeaways
    if(l.deeper){
      html += '<details class="deep-dive"><summary>Go deeper into the conceptual foundation</summary><p>' + l.deeper + '</p></details>';
    } else if(l.takeaways && l.takeaways.length){
      html += '<details class="deep-dive"><summary>Key Conceptual Takeaways</summary><ul>' +
        l.takeaways.map(function(t){ return '<li>' + t + '</li>'; }).join("") +
        '</ul></details>';
    }

    // Worked Example
    var worked = l.worked || l.worked_example;
    if(worked){
      var workedHtml = typeof worked === 'object' && worked !== null
        ? '<strong>' + (worked.title || 'Worked Example') + '</strong><br>' + (worked.problem || '') +
          (worked.given ? '<br><br><strong>Given:</strong> ' + worked.given : '') +
          (worked.steps ? '<br><strong>Steps:</strong><br>' + worked.steps.map(function(s){ return '&bull; ' + s; }).join('<br>') : '') +
          (worked.solution ? '<br><br><strong>Solution:</strong> ' + worked.solution : '') +
          (worked.answer ? '<br><br><strong>Answer:</strong> ' + worked.answer : '')
        : String(worked);
      html += '<details class="deep-dive"><summary>Worked textbook example step by step</summary><p>' + workedHtml + '</p></details>';
    }

    html += '</section>';

    // 02 PREDICT FIRST BLOCK
    var pred = l.prediction || l.predict || l.predict_first;
    if(pred && typeof pred === 'object' && (pred.prompt || pred.scenario) && pred.options && pred.options.length){
      var promptText = pred.prompt || pred.scenario || "";
      html += '<section class="predict-card" data-block="predict" aria-label="Predict First">' +
        '<div class="predict-badge">02 · PREDICT FIRST · TEST YOUR INTUITION</div>' +
        '<div class="predict-prompt">' + promptText.replace(/\n/g, '<br>') + '</div>' +
        '<div class="predict-options" id="predict-options">' +
        pred.options.map(function(opt, oi){

        '<div class="predict-actions">' +
        '<button class="btn-primary" id="btn-check-prediction">Check Prediction</button>' +

    }

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();
    var whatWatch = (pred && pred.prompt) ? pred.prompt : (typeof l.predict === 'string' ? l.predict : "Explore the interactive simulation controls, parameters, and readouts below.");
    html += '<section class="lab-card" data-block="play" aria-label="Interactive Laboratory">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +
      '<div id="sim-mount-point" class="sim-mount-container" style="width:100%;min-height:220px;margin-top:12px;">' +
        '<div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 720 300" role="img" aria-label="' + simTitle + '"></svg></div>' +
        '<div class="lab-legend" id="lab-legend"></div>' +

          '<button class="toolbar-btn primary" id="btn-play-pause" aria-label="Play animation">▶ Play</button>' +

          '<button class="toolbar-btn" id="btn-reset-time" aria-label="Reset timeline">↺ Reset</button>' +
          '<span class="time-display" id="time-display">t = <b>0.0 s</b></span>' +

    // 04 CONNECT BLOCK
    var rawConnect = l.connect || [];

    if (typeof rawConnect === 'string' && rawConnect.trim()) {

    } else if (Array.isArray(rawConnect)) {

    } else if (rawConnect && typeof rawConnect === 'object') {

    }

    var resList = l.resources || [];
    var resHtml = resList.length ? '<div class="resource-list">' + resList.map(function(r){
      var rt = String(r.title).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      var rp = String(r.provider).replace(/&/g,'&amp;').replace(/</g,'&lt;');
      return '<div class="resource-card" data-resource="true"><span class="res-badge">RESOURCE \u00b7 OPTIONAL</span><div class="res-body"><strong>' + rt + '</strong><span class="res-provider">' + rp + '</span></div><a class="res-link" href="' + r.url + '" target="_blank" rel="noopener">Open source \u2197</a><span class="res-off">Needs internet \u00b7 lesson works offline</span></div>';
    }).join("") + '</div>' : '';
    if(connectItems.length){
      html += '<section class="connect-section" data-block="connect" aria-label="Real World Connections">' +
        '<span class="block-tag">04 · CONNECT · REAL WORLD APPLICATIONS</span>' +
        '<div class="connect-grid">' +
        connectItems.map(function(item){
          var title = typeof item === 'string' ? "Real World Application" : (Array.isArray(item) ? item[0] : (item.title || "Real World Context"));
          var desc = typeof item === 'string' ? item : (Array.isArray(item) ? item[1] : (item.text || item.desc || ""));
          var links = (typeof item === 'object' && item !== null) ? (Array.isArray(item) ? (item[2] || []) : (item.links || (item.link ? [{t: "Read Deeply", u: item.link}] : []))) : [];
          var v = (typeof item === 'object' && item !== null) ? (Array.isArray(item) ? (item[3] || null) : (item.video || null)) : null;
          var wow = /^Wow/i.test(title);

          var wowSrc = pdfRef;
          var wowPrint = (l && l.printPages) ? ' · printed pp. ' + l.printPages : ' (printed folio absent in source)';
          var cHtml = '<div class="connect-card' + (wow ? ' wow" data-wow="true" data-source="NCERT ' + C.book_name + ' Ch ' + C.chapterNumber + ' · ' + wowSrc + wowPrint + '"' : '') + '">';
          if(wow) cHtml += '<span class="wow-badge">WOW · REAL WORLD</span>';
          cHtml += '<h3>' + title + '</h3><p>' + desc + '</p>';
          if(v && v.id){
            cHtml += '<button class="video-facade" data-yt="' + v.id + '" aria-label="Play video: ' + v.title + '">' +
              '<span class="play-btn">▶</span>' +
              '<span class="video-title">' + v.title + ' · ' + v.channel + '</span>' +
              '</button>';
          }
          if(links && links.length){
            cHtml += '<p style="margin-top:10px;font-size:12px;color:var(--muted)">References: ' +
              links.map(function(a){ return '<a href="' + (a.u || a.link || "#") + '" target="_blank" rel="noopener">' + (a.t || a.label || "Read Deeply") + ' ↗</a>'; }).join(", ") +
              '</p>';
