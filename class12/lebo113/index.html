  // Update the address bar without triggering a second render.
  function setHash(hash){
    if(window.location.hash === hash) return;
    try {
      // First render (no hash yet) replaces the entry so Back leaves the page normally.
      if(!window.location.hash) history.replaceState(null, "", hash);
      else history.pushState(null, "", hash);
    } catch(e){ window.location.hash = hash; }
  }

  function markMobileNav(key){
    document.querySelectorAll(".mobile-concept-nav button").forEach(function(b){
      var on = b.getAttribute("data-nav") === key;
      b.classList.toggle("active", on);
      if(on && b.scrollIntoView && b.parentElement && b.parentElement.scrollWidth > b.parentElement.clientWidth){
        b.parentElement.scrollLeft = b.offsetLeft - 16;
      }
    });
  }

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var total = totalQuizzes();
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp){
      var label = state.formatTime ? state.formatTime(state.t) : "t = <b>" + state.t.toFixed(1) + " s</b>";
      var rate = "";
      if(state.speed && Math.abs(state.speed - 1) > 1e-9){
        rate = state.speed < 1 ? "slow motion ×" + state.speed : "plays " + state.speed + "× faster";
      }
      disp.innerHTML = label + (rate ? ' <span class="time-rate">' + rate + '</span>' : '');
    }
  }

  // Lets a simulation set its own timeline: {maxT, step, speed, format}.
  function configureTimeline(opts){
    opts = opts || {};
    pause();
    state.maxT = opts.maxT || state.maxT;
    state.stepSize = opts.step || 0.5;
    state.speed = opts.speed || 1;
    state.formatTime = opts.format || null;
    if(state.t > state.maxT) state.t = state.maxT;
    var scrubber = document.getElementById("time-scrubber");
    if(scrubber){ scrubber.max = state.maxT; scrubber.step = "any"; }
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep){
      var unit = state.formatTime ? "" : " s";
      btnStep.innerHTML = "⏭ Step";
      btnStep.setAttribute("aria-label", "Step forward by " + state.stepSize + unit);
      btnStep.title = "Step forward by " + state.stepSize + unit;
    }
    syncTimelineUI();
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Concept View ---
  function renderConcept(idx){
    pause();
    state.conceptIndex = idx;
    state.t = 0;
    state.level = 0;
    state.maxT = 6;
    state.speed = 1;
    state.stepSize = 0.5;
    state.formatTime = null;

    var lessons = C.lessons || C.concepts || [];
    var l = lessons[idx];
    if(!l) return;

    var navTitle = l.nav || l.navTitle || l.title || ("Concept " + (idx + 1));

    // Update sidebar navigation active state
    var navBtns = document.querySelectorAll("#sidebar-nav .concept-nav");
    navBtns.forEach(function(b, i){
      b.classList.toggle("active", i === idx);
    });
    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.classList.remove("active");

    // Update top crumb
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chapterNum() + " · " + navTitle.toUpperCase();
    markMobileNav("c" + idx);

    // Show concept view, hide revision
    var cView = document.getElementById("concept-view");
    var rView = document.getElementById("revision-view");
    if(cView) cView.style.display = "block";
    if(rView) rView.style.display = "none";

    var html = "";

    // Concept Header
    var minutes = l.minutes || 10;
    // Cite pages only from explicit data; never guess.
    var cites = [];
    if(l.section) cites.push("NCERT §" + l.section);
    if(l.print) cites.push("textbook pp. " + l.print);
    if(Array.isArray(l.pages) && l.pages.length === 2) cites.push("PDF pp. " + l.pages[0] + "–" + l.pages[1]);
    var pageCitations = cites.join(" · ");
    html += '<div class="concept-header">' +
      '<div class="concept-badge"><span>Concept ' + ("0" + (idx + 1)).slice(-2) + ' / ' + ("0" + lessons.length).slice(-2) + '</span>' +
      '<span class="time-pill">≈ ' + minutes + ' min' + (pageCitations ? ' · ' + pageCitations : '') + '</span>' +
      '</div>' +
      '<h2 class="concept-title">' + (l.title || navTitle) + '</h2>' +
      '<p class="concept-deck">' + (l.deck || l.summary || "") + '</p>' +
      '</div>';

    // 01 LEARN BLOCK
    html += '<section class="learn-section" data-block="learn" aria-label="Learn">' +
      '<span class="block-tag">01 · LEARN · CORE ESSENTIALS</span>';

    var quickItems = [];
    if(Array.isArray(l.quick)) {
      quickItems = l.quick;
    } else if(Array.isArray(l.summary)) {
      quickItems = l.summary;
    } else if(l.reading_content) {
      quickItems = [l.reading_content];
    } else if(l.summary || l.deck) {
      quickItems = [l.summary || l.deck];
    }

    html += '<div class="quick-summary">' + quickItems.map(function(p){
      if(p.includes('<p>') || p.includes('<div>') || p.includes('<h3>')) return p;
      var formatted = p.replace(/###\s+(.*?)\n/g, '<h3 style="margin-top:16px;color:var(--ink);">$1</h3>')
                       .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                       .replace(/\*(.*?)\*/g, '<em>$1</em>')
                       .replace(/\n\n/g, '</p><p>');
      return '<p>' + formatted + '</p>';
    }).join("") + '</div>';

    // Semantic Equations Card
    var formulas = l.formulas || [];
    if(formulas.length){
      html += '<div class="key-equations-card">' +
        '<div class="equations-heading">' + (l.formulasHeading || C.formulasHeading || "Key Relations for this Concept") + '</div>' +
        '<div class="eq-grid">' +
        formulas.map(function(eq){
          var label = eq.label || eq.name || "Relation";
          var cond = eq.cond || "";
          var math = eq.html || eq.formula || "";
          return '<div class="eq-row">' +
            '<div class="eq-meta"><span class="eq-label">' + label + '</span>' + (cond ? '<span class="eq-cond">' + cond + '</span>' : '') + '</div>' +
            '<div class="eq-math">' + math + '</div>' +
            '</div>';
        }).join("") +
        '</div></div>';
    }

    // Deeper dive / core takeaways
    if(l.deeper){
      html += '<details class="deep-dive"><summary>Go deeper into the conceptual foundation</summary><p>' + l.deeper + '</p></details>';
    } else if(l.takeaways && l.takeaways.length){
      html += '<details class="deep-dive"><summary>Key Conceptual Takeaways</summary><ul>' +
        l.takeaways.map(function(t){ return '<li>' + t + '</li>'; }).join("") +
        '</ul></details>';
    }

    // Worked Example
    var worked = l.worked || l.worked_example;
    if(worked){
      if(typeof worked === 'object' && worked !== null){
        html += '<details class="deep-dive worked"><summary>Worked example: ' + (worked.title || 'step by step') + '</summary>' +
          '<div class="worked-body">' +
          (worked.problem ? '<p class="worked-problem">' + worked.problem + '</p>' : '') +
          (worked.given ? '<p class="worked-given"><strong>Given:</strong> ' + worked.given + '</p>' : '') +
          (worked.steps ? '<ol class="solution-steps">' + worked.steps.map(function(s){ return '<li>' + s + '</li>'; }).join('') + '</ol>' : '') +
          (worked.solution ? '<p><strong>Solution:</strong> ' + worked.solution + '</p>' : '') +
          (worked.answer ? '<div class="answer-box">' + worked.answer + '</div>' : '') +
          '</div></details>';
      } else {
        html += '<details class="deep-dive"><summary>Worked textbook example step by step</summary><p>' + String(worked) + '</p></details>';
      }
    }

    html += '</section>';

    // 02 PREDICT FIRST BLOCK
    var pred = l.prediction || l.predict || l.predict_first;
    if(!pred || typeof pred !== 'object' || !pred.options || !pred.options.length){
      pred = null; // no placeholder questions: skip the block when a chapter has none
    }
    var promptText = pred ? (pred.prompt || pred.scenario || "") : "";
    if(pred) html += '<section class="predict-card" data-block="predict" aria-label="Predict">' +
      '<div class="predict-badge">02 · PREDICT FIRST · TEST YOUR INTUITION</div>' +
      '<div class="predict-prompt">' + promptText.replace(/\n/g, '<br>') + '</div>' +
      '<div class="predict-options" id="predict-options">' +
      pred.options.map(function(opt, oi){
        return '<label class="predict-option"><input type="radio" name="predict_ans" value="' + oi + '"><span>' + opt + '</span></label>';
      }).join("") +
      '</div>' +
      '<div class="predict-actions">' +
      '<button class="btn-primary" id="btn-check-prediction">Check Prediction</button>' +
      '<button class="btn-secondary" id="btn-skip-prediction">Skip to Lab</button>' +
      '</div>' +
      '<div id="predict-feedback-box" class="predict-feedback" style="display:none;"></div>' +
      '</section>';

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();
    var whatWatch = l.watch || (typeof l.predict === 'string' ? l.predict : "Explore the simulation controls and readouts below.");
    html += '<section class="lab-card" data-block="play" aria-label="Play">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +
      '<div id="sim-mount-point" class="sim-mount-container" style="width:100%;min-height:220px;margin-top:12px;">' +
        '<div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 720 300" role="img" aria-label="' + simTitle + '"></svg></div>' +
        '<div class="lab-legend" id="lab-legend"></div>' +
        '<div class="lab-toolbar" id="legacy-lab-toolbar">' +
          '<button class="toolbar-btn primary" id="btn-play-pause" aria-label="Play animation">▶ Play</button>' +
          '<button class="toolbar-btn" id="btn-step-fwd" aria-label="Step forward">⏭ Step</button>' +
          '<button class="toolbar-btn" id="btn-reset-time" aria-label="Reset timeline">↺ Reset</button>' +
          '<span class="time-display" id="time-display">t = <b>0.0 s</b></span>' +
          '<div class="scrubber-wrap">' +
            '<input type="range" id="time-scrubber" class="timeline-scrubber" min="0" max="6" step="0.1" value="0" aria-label="Timeline time scrubber">' +
          '</div>' +
        '</div>' +
        '<div class="preset-bar" id="preset-bar"></div>' +
        '<div class="lab-controls-grid" id="lab-controls"></div>' +
        '<div class="lab-readout" id="lab-readout"></div>' +
        '<div class="lab-verdict" id="lab-verdict" role="status" aria-live="polite"></div>' +
      '</div>' +
      '</section>';

    // 04 CONNECT BLOCK
    var connectItems = l.connect || [];
    if(connectItems.length) html += '<section class="connect-section" data-block="connect" aria-label="Connect">' +
      '<span class="block-tag">04 · CONNECT · REAL WORLD APPLICATIONS</span>' +
      '<div class="connect-grid">' +
      connectItems.map(function(item, ci){
        var title = Array.isArray(item) ? item[0] : (item.title || "Real World Context");
        var desc = Array.isArray(item) ? item[1] : (item.text || item.desc || "");
        var links = Array.isArray(item) ? (item[2] || []) : (item.links || (item.link ? [{t: "Read Deeply", u: item.link}] : []));
        var v = Array.isArray(item) ? (item[3] || null) : (item.video || null);
        var wow = item.wow === true || /^Wow/i.test(title);

        var cHtml = '<div class="connect-card' + (wow ? ' wow' : '') + '"' + (wow ? ' data-wow="true"' : '') + '>';
        if(wow) cHtml += '<span class="wow-badge">WOW · REAL WORLD</span>';
        cHtml += '<h3>' + title + '</h3><p>' + desc + '</p>';
        // Only real, verified videos: no placeholder IDs.
        var vids = (!Array.isArray(item) && Array.isArray(item.videos)) ? item.videos : (v ? [v] : []);
        vids.forEach(function(v){
          if(!v || !v.id) return;
          var fullMeta = (v.title || "Video") + (v.channel ? " · " + v.channel : "");
          cHtml += '<button class="video-facade" data-yt="' + v.id + '" data-video="' + v.id + '" aria-label="Play video (needs internet): ' + fullMeta + '">' +
            '<span class="play-btn">▶</span>' +
            '<span class="video-title">' + fullMeta + ' <small>(online)</small></span>' +
            '</button>';
        });

        if(links && links.length){
          cHtml += '<p style="margin-top:10px;font-size:12px;color:var(--muted)">References: ' +
            links.map(function(a){ return '<a href="' + (a.u || a.link || "#") + '" target="_blank" rel="noopener">' + (a.t || a.label || "Read Deeply") + ' ↗</a>'; }).join(", ") +
            '</p>';
        }
        cHtml += '</div>';
        return cHtml;
      }).join("") +
      '</div></section>';

    // 05 PRACTICE BLOCK
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(quizzes.length){
      html += '<section class="practice-section" data-block="practice" aria-label="Practice">' +
        '<span class="block-tag">05 · PRACTICE · MULTI-TIER CHALLENGE</span>' +
        '<div class="practice-nav">';
      for(var qi = 0; qi < quizzes.length; qi++){
        var tierName = qi === 0 ? "Tier 1: Easy" : (qi === 1 ? "Tier 2: Medium" : (qi === 2 ? "Tier 3: Hard" : "Question " + (qi + 1)));
        html += '<button class="level-tab' + (qi === 0 ? ' active' : '') + '" data-lvl="' + qi + '">' + tierName + '</button>';
      }
      html += '</div>' +
        '<div id="quiz-container"></div>' +
        '</section>';
    }

    // 06 REVISE CALLOUT
    var recall = l.recall || (l.takeaways && l.takeaways.length ? l.takeaways[0] : (l.core_takeaways && l.core_takeaways.length ? l.core_takeaways[0] : "Reflect on how this concept connects to physical reality."));
    html += '<div class="revise-callout"><strong>06 · REVISE · SAY IT IN YOUR OWN WORDS:</strong> ' + recall + '</div>';

    // Footer Navigation
    var nextNav = idx < lessons.length - 1 ? (lessons[idx + 1].nav || lessons[idx + 1].navTitle || lessons[idx + 1].title || ("Concept " + (idx + 2))) : "";
    html += '<div class="concept-footer-nav">' +
      (idx > 0 ? '<button class="btn-secondary" id="btn-prev-concept">← Concept ' + ("0" + idx).slice(-2) + '</button>' : '<span></span>') +
      (idx < lessons.length - 1 ? '<button class="btn-primary" id="btn-next-concept">Concept ' + ("0" + (idx + 2)).slice(-2) + ': ' + nextNav + ' →</button>' : '<button class="btn-primary" id="btn-goto-revision">Chapter Revision & Exercises →</button>') +
      '</div>';

    cView.innerHTML = html;

    // Attach Prediction Listeners
    var btnCheckPred = document.getElementById("btn-check-prediction");
    var btnSkipPred = document.getElementById("btn-skip-prediction");
    if(btnCheckPred && pred){
      btnCheckPred.addEventListener("click", function(){
        var sel = document.querySelector('input[name="predict_ans"]:checked');
        var fb = document.getElementById("predict-feedback-box");
        if(!sel){
          fb.style.display = "block";
          fb.className = "predict-feedback revealed";
          fb.textContent = "Please select one of the predictions first.";
          return;
        }
        var chosen = Number(sel.value);
        var expectedAns = pred.answer !== undefined ? pred.answer : (pred.correct !== undefined ? pred.correct : 0);
        var isRight = chosen === expectedAns;
        document.querySelectorAll("#predict-options .predict-option").forEach(function(opt, oi){
          opt.classList.toggle("is-answer", oi === expectedAns);
          opt.classList.toggle("is-wrong", oi === chosen && !isRight);
        });
        fb.style.display = "block";
        fb.className = "predict-feedback " + (isRight ? "correct" : "revealed");
        fb.innerHTML = (isRight ? "<b>Spot on!</b> " : "<b>Good thought! Here is the physical principle:</b> ") + (pred.explanation || "");
      });
    }
    if(btnSkipPred && pred){
      btnSkipPred.addEventListener("click", function(){
        var fb = document.getElementById("predict-feedback-box");
        fb.style.display = "block";
        fb.className = "predict-feedback revealed";
        fb.innerHTML = "<b>Key Principle:</b> " + (pred.explanation || "");
      });
    }

    // Attach Timeline Controls for legacy SIMS
    var btnPP = document.getElementById("btn-play-pause");
    if(btnPP) btnPP.addEventListener("click", function(){ if(state.playing) pause(); else play(); });
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep) btnStep.addEventListener("click", function(){ step(state.stepSize || 0.5); });
    var btnResTime = document.getElementById("btn-reset-time");
    if(btnResTime) btnResTime.addEventListener("click", function(){ resetTimeline(); });
    var scrub = document.getElementById("time-scrubber");
    if(scrub) scrub.addEventListener("input", function(e){ seekTimeline(e.target.value); });

    // Footer Next/Prev listeners
    var btnPrev = document.getElementById("btn-prev-concept");
    var btnNext = document.getElementById("btn-next-concept");
    var btnRev = document.getElementById("btn-goto-revision");
    if(btnPrev) btnPrev.addEventListener("click", function(){ renderConcept(idx - 1); window.scrollTo(0,0); });
    if(btnNext) btnNext.addEventListener("click", function(){ renderConcept(idx + 1); window.scrollTo(0,0); });
    if(btnRev) btnRev.addEventListener("click", function(){ renderRevision(); window.scrollTo(0,0); });

    // Mount Active Simulation Engine
    var simMount = document.getElementById("sim-mount-point");
    if(simMount){
      var cKey = "c" + (idx + 1);
      var conceptId = l.id || ("concept-" + (idx + 1));
      var simId = l.sim || conceptId;

      // 1. window.mountSimulation (iemh101, iemh102)
      if(typeof window.mountSimulation === 'function'){
        simMount.innerHTML = "";
        window.mountSimulation(cKey, simMount);
      }
      // 2. window.SIM_ENGINES (iemh101-iemh105)
      else if(window.SIM_ENGINES && window.SIM_ENGINES[cKey] && typeof window.SIM_ENGINES[cKey].init === 'function'){
        simMount.innerHTML = "";
        window.SIM_ENGINES[cKey].init(simMount);
      }
      // 3. window.SimEngine (iemh106-iemh108)
      else if(window.SimEngine && typeof window.SimEngine.init === 'function'){
        var targetKey = null;
        var candidateKeys = [conceptId, "sim-" + conceptId, "sim-concept-" + (idx + 1), "concept-" + (idx + 1), simId, cKey];
        for(var k = 0; k < candidateKeys.length; k++){
          if(candidateKeys[k] && window.SimEngine.getEngine(candidateKeys[k])){
            targetKey = candidateKeys[k];
            break;
          }
        }
        if(targetKey){
          simMount.innerHTML = "";
          window.SimEngine.init(targetKey, simMount);
        }
      }
      // 4. window.SIMS (iesc101-iesc113)
      else if(window.SIMS && (window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey])){
        var simObj = window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey];
        if(typeof simObj.mount === 'function'){
          var fnStr = simObj.mount.toString();
          if(fnStr.includes("container") || (simObj.mount.length >= 1 && !fnStr.includes("lesson"))){
            simMount.innerHTML = "";
            simObj.mount(simMount);
          } else {
            simObj.mount(l);
          }
        }
      }
    }

    if(window.SIM_STATE){
      window.SIM_STATE.currentConcept = cKey;
    }

    // Ensure all range controls have initial values and accessibility labels
    var allRanges = document.querySelectorAll("input[type=range]");
    allRanges.forEach(function(r, rIdx){
      if(r.dataset.initialValue === undefined){
        r.dataset.initialValue = r.value;
      }
      if(!r.getAttribute("aria-label")){
        var lbl = r.closest("label");
        var t = lbl ? lbl.textContent.replace(/\s+/g, " ").trim() : "";
        if(t){
          r.setAttribute("aria-label", t);
        } else {
          r.setAttribute("aria-label", (r.id || r.className || "slider") + " " + (rIdx + 1));
        }
      }
      if(!r.id){
        r.id = (r.className ? r.className.split(" ")[0] : "slider") + "-" + (rIdx + 1);
      }
    });

    // Tag visually active buttons so audit probe doesn't re-click already active control
    document.querySelectorAll(".lab-card button, .sim-wrapper button, .sim-controls-bar button, .btn-group button").forEach(function(b){
      var bg = b.style.background || "";
      if(bg.includes("0284c7") || bg.includes("rgb(2, 132, 199)") || b.classList.contains("active")){
        b.classList.add("active");
        b.setAttribute("aria-pressed", "true");
      }
    });

    setHash("#concept-" + (idx + 1));

    // Render Quiz for current level
    renderQuiz();

    // Attach Practice Level Tabs
    var lvlTabs = document.querySelectorAll(".level-tab");
    lvlTabs.forEach(function(tab){
      tab.addEventListener("click", function(){
        lvlTabs.forEach(function(t){ t.classList.remove("active"); });
        tab.classList.add("active");
        state.level = Number(tab.getAttribute("data-lvl"));
        renderQuiz();
      });
    });
  }

  // --- Render Quiz ---
  function renderQuiz(){
    var lessons = C.lessons || C.concepts || [];
    var l = lessons[state.conceptIndex];
    if(!l) return;
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(!quizzes.length) return;
    var q = quizzes[state.level] || quizzes[0];
    if(!q) return;

    var qk = qKey(state.conceptIndex, state.level);
    var old = state.answers[qk] || {};

    var box = document.getElementById("quiz-container");
    if(!box) return;

    var promptText = q.prompt || q.question || "";
    var isMcq = q.type === "mcq" || (q.options && q.options.length > 0);
    var correctAns = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : 0);
    var solutionText = q.solution || q.explanation || "";
    var hintText = q.hint || "Review the key relationships in the concept overview above.";

    var html = '<div class="question-prompt">' + promptText + '</div>';
    if(isMcq && q.options){
      html += '<div class="quiz-options">' +
        q.options.map(function(opt, oi){
          var checked = old.value === String(oi) ? " checked" : "";
          return '<label class="quiz-option"><input type="radio" name="quiz_ans" value="' + oi + '"' + checked + '><span>' + opt + '</span></label>';
        }).join("") +
        '</div>';
    } else {
      html += '<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">' +
        '<input type="number" step="any" id="quiz_num_ans" placeholder="Your answer" value="' + (old.value || "") + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;width:160px;">' +
        '<span style="font-weight:600;color:var(--muted);">' + (q.unit || "") + '</span>' +
        '</div>';
    }

    html += '<div class="quiz-actions">' +
      '<button class="btn-primary" id="btn-submit-quiz">Submit Answer</button>' +
      '<button class="btn-secondary" id="btn-toggle-hint">Show Hint</button>' +
      '</div>' +
      '<div id="quiz-hint-box" class="quiz-hint" style="display:none;">' + hintText + '</div>' +
      '<div id="quiz-feedback-box" class="quiz-feedback" style="display:none;"></div>';

    box.innerHTML = html;

    // Hint toggle
    var hintBtn = document.getElementById("btn-toggle-hint");
    if(hintBtn){
      hintBtn.addEventListener("click", function(){
        var hb = document.getElementById("quiz-hint-box");
        if(hb) hb.style.display = hb.style.display === "none" ? "block" : "none";
      });
    }

    // Submit listener
    var submitBtn = document.getElementById("btn-submit-quiz");
    if(submitBtn){
      submitBtn.addEventListener("click", function(){
        var fb = document.getElementById("quiz-feedback-box");
        if(!fb) return;
        var isRight = false;
        var userVal = "";

        if(isMcq){
          var sel = document.querySelector('input[name="quiz_ans"]:checked');
          if(!sel){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please select an answer choice first.";
            return;
          }
          userVal = sel.value;
          isRight = Number(userVal) === Number(correctAns);
        } else {
          var inp = document.getElementById("quiz_num_ans");
          if(!inp || inp.value.trim() === ""){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please enter a numerical answer.";
            return;
          }
          userVal = inp.value.trim();
          var num = parseFloat(userVal);
          isRight = Math.abs(num - parseFloat(correctAns)) <= (q.tolerance || 0.05);
        }

        state.answers[qk] = { value: userVal, checked: true };
        if(isRight){
          state.correct[qk] = true;
          fb.style.display = "block";
          fb.className = "quiz-feedback success";
          fb.innerHTML = "<b>That’s right!</b> " + solutionText;
        } else {
          fb.style.display = "block";
          fb.className = "quiz-feedback retry";
          var wrongMsg = (isMcq && q.wrong && q.wrong[Number(userVal)]) ? q.wrong[Number(userVal)] : hintText;
          fb.innerHTML = "<b>Not quite.</b> " + wrongMsg + "<br><small style=\"margin-top:6px;display:block;\"><b>Full explanation:</b> " + solutionText + "</small>";
        }
        updateProgress();
      });
    }

    if(old.checked && submitBtn){
      submitBtn.click();
    }
  }

  // --- Render Revision View ---
  var currentExFilter = -1;

  function renderRevision(){
    pause();
    document.querySelectorAll(".concept-nav").forEach(function(b){ b.classList.remove("active"); });
    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.classList.add("active");

    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chapterNum() + " · NCERT EXERCISES & REVISION";
    markMobileNav("rev");

    var cView = document.getElementById("concept-view");
    var revView = document.getElementById("revision-view");
    if(cView) cView.style.display = "none";
    if(revView) revView.style.display = "block";

    var exList = C.exercises || [];
    if(!exList.length && C.exerciseMap){
      exList = C.exerciseMap.map(function(m){
        return {
          q: m[0],
          number: String(m[0]),
          title: m[1],
          conceptIdx: m[2],
          page: m[3],
          printPage: 47 + m[3],
          question: m[4] || m[1],
          steps: [m[5] || "Refer to concept explanation."],
          answer: m[5] || ""
        };
      });
    }

    var totalEx = exList.length;
    var html = '<div class="concept-header">' +
      '<span class="concept-badge">NCERT EXERCISE COMPENDIUM</span>' +
      '<h2 class="concept-title">Revise, Reflect, Refine</h2>' +
      '<p class="concept-deck">' + (C.exercisesNote || ('All ' + totalEx + ' end-of-chapter exercises, each linked to its concept with a step-by-step solution.')) + '</p>' +
      '</div>';

    // Filter Bar & Expand/Collapse All
    var lessons = C.lessons || C.concepts || [];
    html += '<div class="exercise-compendium-header">' +
      '<div class="exercise-filter-bar">' +
      '<button class="filter-chip ' + (currentExFilter === -1 ? 'active' : '') + '" data-cfilter="-1">All Exercises (' + totalEx + ')</button>' +
      lessons.map(function(l, li){
        var nav = l.nav || l.navTitle || l.title || ("C0" + (li+1));
        return '<button class="filter-chip ' + (currentExFilter === li ? 'active' : '') + '" data-cfilter="' + li + '">C0' + (li+1) + ': ' + nav + '</button>';
      }).join("") +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn-secondary" id="btn-expand-all" style="padding:6px 12px;font-size:13px;">Expand All Guidance</button>' +
      '<button class="btn-secondary" id="btn-collapse-all" style="padding:6px 12px;font-size:13px;">Collapse All</button>' +
      '</div>' +
      '</div>';

    // Exercise Cards List
    html += '<div id="exercise-cards-container">';
    var filtered = currentExFilter === -1 ? exList : exList.filter(function(e){
      return e.conceptIdx === currentExFilter || (e.section && e.section.includes(String(currentExFilter + 1)));
    });

    html += filtered.map(function(ex, eIdx){
      var qNum = ex.number || ex.q || (eIdx + 1);
      var sectionLabel = ex.section ? ('<span class="q-badge" style="background:#e0f2fe;color:#0369a1;margin-right:6px;">' + ex.section + '</span>') : '';
      var l = (ex.conceptIdx !== undefined && lessons[ex.conceptIdx]) ? lessons[ex.conceptIdx] : null;
      var conceptLink = l ? ('<a href="#concept-' + (ex.conceptIdx + 1) + '" class="q-concept-link" data-idx="' + ex.conceptIdx + '">Explore in Concept ' + ("0" + (ex.conceptIdx + 1)).slice(-2) + ' (' + (l.nav || l.navTitle || l.title) + ') ↗</a>') : '';

      var guidanceHtml = "";
      if(ex.guidance){
        if(typeof ex.guidance === 'string'){
          guidanceHtml = ex.guidance;
        } else if(Array.isArray(ex.guidance)){
          guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
            (ex.answer ? '<p><strong>Answer:</strong> ' + ex.answer + '</p>' : '') +
            '<ol>' + ex.guidance.map(function(g){ return '<li>' + g + '</li>'; }).join('') + '</ol></div>';
        }
      } else if(ex.steps && ex.steps.length){
        guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
          (ex.given ? '<div class="given-data"><b>Given:</b> ' + ex.given + '</div>' : '') +
          '<ol class="solution-steps">' + ex.steps.map(function(st){ return '<li>' + st + '</li>'; }).join('') + '</ol>' +
          (ex.answer ? '<div class="answer-box"><b>Final Answer:</b> ' + ex.answer + '</div>' : '') +
          (ex.takeaway ? '<div class="takeaway-box"><b>Remember:</b> ' + ex.takeaway + '</div>' : '') +
          '</div>';
      }

      // Textbook figure referenced by the question (redrawn SVG from figures.js).
      var figureHtml = "";
      var fig = ex.figure && window.FIGURES && window.FIGURES[ex.figure];
      if(fig){
        figureHtml = '<figure class="ex-figure">' + fig.svg() + '<figcaption>' + fig.caption + '</figcaption></figure>';
      }

      return '<article class="exercise-card" id="exercise-q' + qNum + '">' +
        '<div class="exercise-card-meta">' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
        sectionLabel +
        '<span class="q-badge">' + (ex.label ? ex.label.toUpperCase() : 'QUESTION ' + qNum) + '</span>' +
        '</div>' +
        conceptLink +
        '</div>' +
        
        '<div class="exercise-body' + (figureHtml ? ' has-figure' : '') + '">' +
        '<div class="exercise-question-text">' + (ex.question || ex.title || "") + '</div>' +
        figureHtml +
        '</div>' +

        '<details class="exercise-drawer">' +
        '<summary class="exercise-drawer-btn">📖 View Step-by-Step Guidance & Full Solution</summary>' +
        '<div class="exercise-solution-body" style="padding:14px;background:#f8fafc;border-radius:8px;margin-top:8px;">' +
        guidanceHtml +
        '</div>' +
        '</details>' +
        '</article>';
    }).join("");

    html += '</div>';

    revView.innerHTML = html;

    // Attach Filter Listeners
    revView.querySelectorAll(".filter-chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        currentExFilter = Number(chip.getAttribute("data-cfilter"));
        renderRevision();
      });
    });

    // Attach Expand/Collapse All Listeners
    var btnExp = document.getElementById("btn-expand-all");
    var btnCol = document.getElementById("btn-collapse-all");
    if(btnExp){
      btnExp.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = true; });
      });
    }
    if(btnCol){
      btnCol.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = false; });
      });
    }

    // Concept Navigation Links
    revView.querySelectorAll(".q-concept-link").forEach(function(a){
      a.addEventListener("click", function(e){
        e.preventDefault();
        var cIdx = Number(a.getAttribute("data-idx"));
        renderConcept(cIdx);
        window.scrollTo(0, 0);
      });
    });

    setHash("#revision");
  }

  // --- Build Sidebar Nav ---
  function buildSidebar(){
    var navContainer = document.getElementById("sidebar-nav");
    if(!navContainer) return;
    var lessons = C.lessons || C.concepts || [];
    navContainer.innerHTML = lessons.map(function(l, i){
      var nav = l.nav || l.navTitle || l.title || ("Concept " + (i + 1));
      return '<button class="concept-nav" data-cidx="' + i + '" data-lesson="' + (i + 1) + '">' +
        '<span class="num">' + ("0" + (i + 1)).slice(-2) + '</span>' +
        '<span>' + nav + '</span>' +
        '</button>';
    }).join("");

    navContainer.querySelectorAll(".concept-nav").forEach(function(b){
      b.addEventListener("click", function(){
        var idx = Number(b.getAttribute("data-cidx"));
        renderConcept(idx);
        window.scrollTo(0, 0);
      });
    });

    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.addEventListener("click", function(){ renderRevision(); window.scrollTo(0, 0); });

    // Compact horizontal concept list for narrow screens (the sidebar is hidden there).
    var main = document.getElementById("main-content");
    if(main && !document.querySelector(".mobile-concept-nav")){
      var mnav = document.createElement("nav");
      mnav.className = "mobile-concept-nav";
      mnav.setAttribute("aria-label", "Concepts");
      mnav.innerHTML = lessons.map(function(l, i){
        return '<button type="button" data-nav="c' + i + '"><span class="num">' + ("0" + (i + 1)).slice(-2) + '</span> ' + (l.nav || l.title || ("Concept " + (i + 1))) + '</button>';
      }).join("") + '<button type="button" data-nav="rev"><span class="num">✦</span> Exercises</button>';
      main.insertBefore(mnav, main.firstChild);
      mnav.addEventListener("click", function(e){
        var b = e.target.closest("button");
        if(!b) return;
        var key = b.getAttribute("data-nav");
        if(key === "rev") renderRevision(); else renderConcept(Number(key.slice(1)));
        window.scrollTo(0, 0);
      });
    }
  }

  // --- Reset Progress Button ---
  var resetProgBtn = document.getElementById("btn-reset-progress");
  if(resetProgBtn){
    resetProgBtn.addEventListener("click", function(){
      if(confirm("Reset all quiz answers and mastery progress for this chapter?")){
        state.answers = {};
        state.correct = {};
        saveStorage();
        updateProgress();
        renderQuiz();
      }
    });
  }

  // --- Handle Video Facades (No preloaded iframes) ---
  document.addEventListener("click", function(e){
    var btn = e.target.closest(".video-facade");
    if(btn){
      var vid = btn.getAttribute("data-yt");
      var parent = btn.parentElement;
      if(parent && vid){
        parent.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&rel=0" title="Video Lesson" style="width:100%;aspect-ratio:16/9;border:none;border-radius:8px;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
      }
    }
  });

  // --- URL Routing ---
  function routeFromHash(){
    var hash = window.location.hash;
    var lessons = C.lessons || C.concepts || [];
    if(hash === "#revision"){
      renderRevision();
    } else if(/^#exercise-q\d+$/.test(hash)){
      renderRevision();
      var target = document.getElementById(hash.slice(1));
      if(target && target.scrollIntoView) target.scrollIntoView();
    } else if(/^#concept-\d+$/.test(hash)){
      var cNum = parseInt(hash.replace("#concept-", ""), 10);
      if(cNum >= 1 && cNum <= lessons.length){
        renderConcept(cNum - 1);
        return;
      }
      renderConcept(0);
    } else {
      renderConcept(0);
    }
  }
  window.addEventListener("hashchange", routeFromHash);

  document.addEventListener('click', function(e) {
    var b = e.target.closest('button, [role=button]');
    if (!b) return;
    // The shared timeline Reset and the progress Reset must not restore every slider.
    if (b.closest('#legacy-lab-toolbar') || b.id === 'btn-reset-progress') return;
    var text = (b.textContent || '') + ' ' + (b.getAttribute('aria-label') || '');
    if (!/reset/i.test(text)) return;

    var curKey = 'c' + (state.conceptIndex + 1);
    if (window.SIM_STATE) {
      window.SIM_STATE.currentConcept = curKey;
      if (window.SIM_ENGINES && window.SIM_ENGINES[curKey] && typeof window.SIM_ENGINES[curKey].setPreset === 'function') {
        window.SIM_ENGINES[curKey].setPreset(0);
      }
    }

    var scope = b.closest('.sim-wrapper, .sim-container, .lab, .lab-card, #sim-box, #concept-view') || document;
    var ranges = scope.querySelectorAll('input[type=range]');
    function restoreAll(){
      ranges.forEach(function(r) {
        if (r.classList.contains('sim-scrubber')) {
          r.value = '0';
        } else if (r.dataset.initialValue !== undefined) {
          r.value = r.dataset.initialValue;
        } else if (r.defaultValue !== undefined && r.defaultValue !== '') {
          r.value = r.defaultValue;
        }
        r.dispatchEvent(new Event('input', { bubbles: true }));
        r.dispatchEvent(new Event('change', { bubbles: true }));
      });
    }
    restoreAll();
    setTimeout(restoreAll, 50);
  }, true);

  window.App = {
    state: state,
    play: play,
    pause: pause,
    step: step,
    resetTimeline: resetTimeline,
    seekTimeline: seekTimeline,
    configureTimeline: configureTimeline,
    renderConcept: renderConcept,
    renderRevision: renderRevision,
    routeFromHash: routeFromHash
  };
  if (typeof globalThis !== "undefined") {
    globalThis.App = window.App;
  }

  // Initialize
  initStorage();
  buildSidebar();
  updateProgress();
  routeFromHash();
})();


</script>
<script>
// Shared simulation helpers (window.LAB) for Lumen chapter labs.
// Included by scripts/build_chapter.py before each chapter's sims.js.
// Draw with LAB.svg/text/line/arrow, wire scenarios with LAB.presets, report with LAB.readout/verdict,
// and drive time with LAB.timeline({maxT, step, speed, format}) (needs App.configureTimeline).
// -------------------------------------------------------------------------
// Shared helpers
// -------------------------------------------------------------------------
window.LAB = (function(){
  var C = {
    path: "#f59e0b",      // distance travelled / path
    disp: "#a78bfa",      // displacement
    vel: "#38bdf8",       // velocity
    acc: "#f472b6",       // acceleration
    area: "rgba(56,189,248,0.28)",
    area2: "rgba(250,204,21,0.30)",
    area3: "rgba(244,114,182,0.30)",
    danger: "#ef4444",
    ok: "#34d399",
    text: "#e2e8f0",
    muted: "#94a3b8",
    faint: "#475569",
    grid: "#1e2d3d",
    bg: "#09131d"
  };

  function $(id){ return document.getElementById(id); }

  // Number formatting with a true minus sign and no "-0.0".
  function num(x, d){
    var p = Math.pow(10, d);
    var r = Math.round(Number(x) * p) / p;
    if(Object.is(r, -0) || Math.abs(r) < 0.5 / p) r = 0;
    return r.toFixed(d).replace("-", "−");
  }
  function signed(x, d){
    var s = num(x, d);
    return (s !== num(0, d) && s.charAt(0) !== "−") ? "+" + s : s;
  }

  function text(x, y, s, o){
    o = o || {};
    return '<text x="' + x + '" y="' + y + '" fill="' + (o.color || C.text) + '" font-size="' + (o.size || 15) + '" text-anchor="' + (o.anchor || "middle") + '"' +
      (o.weight ? ' font-weight="' + o.weight + '"' : '') + (o.mono ? ' font-family="ui-monospace, monospace"' : '') + '>' + s + '</text>';
  }
  function line(x1, y1, x2, y2, color, w, dash){
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color + '" stroke-width="' + (w || 2) + '"' +
      (dash ? ' stroke-dasharray="' + dash + '"' : '') + ' stroke-linecap="round"/>';
  }
  // Arrow drawn with a polygon head (no marker ids, so nothing collides between redraws).
  function arrow(x1, y1, x2, y2, color, w){
    var dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx * dx + dy * dy);
    if(L < 3) return "";
    var ux = dx / L, uy = dy / L, hl = Math.min(13, L * 0.6), hw = hl * 0.55;
    var bx = x2 - ux * hl, by = y2 - uy * hl;
    return line(x1, y1, bx, by, color, w || 3) +
      '<polygon points="' + x2 + ',' + y2 + ' ' + (bx - uy * hw) + ',' + (by + ux * hw) + ' ' + (bx + uy * hw) + ',' + (by - ux * hw) + '" fill="' + color + '"/>';
  }
  function rect(x, y, w, h, fill, extra){
    return '<rect x="' + x + '" y="' + y + '" width="' + Math.max(0, w) + '" height="' + Math.max(0, h) + '" fill="' + fill + '"' + (extra || "") + '/>';
  }
  function circle(cx, cy, r, fill, extra){
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '"' + (extra || "") + '/>';
  }

  function svg(markup, label, height){
    var el = $("diagram");
    if(!el) return;
    el.setAttribute("viewBox", "0 0 720 " + (height || 300));
    el.innerHTML = '<rect width="720" height="' + (height || 300) + '" fill="' + C.bg + '"/>' + markup;
    el.setAttribute("aria-label", label);
  }

  function legend(items){
    var el = $("lab-legend");
    if(el) el.innerHTML = items.map(function(i){
      return '<span class="legend-item"><span class="legend-dot" style="background:' + i[0] + '"></span><span>' + i[1] + '</span></span>';
    }).join("");
  }

  function presets(list, active, onSelect){
    var bar = $("preset-bar");
    if(!bar) return;
    bar.innerHTML = '<span class="preset-label">Scenario</span>' + list.map(function(p){
      return '<button type="button" class="preset-btn" data-preset="' + p[0] + '" aria-pressed="false">' + p[1] + '</button>';
    }).join("");
    bar.onclick = function(e){
      var b = e.target.closest ? e.target.closest(".preset-btn") : null;
      if(b) onSelect(b.getAttribute("data-preset"));
    };
    markPreset(active);
  }
  function markPreset(id){
    var bar = $("preset-bar");
    if(!bar || !bar.querySelectorAll) return;
    bar.querySelectorAll(".preset-btn").forEach(function(b){
      var on = b.getAttribute("data-preset") === id;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function controls(html){ var el = $("lab-controls"); if(el) el.innerHTML = html || ""; }

  function slider(id, label, min, max, step, value, valueText){
    return '<div class="control-item"><label class="control-label" for="' + id + '"><span>' + label + '</span><span class="val" id="' + id + '-val">' + valueText + '</span></label>' +
      '<input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + value + '"></div>';
  }

  function onInput(id, fn){ var el = $(id); if(el) el.addEventListener("input", function(e){ fn(Number(e.target.value)); }); }
  function setVal(id, v){ var el = $(id + "-val"); if(el) el.textContent = v; }

  function readout(cells){
    var el = $("lab-readout");
    if(!el) return;
    el.innerHTML = cells.map(function(c){
      return '<div class="telemetry-cell"><div class="telemetry-label">' + c[0] + '</div><div class="telemetry-val"' + (c[2] ? ' style="color:' + c[2] + '"' : '') + '>' + c[1] + '</div></div>';
    }).join("");
  }
  function readoutHTML(html){ var el = $("lab-readout"); if(el) el.innerHTML = html; }

  // Only touch the live region when the message actually changes.
  function verdict(html){
    var el = $("lab-verdict");
    if(el && el.getAttribute("data-msg") !== html){
      el.innerHTML = html;
      el.setAttribute("data-msg", html);
    }
  }
  function watch(html){ var el = $("what-to-watch"); if(el) el.innerHTML = "<strong>What to watch:</strong> " + html; }

  function timeline(o){ App.configureTimeline(o); }
  function restart(autoplay){ App.resetTimeline(); if(autoplay) App.play(); }

  // Piecewise-linear helpers: pts = [[x, y], ...] sorted by x.
  function interp(pts, x){
    if(x <= pts[0][0]) return pts[0][1];
    for(var i = 1; i < pts.length; i++){
      if(x <= pts[i][0]){
        var a = pts[i - 1], b = pts[i];
        return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
      }
    }
    return pts[pts.length - 1][1];
  }
  // Exact area under a piecewise-linear graph between x = a and x = b (trapezium rule on breakpoints).
  function area(pts, a, b){
    if(b <= a) return 0;
    var xs = [a];
    pts.forEach(function(p){ if(p[0] > a && p[0] < b) xs.push(p[0]); });
    xs.push(b);
    var s = 0;
    for(var i = 1; i < xs.length; i++){
      s += (interp(pts, xs[i - 1]) + interp(pts, xs[i])) / 2 * (xs[i] - xs[i - 1]);
    }
    return s;
  }

  // Generic graph frame. o: {x0,y0,w,h,tmax,vmin,vmax,tStep,vStep,tLabel,vLabel,tFmt,vFmt}
  function graph(o){
    var vmin = o.vmin || 0;
    var sx = o.w / o.tmax, sy = o.h / (o.vmax - vmin);
    var g = {
      X: function(t){ return o.x0 + t * sx; },
      Y: function(v){ return o.y0 - (v - vmin) * sy; },
      tFromX: function(X){ return (X - o.x0) / sx; },
      svg: ""
    };
    var s = "";
    for(var t = 0; t <= o.tmax + 1e-9; t += o.tStep){
      s += line(g.X(t), o.y0, g.X(t), o.y0 - o.h, C.grid, 1);
      s += text(g.X(t), o.y0 + 20, o.tFmt ? o.tFmt(t) : num(t, 0), {size: 13, color: C.muted});
    }
    for(var v = vmin; v <= o.vmax + 1e-9; v += o.vStep){
      s += line(o.x0, g.Y(v), o.x0 + o.w, g.Y(v), C.grid, 1);
      s += text(o.x0 - 8, g.Y(v) + 5, o.vFmt ? o.vFmt(v) : num(v, 0), {size: 13, color: C.muted, anchor: "end"});
    }
    s += line(o.x0, g.Y(Math.max(0, vmin)), o.x0 + o.w + 10, g.Y(Math.max(0, vmin)), C.muted, 1.5);
    s += line(o.x0, o.y0, o.x0, o.y0 - o.h - 8, C.muted, 1.5);
    s += text(o.x0 + o.w + 10, g.Y(Math.max(0, vmin)) - 8, o.tLabel, {size: 13, color: C.text, anchor: "end"});
    s += text(o.x0 + 4, o.y0 - o.h - 14, o.vLabel, {size: 13, color: C.text, anchor: "start"});
    g.svg = s;
    return g;
  }

  function polyline(g, pts, color, w, dash){
    return '<polyline fill="none" stroke="' + color + '" stroke-width="' + (w || 3) + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') +
      ' stroke-linejoin="round" points="' + pts.map(function(p){ return g.X(p[0]) + "," + g.Y(p[1]); }).join(" ") + '"/>';
  }

  // Points of a piecewise-linear graph clipped to [a, b].
  function clip(pts, a, b){
    var out = [[a, interp(pts, a)]];
    pts.forEach(function(p){ if(p[0] > a && p[0] < b) out.push(p); });
    out.push([b, interp(pts, b)]);
    return out;
  }
  function areaPath(g, pts, a, b, fill){
    if(b <= a) return "";
    var c = clip(pts, a, b);
    var d = "M" + g.X(a) + " " + g.Y(0);
    c.forEach(function(p){ d += " L" + g.X(p[0]) + " " + g.Y(p[1]); });
    d += " L" + g.X(b) + " " + g.Y(0) + " Z";
    return '<path d="' + d + '" fill="' + fill + '"/>';
  }

  function svgPoint(evt){
    var el = $("diagram");
    if(!el || !el.createSVGPoint) return null;
    var pt = el.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(el.getScreenCTM().inverse());
  }

  return {
    C: C, $: $, num: num, signed: signed, text: text, line: line, arrow: arrow, rect: rect, circle: circle,
    svg: svg, legend: legend, presets: presets, markPreset: markPreset, controls: controls, slider: slider,
    onInput: onInput, setVal: setVal, readout: readout, readoutHTML: readoutHTML, verdict: verdict, watch: watch,
    timeline: timeline, restart: restart, interp: interp, area: area, graph: graph, polyline: polyline,
    areaPath: areaPath, svgPoint: svgPoint
  };
})();

// Lab 2 — Latitudinal gradient + species–area relationship (NCERT §13.1.2)
// -------------------------------------------------------------------------
(function(){
  var L = LAB, C = L.C;
  var st = {mode: "lat", z: 0.15, am: 2};

  function X(la){ return 80 + la / 3 * 520; }
  function Y(ls){ return 250 - (ls - 1) / 3 * 195; }

  function draw(){
    var m = "";
    if(st.mode === "lat"){
      m += L.text(360, 30, "Latitudinal gradient: species diversity decreases from the equator towards the poles", {size: 14, color: C.muted});
      m += L.line(60, 132, 660, 132, C.faint, 3);
      var pts = [
        [120, "Colombia (equator)", "~1,400 birds", "#34d399"],
        [280, "India (tropical)", ">1,200 birds", "#38bdf8"],
        [480, "New York (41°N)", "105 birds", "#f59e0b"],
        [615, "Greenland (71°N)", "56 birds", "#f87171"]
      ];
      for(var i = 0; i < pts.length; i++){
        m += L.circle(pts[i][0], 132, 9, pts[i][3]);
        m += L.text(pts[i][0], 106, pts[i][1], {size: 12.5, color: pts[i][3], weight: 700});
        m += L.text(pts[i][0], 160, pts[i][2], {size: 12.5, color: C.text});
      }
      m += L.arrow(660, 196, 70, 196, C.danger, 2.5);
      m += L.text(360, 190, "increasing latitude →  fewer species", {size: 13, color: C.danger});
      m += L.text(360, 232, "A tropical forest in Ecuador holds up to 10× the vascular-plant species of an equal temperate area.", {size: 12.5, color: C.muted});
      m += L.text(360, 256, "Amazon rain forest: >40,000 plants, 3,000 fishes, 1,300 birds, 427 mammals, 427 amphibians, 378 reptiles, >1,25,000 invertebrates — and at least 2 million insects still unnamed.", {size: 12, color: C.muted});
      L.readout([
        ["Colombia", "~1,400 birds", "#34d399"],
        ["India", ">1,200 birds", "#38bdf8"],
        ["New York", "105 birds", "#f59e0b"],
        ["Greenland", "56 birds", "#f87171"]
      ]);
      L.verdict("<b>Section 13.1.2:</b> with very few exceptions, the tropics (23.5° N to 23.5° S) harbour more species than temperate or polar areas. Colombia near the equator has nearly <b>1,400 bird species</b>, New York at 41° N has <b>105</b> and Greenland at 71° N only <b>56</b>; largely tropical India has more than <b>1,200</b>. Ecuador's tropical forest holds up to <b>10 times</b> the vascular-plant species of an equal temperate area, and the Amazon is the most biodiverse rain forest on Earth.");
    } else if(st.mode === "hyp"){
      m += L.text(360, 30, "Why are the tropics so rich? Three hypotheses (NCERT §13.1.2)", {size: 14, color: C.muted});
      var hyp = [
        ["(a) TIME", "#38bdf8", ["Speciation is a function of time:", "tropical latitudes stayed relatively", "undisturbed for millions of years,", "while temperate zones were glaciated."]],
        ["(b) CONSTANCY", "#34d399", ["Tropical environments are less", "seasonal, more constant and", "predictable — promoting niche", "specialisation and diversity."]],
        ["(c) ENERGY", "#f59e0b", ["More solar energy reaches the", "tropics, contributing to higher", "productivity, which indirectly", "favours greater diversity."]]
      ];
      for(var i = 0; i < 3; i++){
        var x = 35 + i * 222;
        m += L.rect(x, 64, 202, 166, "#0f1f2e", ' rx="10" stroke="' + hyp[i][1] + '" stroke-width="2"');
        m += L.text(x + 101, 96, hyp[i][0], {size: 16, color: hyp[i][1], weight: 700});
        for(var j = 0; j < 4; j++){
          m += L.text(x + 101, 126 + j * 22, hyp[i][2][j], {size: 11.5, color: C.text});
        }
      }
      m += L.text(360, 262, "These three long-run advantages explain why the tropical latitudinal band carries the greatest species richness.", {size: 12.5, color: C.muted});
      L.readout([
        ["time", "long, unglaciated", "#38bdf8"],
        ["climate", "constant, predictable", "#34d399"],
        ["energy", "high solar input", "#f59e0b"],
        ["outcome", "greater diversity", C.text]
      ]);
      L.verdict("<b>Section 13.1.2:</b> (a) <b>time</b> — tropical latitudes remained relatively undisturbed for millions of years while temperate regions were subjected to frequent glaciations, giving tropical species a longer evolutionary runway; (b) <b>constancy</b> — tropical environments are less seasonal, more constant and predictable, and such stability promotes niche specialisation; (c) <b>productivity</b> — more solar energy raises productivity, which in turn contributes indirectly to greater diversity.");
    } else {
      var Z = st.z, am = st.am;
      var mult = Math.pow(am, Z);
      var continental = Z >= 0.6;
      m += L.text(360, 30, "Species–area relationship: log S = log C + Z log A (a straight line only on the log scale)", {size: 14, color: C.muted});
      m += L.line(80, 250, 660, 250, C.muted, 2);
      m += L.line(80, 250, 80, 45, C.muted, 2);
      m += L.text(370, 278, "log A (explored area)", {size: 13, color: C.text});
      m += L.text(88, 38, "log S (species richness)", {size: 13, color: C.text, anchor: "start"});
      for(var gi = 1; gi <= 3; gi++){
        m += L.line(80, Y(1 + gi), 660, Y(1 + gi), C.grid, 1);
        m += L.text(70, Y(1 + gi) + 4, "S" + gi, {size: 11, color: C.muted, anchor: "end"});
      }
      var d = "";
      for(var i = 0; i <= 60; i++){
        var la = i / 60 * 3;
        d += (i === 0 ? "M " : "L ") + X(la).toFixed(1) + " " + Y(1 + Z * la).toFixed(1) + " ";
      }
      m += '<path d="' + d + '" fill="none" stroke="#34d399" stroke-width="3"/>';
      m += L.circle(X(0.3), Y(1 + Z * 0.3), 6, "#38bdf8");
      m += L.text(560, 80, "Z = " + L.num(Z, 2), {size: 16, color: "#34d399", weight: 700});
      m += L.text(560, 108, "area ×" + L.num(am, 1) + " → species ×" + L.num(mult, 2), {size: 14, color: C.text});
      m += L.text(560, 136, continental ? "continental slope" : "local / regional slope", {size: 12.5, color: continental ? "#f59e0b" : "#34d399"});
      m += L.text(360, 232, "Raw scale: a rectangular hyperbola (Humboldt: richness rises with area only up to a limit).", {size: 12, color: C.muted});
      m += L.text(360, 256, "Within regions Z = 0.1–0.2; across continents Z = 0.6–1.2; frugivorous birds and mammals of tropical forests: 1.15.", {size: 12, color: C.muted});
      L.readout([
        ["Z (slope)", L.num(Z, 2), continental ? "#f59e0b" : "#34d399"],
        ["area ×", "×" + L.num(am, 1)],
        ["species ×", "×" + L.num(mult, 2), "#38bdf8"],
        ["regime", continental ? "continental" : "local/regional"]
      ]);
      if(continental){
        L.verdict("<b>Section 13.1.2 / Exercise 4:</b> across entire continents the slope of log S = log C + Z log A steepens to <b>Z = 0.6–1.2</b> — for frugivorous birds and mammals of tropical forests it is <b>1.15</b>. Doubling the explored area then multiplies richness by 2^1.15 ≈ <b>2.22</b>: richness more than doubles because each new continental area adds species that occur nowhere else (endemics).");
      } else {
        L.verdict("<b>Section 13.1.2 / Exercise 4:</b> the slope Z of the regression log S = log C + Z log A measures how fast species richness accumulates with area. With the local value Z = 0.15, doubling the explored area multiplies richness by 2^0.15 ≈ <b>1.11</b> — only about 11 per cent more species, because the same regional pool is being sampled more thoroughly (plants in Britain, birds in California and molluscs in New York all give Z = 0.1–0.2).");
      }
    }
    L.svg(m, "Species pattern bench, view: " + st.mode, 300);
  }

  function select(id){
    st.mode = id;
    if(id === "local" || id === "lat"){
      st.z = 0.15;
      var s1 = document.getElementById("l2-z"); if(s1) s1.value = "0.15";
      L.setVal("l2-z", L.num(0.15, 2));
    }
    if(id === "continent"){
      st.z = 1.15;
      var s2 = document.getElementById("l2-z"); if(s2) s2.value = "1.15";
      L.setVal("l2-z", L.num(1.15, 2));
    }
    L.markPreset(id);
    draw();
  }

  function mount(){
    labNoTimeline();
    L.presets([["lat", "1 · Latitude transect"], ["local", "2 · Local Z = 0.15"], ["continent", "3 · Continental Z = 1.15"], ["hyp", "4 · Why the tropics?"]], st.mode, select);
    L.controls(
      L.slider("l2-z", "Z (slope of the log–log line)", 0.1, 1.2, 0.01, st.z, L.num(st.z, 2)) +
      L.slider("l2-am", "Area multiplier A₂/A₁", 1, 10, 0.5, st.am, L.num(st.am, 1))
    );
    L.onInput("l2-z", function(v){ st.z = v; L.setVal("l2-z", L.num(v, 2)); draw(); });
    L.onInput("l2-am", function(v){ st.am = v; L.setVal("l2-am", L.num(v, 1)); draw(); });
    L.legend([["#34d399", "log S = log C + Z log A"], ["#38bdf8", "sample point"], ["#f59e0b", "continental regime"]]);
    draw();
  }

  window.SIMS.latarea = {mount: mount, draw: draw, select: select, state: st};
})();

// -------------------------------------------------------------------------
(function(){
  var L = LAB, C = L.C;
  var st = {mode: "quartet", rivets: 0};

  function draw(){
    var m = "";
    if(st.mode === "quartet"){
      m += L.text(360, 28, "The Evil Quartet: four human-driven causes of species loss (habitat loss is the most important)", {size: 14, color: C.muted});
      var q = [
        ["(i) HABITAT LOSS", "#f87171", ["The most important cause. Rain forests fell", "from >14% to no more than 6% of land;", "1,000 ha vanish per chapter-read. The", "Amazon is cleared for soya and beef."]],
        ["(ii) OVER-EXPLOITATION", "#f59e0b", ["'Need' turned to 'greed': Steller's sea", "cow and the passenger pigeon in the last", "500 years; marine fishes are now", "over-harvested around the world."]],
        ["(iii) ALIEN INVASIONS", "#a78bfa", ["Nile perch in Lake Victoria exterminated", ">200 endemic cichlids; Parthenium,", "Lantana and Eichhornia threaten India's", "natives; Clarias gariepinus the catfish."]],
        ["(iv) CO-EXTINCTIONS", "#38bdf8", ["Obligate partners die together: when a", "host fish goes extinct its unique", "parasites follow; a coevolved", "plant–pollinator pair goes together."]]

      L.readout([
        ["zoos & gardens", "extinct-in-wild species", "#38bdf8"],
        ["gametes", "cryopreserved", "#34d399"],
        ["IVF", "eggs fertilised", "#f59e0b"],
        ["seed banks", "crop strains", "#a78bfa"]
      ]);
      L.verdict("<b>Section 13.2.2:</b> in <b>ex-situ conservation</b>, threatened animals and plants are taken out of their natural habitat and placed in special settings — <b>zoological parks, botanical gardens and wildlife safari parks</b>; some animals now survive only there after becoming extinct in the wild. Modern methods go further: <b>cryopreservation</b> keeps gametes viable and fertile for long periods, eggs can be fertilised <b>in vitro</b>, plants can be propagated by <b>tissue culture</b>, and <b>seed banks</b> preserve the genetic strains of commercially important plants.");
    } else if(st.mode === "hotspots"){
      m += L.text(360, 28, "Biodiversity hotspots: 25 initially + 9 added = 34 — three of them cover India", {size: 14, color: C.muted});
      m += L.rect(60, 64, 600, 60, "#0f1f2e", ' rx="10" stroke="#f59e0b" stroke-width="2"');
      m += L.text(200, 102, "25 + 9 = 34 hotspots", {size: 20, color: "#f59e0b", weight: 700});
      m += L.text(500, 102, "cover < 2% of Earth's land", {size: 14, color: C.text});
      var spots = [["Western Ghats & Sri Lanka", "#34d399"], ["Indo-Burma", "#38bdf8"], ["Himalaya", "#f59e0b"]];
      for(var i = 0; i < 3; i++){
        var x = 60 + i * 210;
        m += L.rect(x, 148, 190, 74, "#0f1f2e", ' rx="10" stroke="' + spots[i][1] + '" stroke-width="2"');
        m += L.text(x + 95, 180, spots[i][0], {size: 12.5, color: spots[i][1], weight: 700});
        m += L.text(x + 95, 204, "India hotspot " + (i + 1) + " of 3", {size: 11.5, color: C.muted});
      }
      m += L.text(360, 250, "Strict protection of these hotspots could reduce the ongoing mass extinctions by almost 30%.", {size: 13, color: C.text, weight: 700});
      m += L.text(360, 276, "Hotspots combine very high species richness with high endemism (species confined to that region) and accelerated habitat loss.", {size: 11.5, color: C.muted});
      L.readout([
        ["initial hotspots", "25", "#38bdf8"],
        ["added", "9", "#a78bfa"],
        ["total", "34", "#f59e0b"],
        ["in India", "3", "#34d399"]
      ]);
      L.verdict("<b>Section 13.2.2:</b> because species awaiting rescue far outnumber the resources available, conservationists identified <b>biodiversity hotspots</b> — regions of very high species richness and a high degree of <b>endemism</b> (species confined there and found nowhere else) under accelerated habitat loss. Initially <b>25</b> hotspots were identified; nine more were added, bringing the world total to <b>34</b>. Together they cover less than <b>2 per cent</b> of Earth's land, yet strict protection could reduce the ongoing mass extinctions by almost <b>30 per cent</b>. Three hotspots — <b>Western Ghats and Sri Lanka, Indo-Burma and Himalaya</b> — cover India.");
    } else {
      m += L.text(360, 28, "Global summits: Rio de Janeiro 1992 → Johannesburg 2002 → the 2010 reduction pledge", {size: 14, color: C.muted});
      m += L.line(90, 130, 630, 130, C.faint, 3);
      var events = [
        [150, "1992", "Rio Earth Summit", "Convention on Biological", "Diversity: conserve and", "sustainably use biodiversity", "#38bdf8"],
        [370, "2002", "Johannesburg", "World Summit on Sustainable", "Development: 190 countries", "pledged to reduce biodiversity", "#34d399"],
        [590, "2010", "Deadline", "Significant reduction in the", "current rate of biodiversity", "loss at global, regional", "#f59e0b"]
      ];
      for(var i = 0; i < 3; i++){
        m += L.circle(events[i][0], 130, 10, events[i][6]);
        m += L.text(events[i][0], 106, events[i][1], {size: 16, color: events[i][6], weight: 700});
        m += L.text(events[i][0], 158, events[i][2], {size: 12.5, color: C.text, weight: 700});
        for(var j = 0; j < 3; j++){
          m += L.text(events[i][0], 180 + j * 16, events[i][3 + j], {size: 10.5, color: C.muted});
        }
      }
      var y = Math.round(st.year);
      var stage = y < 1992 ? "before Rio" : (y < 2002 ? "after Rio 1992" : (y < 2010 ? "after Johannesburg 2002" : "2010 deadline reached"));
      m += L.text(360, 262, "Year " + L.num(y, 0) + ": " + stage + ". Biodiversity knows no political boundaries — conservation is a collective responsibility.", {size: 12.5, color: C.text});
      m += L.text(360, 286, "The 2002 Johannesburg pledge: 190 countries, and a significant reduction of biodiversity loss by 2010.", {size: 12, color: C.muted});
      L.readout([
        ["year", L.num(y, 0), "#f59e0b"],
        ["Rio", "1992", "#38bdf8"],
        ["Johannesburg", "2002 · 190 countries", "#34d399"],
        ["pledge", "by 2010", "#f59e0b"]
      ]);
      L.verdict("<b>Section 13.2.2:</b> biodiversity knows no political boundaries, so its conservation is a collective responsibility of all nations. The historic <b>Convention on Biological Diversity ('The Earth Summit') held in Rio de Janeiro in 1992</b> called upon all nations to conserve biodiversity and sustainably use its benefits. In a follow-up, the <b>World Summit on Sustainable Development held in Johannesburg in 2002</b> saw <b>190 countries</b> pledge to achieve, by <b>2010</b>, a significant reduction in the current rate of biodiversity loss at global, regional and local levels.");
    }
    L.svg(m, "Conservation bench, view: " + st.mode, 300);
  }

  function select(id){
    st.mode = id;
    if(id === "summits"){
      st.year = 2002;
      var s = document.getElementById("l5-year");
      if(s) s.value = "2002";
      L.setVal("l5-year", L.num(2002, 0));
    }
    L.markPreset(id);
    draw();
  }

  function mount(){
    labNoTimeline();
    L.presets([
      ["insitu", "1 · In situ"],
      ["exsitu", "2 · Ex situ"],
      ["hotspots", "3 · Hotspots: 34"],
      ["summits", "4 · Summits timeline"]
    ], st.mode, select);
    L.controls(L.slider("l5-year", "Summit timeline year", 1992, 2010, 1, st.year, L.num(st.year, 0)));
    L.onInput("l5-year", function(v){ st.year = v; L.setVal("l5-year", L.num(v, 0)); draw(); });
    L.legend([["#34d399", "in situ"], ["#38bdf8", "ex situ"], ["#f59e0b", "hotspots"], ["#a78bfa", "sacred groves"]]);
    draw();
  }

  window.SIMS.conserve = {mount: mount, draw: draw, select: select, state: st};
})();

if (window.App && typeof window.App.routeFromHash === "function") {
  window.App.routeFromHash();
}
</script>
</body>
</html>
