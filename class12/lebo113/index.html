<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 13: Biodiversity and Conservation — Interactive Textbook</title>
<style>

:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
  margin: 0;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
}
/* width:100% stops main from sizing to the scrolling concept list's content width */
main { min-width: 0; width: 100%; }

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav, .revision-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover, .revision-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active, .revision-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num, .revision-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num, .revision-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  .topbar {
    padding: 0 10px;
    height: 56px;
  }
  .chapter-crumb {
    display: none !important;
  }
  .top-actions {
    gap: 6px;
  }
  .progress-pill span:first-child {
    display: none !important;
  }
  .progress-pill progress {
    width: 44px;
  }
  .toolbar-btn {
    padding: 4px 8px;
    font-size: 12px;
  }
  main { padding: 16px 12px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
.concept-title {
  font: 34px/1.2 Georgia, "Times New Roman", serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.3px;
}
@media (max-width: 640px) {
  .concept-title { font-size: 27px; }
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
  min-width: 0;
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 2px 16px;
  font-size: 12.5px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  max-height: 460px;
  touch-action: pan-y;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  /* No text-transform: labels contain case-sensitive symbols such as s₁, u, t. */
  font-size: 12px;
  color: #94a3b8;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font-size: 16px;
  line-height: 1.35;
  font-weight: 700;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: var(--radius-sm);
  position: relative;
  overflow: hidden;
  border: none;
  padding: 0;
  cursor: pointer;
  display: block;
}
.video-facade img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
}
.play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 48px;
  height: 48px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.video-title {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 8px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  color: #fff;
  font-size: 12px;
  text-align: left;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font-size: 16.5px;
  line-height: 1.5;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;

window.CHAPTER = {"code": "lebo113", "chapterNumber": 13, "book_name": "Biology", "title": "Biodiversity and Conservation", "subtitle": "Levels and counts of biodiversity, latitudinal and species–area patterns, the Evil Quartet of loss, and why and how to conserve — hotspots, reserves, groves and summits.", "edition": "NCERT Biology, Class 12 (Reprint 2026–27)", "source": "https://ncert.nic.in/textbook/pdf/lebo113.pdf", "page_start": 1, "page_end": 13, "exercisesNote": "All 10 questions from the NCERT exercises (PDF pp. 11–12); the chapter counts no intext questions. COORD/groundtruth/lebo113.json reports no printed folios in the source extraction (hasFolios=false, pageOffset=null), so printPage = PDF page (offset 0); page 1 is the chapter opener and page 13 is the NOTES page. Each question is mapped to the concept it practises with a full step-by-step solution kept faithful to the NCERT text and its printed key where one exists.", "lessons": [{"id": "levels-counts", "nav": "Levels & species counts", "group": "01 / LEVELS & SPECIES COUNTS", "title": "Three levels of biodiversity — and how many species exist", "deck": "Genetic, species and ecological diversity: Rauwolfia reserpine across Himalayan ranges, 50,000 rice strains, Western Ghats amphibians, and India's 2.4% land holding 8.1% of species. IUCN 2004 lists 1.5 million described; Robert May estimates about 7 million.", "minutes": 9, "section": "13.1, 13.1.1", "pages": [1, 4], "print": "1–4", "sim": "biodivlevels", "simTitle": "Three-level diversity bench + species counters", "watch": "Switch between the three levels, then the counts and India panels. The described-species slider splits Robert May's 7-million estimate: at the IUCN baseline of 1.5 million, only about 22 per cent of species are recorded.", "quick": ["<strong>Biodiversity</strong> is the term popularised by the sociobiologist <strong>Edward Wilson</strong> to describe the combined diversity at all levels of biological organisation, from macromolecules within cells to biomes. The most important levels are three: <strong>(i) genetic diversity</strong>, <strong>(ii) species diversity</strong> and <strong>(iii) ecological diversity</strong>.", "<strong>Genetic diversity:</strong> a single species shows high diversity over its distributional range — the medicinal plant <strong>Rauwolfia vomitoria</strong> growing in different Himalayan ranges varies in the potency and concentration of the active chemical <strong>reserpine</strong>. India has more than <strong>50,000 genetically different strains of rice and 1,000 varieties of mango</strong>. <strong>Species diversity:</strong> the Western Ghats have a greater amphibian species diversity than the Eastern Ghats. <strong>Ecological diversity:</strong> India, with deserts, rain forests, mangroves, coral reefs, wetlands, estuaries and alpine meadows, has greater ecosystem diversity than a Scandinavian country like Norway.", "How many species exist? The <strong>IUCN (2004)</strong> records slightly more than <strong>1.5 million</strong> described plant and animal species, but estimates of the undiscovered range from <strong>20–50 million</strong> at the extreme to a conservative, scientifically sound <strong>about 7 million by Robert May</strong>. More than <strong>70 per cent</strong> of recorded species are animals while plants (including algae, fungi, bryophytes, gymnosperms and angiosperms) are no more than <strong>22 per cent</strong>; among animals, <strong>insects exceed 70 per cent — out of every 10 animals, 7 are insects</strong>. Fungi species outnumber the combined species of fishes, amphibians, reptiles and mammals, and prokaryote numbers are unknown because conventional taxonomic methods fail and many species are not culturable.", "Although India has only <strong>2.4 per cent of the world's land area</strong>, its share of global species diversity is <strong>8.1 per cent</strong>, making it one of the <strong>12 mega diversity countries</strong>: nearly <strong>45,000 plant species and twice as many animal species</strong> are recorded. Accepting May's estimate, only <strong>22 per cent</strong> of species are recorded, so probably more than <strong>1,00,000 plant and 3,00,000 animal species</strong> await discovery — yet a large fraction faces extinction before discovery: <strong>nature's biological library is burning even before we catalogued the titles</strong>."], "formulas": [{"label": "Insect dominance", "html": "> 70% of animals are insects ⇒ 7 of every 10 animals is an insect", "cond": "§13.1.1; Figure 13.1"}, {"label": "India's share", "html": "2.4% of land area → 8.1% of global species diversity (12 mega-diversity countries)", "cond": "§13.1.1"}, {"label": "Recorded fraction", "html": "≈ 1.5 million described / ≈ 7 million (May) ≈ 22% recorded", "cond": "IUCN 2004; May estimate"}], "deeper": "May's estimate is an extrapolation: species inventories are more complete in temperate than tropical countries, so biologists compare temperate–tropical richness of an exhaustively studied insect group and extend that ratio to other animals and plants. The opener's scale-setting numbers — 20,000 ants, 3,00,000 beetles, 28,000 fishes, nearly 20,000 orchids — show why the tropics, where most undiscovered species wait, dominate the missing fraction. Prokaryotes are excluded from the tallies: accepting biochemical or molecular species criteria, their diversity alone might run into millions.", "worked": {"title": "How many species are still undiscovered? (Exercises 2 and 9)", "problem": "Only about 1.5 million species are described of Robert May's estimated 7 million. What fraction is recorded, and how many Indian plants and animals may still await discovery?", "given": "IUCN (2004) records slightly more than 1.5 million described plant and animal species; Robert May's conservative global estimate is about 7 million. India has nearly 45,000 recorded plant species and twice as many recorded animals; plants are no more than 22 per cent of recorded species and animals more than 70 per cent.", "steps": ["Recorded fraction = 1.5/7 × 100 ≈ 21.4 per cent, which the textbook rounds to 22 per cent of total species.", "Applying that proportion to India: 45,000 recorded plants ≈ 22 per cent of the true plant total, so total plants ≈ 45,000/0.22 ≈ 2,05,000.", "Undiscovered Indian plants ≈ 2,05,000 − 45,000 ≈ 1,60,000 — matching the text's 'more than 1,00,000 plant species'.", "Animal records are twice the plant count (≈90,000); at 22 per cent recorded the total ≈ 4,09,000, leaving more than 3,00,000 animal species to be discovered."], "answer": "About 22 per cent of species are recorded (≈1.5 million of ≈7 million). India may still hold more than 1,00,000 plant and more than 3,00,000 animal species awaiting discovery."}, "prediction": {"prompt": "If Robert May's global estimate (~7 million) is right and only ~1.5 million species are described, what fraction of Earth's species is recorded, and what does it imply for India (45,000 plants recorded)?", "options": ["About 22% recorded — so India likely holds >1,00,000 plant species still undiscovered", "Nearly 100% recorded — India's inventory is essentially complete", "About 50% recorded — India holds only a few thousand more plants"], "answer": 0, "explanation": "1.5/7 ≈ 0.21 (≈22% in text). Applying that proportion to India's 45,000 recorded plants gives ~2,05,000 total, i.e. over 1,00,000 still to be discovered (§13.1.1)."}, "connect": [{"title": "Rauwolfia: Himalayan chemistry varies by range", "text": "The antihypertensive reserpine from Rauwolfia vomitoria differs in potency and concentration between Himalayan ranges — genetic diversity you can dose. Drug prospectors must sample many populations, not one, because the same species is chemically different valley to valley."}, {"title": "50,000 rices, 1,000 mangoes", "text": "India's more than 50,000 genetically different strains of rice and 1,000 varieties of mango are genetic diversity on the dinner plate — the raw material every future flood-tolerant paddy or disease-resistant orchard will be bred from."}, {"title": "Wow: nature's library is burning before it is catalogued", "text": "With only about 22 per cent of species recorded, a large fraction faces extinction before we even discover and name it — the textbook's 'nature's biological library is burning even before we catalogued the titles'. India alone is one of the 12 mega diversity countries, holding 8.1 per cent of global species on 2.4 per cent of the land.", "wow": true, "links": [{"t": "NCERT §13.1.1 — official chapter PDF", "u": "https://ncert.nic.in/textbook/pdf/lebo113.pdf"}, {"t": "Khan Academy: Species diversity on Earth and in India", "u": "https://www.youtube.com/watch?v=slGoBwKN4v0"}], "video": {"id": "w0Y2XTNdN0E", "title": "Biodiversity | Biodiversity and Conservation | Class XII | Biology | Khan Academy", "channel": "Khan Academy India - English"}}], "recall": "Name the three levels of biodiversity with one Indian example each, and state the 1.5M/7M/22% figures with India's 2.4%/8.1% share.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The three important components of biodiversity are", "options": ["genetic, species and ecological diversity", "plant, animal and microbial diversity", "forest, desert and marine diversity"], "answer": 0, "hint": "Section 13.1 lists three levels, (i), (ii) and (iii).", "solution": "Genetic (Rauwolfia reserpine and rice strains), species (Western Ghats amphibians) and ecological (India's biomes versus Norway).", "wrong": ["", "That groups organisms by kingdom, not by level of biological organisation.", "Those are examples of ecological diversity only."]}, {"level": "Medium", "type": "number", "prompt": "If 1.5 million species are described of an estimated 7 million, the recorded percentage is", "answer": 21.4, "unit": "%", "tolerance": 1.0, "hint": "1.5/7 × 100.", "solution": "1.5/7 × 100 ≈ 21.4 per cent, which the text rounds to 22 per cent recorded."}, {"level": "Hard", "type": "number", "prompt": "Out of every 10 recorded animals, how many are insects?", "answer": 7, "unit": "insects", "tolerance": 0.1, "hint": "More than 70 per cent of all recorded animals are insects.", "solution": "7 of every 10 animals on the planet are insects."}]}, {"id": "patterns-diversity", "nav": "Patterns: latitude & area", "group": "02 / PATTERNS: LATITUDE & AREA", "title": "Latitudinal gradients and the species–area equation", "deck": "Diversity falls from equator to poles — Colombia 1,400 birds vs Greenland 56 — and rises with area as log S = log C + Z log A, with Z = 0.1–0.2 locally and 0.6–1.2 across continents (1.15 for frugivores).", "minutes": 9, "section": "13.1.2", "pages": [4, 5], "print": "4–5", "sim": "latarea", "simTitle": "Latitude transect and species–area explorer", "watch": "Start on the latitude transect, then try local and continental Z. On the species–area graph, doubling the explored area multiplies richness by 2^Z — about 1.11 locally but 2.22 across continents.", "quick": ["<strong>Latitudinal gradients:</strong> species diversity decreases as we move away from the equator towards the poles; with very few exceptions, the <strong>tropics (23.5° N to 23.5° S)</strong> harbour more species than temperate or polar areas. <strong>Colombia</strong> near the equator has nearly <strong>1,400 bird species</strong> while <strong>New York (41° N) has 105 and Greenland (71° N) only 56</strong>; India, largely tropical, has more than <strong>1,200 bird species</strong>. A tropical forest (Ecuador) holds up to <strong>10 times</strong> the vascular-plant species of an equal temperate area (Midwest USA).", "The largely tropical <strong>Amazonian rain forest</strong> has Earth's greatest biodiversity: more than <strong>40,000 plants, 3,000 fishes, 1,300 birds, 427 mammals, 427 amphibians, 378 reptiles and over 1,25,000 invertebrates</strong>, with at least <strong>two million insect species</strong> estimated still to be discovered and named there. Three hypotheses explain tropical richness: <strong>(a)</strong> speciation is a function of time — tropics, unlike glaciated temperate zones, were undisturbed for millions of years; <strong>(b)</strong> tropical environments are less seasonal, more constant and predictable, promoting niche specialisation; <strong>(c)</strong> more solar energy gives higher productivity, indirectly favouring diversity.", "<strong>Species–area relationships:</strong> Alexander von Humboldt observed in South American jungles that species richness increases with explored area, but only up to a limit — a <strong>rectangular hyperbola</strong> for angiosperms, birds, bats and freshwater fishes, becoming a <strong>straight line on a logarithmic scale</strong>: <strong>log S = log C + Z log A</strong>, where S = species richness, A = area, Z = slope (regression coefficient), C = Y-intercept. Ecologists find <strong>Z in 0.1–0.2</strong> regardless of group or region (plants in Britain, birds in California, molluscs in New York), but across very large areas like entire continents the slope steepens to <strong>Z = 0.6–1.2</strong> — e.g. <strong>1.15 for frugivorous birds and mammals</strong> of tropical forests on different continents."], "formulas": [{"label": "Species–area (log form)", "html": "log S = log C + Z log A", "cond": "§13.1.2; straight line on log scale"}, {"label": "Local Z", "html": "Z = 0.1–0.2 (Britain plants, California birds, New York molluscs)", "cond": "Within-region slopes"}, {"label": "Continental Z", "html": "Z = 0.6–1.2; frugivorous birds/mammals = 1.15", "cond": "Across continents; Exercise 4"}], "deeper": "Figure 13.2 carries the warning that the straight line lives only on the log scale; on the arithmetic scale the curve flattens toward a limit — Humboldt's 'only up to a limit'. Steeper continental slopes mean richness accumulates far faster with area when whole biogeographic realms (with distinct evolutionary histories and endemic radiations) are pooled than when sampling nested plots within one region.", "worked": {"title": "Exercise 4: what the slope Z of the species–area line tells us", "problem": "Two surveys double their explored area — one within a single region (Z ≈ 0.15), the other across entire continents (Z = 1.15). How much richer does each become, and why?", "given": "On the log scale the species–area relationship is log S = log C + Z log A, so S₂/S₁ = (A₂/A₁)^Z. Within-region Z = 0.1–0.2 (plants in Britain, birds in California, molluscs in New York); across continents Z = 0.6–1.2; frugivorous birds and mammals of tropical forests give 1.15.", "steps": ["log S = log C + Z log A is a straight line whose slope Z is the regression coefficient: S scales as A^Z.", "Doubling the area makes A₂/A₁ = 2, so the richness multiplier is 2^Z.", "Within one region, Z = 0.15 gives 2^0.15 ≈ 1.11 — only about 11 per cent more species, because the same species pool is being resampled more thoroughly.", "Across continents, Z = 1.15 gives 2^1.15 ≈ 2.22 — richness more than doubles, because each new area brings its own endemic species never encountered before."], "answer": "Z measures how fast richness accumulates with area: shallow (0.1–0.2) within one region, steep (0.6–1.2) across continents; the same doubling of area adds 11 per cent more species locally but 122 per cent more across continents."}, "prediction": {"prompt": "Two surveys double their explored area. Survey A (within one state, Z ≈ 0.15) and Survey B (across continents, Z ≈ 1.15). Which gains more new species, and why?", "options": ["B — richness scales as area^Z, and 2^1.15 ≈ 2.22 dwarfs 2^0.15 ≈ 1.11", "A — small areas always gain more species than continents", "Both gain equally — Z is constant everywhere"], "answer": 0, "explanation": "S ∝ A^Z, so the multiplier on doubling is 2^Z. Continental sampling crosses endemic faunas (steep Z); local sampling resamples one pool (shallow Z)."}, "connect": [{"title": "India's 1,200+ birds are latitude at work", "text": "Much of India lies in the tropics, so its more than 1,200 bird species sit on the Colombia end of the gradient, not the Greenland end — comparing a Western Ghats bird list with a Ladakh one replays the chapter's transect."}, {"title": "The Amazon's two million unnamed insects", "text": "Scientists estimate that at least two million insect species in the Amazon rain forest still await discovery and naming — more than every species described from India. One rain forest's backlog exceeds a mega-diversity country's catalogue."}, {"title": "Wow: the same doubling, two different worlds", "text": "Doubling the explored area adds only about 11 per cent more species inside one region (Z ≈ 0.15), but 122 per cent more across continents (2^1.15 ≈ 2.22) because each new realm brings its own endemic radiations. The slope of the species–area line is a measure of evolutionary novelty per hectare.", "wow": true, "links": [{"t": "Wikipedia: Species–area relationship", "u": "https://en.wikipedia.org/wiki/Species%E2%80%93area_relationship"}, {"t": "Khan Academy: Latitudinal gradients of biodiversity", "u": "https://www.youtube.com/watch?v=6Hh_0AFi9Pc"}], "video": {"id": "WzYoTN-Tbdg", "title": "Species-Area Relationships | Biodiversity and Conservation | Class XII | Biology | Khan Academy", "channel": "Khan Academy India - English"}}], "recall": "State the latitudinal gradient with the Colombia/New York/Greenland bird numbers, the three tropic hypotheses, and log S = log C + Z log A with both Z ranges.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The latitudinal gradient in diversity states that species diversity", "options": ["decreases from the equator towards the poles", "increases from the equator towards the poles", "is independent of latitude"], "answer": 0, "hint": "Colombia has nearly 1,400 bird species against Greenland's 56.", "solution": "With very few exceptions the tropics (23.5° N–23.5° S) harbour more species than temperate or polar areas.", "wrong": ["", "That reverses the Colombia–Greenland pattern.", "The bird counts across latitudes refute this."]}, {"level": "Medium", "type": "number", "prompt": "Richness multiplier on doubling the explored area when Z = 1.15 (2^1.15)", "answer": 2.22, "unit": "×", "tolerance": 0.05, "hint": "S₂/S₁ = (A₂/A₁)^Z = 2^1.15.", "solution": "2^1.15 ≈ 2.22 — richness more than doubles across continents."}, {"level": "Hard", "type": "number", "prompt": "Richness multiplier on doubling the explored area when Z = 0.15 (2^0.15)", "answer": 1.11, "unit": "×", "tolerance": 0.03, "hint": "Same formula with the shallow local slope.", "solution": "2^0.15 ≈ 1.11 — only about 11 per cent more species locally."}]}, {"id": "loss-evil-quartet", "nav": "Loss & Evil Quartet", "group": "03 / LOSS & THE EVIL QUARTET", "title": "Why diversity matters — and the Evil Quartet destroying it", "deck": "Tilman's plots and Ehrlich's rivet-popper show diverse communities are stable and productive. Yet the IUCN Red List (2004) records 784 extinctions, current rates run 100–1,000× faster, and four human causes — the Evil Quartet — drive the Sixth Extinction.", "minutes": 9, "section": "13.1.3, 13.1.4", "pages": [5, 8], "print": "5–8", "sim": "evilquartet", "simTitle": "Evil Quartet sorter and Red List ledger", "watch": "Step through the four causes and the Red List ledger: the 338 + 359 + 87 bars add to 784 extinctions in 500 years. In the rivet bench, watch how removing wing rivets (key species) weakens the ecosystem-airplane far faster than removing seat rivets.", "quick": ["Does species number matter to ecosystem functioning? <strong>David Tilman's long-term outdoor-plot experiments</strong> found plots with more species showed <strong>less year-to-year variation in biomass</strong> and <strong>higher productivity</strong>. A stable community varies little in productivity, resists or recovers from disturbance, and resists alien invasion — and the text's questions bite: would the Western Ghats work as well minus one tree-frog species, or Earth with 15,000 ant species instead of 20,000? Stanford ecologist <strong>Paul Ehrlich's rivet-popper hypothesis</strong> answers by analogy: species are rivets on the ecosystem-airplane; popping a few seems harmless, but cumulative loss weakens flight, and <strong>losing wing rivets (key species driving major functions) is graver than losing seat rivets</strong>.", "Losses are certain while new species (speciation) are doubtful. Colonisation of tropical Pacific islands wiped out <strong>more than 2,000 native bird species</strong>; the <strong>IUCN Red List (2004)</strong> documents <strong>784 extinctions in the last 500 years — 338 vertebrates, 359 invertebrates and 87 plants</strong>, including the <strong>dodo (Mauritius), quagga (Africa), thylacine (Australia), Steller's Sea Cow (Russia)</strong> and three tiger subspecies (<strong>Bali, Javan, Caspian</strong>), with <strong>27 species lost in the last twenty years alone</strong>. Over <strong>15,500 species</strong> face extinction: <strong>12% of birds, 23% of mammals, 32% of amphibians, 31% of gymnosperms</strong>; amphibians are the most vulnerable group. Five mass extinctions struck across >3 billion years, but the present <strong>Sixth Extinction runs 100–1,000 times faster</strong> than pre-human rates — at current trends <strong>nearly half of all species could vanish within 100 years</strong>, lowering plant production, drought resistance and stabilising pest, water-use and productivity cycles.", "The accelerated losses are human-driven — <strong>'The Evil Quartet'</strong>: <strong>(i) Habitat loss and fragmentation</strong>, the most important cause — rain forests fell from <strong>14% to 6%</strong> of land surface and <strong>1,000 more hectares vanish while you read the chapter</strong>; the <strong>Amazon ('lungs of the planet')</strong> is cleared for soya beans and beef cattle, pollution degrades the rest, and fragments doom wide-ranging mammals, birds and migrants. <strong>(ii) Over-exploitation</strong> — need turned to greed: Steller's sea cow and the passenger pigeon in 500 years, now over-harvested marine fishes. <strong>(iii) Alien species invasions</strong> — Nile perch in Lake Victoria exterminated <strong>200+ endemic cichlid fishes</strong>; carrot grass (<strong>Parthenium</strong>), <strong>Lantana</strong>, water hyacinth (<strong>Eichhornia</strong>) and illegal African catfish (<strong>Clarias gariepinus</strong>) threaten India's natives. <strong>(iv) Co-extinctions</strong> — obligate partners die together: host fish with its parasites, coevolved plant with its pollinator."], "formulas": [{"label": "Red List 2004 toll", "html": "784 extinctions = 338 vertebrates + 359 invertebrates + 87 plants (500 years)", "cond": "§13.1.4"}, {"label": "Sixth Extinction rate", "html": "current rates ≈ 100–1,000× pre-human; ~50% of species at risk in 100 years", "cond": "§13.1.4"}, {"label": "Evil Quartet", "html": "habitat loss/fragmentation + over-exploitation + alien invasion + co-extinction", "cond": "§13.1.4; Exercise 5"}], "deeper": "The Summary rounds the toll as 'nearly 700 species extinct in recent times' with more than 15,500 threatened — of which over 650 are from India — consistent with the 784 Red List entries once subspecies and recently vanished taxa are grouped. Extinctions are taxonomically non-random: the 32% threat figure for amphibians (against 12% for birds) flags permeable skins, dual aquatic–terrestrial life and narrow ranges as vulnerability multipliers.", "worked": {"title": "Exercise 6: diversity, stability and Ehrlich's rivet-popper", "problem": "How does biodiversity keep an ecosystem functioning, and why does the identity of a lost species matter as much as the number lost?", "given": "David Tilman's long-term outdoor-plot experiments; a stable community shows little year-to-year variation in productivity, is resistant or resilient to disturbance, and resists invasions by alien species. Paul Ehrlich's rivet-popper analogy.", "steps": ["Tilman found that plots with more species showed less year-to-year variation in total biomass and higher productivity.", "A stable community therefore varies little in productivity, recovers from disturbance and repels alien invasions — diversity underpins all three.", "Ehrlich's analogy treats species as rivets on the ecosystem-airplane: popping a few seems harmless at first, but cumulative loss makes the plane dangerously weak over time.", "Removing rivets on the wings (key species that drive major functions) threatens flight safety far more than removing a few seat or window rivets (redundant species) — identity matters."], "answer": "Diversity brings stability, higher productivity and invasion resistance; the rivet-popper warns that losing key species (wing rivets) can crash ecosystem function long before total species loss looks severe."}, "prediction": {"prompt": "A developer clears half a forest, hunts its pheasants for feasts, stocks the lake with Nile-perch-like predators, and the forest's sole pollinator-dependent orchid vanishes with its bee. How many of the Evil Quartet acted?", "options": ["All four — fragmentation, over-exploitation, alien invasion and co-extinction", "Only one — habitat loss covers everything", "Two — hunting and fishing are the same cause"], "answer": 0, "explanation": "Clearing/fragments = (i); hunting = (ii); stocked predator = (iii); orchid following its bee = (iv) co-extinction."}, "connect": [{"title": "Project Tiger and the Bali–Javan–Caspian warning", "text": "Three tiger subspecies — Bali, Javan and Caspian — are already extinct, while India's surviving tigers were saved only by protecting whole forests. The textbook's 'save the entire forest to save the tiger' is Project Tiger's founding logic."}, {"title": "1,000 hectares while you read", "text": "The text clocks rain-forest loss at 1,000 hectares per chapter-read — roughly two Kaziranga core zones per sitting. Habitat loss is not a statistic but a stopwatch."}, {"title": "Wow: a sixth extinction running 100–1,000 times faster", "text": "Five mass extinctions unfolded over more than 3 billion years, but the present one is different — extinction rates are estimated at 100 to 1,000 times the pre-human background, and if present trends continue nearly half of all species could be wiped out within 100 years. The IUCN Red List (2004) already records 784 extinctions in 500 years.", "wow": true, "links": [{"t": "IUCN Red List", "u": "https://www.iucnredlist.org/"}, {"t": "Wikipedia: Holocene extinction", "u": "https://en.wikipedia.org/wiki/Holocene_extinction"}], "video": {"id": "hSiOCVfbsos", "title": "Loss of biodiversity - the evil quartet | Biodiversity and conservation | Biology | Khan Academy", "channel": "Khan Academy India - English"}}], "recall": "State the rivet-popper analogy (wings vs seats), the 784/338/359/87 toll with four named extinctions, the 100–1,000× rate, and all four Evil Quartet causes with one example each.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The most important cause driving animals and plants to extinction is", "options": ["habitat loss and fragmentation", "co-extinction", "over-exploitation alone"], "answer": 0, "hint": "Section 13.1.4 ranks the first member of the Evil Quartet.", "solution": "Habitat loss and fragmentation — rain-forest cover fell from 14 per cent to 6 per cent — tops the list.", "wrong": ["", "Co-extinction follows a primary extinction; it is not the leading cause.", "Over-exploitation is second, not first."]}, {"level": "Medium", "type": "number", "prompt": "Total Red List (2004) extinctions: 338 vertebrates + 359 invertebrates + 87 plants", "answer": 784, "unit": "species", "tolerance": 0.5, "hint": "Add the three tallies.", "solution": "338 + 359 + 87 = 784 species in the last 500 years."}, {"level": "Hard", "type": "number", "prompt": "Endemic cichlid species lost to the Nile perch in Lake Victoria (minimum stated)", "answer": 200, "unit": "species", "tolerance": 1, "hint": "More than … species of cichlid fish.", "solution": "More than 200 ecologically unique cichlid species."}]}, {"id": "why-conserve", "nav": "Why conserve", "group": "04 / WHY CONSERVE", "title": "Why conserve: narrow, broad and ethical reasons", "deck": "Over 25% of drugs come from plants and 25,000 serve traditional medicine; the Amazon makes 20% of atmospheric oxygen; pollinators, flood control and a bulbul's song complete the case — plus a moral duty to future generations.", "minutes": 8, "section": "13.2.1", "pages": [8, 9], "print": "8–9", "sim": "whysave", "simTitle": "Why-conserve bench: narrow · broad · ethical", "watch": "Switch between the narrow, broad and ethical arguments. In the narrow bench the drug slider splits plant-derived from synthetic; the broad and services panels show why pollination, flood control and the Amazon's oxygen service are ecosystem services.", "quick": ["Reasons group into three categories — <strong>narrowly utilitarian, broadly utilitarian and ethical</strong>. The <strong>narrowly utilitarian</strong> case is direct economics: food (cereals, pulses, fruits), firewood, fibre, construction material, industrial products (<strong>tannins, lubricants, dyes, resins, perfumes</strong>) and medicines. More than <strong>25 per cent of drugs</strong> sold worldwide derive from plants, <strong>25,000 plant species</strong> feed traditional medicines of native peoples, unknown rain-forest plants await screening, and <strong>bioprospecting</strong> (exploring molecular, genetic and species-level diversity for economic products) lets biodiversity-rich nations reap enormous benefits.", "The <strong>broadly utilitarian</strong> case is ecosystem services: the fast-dwindling <strong>Amazon forest produces about 20 per cent of Earth's atmospheric oxygen</strong> via photosynthesis — price it against a hospital oxygen cylinder. <strong>Pollination</strong> by bees, bumblebees, birds and bats gives fruits and seeds — price farming without them. Forests also deliver flood control, soil-erosion control, pest control and climate moderation, plus intangible aesthetics: thick woods, spring flowers, a <strong>bulbul's song</strong> at dawn.", "The <strong>ethical</strong> case: we owe millions of plant, animal and microbe co-inhabitants recognition of <strong>intrinsic value</strong> beyond current economic use, with a <strong>moral duty</strong> to care for their well-being and pass our biological legacy in good order to future generations."], "formulas": [{"label": "Medicine share", "html": "> 25% of marketed drugs from plants; 25,000 species in traditional medicine", "cond": "§13.2.1 narrowly utilitarian"}, {"label": "Oxygen service", "html": "Amazon ≈ 20% of atmospheric O₂ via photosynthesis", "cond": "§13.2.1 broadly utilitarian"}, {"label": "Three reasons", "html": "narrowly utilitarian + broadly utilitarian + ethical", "cond": "§13.2.1; Exercise 8"}], "deeper": "Exercise 8 (floods and erosion) is the broadly-utilitarian mechanism made concrete: plant roots bind soil, canopy and litter slow runoff and/demo(so the biotic cover meters water release, traps silt and checks erosion — services that vanish with the cover. Bioprospecting closes the loop back to Lesson 1: Rauwolfia's reserpine is exactly the kind of molecular dividend the narrowly-utilitarian argument prices.", "worked": {"title": "Exercise 8: how biotic cover controls floods and soil erosion", "problem": "Flood control and soil-erosion control are ecosystem services. How do the biotic components of an ecosystem deliver them?", "given": "The broadly utilitarian argument (§13.2.1): biodiversity provides ecosystem services including flood control, soil-erosion control, pest control and climate moderation. The biotic components are the plant canopy, leaf litter and roots.", "steps": ["Canopy and leaf litter intercept rainfall and slow the runoff that would otherwise reach rivers as a flood pulse.", "Roots bind soil particles into a coherent matrix, so topsoil resists being washed away down the slope.", "Slowed water drops its suspended silt in the catchment instead of choking river channels downstream.", "Remove the plant cover and all three effects reverse — faster runoff, eroded slopes and silted rivers — so the service exists only while its providers live."], "answer": "Canopy and litter slow runoff while roots bind the soil; together they meter water release, trap silt and check erosion — a broadly utilitarian service that vanishes with the biotic cover."}, "prediction": {"prompt": "A planner says: 'Rauwolfia's reserpine earns revenue, bees pollinate our mangoes free, and the bulbul's song is priceless — but only one argument covers all three.' Which classification is right?", "options": ["Reserpine is narrowly utilitarian, mango pollination broadly utilitarian, the bulbul's song broadly utilitarian (intangible) — three values, two categories", "All three are narrowly utilitarian market goods", "All three are ethical arguments with no economic content"], "answer": 0, "explanation": "Direct products (drugs) = narrow; services and aesthetics (oxygen, pollination, song, flood control) = broad; intrinsic-value duty = ethical."}, "connect": [{"title": "Rauwolfia to vincristine: India's medicine chest", "text": "From Himalayan Rauwolfia (reserpine) to Madagascar's periwinkle (vincristine), plant molecules became hypertension and cancer drugs — the 'more than 25 per cent of drugs from plants' statistic is India's Ayurvedic garden and modern pharma in one number."}, {"title": "Price a breath, then save a forest", "text": "Hospitals buy oxygen by the cylinder while the Amazon exhales about a fifth of the planet's supply free of charge. The textbook's cylinder test turns every breath into a conservation invoice."}, {"title": "Wow: the priceless argument, in four minutes", "text": "More than 25 per cent of drugs sold worldwide derive from plants, 25,000 plant species stock the traditional medicines of native peoples, and the Amazon produces about 20 per cent of atmospheric oxygen through photosynthesis. Pollination, flood control, soil retention and the bulbul's morning song are free only while their providers stay alive.", "wow": true, "links": [{"t": "Wikipedia: Biodiversity", "u": "https://en.wikipedia.org/wiki/Biodiversity"}, {"t": "NCERT §13.2.1 — official chapter PDF", "u": "https://ncert.nic.in/textbook/pdf/lebo113.pdf"}], "video": {"id": "GK_vRtHJZu4", "title": "Why is biodiversity so important? - Kim Preshoff", "channel": "TED-Ed"}}], "recall": "List the three reason-categories and, for each, two textbook examples with the 25%/25,000/20% numbers.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Bioprospecting, as defined in the chapter, is", "options": ["exploring molecular, genetic and species-level diversity for products of economic importance", "prospecting for minerals inside national parks", "counting tigers with camera traps"], "answer": 0, "hint": "Narrowly utilitarian paragraph, closing lines.", "solution": "Systematic exploration of biodiversity for products of economic importance.", "wrong": ["", "Mining is not bioprospecting.", "That is a wildlife census, not prospecting for products."]}, {"level": "Medium", "type": "number", "prompt": "Plant-derived share if 200 drugs are sampled (text: more than 25 per cent)", "answer": 50, "unit": "drugs", "tolerance": 1, "hint": "25 per cent of 200.", "solution": "At least about 50 of 200 drugs derive from plants."}, {"level": "Hard", "type": "mcq", "prompt": "The bulbul's song and spring flowers illustrate", "options": ["broadly utilitarian intangible benefits of nature", "narrowly utilitarian timber values", "the Evil Quartet's alien-invasion cause"], "answer": 0, "hint": "'Can we put a price tag on such things?'", "solution": "Aesthetic, priceless services that ecosystems provide.", "wrong": ["", "No timber is involved.", "That is a cause of loss, not a reason to conserve."]}]}, {"id": "how-conserve", "nav": "How to conserve", "group": "05 / HOW TO CONSERVE", "title": "How to conserve: in situ, ex situ, hotspots and summits", "deck": "Save the entire forest to save the tiger: 14 biosphere reserves, 90 national parks, 448 sanctuaries and sacred groves in situ; zoos, seed banks and cryopreservation ex situ; 34 hotspots (3 in India); Rio 1992 and Johannesburg 2002 pledging restraint by 2010.", "minutes": 9, "section": "13.2.2", "pages": [9, 11], "print": "9–11", "sim": "conserve", "simTitle": "Conservation matcher: in-situ · ex-situ · hotspots · summits", "watch": "Match each strategy to in situ or ex situ, count the 25 → 34 hotspots, and walk the summit timeline from Rio 1992 to the 2010 pledge. The India panel tracks the 14 / 90 / 448 protected-area estate and the sacred-grove belts.", "quick": ["Two strategies: <strong>in situ (on site)</strong> — conserve the whole ecosystem so all levels of biodiversity persist ('<strong>we save the entire forest to save the tiger</strong>'); and <strong>ex situ (off site)</strong> — when an animal or plant is <strong>endangered or threatened</strong> (very high near-future extinction risk in the wild) and needs urgent rescue outside its habitat. Because species awaiting rescue exceed resources, conservationists prioritise <strong>biodiversity hotspots</strong>: regions of very high species richness plus high <strong>endemism</strong> (species confined there and nowhere else) under accelerated habitat loss.", "Initially <strong>25 hotspots</strong> were identified, then <strong>nine more — 34 in all</strong>; together they cover <strong>less than 2% of Earth's land</strong> yet hold extreme species numbers, so strict protection could cut ongoing mass extinctions by <strong>almost 30%</strong>. <strong>Three hotspots cover India: Western Ghats and Sri Lanka, Indo-Burma and Himalaya.</strong> India's in-situ network: <strong>14 biosphere reserves, 90 national parks and 448 wildlife sanctuaries</strong> (Summary: >450 sanctuaries), plus cultural protection — <strong>sacred groves</strong> in the <strong>Khasi and Jaintia Hills (Meghalaya), Aravalli Hills (Rajasthan), Western Ghats (Karnataka, Maharashtra)</strong> and <strong>Sarguja, Chanda and Bastar (Madhya Pradesh)</strong>, with Meghalaya's groves the last refuges of many rare, threatened plants.", "<strong>Ex situ:</strong> zoological parks, botanical gardens and wildlife safari parks; some animals extinct in the wild persist only in zoos. Modern methods go further: <strong>cryopreservation of gametes</strong> (viable, fertile, long-term), <strong>in-vitro fertilisation</strong>, <strong>tissue-culture propagation</strong> of plants and <strong>seed banks</strong> holding genetic strains of commercial crops. Biodiversity ignores borders, so conservation is collective: the historic <strong>Convention on Biological Diversity ('The Earth Summit'), Rio de Janeiro, 1992</strong>, bound nations to conserve and sustainably use biodiversity; the follow-up <strong>World Summit on Sustainable Development, Johannesburg, 2002 — 190 countries</strong> — pledged a <strong>significant reduction of biodiversity loss by 2010</strong> at global, regional and local levels."], "formulas": [{"label": "Hotspot count", "html": "25 initial + 9 added = 34 hotspots; 3 cover India", "cond": "§13.2.2"}, {"label": "India's in-situ estate", "html": "14 biosphere reserves + 90 national parks + 448 sanctuaries (+ sacred groves)", "cond": "§13.2.2"}, {"label": "Summit timeline", "html": "Rio Earth Summit 1992 → Johannesburg 2002 (190 countries) → 2010 reduction pledge", "cond": "§13.2.2"}], "deeper": "In-situ vs ex-situ is triage logic: in situ protects processes (pollination webs, gene flow, succession) at landscape scale, while ex situ banks genes and individuals against imminent extinction. Hotspots concentrate effort where richness × endemism × threat is maximal — under 2% of land buying ~30% less extinction — which is why two of India's three hotspots (Western Ghats–Sri Lanka, Himalaya) coincide with its sacred-grove belts and reserve networks.", "worked": {"title": "Hotspot arithmetic: one fiftieth of the land, a third fewer extinctions", "problem": "Why do conservationists concentrate scarce resources on biodiversity hotspots, and what is the conservation payoff?", "given": "25 hotspots were identified initially, then nine more were added — 34 in all. Together they cover less than 2 per cent of Earth's land area; strict protection could reduce ongoing mass extinctions by almost 30 per cent. Three hotspots cover India: Western Ghats–Sri Lanka, Indo-Burma and Himalaya.", "steps": ["A hotspot combines very high species richness with a high degree of endemism — species confined to that region and found nowhere else — under accelerated habitat loss.", "Because the number of species awaiting rescue far exceeds conservation resources, effort is triaged to these richness × endemism × threat regions.", "The 34 hotspots cover less than 2 per cent of the land — about one fiftieth of Earth's surface.", "Strict protection of that fiftieth could cut the ongoing mass extinction rate by almost 30 per cent, the highest conservation leverage per hectare available."], "answer": "34 hotspots on less than 2 per cent of the land could avert almost 30 per cent of ongoing extinctions; three of the 34 — Western Ghats–Sri Lanka, Indo-Burma and Himalaya — cover India."}, "prediction": {"prompt": "A threatened orchid survives as 20 plants inside a Meghalaya sacred grove, and loggers approach. Which response matches the chapter's strategy ladder?", "options": ["Defend the grove in situ first (whole-habitat protection); bank seeds and tissue-culture lines ex situ as urgent backup", "Ignore the grove and only photograph the orchid for records", "Move all 20 plants to a city park and log the grove"], "answer": 0, "explanation": "In situ protects the ecosystem and its processes; ex situ (seed banks, tissue culture, cryopreservation) is the urgent complement for threatened taxa (§13.2.2)."}, "connect": [{"title": "Sacred groves: faith-fenced forests first", "text": "Long before wildlife laws, Khasi–Jaintia (Meghalaya), Aravalli (Rajasthan), Western Ghat (Karnataka, Maharashtra) and Sarguja–Chanda–Bastar (Madhya Pradesh) communities venerated whole forest tracts. India's oldest in-situ reserves were drawn by religion rather than legislation."}, {"title": "Save the forest, keep the tiger", "text": "'We save the entire forest to save the tiger' is in-situ conservation in one line: protecting the whole ecosystem protects every level of biodiversity beneath the tiger — prey, grass, pollinators and soil life included."}, {"title": "Wow: a sacred forest that has never been cut", "text": "In Meghalaya's Khasi and Jaintia Hills, sacred groves are the last refuges for many rare and threatened plants — forest tracts venerated and given total protection long before any wildlife law existed. India's formal in-situ network adds 14 biosphere reserves, 90 national parks and 448 wildlife sanctuaries.", "wow": true, "links": [{"t": "IIT KANPUR–NPTEL: Ex-situ and in-situ conservation", "u": "https://www.youtube.com/watch?v=mKlWHNFnIeI"}, {"t": "Wikipedia: Sacred grove", "u": "https://en.wikipedia.org/wiki/Sacred_grove"}], "video": {"id": "NfLcPySGYhU", "title": "Age-old legend of Mawphlang Sacred Forest and Khasi Culture", "channel": "ThePrint"}}], "recall": "Define in situ vs ex situ, list the 25→34→3 hotspot numbers, India's 14/90/448 estate with four grove regions, three ex-situ biotechnologies, and the Rio→Johannesburg→2010 timeline.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "'We save the entire forest to save the tiger' describes", "options": ["in situ (on-site) conservation", "ex situ (off-site) conservation", "co-extinction"], "answer": 0, "hint": "Protecting the whole ecosystem protects all its levels.", "solution": "In-situ conservation: ecosystem-scale, on-site protection.", "wrong": ["", "Ex situ removes organisms to zoos, gardens and banks.", "That is the joint extinction of obligate partners."]}, {"level": "Medium", "type": "number", "prompt": "Total biodiversity hotspots after nine were added to the initial 25", "answer": 34, "unit": "hotspots", "tolerance": 0.1, "hint": "25 + 9.", "solution": "34 hotspots worldwide; three cover India."}, {"level": "Hard", "type": "mcq", "prompt": "Which set lists only Indian sacred-grove regions named in the text?", "options": ["Khasi–Jaintia (Meghalaya), Aravalli (Rajasthan), Western Ghats (Karnataka/Maharashtra), Sarguja–Chanda–Bastar (MP)", "Sundarbans, Rann of Kutch, Thar, Ladakh", "Nilgiri, Anaimalai, Cardamom, Palni only"], "answer": 0, "hint": "Section 13.2.2 names four grove belts.", "solution": "The text's four grove regions, with Meghalaya's groves the last refuges for many rare and threatened plants.", "wrong": ["", "Those are biogeographic areas, not the named groves.", "Those hill ranges are not the text's grove list."]}]}], "exercises": [{"q": 1, "title": "Three components of biodiversity", "conceptIdx": 0, "page": 11, "printPage": 11, "question": "Name the three important components of biodiversity.", "given": "Section 13.1 defines the three levels of biological diversity; examples given are Rauwolfia vomitoria (genetic), Western Ghats amphibians (species) and India's deserts-to-alpine-meadows (ecological).", "steps": ["Section 13.1 lists three levels: (i) genetic diversity, (ii) species diversity, (iii) ecological diversity.", "Genetic: Rauwolfia vomitoria reserpine variation across Himalayan ranges; 50,000 rice strains, 1,000 mango varieties.", "Species: e.g. Western Ghats richer in amphibians than Eastern Ghats. Ecological: e.g. India's deserts-to-alpine-meadows vs Norway."], "answer": "Genetic diversity, species diversity and ecological (ecosystem) diversity.", "takeaway": "Genetic, species and ecological diversity are the three levels; each level needs its own conservation concern.", "conceptName": "Levels of biodiversity", "number": 1}, {"q": 2, "title": "How ecologists estimate the global species number", "conceptIdx": 0, "page": 11, "printPage": 11, "question": "How do ecologists estimate the total number of species present in the world?", "given": "IUCN (2004) records slightly more than 1.5 million described species; temperate inventories are more complete than tropical ones; extreme guesses range from 20 to 50 million while Robert May's conservative estimate is about 7 million.", "steps": ["Published records give described species (IUCN 2004: slightly more than 1.5 million), not the undiscovered total.", "Inventories are more complete in temperate than tropical countries, while most undiscovered species are tropical.", "Ecologists statistically compare temperate–tropical richness of an exhaustively studied insect group and extrapolate the ratio to other animals and plants — extreme guesses 20–50 million; Robert May's conservative estimate about 7 million."], "answer": "Temperate–tropical comparison of a well-studied insect group, extrapolated to other taxa (May: ~7 million).", "takeaway": "No one has counted every species: the estimate extrapolates the temperate–tropical richness ratio of an exhaustively studied insect group to all taxa.", "conceptName": "Species counts and estimates", "number": 2}, {"q": 3, "title": "Three hypotheses for tropical species richness", "conceptIdx": 1, "page": 12, "printPage": 12, "question": "Give three hypotheses for explaining why tropics show greatest levels of species richness.", "given": "The tropics span 23.5° N to 23.5° S; temperate regions were repeatedly glaciated; tropical environments are less seasonal, more constant and predictable; more solar energy reaches the tropics.", "steps": ["(a) Time: unlike temperate zones hit by frequent glaciations, tropical latitudes stayed relatively undisturbed for millions of years, giving long evolutionary time for diversification.", "(b) Constancy: tropical environments are less seasonal, more constant and predictable, promoting niche specialisation and greater diversity.", "(c) Productivity: more solar energy in the tropics raises productivity, which indirectly supports greater diversity."], "answer": "(a) Long undisturbed evolutionary time; (b) constant, predictable environments and niche specialisation; (c) higher solar energy and productivity.", "takeaway": "Long undisturbed time, a constant predictable climate and higher solar-energy productivity together explain why the tropics are richest.", "conceptName": "Latitudinal gradients", "number": 3}, {"q": 4, "title": "Significance of the species–area slope Z", "conceptIdx": 1, "page": 12, "printPage": 12, "question": "What is the significance of the slope of regression in a species – area relationship?", "given": "log S = log C + Z log A; within-region Z = 0.1–0.2 (plants in Britain, birds in California, molluscs in New York); across continents Z = 0.6–1.2; frugivorous birds and mammals give 1.15.", "steps": ["On the log scale, log S = log C + Z log A is a straight line whose slope is Z, the regression coefficient.", "Z measures how fast species richness accumulates with area: S scales as A^Z, so doubling area multiplies richness by 2^Z.", "Within regions Z is 0.1–0.2 (plants in Britain, birds in California, molluscs in New York); across very large areas like continents Z steepens to 0.6–1.2 (frugivorous birds/mammals: 1.15) — steeper slopes mean new areas add many previously unencountered (endemic) species."], "answer": "Z is the rate of species accumulation with area (S ∝ A^Z); ~0.1–0.2 locally, 0.6–1.2 across continents.", "takeaway": "Z measures how fast richness accumulates with area (S ∝ A^Z): shallow within a region, steep across continents with their endemic faunas.", "conceptName": "Species–area relationship", "figure": "13.2", "number": 4}, {"q": 5, "title": "Major causes of species losses", "conceptIdx": 2, "page": 12, "printPage": 12, "question": "What are the major causes of species losses in a geographical region?", "given": "Habitat loss and fragmentation (the most important cause; rain forests fell from 14 per cent to 6 per cent), over-exploitation, alien species invasions and co-extinctions (§13.1.4).", "steps": ["The accelerated losses are human-driven: 'The Evil Quartet'. (i) Habitat loss and fragmentation — the most important cause (rain forests 14% to 6%; Amazon cleared for soya/beef; fragments doom wide-ranging and migratory species).", "(ii) Over-exploitation — need turned to greed (Steller's sea cow, passenger pigeon; over-harvested marine fishes). (iii) Alien species invasions (Nile perch vs 200+ Lake Victoria cichlids; Parthenium, Lantana, Eichhornia; Clarias gariepinus vs native catfishes).", "(iv) Co-extinctions — obligate partners die together (host fish and its parasites; coevolved plant–pollinator pairs)."], "answer": "The Evil Quartet: habitat loss/fragmentation, over-exploitation, alien invasion, co-extinction.", "takeaway": "The Evil Quartet — habitat loss/fragmentation, over-exploitation, alien invasion and co-extinction — is entirely human-driven.", "conceptName": "The Evil Quartet", "number": 5}, {"q": 6, "title": "Biodiversity and ecosystem functioning", "conceptIdx": 2, "page": 12, "printPage": 12, "question": "How is biodiversity important for ecosystem functioning?", "given": "Tilman's long-term outdoor-plot experiments; a stable community shows little year-to-year productivity variation, resists or recovers from disturbance and resists alien invasion; Ehrlich's rivet-popper analogy.", "steps": ["Tilman's outdoor-plot experiments: more species → less year-to-year biomass variation and higher productivity; stable communities resist disturbance and alien invasion.", "Ehrlich's rivet-popper hypothesis: species are rivets on the ecosystem-airplane; cumulative loss weakens flight, and losing wing rivets (key functional species) is graver than losing seat rivets.", "Hence rich biodiversity is essential for ecosystem health and human survival — loss lowers plant production, drought resistance and process stability."], "answer": "Diversity brings stability, productivity and resistance (Tilman); rivet-popper warns key-species loss crashes function.", "takeaway": "More species means more stable and more productive communities; the rivet-popper warns that losing key species (wing rivets) is graver than losing redundant ones.", "conceptName": "Diversity, stability and productivity", "number": 6}, {"q": 7, "title": "Sacred groves and their conservation role", "conceptIdx": 4, "page": 12, "printPage": 12, "question": "What are sacred groves? What is their role in conservation?", "given": "Forest tracts set aside and venerated, with all trees and wildlife given total protection; belts in Khasi and Jaintia Hills (Meghalaya), Aravalli Hills (Rajasthan), Western Ghats (Karnataka, Maharashtra) and Sarguja, Chanda and Bastar (Madhya Pradesh).", "steps": ["Sacred groves are forest tracts set aside by religious and cultural traditions, where all trees and wildlife are venerated and given total protection.", "Found in Khasi and Jaintia Hills (Meghalaya), Aravalli Hills (Rajasthan), Western Ghats (Karnataka, Maharashtra) and Sarguja, Chanda and Bastar areas (Madhya Pradesh).", "Role: in-situ refuges — in Meghalaya the last refuges for many rare and threatened plants — preserving whole communities outside the formal reserve network."], "answer": "Tradition-protected forest patches; in-situ refuges for rare/threatened taxa in four named belts.", "takeaway": "Sacred groves are community in-situ reserves; Meghalaya's groves are the last refuges for many rare and threatened plants.", "conceptName": "In-situ conservation: sacred groves", "number": 7}, {"q": 8, "title": "Biotic control of floods and soil erosion", "conceptIdx": 3, "page": 12, "printPage": 12, "question": "Among the ecosystem services are control of floods and soil erosion. How is this achieved by the biotic components of the ecosystem?", "given": "The broadly utilitarian argument (§13.2.1) lists flood control, soil-erosion control, pest control and climate moderation; the biotic components are canopy, litter and roots.", "steps": ["Plant cover is the biotic engineer: canopy and litter intercept rainfall and slow runoff; roots bind soil particles into a coherent matrix.", "This meters water release (checking flood peaks), traps silt and resists topsoil wash — the broadly-utilitarian service priced in Section 13.2.1.", "Removing the cover reverses all three effects: faster runoff, eroded soil, silted rivers."], "answer": "Roots bind soil; canopy/litter slow runoff and trap silt — biotic cover meters floods and holds soil.", "takeaway": "Roots bind soil while canopy and litter slow runoff, so plant cover meters floods and holds topsoil — a service lost when the cover is removed.", "conceptName": "Broadly utilitarian ecosystem services", "number": 8}, {"q": 9, "title": "Why animals achieved greater diversification", "conceptIdx": 0, "page": 12, "printPage": 12, "question": "The species diversity of plants (22 per cent) is much less than that of animals (72 per cent). What could be the explanations to how animals achieved greater diversification?", "given": "More than 70 per cent of recorded species are animals and insects make up more than 70 per cent of animals (7 of every 10); plants are no more than 22 per cent; fungi outnumber all vertebrates combined.", "steps": ["Animals dominate the described biota (>70%) and insects alone exceed 70% of animals — 7 of every 10 animals is an insect — so animal diversification is largely insect diversification.", "Insects show extreme niche specialisation (constant tropical environments, coevolution with flowering plants as pollinators/herbivores, flight-aided dispersal, short generations) multiplying speciation opportunities.", "Plants, though fewer in species, underpin the system as producers; fungi exceed all heses for tropical species richness", 1, 12], [4, "Significance of the species–area slope Z", 1, 12], [5, "Major causes of species losses", 2, 12], [6, "Biodiversity and ecosystem functioning", 2, 12], [7, "Sacred groves and their conservation role", 4, 12], [8, "Biotic control of floods and soil erosion", 3, 12], [9, "Why animals achieved greater diversification", 0, 12], [10, "Deliberate extinction: can it ever be justified?", 3, 12]]};

      (o.weight ? ' font-weight="' + o.weight + '"' : '') + '>' + s + '</text>';
  }

  // Proportional wedge on a donut of radius r centred at (cx,cy), from startDeg to endDeg
  // (0deg = 12 o'clock, clockwise), used for the three qualitative pie charts in Fig 13.1.
  function wedge(cx, cy, r, startDeg, endDeg, color){
    var toXY = function(deg){
      var rad = (deg - 90) * Math.PI / 180;
      return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
    };
    var p1 = toXY(startDeg), p2 = toXY(endDeg);
    var large = (endDeg - startDeg) > 180 ? 1 : 0;

      ' A' + r + ',' + r + ' 0 ' + large + ' 1 ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1) + ' Z" fill="' + color + '"/>';
  }

      s += wedge(icx, icy, ir, 288, 306, VIOLET);
      s += wedge(icx, icy, ir, 306, 360, ORANGE);
      s += text(icx, icy + 30, "Insects", {color: "#111827", weight: 700, size: 12});
      s += text(icx - 95, icy + 55, "Molluscs", {color: GREEN, anchor: "start", size: 11});

      s += wedge(vcx, vcy, vr, 210, 260, AMBER);

      s += text(vcx - 15, vcy + 10, "Fishes", {color: "#111827", weight: 700, size: 12});
      s += text(vcx - 20, vcy + 65, "Amphibians", {color: GREEN, size: 11});
      s += text(vcx + 60, vcy + 55, "Reptiles", {color: "#78350f", size: 11});
      s += text(vcx + 78, vcy - 20, "Birds", {color: "#0c4a6e", size: 11});
      s += text(vcx + 45, vcy - 68, "Mammals", {color: ORANGE, size: 11});

      // Plants (bottom centre): Fungi + Angiosperms majority, Algae, Lichens, Mosses, Ferns
      var pcx = 590, pcy = 150, pr = 78;
      s += text(pcx, 40, "PLANTS", {weight: 700, size: 13});
      s += wedge(pcx, pcy, pr, 0, 175, GREEN);
      s += wedge(pcx, pcy, pr, 175, 340, "#fde68a");
      s += wedge(pcx, pcy, pr, 340, 352, PINK);

      s += text(pcx - 40, pcy + 5, "Fungi", {color: "#052e16", weight: 700, size: 12});

      s += text(pcx - 5, pcy + 92, "Algae", {color: PINK, size: 11});
      s += text(pcx + 45, pcy + 92, "Lichens", {color: ORANGE, size: 11});

      s += '</svg>';
      return s;
    }
  };

  // Fig 13.2: species-area relationship, S = C*A^Z (rectangular hyperbola) and its
  // log-log straight line log S = log C + Z log A.
  figs["13.2"] = {
    caption: "Fig. 13.2 — Species–area relationship (redrawn): on a normal scale S = CAᶻ is a rectangular hyperbola; on a log–log scale the same relationship is the straight line log S = log C + Z log A.",
    svg: function(){

      s += '</svg>';
      return s;
    }
  };

  return figs;
})();
