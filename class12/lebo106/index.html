<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 6: Evolution — Interactive Textbook</title>
<style>

:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
  margin: 0;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
}
/* width:100% stops main from sizing to the scrolling concept list's content width */
main { min-width: 0; width: 100%; }

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav, .revision-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover, .revision-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active, .revision-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num, .revision-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num, .revision-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  .topbar {
    padding: 0 10px;
    height: 56px;
  }
  .chapter-crumb {
    display: none !important;
  }
  .top-actions {
    gap: 6px;
  }
  .progress-pill span:first-child {
    display: none !important;
  }
  .progress-pill progress {
    width: 44px;
  }
  .toolbar-btn {
    padding: 4px 8px;
    font-size: 12px;
  }
  main { padding: 16px 12px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
.concept-title {
  font: 34px/1.2 Georgia, "Times New Roman", serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.3px;
}
@media (max-width: 640px) {
  .concept-title { font-size: 27px; }
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
  min-width: 0;
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 2px 16px;
  font-size: 12.5px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  max-height: 460px;
  touch-action: pan-y;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  /* No text-transform: labels contain case-sensitive symbols such as s₁, u, t. */
  font-size: 12px;
  color: #94a3b8;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font-size: 16px;
  line-height: 1.35;
  font-weight: 700;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: var(--radius-sm);
  position: relative;
  overflow: hidden;
  border: none;
  padding: 0;
  cursor: pointer;
  display: block;
}
.video-facade img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
}
.play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 48px;
  height: 48px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.video-title {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 8px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  color: #fff;
  font-size: 12px;
  text-align: left;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font-size: 16.5px;
  line-height: 1.5;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}

gars, bases, pigments, fats in repeats)", "cond": "§6.1; Figure 6.1"}, {"label": "Timeline spine", "html": "universe 13.8 bya → earth 4.5 bya → life ~4.0 bya → non-cellular ~3 bya → first cells ~2000 mya", "cond": "§6.1; Exercises use 500-my gap"}], "deeper": "Text details (§6.1): stellar distances in light years mean starlight is a look into the past; earth is a speck in huge galaxy clusters. Pasteur's two-flask contrast (sterilised vs open to air) is the exact experiment cited. Non-cellular capsules reproduced their molecules perhaps; the step from non-cellular aggregates of giant macromolecules to membranous cells is stated as not known (§6.8). The chapter calls the whole account the longest of all construed and conjectured stories.", "worked": "Timeline check (§6.1): earth formed 4.5 bya; life appeared 500 million years later. 4.50 − 0.50 = 4.00 bya — the book's almost four billion years back. First cells at ~2000 mya are therefore ~2000 million years after the first life (~4000 mya).", "prediction": {"prompt": "Miller repeats his 1953 flask but replaces the reducing mixture with an oxygen-rich modern atmosphere and repeats the spark. What does the textbook logic predict?", "options": ["No comparable amino-acid yield — the Oparin–Haldane/Miller result needs the reducing CH4/H2/NH3/H2O conditions", "A larger yield of amino acids, since oxygen speeds up synthesis", "Living cells forming directly in the flask within days"], "answer": 0, "explanation": "The book stresses the reducing atmosphere (CH4, NH3, no free O2) plus discharge as the condition; oxidising conditions and direct cell formation are not part of the accepted chemical-evolution evidence."}, "connect": [["Meteorites carry the same compounds", "Analysis of meteorite content revealed amino-acid-like compounds, suggesting similar processes occur elsewhere in space — the book's own support for chemical evolution beyond earth."], ["Wow — starlight is time travel", "Stellar distances are measured in light years: what we see tonight left its star millions of years ago from trillions of kilometres away. Looking at stars is literally peeping into the past (§6.1).", [], {"id": "NNijmxsKGbc", "title": "What Was The Miller-Urey Experiment?", "channel": "Stated Clearly"}]], "recall": "State the universe/earth/life/cells dates, the four Miller gases, Pasteur's two-flask result, and the Oparin–Haldane proposition in one line each.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The Big Bang theory as used in §6.1 explains the origin of the", "options": ["Universe, as a singular huge explosion followed by expansion and cooling", "First cell on earth directly", "Ozone layer only"], "answer": 0, "hint": "First paragraph of §6.1.", "solution": "Big Bang → universe; earth forms much later (4.5 bya) inside the Milky Way.", "wrong": ["Cells arise ~2000 mya via chemical evolution, not the Big Bang.", "Ozone forms later from oxygen chemistry on early earth."]}, {"level": "Medium", "type": "number", "map": "§6.1 timeline", "prompt": "Million years after earth's formation that life appeared", "answer": 500, "unit": "million years", "tolerance": 10, "hint": "Almost four billion years back vs 4.5 bya earth.", "solution": "4.5 bya − ~4.0 bya = 500 million years (§6.1)."}, {"level": "Hard", "type": "number", "map": "§6.1 first cells", "prompt": "Million years ago the first cellular (single-celled) forms of life possibly originated", "answer": 2000, "unit": "mya", "tolerance": 50, "hint": "Non-cellular giants ~3 bya; cells later.", "solution": "About 2000 million years ago, all in the water environment (§6.1)."}], "resources": [{"title": "NCERT §6.1 — Origin of life & Miller (official PDF, PDF p.1)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo106.pdf#page=1"}]}, {"id": "theories-evidences", "nav": "Theories & evidences", "title": "From special creation to biogenesis — and the evidences for evolution", "deck": "Special creation (fixed diversity, 4000-year earth) fell to Darwin–Wallace natural selection and reproductive fitness. Fossils, Haeckel vs von Baer embryos, homologous vs analogous organs, biochemistry, breeding and industrial melanism supply the evidence.", "minutes": 9, "section": "6.2, 6.3", "pages": [3, 7], "print": "112–116", "sim": "evidences", "simTitle": "Homologous vs analogous sorter: forelimbs, wings, eyes", "quick": ["Conventional religious literature gives <strong>special creation</strong>: all species created as such, diversity always the same, <strong>earth about 4000 years old</strong> — ideas strongly challenged in the nineteenth century. From the <strong>H.M.S. Beagle</strong> voyage <strong>Charles Darwin</strong> concluded that living forms share similarities with each other and with extinct forms, extinctions and new forms alternating through history; <strong>Alfred Wallace</strong> in the Malay Archipelago reached similar conclusions. Built-in variation plus differential survival (<strong>fitness = reproductive fitness only</strong>) → <strong>natural selection</strong> as the mechanism; common ancestors at different epochs/eras/periods, with geological history correlating with biological history — so earth is <strong>billions, not thousands, of years old</strong>.", "<strong>Fossils</strong> (remains of hard parts in rocks; sediments layered in crust cross-sections) give <strong>paleontological evidence</strong>: different-aged sediments hold different life forms (some like modern forms, some extinct e.g. dinosaurs, Figure 6.2), new forms arising at different times; ages come from <strong>radioactive dating</strong>. <strong>Embryology</strong>: <strong>Ernst Haeckel (Heckel)</strong> cited vestigial <strong>gill slits</strong> behind the head in all vertebrate embryos (functional only in adult fish) — but <strong>Karl Ernst von Baer</strong> disapproved it on careful study: embryos never pass through adult stages of other animals.", "Comparative anatomy: <strong>whales, bats, cheetah tml": "fitness = reproductive fitness; survivors leave more progeny under competition", "cond": "§6.2; §6.5 Malthus link"}], "deeper": "Reading notes (§6.2–6.3): fitness refers ultimately and only to reproductive fitness. Rock cross-sections order sediments oldest-below; dinosaurs illustrate extinct-vs-modern mapping. Sweet potato is a root modification, potato a stem modification — the book's canonical analogy pair. Moth counts: 1850s white > dark; 1920 dark > white in the same industrial area.", "worked": "Moth-logic check (§6.3): contrasting background ⇒ spotted by predators. Dark trunks + white moth = eaten; dark trunks + melanised moth = camouflaged survivors increasing in proportion — selection without any variant being fully wiped out.", "prediction": {"prompt": "A student calls butterfly and bird wings homologous because they look alike and both fly. What does §6.3 say?", "options": ["They are analogous (convergent): similar function, not anatomically similar structures", "They are homologous (divergent): same bones proving common ancestry", "They are fossils, so neither term applies"], "answer": 0, "explanation": "Wings of butterfly and birds look alike but are not anatomically similar; analogous structures evolve convergently for the same function."}, "connect": [["Antibiotic resistance in Indian hospitals", "Excess antibiotics select pre-existing resistant microbes within months or years (§6.3 mechanism) — hospital-acquired resistant strains are industrial melanism replayed in wards, and Exercise 1 asks exactly this in Darwinian terms."], ["Wow — Shivalik fossils in India's own rocks", "The Shivalik Hills (Himachal–Uttarakhand–J&K foothills) preserve elephant, horse, ape and tortoise fossils in layered sediments — paleontological evidence (§6.3) readable in Indian crust, dated by the same radioactive methods the chapter cites.", [], {"id": "Q-aGAX27SIo", "title": "Evidence for evolution | Common ancestry and phylogeny | High school biology | Khan Academy", "channel": "Khan Academy"}]], "recall": "Contrast special creation's three claims with Darwin–Wallace; list one example each of fossil, embryological, homologous, analogous, biochemical and anthropogenic evidence.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Whale, bat, cheetah and human forelimbs with the same bone pattern performing different functions are", "options": ["Homologous organs from divergent evolution", "Analogous organs from convergent evolution", "Fossils of extinct dinosaurs"], "answer": 0, "hint": "Same structure, different directions (§6.3).", "solution": "Humerus/radius/ulna/carpals/metacarpals/phalanges shared ⇒ homology, common ancestry.", "wrong": ["Analogy is different structures, same function (wings, eyes).", "These are living mammals, not dinosaur fossils."]}, {"level": "Medium", "type": "number", "map": "Figure 6.3b", "prompt": "Number of bone groups named in the shared mammalian forelimb pattern", "answer": 6, "unit": "groups", "tolerance": 0.1, "hint": "Humerus, radius, ulna, carpals, metacarpals, phalanges.", "solution": "Six named groups in the forelimb pattern (§6.3)."}, {"level": "Hard", "type": "mcq", "prompt": "The 1850s→1920 moth reversal (§6.3) shows", "options": ["Camouflage-selected survival: contrasting moths are picked by predators, so proportions flip with soot/lichen backgrounds", "Moths choosing to change colour within their lifetime like chameleons", "Complete wiping out of the white variant everywhere including rural areas"], "answer": 0, "hint": "Predators spot moths against contrasting backgrounds.", "solution": "Background-dependent predation flips proportions; rural areas stay low-melanic and no variant is fully wiped out.", "wrong": ["Individuals do not recolour; populations shift by selection.", "Rural counts stayed low-melanic; the text says no variant is completely wiped out."]}], "resources": [{"title": "NCERT §6.2, 6.3 — Theories & evidences (official PDF, PDF p.3)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo106.pdf#page=3"}]}, {"id": "adaptive-radiation", "nav": "Adaptive radiation", "title": "Adaptive radiation: Darwin's finches and Australian marsupials", "deck": "From one seed-eating ancestor, Galapagos finches radiated beaks for insectivorous and vegetarian niches; Australian marsupials radiated from one stock — and placentals convergently mirror them (wolf/wolf, etc.).", "minutes": 8, "section": "6.4", "pages": [7, 9], "print": "116–118", "sim": "finches", "simTitle": "Finch beak radiation: seed-eating → insectivorous + vegetarian", "quick": ["At the <strong>Galapagos Islands</strong> Darwin found small black birds — later <strong>Darwin's Finches</strong>: many varieties on the same island, all conjectured to have <strong>evolved on the island itself</strong>. From the original <strong>seed-eating</strong> features, many other forms with <strong>altered beaks</strong> arose, enabling them to become <strong>insectivorous and vegetarian finches</strong> (Figure 6.5).", "This is <strong>adaptive radiation</strong>: evolution of <strong>different species in a given geographical area starting from a point and literally radiating</strong> to other areas/habitats. Darwin's finches are one of the best examples of the phenomenon.", "The other textbook example is <strong>Australian marsupials</strong>: a number of marsupials, each different from the other (Figure 6.6), evolved from an <strong>ancestral stock within the Australian island continent</strong>. When more than one radiation occurs in an isolated area across habitats, one can call it <strong>convergent evolution</strong>: placental mammals in Australia radiated into varieties <strong>similar to corresponding marsupials</strong> — e.g. <strong>placental wolf and Tasmanian wolf-marsupial</strong> (Figure 6.7)."], "formulas": [{"label": "Adaptive radiation", "html": "one ancestral stock → many species across habitats within one geographical area", "cond": "§6.4; finches, marsupials"}, {"label": "Finch beak triad", "html": "seed-eating (ancestral) → insectivorous + vegetarian (altered beaks)", "cond": "§6.4; Figure 6.5"}, {"label": "Convergent mirror", "html": "placental wolf ≈ Tasmanian wolf-marsupial (similar form, separate stocks)", "cond": "§6.4; Figure 6.7"}], "deeper": "Figure order note (§6.4): Figure 6.6 (marsupial radiation) is cited before Figure 6.5 (finch beaks) in the running text — both belong to this section. The wolf/wolf pair is the named convergent example; the broader placental–marsupial parallel set is Figure 6.7 (also recalled in §6.5 as a Darwinian figure).", "worked": "Exercise 8 reasoning: pick Darwin's finches — one seed-eating ancestor on Galapagos → altered beaks → insectivorous and vegetarian species in different niches of the same islands: point origin + habitat radiation = adaptive radiation.", "prediction": {"prompt": "Two Galapagos finch species crack different seed sizes with differently shaped beaks. Their most likely history under §6.4 is", "options": ["One seed-eating ancestor radiated on the islands into beak-specialised species", "Each species was separately created in its present form 4000 years ago", "Beaks changed by use and disuse stretching within one lifetime and were inherited"], "answer": 0, "explanation": "All varieties evolved on the island itself from common seed-eating features — radiation, not special creation or Lamarckian stretching."}, "connect": [["Lentils to lunch: beaks as tools", "Seed-crushing vs insect-probing beaks are feeding tools like kitchen implements — altered beaks opened vegetarian and insectivorous niches from one seed-eating start (Figure 6.5)."], ["Wow — a wolf that is not a wolf", "Australia's Tasmanian wolf-marsupial looks like a placental wolf but evolved from marsupial stock — two radiations converging on the same job in isolation (Figure 6.7).", [], {"id": "-b3tFfbw_EU", "title": "Adaptive Radiation | Evolution | Biology | Khan Academy", "channel": "Khan Academy India - English"}]], "recall": "Define adaptive radiation and retell both textbook examples plus the wolf/wolf convergent mirror.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Adaptive radiation (§6.4) is", "options": ["Evolution of different species from one point, radiating across habitats of one area", "One species turning into a fossil without descendants", "Mating of two different orders producing a hybrid"], "answer": 0, "hint": "Starting from a point and literally radiating.", "solution": "Finches on Galapagos and marsupials in Australia radiate from ancestral stock into niches.", "wrong": ["Fossilisation without descendants is extinction, not radiation.", "Hybridisation across orders is not the §6.4 process."]}, {"level": "Medium", "type": "mcq", "prompt": "From the original seed-eating finches arose", "options": ["Insectivorous and vegetarian forms with altered beaks", "Fish with stout fins that walk on land", "Placental wolves"], "answer": 0, "hint": "Figure 6.5 beak varieties.", "solution": "Altered beaks enabled insectivorous and vegetarian finches (§6.4).", "wrong": ["Lobefins belong to §6.8 vertebrate history, not finches.", "Wolves belong to the marsupial/placental story."]}, {"level": "Hard", "type": "number", "map": "§6.4 diets", "prompt": "Feeding modes named for the radiated finches (seed-eating + insectivorous + vegetarian)", "answer": 3, "unit": "modes", "tolerance": 0.1, "hint": "Ancestral one plus two derived.", "solution": "Seed-eating (original), insectivorous and vegetarian (derived) — three modes."}], "resources": [{"title": "NCERT §6.4 — Adaptive radiation (official PDF, PDF p.7)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo106.pdf#page=7"}]}, {"id": "lamarck-darwin-mechanism", "nav": "Lamarck vs Darwin & mechanism", "title": "Lamarck's use/disuse vs Darwin's branching descent — and how variation arises", "deck": "Giraffe-neck stretching (Lamarck) is no longer believed; Darwin's branching descent + natural selection (Malthus, heritable fitness) stands. de Vries added saltation mutations; population genetics reconciles small directional variations with sudden large ones; selection stabilises, directs or disrupts (Fig 6.8).", "minutes": 9, "section": "6.5, 6.6", "pages": [9, 11], "print": "118–120", "sim": "selection", "simTitle": "Selection curves: stabilising / directional / disruptive + moth melanism", "quick": ["Evolution by <strong>natural selection</strong> in the true sense started when <strong>cellular forms with metabolic differences</strong> originated. The bacterial parable (§6.5): colony A on a medium has built-in variation; a changed medium lets only variant <strong>B survive, outgrow and appear as a new species within days</strong> — in fish or fowl the same would take millions of years because life spans are years. <strong>Fitness of B is better than A under the new conditions; nature selects for fitness</strong> — characteristics must be <strong>inherited (genetic basis)</strong>; adaptability is inherited. The two key Darwinian concepts are <strong>branching descent and natural selection</strong> (Figures 6.7–6.8).", "Before Darwin, <strong>Lamarck</strong> said evolution occurred by <strong>use and disuse</strong>: giraffes stretching for tall-tree leaves elongated their necks and <strong>passed the acquired character</strong> on, slowly acquiring long necks. <strong>Nobody believes this conjecture any more.</strong> Darwin may have been influenced by <strong>Thomas Malthus</strong> on populations: resources limited, populations stable except seasonal fluctuation, members vary (no two alike), most variations inherited, exponential growth possible (bacteria) but checked by <strong>competition</strong> — heritable variants using resources better <strong>reproduce more, leave more progeny, and over generations population characteristics change</strong>: new forms arise. Whether evolution/selection are processes or end results remains an open framing question (§6.5).", "What is the origin of variation? Mendel's inheritable factors were ignored by Darwin. <strong>Hugo de Vries</strong> (evening primrose, first decade of 20th century) brought <strong>mutations — large differences arising suddenly</strong>: mutation causes evolution, not Darwin's minor variations; mutations random and directionless, Darwinian variations small and directional; Darwin gradual, de Vries <strong>saltation (single-step large mutation)</strong> causing speciation. Later <strong>population genetics</strong> brought clarity. Figure 6.8 shows natural selection operating on traits three ways: <strong>(a) stabilising, (b) directional, (c) disruptive</strong> — detailed in §6.7 as mean-value, other-than-mean, and both-peripheral-ends shifts of the distribution curve."], "formulas": [{"label": "Darwin pair", "html": "branching descent + natural selection (fitness = reproductive success of heritable variants)", "cond": "§6.5; Figures 6.7–6.8"}, {"label": "Lamarck (rejected)", "html": "use/disuse → acquired elongation → inheritance (giraffe); nobody believes it now", "cond": "§6.5"}, {"label": "Selection modes (Fig 6.8)", "html": "(a) stabilising: mean favoured; (b) directional: off-mean favoured; (c) disruptive: both peripheral ends favoured", "cond": "§6.6–6.7"}], "deeper": "Malthusian observations listed (§6.5): limited resources; stable populations; ubiquitous heritable variation; exponential potential vs limited reality ⇒ competition; survivors grow at the cost of others. de Vries contrasts: random/directionless/sudden/large (mutation, saltation) vs small/directional/gradual (Darwin). Microbes dividing fast show selection in hours/days — the rate of new forms links to life cycle/life span.", "worked": "Bacteria-to-fowl scaling (§6.5): same selection logic, different clocks — days for microbes (millions of individuals in hours) vs millions of years for long-lived fish/fowl. Fitness comparison is always relative to the new conditions (B vs A).", "prediction": {"prompt": "A giraffe stretches its neck daily and its offspring are born with longer necks. Under this chapter, this claim is", "options": ["Lamarckian use/disuse inheritance — explicitly rejected; fitness needs a heritable genetic basis selected by nature", "Darwinian natural selection operating correctly", "Hardy-Weinberg equilibrium in action"], "answer": 0, "explanation": "Acquired stretching inherited is Lamarck's giraffe example; the text says nobody believes this conjecture any more — selection acts on inherited variation."}, "connect": [["Multidrug-resistant TB therapy", "Long TB/antibiotic courses exist because stopping early leaves resistant B-like variants to outgrow — the §6.5 colony-A-to-B parable playing out in Indian clinics, grounded in §6.3's months-or-years resistance."], ["Wow — days vs millions of years", "One selection rule, two clocks: bacteria speciate before your eyes in days while fowl need geological time — because the rate of new forms tracks life cycle and life span (§6.5).", [], {"id": "x73bsC7WIsE", "title": "Theories of evolution Lamarck vs Darwin | Evolution | Biology | FuseSchool", "channel": "FuseSchool - Global Education"}]], "recall": "State the bacteria A→B story, Lamarck's giraffe vs Darwin's pair, the Malthus observations, de Vries saltation vs Darwin gradualism, and the three Fig 6.8 modes.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Lamarck's giraffe explanation (§6.5) invoked", "options": ["Use and disuse with inheritance of the acquired long neck", "Branching descent plus natural selection", "Hardy-Weinberg allele constancy"], "answer": 0, "hint": "Stretching to forage tall-tree leaves.", "solution": "Elongation by effort, passed on — the rejected conjecture.", "wrong": ["That is Darwin's pair of key concepts.", "That is §6.7 population genetics, not Lamarck."]}, {"level": "Medium", "type": "mcq", "prompt": "Fitness in the Darwinian sense (§6.2/6.5) means", "options": ["Reproductive fitness — leaving more progeny in that environment", "Physical strength or lifespan alone", "Ability to stretch organs by effort"], "answer": 0, "hint": "Ultimately and only ... fitness.", "solution": "Those better fit leave more progeny; adapted variants are selected by nature.", "wrong": ["Strength without progeny is not Darwinian fitness.", "Effort-stretching is Lamarck, rejected in the text."]}, {"level": "Hard", "type": "number", "map": "Figure 6.8", "prompt": "Number of operation modes of natural selection drawn in Figure 6.8", "answer": 3, "unit": "modes", "tolerance": 0.1, "hint": "Stabilising, directional, disruptive.", "solution": "Three panels: (a) stabilising, (b) directional, (c) disruptive."}], "resources": [{"title": "NCERT §6.5, 6.6 — Lamarck vs Darwin & mechanism (official PDF, PDF p.9)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo106.pdf#page=9"}]}, {"id": "hardy-weinberg", "nav": "Hardy-Weinberg", "title": "Hardy-Weinberg equilibrium: p² + 2pq + q² = 1 and its five disturbers", "deck": "Allele frequencies stay constant (gene pool constant, sum = 1) unless disturbed. In diploids AA = p², aa = q², Aa = 2pq. Gene flow, drift, mutation, recombination and selection disturb it — and selection replays Fig 6.8's three curves.", "minutes": 9, "section": "6.7", "pages": [11, 12], "print": "120–121", "sim": "hardyweinberg", "simTitle": "Hardy-Weinberg lab: p/q slider, genotype frequencies + 5 disturbers", "quick": ["In a population one can find the <strong>frequency of alleles</strong> of a gene/locus; it is supposed to remain <strong>fixed through generations</strong>. The <strong>Hardy-Weinberg principle</strong> states this algebraically: allele frequencies are <strong>stable generation to generation</strong>; the <strong>gene pool</strong> (total genes and alleles) remains constant — <strong>genetic equilibrium</strong>; the <strong>sum of all allelic frequencies is 1</strong>.", "In a diploid, allele A frequency <strong>p</strong> and allele a frequency <strong>q</strong> give genotype frequencies by product of probabilities: <strong>AA = p<sup>2</sup>, aa = q<sup>2</sup>, Aa = 2pq; hence p<sup>2</sup> + 2pq + q<sup>2</sup> = 1</strong>, the binomial expansion of <strong>(p + q)<sup>2</sup></strong>. When measured frequencies differ from expected, the <strong>difference (direction) indicates the extent of evolutionary change</strong>: disturbed equilibrium = evolution happening.", "Five factors disturb Hardy-Weinberg equilibrium: <strong>gene migration/flow, genetic drift, mutation, genetic recombination, natural selection</strong>. Migration moving sections between populations changes both; repeated migration = <strong>gene flow</strong>. The same change by <strong>chance = genetic drift</strong>, sometimes so different that a new species forms — drifted founders give the <strong>founder effect</strong>. Microbial experiments show pre-existing advantageous mutations selected over generations → speciation. Mutation/recombination/flow/drift change gene frequencies; coupled with <strong>reproductive success, natural selection</strong> makes populations look different — via <strong>stabilisation (mean), directional change (off-mean), or disruption (both peripheral ends)</strong> of the distribution curve (Figure 6.8)."], "formulas": [{"label": "Hardy-Weinberg equilibrium", "html": "p<sup>2</sup> + 2pq + q<sup>2</sup> = 1, where (p + q)<sup>2</sup>; AA = p<sup>2</sup>, Aa = 2pq, aa = q<sup>2</sup>", "cond": "§6.7; p + q = 1, sum of alleles = 1"}, {"label": "Five disturbers", "html": "gene flow/migration · genetic drift (+ founder effect) · mutation · recombination · natural selection", "cond": "§6.7"}, {"label": "Selection readout (Fig 6.8)", "html": "stabilising → mean; directional → off-mean; disruptive → both ends", "cond": "§6.7 closing paragraph"}], "deeper": "Worked logic (§6.7): probability allele A (frequency p) appears on both chromosomes = p × p = p²; similarly q² and 2pq. Gene flow adds alleles to the new population and loses them from the old. Founder effect: original drifted population becomes founders. Variation sources (mutation, gametogenic recombination, flow, drift) change frequencies; selection converts them into directional population shifts.", "worked": "H-W numerical: suppose 16% of a population shows the recessive phenotype (aa). Then q² = 0.16 ⇒ q = 0.40 ⇒ p = 1 − 0.40 = 0.60 ⇒ carriers Aa = 2pq = 2 × 0.60 × 0.40 = 0.48 (48%). If a later census finds aa far from 16%, that direction of difference measures evolutionary change (§6.7).", "prediction": {"prompt": "A census finds recessive-phenotype frequency q² = 0.16. Under Hardy-Weinberg, the carrier (Aa) frequency is", "options": ["0.48 — q = 0.4, p = 0.6, 2pq = 0.48", "0.16 — carriers equal recessives", "0.84 — carriers are everyone else"], "answer": 0, "explanation": "q = √0.16 = 0.4; p = 0.6; 2pq = 0.48. Deviations from such expectations signal evolution."}, "connect": [["Sickle-cell and malaria belts", "Where malaria selects heterozygotes, HbS allele frequencies depart from naive H-W expectations — selection plus gene flow visibly disturbing equilibrium, exactly the §6.7 mechanism."], ["Wow — antibiotic doses count alleles", "Each antibiotic course in Indian hospitals is a selection pulse on bacterial gene pools: resistant-allele q rises within months, and the measured-vs-expected H-W gap (§6.7) becomes a resistance report card.", [], {"id": "4Kbruik_LOo", "title": "Hardy-Weinberg Principle", "channel": "Khan Academy"}]], "recall": "Write p²+2pq+q²=1 with meanings, name the five disturbers plus founder effect, and map the three Fig 6.8 selection modes.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Hardy-Weinberg genetic equilibrium states that", "options": ["Allele frequencies (gene pool) stay constant generation to generation; allelic sum = 1", "Allele frequencies must change every generation", "Only dominant alleles survive in any population"], "answer": 0, "hint": "Stable and constant (§6.7).", "solution": "Constant gene pool; p + q = 1; genotypes p², 2pq, q².", "wrong": ["Change means disturbed equilibrium, i.e. evolution.", "Recessives persist as q² and 2pq carriers."]}, {"level": "Medium", "type": "number", "map": "§6.7 q² → q", "prompt": "Recessive allele frequency q if recessive-phenotype frequency q² = 0.16", "answer": 0.4, "unit": "", "tolerance": 0.01, "hint": "q = √q².", "solution": "q = √0.16 = 0.40; hence p = 0.60."}, {"level": "Hard", "type": "number", "map": "§6.7 2pq", "prompt": "Carrier frequency 2pq if p = 0.6 and q = 0.4", "answer": 0.48, "unit": "", "tolerance": 0.01, "hint": "2 × 0.6 × 0.4.", "solution": "2pq = 0.48; with p² = 0.36 and q² = 0.16 the sum is 1.00."}], "resources": [{"title": "NCERT §6.7 — Hardy-Weinberg (official PDF, PDF p.11)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo106.pdf#page=11"}]}, {"id": "timeline-human", "nav": "Geological timeline & man", "title": "A brief account of evolution — and the origin of man", "deck": "First cells ~2000 mya → invertebrates 500 mya → jawless fish 350 mya → lobefin→amphibian→reptile→dinosaur (gone 65 mya) → mammals. Dryopithecus/Ramapithecus 15 mya → Australopithecus → habilis (650–800cc) → erectus (900cc) → Neanderthal (1400cc) → sapiens, Bhimbetka art and farming.", "minutes": 9, "section": "6.8, 6.9", "pages": [12, 16], "print": "121–125", "sim": "humanevolution", "simTitle": "Human-evolution walker: timeline with brain sizes 650→1400cc", "quick": ["About <strong>2000 mya the first cellular forms</strong> appeared (how membranous cells came from macromolecule aggregates is not known); some cells released O<sub>2</sub> like the photosynthetic light reaction splitting water with light-harvesting pigments. Single cells became multicellular; by <strong>500 mya invertebrates</strong> were active; <strong>jawless fish ~350 mya</strong>; sea weeds and few plants ~320 mya — <strong>plants invaded land first</strong>, widespread before animals. <strong>Fish with stout strong fins</strong> (~350 mya) moved onto land and back; the 1938 South African <strong>Coelacanth (lobefin)</strong>, thought extinct, shows the stock that became the <strong>first amphibians</strong> (ancestors of frogs/salamanders; no specimens left). Amphibians → <strong>reptiles with thick-shelled sun-proof eggs</strong> (modern turtle/tortoise/crocodile descendants).", "For ~200 million years <strong>reptiles of different shapes dominated</strong> (Figures 6.9–6.10 plant/vertebrate sketches); giant ferns fell to form <strong>coal</strong>; some land reptiles returned to water (<strong>Ichthyosaurs ~200 mya</strong>); land reptiles were the <strong>dinosaurs</strong> — <strong>Tyrannosaurus rex ~20 feet</strong> with dagger teeth — <strong>suddenly gone ~65 mya</strong> (climate? birds? truth in between); small reptiles persist. First <strong>mammals like shrews</strong> (small fossils), <strong>viviparous</strong>, protecting young inside, more intelligent at sensing danger; when reptiles declined mammals took over. South-American horse/hippopotamus/bear/rabbit-like mammals were overridden by North American fauna after <strong>continental drift</strong> joined the continents; <strong>Australian pouched mammals survived for lack of competition</strong>; whales/dolphins/seals/sea cows went wholly aquatic. Horse/elephant/dog stories are deferred to higher classes.", "About <strong>15 mya Dryopithecus and Ramapithecus</strong> primates existed — hairy, gorilla/chimpanzee-like walkers; <strong>Ramapithecus more man-like, Dryopithecus more ape-like</strong>. Man-like bones in <strong>Ethiopia/Tanzania</strong> (Figure 6.11 skulls) show hominids: <strong>~3–4 mya man-like primates walked upright in eastern Africa</strong>, not taller than 4 feet. <strong>~2 mya Australopithecines</strong> lived in East African grasslands, hunting with stone weapons but essentially eating fruit. Distinct bones gave the first human-like hominid <strong>Homo habilis, brain 650–800cc</strong>, probably not meat-eaters. <strong>1891 Java fossils: Homo erectus ~1.5 mya, large brain ~900cc</strong>, probably ate meat.", "<strong>Neanderthal man (brain 1400cc)</strong> lived in the <strong>near east and central Asia between 1,00,000–40,000 years back</strong>, used hides, buried the dead. <strong>Homo sapiens arose in Africa</strong>, moved across continents into distinct races; <strong>modern Homo sapiens arose during the 75,000–10,000 ice age</strong>; <strong>prehistoric cave art ~18,000 years ago</strong> — e.g. <strong>Bhimbetka rock shelter, Raisen district, Madhya Pradesh</strong>; <strong>agriculture ~10,000 years back</strong>, then settlements; the rest is human history of civilisations. The summary moral: chemical evolution → Darwinian selection → fitness/drift/speciation → homology/fossils/biochemistry as evidence → <strong>man paralleling brain and language evolution</strong>."], "formulas": [{"label": "Vertebrate spine (mya)", "html": "cells 2000 → invertebrates 500 → jawless fish 350 → lobefin→amphibian→reptile → dinosaurs gone 65", "cond": "§6.8; Figures 6.9–6.10"}, {"label": "Hominid brain staircase", "html": "habilis 650–800cc → erectus ~900cc → Neanderthal 1400cc (sapiens modern)", "cond": "§6.9; Exercises 4, 9–10"}, {"label": "Sapiens milestones (years ago)", "html": "Neanderthal 1,00,000–40,000 → sapiens ice age 75,000–10,000 → cave art 18,000 → agriculture 10,000", "cond": "§6.9; Bhimbetka, MP"}], "deeper": "Figure notes (§6.8–6.9): Figure 6.9 plant forms through geological periods; Figure 6.10 vertebrate history; Figure 6.11 baby-chimpanzee skull closer to adult-human than adult-chimpanzee skull. Continental-drift double effect: South America joining North America overrode southern fauna; Australian isolation saved pouched mammals. Shrew-like first mammals; sea-cow/whale aquatic mammals listed.", "worked": "Brain-size ordering (§6.9): habilis mid ≈ (650 + 800)/2 = 725cc < erectus 900cc < Neanderthal 1400cc. Gap erectus − habilis ≈ 175cc; Neanderthal − erectus = 500cc — the staircase Exercise 4 traces with diet (fruit → meat), skeleton (upright, ≤4 ft → taller) and function.", "prediction": {"prompt": "A 900cc Java fossil with meat-eating signs, dated ~1.5 mya, is reported. Under §6.9 it is", "options": ["Homo erectus — 900cc, ~1.5 mya, Java 1891, probably ate meat", "Homo habilis — 650–800cc fruit-eaters of East Africa", "Neanderthal — 1400cc hide-users of 1,00,000–40,000 years ago"], "answer": 0, "explanation": "Brain size + place + date + diet jointly diagnose erectus in the textbook sequence."}, "connect": [["Narmada human and Bhimbetka neighbours", "The Narmada (Hathnora, MP) archaic-human calvaria and Bhimbetka's 18,000-year-old art (§6.9) put Indian fossils and paintings directly on the textbook timeline from erectus-grade humans to modern sapiens."], ["Wow — a fish thought extinct swims on", "The lobefin Coelacanth, ancestral to amphibians and known only from fossils, was caught alive off South Africa in 1938 — a §6.8 lineage walking out of deep time.", [], {"id": "frE1rjhH77Y", "title": "Human evolution overview | Life on earth and in the universe | Cosmology & Astronomy | Khan Academy", "channel": "Khan Academy"}]], "recall": "Recite the vertebrate dates, the hominid order with brain sizes/diets, and the sapiens milestones ending at agriculture.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The textbook hominid order (§6.9) runs", "options": ["Dryopithecus/Ramapithecus → Australopithecus → habilis → erectus → Neanderthal → sapiens", "Sapiens → Neanderthal → erectus → habilis → Australopithecus", "Dinosaurs → Coelacanth → habilis directly"], "answer": 0, "hint": "15 mya apes to ice-age sapiens.", "solution": "The §6.9 sequence with rising brain sizes and changing diet/skeleton.", "wrong": ["That reverses time's arrow.", "Dinosaurs vanish 65 mya; Coelacanth precedes amphibians, not habilis."]}, {"level": "Medium", "type": T grounding (§6.3): fossils in layered sediments + radioactive dating give paleontological evidence; new finds slot into geological time-spans.", "Report: name the fossil/organism, the sediment/age claimed, and which lineage or date it confirms or disputes.", "No single fixed answer — credit any sourced recent find (e.g. hominid, dinosaur–bird link) discussed with the §6.3 evidence frame."], "answer": "Open activity; answer with a sourced recent fossil find or controversy framed by §6.3."}, {"number": 3, "conceptIdx": 3, "page": 17, "printPage": 126, "question": "Attempt giving a clear definition of the term species.", "steps": ["Activity prompt: the chapter uses species/divergence/speciation but gives no boxed definition.", "Working NCERT-faithful definition: a species is a group of actually or potentially interbreeding populations reproductively isolated from other such groups, sharing a gene pool and common ancestry.", "Link to text: variation + selection + drift/founder effects (§6.5–6.7) split one stock into groups that no longer exchange genes — e.g. finch or bacterial variants appearing as new species.", "Note limits: fossil species are diagnosed morphologically by time-span (§6.3), so the definition is operational."], "answer": "Interbreeding population group, reproductively isolated, sharing a gene pool — split by selection/drift into new species."}, {"number": 4, "conceptIdx": 5, "page": 17, "printPage": 126, "question": "Try to trace the various components of human evolution (hint: brain size and function, skeletal structure, dietary preference, etc.)", "steps": ["Brain: habilis 650–800cc → erectus ~900cc → Neanderthal 1400cc → sapiens; function rises with language/self-consciousness (§6.9, Summary).", "Skeleton: hairy gorilla-like walkers (Dryopithecus/Ramapithecus 15 mya) → upright ≤4-ft eastern-African hominids 3–4 mya → Australopithecines 2 mya → Homo grades; skulls compared in Figure 6.11.", "Diet/tools: fruit-eating Australopithecines with stone wea
