<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 12: Ecosystem — Interactive Textbook</title>
<style>
:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  text-align: left;
  background: #0f172a;
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
}
.play-btn {
  flex: none;
  width: 34px;
  height: 34px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 14px;
}
.video-title {
  font-size: 13px;
  line-height: 1.4;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.q-badge {
  background: var(--soft);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 3px 10px;
  border-radius: 6px;
}
.q-concept-link {
  color: var(--blue);
  text-decoration: none;
  font-size: 13px;

<script>
window.CHAPTER = {"code": "lebo112", "chapterNumber": 12, "book_name": "Biology", "title": "Ecosystem", "subtitle": "Pond structure and stratification, GPP and NPP, the five steps of decomposition, energy flow with the 10% law, and ecological pyramids.", "edition": "Reprint 2026-27", "source": "https://ncert.nic.in/textbook/pdf/lebo112.pdf", "page_start": 1, "page_end": 11, "extraction": "PyMuPDF text layer (/tmp/opencode/bio_text/lebo112.txt) + section/exercise page maps in /tmp/opencode/bio_maps.json (key lebo112). pdftotext not used. No PNG zooms (disk full).", "lessons": [{"id": "pond-structure", "nav": "Structure & pond", "title": "Ecosystem structure and function: species composition, stratification and the pond", "deck": "An ecosystem is a functional unit of nature. Biotic–abiotic interaction builds a physical structure — species composition plus stratification — and runs four functions: productivity, decomposition, energy flow and nutrient cycling. A small pond shows all of them.", "minutes": 8, "section": "12.1", "pages": [1, 2], "print": "1–2", "sim": "pond", "simTitle": "Pond stratification explorer: abiotic + producers + consumers + decomposers", "quick": ["An ecosystem can be visualised as a <strong>functional unit of nature</strong>, where living organisms interact among themselves and also with the surrounding physical environment. It varies greatly in size from a small pond to a large forest or a sea, and many ecologists regard the entire <strong>biosphere as a global ecosystem</strong>. For convenience it is divided into <strong>terrestrial</strong> (forest, grassland, desert) and <strong>aquatic</strong> (pond, lake, wetland, river, estuary) types; crop fields and an aquarium are <strong>man-made</strong> ecosystems.", "Interaction of biotic and abiotic components results in a <strong>physical structure</strong> characteristic of each ecosystem. Identification and enumeration of plant and animal species gives its <strong>species composition</strong>; the vertical distribution of species in different layers is <strong>stratification</strong> — trees occupy the top strata of a forest, shrubs the second, and herbs and grasses the bottom layers.", "The components function as a unit through four aspects: <strong>(i) productivity, (ii) decomposition, (iii) energy flow and (iv) nutrient cycling</strong>.", "A small <strong>pond</strong> is a fairly self-sustainable model aquatic ecosystem. The <strong>abiotic</strong> component is the water with all dissolved inorganic and organic substances plus the rich soil deposit at the bottom (solar input, temperature cycle, day-length and climatic conditions regulate the rate of function). <strong>Autotrophs</strong> are the phytoplankton, some algae and the floating, submerged and marginal plants; <strong>consumers</strong> are zooplankton and the free-swimming and bottom-dwelling forms; <strong>decomposers</strong> — fungi, bacteria and flagellates — are especially abundant at the bottom. The pond converts inorganic into organic matter via autotrophs, feeds heterotrophs, and decomposes and mineralises dead matter for reuse, over and over — with <strong>unidirectional movement of energy</strong> toward higher trophic levels and dissipation as heat."], "formulas": [{"label": "Structural features", "html": "species composition (identification + enumeration) + stratification (trees → shrubs → herbs/grasses)", "cond": "§12.1"}, {"label": "Four functional aspects", "html": "(i) productivity · (ii) decomposition · (iii) energy flow · (iv) nutrient cycling", "cond": "§12.1"}, {"label": "Pond component map", "html": "abiotic (water + bottom soil) + autotrophs (phytoplankton, algae, marginal plants) + consumers (zooplankton, swimmers, bottom dwellers) + decomposers (fungi, bacteria, flagellates)", "cond": "§12.1 pond example"}], "deeper": "Reading note: the chapter first surveys the whole system — input (productivity), transfer (food chains/webs, nutrient cycling) and output (degradation and energy loss) — before treating each in §§12.2–12.5. The pond performs every function of the biosphere as a whole, which is why the book uses it as the self-sustainable exemplar.", "worked": "Pond sorting check (Exercise 7 core): marginal plants at the edges → autotrophic components; zooplankton → consumers; flagellates abundant at the bottom → decomposers; dissolved inorganic substances and bottom soil deposit → abiotic component. Each of the four boxes must be non-empty for the system to be self-sustainable.", "prediction": {"prompt": "All fungi, bacteria and flagellates are removed from a pond but everything else stays. What happens first?", "options": ["Dead matter accumulates and mineralisation stops, so autotrophs run short of recycled nutrients", "Photosynthesis immediately doubles because there are no competitors", "Zooplankton switch to photosynthesis"], "answer": 0, "explanation": "Decomposers mineralise dead matter and release it back for reuse by autotrophs (§12.1). Without them the reuse leg of the cycle breaks and detritus piles up."}, "connect": [["Paddy-field ponds across India", "Flooded paddy fields act as seasonal pond ecosystems — standing water, phytoplankton and algae, zooplankton, bottom decomposers — the §12.1 pond component map replayed in a man-made crop-field ecosystem the book explicitly allows.", [], {"id": "042LD-Xnt3A", "title": "Ecosystem Class 12 One Shot | NCERT + PYQs | Biology Chapter 12 by By Aarushi Ma'am", "channel": "NCERT Wallah"}], ["Wow — an aquarium is an ecosystem too", "The chapter counts an aquarium as a man-made ecosystem. A home fish tank has the same four boxes — water + dissolved substances, plants/algae, fish (consumers), microbial decomposers — and collapses for exactly the textbook reason when any one box fails."]], "recall": "Define ecosystem; name the two structural features and the four functional aspects; list the four pond components with one example each.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Stratification in an ecosystem means the", "options": ["Vertical distribution of different species occupying different levels", "Counting of all plant and animal species", "Rate of biomass production per unit area"], "answer": 0, "hint": "Trees on top, shrubs second, herbs at the bottom.", "solution": "Stratification is vertical layering; identification/enumeration gives species composition; rate of biomass production is productivity.", "wrong": ["That is species composition.", "That is productivity (§12.2)."]}, {"level": "Medium", "type": "number", "map": "§12.1 aspects", "prompt": "Number of functional aspects through which ecosystem components act as a unit", "answer": 4, "unit": "aspects", "tolerance": 0.1, "hint": "Productivity, decomposition, energy flow and …?", "solution": "Four: (i) productivity, (ii) decomposition, (iii) energy flow, (iv) nutrient cycling."}, {"level": "Hard", "type": "mcq", "prompt": "In the pond example, decomposers (fungi, bacteria, flagellates) are especially abundant in the", "options": ["Bottom of the pond", "Sunlit surface film", "Leaves of marginal plants"], "answer": 0, "hint": "Where does dead matter settle?", "solution": "The book places decomposers especially abundantly in the bottom of the pond, where detritus accumulates.", "wrong": ["The surface film is the phytoplankton zone.", "Marginal plants are autotrophic components at the edges."]}], "resources": [{"title": "NCERT §12.1 — Structure & pond (official PDF, PDF p.1)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo112.pdf#page=1"}]}, {"id": "productivity", "nav": "Productivity GPP/NPP", "title": "Productivity: GPP − R = NPP, and why the ocean yields so little", "deck": "Primary production is biomass made per unit area over time; its rate is productivity. GPP minus respiration is NPP — the food available to heterotrophs. The biosphere makes ~170 billion tons; the ocean, ~70% of the surface, only ~55.", "minutes": 9, "section": "12.2", "pages": [2, 3], "print": "2–3", "sim": "productivity", "simTitle": "GPP − R = NPP slider lab: respiration eats the gross", "quick": ["A <strong>constant input of solar energy</strong> is the basic requirement for any ecosystem to function and sustain. <strong>Primary production</strong> is the amount of biomass or organic matter produced per unit area over a time period by plants during photosynthesis, expressed in <strong>g m⁻²</strong> or <strong>kcal m⁻²</strong>.", "The <strong>rate</strong> of biomass production is <strong>productivity</strong> (g m⁻² yr⁻¹ or (kcal m⁻²) yr⁻¹). <strong>Gross primary productivity (GPP)</strong> is the rate of organic-matter production during photosynthesis; a considerable amount is used in respiration, so <strong>GPP − R = NPP</strong>. <strong>Net primary productivity</strong> is the biomass available to heterotrophs (herbivores and decomposers), while <strong>secondary productivity</strong> is the rate of formation of new organic matter by <strong>consumers</strong>.", "Primary productivity depends on the <strong>plant species</strong> inhabiting an area, <strong>environmental factors</strong>, <strong>nutrient availability</strong> and the <strong>photosynthetic capacity</strong> of plants — so it varies across ecosystems.", "The annual NPP of the whole biosphere is approximately <strong>170 billion tons</strong> (dry weight); despite covering about <strong>70 per cent</strong> of the surface, the oceans contribute only <strong>55 billion tons</strong>. The book leaves the main reason for low ocean productivity as a discussion with your teacher."], "formulas": [{"label": "NPP identity", "html": "NPP = GPP − R", "cond": "§12.2; R = respiration losses of producers"}, {"label": "Units", "html": "production: g m⁻² or kcal m⁻²; productivity (rate): g m⁻² yr⁻¹ or (kcal m⁻²) yr⁻¹", "cond": "§12.2"}, {"label": "Biosphere split", "html": "170 billion tons total NPP ≈ 55 (oceans) + 115 (land), dry weight", "cond": "§12.2; oceans ~70% of surface"}], "deeper": "Do not confuse the three productivities: GPP is what photosynthesis fixes, NPP is what remains after producers respire (the heterotrophs' share), and secondary productivity belongs to consumers forming new organic matter from that share. Land therefore accounts for 170 − 55 = 115 billion tons of annual NPP.", "worked": "Biosphere split (book figures): land NPP = 170 − 55 = 115 billion tons dry weight per year. In rate units the same identity holds: a patch with GPP 52 kcal m⁻² yr⁻¹ and respiration 17 kcal m⁻² yr⁻¹ has NPP = 52 − 17 = 35 kcal m⁻² yr⁻¹ available to herbivores and decomposers.", "prediction": {"prompt": "The ocean covers ~70% of Earth's surface but yields only ~55 of 170 billion tons of NPP. The most plausible textbook-grounded hypothesis is", "options": ["Light attenuates with depth and nutrients/photosynthetic capacity limit producers, so per-area production stays low", "The ocean has no producers at all", "Seawater chemically destroys all organic matter as it forms"], "answer": 0, "explanation": "Productivity depends on plant species present, environmental factors, nutrient availability and photosynthetic capacity (§12.2) — all of which limit the ocean per unit area. The book poses this as a teacher discussion, so any answer must cite these factors."}, "connect": [["Why cropland beats the open sea per hectare", "Fertilised, irrigated cropland raises exactly the §12.2 levers — nutrients, water, high-photosynthetic-capacity species — while the open ocean is starved of nutrients over vast areas, so its per-area productivity stays low."], ["Wow — land wins 115 to 55", "Subtract the ocean's 55 from the biosphere's 170: land fixes about 115 billion tons yearly — more than double the ocean despite one-third the area. That single subtraction is the quantitative punch of §12.2."]], "recall": "State GPP − R = NPP with units; define secondary productivity; give the 170/55 biosphere figures and the four factors productivity depends on.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Net primary productivity equals", "options": ["GPP − R (respiration losses)", "GPP + R", "R − GPP"], "answer": 0, "hint": "Respiration consumes part of the gross.", "solution": "NPP = GPP − R; the remainder is available to heterotrophs.", "wrong": ["Adding respiration would exceed what photosynthesis fixed.", "That would make NPP negative whenever producers respire."]}, {"level": "Medium", "type": "number", "map": "§12.2 biosphere", "prompt": "Annual NPP of land (billion tons dry weight) if the biosphere total is 170 and oceans contribute 55", "answer": 115, "unit": "billion tons", "tolerance": 1, "hint": "Total minus ocean share.", "solution": "170 − 55 = 115 billion tons on land."}, {"level": "Hard", "type": "number", "map": "NPP = GPP − R", "prompt": "NPP (kcal m⁻² yr⁻¹) of a patch with GPP 52 and respiration loss 17", "answer": 35, "unit": "kcal m⁻² yr⁻¹", "tolerance": 0.5, "hint": "Subtract respiration from the gross.", "solution": "NPP = 52 − 17 = 35 kcal m⁻² yr⁻¹."}], "resources": [{"title": "NCERT §12.2 — Productivity GPP/NPP (official PDF, PDF p.2)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo112.pdf#page=2"}]}, {"id": "decomposition", "nav": "Decomposition 5 steps", "title": "Decomposition: fragmentation to mineralisation, and what controls the rate", "deck": "Detritus is the raw material; fragmentation, leaching, catabolism, humification and mineralisation act simultaneously. Humus resists decay and stores nutrients; mineralisation releases them. Lignin slows, nitrogen and warmth speed.", "minutes": 9, "section": "12.3", "pages": [3, 4], "print": "3–4", "sim": "decomposition", "simTitle": "Decomposition 5-step stepper: detritus → humus → inorganic nutrients", "quick": ["Decomposers break down complex organic matter into inorganic substances like <strong>carbon dioxide, water and nutrients</strong> — the process is <strong>decomposition</strong>. The raw material is <strong>detritus</strong>: dead plant remains (leaves, bark, flowers) and dead animal remains, including faecal matter. The earthworm is the farmer's 'friend' because it breaks down complex organic matter and loosens the soil.", "The five steps are <strong>fragmentation</strong> (detritivores such as earthworms break detritus into smaller particles), <strong>leaching</strong> (water-soluble inorganic nutrients go down into the soil horizon and precipitate as unavailable salts), <strong>catabolism</strong> (bacterial and fungal enzymes degrade detritus into simpler inorganic substances), <strong>humification</strong> and <strong>mineralisation</strong> — and all operate <strong>simultaneously</strong> on the detritus (Figure 12.1).", "<strong>Humification</strong> accumulates <strong>humus</strong>: a dark-coloured amorphous substance, highly resistant to microbial action, decomposing extremely slowly; colloidal in nature, it serves as a <strong>reservoir of nutrients</strong>. <strong>Mineralisation</strong> is the further microbial degradation of humus with release of inorganic nutrients.", "Decomposition is largely an <strong>oxygen-requiring</strong> process. Its rate is controlled by the <strong>chemical composition of detritus</strong> and <strong>climatic factors</strong>: detritus rich in <strong>lignin and chitin</strong> decomposes slowly, detritus rich in <strong>nitrogen and water-soluble substances like sugars</strong> quickly; <strong>temperature and soil moisture</strong> regulate it via soil microbes — <strong>warm and moist</strong> favour decomposition, while <strong>low temperature and anaerobiosis</strong> inhibit it and build up organic materials."], "formulas": [{"label": "Five steps in order", "html": "fragmentation → leaching → catabolism → humification → mineralisation", "cond": "§12.3; all operate simultaneously (Fig 12.1)"}, {"label": "Humus vs mineralisation", "html": "humification → humus (dark, amorphous, colloidal nutrient reservoir, resists microbes); mineralisation → release of inorganic nutrients", "cond": "§12.3"}, {"label": "Rate controls", "html": "slow if lignin/chitin-rich; fast if nitrogen/sugar-rich; warm + moist favour; low T + anaerobiosis inhibit", "cond": "§12.3; oxygen-requiring"}], "deeper": "Keep the agents straight: detritivores (earthworm) fragment; water leaches; bacterial and fungal enzymes catabolise; soil microbes humify and mineralise. Products at the end are carbon dioxide, water and inorganic nutrients — the same inorganic pool the pond autotrophs draw on.", "worked": "Exercise 10 skeleton: define decomposition (complex organic of detritus → CO₂, water, inorganic nutrients by decomposers); describe the five processes in order with agents; name the two products of the late stages — humus (humification) and released inorganic nutrients (mineralisation); state the two rate controls with one example each.", "prediction": {"prompt": "Two leaf litters lie in warm, moist soil: one rich in lignin, one rich in nitrogen and sugars. Which disappears faster, and why?", "options": ["The nitrogen/sugar-rich litter — chemistry favours microbes, and warmth plus moisture help them", "The lignin-rich litter — tough material breaks down faster", "Both at exactly the same rate — climate alone decides"], "answer": 0, "explanation": "In a given climate, lignin/chitin-rich detritus is slow while nitrogen/sugar-rich detritus is quick; warm moist conditions favour microbial activity (§12.3)."}, "connect": [["Vermicompost pits on Indian farms", "Farmers harness the book's 'farmer's friend': earthworms fragment crop residue and dung while microbes catabolise it — a managed §12.3 assembly line turning detritus into humus-rich manure."], ["Wow — cold peaks stockpile what forests spend", "Where low temperature and anaerobiosis prevail — high Himalayan soils and waterlogged cold sites — decomposition stalls and organic material builds up instead of recycling, the exact inhibition case §12.3 predicts."]], "recall": "List the five decomposition steps with agents in order; contrast humification and mineralisation; state the chemical and climatic rate controls.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Detritus, the raw material of decomposition, is", "options": ["Dead plant and animal remains, including faecal matter", "Living phytoplankton and zooplankton", "Dissolved oxygen in pond water"], "answer": 0, "hint": "Leaves, bark, flowers, dead remains, faecal matter.", "solution": "Detritus = dead remains (leaves, bark, flowers, animals, faecal matter).", "wrong": ["Those are living pond components, not detritus.", "Oxygen is a requirement of decomposition, not its raw material."]}, {"level": "Medium", "type": "number", "map": "§12.3 steps", "prompt": "Number of steps in decomposition (fragmentation, leaching, catabolism, humification, mineralisation)", "answer": 5, "unit": "steps", "tolerance": 0.1, "hint": "Fragmentation first, mineralisation last.", "solution": "Five steps, all operating simultaneously on the detritus."}, {"level": "Hard", "type": "mcq", "prompt": "Which detritus decomposes more slowly in the same climate?", "options": ["Detritus rich in lignin and chitin", "Detritus rich in nitrogen and water-soluble sugars", "Both decompose at identical rates"], "answer": 0, "hint": "Tough structural polymers resist enzymes.", "solution": "Lignin/chitin-rich detritus is slow; nitrogen/sugar-rich detritus is quick (§12.3).", "wrong": ["That combination decomposes quicker, not slower.", "Chemical composition changes the rate even in identical climates."]}], "resources": [{"title": "NCERT §12.3 — Decomposition 5 steps (official PDF, PDF p.3)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo112.pdf#page=3"}]}, {"id": "energy-flow", "nav": "Energy flow & 10% law", "title": "Energy flow: PAR, grazing vs detritus chains, trophic levels and the 10% law", "deck": "Sun is the only source (except deep-sea hydrothermal systems). PAR is <50% of incident radiation; plants capture 2–10% of it. Grazing and detritus chains interlink into webs; only ~10% crosses each trophic level.", "minutes": 9, "section": "12.4", "pages": [5, 7], "print": "5–7", "sim": "energyflow", "simTitle": "10% law chain visualiser: 10 000 → 1 000 → 100 → 10", "quick": ["Except for the deep-sea hydro-thermal ecosystem, the <strong>sun is the only source of energy</strong> for all ecosystems. Of the incident solar radiation, <strong>less than 50 per cent is photosynthetically active radiation (PAR)</strong>, and plants capture only <strong>2–10 per cent of the PAR</strong> — yet this small amount sustains the entire living world. Ecosystems obey the thermodynamic laws: energy flow is <strong>unidirectional</strong> (sun → producers → consumers), and a constant supply is needed to synthesise molecules against the universal tendency toward increasing disorderliness.", "Producers are the green plants — <strong>herbaceous and woody plants</strong> on land; <strong>phytoplankton, algae and higher plants</strong> in water. All animals depend on them directly or indirectly and are <strong>consumers (heterotrophs)</strong>: <strong>primary consumers</strong> are herbivores (insects, birds, mammals on land; molluscs in water), feeding on producers; <strong>secondary consumers</strong> are the primary carnivores; then <strong>tertiary consumers</strong> (secondary carnivores). A grazing food chain (GFC) reads: <strong>Grass (producer) → Goat (primary consumer) → Man (secondary consumer)</strong>.", "The <strong>detritus food chain (DFC)</strong> begins with <strong>dead organic matter</strong>; its decomposers — mainly <strong>fungi and bacteria (saprotrophs)</strong> — secrete digestive enzymes and absorb the simple inorganic products. In <strong>aquatic</strong> ecosystems the GFC is the major energy conduit; in <strong>terrestrial</strong> ecosystems a much larger fraction flows through the <strong>DFC</strong>. The chains interconnect (DFC organisms are prey to GFC animals; cockroaches and crows are omnivores) into a <strong>food web</strong>.", "Feeding position defines the <strong>trophic level</strong>: producers T1, herbivores T2, carnivores T3 (Figure 12.2); energy <strong>decreases at successive levels</strong>. Each level holds a <strong>standing crop</strong> — biomass (dry weight is more accurate) or numbers per unit area. Transfer follows the <strong>10 per cent law</strong>: only ~10% of energy passes to each higher level, which restricts the grazing chain to producer → herbivore → primary carnivore → secondary carnivore (Figure 12.3). Death at any level diverts energy into detritus for decomposers."], "formulas": [{"label": "PAR capture", "html": "PAR < 50% of incident solar; plants capture 2–10% of PAR; producers convert ~1% of sunlight into NPP (Fig 12.4d)", "cond": "§12.4 + Fig 12.4d"}, {"label": "10% law", "html": "T1 → T2 → T3 → T4 ≈ 10 000 → 1 000 → 100 → 10", "cond": "§12.4; Fig 12.3"}, {"label": "Trophic ladder", "html": "T1 producers → T2 herbivores (primary consumers) → T3 carnivores (secondary consumers) → T4 secondary carnivores", "cond": "§12.4; Fig 12.2"}], "deeper": "Two book questions to carry: 'How would you classify human beings?' (omnivores spanning levels — like the sparrow, primary consumer on seeds/fruits/peas and secondary consumer on insects/worms) and whether the detritus chain faces the same level limit (posed open in §12.4). Also note why dry weight beats fresh weight for biomass: water content fluctuates.", "worked": "Exercises 2–4 plus chain math: Q2 → decomposers hold the largest population; Q3 → T2 in a lake is zooplankton (phytoplankton are T1 producers); Q4 → 'secondary producers' is none of the above (consumers show secondary productivity, not production). Ex 5: PAR is <50% of incident radiation (option b, 50%) — distinct from the 2–10% of PAR that plants capture. Chain math: 10 000 J at producers → ~1 000 J herbivores → ~100 J primary carnivores → ~10 J secondary carnivores.", "prediction": {"prompt": "Grass holds 6 000 kJ. By the 10% law, the Man in Grass → Goat → Man receives about", "options": ["60 kJ — two successive 10% transfers (6 000 → 600 → 60)", "600 kJ — only one transfer is lost", "6 000 kJ — energy is conserved across levels"], "answer": 0, "explanation": "Each level passes ~10%: goat gets ~600 kJ, man ~60 kJ. Energy is lost (ultimately as heat), so higher levels get progressively less."}, "connect": [["Sundarbans: a detritus engine", "In the Sundarbans mangroves, huge leaf-litter fall feeds crabs, fungi and bacteria first — the terrestrial rule that a much larger fraction of energy flows through the DFC than the GFC, visible across the delta mud."], ["Wow — the lake vs land swap", "A lake runs mostly on its grazing chain (phytoplankton → zooplankton → fishes) while a forest runs mostly on its detritus chain (litter → decomposers → detritivores) — the same sunlight, opposite conduits, exactly as §12.4 contrasts them."]], "recall": "Give the PAR figures; contrast GFC and DFC with the Grass→Goat→Man example; state the trophic ladder and the 10% law with chain math.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The second trophic level in a lake is the", "options": ["Zooplankton", "Phytoplankton", "Benthos"], "answer": 0, "hint": "T1 producers are eaten by …?", "solution": "Phytoplankton (T1 producers) → zooplankton (T2 primary consumers). (Exercise 3.)", "wrong": ["Phytoplankton are the T1 producers.", "Benthos are bottom dwellers, not T2 by definition."]}, {"level": "Medium", "type": "number", "map": "10% law chain", "prompt": "Energy (J) reaching secondary carnivores if producers hold 10 000 J (10% law, three transfers)", "answer": 10, "unit": "J", "tolerance": 1, "hint": "10 000 → 1 000 → 100 → ?", "solution": "10 000 × 0.1³ = 10 J (Fig 12.3 chain)."}, {"level": "Hard", "type": "mcq", "prompt": "'Secondary producers are herbivores / producers / carnivores / none of the above.' The correct choice is", "options": ["None of the above", "Herbivores", "Producers"], "answer": 0, "hint": "Consumers show secondary productivity — but are they producers?", "solution": "The book recognises producers and consumers; 'secondary producers' is not a valid category, so none of the above. (Exercise 4.)", "wrong": ["Herbivores are primary consumers with secondary productivity.", "Producers are primary, not secondary."]}], "resources": [{"title": "NCERT §12.4 — Energy flow & 10% law (official PDF, PDF p.5)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo112.pdf#page=5"}]}, {"id": "pyramids", "nav": "Ecological pyramids", "title": "Ecological pyramids: number, biomass and energy — upright, inverted, always", "deck": "Base = producers, apex = top consumer. Number and biomass pyramids are usually upright but invert (tree→insects; sea fishes>phytoplankton). Energy is always upright: heat is lost at every step.", "minutes": 8, "section": "12.5", "pages": [7, 9], "print": "7–9", "sim": "pyramids", "simTitle": "Pyramid builder: number / biomass / energy with upright–inverted toggle", "quick": ["An ecological pyramid has a broad <strong>base of producers (first trophic level)</strong> narrowing to an <strong>apex of tertiary/top consumers</strong>, expressing food or energy relations in <strong>number, biomass or energy</strong>. Figure 12.4a is a grassland <strong>pyramid of numbers</strong>: nearly <strong>6 million plants</strong> support only <strong>3 top-carnivores</strong>. Figure 12.4b shows biomass falling sharply at higher levels, while Figure 12.4d is an ideal <strong>pyramid of energy</strong> — primary producers convert only <strong>1% of sunlight</strong> into NPP.", "In most ecosystems all three pyramids are <strong>upright</strong>: producers exceed herbivores in number and biomass, herbivores exceed carnivores, and lower-level energy always exceeds higher-level energy. But count the <strong>insects on one big tree</strong>, then the small birds on the insects and larger birds on the smaller — the <strong>pyramid of numbers inverts</strong>. Likewise the <strong>sea's biomass pyramid is generally inverted</strong>: fish biomass far exceeds the small standing crop of phytoplankton that supports the large zooplankton crop (Figure 12.4c).", "The <strong>pyramid of energy is always upright and can never be inverted</strong>: every transfer loses some energy as heat, so each bar — energy per trophic level per unit time or area — must shrink upward.", "Pyramids have limits (p. 214 box): they ignore a species spanning <strong>two or more trophic levels</strong> (the sparrow: primary consumer on seeds/fruits/peas, secondary on insects/worms), assume a <strong>simple food chain</strong> that almost never exists, cannot accommodate a <strong>food web</strong>, and give <strong>saprophytes no place</strong> despite their vital role. Any calculation must also include <strong>all organisms</strong> at a level, and trophic level is a <strong>functional</strong> level, not a species."], "formulas": [{"label": "Three pyramids", "html": "number (12.4a: ~6M plants → 3 top-carnivores) · biomass (12.4b upright, 12.4c inverted sea) · energy (12.4d always upright)", "cond": "§12.5; Fig 12.4 a–d"}, {"label": "Upright vs inverted", "html": "upright: producers > herbivores > carnivores; inverted number: tree → insects → birds; inverted biomass: sea fishes > phytoplankton", "cond": "§12.5"}, {"label": "Energy always upright", "html": "heat lost at each transfer; bar = energy per level per unit time/area", "cond": "§12.5"}], "deeper": "The sea 'paradox' resolves through turnover: a tiny phytoplankton standing crop with rapid reproduction feeds a larger zooplankton crop — biomass at an instant misleads, while the energy pyramid (a rate) never inverts. Trophic level as function, not species, is why humans and sparrows sit on several levels at once.", "worked": "Grassland numbers (Fig 12.4a): nearly 6 000 000 producers at the base support just 3 top-carnivores at the apex — the classic upright pyramid of numbers. Tree case: one producer → many insects → fewer small birds → still fewer large birds reads apex-down, i.e. inverted. Energy check (Fig 12.4d): only ~1% of sunlight becomes NPP at the base, and each level above keeps ~10% of the one below.", "prediction": {"prompt": "You census one banyan: 1 tree, thousands of insects, tens of small birds, 2 large birds. The pyramid of numbers is", "options": ["Inverted — one producer supports progressively counted consumers upward", "Upright — producers must always outnumber consumers", "An energy pyramid — numbers and energy are the same thing"], "answer": 0, "explanation": "The book's own tree–insect–bird census inverts the number pyramid; uprightness holds for energy, not always for numbers."}, "connect": [["Sacred-grove pyramids", "A sacred grove's giantTerminalia or banyan hosts exactly the book's census — one tree, swarms of insects, insect-eating birds above them — a living inverted pyramid of numbers protected by tradition."], ["Wow — the sea stands on its head", "In the sea, fish biomass outweighs the phytoplankton supporting it — the biomass pyramid flipped — yet the energy pyramid above the same water stays stubbornly upright, because watts, unlike weight, cannot be recycled."]], "recall": "Name the three pyramid types with figure examples; state which invert and why; explain why energy never inverts; list the four pyramid limitations.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The pyramid of energy is always upright because", "options": ["Some energy is lost as heat at each transfer", "Producers always outnumber consumers", "Biomass always decreases upward"], "answer": 0, "hint": "What happens to energy at every step?", "solution": "Heat loss at each trophic transfer forces every higher bar lower — never inverted.", "wrong": ["Numbers can invert (tree → insects).", "Biomass can invert (sea). Neither forces the energy shape."]}, {"level": "Medium", "type": "number", "map": "Fig 12.4a grassland", "prompt": "Top-carnivores supported by nearly 6 million plants in the grassland pyramid of numbers", "answer": 3, "unit": "animals", "tolerance": 0.5, "hint": "Figure 12.4a caption.", "solution": "Only three top-carnivores crown ~6 million producers."}, {"level": "Hard", "type": "number", "map": "Fig 12.4d energy", "prompt": "Percentage of sunlight energy that primary producers convert into NPP (ideal energy pyramid)", "answer": 1, "unit": "%", "tolerance": 0.2, "hint": "Figure 12.4d caption.", "solution": "Only ~1% of sunlight becomes NPP; of that, ~10% crosses each level."}], "resources": [{"title": "NCERT §12.5 — Ecological pyramids (official PDF, PDF p.7)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo112.pdf#page=7"}]}], "exercises": [{"number": 1, "conceptIdx": 0, "page": 10, "printPage": null, "question": "Fill in the blanks. (a) Plants are called as_________because they fix carbon dioxide. (b) In an ecosystem dominated by trees, the pyramid (of numbers) is_________type. (c) In aquatic ecosystems, the limiting factor for the productivity is_________. (d) Common detritivores in our ecosystem are_________. (e) The major reservoir of carbon on earth is_________.", "steps": ["(a) Plants fix carbon dioxide during photosynthesis, i.e. they produce organic matter — the book's definition of producers (§12.1, §12.4).", "(b) One tree supports many insects, which support birds above them — the §12.5 inverted pyramid of numbers.", "(c) Aquatic producers depend on light reaching through water; light limits aquatic productivity.", "(d) The book's detritivore example is the earthworm (§12.3, the farmer's 'friend').", "(e) The summary names the carbon cycle's reservoir as atmosphere/hydrosphere; the major earth reservoir is the oceans."], "answer": "(a) producers (b) inverted (c) light (d) earthworms (e) oceans."}, {"number": 2, "conceptIdx": 3, "page": 11, "printPage": null, "question": "Which one of the following has the largest population in a food chain? (a) Producers (b) Primary consumers (c) Secondary consumers (d) Decomposers", "steps": ["Population at each step of the grazing chain shrinks upward by the 10% law (§12.4).", "Decomposers sit outside the grazing chain: every dead organism at every level becomes their detritus (§12.3–12.4).", "Hence the decomposer population, feeding on all levels, is the largest."], "answer": "(d) Decomposers."}, {"number": 3, "conceptIdx": 3, "page": 11, "printPage": null, "question": "The second trophic level in a lake is (a) Phytoplankton (b) Zooplankton (c) Benthos (d) Fishes", "steps": ["T1 in a lake = producers: phytoplankton, algae, higher plants (§12.4).", "T2 = primary consumers feeding on producers: zooplankton.", "Fishes are higher consumers; benthos are bottom dwellers, not a trophic level."], "answer": "(b) Zooplankton."}, {"number": 4, "conceptIdx": 3, "page": 11, "printPage": null, "question": "Secondary producers are (a) Herbivores (b) Producers (c) Carnivores (d) None of the above", "steps": ["The book recognises only producers (primary production) and consumers (secondary productivity, §12.2).", "Herbivores and carnivores are consumers, not producers.", "'Secondary producer' is therefore not a valid category."], "answer": "(d) None of the above."}, {"number": 5, "conceptIdx": 3, "page": 11, "printPage": null, "question": "What is the percentage of photosynthetically active radiation (PAR) in the incident solar radiation? (a) 100% (b) 50 % (c) 1-5% (d) 2-10%", "steps": ["§12.4: less than 50 per cent of incident solar radiation is PAR.", "2–10% is the fraction of PAR that plants capture — a different quantity.", "So the listed option matching the book is 50%."], "answer": "(b) 50%."}, {"number": 6, "conceptIdx": 3, "page": 11, "printPage": null, "question": "Distinguish between (a) Grazing food chain and detritus food chain (b) Production and decomposition (c) Upright and inverted pyramid (d) Food chain and Food web (e) Litter and detritus (f) Primary and secondary productivity", "steps": ["(a) GFC starts from living producers (Grass → Goat → Man); DFC starts from dead organic matter via saprotrophs (fungi, bacteria). Aquatic systems run mainly on GFC, terrestrial mainly on DFC (§12.4).", "(b) Production = capture of solar energy / biomass formation by producers; decomposition = breakdown of complex organic detritus to CO₂, water and nutrients by decomposers (§§12.2–12.3).", "(c) Upright: producers > herbivores > carnivores (most pyramids); inverted: tree → insects number pyramid, or sea biomass pyramid (§12.5).", "(d) Food chain = single linear feeding sequence; food web = natural interconnection of chains (e.g. via omnivores like crows) (§12.4).", "(e) Litter = fallen dead plant matter lying on the soil surface; detritus = all dead plant/animal remains including faecal matter, the raw material of decomposition (§12.3).", "(f) Primary productivity = rate of biomass production by producers (GPP/NPP); secondary productivity = rate of new organic-matter formation by consumers (§12.2)."], "answer": "See six distinctions above (GFC/DFC, production/decomposition, upright/inverted, chain/web, litter/detritus, primary/secondary productivity)."}, {"number": 7, "conceptIdx": 0, "page": 11, "printPage": null, "question": "Describe the components of an ecosystem.", "steps": ["Abiotic components: inorganic materials — air, water, soil — with dissolved substances and climatic inputs (solar input, temperature, day-length).", "Biotic components: producers (green plants), consumers (heterotrophs: herbivores, carnivores) and decomposers (fungi, bacteria, flagellates).", "Illustrate with the pond: water + bottom soil (abiotic); phytoplankton, algae, marginal plants (autotrophs); zooplankton, swimmers, bottom dwellers (consumers); bottom fungi, bacteria, flagellates (decomposers) (§12.1, Summary)."], "answer": "Abiotic (air, water, soil) + biotic (producers, consumers, decomposers), e.g. the four pond components of §12.1."}, {"number": 8, "conceptIdx": 4, "page": 11, "printPage": null, "question": "Define ecological pyramids and describe with examples, pyramids of number and biomass.", "steps": ["Definition: graphic relation of food/energy between trophic levels with producers at the base and top consumers at the apex, in number, biomass or energy (§12.5).", "Number: grassland upright — nearly 6 million plants support 3 top-carnivores (Fig 12.4a); tree-dominated system inverted — one tree → insects → birds.", "Biomass: usually upright with sharp decrease upward (Fig 12.4b); sea inverted — fish biomass exceeds phytoplankton, whose small crop supports large zooplankton (Fig 12.4c)."], "answer": "Pyramids = base-producers/apex-consumers in number, biomass or energy; number: grassland upright (6M → 3), tree inverted; biomass: upright on land, inverted in the sea."}, {"number": 9, "conceptIdx": 1, "page": 11, "printPage": null, "question": "What is primary productivity? Give brief description of factors that affect primary productivity.", "steps": ["Definition: amount of biomass/organic matter produced per unit area over a time period by plants during photosynthesis (g m⁻² or kcal m⁻²); its rate is productivity (per year); GPP − R = NPP (§12.2).", "Factors: plant species inhabiting the area, environmental factors, availability of nutrients, photosynthetic capacity of plants.", "Consequence: productivity varies across ecosystems — e.g. biosphere 170 billion tons with oceans only 55 despite ~70% surface."], "answer": "Biomass production rate of producers (GPP − R = NPP); depends on species, environment, nutrients and photosynthetic capacity."}, {"number": 10, "conceptIdx": 2, "page": 11, "printPage": null, "question": "Define decomposition and describe the processes and products of decomposition.", "steps": ["Definition: breakdown of complex organic matter into inorganic substances (CO₂, water, nutrients) by decomposers; detritus is the raw material (§12.3).", "Processes: fragmentation (earthworm detritivores), leaching (soluble nutrients down, precipitated as unavailable salts), catabolism (bacterial/fungal enzymes to simpler inorganics) — all simultaneous — then humification (dark amorphous colloidal humus, nutrient reservoir) and mineralisation (release of inorganic nutrients).", "Controls: lignin/chitin slow, nitrogen/sugars quicken; warm + moist favour, low temperature + anaerobiosis inhibit (oxygen-requiring process)."], "answer": "Detritus → (fragmentation, leaching, catabolism, humification, mineralisation) → CO₂ + water + inorganic nutrients (+ humus intermediate)."}, {"number": 11, "conceptIdx": 3, "page": 11, "printPage": null, "question": "Give an account of energy flow in an ecosystem.", "steps": ["Source: sun (except deep-sea hydrothermal); PAR < 50% of incident, plants capture 2–10%; flow is unidirectional and obeys thermodynamic laws (§12.4).", "Routes: GFC from producers (Grass → Goat → Man) vs DFC from dead matter via saprotrophs; aquatic mainly GFC, terrestrial mainly DFC; interlinked into food webs (omnivores).", "Levels: T1 producers → T2 herbivores → T3/T4 carnivores with decreasing energy; standing crop as biomass (dry weight best) or numbers; 10% law limits grazing levels; death feeds detritus decomposers (Figs 12.2–12.3)."], "answer": "Unidirectional solar flow via GFC/DFC food webs across T1–T4 with ~10% transfer per level and heat loss throughout."}], "pageOffset": null, "printPageStart": null, "printPageEnd": null, "paginationProvenance": "folio-absent-in-source"};
