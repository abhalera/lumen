<script>
(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp) disp.innerHTML = "t = <b>" + state.t.toFixed(1) + " s</b>";
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Concept View ---
  function renderConcept(idx){
    pause();
    state.conceptIndex = idx;
    state.t = 0;
    state.level = 0;

    var lessons = C.lessons || C.concepts || [];
    var l = lessons[idx];
    if(!l) return;

    var navTitle = l.nav || l.navTitle || l.title || ("Concept " + (idx + 1));

    // Update sidebar navigation active state
    var navBtns = document.querySelectorAll(".concept-nav");
    navBtns.forEach(function(b, i){
      if(b.id === "nav-revision") b.classList.remove("active");
      else b.classList.toggle("active", i === idx);
    });

    // Update top crumb
    var rawNum = C.chapterNumber || (C.chapter_meta && C.chapter_meta.number) || (C.code ? C.code.replace(/\D/g, '') : "01");
    var chNum = (!isNaN(parseInt(rawNum))) ? String(rawNum).padStart(2, '0') : rawNum;
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · " + navTitle.toUpperCase();

    // Show concept view, hide revision
    var cView = document.getElementById("concept-view");
    var rView = document.getElementById("revision-view");
    if(cView) cView.style.display = "block";
    if(rView) rView.style.display = "none";

    var html = "";

    // Concept Header
    var minutes = l.minutes || 10;
    var pdfRef = (l.pages && l.pages.length) ? ('PDF ' + (l.pages.length > 1 ? 'pp. ' + Math.min.apply(null, l.pages) + '–' + Math.max.apply(null, l.pages) : 'p.' + l.pages[0])) : (typeof printPage !== 'undefined' && printPage ? printPage : '');
     var printedPages = l.printPages ? ' · printed pp. ' + l.printPages : ' · printed folio absent in source';
     var printPage = l.print || (l.pages ? (Array.isArray(l.pages) ? l.pages.join("–") : l.pages) : (C.page_start ? "pp. " + C.page_start + "–" + C.page_end : ""));
    html += '<div class="concept-header">' +
      '<div class="concept-badge"><span>Concept ' + ("0" + (idx + 1)).slice(-2) + ' / ' + ("0" + lessons.length).slice(-2) + '</span>' +
      (printPage ? '<span class="time-pill">≈ ' + minutes + ' min · ' + pdfRef + printedPages + '</span>' : '<span class="time-pill">≈ ' + minutes + ' min</span>') +
      '</div>' +
      '<h1 class="concept-title">' + (l.title || navTitle) + '</h1>' +
      '<p class="concept-deck">' + (l.deck || l.summary || "") + '</p>' +
      '</div>';

    // 01 LEARN BLOCK
    html += '<section class="learn-section" data-block="learn" aria-label="Learn Concept">' +
      '<span class="block-tag">01 · LEARN · CORE ESSENTIALS</span>';

    var quickItems = [];
    if(Array.isArray(l.quick)) {
      quickItems = l.quick;
    } else if(typeof l.quick === 'string' && l.quick) {
      quickItems = [l.quick];
    } else if(Array.isArray(l.summary)) {
      quickItems = l.summary;
    } else if(l.reading_content) {
      quickItems = [l.reading_content];
    } else if(l.summary || l.deck) {
      quickItems = [l.summary || l.deck];
    }

    html += '<div class="quick-summary">' + quickItems.map(function(p){
      if(typeof p !== 'string') return '';
      if(p.includes('<p>') || p.includes('<div>') || p.includes('<h3>')) return p;
      var formatted = p.replace(/###\s+(.*?)\n/g, '<h3 style="margin-top:16px;color:var(--ink);">$1</h3>')
                       .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                       .replace(/\*(.*?)\*/g, '<em>$1</em>')
                       .replace(/\n\n/g, '</p><p>');
      return '<p>' + formatted + '</p>';
    }).join("") + '</div>';

    // Semantic Equations Card
    var formulas = l.formulas || [];
    if(formulas.length){
      html += '<div class="key-equations-card">' +
        '<div class="equations-heading">Key Relations for this Concept</div>' +
        '<div class="eq-grid">' +
        formulas.map(function(eq){
          var label = eq.label || eq.name || "Relation";
          var cond = eq.cond || "";
          var math = eq.html || eq.formula || "";
          return '<div class="eq-row">' +
            '<div class="eq-meta"><span class="eq-label">' + label + '</span>' + (cond ? '<span class="eq-cond">' + cond + '</span>' : '') + '</div>' +
            '<div class="eq-math">' + math + '</div>' +
            '</div>';
        }).join("") +
        '</div></div>';
    }

    // Deeper dive / core takeaways
    if(l.deeper){
      html += '<details class="deep-dive"><summary>Go deeper into the conceptual foundation</summary><p>' + l.deeper + '</p></details>';
    } else if(l.takeaways && l.takeaways.length){
      html += '<details class="deep-dive"><summary>Key Conceptual Takeaways</summary><ul>' +
        l.takeaways.map(function(t){ return '<li>' + t + '</li>'; }).join("") +
        '</ul></details>';
    }

    // Worked Example
    var worked = l.worked || l.worked_example;
    if(worked){
      var workedHtml = typeof worked === 'object' && worked !== null
        ? '<strong>' + (worked.title || 'Worked Example') + '</strong><br>' + (worked.problem || '') +
          (worked.given ? '<br><br><strong>Given:</strong> ' + worked.given : '') +
          (worked.steps ? '<br><strong>Steps:</strong><br>' + worked.steps.map(function(s){ return '&bull; ' + s; }).join('<br>') : '') +
          (worked.solution ? '<br><br><strong>Solution:</strong> ' + worked.solution : '') +
          (worked.answer ? '<br><br><strong>Answer:</strong> ' + worked.answer : '')
        : String(worked);
      html += '<details class="deep-dive"><summary>Worked textbook example step by step</summary><p>' + workedHtml + '</p></details>';
    }

    html += '</section>';

    // 02 PREDICT FIRST BLOCK
    var pred = l.prediction || l.predict || l.predict_first;
    if(pred && typeof pred === 'object' && (pred.prompt || pred.scenario) && pred.options && pred.options.length){
      var promptText = pred.prompt || pred.scenario || "";
      html += '<section class="predict-card" data-block="predict" aria-label="Predict First">' +
        '<div class="predict-badge">02 · PREDICT FIRST · TEST YOUR INTUITION</div>' +
        '<div class="predict-prompt">' + promptText.replace(/\n/g, '<br>') + '</div>' +
        '<div class="predict-options" id="predict-options">' +
        pred.options.map(function(opt, oi){
          return '<label class="predict-option"><input type="radio" name="predict_ans" value="' + oi + '"><span>' + opt + '</span></label>';
        }).join("") +
        '</div>' +
        '<div class="predict-actions">' +
        '<button class="btn-primary" id="btn-check-prediction">Check Prediction</button>' +
        '<button class="btn-secondary" id="btn-skip-prediction">Skip to Lab</button>' +
        '</div>' +
        '<div id="predict-feedback-box" class="predict-feedback" style="display:none;"></div>' +
        '</section>';
    }

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();
    var whatWatch = (pred && pred.prompt) ? pred.prompt : (typeof l.predict === 'string' ? l.predict : "Explore the interactive simulation controls, parameters, and readouts below.");
    html += '<section class="lab-card" data-block="play" aria-label="Interactive Laboratory">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +
      '<div id="sim-mount-point" class="sim-mount-container" style="width:100%;min-height:220px;margin-top:12px;">' +
        '<div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 720 300" role="img" aria-label="' + simTitle + '"></svg></div>' +
        '<div class="lab-legend" id="lab-legend"></div>' +
        '<div class="lab-toolbar" id="legacy-lab-toolbar">' +
          '<button class="toolbar-btn primary" id="btn-play-pause" aria-label="Play animation">▶ Play</button>' +
          '<button class="toolbar-btn" id="btn-step-fwd" aria-label="Step forward">⏭ Step (+0.5s)</button>' +
          '<button class="toolbar-btn" id="btn-reset-time" aria-label="Reset timeline">↺ Reset</button>' +
          '<span class="time-display" id="time-display">t = <b>0.0 s</b></span>' +
          '<div class="scrubber-wrap">' +
            '<input type="range" id="time-scrubber" class="timeline-scrubber" min="0" max="6" step="0.1" value="0" aria-label="Timeline time scrubber">' +
          '</div>' +
        '</div>' +
        '<div class="preset-bar" id="preset-bar"></div>' +
        '<div class="lab-controls-grid" id="lab-controls"></div>' +
        '<div class="lab-readout" id="lab-readout" role="status" aria-live="polite"></div>' +
        '<div class="lab-verdict" id="lab-verdict" role="status" aria-live="polite"></div>' +
      '</div>' +
      '</section>';

    // 04 CONNECT BLOCK
    var rawConnect = l.connect || [];
    var connectItems = [];
    if (typeof rawConnect === 'string' && rawConnect.trim()) {
      connectItems = [{ title: "Real-World Application", text: rawConnect }];
    } else if (Array.isArray(rawConnect)) {
      connectItems = rawConnect;
    } else if (rawConnect && typeof rawConnect === 'object') {
      connectItems = [rawConnect];
    }

    var resList = l.resources || [];
    var resHtml = resList.length ? '<div class="resource-list">' + resList.map(function(r){
      var rt = String(r.title).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      var rp = String(r.provider).replace(/&/g,'&amp;').replace(/</g,'&lt;');
      return '<div class="resource-card" data-resource="true"><span class="res-badge">RESOURCE \u00b7 OPTIONAL</span><div class="res-body"><strong>' + rt + '</strong><span class="res-provider">' + rp + '</span></div><a class="res-link" href="' + r.url + '" target="_blank" rel="noopener">Open source \u2197</a><span class="res-off">Needs internet \u00b7 lesson works offline</span></div>';
    }).join("") + '</div>' : '';
    if(connectItems.length){
      html += '<section class="connect-section" data-block="connect" aria-label="Real World Connections">' +
        '<span class="block-tag">04 · CONNECT · REAL WORLD APPLICATIONS</span>' +
        '<div class="connect-grid">' +
        connectItems.map(function(item){
          var title = typeof item === 'string' ? "Real World Application" : (Array.isArray(item) ? item[0] : (item.title || "Real World Context"));
          var desc = typeof item === 'string' ? item : (Array.isArray(item) ? item[1] : (item.text || item.desc || ""));
          var links = (typeof item === 'object' && item !== null) ? (Array.isArray(item) ? (item[2] || []) : (item.links || (item.link ? [{t: "Read Deeply", u: item.link}] : []))) : [];
          var v = (typeof item === 'object' && item !== null) ? (Array.isArray(item) ? (item[3] || null) : (item.video || null)) : null;
          var wow = /^Wow/i.test(title);

          var wowSrc = pdfRef;
          var wowPrint = (l && l.printPages) ? ' · printed pp. ' + l.printPages : ' (printed folio absent in source)';
          var cHtml = '<div class="connect-card' + (wow ? ' wow" data-wow="true" data-source="NCERT ' + C.book_name + ' Ch ' + C.chapterNumber + ' · ' + wowSrc + wowPrint + '"' : '') + '">';
          if(wow) cHtml += '<span class="wow-badge">WOW · REAL WORLD</span>';
          cHtml += '<h3>' + title + '</h3><p>' + desc + '</p>';
          if(v && v.id){
            cHtml += '<button class="video-facade" data-yt="' + v.id + '" aria-label="Play video: ' + v.title + '">' +
              '<span class="play-btn">▶</span>' +
              '<span class="video-title">' + v.title + ' · ' + v.channel + '</span>' +
              '</button>';
          }
          if(links && links.length){
            cHtml += '<p style="margin-top:10px;font-size:12px;color:var(--muted)">References: ' +
              links.map(function(a){ return '<a href="' + (a.u || a.link || "#") + '" target="_blank" rel="noopener">' + (a.t || a.label || "Read Deeply") + ' ↗</a>'; }).join(", ") +
              '</p>';
          }
          cHtml += '</div>';
          return cHtml;
        }).join("") +
        '</div>' + resHtml + '</section>';
    }

    // 05 PRACTICE BLOCK
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(quizzes.length){
      html += '<section class="practice-section" data-block="practice" aria-label="Practice and Mastery">' +
        '<span class="block-tag">05 · PRACTICE · MULTI-TIER CHALLENGE</span>' +
        '<div class="practice-nav">';
      for(var qi = 0; qi < quizzes.length; qi++){
        var tierName = qi === 0 ? "Tier 1: Easy" : (qi === 1 ? "Tier 2: Medium" : (qi === 2 ? "Tier 3: Hard" : "Question " + (qi + 1)));
        html += '<button class="level-tab' + (qi === 0 ? ' active' : '') + '" data-lvl="' + qi + '">' + tierName + '</button>';
      }
      html += '</div>' +
        '<div id="quiz-container"></div>' +
        '</section>';
    }

    // 06 REVISE CALLOUT
    var recall = l.recall || (l.takeaways && l.takeaways.length ? l.takeaways[0] : (l.core_takeaways && l.core_takeaways.length ? l.core_takeaways[0] : "Reflect on how this concept connects to physical reality."));
    html += '<div class="revise-callout"><strong>06 · REVISE · SAY IT IN YOUR OWN WORDS:</strong> ' + recall + '</div>';

    // Footer Navigation
    var nextNav = idx < lessons.length - 1 ? (lessons[idx + 1].nav || lessons[idx + 1].navTitle || lessons[idx + 1].title || ("Concept " + (idx + 2))) : "";
    html += '<div class="concept-footer-nav">' +
      (idx > 0 ? '<button class="btn-secondary" id="btn-prev-concept">← Concept ' + ("0" + idx).slice(-2) + '</button>' : '<span></span>') +
      (idx < lessons.length - 1 ? '<button class="btn-primary" id="btn-next-concept">Concept ' + ("0" + (idx + 2)).slice(-2) + ': ' + nextNav + ' →</button>' : '<button class="btn-primary" id="btn-goto-revision">Chapter Revision & Exercises →</button>') +
      '</div>';

    cView.innerHTML = html;

    // Attach Prediction Listeners
    var btnCheckPred = document.getElementById("btn-check-prediction");
    var btnSkipPred = document.getElementById("btn-skip-prediction");
    if(btnCheckPred && pred){
      btnCheckPred.addEventListener("click", function(){
        var sel = document.querySelector('input[name="predict_ans"]:checked');
        var fb = document.getElementById("predict-feedback-box");
        if(!sel){
          fb.style.display = "block";
          fb.className = "predict-feedback revealed";
          fb.textContent = "Please select one of the predictions first.";
          return;
        }
        var chosen = Number(sel.value);
        var expectedAns = pred.answer !== undefined ? pred.answer : (pred.correct !== undefined ? pred.correct : 0);
        var isRight = chosen === expectedAns;
        fb.style.display = "block";
        fb.className = "predict-feedback " + (isRight ? "correct" : "revealed");
        fb.innerHTML = (isRight ? "<b>Spot on!</b> " : "<b>Good thought! Here is the physical principle:</b> ") + (pred.explanation || "");
      });
    }
    if(btnSkipPred && pred){
      btnSkipPred.addEventListener("click", function(){
        var fb = document.getElementById("predict-feedback-box");
        fb.style.display = "block";
        fb.className = "predict-feedback revealed";
        fb.innerHTML = "<b>Key Principle:</b> " + (pred.explanation || "");
      });
    }

    // Attach Timeline Controls for legacy SIMS
    var btnPP = document.getElementById("btn-play-pause");
    if(btnPP) btnPP.addEventListener("click", function(){ if(state.playing) pause(); else play(); });
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep) btnStep.addEventListener("click", function(){ step(0.5); });
    var btnResTime = document.getElementById("btn-reset-time");
    if(btnResTime) btnResTime.addEventListener("click", function(){ resetTimeline(); });
    var scrub = document.getElementById("time-scrubber");
    if(scrub) scrub.addEventListener("input", function(e){ seekTimeline(e.target.value); });

    // Footer Next/Prev listeners
    var btnPrev = document.getElementById("btn-prev-concept");
    var btnNext = document.getElementById("btn-next-concept");
    var btnRev = document.getElementById("btn-goto-revision");
    if(btnPrev) btnPrev.addEventListener("click", function(){ renderConcept(idx - 1); window.scrollTo(0,0); });
    if(btnNext) btnNext.addEventListener("click", function(){ renderConcept(idx + 1); window.scrollTo(0,0); });
    if(btnRev) btnRev.addEventListener("click", function(){ renderRevision(); window.scrollTo(0,0); });

    // Mount Active Simulation Engine
    var simMount = document.getElementById("sim-mount-point");
    if(simMount){
      var cKey = "c" + (idx + 1);
      var conceptId = l.id || ("concept-" + (idx + 1));
      var simId = l.sim || conceptId;

      // 1. window.mountSimulation (iemh101, iemh102)
      if(typeof window.mountSimulation === 'function'){
        simMount.innerHTML = "";
        window.mountSimulation(cKey, simMount);
      }
      // 2. window.SIM_ENGINES (iemh101-iemh105)
      else if(window.SIM_ENGINES && window.SIM_ENGINES[cKey] && typeof window.SIM_ENGINES[cKey].init === 'function'){
        simMount.innerHTML = "";
        window.SIM_ENGINES[cKey].init(simMount);
      }
      // 3. window.SimEngine (iemh106-iemh108)
      else if(window.SimEngine && typeof window.SimEngine.init === 'function'){
        var targetKey = null;
        var candidateKeys = [conceptId, "sim-" + conceptId, "sim-concept-" + (idx + 1), "concept-" + (idx + 1), simId, cKey];
        for(var k = 0; k < candidateKeys.length; k++){
          if(candidateKeys[k] && window.SimEngine.getEngine(candidateKeys[k])){
            targetKey = candidateKeys[k];
            break;
          }
        }
        if(targetKey){
          simMount.innerHTML = "";
          window.SimEngine.init(targetKey, simMount);
        }
      }
      // 4. window.SIMS (iesc101-iesc113)
      else if(window.SIMS && (window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey])){
        var simObj = window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey];
        if(typeof simObj.mount === 'function'){
          if(simObj.mount.length >= 1 && !simObj.draw){
            simMount.innerHTML = "";
            simObj.mount(simMount);
          } else {
            simObj.mount(l);
          }
        }
      }
    }

    // Render Quiz for current level
    renderQuiz();

    // Attach Practice Level Tabs
    var lvlTabs = document.querySelectorAll(".level-tab");
    lvlTabs.forEach(function(tab){
      tab.addEventListener("click", function(){
        lvlTabs.forEach(function(t){ t.classList.remove("active"); });
        tab.classList.add("active");
        state.level = Number(tab.getAttribute("data-lvl"));
        renderQuiz();
      });
    });

    // Update URL hash
    window.location.hash = "#concept-" + (idx + 1);
  }

  // --- Render Quiz ---
  function renderQuiz(){
    var lessons = C.lessons || C.concepts || [];
    var l = lessons[state.conceptIndex];
    if(!l) return;
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(!quizzes.length) return;
    var q = quizzes[state.level] || quizzes[0];
    if(!q) return;

    var qk = qKey(state.conceptIndex, state.level);
    var old = state.answers[qk] || {};

    var box = document.getElementById("quiz-container");
    if(!box) return;

    var promptText = q.prompt || q.question || "";
    var isMcq = q.type === "mcq" || (q.options && q.options.length > 0);
    var correctAns = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : 0);
    var solutionText = q.solution || q.explanation || "";
    var hintText = q.hint || "Review the key relationships in the concept overview above.";

    var html = '<div class="question-prompt">' + promptText + '</div>';
    if(isMcq && q.options){
      html += '<div class="quiz-options">' +
        q.options.map(function(opt, oi){
          var checked = old.value === String(oi) ? " checked" : "";
          return '<label class="quiz-option"><input type="radio" name="quiz_ans" value="' + oi + '"' + checked + '><span>' + opt + '</span></label>';
        }).join("") +
        '</div>';
    } else {
      html += '<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">' +
        '<input type="number" step="any" id="quiz_num_ans" placeholder="Your answer" value="' + (old.value || "") + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;width:160px;">' +
        '<span style="font-weight:600;color:var(--muted);">' + (q.unit || "") + '</span>' +
        '</div>';
    }

    html += '<div class="quiz-actions">' +
      '<button class="btn-primary" id="btn-submit-quiz">Submit Answer</button>' +
      '<button class="btn-secondary" id="btn-toggle-hint">Show Hint</button>' +
      '</div>' +
      '<div id="quiz-hint-box" class="quiz-hint" style="display:none;">' + hintText + '</div>' +
      '<div id="quiz-feedback-box" class="quiz-feedback" style="display:none;"></div>';

    box.innerHTML = html;

    // Hint toggle
    var hintBtn = document.getElementById("btn-toggle-hint");
    if(hintBtn){
      hintBtn.addEventListener("click", function(){
        var hb = document.getElementById("quiz-hint-box");
        if(hb) hb.style.display = hb.style.display === "none" ? "block" : "none";
      });
    }

    // Submit listener
    var submitBtn = document.getElementById("btn-submit-quiz");
    if(submitBtn){
      submitBtn.addEventListener("click", function(){
        var fb = document.getElementById("quiz-feedback-box");
        if(!fb) return;
        var isRight = false;
        var userVal = "";

        if(isMcq){
          var sel = document.querySelector('input[name="quiz_ans"]:checked');
          if(!sel){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please select an answer choice first.";
            return;
          }
          userVal = sel.value;
          isRight = Number(userVal) === Number(correctAns);
        } else {
          var inp = document.getElementById("quiz_num_ans");
          if(!inp || inp.value.trim() === ""){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please enter a numerical answer.";
            return;
          }
          userVal = inp.value.trim();
          var num = parseFloat(userVal);
          isRight = Math.abs(num - parseFloat(correctAns)) <= (q.tolerance || 0.05);
        }

        state.answers[qk] = { value: userVal, checked: true };
        if(isRight){
          state.correct[qk] = true;
          fb.style.display = "block";
          fb.className = "quiz-feedback success";
          fb.innerHTML = "<b>That’s right!</b> " + solutionText;
        } else {
          fb.style.display = "block";
          fb.className = "quiz-feedback retry";
          var wrongMsg = (isMcq && q.wrong && q.wrong[Number(userVal)]) ? q.wrong[Number(userVal)] : hintText;
          fb.innerHTML = "<b>Not quite.</b> " + wrongMsg + "<br><small style=\"margin-top:6px;display:block;\"><b>Full explanation:</b> " + solutionText + "</small>";
        }
        updateProgress();
      });
    }

    if(old.checked && submitBtn){
      submitBtn.click();
    }
  }

  // --- Render Revision View ---
  var currentExFilter = -1;

  function renderRevision(){
    pause();
    document.querySelectorAll(".concept-nav").forEach(function(b){ b.classList.remove("active"); });
    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.classList.add("active");

    var rawNum = C.chapterNumber || (C.chapter_meta && C.chapter_meta.number) || (C.code ? C.code.replace(/\D/g, '') : "01");
    var chNum = (!isNaN(parseInt(rawNum))) ? String(rawNum).padStart(2, '0') : rawNum;
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · NCERT EXERCISES & REVISION";

    var cView = document.getElementById("concept-view");
    var revView = document.getElementById("revision-view");
    if(cView) cView.style.display = "none";
    if(revView) revView.style.display = "block";

    var exList = C.exercises || [];
    if(!exList.length && C.exerciseMap){
      exList = C.exerciseMap.map(function(m){
        return {
          q: m[0],
          number: String(m[0]),
          title: m[1],
          conceptIdx: m[2],
          page: m[3],
          printPage: null,
          question: m[4] || m[1],
          steps: [m[5] || "Refer to concept explanation."],
          answer: m[5] || ""
        };
      });
    }

    var totalEx = exList.length;
    var html = '<div class="concept-header">' +
      '<span class="concept-badge">NCERT EXERCISE COMPENDIUM</span>' +
      '<h1 class="concept-title">Revise, Reflect, Refine</h1>' +
      '<p class="concept-deck">All ' + totalEx + ' exercises from NCERT Class 12 ' + (C.book_name || '') + ' with step-by-step solutions.</p>' +
      '</div>';

    // Filter Bar & Expand/Collapse All
    var lessons = C.lessons || C.concepts || [];
    html += '<div class="exercise-compendium-header">' +
      '<div class="exercise-filter-bar">' +
      '<button class="filter-chip ' + (currentExFilter === -1 ? 'active' : '') + '" data-cfilter="-1">All Exercises (' + totalEx + ')</button>' +
      lessons.map(function(l, li){
        var nav = l.nav || l.navTitle || l.title || ("C0" + (li+1));
        return '<button class="filter-chip ' + (currentExFilter === li ? 'active' : '') + '" data-cfilter="' + li + '">C0' + (li+1) + ': ' + nav + '</button>';
      }).join("") +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn-secondary" id="btn-expand-all" style="padding:6px 12px;font-size:13px;">Expand All Guidance</button>' +
      '<button class="btn-secondary" id="btn-collapse-all" style="padding:6px 12px;font-size:13px;">Collapse All</button>' +
      '</div>' +
      '</div>';

    // Exercise Cards List
    html += '<div id="exercise-cards-container">';
    var filtered = currentExFilter === -1 ? exList : exList.filter(function(e){
      return e.conceptIdx === currentExFilter || (e.section && e.section.includes(String(currentExFilter + 1)));
    });

    html += filtered.map(function(ex, eIdx){
      var qNum = ex.number || ex.q || (eIdx + 1);
      var sectionLabel = ex.section ? ('<span class="q-badge" style="background:#e0f2fe;color:#0369a1;margin-right:6px;">' + ex.section + '</span>') : '';
      var l = (ex.conceptIdx !== undefined && lessons[ex.conceptIdx]) ? lessons[ex.conceptIdx] : null;
      var conceptLink = l ? ('<a href="#concept-' + (ex.conceptIdx + 1) + '" class="q-concept-link" data-idx="' + ex.conceptIdx + '">Explore in Concept ' + ("0" + (ex.conceptIdx + 1)).slice(-2) + ' (' + (l.nav || l.navTitle || l.title) + ') ↗</a>') : '';

      var guidanceHtml = "";
      if(ex.guidance){
        if(typeof ex.guidance === 'string'){
          guidanceHtml = ex.guidance;
        } else if(Array.isArray(ex.guidance)){
          guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
            (ex.answer ? '<p><strong>Answer:</strong> ' + ex.answer + '</p>' : '') +
            '<ol>' + ex.guidance.map(function(g){ return '<li>' + g + '</li>'; }).join('') + '</ol></div>';
        }
      } else if(ex.steps && ex.steps.length){
        guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
          (ex.given ? '<div class="given-data"><b>Given:</b> ' + ex.given + '</div>' : '') +
          '<ol class="solution-steps">' + ex.steps.map(function(st){ return '<li>' + st + '</li>'; }).join('') + '</ol>' +
          (ex.answer ? '<div class="answer-box"><b>Final Answer:</b> ' + ex.answer + '</div>' : '') +
          '</div>';
      }

      var exPg = ex.page || ex.pdfPage;
      var exCite = exPg ? ('<span class="q-cite">PDF p.' + exPg + ((C.pageOffset === null || C.pageOffset === undefined) ? ' · printed folio absent in source' : ' · printed p.' + (exPg + C.pageOffset)) + '</span>') : '';
      return '<article class="exercise-card" id="exercise-q' + qNum + '">' +
        '<div class="exercise-card-meta">' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
        sectionLabel +
        '<span class="q-badge">QUESTION ' + qNum + '</span>' + exCite +
        '</div>' +
        conceptLink +
        '</div>' +
        
        '<div class="exercise-question-text" style="font-size:15px;line-height:1.6;margin:12px 0;white-space:pre-wrap;">' + (ex.question || ex.title || "") + '</div>' +
        
        '<details class="exercise-drawer">' +
        '<summary class="exercise-drawer-btn">📖 View Step-by-Step Guidance & Full Solution</summary>' +
        '<div class="exercise-solution-body" style="padding:14px;background:#f8fafc;border-radius:8px;margin-top:8px;">' +
        guidanceHtml +
        '</div>' +
        '</details>' +
        '</article>';
    }).join("");

    html += '</div>';

    revView.innerHTML = html;

    // Attach Filter Listeners
    revView.querySelectorAll(".filter-chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        currentExFilter = Number(chip.getAttribute("data-cfilter"));
        renderRevision();
      });
    });

    // Attach Expand/Collapse All Listeners
    var btnExp = document.getElementById("btn-expand-all");
    var btnCol = document.getElementById("btn-collapse-all");
    if(btnExp){
      btnExp.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = true; });
      });
    }
    if(btnCol){
      btnCol.addEventListener("click", function(){
        revView.querySelectorAll("details.exercise-drawer").forEach(function(d){ d.open = false; });
      });
    }

    // Concept Navigation Links
    revView.querySelectorAll(".q-concept-link").forEach(function(a){
      a.addEventListener("click", function(e){
        e.preventDefault();
        var cIdx = Number(a.getAttribute("data-idx"));
        renderConcept(cIdx);
        window.scrollTo(0, 0);
      });
    });

    window.location.hash = "#revision";
  }

  // --- Build Sidebar Nav ---
  function buildSidebar(){
    var navContainer = document.getElementById("sidebar-nav");
    if(!navContainer) return;
    var lessons = C.lessons || C.concepts || [];
    navContainer.innerHTML = lessons.map(function(l, i){
      var nav = l.nav || l.navTitle || l.title || ("Concept " + (i + 1));
      return '<button class="concept-nav" data-cidx="' + i + '">' +
        '<span class="num">' + ("0" + (i + 1)).slice(-2) + '</span>' +
        '<span>' + nav + '</span>' +
        '</button>';
    }).join("");

    navContainer.querySelectorAll(".concept-nav").forEach(function(b){
      b.addEventListener("click", function(){
        var idx = Number(b.getAttribute("data-cidx"));
        renderConcept(idx);
      });
    });

    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.addEventListener("click", renderRevision);
  }

  // --- Reset Progress Button ---
  var resetProgBtn = document.getElementById("btn-reset-progress");
  if(resetProgBtn){
    resetProgBtn.addEventListener("click", function(){
      if(confirm("Reset all quiz answers and mastery progress for this chapter?")){
        state.answers = {};
        state.correct = {};
        saveStorage();
        updateProgress();
        renderQuiz();
      }
    });
  }

  // --- Handle Video Facades (No preloaded iframes) ---
  document.addEventListener("click", function(e){
    var btn = e.target.closest(".video-facade");
    if(btn){
      var vid = btn.getAttribute("data-yt");
      var parent = btn.parentElement;
      if(parent && vid){
        parent.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + vid + '?autoplay=1&rel=0" title="Video Lesson" style="width:100%;aspect-ratio:16/9;border:none;border-radius:8px;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
      }
    }
  });

  // --- URL Routing ---
  function routeFromHash(){
    var hash = window.location.hash;
    var lessons = C.lessons || C.concepts || [];
    if(hash === "#revision"){
      renderRevision();
    } else if(/^#concept-\d+$/.test(hash)){
      var cNum = parseInt(hash.replace("#concept-", ""), 10);
      if(cNum >= 1 && cNum <= lessons.length){
        renderConcept(cNum - 1);
        return;
      }
      renderConcept(0);
    } else {
      renderConcept(0);
    }
  }
  window.addEventListener("hashchange", routeFromHash);

  window.App = {
    state: state,
    play: play,
    pause: pause,
    step: step,
    resetTimeline: resetTimeline,
    seekTimeline: seekTimeline,
    renderConcept: renderConcept,
    renderRevision: renderRevision,
    routeFromHash: routeFromHash
  };
  if (typeof globalThis !== "undefined") {
    globalThis.App = window.App;
  }

  // Initialize
  initStorage();
  buildSidebar();
  updateProgress();
  routeFromHash();
})();

</script>
<script>
var App = window.App;
window.SIMS = {};

function setActivePreset(btn){
  document.querySelectorAll(".preset-btn").forEach(function(b){ b.classList.remove("active"); });
  if(btn) btn.classList.add("active");
}
function svgEl(){ return document.getElementById("diagram"); }
function readout(html){ var n = document.getElementById("lab-readout"); if(n) n.innerHTML = html; }
function verdict(html){ var n = document.getElementById("lab-verdict"); if(n) n.innerHTML = html; }
function cell(label, val, color){
  return '<div class="telemetry-cell"><div class="telemetry-label">' + label + '</div><div class="telemetry-val"' +
    (color ? ' style="color:' + color + '"' : '') + '>' + val + '</div></div>';
}
function numEl(id, fallback){
  var n = document.getElementById(id);
  return n ? Number(n.value) : fallback;
}

window.SIMS["pond-structure"] = (function(){
  var mode = "pond";
  function mount(){
    App.state.maxT = 6;
    var s = document.getElementById("time-scrubber"); if(s) s.max = 6;
    document.getElementById("lab-legend").innerHTML =
      '<div class="legend-item"><span class="legend-dot" style="background:#38bdf8;"></span><span>Abiotic (water + soil)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#34d399;"></span><span>Producers</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b;"></span><span>Consumers</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#a78bfa;"></span><span>Decomposers (bottom)</span></div>';
    document.getElementById("preset-bar").innerHTML =
      '<button class="preset-btn active" id="p-pond">Pond: full system</button>' +
      '<button class="preset-btn" id="p-for">Forest stratification</button>' +
      '<button class="preset-btn" id="p-node">Remove decomposers</button>';
    document.getElementById("p-pond").onclick = function(){ setActivePreset(this); mode="pond"; draw(App.state.t); };
    document.getElementById("p-for").onclick = function(){ setActivePreset(this); mode="forest"; draw(App.state.t); };
    document.getElementById("p-node").onclick = function(){ setActivePreset(this); mode="nodecomp"; draw(App.state.t); };
    document.getElementById("lab-controls").innerHTML =
      '<div class="control-item"><div class="control-label"><span>Highlight component</span><span class="val" id="ctrl-h">all</span></div>' +
      '<input type="range" id="ctrl-h-range" min="0" max="3" step="1" value="0"></div>';
    document.getElementById("ctrl-h-range").oninput = function(){ draw(App.state.t); };
    draw(0);
  }
  function draw(t){
    var svg = svgEl(); if(!svg) return;
    var h = Math.round(numEl("ctrl-h-range", 0));
    var names = ["all", "abiotic", "producers", "consumers+decomposers"];
    var el = document.getElementById("ctrl-h"); if(el) el.textContent = names[h];
    var m = '<rect width="720" height="300" fill="#09131d"/>';
    if(mode === "forest"){
      m += '<text x="360" y="24" fill="#94a3b8" font-size="13" text-anchor="middle">Stratification: trees (top) -&gt; shrubs -&gt; herbs/grasses (bottom)</text>';
      m += '<rect x="160" y="44" width="400" height="60" rx="6" fill="#14532d" opacity="' + (h === 0 || h === 2 ? "1" : "0.4") + '"/>';
      m += '<text x="360" y="78" fill="#e2e8f0" font-size="13" text-anchor="middle">trees: top vertical stratum</text>';
      m += '<rect x="200" y="110" width="320" height="52" rx="6" fill="#166534" opacity="' + (h === 0 || h === 2 ? "1" : "0.4") + '"/>';
      m += '<text x="360" y="141" fill="#e2e8f0" font-size="12" text-anchor="middle">shrubs: second layer</text>';
      m += '<rect x="240" y="168" width="240" height="52" rx="6" fill="#22c55e" opacity="' + (h === 0 || h === 2 ? "1" : "0.4") + '"/>';
      m += '<text x="360" y="199" fill="#09131d" font-size="12" text-anchor="middle">herbs + grasses: bottom</text>';
      m += '<text x="360" y="246" fill="#94a3b8" font-size="12" text-anchor="middle">Species composition = identification + enumeration; stratification = vertical layers (Sec 12.1).</text>';
      m += '<text x="360" y="268" fill="#64748b" font-size="11" text-anchor="middle">Four functions: (i) productivity (ii) decomposition (iii) energy flow (iv) nutrient cycling.</text>';
    } else {
      var dead = (mode === "nodecomp");
      m += '<text x="360" y="24" fill="#94a3b8" font-size="13" text-anchor="middle">Pond self-sustainable model: abiotic + autotrophs + consumers + decomposers; energy flows up, heat lost</text>';
      m += '<rect x="80" y="50" width="560" height="200" rx="8" fill="#0f2537" stroke="#38bdf8" opacity="' + (h === 0 || h === 1 ? "1" : "0.45") + '"/>';
      m += '<rect x="80" y="210" width="560" height="40" rx="4" fill="#3f2d1c" opacity="' + (h === 0 || h === 1 ? "1" : "0.45") + '"/>';
      m += '<text x="100" y="70" fill="#38bdf8" font-size="11">water + dissolved substances + sun/temperature</text>';
      m += '<text x="100" y="242" fill="#d6a35c" font-size="11">bottom soil deposit (rich)</text>';
      for(var i=0;i<10;i++){
        var px = 110 + (i * 53) % 300;
        var py = 92 + (i * 29) % 40 + Math.sin(t * 2 + i) * 2;
        m += '<circle cx="' + px + '" cy="' + py.toFixed(1) + '" r="5" fill="#34d399" opacity="' + (h === 0 || h === 2 ? "1" : "0.35") + '"/>';
      }
      m += '<rect x="430" y="86" width="26" height="50" fill="#166534" opacity="' + (h === 0 || h === 2 ? "1" : "0.35") + '"/>';
      m += '<rect x="470" y="100" width="22" height="36" fill="#15803d" opacity="' + (h === 0 || h === 2 ? "1" : "0.35") + '"/>';
      m += '<text x="490" y="70" fill="#34d399" font-size="11">phytoplankton, algae, marginal plants</text>';
      for(var f=0;f<3;f++){
        var fx = 170 + f * 110 + Math.sin(t * 1.5 + f * 2) * 10;
        var fy = 160 + (f % 2) * 22;
        m += '<ellipse cx="' + fx.toFixed(1) + '" cy="' + fy + '" rx="22" ry="10" fill="#f59e0b" opacity="' + (h === 0 || h === 3 ? "1" : "0.35") + '"/>';
        m += '<polygon points="' + (fx + 22).toFixed(1) + ',' + fy + ' ' + (fx + 32).toFixed(1) + ',' + (fy - 6) + ' ' + (fx + 32).toFixed(1) + ',' + (fy + 6) + '" fill="#f59e0b" opacity="' + (h === 0 || h === 3 ? "1" : "0.35") + '"/>';
      }
      m += '<text x="360" y="200" fill="#f59e0b" font-size="11" text-anchor="middle">zooplankton + swimmers + bottom dwellers</text>';
      if(!dead){
        for(var dI=0;dI<8;dI++){
          var dx = 110 + dI * 62;
          m += '<circle cx="' + dx + '" cy="' + (224 + Math.sin(t * 3 + dI) * 2).toFixed(1) + '" r="6" fill="#a78bfa" opacity="' + (h === 0 || h === 3 ? "1" : "0.35") + '"/>';
        }
        m += '<text x="540" y="200" fill="#a78bfa" font-size="11">fungi, bacteria, flagellates</text>';
      } else {
        for(var p=0;p<6;p++){

    if(mode === "forest") verdict("<b>Section 12.1:</b> structure = <b>species composition</b> (identify + count) + <b>stratification</b> (trees -&gt; shrubs -&gt; herbs/grasses). Function runs through <b>productivity, decomposition, energy flow, nutrient cycling</b> (4 aspects).");
    else if(mode === "nodecomp") verdict("<b>Section 12.1 prediction:</b> remove fungi/bacteria/flagellates and <b>dead matter accumulates, mineralisation stops</b> — autotrophs run short of recycled nutrients. Each box must be non-empty (Exercise 7 core).");
    else verdict("<b>Section 12.1 pond (Exercise 7):</b> autotrophs (phytoplankton, algae, marginal plants) fix inorganic -&gt; organic; heterotrophs feed; <b>bottom decomposers mineralise</b> for reuse. <b>Energy moves unidirectionally</b> upward, dissipated as heat.");
  }
  return { mount: mount, draw: draw };
})();
window.SIMS["pond"] = window.SIMS["pond-structure"];

window.SIMS["productivity"] = (function(){
  function mount(){
    App.state.maxT = 6;
    var s = document.getElementById("time-scrubber"); if(s) s.max = 6;
    document.getElementById("lab-legend").innerHTML =
      '<div class="legend-item"><span class="legend-dot" style="background:#34d399;"></span><span>GPP (gross fixed)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#f87171;"></span><span>R (respiration eaten)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#38bdf8;"></span><span>NPP (left for heterotrophs)</span></div>';
    document.getElementById("preset-bar").innerHTML =
      '<button class="preset-btn active" id="p-pt">Patch: GPP 52, R 17</button>' +
      '<button class="preset-btn" id="p-oc">Ocean: thin per-area</button>' +
      '<button class="preset-btn" id="p-ld">Land: 115 of 170</button>';
    document.getElementById("p-pt").onclick = function(){ setActivePreset(this); var a=document.getElementById("ctrl-g-range"); var b=document.getElementById("ctrl-r-range"); if(a) a.value=52; if(b) b.value=17; draw(App.state.t); };
    document.getElementById("p-oc").onclick = function(){ setActivePreset(this); var a=document.getElementById("ctrl-g-range"); var b=document.getElementById("ctrl-r-range"); if(a) a.value=30; if(b) b.value=18; draw(App.state.t); };
    document.getElementById("p-ld").onclick = function(){ setActivePreset(this); var a=document.getElementById("ctrl-g-range"); var b=document.getElementById("ctrl-r-range"); if(a) a.value=70; if(b) b.value=22; draw(App.state.t); };
    document.getElementById("lab-controls").innerHTML =
      '<div class="control-item"><div class="control-label"><span>GPP (kcal m-2 yr-1)</span><span class="val" id="ctrl-g">52</span></div>' +
      '<input type="range" id="ctrl-g-range" min="10" max="100" step="1" value="52"></div>' +
      '<div class="control-item"><div class="control-label"><span>R: respiration loss</span><span class="val" id="ctrl-r">17</span></div>' +
      '<input type="range" id="ctrl-r-range" min="0" max="60" step="1" value="17"></div>';
    document.getElementById("ctrl-g-range").oninput = function(){ draw(App.state.t); };
    document.getElementById("ctrl-r-range").oninput = function(){ draw(App.state.t); };
    draw(0);
  }
  function draw(t){
    var svg = svgEl(); if(!svg) return;
    var gpp = numEl("ctrl-g-range", 52);
    var rr = numEl("ctrl-r-range", 17);
    if(rr > gpp) rr = gpp;
    var a = document.getElementById("ctrl-g"); if(a) a.textContent = gpp;
    var b = document.getElementById("ctrl-r"); if(b) b.textContent = rr;
    var npp = gpp - rr;
    function H(v){ return (v / 100) * 170; }
    var m = '<rect width="720" height="300" fill="#09131d"/>';
    m += '<text x="360" y="24" fill="#94a3b8" font-size="13" text-anchor="middle">NPP = GPP - R: what remains feeds herbivores + decomposers (Sec 12.2)</text>';
    m += '<rect x="120" y="' + (230 - H(gpp)).toFixed(0) + '" width="110" height="' + H(gpp).toFixed(0) + '" fill="#14532d" stroke="#34d399"/>';
    m += '<rect x="120" y="' + (230 - H(gpp)).toFixed(0) + '" width="110" height="' + H(rr).toFixed(0) + '" fill="#f87171" opacity="0.9"/>';
    m += '<text x="175" y="250" fill="#94a3b8" font-size="12" text-anchor="middle">GPP ' + gpp + '</text>';
    m += '<rect x="300" y="' + (230 - H(npp)).toFixed(0) + '" width="110" height="' + H(npp).toFixed(0) + '" fill="#38bdf8" stroke="#e2e8f0"/>';
    m += '<text x="355" y="250" fill="#94a3b8" font-size="12" text-anchor="middle">NPP ' + npp + '</text>';
    var breathe = 1 + 0.06 * Math.sin(t * 3);
    m += '<text x="520" y="100" fill="#e2e8f0" font-size="20">NPP = ' + gpp + ' - ' + rr + ' = ' + npp + '</text>';
    m += '<text x="520" y="126" fill="#94a3b8" font-size="12">kcal m-2 yr-1; production in</text>';
    m += '<text x="520" y="144" fill="#94a3b8" font-size="12">g m-2, rate adds yr-1</text>';
    m += '<circle cx="500" cy="170" r="' + (10 * breathe).toFixed(1) + '" fill="none" stroke="#f87171" stroke-width="2"/>';
    m += '<text x="520" y="174" fill="#f87171" font-size="11">R breathes (use)</text>';
    m += '<text x="360" y="278" fill="#64748b" font-size="11" text-anchor="middle">Biosphere 170 billion t (dry): oceans ~70% surface but only 55; land = 115. Secondary productivity = consumers.</text>';
    svg.innerHTML = m;
    readout(cell("GPP", gpp + " kcal", "#34d399") + cell("R", rr + " kcal", "#f87171") + cell("NPP", npp + " kcal", "#38bdf8") + cell("land share", "115 / 170"));
    verdict("<b>Section 12.2 (Exercises 6, 9):</b> <b>NPP = GPP - R</b>; NPP is the heterotrophs share, <b>secondary productivity</b> belongs to consumers. Biosphere <b>170 = 55 (ocean) + 115 (land)</b> billion tons dry — oceans lose per-area on light, nutrients, species and photosynthetic capacity (teacher discussion).");
  }
  return { mount: mount, draw: draw };
})();

    draw(0);
  }
  function draw(t){
    var svg = svgEl(); if(!svg) return;
    var st = Math.round(numEl("ctrl-ds-range", 4));
    var cl = Math.round(numEl("ctrl-cl-range", 1));
    var el = document.getElementById("ctrl-ds"); if(el) el.textContent = st;
    var ce = document.getElementById("ctrl-cl"); if(ce) ce.textContent = cl === 1 ? "warm-moist" : "cold/dry";
    var steps = ["fragmentation", "leaching", "catabolism", "humification", "mineralisation"];
    var agents = ["earthworm detritivores", "water: soluble salts down", "bacterial+fungal enzymes", "humus: dark, colloidal store", "release inorganic nutrients"];
    var speed = (litter === "nitrogen" ? 2 : 0.5) * (cl === 1 ? 1.5 : 0.4);
    var m = '<rect width="720" height="300" fill="#09131d"/>';
    m += '<text x="360" y="24" fill="#94a3b8" font-size="13" text-anchor="middle">Detritus (dead + faecal) -&gt; CO2 + water + nutrients; 5 steps run simultaneously (Fig 12.1)</text>';
    for(var i=0;i<5;i++){
      var bx = 40 + i * 130;
      var active = (i === st);
      var done = (i < st);
      var bob = active ? Math.sin(t * 3) * 3 : 0;
      m += '<rect x="' + bx + '" y="' + (70 + bob).toFixed(0) + '" width="116" height="70" rx="8" fill="' + (active ? '#f59e0b' : (done ? '#134e4a' : '#0f1f2e')) + '" stroke="' + (active ? '#fff' : '#334155') + '"/>';
      m += '<text x="' + (bx + 58) + '" y="' + (96 + bob).toFixed(0) + '" fill="' + (active ? '#09131d' : '#e2e8f0') + '" font-size="10" text-anchor="middle">' + (i + 1) + '. ' + steps[i] + '</text>';
      m += '<text x="' + (bx + 58) + '" y="' + (116 + bob).toFixed(0) + '" fill="' + (active ? '#09131d' : '#94a3b8') + '" font-size="9" text-anchor="middle">' + agents[i] + '</text>';
      if(i < 4) m += '<line x1="' + (bx + 116) + '" y1="105" x2="' + (bx + 130) + '" y2="105" stroke="#475569" stroke-width="2"/>';
    }
    m += '<text x="360" y="180" fill="#e2e8f0" font-size="13" text-anchor="middle">Step ' + (st + 1) + '/5: ' + steps[st] + ' — ' + agents[st] + '</text>';
    var barW = Math.min(560, speed * 130);
    m += '<rect x="80" y="200" width="560" height="20" rx="6" fill="#0f1f2e" stroke="#334155"/>';
    m += '<rect x="80" y="200" width="' + barW.toFixed(0) + '" height="20" rx="6" fill="' + (speed > 1.5 ? '#34d399' : '#f87171') + '"/>';
    m += '<text x="360" y="240" fill="#94a3b8" font-size="12" text-anchor="middle">' + litter + ' litter, ' + (cl === 1 ? 'warm+moist favours (O2 needs met)' : 'cold/anaerobic inhibits: organic builds up') + ' — rate x' + speed.toFixed(1) + '</text>';
    m += '<text x="360" y="262" fill="#64748b" font-size="11" text-anchor="middle">Earthworm = farmer friend (fragments + loosens). Humus resists microbes; mineralisation frees nutrients.</text>';
    svg.innerHTML = m;
    readout(cell("step", (st + 1) + "/5 " + steps[st]) + cell("litter", litter, litter === "nitrogen" ? "#34d399" : "#f87171") + cell("climate", cl === 1 ? "warm-moist" : "cold/dry") + cell("rate", "x" + speed.toFixed(1)));
    verdict("<b>Section 12.3 (Exercise 10):</b> order <b>fragmentation -&gt; leaching -&gt; catabolism -&gt; humification -&gt; mineralisation</b> (simultaneous). <b>Lignin/chitin = slow, nitrogen/sugars = quick;</b> <b>warm+moist favours, low-T + anaerobiosis inhibits</b> (oxygen-requiring). Products: <b>CO2 + water + inorganic nutrients</b> (+ humus store).");
  }
  return { mount: mount, draw: draw };
})();

window.SIMS["energy-flow"] = (function(){
  var chain = "grass";
  function mount(){
    App.state.maxT = 6;
    var s = document.getElementById("time-scrubber"); if(s) s.max = 6;
    document.getElementById("lab-legend").innerHTML =
      '<div class="legend-item"><span class="legend-dot" style="background:#34d399;"></span><span>T1 producers</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b;"></span><span>T2 herbivores</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#38bdf8;"></span><span>T3-T4 carnivores</span></div>';
    document.getElementById("preset-bar").innerHTML =
      '<button class="preset-btn active" id="p-gr">Grass-Goat-Man (GFC)</button>' +
      '<button class="preset-btn" id="p-lk">Lake: phyto-zoo-fish</button>' +
      '<button class="preset-btn" id="p-df">Detritus chain (DFC)</button>';
    document.getElementById("p-gr").onclick = function(){ setActivePreset(this); chain="grass"; draw(App.state.t); };
    document.getElementById("p-lk").onclick = function(){ setActivePreset(this); chain="lake"; draw(App.state.t); };
    document.getElementById("p-df").onclick = function(){ setActivePreset(this); chain="detritus"; draw(App.state.t); };
    document.getElementById("lab-controls").innerHTML =
      '<div class="control-item"><div class="control-label"><span>Producer energy (J)</span><span class="val" id="ctrl-pj">10000</span></div>' +
      '<input type="range" id="ctrl-pj-range" min="1000" max="20000" step="500" value="10000"></div>';
    document.getElementById("ctrl-pj-range").oninput = function(){ draw(App.state.t); };
    draw(0);
  }
  function draw(t){
    var svg = svgEl(); if(!svg) return;
    var pj = numEl("ctrl-pj-range", 10000);
    var el = document.getElementById("ctrl-pj"); if(el) el.textContent = pj;
    var t2 = pj * 0.1, t3 = pj * 0.01, t4 = pj * 0.001;
    var labels = chain === "grass" ? ["Grass T1", "Goat T2", "Man T3", "Top T4"] : (chain === "lake" ? ["Phytoplankton T1", "Zooplankton T2", "Fish T3", "Top fish T4"] : ["Detritus", "Saprotrophs", "Detritivores", "GFC predators"]);
    var cols = ["#34d399", "#f59e0b", "#38bdf8", "#a78bfa"];
    var m = '<rect width="720" height="300" fill="#09131d"/>';
    m += '<text x="360" y="24" fill="#94a3b8" font-size="13" text-anchor="middle">10% law (Fig 12.3): only ~10% crosses each level; PAR &lt;50%, plants catch 2-10%, ~1% to NPP</text>';
    var vals = [pj, t2, t3, t4];
    for(var i=0;i<4;i++){
      var bw = 40 + (3 - i) * 0 + Math.max(30, 200 - i * 52);
      var bx = 70 + i * 150;
      var bob = Math.sin(t * 2 + i) * 2;
      m += '<rect x="' + bx + '" y="' + (110 + bob).toFixed(0) + '" width="120" height="' + bw + '" rx="6" fill="#0f1f2e" stroke="' + cols[i] + '" stroke-width="2"/>';
      m += '<rect x="' + bx + '" y="' + (110 + bw - Math.min(bw, bw * 0.9) + bob).toFixed(0) + '" width="120" height="' + Math.min(bw, 12 + (3 - i) * 8).toFixed(0) + '" fill="' + cols[i] + '" opacity="0.85"/>';
      m += '<text x="' + (bx + 60) + '" y="' + (100 + bob).toFixed(0) + '" fill="' + cols[i] + '" font-size="11" text-anchor="middle">' + labels[i] + '</text>';
      m += '<text x="' + (bx + 60) + '" y="' + (124 + bw + bob).toFixed(0) + '" fill="#e2e8f0" font-size="12" text-anchor="middle">' + vals[i].toFixed(vals[i] < 100 ? 1 : 0) + ' J</text>';
      if(i < 3){
        var ax = bx + 120;
        m += '<line x1="' + ax + '" y1="170" x2="' + (ax + 30) + '" y2="170" stroke="#475569" stroke-width="2"/>';
        m += '<polygon points="' + (ax + 30) + ',170 ' + (ax + 20) + ',164 ' + (ax + 20) + ',176" fill="#94a3b8"/>';
        m += '<text x="' + (ax + 4) + '" y="160" fill="#f87171" font-size="10">90% heat</text>';
      }
    }
    m += '<text x="360" y="268" fill="#64748b" font-size="11" text-anchor="middle">' + (chain === "detritus" ? 'DFC starts from dead matter (fungi/bacteria saprotrophs); land runs mainly DFC, water mainly GFC; webs link via omnivores (cockroach, crow).' : 'GFC: Grass -&gt; Goat -&gt; Man. Standing crop as dry-weight biomass or numbers; death diverts to detritus.') + '</text>';
    svg.innerHTML = m;
    readout(cell("T1", vals[0].toFixed(0) + " J", "#34d399") + cell("T2", vals[1].toFixed(0) + " J", "#f59e0b") + cell("T3", vals[2].toFixed(1) + " J", "#38bdf8") + cell("T4", vals[3].toFixed(2) + " J", "#a78bfa"));
    verdict("<b>Section 12.4 (Figs 12.2-12.3; Exercises 2-5):</b> chain <b>" + pj + " -&gt; " + t2.toFixed(0) + " -&gt; " + t3.toFixed(0) + " -&gt; " + t4.toFixed(1) + " J</b> (10,000 -&gt; 1,000 -&gt; 100 -&gt; 10 at default). Decomposers hold the <b>largest population</b> (Ex 2); lake T2 = <b>zooplankton</b> (Ex 3); <b>no secondary producers</b> (Ex 4); PAR = <b>50%</b> option (Ex 5).");
  }
  return { mount: mount, draw: draw };
})();
window.SIMS["energyflow"] = window.SIMS["energy-flow"];

window.SIMS["pyramids"] = (function(){
  var kind = "numgrass";
  function mount(){
    App.state.maxT = 6;
    var s = document.getElementById("time-scrubber"); if(s) s.max = 6;
    document.getElementById("lab-legend").innerHTML =
      '<div class="legend-item"><span class="legend-dot" style="background:#34d399;"></span><span>Producers (base)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b;"></span><span>Herbivores</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:#38bdf8;"></span><span>Carnivores (apex)</span></div>';
    document.getElementById("preset-bar").innerHTML =
      '<button class="preset-btn active" id="p-ng">Numbers: grassland upright</button>' +
      '<button class="preset-btn" id="p-nt">Numbers: tree inverted</button>' +
      '<button class="preset-btn" id="p-bs">Biomass: sea inverted</button>' +
      '<button class="preset-btn" id="p-en">Energy: always upright</button>';
    document.getElementById("p-ng").onclick = function(){ setActivePreset(this); kind="numgrass"; draw(App.state.t); };
    document.getElementById("p-nt").onclick = function(){ setActivePreset(this); kind="numtree"; draw(App.state.t); };
    document.getElementById("p-bs").onclick = function(){ setActivePreset(this); kind="biosea"; draw(App.state.t); };
    document.getElementById("p-en").onclick = function(){ setActivePreset(this); kind="energy"; draw(App.state.t); };
    document.getElementById("lab-controls").innerHTML =
      '<div class="control-item"><div class="control-label"><span>Base size (illustrative)</span><span class="val" id="ctrl-pb">100</span></div>' +
      '<input type="range" id="ctrl-pb-range" min="40" max="100" step="5" value="100"></div>';
    document.getElementById("ctrl-pb-range").oninput = function(){ draw(App.state.t); };
    draw(0);
  }
  function draw(t){
    var svg = svgEl(); if(!svg) return;
    var pb = numEl("ctrl-pb-range", 100);
    var el = document.getElementById("ctrl-pb"); if(el) el.textContent = pb;
    var rows, title, note;
    if(kind === "numgrass"){ rows = [pb, 62, 34, 12]; title = "Numbers upright: ~6M plants -&gt; 3 top-carnivores (Fig 12.4a)"; note = "Base widest: producers exceed every level above."; }
    else if(kind === "numtree"){ rows = [18, 60, 40, 22]; title = "Numbers INVERTED: 1 tree -&gt; insects -&gt; small -&gt; large birds"; note = "One producer supports counted crowds upward."; }
    else if(kind === "biosea"){ rows = [26, 70, 48, 24]; title = "Biomass INVERTED sea: fishes &gt; phytoplankton (Fig 12.4c)"; note = "Tiny fast-turnover crop feeds a bigger zooplankton crop."; }
    else { rows = [pb, 60, 32, 12]; title = "Energy ALWAYS upright: ~1% sunlight to NPP, ~10% per level (Fig 12.4d)"; note = "Heat lost each transfer; watts cannot be recycled."; }
    var m = '<rect width="720" height="300" fill="#09131d"/>';
    m += '<text x="360" y="24" fill="#94a3b8" font-size="13" text-anchor="middle">' + title + '</text>';
    var cols = ["#34d399", "#f59e0b", "#38bdf8", "#a78bfa"];
    var names = ["producers", "herbivores", "carnivores", "top"];
    for(var i=0;i<4;i++){
      var w = Math.max(30, rows[i] / 100 * 300);
      var bx = 200 - w / 2 + 60;
      var by = 50 + i * 48;
      var sway = Math.sin(t * 2 + i) * 2;
      m += '<rect x="' + (bx + sway).toFixed(0) + '" y="' + by + '" width="' + w.toFixed(0) + '" height="38" rx="4" fill="' + cols[i] + '" opacity="0.9"/>';
      m += '<text x="' + (bx + w + 14 + sway).toFixed(0) + '" y="' + (by + 24) + '" fill="#94a3b8" font-size="11">' + names[i] + '</text>';
    }
    m += '<text x="480" y="120" fill="#e2e8f0" font-size="13">shape: ' + ((kind === "numtree" || kind === "biosea") ? "INVERTED" : "upright") + '</text>';
    m += '<text x="480" y="144" fill="#94a3b8" font-size="12">apex = tertiary/top</text>';
    m += '<text x="480" y="166" fill="#94a3b8" font-size="12">base = producers T1</text>';
    m += '<text x="360" y="262" fill="#94a3b8" font-size="12" text-anchor="middle">' + note + '</text>';
    m += '<text x="360" y="282" fill="#64748b" font-size="11" text-anchor="middle">Limits (p.214): no two-level species (sparrow), no food webs, no saprophytes; count ALL organisms; level = function.</text>';
    svg.innerHTML = m;
    readout(cell("type", kind === "energy" ? "energy" : (kind === "biosea" ? "biomass" : "numbers")) + cell("shape", (kind === "numtree" || kind === "biosea") ? "INVERTED" : "upright", (kind === "numtree" || kind === "biosea") ? "#f59e0b" : "#34d399") + cell("base", "producers") + cell("apex", "top consumers"));
    if(kind === "energy") verdict("<b>Section 12.5 (Fig 12.4d; Exercise 1e-f):</b> energy is <b>always upright, never inverted</b> — heat lost each transfer; producers convert only <b>~1% of sunlight</b> to NPP. Bar = energy per level per time/area.");
    else if(kind === "numtree") verdict("<b>Section 12.5 / Exercise 1(b) (Fig 12.4 tree case):</b> tree-dominated pyramid of numbers is <b>inverted</b> — 1 tree, thousands of insects, tens of small birds, few large birds. Census the banyan to see it.");
    else if(kind === "biosea") verdict("<b>Section 12.5 (Fig 12.4c):</b> sea biomass pyramid is <b>generally inverted</b> — fish biomass exceeds the small phytoplankton standing crop. Energy above the same water stays upright (rate vs instant).");
    else verdict("<b>Section 12.5 (Fig 12.4a-b; Exercise 8):</b> grassland numbers upright — <b>nearly 6 million plants support 3 top-carnivores</b>; biomass usually upright with sharp fall upward. Base = producers, apex = top consumers.");
  }
  return { mount: mount, draw: draw };
})();
window.SIMS["pyramids"] = window.SIMS["pyramids"];

if (window.App && typeof window.App.routeFromHash === "function") {
  window.App.routeFromHash();
}
</script>
