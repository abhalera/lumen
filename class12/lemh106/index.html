0 (and f′′(1) = −112 < 0 confirms a maximum)."], "answer": "a = 120"}, {"number": "6.3.12", "exercise": "6.3", "question": "Find the maximum and minimum values of x + sin 2x on [0, 2π].", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 12", "conceptIdx": 2, "steps": ["f′(x) = 1 + 2cos 2x = 0 gives cos 2x = −1/2, i.e. x = π/3, 2π/3, 4π/3, 5π/3.", "Values: f(0) = 0, f(π/3) = π/3 + √3/2, f(2π/3) = 2π/3 − √3/2, f(4π/3) = 4π/3 + √3/2, f(5π/3) = 5π/3 − √3/2, f(2π) = 2π."], "answer": "Maximum 2π at x = 2π; minimum 0 at x = 0"}, {"number": "6.3.13", "exercise": "6.3", "question": "Find two numbers whose sum is 24 and whose product is as large as possible.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 13", "conceptIdx": 2, "steps": ["Let numbers be x and 24 − x; P(x) = 24x − x².", "P′(x) = 24 − 2x = 0 gives x = 12, with P′′ < 0."], "answer": "12 and 12 (product 144)"}, {"number": "6.3.14", "exercise": "6.3", "question": "Find two positive numbers x and y such that x + y = 60 and xy³ is maximum.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 14", "conceptIdx": 2, "steps": ["P = x(60 − x)³; P′ = (60 − x)³ − 3x(60 − x)² = (60 − x)²(60 − 4x).", "P′ = 0 gives x = 15 (positive, P′′ < 0), so y = 45."], "answer": "x = 15, y = 45"}, {"number": "6.3.15", "exercise": "6.3", "question": "Find two positive numbers x and y such that their sum is 35 and the product x²y⁵ is a maximum.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 15", "conceptIdx": 2, "steps": ["P = x²(35 − x)⁵; P′ = x(35 − x)⁴[2(35 − x) − 5x] = x(35 − x)⁴(70 − 7x).", "P′ = 0 gives x = 10, so y = 25."], "answer": "x = 10, y = 25"}, {"number": "6.3.16", "exercise": "6.3", "question": "Find two positive numbers whose sum is 16 and the sum of whose cubes is minimum.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 16", "conceptIdx": 2, "steps": ["S = x³ + (16 − x)³ = 48x² − 768x + 4096.", "S′ = 96x − 768 = 0 gives x = 8, with S′′ > 0."], "answer": "8 and 8"}, {"number": "6.3.17", "exercise": "6.3", "question": "A square piece of tin of side 18 cm is to be made into a box without top, by cutting a square from each corner and folding up the flaps to form the box. What should be the side of the square to be cut off so that the volume of the box is the maximum possible.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 17", "conceptIdx": 2, "steps": ["V(x) = x(18 − 2x)² = 4x³ − 72x² + 324x; V′ = 12x² − 144x + 324 = 12(x − 3)(x − 9).", "V′ = 0 gives x = 3 (x = 9 rejected); V′′(3) < 0."], "answer": "3 cm"}, {"number": "6.3.18", "exercise": "6.3", "question": "A rectangular sheet of tin 45 cm by 24 cm is to be made into a box without top, by cutting off square from each corner and folding up the flaps. What should be the side of the square to be cut off so that the volume of the box is maximum?", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 18", "conceptIdx": 2, "steps": ["V(x) = x(45 − 2x)(24 − 2x) = 4x³ − 138x² + 1080x.", "V′ = 12x² − 276x + 1080 = 12(x − 5)(x − 18); x = 5 gives V′′ < 0 (x = 18 rejected)."], "answer": "5 cm"}, {"number": "6.3.19", "exercise": "6.3", "question": "Show that of all the rectangles inscribed in a given fixed circle, the square has the maximum area.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 19", "conceptIdx": 2, "steps": ["Let circle radius a, rectangle sides 2x, 2y with x² + y² = a²; A = 4xy = 4x√(a² − x²).", "dA/dx = 0 gives x = a/√2, hence y = a/√2; sides equal 2x = 2y.", "Second derivative negative, so this is the maximum."], "answer": "Maximum when rectangle is a square of side a√2"}, {"number": "6.3.20", "exercise": "6.3", "question": "Show that the right circular cylinder of given surface and maximum volume is such that its height is equal to the diameter of the base.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 20", "conceptIdx": 2, "steps": ["S = 2πr² + 2πrh fixed gives h = (S − 2πr²)/(2πr); V = πr²h = (Sr − 2πr³)/2.", "dV/dr = 0 gives r² = S/(6π); then h = 2r, with d²V/dr² < 0."], "answer": "h = 2r (height equals diameter)"}, {"number": "6.3.21", "exercise": "6.3", "question": "Of all the closed cylindrical cans (right circular), of a given volume of 100 cubic centimetres, find the dimensions of the can which has the minimum surface area?", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 21", "conceptIdx": 2, "steps": ["πr²h = 100 gives h = 100/(πr²); S = 2πr² + 200/r.", "dS/dr = 4πr − 200/r² = 0 gives r³ = 50/π, with d²S/dr² > 0; then h = 2r."], "answer": "Radius ³√(50/π) cm, height 2³√(50/π) cm"}, {"number": "6.3.22", "exercise": "6.3", "question": "A wire of length 28 m is to be cut into two pieces. One of the pieces is to be made into a square and the other into a circle. What should be the length of the two pieces so that the combined area of the square and the circle is minimum?", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 22", "conceptIdx": 2, "steps": ["Let circle piece be x: r = x/(2π), square side (28 − x)/4; A = x²/(4π) + (28 − x)²/16.", "dA/dx = x/(2π) − (28 − x)/8 = 0 gives x = 112/(π + 4), with d²A/dx² > 0."], "answer": "Circle piece 112/(π + 4) m, square piece 28π/(π + 4) m"}, {"number": "6.3.23", "exercise": "6.3", "question": "Prove that the volume of the largest cone that can be inscribed in a sphere of radius R is 8/27 of the volume of the sphere.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 23", "conceptIdx": 2, "steps": ["Let cone height h, base radius r with r² = 2Rh − h²; V = (π/3)(2Rh² − h³).", "dV/dh = 0 gives h = 4R/3 (d²V/dh² < 0); V = (8/27)·(4/3)πR³."], "answer": "V_max = 8/27 × (volume of sphere)"}, {"number": "6.3.24", "exercise": "6.3", "question": "Show that the right circular cone of least curved surface and given volume has an altitude equal to √2 times the radius of the base.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 24", "conceptIdx": 2, "steps": ["Fixed V = (1/3)πr²h gives h = 3V/(πr²); curved surface S = πr√(r² + h²); minimize S² = π²(r⁴ + 9V²/(π²r²)).", "d(S²)/dr = 0 gives r⁶ = 9V²/(2π²), i.e. h² = 2r², so h = √2·r."], "answer": "h = √2·r"}, {"number": "6.3.25", "exercise": "6.3", "question": "Show that the semi-vertical angle of the cone of the maximum volume and of given slant height is tan⁻¹(1/√2).", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 25", "conceptIdx": 2, "steps": ["Let slant height l, semi-vertical angle θ: r = l sin θ, h = l cos θ; V = (π/3)l³sin²θcos θ.", "dV/dθ = 0 gives 2cos²θ − sin²θ = 0, i.e. tan²θ = 1/2, with negative second derivative."], "answer": "θ = tan⁻¹(1/√2)"}, {"number": "6.3.26", "exercise": "6.3", "question": "Show that semi-vertical angle of right circular cone of given surface area and maximum volume is sin⁻¹(1/3).", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 26", "conceptIdx": 2, "steps": ["Fixed total surface S = πr(r + l) with l² = r² + h²; eliminating l and maximizing V = (1/3)πr²h gives h² = 8r²... equivalently sin θ = r/l = 1/3.", "With r = h·tan θ and the constraint, dV/dθ = 0 yields sin θ = 1/3 (maximum)."], "answer": "θ = sin⁻¹(1/3)"}, {"number": "6.3.27", "exercise": "6.3", "question": "The point on the curve x² = 2y which is nearest to the point (0, 5) is (A) (2√2, 4) (B) (2√2, 0) (C) (0, 0) (D) (2, 2)", "page": 31, "endPage": 31, "title": "NCERT Exercise 6.3 · Question 27", "conceptIdx": 2, "steps": ["Minimize squared distance D = x² + (y − 5)² = 2y + (y − 5)²; dD/dy = 2 + 2(y − 5) = 0 gives y = 4.", "y = 4 gives x² = 8, i.e. x = ±2√2; option (A)."], "answer": "(A) (2√2, 4)"}, {"number": "6.3.28", "exercise": "6.3", "question": "For all real values of x, the minimum value of (1 − x + x²)/(1 + x + x²) is (A) 0 (B) 1 (C) 3 (D) 1/3", "page": 31, "endPage": 31, "title": "NCERT Exercise 6.3 · Question 28", "conceptIdx": 2, "steps": ["Let y = (1 − x + x²)/(1 + x + x²); dy/dx = 0 gives 2(x² − 1) = 0, i.e. x = ±1.", "y(1) = 1/3, y(−1) = 3; limits at ±∞ are 1, so minimum is 1/3, option (D)."], "answer": "(D) 1/3"}, {"number": "6.3.29", "exercise": "6.3", "question": "The maximum value of [x(x − 1) + 1]¹⸍³, 0 ≤ x ≤ 1 is (A) (1/3)¹⸍³ (B) 1/2 (C) 1 (D) 0", "page": 31, "endPage": 31, "title": "NCERT Exercise 6.3 · Question 29", "conceptIdx": 2, "steps": ["Inner quadratic x² − x + 1 has minimum 3/4 at x = 1/2 and value 1 at both endpoints.", "Cube root is increasing, so the maximum on [0, 1] is 1¹⸍³ = 1, option (C)."], "answer": "(C) 1"}, {"number": "Misc.1", "exercise": "Misc", "question": "Show that the function given by f(x) = (log x)/x has maximum at x = e.", "page": 37, "endPage": 37, "title": "NCERT Exercise Misc · Question 1", "conceptIdx": 0, "steps": ["f′(x) = (1 − log x)/x²; f′ = 0 gives log x = 1, i.e. x = e.", "f′ changes from positive to negative through x = e, so it is a maximum (value 1/e)."], "answer": "Maximum at x = e"}, {"number": "Misc.2", "exercise": "Misc", "question": "The two equal sides of an isosceles triangle with fixed base b are decreasing at the rate of 3 cm per second. How fast is the area decreasing when the two equal sides are equal to the base?", "page": 37, "endPage": 37, "title": "NCERT Exercise Misc · Question 2", "conceptIdx": 0, "steps": ["With equal side a: A = (b/4)√(4a² − b²); dA/da = ab/√(4a² − b²).", "At a = b: dA/da = b/√3; with da/dt = −3, dA/dt = −3b/√3 = −√3·b."], "answer": "Area decreasing at √3·b cm²/s (b = base)"}, {"number": "Misc.3", "exercise": "Misc", "question": "Find the intervals in which the function f given by f(x) = (4sin x − 2x − x cos x)/(2 + cos x) is (i) increasing (ii) decreasing.", "page": 37, "endPage": 37, "title": "NCERT Exercise Misc · Question 3", "conceptIdx": 0, "steps": ["f′(x) = cos x(4 − cos x)/(2 + cos x)²; the sign is the sign of cos x.", "f′ > 0 where cos x > 0 and f′ < 0 where cos x < 0."], "answer": "(i) Increasing where cos x > 0, e.g. on [0, π/2) and (3π/2, 2π]; (ii) Decreasing where cos x < 0, e.g. on (π/2, 3π/2)"}, {"number": "Misc.4", "exercise": "Misc", "question": "Find the intervals in which the function f given by f(x) = x³ + 1/x³, x ≠ 0 is (i) increasing (ii) decreasing.", "page": 37, "endPage": 37, "title": "NCERT Exercise Misc · Question 4", "conceptIdx": 0, "steps": ["f′(x) = 3x² − 3/x⁴ = 3(x⁶ − 1)/x⁴; zeros at x = ±1.", "f′ > 0 when |x| > 1 and f′ < 0 when 0 < |x| < 1."], "answer": "(i) Increasing on (−∞, −1] and [1, ∞); (ii) Decreasing on [−1, 0) and (0, 1]"}, {"number": "Misc.5", "exercise": "Misc", "question": "Find the maximum area of an isosceles triangle inscribed in the ellipse x²/a² + y²/b² = 1 with its vertex at one end of the major axis.", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 5", "conceptIdx": 0, "steps": ["Vertex at (−a, 0); symmetric base points (x, ±y) with y = b√(1 − x²/a²); A = (x + a)y.", "dA/dx = 0 gives x = a/2; then y = √3·b/2 and A = (3√3/4)ab (maximum)."], "answer": "(3√3/4)ab"}, {"number": "Misc.6", "exercise": "Misc", "question": "A tank with rectangular base and rectangular sides, open at the top is to be constructed so that its depth is 2 m and volume is 8 m³. If building of tank costs Rs 70 per sq metre for the base and Rs 45 per square metre for sides. What is the cost of least expensive tank?", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 6", "conceptIdx": 0, "steps": ["Depth 2 and volume 8 give base area lb = 4, i.e. b = 4/l; cost C = 70lb + 45·(4l + 4b) = 280 + 180(l + 4/l).", "dC/dl = 0 gives l = 2, so b = 2; C_min = 280 + 720 = 1000."], "answer": "Rs 1000 (2 m × 2 m base)"}, {"number": "Misc.7", "exercise": "Misc", "question": "The sum of the perimeter of a circle and square is k, where k is some constant. Prove that the sum of their areas is least when the side of square is double the radius of the circle.", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 7", "conceptIdx": 0, "steps": ["2πr + 4x = k gives x = (k − 2πr)/4; total area A = πr² + x².", "dA/dr = 2πr − πx/2 = 0 gives x = 2r, with d²A/dr² = 2π + π²/2 > 0."], "answer": "Minimum when side of square = 2 × radius"}, {"number": "Misc.8", "exercise": "Misc", "question": "A window is in the form of a rectangle surmounted by a semicircular opening. The total perimeter of the window is 10 m. Find the dimensions of the window to admit maximum light through the whole opening.", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 8", "conceptIdx": 0, "steps": ["Let half-width r and rectangle height h: 2h + 2r + πr = 10; area A = 2rh + πr²/2.", "dA/dr = 0 gives r = 10/(π + 4), so width 2r = 20/(π + 4) and h = 10/(π + 4)."], "answer": "Width 20/(π + 4) m, height 10/(π + 4) m"}, {"number": "Misc.9", "exercise": "Misc", "question": "A point on the hypotenuse of a triangle is at distance a and b from the sides of the triangle. Show that the minimum length of the hypotenuse is (a²⸍³ + b²⸍³)³⸍².", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 9", "conceptIdx": 0, "steps": ["Let the point divide the hypotenuse with angle θ to one side: hypotenuse L = a·cosec θ + b·sec θ.", "dL/dθ = 0 gives tan³θ = a/b, i.e. tan θ = (a/b)¹⸍³; second derivative positive.", "Substituting gives L_min = (a²⸍³ + b²⸍³)³⸍²."], "answer": "(a²⸍³ + b²⸍³)³⸍²"}, {"number": "Misc.10", "exercise": "Misc", "question": "Find the points at which the function f given by f(x) = (x − 2)⁴(x + 1)³ has (i) local maxima (ii) local minima (iii) point of inflexion", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 10", "conceptIdx": 0, "steps": ["f′(x) = (x − 2)³(x + 1)²(7x − 2); critical points x = 2, −1, 2/7.", "Sign of f′ is governed by (x − 2)³(7x − 2) since (x + 1)² ≥ 0: changes −→+ at x = 2 (minima) and +→− at x = 2/7 (maxima).", "No sign change at x = −1, so it is a point of inflexion."], "answer": "(i) x = 2/7 (ii) x = 2 (iii) x = −1"}, {"number": "Misc.11", "exercise": "Misc", "question": "Find the absolute maximum and minimum values of the function f given by f(x) = cos²x + sin x, x ∈ [0, π]", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 11", "conceptIdx": 0, "steps": ["f′(x) = −sin 2x + cos x = cos x(1 − 2sin x) = 0 gives x = π/2, π/6, 5π/6.", "f(0) = 1, f(π/6) = 5/4, f(π/2) = 1, f(5π/6) = 5/4, f(π) = 1."], "answer": "Absolute max 5/4 at x = π/6, 5π/6; absolute min 1 at x = 0, π/2, π"}, {"number": "Misc.12", "exercise": "Misc", "question": "Show that the altitude of the right circular cone of maximum volume that can be inscribed in a sphere of radius r is 4r/3.", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 12", "conceptIdx": 0, "steps": ["Let cone height h, base radius R with R² = 2rh − h²; V = (π/3)(2rh² − h³).", "dV/dh = (π/3)(4rh − 3h²) = 0 gives h = 4r/3, with d²V/dh² < 0."], "answer": "h = 4r/3"}, {"number": "Misc.13", "exercise": "Misc", "question": "Let f be a function defined on [a, b] such that f′(x) > 0, for all x ∈ (a, b). Then prove that f is an increasing function on (a, b).", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 13", "conceptIdx": 0, "steps": ["Take x₁ < x₂ in (a, b); by the Mean Value Theorem, f(x₂) − f(x₁) = f′(c)(x₂ − x₁) for some c ∈ (x₁, x₂).", "Since f′(c) > 0 and x₂ − x₁ > 0, f(x₂) > f(x₁).", "Hence f is increasing on (a, b)."], "answer": "Proved via the Mean Value Theorem"}, {"number": "Misc.14", "exercise": "Misc", "question": "Show that the height of the cylinder of maximum volume that can be inscribed in a sphere of radius R is 2R/√3. Also find the maximum volume.", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 14", "conceptIdx": 0, "steps": ["Let cylinder height h, radius r with r² + h²/4 = R²; V = πr²h = πh(R² − h²/4).", "dV/dh = 0 gives h² = 4R²/3, i.e. h = 2R/√3 (maximum); V_max = 4πR³/(3√3)."], "answer": "h = 2R/√3; V_max = 4πR³/(3√3)"}, {"number": "Misc.15", "exercise": "Misc", "question": "Show that height of the cylinder of greatest volume which can be inscribed in a right circular cone of height h and semi vertical angle α is one-third that of the cone and the greatest volume of cylinder is 4πh³tan²α/27.", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 15", "conceptIdx": 0, "steps": ["Cone radius R = h·tan α; cylinder radius r and height H satisfy H = h − r·cot α; V = πr²H.", "dV/dr = 0 gives r = (2/3)h·tan α, so H = h/3 (maximum); V_max = 4πh³tan²α/27."], "answer": "H = h/3; V_max = 4πh³tan²α/27"}, {"number": "Misc.16", "exercise": "Misc", "question": "A cylindrical tank of radius 10 m is being filled with wheat at the rate of 314 cubic metre per hour. Then the depth of the wheat is increasing at the rate of (A) 1 m/h (B) 0.1 m/h (C) 1.1 m/h (D) 0.5 m/h", "page": 39, "endPage": 39, "title": "NCERT Exercise Misc · Question 16", "conceptIdx": 0, "steps": ["V = π(10)²h = 100πh, so dV/dt = 100π(dh/dt).", "314 = 100π(dh/dt) gives dh/dt = 3.14/π = 1 (taking π = 3.14), option (A)."], "answer": "(A) 1 m/h"}], "pageOffset": 146, "printPageStart": 147, "printPageEnd": 186, "paginationProvenance": "folio-read-39-samples"};</script>
  <script>(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp) disp.innerHTML = "t = <b>" + state.t.toFixed(1) + " s</b>";
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Concept View ---
  function renderConcept(idx){
    pause();
    state.conceptIndex = idx;
    state.t = 0;
    state.level = 0;

    var lessons = C.lessons || C.concepts || [];
    var l = lessons[idx];
    if(!l) return;

    var navTitle = l.nav || l.navTitle || l.title || ("Concept " + (idx + 1));

    // Update sidebar navigation active state
    var navBtns = document.querySelectorAll(".concept-nav");
    navBtns.forEach(function(b, i){
      if(b.id === "nav-revision") b.classList.remove("active");
      else b.classList.toggle("active", i === idx);
    });

    // Update top crumb
    var chNum = C.chapterNumber || (C.code ? C.code.replace(/\D/g, '') : "01");
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · " + navTitle.toUpperCase();

    // Show concept view, hide revision
    var cView = document.getElementById("concept-view");
    var rView = document.getElementById("revision-view");
    if(cView) cView.style.display = "block";
    if(rView) rView.style.display = "none";

    var html = "";

    // Concept Header
    var minutes = l.minutes || 10;
    var pdfRef = (l.pages && l.pages.length) ? ('PDF ' + (l.pages.length > 1 ? 'pp. ' + Math.min.apply(null, l.pages) + '–' + Math.max.apply(null, l.pages) : 'p.' + l.pages[0])) : (typeof printPage !== 'undefined' && printPage ? printPage : '');
     var printedPages = l.printPages ? ' · printed pp. ' + l.printPages : ' · printed folio absent in source';
     var printPage = l.print || (l.pages ? l.pages.join("–") : (C.page_start ? "pp. " + C.page_start + "–" + C.page_end : ""));
    html += '<div class="concept-header">' +
      '<div class="concept-badge"><span>Concept ' + ("0" + (idx + 1)).slice(-2) + ' / ' + ("0" + lessons.length).slice(-2) + '</span>' +
      (printPage ? '<span class="time-pill">≈ ' + minutes + ' min · ' + pdfRef + printedPages + '</span>' : '<span class="time-pill">≈ ' + minutes + ' min</span>') +
      '</div>' +
      '<h1 class="concept-title">' + (l.title || navTitle) + '</h1>' +
      '<p class="concept-deck">' + (l.deck || l.summary || "") + '</p>' +
      '</div>';

    // 01 LEARN BLOCK
    html += '<section class="learn-section" data-block="learn" aria-label="Learn Concept">' +
      '<span class="block-tag">01 · LEARN · CORE ESSENTIALS</span>';

    var quickItems = [];
    if(Array.isArray(l.quick)) {
      quickItems = l.quick;
    } else if(Array.isArray(l.summary)) {
      quickItems = l.summary;
    } else if(l.reading_content) {
      quickItems = [l.reading_content];
    } else if(l.summary || l.deck) {
      quickItems = [l.summary || l.deck];
    }

    html += '<div class="quick-summary">' + quickItems.map(function(p){
      if(p.includes('<p>') || p.includes('<div>') || p.includes('<h3>')) return p;
      var formatted = p.replace(/###\s+(.*?)\n/g, '<h3 style="margin-top:16px;color:var(--ink);">$1</h3>')
                       .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                       .replace(/\*(.*?)\*/g, '<em>$1</em>')
                       .replace(/\n\n/g, '</p><p>');
      return '<p>' + formatted + '</p>';
    }).join("") + '</div>';

    // Semantic Equations Card
    var formulas = l.formulas || [];
    if(formulas.length){
      html += '<div class="key-equations-card">' +
        '<div class="equations-heading">Key Relations for this Concept</div>' +
        '<div class="eq-grid">' +
        formulas.map(function(eq){
          var label = eq.label || eq.name || "Relation";
          var cond = eq.cond || "";
          var math = eq.html || eq.formula || "";
          return '<div class="eq-row">' +
            '<div class="eq-meta"><span class="eq-label">' + label + '</span>' + (cond ? '<span class="eq-cond">' + cond + '</span>' : '') + '</div>' +
            '<div class="eq-math">' + math + '</div>' +
            '</div>';
        }).join("") +
        '</div></div>';
    }

    // Deeper dive / core takeaways
    if(l.deeper){
      html += '<details class="deep-dive"><summary>Go deeper into the conceptual foundation</summary><p>' + l.deeper + '</p></details>';
    } else if(l.takeaways && l.takeaways.length){
      html += '<details class="deep-dive"><summary>Key Conceptual Takeaways</summary><ul>' +
        l.takeaways.map(function(t){ return '<li>' + t + '</li>'; }).join("") +
        '</ul></details>';
    }

    // Worked Example
    var worked = l.worked || l.worked_example;
    if(worked){
      var workedHtml = typeof worked === 'object' && worked !== null
        ? '<strong>' + (worked.title || 'Worked Example') + '</strong><br>' + (worked.problem || '') +
          (worked.given ? '<br><br><strong>Given:</strong> ' + worked.given : '') +
          (worked.steps ? '<br><strong>Steps:</strong><br>' + worked.steps.map(function(s){ return '&bull; ' + s; }).join('<br>') : '') +
          (worked.solution ? '<br><br><strong>Solution:</strong> ' + worked.solution : '') +
          (worked.answer ? '<br><br><strong>Answer:</strong> ' + worked.answer : '')
        : String(worked);
      html += '<details class="deep-dive"><summary>Worked textbook example step by step</summary><p>' + workedHtml + '</p></details>';
    }

    html += '</section>';

    // 02 PREDICT FIRST BLOCK
    var pred = l.prediction || l.predict || l.predict_first;
    if(pred && typeof pred === 'object' && (pred.prompt || pred.scenario) && pred.options && pred.options.length){
      var promptText = pred.prompt || pred.scenario || "";
      html += '<section class="predict-card" data-block="predict" aria-label="Predict First">' +
        '<div class="predict-badge">02 · PREDICT FIRST · TEST YOUR INTUITION</div>' +
        '<div class="predict-prompt">' + promptText.replace(/\n/g, '<br>') + '</div>' +
        '<div class="predict-options" id="predict-options">' +
        pred.options.map(function(opt, oi){
          return '<label class="predict-option"><input type="radio" name="predict_ans" value="' + oi + '"><span>' + opt + '</span></label>';
        }).join("") +
        '</div>' +
        '<div class="predict-actions">' +
        '<button class="btn-primary" id="btn-check-prediction">Check Prediction</button>' +
        '<button class="btn-secondary" id="btn-skip-prediction">Skip to Lab</button>' +
        '</div>' +
        '<div id="predict-feedback-box" class="predict-feedback" style="display:none;"></div>' +
        '</section>';
    }

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();
    var whatWatch = (pred && pred.prompt) ? pred.prompt : (typeof l.predict === 'string' ? l.predict : "Explore the interactive simulation controls, parameters, and readouts below.");
    html += '<section class="lab-card" data-block="play" aria-label="Interactive Laboratory">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +
      '<div id="sim-mount-point" class="sim-mount-container" style="width:100%;min-height:220px;margin-top:12px;">' +
        '<div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 720 300" role="img" aria-label="' + simTitle + '"></svg></div>' +
        '<div class="lab-legend" id="lab-legend"></div>' +
        '<div class="lab-toolbar" id="legacy-lab-toolbar">' +
          '<button class="toolbar-btn primary" id="btn-play-pause" aria-label="Play animation">▶ Play</button>' +
          '<button class="toolbar-btn" id="btn-step-fwd" aria-label="Step forward">⏭ Step (+0.5s)</button>' +
          '<button class="toolbar-btn" id="btn-reset-time" aria-label="Reset timeline">↺ Reset</button>' +
          '<span class="time-display" id="time-display">t = <b>0.0 s</b></span>' +
          '<div class="scrubber-wrap">' +
            '<input type="range" id="time-scrubber" class="timeline-scrubber" min="0" max="6" step="0.1" value="0" aria-label="Timeline time scrubber">' +
          '</div>' +
        '</div>' +
        '<div class="preset-bar" id="preset-bar"></div>' +
        '<div class="lab-controls-grid" id="lab-controls"></div>' +
        '<div class="lab-readout" id="lab-readout" role="status" aria-live="polite"></div>' +
        '<div class="lab-verdict" id="lab-verdict" role="status" aria-live="polite"></div>' +
      '</div>' +
      '</section>';

    // 04 CONNECT BLOCK
    var connectItems = l.connect || [];
    var resList = l.resources || [];
    var resHtml = resList.length ? '<div class="resource-list">' + resList.map(function(r){
      var rt = String(r.title).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      var rp = String(r.provider).replace(/&/g,'&amp;').replace(/</g,'&lt;');
      return '<div class="resource-card" data-resource="true"><span class="res-badge">RESOURCE \u00b7 OPTIONAL</span><div class="res-body"><strong>' + rt + '</strong><span class="res-provider">' + rp + '</span></div><a class="res-link" href="' + r.url + '" target="_blank" rel="noopener">Open source \u2197</a><span class="res-off">Needs internet \u00b7 lesson works offline</span></div>';
    }).join("") + '</div>' : '';
    if(connectItems.length){
      html += '<section class="connect-section" data-block="connect" aria-label="Real World Connections">' +
        '<span class="block-tag">04 · CONNECT · REAL WORLD APPLICATIONS</span>' +
        '<div class="connect-grid">' +
        connectItems.map(function(item){
          var title = Array.isArray(item) ? item[0] : (item.title || "Real World Context");
          var desc = Array.isArray(item) ? item[1] : (item.text || item.desc || "");
          var links = Array.isArray(item) ? (item[2] || []) : (item.links || (item.link ? [{t: "Read Deeply", u: item.link}] : []));
          var v = Array.isArray(item) ? (item[3] || null) : (item.video || null);
          var wow = /^Wow/i.test(title);

          var wowSrc = pdfRef;
          var wowPrint = (l && l.printPages) ? ' · printed pp. ' + l.printPages : ' (printed folio absent in source)';
          var cHtml = '<div class="connect-card' + (wow ? ' wow" data-wow="true" data-source="NCERT ' + C.book_name + ' Ch ' + C.chapterNumber + ' · ' + wowSrc + wowPrint + '"' : '') + '">';
          if(wow) cHtml += '<span class="wow-badge">WOW · REAL WORLD</span>';
          cHtml += '<h3>' + title + '</h3><p>' + desc + '</p>';
          if(v && v.id){
            cHtml += '<button class="video-facade" data-yt="' + v.id + '" aria-label="Play video: ' + v.title + '">' +
              '<span class="play-btn">▶</span>' +
              '<span class="video-title">' + v.title + ' · ' + v.channel + '</span>' +
              '</button>';
          }
          if(links && links.length){
            cHtml += '<p style="margin-top:10px;font-size:12px;color:var(--muted)">References: ' +
              links.map(function(a){ return '<a href="' + (a.u || a.link || "#") + '" target="_blank" rel="noopener">' + (a.t || a.label || "Read Deeply") + ' ↗</a>'; }).join(", ") +
              '</p>';
          }
          cHtml += '</div>';
          return cHtml;
        }).join("") +
        '</div>' + resHtml + '</section>';
    }

    // 05 PRACTICE BLOCK
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(quizzes.length){
      html += '<section class="practice-section" data-block="practice" aria-label="Practice and Mastery">' +
        '<span class="block-tag">05 · PRACTICE · MULTI-TIER CHALLENGE</span>' +
        '<div class="practice-nav">';
      for(var qi = 0; qi < quizzes.length; qi++){
        var tierName = qi === 0 ? "Tier 1: Easy" : (qi === 1 ? "Tier 2: Medium" : (qi === 2 ? "Tier 3: Hard" : "Question " + (qi + 1)));
        html += '<button class="level-tab' + (qi === 0 ? ' active' : '') + '" data-lvl="' + qi + '">' + tierName + '</button>';
      }
      html += '</div>' +
        '<div id="quiz-container"></div>' +
        '</section>';
    }

    // 06 REVISE CALLOUT
    var recall = l.recall || (l.takeaways && l.takeaways.length ? l.takeaways[0] : (l.core_takeaways && l.core_takeaways.length ? l.core_takeaways[0] : "Reflect on how this concept connects to physical reality."));
    html += '<div class="revise-callout"><strong>06 · REVISE · SAY IT IN YOUR OWN WORDS:</strong> ' + recall + '</div>';

    // Footer Navigation
    var nextNav = idx < lessons.length - 1 ? (lessons[idx + 1].nav || lessons[idx + 1].navTitle || lessons[idx + 1].title || ("Concept " + (idx + 2))) : "";
    html += '<div class="concept-footer-nav">' +
      (idx > 0 ? '<button class="btn-secondary" id="btn-prev-concept">← Concept ' + ("0" + idx).slice(-2) + '</button>' : '<span></span>') +
      (idx < lessons.length - 1 ? '<button class="btn-primary" id="btn-next-concept">Concept ' + ("0" + (idx + 2)).slice(-2) + ': ' + nextNav + ' →</button>' : '<button class="btn-primary" id="btn-goto-revision">Chapter Revision & Exercises →</button>') +
      '</div>';

    cView.innerHTML = html;

    // Attach Prediction Listeners
    var btnCheckPred = document.getElementById("btn-check-prediction");
    var btnSkipPred = document.getElementById("btn-skip-prediction");
    if(btnCheckPred && pred){
      btnCheckPred.addEventListener("click", function(){
        var sel = document.querySelector('input[name="predict_ans"]:checked');
        var fb = document.getElementById("predict-feedback-box");
        if(!sel){
          fb.style.display = "block";
          fb.className = "predict-feedback revealed";
          fb.textContent = "Please select one of the predictions first.";
          return;
        }
        var chosen = Number(sel.value);
        var expectedAns = pred.answer !== undefined ? pred.answer : (pred.correct !== undefined ? pred.correct : 0);
        var isRight = chosen === expectedAns;
        fb.style.display = "block";
        fb.className = "predict-feedback " + (isRight ? "correct" : "revealed");
        fb.innerHTML = (isRight ? "<b>Spot on!</b> " : "<b>Good thought! Here is the physical principle:</b> ") + (pred.explanation || "");
      });
    }
    if(btnSkipPred && pred){
      btnSkipPred.addEventListener("click", function(){
        var fb = document.getElementById("predict-feedback-box");
        fb.style.display = "block";
        fb.className = "predict-feedback revealed";
        fb.innerHTML = "<b>Key Principle:</b> " + (pred.explanation || "");
      });
    }

    // Attach Timeline Controls for legacy SIMS
    var btnPP = document.getElementById("btn-play-pause");
    if(btnPP) btnPP.addEventListener("click", function(){ if(state.playing) pause(); else play(); });
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep) btnStep.addEventListener("click", function(){ step(0.5); });
    var btnResTime = document.getElementById("btn-reset-time");
    if(btnResTime) btnResTime.addEventListener("click", function(){ resetTimeline(); });
    var scrub = document.getElementById("time-scrubber");
    if(scrub) scrub.addEventListener("input", function(e){ seekTimeline(e.target.value); });

    // Footer Next/Prev listeners
    var btnPrev = document.getElementById("btn-prev-concept");
    var btnNext = document.getElementById("btn-next-concept");
    var btnRev = document.getElementById("btn-goto-revision");
    if(btnPrev) btnPrev.addEventListener("click", function(){ renderConcept(idx - 1); window.scrollTo(0,0); });
    if(btnNext) btnNext.addEventListener("click", function(){ renderConcept(idx + 1); window.scrollTo(0,0); });
    if(btnRev) btnRev.addEventListener("click", function(){ renderRevision(); window.scrollTo(0,0); });

    // Mount Active Simulation Engine
    var simMount = document.getElementById("sim-mount-point");
    if(simMount){
      var cKey = "c" + (idx + 1);
      var conceptId = l.id || ("concept-" + (idx + 1));
      var simId = l.sim || conceptId;

      // 1. window.mountSimulation (iemh101, iemh102)
      if(typeof window.mountSimulation === 'function'){
        simMount.innerHTML = "";
        window.mountSimulation(cKey, simMount);
      }
      // 2. window.SIM_ENGINES (iemh101-iemh105)
      else if(window.SIM_ENGINES && window.SIM_ENGINES[cKey] && typeof window.SIM_ENGINES[cKey].init === 'function'){
        simMount.innerHTML = "";
        window.SIM_ENGINES[cKey].init(simMount);
      }
      // 3. window.SimEngine (iemh106-iemh108)
      else if(window.SimEngine && typeof window.SimEngine.init === 'function'){
        var targetKey = null;
        var candidateKeys = [conceptId, "sim-" + conceptId, "sim-concept-" + (idx + 1), "concept-" + (idx + 1), simId, cKey];
        for(var k = 0; k < candidateKeys.length; k++){
          if(candidateKeys[k] && window.SimEngine.getEngine(candidateKeys[k])){
            targetKey = candidateKeys[k];
            break;
          }
        }
        if(targetKey){
          simMount.innerHTML = "";
          window.SimEngine.init(targetKey, simMount);
        }
      }
      // 4. window.SIMS (iesc101-iesc113)
      else if(window.SIMS && (window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey])){
        var simObj = window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey];
        if(typeof simObj.mount === 'function'){
          if(simObj.mount.length >= 1 && !simObj.draw){
            simMount.innerHTML = "";
            simObj.mount(simMount);
          } else {
            simObj.mount(l);
          }
        }
      }
    }

    // Render Quiz for current level
    renderQuiz();

    // Attach Practice Level Tabs
    var lvlTabs = document.querySelectorAll(".level-tab");
    lvlTabs.forEach(function(tab){
      tab.addEventListener("click", function(){
        lvlTabs.forEach(function(t){ t.classList.remove("active"); });
        tab.classList.add("active");
        state.level = Number(tab.getAttribute("data-lvl"));
        renderQuiz();
      });
    });

    // Update URL hash
    window.location.hash = "#concept-" + (idx + 1);
  }

  // --- Render Quiz ---
  function renderQuiz(){
    var lessons = C.lessons || C.concepts || [];
    var l = lessons[state.conceptIndex];
    if(!l) return;
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(!quizzes.length) return;
    var q = quizzes[state.level] || quizzes[0];
    if(!q) return;

    var qk = qKey(state.conceptIndex, state.level);
    var old = state.answers[qk] || {};

    var box = document.getElementById("quiz-container");
    if(!box) return;

    var promptText = q.prompt || q.question || "";
    var isMcq = q.type === "mcq" || (q.options && q.options.length > 0);
    var correctAns = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : 0);
    var solutionText = q.solution || q.explanation || "";
    var hintText = q.hint || "Review the key relationships in the concept overview above.";

    var html = '<div class="question-prompt">' + promptText + '</div>';
    if(isMcq && q.options){
      html += '<div class="quiz-options">' +
        q.options.map(function(opt, oi){
          var checked = old.value === String(oi) ? " checked" : "";
          return '<label class="quiz-option"><input type="radio" name="quiz_ans" value="' + oi + '"' + checked + '><span>' + opt + '</span></label>';
        }).join("") +
        '</div>';
    } else {
      html += '<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">' +
        '<input type="number" step="any" id="quiz_num_ans" placeholder="Your answer" value="' + (old.value || "") + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;width:160px;">' +
        '<span style="font-weight:600;color:var(--muted);">' + (q.unit || "") + '</span>' +
        '</div>';
    }

    html += '<div class="quiz-actions">' +
      '<button class="btn-primary" id="btn-submit-quiz">Submit Answer</button>' +
      '<button class="btn-secondary" id="btn-toggle-hint">Show Hint</button>' +
      '</div>' +
      '<div id="quiz-hint-box" class="quiz-hint" style="display:none;">' + hintText + '</div>' +
      '<div id="quiz-feedback-box" class="quiz-feedback" style="display:none;"></div>';

    box.innerHTML = html;

    // Hint toggle
    var hintBtn = document.getElementById("btn-toggle-hint");
    if(hintBtn){
      hintBtn.addEventListener("click", function(){
        var hb = document.getElementById("quiz-hint-box");
        if(hb) hb.style.display = hb.style.display === "none" ? "block" : "none";
      });
    }

    // Submit listener
    var submitBtn = document.getElementById("btn-submit-quiz");
    if(submitBtn){
      submitBtn.addEventListener("click", function(){
        var fb = document.getElementById("quiz-feedback-box");
        if(!fb) return;
        var isRight = false;
        var userVal = "";

        if(isMcq){
          var sel = document.querySelector('input[name="quiz_ans"]:checked');
          if(!sel){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please select an answer choice first.";
            return;
          }
          userVal = sel.value;
          isRight = Number(userVal) === Number(correctAns);
        } else {
          var inp = document.getElementById("quiz_num_ans");
          if(!inp || inp.value.trim() === ""){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please enter a numerical answer.";
            return;
          }
          userVal = inp.value.trim();
          var num = parseFloat(userVal);
          isRight = Math.abs(num - parseFloat(correctAns)) <= (q.tolerance || 0.05);
        }

        state.answers[qk] = { value: userVal, checked: true };
        if(isRight){
          state.correct[qk] = true;
          fb.style.display = "block";
          fb.className = "quiz-feedback success";
          fb.innerHTML = "<b>That’s right!</b> " + solutionText;
        } else {
          fb.style.display = "block";
          fb.className = "quiz-feedback retry";
          var wrongMsg = (isMcq && q.wrong && q.wrong[Number(userVal)]) ? q.wrong[Number(userVal)] : hintText;
          fb.innerHTML = "<b>Not quite.</b> " + wrongMsg + "<br><small style=\"margin-top:6px;display:block;\"><b>Full explanation:</b> " + solutionText + "</small>";
        }
        updateProgress();
      });
    }

    if(old.checked && submitBtn){
      submitBtn.click();
    }
  }

  // --- Render Revision View ---
  var currentExFilter = -1;

  function renderRevision(){
    pause();
    document.querySelectorAll(".concept-nav").forEach(function(b){ b.classList.remove("active"); });
    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.classList.add("active");

    var chNum = C.chapterNumber || (C.code ? C.code.replace(/\D/g, '') : "01");
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · NCERT EXERCISES & REVISION";

    var cView = document.getElementById("concept-view");
    var revView = document.getElementById("revision-view");
    if(cView) cView.style.display = "none";
    if(revView) revView.style.display = "block";

    var exList = C.exercises || [];
    if(!exList.length && C.exerciseMap){
      exList = C.exerciseMap.map(function(m){
        return {
          q: m[0],
          number: String(m[0]),
          title: m[1],
          conceptIdx: m[2],
          page: m[3],
          printPage: null,
          question: m[4] || m[1],
          steps: [m[5] || "Refer to concept explanation."],
          answer: m[5] || ""
        };
      });
    }

    var totalEx = exList.length;
    var html = '<div class="concept-header">' +
      '<span class="concept-badge">NCERT EXERCISE COMPENDIUM</span>' +
      '<h1 class="concept-title">Revise, Reflect, Refine</h1>' +
      '<p class="concept-deck">All ' + totalEx + ' exercises from NCERT Class 12 ' + (C.book_name || '') + ' with step-by-step solutions.</p>' +
      '</div>';

    // Filter Bar & Expand/Collapse All
    var lessons = C.lessons || C.concepts || [];
    html += '<div class="exercise-compendium-header">' +
      '<div class="exercise-filter-bar">' +
      '<button class="filter-chip ' + (currentExFilter === -1 ? 'active' : '') + '" data-cfilter="-1">All Exercises (' + totalEx + ')</button>' +
      lessons.map(function(l, li){
        var nav = l.nav || l.navTitle || l.title || ("C0" + (li+1));
        return '<button class="filter-chip ' + (currentExFilter === li ? 'active' : '') + '" data-cfilter="' + li + '">C0' + (li+1) + ': ' + nav + '</button>';
      }).join("") +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn-secondary" id="btn-expand-all" style="padding:6px 12px;font-size:13px;">Expand All Guidance</button>' +

  }, '<div class="legend-item"><span class="legend-dot" style="background:#38bdf8"></span><span>area strips</span></div>');

  install("area", "Area between curves", { upper: 1 }, function (s) {
    return range("upper", "Boundary b", 0.2, 2, 0.05, s.upper, "");
  }, function (s) {
    var b = s.upper, area = b * b / 2 - b * b * b / 3, path = "", region = "";
    for (var x = 0; x <= b + 0.01; x += 0.03) {
      path += (x === 0 ? "M" : "L") + (120 + x * 190) + " " + (235 - x * 70) + " ";
      region += (x === 0 ? "M" : "L") + (120 + x * 190) + " " + (235 - x * 70) + " ";
    }
    for (var y = b; y >= -0.01; y -= 0.03) region += "L" + (120 + y * 190) + " " + (235 - y * y * 70) + " ";
    return {
      svg: shell('<line x1="110" y1="235" x2="520" y2="235" stroke="#475569"></line><path d="' + path + '" fill="none" stroke="#38bdf8" stroke-width="3"></path><path d="' + region + 'Z" fill="#34d39955" stroke="#34d399"></path>' +
        text(500, 70, "between y=x and y=x²", "#f8fafc", 17) + text(500, 105, "∫(x−x²) dx", "#f59e0b", 16)),
      readout: cell("b", b.toFixed(2)) + cell("area", area.toFixed(4), "#34d399") + cell("bounds", "0 to b", "#f59e0b"),
      verdict: "<b>Set up before integrating:</b> area is upper curve minus lower curve on the chosen interval. A sketch prevents a reversed sign."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#34d399"></span><span>bounded region</span></div>');

  install("differential", "Differential-equation flow", { family: "separable", t: 1 }, function (s) {
    return select("family", "Choose a model", [["separable", "dy/dx = y"], ["linear", "dy/dx + y = 1"], ["decay", "dy/dx = −y"]], s.family) +
      range("t", "time t", 0, 4, 0.1, s.t, "");
  }, function (s) {
    var sign = s.family === "decay" ? -1 : 1;
    var y = s.family === "linear" ? 1 - Math.exp(-s.t) : Math.exp(sign * s.t);
    var curve = "";
    for (var x = 0; x <= 4.01; x += 0.08) {
      var value = s.family === "linear" ? 1 - Math.exp(-x) : Math.exp(sign * x);
      curve += (x === 0 ? "M" : "L") + (100 + x * 100) + " " + (235 - Math.min(2.7, value) * 55) + " ";
    }
    return {
      svg: shell('<line x1="95" y1="235" x2="530" y2="235" stroke="#475569"></line><path d="' + curve + '" fill="none" stroke="#38bdf8" stroke-width="3"></path><circle cx="' + (100 + s.t * 100) + '" cy="' + (235 - Math.min(2.7, y) * 55) + '" r="7" fill="#34d399"></circle>' +
        text(500, 70, "solve → apply initial condition", "#f8fafc", 16) + text(500, 105, "one family, many possible constants", "#94a3b8", 14)),
      readout: cell("model", s.family) + cell("y(t)", y.toFixed(3), "#34d399") + cell("t", s.t.toFixed(1), "#f59e0b"),
      verdict: "<b>Solution family:</b> integrating produces a constant. An initial condition selects one member of the family."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#34d399"></span><span>solution curve</span></div>');

  install("vectors", "Vector components", { ax: 3, ay: 2, bx: -1, by: 2 }, function (s) {
    return range("ax", "Aₓ", -4, 4, 1, s.ax, "") + range("ay", "Aᵧ", -4, 4, 1, s.ay, "") +
      range("bx", "Bₓ", -4, 4, 1, s.bx, "") + range("by", "Bᵧ", -4, 4, 1, s.by, "");
  }, function (s) {
    var rx = s.ax + s.bx, ry = s.ay + s.by, mag = Math.sqrt(rx * rx + ry * ry);
    function arrow(x, y, dx, dy, color) {
      return '<line x1="' + x + '" y1="' + y + '" x2="' + (x + dx * 35) + '" y2="' + (y - dy * 35) + '" stroke="' + color + '" stroke-width="4" marker-end="url(#arrow-v)"></line>';
    }
    return {
      svg: shell('<line x1="90" y1="180" x2="630" y2="180" stroke="#475569"></line><line x1="360" y1="45" x2="360" y2="270" stroke="#475569"></line>' +
        arrow(360, 180, s.ax, s.ay, "#38bdf8") + arrow(360, 180, s.bx, s.by, "#f59e0b") + arrow(360, 180, rx, ry, "#34d399") +
        '<defs><marker id="arrow-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34d399"></path></marker></defs>' +
        text(500, 65, "R = A + B", "#34d399", 18) + text(500, 105, "components add separately", "#94a3b8", 14)),
      readout: cell("Rₓ", rx.toFixed(0), "#34d399") + cell("Rᵧ", ry.toFixed(0), "#34d399") + cell("|R|", mag.toFixed(2), "#f59e0b"),
      verdict: "<b>Vector addition:</b> add horizontal components together and vertical components together. The resultant arrow is the diagonal of the component parallelogram."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span><span>input vectors</span></div><div class="legend-item"><span class="legend-dot" style="background:#34d399"></span><span>resultant</span></div>');

  install("lines3d", "Angle between lines", { angle: 45 }, function (s) {
    return range("angle", "Projected angle", 0, 90, 1, s.angle, "°");
  }, function (s) {
    var c = Math.cos(s.angle * Math.PI / 180);
    return {
      svg: shell('<line x1="165" y1="220" x2="530" y2="90" stroke="#38bdf8" stroke-width="5"></line><line x1="165" y1="220" x2="530" y2="220" stroke="#f59e0b" stroke-width="5"></line><path d="M235 195 A75 75 0 0 1 275 174" fill="none" stroke="#34d399" stroke-width="3"></path>' +
        text(500, 70, "cos θ = (a₁a₂+b₁b₂+c₁c₂)/(|a₁||a₂|)", "#f8fafc", 14) + text(500, 115, "direction ratios → angle", "#94a3b8", 15)),
      readout: cell("θ", s.angle.toFixed(0) + "°", "#34d399") + cell("cos θ", c.toFixed(3), "#f59e0b"),
      verdict: "<b>3D line angle:</b> direction ratios are enough. The dot product compares how much the two directions point the same way."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span><span>reference direction</span></div>');

  install("lp", "Linear-programming feasible region", { slope: 1 }, function (s) {
    return range("slope", "Objective slope", -2, 3, 0.1, s.slope, "");
  }, function (s) {
    var y1 = 4 - s.slope * 1, y2 = 4 - s.slope * 3;
    return {
      svg: shell('<line x1="95" y1="245" x2="600" y2="245" stroke="#475569"></line><line x1="95" y1="55" x2="95" y2="245" stroke="#475569"></line><polygon points="95,245 95,105 300,105 470,245" fill="#34d39955" stroke="#34d399" stroke-width="3"></polygon>' +
        '<line x1="100" y1="' + (245 - y1 * 35) + '" x2="560" y2="' + (245 - y2 * 35) + '" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 5"></line>' +
        '<circle cx="95" cy="105" r="7" fill="#38bdf8"></circle><circle cx="300" cy="105" r="7" fill="#38bdf8"></circle><circle cx="470" cy="245" r="7" fill="#38bdf8"></circle>' +
        text(500, 65, "objective line slides", "#f8fafc", 17) + text(500, 100, "test the vertices", "#94a3b8", 15)),
      readout: cell("slope", s.slope.toFixed(1)) + cell("candidate points", "vertices", "#34d399") + cell("method", "corner test", "#f59e0b"),
      verdict: "<b>Graphical method:</b> the optimum occurs at a corner of the feasible region unless the objective is constant along an edge."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#34d399"></span><span>feasible region</span></div>');

  install("probability", "Probability tree", { pA: 0.6, pB: 0.3 }, function (s) {
    return range("pA", "P(A)", 0.1, 0.9, 0.05, s.pA, "") + range("pB", "P(B|A)", 0.1, 0.9, 0.05, s.pB, "");
  }, function (s) {
    var joint = s.pA * s.pB, other = (1 - s.pA) * 0.2, total = joint + other;
    return {
      svg: shell('<line x1="110" y1="150" x2="260" y2="90" stroke="#38bdf8" stroke-width="3"></line><line x1="110" y1="150" x2="260" y2="220" stroke="#94a3b8" stroke-width="3"></line><line x1="260" y1="90" x2="470" y2="60" stroke="#34d399" stroke-width="3"></line><line x1="260" y1="90" x2="470" y2="125" stroke="#94a3b8" stroke-width="3"></line><line x1="260" y1="220" x2="470" y2="190" stroke="#f59e0b" stroke-width="3"></line><line x1="260" y1="220" x2="470" y2="250" stroke="#94a3b8" stroke-width="3"></line>' +
        text(100, 140, "start", "#f8fafc", 14) + text(260, 78, "A", "#38bdf8", 17) + text(260, 210, "Aᶜ", "#94a3b8", 17) + text(505, 60, "B", "#34d399", 17) + text(505, 125, "Bᶜ", "#94a3b8", 17) +
        text(505, 190, "B", "#f59e0b", 17) + text(505, 250, "Bᶜ", "#94a3b8", 17)),
      readout: cell("P(A∩B)", joint.toFixed(3), "#34d399") + cell("P(B)", total.toFixed(3), "#f59e0b") + cell("P(A|B)", (joint / Math.max(total, 0.001)).toFixed(3), "#38bdf8"),
      verdict: "<b>Bayes:</b> multiply along a branch, add disjoint branches for P(B), then reverse the condition with P(A|B) = P(A∩B)/P(B)."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#34d399"></span><span>target branch</span></div>');
})();
</script>
  <script>if (window.App && typeof window.App.routeFromHash === "function") window.App.routeFromHash();</script>
</body>
