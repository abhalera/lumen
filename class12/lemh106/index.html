<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Class 12 Mathematics — Application of Derivatives.">
  <title>Application of Derivatives — Class 12 Mathematics</title>
  <style>:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  text-align: left;
  background: #0f172a;
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
}
.play-btn {
  flex: none;
  width: 34px;
  height: 34px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 14px;
}
.video-title {
  font-size: 13px;
  line-height: 1.4;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.q-badge {
  background: var(--soft);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 3px 10px;
  border-radius: 6px;
}
.q-concept-link {
  color: var(--blue);

00 cm³/s"}, {"number": "6.1.5", "exercise": "6.1", "question": "A stone is dropped into a quiet lake and waves move in circles at the speed of 5 cm/s. At the instant when the radius of the circular wave is 8 cm, how fast is the enclosed area increasing?", "page": 4, "endPage": 4, "title": "NCERT Exercise 6.1 · Question 5", "conceptIdx": 0, "steps": ["A = πr², so dA/dt = 2πr(dr/dt).", "With dr/dt = 5 and r = 8: dA/dt = 2π(8)(5) = 80π."], "answer": "80π cm²/s"}, {"number": "6.1.6", "exercise": "6.1", "question": "The radius of a circle is increasing at the rate of 0.7 cm/s. What is the rate of increase of its circumference?", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 6", "conceptIdx": 0, "steps": ["C = 2πr, so dC/dt = 2π(dr/dt).", "With dr/dt = 0.7: dC/dt = 1.4π = 4.4 cm/s."], "answer": "4.4 cm/s"}, {"number": "6.1.7", "exercise": "6.1", "question": "The length x of a rectangle is decreasing at the rate of 5 cm/minute and the width y is increasing at the rate of 4 cm/minute. When x = 8 cm and y = 6 cm, find the rates of change of (a) the perimeter, and (b) the area of the rectangle.", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 7", "conceptIdx": 0, "steps": ["P = 2(x + y), so dP/dt = 2(dx/dt + dy/dt) = 2(−5 + 4) = −2.", "A = xy, so dA/dt = x(dy/dt) + y(dx/dt) = 8(4) + 6(−5) = 2."], "answer": "(a) Perimeter decreasing at 2 cm/min (b) Area increasing at 2 cm²/min"}, {"number": "6.1.8", "exercise": "6.1", "question": "A balloon, which always remains spherical on inflation, is being inflated by pumping in 900 cubic centimetres of gas per second. Find the rate at which the radius of the balloon increases when the radius is 15 cm.", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 8", "conceptIdx": 0, "steps": ["V = (4/3)πr³, so dV/dt = 4πr²(dr/dt).", "dr/dt = 900/(4πr²) = 225/(πr²).", "At r = 15: dr/dt = 225/(225π) = 1/π."], "answer": "1/π cm/s"}, {"number": "6.1.9", "exercise": "6.1", "question": "A balloon, which always remains spherical has a variable radius. Find the rate at which its volume is increasing with the radius when the later is 10 cm.", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 9", "conceptIdx": 0, "steps": ["V = (4/3)πr³, so dV/dr = 4πr².", "At r = 10: dV/dr = 400π."], "answer": "400π cm³/cm"}, {"number": "6.1.10", "exercise": "6.1", "question": "A ladder 5 m long is leaning against a wall. The bottom of the ladder is pulled along the ground, away from the wall, at the rate of 2 cm/s. How fast is its height on the wall decreasing when the foot of the ladder is 4 m away from the wall?", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 10", "conceptIdx": 0, "steps": ["x² + y² = 25, so x(dx/dt) + y(dy/dt) = 0.", "At x = 4, y = 3, with dx/dt = 2: dy/dt = −(4/3)(2) = −8/3."], "answer": "Height decreasing at 8/3 cm/s"}, {"number": "6.1.11", "exercise": "6.1", "question": "A particle moves along the curve 6y = x³ + 2. Find the points on the curve at which the y-coordinate is changing 8 times as fast as the x-coordinate.", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 11", "conceptIdx": 0, "steps": ["6(dy/dt) = 3x²(dx/dt), so dy/dt = (x²/2)(dx/dt).", "dy/dt = 8(dx/dt) gives x²/2 = 8, so x = ±4.", "x = 4 gives y = 11; x = −4 gives y = −31/3."], "answer": "(4, 11) and (−4, −31/3)"}, {"number": "6.1.12", "exercise": "6.1", "question": "The radius of an air bubble is increasing at the rate of 1/2 cm/s. At what rate is the volume of the bubble increasing when the radius is 1 cm? A balloon, which always remains spherical, has a variable diameter (3/2)(2x + 1). Find the rate of change of its volume with respect to x.", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 12", "conceptIdx": 0, "steps": ["Bubble: dV/dt = 4πr²(dr/dt) = 4π(1)(1/2) = 2π at r = 1.", "Balloon: r = (3/4)(2x + 1), so dV/dx = 4πr²(3/2) = 6πr².", "dV/dx = 6π·(9/16)(2x + 1)² = (27π/8)(2x + 1)²."], "answer": "Bubble volume increasing at 2π cm³/s; balloon dV/dx = (27π/8)(2x + 1)²"}, {"number": "6.1.14", "exercise": "6.1", "question": "Sand is pouring from a pipe at the rate of 12 cm³/s. The falling sand forms a cone on the ground in such a way that the height of the cone is always one-sixth of the radius of the base. How fast is the height of the sand cone increasing when the height is 4 cm?", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 14", "conceptIdx": 0, "steps": ["h = r/6 gives r = 6h, so V = (1/3)πr²h = 12πh³.", "dV/dt = 36πh²(dh/dt) = 12, so dh/dt = 1/(3πh²).", "At h = 4: dh/dt = 1/(48π)."], "answer": "1/(48π) cm/s"}, {"number": "6.1.15", "exercise": "6.1", "question": "The total cost C (x) in Rupees associated with the production of x units of an item is given by C (x) = 0.007x³ − 0.003x² + 15x + 4000. Find the marginal cost when 17 units are produced.", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 15", "conceptIdx": 0, "steps": ["MC = C′(x) = 0.021x² − 0.006x + 15.", "At x = 17: 0.021(289) − 0.006(17) + 15 = 6.069 − 0.102 + 15 = 20.967."], "answer": "Rs 20.97 (20.967)"}, {"number": "6.1.16", "exercise": "6.1", "question": "The total revenue in Rupees received from the sale of x units of a product is given by R(x) = 13x² + 26x + 15. Find the marginal revenue when x = 7.", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 16", "conceptIdx": 0, "steps": ["MR = R′(x) = 26x + 26.", "At x = 7: MR = 182 + 26 = 208."], "answer": "Rs 208"}, {"number": "6.1.17", "exercise": "6.1", "question": "The rate of change of the area of a circle with respect to its radius r at r = 6 cm is (A) 10π (B) 12π (C) 8π (D) 11π", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 17", "conceptIdx": 0, "steps": ["dA/dr = 2πr.", "At r = 6: dA/dr = 12π, which is option (B)."], "answer": "(B) 12π"}, {"number": "6.1.18", "exercise": "6.1", "question": "The total revenue in Rupees received from the sale of x units of a product is given by R(x) = 3x² + 36x + 5. The marginal revenue, when x = 15 is (A) 116 (B) 96 (C) 90 (D) 126", "page": 6, "endPage": 6, "title": "NCERT Exercise 6.1 · Question 18", "conceptIdx": 0, "steps": ["MR = R′(x) = 6x + 36.", "At x = 15: MR = 90 + 36 = 126, which is option (D)."], "answer": "(D) 126"}, {"number": "6.2.1", "exercise": "6.2", "question": "Show that the function given by f(x) = 3x + 17 is increasing on R.", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 1", "conceptIdx": 1, "steps": ["f′(x) = 3 > 0 for all x ∈ R.", "A positive derivative on R implies f is strictly increasing on R."], "answer": "f is increasing on R"}, {"number": "6.2.2", "exercise": "6.2", "question": "Show that the function given by f(x) = e²ˣ is increasing on R.", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 2", "conceptIdx": 1, "steps": ["f′(x) = 2e²ˣ > 0 for all x ∈ R (exponential is always positive).", "Hence f is strictly increasing on R."], "answer": "f is increasing on R"}, {"number": "6.2.3", "exercise": "6.2", "question": "Show that the function given by f(x) = sin x is (a) increasing in (0, π/2) (b) decreasing in (π/2, π) (c) neither increasing nor decreasing in (0, π)", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 3", "conceptIdx": 1, "steps": ["f′(x) = cos x.", "(a) cos x > 0 on (0, π/2), so f increases; (b) cos x < 0 on (π/2, π), so f decreases.", "(c) Since it increases on part and decreases on part of (0, π), it is neither on the whole interval."], "answer": "(a) Increasing (b) Decreasing (c) Neither"}, {"number": "6.2.4", "exercise": "6.2", "question": "Find the intervals in which the function f given by f(x) = 2x² − 3x is (a) increasing (b) decreasing", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 4", "conceptIdx": 1, "steps": ["f′(x) = 4x − 3, zero at x = 3/4.", "f′ > 0 for x > 3/4 and f′ < 0 for x < 3/4."], "answer": "(a) Increasing on [3/4, ∞) (b) Decreasing on (−∞, 3/4]"}, {"number": "6.2.5", "exercise": "6.2", "question": "Find the intervals in which the function f given by f(x) = 2x³ − 3x² − 36x + 7 is (a) increasing (b) decreasing", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 5", "conceptIdx": 1, "steps": ["f′(x) = 6x² − 6x − 36 = 6(x − 3)(x + 2), zeros at x = −2, 3.", "(x − 3)(x + 2) > 0 outside the roots and < 0 between them."], "answer": "(a) Increasing on (−∞, −2] and [3, ∞) (b) Decreasing on [−2, 3]"}, {"number": "6.2.6", "exercise": "6.2", "question": "Find the intervals in which the following functions are strictly increasing or decreasing: (a) x² + 2x − 5 (b) 10 − 6x − 2x² (c) −2x³ − 9x² − 12x + 1 (d) 6 − 9x − x² (e) (x + 1)³(x − 3)³", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 6", "conceptIdx": 1, "steps": ["Derivatives: (a) 2(x+1); (b) −6−4x, zero −3/2; (c) −6(x+1)(x+2), zeros −2,−1; (d) −9−2x, zero −9/2; (e) 6(x−1)(x+1)²(x−3)², sign of (x−1).", "Increasing where derivative > 0: (a) x>−1 (b) x<−3/2 (c) −2<x<−1 (d) x<−9/2 (e) x>1; decreasing on the complementary intervals."], "answer": "(a) Inc (−1,∞), dec (−∞,−1); (b) Inc (−∞,−3/2), dec (−3/2,∞); (c) Inc (−2,−1), dec elsewhere; (d) Inc (−∞,−9/2), dec (−9/2,∞); (e) Inc (1,∞), dec (−∞,1)"}, {"number": "6.2.7", "exercise": "6.2", "question": "Show that x > −1, f is an increasing function of x, where f(x) = log(1 + x) − 2x/(2 + x), throughout its domain.", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 7", "conceptIdx": 1, "steps": ["dy/dx = 1/(1+x) − 4/(2+x)² = x²/[(1+x)(2+x)²].", "For x > −1 the denominator is positive and the numerator x² ≥ 0 (zero only at x = 0).", "Hence dy/dx > 0 except at an isolated point, so y is increasing on (−1, ∞)."], "answer": "Increasing throughout its domain"}, {"number": "6.2.8", "exercise": "6.2", "question": "Find the values of x for which y = [x(x − 2)]² is an increasing function.", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 8", "conceptIdx": 1, "steps": ["y = (x² − 2x)², so dy/dx = 4x(x − 2)(x − 1).", "Critical points 0, 1, 2; sign chart gives dy/dx > 0 on (0, 1) and (2, ∞)."], "answer": "Increasing on (0, 1) and (2, ∞)"}, {"number": "6.2.9", "exercise": "6.2", "question": "Prove that y = 4sin θ/(2 + cos θ) − θ is an increasing function of θ in [0, π/2].", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 9", "conceptIdx": 1, "steps": ["dy/dθ = [8cos θ + 4]/(2 + cos θ)² − 1 = cos θ(4 − cos θ)/(2 + cos θ)².", "On [0, π/2], cos θ ≥ 0 and 4 − cos θ > 0, so dy/dθ ≥ 0."], "answer": "Increasing on [0, π/2]"}, {"number": "6.2.10", "exercise": "6.2", "question": "Prove that the logarithmic function is increasing on (0, ∞).", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 10", "conceptIdx": 1, "steps": ["f(x) = log x gives f′(x) = 1/x.", "1/x > 0 for all x > 0, so f is increasing on (0, ∞)."], "answer": "Increasing on (0, ∞)"}, {"number": "6.2.11", "exercise": "6.2", "question": "Prove that the function f given by f(x) = x² − x + 1 is neither strictly increasing nor decreasing on (−1, 1).", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 11", "conceptIdx": 1, "steps": ["f′(x) = 2x − 1, zero at x = 1/2.", "f′ < 0 on (−1, 1/2) and f′ > 0 on (1/2, 1), so f decreases then increases."], "answer": "Neither strictly increasing nor decreasing on (−1, 1)"}, {"number": "6.2.12", "exercise": "6.2", "question": "Which of the following functions are decreasing on (0, π/2)? (A) cos x (B) cos 2x (C) cos 3x (D) tan x", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 12", "conceptIdx": 1, "steps": ["(A) −sin x < 0 and (B) −2sin 2x < 0 throughout (0, π/2), so both decrease.", "(C) −3sin 3x changes sign (3x ranges to 3π/2); (D) sec²x > 0, so tan x increases."], "answer": "(A) cos x and (B) cos 2x"}, {"number": "6.2.13", "exercise": "6.2", "question": "On which of the following intervals is the function f given by f(x) = x¹⁰⁰ + sin x − 1 decreasing? (A) (0, 1) (B) (π/2, π) (C) (0, π/2) (D) None of these", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 13", "conceptIdx": 1, "steps": ["f′(x) = 100x⁹⁹ + cos x.", "On each of (A), (B), (C) the term 100x⁹⁹ dominates or both terms are non-negative, so f′ > 0 throughout."], "answer": "(D) None of these"}, {"number": "6.2.14", "exercise": "6.2", "question": "For what values of a the function f given by f(x) = x² + ax + 1 is increasing on [1, 2]?", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 14", "conceptIdx": 1, "steps": ["f′(x) = 2x + a must be ≥ 0 for all x ∈ [1, 2].", "2x + a is smallest at x = 1, giving 2 + a ≥ 0, i.e. a ≥ −2."], "answer": "a ≥ −2"}, {"number": "6.2.15", "exercise": "6.2", "question": "Let I be any interval disjoint from [−1, 1]. Prove that the function f given by f(x) = x + 1/x is increasing on I.", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 15", "conceptIdx": 1, "steps": ["f′(x) = 1 − 1/x² = (x² − 1)/x².", "If I is disjoint from [−1, 1] then |x| > 1 on I, so f′ > 0 throughout I."], "answer": "f is increasing on I"}, {"number": "6.2.16", "exercise": "6.2", "question": "Prove that the function f given by f(x) = log sin x is increasing on (0, π/2) and decreasing on (π/2, π).", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 16", "conceptIdx": 1, "steps": ["f′(x) = cos x/sin x = cot x (domain excludes multiples of π).", "cot x > 0 on (0, π/2) and cot x < 0 on (π/2, π)."], "answer": "Increasing on (0, π/2); decreasing on (π/2, π)"}, {"number": "6.2.17", "exercise": "6.2", "question": "Prove that the function f given by f(x) = log|cos x| is decreasing on (0, π/2) and increasing on (3π/2, 2π).", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 17", "conceptIdx": 1, "steps": ["f′(x) = −tan x (where cos x ≠ 0).", "tan x > 0 on (0, π/2) so f′ < 0; tan x < 0 on (3π/2, 2π) so f′ > 0."], "answer": "Decreasing on (0, π/2); increasing on (3π/2, 2π)"}, {"number": "6.2.18", "exercise": "6.2", "question": "Prove that the function given by f(x) = x³ − 3x² + 3x − 100 is increasing in R.", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 18", "conceptIdx": 1, "steps": ["f′(x) = 3x² − 6x + 3 = 3(x − 1)² ≥ 0, zero only at the isolated point x = 1.", "Hence f is strictly increasing on R."], "answer": "Increasing in R"}, {"number": "6.2.19", "exercise": "6.2", "question": "The interval in which y = x²e⁻ˣ is increasing is (A) (−∞, ∞) (B) (−2, 0) (C) (2, ∞) (D) (0, 2)", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 19", "conceptIdx": 1, "steps": ["dy/dx = 2xe⁻ˣ − x²e⁻ˣ = x(2 − x)e⁻ˣ.", "This is positive exactly when 0 < x < 2, i.e. option (D)."], "answer": "(D) (0, 2)"}, {"number": "6.3.1", "exercise": "6.3", "question": "Find the maximum and minimum values, if any, of the following functions given by (i) f(x) = (2x − 1)² + 3 (ii) f(x) = 9x² + 12x + 2 (iii) f(x) = −(x − 1)² + 10 (iv) g(x) = x³ + 1", "page": 28, "endPage": 28, "title": "NCERT Exercise 6.3 · Question 1", "conceptIdx": 2, "steps": ["(i) (2x−1)² ≥ 0: minimum 3 at x = 1/2, no maximum.", "(ii) 9x²+12x+2 = (3x+2)² − 2: minimum −2 at x = −2/3, no maximum; (iii) −(x−1)²+10 ≤ 10: maximum 10 at x = 1, no minimum.", "(iv) x³+1 is unbounded both ways: no maximum or minimum."], "answer": "(i) Min 3 at x=1/2 (ii) Min −2 at x=−2/3 (iii) Max 10 at x=1 (iv) None"}, {"number": "6.3.2", "exercise": "6.3", "question": "Find the maximum and minimum values, if any, of the following functions given by (i) f(x) = |x + 2| − 1 (ii) g(x) = −|x + 1| + 3 (iii) h(x) = sin(2x) + 5 (iv) f(x) = |sin 4x + 3| (v) h(x) = x + 1, x ∈ (−1, 1)", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 2", "conceptIdx": 2, "steps": ["(i) |x+2| ≥ 0: minimum −1 at x = −2, no maximum; (ii) −|x+1| ≤ 0: maximum 3 at x = −1, no minimum.", "(iii) sin 2x ∈ [−1,1]: minimum 4, maximum 6; (iv) sin 4x+3 ∈ [2,4]: minimum 2, maximum 4.", "(v) x+1 ∈ (0,2) on the open interval: neither maximum nor minimum."], "answer": "(i) Min −1 (ii) Max 3 (iii) Min 4, Max 6 (iv) Min 2, Max 4 (v) None"}, {"number": "6.3.3", "exercise": "6.3", "question": "Find the local maxima and local minima, if any, of the following functions. Find also the local maximum and the local minimum values, as the case may be: (i) f(x) = x² (ii) g(x) = x³ − 3x (iii) h(x) = sin x + cos x, 0 < x < π/2 (iv) f(x) = sin x − cos x, 0 < x < π (v) f(x) = x³ − 6x² + 9x + 15 (vi) g(x) = x/2 + 2/x, x > 0 (vii) g(x) = 1/(x² + 2) (viii) f(x) = x√(1 − x), 0 < x < 1", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 3", "conceptIdx": 2, "steps": ["Critical points: (i) x=0; (ii) x=±1; (iii) x=π/4; (iv) x=3π/4; (v) x=1,3; (vi) x=2; (vii) x=0; (viii) x=2/3.", "Second-derivative/first-derivative tests classify each: maxima at (ii) x=−1, (iii) π/4, (iv) 3π/4, (v) x=1, (vii) x=0, (viii) x=2/3; minima at (i) x=0, (ii) x=1, (v) x=3, (vi) x=2."], "answer": "(i) Min 0 at 0; (ii) Max 2 at −1, Min −2 at 1; (iii) Max √2 at π/4; (iv) Max √2 at 3π/4; (v) Max 19 at 1, Min 15 at 3; (vi) Min 2 at 2; (vii) Max 1/2 at 0; (viii) Max 2/(3√3) at 2/3"}, {"number": "6.3.4", "exercise": "6.3", "question": "Prove that the following functions do not have maxima or minima: (i) f(x) = eˣ (ii) g(x) = log x (iii) h(x) = x³ + x² + x + 1", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 4", "conceptIdx": 2, "steps": ["(i) f′ = eˣ ≠ 0; (ii) g′ = 1/x ≠ 0: no critical points.", "(iii) h′ = 3x² + 2x + 1 has discriminant 4 − 12 < 0, so no real critical points."], "answer": "No critical points, hence no maxima or minima in each case"}, {"number": "6.3.5", "exercise": "6.3", "question": "Find the absolute maximum value and the absolute minimum value of the following functions in the given intervals: (i) f(x) = x³, x ∈ [−2, 2] (ii) f(x) = sin x + cos x, x ∈ [0, π] (iii) f(x) = 4x − x²/2, x ∈ [−2, 9/2] (iv) f(x) = (x − 1)² + 3, x ∈ [−3, 1]", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 5", "conceptIdx": 2, "steps": ["(i) Monotonic: f(−2) = −8, f(2) = 8. (ii) Critical x = π/4: values 1, √2, −1 at 0, π/4, π.", "(iii) Critical x = 4: values −10, 8, 63/8 at −2, 4, 9/2. (iv) Critical x = 1: values 19, 3 at −3, 1."], "answer": "(i) Max 8, Min −8 (ii) Max √2, Min −1 (iii) Max 8, Min −10 (iv) Max 19, Min 3"}, {"number": "6.3.6", "exercise": "6.3", "question": "Find the maximum profit that a company can make, if the profit function is given by p(x) = 41 − 72x − 18x²", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 6", "conceptIdx": 2, "steps": ["p′(x) = −72 − 36x = 0 gives x = −2; p′′(x) = −36 < 0.", "p(−2) = 41 + 144 − 72 = 113."], "answer": "113"}, {"number": "6.3.7", "exercise": "6.3", "question": "Find both the maximum value and the minimum value of 3x⁴ − 8x³ + 12x² − 48x + 25 on the interval [0, 3].", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 7", "conceptIdx": 2, "steps": ["f′(x) = 12x³ − 24x² + 24x − 48 = 12(x − 2)(x² + 2); only critical point x = 2.", "f(0) = 25, f(2) = −39, f(3) = 16."], "answer": "Maximum 25 at x = 0; minimum −39 at x = 2"}, {"number": "6.3.8", "exercise": "6.3", "question": "At what points in the interval [0, 2π], does the function sin 2x attain its maximum value?", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 8", "conceptIdx": 2, "steps": ["sin 2x = 1 when 2x = π/2 or 5π/2 within [0, 4π].", "Hence x = π/4 or 5π/4."], "answer": "x = π/4 and x = 5π/4 (maximum value 1)"}, {"number": "6.3.9", "exercise": "6.3", "question": "What is the maximum value of the function sin x + cos x?", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 9", "conceptIdx": 2, "steps": ["f(x) = sin x + cos x = √2 sin(x + π/4).", "Sine attains 1, so the maximum is √2 (at x = π/4)."], "answer": "√2"}, {"number": "6.3.10", "exercise": "6.3", "question": "Find the maximum value of 2x³ − 24x + 107 in the interval [1, 3]. Find the maximum value of the same function in [−3, −1].", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 10", "conceptIdx": 2, "steps": ["f′(x) = 6x² − 24 = 6(x − 2)(x + 2); critical points ±2.", "On [1, 3]: f(1) = 85, f(2) = 75, f(3) = 89. On [−3, −1]: f(−3) = 107, f(−2) = 139, f(−1) = 129."], "answer": "Max 89 on [1, 3]; max 139 on [−3, −1]"}, {"number": "6.3.11", "exercise": "6.3", "question": "It is given that at x = 1, the function x⁴ − 62x² + ax + 9 attains its maximum value, on the interval [0, 2]. Find the value of a.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 11", "conceptIdx": 2, "steps": ["f′(x) = 4x³ − 124x + a; maximum at interior x = 1 gives f′(1) = 0.", "4 − 124 + a = 0, so a = 120 (and f′′(1) = −112 < 0 confirms a maximum)."], "answer": "a = 120"}, {"number": "6.3.12", "exercise": "6.3", "question": "Find the maximum and minimum values of x + sin 2x on [0, 2π].", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 12", "conceptIdx": 2, "steps": ["f′(x) = 1 + 2cos 2x = 0 gives cos 2x = −1/2, i.e. x = π/3, 2π/3, 4π/3, 5π/3.", "Values: f(0) = 0, f(π/3) = π/3 + √3/2, f(2π/3) = 2π/3 − √3/2, f(4π/3) = 4π/3 + √3/2, f(5π/3) = 5π/3 − √3/2, f(2π) = 2π."], "answer": "Maximum 2π at x = 2π; minimum 0 at x = 0"}, {"number": "6.3.13", "exercise": "6.3", "question": "Find two numbers whose sum is 24 and whose product is as large as possible.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 13", "conceptIdx": 2, "steps": ["Let numbers be x and 24 − x; P(x) = 24x − x².", "P′(x) = 24 − 2x = 0 gives x = 12, with P′′ < 0."], "answer": "12 and 12 (product 144)"}, {"number": "6.3.14", "exercise": "6.3", "question": "Find two positive numbers x and y such that x + y = 60 and xy³ is maximum.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 14", "conceptIdx": 2, "steps": ["P = x(60 − x)³; P′ = (60 − x)³ − 3x(60 − x)² = (60 − x)²(60 − 4x).", "P′ = 0 gives x = 15 (positive, P′′ < 0), so y = 45."], "answer": "x = 15, y = 45"}, {"number": "6.3.15", "exercise": "6.3", "question": "Find two positive numbers x and y such that their sum is 35 and the product x²y⁵ is a maximum.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 15", "conceptIdx": 2, "steps": ["P = x²(35 − x)⁵; P′ = x(35 − x)⁴[2(35 − x) − 5x] = x(35 − x)⁴(70 − 7x).", "P′ = 0 gives x = 10, so y = 25."], "answer": "x = 10, y = 25"}, {"number": "6.3.16", "exercise": "6.3", "question": "Find two positive numbers whose sum is 16 and the sum of whose cubes is minimum.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 16", "conceptIdx": 2, "steps": ["S = x³ + (16 − x)³ = 48x² − 768x + 4096.", "S′ = 96x − 768 = 0 gives x = 8, with S′′ > 0."], "answer": "8 and 8"}, {"number": "6.3.17", "exercise": "6.3", "question": "A square piece of tin of side 18 cm is to be made into a box without top, by cutting a square from each corner and folding up the flaps to form the box. What should be the side of the square to be cut off so that the volume of the box is the maximum possible.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 17", "conceptIdx": 2, "steps": ["V(x) = x(18 − 2x)² = 4x³ − 72x² + 324x; V′ = 12x² − 144x + 324 = 12(x − 3)(x − 9).", "V′ = 0 gives x = 3 (x = 9 rejected); V′′(3) < 0."], "answer": "3 cm"}, {"number": "6.3.18", "exercise": "6.3", "question": "A rectangular sheet of tin 45 cm by 24 cm is to be made into a box without top, by cutting off square from each corner and folding up the flaps. What should be the side of the square to be cut off so that the volume of the box is maximum?", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 18", "conceptIdx": 2, "steps": ["V(x) = x(45 − 2x)(24 − 2x) = 4x³ − 138x² + 1080x.", "V′ = 12x² − 276x + 1080 = 12(x − 5)(x − 18); x = 5 gives V′′ < 0 (x = 18 rejected)."], "answer": "5 cm"}, {"number": "6.3.19", "exercise": "6.3", "question": "Show that of all the rectangles inscribed in a given fixed circle, the square has the maximum area.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 19", "conceptIdx": 2, "steps": ["Let circle radius a, rectangle sides 2x, 2y with x² + y² = a²; A = 4xy = 4x√(a² − x²).", "dA/dx = 0 gives x = a/√2, hence y = a/√2; sides equal 2x = 2y.", "Second derivative negative, so this is the maximum."], "answer": "Maximum when rectangle is a square of side a√2"}, {"number": "6.3.20", "exercise": "6.3", "question": "Show that the right circular cylinder of given surface and maximum volume is such that its height is equal to the diameter of the base.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 20", "conceptIdx": 2, "steps": ["S = 2πr² + 2πrh fixed gives h = (S − 2πr²)/(2πr); V = πr²h = (Sr − 2πr³)/2.", "dV/dr = 0 gives r² = S/(6π); then h = 2r, with d²V/dr² < 0."], "answer": "h = 2r (height equals diameter)"}, {"number": "6.3.21", "exercise": "6.3", "question": "Of all the closed cylindrical cans (right circular), of a given volume of 100 cubic centimetres, find the dimensions of the can which has the minimum surface area?", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 21", "conceptIdx": 2, "steps": ["πr²h = 100 gives h = 100/(πr²); S = 2πr² + 200/r.", "dS/dr = 4πr − 200/r² = 0 gives r³ = 50/π, with d²S/dr² > 0; then h = 2r."], "answer": "Radius ³√(50/π) cm, height 2³√(50/π) cm"}, {"number": "6.3.22", "exercise": "6.3", "question": "A wire of length 28 m is to be cut into two pieces. One of the pieces is to be made into a square and the other into a circle. What should be the length of the two pieces so that the combined area of the square and the circle is minimum?", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 22", "conceptIdx": 2, "steps": ["Let circle piece be x: r = x/(2π), square side (28 − x)/4; A = x²/(4π) + (28 − x)²/16.", "dA/dx = x/(2π) − (28 − x)/8 = 0 gives x = 112/(π + 4), with d²A/dx² > 0."], "answer": "Circle piece 112/(π + 4) m, square piece 28π/(π + 4) m"}, {"number": "6.3.23", "exercise": "6.3", "question": "Prove that the volume of the largest cone that can be inscribed in a sphere of radius R is 8/27 of the volume of the sphere.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 23", "conceptIdx": 2, "steps": ["Let cone height h, base radius r with r² = 2Rh − h²; V = (π/3)(2Rh² − h³).", "dV/dh = 0 gives h = 4R/3 (d²V/dh² < 0); V = (8/27)·(4/3)πR³."], "answer": "V_max = 8/27 × (volume of sphere)"}, {"number": "6.3.24", "exercise": "6.3", "question": "Show that the right circular cone of least curved surface and given volume has an altitude equal to √2 times the radius of the base.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 24", "conceptIdx": 2, "steps": ["Fixed V = (1/3)πr²h gives h = 3V/(πr²); curved surface S = πr√(r² + h²); minimize S² = π²(r⁴ + 9V²/(π²r²)).", "d(S²)/dr = 0 gives r⁶ = 9V²/(2π²), i.e. h² = 2r², so h = √2·r."], "answer": "h = √2·r"}, {"number": "6.3.25", "exercise": "6.3", "question": "Show that the semi-vertical angle of the cone of the maximum volume and of given slant height is tan⁻¹(1/√2).", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 25", "conceptIdx": 2, "steps": ["Let slant height l, semi-vertical angle θ: r = l sin θ, h = l cos θ; V = (π/3)l³sin²θcos θ.", "dV/dθ = 0 gives 2cos²θ − sin²θ = 0, i.e. tan²θ = 1/2, with negative second derivative."], "answer": "θ = tan⁻¹(1/√2)"}, {"number": "6.3.26", "exercise": "6.3", "question": "Show that semi-vertical angle of right circular cone of given surface area and maximum volume is sin⁻¹(1/3).", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 26", "conceptIdx": 2, "steps": ["Fixed total surface S = πr(r + l) with l² = r² + h²; eliminating l and maximizing V = (1/3)πr²h gives h² = 8r²... equivalently sin θ = r/l = 1/3.", "With r = h·tan θ and the constraint, dV/dθ = 0 yields sin θ = 1/3 (maximum)."], "answer": "θ = sin⁻¹(1/3)"}, {"number": "6.3.27", "exercise": "6.3", "question": "The point on the curve x² = 2y which is nearest to the point (0, 5) is (A) (2√2, 4) (B) (2√2, 0) (C) (0, 0) (D) (2, 2)", "page": 31, "endPage": 31, "title": "NCERT Exercise 6.3 · Question 27", "conceptIdx": 2, "steps": ["Minimize squared distance D = x² + (y − 5)² = 2y + (y − 5)²; dD/dy = 2 + 2(y − 5) = 0 gives y = 4.", "y = 4 gives x² = 8, i.e. x = ±2√2; option (A)."], "answer": "(A) (2√2, 4)"}, {"number": "6.3.28", "exercise": "6.3", "question": "For all real values of x, the minimum value of (1 − x + x²)/(1 + x + x²) is (A) 0 (B) 1 (C) 3 (D) 1/3", "page": 31, "endPage": 31, "title": "NCERT Exercise 6.3 · Question 28", "conceptIdx": 2, "steps": ["Let y = (1 − x + x²)/(1 + x + x²); dy/dx = 0 gives 2(x² − 1) = 0, i.e. x = ±1.", "y(1) = 1/3, y(−1) = 3; limits at ±∞ are 1, so minimum is 1/3, option (D)."], "answer": "(D) 1/3"}, {"number": "6.3.29", "exercise": "6.3", "question": "The maximum value of [x(x − 1) + 1]¹⸍³, 0 ≤ x ≤ 1 is (A) (1/3)¹⸍³ (B) 1/2 (C) 1 (D) 0", "page": 31, "endPage": 31, "title": "NCERT Exercise 6.3 · Question 29", "conceptIdx": 2, "steps": ["Inner quadratic x² − x + 1 has minimum 3/4 at x = 1/2 and value 1 at both endpoints.", "Cube root is increasing, so the maximum on [0, 1] is 1¹⸍³ = 1, option (C)."], "answer": "(C) 1"}, {"number": "Misc.1", "exercise": "Misc", "question": "Show that the function given by f(x) = (log x)/x has maximum at x = e.", "page": 37, "endPage": 37, "title": "NCERT Exercise Misc · Question 1", "conceptIdx": 0, "steps": ["f′(x) = (1 − log x)/x²; f′ = 0 gives log x = 1, i.e. x = e.", "f′ changes from positive to negative through x = e, so it is a maximum (value 1/e)."], "answer": "Maximum at x = e"}, {"number": "Misc.2", "exercise": "Misc", "question": "The two equal sides of an isosceles triangle with fixed base b are decreasing at the rate of 3 cm per second. How fast is the area decreasing when the two equal sides are equal to the base?", "page": 37, "endPage": 37, "title": "NCERT Exercise Misc · Question 2", "conceptIdx": 0, "steps": ["With equal side a: A = (b/4)√(4a² − b²); dA/da = ab/√(4a² − b²).", "At a = b: dA/da = b/√3; with da/dt = −3, dA/dt = −3b/√3 = −√3·b."], "answer": "Area decreasing at √3·b cm²/s (b = base)"}, {"number": "Misc.3", "exercise": "Misc", "question": "Find the intervals in which the function f given by f(x) = (4sin x − 2x − x cos x)/(2 + cos x) is (i) increasing (ii) decreasing.", "page": 37, "endPage": 37, "title": "NCERT Exercise Misc · Question 3", "conceptIdx": 0, "steps": ["f′(x) = cos x(4 − cos x)/(2 + cos x)²; the sign is the sign of cos x.", "f′ > 0 where cos x > 0 and f′ < 0 where cos x < 0."], "answer": "(i) Increasing where cos x > 0, e.g. on [0, π/2) and (3π/2, 2π]; (ii) Decreasing where cos x < 0, e.g. on (π/2, 3π/2)"}, {"number": "Misc.4", "exercise": "Misc", "question": "Find the intervals in which the function f given by f(x) = x³ + 1/x³, x ≠ 0 is (i) increasing (ii) decreasing.", "page": 37, "endPage": 37, "title": "NCERT Exercise Misc · Question 4", "conceptIdx": 0, "steps": ["f′(x) = 3x² − 3/x⁴ = 3(x⁶ − 1)/x⁴; zeros at x = ±1.", "f′ > 0 when |x| > 1 and f′ < 0 when 0 < |x| < 1."], "answer": "(i) Increasing on (−∞, −1] and [1, ∞); (ii) Decreasing on [−1, 0) and (0, 1]"}, {"number": "Misc.5", "exercise": "Misc", "question": "Find the maximum area of an isosceles triangle inscribed in the ellipse x²/a² + y²/b² = 1 with its vertex at one end of the major axis.", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 5", "conceptIdx": 0, "steps": ["Vertex at (−a, 0); symmetric base points (x, ±y) with y = b√(1 − x²/a²); A = (x + a)y.", "dA/dx = 0 gives x = a/2; then y = √3·b/2 and A = (3√3/4)ab (maximum)."], "answer": "(3√3/4)ab"}, {"number": "Misc.6", "exercise": "Misc", "question": "A tank with rectangular base and rectangular sides, open at the top is to be constructed so that its depth is 2 m and volume is 8 m³. If building of tank costs Rs 70 per sq metre for the base and Rs 45 per square metre for sides. What is the cost of least expensive tank?", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 6", "conceptIdx": 0, "steps": ["Depth 2 and volume 8 give base area lb = 4, i.e. b = 4/l; cost C = 70lb + 45·(4l + 4b) = 280 + 180(l + 4/l).", "dC/dl = 0 gives l = 2, so b = 2; C_min = 280 + 720 = 1000."], "answer": "Rs 1000 (2 m × 2 m base)"}, {"number": "Misc.7", "exercise": "Misc", "question": "The sum of the perimeter of a circle and square is k, where k is some constant. Prove that the sum of their areas is least when the side of square is double the radius of the circle.", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 7", "conceptIdx": 0, "steps": ["2πr + 4x = k gives x = (k − 2πr)/4; total area A = πr² + x².", "dA/dr = 2πr − πx/2 = 0 gives x = 2r, with d²A/dr² = 2π + π²/2 > 0."], "answer": "Minimum when side of square = 2 × radius"}, {"number": "Misc.8", "exercise": "Misc", "question": "A window is in the form of a rectangle surmounted by a semicircular opening. The total perimeter of the window is 10 m. Find the dimensions of the window to admit maximum light through the whole opening.", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 8", "conceptIdx": 0, "steps": ["Let half-width r and rectangle height h: 2h + 2r + πr = 10; area A = 2rh + πr²/2.", "dA/dr = 0 gives r = 10/(π + 4), so width 2r = 20/(π + 4) and h = 10/(π + 4)."], "answer": "Width 20/(π + 4) m, height 10/(π + 4) m"}, {"number": "Misc.9", "exercise": "Misc", "question": "A point on the hypotenuse of a triangle is at distance a and b from the sides of the triangle. Show that the minimum length of the hypotenuse is (a²⸍³ + b²⸍³)³⸍².", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 9", "conceptIdx": 0, "steps": ["Let the point divide the hypotenuse with angle θ to one side: hypotenuse L = a·cosec θ + b·sec θ.", "dL/dθ = 0 gives tan³θ = a/b, i.e. tan θ = (a/b)¹⸍³; second derivative positive.", "Substituting gives L_min = (a²⸍³ + b²⸍³)³⸍²."], "answer": "(a²⸍³ + b²⸍³)³⸍²"}, {"number": "Misc.10", "exercise": "Misc", "question": "Find the points at which the function f given by f(x) = (x − 2)⁴(x + 1)³ has (i) local maxima (ii) local minima (iii) point of inflexion", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 10", "conceptIdx": 0, "steps": ["f′(x) = (x − 2)³(x + 1)²(7x − 2); critical points x = 2, −1, 2/7.", "Sign of f′ is governed by (x − 2)³(7x − 2) since (x + 1)² ≥ 0: changes −→+ at x = 2 (minima) and +→− at x = 2/7 (maxima).", "No sign change at x = −1, so it is a point of inflexion."], "answer": "(i) x = 2/7 (ii) x = 2 (iii) x = −1"}, {"number": "Misc.11", "exercise": "Misc", "question": "Find the absolute maximum and minimum values of the function f given by f(x) = cos²x + sin x, x ∈ [0, π]", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 11", "conceptIdx": 0, "steps": ["f′(x) = −sin 2x + cos x = cos x(1 − 2sin x) = 0 gives x = π/2, π/6, 5π/6.", "f(0) = 1, f(π/6) = 5/4, f(π/2) = 1, f(5π/6) = 5/4, f(π) = 1."], "answer": "Absolute max 5/4 at x = π/6, 5π/6; absolute min 1 at x = 0, π/2, π"}, {"number": "Misc.12", "exercise": "Misc", "question": "Show that the altitude of the right circular cone of maximum volume that can be inscribed in a sphere of radius r is 4r/3.", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 12", "conceptIdx": 0, "steps": ["Let cone height h, base radius R with R² = 2rh − h²; V = (π/3)(2rh² − h³).", "dV/dh = (π/3)(4rh − 3h²) = 0 gives h = 4r/3, with d²V/dh² < 0."], "answer": "h = 4r/3"}, {"number": "Misc.13", "exercise": "Misc", "question": "Let f be a function defined on [a, b] such that f′(x) > 0, for all x ∈ (a, b). Then prove that f is an increasing function on (a, b).", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 13", "conceptIdx": 0, "steps": ["Take x₁ < x₂ in (a, b); by the Mean Value Theorem, f(x₂) − f(x₁) = f′(c)(x₂ − x₁) for some c ∈ (x₁, x₂).", "Since f′(c) > 0 and x₂ − x₁ > 0, f(x₂) > f(x₁).", "Hence f is increasing on (a, b)."], "answer": "Proved via the Mean Value Theorem"}, {"number": "Misc.14", "exercise": "Misc", "question": "Show that the height of the cylinder of maximum volume that can be inscribed in a sphere of radius R is 2R/√3. Also find the maximum volume.", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 14", "conceptIdx": 0, "steps": ["Let cylinder height h, radius r with r² + h²/4 = R²; V = πr²h = πh(R² − h²/4).", "dV/dh = 0 gives h² = 4R²/3, i.e. h = 2R/√3 (maximum); V_max = 4πR³/(3√3)."], "answer": "h = 2R/√3; V_max = 4πR³/(3√3)"}, {"number": "Misc.15", "exercise": "Misc", "question": "Show that height of the cylinder of greatest volume which can be inscribed in a right circular cone of height h and semi vertical angle α is one-third that of the cone and the greatest volume of cylinder is 4πh³tan²α/27.", "page": 38, "endPage": 38, "title": "NCERT Exercise Misc · Question 15", "conceptIdx": 0, "steps": ["Cone radius R = h·tan α; cylinder radius r and height H satisfy H = h − r·cot α; V = πr²H.", "dV/dr = 0 gives r = (2/3)h·tan α, so H = h/3 (maximum); V_max = 4πh³tan²α/27."], "answer": "H = h/3; V_max = 4πh³tan²α/27"}, {"number": "Misc.16", "exercise": "Misc", "question": "A cylindrical tank of radius 10 m is being filled with wheat at the rate of 314 cubic metre per hour. Then the depth of the wheat is increasing at the rate of (A) 1 m/h (B) 0.1 m/h (C) 1.1 m/h (D) 0.5 m/h", "page": 39, "endPage": 39, "title": "NCERT Exercise Misc · Question 16", "conceptIdx": 0, "steps": ["V = π(10)²h = 100πh, so dV/dt = 100π(dh/dt).", "314 = 100π(dh/dt) gives dh/dt = 3.14/π = 1 (taking π = 3.14), option (A)."], "answer": "(A) 1 m/h"}], "exerciseMap": [{"number": "6.1.1", "exercise": "6.1", "question": "Find the rate of change of the area of a circle with respect to its radius r when (a) r = 3 cm (b) r = 4 cm", "page": 4, "endPage": 4, "title": "NCERT Exercise 6.1 · Question 1", "conceptIdx": 0, "steps": ["A = πr², so dA/dr = 2πr.", "(a) At r = 3, dA/dr = 6π; (b) at r = 4, dA/dr = 8π."], "answer": "(a) 6π cm²/cm (b) 8π cm²/cm"}, {"number": "6.1.2", "exercise": "6.1", "question": "The volume of a cube is increasing at the rate of 8 cm³/s. How fast is the surface area increasing when the length of an edge is 12 cm?", "page": 4, "endPage": 4, "title": "NCERT Exercise 6.1 · Question 2", "conceptIdx": 0, "steps": ["V = x³ gives dV/dt = 3x²(dx/dt), so dx/dt = 8/(3x²).", "S = 6x² gives dS/dt = 12x(dx/dt) = 32/x.", "At x = 12, dS/dt = 32/12 = 8/3."], "answer": "8/3 cm²/s"}, {"number": "6.1.3", "exercise": "6.1", "question": "The radius of a circle is increasing uniformly at the rate of 3 cm/s. Find the rate at which the area of the circle is increasing when the radius is 10 cm.", "page": 4, "endPage": 4, "title": "NCERT Exercise 6.1 · Question 3", "conceptIdx": 0, "steps": ["A = πr², so dA/dt = 2πr(dr/dt).", "With dr/dt = 3 and r = 10: dA/dt = 2π(10)(3) = 60π."], "answer": "60π cm²/s"}, {"number": "6.1.4", "exercise": "6.1", "question": "An edge of a variable cube is increasing at the rate of 3 cm/s. How fast is the volume of the cube increasing when the edge is 10 cm long?", "page": 4, "endPage": 4, "title": "NCERT Exercise 6.1 · Question 4", "conceptIdx": 0, "steps": ["V = x³, so dV/dt = 3x²(dx/dt).", "With dx/dt = 3 and x = 10: dV/dt = 3(100)(3) = 900."], "answer": "900 cm³/s"}, {"number": "6.1.5", "exercise": "6.1", "question": "A stone is dropped into a quiet lake and waves move in circles at the speed of 5 cm/s. At the instant when the radius of the circular wave is 8 cm, how fast is the enclosed area increasing?", "page": 4, "endPage": 4, "title": "NCERT Exercise 6.1 · Question 5", "conceptIdx": 0, "steps": ["A = πr², so dA/dt = 2πr(dr/dt).", "With dr/dt = 5 and r = 8: dA/dt = 2π(8)(5) = 80π."], "answer": "80π cm²/s"}, {"number": "6.1.6", "exercise": "6.1", "question": "The radius of a circle is increasing at the rate of 0.7 cm/s. What is the rate of increase of its circumference?", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 6", "conceptIdx": 0, "steps": ["C = 2πr, so dC/dt = 2π(dr/dt).", "With dr/dt = 0.7: dC/dt = 1.4π = 4.4 cm/s."], "answer": "4.4 cm/s"}, {"number": "6.1.7", "exercise": "6.1", "question": "The length x of a rectangle is decreasing at the rate of 5 cm/minute and the width y is increasing at the rate of 4 cm/minute. When x = 8 cm and y = 6 cm, find the rates of change of (a) the perimeter, and (b) the area of the rectangle.", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 7", "conceptIdx": 0, "steps": ["P = 2(x + y), so dP/dt = 2(dx/dt + dy/dt) = 2(−5 + 4) = −2.", "A = xy, so dA/dt = x(dy/dt) + y(dx/dt) = 8(4) + 6(−5) = 2."], "answer": "(a) Perimeter decreasing at 2 cm/min (b) Area increasing at 2 cm²/min"}, {"number": "6.1.8", "exercise": "6.1", "question": "A balloon, which always remains spherical on inflation, is being inflated by pumping in 900 cubic centimetres of gas per second. Find the rate at which the radius of the balloon increases when the radius is 15 cm.", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 8", "conceptIdx": 0, "steps": ["V = (4/3)πr³, so dV/dt = 4πr²(dr/dt).", "dr/dt = 900/(4πr²) = 225/(πr²).", "At r = 15: dr/dt = 225/(225π) = 1/π."], "answer": "1/π cm/s"}, {"number": "6.1.9", "exercise": "6.1", "question": "A balloon, which always remains spherical has a variable radius. Find the rate at which its volume is increasing with the radius when the later is 10 cm.", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 9", "conceptIdx": 0, "steps": ["V = (4/3)πr³, so dV/dr = 4πr².", "At r = 10: dV/dr = 400π."], "answer": "400π cm³/cm"}, {"number": "6.1.10", "exercise": "6.1", "question": "A ladder 5 m long is leaning against a wall. The bottom of the ladder is pulled along the ground, away from the wall, at the rate of 2 cm/s. How fast is its height on the wall decreasing when the foot of the ladder is 4 m away from the wall?", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 10", "conceptIdx": 0, "steps": ["x² + y² = 25, so x(dx/dt) + y(dy/dt) = 0.", "At x = 4, y = 3, with dx/dt = 2: dy/dt = −(4/3)(2) = −8/3."], "answer": "Height decreasing at 8/3 cm/s"}, {"number": "6.1.11", "exercise": "6.1", "question": "A particle moves along the curve 6y = x³ + 2. Find the points on the curve at which the y-coordinate is changing 8 times as fast as the x-coordinate.", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 11", "conceptIdx": 0, "steps": ["6(dy/dt) = 3x²(dx/dt), so dy/dt = (x²/2)(dx/dt).", "dy/dt = 8(dx/dt) gives x²/2 = 8, so x = ±4.", "x = 4 gives y = 11; x = −4 gives y = −31/3."], "answer": "(4, 11) and (−4, −31/3)"}, {"number": "6.1.12", "exercise": "6.1", "question": "The radius of an air bubble is increasing at the rate of 1/2 cm/s. At what rate is the volume of the bubble increasing when the radius is 1 cm? A balloon, which always remains spherical, has a variable diameter (3/2)(2x + 1). Find the rate of change of its volume with respect to x.", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 12", "conceptIdx": 0, "steps": ["Bubble: dV/dt = 4πr²(dr/dt) = 4π(1)(1/2) = 2π at r = 1.", "Balloon: r = (3/4)(2x + 1), so dV/dx = 4πr²(3/2) = 6πr².", "dV/dx = 6π·(9/16)(2x + 1)² = (27π/8)(2x + 1)²."], "answer": "Bubble volume increasing at 2π cm³/s; balloon dV/dx = (27π/8)(2x + 1)²"}, {"number": "6.1.14", "exercise": "6.1", "question": "Sand is pouring from a pipe at the rate of 12 cm³/s. The falling sand forms a cone on the ground in such a way that the height of the cone is always one-sixth of the radius of the base. How fast is the height of the sand cone increasing when the height is 4 cm?", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 14", "conceptIdx": 0, "steps": ["h = r/6 gives r = 6h, so V = (1/3)πr²h = 12πh³.", "dV/dt = 36πh²(dh/dt) = 12, so dh/dt = 1/(3πh²).", "At h = 4: dh/dt = 1/(48π)."], "answer": "1/(48π) cm/s"}, {"number": "6.1.15", "exercise": "6.1", "question": "The total cost C (x) in Rupees associated with the production of x units of an item is given by C (x) = 0.007x³ − 0.003x² + 15x + 4000. Find the marginal cost when 17 units are produced.", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 15", "conceptIdx": 0, "steps": ["MC = C′(x) = 0.021x² − 0.006x + 15.", "At x = 17: 0.021(289) − 0.006(17) + 15 = 6.069 − 0.102 + 15 = 20.967."], "answer": "Rs 20.97 (20.967)"}, {"number": "6.1.16", "exercise": "6.1", "question": "The total revenue in Rupees received from the sale of x units of a product is given by R(x) = 13x² + 26x + 15. Find the marginal revenue when x = 7.", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 16", "conceptIdx": 0, "steps": ["MR = R′(x) = 26x + 26.", "At x = 7: MR = 182 + 26 = 208."], "answer": "Rs 208"}, {"number": "6.1.17", "exercise": "6.1", "question": "The rate of change of the area of a circle with respect to its radius r at r = 6 cm is (A) 10π (B) 12π (C) 8π (D) 11π", "page": 5, "endPage": 5, "title": "NCERT Exercise 6.1 · Question 17", "conceptIdx": 0, "steps": ["dA/dr = 2πr.", "At r = 6: dA/dr = 12π, which is option (B)."], "answer": "(B) 12π"}, {"number": "6.1.18", "exercise": "6.1", "question": "The total revenue in Rupees received from the sale of x units of a product is given by R(x) = 3x² + 36x + 5. The marginal revenue, when x = 15 is (A) 116 (B) 96 (C) 90 (D) 126", "page": 6, "endPage": 6, "title": "NCERT Exercise 6.1 · Question 18", "conceptIdx": 0, "steps": ["MR = R′(x) = 6x + 36.", "At x = 15: MR = 90 + 36 = 126, which is option (D)."], "answer": "(D) 126"}, {"number": "6.2.1", "exercise": "6.2", "question": "Show that the function given by f(x) = 3x + 17 is increasing on R.", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 1", "conceptIdx": 1, "steps": ["f′(x) = 3 > 0 for all x ∈ R.", "A positive derivative on R implies f is strictly increasing on R."], "answer": "f is increasing on R"}, {"number": "6.2.2", "exercise": "6.2", "question": "Show that the function given by f(x) = e²ˣ is increasing on R.", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 2", "conceptIdx": 1, "steps": ["f′(x) = 2e²ˣ > 0 for all x ∈ R (exponential is always positive).", "Hence f is strictly increasing on R."], "answer": "f is increasing on R"}, {"number": "6.2.3", "exercise": "6.2", "question": "Show that the function given by f(x) = sin x is (a) increasing in (0, π/2) (b) decreasing in (π/2, π) (c) neither increasing nor decreasing in (0, π)", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 3", "conceptIdx": 1, "steps": ["f′(x) = cos x.", "(a) cos x > 0 on (0, π/2), so f increases; (b) cos x < 0 on (π/2, π), so f decreases.", "(c) Since it increases on part and decreases on part of (0, π), it is neither on the whole interval."], "answer": "(a) Increasing (b) Decreasing (c) Neither"}, {"number": "6.2.4", "exercise": "6.2", "question": "Find the intervals in which the function f given by f(x) = 2x² − 3x is (a) increasing (b) decreasing", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 4", "conceptIdx": 1, "steps": ["f′(x) = 4x − 3, zero at x = 3/4.", "f′ > 0 for x > 3/4 and f′ < 0 for x < 3/4."], "answer": "(a) Increasing on [3/4, ∞) (b) Decreasing on (−∞, 3/4]"}, {"number": "6.2.5", "exercise": "6.2", "question": "Find the intervals in which the function f given by f(x) = 2x³ − 3x² − 36x + 7 is (a) increasing (b) decreasing", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 5", "conceptIdx": 1, "steps": ["f′(x) = 6x² − 6x − 36 = 6(x − 3)(x + 2), zeros at x = −2, 3.", "(x − 3)(x + 2) > 0 outside the roots and < 0 between them."], "answer": "(a) Increasing on (−∞, −2] and [3, ∞) (b) Decreasing on [−2, 3]"}, {"number": "6.2.6", "exercise": "6.2", "question": "Find the intervals in which the following functions are strictly increasing or decreasing: (a) x² + 2x − 5 (b) 10 − 6x − 2x² (c) −2x³ − 9x² − 12x + 1 (d) 6 − 9x − x² (e) (x + 1)³(x − 3)³", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 6", "conceptIdx": 1, "steps": ["Derivatives: (a) 2(x+1); (b) −6−4x, zero −3/2; (c) −6(x+1)(x+2), zeros −2,−1; (d) −9−2x, zero −9/2; (e) 6(x−1)(x+1)²(x−3)², sign of (x−1).", "Increasing where derivative > 0: (a) x>−1 (b) x<−3/2 (c) −2<x<−1 (d) x<−9/2 (e) x>1; decreasing on the complementary intervals."], "answer": "(a) Inc (−1,∞), dec (−∞,−1); (b) Inc (−∞,−3/2), dec (−3/2,∞); (c) Inc (−2,−1), dec elsewhere; (d) Inc (−∞,−9/2), dec (−9/2,∞); (e) Inc (1,∞), dec (−∞,1)"}, {"number": "6.2.7", "exercise": "6.2", "question": "Show that x > −1, f is an increasing function of x, where f(x) = log(1 + x) − 2x/(2 + x), throughout its domain.", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 7", "conceptIdx": 1, "steps": ["dy/dx = 1/(1+x) − 4/(2+x)² = x²/[(1+x)(2+x)²].", "For x > −1 the denominator is positive and the numerator x² ≥ 0 (zero only at x = 0).", "Hence dy/dx > 0 except at an isolated point, so y is increasing on (−1, ∞)."], "answer": "Increasing throughout its domain"}, {"number": "6.2.8", "exercise": "6.2", "question": "Find the values of x for which y = [x(x − 2)]² is an increasing function.", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 8", "conceptIdx": 1, "steps": ["y = (x² − 2x)², so dy/dx = 4x(x − 2)(x − 1).", "Critical points 0, 1, 2; sign chart gives dy/dx > 0 on (0, 1) and (2, ∞)."], "answer": "Increasing on (0, 1) and (2, ∞)"}, {"number": "6.2.9", "exercise": "6.2", "question": "Prove that y = 4sin θ/(2 + cos θ) − θ is an increasing function of θ in [0, π/2].", "page": 12, "endPage": 12, "title": "NCERT Exercise 6.2 · Question 9", "conceptIdx": 1, "steps": ["dy/dθ = [8cos θ + 4]/(2 + cos θ)² − 1 = cos θ(4 − cos θ)/(2 + cos θ)².", "On [0, π/2], cos θ ≥ 0 and 4 − cos θ > 0, so dy/dθ ≥ 0."], "answer": "Increasing on [0, π/2]"}, {"number": "6.2.10", "exercise": "6.2", "question": "Prove that the logarithmic function is increasing on (0, ∞).", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 10", "conceptIdx": 1, "steps": ["f(x) = log x gives f′(x) = 1/x.", "1/x > 0 for all x > 0, so f is increasing on (0, ∞)."], "answer": "Increasing on (0, ∞)"}, {"number": "6.2.11", "exercise": "6.2", "question": "Prove that the function f given by f(x) = x² − x + 1 is neither strictly increasing nor decreasing on (−1, 1).", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 11", "conceptIdx": 1, "steps": ["f′(x) = 2x − 1, zero at x = 1/2.", "f′ < 0 on (−1, 1/2) and f′ > 0 on (1/2, 1), so f decreases then increases."], "answer": "Neither strictly increasing nor decreasing on (−1, 1)"}, {"number": "6.2.12", "exercise": "6.2", "question": "Which of the following functions are decreasing on (0, π/2)? (A) cos x (B) cos 2x (C) cos 3x (D) tan x", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 12", "conceptIdx": 1, "steps": ["(A) −sin x < 0 and (B) −2sin 2x < 0 throughout (0, π/2), so both decrease.", "(C) −3sin 3x changes sign (3x ranges to 3π/2); (D) sec²x > 0, so tan x increases."], "answer": "(A) cos x and (B) cos 2x"}, {"number": "6.2.13", "exercise": "6.2", "question": "On which of the following intervals is the function f given by f(x) = x¹⁰⁰ + sin x − 1 decreasing? (A) (0, 1) (B) (π/2, π) (C) (0, π/2) (D) None of these", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 13", "conceptIdx": 1, "steps": ["f′(x) = 100x⁹⁹ + cos x.", "On each of (A), (B), (C) the term 100x⁹⁹ dominates or both terms are non-negative, so f′ > 0 throughout."], "answer": "(D) None of these"}, {"number": "6.2.14", "exercise": "6.2", "question": "For what values of a the function f given by f(x) = x² + ax + 1 is increasing on [1, 2]?", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 14", "conceptIdx": 1, "steps": ["f′(x) = 2x + a must be ≥ 0 for all x ∈ [1, 2].", "2x + a is smallest at x = 1, giving 2 + a ≥ 0, i.e. a ≥ −2."], "answer": "a ≥ −2"}, {"number": "6.2.15", "exercise": "6.2", "question": "Let I be any interval disjoint from [−1, 1]. Prove that the function f given by f(x) = x + 1/x is increasing on I.", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 15", "conceptIdx": 1, "steps": ["f′(x) = 1 − 1/x² = (x² − 1)/x².", "If I is disjoint from [−1, 1] then |x| > 1 on I, so f′ > 0 throughout I."], "answer": "f is increasing on I"}, {"number": "6.2.16", "exercise": "6.2", "question": "Prove that the function f given by f(x) = log sin x is increasing on (0, π/2) and decreasing on (π/2, π).", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 16", "conceptIdx": 1, "steps": ["f′(x) = cos x/sin x = cot x (domain excludes multiples of π).", "cot x > 0 on (0, π/2) and cot x < 0 on (π/2, π)."], "answer": "Increasing on (0, π/2); decreasing on (π/2, π)"}, {"number": "6.2.17", "exercise": "6.2", "question": "Prove that the function f given by f(x) = log|cos x| is decreasing on (0, π/2) and increasing on (3π/2, 2π).", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 17", "conceptIdx": 1, "steps": ["f′(x) = −tan x (where cos x ≠ 0).", "tan x > 0 on (0, π/2) so f′ < 0; tan x < 0 on (3π/2, 2π) so f′ > 0."], "answer": "Decreasing on (0, π/2); increasing on (3π/2, 2π)"}, {"number": "6.2.18", "exercise": "6.2", "question": "Prove that the function given by f(x) = x³ − 3x² + 3x − 100 is increasing in R.", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 18", "conceptIdx": 1, "steps": ["f′(x) = 3x² − 6x + 3 = 3(x − 1)² ≥ 0, zero only at the isolated point x = 1.", "Hence f is strictly increasing on R."], "answer": "Increasing in R"}, {"number": "6.2.19", "exercise": "6.2", "question": "The interval in which y = x²e⁻ˣ is increasing is (A) (−∞, ∞) (B) (−2, 0) (C) (2, ∞) (D) (0, 2)", "page": 13, "endPage": 13, "title": "NCERT Exercise 6.2 · Question 19", "conceptIdx": 1, "steps": ["dy/dx = 2xe⁻ˣ − x²e⁻ˣ = x(2 − x)e⁻ˣ.", "This is positive exactly when 0 < x < 2, i.e. option (D)."], "answer": "(D) (0, 2)"}, {"number": "6.3.1", "exercise": "6.3", "question": "Find the maximum and minimum values, if any, of the following functions given by (i) f(x) = (2x − 1)² + 3 (ii) f(x) = 9x² + 12x + 2 (iii) f(x) = −(x − 1)² + 10 (iv) g(x) = x³ + 1", "page": 28, "endPage": 28, "title": "NCERT Exercise 6.3 · Question 1", "conceptIdx": 2, "steps": ["(i) (2x−1)² ≥ 0: minimum 3 at x = 1/2, no maximum.", "(ii) 9x²+12x+2 = (3x+2)² − 2: minimum −2 at x = −2/3, no maximum; (iii) −(x−1)²+10 ≤ 10: maximum 10 at x = 1, no minimum.", "(iv) x³+1 is unbounded both ways: no maximum or minimum."], "answer": "(i) Min 3 at x=1/2 (ii) Min −2 at x=−2/3 (iii) Max 10 at x=1 (iv) None"}, {"number": "6.3.2", "exercise": "6.3", "question": "Find the maximum and minimum values, if any, of the following functions given by (i) f(x) = |x + 2| − 1 (ii) g(x) = −|x + 1| + 3 (iii) h(x) = sin(2x) + 5 (iv) f(x) = |sin 4x + 3| (v) h(x) = x + 1, x ∈ (−1, 1)", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 2", "conceptIdx": 2, "steps": ["(i) |x+2| ≥ 0: minimum −1 at x = −2, no maximum; (ii) −|x+1| ≤ 0: maximum 3 at x = −1, no minimum.", "(iii) sin 2x ∈ [−1,1]: minimum 4, maximum 6; (iv) sin 4x+3 ∈ [2,4]: minimum 2, maximum 4.", "(v) x+1 ∈ (0,2) on the open interval: neither maximum nor minimum."], "answer": "(i) Min −1 (ii) Max 3 (iii) Min 4, Max 6 (iv) Min 2, Max 4 (v) None"}, {"number": "6.3.3", "exercise": "6.3", "question": "Find the local maxima and local minima, if any, of the following functions. Find also the local maximum and the local minimum values, as the case may be: (i) f(x) = x² (ii) g(x) = x³ − 3x (iii) h(x) = sin x + cos x, 0 < x < π/2 (iv) f(x) = sin x − cos x, 0 < x < π (v) f(x) = x³ − 6x² + 9x + 15 (vi) g(x) = x/2 + 2/x, x > 0 (vii) g(x) = 1/(x² + 2) (viii) f(x) = x√(1 − x), 0 < x < 1", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 3", "conceptIdx": 2, "steps": ["Critical points: (i) x=0; (ii) x=±1; (iii) x=π/4; (iv) x=3π/4; (v) x=1,3; (vi) x=2; (vii) x=0; (viii) x=2/3.", "Second-derivative/first-derivative tests classify each: maxima at (ii) x=−1, (iii) π/4, (iv) 3π/4, (v) x=1, (vii) x=0, (viii) x=2/3; minima at (i) x=0, (ii) x=1, (v) x=3, (vi) x=2."], "answer": "(i) Min 0 at 0; (ii) Max 2 at −1, Min −2 at 1; (iii) Max √2 at π/4; (iv) Max √2 at 3π/4; (v) Max 19 at 1, Min 15 at 3; (vi) Min 2 at 2; (vii) Max 1/2 at 0; (viii) Max 2/(3√3) at 2/3"}, {"number": "6.3.4", "exercise": "6.3", "question": "Prove that the following functions do not have maxima or minima: (i) f(x) = eˣ (ii) g(x) = log x (iii) h(x) = x³ + x² + x + 1", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 4", "conceptIdx": 2, "steps": ["(i) f′ = eˣ ≠ 0; (ii) g′ = 1/x ≠ 0: no critical points.", "(iii) h′ = 3x² + 2x + 1 has discriminant 4 − 12 < 0, so no real critical points."], "answer": "No critical points, hence no maxima or minima in each case"}, {"number": "6.3.5", "exercise": "6.3", "question": "Find the absolute maximum value and the absolute minimum value of the following functions in the given intervals: (i) f(x) = x³, x ∈ [−2, 2] (ii) f(x) = sin x + cos x, x ∈ [0, π] (iii) f(x) = 4x − x²/2, x ∈ [−2, 9/2] (iv) f(x) = (x − 1)² + 3, x ∈ [−3, 1]", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 5", "conceptIdx": 2, "steps": ["(i) Monotonic: f(−2) = −8, f(2) = 8. (ii) Critical x = π/4: values 1, √2, −1 at 0, π/4, π.", "(iii) Critical x = 4: values −10, 8, 63/8 at −2, 4, 9/2. (iv) Critical x = 1: values 19, 3 at −3, 1."], "answer": "(i) Max 8, Min −8 (ii) Max √2, Min −1 (iii) Max 8, Min −10 (iv) Max 19, Min 3"}, {"number": "6.3.6", "exercise": "6.3", "question": "Find the maximum profit that a company can make, if the profit function is given by p(x) = 41 − 72x − 18x²", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 6", "conceptIdx": 2, "steps": ["p′(x) = −72 − 36x = 0 gives x = −2; p′′(x) = −36 < 0.", "p(−2) = 41 + 144 − 72 = 113."], "answer": "113"}, {"number": "6.3.7", "exercise": "6.3", "question": "Find both the maximum value and the minimum value of 3x⁴ − 8x³ + 12x² − 48x + 25 on the interval [0, 3].", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 7", "conceptIdx": 2, "steps": ["f′(x) = 12x³ − 24x² + 24x − 48 = 12(x − 2)(x² + 2); only critical point x = 2.", "f(0) = 25, f(2) = −39, f(3) = 16."], "answer": "Maximum 25 at x = 0; minimum −39 at x = 2"}, {"number": "6.3.8", "exercise": "6.3", "question": "At what points in the interval [0, 2π], does the function sin 2x attain its maximum value?", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 8", "conceptIdx": 2, "steps": ["sin 2x = 1 when 2x = π/2 or 5π/2 within [0, 4π].", "Hence x = π/4 or 5π/4."], "answer": "x = π/4 and x = 5π/4 (maximum value 1)"}, {"number": "6.3.9", "exercise": "6.3", "question": "What is the maximum value of the function sin x + cos x?", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 9", "conceptIdx": 2, "steps": ["f(x) = sin x + cos x = √2 sin(x + π/4).", "Sine attains 1, so the maximum is √2 (at x = π/4)."], "answer": "√2"}, {"number": "6.3.10", "exercise": "6.3", "question": "Find the maximum value of 2x³ − 24x + 107 in the interval [1, 3]. Find the maximum value of the same function in [−3, −1].", "page": 29, "endPage": 29, "title": "NCERT Exercise 6.3 · Question 10", "conceptIdx": 2, "steps": ["f′(x) = 6x² − 24 = 6(x − 2)(x + 2); critical points ±2.", "On [1, 3]: f(1) = 85, f(2) = 75, f(3) = 89. On [−3, −1]: f(−3) = 107, f(−2) = 139, f(−1) = 129."], "answer": "Max 89 on [1, 3]; max 139 on [−3, −1]"}, {"number": "6.3.11", "exercise": "6.3", "question": "It is given that at x = 1, the function x⁴ − 62x² + ax + 9 attains its maximum value, on the interval [0, 2]. Find the value of a.", "page": 30, "endPage": 30, "title": "NCERT Exercise 6.3 · Question 11", "conceptIdx": 2, "steps": ["f′(x) = 4x³ − 124x + a; maximum at interior x = 1 gives f′(1) = 0.", "4 − 124 + a = 0, so a = 12
