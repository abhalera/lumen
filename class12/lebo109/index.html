<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 9: Biotechnology: Principles and Processes — Interactive Textbook</title>
<style>
:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  text-align: left;
  background: #0f172a;
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
}
.play-btn {
  flex: none;
  width: 34px;
  height: 34px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 14px;
}
.video-title {
  font-size: 13px;
  line-height: 1.4;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.q-badge {
  background: var(--soft);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 3px 10px;
  border-radius: 6px;
}
.q-concept-link {
  color: var(--blue);
  text-decoration: none;
  font-size: 13px;

<script>
window.CHAPTER = {"code": "lebo109", "chapterNumber": 9, "book_name": "Biology", "title": "Biotechnology: Principles and Processes", "subtitle": "Genetic engineering and bioprocess engineering, restriction enzymes and pBR322, isolation and gel electrophoresis, PCR and host insertion, bioreactors and downstream processing.", "edition": "Reprint 2026-27", "source": "https://ncert.nic.in/textbook/pdf/lebo109.pdf", "page_start": 1, "page_end": 16, "extraction": "PyMuPDF text layer + section/exercise page maps in /tmp/opencode/bio_maps.json. pdftotext not used.", "lessons": [{"id": "principles-first-rdna", "nav": "Principles & first rDNA", "title": "Two core techniques — and the 1972 Boyer–Cohen plasmid", "deck": "Genetic engineering plus bioprocess engineering. Alien DNA survives only with an origin of replication; Cohen and Boyer linked an antibiotic-resistance gene to a Salmonella plasmid in 1972 and cloned it in E. coli.", "minutes": 9, "section": "9.1", "pages": [3, 5], "print": "3–5", "sim": "rdna", "simTitle": "1972 experiment stepper: link the resistance gene to the plasmid", "quick": ["The EFB defines biotechnology as <strong>‘the integration of natural science and organisms, cells, parts thereof, and molecular analogues for products and services’</strong> — covering both traditional microbe processes (curd, bread, wine) and modern molecular work (test-tube babies, DNA vaccines, gene correction). Modern biotechnology rests on two cores: <strong>(i) genetic engineering</strong> — altering DNA/RNA chemistry and introducing it into hosts to change phenotype; <strong>(ii) bioprocess engineering</strong> — sterile, contamination-free scale-up of the desired microbe or eukaryotic cell for antibiotics, vaccines and enzymes.", "Sexual reproduction gives variation but traditional hybridisation drags <strong>undesirable genes along with desired ones</strong>. Genetic engineering — recombinant DNA, gene cloning, gene transfer — isolates and introduces <strong>only one or a set of desirable genes</strong>. The three basic steps are: <strong>(i) identification of DNA with desirable genes; (ii) introduction into the host; (iii) maintenance in the host and transfer to progeny</strong>.", "An alien DNA piece on its own cannot multiply in progeny cells — it must integrate into the genome and hitch a ride on a chromosome's <strong>origin of replication (ori)</strong>, the sequence that initiates replication. Linking alien DNA to ori so it replicates with the host is <strong>cloning</strong>: making multiple identical copies of template DNA.", "The first artificial recombinant DNA (1972): <strong>Stanley Cohen and Herbert Boyer</strong> cut the antibiotic-resistance gene out of a plasmid of <strong>Salmonella typhimurium</strong> with restriction enzymes (‘molecular scissors’), joined it to plasmid DNA with <strong>DNA ligase</strong>, and transferred the new circular DNA into <strong>Escherichia coli</strong>, where host DNA polymerase made multiple copies — the cloning of antibiotic resistance in E. coli."], "formulas": [{"label": "Three steps of genetic modification", "html": "identify desirable DNA → introduce into host → maintain + inherit in progeny", "cond": "Section 9.1"}, {"label": "ori rule", "html": "alien DNA + ori → replicates with host chromosome (cloning); without ori → lost", "cond": "Section 9.1"}, {"label": "1972 construction", "html": "resistance gene + Salmonella plasmid —ligase→ rDNA —E. coli→ clones", "cond": "Cohen & Boyer, 1972"}], "deeper": "The Boyer profile (pdf p. 2) supplies the backstory: by 1969 Boyer studied E. coli restriction enzymes that cut DNA leaving ‘sticky ends’, then compared notes in Hawaii with Stanford's Stanley Cohen, who could remove plasmids — small independently-replicating DNA ringlets — and reinsert them into other cells. Splicing plus plasmid delivery equals recombinant DNA: the founding breakthrough of biotechnology.", "worked": "Fate-of-alien-DNA chain: naked fragment enters alien cell → no ori, no replication → lost in progeny; linked to plasmid ori via ligase → replicates with host DNA polymerase → inherited by every daughter cell → a clone of the resistance gene. That is exactly what Cohen and Boyer demonstrated in E. coli in 1972.", "prediction": {"prompt": "A resistance gene is shot into E. coli as a bare linear fragment with no ori and no vector. What is its likely fate?", "options": ["It is lost — without an origin of replication it cannot multiply in progeny cells", "It automatically replicates because all DNA replicates in bacteria", "It converts the cell into Salmonella typhimurium"], "answer": 0, "explanation": "Section 9.1: only DNA linked to an origin of replication (directly or via a vector) multiplies with the host; a bare fragment cannot."}, "connect": [["Curd, idli and wine are biotechnology too", "The chapter's restricted modern sense (GM organisms at scale) sits inside the EFB's wider definition — so Indian kitchens fermenting curd, idli batter and toddy already run traditional biotechnology daily.", [], {"id": "S-SIdczw-hc", "title": "Biotechnology Principles and Processes Class 12 Biology | NCERT Chapter 11 | 2026-27 CBSE NEET", "channel": "LearnoHub - Class 11, 12"}], ["Wow — one gene plus one plasmid founded an industry", "The entire discipline dates to a single 1972 construction: one antibiotic-resistance gene stitched into one Salmonella plasmid with ligase, then copied by E. coli — sticky ends from Boyer's enzymes made the pasting precise."]], "recall": "Name the two core techniques and the three basic steps of genetically modifying an organism; state the ori rule and the year, workers and organisms of the first rDNA.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The two core techniques that enabled modern biotechnology are", "options": ["Genetic engineering and bioprocess engineering", "Pasteurisation and distillation", "Hybridisation and natural selection"], "answer": 0, "hint": "Section 9.1 lists them as (i) and (ii).", "solution": "Genetic engineering (alter DNA, change phenotype) plus bioprocess engineering (sterile scale-up for antibiotics, vaccines, enzymes).", "wrong": ["Food-processing steps, not the two cores.", "Breeding methods the text contrasts with genetic engineering."]}, {"level": "Medium", "type": "mcq", "prompt": "Alien DNA multiplies in a host only if", "options": ["It is linked to an origin of replication", "It is injected in large quantity", "It comes from a related species"], "answer": 0, "hint": "What initiates replication on a chromosome?", "solution": "The ori sequence initiates replication; alien DNA must join it (directly or via a vector) to be cloned.", "wrong": ["Quantity cannot substitute for replication ability.", "Relatedness is irrelevant without ori linkage."]}, {"level": "Hard", "type": "number", "map": "Section 9.1", "prompt": "Years between the isolation of growth-restricting enzymes (1963) and the first rDNA (1972)", "answer": 9, "unit": "years", "tolerance": 0.1, "hint": "1972 minus 1963.", "solution": "Restriction enzymes isolated 1963 (Section 9.2.1); Cohen–Boyer rDNA 1972; gap = 9 years."}], "resources": [{"title": "NCERT §9.1 — Principles & first rDNA (official PDF, PDF p.3)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo109.pdf#page=3"}]}, {"id": "restriction-enzymes", "nav": "Restriction enzymes", "title": "Molecular scissors: EcoRI, palindromes and sticky ends", "deck": "Hind II cut at a 6-bp recognition sequence; 900+ enzymes from 230+ bacterial strains now known. EcoRI reads 5′-GAATTC-3′ the same on both strands and leaves sticky ends that ligase pastes.", "minutes": 9, "section": "9.2.1", "pages": [5, 8], "print": "5–8", "sim": "restriction", "simTitle": "Palindrome finder + EcoRI cutter: cut sites to fragments", "quick": ["In <strong>1963</strong> two enzymes restricting bacteriophage growth in E. coli were isolated — one methylating DNA, one cutting it (<strong>restriction endonuclease</strong>). The first sequence-specific cutter, <strong>Hind II</strong>, always cut at a particular <strong>6-base-pair recognition sequence</strong>. Today <strong>more than 900 restriction enzymes from over 230 bacterial strains</strong> are known, each with its own recognition sequence.", "Naming follows genus + species + strain + order: <strong>EcoRI</strong> comes from <strong>Escherichia coli RY 13</strong> (R = strain, I = first enzyme). Restriction enzymes are <strong>endonucleases</strong> (cut within DNA); <strong>exonucleases</strong> instead trim nucleotides from the ends. Each endonuclease inspects DNA length, binds its recognition site and cuts both sugar-phosphate backbones (Figure 9.1).", "Every restriction endonuclease recognises a <strong>palindromic</strong> sequence — like ‘MALAYALAM’, it reads the same on the two strands when the 5′ → 3′ orientation is kept: <strong>5′-GAATTC-3′ / 3′-CTTAAG-5′</strong>. Cuts fall a little away from the centre, between the same two bases on opposite strands, leaving single-stranded overhangs — <strong>sticky ends</strong> — that hydrogen-bond to complementary cut counterparts and invite DNA ligase.", "Cut by the <strong>same</strong> enzyme, vector and source DNA carry matching sticky ends and ligase joins them end-to-end (Figure 9.2). Cut with different enzymes, they cannot pair — so a recombinant vector is normally created only when <strong>vector and source DNA meet the same restriction enzyme</strong>."], "formulas": [{"label": "EcoRI site", "html": "5′-G|AATTC-3′ / 3′-CTTAA|G-5′ — sticky ends", "cond": "Figure 9.1; palindrome GAATTC"}, {"label": "Palindrome rule", "html": "sequence reads identically 5′ → 3′ on both strands (e.g. MALAYALAM)", "cond": "Section 9.2.1"}, {"label": "Fragment count", "html": "linear DNA cut at n sites → n + 1 fragments; circular DNA cut at n sites → n fragments", "cond": "Worked counting rule"}], "deeper": "Hind II's 6-bp recognition sequence is the prototype: find the exact word, cut at the exact point, every time. EcoRI's name is itself an exam favourite — E (genus Escherichia) + co (species coli) + R (strain RY 13) + I (first isolated). Note the division of labour the text stresses: methylase protects the host genome, endonuclease destroys the invader — bacteria invented genetic engineering as self-defence.", "worked": "EcoRI fragment math: a linear 10 kb DNA with 2 EcoRI sites (say at 3 kb and 7 kb) gives 3 fragments — 3 kb, 4 kb, 3 kb (2 + 1 = 3; lengths sum to 3 + 4 + 3 = 10 kb). A circular plasmid cut once gives 1 linear fragment; cut at 3 sites gives 3 fragments (n sites on a circle → n pieces).", "prediction": {"prompt": "Vector is cut with EcoRI but the human DNA insert is cut with BamHI. Mixed with ligase, will recombinant molecules form efficiently?", "options": ["No — different enzymes leave non-matching ends that cannot pair", "Yes — ligase joins any two DNA ends regardless of sequence", "Yes — but only inside E. coli, not in the tube"], "answer": 0, "explanation": "The text: unless vector and source DNA are cut with the same restriction enzyme, matching sticky ends never form and the recombinant molecule cannot be created."}, "connect": [["EcoRI and BamHI in every Indian biotech lab", "From Bengaluru to Hyderabad, student and industry plasmids are still cut with the same EcoRI/BamHI names printed on the pBR322 map (Figure 9.4) — the 1970s enzymes remain daily tools."], ["Wow — scissors that read before they cut", "Each endonuclease ‘inspects’ the whole DNA length, finds its exact palindrome, and nicks both backbones off-centre — a proofreading pair of scissors that only cuts words it recognises."]], "recall": "Define recognition sequence and palindrome (with the GAATTC example), expand EcoRI, and state the same-enzyme rule plus the linear/circular fragment counts.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "EcoRI is named for", "options": ["Escherichia coli strain RY 13, first enzyme", "An eco-friendly recombinant isolate", "E. coli ribosomes, type I"], "answer": 0, "hint": "Genus + species + strain + order of isolation.", "solution": "E (Escherichia) + co (coli) + R (strain RY 13) + I (first enzyme from that strain).", "wrong": ["The name is taxonomic, not ecological.", "Ribosomes have nothing to do with it."]}, {"level": "Medium", "type": "number", "map": "Section 9.2.1", "prompt": "Fragments when a linear DNA with 2 EcoRI sites is fully digested", "answer": 3, "unit": "fragments", "tolerance": 0.1, "hint": "n cuts in a line make n + 1 pieces.", "solution": "2 sites → 2 + 1 = 3 fragments (e.g. 3 kb + 4 kb + 3 kb from a 10 kb molecule)."}, {"level": "Hard", "type": "number", "map": "Section 9.2.1", "prompt": "Fragments when a circular plasmid with 3 EcoRI sites is fully digested", "answer": 3, "unit": "fragments", "tolerance": 0.1, "hint": "On a circle, n cuts make n pieces.", "solution": "3 cuts on circular DNA → 3 linear fragments (contrast: 3 sites on linear DNA give 4)."}], "resources": [{"title": "NCERT §9.2.1 — Restriction enzymes (official PDF, PDF p.5)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo109.pdf#page=5"}]}, {"id": "vectors-pbr322", "nav": "Vectors & pBR322", "title": "Cloning vectors: ori, markers, pBR322 and Ti plasmids", "deck": "A vector needs ori, a selectable marker and single cloning sites. pBR322 carries ampR/tetR, seven mapped sites and rop; recombinants are picked by insertional inactivation — or blue-white screening. Ti plasmids and retroviruses carry genes into plants and animals.", "minutes": 9, "section": "9.2.2", "pages": [8, 10], "print": "8–10", "sim": "pbr322", "simTitle": "Vector map explorer: ori, ampR, tetR and rop", "quick": ["<strong>Plasmids and bacteriophages replicate inside bacteria independent of chromosomal control</strong>; phages reach very high copy numbers per cell, while plasmids range from 1–2 to 15–100+ copies. Linking alien DNA to such a replicon multiplies it to the vector's copy number — engineered vectors ease both linking and recombinant selection. A vector needs three features: <strong>origin of replication (ori)</strong>, a <strong>selectable marker</strong>, and <strong>cloning sites</strong>.", "<strong>ori</strong> starts replication and controls copy number — clone in a high-copy ori for many copies. A <strong>selectable marker</strong> (e.g. ampicillin, chloramphenicol, tetracycline or kanamycin resistance for E. coli, which is naturally sensitive) identifies transformants: <strong>transformation</strong> is the procedure of introducing DNA into a host bacterium. <strong>Cloning sites</strong> must be few, preferably single, or multiple cuts shatter the vector into complicating fragments.", "Textbook case — <strong>pBR322</strong> (Figure 9.4, 4361 bp): restriction sites <strong>Hind III, EcoR I, BamH I, Sal I, Pvu II, Pst I, Cla I</strong>, <strong>ori</strong>, resistance genes <strong>amp<sup>R</sup> and tet<sup>R</sup></strong>, and <strong>rop</strong> (proteins for plasmid replication). Ligate foreign DNA at the <strong>BamH I site inside tet<sup>R</sup></strong>: recombinants lose tetracycline resistance yet keep amp<sup>R</sup> — replica-plate from ampicillin to tetracycline; colonies growing only on ampicillin are recombinants. The faster alternative is <strong>insertional inactivation of β-galactosidase</strong>: no insert → blue colonies on chromogenic substrate; insert → white recombinant colonies.", "For eukaryotes we borrowed pathogen tricks: <strong>Agrobacterium tumefaciens</strong> delivers <strong>T-DNA</strong> turning plant cells tumoural, and <strong>retroviruses</strong> turn animal cells cancerous. Disarmed <strong>Ti plasmids</strong> (non-pathogenic, still delivering) and <strong>disarmed retroviruses</strong> are now plant and animal cloning vectors."], "formulas": [{"label": "pBR322 map facts", "html": "sites Hind III, EcoR I, BamH I, Sal I, Pvu II, Pst I, Cla I; ori; amp<sup>R</sup> + tet<sup>R</sup>; rop (replication proteins)", "cond": "Figure 9.4"}, {"label": "Insertional-inactivation selection", "html": "BamH I insert in tet<sup>R</sup>: grows on amp, dies on tet ⇒ recombinant", "cond": "Section 9.2.2"}, {"label": "Blue-white rule", "html": "intact β-galactosidase + chromogenic substrate ⇒ blue (non-recombinant); insert ⇒ white (recombinant)", "cond": "Section 9.2.2"}], "deeper": "Work the replica-plating logic slowly: ampicillin master plate keeps every transformant alive; the tetracycline replica kills exactly those whose tetR was split by an insert. Two plates, one comparison, zero sequencing — selection by inactivation. The blue-white shortcut collapses it to one plate: colour itself reports the insert. And note rop's quiet role — it codes the proteins that run plasmid replication, while ori is the address where they start.", "worked": "Screening math: 200 ampicillin-resistant colonies are replica-plated onto tetracycline; 140 grow on both (non-recombinants, intact tetR) and 60 grow only on ampicillin (recombinants, tetR inactivated). Recombinant fraction = 60/200 = 0.30 (30%). With blue-white screening the same answer comes from counting white vs blue colonies on a single plate.", "prediction": {"prompt": "Foreign DNA is ligated at pBR322's BamH I site (inside tetR) and cells are plated directly on tetracycline. Which colonies grow?", "options": ["Only non-recombinants — recombinants lost tetracycline resistance when tetR was split", "Only recombinants — the insert adds tetracycline resistance", "All transformants equally — the insert site does not matter"], "answer": 0, "explanation": "Insertion inactivates tetR, so recombinants die on tetracycline; they survive on ampicillin via intact ampR. Selection needs the ampicillin-then-tetracycline comparison."}, "connect": [["Ti-plasmid logic grows India's Bt-cotton", "Disarmed Agrobacterium delivery (Section 9.2.2) is the principle behind insect-resistant cotton widely grown in India — a pathogen's gene-delivery art turned into a farmer's vector."], ["Wow — white means loaded", "One chromogenic plate replaces two antibiotic plates: an insert silences β-galactosidase and the colony stays white, so the eye itself sequences the plate — colour as a cloning readout."]], "recall": "List the three vector features, the pBR322 map elements, the replica-plating selection logic, the blue-white rule, and the two disarmed eukaryotic vectors.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The origin of replication (ori) in a vector", "options": ["Starts replication and controls copy number of the linked DNA", "Cuts DNA at palindromic sites", "Stains DNA orange under UV"], "answer": 0, "hint": "Feature (i) of cloning vectors.", "solution": "ori is where replication starts; a high-copy ori recovers many copies of the target DNA.", "wrong": ["Cutting is the restriction enzyme's job.", "Orange staining is ethidium bromide's job."]}, {"level": "Medium", "type": "mcq", "prompt": "After ligation at pBR322's BamH I site, a recombinant colony", "options": ["Grows on ampicillin but not on tetracycline", "Grows on tetracycline but not on ampicillin", "Grows on neither antibiotic"], "answer": 0, "hint": "Which resistance gene did the insert split?", "solution": "The insert inactivates tetR but ampR stays intact — the replica-plating signature of a recombinant.", "wrong": ["ampR is untouched, so ampicillin growth persists.", "ampR survives, so recombinants are not killed by both."]}, {"level": "Hard", "type": "number", "map": "Figure 9.4", "prompt": "Restriction sites labelled on the pBR322 map in Figure 9.4", "answer": 7, "unit": "sites", "tolerance": 0.1, "hint": "Hind III, EcoR I, BamH I, Sal I, Pvu II, Pst I and …?", "solution": "Seven: Hind III, EcoR I, BamH I, Sal I, Pvu II, Pst I and Cla I."}], "resources": [{"title": "NCERT §9.2.2 — Vectors & pBR322 (official PDF, PDF p.8)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo109.pdf#page=8"}]}, {"id": "isolation-cutting-gel", "nav": "Isolation, cutting & gel", "title": "Free the DNA, cut it, and read the bands on agarose", "deck": "Lysozyme, cellulase and chitinase open cells; ribonuclease and protease clean up; chilled ethanol precipitates DNA for spooling. Agarose gel sorts fragments by size — small runs farthest — and ethidium bromide plus UV reveals orange bands for elution.", "minutes": 8, "section": "9.3.1, 9.3.2", "pages": [11, 12], "print": "11–12", "sim": "gel", "simTitle": "Electrophoresis band separator: size to distance", "quick": ["DNA must be pure before cutting, but it sits membrane-bound with RNA, proteins, polysaccharides and lipids. Cells are opened with wall-digesting enzymes — <strong>lysozyme (bacteria), cellulase (plant cells), chitinase (fungus)</strong> — then <strong>ribonuclease</strong> removes RNA and <strong>protease</strong> removes proteins (genes stay wound on histones until freed). <strong>Chilled ethanol</strong> precipitates purified DNA as fine threads collected by <strong>spooling</strong> (Figure 9.5).", "Purified DNA is incubated with restriction enzyme at its <strong>optimal conditions</strong>, and <strong>agarose gel electrophoresis</strong> checks the digestion's progress. DNA is <strong>negatively charged</strong>, so it migrates toward the <strong>anode (+)</strong> through <strong>agarose — a natural polymer from sea weeds</strong> — which sieves fragments by size: <strong>smaller fragments run farther</strong> (Figure 9.3: undigested lane 1 vs digested lanes 2–4).", "Pure DNA is invisible, so the gel is stained with <strong>ethidium bromide</strong> and exposed to <strong>UV</strong>: <strong>bright orange bands</strong> appear. Bands are cut out and DNA extracted — <strong>elution</strong> — and the purified ‘gene of interest’ plus the cut vector are mixed with <strong>ligase</strong> to build recombinant DNA.", "The vector gets the identical treatment: cut with the same enzyme, given space for the insert, then joined — the cut–separate–elute–ligate pipeline of Sections 9.3.1–9.3.2."], "formulas": [{"label": "Wall-enzyme pairs", "html": "lysozyme → bacteria; cellulase → plants; chitinase → fungi; then ribonuclease (RNA) + protease (protein); chilled ethanol ⇒ spooling", "cond": "Section 9.3.1"}, {"label": "Migration rule", "html": "DNA (−) → anode (+); agarose sieves by size: smaller fragment ⇒ farther band", "cond": "Figures 9.3; Section 9.3.2"}, {"label": "Elution", "html": "EtBr + UV ⇒ orange bands ⇒ cut band ⇒ extract DNA (elution) ⇒ ligate to vector", "cond": "Section 9.3.2"}], "deeper": "Read Figure 9.3 like a forensic report: lane 1 (undigested) shows essentially one slow, heavy band near the well; lanes 2–4 (digested) scatter into several faster bands — each extra band is a fragment the enzyme liberated. The sample must have been loaded at the end the bands are farthest from (the cathode/negative side), since DNA flees toward the anode. Distance is a ruler for size: nearest band = largest piece.", "worked": "Band-count math: a circular plasmid with one EcoRI site runs as a single undigested-style band; after complete digestion at 3 sites, elution must recover 3 orange bands (n sites on a circle → n fragments). If only 2 bands appear, digestion is partial — repeat at optimal conditions before ligation.", "prediction": {"prompt": "Two bands sit on a gel: band A near the well, band B near the far end. Which fragment is smaller?", "options": ["Band B — smaller fragments sieve farther through agarose", "Band A — heavy bands travel fastest", "Neither — position depends only on staining time"], "answer": 0, "explanation": "Sieving: the smaller the fragment, the farther it moves toward the anode. Far band = small piece."}, "connect": [["Sea-weed agarose from Indian coasts", "The gel matrix itself is a natural sea-weed polymer — the same Gulf of Mannar and Gujarat shores that harvest agar seaweeds supply the stuff of school electrophoresis tanks."], ["Wow — spooling makes genes visible", "After chilled ethanol, DNA winds out as fine threads on a glass rod: no microscope, no stain — heredity you can literally wind onto a stick (Figure 9.5)."]], "recall": "Name the three wall enzymes with targets, the clean-up enzymes, the precipitant, the migration direction and matrix, the stain, and elution.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Fungal walls are opened for DNA isolation with", "options": ["Chitinase", "Cellulase", "Lysozyme"], "answer": 0, "hint": "Match the enzyme to the wall polymer.", "solution": "Chitinase digests fungal chitin; cellulase is for plants, lysozyme for bacteria.", "wrong": ["Cellulase digests plant cellulose.", "Lysozyme digests bacterial walls."]}, {"level": "Medium", "type": "mcq", "prompt": "In gel electrophoresis DNA moves toward the", "options": ["Anode (positive electrode), smaller fragments farther", "Cathode, larger fragments farther", "Cathode, all fragments equally"], "answer": 0, "hint": "DNA is negatively charged; agarose sieves by size.", "solution": "Negative DNA migrates to the positive anode through agarose; small pieces sieve farthest.", "wrong": ["Negatives flee the cathode.", "Sieving separates by size — bands spread out."]}, {"level": "Hard", "type": "number", "map": "Sections 9.3.1–9.3.2", "prompt": "Orange bands to elute after complete digestion of a circular plasmid at 4 restriction sites", "answer": 4, "unit": "bands", "tolerance": 0.1, "hint": "n sites on a circle give n fragments.", "solution": "4 cuts on circular DNA → 4 fragments → 4 EtBr-orange bands to cut out and elute."}], "resources": [{"title": "NCERT §9.3.1, 9.3.2 — Isolation, cutting & gel (official PDF, PDF p.11)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo109.pdf#page=11"}]}, {"id": "pcr-host-insertion", "nav": "PCR & host insertion", "title": "PCR's billion copies — then smuggling DNA into hosts", "deck": "Denaturation, primer annealing, extension: Taq polymerase from Thermus aquaticus repeats the cycle to ~10^9 copies. Competent cells take DNA after Ca2+ plus ice–42 °C–ice shock; microinjection, gene guns and disarmed vectors cover animals and plants.", "minutes": 9, "section": "9.3.3, 9.3.4", "pages": [12, 13], "print": "12–13", "sim": "pcr", "simTitle": "Thermal cycler: cycles to copies by 2^n", "quick": ["<strong>PCR (Polymerase Chain Reaction)</strong> synthesises multiple copies of the gene of interest <strong>in vitro</strong> using <strong>two primer sets</strong> — small chemically synthesised oligonucleotides complementary to the DNA regions — plus <strong>DNA polymerase</strong>, supplied nucleotides and genomic template. Each cycle (Figure 9.6) runs three steps: <strong>(i) denaturation</strong> (heat splits dsDNA), <strong>(ii) primer annealing</strong> (primers bind), <strong>(iii) extension</strong> (polymerase extends primers).", "Repetition is possible only because the polymerase is <strong>thermostable</strong> — isolated from <strong>Thermus aquaticus</strong>, it survives the denaturing heat that kills ordinary enzymes. Repeated cycles amplify the segment to <strong>approximately a billion copies (10<sup>9</sup>)</strong>, and the amplified fragment can then be ligated into a vector for cloning.", "Getting recombinant DNA into hosts (§9.3.4) starts from a handicap: <strong>DNA is hydrophilic and cannot cross cell membranes</strong>. Bacteria are made <strong>competent</strong> with a specific concentration of divalent <strong>calcium</strong> ions, then given recombinant DNA on <strong>ice → brief 42 °C heat shock → ice again</strong>. An ampicillin-resistance-bearing recombinant, plated on ampicillin agar, lets only transformants grow — the resistance gene acting as <strong>selectable marker</strong>.", "Three more delivery routes: <strong>micro-injection</strong> (DNA shot directly into an animal cell's nucleus), <strong>biolistics / gene gun</strong> (gold or tungsten micro-particles coated with DNA bombarded into plant cells), and <strong>disarmed pathogen vectors</strong> that infect and deliver."], "formulas": [{"label": "PCR copies", "html": "N = N<sub>0</sub> × 2<sup>n</sup>; 2<sup>10</sup> ≈ 10<sup>3</sup>, 2<sup>20</sup> ≈ 10<sup>6</sup>, 2<sup>30</sup> ≈ 10<sup>9</sup>", "cond": "Section 9.3.3; Taq from Thermus aquaticus"}, {"label": "Heat-shock chain", "html": "Ca<sup>2+</sup> competence → ice + DNA → 42 °C shock → ice ⇒ uptake", "cond": "Sections 9.2.3/9.3.4"}, {"label": "Delivery table", "html": "bacteria: competent cells; animal nucleus: micro-injection; plants: gene gun; general: disarmed vectors", "cond": "Section 9.3.4"}], "deeper": "The 2^n ladder is worth memorising: 10 cycles ≈ a thousand, 20 ≈ a million, 30 ≈ a billion — the text's ‘approximately billion times’ is 2^30 = 1,073,741,824. Honest note: §9.3.4's heading (‘Insertion of Recombinant DNA into the Host Cell/Organism’) is split across lines on print p. 173, so a naive line-start section survey misses it — but the full passage (competent uptake, ampicillin selection) is present in the text layer and covered here.", "worked": "PCR copy math: start with N₀ = 1 template molecule and run n = 30 cycles: N = 2^30 = 1,073,741,824 ≈ 1.07 × 10^9 copies — the textbook's ‘1 billion copies’. From 10 template molecules the same 30 cycles give 10 × 2^30 ≈ 1.07 × 10^10 copies (linear in N₀, exponential in n).", "prediction": {"prompt": "Ordinary (non-thermostable) DNA polymerase is used in PCR instead of Taq. What happens at the first denaturation step?", "options": ["It denatures and dies — no amplification without fresh enzyme each cycle", "PCR runs faster because normal enzymes extend quicker", "Nothing changes — all polymerases survive near-boiling heat"], "answer": 0, "explanation": "The text's whole point: only Taq from Thermus aquaticus stays active through high-temperature denaturation; ordinary polymerase would cook."}, "connect": [["PCR in Indian diagnostic labs", "The same denature–anneal–extend cycles confirm TB, hepatitis and crop-virus infections in Indian testing laboratories — a classroom figure (9.6) running national diagnostics."], ["Wow — one molecule to a billion in an afternoon", "Thirty doublings turn a single invisible template into ~10^9 copies: exponential growth you can pipette, driven by a heat-proof enzyme from a hot-spring bacterium."]], "recall": "List the PCR ingredients and three steps, the Taq source and copy number, the heat-shock chain, and the three alternative delivery methods.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Taq polymerase used in PCR comes from", "options": ["The bacterium Thermus aquaticus", "E. coli plasmids", "Agrobacterium tumefaciens"], "answer": 0, "hint": "A thermostable enzyme needs a hot home.", "solution": "Taq is isolated from Thermus aquaticus and stays active through denaturing heat.", "wrong": ["E. coli is the cloning host, not the Taq source.", "Agrobacterium gives the Ti vector, not Taq."]}, {"level": "Medium", "type": "number", "map": "Section 9.3.3", "prompt": "Copies from 1 template molecule after 10 PCR cycles", "answer": 1024, "unit": "copies", "tolerance": 1, "hint": "2^10.", "solution": "N = 2^10 = 1024 ≈ 10^3 copies."}, {"level": "Hard", "type": "number", "map": "Section 9.3.3", "prompt": "Cycles needed to reach about a billion copies from 1 molecule (2^30 ≈ 1.07 × 10^9)", "answer": 30, "unit": "cycles", "tolerance": 0.5, "hint": "2^10 ≈ 10^3, so 2^30 ≈ …?", "solution": "2^30 = 1,073,741,824 ≈ 1.07 × 10^9 — the textbook's billion-copy amplification."}], "resources": [{"title": "NCERT §9.3.3, 9.3.4 — PCR & host insertion (official PDF, PDF p.12)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo109.pdf#page=12"}]}, {"id": "bioreactor-downstream", "nav": "Bioreactor & downstream", "title": "Growing the product at 100–1000 L — then purifying it", "deck": "Foreign genes are expressed as recombinant protein, scaled in continuous culture and stirred-tank (or sparged) bioreactors, then separated, purified, formulated, clinically trialled and quality-checked.", "minutes": 8, "section": "9.3.5, 9.3.6", "pages": [13, 14], "print": "13–14", "sim": "bioreactor", "simTitle": "Stirred-tank vs sparged tank + downstream flow", "quick": ["Inserting alien DNA is only half the job: the <strong>ultimate aim is a desirable protein</strong>, so the recombinant DNA must be <strong>expressed under appropriate conditions</strong>. A protein-encoding gene expressed in a <strong>heterologous host</strong> yields a <strong>recombinant protein</strong>. Small lab cultures are harvested and purified with separation techniques — but appreciable quantities need large scale.", "<strong>Continuous culture</strong> keeps cells in log/exponential phase: used medium drains from one side while fresh medium enters the other, sustaining physiologically peak cells for <strong>larger biomass and higher protein yields</strong>. <strong>Bioreactors (100–1000 litres)</strong> biologically convert raw materials into products with microbial, plant, animal or human cells under optimum temperature, pH, substrate, salts, vitamins and oxygen.", "The workhorses are <strong>stirring-type bioreactors</strong> (Figure 9.7): cylindrical or curved-base vessels where the <strong>stirrer mixes evenly and supplies oxygen</strong> throughout; the <strong>sparged stirred-tank</strong> variant additionally <strong>bubbles sterile air</strong> through the reactor. Fittings include agitator, oxygen delivery, foam control, temperature control, pH control systems and sampling ports for periodic withdrawal.", "After the biosynthetic stage comes <strong>downstream processing — separation and purification</strong> — then <strong>formulation with preservatives</strong>, <strong>thorough clinical trials</strong> (as for drugs) and <strong>strict quality control</strong>; both downstream steps and QC <strong>vary from product to product</strong>."], "formulas": [{"label": "Continuous-culture rule", "html": "drain used medium + feed fresh ⇒ log phase held ⇒ biomass ↑ ⇒ yield ↑", "cond": "Section 9.3.5"}, {"label": "Bioreactor scale", "html": "stirred-tank vessels process 100–1000 L; sparged variant adds sterile-air bubbling", "cond": "Figure 9.7; Exercise 6"}, {"label": "Downstream chain", "html": "separate → purify → formulate (+preservatives) → clinical trials → QC", "cond": "Section 9.3.6; Exercise 10(c)"}], "deeper": "Answer Exercise 6's ‘besides aeration and mixing’ directly from the fittings list: foam, temperature and pH control systems plus sampling ports and the sheer 100–1000 L volume that shake flasks cannot touch. And note the chapter's closing discipline — downstream processing and quality control are product-specific, so a vaccine's pipeline differs from an enzyme's even in the same factory.", "worked": "Scale-up math: a 5 L lab culture yielding product P scales to a 500 L stirred-tank run — a 500/5 = 100-fold volume jump, so the expected harvest is ≈ 100 × P at equal cell density (the linearity continuous culture and controlled bioreactor conditions are built to protect). The sparged variant adds sterile-air bubbling on top of stirrer mixing for oxygen-hungry cultures.", "prediction": {"prompt": "A team needs 500 L of recombinant-protein culture. Why choose a stirred-tank bioreactor over 500 shake flasks?", "options": ["One controlled vessel gives even mixing/oxygen, foam–temperature–pH control, sampling ports and 100–1000 L scale", "Flasks are forbidden for recombinant cells by law", "Bioreactors skip downstream processing entirely"], "answer": 0, "explanation": "Exercise 6 + Section 9.3.5: beyond aeration/mixing, the bioreactor adds control systems, sampling and industrial volume — flasks cannot."}, "connect": [["India's recombinant insulin pipeline", "Bengaluru-made recombinant human insulin (a §9.3.5 foreign gene product in E. coli/yeast) reaches diabetic patients only after §9.3.6 separation, formulation, clinical trials and batch-wise quality control — Exercise 1's therapeutics list in action."], ["Wow — Shantha's affordable Hep-B shot", "Hyderabad's Shantha Biotechnics made yeast-expressed hepatitis-B vaccine (HBsAg, e.g. Shanvac-B) affordable for India's immunisation drive — one recombinant protein carried through the full downstream chain: separate, purify, formulate, trial, QC."]], "recall": "Define recombinant protein, state the continuous-culture principle, list bioreactor fittings and the simple-vs-sparged difference, and recite the downstream chain.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Downstream processing is", "options": ["Separation and purification of the product, then formulation, trials and QC", "Draining waste downstream of the factory", "Cooling the bioreactor with river water"], "answer": 0, "hint": "Section 9.3.6 defines it in one line.", "solution": "Separation + purification, formulation with preservatives, clinical trials and strict quality control.", "wrong": ["Industrial geography, not biotechnology.", "Temperature control is upstream bioreactor operation."]}, {"level": "Medium", "type": "mcq", "prompt": "A sparged stirred-tank bioreactor differs by", "options": ["Sterile air bubbles sparged through the reactor", "Absence of any stirrer or agitator", "Running without temperature control"], "answer": 0, "hint": "Figure 9.7(b).", "solution": "Sterile air is bubbled (sparged) through the culture in addition to stirrer mixing.", "wrong": ["The agitator system is still present.", "Temperature control is standard in both."]}, {"level": "Hard", "type": "number", "map": "Section 9.3.5", "prompt": "Scale factor scaling a 5 L culture to a 500 L bioreactor run", "answer": 100, "unit": "fold", "tolerance": 1, "hint": "500 divided by 5.", "solution": "500/5 = 100-fold volume jump — the 100–1000 L range bioreactors exist to serve."}], "resources": [{"title": "NCERT §9.3.5, 9.3.6 — Bioreactor & downstream (official PDF, PDF p.13)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo109.pdf#page=13"}]}], "exercises": [{"number": 1, "conceptIdx": 5, "page": 15, "printPage": null, "question": "Can you list 10 recombinant proteins which are used in medical practice? Find out where they are used as therapeutics (use the internet).", "steps": ["Recombinant proteins are §9.3.5 foreign gene products expressed in heterologous hosts, purified by downstream processing.", "Therapeutic ten: (1) Insulin — diabetes; (2) Human growth hormone — dwarfism; (3) Tissue plasminogen activator — heart attack/stroke clots; (4) Factor VIII — haemophilia A; (5) Erythropoietin — anaemia; (6) Interferon-α — hepatitis/viral cancers; (7) Hepatitis-B surface antigen — Hep-B vaccine; (8) DNase I — cystic fibrosis; (9) Follicle-stimulating hormone — infertility; (10) G-CSF — neutropenia after chemotherapy.", "Honest note: the exact ten are an internet-research answer (as NCERT directs); any ten genuine recombinant therapeutics with uses score."], "answer": "Insulin, hGH, tPA, Factor VIII, erythropoietin, interferon-α, HBsAg vaccine, DNase I, FSH, G-CSF — with uses above."}, {"number": 2, "conceptIdx": 1, "page": 15, "printPage": null, "question": "Make a chart (with diagrammatic representation) showing a restriction enzyme, the substrate DNA on which it acts, the site at which it cuts DNA and the product it produces.", "steps": ["Enzyme: EcoRI (from E. coli RY 13; Section 9.2.1).", "Substrate: any dsDNA carrying 5′-GAATTC-3′ / 3′-CTTAAG-5′ (palindromic recognition sequence).", "Cut site: between G and A on each strand (5′-G|AATTC-3′), a little away from the palindrome centre — see Figure 9.1.", "Product: two fragments with single-stranded sticky ends (AATT overhangs) that pair with complementary cut counterparts for ligase joining."], "answer": "EcoRI on GAATTC, cut G|AATTC → sticky-ended fragments (Figure 9.1)."}, {"number": 3, "conceptIdx": 1, "page": 15, "printPage": null, "question": "From what you have learnt, can you tell whether enzymes are bigger or DNA is bigger in molecular size? How did you know?", "steps": ["Compare molar masses: 1 DNA base pair ≈ 660 Da, so even a 1 kb gene ≈ 6.6 × 10^5 Da (660 kDa).", "Typical enzymes are tens of kDa (e.g. EcoRI subunit ≈ 31 kDa; Taq polymerase ≈ 94 kDa).", "Hence DNA is bigger — a modest plasmid such as pBR322 (thousands of bp) outweighs its cutting enzyme by an order of magnitude or more.", "How we know: masses follow from sequence lengths (bp × 660 Da) and protein sizes from gel/sequence data."], "answer": "DNA is bigger in molecular size (kb of 660-Da bp outweigh kDa enzymes)."}, {"number": 4, "conceptIdx": 0, "page": 15, "printPage": null, "question": "What would be the molar concentration of human DNA in a human cell? Consult your teacher.", "steps": ["Diploid human genome ≈ 6.6 × 10^9 base pairs (NCERT-directed value).", "Average mass of 1 bp ≈ 660 Da = 660 g mol⁻¹, so molar mass of one genome = 6.6 × 10^9 × 660 = 4.356 × 10^12 g mol⁻¹.", "Mass of DNA per cell = 4.356 × 10^12 / 6.022 × 10^23 = 7.23 × 10^-12 g ≈ 7.2 pg.", "Moles of base pairs per cell = 6.6 × 10^9 / 6.022 × 10^23 = 1.096 × 10^-14 mol.", "Typical cell volume ≈ 10^-12 L (1000 µm³): [bp] = 1.096 × 10^-14 / 10^-12 ≈ 1.1 × 10^-2 mol L⁻¹ ≈ 0.011 M (≈ 11 mM in base pairs; ≈ picomolar in whole genomes).", "Honest note: order-of-magnitude estimate — the value scales with the assumed cell volume, hence ‘consult your teacher’."], "answer": "≈ 10^-2 M in base pairs (≈ 7.2 pg per cell; picomolar in whole genomes)."}, {"number": 5, "conceptIdx": 1, "page": 15, "printPage": null, "question": "Do eukaryotic cells have restriction endonucleases? Justify your answer.", "steps": ["No. Restriction endonucleases are bacterial defence tools: they cut invading bacteriophage DNA while the host genome is protected by methylation (Section 9.2.1, 1963 discovery).", "Eukaryotes never evolved this system — their genomes are full of palindromic recognition sequences that such enzymes would shred, and they defend against viruses by other (e.g. immune/RNA-based) means.", "That is exactly why eukaryotes must borrow bacterial enzymes for recombinant DNA work."], "answer": "No — restriction–modification is a prokaryotic defence; eukaryotes lack it."}, {"number": 6, "conceptIdx": 5, "page": 15, "printPage": null, "question": "Besides better aeration and mixing properties, what other advantages do stirred tank bioreactors have over shake flasks?", "steps": ["Volume: stirred tanks process 100–1000 L; flasks are millilitre-to-litre scale (Section 9.3.5).", "Control systems from the text: foam control, temperature control and pH control systems, plus an oxygen delivery system.", "Operability: sampling ports withdraw small culture volumes periodically without stopping the run; continuous-culture feeding/draining holds log phase.", "Result: even mixing and oxygen availability throughout plus industrial-scale, monitored production — impossible in flasks."], "answer": "100–1000 L scale + foam/temperature/pH control + sampling ports + continuous operation."}, {"number": 7, "conceptIdx": 1, "page": 15, "printPage": null, "question": "Collect 5 examples of palindromic DNA sequences by consulting your teacher. Better try to create a palindromic sequence by following base-pair rules.", "steps": ["Rule: a DNA palindrome reads identically 5′ → 3′ on both strands (complement, then reverse, returns the same word).", "Five verified examples (four from the pBR322 map, Figure 9.4): (1) GAATTC (EcoRI): complement CTTAAG → reversed GAATTC ✓; (2) GGATCC (BamHI): complement CCTAGG → reversed GGATCC ✓; (3) AAGCTT (Hind III): complement TTCGAA → reversed AAGCTT ✓; (4) GTCGAC (Sal I): complement CAGCTG → reversed GTCGAC ✓; (5) CTGCAG (Pst I): complement GACGTC → reversed CTGCAG ✓.", "To create one: pick any short half (e.g. 5′-GC-3′) and append its reverse complement (5′-GC-3′) → 5′-GCGC-3′, whose complement 3′-CGCG-5′ reads 5′-GCGC-3′ the other way ✓.", "Honest note: the five listed are standard restriction-site palindromes consistent with the chapter's base-pair rules; all verified above by complement-plus-reverse."], "answer": "GAATTC, GGATCC, AAGCTT, GTCGAC, CTGCAG — each equals its reverse complement."}, {"number": 8, "conceptIdx": 0, "page": 15, "printPage": null, "question": "Can you recall meiosis and indicate at what stage a recombinant DNA is made?", "steps": ["Meiotic recombination = crossing over between non-sister chromatids of homologous chromosomes.", "It occurs in prophase I of meiosis I, at the pachytene stage (after synapsis in zygotene, in synaptonemal-complex tetrads).", "The exchange creates recombinant (crossover) chromatids carrying new allele combinations — nature's own recombinant DNA, distinct from in-vitro rDNA of Section 9.1.", "Chiasmata visible at diplotene/diakinesis mark where the swaps happened."], "answer": "Pachytene of prophase I (meiosis I) — crossing over makes recombinant chromatids."}, {"number": 9, "conceptIdx": 2, "page": 15, "printPage": null, "question": "Can you think and answer how a reporter enzyme can be used to monitor transformation of host cells by foreign DNA in addition to a selectable marker?", "steps": ["Selectable markers (antibiotic resistance) only report DNA uptake; a reporter enzyme reports insertion — the text's β-galactosidase system (Section 9.2.2).", "Clone the foreign DNA inside the β-galactosidase coding sequence: insertional inactivation kills enzyme synthesis.", "Plate on chromogenic substrate: intact gene → blue colonies (non-recombinant transformants); disrupted gene → white colonies (recombinants).", "So one plate both confirms transformation (colonies grew) and identifies recombinants (white), replacing the two-plate antibiotic comparison."], "answer": "β-galactosidase + chromogenic substrate: blue = vector intact, white = insert present."}, {"number": 10, "conceptIdx": 5, "page": 16, "printPage": null, "question": "Describe briefly the following: (a) Origin of replication (b) Bioreactors (c) Downstream processing", "steps": ["(a) ori: the specific DNA sequence where replication initiates; alien DNA linked to it replicates with the host (cloning); it also controls copy number — high-copy ori for many copies (Sections 9.1, 9.2.2).", "(b) Bioreactors: 100–1000 L vessels converting raw materials into products with microbial/plant/animal/human cells under optimum conditions; stirring type most common — agitator, oxygen delivery, foam/temperature/pH controls, sampling ports; sparged variant bubbles sterile air (Section 9.3.5, Figure 9.7).", "(c) Downstream processing: post-biosynthesis separation and purification, formulation with preservatives, clinical trials as for drugs, strict quality control — product-specific (Section 9.3.6)."], "answer": "ori: replication start + copy control; bioreactors: 100–1000 L controlled vessels; downstream: purify → formulate → trial → QC."}, {"number": 11, "conceptIdx": 4, "page": 16, "printPage": null, "question": "Explain briefly (a) PCR (b) Restriction enzymes and DNA (c) Chitinase", "steps": ["(a) PCR: in-vitro amplification with two primer sets, DNA polymerase, nucleotides and template through denaturation → primer annealing → extension (Figure 9.6); thermostable Taq (Thermus aquaticus) survives the heat; N = 2^n gives ≈ 10^9 copies (≈ 2^30) for vector ligation (Section 9.3.3).", "(b) Restriction enzymes cut DNA at specific palindromic recognition sequences (Hind II: 6 bp; EcoRI: GAATTC), leaving sticky ends that ligase joins when vector and insert share the enzyme — the core cutting tool of rDNA technology (Section 9.2.1).", "(c) Chitinase: digests fungal cell walls to release DNA (with lysozyme for bacteria, cellulase for plants) at the isolation step; RNA/proteins then removed by ribonuclease/protease before chilled-ethanol precipitation (Section 9.3.1)."], "answer": "PCR: 2^n amplification; restriction enzymes: palindrome cutters; chitinase: fungal-wall opener."}, {"number": 12, "conceptIdx": 2, "page": 16, "printPage": null, "question": "Discuss with your teacher and find out how to distinguish between (a) Plasmid DNA and Chromosomal DNA (b) RNA and DNA (c) Exonuclease and Endonuclease", "steps": ["(a) Plasmid: small, circular, extra-chromosomal, autonomously replicating via its own ori, high copy number, carries few (often resistance) genes, lost without selection. Chromosomal: large, essential genome, single copy per cell, carries housekeeping genes.", "(b) DNA: deoxyribose sugar, thymine (A-T), usually double-stranded helix, stable genetic repository. RNA: ribose sugar, uracil (A-U), usually single-stranded, short-lived messenger/catalytic roles.", "(c) Exonuclease: trims nucleotides from DNA ends. Endonuclease (incl. restriction enzymes): cuts at specific internal positions — palindromic recognition sequences for restriction endonucleases (Section 9.2.1)."], "answer": "Plasmid: small circular extra-chromosomal; RNA: ribose + uracil, single-stranded; exo: ends, endo: internal cuts."}], "pageOffset": null, "printPageStart": null, "printPageEnd": null, "paginationProvenance": "folio-absent-in-source"};
