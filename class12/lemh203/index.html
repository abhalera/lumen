<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Class 12 Mathematics — Differential Equations.">
  <title>Differential Equations — Class 12 Mathematics</title>
  <style>:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  text-align: left;
  background: #0f172a;
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
}
.play-btn {
  flex: none;
  width: 34px;
  height: 34px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 14px;
}
.video-title {
  font-size: 13px;
  line-height: 1.4;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.q-badge {
  background: var(--soft);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 3px 10px;
  border-radius: 6px;
}
.q-concept-link {
  color: var(--blue);
  text-decoration: none;

: order 2, (A)."], "answer": "1: order 4, degree not defined; 2: order 1, degree 1; 3: order 2, degree 1; 4: order 2, degree not defined; 5: order 2, degree 1; 6: order 3, degree 2; 7: order 3, degree 1; 8: order 1, degree 1; 9: order 2, degree 1; 10: order 2, degree 1; 11: (D) not defined; 12: (A) 2."}, {"number": "9.2.1", "exercise": "9.2", "question": "y = eˣ + 1 : y″ − y′ = 0", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 1", "conceptIdx": 1, "steps": ["Differentiate y = eˣ + 1: y′ = eˣ, and again y″ = eˣ.", "Hence y″ − y′ = eˣ − eˣ = 0."], "answer": "Verified: y = eˣ + 1 satisfies y″ − y′ = 0."}, {"number": "9.2.2", "exercise": "9.2", "question": "y = x² + 2x + C : y′ − 2x − 2 = 0", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 2", "conceptIdx": 1, "steps": ["Differentiate: y′ = 2x + 2.", "So y′ − 2x − 2 = (2x + 2) − 2x − 2 = 0."], "answer": "Verified: y = x² + 2x + C satisfies y′ − 2x − 2 = 0."}, {"number": "9.2.3", "exercise": "9.2", "question": "3. y = cos x + C : y′ + sin x = 0; 4. y = √(1 + x²) : y′ = xy/(1 + x²)", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 3", "conceptIdx": 1, "steps": ["Q3: y′ = −sin x, so y′ + sin x = 0.", "Q4: y² = 1 + x² gives 2yy′ = 2x, i.e. y′ = x/y = xy/y² = xy/(1 + x²)."], "answer": "Both verified: y′ + sin x = 0 and y′ = xy/(1 + x²)."}, {"number": "9.2.5", "exercise": "9.2", "question": "y = Ax : xy′ = y (x ≠ 0)", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 5", "conceptIdx": 1, "steps": ["y′ = A, so xy′ = Ax = y.", "Hence xy′ − y = 0 for x ≠ 0."], "answer": "Verified: y = Ax satisfies xy′ = y."}, {"number": "9.2.6", "exercise": "9.2", "question": "y = x sin x : xy′ = y + x√(x² − y²) (x ≠ 0 and x > y or x < −y)", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 6", "conceptIdx": 1, "steps": ["y′ = sin x + x cos x, so xy′ = x sin x + x²cos x = y + x²cos x.", "Since sin x = y/x, cos x = √(1 − y²/x²) = √(x² − y²)/x, giving xy′ = y + x√(x² − y²)."], "answer": "Verified: xy′ = y + x√(x² − y²)."}, {"number": "9.2.7", "exercise": "9.2", "question": "xy = log y + C : y′ = y²/(1 − xy) (xy ≠ 1)", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 7", "conceptIdx": 1, "steps": ["Differentiate xy = log y + C: y + xy′ = y′/y.", "Multiply by y: y² + xyy′ = y′, so y′(1 − xy) = y², i.e. y′ = y²/(1 − xy)."], "answer": "Verified: y′ = y²/(1 − xy)."}, {"number": "9.2.8", "exercise": "9.2", "question": "y − cos y = x : (y sin y + cos y + x) y′ = y", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 8", "conceptIdx": 1, "steps": ["Differentiate: y′ + y′ sin y = 1, so y′(1 + sin y) = 1.", "Since x = y − cos y, y sin y + cos y + x = y sin y + y = y(1 + sin y); multiplying by y′ gives y."], "answer": "Verified: (y sin y + cos y + x) y′ = y."}, {"number": "9.2.9", "exercise": "9.2", "question": "9. x + y = tan⁻¹y : y² y′ + y² + 1 = 0; 10. y = √(a² − x²), x ∈ (−a, a) : x + y dy/dx = 0 (y ≠ 0)", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 9", "conceptIdx": 1, "steps": ["Q9: 1 + y′ = y′/(1 + y²); multiplying by (1 + y²) gives 1 + y² + y′ + y²y′ = y′, i.e. y²y′ + y² + 1 = 0.", "Q10: y² = a² − x² gives 2yy′ = −2x, i.e. x + y dy/dx = 0."], "answer": "Both verified."}, {"number": "9.2.11", "exercise": "9.2", "question": "The number of arbitrary constants in the general solution of a differential equation of fourth order are: (A) 0 (B) 2 (C) 3 (D) 4", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 11", "conceptIdx": 1, "steps": ["The general solution of an order-n equation contains n arbitrary constants.", "For fourth order, n = 4."], "answer": "(D) 4"}, {"number": "9.2.12", "exercise": "9.2", "question": "The number of arbitrary constants in the particular solution of a differential equation of third order are: (A) 3 (B) 2 (C) 1 (D) 0", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 12", "conceptIdx": 1, "steps": ["A particular solution is obtained by assigning fixed values to all arbitrary constants.", "Hence it contains no arbitrary constants."], "answer": "(D) 0"}, {"number": "9.3.1", "exercise": "9.3", "question": "1. dy/dx = (1 − cos x)/(1 + cos x); 2. dy/dx = √(4 − y²) (−2 < y < 2); 3. dy/dx + y = 1 (y ≠ 1)", "page": 11, "endPage": 11, "title": "NCERT Exercise 9.3 · Question 1", "conceptIdx": 2, "steps": ["Q1: (1 − cos x)/(1 + cos x) = tan²(x/2) = sec²(x/2) − 1, so y = 2tan(x/2) − x + C. Q2: dy/√(4 − y²) = dx gives sin⁻¹(y/2) = x + C, i.e. y = 2sin(x + C).", "Q3: dy/(1 − y) = dx gives −log|1 − y| = x + C, i.e. y = 1 + Ce⁻ˣ."], "answer": "Q1: y = 2tan(x/2) − x + C; Q2: y = 2sin(x + C); Q3: y = 1 + Ce⁻ˣ."}, {"number": "9.3.4", "exercise": "9.3", "question": "sec²x tan y dx + sec²y tan x dy = 0", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 4", "conceptIdx": 2, "steps": ["sec²x/tan x dx + sec²y/tan y dy = 0 integrates to log|tan x| + log|tan y| = log C.", "dy/(1 + y²) = (1 + x²)dx integrates to tan⁻¹y = x + x³/3 + C."], "answer": "tan x tan y = C; tan⁻¹y = x + x³/3 + C."}, {"number": "9.3.5", "exercise": "9.3", "question": "(eˣ + e⁻ˣ) dy − (eˣ − e⁻ˣ) dx = 0; 6. dy/dx = (1 + x²)(1 + y²)", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 5", "conceptIdx": 2, "steps": ["dy = (eˣ − e⁻ˣ)/(eˣ + e⁻ˣ) dx, and the numerator is the derivative of the denominator: y = log|eˣ + e⁻ˣ| + C.", "dy/y⁵ = −dx/x⁵ gives −1/(4y⁴) = 1/(4x⁴) + C, i.e. x⁻⁴ + y⁻⁴ = C."], "answer": "y = log|eˣ + e⁻ˣ| + C; x⁻⁴ + y⁻⁴ = C."}, {"number": "9.3.7", "exercise": "9.3", "question": "y log y dx − x dy = 0; 8. x⁵ dy/dx = −y⁵; 9. dy/dx = sin⁻¹x", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 7", "conceptIdx": 2, "steps": ["Q7: dx/x = dy/(y log y) gives log|x| = log|log y| + C, i.e. y = e^{Cx}. Q8: x⁻⁴ + y⁻⁴ = C (as above).", "Q9: y = ∫sin⁻¹x dx = x sin⁻¹x + √(1 − x²) + C."], "answer": "Q7: y = e^{Cx}; Q8: x⁻⁴ + y⁻⁴ = C; Q9: y = x sin⁻¹x + √(1 − x²) + C."}, {"number": "9.3.10", "exercise": "9.3", "question": "eˣ tan y dx + (1 − eˣ) sec²y dy = 0. For Exercises 11 to 14, find a particular solution satisfying the given condition: 11. (x³ + x² + x + 1) dy/dx = 2x² + x; y = 1 when x = 0", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 10", "conceptIdx": 2, "steps": ["Q10: eˣ/(1 − eˣ) dx + sec²y/tan y dy = 0 gives −log|1 − eˣ| + log|tan y| = log C, i.e. tan y = C(1 − eˣ).", "Q11: y′ = x(2x + 1)/[(x + 1)(x² + 1)] = (1/2)/(x + 1) + [(3/2)x − 1/2]/(x² + 1) by partial fractions.", "Integrating: y = (1/2)log|x + 1| + (3/4)log(x² + 1) − (1/2)tan⁻¹x + C; y(0) = 1 gives C = 1."], "answer": "Q10: tan y = C(1 − eˣ); Q11: y = (1/2)log|x + 1| + (3/4)log(x² + 1) − (1/2)tan⁻¹x + 1."}, {"number": "9.3.11", "exercise": "9.3", "question": "(x³ + x² + x + 1) dy/dx = 2x² + x; y = 1 when x = 0. 12. x(x² − 1) dy/dx = 1; y = 0 when x = 2. 13. cos(dy/dx) = a (a ∈ R); y = 1 when x = 0", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 11", "conceptIdx": 2, "steps": ["Q11: as above, y = (1/2)log|x + 1| + (3/4)log(x² + 1) − (1/2)tan⁻¹x + 1.", "Q12: dy = dx/[x(x² − 1)] = [−1/x + (1/2)/(x − 1) + (1/2)/(x + 1)]dx; y = (1/2)log|(x² − 1)/x²| + C, and y(2) = 0 gives C = (1/2)log(4/3).", "Q13: dy/dx = cos⁻¹a, so y = x cos⁻¹a + C; y(0) = 1 gives C = 1."], "answer": "Q11: y = (1/2)log|x + 1| + (3/4)log(x² + 1) − (1/2)tan⁻¹x + 1; Q12: y = (1/2)log|4(x² − 1)/(3x²)|; Q13: y = x cos⁻¹a + 1."}, {"number": "9.3.14", "exercise": "9.3", "question": "dy/dx = y tan x; y = 1 when x = 0", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 14", "conceptIdx": 2, "steps": ["dy/y = tan x dx gives log|y| = log|sec x| + C, i.e. y = C sec x.", "y(0) = 1 gives C = 1."], "answer": "y = sec x."}, {"number": "9.3.15", "exercise": "9.3", "question": "Find the equation of a curve passing through the point (0, 0) and whose differential equation is y′ = eˣ sin x.", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 15", "conceptIdx": 2, "steps": ["y = ∫eˣ sin x dx = eˣ(sin x − cos x)/2 + C.", "Passing through (0, 0): 0 = −1/2 + C, so C = 1/2."], "answer": "y = (eˣ(sin x − cos x) + 1)/2."}, {"number": "9.3.16", "exercise": "9.3", "question": "For the differential equation xy dy/dx = (x + 2)(y + 2), find the solution curve passing through the point (1, −1).", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 16", "conceptIdx": 2, "steps": ["Separate: y dy/(y + 2) = (x + 2)dx/x, i.e. [1 − 2/(y + 2)]dy = [1 + 2/x]dx.", "Integrate: y − 2log|y + 2| = x + 2log|x| + C; through (1, −1): −1 = 1 + C, so C = −2."], "answer": "y − 2log|y + 2| = x + 2log|x| − 2."}, {"number": "9.3.17", "exercise": "9.3", "question": "Find the equation of a curve passing through the point (0, −2) given that at any point (x, y) on the curve, the product of the slope of its tangent and y coordinate of the point is equal to the x coordinate of the point.", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 17", "conceptIdx": 2, "steps": ["Condition: y · dy/dx = x, i.e. y dy = x dx.", "Integrate: y² = x² + C; through (0, −2): C = 4."], "answer": "y² = x² + 4."}, {"number": "9.3.18", "exercise": "9.3", "question": "At any point (x, y) of a curve, the slope of the tangent is twice the slope of the line segment joining the point of contact to the point (−4, −3). Find the equation of the curve given that it passes through (−2, 1).", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 18", "conceptIdx": 2, "steps": ["dy/dx = 2(y + 3)/(x + 4), so dy/(y + 3) = 2dx/(x + 4).", "Integrate: log|y + 3| = 2log|x + 4| + log C, i.e. y + 3 = C(x + 4)²; through (−2, 1): 4 = 4C, so C = 1."], "answer": "y + 3 = (x + 4)²."}, {"number": "9.3.19", "exercise": "9.3", "question": "The volume of spherical balloon being inflated changes at a constant rate. If initially its radius is 3 units and after 3 seconds it is 6 units. Find the radius of balloon after t seconds.", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 19", "conceptIdx": 2, "steps": ["dV/dt = k with V = (4/3)πr³ gives 4πr² dr = k dt, so (4/3)πr³ = kt + C.", "r = 3 at t = 0 gives C = 36π; r = 6 at t = 3 gives k = 84π; hence r³ = 63t + 27."], "answer": "r = (63t + 27)^{1/3} units."}, {"number": "9.3.20", "exercise": "9.3", "question": "In a bank, principal increases continuously at the rate of r% per year. Find the value of r if Rs 100 double itself in 10 years (log_e2 = 0.6931).", "page": 13, "endPage": 13, "title": "NCERT Exercise 9.3 · Question 20", "conceptIdx": 2, "steps": ["dP/dt = (r/100)P gives P = 100e^{rt/100} (P = 100 at t = 0).", "Doubling in 10 years: 2 = e^{r/10}, so r = 10log_e2 = 6.931."], "answer": "r = 6.931% per year."}, {"number": "9.3.21", "exercise": "9.3", "question": "In a bank, principal increases continuously at the rate of 5% per year. An amount of Rs 1000 is deposited with this bank, how much will it worth after 10 years (e^{0.5} = 1.648).", "page": 13, "endPage": 13, "title": "NCERT Exercise 9.3 · Question 21", "conceptIdx": 2, "steps": ["P = 1000e^{0.05t}.", "At t = 10: P = 1000e^{0.5} = 1000 × 1.648 = 1648."], "answer": "Rs 1648."}, {"number": "9.3.22", "exercise": "9.3", "question": "In a culture, the bacteria count is 1,00,000. The number is increased by 10% in 2 hours. In how many hours will the count reach 2,00,000, if the rate of growth of bacteria is proportional to the number present?", "page": 13, "endPage": 13, "title": "NCERT Exercise 9.3 · Question 22", "conceptIdx": 2, "steps": ["dN/dt = kN gives N = 100000e^{kt}; 10% growth in 2 h gives e^{2k} = 1.1.", "N = 200000 when e^{kt} = 2, so t = log2/k = 2log2/log1.1 ≈ 14.5."], "answer": "About 14.5 hours."}, {"number": "9.3.23", "exercise": "9.3", "question": "The general solution of the differential equation dy/dx = e^{x+y} is (A) eˣ + e⁻ʸ = C (B) eˣ + eʸ = C (C) e⁻ˣ + eʸ = C (D) e⁻ˣ + e⁻ʸ = C", "page": 13, "endPage": 13, "title": "NCERT Exercise 9.3 · Question 23", "conceptIdx": 2, "steps": ["dy/dx = eˣeʸ separates as e⁻ʸ dy = eˣ dx.", "Integrating: −e⁻ʸ = eˣ + C, i.e. eˣ + e⁻ʸ = C′."], "answer": "(A) eˣ + e⁻ʸ = C"}, {"number": "9.4.1", "exercise": "9.4", "question": "(x² + xy) dy = (x² + y²) dx; 2. y′ = (x + y)/x", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 1", "conceptIdx": 3, "steps": ["Q1 is homogeneous: dy/dx = (1 + v²)/(1 + v) with y = vx, so x dv/dx = (1 − v)/(1 + v). Separating gives (1 + v)/(1 − v) dv = dx/x; Q2: y = vx gives v + x dv/dx = 1 + v, so dv = dx/x.", "Q1 integrates to −v − 2log|1 − v| = log|x| + C. Q2 integrates to v = log|x| + C.", "Replace v = y/x."], "answer": "Q1: −y/x − 2log|1 − y/x| = log|x| + C; Q2: y = x log|x| + Cx."}, {"number": "9.4.3", "exercise": "9.4", "question": "(x − y) dy − (x + y) dx = 0", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 3", "conceptIdx": 3, "steps": ["Homogeneous: dy/dx = (1 + v)/(1 − v) with y = vx, so x dv/dx = (1 + v²)/(1 − v).", "Separating: (1 − v)/(1 + v²) dv = dx/x; integrating gives tan⁻¹v − (1/2)log(1 + v²) = log|x| + C.", "With v = y/x this simplifies to tan⁻¹(y/x) − (1/2)log(x² + y²) = C."], "answer": "tan⁻¹(y/x) = (1/2)log(x² + y²) + C."}, {"number": "9.4.4", "exercise": "9.4", "question": "(x² − y²) dx + 2xy dy = 0; 5. x² dy/dx = x² − 2y² + xy", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 4", "conceptIdx": 3, "steps": ["Q4: dy/dx = (v² − 1)/(2v) with y = vx, so x dv/dx = −(1 + v²)/(2v); 2v dv/(1 + v²) = −dx/x gives log(1 + v²) = −log|x| + log C.", "Q5: dy/dx = 1 − 2v² + v, so x dv/dx = 1 − 2v²; dv/(1 − 2v²) = dx/x integrates to (1/(2√2))log|(1 + √2 v)/(1 − √2 v)| = log|x| + C.", "Replace v = y/x."], "answer": "Q4: x² + y² = Cx; Q5: (1/(2√2))log|(x + √2 y)/(x − √2 y)| = log|x| + C."}, {"number": "9.4.6", "exercise": "9.4", "question": "6. x dy − y dx = √(x² + y²) dx; 7. {x cos(y/x) + y sin(y/x)}y dx = {y sin(y/x) − x cos(y/x)}x dy; 8. x dy/dx − y + x sin(y/x) = 0; 9. y dx + x log(y/x) dy − 2x dy = 0", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 6", "conceptIdx": 3, "steps": ["Q6: dy/dx = v + √(1 + v²), so dv/√(1 + v²) = dx/x; log|v + √(1 + v²)| = log|x| + C gives y + √(x² + y²) = Cx². Q7: with y = vx, x dv/dx = 2v cos v/(v sin v − cos v); (tan v − 1/v)dv = 2dx/x gives −log|cos v| − log|v| = 2log|x| + C, i.e. sec(y/x) = Cxy.", "Q8: dy/dx = v − sin v, so dv/sin v = −dx/x; log|tan(v/2)| = −log|x| + C, i.e. x tan(y/2x) = C. Q9: dx/dy = (2x − x log(x/y))/y; with x = vy, dv/[v(1 − log v)] = dy/y gives −log|1 − log v| = log|y| + C, i.e. y(1 − log(x/y)) = C."], "answer": "Q6: y + √(x² + y²) = Cx²; Q7: sec(y/x) = Cxy; Q8: x tan(y/2x) = C; Q9: y(1 − log(x/y)) = C."}, {"number": "9.4.10", "exercise": "9.4", "question": "10. (1 + e^{x/y})dx + e^{x/y}(1 − x/y)dy = 0. For each of the differential equations in Exercises from 11 to 15, find the particular solution satisfying the given condition:", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 10", "conceptIdx": 3, "steps": ["Q10 is homogeneous of degree 0. Put x = vy, so dx = v dy + y dv.", "Substituting gives dy(v + e^v) + y(1 + e^v)dv = 0, i.e. dy/y + (1 + e^v)/(v + e^v) dv = 0.", "Integrating: log|y| + log|v + e^v| = log C; with v = x/y this is y(x/y + e^{x/y}) = C."], "answer": "x + y e^{x/y} = C."}, {"number": "9.4.11", "exercise": "9.4", "question": "(x + y) dy + (x − y) dx = 0; y = 1 when x = 1", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 11", "conceptIdx": 3, "steps": ["dy/dx = (v − 1)/(v + 1) with y = vx, so x dv/dx = −(1 + v²)/(v + 1); (v + 1)/(1 + v²) dv = −dx/x.", "Integrating: tan⁻¹v + (1/2)log(1 + v²) = −log|x| + C, i.e. tan⁻¹(y/x) + (1/2)log(x² + y²) = C.", "y = 1 at x = 1 gives C = π/4 + (1/2)log 2."], "answer": "tan⁻¹(y/x) + (1/2)log(x² + y²) = π/4 + (1/2)log 2."}, {"number": "9.4.12", "exercise": "9.4", "question": "x² dy + (xy + y²) dx = 0; y = 1 when x = 1", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 12", "conceptIdx": 3, "steps": ["dy/dx = −(v + v²) with y = vx, so x dv/dx = −v(2 + v); dv/[v(v + 2)] = −dx/x.", "(1/2)log|v/(v + 2)| = −log|x| + C, i.e. x²y/(y + 2x) = C; y = 1 at x = 1 gives C = 1/3."], "answer": "3x²y = y + 2x."}, {"number": "9.4.13", "exercise": "9.4", "question": "13. [x sin²(y/x) − y]dx + x dy = 0; y = π/4 when x = 1", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 13", "conceptIdx": 3, "steps": ["dy/dx = v − sin²v with y = vx, so x dv/dx = −sin²v; dv/sin²v = −dx/x.", "−cot v = −log|x| + C, i.e. cot v = log|x| + C′; v = π/4 at x = 1 gives C′ = 1."], "answer": "cot(y/x) = log|ex|."}, {"number": "9.4.14", "exercise": "9.4", "question": "14. dy/dx − y/x + cosec(y/x) = 0; y = 0 when x = 1. 15. 2xy + y² − 2x² dy/dx = 0; y = 2 when x = 1", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 14", "conceptIdx": 3, "steps": ["Q14: dy/dx = v − cosec v, so sin v dv = −dx/x; −cos v = −log|x| + C, and v = 0 at x = 1 gives cos(y/x) = log|ex|.", "Q15: dy/dx = v + v²/2, so 2dv/v² = dx/x; −2/v = log|x| + C, i.e. −2x/y = log|x| + C, and (1, 2) gives C = −1."], "answer": "Q14: cos(y/x) = log|ex|; Q15: y = 2x/(1 − log|x|)."}, {"number": "9.4.16", "exercise": "9.4", "question": "A homogeneous differential equation of the form dx/dy = h(x/y) can be solved by making the substitution. (A) y = vx (B) v = yx (C) x = vy (D) x = v", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 16", "conceptIdx": 3, "steps": ["Here x is the dependent variable and y the independent variable, with the ratio x/y.", "Put x = vy so that dx/dy = v + y dv/dy, which makes the equation separable."], "answer": "(C) x = vy"}, {"number": "9.4.17", "exercise": "9.4", "question": "Which of the following is a homogeneous differential equation? (A) (4x + 6y + 5) dy − (3y + 2x + 4) dx = 0 (B) (xy) dx − (x³ + y³) dy = 0 (C) (x³ + 2y²) dx + 2xy dy = 0 (D) y² dx + (x² − xy − y²) dy = 0", "page": 23, "endPage": 23, "title": "NCERT Exercise 9.4 · Question 17", "conceptIdx": 3, "steps": ["(A) has constant terms 5, 4, so not homogeneous. (B) mixes degrees 2 and 3. (C) mixes x³ with y², 2xy.", "(D) every term (y², x², xy) is homogeneous of degree 2."], "answer": "(D) y² dx + (x² − xy − y²) dy = 0"}, {"number": "9.5.1", "exercise": "9.5", "question": "For Exercises 1 to 12, find the general solution: 1. dy/dx + 2y = sin x; 2. dy/dx + 3y = e^{−2x}; 3. dy/dx + y/x = x²; 4. dy/dx + (sec x)y = tan x (0 ≤ x < π/2); 5. cos²x dy/dx + y = tan x (0 ≤ x < π/2); 6. x dy/dx + 2y = x² log x; 7. x log x dy/dx + y = (2/x)log x; 8. (1 + x²)dy + 2xy dx = cot x dx (x ≠ 0); 9. x dy/dx + y − x + xy cot x = 0 (x ≠ 0); 10. (x + y)dy/dx = 1; 11. y dx + (x − y²)dy = 0; 12. (x + 3y²)dy/dx = y (y > 0). For 13 to 15, find a particular solution: 13. dy/dx + 2y tan x = sin x; y = 0 when x = π/3; 14. (1 + x²)dy/dx + 2xy = 1/(1 + x²); y = 0 when x = 1; 15. dy/dx − 3y cot x = sin 2x; y = 2 when x = π/2. 16. Curve through origin with slope x + y. 17. Curve through (0, 2) with x + y exceeding slope by 5. 18. IF of x dy/dx − y = 2x² is (A) e⁻ˣ (B) e⁻ʸ (C) 1/x (D) x. 19. IF of (1 − y²)dx/dy + yx = ay (−1 < y < 1) is (A) 1/(y² − 1) (B) 1/√(y² − 1) (C) 1/(1 − y²) (D) 1/√(1 − y²).", "page": 29, "endPage": 29, "title": "NCERT Exercise 9.5 · Question 1", "conceptIdx": 4, "steps": ["Q1: IF = e^{2x}; y e^{2x} = ∫e^{2x}sin x dx = e^{2x}(2sin x − cos x)/5 + C. Q2: IF = e^{3x}; y e^{3x} = eˣ + C. Q3: IF = x; xy = x⁴/4 + C.", "Q4: IF = sec x + tan x; y(sec x + tan x) = sec x + tan x − x + C. Q5: dy/dx + y sec²x = tan x sec²x, IF = e^{tan x}; y e^{tan x} = e^{tan x}(tan x − 1) + C. Q6: dy/dx + (2/x)y = x log x, IF = x²; yx² = x⁴(4log x − 1)/16 + C.", "Q7: dy/dx + y/(x log x) = 2/x², IF = log x; y log x = −(2/x)(1 + log x) + C. Q8: IF = 1 + x²; y(1 + x²) = log|sin x| + C. Q9: dy/dx + (1/x + cot x)y = 1, IF = x sin x; xy sin x = sin x − x cos x + C. Q10: dx/dy − x = y, IF = e^{−y}; x = Ce^y − y − 1.", "Q11: dx/dy + x/y = y, IF = y; x = y²/3 + C/y. Q12: dx/dy − x/y = 3y, IF = 1/y; x = 3y² + Cy. Q13: IF = sec²x; y sec²x = sec x − 2, i.e. y = cos x − 2cos²x. Q14: IF = 1 + x²; y(1 + x²) = tan⁻¹x + C, and y(1) = 0 gives C = −π/4. Q15: IF = sin⁻³x; y = 4sin³x − 2sin²x. Q16: dy/dx − y = x gives y = eˣ − x − 1. Q17: dy/dx − y = x − 5 gives y = 4 − x − 2eˣ. Q18: (C) 1/x. Q19: (D) 1/√(1 − y²)."], "answer": "Q1: y = (2sin x − cos x)/5 + Ce^{−2x}; Q2: y = e^{−2x} + Ce^{−3x}; Q3: y = x³/4 + C/x; Q4: y(sec x + tan x) = sec x + tan x − x + C; Q5: y = tan x − 1 + Ce^{−tan x}; Q6: y = x²(4log x − 1)/16 + C/x²; Q7: y log x = −(2/x)(1 + log x) + C; Q8: y(1 + x²) = log|sin x| + C; Q9: xy sin x = sin x − x cos x + C; Q10: x = Ce^y − y − 1; Q11: x = y²/3 + C/y; Q12: x = 3y² + Cy; Q13: y = cos x − 2cos²x; Q14: y(1 + x²) = tan⁻¹x − π/4; Q15: y = 4sin³x − 2sin²x; Q16: y = eˣ − x − 1; Q17: y = 4 − x − 2eˣ; Q18: (C); Q19: (D)."}, {"number": "Misc.1", "exercise": "Misc", "question": "For each differential equation, indicate its order and degree (if defined). (i) d²y/dx² + 5x(dy/dx)² − 6y = log x (ii) (dy/dx)³ − 4(dy/dx)² + 7y = sin x (iii) d⁴y/dx⁴ − sin(d³y/dx³) = 0", "page": 34, "endPage": 34, "title": "NCERT Exercise Misc · Question 1", "conceptIdx": 0, "steps": ["(i) Highest derivative d²y/dx² to power 1: order 2, degree 1.", "(ii) Highest derivative dy/dx, highest power 3: order 1, degree 3.", "(iii) Highest derivative d⁴y/dx⁴, but sin(d³y/dx³) is non-polynomial: order 4, degree not defined."], "answer": "(i) order 2, degree 1; (ii) order 1, degree 3; (iii) order 4, degree not defined."}, {"number": "Misc.2", "exercise": "Misc", "question": "Verify that the given function is a solution of the corresponding differential equation. (i) xy = aeˣ + be⁻ˣ + x² : x d²y/dx² + 2dy/dx − xy + x² − 2 = 0; (ii) y = eˣ(a cos x + b sin x) : d²y/dx² − 2dy/dx + 2y = 0; (iii) y = x sin 3x : d²y/dx² + 9y − 6cos 3x = 0; (iv) x² = 2y² log y : (x² + y²)dy/dx − xy = 0", "page": 35, "endPage": 35, "title": "NCERT Exercise Misc · Question 2", "conceptIdx": 0, "steps": ["(i) xy′ + y = aeˣ − be⁻ˣ + 2x and xy″ + 2y′ = aeˣ + be⁻ˣ + 2 = (xy − x²) + 2, giving the equation. (ii) With u = a cos x + b sin x, y′ = y + eˣu′ and y″ = y′ + eˣu′ − eˣu, so y″ − 2y′ + 2y = 0.", "(iii) y′ = sin 3x + 3x cos 3x, y″ = 6cos 3x − 9x sin 3x = 6cos 3x − 9y. (iv) 2x = 2yy′(2log y + 1) and log y = x²/(2y²) give xy = y′(x² + y²)."], "answer": "All four functions verified as solutions."}, {"number": "Misc.3", "exercise": "Misc", "question": "Prove that x² − y² = c(x² + y²)² is the general solution of (x³ − 3xy²)dx = (y³ − 3x²y)dy, where c is a parameter.", "page": 35, "endPage": 35, "title": "NCERT Exercise Misc · Question 3", "conceptIdx": 0, "steps": ["Differentiate x² − y² = c(x² + y²)²: x − yy′ = 2c(x² + y²)(x + yy′).", "Substitute c = (x² − y²)/(x² + y²)²: (x − yy′)(x² + y²) = 2(x² − y²)(x + yy′).", "Expanding and collecting gives (x³ − 3xy²) + (3x²y − y³)y′ = 0, i.e. the given equation. One constant for a first-order equation: general solution."], "answer": "Proved: differentiating and eliminating c yields (x³ − 3xy²)dx = (y³ − 3x²y)dy."}, {"number": "Misc.4", "exercise": "Misc", "question": "Find the general solution of the differential equation dy/dx + √((1 − y²)/(1 − x²)) = 0.", "page": 35, "endPage": 35, "title": "NCERT Exercise Misc · Question 4", "conceptIdx": 0, "steps": ["Separate: dy/√(1 − y²) + dx/√(1 − x²) = 0.", "Integrate: sin⁻¹y + sin⁻¹x = C."], "answer": "sin⁻¹x + sin⁻¹y = C."}, {"number": "Misc.5", "exercise": "Misc", "question": "Show that the general solution of dy/dx + (y² + y + 1)/(x² + x + 1) = 0 is given by (x + y + 1) = A(1 − x − y − 2xy), where A is parameter.", "page": 35, "endPage": 35, "title": "NCERT Exercise Misc · Question 5", "conceptIdx": 0, "steps": ["Differentiate (x + y + 1) = A(1 − x − y − 2xy): (1 + y′)v = −u(1 + y′ + 2y + 2xy′), where u = x + y + 1, v = 1 − x − y − 2xy.", "Collecting y′: y′[(1 − xy) + x(x + y + 1)] + [(1 − xy) + y(x + y + 1)] = 0.", "Since (1 − xy) + x(x + y + 1) = x² + x + 1 and (1 − xy) + y(x + y + 1) = y² + y + 1, this is (x² + x + 1)y′ + (y² + y + 1) = 0."], "answer": "Shown: elimination of A gives dy/dx + (y² + y + 1)/(x² + x + 1) = 0."}, {"number": "Misc.6", "exercise": "Misc", "question": "Find the equation of the curve passing through the point (0, π/4) whose differential equation is sin x cos y dx + cos x sin y dy = 0.", "page": 35, "endPage": 35, "title": "NCERT Exercise Misc · Question 6", "conceptIdx": 0, "steps": ["Divide by cos x cos y: tan x dx + tan y dy = 0.", "Integrate: log|sec x| + log|sec y| = log C, i.e. sec x sec y = C; through (0, π/4): C = √2."], "answer": "cos x cos y = 1/√2."}, {"number": "Misc.7", "exercise": "Misc", "question": "Find the particular solution of (1 + e^{2x})dy + (1 + y²)eˣ dx = 0, given that y = 1 when x = 0.", "page": 35, "endPage": 35, "title": "NCERT Exercise Misc · Question 7", "conceptIdx": 0, "steps": ["Separate: dy/(1 + y²) + eˣdx/(1 + e^{2x}) = 0.", "Integrate: tan⁻¹y + tan⁻¹(eˣ) = C; y = 1 at x = 0 gives C = π/4 + π/4 = π/2."], "answer": "tan⁻¹y + tan⁻¹(eˣ) = π/2."}, {"number": "Misc.8", "exercise": "Misc", "question": "Solve y e^{x/y} dx = (x e^{x/y} + y²) dy (y ≠ 0).", "page": 35, "endPage": 35, "title": "NCERT Exercise Misc · Question 8", "conceptIdx": 0, "steps": ["Homogeneous: dx/dy = x/y + y e^{−x/y}; put x = vy, so v + y dv/dy = v + y e^{−v}.", "Hence e^v dv = dy; integrating gives e^v = y + C."], "answer": "e^{x/y} = y + C."}, {"number": "Misc.9", "exercise": "Misc", "question": "Find a particular solution of (x − y)(dx + dy) = dx − dy, given that y = −1 when x = 0. (Hint: put x − y = t)", "page": 36, "endPage": 36, "title": "NCERT Exercise Misc · Question 9", "conceptIdx": 0, "steps": ["Put t = x − y, so dt = dx − dy and dx + dy = 2dx − dt; then t(2dx − dt) = dt, i.e. 2dx = (1 + 1/t)dt.", "Integrate: 2x = t + log|t| + C = (x − y) + log|x − y| + C; (0, −1) gives 0 = 1 + 0 + C, so C = −1."], "answer": "log|x − y| = x + y + 1."}, {"number": "Misc.10", "exercise": "Misc", "question": "Solve [(e^{−2√x})/√x − y/√x] dx/dy = 1 (x ≠ 0).", "page": 36, "endPage": 36, "title": "NCERT Exercise Misc · Question 10", "conceptIdx": 0, "steps": ["Rewrite as dy/dx + y/√x = e^{−2√x}/√x, linear in y.", "IF = e^{∫dx/√x} = e^{2√x}; y e^{2√x} = ∫dx/√x + C = 2√x + C."], "answer": "y e^{2√x} = 2√x + C."}, {"number": "Misc.11", "exercise": "Misc", "question": "Find a particular solution of dy/dx + y cot x = 4x cosec x (x ≠ 0), given that y = 0 when x = π/2.", "page": 36, "endPage": 36, "title": "NCERT Exercise Misc · Question 11", "conceptIdx": 0, "steps": ["IF = e^{∫cot x dx} = sin x; y sin x = ∫4x dx + C = 2x² + C.", "y = 0 at x = π/2 gives C = −π²/2."], "answer": "y sin x = 2x² − π²/2."}, {"number": "Misc.12", "exercise": "Misc", "question": "Find a particular solution of (x + 1) dy/dx = 2e^{−y} − 1, given that y = 0 when x = 0.", "page": 36, "endPage": 36, "title": "NCERT Exercise Misc · Question 12", "conceptIdx": 0, "steps": ["Separate: e^y dy/(2 − e^y) = dx/(x + 1).", "Integrate: −log|2 − e^y| = log|x + 1| + C, i.e. (2 − e^y)(x + 1) = C′; (0, 0) gives C′ = 1."], "answer": "(2 − e^y)(x + 1) = 1."}, {"number": "Misc.13", "exercise": "Misc", "question": "The general solution of (y dx − x dy)/y = 0 is (A) xy = C (B) x = Cy² (C) y = Cx (D) y = Cx²", "page": 36, "endPage": 36, "title": "NCERT Exercise Misc · Question 13", "conceptIdx": 0, "steps": ["(y dx − x dy)/y² = 0 is d(x/y) = 0, so x/y = const.", "Hence y = Cx."], "answer": "(C) y = Cx"}, {"number": "Misc.14", "exercise": "Misc", "question": "The general solution of dx/dy + P₁x = Q₁ is (A) y e^{∫P₁dy} = ∫(Q₁ e^{∫P₁dy})dy + C (B) y e^{∫P₁dx} = ∫(Q₁ e^{∫P₁dx})dx + C (C) x e^{∫P₁dy} = ∫(Q₁ e^{∫P₁dy})dy + C (D) x e^{∫P₁dx} = ∫(Q₁ e^{∫P₁dx})dx + C", "page": 36, "endPage": 36, "title": "NCERT Exercise Misc · Question 14", "conceptIdx": 0, "steps": ["For dx/dy + P₁x = Q₁, IF = e^{∫P₁dy} (integration in y).", "Solution: x · (IF) = ∫(Q₁ · IF)dy + C."], "answer": "(C) x e^{∫P₁dy} = ∫(Q₁ e^{∫P₁dy})dy + C"}, {"number": "Misc.15", "exercise": "Misc", "question": "The general solution of eˣ dy + (y eˣ + 2x) dx = 0 is (A) x e^y + x² = C (B) x e^y + y² = C (C) y eˣ + x² = C (D) y e^y + x² = C", "page": 36, "endPage": 36, "title": "NCERT Exercise Misc · Question 15", "conceptIdx": 0, "steps": ["d(y eˣ) = eˣ dy + y eˣ dx, so the equation is d(y eˣ) + 2x dx = 0.", "Integrating: y eˣ + x² = C."], "answer": "(C) y eˣ + x² = C"}], "exerciseMap": [{"number": "9.1.1", "exercise": "9.1", "question": "3. (ds/dt)⁴ + 3s (d²s/dt²) = 0; 4. (d²y/dx²)² + cos(dy/dx) = 0; 5. d²y/dx² = cos3x + sin3x; 6. (y‴)² + (y″)³ + (y′)⁴ + y⁵ = 0; 7. y‴ + 2y″ + y′ = 0; 8. y′ + y = eˣ; 9. y″ + (y′)² + 2y = 0; 10. y″ + 2y′ + sin y = 0; 11. The degree of (d²y/dx²)³ + (dy/dx)² + sin(dy/dx) + 1 = 0 is (A) 3 (B) 2 (C) 1 (D) not defined; 12. The order of 2x² (d²y/dx²) − 3(dy/dx) + y = 0 is (A) 2 (B) 1 (C) 0 (D) not defined. (Determine order and degree, if defined, of the Exercise 9.1 equations 1 to 10.)", "page": 4, "endPage": 4, "title": "NCERT Exercise 9.1 · Question 1", "conceptIdx": 0, "steps": ["Q1 d⁴y/dx⁴ + sin(y‴) = 0 has order 4; sin of a derivative is non-polynomial, so degree not defined. Q2 y′ + 5y = 0 has order 1, degree 1.", "Q3 highest derivative is d²s/dt² (order 2), occurring to power 1, so degree 1. Q4 highest derivative is d²y/dx² (order 2), but cos(dy/dx) is non-polynomial, so degree not defined.", "Q5 d²y/dx² = cos3x + sin3x gives order 2, degree 1. Q6 highest derivative y‴ occurs as (y‴)², so order 3, degree 2. Q7 y‴ + 2y″ + y′ = 0 gives order 3, degree 1.", "Q8 y′ + y = eˣ gives order 1, degree 1. Q9 y″ + (y′)² + 2y = 0 gives order 2, degree 1. Q10 y″ + 2y′ + sin y = 0 is polynomial in derivatives (sin y involves only y), so order 2, degree 1. Q11 sin(dy/dx) makes it non-polynomial: (D) not defined. Q12 highest derivative d²y/dx²: order 2, (A)."], "answer": "1: order 4, degree not defined; 2: order 1, degree 1; 3: order 2, degree 1; 4: order 2, degree not defined; 5: order 2, degree 1; 6: order 3, degree 2; 7: order 3, degree 1; 8: order 1, degree 1; 9: order 2, degree 1; 10: order 2, degree 1; 11: (D) not defined; 12: (A) 2."}, {"number": "9.2.1", "exercise": "9.2", "question": "y = eˣ + 1 : y″ − y′ = 0", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 1", "conceptIdx": 1, "steps": ["Differentiate y = eˣ + 1: y′ = eˣ, and again y″ = eˣ.", "Hence y″ − y′ = eˣ − eˣ = 0."], "answer": "Verified: y = eˣ + 1 satisfies y″ − y′ = 0."}, {"number": "9.2.2", "exercise": "9.2", "question": "y = x² + 2x + C : y′ − 2x − 2 = 0", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 2", "conceptIdx": 1, "steps": ["Differentiate: y′ = 2x + 2.", "So y′ − 2x − 2 = (2x + 2) − 2x − 2 = 0."], "answer": "Verified: y = x² + 2x + C satisfies y′ − 2x − 2 = 0."}, {"number": "9.2.3", "exercise": "9.2", "question": "3. y = cos x + C : y′ + sin x = 0; 4. y = √(1 + x²) : y′ = xy/(1 + x²)", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 3", "conceptIdx": 1, "steps": ["Q3: y′ = −sin x, so y′ + sin x = 0.", "Q4: y² = 1 + x² gives 2yy′ = 2x, i.e. y′ = x/y = xy/y² = xy/(1 + x²)."], "answer": "Both verified: y′ + sin x = 0 and y′ = xy/(1 + x²)."}, {"number": "9.2.5", "exercise": "9.2", "question": "y = Ax : xy′ = y (x ≠ 0)", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 5", "conceptIdx": 1, "steps": ["y′ = A, so xy′ = Ax = y.", "Hence xy′ − y = 0 for x ≠ 0."], "answer": "Verified: y = Ax satisfies xy′ = y."}, {"number": "9.2.6", "exercise": "9.2", "question": "y = x sin x : xy′ = y + x√(x² − y²) (x ≠ 0 and x > y or x < −y)", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 6", "conceptIdx": 1, "steps": ["y′ = sin x + x cos x, so xy′ = x sin x + x²cos x = y + x²cos x.", "Since sin x = y/x, cos x = √(1 − y²/x²) = √(x² − y²)/x, giving xy′ = y + x√(x² − y²)."], "answer": "Verified: xy′ = y + x√(x² − y²)."}, {"number": "9.2.7", "exercise": "9.2", "question": "xy = log y + C : y′ = y²/(1 − xy) (xy ≠ 1)", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 7", "conceptIdx": 1, "steps": ["Differentiate xy = log y + C: y + xy′ = y′/y.", "Multiply by y: y² + xyy′ = y′, so y′(1 − xy) = y², i.e. y′ = y²/(1 − xy)."], "answer": "Verified: y′ = y²/(1 − xy)."}, {"number": "9.2.8", "exercise": "9.2", "question": "y − cos y = x : (y sin y + cos y + x) y′ = y", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 8", "conceptIdx": 1, "steps": ["Differentiate: y′ + y′ sin y = 1, so y′(1 + sin y) = 1.", "Since x = y − cos y, y sin y + cos y + x = y sin y + y = y(1 + sin y); multiplying by y′ gives y."], "answer": "Verified: (y sin y + cos y + x) y′ = y."}, {"number": "9.2.9", "exercise": "9.2", "question": "9. x + y = tan⁻¹y : y² y′ + y² + 1 = 0; 10. y = √(a² − x²), x ∈ (−a, a) : x + y dy/dx = 0 (y ≠ 0)", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 9", "conceptIdx": 1, "steps": ["Q9: 1 + y′ = y′/(1 + y²); multiplying by (1 + y²) gives 1 + y² + y′ + y²y′ = y′, i.e. y²y′ + y² + 1 = 0.", "Q10: y² = a² − x² gives 2yy′ = −2x, i.e. x + y dy/dx = 0."], "answer": "Both verified."}, {"number": "9.2.11", "exercise": "9.2", "question": "The number of arbitrary constants in the general solution of a differential equation of fourth order are: (A) 0 (B) 2 (C) 3 (D) 4", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 11", "conceptIdx": 1, "steps": ["The general solution of an order-n equation contains n arbitrary constants.", "For fourth order, n = 4."], "answer": "(D) 4"}, {"number": "9.2.12", "exercise": "9.2", "question": "The number of arbitrary constants in the particular solution of a differential equation of third order are: (A) 3 (B) 2 (C) 1 (D) 0", "page": 7, "endPage": 7, "title": "NCERT Exercise 9.2 · Question 12", "conceptIdx": 1, "steps": ["A particular solution is obtained by assigning fixed values to all arbitrary constants.", "Hence it contains no arbitrary constants."], "answer": "(D) 0"}, {"number": "9.3.1", "exercise": "9.3", "question": "1. dy/dx = (1 − cos x)/(1 + cos x); 2. dy/dx = √(4 − y²) (−2 < y < 2); 3. dy/dx + y = 1 (y ≠ 1)", "page": 11, "endPage": 11, "title": "NCERT Exercise 9.3 · Question 1", "conceptIdx": 2, "steps": ["Q1: (1 − cos x)/(1 + cos x) = tan²(x/2) = sec²(x/2) − 1, so y = 2tan(x/2) − x + C. Q2: dy/√(4 − y²) = dx gives sin⁻¹(y/2) = x + C, i.e. y = 2sin(x + C).", "Q3: dy/(1 − y) = dx gives −log|1 − y| = x + C, i.e. y = 1 + Ce⁻ˣ."], "answer": "Q1: y = 2tan(x/2) − x + C; Q2: y = 2sin(x + C); Q3: y = 1 + Ce⁻ˣ."}, {"number": "9.3.4", "exercise": "9.3", "question": "sec²x tan y dx + sec²y tan x dy = 0", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 4", "conceptIdx": 2, "steps": ["sec²x/tan x dx + sec²y/tan y dy = 0 integrates to log|tan x| + log|tan y| = log C.", "dy/(1 + y²) = (1 + x²)dx integrates to tan⁻¹y = x + x³/3 + C."], "answer": "tan x tan y = C; tan⁻¹y = x + x³/3 + C."}, {"number": "9.3.5", "exercise": "9.3", "question": "(eˣ + e⁻ˣ) dy − (eˣ − e⁻ˣ) dx = 0; 6. dy/dx = (1 + x²)(1 + y²)", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 5", "conceptIdx": 2, "steps": ["dy = (eˣ − e⁻ˣ)/(eˣ + e⁻ˣ) dx, and the numerator is the derivative of the denominator: y = log|eˣ + e⁻ˣ| + C.", "dy/y⁵ = −dx/x⁵ gives −1/(4y⁴) = 1/(4x⁴) + C, i.e. x⁻⁴ + y⁻⁴ = C."], "answer": "y = log|eˣ + e⁻ˣ| + C; x⁻⁴ + y⁻⁴ = C."}, {"number": "9.3.7", "exercise": "9.3", "question": "y log y dx − x dy = 0; 8. x⁵ dy/dx = −y⁵; 9. dy/dx = sin⁻¹x", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 7", "conceptIdx": 2, "steps": ["Q7: dx/x = dy/(y log y) gives log|x| = log|log y| + C, i.e. y = e^{Cx}. Q8: x⁻⁴ + y⁻⁴ = C (as above).", "Q9: y = ∫sin⁻¹x dx = x sin⁻¹x + √(1 − x²) + C."], "answer": "Q7: y = e^{Cx}; Q8: x⁻⁴ + y⁻⁴ = C; Q9: y = x sin⁻¹x + √(1 − x²) + C."}, {"number": "9.3.10", "exercise": "9.3", "question": "eˣ tan y dx + (1 − eˣ) sec²y dy = 0. For Exercises 11 to 14, find a particular solution satisfying the given condition: 11. (x³ + x² + x + 1) dy/dx = 2x² + x; y = 1 when x = 0", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 10", "conceptIdx": 2, "steps": ["Q10: eˣ/(1 − eˣ) dx + sec²y/tan y dy = 0 gives −log|1 − eˣ| + log|tan y| = log C, i.e. tan y = C(1 − eˣ).", "Q11: y′ = x(2x + 1)/[(x + 1)(x² + 1)] = (1/2)/(x + 1) + [(3/2)x − 1/2]/(x² + 1) by partial fractions.", "Integrating: y = (1/2)log|x + 1| + (3/4)log(x² + 1) − (1/2)tan⁻¹x + C; y(0) = 1 gives C = 1."], "answer": "Q10: tan y = C(1 − eˣ); Q11: y = (1/2)log|x + 1| + (3/4)log(x² + 1) − (1/2)tan⁻¹x + 1."}, {"number": "9.3.11", "exercise": "9.3", "question": "(x³ + x² + x + 1) dy/dx = 2x² + x; y = 1 when x = 0. 12. x(x² − 1) dy/dx = 1; y = 0 when x = 2. 13. cos(dy/dx) = a (a ∈ R); y = 1 when x = 0", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 11", "conceptIdx": 2, "steps": ["Q11: as above, y = (1/2)log|x + 1| + (3/4)log(x² + 1) − (1/2)tan⁻¹x + 1.", "Q12: dy = dx/[x(x² − 1)] = [−1/x + (1/2)/(x − 1) + (1/2)/(x + 1)]dx; y = (1/2)log|(x² − 1)/x²| + C, and y(2) = 0 gives C = (1/2)log(4/3).", "Q13: dy/dx = cos⁻¹a, so y = x cos⁻¹a + C; y(0) = 1 gives C = 1."], "answer": "Q11: y = (1/2)log|x + 1| + (3/4)log(x² + 1) − (1/2)tan⁻¹x + 1; Q12: y = (1/2)log|4(x² − 1)/(3x²)|; Q13: y = x cos⁻¹a + 1."}, {"number": "9.3.14", "exercise": "9.3", "question": "dy/dx = y tan x; y = 1 when x = 0", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 14", "conceptIdx": 2, "steps": ["dy/y = tan x dx gives log|y| = log|sec x| + C, i.e. y = C sec x.", "y(0) = 1 gives C = 1."], "answer": "y = sec x."}, {"number": "9.3.15", "exercise": "9.3", "question": "Find the equation of a curve passing through the point (0, 0) and whose differential equation is y′ = eˣ sin x.", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 15", "conceptIdx": 2, "steps": ["y = ∫eˣ sin x dx = eˣ(sin x − cos x)/2 + C.", "Passing through (0, 0): 0 = −1/2 + C, so C = 1/2."], "answer": "y = (eˣ(sin x − cos x) + 1)/2."}, {"number": "9.3.16", "exercise": "9.3", "question": "For the differential equation xy dy/dx = (x + 2)(y + 2), find the solution curve passing through the point (1, −1).", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 16", "conceptIdx": 2, "steps": ["Separate: y dy/(y + 2) = (x + 2)dx/x, i.e. [1 − 2/(y + 2)]dy = [1 + 2/x]dx.", "Integrate: y − 2log|y + 2| = x + 2log|x| + C; through (1, −1): −1 = 1 + C, so C = −2."], "answer": "y − 2log|y + 2| = x + 2log|x| − 2."}, {"number": "9.3.17", "exercise": "9.3", "question": "Find the equation of a curve passing through the point (0, −2) given that at any point (x, y) on the curve, the product of the slope of its tangent and y coordinate of the point is equal to the x coordinate of the point.", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 17", "conceptIdx": 2, "steps": ["Condition: y · dy/dx = x, i.e. y dy = x dx.", "Integrate: y² = x² + C; through (0, −2): C = 4."], "answer": "y² = x² + 4."}, {"number": "9.3.18", "exercise": "9.3", "question": "At any point (x, y) of a curve, the slope of the tangent is twice the slope of the line segment joining the point of contact to the point (−4, −3). Find the equation of the curve given that it passes through (−2, 1).", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 18", "conceptIdx": 2, "steps": ["dy/dx = 2(y + 3)/(x + 4), so dy/(y + 3) = 2dx/(x + 4).", "Integrate: log|y + 3| = 2log|x + 4| + log C, i.e. y + 3 = C(x + 4)²; through (−2, 1): 4 = 4C, so C = 1."], "answer": "y + 3 = (x + 4)²."}, {"number": "9.3.19", "exercise": "9.3", "question": "The volume of spherical balloon being inflated changes at a constant rate. If initially its radius is 3 units and after 3 seconds it is 6 units. Find the radius of balloon after t seconds.", "page": 12, "endPage": 12, "title": "NCERT Exercise 9.3 · Question 19", "conceptIdx": 2, "steps": ["dV/dt = k with V = (4/3)πr³ gives 4πr² dr = k dt, so (4/3)πr³ = kt + C.", "r = 3 at t = 0 gives C = 36π; r = 6 at t = 3 gives k = 84π; hence r³ = 63t + 27."], "answer": "r = (63t + 27)^{1/3} units."}, {"number": "9.3.20", "exercise": "9.3", "question": "In a bank, principal increases continuously at the rate of r% per year. Find the value of r if Rs 100 double itself in 10 years (log_e2 = 0.6931).", "page": 13, "endPage": 13, "title": "NCERT Exercise 9.3 · Question 20", "conceptIdx": 2, "steps": ["dP/dt = (r/100)P gives P = 100e^{rt/100} (P = 100 at t = 0).", "Doubling in 10 years: 2 = e^{r/10}, so r = 10log_e2 = 6.931."], "answer": "r = 6.931% per year."}, {"number": "9.3.21", "exercise": "9.3", "question": "In a bank, principal increases continuously at the rate of 5% per year. An amount of Rs 1000 is deposited with this bank, how much will it worth after 10 years (e^{0.5} = 1.648).", "page": 13, "endPage": 13, "title": "NCERT Exercise 9.3 · Question 21", "conceptIdx": 2, "steps": ["P = 1000e^{0.05t}.", "At t = 10: P = 1000e^{0.5} = 1000 × 1.648 = 1648."], "answer": "Rs 1648."}, {"number": "9.3.22", "exercise": "9.3", "question": "In a culture, the bacteria count is 1,00,000. The number is increased by 10% in 2 hours. In how many hours will the count reach 2,00,000, if the rate of growth of bacteria is proportional to the number present?", "page": 13, "endPage": 13, "title": "NCERT Exercise 9.3 · Question 22", "conceptIdx": 2, "steps": ["dN/dt = kN gives N = 100000e^{kt}; 10% growth in 2 h gives e^{2k} = 1.1.", "N = 200000 when e^{kt} = 2, so t = log2/k = 2log2/log1.1 ≈ 14.5."], "answer": "About 14.5 hours."}, {"number": "9.3.23", "exercise": "9.3", "question": "The general solution of the differential equation dy/dx = e^{x+y} is (A) eˣ + e⁻ʸ = C (B) eˣ + eʸ = C (C) e⁻ˣ + eʸ = C (D) e⁻ˣ + e⁻ʸ = C", "page": 13, "endPage": 13, "title": "NCERT Exercise 9.3 · Question 23", "conceptIdx": 2, "steps": ["dy/dx = eˣeʸ separates as e⁻ʸ dy = eˣ dx.", "Integrating: −e⁻ʸ = eˣ + C, i.e. eˣ + e⁻ʸ = C′."], "answer": "(A) eˣ + e⁻ʸ = C"}, {"number": "9.4.1", "exercise": "9.4", "question": "(x² + xy) dy = (x² + y²) dx; 2. y′ = (x + y)/x", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 1", "conceptIdx": 3, "steps": ["Q1 is homogeneous: dy/dx = (1 + v²)/(1 + v) with y = vx, so x dv/dx = (1 − v)/(1 + v). Separating gives (1 + v)/(1 − v) dv = dx/x; Q2: y = vx gives v + x dv/dx = 1 + v, so dv = dx/x.", "Q1 integrates to −v − 2log|1 − v| = log|x| + C. Q2 integrates to v = log|x| + C.", "Replace v = y/x."], "answer": "Q1: −y/x − 2log|1 − y/x| = log|x| + C; Q2: y = x log|x| + Cx."}, {"number": "9.4.3", "exercise": "9.4", "question": "(x − y) dy − (x + y) dx = 0", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 3", "conceptIdx": 3, "steps": ["Homogeneous: dy/dx = (1 + v)/(1 − v) with y = vx, so x dv/dx = (1 + v²)/(1 − v).", "Separating: (1 − v)/(1 + v²) dv = dx/x; integrating gives tan⁻¹v − (1/2)log(1 + v²) = log|x| + C.", "With v = y/x this simplifies to tan⁻¹(y/x) − (1/2)log(x² + y²) = C."], "answer": "tan⁻¹(y/x) = (1/2)log(x² + y²) + C."}, {"number": "9.4.4", "exercise": "9.4", "question": "(x² − y²) dx + 2xy dy = 0; 5. x² dy/dx = x² − 2y² + xy", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 4", "conceptIdx": 3, "steps": ["Q4: dy/dx = (v² − 1)/(2v) with y = vx, so x dv/dx = −(1 + v²)/(2v); 2v dv/(1 + v²) = −dx/x gives log(1 + v²) = −log|x| + log C.", "Q5: dy/dx = 1 − 2v² + v, so x dv/dx = 1 − 2v²; dv/(1 − 2v²) = dx/x integrates to (1/(2√2))log|(1 + √2 v)/(1 − √2 v)| = log|x| + C.", "Replace v = y/x."], "answer": "Q4: x² + y² = Cx; Q5: (1/(2√2))log|(x + √2 y)/(x − √2 y)| = log|x| + C."}, {"number": "9.4.6", "exercise": "9.4", "question": "6. x dy − y dx = √(x² + y²) dx; 7. {x cos(y/x) + y sin(y/x)}y dx = {y sin(y/x) − x cos(y/x)}x dy; 8. x dy/dx − y + x sin(y/x) = 0; 9. y dx + x log(y/x) dy − 2x dy = 0", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 6", "conceptIdx": 3, "steps": ["Q6: dy/dx = v + √(1 + v²), so dv/√(1 + v²) = dx/x; log|v + √(1 + v²)| = log|x| + C gives y + √(x² + y²) = Cx². Q7: with y = vx, x dv/dx = 2v cos v/(v sin v − cos v); (tan v − 1/v)dv = 2dx/x gives −log|cos v| − log|v| = 2log|x| + C, i.e. sec(y/x) = Cxy.", "Q8: dy/dx = v − sin v, so dv/sin v = −dx/x; log|tan(v/2)| = −log|x| + C, i.e. x tan(y/2x) = C. Q9: dx/dy = (2x − x log(x/y))/y; with x = vy, dv/[v(1 − log v)] = dy/y gives −log|1 − log v| = log|y| + C, i.e. y(1 − log(x/y)) = C."], "answer": "Q6: y + √(x² + y²) = Cx²; Q7: sec(y/x) = Cxy; Q8: x tan(y/2x) = C; Q9: y(1 − log(x/y)) = C."}, {"number": "9.4.10", "exercise": "9.4", "question": "10. (1 + e^{x/y})dx + e^{x/y}(1 − x/y)dy = 0. For each of the differential equations in Exercises from 11 to 15, find the particular solution satisfying the given condition:", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 10", "conceptIdx": 3, "steps": ["Q10 is homogeneous of degree 0. Put x = vy, so dx = v dy + y dv.", "Substituting gives dy(v + e^v) + y(1 + e^v)dv = 0, i.e. dy/y + (1 + e^v)/(v + e^v) dv = 0.", "Integrating: log|y| + log|v + e^v| = log C; with v = x/y this is y(x/y + e^{x/y}) = C."], "answer": "x + y e^{x/y} = C."}, {"number": "9.4.11", "exercise": "9.4", "question": "(x + y) dy + (x − y) dx = 0; y = 1 when x = 1", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 11", "conceptIdx": 3, "steps": ["dy/dx = (v − 1)/(v + 1) with y = vx, so x dv/dx = −(1 + v²)/(v + 1); (v + 1)/(1 + v²) dv = −dx/x.", "Integrating: tan⁻¹v + (1/2)log(1 + v²) = −log|x| + C, i.e. tan⁻¹(y/x) + (1/2)log(x² + y²) = C.", "y = 1 at x = 1 gives C = π/4 + (1/2)log 2."], "answer": "tan⁻¹(y/x) + (1/2)log(x² + y²) = π/4 + (1/2)log 2."}, {"number": "9.4.12", "exercise": "9.4", "question": "x² dy + (xy + y²) dx = 0; y = 1 when x = 1", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 12", "conceptIdx": 3, "steps": ["dy/dx = −(v + v²) with y = vx, so x dv/dx = −v(2 + v); dv/[v(v + 2)] = −dx/x.", "(1/2)log|v/(v + 2)| = −log|x| + C, i.e. x²y/(y + 2x) = C; y = 1 at x = 1 gives C = 1/3."], "answer": "3x²y = y + 2x."}, {"number": "9.4.13", "exercise": "9.4", "question": "13. [x sin²(y/x) − y]dx + x dy = 0; y = π/4 when x = 1", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 13", "conceptIdx": 3, "steps": ["dy/dx = v − sin²v with y = vx, so x dv/dx = −sin²v; dv/sin²v = −dx/x.", "−cot v = −log|x| + C, i.e. cot v = log|x| + C′; v = π/4 at x = 1 gives C′ = 1."], "answer": "cot(y/x) = log|ex|."}, {"number": "9.4.14", "exercise": "9.4", "question": "14. dy/dx − y/x + cosec(y/x) = 0; y = 0 when x = 1. 15. 2xy + y² − 2x² dy/dx = 0; y = 2 when x = 1", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 14", "conceptIdx": 3, "steps": ["Q14: dy/dx = v − cosec v, so sin v dv = −dx/x; −cos v = −log|x| + C, and v = 0 at x = 1 gives cos(y/x) = log|ex|.", "Q15: dy/dx = v + v²/2, so 2dv/v² = dx/x; −2/v = log|x| + C, i.e. −2x/y = log|x| + C, and (1, 2) gives C = −1."], "answer": "Q14: cos(y/x) = log|ex|; Q15: y = 2x/(1 − log|x|)."}, {"number": "9.4.16", "exercise": "9.4", "question": "A homogeneous differential equation of the form dx/dy = h(x/y) can be solved by making the substitution. (A) y = vx (B) v = yx (C) x = vy (D) x = v", "page": 22, "endPage": 22, "title": "NCERT Exercise 9.4 · Question 16", "conceptIdx": 3, "steps": ["Here x is the dependent variable and y the independent variable, with the ratio x/y.", "Put x = vy so that dx/dy = v + y dv/dy, which makes the equation separable."], "answer": "(C) x = vy"}, {"number": "9.4.17", "exercise": "9.4", "question": "Which of the following is a homogeneous differential equation? (A) (4x + 6y + 5) dy − (3y + 2x + 4) dx = 0 (B) (xy) dx − (x³ + y³) dy = 0 (C) (x³ + 2y²) dx + 2xy dy = 0 (D) y² dx + (x² − xy − y²) dy = 0", "page": 23, "endPage": 23, "title": "NCERT Exercise 9.4 · Question 17", "conceptIdx": 3, "steps": ["(A) has constant terms 5, 4, so not homogeneous. (B) mixes degrees 2 and 3. (C) mixes x³ with y², 2xy.", "(D) every term (y², x², xy) is homogeneous of degree 2."], "answer": "(D) y² dx + (x² − xy − y²) dy = 0"}, {"number": "9.5.1", "exercise": "9.5", "question": "For Exercises 1 to 12, find the general solution: 1. dy/dx + 2y = sin x; 2. dy/dx + 3y = e^{−2x}; 3. dy/dx + y/x = x²; 4. dy/dx + (sec x)y = tan x (0 ≤ x < π/2); 5. cos²x dy/dx + y = tan x (0 ≤ x < π/2); 6. x dy/dx + 2y = x² log x; 7. x log x dy/dx + y = (2/x)log x; 8. (1 + x²)dy + 2xy dx = cot x dx (x ≠ 0); 9. x dy/dx + y − x + xy cot x = 0 (x ≠ 0); 10. (x + y)dy/dx = 1; 11. y dx + (x − y²)dy = 0; 12. (x + 3y²)dy/dx = y (y > 0). For 13 to 15, find a particular solution: 13. dy/dx + 2y tan x = sin x; y = 0 when x = π/3; 14. (1 + x²)dy/dx + 2xy = 1/(1 + x²); y = 0 when x = 1; 15. dy/dx − 3y cot x = sin 2x; y = 2 when x = π/2. 16. Curve through origin with slope x + y. 17. Curve through (0, 2) with x + y exceeding slope by 5. 18. IF of x dy/dx − y = 2x² is (A) e⁻ˣ (B) e⁻ʸ (C) 1/x (D) x. 19. IF of (1 − y²)dx/dy + yx = ay (−1 < y < 1) is (A) 1/(y² − 1) (B) 1/√(y² − 1) (C) 1/(1 − y²) (D) 1/√(1 − y²).", "page": 29, "endPage": 29, "title": "NCERT Exercise 9.5 · Question 1", "conceptIdx": 4, "steps": ["Q1: IF = e^{2x}; y e^{2x} = ∫e^{2x}sin x dx = e^{2x}(2sin x − cos x)/5 + C. Q2: IF = e^{3x}; y e^{3x} = eˣ + C. Q3: IF = x; xy = x⁴/4 + C.", "Q4: IF = sec x + tan x; y(sec x + tan x) = sec x + tan x − x + C. Q5: dy/dx + y sec²x = tan x sec²x, IF = e^{tan x}; y e^{tan x} = e^{tan x}(tan x − 1) + C. Q6: dy/dx + (2/x)y = x log x, IF = x²; yx² = x⁴(4log x − 1)/16 + C.", "Q7: dy/dx + y/(x log x) = 2/x², IF = log x; y log x = −(2/x)(1 + log x) + C. Q8: IF = 1 + x²; y(1 + x²) = log|sin x| + C. Q9: dy/dx + (1/x + cot x)y = 1, IF = x sin x; xy sin x = sin x − x cos x + C. Q10: dx/dy − x = y, IF = e^{−y}; x = Ce^y − y − 1.", "Q11: dx/dy + x/y = y, IF = y; x = y²/3 + C/y. Q12: dx/dy − x/y = 3y, IF = 1/y; x = 3y² + Cy. Q13: IF = sec²x; y sec²x = sec x − 2, i.e. y = cos x − 2cos²x. Q14: IF = 1 + x²; y(1 + x²) = tan⁻¹x + C, and y(1) = 0 gives C = −π/4. Q15: IF = sin⁻³x; y = 4sin³x − 2sin²x. Q16: dy/dx − y = x gives y = eˣ − x − 1. Q17: dy/dx − y = x − 5 gives y = 4 − x − 2eˣ. Q18: (C) 1/x. Q19: (D) 1/√(1 − y²)."], "answer": "Q1: y = (2sin x − cos x)/5 + Ce^{−2x}; Q2: y = e^{−2x} + Ce^{−3x}; Q3: y = x³/4 + C/x; Q4: y(sec x + tan x) = sec x + tan x − x + C; Q5: y = tan x − 1 + Ce^{−tan x}; Q6: y = x²(4log x − 1)/16 + C/x²; Q7: y log x = −(2/x)(1 + log x) + C; Q8: y(1 + x²) = log|sin x| + C; Q9: xy sin x = sin x − x cos x + C; Q10: x = Ce^y − y − 1; Q11: x = y²/3 + C/y; Q12: x = 3y² + Cy; Q13: y = cos x − 2cos²x; Q14: y(1 + x²) = tan⁻¹x − π/4; Q15: y = 4sin³x − 2sin²x; Q16: y = eˣ − x − 1; Q17: y = 4 − x − 2eˣ; Q18: (C); Q19: (D)."}, {"number": "Misc.1", "exercise": "Misc", "question": "For each differential equation, indicate its order and degree (if defined). (i) d²y/dx² + 5x(dy/dx)² − 6y = log x (ii) (dy/dx)³ − 4(dy/dx)² + 7y = sin x (iii) d⁴y/dx⁴ − sin(d³y/dx³) = 0", "page": 34, "endPage": 34, "title": "NCERT Exercise Misc · Question 1", "conceptIdx": 0, "steps": ["(i) Highest derivative d²y/dx² to power 1: order 2, degree 1.", "(ii) Highest derivative dy/dx, highest power 3: order 1, degree 3.", "(iii) Highest derivative d⁴y/dx⁴, but sin(d³y/dx³) is non-polynomial: order 4, degree not defined."], "answer": "(i) order 2, degree 1; (ii) order 1, degree 3; (iii) order 4, degree not defined."}, {"number": "Misc.2", "exercise": "Misc", "question": "Verify that the given function is a solution of the corresponding differential equation. (i) xy = aeˣ + be⁻ˣ + x² : x d²y/dx² + 2dy/dx − xy + x² − 2 = 0; (ii) y = eˣ(a cos x + b sin x) : d²y/dx² − 2dy/dx + 2y = 0; (iii) y = x sin 3x : d²y/dx² + 9y − 6cos 3x = 0; (iv) x² = 2y² log y : (x² + y²)dy/dx − xy = 0", "page": 35, "endPage": 35, "title": "NCERT Exercise Misc · Question 2", "conceptIdx": 0, "steps": ["(i) xy′ + y = aeˣ − be⁻ˣ + 2x and xy″ + 2y′ = aeˣ + be⁻ˣ + 2 = (xy − x²) + 2, giving the equation. (ii) With u = a cos x + b sin x, y′ = y + eˣu′ and y″ = y′ + eˣu′ − eˣu, so y″ − 2y′ + 2y = 0.", "(iii) y′ = sin 3x + 3x cos 3x, y″ = 6cos 3x − 9x sin 3x = 6cos 3x − 9y. (iv) 2x = 2yy′(2log y + 1) and log y = x²/(2y²) give xy = y′(x² + y²)."], "answer": "All four functions verified as solutions."}, {"number": "Misc.3", "exercise": "Misc", "question": "Prove that x² − y² = c(x² + y²)² is the general solution of (x³ − 3xy²)dx = (y³ − 3x²y)dy, where c is a parameter.", "page": 35, "endPage": 35, "title": "NCERT Exercise Misc · Question 3", "conceptIdx": 0, "steps": ["Differentiate x² − y² = c(x² + y²)²: x − yy′ = 2c(x² + y²)(x + yy′).", "Substitute c = (x² − y²)/(x² + y²)²: (x − yy′)(x² + y²) = 2(x² − y²)(x + yy′).", "Expanding and collecting gives (x³ − 3xy²) + (3x²y − y³)y′ = 0, i.e. the given equation. One constant for a first-order equation: general solution."], "answer": "Proved: differentiating and eliminating c yields (x³ − 3xy²)dx = (y³ − 3x²y)dy."}, {"number": "Misc.4", "exercise": "Misc", "question": "Find the general solution of the differential equation dy/dx + √((1 − y²)/(1 − x²)) = 0.", "page": 35, "endPage": 35, "title": "NCERT Exercise Misc · Question 4", "conceptIdx": 0, "steps": ["Separate: dy/√(1 − y²) + dx/√(1 − x²) = 0.", "Integrate: sin⁻¹y + sin⁻¹x = C."], "answer": "sin⁻¹x + sin⁻¹y = C."}, {"number": "Misc.5", "exercise": "Misc", "question": "Show that the general solution of dy/dx + (y² + y + 1)/(x² + x + 1) = 0 is given by (x + y + 1) = A(1 − x − y − 2xy), where A is parameter.", "page": 35, "endPage": 35, "title": "NCERT Exercise Misc · Question 5", "conceptIdx": 0, "steps": ["Differentiate (x + y + 1) = A(1 − x − y − 2xy): (1 + y′)v = −u(1 + y′ + 2y + 2xy′), where u = x + y + 1, v = 1 − x − y − 2xy.", "Collecting y′: y′[(1 − xy) + x(x + y + 1)] + [(1 − xy) + y(x + y + 1)] = 0.", "Since (1 − xy) + x(x + y + 1) = x² + x + 1 and (1 − xy) + y(x + y + 1) = y² + y + 1, this is (x² + x + 1)y′ + (y² + y + 1) = 0."], "answer": "Shown: elimination of A gives dy/dx + (y² + y + 1)/(x² + x + 1) = 0."}, {"number": "Misc.6", "exercise": "Misc", "question": "Find the equation of the curve passing through the point (0, π/4) whose differential equation is sin x cos y dx + cos x sin y dy = 0.", "page": 35, "endPage": 35, "title": "NCERT Exercise Misc · Question 6", "conceptIdx": 0, "steps": ["Divide by cos x cos y: tan x dx + tan y dy = 0.", "Integrate: log|sec x| + log|sec y| = log C, i.e. sec x sec y = C; through (0, π/4): C = √2."], "answer": "cos x cos y = 1/√2."}, {"number": "Misc.7", "exercise": "Misc", "question": "Find the particular solution of (1 + e^{2x})dy + (1 + y²)eˣ dx = 0, given that y = 1 when x = 0.", "page": 35, "endPage": 35, "title": "NCERT Exercise Misc · Question 7", "conceptIdx": 0, "steps": ["Separate: dy/(1 + y²) + eˣdx/(1 + e^{2x}) = 0.", "Integrate: tan⁻¹y + tan⁻¹(eˣ) = C; y = 1 at x = 0 gives C = π/4 + π/4 = π/2."], "answer": "tan⁻¹y + tan⁻¹(eˣ) = π/2."}, {"number": "Misc.8", "exercise": "Misc", "question": "Solve y e^{x/y} dx = (x e^{x/y} + y²) dy (y ≠ 0).", "page": 35, "endPage": 35, "title": "NCERT Exercise Misc · Question 8", "conceptIdx": 0, "steps": ["Homogeneous: dx/dy = x/y + y e^{−x/y}; put x = vy, so v + y dv/dy = v + y e^{−v}.", "Hence e^v dv = dy; integrating gives e^v = y + C."], "answer": "e^{x/y} = y + C."}, {"number": "Misc.9", "exercise": "Misc", "question": "Find a particular solution of (x − y)(dx + dy) = dx − dy, given that y = −1 when x = 0. (Hint: put x − y = t)", "page": 36, "endPage": 36, "title": "NCERT Exercise Misc · Question 9", "conceptIdx": 0, "steps": ["Put t = x − y, so dt = dx − dy and dx + dy = 2dx − dt; then t(2dx − dt) = dt, i.e. 2dx = (1 + 1/t)dt.", "Integrate: 2x = t + log|t| + C = (x − y) + log|x − y| + C; (0, −1) gives 0 = 1 + 0 + C, so C = −1."], "answer": "log|x − y| = x + y + 1."}, {"number": "Misc.10", "exercise": "Misc", "question": "Solve [(e^{−2√x})/√x − y/√x] dx/dy = 1 (x ≠ 0).", "page": 36, "endPage": 36, "title": "NCERT Exercise Misc · Question 10", "conceptIdx": 0, "steps": ["Rewrite as dy/dx + y/√x = e^{−2√x}/√x, linear in y.", "IF = e^{∫dx/√x} = e^{2√x}; y e^{2√x} = ∫dx/√x + C = 2√x + C."], "answer": "y e^{2√x} = 2√x + C."}, {"number": "Misc.11", "exercise": "Misc", "question": "Find a particular solution of dy/dx + y cot x = 4x cosec x (x ≠ 0), given that y = 0 when x = π/2.", "page": 36, "endPage": 36, "title": "NCERT Exercise Misc · Question 11", "conceptIdx": 0, "steps": ["IF = e^{∫cot x dx} = sin x; y sin x = ∫4x dx + C = 2x² + C.", "y = 0 at x = π/2 gives C = −π²/2."], "answer": "y sin x = 2x² − π²/2."}, {"number": "Misc.12", "exercise": "Misc", "question": "Find a particular solution of (x + 1) dy/dx = 2e^{−y} − 1, given that y = 0 when x = 0.", "page": 36, "endPage": 36, "title": "NCERT Exercise Misc · Question 12", "conceptIdx": 0, "steps": ["Separate: e^y dy/(2 − e^y) = dx/(x + 1).", "Integrate: −log|2 − e^y| = log|x + 1| + C, i.e. (2 − e^y)(x + 1) = C′; (0, 0) gives C′ = 1."], "answer": "(2 − e^y)(x + 1) = 1."}, {"number": "Misc.13", "exercise": "Misc", "question": "The general solution of (y dx − x dy)/y = 0 is (A) xy = C (B) x = Cy² (C) y = Cx (D) y = Cx²", "page": 36, "endPage": 36, "title": "NCERT Exercise Misc · Question 13", "conceptIdx": 0, "steps": ["(y dx − x dy)/y² = 0 is d(x/y) = 0, so x/y = const.", "Hence y = Cx."], "answer": "(C) y = Cx"}, {"number": "Misc.14", "exercise": "Misc", "question": "The general solution of dx/dy + P₁x = Q₁ is (A) y e^{∫P₁dy} = ∫(Q₁ e^{∫P₁dy})dy + C (B) y e^{∫P₁dx} = ∫(Q₁ e^{∫P₁dx})dx + C (C) x e^{∫P₁dy} = ∫(Q₁ e^{∫P₁dy})dy + C (D) x e^{∫P₁dx} = ∫(Q₁ e^{∫P₁dx})dx + C", "page": 36, "endPage": 36, "title": "NCERT Exercise Misc · Question 14", "conceptIdx": 0, "steps": ["For dx/dy + P₁x = Q₁, IF = e^{∫P₁dy} (integration in y).", "Solution: x · (IF) = ∫(Q₁ · IF)dy + C."], "answer": "(C) x e^{∫P₁dy} = ∫(Q₁ e^{∫P₁dy})dy + C"}, {"number": "Misc.15", "exercise": "Misc", "question": "The general solution of eˣ dy + (y eˣ + 2x) dx = 0 is (A) x e^y + x² = C (B) x e^y + y² = C (C) y eˣ + x² = C (D) y e^y + x² = C", "page": 36, "endPage": 36, "title": "NCERT Exercise Misc · Question 15", "conceptIdx": 0, "steps": ["d(y eˣ) = eˣ dy + y eˣ dx, so the equation is d(y eˣ) + 2x dx = 0.", "Integrating: y eˣ + x² = C."], "answer": "(C) y eˣ + x² = C"}], "pageOffset": 299, "printPageStart": 300, "printPageEnd": 337, "paginationProvenance": "chained-between-folio-reads"};</script>
  <script>(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp) disp.innerHTML = "t = <b>" + state.t.toFixed(1) + " s</b>";
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Concept View ---
  function renderConcept(idx){
    pause();
    state.conceptIndex = idx;
    state.t = 0;
    state.level = 0;

    var lessons = C.lessons || C.concepts || [];
    var l = lessons[idx];
    if(!l) return;
