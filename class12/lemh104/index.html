": "4.1.7", "exercise": "4.1", "question": "7. Find values of x, if (i) |2 4; 5 1| = |2x 4; 6 x| (ii) |2 3; 4 5| = |x 3; 2x 5|. 8. If |x 2; 18 x| = |6 2; 18 6|, then x is equal to (A) 6 (B) ±6 (C) −6 (D) 0.", "page": 7, "endPage": 7, "title": "NCERT Exercise 4.1 · Question 7", "conceptIdx": 0, "steps": ["7(i): 2 − 20 = 2x² − 24 ⇒ 2x² = 6 ⇒ x = ±√3.", "7(ii): 10 − 12 = 5x − 6x ⇒ −2 = −x ⇒ x = 2.", "Q8: x² − 36 = 36 − 36 = 0 ⇒ x² = 36 ⇒ x = ±6, option (B)."], "answer": "7(i) x = ±√3; 7(ii) x = 2; 8: (B) ±6."}, {"number": "4.2.1", "exercise": "4.2", "question": "Find area of the triangle with vertices at the point given in each of the following : (i) (1, 0), (6, 0), (4, 3) (ii) (2, 7), (1, 1), (10, 8) (iii) (–2, –3), (3, 2), (–1, –8)", "page": 8, "endPage": 8, "title": "NCERT Exercise 4.2 · Question 1", "conceptIdx": 1, "steps": ["(i) Δ = ½|1(0−3) + 6(3−0) + 4(0−0)| = ½×15 = 15/2.", "(ii) Δ = ½|2(1−8) + 1(8−7) + 10(7−1)| = ½×47 = 47/2.", "(iii) Δ = ½|(−2)(2+8) + 3(−8+3) + (−1)(−3−2)| = ½×|−30| = 15."], "answer": "(i) 15/2 sq units; (ii) 47/2 sq units; (iii) 15 sq units."}, {"number": "4.2.2", "exercise": "4.2", "question": "Show that points A (a, b + c), B (b, c + a), C (c, a + b) are collinear.", "page": 8, "endPage": 8, "title": "NCERT Exercise 4.2 · Question 2", "conceptIdx": 1, "steps": ["Area Δ = ½|a(c+a−a−b) + b(a+b−b−c) + c(b+c−c−a)|.", "= ½|a(c−b) + b(a−c) + c(b−a)| = ½×0 = 0.", "Zero area ⇒ the three points are collinear."], "answer": "Area = 0, so A, B, C are collinear."}, {"number": "4.2.3", "exercise": "4.2", "question": "Find values of k if area of triangle is 4 sq. units and vertices are (i) (k, 0), (4, 0), (0, 2) (ii) (–2, 0), (0, 4), (0, k)", "page": 8, "endPage": 8, "title": "NCERT Exercise 4.2 · Question 3", "conceptIdx": 1, "steps": ["(i) ½|k(0−2) + 4(2−0)| = 4 ⇒ |8 − 2k| = 8 ⇒ k = 0 or k = 8.", "(ii) ½|(−2)(4−k)| = 4 ⇒ |2k − 8| = 8 ⇒ k = 0 or k = 8."], "answer": "(i) k = 0, 8; (ii) k = 0, 8."}, {"number": "4.2.4", "exercise": "4.2", "question": "(i) Find equation of line joining (1, 2) and (3, 6) using determinants. (ii) Find equation of line joining (3, 1) and (9, 3) using determinants.", "page": 8, "endPage": 8, "title": "NCERT Exercise 4.2 · Question 4", "conceptIdx": 1, "steps": ["(i) |x y 1; 1 2 1; 3 6 1| = 0 ⇒ x(2−6) − y(1−3) + (6−6) = 0 ⇒ −4x + 2y = 0.", "(ii) |x y 1; 3 1 1; 9 3 1| = 0 ⇒ x(1−3) − y(3−9) + (9−9) = 0 ⇒ −2x + 6y = 0."], "answer": "(i) 2x − y = 0; (ii) x − 3y = 0."}, {"number": "4.2.5", "exercise": "4.2", "question": "If area of triangle is 35 sq units with vertices (2, – 6), (5, 4) and (k, 4). Then k is (A) 12 (B) –2 (C) –12, –2 (D) 12, –2", "page": 8, "endPage": 8, "title": "NCERT Exercise 4.2 · Question 5", "conceptIdx": 1, "steps": ["Δ = ½|2(4−4) + 5(4+6) + k(−6−4)| = ½|50 − 10k| = 35.", "|50 − 10k| = 70 ⇒ 50 − 10k = ±70 ⇒ k = −2 or k = 12."], "answer": "(D) 12, –2."}, {"number": "4.3.1", "exercise": "4.3", "question": "Write Minors and Cofactors of the elements of following determinants: 1. (i) |2 −4; 0 3| (ii) |a c; b d| 2. (i) |1 0 0; 0 1 0; 0 0 1| (ii) |1 0 4; 3 5 −4; 0 1 2|.", "page": 12, "endPage": 12, "title": "NCERT Exercise 4.3 · Question 1", "conceptIdx": 2, "steps": ["1(i): M11=3, M12=0, M21=−4, M22=2; A11=3, A12=0, A21=4, A22=2.", "1(ii): M11=d, M12=b, M21=c, M22=a; A11=d, A12=−b, A21=−c, A22=a.", "2(i) (identity): M11=M22=M33=1 with all other minors 0; A11=A22=A33=1 with all other cofactors 0.", "2(ii) minors: M11=14, M12=6, M13=3, M21=−4, M22=2, M23=1, M31=−20, M32=−16, M33=5.", "2(ii) cofactors: A11=14, A12=−6, A13=3, A21=4, A22=2, A23=−1, A31=−20, A32=16, A33=5."], "answer": "Minors and cofactors as listed in the steps."}, {"number": "4.3.3", "exercise": "4.3", "question": "Using Cofactors of elements of second row, evaluate Δ = |5 3 8; 2 0 1; 1 2 3|.", "page": 12, "endPage": 12, "title": "NCERT Exercise 4.3 · Question 3", "conceptIdx": 2, "steps": ["M21 = 9−16 = −7 so A21 = 7; M22 = 15−8 = 7 so A22 = 7; M23 = 10−3 = 7 so A23 = −7.", "Δ = 2×7 + 0×7 + 1×(−7) = 14 − 7 = 7."], "answer": "7."}, {"number": "4.3.4", "exercise": "4.3", "question": "Using Cofactors of elements of third column, evaluate Δ = |1 x yz; 1 y zx; 1 z xy|.", "page": 12, "endPage": 12, "title": "NCERT Exercise 4.3 · Question 4", "conceptIdx": 2, "steps": ["A13 = +(z−y), A23 = −(z−x) = x−z, A33 = +(y−x).", "Δ = yz(z−y) + zx(x−z) + xy(y−x) = (x−y)(y−z)(z−x)."], "answer": "(x − y)(y − z)(z − x)."}, {"number": "4.3.5", "exercise": "4.3", "question": "If Δ = |a11 a12 a13; a21 a22 a23; a31 a32 a33| and Aij is Cofactor of aij, then value of Δ is given by (A) a11A31 + a12A32 + a13A33 (B) a11A11 + a12A21 + a13A31 (C) a21A11 + a22A12 + a23A13 (D) a11A11 + a21A21 + a31A31.", "page": 12, "endPage": 12, "title": "NCERT Exercise 4.3 · Question 5", "conceptIdx": 2, "steps": ["Δ equals the sum of products of elements of any single row (or column) with their own cofactors.", "Only (D) is a single-column expansion (first column); (A) and (C) mix two rows and (B) mixes two columns, each giving 0."], "answer": "(D) a11A11 + a21A21 + a31A31."}, {"number": "4.4.1", "exercise": "4.4", "question": "Find adjoint of each of the matrices in Exercises 1 and 2. 1. [1 2; 3 4] 2. [1 −1 2; 2 3 5; −2 0 1].", "page": 17, "endPage": 17, "title": "NCERT Exercise 4.4 · Question 1", "conceptIdx": 3, "steps": ["Q1: A11=4, A12=−3, A21=−2, A22=1, so adj A = [4 −2; −3 1].", "Q2 cofactors: A11=3, A12=−12, A13=6, A21=1, A22=5, A23=2, A31=−11, A32=−1, A33=5 (and |A| = 27).", "adj A = transpose of the cofactor matrix = [3 1 −11; −12 5 −1; 6 2 5]."], "answer": "Q1: adj A = [4 −2; −3 1]; Q2: adj A = [3 1 −11; −12 5 −1; 6 2 5]."}, {"number": "4.4.4", "exercise": "4.4", "question": "4. Verify A(adj A) = (adj A)A = |A|I for A = [1 −1 2; 3 0 −2; 1 0 3].", "page": 18, "endPage": 18, "title": "NCERT Exercise 4.4 · Question 4", "conceptIdx": 3, "steps": ["|A| = 1(0+0) + 1(9+2) + 2(0−0) = 11.", "Cofactors give adj A = [0 3 2; −11 1 8; 0 −1 3].", "Direct multiplication: A(adj A) = (adj A)A = 11I = |A|I."], "answer": "Verified; |A| = 11."}, {"number": "4.5.1", "exercise": "4.5", "question": "1. Examine the consistency of the system: x + 2y = 2; 2x + 3y = 3.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 1", "conceptIdx": 4, "steps": ["|A| = 3 − 4 = −1 ≠ 0, so the system has a unique solution.", "Solving gives x = 0, y = 1 (0+2 = 2, 0+3 = 3)."], "answer": "Consistent; x = 0, y = 1."}, {"number": "4.5.2", "exercise": "4.5", "question": "2. Examine the consistency of the system: 2x − y = 5; x + y = 4.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 2", "conceptIdx": 4, "steps": ["|A| = 2 + 1 = 3 ≠ 0, so the system has a unique solution.", "Solving gives x = 3, y = 1 (6−1 = 5, 3+1 = 4)."], "answer": "Consistent; x = 3, y = 1."}, {"number": "4.5.3", "exercise": "4.5", "question": "3. Examine the consistency of the system: x + 3y = 5; 2x + 6y = 8.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 3", "conceptIdx": 4, "steps": ["|A| = 6 − 6 = 0, so check consistency: 2×(first equation) gives 2x + 6y = 10 ≠ 8.", "Hence no solution exists."], "answer": "Inconsistent; no solution."}, {"number": "4.5.4", "exercise": "4.5", "question": "4. Examine the consistency of the system: x + y + z = 1; 2x + 3y + 2z = 2; ax + ay + 2az = 4.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 4", "conceptIdx": 4, "steps": ["|A| = 1(6a−2a) − 1(4a−2a) + 1(2a−3a) = a.", "If a ≠ 0 the system has a unique solution; if a = 0 the third equation reads 0 = 4."], "answer": "Consistent with unique solution iff a ≠ 0; inconsistent if a = 0."}, {"number": "4.5.5", "exercise": "4.5", "question": "5. Examine the consistency of the system: 3x − y − 2z = 2; 2y − z = −1; 3x − 5y = 3.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 5", "conceptIdx": 4, "steps": ["|A| = 3(0−5) + 1(0+3) − 2(0−6) = −15 + 3 + 12 = 0.", "(first equation) − (third) gives 4y − 2z = −1, but 2×(second) gives 4y − 2z = −2: contradiction."], "answer": "Inconsistent; no solution."}, {"number": "4.5.6", "exercise": "4.5", "question": "6. Examine the consistency of the system: 5x − y + 4z = 5; 2x + 3y + 5z = 2; 5x − 2y + 6z = −1.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 6", "conceptIdx": 4, "steps": ["|A| = 5(18+10) + 1(12−25) + 4(−4−15) = 140 − 13 −76 = 51 ≠ 0.", "Hence consistent with a unique solution: x = 3, y = 2, z = −2."], "answer": "Consistent; x = 3, y = 2, z = −2."}, {"number": "4.5.7", "exercise": "4.5", "question": "7. Solve by matrix method: 5x + 2y = 4; 7x + 3y = 5.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 7", "conceptIdx": 4, "steps": ["|A| = 15 − 14 = 1, A⁻¹ = [3 −2; −7 5].", "X = A⁻¹B = [12−10; −28+25] = [2; −3]."], "answer": "x = 2, y = −3."}, {"number": "4.5.8", "exercise": "4.5", "question": "8. Solve by matrix method: 2x − y = −2; 3x + 4y = 3.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 8", "conceptIdx": 4, "steps": ["|A| = 8 + 3 = 11, A⁻¹ = (1/11)[4 1; −3 2].", "X = (1/11)[−8+3; 6+6] = (1/11)[−5; 12]."], "answer": "x = −5/11, y = 12/11."}, {"number": "4.5.9", "exercise": "4.5", "question": "9. Solve by matrix method: 4x − 3y = 3; 3x − 5y = 7.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 9", "conceptIdx": 4, "steps": ["|A| = −20 + 9 = −11, A⁻¹ = (−1/11)[−5 3; −3 4].", "X = (−1/11)[−15+21; −9+28] = (−1/11)[6; 19]."], "answer": "x = −6/11, y = −19/11."}, {"number": "4.5.10", "exercise": "4.5", "question": "10. Solve by matrix method: 5x + 2y = 3; 3x + 2y = 5.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 10", "conceptIdx": 4, "steps": ["|A| = 10 − 6 = 4, A⁻¹ = (1/4)[2 −2; −3 5].", "X = (1/4)[6−10; −9+25] = (1/4)[−4; 16]."], "answer": "x = −1, y = 4."}, {"number": "4.5.11", "exercise": "4.5", "question": "11. Solve by matrix method: 2x + y + z = 1; x − 2y − z = 3/2; 3y − 5z = 9.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 11", "conceptIdx": 4, "steps": ["|A| = 2(10+3) − 1(−5−0) + 1(3−0) = 34 ≠ 0.", "Adding the first two equations: 3x − y = 5/2, and with z = 7/2 − 5x this gives x = 1.", "Then y = 1/2, z = −3/2 (checks: 1 − 1 + 3/2 = 3/2)."], "answer": "x = 1, y = 1/2, z = −3/2."}, {"number": "4.5.12", "exercise": "4.5", "question": "12. Solve by matrix method: x − y + z = 4; 2x + y − 3z = 0; x + y + z = 2.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 12", "conceptIdx": 4, "steps": ["|A| = 1(1+3) + 1(2+3) + 1(2−1) = 10 ≠ 0.", "(first) − (third) gives −2y = 2, so y = −1; then x + z = 3 and 2x − 3z = 1.", "Hence x = 2, z = 1."], "answer": "x = 2, y = −1, z = 1."}, {"number": "4.5.13", "exercise": "4.5", "question": "13. Solve by matrix method: 2x + 3y + 3z = 5; x − 2y + z = −4; 3x − y − 2z = 3.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 13", "conceptIdx": 4, "steps": ["|A| = 2(4+1) − 3(−2−3) + 3(−1+6) = 10 + 15 + 15 = 40 ≠ 0.", "Matrix solution gives X = A⁻¹B = [1; 2; −1].", "Check: 2+6−3 = 5, 1−4−1 = −4, 3−2+2 = 3."], "answer": "x = 1, y = 2, z = −1."}, {"number": "4.5.14", "exercise": "4.5", "question": "14. Solve by matrix method: x − y + 2z = 7; 3x + 4y − 5z = −5; 2x − y + 3z = 12.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 14", "conceptIdx": 4, "steps": ["|A| = 1(12−5) + 1(9+10) + 2(−3−8) = 7 + 19 − 22 = 4 ≠ 0.", "Matrix solution gives X = A⁻¹B = [2; 1; 3].", "Check: 2−1+6 = 7, 6+4−15 = −5, 4−1+9 = 12."], "answer": "x = 2, y = 1, z = 3."}, {"number": "4.5.15", "exercise": "4.5", "question": "15. If A = [2 −3 5; 3 2 −4; 1 1 −2], find A⁻¹. Using A⁻¹ solve the system 2x − 3y + 5z = 11; 3x + 2y − 4z = −5; x + y − 2z = −3.", "page": 23, "endPage": 23, "title": "NCERT Exercise 4.5 · Question 15", "conceptIdx": 4, "steps": ["|A| = 2(−4+4) + 3(−6+4) + 5(3−2) = −1 ≠ 0, so A⁻¹ exists.", "adj A = [0 −1 2; 2 −9 23; 1 −5 13], so A⁻¹ = (1/−1)adj A = [0 1 −2; −2 9 −23; −1 5 −13].", "X = A⁻¹[11; −5; −3]: x = 0−5+6 = 1, y = −22−45+69 = 2, z = −11−25+39 = 3."], "answer": "A⁻¹ = [0 1 −2; −2 9 −23; −1 5 −13]; x = 1, y = 2, z = 3."}, {"number": "4.5.16", "exercise": "4.5", "question": "16. The cost of 4 kg onion, 3 kg wheat and 2 kg rice is ₹60. The cost of 2 kg onion, 4 kg wheat and 6 kg rice is ₹90. The cost of 6 kg onion, 2 kg wheat and 3 kg rice is ₹70. Find cost of each item per kg by matrix method.", "page": 23, "endPage": 23, "title": "NCERT Exercise 4.5 · Question 16", "conceptIdx": 4, "steps": ["System: 4x+3y+2z = 60; 2x+4y+6z = 90; 6x+2y+3z = 70, with |A| = 4(12−12) − 3(6−36) + 2(4−24) = 50 ≠ 0.", "Matrix solution gives x = 5, y = 8, z = 8.", "Check: 20+24+16 = 60, 10+32+48 = 90, 30+16+24 = 70."], "answer": "Onion ₹5/kg, wheat ₹8/kg, rice ₹8/kg."}, {"number": "Misc.1", "exercise": "Misc", "question": "Prove that the determinant [−sin θ, −x, …] is independent of θ. Full matrix: |x sin θ cos θ; −sin θ −x 1; cos θ 1 x|.", "page": 24, "endPage": 24, "title": "NCERT Exercise Misc · Question 1", "conceptIdx": 0, "steps": ["Expand along R1: x(−x²−1) − sin θ(−x sin θ − cos θ) + cos θ(−sin θ + x cos θ).", "= −x³ − x + x sin²θ + x cos²θ = −x³ − x + x = −x³, free of θ."], "answer": "Determinant = −x³, independent of θ."}, {"number": "Misc.2", "exercise": "Misc", "question": "Evaluate |cos α cos β cos α sin β −sin α; −sin β cos β 0; sin α cos β sin α sin β cos α|.", "page": 24, "endPage": 24, "title": "NCERT Exercise Misc · Question 2", "conceptIdx": 0, "steps": ["Cofactors along R2: M21 = sin β(cos²α + sin²α) = sin β; M22 = cos β(cos²α + sin²α) = cos β.", "Δ = sin β×sin β + cos β×cos β = 1."], "answer": "1."}, {"number": "Misc.3", "exercise": "Misc", "question": "If A⁻¹ = [3 −1 1; −15 6 −5; 5 −2 2] and B = [1 2 −2; −1 3 0; 0 −2 1], find (AB)⁻¹.", "page": 24, "endPage": 24, "title": "NCERT Exercise Misc · Question 3", "conceptIdx": 0, "steps": ["|B| = 1(3−0) − 2(−1−0) − 2(2−0) = 3 + 2 − 4 = 1, so B⁻¹ = adj B.", "B⁻¹ = [3 2 6; 1 1 2; 2 2 5]; (AB)⁻¹ = B⁻¹A⁻¹ = [9 −3 5; −2 1 0; 1 0 2]."], "answer": "(AB)⁻¹ = [9 −3 5; −2 1 0; 1 0 2]."}, {"number": "Misc.4", "exercise": "Misc", "question": "Let A = [1 −2 1; −2 3 1; 1 1 5]. Verify that (i) [adj A]⁻¹ = adj(A⁻¹) (ii) (A⁻¹)⁻¹ = A.", "page": 24, "endPage": 24, "title": "NCERT Exercise Misc · Question 4", "conceptIdx": 0, "steps": ["|A| = 1(15−1) + 2(−10−1) + 1(−2−3) = −13 ≠ 0, so A⁻¹ = (1/−13)adj A exists.", "(i) Both sides equal (1/|adj A|)adj(adj A) since |adj A| = |A|² = 169; direct substitution gives equality.", "(ii) A⁻¹A = I gives (A⁻¹)⁻¹ = A by definition of the inverse."], "answer": "Both identities hold (|A| = −13)."}, {"number": "Misc.5", "exercise": "Misc", "question": "Evaluate |x y x+y; y x+y x; x+y x y|.", "page": 24, "endPage": 24, "title": "NCERT Exercise Misc · Question 5", "conceptIdx": 0, "steps": ["R1 → R1+R2+R3 makes every entry of the new R1 equal 2(x+y); factor it out.", "The remaining determinant equals −(x²−xy+y²), so Δ = −2(x+y)(x²−xy+y²) = −2(x³+y³)."], "answer": "−2(x³ + y³)."}, {"number": "Misc.6", "exercise": "Misc", "question": "Evaluate |1 x y; 1 x+y y; 1 x x+y|. Using properties of determinants:", "page": 24, "endPage": 24, "title": "NCERT Exercise Misc · Question 6", "conceptIdx": 0, "steps": ["R2 → R2−R1, R3 → R3−R1: Δ = |1 x y; 0 y 0; 0 0 x|.", "= 1×y×x = xy."], "answer": "xy."}, {"number": "Misc.7", "exercise": "Misc", "question": "7. Solve the system of equations 2/x + 3/y + 10/z = 4; 4/x − 6/y + 5/z = 1; 6/x + 9/y − 20/z = 2.", "page": 25, "endPage": 25, "title": "NCERT Exercise Misc · Question 7", "conceptIdx": 0, "steps": ["Put a = 1/x, b = 1/y, c = 1/z: 2a+3b+10c = 4; 4a−6b+5c = 1; 6a+9b−20c = 2.", "Solving the linear system gives a = 1/2, b = 1/3, c = 1/5.", "Hence x = 2, y = 3, z = 5."], "answer": "x = 2, y = 3, z = 5."}, {"number": "Misc.8", "exercise": "Misc", "question": "8. If x, y, z are nonzero real numbers, then the inverse of matrix A = diag(x, y, z) is (A) diag(x⁻¹, y⁻¹, z⁻¹) (B) xyz·diag(x⁻¹, y⁻¹, z⁻¹) (C) (1/xyz)·diag(x, y, z) (D) (1/xyz)·I.", "page": 25, "endPage": 25, "title": "NCERT Exercise Misc · Question 8", "conceptIdx": 0, "steps": ["|A| = xyz ≠ 0; A⁻¹ = (1/xyz)adj A = diag(1/x, 1/y, 1/z).", "This matches option (A)."], "answer": "(A)."}, {"number": "Misc.9", "exercise": "Misc", "question": "9. Let A = [1 sin θ 1; −sin θ 1 sin θ; −1 −sin θ 1], where 0 ≤ θ ≤ 2π. Then (A) Det(A) = 0 (B) Det(A) ∈ (2, ∞) (C) Det(A) ∈ (2, 4) (D) Det(A) ∈ [2, 4].", "page": 25, "endPage": 25, "title": "NCERT Exercise Misc · Question 9", "conceptIdx": 0, "steps": ["det A = 1(1+sin²θ) − sin θ(−sin θ+sin θ) + (sin²θ+1) = 2(1+sin²θ).", "Since 0 ≤ sin²θ ≤ 1, det A ∈ [2, 4]."], "answer": "(D) Det(A) ∈ [2, 4]."}], "exerciseMap": [{"number": "4.1.1", "exercise": "4.1", "question": "Evaluate the determinants in Exercises 1 and 2. 1. |2 4; −5 −1| 2. (i) |cos θ −sin θ; sin θ cos θ| (ii) |x² − x + 1 x − 1; x + 1 x + 1| 3. If A = [1 2; 4 2], then show that |2A| = 4|A|. 4. If A = [1 0 1; 0 1 2; 0 0 4], then show that |3A| = 27|A|.", "page": 6, "endPage": 6, "title": "NCERT Exercise 4.1 · Question 1", "conceptIdx": 0, "steps": ["Q1: 2×(−1) − 4×(−5) = −2 + 20 = 18.", "Q2(i): cos θ·cos θ − (−sin θ)(sin θ) = cos²θ + sin²θ = 1.", "Q2(ii): (x²−x+1)(x+1) − (x−1)(x+1) = (x³+1) − (x²−1) = x³ − x² + 2.", "Q3: |A| = 1×2 − 2×4 = −6; 2A = [2 4; 8 4], |2A| = 8 − 32 = −24 = 4|A|.", "Q4: |A| = 1×1×4 = 4 (upper triangular); each of the 3 rows is scaled by 3, so |3A| = 3³|A| = 27|A| = 108."], "answer": "Q1: 18; Q2(i): 1; Q2(ii): x³ − x² + 2; Q3/Q4 verified: |2A| = −24 = 4|A|, |3A| = 108 = 27|A|."}, {"number": "4.1.5", "exercise": "4.1", "question": "Evaluate the determinants: (i) |3 −1 −2; 0 0 −1; 3 −5 0| (ii) |3 −4 5; 1 1 −2; 2 3 1| (iii) |0 1 2; −1 0 −3; −2 3 0| (iv) |2 −1 −2; 0 2 −1; 3 −5 0|.", "page": 6, "endPage": 6, "title": "NCERT Exercise 4.1 · Question 5", "conceptIdx": 0, "steps": ["(i) Expand along R2: 0 − 0 + 1×(3×(−5) − (−1)×3) = −15 + 3 = −12.", "(ii) Expand along R1: 3(1+6) + 4(1+4) + 5(3−2) = 21 + 20 + 5 = 46.", "(iii) Skew-symmetric of odd order: 0 − 1×(0−6) + 2×(−3−0) = 6 − 6 = 0.", "(iv) 2(0−5) + 1(0+3) − 2(0−6) = −10 + 3 + 12 = 5."], "answer": "(i) −12; (ii) 46; (iii) 0; (iv) 5."}, {"number": "4.1.6", "exercise": "4.1", "question": "If A = [1 1 −2; 2 1 −3; 5 4 −9], find |A|.", "page": 7, "endPage": 7, "title": "NCERT Exercise 4.1 · Question 6", "conceptIdx": 0, "steps": ["Expand along R1: 1((−9)+12) − 1((−18)+15) − 2(8−5).", "= 3 + 3 − 6 = 0."], "answer": "0."}, {"number": "4.1.7", "exercise": "4.1", "question": "7. Find values of x, if (i) |2 4; 5 1| = |2x 4; 6 x| (ii) |2 3; 4 5| = |x 3; 2x 5|. 8. If |x 2; 18 x| = |6 2; 18 6|, then x is equal to (A) 6 (B) ±6 (C) −6 (D) 0.", "page": 7, "endPage": 7, "title": "NCERT Exercise 4.1 · Question 7", "conceptIdx": 0, "steps": ["7(i): 2 − 20 = 2x² − 24 ⇒ 2x² = 6 ⇒ x = ±√3.", "7(ii): 10 − 12 = 5x − 6x ⇒ −2 = −x ⇒ x = 2.", "Q8: x² − 36 = 36 − 36 = 0 ⇒ x² = 36 ⇒ x = ±6, option (B)."], "answer": "7(i) x = ±√3; 7(ii) x = 2; 8: (B) ±6."}, {"number": "4.2.1", "exercise": "4.2", "question": "Find area of the triangle with vertices at the point given in each of the following : (i) (1, 0), (6, 0), (4, 3) (ii) (2, 7), (1, 1), (10, 8) (iii) (–2, –3), (3, 2), (–1, –8)", "page": 8, "endPage": 8, "title": "NCERT Exercise 4.2 · Question 1", "conceptIdx": 1, "steps": ["(i) Δ = ½|1(0−3) + 6(3−0) + 4(0−0)| = ½×15 = 15/2.", "(ii) Δ = ½|2(1−8) + 1(8−7) + 10(7−1)| = ½×47 = 47/2.", "(iii) Δ = ½|(−2)(2+8) + 3(−8+3) + (−1)(−3−2)| = ½×|−30| = 15."], "answer": "(i) 15/2 sq units; (ii) 47/2 sq units; (iii) 15 sq units."}, {"number": "4.2.2", "exercise": "4.2", "question": "Show that points A (a, b + c), B (b, c + a), C (c, a + b) are collinear.", "page": 8, "endPage": 8, "title": "NCERT Exercise 4.2 · Question 2", "conceptIdx": 1, "steps": ["Area Δ = ½|a(c+a−a−b) + b(a+b−b−c) + c(b+c−c−a)|.", "= ½|a(c−b) + b(a−c) + c(b−a)| = ½×0 = 0.", "Zero area ⇒ the three points are collinear."], "answer": "Area = 0, so A, B, C are collinear."}, {"number": "4.2.3", "exercise": "4.2", "question": "Find values of k if area of triangle is 4 sq. units and vertices are (i) (k, 0), (4, 0), (0, 2) (ii) (–2, 0), (0, 4), (0, k)", "page": 8, "endPage": 8, "title": "NCERT Exercise 4.2 · Question 3", "conceptIdx": 1, "steps": ["(i) ½|k(0−2) + 4(2−0)| = 4 ⇒ |8 − 2k| = 8 ⇒ k = 0 or k = 8.", "(ii) ½|(−2)(4−k)| = 4 ⇒ |2k − 8| = 8 ⇒ k = 0 or k = 8."], "answer": "(i) k = 0, 8; (ii) k = 0, 8."}, {"number": "4.2.4", "exercise": "4.2", "question": "(i) Find equation of line joining (1, 2) and (3, 6) using determinants. (ii) Find equation of line joining (3, 1) and (9, 3) using determinants.", "page": 8, "endPage": 8, "title": "NCERT Exercise 4.2 · Question 4", "conceptIdx": 1, "steps": ["(i) |x y 1; 1 2 1; 3 6 1| = 0 ⇒ x(2−6) − y(1−3) + (6−6) = 0 ⇒ −4x + 2y = 0.", "(ii) |x y 1; 3 1 1; 9 3 1| = 0 ⇒ x(1−3) − y(3−9) + (9−9) = 0 ⇒ −2x + 6y = 0."], "answer": "(i) 2x − y = 0; (ii) x − 3y = 0."}, {"number": "4.2.5", "exercise": "4.2", "question": "If area of triangle is 35 sq units with vertices (2, – 6), (5, 4) and (k, 4). Then k is (A) 12 (B) –2 (C) –12, –2 (D) 12, –2", "page": 8, "endPage": 8, "title": "NCERT Exercise 4.2 · Question 5", "conceptIdx": 1, "steps": ["Δ = ½|2(4−4) + 5(4+6) + k(−6−4)| = ½|50 − 10k| = 35.", "|50 − 10k| = 70 ⇒ 50 − 10k = ±70 ⇒ k = −2 or k = 12."], "answer": "(D) 12, –2."}, {"number": "4.3.1", "exercise": "4.3", "question": "Write Minors and Cofactors of the elements of following determinants: 1. (i) |2 −4; 0 3| (ii) |a c; b d| 2. (i) |1 0 0; 0 1 0; 0 0 1| (ii) |1 0 4; 3 5 −4; 0 1 2|.", "page": 12, "endPage": 12, "title": "NCERT Exercise 4.3 · Question 1", "conceptIdx": 2, "steps": ["1(i): M11=3, M12=0, M21=−4, M22=2; A11=3, A12=0, A21=4, A22=2.", "1(ii): M11=d, M12=b, M21=c, M22=a; A11=d, A12=−b, A21=−c, A22=a.", "2(i) (identity): M11=M22=M33=1 with all other minors 0; A11=A22=A33=1 with all other cofactors 0.", "2(ii) minors: M11=14, M12=6, M13=3, M21=−4, M22=2, M23=1, M31=−20, M32=−16, M33=5.", "2(ii) cofactors: A11=14, A12=−6, A13=3, A21=4, A22=2, A23=−1, A31=−20, A32=16, A33=5."], "answer": "Minors and cofactors as listed in the steps."}, {"number": "4.3.3", "exercise": "4.3", "question": "Using Cofactors of elements of second row, evaluate Δ = |5 3 8; 2 0 1; 1 2 3|.", "page": 12, "endPage": 12, "title": "NCERT Exercise 4.3 · Question 3", "conceptIdx": 2, "steps": ["M21 = 9−16 = −7 so A21 = 7; M22 = 15−8 = 7 so A22 = 7; M23 = 10−3 = 7 so A23 = −7.", "Δ = 2×7 + 0×7 + 1×(−7) = 14 − 7 = 7."], "answer": "7."}, {"number": "4.3.4", "exercise": "4.3", "question": "Using Cofactors of elements of third column, evaluate Δ = |1 x yz; 1 y zx; 1 z xy|.", "page": 12, "endPage": 12, "title": "NCERT Exercise 4.3 · Question 4", "conceptIdx": 2, "steps": ["A13 = +(z−y), A23 = −(z−x) = x−z, A33 = +(y−x).", "Δ = yz(z−y) + zx(x−z) + xy(y−x) = (x−y)(y−z)(z−x)."], "answer": "(x − y)(y − z)(z − x)."}, {"number": "4.3.5", "exercise": "4.3", "question": "If Δ = |a11 a12 a13; a21 a22 a23; a31 a32 a33| and Aij is Cofactor of aij, then value of Δ is given by (A) a11A31 + a12A32 + a13A33 (B) a11A11 + a12A21 + a13A31 (C) a21A11 + a22A12 + a23A13 (D) a11A11 + a21A21 + a31A31.", "page": 12, "endPage": 12, "title": "NCERT Exercise 4.3 · Question 5", "conceptIdx": 2, "steps": ["Δ equals the sum of products of elements of any single row (or column) with their own cofactors.", "Only (D) is a single-column expansion (first column); (A) and (C) mix two rows and (B) mixes two columns, each giving 0."], "answer": "(D) a11A11 + a21A21 + a31A31."}, {"number": "4.4.1", "exercise": "4.4", "question": "Find adjoint of each of the matrices in Exercises 1 and 2. 1. [1 2; 3 4] 2. [1 −1 2; 2 3 5; −2 0 1].", "page": 17, "endPage": 17, "title": "NCERT Exercise 4.4 · Question 1", "conceptIdx": 3, "steps": ["Q1: A11=4, A12=−3, A21=−2, A22=1, so adj A = [4 −2; −3 1].", "Q2 cofactors: A11=3, A12=−12, A13=6, A21=1, A22=5, A23=2, A31=−11, A32=−1, A33=5 (and |A| = 27).", "adj A = transpose of the cofactor matrix = [3 1 −11; −12 5 −1; 6 2 5]."], "answer": "Q1: adj A = [4 −2; −3 1]; Q2: adj A = [3 1 −11; −12 5 −1; 6 2 5]."}, {"number": "4.4.4", "exercise": "4.4", "question": "4. Verify A(adj A) = (adj A)A = |A|I for A = [1 −1 2; 3 0 −2; 1 0 3].", "page": 18, "endPage": 18, "title": "NCERT Exercise 4.4 · Question 4", "conceptIdx": 3, "steps": ["|A| = 1(0+0) + 1(9+2) + 2(0−0) = 11.", "Cofactors give adj A = [0 3 2; −11 1 8; 0 −1 3].", "Direct multiplication: A(adj A) = (adj A)A = 11I = |A|I."], "answer": "Verified; |A| = 11."}, {"number": "4.5.1", "exercise": "4.5", "question": "1. Examine the consistency of the system: x + 2y = 2; 2x + 3y = 3.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 1", "conceptIdx": 4, "steps": ["|A| = 3 − 4 = −1 ≠ 0, so the system has a unique solution.", "Solving gives x = 0, y = 1 (0+2 = 2, 0+3 = 3)."], "answer": "Consistent; x = 0, y = 1."}, {"number": "4.5.2", "exercise": "4.5", "question": "2. Examine the consistency of the system: 2x − y = 5; x + y = 4.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 2", "conceptIdx": 4, "steps": ["|A| = 2 + 1 = 3 ≠ 0, so the system has a unique solution.", "Solving gives x = 3, y = 1 (6−1 = 5, 3+1 = 4)."], "answer": "Consistent; x = 3, y = 1."}, {"number": "4.5.3", "exercise": "4.5", "question": "3. Examine the consistency of the system: x + 3y = 5; 2x + 6y = 8.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 3", "conceptIdx": 4, "steps": ["|A| = 6 − 6 = 0, so check consistency: 2×(first equation) gives 2x + 6y = 10 ≠ 8.", "Hence no solution exists."], "answer": "Inconsistent; no solution."}, {"number": "4.5.4", "exercise": "4.5", "question": "4. Examine the consistency of the system: x + y + z = 1; 2x + 3y + 2z = 2; ax + ay + 2az = 4.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 4", "conceptIdx": 4, "steps": ["|A| = 1(6a−2a) − 1(4a−2a) + 1(2a−3a) = a.", "If a ≠ 0 the system has a unique solution; if a = 0 the third equation reads 0 = 4."], "answer": "Consistent with unique solution iff a ≠ 0; inconsistent if a = 0."}, {"number": "4.5.5", "exercise": "4.5", "question": "5. Examine the consistency of the system: 3x − y − 2z = 2; 2y − z = −1; 3x − 5y = 3.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 5", "conceptIdx": 4, "steps": ["|A| = 3(0−5) + 1(0+3) − 2(0−6) = −15 + 3 + 12 = 0.", "(first equation) − (third) gives 4y − 2z = −1, but 2×(second) gives 4y − 2z = −2: contradiction."], "answer": "Inconsistent; no solution."}, {"number": "4.5.6", "exercise": "4.5", "question": "6. Examine the consistency of the system: 5x − y + 4z = 5; 2x + 3y + 5z = 2; 5x − 2y + 6z = −1.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 6", "conceptIdx": 4, "steps": ["|A| = 5(18+10) + 1(12−25) + 4(−4−15) = 140 − 13 −76 = 51 ≠ 0.", "Hence consistent with a unique solution: x = 3, y = 2, z = −2."], "answer": "Consistent; x = 3, y = 2, z = −2."}, {"number": "4.5.7", "exercise": "4.5", "question": "7. Solve by matrix method: 5x + 2y = 4; 7x + 3y = 5.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 7", "conceptIdx": 4, "steps": ["|A| = 15 − 14 = 1, A⁻¹ = [3 −2; −7 5].", "X = A⁻¹B = [12−10; −28+25] = [2; −3]."], "answer": "x = 2, y = −3."}, {"number": "4.5.8", "exercise": "4.5", "question": "8. Solve by matrix method: 2x − y = −2; 3x + 4y = 3.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 8", "conceptIdx": 4, "steps": ["|A| = 8 + 3 = 11, A⁻¹ = (1/11)[4 1; −3 2].", "X = (1/11)[−8+3; 6+6] = (1/11)[−5; 12]."], "answer": "x = −5/11, y = 12/11."}, {"number": "4.5.9", "exercise": "4.5", "question": "9. Solve by matrix method: 4x − 3y = 3; 3x − 5y = 7.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 9", "conceptIdx": 4, "steps": ["|A| = −20 + 9 = −11, A⁻¹ = (−1/11)[−5 3; −3 4].", "X = (−1/11)[−15+21; −9+28] = (−1/11)[6; 19]."], "answer": "x = −6/11, y = −19/11."}, {"number": "4.5.10", "exercise": "4.5", "question": "10. Solve by matrix method: 5x + 2y = 3; 3x + 2y = 5.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 10", "conceptIdx": 4, "steps": ["|A| = 10 − 6 = 4, A⁻¹ = (1/4)[2 −2; −3 5].", "X = (1/4)[6−10; −9+25] = (1/4)[−4; 16]."], "answer": "x = −1, y = 4."}, {"number": "4.5.11", "exercise": "4.5", "question": "11. Solve by matrix method: 2x + y + z = 1; x − 2y − z = 3/2; 3y − 5z = 9.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 11", "conceptIdx": 4, "steps": ["|A| = 2(10+3) − 1(−5−0) + 1(3−0) = 34 ≠ 0.", "Adding the first two equations: 3x − y = 5/2, and with z = 7/2 − 5x this gives x = 1.", "Then y = 1/2, z = −3/2 (checks: 1 − 1 + 3/2 = 3/2)."], "answer": "x = 1, y = 1/2, z = −3/2."}, {"number": "4.5.12", "exercise": "4.5", "question": "12. Solve by matrix method: x − y + z = 4; 2x + y − 3z = 0; x + y + z = 2.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 12", "conceptIdx": 4, "steps": ["|A| = 1(1+3) + 1(2+3) + 1(2−1) = 10 ≠ 0.", "(first) − (third) gives −2y = 2, so y = −1; then x + z = 3 and 2x − 3z = 1.", "Hence x = 2, z = 1."], "answer": "x = 2, y = −1, z = 1."}, {"number": "4.5.13", "exercise": "4.5", "question": "13. Solve by matrix method: 2x + 3y + 3z = 5; x − 2y + z = −4; 3x − y − 2z = 3.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 13", "conceptIdx": 4, "steps": ["|A| = 2(4+1) − 3(−2−3) + 3(−1+6) = 10 + 15 + 15 = 40 ≠ 0.", "Matrix solution gives X = A⁻¹B = [1; 2; −1].", "Check: 2+6−3 = 5, 1−4−1 = −4, 3−2+2 = 3."], "answer": "x = 1, y = 2, z = −1."}, {"number": "4.5.14", "exercise": "4.5", "question": "14. Solve by matrix method: x − y + 2z = 7; 3x + 4y − 5z = −5; 2x − y + 3z = 12.", "page": 22, "endPage": 22, "title": "NCERT Exercise 4.5 · Question 14", "conceptIdx": 4, "steps": ["|A| = 1(12−5) + 1(9+10) + 2(−3−8) = 7 + 19 − 22 = 4 ≠ 0.", "Matrix solution gives X = A⁻¹B = [2; 1; 3].", "Check: 2−1+6 = 7, 6+4−15 = −5, 4−1+9 = 12."], "answer": "x = 2, y = 1, z = 3."}, {"number": "4.5.15", "exercise": "4.5", "question": "15. If A = [2 −3 5; 3 2 −4; 1 1 −2], find A⁻¹. Using A⁻¹ solve the system 2x − 3y + 5z = 11; 3x + 2y − 4z = −5; x + y − 2z = −3.", "page": 23, "endPage": 23, "title": "NCERT Exercise 4.5 · Question 15", "conceptIdx": 4, "steps": ["|A| = 2(−4+4) + 3(−6+4) + 5(3−2) = −1 ≠ 0, so A⁻¹ exists.", "adj A = [0 −1 2; 2 −9 23; 1 −5 13], so A⁻¹ = (1/−1)adj A = [0 1 −2; −2 9 −23; −1 5 −13].", "X = A⁻¹[11; −5; −3]: x = 0−5+6 = 1, y = −22−45+69 = 2, z = −11−25+39 = 3."], "answer": "A⁻¹ = [0 1 −2; −2 9 −23; −1 5 −13]; x = 1, y = 2, z = 3."}, {"number": "4.5.16", "exercise": "4.5", "question": "16. The cost of 4 kg onion, 3 kg wheat and 2 kg rice is ₹60. The cost of 2 kg onion, 4 kg wheat and 6 kg rice is ₹90. The cost of 6 kg onion, 2 kg wheat and 3 kg rice is ₹70. Find cost of each item per kg by matrix method.", "page": 23, "endPage": 23, "title": "NCERT Exercise 4.5 · Question 16", "conceptIdx": 4, "steps": ["System: 4x+3y+2z = 60; 2x+4y+6z = 90; 6x+2y+3z = 70, with |A| = 4(12−12) − 3(6−36) + 2(4−24) = 50 ≠ 0.", "Matrix solution gives x = 5, y = 8, z = 8.", "Check: 20+24+16 = 60, 10+32+48 = 90, 30+16+24 = 70."], "answer": "Onion ₹5/kg, wheat ₹8/kg, rice ₹8/kg."}, {"number": "Misc.1", "exercise": "Misc", "question": "Prove that the determinant [−sin θ, −x, …] is independent of θ. Full matrix: |x sin θ cos θ; −sin θ −x 1; cos θ 1 x|.", "page": 24, "endPage": 24, "title": "NCERT Exercise Misc · Question 1", "conceptIdx": 0, "steps": ["Expand along R1: x(−x²−1) − sin θ(−x sin θ − cos θ) + cos θ(−sin θ + x cos θ).", "= −x³ − x + x sin²θ + x cos²θ = −x³ − x + x = −x³, free of θ."], "answer": "Determinant = −x³, independent of θ."}, {"number": "Misc.2", "exercise": "Misc", "question": "Evaluate |cos α cos β cos α sin β −sin α; −sin β cos β 0; sin α cos β sin α sin β cos α|.", "page": 24, "endPage": 24, "title": "NCERT Exercise Misc · Question 2", "conceptIdx": 0, "steps": ["Cofactors along R2: M21 = sin β(cos²α + sin²α) = sin β; M22 = cos β(cos²α + sin²α) = cos β.", "Δ = sin β×sin β + cos β×cos β = 1."], "answer": "1."}, {"number": "Misc.3", "exercise": "Misc", "question": "If A⁻¹ = [3 −1 1; −15 6 −5; 5 −2 2] and B = [1 2 −2; −1 3 0; 0 −2 1], find (AB)⁻¹.", "page": 24, "endPage": 24, "title": "NCERT Exercise Misc · Question 3", "conceptIdx": 0, "steps": ["|B| = 1(3−0) − 2(−1−0) − 2(2−0) = 3 + 2 − 4 = 1, so B⁻¹ = adj B.", "B⁻¹ = [3 2 6; 1 1 2; 2 2 5]; (AB)⁻¹ = B⁻¹A⁻¹ = [9 −3 5; −2 1 0; 1 0 2]."], "answer": "(AB)⁻¹ = [9 −3 5; −2 1 0; 1 0 2]."}, {"number": "Misc.4", "exercise": "Misc", "question": "Let A = [1 −2 1; −2 3 1; 1 1 5]. Verify that (i) [adj A]⁻¹ = adj(A⁻¹) (ii) (A⁻¹)⁻¹ = A.", "page": 24, "endPage": 24, "title": "NCERT Exercise Misc · Question 4", "conceptIdx": 0, "steps": ["|A| = 1(15−1) + 2(−10−1) + 1(−2−3) = −13 ≠ 0, so A⁻¹ = (1/−13)adj A exists.", "(i) Both sides equal (1/|adj A|)adj(adj A) since |adj A| = |A|² = 169; direct substitution gives equality.", "(ii) A⁻¹A = I gives (A⁻¹)⁻¹ = A by definition of the inverse."], "answer": "Both identities hold (|A| = −13)."}, {"number": "Misc.5", "exercise": "Misc", "question": "Evaluate |x y x+y; y x+y x; x+y x y|.", "page": 24, "endPage": 24, "title": "NCERT Exercise Misc · Question 5", "conceptIdx": 0, "steps": ["R1 → R1+R2+R3 makes every entry of the new R1 equal 2(x+y); factor it out.", "The remaining determinant equals −(x²−xy+y²), so Δ = −2(x+y)(x²−xy+y²) = −2(x³+y³)."], "answer": "−2(x³ + y³)."}, {"number": "Misc.6", "exercise": "Misc", "question": "Evaluate |1 x y; 1 x+y y; 1 x x+y|. Using properties of determinants:", "page": 24, "endPage": 24, "title": "NCERT Exercise Misc · Question 6", "conceptIdx": 0, "steps": ["R2 → R2−R1, R3 → R3−R1: Δ = |1 x y; 0 y 0; 0 0 x|.", "= 1×y×x = xy."], "answer": "xy."}, {"number": "Misc.7", "exercise": "Misc", "question": "7. Solve the system of equations 2/x + 3/y + 10/z = 4; 4/x − 6/y + 5/z = 1; 6/x + 9/y − 20/z = 2.", "page": 25, "endPage": 25, "title": "NCERT Exercise Misc · Question 7", "conceptIdx": 0, "steps": ["Put a = 1/x, b = 1/y, c = 1/z: 2a+3b+10c = 4; 4a−6b+5c = 1; 6a+9b−20c = 2.", "Solving the linear system gives a = 1/2, b = 1/3, c = 1/5.", "Hence x = 2, y = 3, z = 5."], "answer": "x = 2, y = 3, z = 5."}, {"number": "Misc.8", "exercise": "Misc", "question": "8. If x, y, z are nonzero real numbers, then the inverse of matrix A = diag(x, y, z) is (A) diag(x⁻¹, y⁻¹, z⁻¹) (B) xyz·diag(x⁻¹, y⁻¹, z⁻¹) (C) (1/xyz)·diag(x, y, z) (D) (1/xyz)·I.", "page": 25, "endPage": 25, "title": "NCERT Exercise Misc · Question 8", "conceptIdx": 0, "steps": ["|A| = xyz ≠ 0; A⁻¹ = (1/xyz)adj A = diag(1/x, 1/y, 1/z).", "This matches option (A)."], "answer": "(A)."}, {"number": "Misc.9", "exercise": "Misc", "question": "9. Let A = [1 sin θ 1; −sin θ 1 sin θ; −1 −sin θ 1], where 0 ≤ θ ≤ 2π. Then (A) Det(A) = 0 (B) Det(A) ∈ (2, ∞) (C) Det(A) ∈ (2, 4) (D) Det(A) ∈ [2, 4].", "page": 25, "endPage": 25, "title": "NCERT Exercise Misc · Question 9", "conceptIdx": 0, "steps": ["det A = 1(1+sin²θ) − sin θ(−sin θ+sin θ) + (sin²θ+1) = 2(1+sin²θ).", "Since 0 ≤ sin²θ ≤ 1, det A ∈ [2, 4]."], "answer": "(D) Det(A) ∈ [2, 4]."}], "pageOffset": 75, "printPageStart": 76, "printPageEnd": 103, "paginationProvenance": "folio-read-16-samples"};</script>
  <script>(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp) disp.innerHTML = "t = <b>" + state.t.toFixed(1) + " s</b>";
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Concept View ---
  function renderConcept(idx){
    pause();
    state.conceptIndex = idx;
    state.t = 0;
    state.level = 0;

    var lessons = C.lessons || C.concepts || [];
    var l = lessons[idx];
    if(!l) return;

    var navTitle = l.nav || l.navTitle || l.title || ("Concept " + (idx + 1));

    // Update sidebar navigation active state
    var navBtns = document.querySelectorAll(".concept-nav");
    navBtns.forEach(function(b, i){
      if(b.id === "nav-revision") b.classList.remove("active");
      else b.classList.toggle("active", i === idx);
    });

    // Update top crumb
    var chNum = C.chapterNumber || (C.code ? C.code.replace(/\D/g, '') : "01");
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · " + navTitle.toUpperCase();

    // Show concept view, hide revision
    var cView = document.getElementById("concept-view");
    var rView = document.getElementById("revision-view");
    if(cView) cView.style.display = "block";
    if(rView) rView.style.display = "none";

    var html = "";

    // Concept Header
    var minutes = l.minutes || 10;
    var pdfRef = (l.pages && l.pages.length) ? ('PDF ' + (l.pages.length > 1 ? 'pp. ' + Math.min.apply(null, l.pages) + '–' + Math.max.apply(null, l.pages) : 'p.' + l.pages[0])) : (typeof printPage !== 'undefined' && printPage ? printPage : '');
     var printedPages = l.printPages ? ' · printed pp. ' + l.printPages : ' · printed folio absent in source';
     var printPage = l.print || (l.pages ? l.pages.join("–") : (C.page_start ? "pp. " + C.page_start + "–" + C.page_end : ""));
    html += '<div class="concept-header">' +
      '<div class="concept-badge"><span>Concept ' + ("0" + (idx + 1)).slice(-2) + ' / ' + ("0" + lessons.length).slice(-2) + '</span>' +
      (printPage ? '<span class="time-pill">≈ ' + minutes + ' min · ' + pdfRef + printedPages + '</span>' : '<span class="time-pill">≈ ' + minutes + ' min</span>') +
      '</div>' +
      '<h1 class="concept-title">' + (l.title || navTitle) + '</h1>' +
      '<p class="concept-deck">' + (l.deck || l.summary || "") + '</p>' +
      '</div>';

    // 01 LEARN BLOCK
    html += '<section class="learn-section" data-block="learn" aria-label="Learn Concept">' +
      '<span class="block-tag">01 · LEARN · CORE ESSENTIALS</span>';

    var quickItems = [];
    if(Array.isArray(l.quick)) {
      quickItems = l.quick;
    } else if(Array.isArray(l.summary)) {
      quickItems = l.summary;
    } else if(l.reading_content) {
      quickItems = [l.reading_content];
    } else if(l.summary || l.deck) {
      quickItems = [l.summary || l.deck];
    }

    html += '<div class="quick-summary">' + quickItems.map(function(p){
      if(p.includes('<p>') || p.includes('<div>') || p.includes('<h3>')) return p;
      var formatted = p.replace(/###\s+(.*?)\n/g, '<h3 style="margin-top:16px;color:var(--ink);">$1</h3>')
                       .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                       .replace(/\*(.*?)\*/g, '<em>$1</em>')
                       .replace(/\n\n/g, '</p><p>');
      return '<p>' + formatted + '</p>';
    }).join("") + '</div>';

    // Semantic Equations Card
    var formulas = l.formulas || [];
    if(formulas.length){
      html += '<div class="key-equations-card">' +
        '<div class="equations-heading">Key Relations for this Concept</div>' +
        '<div class="eq-grid">' +
        formulas.map(function(eq){
          var label = eq.label || eq.name || "Relation";
          var cond = eq.cond || "";
          var math = eq.html || eq.formula || "";
          return '<div class="eq-row">' +
            '<div class="eq-meta"><span class="eq-label">' + label + '</span>' + (cond ? '<span class="eq-cond">' + cond + '</span>' : '') + '</div>' +
            '<div class="eq-math">' + math + '</div>' +
            '</div>';
        }).join("") +
        '</div></div>';
    }

    // Deeper dive / core takeaways
    if(l.deeper){
      html += '<details class="deep-dive"><summary>Go deeper into the conceptual foundation</summary><p>' + l.deeper + '</p></details>';
    } else if(l.takeaways && l.takeaways.length){
      html += '<details class="deep-dive"><summary>Key Conceptual Takeaways</summary><ul>' +
        l.takeaways.map(function(t){ return '<li>' + t + '</li>'; }).join("") +
        '</ul></details>';
    }

    // Worked Example
    var worked = l.worked || l.worked_example;
    if(worked){
      var workedHtml = typeof worked === 'object' && worked !== null
        ? '<strong>' + (worked.title || 'Worked Example') + '</strong><br>' + (worked.problem || '') +
          (worked.given ? '<br><br><strong>Given:</strong> ' + worked.given : '') +
          (worked.steps ? '<br><strong>Steps:</strong><br>' + worked.steps.map(function(s){ return '&bull; ' + s; }).join('<br>') : '') +
          (worked.solution ? '<br><br><strong>Solution:</strong> ' + worked.solution : '') +
          (worked.answer ? '<br><br><strong>Answer:</strong> ' + worked.answer : '')
        : String(worked);
      html += '<details class="deep-dive"><summary>Worked textbook example step by step</summary><p>' + workedHtml + '</p></details>';
    }

    html += '</section>';

    // 02 PREDICT FIRST BLOCK
    var pred = l.prediction || l.predict || l.predict_first;
    if(pred && typeof pred === 'object' && (pred.prompt || pred.scenario) && pred.options && pred.options.length){
      var promptText = pred.prompt || pred.scenario || "";
      html += '<section class="predict-card" data-block="predict" aria-label="Predict First">' +
        '<div class="predict-badge">02 · PREDICT FIRST · TEST YOUR INTUITION</div>' +
        '<div class="predict-prompt">' + promptText.replace(/\n/g, '<br>') + '</div>' +
        '<div class="predict-options" id="predict-options">' +
        pred.options.map(function(opt, oi){
          return '<label class="predict-option"><input type="radio" name="predict_ans" value="' + oi + '"><span>' + opt + '</span></label>';
        }).join("") +
        '</div>' +
        '<div class="predict-actions">' +
        '<button class="btn-primary" id="btn-check-prediction">Check Prediction</button>' +
        '<button class="btn-secondary" id="btn-skip-prediction">Skip to Lab</button>' +
        '</div>' +
        '<div id="predict-feedback-box" class="predict-feedback" style="display:none;"></div>' +
        '</section>';
    }

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();
    var whatWatch = (pred && pred.prompt) ? pred.prompt : (typeof l.predict === 'string' ? l.predict : "Explore the interactive simulation controls, parameters, and readouts below.");
    html += '<section class="lab-card" data-block="play" aria-label="Interactive Laboratory">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +
      '<div id="sim-mount-point" class="sim-mount-container" style="width:100%;min-height:220px;margin-top:12px;">' +
        '<div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 720 300" role="img" aria-label="' + simTitle + '"></svg></div>' +
        '<div class="lab-legend" id="lab-legend"></div>' +
        '<div class="lab-toolbar" id="legacy-lab-toolbar">' +
          '<button class="toolbar-btn primary" id="btn-play-pause" aria-label="Play animation">▶ Play</button>' +
          '<button class="toolbar-btn" id="btn-step-fwd" aria-label="Step forward">⏭ Step (+0.5s)</button>' +
          '<button class="toolbar-btn" id="btn-reset-time" aria-label="Reset timeline">↺ Reset</button>' +
          '<span class="time-display" id="time-display">t = <b>0.0 s</b></span>' +
          '<div class="scrubber-wrap">' +
            '<input type="range" id="time-scrubber" class="timeline-scrubber" min="0" max="6" step="0.1" value="0" aria-label="Timeline time scrubber">' +
          '</div>' +
        '</div>' +
        '<div class="preset-bar" id="preset-bar"></div>' +
        '<div class="lab-controls-grid" id="lab-controls"></div>' +
        '<div class="lab-readout" id="lab-readout" role="status" aria-live="polite"></div>' +
        '<div class="lab-verdict" id="lab-verdict" role="status" aria-live="polite"></div>' +
      '</div>' +
      '</section>';

    // 04 CONNECT BLOCK
    var connectItems = l.connect || [];
    var resList = l.resources || [];
    var resHtml = resList.length ? '<div class="resource-list">' + resList.map(function(r){
      var rt = String(r.title).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      var rp = String(r.provider).replace(/&/g,'&amp;').replace(/</g,'&lt;');
      return '<div class="resource-card" data-resource="true"><span class="res-badge">RESOURCE \u00b7 OPTIONAL</span><div class="res-body"><strong>' + rt + '</strong><span class="res-provider">' + rp + '</span></div><a class="res-link" href="' + r.url + '" target="_blank" rel="noopener">Open source \u2197</a><span class="res-off">Needs internet \u00b7 lesson works offline</span></div>';
    }).join("") + '</div>' : '';
    if(connectItems.length){
      html += '<section class="connect-section" data-block="connect" aria-label="Real World Connections">' +
        '<span class="block-tag">04 · CONNECT · REAL WORLD APPLICATIONS</span>' +
        '<div class="connect-grid">' +
        connectItems.map(function(item){
          var title = Array.isArray(item) ? item[0] : (item.title || "Real World Context");
          var desc = Array.isArray(item) ? item[1] : (item.text || item.desc || "");
          var links = Array.isArray(item) ? (item[2] || []) : (item.links || (item.link ? [{t: "Read Deeply", u: item.link}] : []));
          var v = Array.isArray(item) ? (item[3] || null) : (item.video || null);
          var wow = /^Wow/i.test(title);

          var wowSrc = pdfRef;
          var wowPrint = (l && l.printPages) ? ' · printed pp. ' + l.printPages : ' (printed folio absent in source)';
          var cHtml = '<div class="connect-card' + (wow ? ' wow" data-wow="true" data-source="NCERT ' + C.book_name + ' Ch ' + C.chapterNumber + ' · ' + wowSrc + wowPrint + '"' : '') + '">';
          if(wow) cHtml += '<span class="wow-badge">WOW · REAL WORLD</span>';
          cHtml += '<h3>' + title + '</h3><p>' + desc + '</p>';
          if(v && v.id){
            cHtml += '<button class="video-facade" data-yt="' + v.id + '" aria-label="Play video: ' + v.title + '">' +
              '<span class="play-btn">▶</span>' +
              '<span class="video-title">' + v.title + ' · ' + v.channel + '</span>' +
              '</button>';
          }
          if(links && links.length){
            cHtml += '<p style="margin-top:10px;font-size:12px;color:var(--muted)">References: ' +
              links.map(function(a){ return '<a href="' + (a.u || a.link || "#") + '" target="_blank" rel="noopener">' + (a.t || a.label || "Read Deeply") + ' ↗</a>'; }).join(", ") +
              '</p>';
          }
          cHtml += '</div>';
          return cHtml;
        }).join("") +
        '</div>' + resHtml + '</section>';
    }

    // 05 PRACTICE BLOCK
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(quizzes.length){
      html += '<section class="practice-section" data-block="practice" aria-label="Practice and Mastery">' +
        '<span class="block-tag">05 · PRACTICE · MULTI-TIER CHALLENGE</span>' +
        '<div class="practice-nav">';
      for(var qi = 0; qi < quizzes.length; qi++){
        var tierName = qi === 0 ? "Tier 1: Easy" : (qi === 1 ? "Tier 2: Medium" : (qi === 2 ? "Tier 3: Hard" : "Question " + (qi + 1)));
        html += '<button class="level-tab' + (qi === 0 ? ' active' : '') + '" data-lvl="' + qi + '">' + tierName + '</button>';
      }
      html += '</div>' +
        '<div id="quiz-container"></div>' +
        '</section>';
    }

    // 06 REVISE CALLOUT
    var recall = l.recall || (l.takeaways && l.takeaways.length ? l.takeaways[0] : (l.core_takeaways && l.core_takeaways.length ? l.core_takeaways[0] : "Reflect on how this concept connects to physical reality."));
    html += '<div class="revise-callout"><strong>06 · REVISE · SAY IT IN YOUR OWN WORDS:</strong> ' + recall + '</div>';

    // Footer Navigation
    var nextNav = idx < lessons.length - 1 ? (lessons[idx + 1].nav || lessons[idx + 1].navTitle || lessons[idx + 1].title || ("Concept " + (idx + 2))) : "";
    html += '<div class="concept-footer-nav">' +
      (idx > 0 ? '<button class="btn-secondary" id="btn-prev-concept">← Concept ' + ("0" + idx).slice(-2) + '</button>' : '<span></span>') +
      (idx < lessons.length - 1 ? '<button class="btn-primary" id="btn-next-concept">Concept ' + ("0" + (idx + 2)).slice(-2) + ': ' + nextNav + ' →</button>' : '<button class="btn-primary" id="btn-goto-revision">Chapter Revision & Exercises →</button>') +
      '</div>';

    cView.innerHTML = html;

    // Attach Prediction Listeners
    var btnCheckPred = document.getElementById("btn-check-prediction");
    var btnSkipPred = document.getElementById("btn-skip-prediction");
    if(btnCheckPred && pred){
      btnCheckPred.addEventListener("click", function(){
        var sel = document.querySelector('input[name="predict_ans"]:checked');
        var fb = document.getElementById("predict-feedback-box");
        if(!sel){
          fb.style.display = "block";
          fb.className = "predict-feedback revealed";
          fb.textContent = "Please select one of the predictions first.";
          return;
        }
        var chosen = Number(sel.value);
        var expectedAns = pred.answer !== undefined ? pred.answer : (pred.correct !== undefined ? pred.correct : 0);
        var isRight = chosen === expectedAns;
        fb.style.display = "block";
        fb.className = "predict-feedback " + (isRight ? "correct" : "revealed");
        fb.innerHTML = (isRight ? "<b>Spot on!</b> " : "<b>Good thought! Here is the physical principle:</b> ") + (pred.explanation || "");
      });
    }
    if(btnSkipPred && pred){
      btnSkipPred.addEventListener("click", function(){
        var fb = document.getElementById("predict-feedback-box");
        fb.style.display = "block";
        fb.className = "predict-feedback revealed";
        fb.innerHTML = "<b>Key Principle:</b> " + (pred.explanation || "");
      });
    }

    // Attach Timeline Controls for legacy SIMS
    var btnPP = document.getElementById("btn-play-pause");
    if(btnPP) btnPP.addEventListener("click", function(){ if(state.playing) pause(); else play(); });
    var btnStep = document.getElementById("btn-step-fwd");
    if(btnStep) btnStep.addEventListener("click", function(){ step(0.5); });
    var btnResTime = document.getElementById("btn-reset-time");
    if(btnResTime) btnResTime.addEventListener("click", function(){ resetTimeline(); });
    var scrub = document.getElementById("time-scrubber");
    if(scrub) scrub.addEventListener("input", function(e){ seekTimeline(e.target.value); });

    // Footer Next/Prev listeners
    var btnPrev = document.getElementById("btn-prev-concept");
    var btnNext = document.getElementById("btn-next-concept");
    var btnRev = document.getElementById("btn-goto-revision");
    if(btnPrev) btnPrev.addEventListener("click", function(){ renderConcept(idx - 1); window.scrollTo(0,0); });
    if(btnNext) btnNext.addEventListener("click", function(){ renderConcept(idx + 1); window.scrollTo(0,0); });
    if(btnRev) btnRev.addEventListener("click", function(){ renderRevision(); window.scrollTo(0,0); });

    // Mount Active Simulation Engine
    var simMount = document.getElementById("sim-mount-point");
    if(simMount){
      var cKey = "c" + (idx + 1);
      var conceptId = l.id || ("concept-" + (idx + 1));
      var simId = l.sim || conceptId;

      // 1. window.mountSimulation (iemh101, iemh102)
      if(typeof window.mountSimulation === 'function'){
        simMount.innerHTML = "";
        window.mountSimulation(cKey, simMount);
      }
      // 2. window.SIM_ENGINES (iemh101-iemh105)
      else if(window.SIM_ENGINES && window.SIM_ENGINES[cKey] && typeof window.SIM_ENGINES[cKey].init === 'function'){
        simMount.innerHTML = "";
        window.SIM_ENGINES[cKey].init(simMount);
      }
      // 3. window.SimEngine (iemh106-iemh108)
      else if(window.SimEngine && typeof window.SimEngine.init === 'function'){
        var targetKey = null;
        var candidateKeys = [conceptId, "sim-" + conceptId, "sim-concept-" + (idx + 1), "concept-" + (idx + 1), simId, cKey];
        for(var k = 0; k < candidateKeys.length; k++){
          if(candidateKeys[k] && window.SimEngine.getEngine(candidateKeys[k])){
            targetKey = candidateKeys[k];
            break;
          }
        }
        if(targetKey){
          simMount.innerHTML = "";
          window.SimEngine.init(targetKey, simMount);
        }
      }
      // 4. window.SIMS (iesc101-iesc113)
      else if(window.SIMS && (window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey])){
        var simObj = window.SIMS[simId] || window.SIMS[l.sim] || window.SIMS[conceptId] || window.SIMS[cKey];
        if(typeof simObj.mount === 'function'){
          if(simObj.mount.length >= 1 && !simObj.draw){
            simMount.innerHTML = "";
            simObj.mount(simMount);
          } else {
            simObj.mount(l);
          }
        }
      }
    }

    // Render Quiz for current level
    renderQuiz();

    // Attach Practice Level Tabs
    var lvlTabs = document.querySelectorAll(".level-tab");
    lvlTabs.forEach(function(tab){
      tab.addEventListener("click", function(){
        lvlTabs.forEach(function(t){ t.classList.remove("active"); });
        tab.classList.add("active");
        state.level = Number(tab.getAttribute("data-lvl"));
        renderQuiz();
      });
    });

    // Update URL hash
    window.location.hash = "#concept-" + (idx + 1);
  }

  // --- Render Quiz ---
  function renderQuiz(){
    var lessons = C.lessons || C.concepts || [];
    var l = lessons[state.conceptIndex];
    if(!l) return;
    var quizzes = l.quizzes || l.practice_quizzes || [];
    if(!quizzes.length) return;
    var q = quizzes[state.level] || quizzes[0];
    if(!q) return;

    var qk = qKey(state.conceptIndex, state.level);
    var old = state.answers[qk] || {};

    var box = document.getElementById("quiz-container");
    if(!box) return;

    var promptText = q.prompt || q.question || "";
    var isMcq = q.type === "mcq" || (q.options && q.options.length > 0);
    var correctAns = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : 0);
    var solutionText = q.solution || q.explanation || "";
    var hintText = q.hint || "Review the key relationships in the concept overview above.";

    var html = '<div class="question-prompt">' + promptText + '</div>';
    if(isMcq && q.options){
      html += '<div class="quiz-options">' +
        q.options.map(function(opt, oi){
          var checked = old.value === String(oi) ? " checked" : "";
          return '<label class="quiz-option"><input type="radio" name="quiz_ans" value="' + oi + '"' + checked + '><span>' + opt + '</span></label>';
        }).join("") +
        '</div>';
    } else {
      html += '<div style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">' +
        '<input type="number" step="any" id="quiz_num_ans" placeholder="Your answer" value="' + (old.value || "") + '" style="padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:16px;width:160px;">' +
        '<span style="font-weight:600;color:var(--muted);">' + (q.unit || "") + '</span>' +
        '</div>';
    }

    html += '<div class="quiz-actions">' +
      '<button class="btn-primary" id="btn-submit-quiz">Submit Answer</button>' +
      '<button class="btn-secondary" id="btn-toggle-hint">Show Hint</button>' +
      '</div>' +
      '<div id="quiz-hint-box" class="quiz-hint" style="display:none;">' + hintText + '</div>' +
      '<div id="quiz-feedback-box" class="quiz-feedback" style="display:none;"></div>';

    box.innerHTML = html;

    // Hint toggle
    var hintBtn = document.getElementById("btn-toggle-hint");
    if(hintBtn){
      hintBtn.addEventListener("click", function(){
        var hb = document.getElementById("quiz-hint-box");
        if(hb) hb.style.display = hb.style.display === "none" ? "block" : "none";
      });
    }

    // Submit listener
    var submitBtn = document.getElementById("btn-submit-quiz");
    if(submitBtn){
      submitBtn.addEventListener("click", function(){
        var fb = document.getElementById("quiz-feedback-box");
        if(!fb) return;
        var isRight = false;
        var userVal = "";

        if(isMcq){
          var sel = document.querySelector('input[name="quiz_ans"]:checked');
          if(!sel){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please select an answer choice first.";
            return;
          }
          userVal = sel.value;
          isRight = Number(userVal) === Number(correctAns);
        } else {
          var inp = document.getElementById("quiz_num_ans");
          if(!inp || inp.value.trim() === ""){
            fb.style.display = "block";
            fb.className = "quiz-feedback retry";
            fb.textContent = "Please enter a numerical answer.";
            return;
          }
          userVal = inp.value.trim();
          var num = parseFloat(userVal);
          isRight = Math.abs(num - parseFloat(correctAns)) <= (q.tolerance || 0.05);
        }

        state.answers[qk] = { value: userVal, checked: true };
        if(isRight){
          state.correct[qk] = true;
          fb.style.display = "block";
          fb.className = "quiz-feedback success";
          fb.innerHTML = "<b>That’s right!</b> " + solutionText;
        } else {
          fb.style.display = "block";
          fb.className = "quiz-feedback retry";
          var wrongMsg = (isMcq && q.wrong && q.wrong[Number(userVal)]) ? q.wrong[Number(userVal)] : hintText;
          fb.innerHTML = "<b>Not quite.</b> " + wrongMsg + "<br><small style=\"margin-top:6px;display:block;\"><b>Full explanation:</b> " + solutionText + "</small>";
        }
        updateProgress();
      });
    }

    if(old.checked && submitBtn){
      submitBtn.click();
    }
  }

  // --- Render Revision View ---
  var currentExFilter = -1;

  function renderRevision(){
    pause();
    document.querySelectorAll(".concept-nav").forEach(function(b){ b.classList.remove("active"); });
    var rBtn = document.getElementById("nav-revision");
    if(rBtn) rBtn.classList.add("active");

    var chNum = C.chapterNumber || (C.code ? C.code.replace(/\D/g, '') : "01");
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · NCERT EXERCISES & REVISION";

    var cView = document.getElementById("concept-view");
    var revView = document.getElementById("revision-view");
    if(cView) cView.style.display = "none";
    if(revView) revView.style.display = "block";

    var exList = C.exercises || [];
    if(!exList.length && C.exerciseMap){
      exList = C.exerciseMap.map(function(m){
        return {
          q: m[0],
          number: String(m[0]),
          title: m[1],
          conceptIdx: m[2],
          page: m[3],
          printPage: null,
          question: m[4] || m[1],
          steps: [m[5] || "Refer to concept explanation."],
          answer: m[5] || ""
        };
      });
    }

    var totalEx = exList.length;
    var html = '<div class="concept-header">' +
      '<span class="concept-badge">NCERT EXERCISE COMPENDIUM</span>' +
      '<h1 class="concept-title">Revise, Reflect, Refine</h1>' +
      '<p class="concept-deck">All ' + totalEx + ' exercises from NCERT Class 12 ' + (C.book_name || '') + ' with step-by-step solutions.</p>' +
      '</div>';

    // Filter Bar & Expand/Collapse All
    var lessons = C.lessons || C.concepts || [];
    html += '<div class="exercise-compendium-header">' +
      '<div class="exercise-filter-bar">' +
      '<button class="filter-chip ' + (currentExFilter === -1 ? 'active' : '') + '" data-cfilter="-1">All Exercises (' + totalEx + ')</button>' +
      lessons.map(function(l, li){
        var nav = l.nav || l.navTitle || l.title || ("C0" + (li+1));
        return '<button class="filter-chip ' + (currentExFilter === li ? 'active' : '') + '" data-cfilter="' + li + '">C0' + (li+1) + ': ' + nav + '</button>';
      }).join("") +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="btn-secondary" id="btn-expand-all" style="padding:6px 12px;font-size:13px;">Expand All Guidance</button>' +
      '<button class="btn-secondary" id="btn-collapse-all" style="padding:6px 12px;font-size:13px;">Collapse All</button>' +
      '</div>' +
      '</div>';

    // Exercise Cards List
    html += '<div id="exercise-cards-container">';
    var filtered = currentExFilter === -1 ? exList : exList.filter(function(e){
      return e.conceptIdx === currentExFilter || (e.section && e.section.includes(String(currentExFilter + 1)));
    });

    html += filtered.map(function(ex, eIdx){
      var qNum = ex.number || ex.q || (eIdx + 1);
      var sectionLabel = ex.section ? ('<span class="q-badge" style="background:#e0f2fe;color:#0369a1;margin-right:6px;">' + ex.section + '</span>') : '';
      var l = (ex.conceptIdx !== undefined && lessons[ex.conceptIdx]) ? lessons[ex.conceptIdx] : null;
      var conceptLink = l ? ('<a href="#concept-' + (ex.conceptIdx + 1) + '" class="q-concept-link" data-idx="' + ex.conceptIdx + '">Explore in Concept ' + ("0" + (ex.conceptIdx + 1)).slice(-2) + ' (' + (l.nav || l.navTitle || l.title) + ') ↗</a>') : '';

      var guidanceHtml = "";
      if(ex.guidance){
        if(typeof ex.guidance === 'string'){
          guidanceHtml = ex.guidance;
        } else if(Array.isArray(ex.guidance)){
          guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
            (ex.answer ? '<p><strong>Answer:</strong> ' + ex.answer + '</p>' : '') +
            '<ol>' + ex.guidance.map(function(g){ return '<li>' + g + '</li>'; }).join('') + '</ol></div>';
        }
      } else if(ex.steps && ex.steps.length){
        guidanceHtml = '<div class="guidance-content"><h4>Step-by-Step Pedagogical Guidance:</h4>' +
          (ex.given ? '<div class="given-data"><b>Given:</b> ' + ex.given + '</div>' : '') +
          '<ol class="solution-steps">' + ex.steps.map(function(st){ return '<li>' + st + '</li>'; }).join('') + '</ol>' +
          (ex.answer ? '<div class="answer-box"><b>Final Answer:</b> ' + ex.answer + '</div>' : '') +
          '</div>';

    for (var x = 0; x <= 4.01; x += 0.08) {
      var value = s.family === "linear" ? 1 - Math.exp(-x) : Math.exp(sign * x);
      curve += (x === 0 ? "M" : "L") + (100 + x * 100) + " " + (235 - Math.min(2.7, value) * 55) + " ";
    }
    return {
      svg: shell('<line x1="95" y1="235" x2="530" y2="235" stroke="#475569"></line><path d="' + curve + '" fill="none" stroke="#38bdf8" stroke-width="3"></path><circle cx="' + (100 + s.t * 100) + '" cy="' + (235 - Math.min(2.7, y) * 55) + '" r="7" fill="#34d399"></circle>' +
        text(500, 70, "solve → apply initial condition", "#f8fafc", 16) + text(500, 105, "one family, many possible constants", "#94a3b8", 14)),
      readout: cell("model", s.family) + cell("y(t)", y.toFixed(3), "#34d399") + cell("t", s.t.toFixed(1), "#f59e0b"),
      verdict: "<b>Solution family:</b> integrating produces a constant. An initial condition selects one member of the family."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#34d399"></span><span>solution curve</span></div>');

  install("vectors", "Vector components", { ax: 3, ay: 2, bx: -1, by: 2 }, function (s) {
    return range("ax", "Aₓ", -4, 4, 1, s.ax, "") + range("ay", "Aᵧ", -4, 4, 1, s.ay, "") +
      range("bx", "Bₓ", -4, 4, 1, s.bx, "") + range("by", "Bᵧ", -4, 4, 1, s.by, "");
  }, function (s) {
    var rx = s.ax + s.bx, ry = s.ay + s.by, mag = Math.sqrt(rx * rx + ry * ry);
    function arrow(x, y, dx, dy, color) {
      return '<line x1="' + x + '" y1="' + y + '" x2="' + (x + dx * 35) + '" y2="' + (y - dy * 35) + '" stroke="' + color + '" stroke-width="4" marker-end="url(#arrow-v)"></line>';
    }
    return {
      svg: shell('<line x1="90" y1="180" x2="630" y2="180" stroke="#475569"></line><line x1="360" y1="45" x2="360" y2="270" stroke="#475569"></line>' +
        arrow(360, 180, s.ax, s.ay, "#38bdf8") + arrow(360, 180, s.bx, s.by, "#f59e0b") + arrow(360, 180, rx, ry, "#34d399") +
        '<defs><marker id="arrow-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34d399"></path></marker></defs>' +
        text(500, 65, "R = A + B", "#34d399", 18) + text(500, 105, "components add separately", "#94a3b8", 14)),
      readout: cell("Rₓ", rx.toFixed(0), "#34d399") + cell("Rᵧ", ry.toFixed(0), "#34d399") + cell("|R|", mag.toFixed(2), "#f59e0b"),
      verdict: "<b>Vector addition:</b> add horizontal components together and vertical components together. The resultant arrow is the diagonal of the component parallelogram."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span><span>input vectors</span></div><div class="legend-item"><span class="legend-dot" style="background:#34d399"></span><span>resultant</span></div>');

  install("lines3d", "Angle between lines", { angle: 45 }, function (s) {
    return range("angle", "Projected angle", 0, 90, 1, s.angle, "°");
  }, function (s) {
    var c = Math.cos(s.angle * Math.PI / 180);
    return {
      svg: shell('<line x1="165" y1="220" x2="530" y2="90" stroke="#38bdf8" stroke-width="5"></line><line x1="165" y1="220" x2="530" y2="220" stroke="#f59e0b" stroke-width="5"></line><path d="M235 195 A75 75 0 0 1 275 174" fill="none" stroke="#34d399" stroke-width="3"></path>' +
        text(500, 70, "cos θ = (a₁a₂+b₁b₂+c₁c₂)/(|a₁||a₂|)", "#f8fafc", 14) + text(500, 115, "direction ratios → angle", "#94a3b8", 15)),
      readout: cell("θ", s.angle.toFixed(0) + "°", "#34d399") + cell("cos θ", c.toFixed(3), "#f59e0b"),
      verdict: "<b>3D line angle:</b> direction ratios are enough. The dot product compares how much the two directions point the same way."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span><span>reference direction</span></div>');

  install("lp", "Linear-programming feasible region", { slope: 1 }, function (s) {
    return range("slope", "Objective slope", -2, 3, 0.1, s.slope, "");
  }, function (s) {
    var y1 = 4 - s.slope * 1, y2 = 4 - s.slope * 3;
    return {
      svg: shell('<line x1="95" y1="245" x2="600" y2="245" stroke="#475569"></line><line x1="95" y1="55" x2="95" y2="245" stroke="#475569"></line><polygon points="95,245 95,105 300,105 470,245" fill="#34d39955" stroke="#34d399" stroke-width="3"></polygon>' +
        '<line x1="100" y1="' + (245 - y1 * 35) + '" x2="560" y2="' + (245 - y2 * 35) + '" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 5"></line>' +
        '<circle cx="95" cy="105" r="7" fill="#38bdf8"></circle><circle cx="300" cy="105" r="7" fill="#38bdf8"></circle><circle cx="470" cy="245" r="7" fill="#38bdf8"></circle>' +
        text(500, 65, "objective line slides", "#f8fafc", 17) + text(500, 100, "test the vertices", "#94a3b8", 15)),
      readout: cell("slope", s.slope.toFixed(1)) + cell("candidate points", "vertices", "#34d399") + cell("method", "corner test", "#f59e0b"),
      verdict: "<b>Graphical method:</b> the optimum occurs at a corner of the feasible region unless the objective is constant along an edge."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#34d399"></span><span>feasible region</span></div>');

  install("probability", "Probability tree", { pA: 0.6, pB: 0.3 }, function (s) {
    return range("pA", "P(A)", 0.1, 0.9, 0.05, s.pA, "") + range("pB", "P(B|A)", 0.1, 0.9, 0.05, s.pB, "");
  }, function (s) {
    var joint = s.pA * s.pB, other = (1 - s.pA) * 0.2, total = joint + other;
    return {
      svg: shell('<line x1="110" y1="150" x2="260" y2="90" stroke="#38bdf8" stroke-width="3"></line><line x1="110" y1="150" x2="260" y2="220" stroke="#94a3b8" stroke-width="3"></line><line x1="260" y1="90" x2="470" y2="60" stroke="#34d399" stroke-width="3"></line><line x1="260" y1="90" x2="470" y2="125" stroke="#94a3b8" stroke-width="3"></line><line x1="260" y1="220" x2="470" y2="190" stroke="#f59e0b" stroke-width="3"></line><line x1="260" y1="220" x2="470" y2="250" stroke="#94a3b8" stroke-width="3"></line>' +
        text(100, 140, "start", "#f8fafc", 14) + text(260, 78, "A", "#38bdf8", 17) + text(260, 210, "Aᶜ", "#94a3b8", 17) + text(505, 60, "B", "#34d399", 17) + text(505, 125, "Bᶜ", "#94a3b8", 17) +
        text(505, 190, "B", "#f59e0b", 17) + text(505, 250, "Bᶜ", "#94a3b8", 17)),
      readout: cell("P(A∩B)", joint.toFixed(3), "#34d399") + cell("P(B)", total.toFixed(3), "#f59e0b") + cell("P(A|B)", (joint / Math.max(total, 0.001)).toFixed(3), "#38bdf8"),
      verdict: "<b>Bayes:</b> multiply along a branch, add disjoint branches for P(B), then reverse the condition with P(A|B) = P(A∩B)/P(B)."
    };
  }, '<div class="legend-item"><span class="legend-dot" style="background:#34d399"></span><span>target branch</span></div>');
})();
</script>
  <script>if (window.App && typeof window.App.routeFromHash === "function") window.App.routeFromHash();</script>
