<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 10: Biotechnology and Its Applications — Interactive Textbook</title>
<style>
:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  text-align: left;
  background: #0f172a;
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
}
.play-btn {
  flex: none;
  width: 34px;
  height: 34px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 14px;
}
.video-title {
  font-size: 13px;
  line-height: 1.4;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.q-badge {
  background: var(--soft);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 3px 10px;
  border-radius: 6px;
}
.q-concept-link {
  color: var(--blue);
  text-decoration: none;
  font-size: 13px;

<script>
window.CHAPTER = {"code": "lebo110", "chapterNumber": 10, "book_name": "Biology", "title": "Biotechnology and Its Applications", "subtitle": "Pest-resistant crops and RNAi, recombinant insulin and gene therapy, molecular diagnosis, transgenic animals and the ethics of biopiracy.", "edition": "Reprint 2026-27", "source": "https://ncert.nic.in/textbook/pdf/lebo110.pdf", "page_start": 1, "page_end": 11, "extraction": "PyMuPDF text layer (/tmp/opencode/bio_text/lebo110.txt) + section/exercise page maps in /tmp/opencode/bio_maps.json (key lebo110). SHA-256 4da2923c699b97a1930ae6b1072bf75fb5b0429d724ead7ba06510f98730b826. pdftotext not used. No PNG zooms (prose-quantitative chapter).", "lessons": [{"id": "tissue-culture", "nav": "Tissue culture & micropropagation", "title": "Totipotency to somaclones: explants, meristems and somatic hybrids", "deck": "Any plant cell can regrow a whole plant. Sterile nutrient media turn explants into thousands of identical somaclones; meristems give virus-free plants; fused protoplasts give somatic hybrids such as pomato.", "minutes": 8, "section": "10.1", "pages": [2, 3], "print": "2–3", "sim": "tissueculture", "simTitle": "Explant-to-plantlet stepper: totipotency to somaclones", "quick": ["Three options exist for raising food production — agro-chemical agriculture, organic agriculture and genetically engineered crop-based agriculture. The <strong>Green Revolution tripled food supply</strong>, mainly through better management and agrochemicals, but agrochemicals are too expensive for developing-world farmers and conventional breeding cannot keep pace — so <strong>tissue culture</strong> was developed.", "Scientists learnt in the <strong>1950s</strong> that <strong>whole plants could be regenerated from explants</strong> — any part of a plant taken out and grown in a test tube under sterile conditions in special nutrient media. This capacity of any cell/explant to generate a whole plant is <strong>totipotency</strong>. The medium must supply a carbon source such as <strong>sucrose</strong> plus <strong>inorganic salts, vitamins, amino acids and growth regulators like auxins and cytokinins</strong>.", "Producing <strong>thousands of plants through tissue culture</strong> in very short durations is <strong>micro-propagation</strong>; each plant is genetically identical to the parent — a <strong>somaclone</strong>. Tomato, banana and apple are produced commercially this way. Even from virus-infected plants, the <strong>meristem (apical and axillary) is virus-free</strong>, so culturing it in vitro yields healthy plants — done for <strong>banana, sugarcane and potato</strong>.", "Single cells can be stripped of walls to give naked <strong>protoplasts</strong>; protoplasts of two varieties with desirable characters can be <strong>fused into hybrid protoplasts</strong> grown into new plants — <strong>somatic hybrids</strong> via <strong>somatic hybridisation</strong>. Fusing tomato and potato protoplasts gave <strong>pomato</strong>, which unfortunately lacked the desired combination for commercial use."], "formulas": [{"label": "Totipotency", "html": "any cell / explant —sterile medium→ whole plant", "cond": "Section 10.1; 1950s explant work"}, {"label": "Medium recipe", "html": "sucrose + inorganic salts + vitamins + amino acids + auxins / cytokinins", "cond": "Section 10.1; Exercise 3"}, {"label": "Somatic hybridisation", "html": "protoplast A + protoplast B → hybrid protoplast → plant (pomato = tomato + potato)", "cond": "Section 10.1; not commercialised"}], "deeper": "Note the two precision points the text stresses: the meristem escapes virus that infects the rest of the plant, which is why meristem culture — not leaf or stem cuttings — is the virus-free route; and somaclones are genetically identical to the single parent, so micropropagation multiplies but never improves a variety. The chapter invites a visit to a tissue-culture laboratory to see sterile transfer and media preparation first-hand.", "worked": "Virus-free banana chain: diseased banana plant → excise apical/axillary meristem (virus-free zone) → grow in vitro on sucrose–salts–vitamins–auxin/cytokinin medium → virus-free plantlet → micropropagate into thousands of somaclones → commercial planting of tomato, banana, apple scale stock.", "prediction": {"prompt": "A sugarcane crop is virus-infected, but the farmer needs healthy planting material. Which starting material does Section 10.1 prescribe, and why?", "options": ["Apical/axillary meristem — it is free of virus even in an infected plant, and regenerates whole virus-free plants in vitro", "Any infected leaf — virus spreads evenly so all parts are equivalent", "Mature seeds from the infected plant — seeds always escape virus"], "answer": 0, "explanation": "The text states the meristem is free of virus even when the plant is infected; culturing it in vitro (banana, sugarcane, potato) gives healthy plants."}, "connect": [["Tissue-culture banana and sugarcane in India", "Commercial micropropagation labs multiply elite banana and sugarcane plantlets by the thousand — the somaclone logic of Section 10.1 running as an industry, with meristem-tip culture cleaning up virus-loaded cane.", [], {"id": "530GYX9C1vU", "title": "Biotechnology And its Applications Class 12 One Shot | NCERT + PYQs | Biology Chapter 12", "channel": "NCERT Wallah"}], ["Wow — the pomato that worked but failed", "Tomato + potato protoplasts really did fuse and grow into pomato plants — somatic hybridisation succeeding in the dish yet failing in the market, because the hybrid lacked the desired combination for commercial utilisation."]], "recall": "Define totipotency, explant, somaclone and somatic hybridisation; list the five medium-component groups; state which plant part gives virus-free plants and three crops so recovered.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Totipotency is the capacity of", "options": ["Any cell or explant to generate a whole plant", "Only seeds to germinate in soil", "Only meristems to form flowers"], "answer": 0, "hint": "Section 10.1 defines it right after explants.", "solution": "Totipotency: a whole plant from any cell/explant grown under sterile conditions in special nutrient media.", "wrong": ["Seeds are one route, but totipotency covers any cell.", "Meristems matter for virus-free plants, but totipotency is general."]}, {"level": "Medium", "type": "mcq", "prompt": "Virus-free plants are recovered from a diseased plant by culturing its", "options": ["Apical/axillary meristem in vitro", "Mature infected leaf blades", "Sap squeezed from infected stems"], "answer": 0, "hint": "Which zone does the virus not reach?", "solution": "The meristem is free of virus even in infected plants; banana, sugarcane and potato were so recovered.", "wrong": ["Infected leaves carry the virus.", "Sap from infected stems carries the virus."]}, {"level": "Hard", "type": "mcq", "prompt": "Pomato (tomato + potato somatic hybrid) is best described as", "options": ["A real hybrid that lacked the desired trait combination for commercial use", "A failed fusion that never produced plants", "A seed-cross variety sold commercially across India"], "answer": 0, "hint": "Read the last lines on somatic hybridisation.", "solution": "Fusion succeeded and hybrid plants formed, but without the desired combination of characteristics for commercial utilisation.", "wrong": ["Plants were formed — that is stated.", "It was never commercialised."]}], "resources": [{"title": "NCERT §10.1 — Tissue culture & micropropagation (official PDF, PDF p.2)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo110.pdf#page=2"}]}, {"id": "bt-rnai", "nav": "Bt crops & RNAi", "title": "Cry protoxins and interfering RNA: pest-resistant plants", "deck": "Bt crystals are harmless protoxins until an insect gut activates them. cryIAc/cryIIAb guard cotton, cryIAb guards corn — and host-made dsRNA silences the nematode Meloidegyne incognitia.", "minutes": 9, "section": "10.1", "pages": [3, 4], "print": "3–4", "sim": "btcotton", "simTitle": "cry gene to pest-mortality explorer (bollworm, corn borer, nematode)", "quick": ["Plants, bacteria, fungi and animals with altered genes are <strong>Genetically Modified Organisms (GMO)</strong>. Genetic modification makes crops tolerant to <strong>abiotic stresses</strong> (cold, drought, salt, heat), cuts <strong>chemical pesticide</strong> reliance, reduces <strong>post-harvest losses</strong>, improves <strong>mineral-use efficiency</strong>, and enhances <strong>nutritional value</strong> (e.g. <strong>golden rice, Vitamin A enriched rice</strong>) — plus tailor-made starches, fuels and pharmaceuticals.", "<strong>Bt toxin</strong> from the bacterium <strong>Bacillus thuringiensis</strong> is cloned into plants as a <strong>bio-pesticide</strong> — Bt cotton, Bt corn, rice, tomato, potato, soyabean. Strains kill <strong>lepidopterans</strong> (tobacco budworm, armyworm), <strong>coleopterans</strong> (beetles) and <strong>dipterans</strong> (flies, mosquitoes). The bacterium forms <strong>protein crystals</strong> of <strong>inactive protoxin</strong>; in the insect gut the <strong>alkaline pH solubilises</strong> crystals into active toxin, which <strong>binds midgut epithelial cells, creates pores, swells and lyses cells</strong>, killing the insect. Figure 10.1 contrasts bollworm-destroyed and mature cotton bolls.", "Most Bt toxins are <strong>insect-group specific</strong>, so gene choice follows crop and pest: the toxin gene is <strong>cry</strong> — proteins of <strong>cryIAc and cryIIAb control cotton bollworms</strong>, while <strong>cryIAb controls corn borer</strong>.", "The nematode <strong>Meloidegyne incognitia</strong> infects tobacco roots and slashes yield. Protection uses <strong>RNA interference (RNAi)</strong> — a cellular defense of all eukaryotes in which a <strong>specific mRNA is silenced by complementary dsRNA</strong> that binds and blocks translation (sources: RNA-genome viruses, transposons replicating via RNA). Via <strong>Agrobacterium vectors</strong>, nematode-specific genes enter the host so that <strong>sense and anti-sense RNA</strong> form <strong>dsRNA</strong>, initiating RNAi; the parasite cannot survive in the transgenic host (Figure 10.2: control vs protected roots)."], "formulas": [{"label": "Bt activation", "html": "inactive protoxin crystal —alkaline gut→ active toxin → midgut pores → lysis → insect death", "cond": "Section 10.1; Exercise 4 answer (c)"}, {"label": "cry gene table", "html": "cryIAc + cryIIAb → cotton bollworms; cryIAb → corn borer", "cond": "Section 10.1; insect-group specific"}, {"label": "RNAi protection", "html": "sense + anti-sense RNA → dsRNA → mRNA silencing → nematode cannot survive", "cond": "Section 10.1; Meloidegyne incognitia via Agrobacterium"}], "deeper": "Exercise 4 is answered inside the mechanism: the crystals do not kill Bacillus because the toxin exists as inactive protoxin — option (c) — and only the alkaline insect gut converts it. Note the specificity ladder the text builds: protoxin chemistry (who it can kill), cry-gene choice (which pest it targets), then RNAi (which mRNA it silences) — three different locks, one pest-resistant plant.", "worked": "Exercise 4 chain: Bt forms crystals → protein is inactive protoxin inside bacteria → insect ingests → alkaline gut pH solubilises crystals → active toxin → midgut pores → swelling/lysis → death. Hence (a) resistance, (b) immaturity and (d) special sac are all wrong; (c) toxin is inactive is correct.", "prediction": {"prompt": "A cotton bollworm chews leaves of Bt cotton carrying cryIAc/cryIIAb. What follows, per Section 10.1?", "options": ["Ingested protoxin activates in the alkaline gut, binds midgut cells, forms pores and kills the larva", "The protoxin poisons the Bacillus cells inside the leaf first", "Nothing — cry proteins only work against corn borers"], "answer": 0, "explanation": "Alkaline-gut activation → midgut binding → pores → lysis → death; cryIAc/cryIIAb specifically control cotton bollworms."}, "connect": [["Bt cotton in Maharashtra and Gujarat", "Cotton belts with heavy bollworm pressure adopted Bt cotton carrying cryIAc/cryIIAb precisely to cut insecticide sprays — the textbook bio-pesticide logic working at state scale, with gene choice matched to the targeted pest."], ["Wow — the plant that vaccinates itself with RNA", "The tobacco plant is engineered to manufacture both sense and anti-sense strands so the double helix that kills no one silences exactly one nematode mRNA — immunity written as complementarity."]], "recall": "State the cry-gene table, the protoxin activation sequence, and the four RNAi steps from Agrobacterium delivery to nematode failure.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Bt toxin crystals do not kill Bacillus themselves because", "options": ["The toxin is inactive (protoxin)", "Bacteria enclose toxin in a special sac", "Bacteria are resistant to the active toxin"], "answer": 0, "hint": "Exercise 4 — options (a) to (d).", "solution": "Option (c): the protein exists as inactive protoxin; only the alkaline insect gut converts it to the active form.", "wrong": ["No sac is described in the text.", "Resistance is not the mechanism; inactivity is."]}, {"level": "Medium", "type": "mcq", "prompt": "The gene cryIAb is deployed against", "options": ["Corn borer", "Cotton bollworms", "Tobacco root nematode"], "answer": 0, "hint": "cryIAc/cryIIAb do cotton; what is left?", "solution": "cryIAb controls the corn borer; cryIAc and cryIIAb control cotton bollworms.", "wrong": ["Cotton bollworms need cryIAc and cryIIAb.", "The nematode is handled by RNAi, not cry genes."]}, {"level": "Hard", "type": "number", "map": "Section 10.1", "prompt": "Number of cry genes named in the text for controlling cotton bollworms", "answer": 2, "unit": "genes", "tolerance": 0.1, "hint": "cryIAc and …?", "solution": "Two: cryIAc and cryIIAb control the cotton bollworms."}], "resources": [{"title": "NCERT §10.1 — Bt crops & RNAi (official PDF, PDF p.3)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo110.pdf#page=3"}]}, {"id": "insulin-genetherapy", "nav": "Insulin & gene therapy", "title": "From proinsulin C-peptide to Eli Lilly E. coli — and the 1990 ADA cure attempt", "deck": "Mature insulin is just A (21) + B (30) chains; the C peptide (33) is cut away. In 1983 Eli Lilly built both chains in E. coli; in 1990 a 4-year-old ADA-deficient girl received the first clinical gene therapy.", "minutes": 9, "section": "10.2.1, 10.2.2", "pages": [5, 6], "print": "5–6", "sim": "insulin", "simTitle": "Proinsulin-to-insulin chain remover + ADA lymphocyte timeline", "quick": ["Recombinant DNA healthcare gives <strong>mass-produced, safe, effective therapeutics</strong> with <strong>no unwanted immunological responses</strong> (unlike animal-source products): about <strong>30 recombinant therapeutics approved worldwide, 12 marketed in India</strong>. Diabetes management needs regular insulin; earlier insulin came from <strong>slaughtered cattle and pig pancreas</strong> and caused <strong>allergy/reactions to the foreign protein</strong> in some patients.", "<strong>Insulin has two short polypeptide chains, A and B, linked by disulphide bridges</strong> (Figure 10.3). In mammals it is synthesised as a <strong>pro-hormone with an extra C peptide</strong> that is <strong>absent in mature insulin — removed during maturation</strong>. The rDNA challenge was assembling mature insulin. In <strong>1983, Eli Lilly (American company)</strong> prepared <strong>two DNA sequences for chains A and B</strong>, introduced them in <strong>E. coli plasmids</strong>, produced the chains <strong>separately</strong>, extracted them and <strong>combined them with disulfide bonds</strong> into human insulin.", "<strong>Gene therapy</strong> corrects a diagnosed gene defect in a child/embryo by <strong>inserting genes into cells/tissues</strong> — a normal gene compensating for the non-functional one. The <strong>first clinical gene therapy (1990)</strong> went to a <strong>4-year-old girl with adenosine deaminase (ADA) deficiency</strong> — the enzyme crucial for immunity, its gene deleted. Alternatives exist: <strong>bone-marrow transplantation</strong> cures some children, <strong>enzyme-replacement injections</strong> treat others — but neither is completely curative.", "The ADA protocol: <strong>lymphocytes from patient blood are cultured outside the body</strong>, a <strong>functional ADA cDNA via retroviral vector</strong> enters them, and they are <strong>returned to the patient</strong>. These cells are <strong>not immortal, so periodic infusion</strong> is needed; introducing the marrow-cell ADA gene at <strong>early embryonic stages could be a permanent cure</strong>."], "formulas": [{"label": "Insulin chains (Fig. 10.3)", "html": "chain A (21 aa) + chain B (30 aa), disulphide-linked; proinsulin = A + C (33) + B → mature A + B", "cond": "Sections 10.2.1; C peptide removed on maturation"}, {"label": "1983 Eli Lilly route", "html": "A-DNA + B-DNA → E. coli plasmids → separate chains → extract → disulfide assembly", "cond": "Section 10.2.1"}, {"label": "1990 ADA protocol", "html": "patient lymphocytes out → retroviral ADA cDNA in → cells back (periodic; non-immortal)", "cond": "Section 10.2.2"}], "deeper": "The chapter poses two think-questions this lesson answers: whether insulin can be given orally (no — a protein, digested; see Exercises 12–13 and the blood protease/nuclease discussion), and why bacterial human insulin beats cattle/pig insulin (identical to the human molecule, so no foreign-protein allergy). Note the careful wording: 1990 was the first clinical gene therapy, given to a 4-year-old — both facts are fixture-checked in verify.cjs.", "worked": "C-peptide removal math: chain A = 21 amino acids, chain B = 30, so mature insulin = 21 + 30 = 51 amino acids joined by disulphide bridges. Proinsulin adds the C peptide (33) — 21 + 30 + 33 = 84 — all of which is cut away during maturation, leaving C-free mature insulin. ADA timeline: 1983 (Eli Lilly insulin) → 1990 (first ADA gene therapy, age 4) → 1997 (Rosie) — seven-year steps.", "prediction": {"prompt": "A lab test finds C peptide in a sample labelled mature insulin. What is the verdict?", "options": ["Mislabeled or immature — C peptide is removed during maturation and absent in mature insulin", "Correct — mature insulin always retains the C peptide", "Correct — C peptide is added after maturation"], "answer": 0, "explanation": "Proinsulin's extra C stretch is removed on maturation; mature insulin is A + B only (Figure 10.3)."}, "connect": [["Diabetes care in India and the 12 marketed therapeutics", "With a vast diabetic population, India markets 12 of the ~30 approved recombinant therapeutics — bacterial human insulin replacing cattle/pig extracts that once caused allergy is Section 10.2.1 in every pharmacy."], ["Wow — science-fiction surgery in 1990", "Blood drawn from a 4-year-old girl, her own lymphocytes reprogrammed with a retroviral ADA gene and dripped back — the first clinical gene therapy, periodic because the repaired cells are mortal."]], "recall": "State chain counts (A21/B30/C33), the 1983 Eli Lilly assembly order, and the five ADA protocol steps with year and patient age.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Mature insulin differs from proinsulin in that", "options": ["The C peptide is removed during maturation", "An extra C peptide is added during maturation", "Chains A and B are never linked"], "answer": 0, "hint": "Figure 10.3 — what leaves?", "solution": "Pro-hormone carries an extra C stretch; maturation removes it, leaving disulphide-linked A + B.", "wrong": ["Nothing is added at maturation.", "A and B are linked by disulphide bridges."]}, {"level": "Medium", "type": "mcq", "prompt": "Eli Lilly (1983) produced human insulin by", "options": ["Expressing A and B DNAs separately in E. coli plasmids, then joining the chains with disulfide bonds", "Extracting larger volumes of cattle pancreas", "Fusing human and pig insulin genes in yeast"], "answer": 0, "hint": "Two DNA sequences, two chains, one assembly.", "solution": "Two DNAs for A and B in E. coli plasmids; chains made separately, extracted, combined by disulfide bonds.", "wrong": ["Animal extraction is the old allergic route.", "No human–pig fusion is described."]}, {"level": "Hard", "type": "number", "map": "Figure 10.3", "prompt": "Amino acids in one mature human insulin molecule (A 21 + B 30)", "answer": 51, "unit": "aa", "tolerance": 0.1, "hint": "21 + 30.", "solution": "21 + 30 = 51 amino acids in mature insulin; proinsulin adds C (33) for 84."}], "resources": [{"title": "NCERT §10.2.1, 10.2.2 — Insulin & gene therapy (official PDF, PDF p.5)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo110.pdf#page=5"}]}, {"id": "diagnosis-transgenic", "nav": "Diagnosis & transgenic animals", "title": "PCR, probes and ELISA — plus Rosie, the 2.4 g/L cow", "deck": "PCR amplifies what eyes cannot see, probes fish for mutant genes on film, ELISA reads antigen–antibody binding. Transgenic animals — 95% mice — model disease, test vaccines and manufacture milk like Rosie's.", "minutes": 9, "section": "10.2.3, 10.3", "pages": [6, 8], "print": "6–8", "sim": "transgenic", "simTitle": "Rosie/Tracy trait explorer with PCR-vs-ELISA-vs-probe matcher", "quick": ["Effective treatment needs <strong>early diagnosis</strong>, but conventional <strong>serum/urine analysis cannot detect disease early</strong>. Recombinant DNA technology plus <strong>PCR</strong> and <strong>ELISA</strong> fill the gap. A pathogen is usually suspected only after symptoms, when its concentration is already high — yet <strong>very low bacterial/viral counts are detectable by amplifying their nucleic acid with PCR</strong>: routine for <strong>HIV in suspected AIDS</strong>, <strong>mutations in suspected cancer</strong>, and other genetic disorders.", "A <strong>single-stranded DNA/RNA probe tagged with a radioactive molecule</strong> is hybridised to its complementary DNA in cell clones and detected by <strong>autoradiography</strong>: the clone with the <strong>mutated gene does not appear on the photographic film</strong>, lacking complementarity. <strong>ELISA</strong> rests on <strong>antigen–antibody interaction</strong> — infection is read through <strong>pathogen antigens (proteins, glycoproteins) or the antibodies</strong> made against them.", "Animals with manipulated DNA carrying an <strong>extra foreign gene</strong> are <strong>transgenic animals</strong> — rats, rabbits, pigs, sheep, cows, fish, though <strong>over 95% are mice</strong>. They serve (i) <strong>normal physiology/development</strong> studies (e.g. insulin-like growth factor regulation via foreign genes) and (ii) <strong>disease models</strong> for <strong>cancer, cystic fibrosis, rheumatoid arthritis and Alzheimer’s</strong> to test new treatments.", "(iii) <strong>Biological products</strong>: transgenic animals make useful human proteins such as <strong>α-1-antitrypsin for emphysema</strong> (the transgenic sheep Tracy, 1990 — companion detail beyond the reprint naming), with similar attempts for <strong>PKU and cystic fibrosis</strong>. In <strong>1997 the first transgenic cow Rosie produced human protein-enriched milk (2.4 grams per litre)</strong> carrying <strong>human alpha-lactalbumin</strong> — more balanced for human babies than natural cow milk. (iv) <strong>Vaccine safety</strong>: transgenic mice test <strong>polio vaccine</strong> batches, potentially replacing monkeys. (v) <strong>Chemical/toxicity safety testing</strong>: gene-carrying animals more sensitive to toxins give results in less time."], "formulas": [{"label": "Diagnosis trio", "html": "PCR (amplify nucleic acid) · probe (hybridise + autoradiography) · ELISA (antigen–antibody)", "cond": "Section 10.2.3; low-count detection"}, {"label": "Transgenic share", "html": ">95% of all transgenic animals are mice", "cond": "Section 10.3"}, {"label": "Rosie 1997", "html": "human alpha-lactalbumin milk = 2.4 g/L", "cond": "Section 10.3; first transgenic cow"}], "deeper": "The probe paragraph is an exam trap: the mutated clone is the one missing from the film, because the probe finds no complement to bind — absence is the signal. Contrast the three tools by what each detects: PCR detects nucleic acid itself (amplified), probes detect sequence complementarity (hybridised), ELISA detects proteins or antibodies (bound). On transgenics, memorise the five purposes in order — physiology, disease, products, vaccines, toxicity — each with its book example.", "worked": "Rosie arithmetic: 2.4 g/L means 2.4 g per 1000 mL; a 500 mL bottle carries 1.2 g of human alpha-lactalbumin, a 250 mL glass 0.6 g (600 mg). Mice arithmetic: in any 100 transgenic animals, more than 95 are mice — fewer than 5 are rats, rabbits, pigs, sheep, cows and fish combined.", "prediction": {"prompt": "A blood sample may carry a few copies of HIV, far below symptom levels. Which tool does Section 10.2.3 reach for first?", "options": ["PCR — amplify the viral nucleic acid until the tiny count becomes detectable", "Waiting for symptoms so conventional serum analysis works", "ELISA for insulin chains, which also detects viruses"], "answer": 0, "explanation": "Very low pathogen concentrations are detected by amplifying nucleic acid with PCR; the text cites HIV detection explicitly."}, "connect": [["Polio-vaccine safety and pulse polio in India", "Transgenic mice that could replace monkeys in polio-vaccine batch testing matter to a country that ran pulse-polio campaigns — Section 10.3 vaccine safety at population scale."], ["Wow — a cow that nurses like a human", "Rosie's milk carries 2.4 grams per litre of human alpha-lactalbumin — a cow udder manufacturing a human baby protein, nutritionally more balanced than natural cow milk."]], "recall": "Contrast PCR, probe and ELISA by target and readout; list the five transgenic purposes with one example each; state the mice percentage and Rosie facts.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "PCR helps early diagnosis because it", "options": ["Amplifies pathogen nucleic acid so very low counts become detectable", "Photographs antibodies directly in serum", "Removes the C peptide from proinsulin"], "answer": 0, "hint": "What does PCR multiply?", "solution": "Amplification of nucleic acid reveals bacteria/viruses before symptoms; used for HIV and cancer mutations.", "wrong": ["Serum analysis is the conventional method PCR improves on.", "C-peptide removal is insulin maturation, not diagnosis."]}, {"level": "Medium", "type": "mcq", "prompt": "In probe autoradiography, the clone carrying the mutated gene", "options": ["Does not appear on the film — the probe lacks complementarity", "Glows brightest because mutation attracts probe", "Appears only after ELISA staining"], "answer": 0, "hint": "No complement, no hybrid, no signal.", "solution": "The probe hybridises only to complementary DNA; the mutated clone stays blank on the photographic film.", "wrong": ["Mutation destroys binding, not strengthens it.", "ELISA is a different, antigen–antibody technique."]}, {"level": "Hard", "type": "number", "map": "Section 10.3", "prompt": "Milligrams of human alpha-lactalbumin in a 250 mL glass of Rosie's milk (2.4 g/L)", "answer": 600, "unit": "mg", "tolerance": 1, "hint": "2.4 g/L × 0.25 L × 1000.", "solution": "2.4 × 0.25 = 0.6 g = 600 mg per 250 mL glass."}], "resources": [{"title": "NCERT §10.2.3, 10.3 — Diagnosis & transgenic animals (official PDF, PDF p.6)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo110.pdf#page=6"}]}, {"id": "ethics-biopiracy", "nav": "Ethics & biopiracy", "title": "GEAC, Basmati patents and biopiracy: who owns genetic wealth?", "deck": "Manipulation needs regulation: GEAC judges GM safety in India. Basmati's 1997 US patent, turmeric and neem claims, and the biopiracy fight over benefit-sharing close the chapter.", "minutes": 8, "section": "10.4", "pages": [8, 9], "print": "8–9", "sim": "ethics", "simTitle": "Biopiracy case sorter + GEAC approval explorer", "quick": ["Manipulating living organisms <strong>cannot go on without regulation</strong> — ethical standards plus the <strong>biological risk of unpredictable results when GM organisms enter ecosystems</strong>. India set up the <strong>GEAC (Genetic Engineering Approval Committee)</strong>, which decides the <strong>validity of GM research and the safety of introducing GM organisms for public services</strong>.", "<strong>Rice goes back thousands of years in Asian agriculture; India alone holds ~200,000 varieties</strong>, among the world's richest diversity, with <strong>27 documented Basmati varieties</strong> celebrated since ancient texts, folklore and poetry. In <strong>1997 an American company won Basmati patent rights from the US Patent and Trademark Office</strong> — Indian farmer varieties crossed with semi-dwarf lines, claimed as novelty, with the patent reaching <strong>functional equivalents</strong> that could restrict other Basmati sellers.", "Similar patent attempts target <strong>Indian traditional herbal medicines such as turmeric and neem</strong> — uses, products and processes. <strong>Biopiracy</strong> is the use of <strong>bio-resources by multinationals/organisations without proper authorisation and without compensatory payment</strong>. Industrialised nations are <strong>financially rich but biodiversity-poor</strong>; the developing world is <strong>biodiversity-rich with traditional knowledge</strong> that saves commercialisation time, effort and expenditure.", "The chapter closes on <strong>injustice and inadequate compensation/benefit-sharing</strong>: nations now legislate against unauthorised exploitation, and the <strong>Indian Parliament cleared the second amendment of the Indian Patents Bill</strong> covering patent terms, emergency provisions, research and development."], "formulas": [{"label": "GEAC mandate", "html": "validity of GM research + safety of GM release for public services", "cond": "Section 10.4; Govt. of India"}, {"label": "Biopiracy", "html": "bio-resource + traditional knowledge → patent/use with no authorisation and no compensation", "cond": "Section 10.4"}, {"label": "Basmati numbers", "html": "~200,000 Indian rice varieties; 27 Basmati; US patent 1997", "cond": "Section 10.4"}], "deeper": "Read the asymmetry sentence as the chapter's thesis: money on one side, biodiversity plus traditional knowledge on the other — biopiracy arbitrages that gap. The Basmati case shows three patent overreaches at once: farmer varieties as raw material, a cross claimed as invention, and functional-equivalents language reaching beyond the single variety. Vigilance plus the Patents Bill amendment is the prescribed defence.", "worked": "Basmati case sort: (1) resource — Indian farmer Basmati varieties (ancient, documented, 27 grown); (2) act — cross with semi-dwarf lines, US patent 1997 covering functional equivalents; (3) verdict — biopiracy pattern (no authorisation/compensation); (4) remedy — challenge patents, legislate benefit-sharing (Patents Bill second amendment). Same sieve sorts turmeric and neem claims.", "prediction": {"prompt": "A foreign firm patents a wound-healing turmeric formulation long used in Indian homes, with no permission or payment. Per Section 10.4 this is", "options": ["Biopiracy — traditional-knowledge bio-resource use without authorisation or compensatory payment", "Valid novelty — ancient use counts as invention by the firm", "A GEAC vaccine-safety approval"], "answer": 0, "explanation": "The text names turmeric among traditional-medicine patent attempts and defines such unauthorised, uncompensated use as biopiracy."}, "connect": [["GEAC and the GM-mustard debate in India", "GEAC's mandate — judging GM research validity and release safety — is the same lens turned on Bt brinjal's moratorium and GM mustard's appraisal: regulation deciding what enters Indian fields and plates."], ["Wow — patents that got revoked", "Turmeric's wound-healing patent and neem claims became global textbook cases of biopiracy challenged — ancient Indian knowledge forcing modern patent offices to back down when vigilance kicked in."]], "recall": "Expand GEAC and state its two decisions; define biopiracy exactly; quote the rice/Basmati numbers and the 1997 patent facts.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "GEAC is the", "options": ["Genetic Engineering Approval Committee — decides GM research validity and release safety", "General ELISA and Antibody Council for diagnosis", "Gene Extraction and Cloning unit of Eli Lilly"], "answer": 0, "hint": "Section 10.4 names the Indian body.", "solution": "Set up by the Indian Government for GM research validity and the safety of introducing GM organisms for public services.", "wrong": ["ELISA is a diagnostic technique, not a committee.", "Eli Lilly made insulin in 1983; GEAC is Indian regulation."]}, {"level": "Medium", "type": "mcq", "prompt": "Biopiracy means", "options": ["Using bio-resources without proper authorisation and without compensatory payment", "Pirating ships that carry Basmati rice", "Any laboratory use of bacteria"], "answer": 0, "hint": "Authorisation + compensation — whose definition?", "solution": "Multinationals/organisations exploiting bio-resources and traditional knowledge without permission or payment.", "wrong": ["No ships are involved.", "Laboratory use with approval is legitimate research."]}, {"level": "Hard", "type": "number", "map": "Section 10.4", "prompt": "Documented varieties of Basmati grown in India, per the text", "answer": 27, "unit": "varieties", "tolerance": 0.1, "hint": "Against ~200,000 total rice varieties.", "solution": "27 documented Basmati varieties; ~200,000 rice varieties in India alone."}], "resources": [{"title": "NCERT §10.4 — Ethics & biopiracy (official PDF, PDF p.8)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo110.pdf#page=8"}]}], "exercises": [{"number": 1, "conceptIdx": 0, "page": 10, "printPage": null, "question": "Which part of the plant is best suited for making virus-free plants and why?", "steps": ["Even in a virus-infected plant, the meristem (apical and axillary) is free of virus.", "Remove the meristem and grow it in vitro under sterile conditions in special nutrient media.", "The regenerated plantlets are healthy/virus-free — achieved for banana, sugarcane and potato."], "answer": "Apical/axillary meristem — virus-free even in infected plants; in-vitro culture gives healthy plants."}, {"number": 2, "conceptIdx": 0, "page": 10, "printPage": null, "question": "What is the major advantage of producing plants by micropropagation?", "steps": ["Micropropagation yields thousands of plants in very short durations from one explant.", "All plants are genetically identical to the parent (somaclones), preserving elite traits.", "Combined with meristem culture it also gives virus-free stock; commercial scale for tomato, banana, apple."], "answer": "Thousands of genetically identical (somaclone), optionally virus-free plants in very short time."}, {"number": 3, "conceptIdx": 0, "page": 10, "printPage": null, "question": "Find out what the various components of the medium used for propagation of an explant in vitro are?", "steps": ["Carbon source such as sucrose.", "Inorganic salts, vitamins and amino acids.", "Growth regulators like auxins and cytokinins; sterile test-tube conditions throughout."], "answer": "Sucrose + inorganic salts + vitamins + amino acids + auxins/cytokinins (sterile in vitro)."}, {"number": 4, "conceptIdx": 1, "page": 10, "printPage": null, "question": "Crystals of Bt toxin produced by some bacteria do not kill the bacteria themselves because – (a) bacteria are resistant to the toxin (b) toxin is immature; (c) toxin is inactive; (d) bacteria encloses toxin in a special sac.", "steps": ["Bt forms protein crystals containing a toxic insecticidal protein.", "Inside Bacillus the protein exists as inactive protoxin.", "Activation needs the alkaline gut pH of the insect (solubilises crystals); hence (c) is correct and (a), (b), (d) are wrong."], "answer": "(c) toxin is inactive (protoxin; activated only in the alkaline insect gut)."}, {"number": 5, "conceptIdx": 2, "page": 11, "printPage": null, "question": "What are transgenic bacteria? Illustrate using any one example.", "steps": ["Transgenic bacteria carry and express an extra (foreign) gene introduced by rDNA methods.", "Example: E. coli carrying the human insulin A-chain and B-chain DNAs in plasmids (Eli Lilly, 1983).", "The two chains are produced separately, extracted and joined by disulfide bonds into human insulin."], "answer": "Bacteria with a foreign expressed gene — e.g. E. coli producing human insulin chains (1983)."}, {"number": 6, "conceptIdx": 1, "page": 11, "printPage": null, "question": "Compare and contrast the advantages and disadvantages of production of genetically modified crops.", "steps": ["Advantages: abiotic-stress tolerance; pest resistance (less pesticide); less post-harvest loss; efficient mineral use; enriched nutrition (golden rice); tailor-made starches, fuels, pharmaceuticals.", "Disadvantages: unpredictable ecosystem results on release; need for regulation (GEAC); patent/biopiracy conflicts over genetic resources.", "Verdict: benefits are agronomic and nutritional; risks are ecological, ethical and legal — hence case-by-case approval."], "answer": "Advantages (i)–(v) + tailor-made products vs unpredictable ecosystem/patent risks; regulated by GEAC."}, {"number": 7, "conceptIdx": 1, "page": 11, "printPage": null, "question": "What are Cry proteins? Name an organism that produce it. How has man exploited this protein to his benefit?", "steps": ["Cry proteins are the insecticidal Bt toxin proteins coded by cry genes.", "Organism: the bacterium Bacillus thuringiensis, which forms protoxin protein crystals.", "Exploitation: cry genes (cryIAc/cryIIAb for cotton bollworms; cryIAb for corn borer) expressed in crops — Bt cotton, corn, rice, tomato, potato, soyabean — as built-in bio-pesticide."], "answer": "Bt protoxin proteins of Bacillus thuringiensis; cry genes in pest-resistant Bt crops."}, {"number": 8, "conceptIdx": 2, "page": 11, "printPage": null, "question": "What is gene therapy? Illustrate using the example of adenosine deaminase (ADA) deficiency.", "steps": ["Gene therapy inserts genes into cells/tissues to correct a diagnosed gene defect (child/embryo).", "ADA deficiency (deleted ADA gene; immune failure) — first clinical therapy 1990 in a 4-year-old girl.", "Patient lymphocytes cultured outside the body receive functional ADA cDNA via retroviral vector, then return to the patient; cells are mortal so infusion repeats; early-embryonic delivery could cure permanently."], "answer": "Corrective gene insertion — e.g. retroviral ADA cDNA into patient lymphocytes (1990, age 4)."}, {"number": 9, "conceptIdx": 2, "page": 11, "printPage": null, "question": "Digrammatically represent the experimental steps in cloning and expressing an human gene (say the gene for growth hormone) into a bacterium like E. coli ?", "steps": ["Isolate the human growth-hormone gene and cut it plus a plasmid vector with the same restriction enzyme.", "Ligate into recombinant plasmid (foreign gene + vector).", "Introduce into E. coli host, select transformants, culture at scale, express the protein, then downstream processing/purification.", "Draw as a flow-chart: gene → cut → ligate → transform → select → grow → express → purify. (Stem keeps the textbook spelling “Digrammatically”.)"], "answer": "Flow-chart: isolate → cut → ligate → transform E. coli → select → culture → express → downstream processing."}, {"number": 10, "conceptIdx": 1, "page": 11, "printPage": null, "question": "Can you suggest a method to remove oil (hydrocarbon) from seeds based on your understanding of rDNA technology and chemistry of oil?", "steps": ["Open-ended: clone genes for hydrocarbon-degrading/modifying enzymes into a suitable host or the seed system.", "Express enzymes that break or alter the oil chemistry so the hydrocarbon fraction separates from seed material.", "Recover/purify via downstream processing. Honest note: the chapter gives no single NCERT key for this problem question."], "answer": "rDNA route: express hydrocarbon-acting enzymes, then separate — open-ended, no single textbook key."}, {"number": 11, "conceptIdx": 1, "page": 11, "printPage": null, "question": "Find out from internet what is golden rice.", "steps": ["Golden rice is a genetically modified, Vitamin A enriched rice cited in Section 10.1.", "It exemplifies enhanced nutritional value of food by genetic modification.", "Honest note: molecular detail (beta-carotene pathway genes) is internet beyond-scope enrichment, not in this reprint."], "answer": "Vitamin A enriched GM rice — enhanced-nutrition example (detail beyond this reprint)."}, {"number": 12, "conceptIdx": 2, "page": 11, "printPage": null, "question": "Does our blood have proteases and nucleases?", "steps": ["Yes — blood carries proteases (e.g. clotting-cascade and complement proteases) and nucleases that clear extracellular nucleic acids.", "This is the same chemistry behind Exercise 13: injected/oral protein or DNA therapeutics face enzymatic digestion in the body.", "Hence recombinant proteins need protection/delivery design; the text links this to why insulin is not orally administered."], "answer": "Yes — clotting/complement proteases and clearing nucleases circulate in blood."}, {"number": 13, "conceptIdx": 2, "page": 11, "printPage": null, "question": "Consult internet and find out how to make orally active protein pharmaceutical. What is the major problem to be encountered?", "steps": ["Major problem: stomach acid plus digestive/blood proteases (see Exercise 12) digest protein drugs; poor gut absorption adds a second barrier — the chapter's own insulin question.", "Strategies researched: protective encapsulation/coatings, protease inhibitors, absorption enhancers, analogues.", "Honest note: working detail is internet beyond-scope; the textbook's verdict is that oral protein delivery remains the core unsolved problem."], "answer": "Problem: proteolytic digestion + poor absorption; protection/delivery strategies are beyond-scope research."}], "pageOffset": null, "printPageStart": null, "printPageEnd": null, "paginationProvenance": "folio-absent-in-source"};
