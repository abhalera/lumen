<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 11: Organisms and Populations — Interactive Textbook</title>
<style>
:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  text-align: left;
  background: #0f172a;
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
}
.play-btn {
  flex: none;
  width: 34px;
  height: 34px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 14px;
}
.video-title {
  font-size: 13px;
  line-height: 1.4;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.q-badge {
  background: var(--soft);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 3px 10px;
  border-radius: 6px;
}
.q-concept-link {
  color: var(--blue);
  text-decoration: none;
  font-size: 13px;

<script>
window.CHAPTER = {"code": "lebo111", "chapterNumber": 11, "book_name": "Biology", "title": "Organisms and Populations", "subtitle": "Population attributes and growth, life history and the Table 11.1 interactions — from exponential r to fig–wasp mutualism and plant defenses.", "edition": "Reprint 2026-27", "source": "https://ncert.nic.in/textbook/pdf/lebo111.pdf", "page_start": 1, "page_end": 17, "extraction": "PyMuPDF text layer (/tmp/opencode/bio_text/lebo111.txt) + section/exercise page maps in /tmp/opencode/bio_maps.json (key lebo111). SHA-256 5b483a3ee69f88ae67b43daa8095e5e5ba6278bb1f288fb1cdcd3b02f461276f. pdftotext not used. No PNG zooms (disk nearly full; prose-quantitative chapter).", "lessons": [{"id": "population-attributes", "nav": "Attributes & age pyramids", "title": "Populations have birth rates, sex ratios and age pyramids — individuals do not", "deck": "A lotus pond has a birth rate; a single lotus has only a birth. Per-capita rates, sex ratio, age pyramids (expanding/stable/declining) and density N — counted, weighed or trapped.", "minutes": 9, "section": "11.1, 11.1.1", "pages": [3, 5], "print": "3–5", "sim": "agepyramid", "simTitle": "Age-pyramid builder: expanding / stable / declining", "quick": ["In nature we rarely find isolated single individuals; groups in a well defined geographical area that share or compete for similar resources, potentially interbreed and thus constitute a <strong>population</strong> — cormorants in a wetland, rats in an abandoned dwelling, teakwood trees in a forest tract, bacteria in a culture plate, lotus plants in a pond. Even a group from asexual reproduction counts for ecological studies. It is at the population level that natural selection operates, linking ecology to population genetics and evolution.", "A population has attributes an individual does not. Births and deaths become per-capita <strong>birth rates and death rates</strong>: 20 lotus plants plus 8 new plants gives a birth rate of 8/20 = <strong>0.4 offspring per lotus per year</strong>; 4 deaths among 40 fruitflies in a week gives a death rate of 4/40 = <strong>0.1 individuals per fruitfly per week</strong>. <strong>Sex ratio</strong> is likewise a population trait (e.g. 60 per cent females, 40 per cent males).", "Plotting age distribution gives the <strong>age pyramid</strong> (Figure 11.1; for humans, males and females shown together). Its shape reflects growth status: <strong>(a) expanding</strong> (broad base, many young), <strong>(b) stable</strong> (even sides) or <strong>(c) declining</strong> (narrow base).", "Ecological effects are evaluated as change in <strong>population size, technically population density (N)</strong> — from &lt;10 Siberian cranes at Bharatpur wetlands in any year to millions of Chlamydomonas in a pond. Total number is not always meaningful: 200 carrot-grass (Parthenium) plants vs one huge banyan — <strong>per cent cover or biomass</strong> is better. Huge or hidden populations are estimated indirectly: bacteria by density in a petri dish, fish by <strong>catch per trap</strong>, tigers by <strong>pug marks and fecal pellets</strong>."], "formulas": [{"label": "Per-capita birth rate", "html": "birth rate = new individuals / initial N (e.g. 8/20 = 0.4 per lotus per year)", "cond": "Section 11.1.1; lotus example"}, {"label": "Per-capita death rate", "html": "death rate = deaths / initial N (e.g. 4/40 = 0.1 per fruitfly per week)", "cond": "Section 11.1.1; fruitfly example"}, {"label": "Density change", "html": "N<sub>t+1</sub> = N<sub>t</sub> + [(B + I) − (D + E)]", "cond": "Figure 11.2; B births, I immigration, D deaths, E emigration"}], "deeper": "Note the two precision points the text stresses: rates are always per capita with respect to members of the population, never raw counts; and density N need not be numbers — biomass, per cent cover and relative indices (catch per trap, pug marks) are legitimate when counting is meaningless, impossible or too slow. The age-pyramid shape is a diagnostic of whether the population is growing, stable or declining, not a count of any single age class.", "worked": "Lotus check: start 20, add 8 → N = 28; birth rate 8/20 = 0.4 per capita per year. Fruitfly check: 4 deaths / 40 = 0.1 per capita per week. Density contrast: Siberian cranes &lt;10 (Bharatpur, count each bird) vs Chlamydomonas in millions (density per mL) vs banyan vs Parthenium (cover/biomass, not stems).", "prediction": {"prompt": "A pond has 20 lotus plants; a year later there are 28 after 8 new plants and no deaths. A lab has 40 fruitflies; 4 die in a week. Which statements are correct?", "options": ["Lotus birth rate is 0.4 per capita per year and fruitfly death rate is 0.1 per capita per week", "An individual lotus has a birth rate of 8 and an individual fruitfly has a death rate of 4", "Sex ratio and age pyramid can be read off a single plant or fly"], "answer": 0, "explanation": "Rates are per-capita population attributes (8/20, 4/40). Individuals have births/deaths; only populations have rates, sex ratios and pyramids."}, "connect": [["Tiger census by pug marks and pellets", "India's tiger census in national parks and reserves is often based on pug marks and fecal pellets — the textbook's indirect-density method — because counting every tiger by sight is impossible across Kaziranga, Kanha or Corbett.", [], {"id": "k2XIpxQgSHo", "title": "Organism And Population Class 12 One Shot | NCERT + PYQs | Biology Chapter 11 By Aarushi Ma'am", "channel": "NCERT Wallah"}], ["Wow — fewer than 10 cranes vs millions of algae", "Siberian cranes at Bharatpur (Keoladeo) wetlands in any year number under 10 and are counted bird-by-bird, while a pond's Chlamydomonas runs into millions per litre — the same symbol N spans seven orders of magnitude, which is why biomass, cover and catch-per-trap exist."]], "recall": "Define population; compute per-capita birth/death rates for the lotus and fruitfly examples; sketch the three age-pyramid shapes and state what each means; give one case each where numbers, biomass/cover and indirect indices are the right density measure.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Which is a population attribute rather than an individual trait?", "options": ["Birth rate (per-capita births)", "Birth of one lotus plant", "Death of one fruitfly"], "answer": 0, "hint": "Section 11.1.1 contrasts individuals vs populations.", "solution": "Individuals have births and deaths; populations have birth rates, death rates, sex ratio and age structure.", "wrong": ["A single birth is an individual event.", "A single death is an individual event."]}, {"level": "Medium", "type": "number", "map": "Section 11.1.1", "prompt": "Birth rate per lotus per year if 20 plants produce 8 new plants", "answer": 0.4, "unit": "per capita per year", "tolerance": 0.001, "hint": "8/20.", "solution": "8/20 = 0.4 offspring per lotus per year."}, {"level": "Hard", "type": "mcq", "prompt": "A narrow-based age pyramid (Figure 11.1) indicates a population that is", "options": ["Declining", "Expanding rapidly", "Stable with even sides"], "answer": 0, "hint": "Few young relative to old means shrinkage.", "solution": "Broad base = growing; even sides = stable; narrow base = declining.", "wrong": ["Broad base means growing.", "Even sides mean stable."]}], "resources": [{"title": "NCERT §11.1, 11.1.1 — Attributes & age pyramids (official PDF, PDF p.3)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo111.pdf#page=3"}]}, {"id": "exponential-growth", "nav": "Exponential growth", "title": "Unlimited resources give dN/dt = rN and Nt = N0 e^rt — the J-curve", "deck": "Natality plus immigration minus mortality minus emigration. When resources are unlimited, per-capita r = b − d drives a J-shaped explosion: Norway rat 0.015, flour beetle 0.12, India 1981 0.0205.", "minutes": 9, "section": "11.1.2", "pages": [6, 7], "print": "6–7", "sim": "exponential", "simTitle": "Exponential lab: r slider and Nt curve", "quick": ["Population density at time t+1 is <strong>N<sub>t+1</sub> = N<sub>t</sub> + [(B + I) − (D + E)]</strong> (Figure 11.2), where <strong>natality</strong> (births added), <strong>mortality</strong> (deaths), <strong>immigration</strong> (same species arriving) and <strong>emigration</strong> (leaving) are the four processes. Density rises if (B + I) exceeds (D + E). Normally births and deaths dominate; immigration matters most when a new habitat is just being colonised.", "When resources (food and space) are unlimited, each species realises its innate potential and the population grows in an <strong>exponential or geometric fashion</strong>. With per-capita birth rate b and death rate d, the change per unit time is <strong>dN/dt = (b − d) × N</strong>; writing <strong>r = b − d</strong> gives <strong>dN/dt = rN</strong>, where r is the <strong>intrinsic rate of natural increase</strong>.", "To feel the magnitude of r: <strong>Norway rat r = 0.015, flour beetle r = 0.12</strong>, and the <strong>human population in India in 1981 had r = 0.0205</strong> (find the current r from birth and death rates). Plotting N against time gives a <strong>J-shaped curve</strong> (Figure 11.3a).", "The integral form is <strong>N<sub>t</sub> = N<sub>0</sub> e<sup>rt</sup></strong> with e = 2.71828. Any species growing exponentially under unlimited resources reaches enormous densities fast — the chessboard wheat-doubling anecdote and a Paramecium doubling daily for 64 days make the same point as Darwin's slow-breeding elephant released from checks."], "formulas": [{"label": "Exponential differential", "html": "dN/dt = (b − d) N = rN", "cond": "Section 11.1.2; r = intrinsic rate of natural increase"}, {"label": "Exponential integral", "html": "N<sub>t</sub> = N<sub>0</sub> e<sup>rt</sup>, e = 2.71828", "cond": "Section 11.1.2; J-curve Figure 11.3a"}, {"label": "Doubling (Exercise 2)", "html": "2N<sub>0</sub> = N<sub>0</sub> e<sup>r×3</sup> ⇒ r = ln 2 / 3 = 0.231 per year", "cond": "Exercise 2; doubling in 3 years"}], "deeper": "Note the calculus link the text flags: the J-curve is the plot of the integral Nt = N0 e^rt, not of dN/dt itself. Under normal conditions births and deaths drive density and immigration/emigration matter only specially (colonisation); the chapter's census task — gather Indian population figures for 100 years and check the growth pattern — tests whether humans still look exponential.", "worked": "Exercise 2 (doubling in 3 years): 2 = e^(3r) ⇒ ln 2 = 3r ⇒ r = 0.6931/3 = 0.231 per year. Check: Nt = N0 e^(0.231×3) = N0 e^0.693 = 2N0. Contrast with the text's r values: flour beetle 0.12 doubles in ln2/0.12 ≈ 5.8 years; India 1981 r = 0.0205 doubles in ≈ 33.8 years.", "prediction": {"prompt": "A population doubles exponentially in 3 years (Exercise 2). What is r, and what does it imply?", "options": ["r = ln 2/3 ≈ 0.231 per year — the per-capita potential realised with unlimited resources", "r = 2/3 ≈ 0.667 per year — doubling ratio divided by years", "r = 0 because births equal deaths during doubling"], "answer": 0, "explanation": "2 = e^(3r) gives r = ln2/3 = 0.231. Dividing the factor 2 by 3 confuses additive with exponential growth."}, "connect": [["India's r then and now", "The text gives India's 1981 r as 0.0205 and asks you to find the current value from birth and death rates — Census of India and SRS bulletins let you recompute r = b − d and see the doubling time stretch as birth rates fall."], ["Wow — the chessboard that bankrupted a kingdom", "One grain on square 1 doubling to square 64 is the textbook's exponential parable: by half the board the kingdom's whole wheat stock fails. A Paramecium doubling daily for 64 days under unlimited food and space is the biological version."]], "recall": "Write Nt+1 = Nt + [(B+I)−(D+E)]; define natality, mortality, immigration, emigration; derive dN/dt = rN and Nt = N0 e^rt; quote the three r values; solve Exercise 2 for r.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The intrinsic rate of natural increase r is", "options": ["b − d (per-capita births minus per-capita deaths)", "B + I + D + E (all four counts added)", "K − N (carrying capacity minus density)"], "answer": 0, "hint": "dN/dt = (b − d) × N.", "solution": "r = b − d; dN/dt = rN gives the J-curve under unlimited resources.", "wrong": ["That sum is the Nt+1 bookkeeping, not r.", "K − N belongs to the logistic, not the exponential."]}, {"level": "Medium", "type": "number", "map": "Exercise 2", "prompt": "Intrinsic rate r (per year) if an exponential population doubles in 3 years", "answer": 0.231, "unit": "per year", "tolerance": 0.005, "hint": "r = ln 2 / 3.", "solution": "ln 2 = 0.6931; r = 0.6931/3 = 0.231 per year."}, {"level": "Hard", "type": "number", "map": "Section 11.1.2", "prompt": "Nt if N0 = 100, r = 0.231 per year, t = 6 years (Nt = N0 e^rt)", "answer": 400.0, "unit": "", "tolerance": 5, "hint": "0.231 × 6 = 1.386 = 2 ln 2, so e^1.386 = 4.", "solution": "Nt = 100 × e^1.386 = 100 × 4 = 400 (two doublings of 3 years each)."}], "resources": [{"title": "NCERT §11.1.2 — Exponential growth (official PDF, PDF p.6)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo111.pdf#page=6"}]}, {"id": "logistic-lifehistory", "nav": "Logistic growth & life history", "title": "Limited resources give the sigmoid: dN/dt = rN(1 − N/K), then life-history trade-offs", "deck": "Lag, acceleration, deceleration, asymptote at carrying capacity K — the Verhulst-Pearl logistic is the realistic model. Then: breed once (salmon, bamboo) or many times, many small or few large young.", "minutes": 9, "section": "11.1.2, 11.1.3", "pages": [8, 9], "print": "8–9", "sim": "logistic", "simTitle": "Logistic lab: K slider, sigmoid and asymptote", "quick": ["No natural population has unlimited resources: competition for limited resources leaves the fittest to survive and reproduce. A habitat supports a maximum possible number — nature's <strong>carrying capacity (K)</strong> for that species. A population in limited resources shows <strong>lag, acceleration, deceleration and finally an asymptote at K</strong>; N vs t is a <strong>sigmoid curve</strong> (Figure 11.3b), the <strong>Verhulst-Pearl Logistic Growth</strong>.", "The logistic equation is <strong>dN/dt = rN × (K − N)/K</strong>, i.e. <strong>rN(1 − N/K)</strong>, with N density at time t, r intrinsic rate and K carrying capacity. When N is tiny, (1 − N/K) ≈ 1 and growth is nearly exponential; when N = K the bracket is zero and growth stops. Since most animal populations hit finite resources sooner or later, the logistic is considered <strong>more realistic</strong>.", "Populations evolve to maximise <strong>reproductive (Darwinian) fitness (high r)</strong> under their selection pressures. <strong>Some breed only once</strong> (Pacific salmon fish, bamboo) while <strong>others breed many times</strong> (most birds and mammals); <strong>some make many small-sized offspring</strong> (oysters, pelagic fishes) while <strong>others make few large-sized offspring</strong> (birds, mammals).", "Which strategy maximises fitness? Life-history traits evolved against the abiotic and biotic constraints of the habitat — an active research area. The chapter asks you to gather Government Census data for India over 100 years, plot it and check which growth pattern is evident."], "formulas": [{"label": "Verhulst-Pearl logistic", "html": "dN/dt = rN (K − N)/K = rN (1 − N/K)", "cond": "Section 11.1.2; K = carrying capacity"}, {"label": "Asymptote", "html": "N = K ⇒ dN/dt = 0 (growth stops); N ≪ K ⇒ dN/dt ≈ rN", "cond": "Figure 11.3b; sigmoid lag–acceleration–deceleration–asymptote"}, {"label": "Darwinian fitness", "html": "maximise r subject to habitat constraints (once vs many breeding; many-small vs few-large young)", "cond": "Section 11.1.3; salmon/bamboo vs birds/mammals; oysters vs birds"}], "deeper": "Read the phases off the sigmoid: lag (establishment), acceleration (near-exponential while N ≪ K), deceleration (bracket shrinks as N approaches K), asymptote (N = K, dN/dt = 0). Growth is fastest at half the carrying capacity (N = K/2). The life-history section then reframes r itself as an evolved quantity: semelparity (single breeding) and iteroparity (repeated breeding) plus offspring size–number trade-offs are alternative routes to high fitness in different habitats.", "worked": "Logistic arithmetic: r = 0.2 per year, N = 50, K = 100 → dN/dt = 0.2 × 50 × (50/100) = 5 per year. At N = 100, dN/dt = 0 (asymptote). At N = 10, dN/dt = 0.2 × 10 × 0.9 = 1.8 — nearly exponential because (1 − N/K) ≈ 0.9. Exercise 8 asks for this curve with a labelled diagram (lag → acceleration → deceleration → K).", "prediction": {"prompt": "A logistic population with K = 100 stands at N = 100, then 20 migrants leave (N = 80). What does dN/dt do?", "options": ["It was 0 at K, then becomes positive — the population regrows toward K", "It stays 0 because K has permanently shrunk", "It becomes negative because emigration reverses the equation"], "answer": 0, "explanation": "At N = K the bracket (K − N)/K is 0; below K it is positive, so dN/dt > 0 and N climbs back toward the asymptote."}, "connect": [["Project Tiger and carrying capacity", "A tiger reserve has a K for tigers set by prey, water and territory — reserves that exceed K see dispersing sub-adults and conflict at the fringe, exactly the deceleration-to-asymptote logic of the sigmoid."], ["Wow — India's 100-year census plot", "Plotting a century of Indian census figures (the chapter's own task) shows the J-bend easing as birth rates fall — a continental-scale test of exponential vs logistic, computable from the same r = b − d you met in Lesson 2."]], "recall": "Write the logistic equation; name the four sigmoid phases; state the behaviour at N ≪ K and N = K; contrast once vs many breeding and many-small vs few-large offspring with one example each.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Carrying capacity K is", "options": ["The maximum density a habitat can support, where growth stops", "The initial density N0 at time zero", "The intrinsic rate r itself"], "answer": 0, "hint": "Beyond K no further growth is possible.", "solution": "K is nature's limit for that species in that habitat; at N = K, dN/dt = 0.", "wrong": ["N0 is the starting density.", "r sets speed, not the ceiling."]}, {"level": "Medium", "type": "number", "map": "Section 11.1.2", "prompt": "dN/dt if r = 0.2 per year, N = 50, K = 100", "answer": 5.0, "unit": "per year", "tolerance": 0.05, "hint": "rN(K−N)/K = 0.2×50×50/100.", "solution": "0.2 × 50 × 0.5 = 5 individuals per year."}, {"level": "Hard", "type": "number", "map": "Exercise 8", "prompt": "N at which logistic growth dN/dt is maximal for K = 200", "answer": 100.0, "unit": "", "tolerance": 1, "hint": "Maximum of N(K−N) is at half K.", "solution": "dN/dt ∝ N(K−N), a parabola peaking at N = K/2 = 100."}], "resources": [{"title": "NCERT §11.1.2, 11.1.3 — Logistic growth & life history (official PDF, PDF p.8)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo111.pdf#page=8"}]}, {"id": "mutualism-competition", "nav": "Mutualism & competition", "title": "Both win (+/+) or both lose (−/−): lichens, fig-wasps, Gause and warblers", "deck": "Table 11.1 in one line: mutualism +/+, competition −/−. Mycorrhizae feed roots, wasps pollinate figs, Ophrys deceives bees — while Gause, goats, barnacles and warblers show what competition does.", "minutes": 9, "section": "11.1.4", "pages": [9, 12], "print": "9–12", "sim": "interactions", "simTitle": "Table 11.1 sorter: assign +/−/0 to each interaction", "quick": ["Interspecific interactions of two species are scored <strong>+ (beneficial), − (detrimental), 0 (neutral)</strong> (Table 11.1): <strong>mutualism +/+</strong>, <strong>competition −/−</strong>, predation +/−, parasitism +/−, commensalism +/0, amensalism −/0. Both partners benefit in mutualism; both lose in competition; predation, parasitism and commensalism all involve species living closely together.", "<strong>Mutualism</strong>: lichens (fungus + photosynthesising algae or cyanobacteria); <strong>mycorrhizae</strong> (fungi + roots of higher plants — fungi aid absorption of essential soil nutrients, plants supply energy-yielding carbohydrates). Plant–animal highlights: rewards of pollen/nectar and juicy fruits pay for pollination and seed dispersal, with safeguards against cheaters — so flower and pollinator <strong>co-evolve</strong>.", "Fig–wasp is the tightest case (Figure 11.4): each fig species is pollinated only by its partner wasp; the female uses the fruit as an <strong>oviposition site</strong> and developing seeds to nourish larvae while pollinating the inflorescence — some seeds become wasp food as the fee. The Mediterranean orchid <strong>Ophrys</strong> uses sexual deceit: one petal mimics the female bee in size, colour and markings; the male pseudocopulates, is dusted with pollen and pollinates the next flower — if the bee evolves, the orchid must co-evolve.", "<strong>Competition (−/−)</strong>: Darwin's struggle for existence, but not only close relatives — unrelated flamingoes and fishes compete for zooplankton in shallow South American lakes, and interference competition cuts feeding efficiency even when food and space are abundant (fitness measured as r falls in the other's presence). Gause's Competitive Exclusion Principle (inferior eliminated when resources limit), Abingdon tortoise extinct within a decade of goat introduction, competitive release on removal, Connell's Balanus (superior, intertidal) excluding Chathamalus in Scotland, and MacArthur's five warblers co-existing by different foraging times/patterns (resource partitioning) complete the arc."], "formulas": [{"label": "Mutualism sign", "html": "Species A + / Species B + → mutualism (lichen, mycorrhiza, fig–wasp)", "cond": "Table 11.1; both benefit"}, {"label": "Competition sign", "html": "Species A − / Species B − → competition (Gause exclusion unless partitioned)", "cond": "Table 11.1; fitness = r falls for both"}, {"label": "Co-existence route", "html": "same resource + different time / foraging pattern → resource partitioning (warblers)", "cond": "Section 11.1.4(ii); MacArthur"}], "deeper": "Contrast the two co-evolution stories: fig–wasp is one-to-one obligate mutualism with a food fee (seeds for larvae), while Ophrys–bee is pollination by deceit with no reward — yet both lock flower and insect evolution together. On competition, note the text's caution: Gause is easy in the lab, inconclusive in nature; recent work stresses evolved co-existence (partitioning) over inevitable exclusion, and herbivores/plants suffer competition more than carnivores.", "worked": "Exercise 7(d)–(e): mutualism — lichen (fungus + alga/cyanobacterium) or mycorrhiza (fungus + root) or fig–wasp, both +; interspecific competition — flamingo vs fish for zooplankton, goats vs Abingdon tortoise, Balanus vs Chathamalus, or warblers partitioned — both −, with Gause exclusion when resources limit and partitioning when they co-evolve.", "prediction": {"prompt": "Two closely related warblers eat the same insects on the same tree yet co-exist for years (MacArthur). What best explains this under Section 11.1.4?", "options": ["Resource partitioning — different feeding times/foraging patterns avoid exclusion", "Competitive exclusion must eliminate one within days regardless of behaviour", "One warbler has switched to mutualism with the tree"], "answer": 0, "explanation": "Behavioural differences in foraging let competitors share the resource; exclusion is not inevitable when partitioning evolves."}, "connect": [["Mycorrhizae in Indian soils", "Forest trees and crop rhizospheres across India carry mycorrhizal fungi that extend the root's nutrient reach — the textbook's nutrient-for-carbohydrate bargain running under every teak, sal and wheat field."], ["Wow — lichens in the Himalayas", "Crustose lichens paint Himalayan rocks where neither fungus nor alga could live alone — a +/+ partnership so tight it behaves as one organism, surviving freezing, UV and bare stone that defeat each partner solo."]], "recall": "Reproduce Table 11.1 signs for mutualism and competition; give lichen, mycorrhiza, fig–wasp and Ophrys details; state Gause's principle with its limiting-resources caveat; give one exclusion, one release and one partitioning example.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "In Table 11.1, mutualism is scored", "options": ["+/+ (both benefit)", "−/− (both lose)", "+/0 (one benefits, other unaffected)"], "answer": 0, "hint": "Lichen and mycorrhiza both gain.", "solution": "Mutualism +/+; competition −/−; commensalism +/0.", "wrong": ["That is competition.", "That is commensalism."]}, {"level": "Medium", "type": "mcq", "prompt": "Gause's Competitive Exclusion Principle states", "options": ["Two closely related species competing for the same limiting resources cannot co-exist indefinitely; the inferior is eliminated", "Competitors always evolve into mutualists within one season", "Interference competition never occurs when resources are abundant"], "answer": 0, "hint": "Read the caveat about limiting resources.", "solution": "True only if resources limit; otherwise partitioning (warblers) permits co-existence.", "wrong": ["No such guaranteed conversion exists.", "Interference occurs even with abundant resources."]}, {"level": "Hard", "type": "mcq", "prompt": "The fig–wasp relationship is obligate because", "options": ["A given fig is pollinated only by its partner wasp, which lays eggs in the fruit and nourishes larvae on developing seeds", "Wasps eat figs without pollinating them", "Figs are wind-pollinated and wasps are incidental visitors"], "answer": 0, "hint": "Figure 11.4 and oviposition.", "solution": "One-to-one co-evolution: pollination service for an egg-site plus seed food.", "wrong": ["Pollination is the service, not mere eating.", "Figs need their wasp partners, not wind."]}], "resources": [{"title": "NCERT §11.1.4 — Mutualism & competition (official PDF, PDF p.9)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo111.pdf#page=9"}]}, {"id": "predation-parasitism", "nav": "Predation & parasitism", "title": "One wins, one loses (+/−): starfish, prickly pear, Cuscuta and the koel", "deck": "Predators move energy uphill and hold prey in check — Pisaster keeps 10 species alive, a moth tames Opuntia. Parasites take lodging plus meals: lice, Cuscuta, liver fluke, and the koel's eggs in a crow's nest.", "minutes": 9, "section": "11.1.4", "pages": [10, 13], "print": "10–13", "sim": "predation", "simTitle": "Keystone and biocontrol stepper: Pisaster to prickly pear", "quick": ["What would happen to plant-fixed energy with no animals to eat plants? <strong>Predation (+/−)</strong> is nature's conduit of energy to higher trophic levels — tiger–deer, and equally sparrow–seed; herbivores are predators in the broad ecological sense. Predators <strong>keep prey populations under control</strong> (else very high densities and ecosystem instability) and <strong>maintain species diversity</strong> by cutting competition among prey: removing the starfish <strong>Pisaster</strong> from an enclosed American Pacific rocky intertidal let <strong>more than 10 invertebrate species go extinct within a year</strong>.", "Exotics without natural predators turn invasive: the <strong>prickly pear cactus (Opuntia)</strong> introduced into Australia in the early 1920s spread over <strong>millions of hectares of rangeland</strong> until a <strong>cactus-feeding moth from its natural habitat</strong> brought it under control — the template for <strong>biological control of agricultural pests by predators</strong>. Over-efficient predators would extinguish prey and then themselves, so predators in nature are prudent.", "<strong>Parasitism (+/−)</strong> buys free lodging and meals, so it evolved from plants to higher vertebrates, usually host-specific with <strong>co-evolution</strong> of host resistance and parasite counter-measures. Adaptations: loss of unnecessary sense organs, adhesive organs/suckers, loss of digestive system, high reproductive capacity; complex cycles via intermediate hosts/vectors — human <strong>liver fluke</strong> (snail + fish) and <strong>malarial parasite</strong> (mosquito vector). Parasites cut host survival, growth, reproduction and density, and weaken hosts to predation.", "<strong>Ectoparasites</strong> feed outside: lice on humans, ticks on dogs, copepods on marine fish, and <strong>Cuscuta</strong> on hedge plants (chlorophyll and leaves lost, nutrition from the host). The female mosquito needing blood for reproduction is <strong>not</strong> considered a parasite (why?). <strong>Endoparasites</strong> live inside (liver, kidney, lungs, red blood cells) with simplified bodies and emphasised reproduction. <strong>Brood parasitism</strong>: the parasitic bird lays eggs in the host nest for the host to incubate — eggs evolve to match the host's in size and colour; watch the <strong>cuckoo (koel) and crow</strong> in spring–summer."], "formulas": [{"label": "Predation sign", "html": "predator + / prey − → predation (energy conduit, prey control, diversity)", "cond": "Table 11.1; Pisaster, Opuntia–moth"}, {"label": "Parasitism sign", "html": "parasite + / host − → parasitism (ecto: lice, Cuscuta; endo: liver fluke; brood: koel)", "cond": "Table 11.1; Exercise 9 answer (d)"}, {"label": "Biocontrol principle", "html": "predator regulates prey → exotic pest controlled by natural enemy (moth on Opuntia)", "cond": "Section 11.1.4(i); Exercise 5"}], "deeper": "Note the textbook's two pointed questions: why hasn't selection produced totally harmless parasites (an ideal guest that never harms its host)? — because reduced host fitness is the measurable cost the parasite exacts; and why the blood-seeking female mosquito is not classed as a parasite — she takes a meal for reproduction rather than lodging on the host. The Pisaster removal and Opuntia–moth cases are the quantitative anchors: 10+ extinctions in a year without the predator; millions of hectares reclaimed with it.", "worked": "Exercise 9: best statement of parasitism is (d) one organism is benefited, other is affected. (a) is true but incomplete (predation and commensalism also benefit one); (b) is mutualism; (c) is commensalism. Exercise 5: biocontrol rests on the predator's ability to regulate prey populations — import the pest's natural enemy (Opuntia–moth model).", "prediction": {"prompt": "All Pisaster starfish are removed from an enclosed intertidal patch (text experiment). What follows within a year, and why?", "options": ["10+ invertebrate species vanish as unchecked competition eliminates them", "Prey diversity rises because no predator remains", "Nothing changes because predators do not affect diversity"], "answer": 0, "explanation": "Predators held competing prey in check; without Pisaster, dominant competitors exclude the rest."}, "connect": [["Biocontrol in Indian fields", "From sugarcane borers checked by parasitoids to mealybugs checked by ladybird predators, Indian integrated pest management copies the Opuntia–moth logic: find the pest's natural enemy rather than spraying alone."], ["Wow — millions of hectares eaten, then saved by a moth", "Prickly pear's 1920s Australian rampage covered millions of hectares of rangeland — until one cactus-feeding moth from its home range did what herbicides could not. Predation as ecosystem engineering."]], "recall": "State the +/- signs; explain Pisaster diversity and Opuntia biocontrol with numbers; contrast ecto/endo/brood parasitism with one example each; answer why the mosquito is not a parasite and why harmless parasites do not evolve.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Predation in Table 11.1 is scored", "options": ["+/− (predator benefits, prey suffers)", "+/+ (both benefit)", "+/0 (other unaffected)"], "answer": 0, "hint": "Only one species benefits.", "solution": "Predation and parasitism are both +/−; commensalism is +/0.", "wrong": ["That is mutualism.", "That is commensalism."]}, {"level": "Medium", "type": "mcq", "prompt": "Exercise 9: the statement that best explains parasitism is", "options": ["One organism is benefited, other is affected", "Both organisms are benefited", "One organism is benefited, other is not affected"], "answer": 0, "hint": "Match each option to its interaction name.", "solution": "(d): benefit + harm. (b) is mutualism; the third option is commensalism.", "wrong": ["That is mutualism.", "That is commensalism."]}, {"level": "Hard", "type": "mcq", "prompt": "Brood parasitism (koel/crow) succeeds because", "options": ["Parasitic eggs evolved to resemble host eggs in size and colour, so hosts incubate them", "Koel chicks feed the crow chicks", "Crows voluntarily donate eggs to koels"], "answer": 0, "hint": "Spring–summer park watch in the text.", "solution": "Mimicry defeats host detection and ejection; the host incubates foreign eggs.", "wrong": ["No such feeding occurs.", "No voluntary donation occurs."]}], "resources": [{"title": "NCERT §11.1.4 — Predation & parasitism (official PDF, PDF p.10)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo111.pdf#page=10"}]}, {"id": "commensalism-defenses", "nav": "Commensals, amensals & defenses", "title": "Helped, harmed or untouched (+/0, −/0) — and how prey fight back", "deck": "Orchid on mango gains, mango is unmoved (+/0); Penicillium harms Staphylococcus untouched (−/0). Against teeth and guts: camouflage, mimicry, thorns, Calotropis cardiac glycosides, nicotine to opium.", "minutes": 8, "section": "11.1.4", "pages": [11, 14], "print": "11–14", "sim": "defenses", "simTitle": "Defense matcher: camouflage, mimicry, thorns and poisons", "quick": ["<strong>Commensalism (+/0)</strong>: one benefits, the other is neither helped nor harmed. An <strong>orchid as epiphyte on a mango branch</strong> and <strong>barnacles on a whale's back</strong> gain support while mango and whale show no apparent benefit; <strong>cattle egrets</strong> forage beside grazing cattle that flush insects from vegetation; <strong>clown fish among sea-anemone stinging tentacles</strong> gain protection from predators while the anemone shows no benefit.", "<strong>Amensalism (−/0)</strong>: one species is harmed while the other is unaffected — the textbook's Table 11.1 row exemplified by <strong>Penicillium inhibiting Staphylococcus</strong> (antibiosis), the secreted chemical harming the bacterium while the fungus gains no measured benefit in that interaction.", "If a predator is too efficient it extinguishes prey and then itself, so predators are prudent — and <strong>prey evolve defenses</strong>. Cryptic colour (<strong>camouflage</strong>) hides insects and frogs; some are <strong>poisonous</strong> and avoided — the <strong>Monarch butterfly is highly distasteful to birds</strong> from a special chemical gained as a caterpillar feeding on a <strong>poisonous weed</strong>.", "Plants cannot run from herbivore-predators (nearly <strong>25 per cent of all insects are phytophagous</strong>), so they deploy <strong>morphological and chemical defenses</strong>: <strong>thorns (Acacia, Cactus)</strong>; sickening, digestion-blocking, reproduction-disrupting or lethal chemicals — <strong>Calotropis</strong> in abandoned fields makes <strong>highly poisonous cardiac glycosides</strong> that cattle and goats avoid; commercial <strong>nicotine, caffeine, quinine, strychnine and opium</strong> are plant defenses against grazers and browsers."], "formulas": [{"label": "Commensalism sign", "html": "Species A + / Species B 0 → commensalism (orchid/mango, barnacles/whale, egret/cattle, clownfish/anemone)", "cond": "Table 11.1; Exercise 4"}, {"label": "Amensalism sign", "html": "Species A − / Species B 0 → amensalism (Penicillium/Staphylococcus)", "cond": "Table 11.1"}, {"label": "Defense classes", "html": "morphological (thorns) + chemical (cardiac glycosides, alkaloids) + cryptic/mimicry (camouflage)", "cond": "Section 11.1.4(i); Exercise 3"}], "deeper": "Keep the close pairs apart: orchid-on-mango (commensalism, +/0, no feeding on the host) vs Cuscuta-on-hedge (parasitism, +/−, nutrition from the host) vs fig–wasp (mutualism, +/+, service for seeds). Defenses split cleanly into seen (thorns), unseen (poisons) and unnoticed (camouflage): Calotropis advertises with poison, Acacia with spines, frogs by disappearing.", "worked": "Exercise 4: the orchid on the mango branch is commensalism (+/0) — the orchid benefits (support, light) while the mango is neither benefited nor harmed. It is not mutualism (mango gains nothing), not parasitism (nothing is drawn from the mango), not competition (no shared limiting resource is contested). Exercise 3 lists the defense set: thorns; poisonous cardiac glycosides (Calotropis); feeding/digestion/reproduction inhibitors and lethal alkaloids (nicotine, caffeine, quinine, strychnine, opium); camouflage/mimicry in animals.", "prediction": {"prompt": "An orchid grows on a mango branch, drawing nothing from the mango's tissues (Exercise 4). How is this classified?", "options": ["Commensalism (+/0) — orchid benefits, mango unaffected", "Parasitism (+/−) — mango is harmed like a Cuscuta host", "Mutualism (+/+) — mango gains nutrients from the orchid"], "answer": 0, "explanation": "No benefit and no harm to the mango with benefit to the orchid is the +/0 definition; Cuscuta would be +/− and mycorrhiza +/+."}, "connect": [["Cattle egrets in farmed India", "The textbook's egret–cattle association plays out daily in farmed rural India — egrets stalk beside grazing cattle and buffalo, snatching insects the hooves flush from the grass."], ["Wow — Calotropis, the untouchable weed", "The Calotropis weed of abandoned fields is so loaded with cardiac glycosides that browsing cattle and goats refuse it — a chemical fortress you can verify on any wasteland walk, and the source logic of quinine-to-opium plant drugs."]], "recall": "Write the +/0 and −/0 signs with one example each; distinguish orchid/mango from Cuscuta/host and fig/wasp; list plant morphological + chemical defenses with Calotropis and two commercial examples; define camouflage with one animal example.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "An orchid on a mango branch (Exercise 4) is", "options": ["Commensalism (+/0)", "Mutualism (+/+)", "Competition (−/−)"], "answer": 0, "hint": "Does the mango gain or lose?", "solution": "Orchid benefits; mango neither benefits nor is harmed (+/0).", "wrong": ["Mango gains nothing, so not +/+.", "Neither loses, so not −/−."]}, {"level": "Medium", "type": "mcq", "prompt": "Penicillium inhibiting Staphylococcus is the textbook's example of", "options": ["Amensalism (−/0)", "Commensalism (+/0)", "Parasitism (+/−)"], "answer": 0, "hint": "One harmed, other unaffected.", "solution": "Amensalism: bacterium harmed, fungus unaffected in the scored interaction.", "wrong": ["Nobody benefits here.", "Nobody lodges or feeds here."]}, {"level": "Hard", "type": "mcq", "prompt": "Calotropis is avoided by cattle and goats because it", "options": ["Produces highly poisonous cardiac glycosides", "Has sweet fruits cattle dislike", "Grows only where cattle never graze"], "answer": 0, "hint": "Abandoned-fields weed in Section 11.1.4(i).", "solution": "Cardiac glycosides poison browsers; thorns (Acacia, Cactus) are the parallel morphological defense.", "wrong": ["Its chemistry, not its taste for fruit, deters.", "It grows exactly where cattle graze — yet stays uneaten."]}], "resources": [{"title": "NCERT §11.1.4 — Commensals, amensals & defenses (official PDF, PDF p.11)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo111.pdf#page=11"}]}], "exercises": [{"number": 1, "conceptIdx": 0, "page": 17, "printPage": null, "question": "List the attributes that populations possess but not individuals.", "steps": ["Individuals have births and deaths; populations have per-capita birth rates and death rates (lotus 8/20 = 0.4 per year; fruitflies 4/40 = 0.1 per week).", "Sex ratio is a population attribute (e.g. 60 per cent females, 40 per cent males); an individual is only male or female.", "Age distribution / age pyramid (Figure 11.1: expanding, stable, declining) belongs to the population, not the individual."], "answer": "Birth and death rates, sex ratio, age distribution (age pyramid)."}, {"number": 2, "conceptIdx": 1, "page": 17, "printPage": null, "question": "If a population growing exponentially double in size in 3 years, what is the intrinsic rate of increase (r) of the population?", "steps": ["Exponential integral: Nt = N0 e^(rt). Doubling in 3 years: 2N0 = N0 e^(3r).", "Cancel N0: 2 = e^(3r); take natural logs: ln 2 = 3r.", "r = ln 2 / 3 = 0.6931 / 3 = 0.231 per year."], "answer": "r = 0.231 per year (ln 2/3)."}, {"number": 3, "conceptIdx": 5, "page": 17, "printPage": null, "question": "Name important defence mechanisms in plants against herbivory.", "steps": ["Morphological: thorns (Acacia, Cactus) — the most common defence.", "Chemical: poisonous cardiac glycosides (Calotropis); inhibitors of feeding/digestion/reproduction or lethal alkaloids (nicotine, caffeine, quinine, strychnine, opium).", "Context: plants cannot run, and nearly 25 per cent of insects are phytophagous, so defences are astonishingly varied."], "answer": "Thorns; cardiac glycosides and alkaloid poisons; feeding/digestion/reproduction inhibitors."}, {"number": 4, "conceptIdx": 5, "page": 17, "printPage": null, "question": "An orchid plant is growing on the branch of mango tree. How do you describe this interaction between the orchid and the mango tree?", "steps": ["Score +/−/0: orchid benefits (support, access to light as an epiphyte); mango shows no apparent benefit or harm.", "This matches commensalism (+/0), not mutualism (+/+, e.g. lichen) or parasitism (+/−, e.g. Cuscuta which draws nutrition).", "Parallel textbook cases: barnacles/whale, egret/cattle, clown fish/sea anemone."], "answer": "Commensalism (+/0) — orchid benefits, mango unaffected."}, {"number": 5, "conceptIdx": 4, "page": 17, "printPage": null, "question": "What is the ecological principle behind the biological control method of managing with pest insects?", "steps": ["Predators regulate prey populations and hold them under control (Section 11.1.4(i)).", "Template: prickly pear (Opuntia) invasion of millions of hectares in Australia (1920s) controlled only after its cactus-feeding moth was introduced.", "Hence import or conserve the pest's natural predator/parasitoid instead of relying on chemicals alone."], "answer": "Predation regulates prey — control pests with their natural enemies (Opuntia–moth model)."}, {"number": 6, "conceptIdx": 0, "page": 17, "printPage": null, "question": "Define population and community.", "steps": ["Population: group of individuals of a given species in a defined geographical area, sharing/competing for similar resources and potentially interbreeding (asexual groups count) — e.g. cormorants in a wetland, lotus in a pond.", "Community: interacting populations of different species (animals, plants, microbes) in a habitat, linked in many ways — no species lives in isolation (needs pollinators, soil microbes, food species).", "Link: populations interact (Table 11.1) to form the community."], "answer": "Population: one species in an area; community: interacting populations of many species."}, {"number": 7, "conceptIdx": 3, "page": 17, "printPage": null, "question": "Define the following terms and give one example for each: (a) Commensalism (b) Parasitism (c) Camouflage (d) Mutualism (e) Interspecific competition", "steps": ["(a) Commensalism (+/0): one benefits, other unaffected — orchid on mango; barnacles on whale; egret with cattle; clown fish with sea anemone.", "(b) Parasitism (+/−): parasite benefits, host suffers — Cuscuta on hedge plants; lice on humans; ticks on dogs; liver fluke; koel brood parasitism on crow.", "(c) Camouflage: cryptic colouring to avoid detection — some insects and frogs camouflaged against predators.", "(d) Mutualism (+/+): both benefit — lichen (fungus + alga/cyanobacterium); mycorrhiza (fungus + root); fig tree and wasp.", "(e) Interspecific competition (−/−): both suffer (fitness r falls) — flamingoes vs fishes for zooplankton; goats vs Abingdon tortoise; Balanus vs Chathamalus; warblers partitioned."], "answer": "(a) +/0 orchid/mango; (b) +/− Cuscuta/lice/koel; (c) cryptic insects/frogs; (d) +/+ lichen/fig–wasp; (e) −/− flamingo–fish/Balanus."}, {"number": 8, "conceptIdx": 2, "page": 17, "printPage": null, "question": "With the help of suitable diagram describe the logistic population growth curve.", "steps": ["Equation: dN/dt = rN(K − N)/K (Verhulst-Pearl); K = carrying capacity.", "Diagram (Figure 11.3b): N on y-axis vs time t on x-axis; sigmoid with labelled lag phase, acceleration phase, deceleration phase and asymptote at N = K.", "Reading: initially near-exponential (N ≪ K); growth fastest near K/2; zero growth at K; more realistic than the J-curve because resources are finite."], "answer": "Sigmoid N–t curve: lag → acceleration → deceleration → asymptote at K (dN/dt = 0 at K)."}, {"number": 9, "conceptIdx": 4, "page": 17, "printPage": null, "question": "Select the statement which explains best parasitism. (a) One organism is benefited. (b) Both the organisms are benefited. (c) One organism is benefited, other is not affected. (d) One organism is benefited, other is affected.", "steps": ["Map options to Table 11.1: (a) fits predation/parasitism/commensalism — incomplete.", "(b) is mutualism (+/+); (c) is commensalism (+/0).", "Only (d) (+/− with harm) captures parasitism: parasite benefits, host is affected (reduced survival, growth, reproduction)."], "answer": "(d) One organism is benefited,
