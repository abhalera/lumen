<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 2: Human Reproduction — Interactive Textbook</title>
<style>
:root {
  --ink: #152637;
  --muted: #536678;
  --paper: #ffffff;
  --paper-soft: #f7fafc;
  --line: #dce4eb;
  --blue: #254ad7;
  --blue-dark: #1938a8;
  --soft: #edf2ff;
  --lab: #0d1b2a;
  --lab-panel: #15263a;
  --teal: #08766a;
  --teal-light: #2dd4bf;
  --amber: #b45309;
  --amber-light: #f59e0b;
  --amber-soft: #fef3c7;
  --coral: #dc2626;
  --coral-soft: #fee2e2;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Top Navigation Bar */
.topbar {
  height: 64px;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: 750;
  letter-spacing: -0.4px;
  color: var(--ink);
  text-decoration: none;
}
.brand-mark {
  background: var(--blue);
  color: #fff;
  width: 28px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  font: italic bold 22px Georgia, serif;
}
.chapter-crumb {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--soft);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--blue);
}
progress {
  width: 72px;
  height: 8px;
  border-radius: 4px;
  accent-color: var(--blue);
}

/* Layout Container */
.app-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}
@media (max-width: 960px) {
  .app-layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* Sidebar Concept Navigation */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--paper-soft);
  padding: 20px 14px;
  overflow-y: auto;
  position: sticky;
  top: 64px;
  height: calc(100vh - 64px);
}
.sidebar-heading {
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 10px 12px;
}
.nav-group {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: 0.5px;
  margin: 14px 10px 6px;
  text-transform: uppercase;
}
.concept-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--ink);
  font: 14px/1.35 system-ui, sans-serif;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}
.concept-nav:hover {
  background: rgba(37,74,215,0.06);
}
.concept-nav.active {
  background: var(--soft);
  color: var(--blue);
  font-weight: 650;
}
.concept-nav .num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--line);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.concept-nav.active .num {
  background: var(--blue);
  color: #fff;
}

/* Main Content Area */
main {
  padding: 32px 36px 80px;
  max-width: 1040px;
  margin: 0 auto;
}
@media (max-width: 640px) {
  main { padding: 20px 16px 60px; }
}

/* Concept Header */
.concept-header {
  margin-bottom: 24px;
}
.concept-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.time-pill {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 600;
}
h1.concept-title {
  font: 36px/1.2 Georgia, serif;
  margin: 0 0 10px;
  color: var(--ink);
  letter-spacing: -0.5px;
}
p.concept-deck {
  font-size: 17px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}

/* 5-Block Section Tags */
.block-tag {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.2px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

/* Block 1: LEARN */
.learn-section {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 24px;
}
.quick-summary {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 20px;
}
.quick-summary p { margin: 0 0 10px; }
.quick-summary p:last-child { margin: 0; }

/* Key Equations Display (Fixed P1-6 & P1-7) */
.key-equations-card {
  background: #fdfefe;
  border: 1.5px solid #d0dbe5;
  border-left: 5px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
}
.equations-heading {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.8px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.eq-grid {
  display: grid;
  gap: 14px;
}
.eq-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.eq-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.eq-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.eq-label {
  font-weight: 700;
  color: var(--ink);
}
.eq-cond {
  font-style: italic;
}
.eq-math {
  font: 26px/1.35 Georgia, serif;
  color: #0b1e36;
  letter-spacing: 0.5px;
  overflow-x: auto;
  padding: 2px 0;
}
@media (max-width: 600px) {
  .eq-math { font-size: 20px; }
}
/* Fractions formatting */
.frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-size: 0.85em;
  line-height: 1;
  padding: 0 4px;
}
.frac .num {
  border-bottom: 1.5px solid currentColor;
  padding-bottom: 2px;
}
.frac .den {
  padding-top: 2px;
}

/* Expandable Deep Dives and Derivations */
details.deep-dive, details.derivation {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 14px;
}
details summary {
  font-weight: 650;
  color: var(--blue);
  cursor: pointer;
  user-select: none;
  font-size: 14px;
}
details summary:hover { text-decoration: underline; }
details p {
  font-size: 15px;
  color: var(--ink);
  line-height: 1.6;
  margin: 10px 0 0;
}

/* Block 2: PREDICT FIRST (Fixed P0-2) */
.predict-card {
  background: var(--soft);
  border: 1.5px solid #c7d7fc;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.predict-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
  color: var(--blue);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.predict-prompt {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}
.predict-options {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}
.predict-option {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: border-color 0.15s;
}
.predict-option:hover {
  border-color: var(--blue);
}
.predict-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.predict-feedback {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.5;
}
.predict-feedback.correct {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.predict-feedback.revealed {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
}

/* Block 2: PLAY (Interactive Simulation Lab) */
.lab-card {
  background: var(--lab);
  border-radius: var(--radius);
  color: #fff;
  padding: 22px 24px 26px;
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(13,27,42,0.18);
}
.lab-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 10px;
}
.lab-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
}
.live-tag {
  background: var(--teal);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  text-transform: uppercase;
}
.what-to-watch {
  background: rgba(255,255,255,0.08);
  border-left: 3px solid var(--teal-light);
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  color: #e2e8f0;
  margin-bottom: 14px;
}
.what-to-watch strong { color: #fff; }

/* Simulation Canvas / SVG */
.diagram-wrap {
  position: relative;
  background: #09131d;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 14px;
}
svg.diagram {
  display: block;
  width: 100%;
  height: auto;
  min-height: 240px;
  max-height: 320px;
}

/* Data-driven Legend (Fixed P1-5) */
.lab-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 12px;
  color: #cbd5e1;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

/* Timeline Controls Toolbar (Fixed P0-1) */
.lab-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--lab-panel);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.toolbar-btn {
  background: #22374e;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.toolbar-btn:hover { background: #2f4b6a; border-color: rgba(255,255,255,0.3); }
.toolbar-btn.primary { background: var(--blue); border-color: var(--blue); }
.toolbar-btn.primary:hover { background: var(--blue-dark); }
.time-display {
  font-family: monospace;
  font-size: 14px;
  color: #38bdf8;
  padding: 0 8px;
  min-width: 80px;
}
.scrubber-wrap {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  gap: 8px;
}
input.timeline-scrubber {
  width: 100%;
  accent-color: #38bdf8;
  cursor: pointer;
}

/* Interactive Sliders & Presets */
.lab-controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.control-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.control-label {
  font-size: 12px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}
.control-label span.val {
  color: #fff;
  font-weight: 700;
  font-family: monospace;
}
.preset-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.preset-btn {
  background: transparent;
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.preset-btn:hover, .preset-btn.active {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border-color: #fff;
}

/* Realtime Telemetry Readout & Dynamic Verdict */
.lab-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.telemetry-cell {
  background: var(--lab-panel);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 8px 12px;
}
.telemetry-label {
  font-size: 11px;
  color: #94a3b8;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.telemetry-val {
  font-size: 16px;
  font-weight: 750;
  color: #fff;
  font-family: monospace;
}
.lab-verdict {
  background: rgba(8,118,106,0.25);
  border-left: 3px solid var(--teal-light);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13.5px;
  color: #e2e8f0;
  line-height: 1.5;
}

/* Block 3: CONNECT (Real-life India & Verified Wow cards) */
.connect-section {
  margin-bottom: 28px;
}
.connect-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.connect-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #fff;
}
.connect-card.wow {
  border-color: #fbcfe8;
  background: #fff5f8;
}
.wow-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  color: #db2777;
  background: #fce7f3;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.connect-card h3 {
  font: 18px/1.3 Georgia, serif;
  margin: 0 0 6px;
  color: var(--ink);
}
.connect-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 10px;
}
.video-facade {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  text-align: left;
  background: #0f172a;
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
}
.play-btn {
  flex: none;
  width: 34px;
  height: 34px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 14px;
}
.video-title {
  font-size: 13px;
  line-height: 1.4;
}

/* Block 4: PRACTICE (3-Tier Multi-concept) */
.practice-section {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 28px;
  background: #fff;
  margin-bottom: 24px;
}
.practice-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}
.level-tab {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 650;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.level-tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.question-prompt {
  font: 18px/1.4 Georgia, serif;
  color: var(--ink);
  margin-bottom: 14px;
}
.quiz-options {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}
.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s;
}
.quiz-option:hover {
  border-color: var(--blue);
}
.quiz-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
button.btn-primary {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  transition: background 0.15s;
}
button.btn-primary:hover { background: var(--blue-dark); }
button.btn-secondary {
  background: transparent;
  color: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
}
.quiz-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.55;
}
.quiz-feedback.success {
  background: var(--green-soft);
  border: 1px solid #86efac;
  color: #14532d;
}
.quiz-feedback.retry {
  background: var(--coral-soft);
  border: 1px solid #fca5a5;
  color: #7f1d1d;
}
.quiz-hint {
  background: var(--amber-soft);
  border: 1px solid #fde68a;
  color: #78350f;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13.5px;
}

/* Block 5: REVISE */
.revise-callout {
  background: #f8fafc;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-bottom: 32px;
  font-size: 14.5px;
  color: var(--ink);
}
.revise-callout strong { color: var(--blue); }

/* Lesson Bottom Nav */
.concept-footer-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* Chapter Revision & Exercise Mapping Table */
.revision-page {
  display: none;
}
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 16px;
  font-size: 14px;
}
.exercise-table th, .exercise-table td {
  padding: 10px 14px;
  border: 1px solid var(--line);
  text-align: left;
}
.exercise-table th {
  background: var(--paper-soft);
  font-weight: 700;
}

/* Exercise Compendium Styling */
.exercise-compendium-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.exercise-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}
.filter-chip {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.exercise-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:hover {
  box-shadow: 0 4px 16px rgba(21,38,55,0.06);
}
.exercise-card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.q-badge {
  background: var(--soft);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 3px 10px;
  border-radius: 6px;
}
.q-concept-link {
  color: var(--blue);
  text-decoration: none;
  font-size: 13px;

and at least 40% vigorous motility</strong>; duct secretions (epididymis, vas deferens, seminal vesicle, prostate) mature them, and <strong>seminal plasma plus sperms is semen</strong>, maintained by androgens.", "Oogenesis is markedly different: it starts in <strong>embryonic development</strong> when a couple of million <strong>oogonia</strong> form per fetal ovary — <strong>no more are added after birth</strong>. They enter <strong>prophase-I and arrest as primary oocytes</strong>, each wrapped by granulosa cells as a <strong>primary follicle</strong> (Figure 2.7); most degenerate before puberty, leaving only <strong>60,000–80,000 primary follicles per ovary at puberty</strong>. Primary follicles gain granulosa layers and a theca to become <strong>secondary follicles</strong>, then <strong>tertiary follicles</strong> with a fluid <strong>antrum</strong> and theca split into <strong>theca interna and externa</strong>.", "In the tertiary follicle the primary oocyte grows and completes <strong>meiosis I unequally</strong>: a large <strong>haploid secondary oocyte</strong> plus a tiny <strong>first polar body</strong> (Figure 2.8b), the oocyte keeping the nutrient-rich cytoplasm. The tertiary follicle becomes the mature <strong>Graafian follicle</strong> (Figure 2.7); the secondary oocyte forms the surrounding <strong>zona pellucida</strong>, and the follicle ruptures to release it by <strong>ovulation</strong>. Figure 2.8 sets spermatogenesis against oogenesis side by side."], "formulas": [{"label": "Spermatogenesis counts", "html": "46 (spermatogonium, 2n) → meiosis I → 2 × 23 → meiosis II → 4 spermatids (n) → spermiogenesis → spermiation", "cond": "§2.3; Figure 2.5"}, {"label": "Oogenesis counts", "html": "oogonia (foetal only) → primary oocyte arrested prophase-I → meiosis I unequal → secondary oocyte (n) + first polar body", "cond": "§2.3; Figure 2.8b"}, {"label": "Hormone sequence", "html": "GnRH (hypothalamus) → LH + FSH (anterior pituitary); LH → Leydig → androgens; FSH → Sertoli → spermiogenesis factors", "cond": "§2.3"}], "deeper": "Spermatogenesis and oogenesis are deliberately unnumbered sub-topics inside §2.3 in this reprint (no 2.3.1/2.3.2) — see the COVERAGE honest note. Ploidy thread: spermatogonium 46 → secondary spermatocytes 23 → spermatids 23 (the book asks the spermatid number outright); primary oocyte diploid-arrested → secondary oocyte haploid plus first polar body; meiosis II in the female completes only at fertilisation (§2.5). Follicle thread: primary → secondary → tertiary (antrum; theca interna/externa) → Graafian → ovulation with zona pellucida.", "worked": "Worked ploidy check from the text: a primary spermatocyte (46) completes meiosis I into two secondary spermatocytes (23 each), which complete meiosis II into four spermatids — so each spermatid carries 23 chromosomes. Contrast the female: one primary oocyte completes meiosis I into one secondary oocyte (bulk cytoplasm) plus one first polar body — one functional gamete per meiosis, not four.", "prediction": {"prompt": "Equal cytoplasmic division is forced on a primary oocyte at meiosis I instead of the book's unequal division. What is lost?", "options": ["The nutrient-rich cytoplasm reserve kept in the single secondary oocyte", "The chromosome number — gametes would stay diploid", "The zona pellucida, which forms only in males"], "answer": 0, "explanation": "Meiosis I in oogenesis is unequal so the secondary oocyte retains the bulk of the nutrient-rich cytoplasm (§2.3); the polar body is tiny."}, "connect": [["Why semen reports quote 60% and 40%", "The §2.3 cut-offs — 200–300 million per coitus, ≥60% normal form, ≥40% vigorous motility — are the three numbers an Indian andrology lab reads first; all three sit in one paragraph of this chapter."], ["Wow — arrested since before birth", "Every primary oocyte has waited in prophase-I since foetal life; a woman ovulates cells that began meiosis decades earlier — while male germ cells keep entering meiosis freshly from puberty onward."]], "recall": "State both division sequences with chromosome numbers, define spermiogenesis vs spermiation, the GnRH→LH/FSH→Leydig/Sertoli chain, sperm parts with acrosome/mitochondria roles, the follicle series to Graafian with antrum and zona, and the foetal-arrest vs puberty contrast.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Chromosome number in each secondary spermatocyte and each spermatid is", "options": ["23 (haploid)", "46 (diploid)", "69 (triploid)"], "answer": 0, "hint": "Meiosis I is the reduction division.", "solution": "Primary spermatocyte (46) → two secondary spermatocytes (23) → four spermatids (23).", "wrong": ["46 is the spermatogonium/primary spermatocyte number.", "Triploid (3n) is the endosperm/primary-endosperm number of Chapter 1, not here."]}, {"level": "Medium", "type": "number", "map": "§2.3 follicles", "prompt": "Primary follicles left in each ovary at puberty, about (midpoint of the book's range)", "answer": 70000, "unit": "follicles", "tolerance": 10000, "hint": "The book gives 60,000–80,000.", "solution": "Only 60,000–80,000 of the foetal millions remain per ovary at puberty."}, {"level": "Hard", "type": "mcq", "prompt": "Spermiogenesis and spermiation respectively are", "options": ["Transformation of spermatids into spermatozoa; release of sperms from seminiferous tubules after embedding in Sertoli cells", "Release first, then transformation", "Meiosis I and meiosis II"], "answer": 0, "hint": "One is a transformation, the other a release (Exercise 8).", "solution": "Spermiogenesis builds the sperm; spermiation releases it from Sertoli embedding.", "wrong": ["Order matters: transformation precedes release.", "Meiotic divisions produce spermatids; these two terms come after."]}], "resources": [{"title": "NCERT §2.3 — Gametogenesis (official PDF, PDF p.6)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo102.pdf#page=6"}]}, {"id": "menstrual-cycle", "nav": "Menstrual cycle", "title": "Menstrual cycle: 3–5, ~14, 28/29 days under LH, FSH, estrogen and progesterone", "deck": "Menstrual (3–5 days) → follicular (Graafian + endometrial proliferation) → LH surge (~day 14) → ovulation → luteal corpus luteum with progesterone; no fertilisation degenerates the luteum and restarts bleeding; menopause ~50.", "minutes": 9, "section": "2.4", "pages": [8, 10], "print": "8–10", "sim": "menstrual", "simTitle": "Menstrual explorer: 28-day hormones, phases and ovulation", "quick": ["The reproductive cycle of female primates (monkeys, apes, human beings) is the <strong>menstrual cycle</strong>; first menstruation at puberty is <strong>menarche</strong>. In human females it repeats at an average interval of about <strong>28/29 days</strong>, one menstruation to the next, with <strong>one ovum released (ovulation) mid-cycle</strong> (Figure 2.9).", "The cycle starts with the <strong>menstrual phase</strong> (flow, <strong>3–5 days</strong>): the <strong>endometrial lining and its blood vessels break down</strong> into liquid leaving via the vagina. Menstruation occurs only if the released ovum is not fertilised; its absence may indicate <strong>pregnancy</strong>, but also stress, poor health or other causes. The chapter's hygiene box (p. 35) orders: bathe and clean regularly, use <strong>sanitary napkins or clean homemade pads</strong>, <strong>change every 4–5 hours</strong>, wrap and dispose properly (never into drainpipes or open areas), wash hands with soap.", "Next is the <strong>follicular phase</strong>: primary follicles grow into a fully mature <strong>Graafian follicle</strong> while the uterine <strong>endometrium regenerates by proliferation</strong>, both driven by <strong>pituitary and ovarian hormones</strong> (Figure 2.9). <strong>LH and FSH rise gradually</strong>, developing follicles and making growing follicles secrete <strong>estrogens</strong>; both gonadotropins peak mid-cycle (<strong>about the 14th day</strong>), and the rapid <strong>LH surge</strong> ruptures the Graafian follicle — <strong>ovulation</strong>.", "The <strong>luteal phase</strong> follows: Graafian remnants become the <strong>corpus luteum</strong> (Figure 2.9), which secretes large <strong>progesterone</strong> to maintain the endometrium for <strong>implantation and pregnancy</strong> — during which all cycle events stop. Without fertilisation the <strong>corpus luteum degenerates</strong>, the endometrium disintegrates, and <strong>menstruation marks a new cycle</strong>. Cycles cease around age <strong>50 (menopause)</strong>; cyclic menstruation between <strong>menarche and menopause</strong> indicates the normal reproductive phase."], "formulas": [{"label": "Day counts", "html": "cycle ≈ 28/29 days; menstrual flow 3–5 days; LH/FSH peak ≈ day 14 → ovulation", "cond": "§2.4; Figure 2.9"}, {"label": "Hormone sequence", "html": "FSH + LH rise → estrogens (growing follicles) → LH surge → ovulation → corpus luteum → progesterone", "cond": "§2.4"}, {"label": "Luteal fork", "html": "fertilisation → corpus luteum persists, no menstruation; no fertilisation → luteum degenerates → menstruation", "cond": "§2.4"}], "deeper": "Figure 2.9 is the chapter's data panel: gonadotropin curves, ovarian events (follicle → ovulation → corpus luteum) and uterine events (menstruation → proliferation → secretory maintenance) aligned on one time axis. Read it as three rows answering: what the pituitary says, what the ovary does, what the uterus shows. The hygiene box is examinable public-health text, not decoration.", "worked": "Worked day-count check: day 1 is the first bleeding day; flow lasts 3–5 days (menstrual phase); follicular growth and endometrial proliferation fill days ~5–13 under rising FSH/LH and estrogens; the LH surge about day 14 triggers ovulation; the luteal corpus luteum then holds the endometrium with progesterone until either pregnancy (no bleeding) or luteal degeneration (bleeding restarts the count).", "prediction": {"prompt": "Blood sampling shows an LH surge today in a textbook 28-day cycle. When is ovulation expected?", "options": ["About now — the mid-cycle surge (~day 14) induces Graafian rupture", "About two weeks later, at the next bleeding", "It already happened a week ago"], "answer": 0, "explanation": "Rapid LH secretion to its mid-cycle maximum (LH surge) induces rupture of the Graafian follicle and ovum release (§2.4)."}, "connect": [["Menstrual hygiene as public-health script", "The p. 35 box reads like a pulse-polio booth instruction: bathe, clean napkins/pads, change every 4–5 hours, wrap-and-bin (never drains or open plots), wash hands — the chapter's own community-health message for Indian schools."], ["Wow — one surge runs the month", "Two gonadotropins climb for two weeks, then a single sharp LH peak on about day 14 flips the whole system from growing a follicle to releasing its egg — the cycle's narrowest, most decisive hour."]], "recall": "Recite the three phases with day counts, the LH-surge→ovulation→corpus-luteum→progesterone chain, both fates of the luteum, the menarche-to-menopause span with menopause age, and the five hygiene-box instructions.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Ovulation in the average cycle is triggered about day 14 by the", "options": ["LH surge rupturing the Graafian follicle", "Fall of FSH to zero", "Shedding of the myometrium"], "answer": 0, "hint": "Rapid LH secretion to its mid-cycle maximum.", "solution": "The LH surge induces Graafian rupture and ovum release (§2.4).", "wrong": ["FSH rises with LH in the follicular phase; it does not vanish.", "Menstruation sheds endometrium, not myometrium."]}, {"level": "Medium", "type": "number", "map": "§2.4 cycle", "prompt": "Average interval of the human menstrual cycle", "answer": 28, "unit": "days", "tolerance": 1, "hint": "The book says 28/29 days.", "solution": "About 28/29 days from one menstruation to the next."}, {"level": "Hard", "type": "mcq", "prompt": "If fertilisation does not occur, the corpus luteum", "options": ["Degenerates, the endometrium disintegrates, and menstruation starts a new cycle", "Persists and keeps secreting progesterone indefinitely", "Turns into the Graafian follicle again"], "answer": 0, "hint": "Luteal fork in §2.4.", "solution": "No fertilisation degenerates the luteum; endometrial breakdown bleeds as menstruation.", "wrong": ["Persistence with progesterone is the pregnancy path, not the no-fertilisation path.", "The Graafian follicle precedes the luteum; the arrow runs one way."]}], "resources": [{"title": "NCERT §2.4 — Menstrual cycle (official PDF, PDF p.8)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo102.pdf#page=8"}]}, {"id": "fertilisation-implantation", "nav": "Fertilisation & implantation", "title": "Fertilisation in the ampulla and implantation as blastocyst", "deck": "Insemination → ampullary meeting → single-sperm zona block → acrosome entry → meiosis II (second polar body + ootid) → diploid zygote (sex fixed XX/XY) → cleavage → 8–16-cell morula → trophoblast/inner-cell-mass blastocyst → endometrial embedding.", "minutes": 9, "section": "2.5", "pages": [10, 12], "print": "10–12", "sim": "fertilisation", "simTitle": "Fertilisation to implantation stepper: zona block to blastocyst embedding", "quick": ["During copulation (<strong>coitus</strong>) semen is released into the vagina (<strong>insemination</strong>); motile sperms swim through the <strong>cervix into the uterus</strong> and reach the <strong>ampullary region of the fallopian tube</strong> (Figure 2.11b), to which the ovulated ovum is also transported — <strong>fertilisation happens in the ampulla</strong>, and only when both gametes arrive simultaneously, which is why not all copulations lead to pregnancy.", "<strong>Fertilisation is the fusion of a sperm with an ovum.</strong> A sperm contacting the <strong>zona pellucida</strong> (Figure 2.10) induces membrane changes that <strong>block additional sperms</strong>, so only one sperm fertilises the ovum; <strong>acrosome secretions</strong> help it enter the ovum's cytoplasm through the zona and plasma membrane. Entry completes the <strong>second meiotic division</strong> of the secondary oocyte — an unequal division giving the <strong>second polar body and a haploid ovum (ootid)</strong> — and the two haploid nuclei fuse into a <strong>diploid zygote</strong>.", "The <strong>sex of the baby is decided at this stage</strong>: the female is <strong>XX</strong> so every ovum carries <strong>X</strong>, while the male is <strong>XY</strong> so <strong>50% of sperms carry X and 50% carry Y</strong>; an X-sperm makes an <strong>XX (female)</strong> zygote and a Y-sperm an <strong>XY (male)</strong> zygote — so the <strong>sex is determined by the father, not the mother</strong> (more in Chapter 5).", "The zygote divides <strong>mitotically (cleavage)</strong> while moving through the <strong>isthmus</strong> toward the uterus (Figure 2.11) into <strong>2, 4, 8, 16 daughter cells (blastomeres)</strong>; the <strong>8- to 16-cell embryo is the morula</strong> (Figure 2.11e), which becomes the <strong>blastocyst</strong> (Figure 2.11g) in the uterus: outer <strong>trophoblast</strong> plus <strong>inner cell mass</strong> attached to it. The trophoblast attaches to the <strong>endometrium</strong>, the inner mass differentiates as the <strong>embryo</strong>, uterine cells overgrow the blastocyst, and it embeds in the endometrium (Figure 2.11 step H) — this is <strong>implantation, leading to pregnancy</strong>."], "formulas": [{"label": "Fertilisation equation", "html": "sperm (n, 23) + ovum (n, 23) → zygote (2n, 46); secondary oocyte + sperm entry → ootid (n) + second polar body", "cond": "§2.5"}, {"label": "Sex determination", "html": "ovum always X; sperm 50% X / 50% Y → XX female, XY male (father decides)", "cond": "§2.5; Chapter 5 pointer"}, {"label": "Cleavage series", "html": "zygote → 2 → 4 → 8 → 16 blastomeres = morula (8–16) → blastocyst (trophoblast + inner cell mass) → implantation", "cond": "§2.5; Figure 2.11"}], "deeper": "Figure 2.11 is a transport map: read panels a–h as vagina → cervix → uterus → ampulla (fertilisation) → isthmus (cleavage) → uterus (morula → blastocyst) → step H embedding. Figure 2.10 shows the ovum ringed by sperms at the zona-block moment. This reprint gives no fertilisation-to-implantation day count in the body text — the standard ~week window used in the self-test is flagged as outside-text in COVERAGE.", "worked": "Worked chromosome check the book asks twice: spermatids carry 23, the ootid carries 23, so the zygote carries 46 — and an XX zygote develops female, XY male, depending only on whether the fertilising sperm brought X or Y.", "prediction": {"prompt": "Two sperms reach the zona together. What does §2.5 say happens?", "options": ["One fertilises; contact-induced membrane changes block the other", "Both fuse, making a triploid zygote", "The ovum waits for a third sperm"], "answer": 0, "explanation": "Zona contact induces changes blocking additional sperms, ensuring a single sperm fertilises the ovum (§2.5)."}, "connect": [["Why blame belongs to neither parent — scientifically to the sperm", "Exercise 19 applies this lesson directly: since ova are all X and X- vs Y-sperm decides XX vs XY, blaming the mother for daughters contradicts the chapter's own mechanism."], ["Wow — one cell, two destinies in a week", "The same ball of blastomeres splits fate: outer trophoblast becomes the attachment/placental side while the inner cell mass becomes the embryo itself — decided before embedding."]], "recall": "State the ampullary site with the simultaneity condition, the zona-block + acrosome + meiosis-II + fusion sequence, the XX/XY logic with the father-decides sentence, and the cleavage→morula→blastocyst→implantation chain with cell counts and layers.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Fertilisation in humans takes place in the", "options": ["Ampullary region of the fallopian tube", "Uterine endometrium", "Cervical canal"], "answer": 0, "hint": "Where the ovum is transported and sperms arrive (Figure 2.11b).", "solution": "The ampullary region, when both gametes arrive together.", "wrong": ["The endometrium is the implantation site, not the fusion site.", "The cervix is a passage, not the meeting point."]}, {"level": "Medium", "type": "number", "map": "§2.5 zygote", "prompt": "Chromosomes in the human zygote formed by two haploid (23) nuclei", "answer": 46, "unit": "chromosomes", "tolerance": 0.1, "hint": "23 + 23.", "solution": "Diploid zygote with 46 chromosomes."}, {"level": "Hard", "type": "mcq", "prompt": "The morula-to-blastocyst distinction in §2.5 is", "options": ["Morula: 8–16 blastomeres; blastocyst: trophoblast outside + inner cell mass inside, then implantation", "Morula: already implanted; blastocyst: still in the ovary", "Both terms mean the diploid zygote"], "answer": 0, "hint": "Count cells, then name layers (Figure 2.11e, g, H).", "solution": "8–16 cells is the morula; the layered travelling embryo is the blastocyst that embeds at step H.", "wrong": ["Implantation is the blastocyst step, not the morula step.", "The zygote precedes cleavage; these are later stages."]}], "resources": [{"title": "NCERT §2.5 — Fertilisation & implantation (official PDF, PDF p.10)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo102.pdf#page=10"}]}, {"id": "pregnancy-embryonic-development", "nav": "Pregnancy & embryo", "title": "Pregnancy and embryonic development: placenta, hormones and month milestones", "deck": "Trophoblast villi plus uterine tissue form the placenta (exchange + hCG/hPL/estrogens/progestogens, later ovarian relaxin) on an umbilical cord; ectoderm–mesoderm–endoderm with stem cells build the body on a 9-month clock: heart at 1 month, limbs at 2, systems by 12 weeks, movement/hair at 5, fine hair/eyelids/eyelashes by ~24 weeks.", "minutes": 9, "section": "2.6", "pages": [12, 13], "print": "12–13", "sim": "pregnancy", "simTitle": "Pregnancy timeline: month-by-month milestone explorer", "quick": ["After implantation, finger-like <strong>chorionic villi</strong> grow on the <strong>trophoblast</strong>, surrounded by uterine tissue and maternal blood; villi and uterine tissue interdigitated form the <strong>placenta</strong> (Figure 2.12), the structural and functional unit between foetus and mother. It supplies <strong>oxygen and nutrients</strong>, removes <strong>carbon dioxide and excretory/waste materials</strong>, and connects to the embryo by the <strong>umbilical cord</strong> that transports substances to and from the embryo.", "The placenta is also endocrine: it makes <strong>human chorionic gonadotropin (hCG), human placental lactogen (hPL), estrogens and progestogens</strong>; in the later phase the <strong>ovary secretes relaxin</strong> too. <strong>hCG, hPL and relaxin are produced in women only during pregnancy</strong>, while estrogens, progestogens, <strong>cortisol, prolactin, thyroxine</strong> and others rise several-fold in maternal blood — essential for <strong>fetal growth, maternal metabolic changes and maintenance of pregnancy</strong>.", "After implantation the <strong>inner cell mass (embryo)</strong> differentiates into outer <strong>ectoderm</strong> and inner <strong>endoderm</strong>, with <strong>mesoderm</strong> appearing between; these <strong>three layers give all adult tissues and organs</strong>. The inner mass holds <strong>stem cells</strong> with potency for all tissues and organs.", "Human pregnancy lasts <strong>9 months</strong>. After <strong>one month the embryo's heart is formed</strong> (first sign: heart sound via stethoscope); by the <strong>end of the second month limbs and digits</strong> develop; by <strong>12 weeks (first trimester) most major organ systems</strong> are formed with limbs and external genital organs well developed; <strong>first movements and head hair</strong> appear in the <strong>fifth month</strong>; by about <strong>24 weeks (end of second trimester) the body is covered with fine hair, eyelids separate and eyelashes form</strong>; by <strong>nine months the foetus is fully developed, ready for delivery</strong>. The book asks for dog/elephant/cat gestation periods as a find-out."], "formulas": [{"label": "Placenta dual role", "html": "exchange (O₂/nutrients in; CO₂/waste out) + endocrine (hCG, hPL, estrogens, progestogens; ovarian relaxin later)", "cond": "§2.6; Figure 2.12"}, {"label": "Pregnancy-only hormones", "html": "hCG + hPL + relaxin present only in pregnancy; estrogens/progestogens/cortisol/prolactin/thyroxine rise several-fold", "cond": "§2.6"}, {"label": "Milestone clock", "html": "1 mo heart → 2 mo limbs/digits → 12 wk systems → 5 mo movement/hair → ~24 wk fine hair + eyelids + eyelashes → 9 mo delivery-ready", "cond": "§2.6"}], "deeper": "Read Figure 2.12 as plumbing plus signalling: the umbilical cord is the transport line, the villi–uterine interdigitation is the exchange surface, and the hormone list is the control layer. The summary adds cortisol and estrogens to the parturition trigger (§2.7), so keep the §2.6 hormone roster intact for the pregnancy-maintenance role. This reprint's milestone list stops at the sentences above — finer week-by-week tables are outside-text (see COVERAGE).", "worked": "Worked ordering check: arrange four observations on the book's clock — heart sound (1 month), digits (2 months), head hair with first movements (5th month), separated eyelids with eyelashes (about 24 weeks). Any option placing eyelashes before the heart, or delivery-readiness before 9 months, contradicts §2.6.", "prediction": {"prompt": "Maternal blood shows hCG and hPL. What does §2.6 conclude, and why?", "options": ["Pregnancy — both are produced in women only during pregnancy", "Menstruation — both trigger endometrial shedding", "Menopause — both mark cycle cessation at ~50"], "answer": 0, "explanation": "hCG, hPL and relaxin are produced in women only during pregnancy; their presence is a pregnancy signal (§2.6)."}, "connect": [["The stethoscope's first hello", "The book's first fetal sign is auscultation: a careful stethoscope on the mother's abdomen catching the one-month heart — the earliest clinical greeting in any Indian antenatal clinic."], ["Wow — three layers build everything", "Ectoderm, mesoderm and endoderm — three sheets from the inner cell mass, plus resident stem cells — are credited with every adult tissue and organ that follows."]], "recall": "List placenta structure plus exchange and full hormone rosters (with the pregnancy-only trio), the cord's role, the three germ layers with stem-cell potency, and the six milestone timestamps in order.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "Which hormones does §2.6 say are produced in women only during pregnancy?", "options": ["hCG, hPL and relaxin", "FSH, LH and GnRH", "Thyroxine, cortisol and prolactin alone"], "answer": 0, "hint": "Placental pair plus later ovarian one.", "solution": "hCG and hPL (placenta) with relaxin (ovary, later phase) are pregnancy-only.", "wrong": ["GnRH/FSH/LH run gametogenesis and cycles, not pregnancy-only.", "Thyroxine/cortisol/prolactin rise in pregnancy but are not exclusive to it."]}, {"level": "Medium", "type": "number", "map": "§2.6 milestones", "prompt": "Weeks by which the body is covered with fine hair, eyelids separate and eyelashes form", "answer": 24, "unit": "weeks", "tolerance": 1, "hint": "End of the second trimester.", "solution": "About 24 weeks (end of second trimester)."}, {"level": "Hard", "type": "mcq", "prompt": "After implantation the inner cell mass gives", "options": ["Ectoderm outside, endoderm inside, mesoderm between — all adult tissues, with potent stem cells", "Trophoblast outside and placenta directly", "Only the umbilical cord"], "answer": 0, "hint": "Three layers from the embryo proper.", "solution": "Ectoderm, mesoderm and endoderm yield all tissues; stem cells retain full potency.", "wrong": ["Trophoblast is the outer blastocyst layer, not the inner mass product.", "The cord connects embryo to placenta; it is not the germ-layer set."]}], "resources": [{"title": "NCERT §2.6 — Pregnancy & embryo (official PDF, PDF p.12)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo102.pdf#page=12"}]}, {"id": "parturition-lactation", "nav": "Parturition & lactation", "title": "Parturition and lactation: foetal ejection reflex, oxytocin and colostrum", "deck": "Nine-month gestation ends when foetal–placental signals start mild contractions (foetal ejection reflex), pituitary oxytocin strengthens them in a positive reflex to birth-canal delivery with placental expulsion; late-pregnancy mammary differentiation yields antibody-rich colostrum first.", "minutes": 8, "section": "2.7", "pages": [13, 14], "print": "13–14", "sim": "parturition", "simTitle": "Parturition and lactation: hormone cascade and first milk", "quick": ["Average human pregnancy (<strong>gestation</strong>) lasts about <strong>9 months</strong>; vigorous uterine contraction at the end expels the foetus, and this childbirth is <strong>parturition</strong>. It is induced by a <strong>complex neuroendocrine mechanism</strong>: signals from the <strong>fully developed foetus and the placenta</strong> induce mild uterine contractions called the <strong>foetal ejection reflex</strong>.", "The reflex triggers <strong>oxytocin release from the maternal pituitary</strong>; oxytocin acts on uterine muscle causing <strong>stronger contractions</strong>, which stimulate <strong>further oxytocin secretion</strong>. This <strong>stimulatory reflex between contraction and oxytocin</strong> keeps strengthening until the baby is expelled through the <strong>birth canal</strong>; soon after, the <strong>placenta is also expelled</strong>. The summary names <strong>cortisol, estrogens and oxytocin</strong> in this trigger, and the text asks what doctors inject to induce delivery.", "The female <strong>mammary glands differentiate during pregnancy</strong> and produce milk toward the end by <strong>lactation</strong>, feeding the newborn. The first few days' milk is <strong>colostrum, containing several antibodies absolutely essential for newborn resistance</strong>; doctors recommend <strong>breast-feeding in the initial period</strong> for a healthy baby."], "formulas": [{"label": "Parturition reflex", "html": "foetus + placenta signals → foetal ejection reflex → oxytocin (maternal pituitary) → stronger contractions → more oxytocin → delivery + placental expulsion", "cond": "§2.7; summary adds cortisol, estrogens"}, {"label": "Gestation", "html": "average human gestation ≈ 9 months → parturition", "cond": "§2.7"}, {"label": "First milk", "html": "late-pregnancy differentiation → lactation; colostrum (first days) = antibody-rich → breast-feed initially", "cond": "§2.7"}], "deeper": "Cause-and-effect chain to memorise: fully developed foetus + placenta (signal source) → mild contractions (foetal ejection reflex) → maternal pituitary oxytocin → uterine muscle → stronger contractions → more oxytocin (positive feedback) → birth-canal expulsion → placental expulsion. Lactation is placed in the same section because mammary differentiation completes in late pregnancy and expression follows birth.", "worked": "Worked mechanism check: cut the reflex at any link and predict the book's outcome — no foetal/placental signal gives no mild contractions; no pituitary oxytocin gives no strengthening; no positive feedback gives stalled labour; no placental expulsion leaves the afterbirth inside. The chapter's injection question points at the oxytocin link.", "prediction": {"prompt": "Oxytocin action on the uterus is blocked at term. What does §2.7 predict?", "options": ["Contractions fail to strengthen, stalling the reflex that drives parturition", "Ovulation restarts immediately", "Milk is produced before differentiation"], "answer": 0, "explanation": "Oxytocin drives stronger contractions which feed back into more oxytocin; blocking it breaks the parturition reflex (§2.7)."}, "connect": [["The injection question in labour rooms", "When Indian obstetric protocols induce or augment labour, they act on the chapter's own question — what do doctors inject to induce delivery — at the oxytocin link of the foetal ejection reflex."], ["Wow — milk as first immunisation", "Before any syringe, colostrum delivers several antibodies in the first feeds — the book calls them absolutely essential for newborn resistance, and doctors prescribe breast-feeding from the start."]], "recall": "Define gestation length and parturition, run the full foetal-ejection→oxytocin→contraction reflex to placental expulsion (with the summary's cortisol/estrogen names), and state colostrum's content plus the breast-feeding recommendation.", "quizzes": [{"level": "Easy", "type": "mcq", "prompt": "The foetal ejection reflex is", "options": ["Mild uterine contractions induced by foetal + placental signals, triggering maternal oxytocin", "Release of the ovum from the Graafian follicle", "Blocking of polyspermy at the zona pellucida"], "answer": 0, "hint": "Signals for parturition originate from foetus and placenta.", "solution": "Foetal/placental signals start mild contractions that trigger pituitary oxytocin (§2.7).", "wrong": ["That is ovulation (§2.3–2.4).", "That is the fertilisation zona block (§2.5)."]}, {"level": "Medium", "type": "number", "map": "§2.7 gestation", "prompt": "Average duration of human pregnancy (gestation)", "answer": 9, "unit": "months", "tolerance": 0.5, "hint": "About three trimesters.", "solution": "About 9 months of gestation before parturition."}, {"level": "Hard", "type": "mcq", "prompt": "Colostrum, in §2.7, is", "options": ["First-days milk with several antibodies essential for newborn resistance; breast-feed initially", "A pituitary hormone that contracts the uterus", "The fluid filling the Graafian antrum"], "answer": 0, "hint": "Initial lactation product, not a hormone or follicle fluid.", "solution": "Colostrum is antibody-rich first milk; early breast-feeding is recommended.", "wrong": ["The uterine contractor is oxytocin.", "Antrum fluid belongs to the tertiary/Graafian follicle (§2.3)."]}], "resources": [{"title": "NCERT §2.7 — Parturition & lactation (official PDF, PDF p.13)", "provider": "ncert.nic.in", "url": "https://ncert.nic.in/textbook/pdf/lebo102.pdf#page=13"}]}], "exercises": [{"number": 1, "conceptIdx": 4, "page": 14, "printPage": null, "question": "Fill in the blanks: (a) Humans reproduce _____________ (asexually/sexually) (b) Humans are _____________ (oviparous, viviparous, ovoviviparous) (c) Fertilisation is _____________ in humans (external/internal) (d) Male and female gametes are _____________ (diploid/haploid) (e) Zygote is _____________ (diploid/haploid) (f) The process of release of ovum from a mature follicle is called _____________ (g) Ovulation is induced by a hormone called _____________ (h) The fusion of male and female gametes is called _____________ (i) Fertilisation takes place in _____________ (j) Zygote divides to form _____________ which is implanted in uterus. (k) The structure which provides vascular connection between foetus and uterus is called _____________", "steps": ["(a) Humans are sexually reproducing (chapter opener: sperms in males, ova in females, fertilisation to zygote).", "(b) Humans are viviparous (opener: viviparous; embryo develops inside, delivered as baby).", "(c) Fertilisation is internal (insemination into vagina; fusion in the ampullary tube).", "(d) Gametes are haploid (sperm 23, ootid 23).", "(e) Zygote is diploid (23 + 23 = 46).", "(f) Release of the secondary oocyte from the Graafian follicle is ovulation (§2.3).", "(g) Ovulation is induced by LH — the LH surge about day 14 (§2.4).", "(h) Fusion of male and female gametes is fertilisation (§2.5).", "(i) Fertilisation takes place in the ampullary region of the fallopian tube (§2.5).", "(j) The zygote cleaves to the blastocyst (morula → blastocyst), which is implanted (§2.5).", "(k) The vascular foetus–uterus connection is the placenta (chorionic villi + uterine tissue, §2.6)."], "answer": "(a) sexually; (b) viviparous; (c) internal; (d) haploid; (e) diploid; (f) ovulation; (g) LH (LH surge); (h) fertilisation; (i) ampullary region of the fallopian tube; (j) blastocyst; (k) placenta."}, {"number": 2, "conceptIdx": 0, "page": 15, "printPage": null, "question": "Draw a labelled diagram of male reproductive system.", "steps": ["Place the system in the pelvis (Figure 2.1a): pair of testes in the scrotum, accessory ducts, accessory glands, penis.", "Show one testis opened (Figure 2.1b): ~250 lobules, seminiferous tubules → rete testis → vasa efferentia → epididymis (posterior surface) → vas deferens looping over the urinary bladder, joined by the seminal-vesicle duct as the ejaculatory duct into the urethra.", "Add glands (paired seminal vesicles, prostate, paired bulbourethral) and penis with glans/foreskin ending at the urethral meatus; label scrotum cooling 2–2.5°C. (Offline build: answered descriptively; no image upload.)"], "answer": "Pelvis layout per Figures 2.1a–b with testes/scro­tum, rete → vasa efferentia → epididymis → vas deferens → ejaculatory duct → urethra, three accessory glands, penis to meatus."}, {"number": 3, "conceptIdx": 1, "page": 15, "printPage": null, "question": "Draw a labelled diagram of female reproductive system.", "steps": ["Place ovaries (2–4 cm, ligaments), oviducts, uterus, cervix, vagina and external genitalia in the pelvis (Figure 2.3a).", "In section (Figure 2.3b): ovary with stroma (cortex/medulla); tube as infundibulum with fimbriae → ampulla → isthmus → uterus (inverted pear); cervix with cervical canal; cervical canal + vagina as birth canal; uterine wall perimetrium/myometrium/endometrium.", "Add external genitalia (mons pubis, labia majora/minora, hymen, clitoris) and mammary-gland inset (Figure 2.4) if required. (Offline build: answered descriptively; no image upload.)"], "answer": "Pelvis layout per Figures 2.3a–b with ovary, fimbriae → ampulla → isthmus → three-layered uterus, cervix/birth canal, external genitalia and mammary inset."}, {"number": 4, "conceptIdx": 0, "page": 15, "printPage": null, "question": "Write two major functions each of testis and ovary.", "steps": ["Testis (primary male sex organ, §2.1 + §2.3): seminiferous tubules produce sperms by spermatogenesis (meiotic germ cells, Sertoli nursing).", "Testis endocrine: interstitial (Leydig) cells synthesise and secrete androgens.", "Ovary (primary female sex organ, §2.2 + §2.3): produces the female gamete (ovum) via oogenesis/follicle maturation to Graafian rupture.", "Ovary endocrine: produces several steroid (ovarian) hormones; later-phase relaxin is also ovarian (§2.6)."], "answer": "Testis: (1) sperm production in seminiferous tubules; (2) androgen secretion by Leydig cells. Ovary: (1) ovum production; (2) steroid/ovarian hormone secretion."}, {"number": 5, "conceptIdx": 0, "page": 15, "printPage": null, "question": "Describe the structure of a seminiferous tubule.", "steps": ["Each testicular lobule holds 1–3 highly coiled seminiferous tubules — the sperm-forming chambers (Figure 2.2).", "Inside lining: male germ cells (spermatogonia) that divide meiotically to sperm, and Sertoli cells that nourish germ cells; sperm heads embed in Sertoli before spermiation.", "Outside: interstitial spaces with small blood vessels and Leydig cells secreting androgens, plus immunologically competent cells."], "answer": "Coiled tubule lined by spermatogonia + Sertoli (nutrition/embedding), surrounded by interstitial Leydig (androgens), vessels and immune cells — Figure 2.2."}, {"number": 6, "conceptIdx": 2, "page": 15, "printPage": null, "question": "What is spermatogenesis? Briefly describe the process of spermatogenesis.", "steps": ["Spermatogenesis is sperm production from immature male germ cells (spermatogonia) in the seminiferous tubules, beginning at puberty (§2.3).", "Spermatogonia (diploid, 46) multiply mitotically; some become primary spermatocytes and undergo meiosis I (reduction) into 2 equal haploid secondary spermatocytes (23 each).", "Meiosis II gives 4 equal haploid spermatids (23); spermiogenesis transforms them into spermatozoa, and spermiation releases them from Sertoli embedding (Figure 2.5)."], "answer": "Mitotic spermatogonia (46) → primary spermatocyte → meiosis I → 2 secondary spermatocytes (23) → meiosis II → 4 spermatids (23) → spermiogenesis → spermiation."}, {"number": 7, "conceptIdx": 2, "page": 15, "printPage": null, "question": "Name the hormones involved in regulation of spermatogenesis.", "steps": ["Puberty rise in GnRH (hypothalamic hormone) acts on the anterior pituitary.", "Pituitary releases two gonadotropins: LH and FSH.", "LH acts on Leydig cells → androgens → stimulate spermatogenesis; FSH acts on Sertoli cells → factors aiding spermiogenesis."], "answer": "GnRH (hypothalamus) → LH + FSH (anterior pituitary); LH → Leydig → androgens; FSH → Sertoli → spermiogenesis factors."}, {"number": 8, "conceptIdx": 2, "page": 15, "printPage": null, "question": "Define spermiogenesis and spermiation.", "steps": ["Spermiogenesis: transformation of the haploid spermatids into spermatozoa (sperms) — head/neck/middle piece/tail differentiation.", "Spermiation: after spermiogenesis, sperm heads embedded in Sertoli cells are finally released from the seminiferous tubules.", "Order: spermatids → (spermiogenesis) → spermatozoa → (spermiation) → free in tubule lumen for duct transport."], "answer": "Spermiogenesis = spermatids transformed into sperms; spermiation = release of Sertoli-embedded sperms from the tubules."}, {"number": 9, "conceptIdx": 2, "page": 15, "printPage": null, "question": "Draw a labelled diagram of sperm.", "steps": ["Microscopic body under one plasma membrane with head, neck, middle piece and tail (Figure 2.6).", "Head: elongated haploid nucleus with anterior cap-like acrosome filled with fertilisation enzymes.", "Middle piece: numerous mitochondria energising tail motility essential for fertilisation. (Offline build: answered descriptively; no image upload.)"], "answer": "Head (haploid nucleus + enzyme acrosome), neck, mitochondria-packed middle piece, motile tail — Figure 2.6."}, {"number": 10, "conceptIdx": 0, "page": 15, "printPage": null, "question": "What are the major components of seminal plasma?", "steps": ["Seminal plasma is the secretion of the male accessory glands: paired seminal vesicles, prostate and paired bulbourethral glands.", "It is rich in fructose, calcium and certain enzymes (text list).", "Bulbourethral contribution also lubricates the penis; plasma plus sperms constitutes semen, with duct/gland function maintained by androgens."], "answer": "Fructose, calcium and certain enzymes from seminal vesicles/prostate/bulbourethral glands; with sperms this is semen."}, {"number": 11, "conceptIdx": 0, "page": 15, "printPage": null, "question": "What are the major functions of male accessory ducts and glands?", "steps": ["Ducts (rete testis, vasa efferentia, epididymis, vas deferens to ejaculatory duct/urethra): store and transport sperms from testis to outside.", "Gland/duct secretions (epididymis, vas deferens, seminal vesicle, prostate): essential for sperm maturation and motility.", "Glands add seminal plasma (fructose/calcium/enzymes; bulbourethral lubrication) forming semen; all maintained by testicular androgens."], "answer": "Store + transport sperms; mature them and add fructose/calcium/enzyme-rich plasma (semen) under androgen maintenance."}, {"number": 12, "conceptIdx": 2, "page": 15, "printPage": null, "question": "What is oogenesis? Give a brief account of oogenesis.", "steps": ["Oogenesis is formation of the mature female gamete, markedly different from spermatogenesis; it begins in embryonic development with a couple of million oogonia per fetal ovary, none added after birth.", "Oogonia enter prophase-I and arrest as primary oocytes in primary follicles (granulosa-wrapped); most degenerate, leaving 60,000–80,000 per ovary at puberty.", "Primary → secondary follicles (more granulosa + theca) → tertiary follicle (antrum; theca interna/externa); there the primary oocyte completes unequal meiosis I into a large haploid secondary oocyte + tiny first polar body; the Graafian follicle forms a zona pellucida and ruptures at ovulation (Figures 2.7–2.8)."], "answer": "Foetal oogonia → arrested primary oocytes → puberty follicle growth → tertiary antrum follicle → unequal meiosis I → secondary oocyte + first polar body → Graafian rupture (ovulation)."}, {"number": 13, "conceptIdx": 1, "page": 15, "printPage": null, "question": "Draw a labelled diagram of a section through ovary.", "steps": ["Show thin epithelium enclosing stroma with peripheral cortex and inner medulla (§2.2).", "Embed follicles at stages (Figure 2.7): primary follicle (primary oocyte + granulosa), secondary (more layers + theca), tertiary (antrum; theca interna/externa), mature Graafian (secondary oocyte + zona pellucida), plus corpus luteum remnant.", "Mark ligaments to pelvic wall/uterus and 2–4 cm scale. (Offline build: answered descriptively; no image upload.)"], "answer": "Epithelium → cortex/medulla stroma with primary → secondary → tertiary (antrum) → Graafian series and corpus luteum — Figure 2.7."}, {"number": 14, "conceptIdx": 2, "page": 15, "printPage": null, "question": "Draw a labelled diagram of a Graafian follicle?", "steps": ["Mature follicle with outer theca externa and inner theca interna, granulosa layers and fluid antrum.", "Show the large secondary oocyte (haploid, nutrient-rich cytoplasm) with surrounding zona pellucida plus tiny first polar body from unequal meiosis I.", "Indicate imminent rupture releasing the oocyte at ovulation (Figure 2.7). (Offline build: answered descriptively; no image upload.)"], "answer": "Theca externa/interna, granulosa, antrum, secondary oocyte + zona pellucida with first polar body — mature pre-ovulation follicle."}, {"number": 15, "conceptIdx": 3, "page": 15, "printPage": null, "question": "Name the functions of the following: (a) Corpus luteum (b) Endometrium (c) Acrosome (d) Sperm tail (e) Fimbriae", "steps": ["(a) Corpus luteum (luteal Graafian remnant): secretes large progesterone maintaining the endometrium for implantation/pregnancy; degenerates without fertilisation.", "(b) Endometrium (inner glandular uterine lining): cycles monthly (breakdown = menstrual flow; proliferation/maintenance for implantation).", "(c) Acrosome (anterior sperm-head cap): enzyme-filled; secretions help the sperm enter the ovum through zona pellucida and plasma membrane.", "(d) Sperm tail: motility — mitochondrial energy from the middle piece drives swimming through cervix/uterus to the ampulla.", "(e) Fimbriae (infundibulum fingers): collect the ovulated ovum into the oviduct."], "answer": "(a) Progesterone maintenance of endometrium; (b) cyclical lining/implantation bed; (c) enzymatic entry at fertilisation; (d) motility; (e) ovum collection."}, {"number": 16, "conceptIdx": 2, "page": 15, "printPage": null, "question": "Identify True/False statements. Correct each false statement to make it true. (a) Androgens are produced by Sertoli cells. (True/False) (b) Spermatozoa get nutrition from Sertoli cells. (True/False) (c) Leydig cells are found in ovary. (True/False) (d) Leydig cells synthesise androgens. (True/False) (e) Oogenesis takes place in corpus luteum. (True/False) (f) Menstrual cycle ceases during pregnancy. (True/False) (g) Presence or absence of hymen is not a reliable indicator of virginity or sexual experience. (True/False)", "steps": ["(a) False — androgens are synthesised and secreted by Leydig (interstitial) cells; Sertoli cells nourish germ cells.", "(b) True — Sertoli cells provide nutrition to the germ cells/spermatozoa.", "(c) False — Leydig cells are in the testicular interstitial spaces; the ovary has follicles/corpus luteum, not Leydig cells.", "(d) True — Leydig cells synthesise and secrete androgens.", "(e) False — oogenesis (oogonia → follicles → Graafian) takes place in the ovary/follicles, not in the corpus luteum (which secretes progesterone).", "(f) True — during pregnancy all menstrual-cycle events stop and there is no menstruation.", "(g) True — verbatim §2.2: hymen status is not a reliable indicator of virginity or sexual experience."], "answer": "(a) False (Leydig make androgens); (b) True; (c) False (Leydig in testis); (d) True; (e) False (ovary/follicles); (f) True; (g) True."}, {"number": 17, "conceptIdx": 3, "page": 15, "printPage": null, "question": "What is menstrual cycle? Which hormones regulate menstrual cycle?", "steps": ["Menstrual cycle is the ~28/29-day reproductive cycle of female primates (monkeys, apes, humans) from one menstruation to the next, with mid-cycle ovulation; first occurrence at puberty is menarche, cessation ~50 is menopause.", "Phases: menstrual (3–5-day endometrial breakdown flow) → follicular (Graafian growth + endometrial proliferation) → ovulation (LH surge ~day 14) → luteal (corpus luteum + progesterone maintenance).", "Regulators: pituitary gonadotropins LH and FSH plus ovarian hormones — estrogens (growing follicles) and progesterone (corpus luteum) — per Figure 2.9."], "answer": "28/29-day cycle (menarche→menopause); regulated by LH + FSH (pituitary) and estrogens + progesterone (ovarian)."}, {"number": 18, "conceptIdx": 6, "page": 15, "printPage": null, "question": "What is parturition? Which hormones are involved in induction of parturition?", "steps": ["Parturition is delivery/expulsion of the foetus (childbirth) at the end of ~9-month gestation by vigorous uterine contractions.", "Signals from the fully developed foetus and placenta start mild contractions (foetal ejection reflex) → maternal pituitary oxytocin → stronger contractions → more oxytocin (positive reflex) → birth-canal delivery + placental expulsion.", "Hormones: oxytocin (maternal pituitary, central) with cortisol and estrogens in the trigger (summary), plus late-pregnancy ovarian relaxin in the background roster."], "answer": "Childbirth by the foetal-ejection → oxytocin reflex; oxytocin leads, with cortisol and estrogens (summary) involved."}, {"number": 19, "conceptIdx": 4, "page": 15, "printPage": null, "question": "In our society the women are often blamed for giving birth to daughters. Can you explain why this is not correct?", "steps": ["Female chromosome pattern is XX, so every ovum carries X; male pattern is XY, so 50% of sperms carry X and 50% carry Y (§2.5).", "XX zygotes (X-sperm) develop female, XY zygotes (Y-sperm) develop male; the fertilising sperm decides.", "Hence scientifically the sex of the baby is determined by the father, not the mother — blaming women is biologically wrong."], "answer": "All ova are X; X- vs Y-sperm decides XX/XY — sex is determined by the father, not the mother."}, {"number": 20, "conceptIdx": 3, "page": 15, "printPage": null, "question": "How many eggs are released by a human ovary in a month? How many eggs do you think would have been released if the mother gave birth to identical twins? Would your answer change if the twins born were fraternal?", "steps": ["Normally one ovum is released (ovulation) during the middle of each menstrual cycle (§2.4).", "Identical (monozygotic) twins come from one zygote splitting — still one egg released and fertilised.", "Fraternal (dizygotic) twins come from two separately fertilised ova — two eggs released. So the answer changes for fraternal twins."], "answer": "One egg per month; identical twins = one egg (one zygote splits); fraternal = two eggs — yes, it changes."}, {"number": 21, "conceptIdx": 3, "page": 15, "printPage": null, "question": "How many eggs do you think were released by the ovary of a female dog which gave birth to 6 puppies?", "steps": ["Each puppy comes from a separately fertilised ovum (one zygote per pup) — unlike identical twinning from a single zygote.", "Six puppies therefore imply six ova released and fertilised (polyovulation, normal in dogs).", "Contrast: a human month normally releases one ovum (§2.4); the dog released about six in that cycle."], "answer": "About six eggs — one per puppy (separate fertilisations)."}], "pageOffset": null, "printPageStart": null, "printPageEnd": null, "paginationProvenance": "folio-absent-in-source"};
</script>
<script>
(function(){
  var C = window.CHAPTER;
  if (!C) {
    console.error("No CHAPTER data object found on window.");
    return;
  }

  var state = {
    conceptIndex: 0,
    level: 0,
    answers: {},
    correct: {},
    t: 0,
    maxT: 6,
    playing: false,
    rafId: null,
    stepMode: false,
    speed: 1.0,
    simState: {}
  };

  var STORAGE_KEY = (C.code || "chapter") + "_learner_progress_v2";

  function initStorage(){
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if(saved){
        var d = JSON.parse(saved);
        if(d && d.answers) state.answers = d.answers;
        if(d && d.correct) state.correct = d.correct;
      }
    } catch(e){}
  }

  function saveStorage(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        answers: state.answers,
        correct: state.correct
      }));
    } catch(e){}
  }

  function updateProgress(){
    var count = Object.keys(state.correct).length;
    var totalLessons = (C.lessons && C.lessons.length) ? C.lessons.length : (C.concepts ? C.concepts.length : 6);
    var total = totalLessons * 3;
    var bar = document.getElementById("progress-bar");
    var txt = document.getElementById("progress-text");
    if(bar) bar.value = count;
    if(txt) txt.textContent = count + " / " + total;
    saveStorage();
  }

  function qKey(cIdx, lvl){
    return cIdx + "_" + lvl;
  }

  // --- Legacy Animation Loop for window.SIMS ---
  var lastTs = 0;
  function animLoop(ts){
    if(!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if(dt > 0.1) dt = 0.1;

    if(state.playing){
      state.t += dt * state.speed;
      if(state.t >= state.maxT){
        state.t = state.maxT;
        state.playing = false;
        updatePlayBtn();
      }
      syncTimelineUI();
      renderActiveFrame(state.t);
    }
    if(state.playing){
      state.rafId = requestAnimationFrame(animLoop);
    }
  }

  function play(){
    if(state.t >= state.maxT) state.t = 0;
    state.playing = true;
    lastTs = 0;
    updatePlayBtn();
    state.rafId = requestAnimationFrame(animLoop);
  }

  function pause(){
    state.playing = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = null;
    updatePlayBtn();
  }

  function step(delta){
    pause();
    state.t = Math.max(0, Math.min(state.maxT, state.t + delta));
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function resetTimeline(){
    pause();
    state.t = 0;
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function seekTimeline(val){
    pause();
    state.t = Number(val);
    syncTimelineUI();
    renderActiveFrame(state.t);
  }

  function updatePlayBtn(){
    var btn = document.getElementById("btn-play-pause");
    if(btn){
      btn.innerHTML = state.playing ? "⏸ Pause" : "▶ Play";
      btn.setAttribute("aria-label", state.playing ? "Pause animation" : "Play animation");
    }
  }

  function syncTimelineUI(){
    var scrubber = document.getElementById("time-scrubber");
    var disp = document.getElementById("time-display");
    if(scrubber) scrubber.value = state.t;
    if(disp) disp.innerHTML = "t = <b>" + state.t.toFixed(1) + " s</b>";
  }

  function renderActiveFrame(t){
    if(!C.lessons) return;
    var l = C.lessons[state.conceptIndex];
    if(l && window.SIMS && l.sim && window.SIMS[l.sim] && typeof window.SIMS[l.sim].draw === 'function'){
      window.SIMS[l.sim].draw(t);
    }
  }

  // --- Render Concept View ---
  function renderConcept(idx){
    pause();
    state.conceptIndex = idx;
    state.t = 0;
    state.level = 0;

    var lessons = C.lessons || C.concepts || [];
    var l = lessons[idx];
    if(!l) return;

    var navTitle = l.nav || l.navTitle || l.title || ("Concept " + (idx + 1));

    // Update sidebar navigation active state
    var navBtns = document.querySelectorAll(".concept-nav");
    navBtns.forEach(function(b, i){
      if(b.id === "nav-revision") b.classList.remove("active");
      else b.classList.toggle("active", i === idx);
    });

    // Update top crumb
    var rawNum = C.chapterNumber || (C.chapter_meta && C.chapter_meta.number) || (C.code ? C.code.replace(/\D/g, '') : "01");
    var chNum = (!isNaN(parseInt(rawNum))) ? String(rawNum).padStart(2, '0') : rawNum;
    var crumb = document.getElementById("chapter-crumb");
    if(crumb) crumb.textContent = "CH " + chNum + " · " + navTitle.toUpperCase();

    // Show concept view, hide revision
    var cView = document.getElementById("concept-view");

    var html = "";

     var printedPages = l.printPages ? ' · printed pp. ' + l.printPages : ' · printed folio absent in source';
     var printPage = l.print || (l.pages ? (Array.isArray(l.pages) ? l.pages.join("–") : l.pages) : (C.page_start ? "pp. " + C.page_start + "–" + C.page_end : ""));

      '<h1 class="concept-title">' + (l.title || navTitle) + '</h1>' +
      '<p class="concept-deck">' + (l.deck || l.summary || "") + '</p>' +

    // 01 LEARN BLOCK
    html += '<section class="learn-section" data-block="learn" aria-label="Learn Concept">' +
      '<span class="block-tag">01 · LEARN · CORE ESSENTIALS</span>';

    var quickItems = [];
    if(Array.isArray(l.quick)) {
      quickItems = l.quick;
    } else if(typeof l.quick === 'string' && l.quick) {
      quickItems = [l.quick];
    } else if(Array.isArray(l.summary)) {
      quickItems = l.summary;
    } else if(l.reading_content) {
      quickItems = [l.reading_content];
    } else if(l.summary || l.deck) {
      quickItems = [l.summary || l.deck];
    }

    html += '<div class="quick-summary">' + quickItems.map(function(p){
      if(typeof p !== 'string') return '';
      if(p.includes('<p>') || p.includes('<div>') || p.includes('<h3>')) return p;
      var formatted = p.replace(/###\s+(.*?)\n/g, '<h3 style="margin-top:16px;color:var(--ink);">$1</h3>')
                       .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                       .replace(/\*(.*?)\*/g, '<em>$1</em>')
                       .replace(/\n\n/g, '</p><p>');
      return '<p>' + formatted + '</p>';
    }).join("") + '</div>';

    // Semantic Equations Card
    var formulas = l.formulas || [];
    if(formulas.length){
      html += '<div class="key-equations-card">' +
        '<div class="equations-heading">Key Relations for this Concept</div>' +
        '<div class="eq-grid">' +
        formulas.map(function(eq){
          var label = eq.label || eq.name || "Relation";
          var cond = eq.cond || "";
          var math = eq.html || eq.formula || "";
          return '<div class="eq-row">' +
            '<div class="eq-meta"><span class="eq-label">' + label + '</span>' + (cond ? '<span class="eq-cond">' + cond + '</span>' : '') + '</div>' +
            '<div class="eq-math">' + math + '</div>' +
            '</div>';
        }).join("") +
        '</div></div>';
    }

    // Deeper dive / core takeaways
    if(l.deeper){
      html += '<details class="deep-dive"><summary>Go deeper into the conceptual foundation</summary><p>' + l.deeper + '</p></details>';
    } else if(l.takeaways && l.takeaways.length){
      html += '<details class="deep-dive"><summary>Key Conceptual Takeaways</summary><ul>' +
        l.takeaways.map(function(t){ return '<li>' + t + '</li>'; }).join("") +
        '</ul></details>';
    }

    // Worked Example
    var worked = l.worked || l.worked_example;
    if(worked){
      var workedHtml = typeof worked === 'object' && worked !== null
        ? '<strong>' + (worked.title || 'Worked Example') + '</strong><br>' + (worked.problem || '') +
          (worked.given ? '<br><br><strong>Given:</strong> ' + worked.given : '') +
          (worked.steps ? '<br><strong>Steps:</strong><br>' + worked.steps.map(function(s){ return '&bull; ' + s; }).join('<br>') : '') +
          (worked.solution ? '<br><br><strong>Solution:</strong> ' + worked.solution : '') +
          (worked.answer ? '<br><br><strong>Answer:</strong> ' + worked.answer : '')
        : String(worked);
      html += '<details class="deep-dive"><summary>Worked textbook example step by step</summary><p>' + workedHtml + '</p></details>';
    }

    html += '</section>';

    // 02 PREDICT FIRST BLOCK
    var pred = l.prediction || l.predict || l.predict_first;
    if(pred && typeof pred === 'object' && (pred.prompt || pred.scenario) && pred.options && pred.options.length){
      var promptText = pred.prompt || pred.scenario || "";
      html += '<section class="predict-card" data-block="predict" aria-label="Predict First">' +
        '<div class="predict-badge">02 · PREDICT FIRST · TEST YOUR INTUITION</div>' +
        '<div class="predict-prompt">' + promptText.replace(/\n/g, '<br>') + '</div>' +
        '<div class="predict-options" id="predict-options">' +
        pred.options.map(function(opt, oi){
          return '<label class="predict-option"><input type="radio" name="predict_ans" value="' + oi + '"><span>' + opt + '</span></label>';
        }).join("") +
        '</div>' +
        '<div class="predict-actions">' +
        '<button class="btn-primary" id="btn-check-prediction">Check Prediction</button>' +
        '<button class="btn-secondary" id="btn-skip-prediction">Skip to Lab</button>' +
        '</div>' +
        '<div id="predict-feedback-box" class="predict-feedback" style="display:none;"></div>' +
        '</section>';
    }

    // 03 PLAY / LAB BLOCK
    var simTitle = (l.simTitle || navTitle || "Interactive Simulation").toUpperCase();
    var whatWatch = (pred && pred.prompt) ? pred.prompt : (typeof l.predict === 'string' ? l.predict : "Explore the interactive simulation controls, parameters, and readouts below.");
    html += '<section class="lab-card" data-block="play" aria-label="Interactive Laboratory">' +
      '<div class="lab-header"><span class="lab-title">03 · PLAY · ' + simTitle + '</span><span class="live-tag">INTERACTIVE SIMULATION</span></div>' +
      '<div class="what-to-watch" id="what-to-watch"><strong>What to watch:</strong> ' + whatWatch + '</div>' +
      '<div id="sim-mount-point" class="sim-mount-container" style="width:100%;min-height:220px;margin-top:12px;">' +
        '<div class="diagram-wrap"><svg id="diagram" class="diagram" viewBox="0 0 720 300" role="img" aria-label="' + simTitle + '"></svg></div>' +
        '<div class="lab-legend" id="lab-legend"></div>' +
        '<div class="lab-toolbar" id="legacy-lab-toolbar">' +
          '<button class="toolbar-btn primary" id="btn-play-pause" aria-label="Play animation">▶ Play</button>' +
          '<button class="toolbar-btn" id="btn-step-fwd" aria-label="Step forward">⏭ Step (+0.5s)</button>' +
          '<button class="toolbar-btn" id="btn-reset-time" aria-label="Reset timeline">↺ Reset</button>' +
          '<span class="time-display" id="time-display">t = <b>0.0 s</b></span>' +

            '<input type="range" id="time-scrubber" class="timeline-scrubber" min="0" max="6" step="0.1" value="0" aria-label="Timeline time scrubber">' +

        '<div class="lab-controls-grid" id="lab-controls"></div>' +
        '<div class="lab-readout" id="lab-readout" role="status" aria-live="polite"></div>' +
        '<div class="lab-verdict" id="lab-verdict" role="status" aria-live="polite"></div>' +
